# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; how amendments are published today; what Amendment A and its
# implementing law would change; what the pamphlet's analysis says it
# saves, and what the savings depend on; one point per side; what a vote
# does.
#
# The card quotes the Voter Information Pamphlet: the ballot title, the
# Impartial Analysis's "Effect of Constitutional Amendment A" and its
# "Fiscal Effects". Utah's pamphlet prints no "a YES vote means" lines,
# so the card has none, and the vote lines take their two meanings from
# one sentence of the card's summary.
#
# No argument against Amendment A was submitted: the pamphlet says that
# is because the Legislature adopted it unanimously, and the against side
# says so once, in the pamphlet's words, in the same number of words as
# the for side. The for list shows the supporters' points as submitted;
# the against section is marked filed = false.

contest = "ut-2026-11-03-amendment-a"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "pamphlet"
number = "A"
title = "Shall the Utah Constitution be amended to change how proposed constitutional amendments are published, requiring publication for 60 days immediately before the general election in a manner established by state law instead of in newspapers?"
origin = "2025 Legislative General Session House Joint Resolution (H.J.R.) 10"
summary = "Constitutional Amendment A would require publication of a proposed constitutional amendment for 60 calendar days immediately before the general election in a manner set by state law rather than requiring publication in newspapers for two months immediately before the general election. Constitutional Amendment A would not change how constitutional amendments are proposed or approved by voters."
fiscal = "If approved, Constitutional Amendment A, together with H.B. 481, could reduce state costs by up to $1.4 million every two years, based on recent estimates. The savings from changing the publication requirement for proposed constitutional amendments from newspapers to publicly operated websites would vary depending on the length of each proposed constitutional amendment and newspaper publication rates."

