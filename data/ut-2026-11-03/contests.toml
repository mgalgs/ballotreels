# Contest index for the 2026-11-03 Utah general election
# (docs/ARCHITECTURE.md). One [[contest]] entry per contest on the
# ballot. `number` is a measure's ballot designation (a string). Titles
# pair the designation with the short title of the joint resolution
# that placed it on the ballot, as printed in the Voter Information
# Pamphlet.

