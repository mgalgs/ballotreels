# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; what a statewide initiative is; the vote one needs today; what
# Amendment B would require, of which initiatives, and what it leaves
# alone; what the pamphlet's analysis says it costs; one point per side;
# what a vote does.
#
# The card quotes the Voter Information Pamphlet: the ballot title, the
# Impartial Analysis's "Effect of Constitutional Amendment B" and its
# "Fiscal Effects". Utah's pamphlet prints no "a YES vote means" lines,
# so the card has none, and the vote lines take their two meanings from
# the ballot title's "at least 60% of voters, instead of a simple
# majority".
#
# Both sides filed an argument and a rebuttal. Each side's line and list
# take its central point as it states it: for, that tax increases should
# have broad support from the voters who pay them and that an initiative
# tax is hard to undo; against, that voters should have the same simple
# majority as lawmakers and that the change makes initiatives harder and
# sets a precedent. Same words per line, same words per list item.
#
# Each side names one person, in its own line, in the same form of words
# as each other and as Prop 40's (STANDARD.md section 9): for, S.J.R. 2's
# chief sponsor, from the enrolled resolution; against, the first signer
# of the argument against, as the pamphlet prints it. Both are senators,
# so both carry the one title. Senator Escamilla also voted no on the
# Senate's final vote, but rule 9.3 ranks a signer above a vote alone.

contest = "ut-2026-11-03-amendment-b"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "pamphlet"
number = "B"
title = "Shall the Utah Constitution be amended to require that citizen-proposed laws that increase taxes compared to existing law be approved by at least 60% of voters, instead of a simple majority?"
origin = "2025 Legislative General Session Senate Joint Resolution (S.J.R.) 2"
summary = "Constitutional Amendment B would increase the voter approval required for statewide initiatives that increase taxes compared to existing law. Statewide initiatives voted on after November 1, 2026, would require approval by at least 60% of voters if the statewide initiative: Creates a new tax; Expands an existing tax to cover additional items or transactions; Increases an existing tax rate; or Changes a property tax rate in a way that results in a smaller decrease in the property tax rate than would occur under existing law. Constitutional Amendment B would not change the vote required to approve any other type of statewide initiative."
fiscal = "Enactment of Constitutional Amendment B likely would not materially impact current state revenues or expenditures."

