# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; what the section says today; what the amendment would say
# instead; that there is no cost estimate; the two sides; what a vote
# does, as the ballot says it.
#
# The card quotes the Secretary of State's ballot: its explanatory
# statement, with its label, as the title; its heading "Constitutional
# Amendment" beside SUMMARY; its question as the summary; and its "A vote
# for / A vote against this proposition" lines. Kansas numbers no
# amendment, so the card has no number and draws no badge.
#
# Whether the amendment changes who may vote in practice is the contested
# point, so the ballot's word "clarify" appears only in the vote line
# that says it is the ballot's, and the neutral lines set the section's
# words today beside the words proposed, leaving out the residency
# exceptions and the "he or she" to "such person" edits for length. No
# line says whether non-citizens can vote now; no source says so.
#
# Fiscal: the ballot prints no cost estimate, and no fiscal note was
# available when the House Committee acted. The Supplemental Note's
# $50,000 is the Secretary of State's cost to publish notice of
# constitutional resolutions, not an effect of the amendment, and no
# archived source gives the State General Fund total to scale it, so it
# is left out.
#
# Kansas publishes no official arguments for or against an amendment, so
# both sides are filed = false and each says so once, in the same number
# of words. The Supplemental Note's record of committee testimony is not
# an official argument and is not used. No person or organisation is
# named.

contest = "ks-2026-11-03-constitutional-amendment"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot"
title = "Explanatory statement. This amendment would clarify that only a person who is a citizen of the United States is eligible to vote in this state."
origin = "Constitutional Amendment"
summary = "Shall the following be adopted?"
yes = "A vote for this proposition would clarify that only a person who is a citizen of the United States is eligible to vote in this state."
no = "A vote against this proposition would make no change to the constitution of the state of Kansas, and the language concerning voter qualifications would remain the same."

[[section]]
id = "what"
heading = "The constitutional amendment"

[[section.line]]
text = "The constitutional amendment would rewrite the section of the Kansas Constitution on who may vote."
sources = ["ballot", "resolution"]

[section.line.visual]
kind = "page"
source = "ballot"
highlight = ["Constitutional Amendment"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Today the constitution says every citizen of the United States who is eighteen or older and lives in the voting area shall be deemed a qualified elector."
sources = ["supplemental-note", "klrd-summary"]

[section.line.visual]
kind = "illustration"
name = "constitution-page"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "The amendment would say no person shall be deemed a qualified elector unless a citizen of the United States, eighteen or older, and living in the voting area."
sources = ["ballot", "resolution", "klrd-summary"]

[section.line.visual]
kind = "illustration"
name = "amended-page"

[[section]]
id = "fiscal"
heading = "What it would cost"

[[section.line]]
text = "The state's ballot does not include a cost estimate for the amendment."
sources = ["ballot"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"
stamp = "None reported"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"
filed = false

[[section.line]]
text = "Kansas publishes no official argument for the amendment."
sources = ["ballot"]

[section.line.visual]
kind = "list"
source = "ballot"
items = ["No official argument for was published"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "Kansas publishes no official argument against the amendment."
sources = ["ballot"]

[section.line.visual]
kind = "list"
source = "ballot"
items = ["No official argument against was published"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "The ballot says a yes vote would clarify that only a citizen of the United States is eligible to vote."
sources = ["ballot"]

[section.line.visual]
kind = "page"
source = "ballot"
highlight = ["A vote for this proposition would clarify"]

[[section.line]]
text = "The ballot says a no vote would make no change, and the language concerning voter qualifications would remain the same."
sources = ["ballot"]

[section.line.visual]
kind = "page"
source = "ballot"
highlight = ["A vote against this proposition would make no change"]
