# Archived sources for Kansas's constitutional amendment on voter
# citizenship, 2026-11-03 general election. Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# Kansas prints no voter pamphlet. The official statement is the ballot
# itself: the Secretary of State's one-page ballot carries the
# explanatory statement and the "A vote for / A vote against this
# proposition" lines that House Concurrent Resolution No. 5004 (Sec. 2)
# orders printed on it, the question and the amended section, so the
# card quotes it. The Secretary of State's web page prints the same
# words. The ballot strikes deleted words and italicises new ones, which
# pdftotext loses; no line quotes the amended section from its text.
#
# The enrolled resolution is the current copy (created 2026-09-08), whose
# explanatory statement matches the ballot; an earlier copy of April 2,
# 2025, not archived, differs from it. The Legislative Research
# Department's Supplemental Note and 2025 Summary of Legislation state
# the section's current wording; supplemental notes "do not express
# legislative intent". Kansas has no official arguments for or against an
# amendment, and no fiscal note was available when the House Committee
# acted.

[contest]
id = "ks-2026-11-03-constitutional-amendment"
election = "ks-2026-11-03"
division = "ocd-division/country:us/state:ks"
kind = "measure"
title = "Constitutional Amendment: Citizenship Requirement for Voting"

