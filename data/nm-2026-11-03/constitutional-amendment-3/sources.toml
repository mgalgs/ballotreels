# Archived sources for New Mexico Constitutional Amendment 3 (House Joint
# Resolution 1, 2026), 2026-11-03 general election. Every id here may be
# cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# The Secretary of State's 2026 General Election Voter Guide prints the
# amendment's ballot title, purpose and arguments for and against;
# sources/guide-section.pdf is pages 5 and 20 to 23 of it. The guide's
# reprint of the full text, which begins at the foot of page 23, is a
# version from before the resolution was amended ("SIX months", not
# "twelve months"), so nothing is cited from it: the full text is cited
# only from the Legislative Council Service's booklet
# (sources/lcs-section.pdf: its pages 1 to 2 and 15 to 21) and the
# resolution as passed.

[contest]
id = "nm-2026-11-03-constitutional-amendment-3"
election = "nm-2026-11-03"
division = "ocd-division/country:us/state:nm"
kind = "measure"
title = "Constitutional Amendment 3: PROPOSING AN AMENDMENT TO ARTICLE 12, SECTION 13 OF THE CONSTITUTION OF NEW MEXICO TO ESTABLISH NOMINATING COMMITTEES TO PROVIDE LISTS OF NOMINEES TO THE GOVERNOR FOR APPOINTMENT OF NONSTUDENT MEMBERS TO THE BOARDS OF REGENTS OF STATE EDUCATIONAL INSTITUTIONS; PROVIDING THAT STUDENT MEMBERS OF BOARDS OF REGENTS SHALL BE APPOINTED FROM A LIST PROVIDED BY AN ELECTED STUDENT GOVERNING BODY OF THE INSTITUTION; PROVIDING THAT, EXCEPT FOR A STUDENT MEMBER, MEMBERS OF THE BOARDS OF REGENTS SHALL NOT HAVE CHANGED THEIR POLITICAL PARTY REGISTRATION IN THE TWELVE MONTHS PRECEDING APPOINTMENT."

