# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; who appoints regents today; what Amendment 3 would change:
# the committees, the governor's choice limited to their nominees, and
# the party-registration rule; that the guide includes no cost estimate;
# one point per side; what a vote does.
#
# The card quotes the Secretary of State's 2026 General Election Voter
# Guide: the ballot title, and the amendment's "Purpose", whose opening
# words are the origin line and whose last four sentences, from student
# regents today to the change, are the summary (the sentences before
# them run across a page break, so the card cannot quote them whole).
# The guide prints no "a vote for means" lines, so the vote lines take
# their two meanings from one phrase of the summary, the same for each,
# so the two stay parallel.
#
# The guide's reprint of the full text predates the resolution's
# amendment ("SIX months"); every full-text claim is cited from the
# Legislative Council Service's booklet and the resolution as passed
# ("twelve months"). The student-regent change is on the card and
# left out of the narration for length. The arguments are the
# Legislative Council Service's, two a side, each side's two as its
# list. The Legislative Finance Committee's report finds only election
# costs, so the fiscal line says the guide includes no cost estimate. No
# person is named.

contest = "nm-2026-11-03-constitutional-amendment-3"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide"
number = "3"
title = "PROPOSING AN AMENDMENT TO ARTICLE 12, SECTION 13 OF THE CONSTITUTION OF NEW MEXICO TO ESTABLISH NOMINATING COMMITTEES TO PROVIDE LISTS OF NOMINEES TO THE GOVERNOR FOR APPOINTMENT OF NONSTUDENT MEMBERS TO THE BOARDS OF REGENTS OF STATE EDUCATIONAL INSTITUTIONS; PROVIDING THAT STUDENT MEMBERS OF BOARDS OF REGENTS SHALL BE APPOINTED FROM A LIST PROVIDED BY AN ELECTED STUDENT GOVERNING BODY OF THE INSTITUTION; PROVIDING THAT, EXCEPT FOR A STUDENT MEMBER, MEMBERS OF THE BOARDS OF REGENTS SHALL NOT HAVE CHANGED THEIR POLITICAL PARTY REGISTRATION IN THE TWELVE MONTHS PRECEDING APPOINTMENT."
origin = "Constitutional Amendment 3 proposes to amend Article 12, Section 13 of the Constitution of New Mexico"
summary = "Student regents must be students of their respective institutions and are appointed from a list provided by the president of their respective institutions. The proposed amendment would require the legislature to establish a bipartisan or nonpartisan regent nominating committee for each of the 10 state educational institutions and would limit the governor's prospective appointments to the nominees selected by the regent nominating committees. Additionally, the proposed amendment would require the governor to appoint student regents from lists provided by the elected student governing bodies of their respective institutions instead of by the institutions' presidents. Finally, excepting the student regents, the proposed amendment would disqualify a person from being appointed to a board of regents if the person changed political party registration in the 12 months preceding the person's appointment."

