# Archived sources for New Mexico Bond Question 2 (the 2026 Capital
# Projects General Obligation Bond Act, House Bill 248, Laws 2026,
# chapter 65), 2026-11-03 general election. Every id here may be cited
# by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# The Secretary of State's 2026 General Election Voter Guide prints the
# bond question and its "Explanation of General Obligation Bonds and
# Taxes"; sources/guide-section.pdf is pages 36 to 39 of it. The
# guide prints no fiscal statement and no arguments for or against. The
# Legislative Finance Committee's fiscal impact report on the act, the
# Legislature's own analysis of it, is named as such where cited. Its
# per-question amounts leave out the cost of issuing the bonds and are
# not used in place of the ballot's.

[contest]
id = "nm-2026-11-03-bond-question-2"
election = "nm-2026-11-03"
division = "ocd-division/country:us/state:nm"
kind = "measure"
title = "Bond Question 2: Library Acquisitions"

