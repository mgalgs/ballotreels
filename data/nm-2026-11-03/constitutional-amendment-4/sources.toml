# Archived sources for New Mexico Constitutional Amendment 4 (House Joint
# Resolution 5, 2026), 2026-11-03 general election. Every id here may be
# cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# The Secretary of State's 2026 General Election Voter Guide prints the
# amendment's ballot title, purpose and arguments for and against;
# sources/guide-section.pdf is pages 5 and 27 to 32 of it. The guide's
# reprint of the full text, which begins at the foot of page 32, is a
# version from before the resolution was amended (its Section 2 says
# "2028 general election"), so nothing is cited from it: the full text
# is cited only from the Legislative Council Service's booklet
# (sources/lcs-section.pdf: its pages 1 to 2 and 22 to 28) and the
# resolution as passed. The guide prints no fiscal statement; the
# Legislative Finance Committee's fiscal impact report on the
# resolution, the Legislature's own bill-stage analysis, is the one
# official estimate of its cost, and is named as such.

[contest]
id = "nm-2026-11-03-constitutional-amendment-4"
election = "nm-2026-11-03"
division = "ocd-division/country:us/state:nm"
kind = "measure"
title = "Constitutional Amendment 4: PROPOSING TO AMEND ARTICLE 4, SECTION 10 OF THE CONSTITUTION OF NEW MEXICO TO ALLOW LEGISLATIVE COMPENSATION THAT IS LIMITED TO THE MEDIAN HOUSEHOLD INCOME FOR NEW MEXICO, TO REQUIRE LEGISLATIVE COMPENSATION TO BE REDUCED IF THE MEDIAN HOUSEHOLD INCOME FOR NEW MEXICO FALLS, TO ALLOW LEGISLATIVE COMPENSATION TO BE INCREASED ONLY IF THE MEDIAN HOUSEHOLD INCOME FOR NEW MEXICO RISES AND TO PROVIDE FOR DELAYED IMPLEMENTATION."

