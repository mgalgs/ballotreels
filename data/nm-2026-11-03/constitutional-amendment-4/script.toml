# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; what legislators are paid today; what Amendment 4 would
# allow, how much, and from when; that the guide includes no cost
# estimate, and what the Legislative Finance Committee's analysis put
# the cost at; one point per side; what a vote does.
#
# The card quotes the Secretary of State's 2026 General Election Voter
# Guide: the ballot title, and the amendment's "Purpose", whose opening
# words are the origin line and whose last three sentences are the
# summary. The guide prints no "a vote for means" lines, so the vote
# lines take their two meanings from one phrase of the summary, the same
# for each, so the two stay parallel.
#
# The guide's reprint of the full text predates the resolution's
# amendment ("2028 general election"); every full-text claim is cited
# from the Legislative Council Service's booklet and the resolution as
# passed. The median household income ("approximately $68,000 in 2026")
# and the start in 2029 are said as the guide says them.
#
# Fiscal: the guide includes no cost estimate, and says so in the
# standard's words. The Legislative Finance Committee's fiscal impact
# report, the Legislature's own analysis of the resolution, puts the
# yearly cost to the general fund at about $7.6 million, before payroll
# taxes and benefits; it is named as that report, not as a ballot
# statement. No archived source states the general fund's total, so the
# figure is given without a share (rule 6.5): the total needed is the
# General Fund's recurring appropriations for fiscal year 2029, from the
# Legislative Finance Committee.
#
# The arguments are the Legislative Council Service's: four for and
# three against. Each side's list is its two of most equal weight: the
# work (more time for it; pay out of line with other states for no more
# service) and who runs (more New Mexicans; an incumbent's advantage).
# The neutral lines leave out the background a side argues from (outside
# jobs, other states' pay, the pension). No person is named.

contest = "nm-2026-11-03-constitutional-amendment-4"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide"
number = "4"
title = "PROPOSING TO AMEND ARTICLE 4, SECTION 10 OF THE CONSTITUTION OF NEW MEXICO TO ALLOW LEGISLATIVE COMPENSATION THAT IS LIMITED TO THE MEDIAN HOUSEHOLD INCOME FOR NEW MEXICO, TO REQUIRE LEGISLATIVE COMPENSATION TO BE REDUCED IF THE MEDIAN HOUSEHOLD INCOME FOR NEW MEXICO FALLS, TO ALLOW LEGISLATIVE COMPENSATION TO BE INCREASED ONLY IF THE MEDIAN HOUSEHOLD INCOME FOR NEW MEXICO RISES AND TO PROVIDE FOR DELAYED IMPLEMENTATION."
origin = "Constitutional Amendment 4 proposes to amend Article 4, Section 10 of the Constitution of New Mexico"
summary = "The proposed amendment would go into effect when the members of the Fifty-Ninth Legislature are sworn in and seated in 2029 and would allow the legislature to enact a law that provides compensation for each legislator in an amount equal to the annual median household income for New Mexico, which is approximately $68,000 in 2026. Also, the proposed amendment would remove the prohibition on legislators receiving other perquisites or allowances."

