title = "Bond Question 1: Senior Citizen Facility Improvement, Construction and Equipment"
number = "1"

[[contest]]
id = "nm-2026-11-03-bond-question-2"
kind = "measure"
division = "ocd-division/country:us/state:nm"
title = "Bond Question 2: Library Acquisitions"
number = "2"

[[contest]]
