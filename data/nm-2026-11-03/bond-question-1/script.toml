# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; what a general obligation bond is; that none can be issued
# without the voters; what Bond Question 1 would allow; the scale of the
# borrowing and who sets the tax; that no official argument exists for
# either side; what a vote does.
#
# The card quotes the Secretary of State's 2026 General Election Voter
# Guide: the bond question as the ballot prints it, "The New Mexico
# Legislature passed the 2026 Capital Projects General Obligation Bond
# Act" as the origin line, and the guide's explanation of how the bonds
# are repaid as the summary. The guide prints no "a vote for means"
# lines, so the vote lines take their two meanings from one phrase of
# the question, the same for each.
#
# Fiscal: the principal is the ballot's. No official estimate of the
# interest or the total repaid exists, so none is given; the guide says
# the State Board of Finance will set the tax rate and the yearly cost
# to property owners after the election, and the script says so. The
# guide states no budget to scale the borrowing by; the Legislative
# Finance Committee's fiscal impact report compares the three bond
# questions together with the net taxable value of property, and that
# comparison is quoted. No archived source states a General Fund total,
# so this question's own amount has no share (rule 6.5): the total
# needed is the General Fund's recurring appropriations for fiscal year
# 2027, from the Legislative Finance Committee.
#
# New Mexico publishes no official arguments for or against a bond
# question, so both sides are filed = false and each says so once, in
# the same number of words. No person is named.

contest = "nm-2026-11-03-bond-question-1"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide"
number = "1"
title = "The 2026 Capital Projects General Obligation Bond Act authorizes the issuance and sale of senior citizen facility improvement, construction and equipment acquisition bonds. Shall the state be authorized to issue general obligation bonds in an amount not to exceed twenty-one million five hundred eighty-two thousand two hundred thirteen dollars ($21,582,213) to make capital expenditures for certain senior citizen facility improvement, construction and equipment acquisition projects and provide for a general property tax imposition and levy for the payment of principal of, interest on and expenses incurred in connection with the issuance of the bonds and the collection of the tax as permitted by law?"
origin = "The New Mexico Legislature passed the 2026 Capital Projects General Obligation Bond Act"
summary = "A General Obligation (GO) bond represents a debt for money borrowed by the State of New Mexico to finance capital improvement projects that benefit communities throughout the state. If approved by voters, the State promises to repay the amount borrowed, plus interest, over a period of time for each series of General Obligation bonds issued. These bonds are called \"General Obligation\" bonds because repayment of the principal and interest is backed by the full faith and credit of the State of New Mexico. The debt service is paid through a statewide property tax levy on taxable property, as authorized by the 2026 Capital Projects General Obligation Bond Act."

