# Archived sources for New Mexico Constitutional Amendment 1 (House Joint
# Resolution 2, 2025), 2026-11-03 general election. Every id here may be
# cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# The Secretary of State's 2026 General Election Voter Guide prints the
# amendment's ballot title, purpose and arguments for and against;
# sources/guide-section.pdf is pages 5 and 7 to 10 of it. The guide's
# reprint of the full text is a version from before the resolution was
# amended ("an explanation", not "a substantive explanation"), so it is
# not archived and the full text is cited only from the Legislative
# Council Service's booklet (sources/lcs-section.pdf: its pages 1 to 2
# and 4 to 8) and the resolution as passed.

[contest]
id = "nm-2026-11-03-constitutional-amendment-1"
election = "nm-2026-11-03"
division = "ocd-division/country:us/state:nm"
kind = "measure"
title = "Constitutional Amendment 1: PROPOSING AN AMENDMENT TO ARTICLE 4, SECTION 22 OF THE CONSTITUTION OF NEW MEXICO TO REQUIRE THE GOVERNOR TO PROVIDE VETO MESSAGES ON ALL BILLS VETOED IN WHOLE OR IN PART AND TO PROVIDE THAT ALL BILLS PASSED BY THE LEGISLATURE AND NOT ACTED ON BY THE GOVERNOR WILL BECOME LAW."

