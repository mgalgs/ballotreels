# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; the pocket veto today, and how often governors have used it; what Amendment 1 would change;
# that the guide includes no cost estimate; one point per side; what a
# vote does.
#
# The card quotes the Secretary of State's 2026 General Election Voter
# Guide: the ballot title, and the amendment's "Purpose", whose first
# words ("In 2025, the New Mexico Legislature passed Constitutional
# Amendment 1") are the origin line and whose rest is the summary. The
# guide prints no "a vote for means" lines, only the ballot's "For:" and
# "Against:", so the card has no yes/no and the vote lines take their
# two meanings from the purpose's "would by default become law" and
# "the bill does not become law".
#
# The guide's reprint of the full text predates the resolution's
# amendment ("an explanation"), so the text is cited only from the
# Legislative Council Service's booklet and the resolution as passed,
# which say "a substantive explanation". That the Legislature can
# override a veto is part of the opponents' argument (rule 6.3), so no
# neutral line says it. The pocket-veto count is the booklet's
# background, both numbers on one chart. The arguments are the
# Legislative Council Service's, two a side, each side's two as its
# list. The Legislative Finance Committee's report finds only election
# costs, not the amendment's, so the fiscal line says the guide includes
# no cost estimate. No person is named.

contest = "nm-2026-11-03-constitutional-amendment-1"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide"
number = "1"
title = "PROPOSING AN AMENDMENT TO ARTICLE 4, SECTION 22 OF THE CONSTITUTION OF NEW MEXICO TO REQUIRE THE GOVERNOR TO PROVIDE VETO MESSAGES ON ALL BILLS VETOED IN WHOLE OR IN PART AND TO PROVIDE THAT ALL BILLS PASSED BY THE LEGISLATURE AND NOT ACTED ON BY THE GOVERNOR WILL BECOME LAW."
origin = "In 2025, the New Mexico Legislature passed Constitutional Amendment 1"
summary = "The pocket veto occurs when, after the adjournment of the legislature, the governor does not sign a bill that was presented to the governor during the last three days of session. By not acting on the bill, the bill does not become law. Constitutional Amendment 1 proposes to flip this dynamic. If this proposed amendment is approved by voters, a bill presented to the governor during the last three days of the session would by default become law if the governor does not issue a veto message within 20 days after the legislature's adjournment. In order to veto a bill passed by the legislature, the governor would be required to provide a written, substantive explanation for the veto."

