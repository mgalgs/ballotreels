# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; the constitution's rule today; what Amendment 2 would let
# school districts and the Legislature do; that the guide includes no
# cost estimate; one point per side; what a vote does.
#
# The card quotes the Secretary of State's 2026 General Election Voter
# Guide: the ballot title, and the amendment's "Purpose", whose first
# words ("Constitutional Amendment 2, passed by the legislature in
# 2026") are the origin line and whose last two sentences are the
# summary (its middle sentence repeats the ballot title). The guide
# prints no "a vote for means" lines, so the vote lines take their two
# meanings from the summary and the title.
#
# The full text is cited from the Legislative Council Service's booklet
# and the resolution as passed. The booklet's background (the rule's
# origin in 1910, the 2008 amendment, and the aim to "remove politics
# from education") is left out: the 2008 vote is part of the opponents'
# argument (rule 6.3), and the rest bears on one side's case. The
# arguments are the Legislative Council Service's: five for and four
# against. Each side's list is its two of most equal weight: cost (all-
# mail elections; voter fatigue and ballot costs) and who takes part
# (more voters; politicized elections). The for side's cost of a special
# election is a school district's, with no official total to scale it
# by, so the line names no figure. The Legislative Finance Committee's
# report finds only election costs, so the fiscal line says the guide
# includes no cost estimate. No person is named.

contest = "nm-2026-11-03-constitutional-amendment-2"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide"
number = "2"
title = "PROPOSING TO AMEND ARTICLE 7, SECTION 1 OF THE CONSTITUTION OF NEW MEXICO TO REMOVE THE REQUIREMENT THAT SCHOOL ELECTIONS BE SEPARATE FROM PARTISAN ELECTIONS."
origin = "Constitutional Amendment 2, passed by the legislature in 2026"
summary = "If the amendment is approved, school districts would have the opportunity to add bond and mill levy questions to ballots in a partisan election such as the regular general election. It would also give the legislature the authority to allow local school board elections to be held with partisan elections."

