# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; who taxes such property, and how it is taxed today; what Amendment 2 would exempt, and from when; what the official
# documents say about its cost; the two sides; what a vote does.
#
# The card quotes the Division of Elections' booklet: the ballot title
# and summary. The booklet prints no "a YES vote means" lines and no
# fiscal statement, so the card has neither, and the vote lines take
# their two meanings from the summary's one sentence.
#
# The archived Senate analysis is of an earlier version (sources.toml),
# so its fiscal findings are not this measure's: the fiscal line says
# only that the booklet prints no estimate. No dollar figure about a
# government's money appears, so none needs a scale; the $25,000 is a
# per-owner amount.
#
# Florida publishes no official arguments for or against a legislative
# amendment, so both sides are filed = false and each says so once, in
# the same number of words.

contest = "fl-2026-11-03-amendment-2"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "booklet"
number = "2"
title = "EXEMPTION OF TANGIBLE PERSONAL PROPERTY ON AGRICULTURAL LAND FROM TAXATION. —"
origin = "ARTICLE VII, SECTION 3 ARTICLE XII"
summary = "Proposing an amendment to the State Constitution to exempt tangible personal property habitually located or typically present on land classified as agricultural, used in the production of agricultural products or for agritourism activities, and owned by the landowner or leaseholder of the agricultural land from ad valorem taxation. If approved this amendment would first apply for tax years beginning January 1, 2027."

[[section]]
id = "what"
heading = "Amendment 2"

[[section.line]]
text = "Amendment 2 is about property taxes on equipment and other movable property kept on Florida farmland."
sources = ["booklet", "analysis"]

[section.line.visual]
kind = "page"
source = "booklet"
highlight = ["tangible personal property"]

[[section]]
id = "background"
heading = "Who taxes it"

