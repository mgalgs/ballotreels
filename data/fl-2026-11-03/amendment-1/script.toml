# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; what the fund is for; how big it may be today; what
# Amendment 1 would change; what the Senate's analysis says that means
# each year, and its scale; the two sides; what a vote does.
#
# The card quotes the Division of Elections' booklet: the ballot title
# and summary. The booklet prints no "a YES vote means" lines and no
# fiscal statement, so the card has neither, and the vote lines take
# their two meanings from the summary's "from 10% to 25%".
#
# Florida publishes no official arguments for or against a legislative
# amendment, so both sides are filed = false and each says so once, in
# the same number of words.
#
# Scale (rule 6.5): the amendment sets the fund's ceiling as a share of
# general revenue collections, so the $750 million yearly transfer is
# compared with general revenue: about 1 percent of the $52,339.9 million
# the August 2026 outlook estimates for 2026-27 (page 2). No total is
# derived from "25 percent is $12.2 billion". No line says what the
# transfer is traded against: the analysis does not say.

contest = "fl-2026-11-03-amendment-1"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "booklet"
number = "1"
title = "BUDGET STABILIZATION FUND.—"
origin = "ARTICLE III, SECTION 19"
summary = "Proposing an amendment to the State Constitution to increase the amount of funds that may be retained in the budget stabilization fund from 10% to 25% of general revenue collections, require the legislature to transfer the lesser of $750 million or the amount required to reach 25% of the general revenue collections each year unless certain conditions are met, and allow the legislature to withdraw funds for critical state needs."

[[section]]
id = "what"
heading = "Amendment 1"

[[section.line]]
text = "Amendment 1 is about Florida's Budget Stabilization Fund, money the state sets aside."
sources = ["booklet", "text"]

[section.line.visual]
kind = "page"
source = "booklet"
highlight = ["budget stabilization fund"]

[[section]]
id = "background"
heading = "What the fund is for"

[[section.line]]
text = "The state can draw on the fund for a revenue shortfall or an emergency."
