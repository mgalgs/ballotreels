[section.line.visual]
kind = "illustration"
name = "rainy-day"

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "In 2025 the fund held $4.4 billion; its ceiling is 10 percent of yearly general revenue."
sources = ["analysis"]

[section.line.visual]
