# Archived sources for Florida Amendment 1, 2026-11-03 general election.
# Every id here may be cited by script.toml. `kind` must be one the
# standard allows (docs/STANDARD.md, section 1).
#
# Florida publishes no official arguments for or against a legislative
# amendment, so there is no source of kind official-argument: both side
# sections say so, citing the Division of Elections' booklet, which
# prints none. voter-guide.pdf is the whole booklet; Amendment 1 is on
# its pages 3 to 8.
#
# The ballot measure is HJR 5019 (2025). The fiscal analysis is the
# Senate's of its companion, SJR 1908, whose withdrawal rules differ
# from HJR 5019's; the script cites it only for the fund's balance, its
# cap in dollars and the $750 million transfer, which HJR 5019 sets the
# same way.

[contest]
id = "fl-2026-11-03-amendment-1"
election = "fl-2026-11-03"
division = "ocd-division/country:us/state:fl"
kind = "measure"
title = "Constitutional Amendment No. 1: Budget Stabilization Fund"

[[source]]
id = "booklet"
kind = "official-title-summary"
publisher = "Florida Department of State, Division of Elections, Proposed Constitutional Amendments for the General Election (November 3, 2026), No. 1 Constitutional Amendment, pages 3 to 8"
credit = "Florida Division of Elections, Proposed Constitutional Amendments"
url = "https://files.floridados.gov/media/711369/eng-2026-booklet-constitutional-amendpub-updated-20260903.pdf"
file = "sources/voter-guide.pdf"
retrieved = "2026-10-27"

[[source]]
id = "text"
kind = "official-text"
publisher = "Florida House of Representatives, HJR 5019, Engrossed 1, Enrolled (2025 Legislature)"
url = "https://www.flsenate.gov/Session/Bill/2025/5019/BillText/er/PDF"
file = "sources/text-proposed-law.pdf"
retrieved = "2026-10-27"

[[source]]
id = "analysis"
kind = "official-fiscal-analysis"
publisher = "The Florida Senate, Bill Analysis and Fiscal Impact Statement, SJR 1908, Committee on Appropriations, June 5, 2025"
credit = "Florida Senate, Bill Analysis and Fiscal Impact Statement"
url = "https://flsenate.gov/Session/Bill/2025/1908/Analyses/2025s01908.ap.PDF"
file = "sources/fiscal-analysis.pdf"
retrieved = "2026-10-27"

[[source]]
id = "revenue-outlook"
kind = "official-report"
publisher = "Florida Legislature, Office of Economic and Demographic Research, General Revenue Fund Financial Outlook Statement, Including Results of the August 14, 2026 Revenue Estimating Conference, page 2"
credit = "Office of Economic and Demographic Research, August 2026"
url = "https://edr.state.fl.us/content/revenues/outlook-statements/general-revenue/260814_GRoutl.pdf"
file = "sources/general-revenue-outlook.pdf"
retrieved = "2026-10-27"
