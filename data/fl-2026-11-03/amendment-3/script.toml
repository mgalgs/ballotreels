# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; how homes are taxed today; what the amendment would change;
# what the Revenue Estimating Conference estimates it would do to local
# tax revenue, beside what local governments levy (the first two years'
# smaller drops are on the chart); the two sides; what a vote does. The
# designation is said once, in the opening line; after that, "the
# amendment".
#
# The card quotes the Division of Elections' amendment database page,
# which carries the current ballot title and summary as text: the
# Attorney General's revised statement of August 13, 2026, after the
# court struck the Legislature's original. (The booklet's PDF draws one
# summary line in a font with no text mapping, so it cannot be checked
# verbatim; the Attorney General's letter is a scanned image.) The page
# prints no "a YES vote means" lines and no fiscal statement, so the card
# has neither, and the vote lines take their two meanings from the
# summary's own words.
#
# Left out for time: the summary's rule for people not resident on
# December 31, 2026 (it stays on the card).
#
# Scale (rule 6.5): the estimate is of local non-school property tax
# revenue, and the Department of Revenue's 2025 statewide profile prints
# no non-school total, so none is summed: the line states its printed
# county, municipal and other (special district) levies beside the
# estimate, rounded to a tenth of a billion. The levies are 2025's, before
# the years the estimate covers; the line names the year.
#
# Florida publishes no official arguments for or against a legislative
# amendment, so both sides are filed = false and each says so once, in
# the same number of words.

contest = "fl-2026-11-03-amendment-3"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-summary"
number = "3"
title = "INCREASED HOMESTEAD EXEMPTION; LOWER CAP ON INCREASES IN NON-HOMESTEAD PROPERTY ASSESSMENTS"
origin = "Article VII, Sections 4, 6, and 9, and Article XII, Florida Constitution"
summary = "This amendment increases the homestead exemption, for all non-school taxes, to $150,000 in 2027 and $250,000 in 2028, and adjusts for inflation thereafter. It requires the Legislature to prescribe a uniform procedure for counties and municipalities, for their respective levies, to increase the homestead exemption up to full assessed value, and allows special districts, subject to referendum approval, to do the same. Persons who are not Florida residents on December 31, 2026, will receive the existing homestead exemption upon qualifying for a homestead exemption, with the increased homestead exemption beginning with the fifth year of exemption, to the extent permitted by the U.S. Constitution. This amendment reduces the annual cap on assessment increases for non-homestead properties from 10% to 5%. This amendment requires counties and municipalities to use property taxes solely for public safety, education and schools, infrastructure, natural resources, bond debt service, retirement benefits for employees, and operations and administration. Other expenditures may be approved by county officers or county or municipal governing bodies unless prohibited by general law, notwithstanding Article VII, Section 9(a) of the Florida Constitution, which allows counties and municipalities to levy property taxes for their respective purposes. This amendment takes effect January 1, 2027."

