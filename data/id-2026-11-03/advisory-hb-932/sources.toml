# Archived sources for Idaho's Advisory Question - House Bill 932,
# 2026-11-03 general election. Every id here may be cited by script.toml.
# `kind` must be one the standard allows (docs/STANDARD.md, section 1).
#
# An advisory question, not an amendment or an initiative: it asks voters
# to choose one of six guns (a choice question, docs/SCRIPT-FORMAT.md),
# and has no statements for or against. The Voter Pamphlet prints the
# question, its six choices, the Legislative Council's brief statement of
# purpose and a brief description of each firearm on pages 14 and 15; the
# fiscal note is the one filed with the bill in the Legislature, under
# its statement of purpose.

[contest]
id = "id-2026-11-03-advisory-hb-932"
election = "id-2026-11-03"
division = "ocd-division/country:us/state:id"
kind = "measure"
title = "Advisory Question – House Bill 932: State Gun"

