# Contest index for the 2026-11-03 Idaho general election
# (docs/ARCHITECTURE.md). One [[contest]] entry per contest on the
# ballot. `number` is a measure's ballot designation (a string). Titles
# pair the designation with the measure's short title as the 2026 Idaho
# Voter Pamphlet prints it: for a joint resolution, the subject it is
# "relating to"; for the initiative, the name of the act; for the
# advisory question, the pamphlet's own heading, "Advisory Question -
# House Bill 932", with the subject the bill is "relating to" (the state
# gun). It asks voters to choose one of six options: a choice question
# (docs/SCRIPT-FORMAT.md).

[election]
id = "id-2026-11-03"
state = "ocd-division/country:us/state:id"
title = "Idaho General Election, November 3, 2026"

[[contest]]
id = "id-2026-11-03-hjr-4"
kind = "measure"
division = "ocd-division/country:us/state:id"
title = "House Joint Resolution 4: Psychoactive Substances"
number = "4"

[[contest]]
id = "id-2026-11-03-hjr-6"
kind = "measure"
division = "ocd-division/country:us/state:id"
title = "House Joint Resolution 6: English as the Official Language of the State of Idaho"
number = "6"

[[contest]]
id = "id-2026-11-03-prop-1"
kind = "measure"
division = "ocd-division/country:us/state:id"
title = "Proposition 1: Reproductive Freedom & Privacy Act"
number = "1"

[[contest]]
id = "id-2026-11-03-advisory-hb-932"
kind = "measure"
division = "ocd-division/country:us/state:id"
title = "Advisory Question – House Bill 932: State Gun"
number = "932"
