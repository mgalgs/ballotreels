# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; what Idaho law allows today; what the initiative would create
# before and after fetal viability; what the
# Division of Financial Management says it costs, with the statement's own
# comparison to the Medicaid budget; one point per side; what a vote does.
#
# The card quotes page 6 of the Idaho Voter Pamphlet: the court-revised
# short ballot title, the long ballot title and the "What your vote will
# do" lines, with the first two sentences of the Division of Financial
# Management's Summary of Fiscal Impact from page 7 under its heading.
#
# Wording: the neutral sections use the official statements' own terms
# (abortion, fetal viability, medical emergency, pregnant woman, health care providers) and neither
# side's vocabulary. Words only one side uses ("ban", "extreme",
# "late-term", "unborn", "preborn", "on demand") appear nowhere in the
# narration. Today's law is described from the NO box, today's exceptions
# as it lists them; whether those exceptions are enough is each side's
# argument, left to its section. The narration does not define
# viability, since how to define it is part of the CON argument; the
# change line's page visual highlights the YES box's own definition.
# The designation is said once, in the opening line; after that, "the
# measure", in both sides' lines alike. The fiscal line quotes the statement's
# own scale ("less than 0.001%"), so it adds no comparison of its own.
#
# Both sides filed an argument and a rebuttal. Each side's line and list
# take its central points as it states them: for, that patients and
# doctors, not the government, make decisions in medical emergencies, the
# health and life exceptions, and protection for doctors and nurses;
# against, abortion until seven or eight months of pregnancy, parental
# consent and the rule that only doctors perform abortions. Same words per
# line, same words per list item.

contest = "id-2026-11-03-prop-1"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "pamphlet"
number = "1"
title = "Measure creating right to abortion before fetus viability, and post-viability to protect health; right to privacy; healthcare provider liability protections."
origin = "Proposition One: Reproductive Freedom & Privacy Act"
summary = "The measure seeks to change Idaho’s laws by introducing a right to reproductive freedom and privacy including a right to abortion up to the point of the fetus’s ability to survive outside the womb. After fetal viability, there would be no general right to abortion except in cases of “medical emergency.” The “medical emergency” exception would expand Idaho’s current life exception and allow abortions when pregnant women face complicating physical conditions that threaten their life or health, “including serious impairment to a bodily function” or “serious dysfunction of any bodily organ or part.” The proposed measure codifies a right to make reproductive decisions, including contraception, fertility treatment, and prenatal and postpartum care. This includes a “right of privacy” in making these decisions. The measure seeks to prevent the state from enforcing certain abortion laws protecting the life of the unborn child. It would also impose a requirement that any restrictions on reproductive decisions, including abortion prior to fetus viability, must be “narrowly tailored to improve or maintain the health of the person seeking reproductive health care.” The measure would also prevent the state from penalizing patients, healthcare providers, or anyone who assists in exercising the proposed right."
fiscal = "The State estimates the initiative would increase state expenditures between $3,100 and $7,800 annually, less than 0.001% of the state share of Idaho’s Medicaid budget. This impact is derived from the costs of treating chemical abortion complications for women enrolled in Idaho’s Medicaid program."
yes = "A YES vote would support creating a right to abortion before fetal viability—defined as a fetus’ ability to survive without extraordinary medical measures—and after fetal viability in cases of medical emergency; providing protections against professional discipline and civil and criminal liability for healthcare providers; and codifying a statutory reproductive right to freedom and privacy."
no = "A NO vote would support making no change to Idaho’s current law, which preserves the life of preborn children by prohibiting abortion, except when necessary to prevent the death of the pregnant woman, and during the first trimester in documented cases of rape or incest reported to law enforcement."

