# Archived sources for Idaho House Joint Resolution 4, 2026-11-03 general
# election. Every id here may be cited by script.toml. `kind` must be one
# the standard allows (docs/STANDARD.md, section 1).
#
# Idaho prints a constitutional amendment's ballot question, the
# Legislative Council's statement of meaning, "What your vote will do",
# the statements for and against and the full text on one page of the
# Voter Pamphlet (page 4), so several sources below share one archived
# file. The pamphlet prints no fiscal statement for a joint resolution;
# Idaho's is the fiscal note filed with the resolution in the Legislature.

[contest]
id = "id-2026-11-03-hjr-4"
election = "id-2026-11-03"
division = "ocd-division/country:us/state:id"
kind = "measure"
title = "House Joint Resolution 4: Psychoactive Substances"

[[source]]
id = "pamphlet"
kind = "official-title-summary"
publisher = "Idaho Secretary of State, 2026 Idaho Voter Pamphlet, page 4: House Joint Resolution 4 ballot question, Legislative Council's Statement of Meaning, Purpose, and Result to Be Accomplished, and What Your Vote Will Do"
credit = "Idaho Voter Pamphlet, House Joint Resolution 4"
url = "https://archive.voteidaho.gov/download/2026_Voter_Pamphlet.pdf"
file = "sources/guide-section.pdf"
retrieved = "2026-10-27"

