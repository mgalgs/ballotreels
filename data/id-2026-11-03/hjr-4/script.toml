# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; how drug laws can be changed today; what the resolution would
# change; what its fiscal note says it costs (only putting it on the
# ballot; the note's dollar figures are left out for length); one point
# per side; what a vote does. The designation is said once, in the
# opening line; after that, "the amendment".
#
# The card quotes page 4 of the Idaho Voter Pamphlet: the ballot
# question, the Legislative Council's statement of meaning and the "What
# your vote will do" lines. The pamphlet prints no fiscal statement for a
# joint resolution, so the card has none; the fiscal section cites the
# resolution's own fiscal note, by that name.
#
# Both sides filed a statement. Each side's line and list take its
# central point as it states it: for, that legalization is too important
# to decide lightly and belongs in public legislative hearings; against,
# that the amendment takes power from the people, who decide as carefully
# as legislators, and is unnecessary. Same words per line, same words per
# list item.

contest = "id-2026-11-03-hjr-4"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "pamphlet"
number = "4"
title = "Shall Section 26, Article III of the Constitution of the State of Idaho be amended to provide that only the Idaho Legislature shall have power and authority to legalize the growing, producing, manufacturing, transporting, selling, delivering, dispensing, administering, prescribing, distributing, possessing, or using of marijuana, narcotics, or other psychoactive substances?"
origin = "Amendment to Idaho Constitution - House Joint Resolution 4"
summary = "This proposed constitutional amendment would give the Legislature exclusive authority to legalize marijuana, narcotics, or other psychoactive substances in the State of Idaho."
yes = "A YES vote would give the Legislature exclusive authority to legalize marijuana, narcotics, or other psychoactive substances in the State of Idaho."
no = "A NO vote would make no change to Idaho’s Constitution, which currently allows changes to Idaho’s controlled substances laws using the initiative process."

