# Management's fiscal impact statement for the initiative, and each
# legislative measure's fiscal note.

[advisory-hb-932]
source = "fiscal-note"
status = "no-material-impact"
quote = "This legislation is expected to have no direct impact on the General Fund or local government revenues."

# The note's other figure, the Secretary of State's biennial ballot
# appropriation, is not this measure's cost, so the quote stops before it.
[hjr-4]
source = "fiscal-note"
quote = "Hence, there is no fiscal impact, except the cost of placing this on the ballot. According to the Secretary of State, the approximate cost of any ballot measure is not more than $200,000.00."
