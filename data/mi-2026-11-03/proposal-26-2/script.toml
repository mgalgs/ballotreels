# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; how ads that do not urge a vote are treated today; what the
# proposal would change (the contribution bans, then the two disclosure
# rules, each in the ballot's own terms); what the Senate Fiscal Agency
# says it would cost and bring in; the two sides; what a vote does.
#
# The card quotes the Bureau of Elections' ballot wording: the heading
# under "Proposal 2026-2" and its "The proposal would:" bullets, run
# together as printed (pdftotext reads the bullet marks apart from their
# text; the check's column-by-column reading finds them in order). It
# prints no "a YES vote means" lines and no fiscal statement, so the card
# has neither, and the vote lines take their two meanings from the card.
#
# Michigan publishes no official arguments for or against a proposal,
# so both sides are filed = false and each says so once, in the same
# number of words. The Senate Fiscal Agency's "Views" section is the
# agency's summary of others' arguments, not an argument either side
# filed; nothing in the script cites it.
#
# Cost: the Senate Fiscal Agency gives no total. It calls the costs to
# the Attorney General and the district courts minor, says the
# Department of State could need more staff depending on how many
# investigations it opens (at about $145,700 a year for each; the script
# leaves the per-position figure out rather than imply a total the
# agency does not state), and says fines would support local libraries
# in an amount it calls indeterminate. With no dollar total, no scale is
# needed (rule 6.5). The $250,000 is a contractor's own contracts, not
# the state's budget, so it has no scale either.

contest = "mi-2026-11-03-proposal-26-2"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot"
number = "26-2"
title = "A proposed initiated law to prohibit campaign contributions from certain regulated utilities and government contractors and apply campaign finance laws and regulations to additional types of political communications"
origin = "Proposal 2026-2"
summary = "The proposal would: • Prohibit regulated electric and gas utilities, contractors with over $250,000 annually in government contracts, and people and organizations with substantial connections to these utilities/contractors from making direct or indirect campaign contributions to those who run for or hold offices that impact them. • Expand laws regulating spending on political communications, including those requiring disclosing donor information, to apply to communications clearly identifying candidates or ballot questions, even if they do not expressly advocate voting for/against them. • Expressly apply the law requiring disclosure of who paid for political communications to internet political communications."

[[section]]
id = "what"
heading = "Proposal 26-2"

[[section.line]]
text = "Proposal 26-2 would change Michigan's campaign finance law."
sources = ["ballot", "sfa"]

[section.line.visual]
kind = "page"
source = "ballot"
highlight = ["prohibit campaign contributions from certain regulated utilities and government contractors"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "issue-ads-today"
text = "Today, ads that do not directly urge a vote need not report their donors."
sources = ["sfa", "ballot"]

[section.line.visual]
kind = "illustration"
name = "pamphlet-mailing"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "contribution-bans"
text = "The proposal would bar regulated electric and gas utilities, and contractors with over $250,000 annually in government contracts, from giving to campaigns for offices that affect them."
sources = ["ballot", "sfa"]

[section.line.visual]
kind = "page"
source = "ballot"
highlight = ["regulated electric and gas utilities, contractors with over $250,000 annually in government contracts"]

[[section.line]]
text = "Disclosure laws would also cover ads that clearly identify a candidate or ballot question."
