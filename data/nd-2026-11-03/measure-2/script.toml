[section.line.visual]
kind = "illustration"
name = "school-meal-tray"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "Public schools would have to serve every student breakfast and lunch at no cost."
sources = ["guide", "ballot-language", "analysis"]

[section.line.visual]
kind = "page"
source = "guide"
highlight = ["one breakfast and one lunch each school day to enrolled students at no cost"]

[[section.line]]
text = "Private and tribal schools could choose to take part."
sources = ["guide", "ballot-language"]

[section.line.visual]
kind = "page"
source = "guide"
highlight = ["the option to provide the same"]

[[section.line]]
text = "The state would pay what federal funding does not, from a source the Legislature names or else Legacy Fund earnings."
