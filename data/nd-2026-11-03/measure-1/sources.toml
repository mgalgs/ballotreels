# Archived sources for North Dakota Constitutional Measure No. 1,
# 2026-11-03 general election. Every id here may be cited by script.toml.
# `kind` must be one the standard allows (docs/STANDARD.md, section 1).
#
# guide-section.pdf is pages 1 and 2 of the Secretary of State's "North
# Dakota Statewide Ballot Measure Information" (the voter-education
# mailer of NDCC 16.1-01-18), whose full URL is given; page 1 also
# carries the guide's introduction. Its "FISCAL IMPACT" box backs the
# guide-fiscal source. North Dakota requires a Legislative Council
# fiscal report only for initiated measures (NDCC 16.1-01-17), so none
# exists for this one. North Dakota publishes no official arguments for
# or against a measure, so there is no source of kind official-argument:
# both side sections say so, citing the guide, which prints none.
#
# hcr-3003-enrolled.pdf marks new text by underline and deleted text by
# strikethrough, which its extracted text loses ("heretoto"); the script
# quotes the guide and the analysis instead. hcr-3003-filed.pdf is an
# image scan of the filed resolution, archived for the record and cited
# by no line.

[contest]
id = "nd-2026-11-03-measure-1"
election = "nd-2026-11-03"
division = "ocd-division/country:us/state:nd"
kind = "measure"
title = "Constitutional Measure No. 1: Seeks to Increase the Percentage of Yes Votes Needed to Change the Constitution"

[[source]]
id = "guide"
kind = "official-title-summary"
publisher = "North Dakota Secretary of State, North Dakota Statewide Ballot Measure Information, 2026 General Election, Constitutional Measure No. 1, pages 1 and 2"
credit = "North Dakota Statewide Ballot Measure Information"
url = "https://www.sos.nd.gov/sites/default/files/documents/elections/2026-general-measure-guide.pdf"
file = "sources/guide-section.pdf"
retrieved = "2026-10-27"

[[source]]
