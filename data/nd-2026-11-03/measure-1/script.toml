# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; the two ways an amendment reaches the ballot; the vote it
# needs to pass today; what the measure would require, and the vote the
# measure itself needs; what the guide says it costs; the two sides;
# what a vote does.
#
# The card quotes the Secretary of State's "North Dakota Statewide
# Ballot Measure Information": the measure's heading, its "Placed on the
# ballot by" bullet, the ballot's explanation as the guide prints it
# (the guide's own explanation runs in two columns that pdftotext
# interleaves, so it cannot be quoted verbatim), the "FISCAL IMPACT"
# box, and the short YES and NO lines beside the ballot (the YES and NO
# labels are the boxes' own, from ballots.py).
#
# North Dakota publishes no official arguments for or against a measure;
# the guide's "What your vote means" is the Secretary of State's neutral
# description, not an argument. Both sides are filed = false and each
# says so once, in the same number of words. The fiscal impact is
# "none", so no dollar figure needs a scale. No person is named.

contest = "nd-2026-11-03-measure-1"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide"
number = "1"
title = "SEEKS TO INCREASE THE PERCENTAGE OF YES VOTES NEEDED TO CHANGE THE CONSTITUTION"
origin = "Placed on the ballot by the North Dakota Legislature"
summary = "This constitutional measure would amend and reenact section 9 of article III and section 16 of article IV of the Constitution of North Dakota. The proposed amendment would require constitutional amendments submitted to the electors, by resolution adopted by the legislative assembly and each initiative petition and measure proposing a constitutional amendment, to receive an affirmative vote of at least sixty percent of those voting on the question for enactment."
fiscal = "The estimated fiscal impact of this measure is none."
yes = "Means you support increasing the threshold to make changes to the North Dakota Constitution to require at least 60% of the vote."
no = "Means you want the threshold to make changes to the North Dakota Constitution to remain at greater than 50% of the vote."

[[section]]
id = "what"
heading = "Measure 1"

[[section.line]]
text = "Measure 1 is about the vote it takes to change North Dakota's Constitution."
