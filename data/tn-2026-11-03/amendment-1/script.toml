# Recipe E, distilled: one claim per line. The chain: what it is about;
# when bail may be refused today; which offenses the amendment lists and
# what courts must record; what the fiscal note says; the two sides;
# what a vote does, and what it takes to pass.
#
# The card quotes the Secretary of State's page: its heading
# "Constitutional Amendment #1" as the title, its "As proposed by" line
# as the origin, the Attorney General's Summary, and the page's "yes"
# and "no" lines, which are the same for every amendment. The Question
# (the full amendatory text) is too long for a card; the today line
# quotes the text it deletes from the resolution.
#
# The offenses are listed as the Attorney General's Summary lists them.
# The proof test ("when the proof is evident or the presumption great")
# is said once, in the today line; the amendment keeps it for every
# offense on its list.
#
# Fiscal: the 114th General Assembly's fiscal note estimates one cost, a
# one-time increase in local spending of $9,400 in FY26-27 for printing
# a longer sample ballot, and no other. It is spread across counties'
# printing with no budget it is compared against, so it is stated
# without a scale (STANDARD.md rule 6.5, a figure with no official
# total).
#
# Tennessee publishes no official arguments for or against an
# amendment, so both sides are filed = false and each says so once, in
# the same number of words.
#
# The page states the passing rule; the last vote line says it once, in
# the page's terms.

contest = "tn-2026-11-03-amendment-1"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "sos-page"
number = "1"
title = "Constitutional Amendment #1"
origin = "As proposed by SENATE JOINT RESOLUTION NO. 919 (113th) & SENATE JOINT RESOLUTION 25 (114th)"
summary = "This amendment changes Article I, section 15 of the Tennessee Constitution by allowing a court to hold a defendant without bail before trial when that defendant is accused of: an offense punishable by the death penalty, an act of terrorism, second degree murder, aggravated rape of a child, aggravated rape, grave torture, or any crime for which a convicted person would be required to serve eighty-five percent of their sentence. This amendment requires courts to state on the record the reasons for their decision to grant or deny bail in those cases."
yes = "A \"yes\" vote is a vote to amend the Constitution and adopt the language in the proposed amendment."
no = "A \"no\" vote is a vote to keep the current language in the Constitution unchanged."

[[section]]
id = "what"
heading = "Amendment 1"

[[section.line]]
text = "Amendment 1 is about bail before trial."
sources = ["sos-page"]

[section.line.visual]
