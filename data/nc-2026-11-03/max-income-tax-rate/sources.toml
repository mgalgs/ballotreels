# Archived sources for North Carolina's income tax rate amendment,
# 2026-11-03 general election. Every id here may be cited by
# script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# North Carolina prints no voter guide. The official explanation is the
# Legislative Services Officer's summary explanation (G.S. 147-54.10),
# two pages for all three amendments; this one is on page 2. No state
# site posts it: lso-summary-explanations.pdf is Camden County's hosted
# copy of the August 20, 2026 release (Forsyth County's copy has the
# same text), not checked byte for byte against an original from the
# Legislative Services Office. It prints the ballot question, so the
# card quotes it. Its heading repeats the bill's short title, which no
# line or card field quotes.
#
# The fiscal statement is the Fiscal Research Division's Legislative
# Fiscal Note on the bill's first edition; the amendment's text is
# unchanged in the session law. The Legislative Analysis Division's
# summary of the session law is filed as an official-title-summary, as
# North Dakota's official analyses are. North Carolina has no official
# arguments for or against an amendment.

[contest]
id = "nc-2026-11-03-max-income-tax-rate"
election = "nc-2026-11-03"
division = "ocd-division/country:us/state:nc"
kind = "measure"
title = "Constitutional Amendment - Maximum Income Tax Rate of 3.5%"

[[source]]
id = "explanation"
kind = "official-title-summary"
publisher = "Legislative Services Officer, North Carolina General Assembly, Official Summary Explanation of 2026 Constitutional Amendments (August 20, 2026), page 2; Camden County's copy"
credit = "North Carolina Legislative Services Officer, Official Summary Explanation"
url = "https://www.camdencountync.gov/DocumentCenter/View/1277/Summary-Explanation-of-2026-Constitutional-Amendments"
file = "sources/lso-summary-explanations.pdf"
retrieved = "2026-10-27"

[[source]]
