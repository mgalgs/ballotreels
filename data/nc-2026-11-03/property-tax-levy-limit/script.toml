[[section.line]]
text = "North Carolina publishes no official argument against the amendment."
sources = ["explanation"]

[section.line.visual]
kind = "list"
source = "explanation"
items = ["No official argument against was published"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A vote for requires the General Assembly to set limits on local property tax increases."
sources = ["explanation"]

[section.line.visual]
kind = "page"
source = "explanation"
highlight = ["require the General Assembly to set limits"]

[[section.line]]
