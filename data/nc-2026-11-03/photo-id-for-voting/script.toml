[[section.line]]
text = "North Carolina publishes no official argument against the amendment."
sources = ["explanation"]

[section.line.visual]
kind = "list"
source = "explanation"
items = ["No official argument against was published"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A vote for puts photo ID for all voters in the constitution."
sources = ["explanation"]

[section.line.visual]
kind = "page"
source = "explanation"
highlight = ["require all voters"]

