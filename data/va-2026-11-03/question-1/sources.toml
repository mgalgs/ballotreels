id = "explanation"
kind = "official-title-summary"
publisher = "Virginia Department of Elections, Explanation for Proposed Constitutional Amendment to Be Voted On at the November 3, 2026, Election, Question 1 (approved by the Joint Privileges and Elections Committee, June 22, 2026)"
credit = "Virginia Department of Elections, Explanation for Voters"
url = "https://www.elections.virginia.gov/media/electionadministration/electionlaw/11-3-26-Special-Explanation-for-Q1-Repro.pdf"
file = "sources/special-explanation.pdf"
