# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; what the Constitution says today; what the right would
# cover; who it would protect; what the state could still regulate; what
# the Department of Planning and Budget's statement says; the two sides;
# what a vote does.
#
# The card quotes the special explanation (Code § 30-19.9): the ballot
# question as its title, the article and section headings as its origin,
# and the "Proposed Amendment" paragraph of the EXPLANATION FOR VOTERS
# as its summary. Virginia prints no "a yes vote means" lines, so the
# card has none, and the vote lines take their meanings from the card.
#
# The neutral lines keep the explanation's and ballot question's own
# terms ("reproductive freedom", "abortion care", "pregnant person").
#
# Virginia publishes no official arguments for or against an amendment,
# so both sides are filed = false and each says so once, in the same
# number of words.
#
# Fiscal: the Department of Planning and Budget's statement gives
# $205,000 in FY2027 for the Department of Elections to give public
# notice of statewide referendums; it is the cost of the notice, not an
# effect of the amendment, and the line says so. No archived source
# states Virginia's FY2027 general fund total, so the figure is stated
# without a scale (left open). No person is named.

contest = "va-2026-11-03-question-1"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "explanation"
number = "1"
title = "Should the Constitution of Virginia be amended to (i) protect the freedom to make personal decisions about prenatal care, childbirth, postpartum care, birth control, abortion, miscarriage management, and fertility care; (ii) protect doctors, nurses, and patients from being punished for these decisions; and (iii) allow for restrictions on access to abortion during the third trimester of pregnancy except when the patient's health is at risk or the pregnancy cannot survive?"
origin = "ARTICLE I. Bill of Rights. Section 11-A. Fundamental right to reproductive freedom."
summary = "The proposed amendment would add to the Virginia Constitution's Bill of Rights the fundamental right to make and carry out decisions about a person’s own reproductive care with only certain, specific exceptions. The proposed amendment specifically allows the state government to pass laws to regulate abortion care in the third trimester of pregnancy, but requires any such law to allow for abortion care when it is medically needed to protect the life and health of the pregnant person or because the fetus is not viable."

