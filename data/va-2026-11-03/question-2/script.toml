# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; what the Constitution says today; why that ban is not
# enforced, and when it would be again, both as the explanation says;
# what the amendment would put in its place; what the Department of
# Planning and Budget's statement says; the two sides; what a vote does.
#
# The card quotes the special explanation (Code § 30-19.9): the ballot
# question as its title, the article and section headings as its origin,
# and the "Proposed Amendment" paragraph of the EXPLANATION FOR VOTERS
# as its summary. Virginia prints no "a yes vote means" lines, so the
# card has none, and the vote lines take their meanings from the card.
#
# The neutral lines keep the explanation's and ballot question's own
# terms ("same-sex marriage", "persons of the same sex or gender"). The
# explanation's account of the Supreme Court's 2015 decision is
# attributed to it, both halves: the ban is not enforceable now, and it
# would be again if the decision were overturned. The case is not named.
#
# Virginia publishes no official arguments for or against an amendment,
# so both sides are filed = false and each says so once, in the same
# number of words.
#
# Fiscal: the Department of Planning and Budget's statement gives
# $205,000 in FY2027 for the Department of Elections to give public
# notice of statewide referendums; it is the cost of the notice, not an
# effect of the amendment, and the line says so. No archived source
# states Virginia's FY2027 general fund total, so the figure is stated
# without a scale (left open). No person is named.

contest = "va-2026-11-03-question-2"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "explanation"
number = "2"
title = "Should the Constitution of Virginia be amended to (i) remove the ban on same-sex marriage; (ii) affirm that two adults may marry regardless of sex, gender, or race; and (iii) require all legally valid marriages to be treated equally under the law?"
origin = "ARTICLE I. Bill of Rights. Section 15-A. Marriage."
summary = "The proposed amendment removes the prohibition on marriages between persons of the same sex or gender from the Virginia Constitution's Bill of Rights. It is replaced with the fundamental right to marry, requiring the state to recognize and treat equally under the law any lawful marriage between two adult persons, regardless of the sex, gender, or race of either person. The proposed amendment prohibits the state from denying a marriage license to two adult persons because of their sex, gender, or race."

