# Archived sources for Virginia Question 2, 2026-11-03 general election.
# Every id here may be cited by script.toml. `kind` must be one the
# standard allows (docs/STANDARD.md, section 1).
#
# Virginia publishes, for each proposed amendment, a neutral special
# explanation (Code § 30-19.9): the "EXPLANATION FOR VOTERS", the ballot
# question and the full text. The card quotes it. The Department of
# Elections' brochure prints the same wording; its text layer prints
# each word several times, so nothing is quoted from it. Virginia
# publishes no official arguments for or against an amendment, so there
# is no source of kind official-argument.
#
# The General Assembly passed two identical referendum acts, Chapter 1
# (HB 612) and Chapter 819 (SB 311); the script cites the House's.

[contest]
id = "va-2026-11-03-question-2"
election = "va-2026-11-03"
division = "ocd-division/country:us/state:va"
kind = "measure"
title = "Question 2: Marriage"

[[source]]
id = "explanation"
kind = "official-title-summary"
publisher = "Virginia Department of Elections, Explanation for Proposed Constitutional Amendment to Be Voted On at the November 3, 2026, Election, Question 2 (approved by the Joint Privileges and Elections Committee, June 22, 2026)"
credit = "Virginia Department of Elections, Explanation for Voters"
url = "https://www.elections.virginia.gov/media/electionadministration/electionlaw/11-3-26-Special-Explanation-for-Q2-Marriage.pdf"
file = "sources/special-explanation.pdf"
retrieved = "2026-10-27"

