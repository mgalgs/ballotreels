# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; what a felony conviction means for voting today; what the
# amendment would make the right to vote; its two exceptions, felony
# incarceration and a court's finding on the act of voting; what the
# Department of Planning and Budget's statement says; the two sides;
# what a vote does.
#
# The card quotes the special explanation (Code § 30-19.9): the ballot
# question as its title, the article and section headings as its origin,
# and the first two paragraphs of the "Proposed Amendment" in the
# EXPLANATION FOR VOTERS as its summary (its four paragraphs run 170
# words). Virginia prints no "a yes vote means" lines, so the card has
# none, and the vote lines take their meanings from the card.
#
# The explanation runs 279 words; the script keeps its three main
# changes (the fundamental right, the felony rule, the incapacity rule)
# and leaves out jury service, office and notaries. It keeps the
# explanation's own terms ("period of incarceration", "the act of
# voting") and leaves out its description of today's rule as "broad"
# and "outdated". The implementing bills that take effect only if this
# passes are not on the ballot and are not described.
#
# Virginia publishes no official arguments for or against an amendment,
# so both sides are filed = false and each says so once, in the same
# number of words.
#
# Fiscal: the Department of Planning and Budget's statements on HB 963
# and SB 6 each give the same $205,000 in FY2027 for the Department of
# Elections to give public notice of statewide referendums: one cost,
# cited once (HB 963), never added. It is the cost of the notice, not an
# effect of the amendment, and the line says so. No archived source
# states Virginia's FY2027 general fund total, so the figure is stated
# without a scale (left open). No person is named.

contest = "va-2026-11-03-question-3"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "explanation"
number = "3"
title = "Should the Constitution of Virginia be amended (i) to provide for the fundamental right to vote in the Commonwealth, (ii) to revise the qualifications of voters so that a person convicted of a felony is not entitled to vote during his period of incarceration but is automatically invested with the right to vote upon release from incarceration, and (iii) to update the existing prohibition on voting by persons found to be mentally incompetent to instead apply to persons who have been found to lack the capacity to understand the act of voting?"
origin = "ARTICLE II. Franchise and Officers. Section 1. Qualifications of voters."
summary = "The proposed amendment enshrines in the Constitution the fundamental right of all qualified persons in the Commonwealth to vote. Two exceptions to this right are for persons who are serving a sentence of incarceration for a felony conviction and persons who are determined by a court to not understand the act of voting. Such right cannot otherwise be restricted by laws. Under the proposed amendment, a person who is convicted of a felony loses the right to vote during their period of incarceration. Once released from incarceration, the person gets back the right to vote without needing to apply for restoration by the Governor."

