# Archived sources for Indiana Public Question 2, 2026-11-03 general
# election. Every id here may be cited by script.toml. `kind` must be one
# the standard allows (docs/STANDARD.md, section 1).
#
# Indiana publishes no voter pamphlet and no statutory explanation for
# voters. The closest official explanation is the Indiana Election
# Division's "2026 Indiana Election Legislation Summary", written for
# election administrators; ied-summary-section.pdf is its page 1 (title,
# purpose and its caveat that "where your legal rights are involved, do
# not rely on this document") and pages 21 and 22 (the amendment's
# explanation, history and ballot text). It backs the card and the
# explanation; the enrolled resolution backs what the amendment's words
# are. Indiana publishes no official arguments for or against an
# amendment and no cost estimate, so there is no source of kind
# official-argument or official-fiscal-analysis: the side and fiscal
# sections cite the summary, which prints none.
#
# The ballot wording was set by House Enrolled Act 1019 (2026), which
# was not obtained; the summary quotes its wording, and the Hendricks
# County notice prints the same certified wording (with Public Question
# 1 and three judicial retention questions this script does not use).
#
# iga.in.gov serves a JavaScript shell to scripted fetches, so the
# enrolled resolution is the Internet Archive's raw capture of the
# official file (captured 2026-10-06; its SHA-1 matches the capture's
# digest), not compared with the live file. The url is the official one.
# In it, bold marks the added words: "Except as provided in subsection
# (b)," and the new subsection (b) on city and town court judges.

[contest]
id = "in-2026-11-03-public-question-2"
election = "in-2026-11-03"
division = "ocd-division/country:us/state:in"
kind = "measure"
title = "Public Question 2: Residence for Town and City Court Judges"

[[source]]
id = "summary"
kind = "official-title-summary"
publisher = "Indiana Election Division, 2026 Indiana Election Legislation Summary, Indiana Constitutional Amendments: Residence for Town and City Court Judges, pages 1, 21 and 22"
credit = "2026 Indiana Election Legislation Summary"
url = "https://www.in.gov/sos/elections/files/2026-Indiana-Election-Legislation-Summary.FINAL.pdf"
file = "sources/ied-summary-section.pdf"
retrieved = "2026-10-27"

[[source]]
id = "text"
kind = "official-text"
publisher = "Indiana General Assembly, House Enrolled Joint Resolution 1 (2025), amending Article 6, Section 6 of the Constitution of the State of Indiana"
credit = "House Enrolled Joint Resolution 1"
url = "https://iga.in.gov/pdf-documents/124/2025/house/resolutions/HJ0001/HJ0001.04.ENRS.pdf"
file = "sources/hjr1-2025-enrolled.pdf"
retrieved = "2026-10-27"

[[source]]
id = "county-notice"
kind = "official-title-summary"
publisher = "Hendricks County, 2026 General Election Public Questions to Be on Your Ballot"
credit = "Hendricks County, Public Questions"
url = "https://www.co.hendricks.in.us/egov/documents/1786722790_88313.pdf"
file = "sources/hendricks-county-public-questions.pdf"
retrieved = "2026-10-27"
