# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; what the Constitution says about bail today; what the
# amendment would add (two conditions under which other offenses are not
# bailable); that no cost estimate is printed; the two sides; what a
# vote does.
#
# The card quotes the Indiana Election Division's "2026 Indiana Election
# Legislation Summary": the ballot text as it prints it ("Public
# Question #1 ...") as title, the act that prescribed that ballot text as
# origin (as page 1 lists it; Public Question 2's card names its own),
# and the explanatory paragraph as summary. The summary prints no "a yes
# vote means" lines, so the card has none, and the vote lines take their
# two meanings from the ballot text on the card.
#
# What changes is read from the enrolled resolution, where bold marks the
# added words. The script narrates the new final sentence (the two
# conditions, as the ballot states them) and leaves out the added
# "unless the accused poses a substantial risk" clause for length; the
# card's summary states it.
#
# Fiscal: the summary prints no cost estimate, so the fiscal line is the
# standard one for a guide with none (the round's rule 5a). Whether the
# Legislative Services Agency wrote a fiscal note is not known.
#
# Indiana publishes no official arguments for or against an amendment,
# so both sides are filed = false and each says so once, in the same
# number of words. No person is named.

contest = "in-2026-11-03-public-question-1"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "summary"
number = "1"
title = "Public Question #1 Currently, under the Constitution of the State of Indiana, a person charged with murder or treason is not entitled to be released on bail if the proof is evident or the presumption strong. Shall the Constitution of the State of Indiana be amended to provide that a person charged with an offense other than murder or treason is not entitled to bail if: (1) the proof is evident or the presumption strong; and (2) the state proves by clear and convincing evidence that no release conditions will reasonably protect the safety of any other person or the community. (This question concerns Article 1, Section 17 of the Constitution of the State of Indiana.)"
origin = "Public Law 4-2026 (Senate Enrolled Act 3): Constitutional Amendment Ballot Language"
summary = "In 2023 and 2025 the General Assembly adopted a joint resolution proposing to amend Article 1, Section 17 of the Constitution of the State of Indiana to change the standard for who is eligible for bail after being charged with a crime. The amendment would allow the court to restrict bail to a person charged with a crime when the accused poses a substantial risk to any other person or the community. An offense other than murder or treason shall not be bailable if: (1) the proof is evident or the presumption strong; and (2) the state proves by clear and convincing evidence that no release conditions will reasonably protect the safety of any other person or the community."

