# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; how a Governor's power to pardon works today; the period the
# amendment would add, quoted from the amended Section 77, and how the
# ballot question words its end; what the fiscal
# statements say; the two sides; what a vote does.
#
# The card quotes Franklin County's sample ballot: the ballot question
# as title, the line introducing the amended section as origin, and the
# amended subsection (1), the part that changes the rule, as summary (the
# ballot prints the section's later subsections in another column). The
# ballot prints no explanation and no yes or no lines, so the card has
# none, and the vote lines take their meanings from the question and the
# text.
#
# Timing: the ballot question says the period ends "when the Governor is
# sworn in for that term"; the amendment says "ending the fifth Tuesday
# succeeding the election". The rule is quoted from the amendment, and a
# line says how the question words it.
#
# The amendment's other edits (the Governor or "he or she" for "he")
# change no rule and are left out for length.
#
# Fiscal: the ballot prints no cost estimate (the line names it "the
# ballot": "Kentucky's" fails the speakability check). The Legislative Research
# Commission's mandate statement calls the local cost of adding an
# amendment to the ballot minimal; it was written for SB 10 GA, which the
# House later amended (sources.toml), and the script says so. Its
# vendor figures are per-county ballot costs and are left out.
#
# Kentucky publishes no official arguments for or against an amendment,
# so both sides are filed = false and each says so once, in the same
# number of words. No person is named. "Governor's" is not narrated (it
# sounds like the plural).

contest = "ky-2026-11-03-amendment-1"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "sample-ballot"
number = "1"
title = "Are you in favor of limiting a Governor's ability to grant pardons or commute sentences by prohibiting him or her from granting pardons or commuting sentences during the time period beginning 60 days prior to the general election at which the Governor is elected, and ending when the Governor is sworn in for that term by amending the Constitution of Kentucky as stated below?"
origin = "It is proposed that Section 77 of the Constitution of Kentucky be amended to read as follows:"
summary = "(1) The Governor shall have power to: (a) Remit fines and forfeitures; and (b) Commute sentences and grant reprieves and pardons, except: 1. In case of impeachment; or 2. For the period beginning sixty days prior to the date of the gubernatorial election and ending the fifth Tuesday succeeding the election."

[[section]]
id = "what"
heading = "Amendment 1"

[[section.line]]
text = "Constitutional Amendment 1 is about when a Governor may grant pardons or commute sentences."
sources = ["sample-ballot"]

[section.line.visual]
kind = "page"
source = "sample-ballot"
highlight = ["grant pardons or commute sentences"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Today, the Governor may grant pardons and commute sentences, except in cases of impeachment."
sources = ["act"]

[section.line.visual]
kind = "illustration"
name = "sealed-order"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "The amendment would add an exception starting sixty days before each election for Governor."
sources = ["act", "sample-ballot"]

[section.line.visual]
kind = "page"
source = "sample-ballot"
highlight = ["For the period beginning sixty days prior to the date of the gubernatorial election"]

[[section.line]]
text = "That exception would end the fifth Tuesday succeeding the election."
sources = ["act", "sample-ballot"]

[section.line.visual]
kind = "page"
source = "sample-ballot"
highlight = ["ending the fifth Tuesday succeeding the election"]

[[section.line]]
text = "The ballot question says the exception ends when the Governor is sworn in."
