# Archived sources for Kentucky Constitutional Amendment 1, 2026-11-03
# general election. Every id here may be cited by script.toml. `kind`
# must be one the standard allows (docs/STANDARD.md, section 1).
#
# Kentucky publishes no voter pamphlet, no explanation and no Attorney
# General summary. Under KRS 118.415 the General Assembly writes the
# ballot question itself, and SB 10 has the whole question and the whole
# amended Section 77 printed on the ballot. The card quotes Franklin
# County's official sample ballot; the amendment's text is cited from
# Acts Chapter 12, the official enacted copy (bracketed words are
# deletions). sb10-final-bill.pdf, the enrolled bill, is marked
# "unofficial copy" and backs no line.
#
# Kentucky publishes no official arguments for or against an amendment,
# so there is no source of kind official-argument: both side sections
# say so, citing the ballot, which prints none.
#
# No state fiscal note exists. The Legislative Research Commission's
# Local Government Mandate Statement (2/2/26) is the one fiscal
# statement; it was written for SB 10 GA, whose title still amends
# Sections 77 and 240. House Floor Amendment 1 deleted the Section 240
# change, and the House passed the bill "w/ HFA 1" (vote history), so the
# script says the statement was written for an earlier version.
#
# The Secretary of State's "2026 Constitutional Amendments" page was read
# but not archived, and is not cited.

[contest]
id = "ky-2026-11-03-amendment-1"
election = "ky-2026-11-03"
division = "ocd-division/country:us/state:ky"
kind = "measure"
title = "Constitutional Amendment 1: Governor's Pardons Before an Election"

