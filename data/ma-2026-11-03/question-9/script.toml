# Recipe E, 60 seconds, distilled: one claim per line. The chain: that the
# question asks whether to keep a law already in effect; how the law
# passed; what it regulates today; what a repeal would do; what the
# fiscal statement says repeal would take; one point per side; what a
# vote does.
#
# Question 9 is a referendum on an existing law (Chapter 135 of the Acts
# of 2024): a YES vote KEEPS the law and a NO vote REPEALS it. Every
# line about the vote says so in the booklet's words. The law's passage
# (House 124 to 33, Senate 35 to 5, July 18, 2024) is stated as the
# booklet's ballot question states it.
#
# The card quotes the Secretary of the Commonwealth's Information for
# Voters: the question's short title, its origin, the first sentence of
# the Attorney General's summary (the summary runs to a page and a half
# of provisions, and any one of them chosen for the card would set it
# apart), the statement of fiscal consequences (whose words "this safety
# law" are the statement's own, quoted on the card and never in the
# narration), and the booklet's "A YES VOTE" and "A NO VOTE" lines. The
# narration names the law's provisions the YES line itself names. No
# person the booklet names is named.

contest = "ma-2026-11-03-question-9"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "booklet"
number = "9"
title = "Firearms Regulation"
origin = "Referendum on an Existing Law"
summary = "This law makes a number of changes to Massachusetts laws governing firearms."
fiscal = "Since the passage of this safety law in 2024, the Commonwealth has made significant investments to implement the law including training employees, promulgating new gun licensure processes, and developing IT infrastructure. Repealing the law would require the Commonwealth to expend resources in suspending or re-directing those investments."
yes = "A YES VOTE would keep in place the law, which increases the regulation of firearms, including ghost guns, machine guns, and assault-style weapons."
no = "A NO VOTE would repeal this law."

