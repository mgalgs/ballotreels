# Archived sources for Massachusetts Question 9, 2026-11-03 state
# election. Every id here may be cited by script.toml. `kind` must be one
# the standard allows (docs/STANDARD.md, section 1).
#
# The Secretary of the Commonwealth prints a question's wording, the
# Attorney General's summary, "What your vote will do", the Executive
# Office of Administration and Finance's statement of fiscal
# consequences, the 150-word arguments and the
# full text in its Information for Voters, so several sources below
# share one archived file: those pages, cut from the full booklet. The
# booklet is cited by the Secretary's own URL; sec.state.ma.us blocks
# scripted fetches, so the archived copy came from an Internet Archive
# capture of that PDF.

[contest]
id = "ma-2026-11-03-question-9"
election = "ma-2026-11-03"
division = "ocd-division/country:us/state:ma"
kind = "measure"
title = "Question 9: Firearms Regulation"

[[source]]
id = "booklet"
kind = "official-title-summary"
publisher = "Secretary of the Commonwealth of Massachusetts, Information for Voters, 2026 Ballot Questions, Question 9: ballot question, summary and What Your Vote Will Do, pages 22 to 23"
credit = "Massachusetts Information for Voters, Question 9"
url = "https://www.sec.state.ma.us/divisions/elections/download/information-for-voters/archive/IFV_2026%20English.pdf"
file = "sources/guide-section.pdf"
retrieved = "2026-10-27"

