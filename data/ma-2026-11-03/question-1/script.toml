# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; who the records law leaves out
# today; what the question would change, and what it would still keep
# private; the fiscal statement; one point per side; what a vote does.
#
# The card quotes the Secretary of the Commonwealth's Information for
# Voters: the question's short title, its origin, the Attorney General's
# summary, the Executive Office of Administration and Finance's
# statement of fiscal consequences, and the booklet's "A YES VOTE" and
# "A NO VOTE" lines.
#
# No organized group filed an argument against: the booklet prints one
# the Secretary compiled, in part from the Legislature's majority
# report. It is the booklet's official argument against, so the no side
# is a filed argument, attributed as the booklet heads it ("the argument
# against"), not to any group. No person the booklet names is named.

contest = "ma-2026-11-03-question-1"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "booklet"
number = "1"
title = "Expanding the Public Records Law"
origin = "Law Proposed by Initiative Petition"
summary = "This proposed law would make most records held by the Legislature and the Office of the Governor public records under the Massachusetts Public Records Law. This proposed law would exempt documents related to the development of public policy and communications between legislators and their constituents, if those communications are reasonably related to a constituent’s request for assistance in obtaining government-provided benefits or services or interacting with a government agency."
fiscal = "The proposed law has no discernible material fiscal consequences for state and municipal government finances."
yes = "A YES VOTE would make most records held by the Legislature and the Office of the Governor public records under the Massachusetts Public Records Law."
no = "A NO VOTE would make no change to the Massachusetts Public Records Law."

[[section]]
id = "what"
heading = "Question 1"

[[section.line]]
text = "Question 1 is about who must follow the Public Records Law."
sources = ["booklet"]

[section.line.visual]
kind = "page"
source = "booklet"
highlight = ["Expanding the Public Records Law"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Today, the Public Records Law does not cover the Legislature or the Office of the Governor."
sources = ["booklet", "text"]

[section.line.visual]
kind = "illustration"
name = "school-records"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "The question would make most of their records public."
sources = ["booklet"]

[[section.line]]
text = "Policy development documents, and constituent requests for help with government services, would be exempt."
sources = ["booklet"]

[section.line.visual]
kind = "page"
source = "booklet"
highlight = ["exempt documents related to the development of public policy"]

[[section]]
id = "fiscal"
heading = "What it would cost"

[[section.line]]
text = "The Executive Office of Administration and Finance finds no discernible material fiscal consequences."
sources = ["fiscal"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say the Legislature and the Office of the Governor should follow the records law every city, town and state agency follows."
sources = ["arguments"]
basis = ["Every city, town, and state agency must follow that law, but the politicians on Beacon Hill exempted themselves.", "Question 1 puts the Legislature and the Governor’s office under the same public records law as everyone else."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Same public records law as everyone else", "Protects constituent privacy at no cost to taxpayers"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "The argument against says the limited exemptions would chill talk by lawmakers, and expose letters from residents, deterring them from contacting officials."
sources = ["arguments"]
basis = ["This limited and temporary exemption will chill open communications by lawmakers", "the law leaves vulnerable to public disclosure all other general constituent communications, such as emails and letters from citizens", "deter residents from contacting their elected officials"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Limited exemptions would chill talk by lawmakers", "Exposes residents' letters and deters contact with officials"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote would make most records of the Legislature and the Office of the Governor public."
sources = ["booklet"]

[section.line.visual]
kind = "page"
source = "booklet"
highlight = ["A YES VOTE would make most records held"]

[[section.line]]
text = "A no vote would make no change to the Public Records Law."
sources = ["booklet"]

[section.line.visual]
kind = "page"
source = "booklet"
highlight = ["A NO VOTE would make no change"]
