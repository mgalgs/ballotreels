# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; that local zoning decides today; the lots the question would
# open to single-family homes, and what towns could still regulate; the
# fiscal statement; one point per side; what a vote does.
#
# The card quotes the Secretary of the Commonwealth's Information for
# Voters: the question's short title, its origin, the first paragraph of
# the Attorney General's summary (the second, on local regulation, runs
# past the vote lines in the booklet's text; the narration states it),
# the statement of fiscal consequences, and the booklet's "A YES VOTE"
# and "A NO VOTE" lines. No figure here is government money. No person
# the booklet names is named.

contest = "ma-2026-11-03-question-7"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "booklet"
number = "7"
title = "Single Family Homes"
origin = "Law Proposed by Initiative Petition"
summary = "This proposed law would allow single-family homes to be built in a residentially zoned area as long as the land on which it is to be constructed is at least 5,000 square feet, has at least 50 feet of land bordering the street, road, or public way that it faces, and has access to public sewer and water services."
fiscal = "If the proposed law enables the growth of housing in communities, it could provide positive new growth revenues to municipalities. However, it is difficult to project the potential scale of new growth tied to the proposed law. The proposed law thus has no discernible material fiscal consequences for state and municipal government finances."
yes = "A YES VOTE would allow single-family homes to be built on lots of 5,000 square feet or more in residential areas, subject to reasonable local regulation of certain aspects of those homes."
no = "A NO VOTE would make no change to the law relative to building single-family homes."

[[section]]
id = "what"
heading = "Question 7"

[[section.line]]
text = "Question 7 is about where single-family homes may be built."
sources = ["booklet"]

[section.line.visual]
kind = "page"
source = "booklet"
highlight = ["Single Family Homes"]

[[section]]
