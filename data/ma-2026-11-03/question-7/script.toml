[section.line.visual]
kind = "illustration"
name = "home-building"

[[section]]
id = "fiscal"
heading = "What it would cost"

[[section.line]]
text = "The Executive Office of Administration and Finance finds no discernible material fiscal consequences, since new growth is hard to project."
sources = ["fiscal"]

[section.line.visual]
kind = "illustration"
