[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "The question would allow single-family homes on residential lots of at least 5,000 square feet, with public water and sewer."
sources = ["booklet"]

[section.line.visual]
kind = "page"
source = "booklet"
highlight = ["at least 5,000 square feet"]

[[section.line]]
text = "Towns could still reasonably regulate height, spacing, parking and short-term rentals."
