# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; how primaries work today; the one all-party primary the
# question would set up, and the top two it would send on; when it would
# start; the fiscal statement; one point per side; what a vote does.
#
# The card quotes the Secretary of the Commonwealth's Information for
# Voters: the question's short title, its origin, the Attorney General's
# summary (its first three paragraphs: pdftotext reads the fourth, on
# party status, after the vote lines, so it cannot be quoted as one
# passage), the statement of fiscal consequences (printed without a
# closing full stop, and quoted so), and the booklet's "A YES VOTE" and
# "A NO VOTE" lines. "Top two" is the booklet's own phrase. The
# opponents' comparison with other states' systems is theirs and stays
# in their section. No person the booklet names is named.

contest = "ma-2026-11-03-question-3"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "booklet"
number = "3"
title = "State Primary Elections"
origin = "Law Proposed by Initiative Petition"
summary = "This proposed law would eliminate political party primaries for state elections and instead establish a system where there would be a single, all-party primary in which all candidates, regardless of their party affiliation, would be listed on one ballot, and voters could vote for any candidate on the ballot. The two candidates receiving the most votes in the primary would advance to the general election ballot. This proposed law would require candidates for governor and lieutenant governor to run and be listed jointly on the ballot in the primary."
fiscal = "The proposed law has no discernible material fiscal consequences for state and municipal government finances"
yes = "A YES VOTE would eliminate separate party primaries for state elections and require a single primary in which all candidates appear on one ballot, voters could vote for any candidate, and the top two candidates would advance to the general election."
no = "A NO VOTE would make no change to the laws governing primary elections."

