# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; that a revenue limit and refunds exist today; the new limit
# and the refund above it; what the fiscal statement says it would leave
# for the budget and the rainy day fund; one point per side; what a vote
# does.
#
# The card quotes the Secretary of the Commonwealth's Information for
# Voters: the question's short title, its origin, the Attorney
# General's summary up to its start date (the start date and
# severability paragraphs run past the vote lines in the booklet's text
# and are left off), the statement of fiscal consequences, and the
# booklet's "A YES VOTE" and "A NO VOTE" lines.
#
# The fiscal statement gives no dollar figure, so no budget scale is
# needed. That the surtax on incomes over $1 million would count toward
# the limit is in the summary on the card, and the opponents' own point;
# the narration leaves it to their section (rule 6.3). The legislative
# reports in the booklet also discuss a tax change that is not on the
# ballot; the script does not mention it. No person the booklet names is
# named.

contest = "ma-2026-11-03-question-5"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "booklet"
number = "5"
title = "State Revenue Limit & Rebate"
origin = "Law Proposed by Initiative Petition"
summary = "This proposed law would change the limit on how much revenue the state can collect in a given year. The proposal would limit state revenue in a given year to the net amount of state revenue from the year before, increased by a rate equal to the average growth of wages and salaries in Massachusetts over the most recent three years. If revenue collected by the state in a given year exceeds the limit, the excess amount would be refunded to taxpayers the following year. The proposed law would include all revenue from the surtax on incomes over $1 million when calculating the revenue limit and when determining whether state revenue exceeds the limit."
fiscal = "The proposed law would put stricter limits on allowable annual revenue growth available for budgeting. As a result, the proposal would reduce the amount of money available to support the state budget, which includes local aid for schools and municipal budgets. The proposal would also reduce the amounts available to build the state’s Stabilization, or “rainy day,” Fund – a reserve of money set aside to help Massachusetts manage economic downturns or emergencies without raising taxes or making major spending cuts. Depending on future conditions, the proposal could change the frequency of statutorily-required refunds to taxpayers."
yes = "A YES VOTE would change the limit on state revenue collection, tying it to prior year collections plus average wage and salary growth, and provide for a rebate of revenue exceeding that limit."
no = "A NO VOTE would make no change in the law relative to state revenue collection."

