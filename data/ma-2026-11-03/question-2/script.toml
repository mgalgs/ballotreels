# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; that the state's public employee labor law does not name
# CPCS as an employer today; what the question would change, and the
# funding request it would require; the fiscal statement; one point per
# side; what a vote does.
#
# The card quotes the Secretary of the Commonwealth's Information for
# Voters: the question's short title, its origin, the Attorney General's
# summary, the statement of fiscal consequences, and the booklet's "A
# YES VOTE" and "A NO VOTE" lines ("Committee for Public Counsel
# Service employees" as printed). CPCS is spelled out on first use, as
# the summary does.
#
# No organized group filed an argument against: the booklet prints one
# the Secretary compiled, in part from the Legislature's majority
# report. It is the booklet's official argument against, so the no side
# is a filed argument, attributed as the booklet heads it ("the argument
# against"), not to any group. No person the booklet names is named.

contest = "ma-2026-11-03-question-2"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "booklet"
number = "2"
title = "Collective Bargaining for CPCS Employees"
origin = "Law Proposed by Initiative Petition"
summary = "This proposed law would specify that employees of the Committee for Public Counsel Services (“CPCS”) are permitted to engage in collective bargaining with their employer. It would also require CPCS, after executing a collective bargaining agreement, to request the appropriation necessary to fund such agreement from the Governor."
fiscal = "The proposed law may have an impact on state finances. CPCS receives its funding, in part, from state government appropriations. The fiscal impact of the proposed law is difficult to project due to the uncertainty regarding the outcomes of any such collective bargaining by CPCS employees."
yes = "A YES VOTE would specify that Committee for Public Counsel Services employees may form a union to collectively bargain with their employer."
no = "A NO VOTE would make no change to the law governing labor relations for Committee for Public Counsel Service employees."

