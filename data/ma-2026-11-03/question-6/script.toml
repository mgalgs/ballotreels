# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; where the sales taxes on sporting goods go today; how much
# of them the new fund would get, and when; what the fiscal statement
# says it would divert and cost; one point per side; what a vote does.
#
# The card quotes the Secretary of the Commonwealth's Information for
# Voters: the question's short title, its origin, the first paragraph of
# the Attorney General's summary (the rest, on the board, its rules and
# reports, runs past the vote lines in the booklet's text and does not
# fit the card), the statement of fiscal consequences, and the booklet's
# "A YES VOTE" and "A NO VOTE" lines.
#
# The fiscal statement's "tens of millions of dollars" a year is
# government money, compared with the state operating budget it names,
# but no archived source states that budget's total, so the figure is
# stated without a scale (left open for the host to add one). That the
# money is subject to appropriation is in the summary, so the change
# line states it in the summary's words; the argument against's point
# that the Legislature may not fund it stays in that section.
# The supporters' "$100 million/year" is left off for the same want of a
# scale.
#
# No organized group filed an argument against: the booklet prints one
# the Secretary compiled, in part from the Legislature's majority
# report. It is the booklet's official argument against, so the no side
# is a filed argument, attributed as the booklet heads it ("the argument
# against"), not to any group. No person the booklet names is named.

contest = "ma-2026-11-03-question-6"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "booklet"
number = "6"
title = "Natural Resource Conservation Fund"
origin = "Law Proposed by Initiative Petition"
summary = "This proposed law would establish a Nature for All Fund that, subject to appropriation by the Legislature, would receive 50% of state taxes collected from the sale and use of sporting goods, recreational vehicles, and golf courses for the first year of its operation. After July 1, 2028, the Nature for All Fund would begin receiving, subject to appropriation by the Legislature, 100% of state taxes collected on the sale and use of sporting goods, recreational vehicles, and golf courses."
fiscal = "The proposed law would have a significant impact on state and local budgets. While a full fiscal analysis is not feasible, it is estimated that, on an annual basis, the proposed law would automatically divert tens of millions of dollars of tax receipts that are currently supporting the state operating budget to the new fund. This proposed law would also have substantial implementation costs."
yes = "A YES VOTE would create a fund that could be utilized for natural resource conservation that would receive some state taxes collected on the sale and use of sporting goods and recreational vehicles, and the use of golf courses."
no = "A NO VOTE would not create this natural resource conservation fund or change how sales and use taxes are spent."

