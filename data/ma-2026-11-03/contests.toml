# Contest index for the 2026-11-03 Massachusetts state election
# (docs/ARCHITECTURE.md). One [[contest]] entry per contest on the
# ballot. `number` is a ballot question's number (a string), as the
# Secretary of the Commonwealth's Information for Voters prints it
# ("QUESTION 1"); the Attorney General's petition numbers (25-14 and so
# on) appear nowhere. Titles pair the designation with the question's
# short title as the booklet prints it. The nine are all of the
# statewide ballot questions, in ballot order: eight laws proposed by
# initiative petition and one referendum on an existing law.

[election]
id = "ma-2026-11-03"
state = "ocd-division/country:us/state:ma"
title = "Massachusetts State Election, November 3, 2026"

[[contest]]
id = "ma-2026-11-03-question-1"
kind = "measure"
division = "ocd-division/country:us/state:ma"
title = "Question 1: Expanding the Public Records Law"
number = "1"

