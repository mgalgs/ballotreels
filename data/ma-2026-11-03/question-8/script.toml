# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; the laws that allow and tax retail sales today; what the
# question would repeal, and when; what possession and medical use it
# would keep; the revenue the fiscal statement says the taxes raised;
# one point per side; what a vote does.
#
# The card quotes the Secretary of the Commonwealth's Information for
# Voters: the question's short title, its origin, the first paragraph of
# the Attorney General's summary (the rest, on penalties under 21,
# licensed businesses and the start date, runs past the vote lines in
# the booklet's text and does not fit the card), the statement of fiscal
# consequences, and the booklet's "A YES VOTE" and "A NO VOTE" lines.
#
# The fiscal statement's about $280 million in state revenue and $50
# million in local revenue in fiscal year 2025 are government money and
# take a scale (the state's and local budgets for that year), but no
# archived source states those totals, so the figures are stated
# without a scale (left open for the host to add one). For the same
# reason neither side's money figure ("$4.50" for every "$1", "billions
# of dollars") is narrated. No person the booklet names is named.

contest = "ma-2026-11-03-question-8"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "booklet"
number = "8"
title = "Prohibit Retail Sale of Adult Recreational Use Marijuana"
origin = "Law Proposed by Initiative Petition"
summary = "The proposed law would change the type and amount of marijuana that may legally be possessed in Massachusetts by repealing the laws that legalize, regulate, and tax the retail sale of adult recreational use marijuana in Massachusetts. The proposed law would also permit persons 21 years of age and older to possess 1 ounce or less of marijuana including no more than 5 grams in the form of concentrate, and to gift or transfer to another person 21 years of age and older 1 ounce or less of marijuana including no more than 5 grams in the form of concentrate. The proposed law would also impose a civil penalty of $100 and forfeiture of the marijuana for the possession of marijuana between the weight of 1 and 2 ounces."
fiscal = "By repealing the laws that legalize and tax the retail sale of adult recreational use marijuana, the proposed law would reduce the amount that state and municipal governments receive from the taxation of those sales. In fiscal year 2025, taxation of the retail sale of adult recreational use marijuana raised approximately $280 million in state revenue and $50 million in local revenue. The state budget, which is supported by tax revenue, funds local aid for schools and municipal budgets."
yes = "A YES VOTE would prohibit the legalization, regulation, and taxation of the retail sale of adult recreational use marijuana, and change the penalties for possession of marijuana."
no = "A NO VOTE would make no change to the law relative to marijuana."

