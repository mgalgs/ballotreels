# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about (a referendum on a law the General Assembly passed); the
# boundaries today; what the law does and how it reached the ballot;
# what the State Auditor's fiscal note summary says; the two sides; what
# a vote does.
#
# The card quotes the Secretary of State's "2026 Ballot Measures" page:
# the Official Ballot Title's question as title, "Proposed by Referendum
# Petition" as origin, the Fair Ballot Language's tax sentence as
# summary, the fiscal note summary paragraph printed under the title as
# fiscal (headed "Fiscal Note Summary", as the State Auditor's fiscal
# note heads it), and the Fair Ballot Language's "yes" and "no" vote
# sentences. (The title says "2025 Second Extraordinary Session", the
# "yes" sentence "2025 Extraordinary Session"; both are quoted as
# printed.)
#
# Nothing official in hand states the map's partisan effect, so the
# script states none, and names no district's member or party. The
# ballot title's "keep more counties intact" is the yes side's claim
# about the map, so only the card shows it; the narration does not.
#
# Missouri publishes no official arguments for or against a measure:
# both sides are filed = false and each says so once, in the same number
# of words. No person is named.
#
# Highlights in the YES and NO boxes balance at one each, one phrase per
# vote line.

contest = "mo-2026-11-03-proposition-a"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "sos-page"
number = "A"
title = "Do the people of the state of Missouri approve the act of the General Assembly entitled \"House Bill No. 1 (2025 Second Extraordinary Session),\" which repeals Missouri's existing congressional plan, and replaces it with new congressional boundaries that keep more counties intact?"
origin = "Proposed by Referendum Petition"
summary = "If passed, this measure will have no impact on taxes."
fiscal = "State and local governmental entities estimate no costs or savings."
yes = "A \"yes\" vote will approve the act of the General Assembly entitled \"House Bill No. 1 (2025 Extraordinary Session),\" which redraws the congressional district boundaries."
no = "A \"no\" vote will leave in place the congressional district boundaries enacted in 2022."

[[section]]
id = "what"
heading = "Proposition A"

[[section.line]]
text = "Proposition A is a referendum on a law the General Assembly already passed: a new congressional map."
sources = ["sos-page", "fiscal-note"]

[section.line.visual]
kind = "page"
source = "sos-page"
highlight = ["Do the people of the state of Missouri approve the act of the General Assembly"]

[[section]]
