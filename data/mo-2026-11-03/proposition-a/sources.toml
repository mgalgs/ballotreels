# Archived sources for Missouri Proposition A, 2026-11-03 general
# election. Every id here may be cited by script.toml. `kind` must be one
# the standard allows (docs/STANDARD.md, section 1).
#
# Missouri has no voter pamphlet. The official statewide summary is the
# Secretary of State's "2026 Ballot Measures" page: each measure's
# Official Ballot Title (the question, then the State Auditor's fiscal
# note summary) and its Fair Ballot Language (what a "yes" and a "no"
# vote will do, and a sentence on taxes). The host returns 403 to
# scripted fetches, so the archived copy is a verbatim snapshot of the
# page as rendered in Chrome. It backs the card (sos-page). The State
# Auditor's fiscal note prints the same summary paragraph under the
# heading "Fiscal Note Summary".
#
# Missouri publishes no official arguments for or against a measure, so
# there is no source of kind official-argument: both side sections say
# so, citing the page, which prints none.
#
# The referendum petition (2026-r004.pdf) and the certificate of
# sufficiency (2026-r004webcert.pdf) are also archived, but are image
# scans with no text layer; nothing in the script rests on them, so they
# are not listed here.

[contest]
id = "mo-2026-11-03-proposition-a"
election = "mo-2026-11-03"
division = "ocd-division/country:us/state:mo"
kind = "measure"
title = "Proposition A: Congressional District Boundaries"

[[source]]
id = "sos-page"
kind = "official-title-summary"
publisher = "Missouri Secretary of State, 2026 Ballot Measures: Proposition A, Official Ballot Title and Fair Ballot Language"
credit = "Missouri Secretary of State, 2026 Ballot Measures"
url = "https://www.sos.mo.gov/petitions/2026BallotMeasures"
file = "sources/sos-2026-ballot-measures-page.txt"
retrieved = "2026-10-27"

[[source]]
id = "fiscal-note"
kind = "official-fiscal-analysis"
publisher = "Missouri State Auditor's Office, Fiscal Note (26-R004), October 17, 2025"
credit = "Missouri State Auditor, Fiscal Note"
url = "https://auditor.mo.gov/FiscalNote/ViewFiscalNoteFile/1702"
file = "sources/proposition-a-auditor-fiscal-note.pdf"
retrieved = "2026-10-27"

[[source]]
id = "text"
kind = "official-text"
publisher = "Missouri General Assembly, House Bill No. 1, Truly Agreed To and Finally Passed (103rd General Assembly, Second Extraordinary Session of the First Regular Session, 2025)"
credit = "HB 1, Truly Agreed To and Finally Passed"
url = "https://documents.house.mo.gov/billtracking/bills254/hlrbillspdf/3344H.01T.pdf"
file = "sources/proposition-a-full-text-hb1-2025-2nd-extraordinary-truly-agreed.pdf"
retrieved = "2026-10-27"

[[source]]
id = "map"
kind = "official-text"
publisher = "Missouri House of Representatives, map of the congressional districts in House Bill No. 1, Truly Agreed To and Finally Passed (2025 Second Extraordinary Session)"
credit = "HB 1 congressional district map"
url = "https://documents.house.mo.gov/billtracking/bills254/maps/map.3344H.01T.pdf"
file = "sources/proposition-a-map-hb1-truly-agreed.pdf"
retrieved = "2026-10-27"
