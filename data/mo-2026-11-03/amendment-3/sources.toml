# Archived sources for Missouri Amendment 3, 2026-11-03 general election.
# Every id here may be cited by script.toml. `kind` must be one the
# standard allows (docs/STANDARD.md, section 1).
#
# Missouri has no voter pamphlet. The official statewide summary is the
# Secretary of State's "2026 Ballot Measures" page: each measure's
# Official Ballot Title (the question, then the State Auditor's fiscal
# note summary) and its Fair Ballot Language (what a "yes" and a "no"
# vote will do, and a sentence on taxes). The host returns 403 to
# scripted fetches, so the archived copy is a verbatim snapshot of the
# page as rendered in Chrome. It backs the card (sos-page). The State
# Auditor's fiscal note prints the same summary paragraph under the
# heading "Fiscal Note Summary", with the agency responses behind it.
#
# Missouri publishes no official arguments for or against a measure, so
# there is no source of kind official-argument: both side sections say
# so, citing the page, which prints none.
#
# The signed resolution (hcshjr73-signedcopy.pdf) and the certificate of
# the official ballot title (secondrevisedhcshjr73webcert.pdf) are also
# archived, but are image scans with no text layer; nothing in the
# script rests on them, so they are not listed here.

[contest]
id = "mo-2026-11-03-amendment-3"
election = "mo-2026-11-03"
division = "ocd-division/country:us/state:mo"
kind = "measure"
title = "Amendment 3: Abortion and Gender Transition Procedures for Minors"

[[source]]
id = "sos-page"
kind = "official-title-summary"
publisher = "Missouri Secretary of State, 2026 Ballot Measures: Amendment 3, Official Ballot Title and Fair Ballot Language"
credit = "Missouri Secretary of State, 2026 Ballot Measures"
url = "https://www.sos.mo.gov/petitions/2026BallotMeasures"
file = "sources/sos-2026-ballot-measures-page.txt"
retrieved = "2026-10-27"

[[source]]
id = "fiscal-note"
kind = "official-fiscal-analysis"
publisher = "Missouri State Auditor's Office, Fiscal Note (26-HCS HJR 73), June 18, 2025"
credit = "Missouri State Auditor, Fiscal Note"
url = "https://auditor.mo.gov/FiscalNote/ViewFiscalNoteFile/1618"
file = "sources/amendment-3-auditor-fiscal-note.pdf"
retrieved = "2026-10-27"

[[source]]
id = "text"
kind = "official-text"
publisher = "Missouri General Assembly, House Committee Substitute for House Joint Resolution No. 73, Truly Agreed To and Finally Passed (103rd General Assembly, First Regular Session)"
credit = "HCS HJR 73, Truly Agreed To and Finally Passed"
url = "https://documents.house.mo.gov/billtracking/bills251/hlrbillspdf/2454H.05T.pdf"
file = "sources/amendment-3-full-text-hcs-hjr73.pdf"
retrieved = "2026-10-27"
