# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about (both subjects, equally); what the Constitution provides
# today; what the amendment would change, for abortion and for gender
# transition procedures for minors; what the State Auditor's fiscal note
# summary says; the two sides; what a vote does.
#
# The card quotes the Secretary of State's "2026 Ballot Measures" page:
# the Official Ballot Title's question as title (its five lines run
# together as printed; the card sets one paragraph), the resolution it
# was proposed by as origin, the Fair Ballot Language's tax sentence as
# summary, the fiscal note summary paragraph printed under the title as
# fiscal (headed "Fiscal Note Summary", as the State Auditor's fiscal
# note heads it), and the Fair Ballot Language's "yes" and "no" vote
# sentences.
#
# Wording: every description of the change is the Fair Ballot Language's
# own ("repeal", "allow restriction of abortions to cases of medical
# emergency, rape and incest under twelve weeks gestation, and fetal
# anomalies", "prohibit gender transition procedures for minors ...
# with exceptions for specific medical conditions"), and Section 36 is
# described only as the page does ("approved by the voters in 2024",
# "reproductive healthcare rights, including abortion through fetal
# viability"). The narration says "Section 36", not "Article I, Section
# 36", so the transcript check does not meet a Roman numeral; the card
# keeps the full name. The resolution's own summary statement (its
# Section B) is not the certified ballot title and is not used.
#
# Missouri publishes no official arguments for or against a measure:
# both sides are filed = false and each says so once, in the same number
# of words. No person is named.
#
# Highlights in the YES and NO boxes balance at three each: "rape and
# incest under twelve weeks gestation", which both boxes print (one
# each), then two per vote line.

contest = "mo-2026-11-03-amendment-3"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "sos-page"
number = "3"
title = "Shall the Missouri Constitution be amended to: Repeal the 2024 voter-approved Amendment providing reproductive healthcare rights, including abortion through fetal viability; Allow abortions for rape and incest (under twelve-weeks' gestation), emergencies, and fetal anomalies; Allow legislation regulating abortion; Ensure parental consent for minors' abortions; Prohibit gender transition procedures for minors?"
origin = "Proposed by 103rd General Assembly (First Regular Session) HCS HJR 73"
summary = "If passed, this measure will not increase or decrease taxes."
fiscal = "State governmental entities estimate no costs or savings. Greene County estimates it may experience an unknown increase in tax revenue. Other local governmental entities estimate no costs or savings."
yes = "A \"yes\" vote will repeal Article I, Section 36, of the Missouri Constitution approved by the voters in 2024 which provided reproductive healthcare rights, including abortion through fetal viability; continue to ensure women's ability to access medical care for medical emergencies, ectopic pregnancies, and miscarriages; allow legislation to regulate abortion providers and facilities to ensure health and safety; require informed and voluntary consent for an abortion, including parental or judicial consent for minors; allow restriction of abortions to cases of medical emergency, rape and incest under twelve weeks gestation, and fetal anomalies; prohibit public funding of abortions except in limited circumstances; and prohibit gender transition procedures for minors including gender transition surgeries, cross-sex hormones or puberty-blocking drugs, with exceptions for specific medical conditions."
no = "A \"no\" vote will leave Article I, Section 36, of the Missouri Constitution approved by voters in 2024 in place; will not limit abortion to cases of medical emergency, rape and incest under twelve weeks gestation, and fetal anomalies, but leave access to abortion available through fetal viability; will not prohibit gender transition procedures for minors."

