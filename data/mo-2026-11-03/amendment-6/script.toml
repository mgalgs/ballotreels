# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; the right citizens have today; what the amendment would
# change (a fundamental right, court review of ballot summaries, an 80
# percent vote of each chamber to change a law enacted by initiative)
# and what it would keep (signature and majority requirements); what the
# State Auditor's fiscal note summary says; the two sides; what a vote
# does.
#
# The card quotes the Secretary of State's "2026 Ballot Measures" page:
# the Official Ballot Title's question as title (its five lines run
# together as printed; the card sets one paragraph), "Proposed by
# Initiative Petition" as origin, the Fair Ballot Language's tax
# sentence as summary, the fiscal note summary paragraph printed under
# the title as fiscal (headed "Fiscal Note Summary", as the State
# Auditor's fiscal note heads it), and the Fair Ballot Language's "yes"
# and "no" vote sentences.
#
# The petition's full text is an image scan with no text layer, so every
# claim is the page's or the fiscal note's. The petition's filer, named
# in the fiscal note, is not named: no one is named on the other side.
# The "no" sentence's "which already give citizens the right to propose
# initiatives and referenda" is said once, in Today, without "already".
#
# Missouri publishes no official arguments for or against a measure:
# both sides are filed = false and each says so once, in the same number
# of words.
#
# Highlights in the YES and NO boxes balance at two each, both from the
# vote lines.

contest = "mo-2026-11-03-amendment-6"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "sos-page"
number = "6"
title = "Shall the Missouri Constitution be amended to: expand the initiative and referendum petition process by making it a fundamental right; allow courts to revise ballot summaries through lawsuits; prohibit the legislature from weakening initiative or referendum powers; prohibit the legislature from changing or repealing laws enacted through the initiative process, or passing laws similar to those rejected by referendum, without approval from at least 80% of both chambers; and preserve existing majority vote and signature requirements for initiative and referendum petitions?"
origin = "Proposed by Initiative Petition"
summary = "If passed, this measure will not increase or decrease taxes."
fiscal = "State and local governmental entities estimate no costs or savings."
yes = "A \"yes\" vote will prohibit the people's elected representatives from directly amending or changing any law enacted through the initiative process; require that any modifications to laws enacted through the initiative process be referred to the people by a vote of at least 80% of each chamber of the General Assembly; restrict the legislature from passing laws that limit the ability to pursue initiatives and referenda; maintain the current signature requirements of five percent of the individual legal voters in each of two-thirds of Missouri's congressional districts for proposing a law; maintain the current signature requirement of eight percent of individual legal voters in each of two-thirds of Missouri's congressional districts for proposing a constitutional amendment; and maintain the current requirement that a simple statewide majority of votes cast on a measure by individual legal voters is sufficient to enact any law or constitutional amendment."
no = "A \"no\" vote will not change the current constitutional provisions, which already give citizens the right to propose initiatives and referenda."

