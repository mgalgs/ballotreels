# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; what Medicaid is and what the 2022 expansion added; who pays
# for the expansion today; what Amendment I would change; that the
# pamphlet includes no cost estimate; one point per side; what a vote
# does.
#
# The card quotes South Dakota's 2026 Ballot Question Pamphlet: the
# Attorney General's title, the closing passage of the "Attorney General
# Explanation" (the part on what the amendment does), and the pamphlet's
# "Vote “Yes”" and "Vote “No”" lines. The pamphlet prints no fiscal note,
# so the card has no fiscal quote.
#
# Both sides filed statements. Each side's own figures (the people
# covered, the yearly cost of a lower federal share, the income limits)
# stay with that side's statement and out of the narration. "Washington"
# is the supporters' word; neutral lines say "the federal government".

contest = "sd-2026-11-03-amendment-i"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "pamphlet"
number = "I"
title = "An Amendment to the South Dakota Constitution that Repeals Expanded Medicaid Coverage if Federal Funding for the Program Drops below 90%."
origin = "Constitutional Amendment I"
summary = "Currently, federal law requires the federal government to fund 90% of South Dakota’s Medicaid expansion. This proposed Constitutional Amendment ends the expanded Medicaid coverage if the federal funding for expansion drops below 90%. If federal funding drops below that 90% threshold, Medicaid coverage will once again only apply to low-income children, pregnant women, disabled individuals, and the elderly."
yes = "Vote “Yes” to adopt the amendment."
no = "Vote “No” to leave the Constitution as it is."

[[section]]
id = "what"
heading = "Amendment I"

[[section.line]]
text = "Amendment I is about what happens to Medicaid expansion if federal funding falls."
sources = ["pamphlet"]

[section.line.visual]
kind = "page"
source = "pamphlet"
highlight = ["Repeals Expanded Medicaid Coverage"]

[[section]]
