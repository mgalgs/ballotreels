# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; what the constitution says about voters today; what
# Amendment J would add, and how the Attorney General's explanation
# describes it; that the pamphlet includes no cost estimate; one point
# per side; what a vote does.
#
# The card quotes South Dakota's 2026 Ballot Question Pamphlet: the
# Attorney General's title and explanation, and the pamphlet's
# "Vote “Yes”" and "Vote “No”" lines. The pamphlet prints no fiscal note,
# so the card has no fiscal quote.
#
# Both sides filed statements. The pro statement calls the measure
# "Amendment G" in several places (its author's error); the narration
# never says that letter, and the yes side's basis quotes only sentences
# without it. The page's two columns come out of pdftotext interleaved
# line by line, so the yes basis quotes passages that stay whole in its
# text: a sentence's end, and a fragment of the loophole sentence. The
# con statement's figure (the non-citizens removed from the rolls in
# 2024) stays with that statement and out of the narration.

contest = "sd-2026-11-03-amendment-j"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "pamphlet"
number = "J"
title = "An Amendment to the South Dakota Constitution Clarifying that an Individual Must Be a Citizen of the United States to be Eligible to Vote."
origin = "Constitutional Amendment J"
summary = "Article VII, § 2 of the South Dakota Constitution defines who is qualified to vote in state elections. Among these qualifications are age, residency, and United States citizenship requirements. Article VII, § 2 also establishes that individuals may be disqualified from voting because of mental incompetence or a felony conviction. This constitutional amendment adds people who are not United States citizens to the list of individuals disqualified from voting, clarifying the existing requirement that only citizens may vote in state elections."
yes = "Vote “Yes” to adopt the amendment."
no = "Vote “No” to leave the Constitution as it is."

