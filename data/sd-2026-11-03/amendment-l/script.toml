# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; the vote an amendment needs today; what Amendment L would
# require, and what it would cover; which rule decides Amendment L
# itself; that the pamphlet includes no cost estimate; one point per
# side; what a vote does.
#
# The card quotes South Dakota's 2026 Ballot Question Pamphlet: the
# Attorney General's title and explanation, and the pamphlet's
# "Vote “Yes”" and "Vote “No”" lines. The pamphlet prints no fiscal note,
# so the card has no fiscal quote.
#
# Both sides filed statements. The opponents' history of earlier votes
# (the 2018 and 2022 amendments) is their argument, and stays with their
# statement and out of the narration.

contest = "sd-2026-11-03-amendment-l"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "pamphlet"
number = "L"
title = "An Amendment to the South Dakota Constitution Requiring that a Proposed Constitutional Amendment or Revision Receive an Affirmative Vote of Sixty Percent of the Votes Cast."
origin = "Constitutional Amendment L"
summary = "The State Constitution provides that any proposed constitutional amendment or revision must be submitted to the voters for approval. Currently, a proposed constitutional amendment or revision becomes part of the Constitution if approved by a majority of the votes cast. This proposed Constitutional Amendment increases the number of votes required for a proposed constitutional amendment or revision to become part of the Constitution. If passed, further constitutional amendments must receive an affirmative vote of sixty percent of the votes cast to be implemented."
yes = "Vote “Yes” to adopt the amendment."
no = "Vote “No” to leave the Constitution as it is."

