# Contest index for the 2026-11-03 South Dakota general election
# (docs/ARCHITECTURE.md). One [[contest]] entry per contest on the
# ballot. `number` is a measure's ballot designation (a string). Titles
# pair the designation with the Attorney General's title as the 2026
# Ballot Question Pamphlet prints it, shortened in its own words.

[election]
id = "sd-2026-11-03"
state = "ocd-division/country:us/state:sd"
