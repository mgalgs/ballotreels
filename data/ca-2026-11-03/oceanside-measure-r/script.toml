# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks; the charter today; who put it on the ballot and what it needs to
# pass; what would change (prevailing wages written in, project labor
# agreements allowed, what such an agreement is); no cost estimate; one
# line per side; what a vote does.
#
# The City Clerk's site refused downloads; the guide prints the ballot
# label, the City Attorney's Impartial Analysis, all four arguments and
# rebuttals and the full text, which cover what the standard needs.
#
# Whether the city is at risk of losing state funding today is the
# contest's one disputed fact: supporters say the charter puts the
# funding at risk, opponents that the city already qualifies. Each is
# that side's point, so neither is told in the neutral sections
# (STANDARD.md 6.3); the Impartial Analysis's own sentences on it (the
# city has kept its qualified status; Measure R would ensure it) are left
# out with them, so the background neither previews nor answers either
# side. The analysis's account of the state laws passed since 2010 is
# left out too: told alone, it sets up the supporters' premise without
# the opponents' answer. The guide prints no fiscal analysis (not a tax
# measure), so the fiscal line says the guide does not include a cost
# estimate.
#
# Sides come from the argument in favor and the argument against, not
# the rebuttals.

contest = "ca-2026-11-03-oceanside-measure-r"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide-page"
number = "R"
title = "CITY OF OCEANSIDE"
origin = "Measure “R” was placed on the ballot by the Oceanside City Council."
summary = "To preserve the City’s ability to continue receiving state infrastructure funding for public works projects, shall the Oceanside City Charter be amended to conform to state laws and best practices regarding prevailing wage and fair competition, including the use of project labor agreements for City public works with mandatory provisions for taxpayer protections, transparency, and accountability in the contracting process, by amending Sections 301, 302, and 303 of the Oceanside City Charter?"
yes = "A “yes” vote on Measure R favors amending the Oceanside City Charter."
no = "A “no” vote on Measure R opposes amending the Oceanside City Charter."

