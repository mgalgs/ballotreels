# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks; who put it on the ballot and what it needs to pass; what would
# change (no end date, where the money goes, the audit); the revenue
# estimate; one line per side; what a vote does.
#
# The guide prints no fiscal analysis or tax rate statement; the one
# revenue estimate is the city's, in the ballot question and the City
# Attorney's Impartial Analysis. No archived source states the general
# fund budget of the city, so the $7.5 million has no scale (STANDARD.md
# 6.5; left open). The argument in favor says public safety is half of
# the general fund's operating expenses, but gives no total, and it is
# that side's fact (6.3).
#
# The card quotes the sample ballot, which prints the question but no
# yes/no lines; the vote lines take the Impartial Analysis's yes/no
# meanings and highlight the question's own words, as Los Angeles County
# Measure A does.
#
# The guide prints an argument in favor and "NO ARGUMENT FILED AGAINST
# MEASURE “R”": the no side is filed = false, as for Proposition 37, and
# says so in the guide's own word.

contest = "ca-2026-11-03-rancho-mirage-measure-r"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-label"
number = "R"
title = "RANCHO MIRAGE PUBLIC SAFETY, ROADS, CITY SERVICES MEASURE."
origin = "CITY OF RANCHO MIRAGE"
summary = "Shall the measure maintaining Rancho Mirage’s long-term financial stability, City services such as 9-1-1 emergency medical/fire response, fire protection, Sheriff’s patrols, crime prevention/response programs; keeping public areas safe/clean; maintaining streets, roads, parks, libraries, fire stations; retaining/attracting local businesses, other services, by establishing a 1¢ sales tax generating approximately $7,500,000 (seven point five million dollars) annually until ended by voters, requiring public spending disclosure, funds for Rancho Mirage only, be adopted?"

[[section]]
id = "what"
heading = "Measure R"

[[section.line]]
text = "City of Rancho Mirage Measure R asks voters in the city whether to add a one-cent sales tax."
sources = ["ballot-label", "analysis"]

[section.line.visual]
kind = "page"
