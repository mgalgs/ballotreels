# Archived sources for City of Grand Terrace Measure N, 2026-11-03
# general election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1). The guide's page is cut from the San
# Bernardino County Registrar of Voters' Voter Information Guide; "page"
# is the guide's printed footer number (its PDF page is two higher).
#
# The guide prints no ballot question and no arguments. The ballot
# question is in the City Council's resolution (its Section 3.A), but the
# resolution's text runs the ballot's "Yes" and "No" boxes into the
# middle of it, so no card can quote it verbatim; the card quotes the
# guide's own page instead: the Summary of Measure N and the City
# Attorney's yes/no statements.

[contest]
id = "ca-2026-11-03-grand-terrace-measure-n"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:grand_terrace"
kind = "measure"
title = "City of Grand Terrace Measure N: 1% Sales Tax for General City Services"

[[source]]
id = "guide-page"
kind = "official-title-summary"
publisher = "San Bernardino County Registrar of Voters, Voter Information Guide, page SB COMPREHENSIVE-238: City Attorney's Impartial Analysis of Measure N and Summary of Measure N"
credit = "City Attorney's Impartial Analysis, San Bernardino County Voter Information Guide"
url = "https://uploads.rov.sbcounty.gov/ROV/Elections/2026/1103/VIG.pdf"
file = "sources/VIG_p240.pdf"
retrieved = "2026-10-28"

