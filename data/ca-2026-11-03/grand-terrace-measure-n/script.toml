# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and whose measure it is; the vote it needs; what would change (what
# the tax applies to, where the money goes, the advisory committee, how
# long it lasts); the impartial analysis's revenue estimate; both sides,
# which filed nothing; what a vote does.
#
# No arguments were filed for or against, and the guide prints none: both
# sides say so, filed = false (STANDARD.md 2.5), citing the guide page,
# as Proposition 37's no side does. With no side's argument to keep out
# of the neutral sections (STANDARD.md 6.3), the analysis's exemptions
# stay in.
#
# The guide prints no ballot question: the card quotes it from the City
# Council's resolution (sources.toml), and the vote lines quote the City
# Attorney's yes/no statements, highlighting the card's own "shall the
# City of Grand Terrace enact". The guide prints no tax rate statement; the one
# estimate is the City Attorney's, "approximately $1,200,000 annually".
# No archived source states the city's General Fund total, so it has no
# scale (STANDARD.md 6.5; left open).

contest = "ca-2026-11-03-grand-terrace-measure-n"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "N"
title = "GRAND TERRACE GENERAL SERVICES MEASURE"
origin = "A RESOLUTION OF THE CITY COUNCIL OF THE CITY OF GRAND TERRACE, CALIFORNIA"
summary = "To maintain and enhance essential City services — including police protection, neighborhood patrols, 9-1-1 emergency response, and rapid response times — shall the City of Grand Terrace enact a one percent (1%) sales tax, providing approximately $1.2 million annually for general City use until ended by voters, with all funds staying local, public spending disclosure, and independent annual audits?"

[[section]]
id = "what"
heading = "Measure N"

[[section.line]]
text = "City of Grand Terrace Measure N asks Grand Terrace voters whether to add a 1 percent sales tax for general city services."
sources = ["guide-page", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["one percent (1%) sales tax"]

[[section]]
id = "today"
heading = "What it needs to pass"

[[section.line]]
text = "Measure N needs a majority of the vote to pass."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "The tax would apply to most retail sales in the city, but not to groceries or prescription medicine."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "grocery-bag"

[[section.line]]
text = "The money would go to the city general fund, for any city purpose, such as law enforcement."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "special-tax"

[[section.line]]
text = "An advisory committee would review the spending and the yearly audits."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section.line]]
text = "The tax would stay until voters repeal it."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "end-date"

[[section]]
id = "fiscal"
heading = "What the impartial analysis says"

[[section.line]]
