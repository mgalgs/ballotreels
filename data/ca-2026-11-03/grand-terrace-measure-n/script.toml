# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and whose measure it is; the vote it needs; what would change (what
# the tax applies to, where the money goes, the advisory committee, how
# long it lasts); the impartial analysis's revenue estimate; both sides,
# which filed nothing; what a vote does.
#
# No arguments were filed for or against, and the guide prints none: both
# sides say so, filed = false (STANDARD.md 2.5), citing the guide page,
# as Proposition 37's no side does. With no side's argument to keep out
# of the neutral sections (STANDARD.md 6.3), the analysis's exemptions
# stay in.
#
# The card quotes the guide's page, not the ballot question
# (sources.toml). The guide prints no tax rate statement; the one
# estimate is the City Attorney's, "approximately $1,200,000 annually".
# No archived source states the city's General Fund total, so it has no
# scale (STANDARD.md 6.5; left open).

contest = "ca-2026-11-03-grand-terrace-measure-n"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide-page"
number = "N"
title = "CITY OF GRAND TERRACE"
origin = "The Grand Terrace City Council introduced a measure before Grand Terrace voters for the November 3, 2026, General Municipal Election to consider a locally controlled 1.00% transactions and use (sales) tax."
summary = "If approved by a majority of voters, revenue generated by the tax would be deposited into the City's General Fund to help maintain essential municipal services and address local community priorities. The ordinance includes accountability measures such as annual independent financial audits, public reporting of expenditures, and oversight by a citizen advisory committee. The proposed tax would be administered by the California Department of Tax and Fee Administration and would remain in effect unless repealed by voters."
yes = "A \"YES\" vote is a vote to approve a 1.00% transactions and use general tax."
no = "A \"NO\" vote is a vote against a 1.00% transactions and use general tax."

