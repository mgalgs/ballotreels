# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and of whom; how a college bond is repaid and what it needs to
# pass; what the money could pay for; the district's tax statement; one
# line per side; what a vote does.
#
# The guide's Full Text prints the ballot question (the card's title and
# summary); County Counsel's Impartial Analysis, on the same pages, gives
# the card's origin and its yes and no lines. "Counsel" is heard as
# "Council" (standard/speakability.txt). The bond total and the debt
# service are repaid from a tax on property in the district, and no
# archived source states the district's budget, so they have no budget
# scale (STANDARD.md 6.5; left open). The tax statement gives one rate,
# $25 per $100,000, as both its average and its highest.
#
# No argument against Measure Y was filed. The no side says so plainly;
# its section is marked filed = false.

contest = "ca-2026-11-03-san-bernardino-ccd-measure-y"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide-page"
number = "Y"
title = "Local College Affordability, Job Training, Repairs Measure."
origin = "This Measure was placed on the ballot by a resolution adopted by the Board of Trustees of the San Bernardino Community College District (District)."
summary = "To maintain affordable college education access, by repairing /upgrading San Bernardino Valley College, Crafton Hills College; preparing students/ veterans for high-demand careers including skilled trades, firefighting, healthcare; providing safe drinking water; removing asbestos, mold; repairing deteriorating gas lines; acquiring, constructing, repairing facilities, sites, equipment; shall San Bernardino Community College District's measure authorizing $898,000,000 in bonds at legal rates, levying $25 per $100,000 of assessed valuation ($56,000,000 annually) while bonds are outstanding, requiring oversight, audits, be adopted?"
yes = "A \"yes\" vote by at least fifty-five percent of the voters voting on this Measure will authorize the District to issue bonds in the amount of $898,000,000 to be used solely for the purposes set forth in this ballot Measure."
no = "A \"no\" vote means that the District will not be authorized to issue and sell the $898,000,000 in bonds set forth in the Measure."

[[section]]
id = "what"
heading = "Measure Y"

[[section.line]]
text = "San Bernardino Community College District Measure Y asks the district's voters whether to approve $898 million in college bonds."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["authorizing $898,000,000 in bonds"]

[[section]]
id = "today"
heading = "How a college bond works"

[[section.line]]
text = "The district would borrow the money and repay it from a tax on property in the district."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "bond-certificates"

[[section.line]]
text = "Measure Y needs 55 percent of the vote to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "The money would go to listed projects at San Bernardino Valley College and Crafton Hills College, such as career training facilities and asbestos removal."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "university-hall"

[[section]]
id = "fiscal"
heading = "What the tax statement says"

[[section.line]]
text = "The district's tax statement estimates a tax of $25 per $100,000 of assessed value each year, through 2058-2059."
sources = ["tax-statement"]

[section.line.visual]
kind = "illustration"
name = "debt-payments"

[[section.line]]
text = "The statement estimates the total to repay, with interest, at about $1.9 billion."
sources = ["tax-statement"]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Measure Y keeps local college and job training affordable and campuses safe."
sources = ["arguments"]
basis = ["YES on Y keeps local college and career training affordable", "YES on Y keeps our local college campuses safe and ready to serve local students."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Affordable local college and job training", "Safe campuses, with asbestos and mold removed"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure Y was filed for the San Bernardino County voter guide."
