# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; how the tax would be collected;
# where the money goes and that it stays in the city; the vote it needs;
# the impartial analysis's revenue estimate; one line per side; what a
# vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". A sales tax in cents is said
# as a percent (standard/speakability.txt): a 1-cent tax is 1 percent,
# as the analysis says ("one cent ($0.01), or one percent (1%)").
#
# The ordinance was not archived (the county page's "Full Text" tab only
# offers a copy from the City Clerk); the ballot question and the
# impartial analysis state what the measure does, and the script says
# nothing they do not. The ballot question's list of uses (roads, police
# and fire, parks) is the council's stated purpose; the supporters'
# argument makes the same points, so the neutral sections leave them to
# the card and the yes line (STANDARD.md 6.3).
#
# The analysis's $16 million a year has no scale: no archived source
# states the city's general fund budget (STANDARD.md 6.5; left open,
# under [[question]]). No argument against was filed, so the no side
# sets `filed = false`.

contest = "ca-2026-11-03-woodland-measure-y"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "Y"
title = "City of Woodland Sales Tax Measure"
origin = "On June 16, 2026, the City Council voted to place Measure “Y” on the November 3, 2026 general municipal election ballot."
summary = "To rebuild roads and repair potholes, increase police and fire protection, recruit and retain public safety personnel, maintain parks and trails, and clean and maintain public spaces, shall the City of Woodland measure enacting a one cent transactions and use tax (sales tax) providing approximately 16 million dollars annually for general government services, until ended by voters, with all funds locally controlled and subject to independent financial audits and public spending disclosures, be adopted?"
yes = "A \"yes\" vote on Measure “Y” will authorize the one cent transactions and use (sales) tax."
no = "A \"no\" vote on Measure “Y” will not authorize the one cent transactions and use (sales) tax."

[[section]]
id = "what"
heading = "Measure Y"

[[section.line]]
text = "Measure Y asks the voters of this city whether to add a 1 percent sales tax for general city services, with no end date."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["enacting a one cent transactions and use tax (sales tax)"]

[[section]]
id = "today"
heading = "How the tax would work"

[[section.line]]
text = "The tax would be paid on top of current sales taxes, and collected the same way."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "sales-receipt"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "where-money"
text = "The money would go to the general fund of the city, for any lawful city service, and would not be shared with other governments."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "state-budget"

[[section.line]]
text = "Measure Y needs a simple majority to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "ballot-box"

[[section]]
id = "fiscal"
heading = "What the impartial analysis says"

[[section.line]]
id = "revenue"
text = "The city attorney's impartial analysis estimates about $16 million a year in added revenue."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "city-storefronts"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say police and fire calls have surged, and Measure Y would improve emergency response and repair roads."
sources = ["arguments"]
basis = ["Calls for police and fire protection have surged, while staffing, equipment, and infrastructure struggle to keep pace.", "improve emergency response times, repair potholes and sidewalks"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Faster police and fire response", "Repairs to roads and sidewalks"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure Y was filed by the July deadline, so only an argument in favor appears."
sources = ["arguments"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote authorizes the 1 percent sales tax."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["will authorize the one cent transactions and use (sales) tax"]

[[section.line]]
text = "A no vote does not authorize the sales tax."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["will not authorize the one cent transactions and use (sales) tax"]

[[question]]
ask = "What could the money be spent on?"
lines = ["where-money"]

[[question]]
ask = "How big is $16 million a year next to the city's budget?"
unanswered = true

[[question]]
ask = "What is the sales tax rate in the city today?"
unanswered = true
