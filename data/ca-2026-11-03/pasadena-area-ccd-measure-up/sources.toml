# Archived sources for Pasadena Area Community College District Measure
# UP, 2026-11-03 general election (sources/sources.md). Every id here may
# be cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# The Los Angeles County Registrar-Recorder/County Clerk's list "Measures
# Appearing on the Ballot" is the authority for the letter, the vote
# needed and the ballot question, quoted on the card; its "Opponents:
# None submitted." is the official statement that no argument against
# was filed (`measure-list`). County Counsel's impartial analysis, the
# full text, the District's tax rate statement and the argument in favor
# are the Registrar's own copies from its Interactive Sample Ballot. The
# impartial analysis is the measure's neutral explanation, the kind a
# state's attorney general's explanatory statement is.
#
# A community college district has no Census boundary, so the measure's
# division is the county and `voters` names the district
# (docs/SCRIPT-FORMAT.md), as Grossmont-Cuyamaca Measure G does.

[contest]
id = "ca-2026-11-03-pasadena-area-ccd-measure-up"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/county:los_angeles"
kind = "measure"
title = "Pasadena Area Community College District Measure UP: College Facility Bonds"
voters = "the Pasadena Area Community College District"

[[source]]
id = "ballot-question"
kind = "official-title-summary"
publisher = "Los Angeles County Registrar-Recorder/County Clerk, Measures Appearing on the Ballot, General Election November 3, 2026 (Rev. 9/22/26): Pasadena Area Community College, Measure UP"
credit = "Measures Appearing on the Ballot, Los Angeles County Registrar-Recorder/County Clerk"
url = "https://content.lavote.gov/docs/rrcc/documents/final-measures-appearing-on-the-ballot-9-22-2026-v-2.pdf"
file = "sources/county-measure-list-excerpt.txt"
