# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; how a bond is repaid, who placed it and the
# vote it needs; what the money may and may not pay for; the tax rate
# statement's estimates and the ballot question's yearly figure; one line
# per side; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the opening
# says "the voters of this college district". The card and title carry
# the names. "Counsel" is heard as "Council" (standard/speakability.txt),
# so the narration says "the impartial analysis".
#
# The card quotes the Los Angeles County Registrar-Recorder/County Clerk's
# list "Measures Appearing on the Ballot", which prints the ballot question
# with no yes and no sentences, so the card has no boxes and the two vote
# lines highlight the same phrase of the question.
#
# The ballot question's "without exceeding the current $9 per $100,000
# assessed value (no increase)" is the District's own framing; the
# narrator does not repeat it. The tax rate statement and the impartial
# analysis give a $9 average and highest rate through 2065-66 and do not
# say whether the levy continues an earlier bond's rate (only the full
# text's findings, the District's case, call it a "bond extension"), so
# the neutral lines keep to their figures. The supporters' "It continues
# the current tax rate" is their argument and stays on the yes side
# (STANDARD.md 6.3). The $27,000,000 a year is the ballot question's
# figure, attributed to it. The bonds are repaid from a tax on property
# in the district, not from the district's budget, and no archived source
# states that budget, so the figures have no budget scale (STANDARD.md
# 6.5; left open), as other college bonds' do.
#
# The argument in favor is the Registrar's printed copy. The list says
# "Opponents: None submitted.", so the no side says plainly that no
# argument against was submitted, citing the list (filed = false). Its
# clause on what the list records balances the yes line's length without
# a further claim. Neither side names anyone.

contest = "ca-2026-11-03-pasadena-area-ccd-measure-up"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "UP"
title = "PASADENA AREA COMMUNITY COLLEGE"
origin = "VOTE PASSAGE – 55% of the Votes Cast"
summary = "PASADENA CITY COLLEGE MEASURE PRESERVING AFFORDABLE HIGHER EDUCATION/ CAREER TRAINING WITHOUT INCREASING TAX RATES. To construct/ equip classrooms/ career training facilities to prepare students for careers in nursing/ healthcare, firefighting/ EMS, construction, hospitality, and skilled trades; fix deteriorating roofs, plumbing/ electrical systems, shall Pasadena Area Community College District's measure be adopted authorizing $485,000,000 in bonds at legal rates, without exceeding the current $9 per $100,000 assessed value (no increase), providing $27,000,000 annually while bonds are outstanding, with independent oversight/ local control?"

[[section]]
id = "what"
heading = "Measure UP"

[[section.line]]
text = "Measure UP asks the voters of this college district whether to approve $485 million in college bonds."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["authorizing $485,000,000 in bonds"]

[[section]]
id = "today"
heading = "How a college bond works"

[[section.line]]
id = "repay"
text = "The district would borrow the money and repay it from a tax on property in the district."
sources = ["tax-statement", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "bond-certificates"

[[section.line]]
id = "threshold"
text = "The district's governing board placed Measure UP on the ballot, and it needs 55 percent of the vote to pass."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
