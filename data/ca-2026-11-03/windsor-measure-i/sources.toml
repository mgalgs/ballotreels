# Archived sources for Town of Windsor Measure I, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# The Sonoma County Registrar of Voters publishes each measure's pages
# of its guide as one PDF, headed "Local Ballot Measure: I" and footed
# "Sonoma County" with the guide's page numbers (049M528 to 049M535); no
# cover page was archived, so the sources name those pages, not a guide
# title. One PDF backs every source here. The Town Attorney's Impartial
# Analysis is the measure's neutral explanation. The guide prints no
# fiscal analysis or tax rate statement (a sales tax, not a bond).

[contest]
id = "ca-2026-11-03-windsor-measure-i"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:windsor"
kind = "measure"
title = "Town of Windsor Measure I: 1 Percent Sales Tax for Town Services"

[[source]]
id = "measure-question"
kind = "official-title-summary"
publisher = "Sonoma County Registrar of Voters, Local Ballot Measure: I, page 049M528: Measure Question and What Your Vote Means"
credit = "Measure Question, Sonoma County Registrar of Voters"
url = "https://sonomacounty.gov/Main%20County%20Site/Administrative%20Support%20%26%20Fiscal%20Services/Registrar%20of%20Voters/Documents/Elections/2026/11-03-2026/SoCo_Nov2026GenElec_9641_MeasI_TownOfWindsor_SalesTax_EN.pdf"
