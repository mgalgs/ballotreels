# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the sales tax today and the
# town's share of it; what would change (the rate, the town's share,
# how long, a general tax needing a simple majority); the revenue
# estimate as the impartial analysis gives it; one line per side; what a
# vote does.
#
# The guide prints no fiscal analysis or tax rate statement; the one
# estimate is the one the Town Attorney's Impartial Analysis gives, from
# the Council's resolution and the town staff's report. No archived
# source states the town's general fund budget, so the $5.7 million has
# no scale (STANDARD.md 6.5; left open). The analysis's sentence that
# Windsor is the one city or town in the county without a local sales
# tax is also the supporters' point ("the only city in Sonoma County
# without its own dedicated local sales tax"), so it stays out of the
# neutral sections (STANDARD.md 6.3), as do the oversight commission and
# audits, which the argument in favor cites.
#
# Sides come from the argument in favor and the argument against, not
# the rebuttals.

contest = "ca-2026-11-03-windsor-measure-i"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "measure-question"
number = "I"
title = "Town of Windsor"
origin = "The Town Council of the Town of Windsor has placed Measure I on the November 3, 2026, ballot"
summary = "To provide funding for the Town of Windsor to maintain essential local services, such as repairing potholes and maintaining streets; neighborhood police patrols / emergency response / traffic enforcement; preserving parks / community events; disaster preparedness and fire prevention — removing brush / flammable fuels, and for general government use; shall the measure establishing a 1% sales tax, providing approximately $5,700,000 annually until ended by voters, requiring independent audits, citizen oversight, and all funds remaining in Windsor under local control, be adopted?"
yes = "A “Yes” vote is a vote to approve a one percent (1%) sales tax in Windsor."
no = "A “No” vote is a vote against the tax."

[[section]]
id = "what"
heading = "Measure I"

[[section.line]]
