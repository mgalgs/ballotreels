# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks; the sales tax rate today; who put it on the ballot and what it
# needs to pass; what would change (the new rate and how long, what the
# money may pay for, who reviews it); the impartial analysis's revenue
# estimate; one line per side; what a vote does.
#
# The City Clerk's site refused downloads; the guide prints the ballot
# label, the City Attorney's Impartial Analysis, the argument against and
# the full text, which cover what the standard needs. The guide prints
# no fiscal analysis or tax rate statement (not a bond); the one revenue
# estimate is the city's, as the Impartial Analysis reports it. No
# archived source states the city's general fund budget, so the $20
# million has no scale (STANDARD.md 6.5; left open). The page prints no
# subject heading over the ballot label, so the card's title is the
# page's own head, the city's name.
#
# The guide prints an argument against and no argument in favor: the yes
# side is filed = false. The guide prints no "no argument was submitted"
# notice, so the yes line says only that none appears in the guide. The
# argument against's point that voters approved a sales tax two years
# ago is its own, so it stays in its section (STANDARD.md 6.3).

contest = "ca-2026-11-03-oceanside-measure-s"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide-page"
number = "S"
title = "CITY OF OCEANSIDE"
origin = "Measure “S” was placed on the ballot by the Oceanside City Council"
summary = "To provide locally-controlled funding for Oceanside services and infrastructure, such as keeping streets, sidewalks, parks, and public facilities safe, clean, and well-maintained; fixing potholes; improving traffic; restoring/protecting local beaches; modernizing public safety/emergency facilities to improve 911 emergency response/community safety; and repairing aging infrastructure, shall City of Oceanside’s ordinance establishing a 1/2 cent sales tax be adopted, providing $20,000,000 annually for general government use for 10 years, with independent audits and citizen oversight?"
yes = "A “yes” vote on Measure S favors increasing the sales tax by one-half of one percent for ten years."
no = "A “no” vote on Measure S opposes an increase in the sales tax by one-half of one percent for ten years."

[[section]]
id = "what"
heading = "Measure S"

[[section.line]]
text = "City of Oceanside Measure S asks voters in the city whether to add a half-cent sales tax for 10 years."
sources = ["guide-page"]

[section.line.visual]
