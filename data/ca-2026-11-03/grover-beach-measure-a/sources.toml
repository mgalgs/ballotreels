# Archived sources for City of Grover Beach Initiative Measure A,
# 2026-11-03 general election (sources/sources.md). Every id here may be
# cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# The San Luis Obispo County Clerk-Recorder prints each ballot type's
# County Voter Information Guide as one PDF; pages 27 to 31 of Ballot
# Type 38 (the measure's full text, the City Attorney's impartial
# analysis, the arguments for and against, and a rebuttal to each) were
# cut into one excerpt. The guide does not print the ballot question;
# the City Council's Resolution No. 24-56, which submits the citizens'
# initiative to the voters (adopted in 2024 for this 2026 election),
# prints it in Section 1. The resolution is a scan with a text layer.
# The impartial analysis is the measure's neutral explanation. No tax
# rate statement or fiscal statement applies. The ballot labels the
# measure "Initiative Measure A-26"; the project names it by its bare
# letter.

[contest]
id = "ca-2026-11-03-grover-beach-measure-a"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:grover_beach"
kind = "measure"
title = "Grover Beach Measure A: Elected City Clerk"

