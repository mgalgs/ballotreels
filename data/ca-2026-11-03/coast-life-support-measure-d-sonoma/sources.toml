# Archived sources for Coast Life Support District Measure D, 2026-11-03
# general election, for Sonoma County voters (sources/sources.md). Every
# id here may be cited by script.toml. `kind` must be one the standard
# allows (docs/STANDARD.md, section 1).
#
# The Sonoma County Registrar of Voters publishes each measure's pages
# of its guide as one PDF, headed "Local Ballot Measure: D" and footed
# "Sonoma County" with the guide's page numbers (049M507 to 049M510); no
# cover page was archived, so the sources name those pages, not a guide
# title. One PDF backs every source here. The County Counsels' Impartial
# Analysis (Mendocino and Sonoma) is the measure's neutral explanation; a
# parcel tax has no tax rate statement, and the pages print none, so the
# one estimate of what the tax would raise is the measure question's.
# The pages print an argument in favor and "No Argument Was Submitted
# Against Measure D", and no rebuttals.
#
# A special district has no Census boundary, so the measure's division
# is the county and `voters` names the district
# (docs/SCRIPT-FORMAT.md). The district reaches Mendocino and Sonoma
# counties; Mendocino is the lead county, so this Sonoma contest carries
# the -sonoma suffix, and Mendocino's is not staged.

[contest]
id = "ca-2026-11-03-coast-life-support-measure-d-sonoma"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/county:sonoma"
kind = "measure"
title = "Coast Life Support District Measure D: Emergency Medical Services Parcel Tax"
voters = "the Coast Life Support District"

[[source]]
id = "measure-question"
kind = "official-title-summary"
publisher = "Sonoma County Registrar of Voters, Local Ballot Measure: D, page 049M507: Measure Question and What Your Vote Means"
credit = "Measure Question, Sonoma County Registrar of Voters"
url = "https://sonomacounty.gov/Main%20County%20Site/Administrative%20Support%20%26%20Fiscal%20Services/Registrar%20of%20Voters/Documents/Elections/2026/11-03-2026/SoCo_Nov2026GenElec_9761_MeasD_CoastLifeSuppDist_ParcelTax_EN.pdf"
file = "sources/MeasD_EN.pdf"
retrieved = "2026-10-28"

