# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom (one area of the school district); who votes
# and who pays; what it needs to pass; what the money would pay for; the
# district's tax statement; one line per side; what a vote does.
#
# No place or school name is narrated (the narrator mispronounces them):
# the opening says "voters in one area of this school district" and the
# schools are "two high schools". The card, title and the `voters` line
# carry the names. "Counsel" is heard as "Council"
# (standard/speakability.txt), so the narration does not say it.
#
# The card quotes the ballot label as the guide's sample ballot prints
# it. The guide sets the impartial analysis and the tax rate statement
# side by side on one page, and pdftotext runs the two columns together
# through the analysis's yes and no sentences, so the card has no YES and
# NO boxes; the vote lines say the analysis's own meanings ('A "YES"
# vote on this measure is a vote to authorize the bonds.') and each
# highlights the bond authorization on the card.
#
# The bond total and the debt service are repaid from a tax on property
# in the improvement district, not from the district's budget, and no
# archived source states that budget, so they have no budget scale
# (STANDARD.md 6.5; left open). The tax statement's average and highest
# rates are both $19, so the fiscal line gives the one rate. The bar on
# paying salaries, the audits and the oversight committee are in the
# supporters' argument, so the neutral sections leave them out
# (STANDARD.md 6.3).
#
# The guide prints "No Argument Against Measure O was Filed". The no
# side says so plainly; its section is marked filed = false.

contest = "ca-2026-11-03-eastern-sierra-unified-sfid-1-measure-o"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "O"
title = "AUTHORIZE THE ISSUANCE OF GENERAL OBLIGATION BONDS IN ITS SCHOOL FACILITIES IMPROVEMENT DISTRICT NO. 1 OF THE EASTERN SIERRA UNIFIED SCHOOL DISTRICT"
origin = "This measure was placed on the ballot by the Board of Trustees of the Eastern Sierra Unified School District"
summary = "To construct and equip classrooms and career technical education (CTE) facilities at Coleville High School and Lee Vining High School for job skills/career readiness in engineering, science, automotive technology, welding, carpentry, agricultural mechanics and other skilled trades; and improve school safety/security systems, shall the measure be adopted for School Facilities Improvement District No. 1 of the Eastern Sierra Unified School District authorizing $6,000,000 in bonds at legal rates, levying approximately $19 per $100,000 assessed value ($390,000 annually) while bonds are outstanding, with citizen oversight, audits, and all money staying local?"

[[section]]
id = "what"
heading = "Measure O"

[[section.line]]
text = "Measure O asks voters in one area of this school district whether to approve $6,000,000 in bonds for two high schools."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["authorizing $6,000,000 in bonds"]

[[section]]
id = "today"
heading = "How this bond works"

[[section.line]]
id = "who-votes"
text = "Only voters in that area vote, and the bonds would be repaid from a yearly tax on property there."
sources = ["impartial-analysis", "tax-statement"]

[section.line.visual]
kind = "illustration"
name = "district-map"

[[section.line]]
text = "Measure O needs 55 percent of the vote to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "projects"
text = "The money would build and equip career training classrooms at the two high schools, for skills such as welding, carpentry and automotive technology."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "school-workshop"

[[section.line]]
text = "The money would also improve school safety systems, such as cameras and communication systems."
sources = ["impartial-analysis"]

[[section]]
id = "fiscal"
heading = "What the tax statement says"

[[section.line]]
id = "tax-rate"
text = "The district's tax rate statement estimates $19 a year per $100,000 of assessed value, each year the bonds are outstanding, through 2054-2055."
sources = ["tax-statement", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "debt-payments"

[[section.line]]
text = "The statement estimates the total to repay, with interest, at about $11.3 million."
sources = ["tax-statement"]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say many skilled jobs in the region go unfilled, and Measure O would prepare students to fill jobs at local businesses."
sources = ["arguments"]
basis = ["In our region, many high-skilled jobs go unfilled each year.", "equipping students with the skills needed for high-demand careers and preparing them to fill jobs at local businesses."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Many skilled jobs go unfilled", "Prepares students for local jobs"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure O was filed, so the county voter guide prints only the argument in favor of the measure."
sources = ["arguments"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote is a vote to authorize the bonds."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["authorizing $6,000,000 in bonds"]

[[section.line]]
text = "A no vote is a vote against authorizing the bonds."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["authorizing $6,000,000 in bonds"]

[[question]]
ask = "Who votes on this, and who would pay the tax?"
lines = ["who-votes"]

[[question]]
ask = "What would the bond money pay for?"
lines = ["projects"]

[[question]]
ask = "How much would property owners pay?"
lines = ["tax-rate"]

[[question]]
ask = "How big is $6,000,000 next to the district's yearly budget?"
unanswered = true
