# Archived sources for Eastern Sierra Unified School District Measure O,
# the School Facilities Improvement District No. 1 bond, 2026-11-03
# general election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# Who votes: the impartial analysis says the bonds would be issued
# "within School Facilities Improvement District No. 1 of the District",
# and the tax rate statement that the election "will be held in School
# Facilities Improvement District No. 1 of the Eastern Sierra Unified
# School District". The improvement district has no boundary layer of its
# own, so the division is the county with a `voters` line, as Yosemite
# Unified's SFID No. 1 Measure W's is.
#
# Mono County Elections prints the whole measure in its Voter Information
# Guide and Sample Ballot, cut here from ballot type B001 (amended) to
# PDF pages 9 and 13 to 17: the sample ballot page with the ballot label
# (9), the full text (13 to 15), the impartial analysis and the tax rate
# statement (16), and the argument in favor with "No Argument Against
# Measure O was Filed" (17). The impartial analysis is the measure's
# neutral explanation; the tax rate statement is its fiscal statement.
# No rebuttals are printed. Of the two separate postings archived beside
# it, sources/impartial-analysis.pdf is the county site's "Object moved"
# HTML redirect, not the analysis, and sources/argument-in-favor.pdf is a
# scan with no text layer; neither is cited, and the guide prints both
# documents.

