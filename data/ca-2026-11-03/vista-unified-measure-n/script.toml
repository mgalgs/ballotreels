# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and of whom; how a school bond is repaid and what it needs to
# pass; what the money would pay for; the district's tax statement; one
# line per side; what a vote does.
#
# The ballot label prints no title line above its question, so the card
# quotes the question as its title (as Utah's card does) and the
# impartial analysis's statement of what the measure does as its
# summary. "Counsel" is heard as "Council" (standard/speakability.txt).
# The bond total and the debt service are repaid from a tax on property
# in the district, and no archived source states the district's budget,
# so they have no budget scale (STANDARD.md 6.5; left open).
#
# Whether Measure N raises taxes is what the two sides dispute
# (supporters: "without raising taxes"; opponents: $505 a year for the
# average home), so the neutral sections give only the tax statement's
# rate and years, and leave the "bond extension" framing on the card
# (STANDARD.md 6.3). Sides come from the argument in favor and the
# argument against, not the rebuttals.

contest = "ca-2026-11-03-vista-unified-measure-n"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-label"
number = "N"
title = "Without increasing current tax rates, to repair and upgrade aging classrooms, science labs, school facilities, and instructional technology to support college/career readiness in math, science, technology, engineering, arts, and skilled trades and fix deteriorating roofs, plumbing, sewer, and electrical systems shall Vista Unified School District’s measure be adopted authorizing $543,000,000 in bonds at legal rates, levying $58 per $100,000 assessed value ($31,000,000 annually) while bonds are outstanding, with citizen oversight, independent audits, and all money locally-controlled?"
origin = "The Board of Education for the Vista Unified School District (“District”) placed this measure on the ballot."
summary = "If approved by 55% of the votes cast, this measure will authorize the District to issue and sell general obligation bonds in an amount not to exceed $543,000,000."
yes = "A “YES” vote is in favor of authorizing the District to issue and sell $543,000,000 in general obligation bonds."
no = "A “NO” vote is against authorizing the District to issue and sell $543,000,000 in general obligation bonds."

[[section]]
id = "what"
heading = "Measure N"

[[section.line]]
text = "Vista Unified Measure N asks the district's voters whether to approve $543 million in school bonds."
sources = ["ballot-label"]

[section.line.visual]
kind = "page"
source = "ballot-label"
highlight = ["$543,000,000 in bonds"]

[[section]]
id = "today"
heading = "How a school bond works"

[[section.line]]
text = "The district would borrow the money and repay it from a tax on property in the district."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "bond-certificates"

[[section.line]]
text = "Measure N needs 55 percent of the vote to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "The money would repair and upgrade aging classrooms, science labs and technology, and fix roofs, plumbing, sewer and electrical systems."
sources = ["ballot-label"]

[section.line.visual]
kind = "illustration"
name = "school-classroom"

[[section]]
id = "fiscal"
heading = "What the tax statement says"

[[section.line]]
text = "The district's tax statement estimates a tax of $58 per $100,000 of assessed value, collected through 2062-63."
sources = ["tax-statement"]

[section.line.visual]
kind = "illustration"
name = "debt-payments"

[[section.line]]
text = "The statement estimates the total to repay, with interest, at about $1.15 billion."
sources = ["tax-statement"]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Measure N fixes failing pipes, roof leaks and aging portable classrooms, without raising taxes."
sources = ["arguments"]
basis = ["Some of our schools were built so long ago that underground pipes and", "Last year alone there were 380 roof leaks.", "teachers rely on more than 400 portable classrooms that are over 25 years", "but it will do it without raising taxes."]

[section.line.visual]
