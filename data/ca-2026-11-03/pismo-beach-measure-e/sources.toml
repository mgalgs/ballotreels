# Archived sources for City of Pismo Beach Measure E, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The San Luis Obispo County Clerk-Recorder prints each ballot type's
# County Voter Information Guide as one PDF; pages 30 to 33 of Ballot
# Type 40 (the ordinance's full text, the City Attorney's impartial
# analysis, the arguments for and against, the rebuttal to the argument
# in favor, and the notice that no rebuttal to the argument against was
# filed) were cut into one excerpt. The guide does not print the ballot
# question; the City Council's Resolution No. R-2026-043, which places
# the measure, prints it in Section 1 (with a blank for the letter the
# county later assigned). Resolutions R-2026-044 and -045 (who may write
# the arguments and rebuttals) are archived but not cited. The impartial
# analysis is the measure's neutral explanation. No tax rate statement
# or fiscal statement applies. The ballot labels the measure "Measure
# E-26"; the project names it by its bare letter.

[contest]
id = "ca-2026-11-03-pismo-beach-measure-e"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:pismo_beach"
kind = "measure"
title = "Pismo Beach Measure E: Four-Year Mayoral Terms"

