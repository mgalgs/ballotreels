# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and of whom; how a school bond is repaid and what it needs to
# pass; what the money would pay for; the district's tax statement; one
# line per side; what a vote does.
#
# The card's title is the item's own head on the county's Current
# Measure Information page; its origin and yes and no lines are County
# Counsel's Impartial Analysis. "Counsel" is heard as "Council"
# (standard/speakability.txt), so the narration does not say it. The
# bond total and the debt service are repaid from a tax on property in
# the district, and no archived source states the district's budget, so
# they have no budget scale (STANDARD.md 6.5; left open). The fiscal line
# gives the tax statement's highest rate beside its average, as it
# prints both, with both years in full.
#
# Whether Measure E raises taxes is the supporters' point ("Tax rates
# will not increase above what we already pay"), so the neutral sections
# give only the tax statement's rates and years (STANDARD.md 6.3). The
# statement prints its highest rate as "60.00 per $100,000"; the
# narration says "$60".
#
# No argument against Measure E was filed. The no side says so plainly;
# its section is marked filed = false.

contest = "ca-2026-11-03-center-joint-unified-measure-e"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-label"
number = "E"
title = "Measure E: Center Joint Unified School District"
origin = "Measure E was placed on the ballot by the governing board of the Center Joint Unified School District (“District”)."
summary = "To upgrade local schools; improve school and student safety; replace leaky roofs and decaying pipes; replace failing heating and cooling systems; and update hands-on science and early job training classrooms and accommodate growing enrollment, shall Center Joint Unified School District’s measure authorizing $197 million in bonds, at legal rates, levying approximately $60 per $100,000 assessed value, (averaging $12,300,000 annually) while bonds are outstanding, with citizen oversight and audits, all funds staying local and none for administrator salaries, be adopted?"
yes = "A “YES” vote on Measure E means you wish to allow the District to issue bonds in an amount not to exceed $197 million dollars."
no = "A “NO” vote on Measure E means you do not wish to allow the District to issue the proposed bonds."

[[section]]
id = "what"
heading = "Measure E"

[[section.line]]
text = "Center Joint Unified School District Measure E asks the district's voters whether to approve $197 million in school bonds."
sources = ["ballot-label"]

[section.line.visual]
kind = "page"
source = "ballot-label"
highlight = ["$197 million in bonds"]

[[section]]
id = "today"
heading = "How a school bond works"

[[section.line]]
text = "The district would borrow the money and repay it from a tax on property in the district."
sources = ["tax-statement"]

[section.line.visual]
kind = "illustration"
name = "bond-certificates"

[[section.line]]
text = "Measure E needs 55 percent of the vote to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "The money would replace leaky roofs, decaying pipes and failing heating and cooling systems, update science and job training classrooms, and make room for growing enrollment."
sources = ["ballot-label"]

[section.line.visual]
kind = "illustration"
name = "school-classroom"

[[section]]
id = "fiscal"
heading = "What the tax statement says"

[[section.line]]
text = "The district's tax statement estimates an average tax of $54.94 per $100,000 of assessed value, and at most $60, through 2068-2069."
sources = ["tax-statement"]

[section.line.visual]
kind = "illustration"
name = "debt-payments"

[[section.line]]
text = "The statement estimates the total to repay, with interest, at about $517 million."
sources = ["tax-statement", "impartial-analysis"]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Measure E repairs aging schools and improves safety, without increasing tax rates."
sources = ["arguments"]
basis = ["Some of our classrooms and school facilities are over 65 years old and need urgent repairs and updates", "Voting YES on E will improve student safety and campus security", "Vote YES on E to support high-quality education WITHOUT INCREASING TAX RATES."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Repairs aging schools before costs grow", "Safer campuses, no tax rate increase"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure E was filed with Sacramento County Voter Registration and Elections."
sources = ["arguments"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote allows the district to issue up to $197 million in bonds."
sources = ["ballot-label"]

[section.line.visual]
kind = "page"
source = "ballot-label"
highlight = ["you wish to allow the District to issue bonds"]

[[section.line]]
text = "A no vote does not allow the district to issue the proposed bonds."
sources = ["ballot-label"]

[section.line.visual]
kind = "page"
source = "ballot-label"
highlight = ["you do not wish to allow the District to issue the proposed bonds"]
