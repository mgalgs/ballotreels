# Archived sources for Center Joint Unified School District Measure E,
# 2026-11-03 general election (sources/sources.md). Every id here may be
# cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# Sacramento County publishes no single Voter Information Guide PDF (each
# voter's guide is issued through a portal); its "Current Measure
# Information" page prints each measure's ballot question, County
# Counsel's Impartial Analysis, full text, tax rate statement, arguments
# and rebuttals. sources/county-measure-page-item.txt is the text of
# Measure E's item on that page; every source cites it.
#
# The district spans Sacramento and Placer counties; this is Sacramento
# County's copy of the measure. Placer County's is staged as
# center-joint-unified-measure-e-placer, with the same division.

[contest]
id = "ca-2026-11-03-center-joint-unified-measure-e"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/school_district:center_joint_unified_school_district"
kind = "measure"
title = "Center Joint Unified School District Measure E: School Repair and Safety Bonds"

[[source]]
id = "ballot-label"
kind = "official-title-summary"
publisher = "Sacramento County Voter Registration and Elections, Current Measure Information, November 3, 2026, General Election: Measure E's ballot question, and the Impartial Analysis's statement of what a vote does"
credit = "Current Measure Information, Sacramento County"
url = "https://elections.saccounty.gov/us/en/election-information/current-measure-information.html"
file = "sources/county-measure-page-item.txt"
retrieved = "2026-10-28"

