# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; why it is on the ballot (land
# use changes need voter approval) and how it got there; what would
# change (the overlay and what it allows, that it approves nothing by
# itself, the steps a project would need, where it could not apply, the
# vote it needs); that the analysis gives no cost estimate; both sides;
# what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". The card and title carry it.
#
# Every explaining line is the City Attorney's impartial analysis, with
# the measure's own text beside it where the text says more (the
# single-family and low-density districts it excludes). The ballot
# question's purposes (preventing crime and encampments, attracting
# businesses) are on the card, not narrated.
#
# The card quotes the Los Angeles County Registrar-Recorder/County
# Clerk's list "Measures Appearing on the Ballot": the City's heading,
# the vote needed and the ballot question, which has no yes or no
# sentences, so the card has no boxes. The vote lines give the impartial
# analysis's own meanings, and both highlight the same phrase.
#
# The argument in favor is the Registrar's printed copy, signed by all
# five Council members. The list says "Opponents: None submitted.", so
# the no side says plainly that no argument against was submitted,
# citing the list (filed = false). Neither side names anyone: the record
# names no one on the no side.

contest = "ca-2026-11-03-monterey-park-measure-hom"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "HOM"
title = "CITY OF MONTEREY PARK"
origin = "VOTE PASSAGE – Majority Vote 50%+1"
summary = "Proposition to Create HOME Housing Overlays in Monterey Park Shall a measure amending the Monterey Park Land Use Element to keep residential neighborhoods intact through maintaining voter-approved land use restrictions and Monterey Park's local control over the state for housing decisions, continue prohibiting data centers, provide housing for residents, prevent crime/homeless encampments, attract businesses, and improve the local economy by allowing limited residential uses in underutilized industrial, commercial/office areas, requiring public input, ensuring environmental protections, protecting public safety, parks/open space, be adopted?"

[[section]]
id = "what"
heading = "Measure HOM"

[[section.line]]
text = "Measure HOM asks the voters of this city whether to allow housing in certain commercial and industrial areas."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["allowing limited residential uses in underutilized industrial, commercial/office areas"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "voter-approval"
text = "Since 1982, any change to the land use part of the general plan has needed voter approval."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "zoning-map"

[[section.line]]
text = "The City Council placed Measure HOM on the ballot."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "city-council-chamber"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "overlay"
text = "Measure HOM would create a housing overlay that could allow apartments, townhomes, condominiums and mixed-use buildings in commercial and industrial areas on the city map."
sources = ["impartial-analysis", "full-text"]

[section.line.visual]
kind = "illustration"
name = "mixed-use-storefronts"

[[section.line]]
id = "no-projects"
text = "Measure HOM itself would approve no development."
sources = ["impartial-analysis", "full-text"]

[section.line.visual]
kind = "illustration"
name = "warehouse-loading-docks"

[[section.line]]
id = "steps"
text = "The council would first adopt zoning rules, and each project would then need council approval after a public hearing."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "city-council-chamber"

[[section.line]]
id = "excluded"
text = "The overlay could not be used in single-family or other low-density neighborhoods, and the ban on data centers would stay."
sources = ["impartial-analysis", "full-text"]

[section.line.visual]
kind = "illustration"
name = "single-family-street"

[[section.line]]
text = "Measure HOM needs a majority yes vote to pass."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "fiscal"
heading = "What the impartial analysis says"

[[section.line]]
text = "The city attorney's impartial analysis does not include a cost estimate for the measure."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"
stamp = "None reported"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Measure HOM lets the city revive underused commercial and industrial land while keeping existing neighborhoods as they are."
sources = ["argument-for"]
basis = ["Measure HOM provides the flexibility to revitalize underutilized commercial and industrial properties while preserving existing neighborhoods and maintaining local control over future development."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Revives underused land", "Keeps neighborhoods intact"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "The official county list of measures, which names who filed each argument, says no argument against Measure HOM was submitted."
sources = ["measure-list"]

[section.line.visual]
kind = "list"
source = "measure-list"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote creates the housing overlay and lets the council write its zoning rules."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["allowing limited residential uses in underutilized industrial, commercial/office areas"]

[[section.line]]
text = "A no vote leaves the land use plan and its map unchanged, with no housing overlay."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["allowing limited residential uses in underutilized industrial, commercial/office areas"]

[[question]]
ask = "Would this approve any housing projects?"
lines = ["no-projects", "steps"]

[[question]]
ask = "Could housing go into single-family neighborhoods?"
lines = ["excluded"]

[[question]]
ask = "Why is this on the ballot at all?"
lines = ["voter-approval"]
