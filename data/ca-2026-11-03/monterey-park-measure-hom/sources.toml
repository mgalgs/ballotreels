# Archived sources for City of Monterey Park Measure HOM, 2026-11-03
# general election (sources/la-sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The Los Angeles County Registrar-Recorder/County Clerk's list "Measures
# Appearing on the Ballot" is the authority for the letter and the ballot
# question, quoted on the card; its "Opponents: None submitted." is the
# official statement that no argument against was filed (`measure-list`).
# The City Attorney's impartial analysis is the City's posted copy,
# drafted before the letter was assigned ("Measure XX"); it is the
# measure's neutral explanation, the kind a state's attorney general's
# explanatory statement is, and gives no cost estimate. The full text and
# the argument in favor are the Registrar's own copies from its
# Interactive Sample Ballot. Resolution No. 2026-R63 carries the same
# text and is not cited.

