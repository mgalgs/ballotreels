# Archived sources for Upper Bay Permanent Road Division Measure FF,
# 2026-11-03 general election (sources/sources.md). Every id here may be
# cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# A permanent road division has no Census boundary, so the division is
# the county and `voters` names the road division (docs/SCRIPT-FORMAT.md).
# The county's list of measures is the authority for the letter (the
# Board's documents do not carry it); the Registrar of Voters' staff
# report 26-4515 (September 8, 2026) gives the vote required ("requires
# 2/3 approval"). Marin County's own Measure FF page has no capture, so
# no impartial analysis, argument or rebuttal was reached, and no
# document says whether any argument was filed.
#
# The card quotes the ballot question from paragraph 8 of the signed
# Board of Supervisors Resolution No. 2026-071 (July 14, 2026), which is
# also the measure's operative text (a road division's tax is levied by
# resolution; there is no ordinance). It has a text layer. The question
# prints "to fun improvements"; the card quotes it as printed. Exhibit C
# to the resolution, the Notice of Special Election, describes the road
# work and where it runs. The vote certification records the adoption.
# Resolution No. 26-052 (June 23, 2026) formed the division.
#
# The county's own records disagree on the figure $456,750: the ballot
# question calls it "a total assessment of approximately $456,750 each
# year", paragraph 7 "a total tax revenue of approximately $456,750 in
# the first year", the notice "approximately $456,750 per year", while
# the resolution's recital and the Public Works staff report call it the
# total over the 10 years. The script does not narrate the figure; the
# card shows the question verbatim.
#
# The Public Works staff report is the County staff's material: it is
# cited only for plain facts, attributed to it (the division's ten
# improved parcels and one unimproved parcel). The petition and the
# public comment name private people and were not staged; neither is
# used.

