# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the road today and who keeps it
# up; who formed the division and placed the measure, and the vote it
# needs; what would change (the rates for 10 years, then the maintenance
# rate, what the money pays for); the loan the resolution provides; both
# sides, for neither of which an argument was filed; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this road division", and the road is "a
# private road". The card, the title and the "Only voters in
# ..." line carry the names.
#
# The card quotes the ballot question as the county's measure page
# prints it (paragraph 8 of Resolution No. 2026-071 prints a different
# one). The page prints only bare YES and NO, so the card has no boxes
# and the vote lines take their meaning from the question.
#
# The figure $456,750 is not narrated: the county's question says
# "totaling approximately $456,750" and its impartial analysis
# "approximately $456,750 annually", the resolution's recital and the
# staff report the total over 10 years (sources.toml). The script gives the per-parcel rates
# and the term, which every record states alike; the per-parcel amounts
# are exempt from scale (STANDARD.md 6.5). The fiscal section says what
# the resolution provides for a loan, which it states without figures.
#
# The formation resolution's recitals (the petition, the objections to
# forming the division) are not used: with no argument filed on either
# side, the script does not set out either side's case.
#
# The county's page says no argument in favor and no argument against
# Measure FF was filed, so each side says so, attributed to the county
# (filed = false, STANDARD.md 2.5).

contest = "ca-2026-11-03-upper-bay-prd-measure-ff"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "county-page"
number = "FF"
title = "Upper Bay Permanent Road Division"
origin = "County of Marin"
summary = "Shall the measure be adopted authorizing a special tax on parcels within the Division of $4,350 per improved parcel and $2,175 per unimproved parcel per year for 10 years, beginning Fiscal Year 2027-28, totaling approximately $456,750, to fund improvements; thereafter, authorizing a special tax of $455 per parcel per year for ongoing maintenance, adjusted annually effective July 1 every year in accordance with the Consumer Price Index for All Urban Consumers San Francisco—Oakland—Hayward for the previous calendar year."

[[section]]
id = "what"
heading = "Measure FF"

[[section.line]]
text = "Measure FF asks the voters of this road division whether to approve a yearly parcel tax to repave and maintain a private road."
sources = ["county-page", "notice"]

[section.line.visual]
