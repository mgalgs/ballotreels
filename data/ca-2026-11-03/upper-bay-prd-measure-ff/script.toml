# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the road today and who keeps it
# up; who formed the division and placed the measure, and the vote it
# needs; what would change (the rates for 10 years, then the maintenance
# rate, what the money pays for); the loan the resolution provides; both
# sides, neither of which has an archived argument; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this road division", and the road is "a
# private road". The card, the title and the "Only voters in
# ..." line carry the names.
#
# The card quotes the ballot question from paragraph 8 of Resolution No.
# 2026-071, as printed ("to fun improvements"). It prints no yes/no
# lines, so the card has no boxes and the vote lines take their meaning
# from the question.
#
# The figure $456,750 is not narrated: the ballot question calls it a
# yearly total, the resolution's recital and the staff report the total
# over 10 years (sources.toml). The script gives the per-parcel rates
# and the term, which every record states alike; the per-parcel amounts
# are exempt from scale (STANDARD.md 6.5). The fiscal section says what
# the resolution provides for a loan, which it states without figures.
#
# The formation resolution's recitals (the petition, the objections to
# forming the division) are not used: with no argument filed on either
# side, the script does not set out either side's case.
#
# No argument for or against Measure FF was archived, and no document
# says whether any was filed, so each side says none is among the
# documents gathered (filed = false, STANDARD.md 2.5), as for Walnut
# Creek Measure U.

contest = "ca-2026-11-03-upper-bay-prd-measure-ff"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "resolution"
number = "FF"
title = "MEASURE SUBMITTED TO VOTE OF VOTERS OF UPPER BAY PERMANENT ROAD DIVISION FOR APPROVAL OF SPECIAL TAX AND LOAN AND ITS REPAYMENT"
origin = "Board of Supervisors of the County of Marin"
summary = "Shall the measure be adopted authorizing a special tax on parcels within the Division of $4,350 per improved parcel per year and $2,175 per unimproved parcel per year for 10 years, beginning in fiscal year 2027-28, resulting in a total assessment of approximately $456,750 each year, to fun improvements; thereafter, beginning in fiscal year 2037-2038, the special tax shall be $455 per year for each year until repealed, to fund ongoing maintenance, with a provision for an annual adjustment effective July 1 every year in accordance with the change in the Consumer Price Index for All Urban Consumers San Francisco—Oakland—Hayward for the previous calendar year."

