# Archived sources for Julian Union High School District Measure J,
# 2026-11-03 general election (sources/sources.md). Every id here may be
# cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1). The guide's pages are cut from the San
# Diego County Registrar of Voters' Voter Information Guide (ballot type
# 480, a Julian precinct); "page" is the guide's printed footer number.

