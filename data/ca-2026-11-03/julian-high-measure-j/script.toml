# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and whose measure it is; how the bonds are repaid and the vote they
# need; what the money would pay for, and the impartial analysis's caveat
# that approval does not guarantee the projects; the tax rate statement's
# estimates; one line per side; what a vote does.
#
# The tax rate and the bond total are given as the statement and the
# ballot give them. The bonds are repaid from a tax on property in the
# district, and no archived source states the district's budget, so the
# total repaid has no scale (STANDARD.md 6.5; left open). The citizens'
# oversight and audits are the supporters' point too ("An Independent
# citizens' oversight committee, annual audits, and public disclosure are
# required"), so the neutral lines leave them to the card and the yes
# side (STANDARD.md 6.3). County Counsel's Impartial Analysis is cited as
# the guide page; "Counsel" is heard as "Council"
# (standard/speakability.txt).
#
# No argument against was filed ("No Argument Against Measure J was filed
# with the Office of the Registrar of Voters"): the no side says so,
# filed = false (STANDARD.md 2.5).

contest = "ca-2026-11-03-julian-high-measure-j"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide-page"
number = "J"
title = "JULIAN UNION HIGH SCHOOL DISTRICT"
origin = "The Board of Education for the Julian Union High School District (“District”) placed this measure on the ballot."
summary = "To repair, modernize, and construct classrooms and career technology facilities for college/career readiness in agricultural science, chemistry, math, technology, and skilled trades; fix deteriorating facilities, roofs, plumbing/electrical systems; and improve school safety/security systems; shall Julian Union High School District's measure authorizing $9,000,000 in bonds at legal rates be adopted, levying approximately $30 per $100,000 assessed value (averaging $650,000) annually, while bonds are outstanding, with citizen oversight, independent audits, and all money locally-controlled?"
yes = "A “YES” vote is in favor of authorizing the District to issue and sell $9,000,000 in general obligation bonds."
no = "A “NO” vote is against authorizing the District to issue and sell $9,000,000 in general obligation bonds."

[[section]]
id = "what"
heading = "Measure J"

[[section.line]]
text = "Julian Union High School District Measure J asks the district's voters whether to approve $9 million in school bonds."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["$9,000,000 in bonds"]

[[section]]
id = "today"
heading = "How school bonds work"

[[section.line]]
text = "The bonds would be repaid, with interest, by a yearly tax on the assessed value of property in the district."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "bond-certificates"

[[section.line]]
text = "Measure J needs 55 percent of the vote to pass."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "The money would modernize classrooms and career facilities for agricultural science and skilled trades, and fix roofs and plumbing."
