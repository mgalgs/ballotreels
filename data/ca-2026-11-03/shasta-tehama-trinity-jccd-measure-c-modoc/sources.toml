# Archived sources for Shasta-Tehama-Trinity Joint Community College
# District Measure C, 2026-11-03 general election, as Modoc County's
# voters see it (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# Modoc County posts no voter guide for this election, only each
# measure's documents. For Measure C that is the district's packet, one
# PDF with a text layer: the board's resolution, the full text of the
# measure (Appendix A), the ballot question (Appendix B, page 13) and
# the tax rate statement (Appendix C, pages 14 and 15), the measure's
# fiscal statement; and the argument in favor. Modoc posts no impartial
# analysis (the Trinity and Lassen guides print it) and no argument
# against, and with no guide of its own it is not known from Modoc's
# documents whether one was filed.
#
# A community college district has no Census boundary, so the measure's
# division is the county and `voters` names the district
# (docs/SCRIPT-FORMAT.md). The district reaches into six counties (the
# tax rate statement names them); Shasta, its home county, keeps the
# plain shasta-tehama-trinity-jccd-measure-c, and Tehama, Trinity, Lassen,
# Modoc and Humboldt each stage the same measure under a suffixed id.

[contest]
id = "ca-2026-11-03-shasta-tehama-trinity-jccd-measure-c-modoc"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/county:modoc"
kind = "measure"
title = "Shasta-Tehama-Trinity Joint Community College District Measure C: College Facility Bonds"
voters = "the Shasta-Tehama-Trinity Joint Community College District"

