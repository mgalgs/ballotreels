# Archived sources for City of Coalinga Measure J, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The Fresno County Registrar of Voters posts each measure's filed
# documents on its election page; no printed Voter Information Guide
# was found online. The ballot question is quoted from City Council
# Resolution No. 4337, Section 4 ("Form of Measure"), which also gives
# the synopsis and the tax's present expiry. The City Attorney's
# impartial analysis is the measure's neutral explanation, the kind a
# state's attorney general's explanatory statement is. No tax rate
# statement or fiscal analysis applies (a sales tax); the revenue figure
# and its share of the general fund are the ballot question's own.
#
# Every PDF is a scan with no text layer. The passages cited were typed
# from the page images into sources/*-transcription.txt, each naming the
# PDF and URL it copies; those sources point at the transcription, and
# their url at the scan (as Clayton Measure M's do). No rebuttal to the
# argument in favor was filed; the rebuttal to the argument against is
# archived but not cited.

[contest]
id = "ca-2026-11-03-coalinga-measure-j"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:coalinga"
kind = "measure"
title = "City of Coalinga Measure J: Extending the One-Cent Sales Tax"

