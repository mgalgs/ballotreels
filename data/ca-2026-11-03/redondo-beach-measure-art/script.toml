# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; why it is on the ballot (plans
# last updated in 1992, the charter's required vote); what changes along
# the two commercial boulevards, in the industrial and highway areas, and
# in housing density; the vote it needs; no cost estimate; one line per
# side; what a vote does.
#
# No place name is narrated: the opening says "the voters of this city",
# Artesia and Aviation Boulevards are "two commercial boulevards" and the
# area north of Manhattan Beach Boulevard is "industrial areas". The
# floor area ratios (0.6 to 1.5) are on the chart, not said: a decimal
# is misheard. The card quotes the Registrar-Recorder's list: the city's
# heading as the title, its vote-passage line as the origin, the ballot
# question as the summary. The list prints no yes/no statements; the vote
# lines take their meanings from the impartial analysis.
#
# The $250,000 cost of the special election is the opponents' figure, in
# no neutral document, so it is not given (STANDARD.md 6.3).

contest = "ca-2026-11-03-redondo-beach-measure-art"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "ART"
title = "CITY OF REDONDO BEACH"
origin = "VOTE PASSAGE – Majority Vote 50%+1"
summary = "Shall the measure be adopted to amend the Redondo Beach General Plan and Zoning Ordinance to support increased commercial activity in key areas of the City, including expanded property development potential (i.e. new floor area ratio caps, height limits, and rooftop dining) along Artesia and Aviation Boulevards, industrial properties north of Manhattan Beach Boulevard, and certain commercial properties along Pacific Coast Highway; and to reduce the allowed housing density for some residential and mixed-use properties in the City?"

[[section]]
id = "what"
heading = "Measure ART"

[[section.line]]
text = "Measure ART asks the voters of this city whether to change zoning to allow more commercial building, and less housing density in places."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["support increased commercial activity", "reduce the allowed housing density"]

[[section]]
id = "background"
heading = "Why it is on the ballot"

[[section.line]]
id = "why-vote"
text = "The land use plans of the city were last substantially updated in 1992, and the city charter requires a public vote on these amendments."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "zoning-map"

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Along two commercial boulevards, buildings are limited today to 30 feet and two stories."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "bars"
title = "Maximum floor area ratio, Artesia and Aviation Boulevards"
source = "impartial-analysis"
unit = ""
labels = ["Today", "Measure ART"]
values = [0.6, 1.5]

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "Measure ART would allow 45 feet and three stories there, with more floor area and design standards for pedestrians."
sources = ["impartial-analysis"]

[[section.line]]
text = "Industrial areas, and some commercial areas along Pacific Coast Highway, could also build more floor area."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "mixed-use-storefronts"

[[section.line]]
id = "density"
text = "Allowed housing density would fall from 35 to 30 homes per acre in some areas, and rise from 28 to 30 in others."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "apartment-building"

[[section.line]]
text = "Measure ART needs a simple majority to pass."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "fiscal"
heading = "What it would cost"

[[section.line]]
text = "The county Registrar's list of measures does not include a cost estimate for the measure."
sources = ["ballot-question"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"
stamp = "None reported"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say modern zoning would bring new restaurants, shops and jobs, and more city revenue without taxing residents."
sources = ["argument-for"]
basis = ["modernizing outdated zoning to bring new restaurants, shops, and jobs to our commercial corridors", "should also generate more revenue for the City's General Fund without taxing residents."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Restaurants, shops and jobs", "City revenue without new taxes"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say one all-or-nothing vote bundles separate changes, and added zoning capacity does not guarantee projects get built."
sources = ["argument-against"]
basis = ["It combines commercial, residential, inland, and coastal changes affecting separate corridors and neighborhoods into one all or nothing vote.", "These changes do not guarantee feasible, approved, financed, or completed projects."]

[section.line.visual]
kind = "list"
source = "argument-against"
items = ["Separate changes in one vote", "No guarantee of projects"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote approves the land use and zoning changes."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["amend the Redondo Beach General Plan and Zoning Ordinance"]

[[section.line]]
text = "A no vote opposes the changes."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["amend the Redondo Beach General Plan and Zoning Ordinance"]

[[question]]
ask = "Why is this on the ballot at all?"
lines = ["why-vote"]

[[question]]
ask = "Would it add or remove housing?"
lines = ["density"]
