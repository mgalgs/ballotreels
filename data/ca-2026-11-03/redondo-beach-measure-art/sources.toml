# Archived sources for City of Redondo Beach Measure ART, 2026-11-03
# general election (sources/la-sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The Los Angeles County Registrar-Recorder/County Clerk's list "Measures
# Appearing on the Ballot" is the authority for the measure's letter,
# ballot question and vote threshold, and names who filed the arguments;
# sources/county-measure-list-excerpt.txt is the measure's entry, cut from
# it. The City Clerk posts the City Attorney's impartial analysis (the
# measure's neutral explanation) and the two arguments, each on the
# Registrar-Recorder's Ballot Label/Arguments and Rebuttals Form. The
# arguments' text layers are OCR with many misread letters ("commerciaI",
# "atso"), so their pages were typed from the page images into
# sources/argument-*-transcription.txt, which those sources point at; the
# urls are the PDFs'. The rebuttals (scans), the full text, the
# resolution and the City's FAQ are not cited. A land use measure, not a
# tax: no fiscal statement applies, and none was found.

[contest]
id = "ca-2026-11-03-redondo-beach-measure-art"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:redondo_beach"
kind = "measure"
title = "City of Redondo Beach Measure ART: Commercial and Industrial Zoning Changes and Lower Housing Density in Some Areas"

[[source]]
id = "ballot-question"
kind = "official-title-summary"
