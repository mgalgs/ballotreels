# Archived sources for City of Rio Vista Measure O, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# No printed Solano County voter guide was archived: these are the filed
# documents the Solano County Registrar of Voters posts on its Current
# Election Information page. The ballot question is quoted from
# Resolution No. 2026-033, which sets it out (its Section 3); the
# Registrar's Notice of Measures (August 5, 2026) prints the same
# question. The resolution, the City Attorney's impartial analysis and
# the argument in favor are scans with no text layer: the passages
# `check` reads verbatim were typed from the page images into
# transcriptions beside the PDFs, which name the PDF and URL they copy;
# those sources point at the transcriptions, and their urls at the
# scans. The impartial analysis is the measure's neutral explanation. No
# tax rate statement or fiscal analysis applies (a sales tax); the one
# revenue estimate is the City's, as the question and the analysis give
# it. The rebuttals are not cited.

[contest]
id = "ca-2026-11-03-rio-vista-measure-o"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:rio_vista"
kind = "measure"
title = "City of Rio Vista Measure O: Three-Year Extension of the General City Services Sales Tax"

