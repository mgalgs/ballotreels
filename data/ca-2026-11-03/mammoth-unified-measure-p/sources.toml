# Archived sources for Mammoth Unified School District Measure P,
# 2026-11-03 general election (sources/sources.md). Every id here may be
# cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# Mono County Elections prints the whole measure in its Voter Information
# Guide and Sample Ballot, cut here from ballot type B004 (amended) to
# PDF pages 9 and 20 to 22: the sample ballot page with the ballot label
# (9), the full text (20 and 21), the impartial analysis (21), and the
# argument in favor with "No Argument Against Measure P was Filed" (22).
# The impartial analysis is the measure's neutral explanation and gives
# the district's revenue estimate; a parcel tax has no tax rate
# statement. No rebuttals are printed. Of the two separate postings
# archived beside it, sources/impartial-analysis.pdf is the county
# site's "Object moved" HTML redirect, not the analysis, and
# sources/argument-in-favor.pdf is a scan with no text layer; neither is
# cited, and the guide prints both documents.

[contest]
id = "ca-2026-11-03-mammoth-unified-measure-p"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/school_district:mammoth_unified_school_district"
kind = "measure"
title = "Mammoth Unified School District Measure P: Replacement Education Parcel Tax"

