# Archived sources for City of Newark Measure DD, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. The guide's pages are cut from the Alameda County
# Registrar of Voters' Composite Voter Information Guide (965 pages);
# "pages" are the PDF's page numbers, with the printed footer (NMDD-1 on)
# beside them.
#
# The guide prints the ballot question, the City Attorney's Impartial
# Analysis, an argument in favor and an argument against, a rebuttal to
# each, and the full text of the ordinance. It prints no tax rate
# statement.

