# Archived sources for City of Whittier Measure EL, 2026-11-03 general
# election (sources/la-sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The Los Angeles County Registrar-Recorder/County Clerk's list "Measures
# Appearing on the Ballot" (sources/county-measure-list-excerpt.txt, the
# measure's entry) gives its letter, vote threshold and ballot question,
# which the card quotes, and says "Opponents: None submitted.", which the
# no side cites as the official statement of filing. The same list says
# "Supporters: None submitted.", but the Registrar's Interactive Sample
# Ballot prints an argument in favor (sources/argument-for.html), so the
# yes side follows that argument; the Sample Ballot's page also prints
# "NO ARGUMENT AGAINST THIS MEASURE WAS SUBMITTED".
#
# The City Attorney's impartial analysis and the full text of the
# ordinance amending the charter, as the Registrar prints them, are the
# measure's neutral explanation and its text. Neither gives a cost
# estimate.

[contest]
id = "ca-2026-11-03-whittier-measure-el"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:whittier"
kind = "measure"
title = "City of Whittier Measure EL: A 12-Year Limit for the Mayor and City Council"

