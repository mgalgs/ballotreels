# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the office today (elected, four
# years, what it does, who may hold it); what would change (who hires
# and supervises, from when, a treasurer elected on this ballot not
# seated, the vote it needs); no cost estimate; one line per side; what a
# vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". The card and title carry it.
# "Appointive" is misheard (standard/speakability.txt), so the narration
# says "appointed"; the card keeps the ballot's word.
#
# The card quotes Amador County Elections' Measure R Question page: its
# heading, "MEASURE R", and the ballot question. The page's
# "Supporters: ... Opponents: None submitted" line is left off the card
# (SCRIPT-FORMAT.md, the card); the no side says it. The page prints
# "Yes" and "No" with no sentences, so the vote lines give the impartial
# analysis's meanings and both highlight the question.
#
# The office today is described only as the City Attorney's impartial
# analysis describes it, including both that an elected treasurer must
# live and be registered in the city and that no minimum training is
# required. That city staff already do most of the work, and the share of
# cities with appointed treasurers, are the supporters' points, so they
# stay in the yes side (STANDARD.md 6.3).
#
# The ballot question page says "Opponents: None submitted", so the no
# side says plainly that no argument against was submitted (filed =
# false, STANDARD.md 2.5).

contest = "ca-2026-11-03-sutter-creek-measure-r"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "R"
title = "CHANGING THE CITY TREASURER POSITION FROM ELECTED TO APPOINTED."
origin = "MEASURE R"
summary = "Shall the office of City Treasurer be appointive?"

[[section]]
id = "what"
heading = "Measure R"

[[section.line]]
text = "Measure R asks the voters of this city whether the city treasurer should be appointed instead of elected."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["Shall the office of City Treasurer be appointive?"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "elected"
text = "Today, the voters of the city elect the treasurer to four-year terms."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "ballot-box"

[[section.line]]
id = "duties"
text = "The treasurer prepares reports on the bank deposits and payments of the city, and has other financial duties."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "state-budget"

[[section.line]]
id = "qualifications"
text = "An elected treasurer must live and be registered to vote in the city, and needs no minimum training or qualifications."
sources = ["impartial-analysis"]

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "who"
text = "The city council, or an officer it names, such as the city manager, would hire, fire and supervise the treasurer."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "city-council-chamber"

[[section.line]]
id = "when"
text = "The treasurer would become a city employee from December 2026, and anyone elected treasurer on this ballot would not be seated."
sources = ["impartial-analysis", "text"]

[section.line.visual]
kind = "illustration"
name = "city-clerk-office"

[[section.line]]
id = "threshold"
text = "Measure R needs a simple majority to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "fiscal"
heading = "What it would cost"

[[section.line]]
text = "The county election documents for Measure R do not include a cost estimate for the measure."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"
stamp = "None reported"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say staff already do nearly all treasury work, so an elected treasurer adds duplication and election costs."
sources = ["argument-for"]
basis = ["Today, the City's professional finance staff performs nearly all of the day-to-day treasury functions", "Maintaining separate elected and administrative roles for the same responsibilities creates unnecessary duplication, administrative inefficiency, and additional election costs."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Staff already do the treasury work", "Ends duplication and election costs"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure R was submitted: the county ballot question page lists its opponents as none submitted."
sources = ["ballot-question"]

[section.line.visual]
kind = "list"
source = "ballot-question"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote makes the city treasurer an appointed position."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["Shall the office of City Treasurer be appointive?"]

[[section.line]]
text = "A no vote keeps the city treasurer an elected position."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["Shall the office of City Treasurer be appointive?"]

[[question]]
ask = "What does the city treasurer do?"
lines = ["duties"]

[[question]]
ask = "Who would choose the treasurer, and when?"
lines = ["who", "when"]

[[question]]
ask = "What happens to a treasurer elected on this same ballot?"
lines = ["when"]

[[question]]
ask = "Would an appointed treasurer have to live in the city?"
unanswered = true

[[question]]
ask = "What vote does the measure need to pass?"
lines = ["threshold"]
