# Archived sources for City of Sutter Creek Measure R, 2026-11-03 general
# election (sources/county-sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# Amador County Elections posts each measure's documents as separate PDFs
# on its "2026 General Election" page: Measure R's ballot question (which
# also lists the supporters who signed the argument in favor and
# "Opponents: None submitted"), the City Attorney's impartial analysis,
# the full text (the City Council's resolution placing the measure, as
# excerpted for the ballot) and the argument in favor. The City
# Attorney's impartial analysis is the measure's neutral explanation.
# Not a tax: no fiscal statement applies. The signed resolution
# (Resolution 25-26-32, sources/county-resolution.pdf) is a scan with no
# text layer; the script cites nothing only it gives, so it is not listed
# here and was not transcribed.

[contest]
id = "ca-2026-11-03-sutter-creek-measure-r"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:sutter_creek"
kind = "measure"
title = "City of Sutter Creek Measure R: Appointed City Treasurer"

