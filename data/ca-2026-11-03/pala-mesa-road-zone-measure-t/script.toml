# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and whose measure it is; what the zone's parcels pay today and the
# vote the tax needs; what would change (the tax, what it pays for, how it
# may rise); the impartial analysis's revenue estimate; both sides, which
# filed nothing; what a vote does.
#
# No arguments were filed ("NO ARGUMENTS WERE FILED WITH THE REGISTRAR OF
# VOTERS."): both sides say so, filed = false (STANDARD.md 2.5), citing
# the guide page that prints the notice. The guide prints no tax rate
# statement; the one revenue estimate is County Counsel's, which the
# fiscal line names as the impartial analysis ("Counsel" is heard as
# "Council", standard/speakability.txt). It is county revenue, and no
# archived source states the budget it would go into, so it has no scale
# (STANDARD.md 6.5; left open). No archived source states the existing
# assessment's amount or where the zone is, so the script says neither.

contest = "ca-2026-11-03-pala-mesa-road-zone-measure-t"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide-page"
number = "T"
title = "PERMANENT ROAD DIVISION ZONE NO. 13A - PALA MESA"
origin = "The Board of Supervisors for the County of San Diego placed this Measure on the ballot."
summary = "Shall the County of San Diego, beginning Fiscal Year 2027-28 and annually thereafter, levy a special tax of up to $1,786.00 per developed / $893.00 per undeveloped parcel within Permanent Road Division No. 1000, Zone No. 13A – Pala Mesa Zone A, replacing the existing assessment? The tax may be adjusted by up to 5% annually based on the Los Angeles Construction Cost Index or a comparable Southern California index and remain until modified or dissolved by law."
yes = "A “YES” vote is in favor of authorizing the County of San Diego to replace the existing assessment with a special tax of up to $1,786 per developed parcel and up to $893 per undeveloped parcel to fund ongoing road repair and maintenance within the Permanent Road Division."
no = "A “NO” vote is against authorizing the County of San Diego to replace the existing assessment with a special tax $1,786 per developed parcel and up to $893 per undeveloped parcel to fund ongoing road repair and maintenance within the Permanent Road Division."

