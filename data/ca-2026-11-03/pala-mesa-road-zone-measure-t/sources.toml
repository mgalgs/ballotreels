# Archived sources for Measure T of Permanent Road Division No. 1000,
# Zone No. 13A – Pala Mesa Zone A, 2026-11-03 general election
# (sources/sources.md). Every id here may be cited by script.toml. `kind`
# must be one the standard allows (docs/STANDARD.md, section 1). The
# guide's page is cut from the San Diego County Registrar of Voters' Voter
# Information Guide (ballot type 259); "page" is the guide's printed
# footer number.
#
# A county road zone is a special district: the division is the county,
# and `voters` names the zone as the Board of Supervisors' resolution and
# the ballot do (docs/SCRIPT-FORMAT.md). The ordinance (the resolution's
# Exhibit A) and the special tax report were not archived; the ballot
# question, County Counsel's Impartial Analysis and the notice that no
# arguments were filed cover what the script needs.

[contest]
id = "ca-2026-11-03-pala-mesa-road-zone-measure-t"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/county:san_diego"
kind = "measure"
title = "Pala Mesa Road Zone Measure T: Special Tax for Road Maintenance, Replacing the Existing Assessment"
voters = "Permanent Road Division No. 1000, Zone No. 13A – Pala Mesa Zone A"

[[source]]
id = "guide-page"
kind = "official-title-summary"
