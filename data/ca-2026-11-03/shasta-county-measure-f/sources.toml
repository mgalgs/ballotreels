# Archived sources for Shasta County Measure F, 2026-11-03 general
# election (sources/county-sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# Shasta County Elections prints each local measure's ballot question,
# impartial analysis and arguments in its County Voter Information
# Guide; each file here is that measure's page cut from one ballot type's
# guide (BT24), whose page numbers each citation gives. The card quotes
# the ballot question page. County Counsel's impartial analysis is the
# measure's neutral explanation, the kind a state's attorney general's
# explanatory statement is. No fiscal statement is printed for the
# measure. The opponents' rebuttal to the argument in favor is not cited:
# their line rests on their own argument against, as the supporters'
# rests on theirs (no rebuttal to the argument against was filed).

[contest]
id = "ca-2026-11-03-shasta-county-measure-f"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/county:shasta"
kind = "measure"
title = "Shasta County Measure F: Charter Rule for Filling Vacancies in Elected Department Head Offices"

