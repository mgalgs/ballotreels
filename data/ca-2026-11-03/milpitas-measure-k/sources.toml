url = "https://files.santaclaracounty.gov/exjcpb1296/2026-08/measure-k-city-of-milpitas-ia-20260818_redacted.pdf"
file = "sources/rov-impartial-analysis-transcription.txt"
retrieved = "2026-10-29"

[[source]]
