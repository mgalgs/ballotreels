# Archived sources for City of Milpitas Measure K, 2026-11-03 general
# election (sources/sources.md, sources/rov-sources.md). Every id here may
# be cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# The Santa Clara County Registrar of Voters' List of Local Measures is
# the authority for the measure's letter, ballot question and vote
# threshold. The impartial analysis and the arguments are the Registrar's
# posted copies, which supersede the City Clerk's copies archived beside
# them: scans with no text layer, whose verbatim checks read their
# transcriptions (sources/rov-*-transcription.txt, made from the page
# images); the urls are the PDFs'. The Registrar's argument-in-favor scan
# carries a sticky note reading "Primary Argument Against"; its printed
# heading and ticked box say in favor, which it is. Each argument is
# printed twice in its PDF and transcribed once. The City Attorney's
# impartial analysis is the measure's neutral explanation. A general tax
# has no tax rate statement; the ballot question gives the revenue
# estimate. Both rebuttals are archived and transcribed; the script quotes
# neither, so they are not listed here.

[contest]
id = "ca-2026-11-03-milpitas-measure-k"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:milpitas"
kind = "measure"
title = "City of Milpitas Measure K: Business Tax Update to a Gross Receipts Tax"

[[source]]
id = "ballot-question"
kind = "official-title-summary"
publisher = "County of Santa Clara Registrar of Voters, List of Local Measures, November 3, 2026 General Election: Measure K"
credit = "Santa Clara County Registrar of Voters, List of Local Measures"
url = "https://vote.santaclaracounty.gov/list-local-measures-4"
file = "sources/rov-measure-list-2026-10-29.html"
retrieved = "2026-10-29"

[[source]]
