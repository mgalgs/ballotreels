# Archived sources for City of Folsom Measure J, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# Sacramento County publishes no single Voter Information Guide PDF (each
# voter's guide is issued through a portal); its "Current Measure
# Information" page prints each measure's ballot question, impartial
# analysis, full text and arguments. sources/county-measure-page-item.txt
# is the text of Measure J's item on that page; every source cites it.
# Measure J is not a tax: the page prints no fiscal statement. The
# analysis is the City Attorney's, as its heading and signature give it.

[contest]
id = "ca-2026-11-03-folsom-measure-j"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:folsom"
kind = "measure"
title = "City of Folsom Measure J: Decision-Making Authority for Boards and Commissions"

