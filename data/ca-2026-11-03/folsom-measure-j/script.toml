# Recipe E, 60 seconds, distilled: one claim per line. The chain: what
# it asks and of whom; the charter's advisory-only rule today; how it
# reached the ballot and what it needs; what would change; what that
# means for projects the most affected commission reviews; no cost
# estimate; one line per side; what a vote does.
#
# Not a tax: the county page prints no fiscal statement, so the fiscal
# line says the page does not include a cost estimate. The card's title
# is the item's own head on the page; its origin is the analysis's
# sentence on who placed the measure.
#
# The supporters' argument cites that commission decisions stay
# appealable to the council and that the measure requires no delegation;
# both are theirs, so the neutral sections leave them out (STANDARD.md
# 6.3). The commission most likely affected is not named: its name
# ("Historic District") trips the judgment-word check, so the line says
# "one commission".
# Sides come from the argument in favor and the argument against, not
# the rebuttals (the rebuttals' lawsuit and appeal fee are left out).

contest = "ca-2026-11-03-folsom-measure-j"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-label"
number = "J"
title = "Measure J: City of Folsom"
origin = "On July 14, 2026, the City Council voted to place Measure J on the November ballot."
summary = "Shall the measure amending the Adopted Charter of the City of Folsom to confirm the City Council may grant decision making authority to Boards and Commissions by ordinance, be adopted?"
yes = "A “yes” vote on Measure J will authorize a Charter amendment to allow the City Council to grant decision-making authority to City boards and commissions."
no = "A “no” vote on Measure J will not authorize a Charter amendment to allow the City Council to grant decision-making authority to City boards and commissions. These bodies would remain advisory to the Council."

[[section]]
id = "what"
heading = "Measure J"

[[section.line]]
text = "City of Folsom Measure J asks voters in the city whether the City Council may give city boards and commissions the power to make decisions."
sources = ["ballot-label"]

[section.line.visual]
kind = "page"
source = "ballot-label"
highlight = ["grant decision making authority to Boards and Commissions"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Today, the City Charter says boards and commissions shall only advise the council, so they cannot make binding decisions."
sources = ["impartial-analysis", "text"]

[section.line.visual]
kind = "illustration"
name = "empty-commission-seat"

[[section.line]]
text = "The City Council placed Measure J on the ballot, and it needs a simple majority."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "ballot-box"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "Measure J would remove the advisory-only rule, so the council could grant a commission decision-making authority by ordinance."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "amended-page"

[[section.line]]
text = "The City Attorney's analysis says certain development projects reviewed by one commission may then proceed more quickly, without separate City Council approval."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "project-site"

[[section]]
id = "fiscal"
heading = "What it would cost"

[[section.line]]
text = "The Sacramento County Current Measure Information page does not include a cost estimate for the measure."
sources = ["ballot-label"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"
stamp = "None reported"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Measure J resolves conflicting charter language, and commission decisions could still be appealed to the council."
sources = ["arguments"]
basis = ["Measure J simply removes contradictory language and gives the City flexibility to define commission responsibilities clearly", "Decisions made under delegated authority remain subject to appeal to the City Council, preserving final oversight and accountability to voters."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Resolves conflicting charter language", "Decisions can still be appealed to the council"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say Measure J would let the council give unlimited authority to unelected commissioners, reducing accountability to voters."
sources = ["arguments"]
basis = ["approval of this ballot measure would allow the Council to give unlimited authority to non-elected Boards and Commissions.", "will reduce City Council accountability to the voters and should be rejected."]

[section.line.visual]
