items = ["Unlimited authority for unelected commissioners", "Less council accountability to voters"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote authorizes a charter amendment letting the council grant decision-making authority to boards and commissions."
