# Archived sources for City of South El Monte Measure RM, 2026-11-03
# general election (sources/la-sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The Los Angeles County Registrar-Recorder/County Clerk's list "Measures
# Appearing on the Ballot" is the authority for the measure's letter,
# ballot question and vote threshold, and names who filed the arguments;
# sources/county-measure-list-excerpt.txt is the measure's entry, cut from
# it. The City posts the City Attorney's impartial analysis (the
# measure's neutral explanation) and the two arguments, all text PDFs.
# The argument against's text sets some letter pairs ("ti", "tt") as a
# glyph pdftotext cannot map, so its basis quotes only passages without
# them. The rebuttals (images), Resolution No. 26-058 (a scan), the City
# Clerk's notice and the list's page PDF are not cited. Not a tax: no
# fiscal statement applies, and none was found.

