# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; how the council is made up today
# and since when (the 1999 vote); the state's default the measure would
# return to; when the change takes effect; the vote it needs; no cost
# estimate; one line per side; what a vote does.
#
# No place name is narrated: the opening says "the voters of this city".
# The card quotes the Registrar-Recorder's list: the city's heading as
# the title, its vote-passage line as the origin, the ballot question as
# the summary. The list prints no yes/no statements; the vote lines take
# their meanings from the impartial analysis.
#
# The 70 percent of the 1999 vote is the opponents' figure, in no
# neutral document, so the background gives only the year (STANDARD.md
# 6.3). Measure CL, on the same ballot, would limit council terms;
# neither measure's documents mention the other, so this script does not
# connect them.

contest = "ca-2026-11-03-south-el-monte-measure-rm"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "RM"
title = "CITY OF SOUTH EL MONTE"
origin = "VOTE PASSAGE – Majority Vote 50%+1"
summary = "Shall the voters amend the South El Monte Municipal Code to return to five elected City Council members and a Mayor selected from among the five elected City Council members?"

[[section]]
id = "what"
heading = "Measure RM"

[[section.line]]
text = "Measure RM asks the voters of this city whether the City Council, instead of voters, should choose the mayor from among its members."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["a Mayor selected from among the five elected City Council members"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "today-structure"
text = "Today, voters elect a mayor to a four-year term, and four council members, all citywide."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "city-council-chamber"

[[section.line]]
id = "history"
text = "Under state law, a council picks its own mayor unless voters choose an elected mayor, as voters here did in 1999."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "law-book"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "change-structure"
text = "Measure RM would return to five elected council members, who would pick one of themselves as mayor at least every two years."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "empty-commission-seat"

[[section.line]]
id = "timing"
text = "The current mayor would finish the term, and the office would leave the ballot starting in November 2028."
sources = ["impartial-analysis"]

[[section.line]]
text = "Measure RM needs a simple majority to pass."
sources = ["ballot-question"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "fiscal"
heading = "What it would cost"

[[section.line]]
text = "The county Registrar's list of measures does not include a cost estimate for the measure."
sources = ["ballot-question"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"
stamp = "None reported"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say a rotating mayor prevents long-term concentration of power, and gives every council member an equal platform."
sources = ["argument-for"]
basis = ["A rotating structure prevents the long-term centralization of executive authority in a single office.", "It ensures that every elected official has an equal platform to steer municipal policy"]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["No long-term concentration of power", "Every member gets an equal platform"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say voters should keep electing the mayor, who answers to every voter, not just three council colleagues."
sources = ["argument-against"]
basis = ["Keep our right to vote and elect our Mayor.", "An elected Mayor answers to every voter in the city, not just three colleagues."]

[section.line.visual]
kind = "list"
source = "argument-against"
items = ["Voters keep electing the mayor", "Mayor answers to every voter"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote has the City Council select the mayor, and makes that seat a council seat."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["a Mayor selected from among the five elected City Council members"]

[[section.line]]
text = "A no vote keeps electing the mayor directly."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["a Mayor selected from among the five elected City Council members"]

[[question]]
ask = "How is the mayor chosen now, and since when?"
lines = ["today-structure", "history"]

[[question]]
ask = "When would the change take effect?"
lines = ["timing"]
