# Archived sources for City of Indian Wells Measure H, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1). The pages are cut from the County of
# Riverside Registrar of Voters' County Voter Information Guide (ballot
# type 270, an Indian Wells precinct); "page" is the guide's page.
#
# The guide prints the ballot question, the ordinance's full text, the
# City Attorney's Impartial Analysis and an argument in favor; it prints
# "NO ARGUMENT FILED AGAINST MEASURE “H”", no rebuttals and no fiscal
# analysis. The 2026 measure reuses the letter of the 2005 admissions-tax
# measure it amends, which the analysis also calls "Measure H".

[contest]
id = "ca-2026-11-03-indian-wells-measure-h"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:indian_wells"
kind = "measure"
title = "City of Indian Wells Measure H: Exemptions from the City Admissions Tax"

