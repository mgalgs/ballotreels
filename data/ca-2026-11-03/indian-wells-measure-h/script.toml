# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks; the 2005 tax and who is exempt today; why it is on the ballot;
# what would change (the new exemption list, hotels, sponsors); no cost estimate; one line per side; what a vote
# does.
#
# Today's exemptions and the new ones are each said as the City
# Attorney's Impartial Analysis lists them, and the script draws no
# comparison between the two lists: the analysis states none, so who
# would gain or lose an exemption is left to the two lists (STANDARD.md
# 10.2).
#
# The guide prints no fiscal analysis (it is not a new tax), so the
# fiscal line says the guide does not include a cost estimate.
#
# The card quotes the sample ballot, which prints the question but no
# yes/no lines; the vote lines take the Impartial Analysis's yes/no
# meanings and highlight the question's own words, as Los Angeles County
# Measure A does.
#
# The guide prints an argument in favor and "NO ARGUMENT FILED AGAINST
# MEASURE “H”": the no side is filed = false, as for Proposition 37, and
# says so in the guide's own word.

contest = "ca-2026-11-03-indian-wells-measure-h"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-label"
number = "H"
title = "CLARIFYING NONPROFIT EXEMPTION FROM CITY ADMISSIONS TAX."
origin = "CITY OF INDIAN WELLS"
summary = "To safeguard tax-exemption benefits for residents and visitors who purchase tickets for events sponsored by charitable, religious, public service, and political organizations, shall the voters approve updates to the City's admissions-tax ordinance?"

[[section]]
id = "what"
heading = "Measure H"

[[section.line]]
text = "City of Indian Wells Measure H asks voters in the city whether to update which events are exempt from the city admissions tax."
sources = ["ballot-label", "analysis"]

[section.line.visual]
kind = "page"
source = "ballot-label"
highlight = ["updates to the City's admissions-tax ordinance"]

[[section]]
id = "background"
heading = "The admissions tax"

[[section.line]]
text = "In 2005, city voters approved a tax of up to 10 percent on admission charges to events."
sources = ["analysis"]

[section.line.visual]
kind = "illustration"
name = "event-tickets"

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Today, events by nonprofit groups such as country clubs, tennis clubs and schools are exempt."
sources = ["analysis"]

[section.line.visual]
kind = "illustration"
name = "law-book"

[[section.line]]
text = "Any change to the 2005 measure needs a majority of city voters, so the City Council placed Measure H on the ballot."
sources = ["analysis"]

[section.line.visual]
kind = "illustration"
name = "ballot-box"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "Measure H would exempt events run by government agencies, tax-exempt political groups, and federally tax-exempt charities, religious and educational groups."
sources = ["analysis", "text"]

[section.line.visual]
kind = "illustration"
name = "amended-page"

[[section.line]]
text = "Events at a hotel operating legally in the city would also be exempt."
sources = ["analysis", "text"]

[section.line.visual]
kind = "illustration"
name = "hotel-ballroom"

[[section.line]]
text = "Charges paid by event sponsors would stay exempt."
sources = ["analysis", "text"]

[[section]]
id = "fiscal"
heading = "What it would cost"

[[section.line]]
text = "The Riverside County Voter Information Guide does not include a cost estimate for the measure."
sources = ["analysis"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"
stamp = "None reported"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say the tax was never meant for charitable, religious, political or hotel events; Measure H fixes that."
sources = ["arguments"]
basis = ["It was never intended to apply to those", "attending charitable, religious, or political events, or to events held at our", "at our hotels, from paying the tax. Measure H fixes that problem."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Not meant for charitable or hotel events", "Measure H fixes that problem"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure H was filed, and none is printed in the Riverside County Voter Information Guide."
sources = ["arguments"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["No argument against was filed"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote will approve the updated exemptions from the admissions tax."
sources = ["analysis", "ballot-label"]

[section.line.visual]
kind = "page"
source = "ballot-label"
highlight = ["updates to the City's admissions-tax ordinance"]

[[section.line]]
text = "A no vote will not approve the updated exemptions from the admissions tax."
sources = ["analysis", "ballot-label"]

[section.line.visual]
kind = "page"
source = "ballot-label"
highlight = ["updates to the City's admissions-tax ordinance"]
