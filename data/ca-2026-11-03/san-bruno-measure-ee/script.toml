# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks; how the tax works today and who put the measure on the ballot;
# what would change (the flat $75 tier for all but the two excepted classes, the rates per $1,000 above it,
# that some pay less and some more, a general tax with no end date); the
# city's revenue estimate as the impartial analysis reports it; one line
# per side; what a vote does.
#
# ACRE posts no tax rate statement or fiscal analysis; the one revenue
# estimate is the city's (resolution recital and ballot question), which
# the City Attorney's impartial analysis reports as "The City estimated",
# so the fiscal line says so. No archived source states the city's
# general fund budget, so the $4 million has no scale (STANDARD.md 6.5;
# left open). The argument in favor's "more than $20 million" in revenue
# threatened by state actions is the supporters' own claim and is left
# out (rule 6.3). The two classes the measure leaves unchanged (cardrooms
# and airport parking) are left out for length.
#
# The card quotes the Council's resolution, where the ballot question is
# printed; its title is the resolution's heading, cut after the measure's
# subject, and its origin is the City Clerk's adoption certificate. The
# resolution's ballot box prints only "Yes" and "No", so the card has no
# yes/no statements; the vote lines take the impartial analysis's own
# meanings ("a vote to amend ... to revise the business license tax
# rates and structure"; "a vote to not amend ... and maintain the
# current business license tax rates and structure") and both highlight
# the same phrase of the ballot question. That residents are not taxed,
# the $75 base rate as protection for small businesses, and the services
# named are left to the supporters; higher prices and relocation to the
# opponents (rule 6.3).

contest = "ca-2026-11-03-san-bruno-measure-ee"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-label"
number = "EE"
title = "A MEASURE TO MODERNIZE AND SIMPLIFY THE BUSINESS LICENSE TAX"
origin = "I hereby certify that foregoing Resolution No. 2026 – 079 was introduced and adopted by the San Bruno City Council at a regular meeting on July 28, 2026"
summary = "San Bruno Essential Services Protection Measure. To protect essential services such as: fixing potholes/city streets; providing rapid response to 9-1-1 emergency calls; maintaining library programs for children, teens, adults/seniors; maintaining parks/open space; and general city services, shall the measure be adopted simplifying/modernizing San Bruno's business license ordinance, making rates more equitable/equal, updating the tax rate schedule as described in the ordinance, until ended by voters, raising $4,000,000 annually, with annual independent audits?"

