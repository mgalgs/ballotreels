# Archived sources for City of San Bruno Measure EE, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1). Each document is the copy the San Mateo
# County Assessor-County Clerk-Recorder & Elections (ACRE) posts on its
# election page; the county publishes each measure's documents
# separately, not as one pamphlet.
#
# The resolution and both arguments are scans with no text layer, so
# each has a typed transcription beside it (sources/*.txt, its first
# lines saying which pages it copies), and `file` names the
# transcription; `url` is the PDF's. The City Attorney's impartial
# analysis has a text layer and is cited as the PDF itself.
#
# The ballot question is printed only in the Council's resolution (its
# Section 2), so the resolution backs two sources: the ballot label the
# card quotes, and the full text. Only the resolution's own pages (1-3)
# are transcribed, not the 33-page ordinance in Exhibit A. ACRE posts no
# tax rate statement or fiscal analysis for this measure (not required
# for a business license tax); the one revenue estimate is the city's,
# in the resolution and reported by the City Attorney. The rebuttals are
# archived and not cited.

[contest]
id = "ca-2026-11-03-san-bruno-measure-ee"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:san_bruno"
kind = "measure"
title = "City of San Bruno Measure EE: Revised Business License Tax"

