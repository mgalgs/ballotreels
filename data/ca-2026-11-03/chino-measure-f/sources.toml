# Archived sources for City of Chino Measure F, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1). The guide's pages are cut from the San
# Bernardino County Registrar of Voters' comprehensive Voter Information
# Guide (VIG.pdf, PDF pages 197-198); "page" is the guide's printed
# footer number (SB COMPREHENSIVE-195 is PDF page 197).
#
# The guide prints no ballot question; the card quotes it from the City
# Council's resolution placing the measure (Section 4).

[contest]
id = "ca-2026-11-03-chino-measure-f"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:chino"
kind = "measure"
title = "City of Chino Measure F: Business License Tax Based on Gross Receipts"

