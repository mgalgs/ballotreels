# Archived sources for San Lorenzo Unified School District Measure J,
# 2026-11-03 general election (sources/sources.md). Every id here may be
# cited by script.toml. The guide's pages are cut from the Alameda County
# Registrar of Voters' Composite Voter Information Guide (965 pages);
# "pages" are the PDF's page numbers, with the printed footer (SLMJ-1 on)
# beside them.
#
# The guide prints the ballot question, County Counsel's Impartial
# Analysis, an argument in favor, the notice "NO ARGUMENT AGAINST
# MEASURE J WAS SUBMITTED", and the full text of the measure. It prints
# no rebuttal and no tax rate statement (a parcel tax, not a bond).

[contest]
