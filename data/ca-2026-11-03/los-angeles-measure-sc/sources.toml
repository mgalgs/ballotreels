# Archived sources for City of Los Angeles Charter Amendment SC (scripted
# as Measure SC, the site's convention), 2026-11-03 general election
# (sources/sources.md). All four come from one cut of the City Clerk's
# Voter Information Pamphlet, edition 201: the PDF's pages 11 and 73 to
# 89, the pamphlet's printed pages 9 (Ballot Summary) and 71 to 87.
#
# The Chief Legislative Analyst's Impartial Summary is the measure's
# neutral explanation, and the City Administrative Officer's Financial
# Impact Statement its fiscal analysis. No argument against was submitted
# (printed page 73), and no rebuttals.
#
# Who votes is not confirmed. SC is a City Charter amendment, so the
# division is the city's; but only edition 201 of the pamphlet ("City/
# LAUSD ballot measures") prints it, and edition 101 (the city's measures
# only) leaves it out, which suggests that only city voters who live in
# the Los Angeles Unified School District vote on it. No archived record
# states that, so there is no `voters`, and the script says nothing
# either way (see script.toml).

