# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; who sets the school board's
# campaign rules today; what would change, with its exceptions
# and the contribution limit; the City Administrative Officer's
# statement; the one side that argued; what a vote does.
#
# The card quotes the pamphlet: the title and ballot question from the
# measure's own page (printed page 71), and the yes and no meanings from
# its Ballot Summary (printed page 9). The heading above them, "CITY OF
# LOS ANGELES CHARTER AMENDMENT SC", stands in for an origin: the
# pamphlet does not say who placed the measure on the ballot.
#
# Who votes is not confirmed (sources.toml): only the pamphlet edition
# for "City/LAUSD ballot measures" prints SC, which suggests only city
# voters inside the school district vote on it, but no archived record
# says so. So the opening line names whose measure it is (the city's,
# as a charter amendment) and says "asks voters", not "voters in the
# city" as the city's other measures do; nothing else claims who votes,
# and the question is recorded as unanswered.
#
# The Financial Impact Statement gives no dollar figure, so nothing needs
# a scale (STANDARD.md 6.5); the $1,000 contribution limit is an amount
# per donor, exempt. The supporters' "simplifies the Charter" is theirs
# (6.3) and stays in their section; the neutral lines say what the
# measure removes and applies, as the Impartial Summary does. No argument
# against was submitted: the no side is filed = false, as for Measure TE.

contest = "ca-2026-11-03-los-angeles-measure-sc"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "summary"
number = "SC"
title = "CAMPAIGN FINANCE RULES RELATED TO BOARD OF EDUCATION ELECTIONS."
origin = "CITY OF LOS ANGELES CHARTER AMENDMENT SC"
summary = "Shall the Los Angeles City Charter be amended to clarify the campaign finance rules for Board of Education elections and allow for changes by ordinance?"
yes = "A YES VOTE MEANS: You want to remove repetitive language from the Charter, clarify the campaign finance rules for Board of Education candidates, and allow the City Council to adopt additional changes by ordinance."
no = "A NO VOTE MEANS: You do not want to remove repetitive language from the Charter, clarify the campaign finance rules for Board of Education candidates, or allow the City Council to adopt additional changes by ordinance."

[[section]]
id = "what"
heading = "Measure SC"

[[section.line]]
text = "City of Los Angeles Measure SC asks voters whether to change the City Charter rules on campaign finance for Los Angeles Unified School District board elections."
sources = ["summary"]

[section.line.visual]
kind = "page"
source = "summary"
highlight = ["clarify the campaign finance rules for Board of Education elections"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Today, one section of the City Charter sets the campaign finance rules that school board candidates must follow."
sources = ["summary"]

[section.line.visual]
kind = "illustration"
name = "law-book"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "Measure SC would remove the separate school board rules, and make school board candidates follow the rules for candidates for mayor."
sources = ["summary", "text"]

[section.line.visual]
kind = "illustration"
name = "amended-page"

[[section.line]]
id = "exceptions"
text = "Some rules would not apply to school board candidates, including public matching funds and the limits on contributions from city contractors and lobbyists."
sources = ["summary", "financial-impact"]

[[section.line]]
id = "limits"
text = "The basic contribution limit would stay at $1,000, and the City Council could add other limits or exceptions by ordinance."
sources = ["summary"]

[section.line.visual]
kind = "illustration"
name = "legislative-chamber"

[[section]]
id = "fiscal"
heading = "What it would cost"

[[section.line]]
text = "The City Administrative Officer says Measure SC is not expected to have a financial impact on the city."
sources = ["financial-impact"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Measure SC simplifies the charter by removing repeated rules, and puts school board candidates under the same framework as mayoral candidates."
sources = ["argument-for"]
basis = ["Charter Amendment SC is a good governance reform that simplifies the Charter and reduces bureaucratic bloat and redundancy.", "It eliminates duplicative campaign finance provisions for Board of Education elections and clarifies that those candidates are subject to the same general campaign finance framework that already governs candidates for Mayor."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Simplifies the charter", "Same framework as for mayor"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure SC was submitted, so the voter pamphlet from the City Clerk prints only the argument in favor of it."
sources = ["argument-for"]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote means you want to remove the repeated language, clarify the rules for school board candidates, and let the City Council make more changes by ordinance."
sources = ["summary"]

[section.line.visual]
kind = "page"
source = "summary"
highlight = ["You want to remove repetitive language"]

[[section.line]]
text = "A no vote means you do not want these changes."
sources = ["summary"]

[section.line.visual]
kind = "page"
source = "summary"
highlight = ["You do not want to remove repetitive language"]

[[question]]
ask = "Which campaign rules would not apply to school board candidates?"
lines = ["exceptions"]

[[question]]
ask = "Would contribution limits change?"
lines = ["limits"]

[[question]]
ask = "Do all city voters vote on Measure SC, or only those who live in the school district?"
unanswered = true
