# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and of whom; how a school bond is repaid and what it needs to
# pass; what the money would pay for; the district's tax statement; one
# line per side; what a vote does.
#
# "Counsel" is heard as "Council" (standard/speakability.txt). The bond
# total and the debt service are repaid from a tax on property in the
# district, and no archived source states the district's budget, so they
# have no budget scale (STANDARD.md 6.5; left open). The ballot label
# rounds the rate to "$22 per $100,000"; the fiscal line gives the tax
# statement's own $21.70. The supporters' "WITHOUT INCREASING TAX RATES"
# and the state matching funds they cite are their argument, so they stay
# out of the neutral sections (STANDARD.md 6.3); the card quotes the
# label's "(without increasing current tax rates)" as printed.
#
# No argument against Measure AA was filed. The no side says so plainly;
# its section is marked filed = false.

contest = "ca-2026-11-03-la-mesa-spring-valley-measure-aa"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-label"
number = "AA"
title = "La Mesa Spring Valley School District Classroom Repair & Upgrade Extension Measure."
origin = "The Board of Education for the La Mesa-Spring Valley School District (“District”) placed this measure on the ballot."
summary = "To repair/upgrade deteriorating roofs, plumbing, electrical systems; install air conditioning/shade structures to protect students from extreme heat; remove asbestos/lead pipes; and upgrade schools to current health/building safety/disability access standards, shall La Mesa Spring Valley School District’s measure be adopted, authorizing $131,000,000 in bonds at legal rates (without increasing current tax rates), levying $22 per $100,000 assessed value ($9,000,000 annually) while bonds are outstanding, with independent oversight and audits?"
yes = "A “YES” vote is in favor of authorizing the District to issue and sell $131,000,000 in general obligation bonds."
no = "A “NO” vote is against authorizing the District to issue and sell $131,000,000 in general obligation bonds."

[[section]]
