# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; who pays for medical research today; what the measure would
# do (the borrowing, where it goes); the analyst's view, the cost and
# the possible payback; one point per side; what a vote does.
#
# Left out of the neutral sections because a side argues them (STANDARD.md
# 6.3): the money set aside for cancer, heart disease and Alzheimer's, the
# 20 percent patient discount, the earlier stem cell bonds, federal cuts.

contest = "ca-2026-11-03-prop-38"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "quick-reference"
number = "38"
title = "AUTHORIZES BONDS FOR IMMUNOLOGY MEDICAL RESEARCH. INITIATIVE STATUTE."
origin = "Put on the Ballot by Petition Signatures"
summary = "Authorizes $8.4 billion in general obligation bonds for immunology and immunotherapy research, half to a single University of California-affiliated nonprofit medical research institute, half to research grants. Fiscal Impact: Increased state cost of $500 million to $600 million annually for about 20 years to repay the research bond, with some or all of the cost offset if the funded research generates revenue."
yes = "A YES vote on this measure means: The state could borrow $8.4 billion to support medical research in immunology and immunotherapy conducted by California research institutes and universities."
no = "A NO vote on this measure means: The state could not borrow $8.4 billion to support medical research in immunology and immunotherapy conducted by California research institutes and universities."

