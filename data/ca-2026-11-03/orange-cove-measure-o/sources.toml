# Archived sources for City of Orange Cove Measure O, 2026-11-03
# general election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The Fresno County Registrar of Voters posts each measure's filed
# documents on its election page; no printed Voter Information Guide
# was found online. The ballot question, the synopsis of the ordinance
# (the rates), the vote needed and the history of the earlier parcel
# tax are quoted from City Council Resolution No. 2026-28. Its Exhibit
# A, Ordinance No. 403, is not attached to the posted scan and was not
# posted separately, so there is no official-text source; the
# resolution's synopsis and the impartial analysis cover what the
# script says of the ordinance. The City Attorney's impartial analysis
# is the measure's neutral explanation, the kind a state's attorney
# general's explanatory statement is. No tax rate statement or fiscal
# analysis applies (a parcel tax, not a bond); the one revenue estimate
# is the analysis's.
#
# Every PDF is a scan with no text layer. The passages cited were typed
# from the page images into sources/*-transcription.txt, each naming the
# PDF and URL it copies; those sources point at the transcription, and
# their url at the scan (as Clayton Measure M's do). The rebuttals are
# archived but not cited.

