# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks; how it reached the ballot and what it needs to pass; what would
# change (a special tax with no end date, the separate fund, what the
# fund may pay for); the revenue estimate; one line per side;
# what a vote does.
#
# The guide prints no fiscal analysis or tax rate statement; the one
# revenue estimate is in the ballot question and the City Attorney's
# Impartial Analysis. No archived source states the general fund budget
# of the city, so the $1.14 million has no scale (STANDARD.md 6.5; left
# open). The initiative's full text is not archived (sources.md), so
# every line about what it does follows the Impartial Analysis.
#
# The card quotes the sample ballot, which prints the question but no
# yes/no lines; the vote lines take the Impartial Analysis's yes/no
# meanings and highlight the question's own words, as Los Angeles County
# Measure A does.
#
# The guide prints an argument in favor and "NO ARGUMENT FILED AGAINST
# MEASURE “E”": the no side is filed = false, as for Proposition 37, and
# says so in the guide's own word.

contest = "ca-2026-11-03-canyon-lake-measure-e"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-label"
number = "E"
title = "CANYON LAKE PUBLIC SAFETY AND EMERGENCY RESPONSE PROTECTION MEASURE;"
origin = "CITY OF CANYON LAKE"
summary = "Shall the measure establishing a 1¢ transactions and use tax, estimated to generate $1,140,000.00 annually until repealed by voters, and requiring the proceeds and specified existing EMS subscription-fee, property-tax fire, and utility-users-tax revenues to be deposited in a restricted fund used only for Canyon Lake police, fire, paramedic, and emergency-response staffing, compensation, equipment, and operations, with annual independent audits, be adopted?"

[[section]]
id = "what"
heading = "Measure E"

[[section.line]]
text = "City of Canyon Lake Measure E asks voters in the city whether to add a one-cent sales tax for police, fire and paramedic services."
sources = ["ballot-label", "analysis"]

[section.line.visual]
kind = "page"
source = "ballot-label"
highlight = ["establishing a 1¢ transactions and use tax"]

[[section]]
id = "today"
heading = "How it reached the ballot"

[[section.line]]
text = "Measure E reached the ballot by a voter petition, and it needs a simple majority to pass."
sources = ["analysis"]

[section.line.visual]
kind = "illustration"
name = "ballot-box"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "Measure E would be a special tax, restricted to set purposes, and would stay until voters repeal it."
sources = ["analysis"]

[section.line.visual]
kind = "illustration"
name = "special-tax"

[[section.line]]
text = "The tax and some existing fire and emergency medical revenues would go into a separate public safety fund."
sources = ["analysis"]

[section.line.visual]
kind = "illustration"
name = "public-funds-locked"

[[section.line]]
text = "That fund could pay only for police, fire and paramedic staff, equipment and training."
sources = ["analysis"]

[section.line.visual]
kind = "illustration"
name = "fire-station-engine"

[[section]]
id = "fiscal"
heading = "What the impartial analysis says"

[[section.line]]
text = "The City Attorney's impartial analysis says the tax is estimated to provide about $1.14 million a year."
sources = ["analysis"]

[section.line.visual]
kind = "illustration"
name = "city-storefronts"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

