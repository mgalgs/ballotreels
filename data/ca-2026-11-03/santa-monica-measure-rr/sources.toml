# Archived sources for City of Santa Monica Measure RR, 2026-11-03 general
# election (sources/la-sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The Los Angeles County Registrar-Recorder/County Clerk's list "Measures
# Appearing on the Ballot" (sources/county-measure-list-excerpt.txt, the
# measure's entry) gives its letter, vote threshold and ballot question,
# and, on its "Supporters: ... Opponents: ..." line, who filed the
# primary arguments ("Opponents: None submitted."): the card quotes it,
# and the sides cite it as the official statement of filing. The City
# Council's resolution submitting the measure, a text PDF, gives which
# tenancies the charter's eviction rules cover, the Rent Control Board's
# recommendation and the Council's stated reason in its recitals, and
# the charter amendment itself as Exhibit 2 (pages 24 and 25). The
# Registrar's Interactive Sample Ballot prints the City Attorney's
# impartial analysis (the measure's neutral explanation; it gives no cost
# estimate) and the argument in favor, saved as HTML, with "NO ARGUMENT
# AGAINST THIS MEASURE WAS SUBMITTED" under it. Not a tax; no fiscal
# statement applies.

[contest]
id = "ca-2026-11-03-santa-monica-measure-rr"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:santa_monica"
kind = "measure"
title = "City of Santa Monica Measure RR: A Minimum Rent Debt for Evictions"

