# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; how eviction for unpaid rent
# works today and which rentals the charter's eviction rules cover, from
# the City Attorney's impartial analysis; how the measure reached the
# ballot and the Council's stated reason (its purpose, STANDARD.md 6.2);
# what would change, from the analysis and the amendment's text (Exhibit
# 2), including that landlords could still collect unpaid rent; that no
# cost estimate is given; the argument for, and that none was submitted
# against; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". The card shows the name. The
# federal housing department is named in words, as the ballot question
# does, without its acronym.
#
# The card quotes the measure's entry in the county's list "Measures
# Appearing on the Ballot", which prints no yes/no meanings, so the card
# has no boxes; the vote lines take both meanings from the question and
# highlight the same phrase.
#
# Not a tax: no fiscal statement applies, and the impartial analysis
# gives no cost estimate; the fiscal line says so in the no-estimate
# wording. The analysis's plain rule (a landlord may evict over any
# amount owed) replaces the Council's recital that evictions over small
# debts "may be legal" as the today line. No archived
# document states what one month of that market rent is: left open, under
# [[question]].
#
# Sides: the yes side comes from the argument in favor filed by the five
# supporters the county's list names, with its basis: no one should lose
# their home over a small amount of rent, and tenants would get time to
# catch up. Its eviction-notice amounts and the Federal Reserve figure
# are left out. The list and the sample ballot say no argument against
# was submitted, so the no side says so (filed = false); word counts kept
# within 5%.

contest = "ca-2026-11-03-santa-monica-measure-rr"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "RR"
title = "CITY OF SANTA MONICA"
origin = "VOTE PASSAGE – Majority Vote 50%+1"
summary = "MEASURE RR: Shall the City Charter be amended to prohibit evictions based on non-payment of rent when a tenant owes less than one month of the average of fair market rents, set annually by the U.S. Department of Housing and Urban Development, for ZIP codes in Santa Monica?"

[[section]]
id = "what"
heading = "Measure RR"

[[section.line]]
text = "Measure RR asks the voters of this city whether to bar evictions for unpaid rent when a tenant owes less than one month of rent."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["prohibit evictions based on non-payment of rent"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "today-rule"
text = "Today, the charter's eviction rules let a landlord evict a tenant who owes any amount of rent."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "door-notice"

[[section.line]]
id = "covered"
text = "The charter's eviction rules cover most rentals, but generally not single-family homes or condominiums."
sources = ["impartial-analysis", "resolution"]

[section.line.visual]
kind = "illustration"
name = "older-apartments"

[[section.line]]
text = "The rent board recommended the change, which the Council says would protect tenants from unnecessary displacement."
sources = ["resolution"]

[section.line.visual]
kind = "illustration"
name = "city-council-chamber"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "threshold"
text = "An eviction for unpaid rent would be allowed only when the tenant owes more than one month of rent, at a set rate."
sources = ["impartial-analysis", "resolution", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "lease-keys"

[[section.line]]
id = "fmr"
text = "That rate is the average market rent the federal housing department sets each year for local ZIP codes, for a unit of that size."
sources = ["impartial-analysis", "resolution", "ballot-question"]

[[section.line]]
text = "The eviction notice would have to state the number of bedrooms and that amount."
sources = ["impartial-analysis", "resolution"]

[section.line.visual]
kind = "illustration"
name = "door-notice"

[[section.line]]
id = "collect"
text = "Landlords could still collect unpaid rent by means other than eviction."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "lease-keys"

[[section]]
id = "fiscal"
heading = "What it would cost"

[[section.line]]
text = "The impartial analysis does not include a cost estimate for the measure."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"
stamp = "None reported"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
id = "yes-case"
text = "Supporters say no one should lose their home over a small amount of rent, and tenants would get time to catch up."
sources = ["argument-for"]
basis = ["No one should lose their home over a small amount of rent after an unexpected hardship.", "This gives renters a meaningful window to catch up or secure rental assistance, while still needing to pay all of the rent owed."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["No eviction over small rent debts", "Time for tenants to catch up"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "The official county list of measures for this election says that no argument against Measure RR was submitted, by any group or person."
sources = ["arguments-filed"]

[section.line.visual]
kind = "list"
source = "arguments-filed"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote sets the one-month minimum before an eviction for unpaid rent."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["prohibit evictions based on non-payment of rent"]

[[section.line]]
text = "A no vote leaves the eviction rules in the charter as they are."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["prohibit evictions based on non-payment of rent"]

[[question]]
ask = "Can a tenant be evicted today for owing a small amount of rent?"
lines = ["today-rule"]

[[question]]
ask = "Would tenants still owe the rent?"
lines = ["collect"]

[[question]]
ask = "Which renters would this cover?"
lines = ["covered"]

[[question]]
ask = "How much is one month of rent at the federal rate?"
unanswered = true

[[question]]
ask = "What do the supporters argue?"
lines = ["yes-case"]
