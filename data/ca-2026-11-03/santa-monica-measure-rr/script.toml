# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; how eviction for unpaid rent
# works today and which rentals the charter's eviction rules cover, from
# the resolution's recitals; how the measure reached the ballot and the
# Council's stated reason (its purpose, STANDARD.md 6.2); what would
# change, from the amendment's text (Exhibit 2); that no cost estimate is
# given; who filed the argument for, and that none was submitted against;
# what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". The card shows the name. The
# federal housing department is named in words, as the ballot question
# does, without its acronym.
#
# The card quotes the measure's entry in the county's list "Measures
# Appearing on the Ballot", which prints no yes/no meanings, so the card
# has no boxes; the vote lines take both meanings from the question and
# highlight the same phrase.
#
# Not a tax: no fiscal statement applies, and no impartial analysis was
# fetched. The fiscal line follows the no-cost-estimate wording, naming
# the county's list (the card's guide) as "the official list of measures
# from the county" ("county's" is misheard as "counties"). No archived
# document states what one month of that market rent is: left open, under
# [[question]].
#
# Sides: the county's list names five supporters who filed the argument
# for (the mayor, a Rent Control Board commissioner, a councilmember and
# two others) and says "Opponents: None submitted." The argument for's
# text could not be fetched: its line says only who filed it and that its
# text was not gathered, nothing reconstructed. The no side says that
# none was submitted. filed = false on both (neither has text to quote as
# a `basis`); word counts kept within 5%.

contest = "ca-2026-11-03-santa-monica-measure-rr"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "RR"
title = "CITY OF SANTA MONICA"
origin = "VOTE PASSAGE – Majority Vote 50%+1"
summary = "MEASURE RR: Shall the City Charter be amended to prohibit evictions based on non-payment of rent when a tenant owes less than one month of the average of fair market rents, set annually by the U.S. Department of Housing and Urban Development, for ZIP codes in Santa Monica?"

[[section]]
id = "what"
heading = "Measure RR"

[[section.line]]
text = "Measure RR asks the voters of this city whether to bar evictions for unpaid rent when a tenant owes less than one month of rent."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["prohibit evictions based on non-payment of rent"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "today-rule"
text = "The City Council says evictions over rent debts of hundreds of dollars or less may be legal today."
sources = ["resolution"]

[section.line.visual]
kind = "illustration"
name = "door-notice"

[[section.line]]
id = "covered"
text = "The charter's eviction rules cover most rentals, but generally not single-family homes or condominiums."
sources = ["resolution"]

[section.line.visual]
kind = "illustration"
name = "older-apartments"

[[section.line]]
text = "The rent board recommended the change, which the Council says would protect tenants from unnecessary displacement."
sources = ["resolution"]

[section.line.visual]
kind = "illustration"
name = "city-council-chamber"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "threshold"
text = "An eviction for unpaid rent would be allowed only when the tenant owes more than one month of rent, at a set rate."
sources = ["resolution", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "lease-keys"

[[section.line]]
id = "fmr"
text = "That rate is the average market rent the federal housing department sets each year for local ZIP codes, for a unit of that size."
sources = ["resolution", "ballot-question"]

[[section.line]]
text = "The eviction notice would have to state the number of bedrooms and that amount."
sources = ["resolution"]

[section.line.visual]
kind = "illustration"
name = "door-notice"

[[section]]
id = "fiscal"
heading = "What it would cost"

[[section.line]]
text = "The official list of measures from the county does not include a cost estimate for the measure."
sources = ["ballot-question"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"
stamp = "None reported"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"
