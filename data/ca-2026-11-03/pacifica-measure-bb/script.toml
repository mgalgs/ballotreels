# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks; who put the measure on the ballot and what it needs to pass; what
# would change (one cent on the dollar, any city purpose); the city
# revenue estimate the impartial analysis reports; one line per side;
# what a vote does.
#
# ACRE posts no tax rate statement or fiscal analysis (not a bond); the
# one revenue estimate is the city's, reported by the City Attorney's
# impartial analysis (and printed in the resolution). No archived source
# states the city general fund budget, so the $5 million has no scale
# (STANDARD.md 6.5; left open). The figures in the arguments (a 10.875%
# combined rate, the debt and pension totals) are the opponents' own;
# the road backlog ($84 million rising to $123 million) is a finding in
# the resolution's recitals that the supporters cite, so it is left to
# them (rule 6.3) and not used here. No official source states the
# sales tax rate in Pacifica today, so there is no rate chart.
#
# The card quotes the Council's resolution, where the ballot question is
# printed; its title is the resolution's heading cut after the tax, and
# its origin is the resolution's adoption line. The resolution prints
# YES and NO boxes but no yes/no statements, so the card has none; the
# vote lines take the impartial analysis's own meanings ("a vote to
# approve the tax", "a vote against the tax") and highlight the ballot
# question. The grocery exemption, the audits and the oversight are left
# to the sides, as the arguments and rebuttals dispute them (rule 6.3).

contest = "ca-2026-11-03-pacifica-measure-bb"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-label"
number = "BB"
title = "A BALLOT MEASURE ESTABLISHING A TRANSACTIONS AND USE (SALES) TAX RATE AT THE RATE OF 1% (ONE-CENT)"
origin = "PASSED AND ADOPTED at a special meeting of the City Council of the City of Pacifica, California held on the 5th day of August, 2026."
summary = "Pacifica City Services Measure. To protect Pacifica's long-term financial stability; fund police, fire, 911 emergency response; prioritize paving streets in the worst conditions; keep parks, beaches and public spaces safe and maintained; and for general government use, shall the City of Pacifica's measure establishing a 1% (1¢) transactions and use (sales) tax, generating approximately $5,000,000 annually until ended by voters, with public disclosure and local control of funds, and independent annual audits, be adopted?"

