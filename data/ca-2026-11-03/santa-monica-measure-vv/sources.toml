# Archived sources for City of Santa Monica Measure VV, 2026-11-03 general
# election (sources/la-sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The Los Angeles County Registrar-Recorder/County Clerk's list "Measures
# Appearing on the Ballot" (sources/county-measure-list-excerpt.txt, the
# measure's entry) gives its letter, vote threshold and ballot question,
# and, on its "Supporters: ... Opponents: ..." line, who filed the
# primary arguments ("Opponents: None submitted."): the card quotes it,
# and the sides cite it as the official statement of filing. The City
# Council's final resolution submitting the measure (July 28, 2026; it
# replaced a broader July 14 resolution, which the staff report covers
# and which is not cited) gives today's rules in its recitals and the
# charter amendment as Exhibit 1 (pages 5 and 6), a redline: what the
# script calls today's rule is the struck text, read from the page
# images, since pdftotext keeps struck and added words alike. No
# impartial analysis and no argument text could be fetched (the City's
# site blocked downloads). Not a tax; no fiscal statement applies.

[contest]
