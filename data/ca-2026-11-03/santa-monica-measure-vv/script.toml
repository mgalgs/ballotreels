# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; which rentals the charter's
# eviction protections leave out today, and today's rule for an owner
# who evicts a tenant to move in, from the resolution's recitals and the
# struck text of its redline; the 2022 change for rent-controlled units
# the Council says this would match (its stated reason, STANDARD.md
# 6.2); what would change; that no cost estimate is given; who filed the
# argument for, and that none was submitted against; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". The card shows the name. The
# 2022 measure is not named by its letter, which reads as another
# measure on this ballot.
#
# The card quotes the measure's entry in the county's list "Measures
# Appearing on the Ballot", which prints no yes/no meanings, so the card
# has no boxes; the vote lines take both meanings from the question and
# highlight the same phrase.
#
# Not a tax: no fiscal statement applies, and no impartial analysis was
# fetched. The fiscal line follows the no-cost-estimate wording, naming
# the county's list (the card's guide) as "the official list of measures
# from the county" ("county's" is misheard as "counties"). No archived
# document says how many homes and condominiums are rented: left open,
# under [[question]].
#
# Sides: the county's list names four supporters who filed the argument
# for (two councilmembers, the Rent Control Board's vice chair and one
# other) and says "Opponents: None submitted." The argument for's text
# could not be fetched: its line says only who filed it and that its text
# was not gathered, nothing reconstructed. The no side says that none was
# submitted. filed = false on both (neither has text to quote as a
# `basis`); word counts kept within 5%.

contest = "ca-2026-11-03-santa-monica-measure-vv"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "VV"
title = "CITY OF SANTA MONICA"
origin = "VOTE PASSAGE – Majority Vote 50%+1"
summary = "MEASURE VV: Shall Article XXIII of the City Charter related to housing policies be amended to extend existing eviction protections to tenants renting single-unit dwellings and condominiums and require that for owner occupancy evictions from non-rent controlled units, the owner must intend in good faith to occupy the unit within 60 days after the tenant vacates and for at least 2 years thereafter?"

[[section]]
id = "what"
heading = "Measure VV"

[[section.line]]
text = "Measure VV asks the voters of this city whether to extend eviction protections to tenants who rent single-unit homes and condominiums."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["extend existing eviction protections to tenants renting single-unit dwellings and condominiums"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "today-coverage"
text = "Today, the charter allows evictions only for listed reasons, but those protections generally leave out single-unit homes and condominiums."
sources = ["resolution"]

[section.line.visual]
kind = "illustration"
name = "single-family-street"

[[section.line]]
id = "today-move-in"
text = "An owner who evicts a tenant to move in must intend to do so within 30 days, and to stay at least one year."
sources = ["resolution"]

[section.line.visual]
kind = "illustration"
name = "lease-keys"

[[section.line]]
text = "The City Council says stricter rules set in 2022 for rent-controlled units should apply to other rentals too."
sources = ["resolution"]

[section.line.visual]
kind = "illustration"
name = "city-council-chamber"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "coverage"
text = "Tenants of single-unit homes and condominiums would get the same eviction protections as other renters."
sources = ["resolution", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "single-family-street"

[[section.line]]
id = "move-in"
text = "An owner moving in would have to intend to do so within 60 days, and to stay at least two years."
sources = ["resolution", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "end-date"

[[section.line]]
id = "remedy"
text = "An owner who fails to, without extenuating circumstances, would have to offer the unit back and pay the moving costs of the tenant."
sources = ["resolution"]

[section.line.visual]
kind = "illustration"
name = "lease-keys"

[[section]]
id = "fiscal"
heading = "What it would cost"

[[section.line]]
text = "The official list of measures from the county does not include a cost estimate for the measure."
sources = ["ballot-question"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"
stamp = "None reported"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"
filed = false

[[section.line]]
text = "Two council members, the rent board vice chair and one other person filed an argument for Measure VV; its text was not gathered."
