# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks; what the charter is and what its preamble says today;
# what the measure would add, and what it leaves alone; who placed it and
# the vote it needs; that no cost estimate was published; both sides,
# neither of which has a published argument; what a vote does.
#
# The card quotes the ballot question from Resolution No. 081882, which
# prints no yes/no lines, so (as for Utah) the vote lines take their two
# meanings from the question itself and highlight its one phrase.
#
# No argument for or against Measure L is among the documents San Mateo
# County posted, and the printed sample ballot pamphlet was not checked
# (sources/sources.md), so the sides do not say none was filed: each says
# none appears in the published documents (filed = false, STANDARD.md
# 2.5). No fiscal or tax rate statement was published either, and the
# impartial analysis names no cost.
#
# The narration never says "extreme", a judgment word in its own voice
# (standard/judgment-words.txt), though the ballot question does; the
# card quotes it. "County's" is heard as "counties"
# (standard/speakability.txt), so the narration says "of San Mateo
# County" instead.

contest = "ca-2026-11-03-san-mateo-county-measure-l"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "L"
title = "COUNTY CHARTER AMENDMENT"
origin = "BOARD OF SUPERVISORS, COUNTY OF SAN MATEO, STATE OF CALIFORNIA"
summary = "Shall the San Mateo County Charter be amended to add a provision to the Charter Preamble designating long-term resilience to extreme weather events as a County priority?"

[[section]]
id = "what"
heading = "Measure L"

[[section.line]]
text = "San Mateo County Measure L asks county voters whether the county charter should make long-term resilience to weather events a county priority."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["long-term resilience to extreme weather events as a County priority"]

[[section]]
id = "background"
heading = "The county charter"

[[section.line]]
text = "San Mateo County is one of 15 California counties with a charter, which its voters first approved in 1932."
sources = ["resolution"]

[section.line.visual]
kind = "illustration"
name = "county-building"

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "The preamble at the start of the charter does not address resilience to weather events today."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "constitution-page"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "Measure L would add a paragraph making long-term resilience against fire, flood, wind, rain, heat, drought and sea level rise a county priority."
sources = ["impartial-analysis", "resolution"]

[section.line.visual]
kind = "illustration"
name = "storm-levee"

[[section.line]]
text = "The paragraph says that work would be done together with cities, districts and other public agencies."
sources = ["impartial-analysis"]

[[section.line]]
text = "The measure would not change any other part of the charter."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "amended-page"

[[section.line]]
text = "The Board of Supervisors placed Measure L on the ballot, and it needs a majority of the vote to pass."
sources = ["impartial-analysis", "resolution"]

[[section]]
id = "fiscal"
heading = "What it would cost"

[[section.line]]
text = "The published measure documents of San Mateo County do not include a cost estimate for the measure."
sources = ["impartial-analysis", "resolution"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"
filed = false

[[section.line]]
text = "No argument for Measure L appears in the published measure documents of San Mateo County."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "list"
source = "impartial-analysis"
items = ["No official argument for was published"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure L appears in the published measure documents of San Mateo County."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "list"
source = "impartial-analysis"
items = ["No official argument against was published"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote means the charter preamble would be amended to add this priority."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["be amended to add a provision to the Charter Preamble"]

[[section.line]]
text = "A no vote means the charter preamble would not be amended to add it."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
