# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the 2025 law and district that
# let voters approve such a tax, and how it reached the ballot; what
# would change (the rates and years, where the money goes, the one
# district-wide vote total); the impartial analysis's revenue estimate;
# one line per side; what a vote does. The explanation and numbers are
# the other four counties' Measure RTM scripts'; only the sides differ,
# since each county prints the arguments filed with it.
#
# No narrated line names a county or city (the narrator mispronounces
# them); the card, the title and the chart's labels name them.
#
# The card quotes the Registrar of Voters' List of Local Measures: the
# measure's title on it, the district that placed it, and the ballot
# question, which prints no yes/no lines. As for the other counties, the
# vote lines give the impartial analysis's meanings and both highlight
# the one phrase of the question they turn on.
#
# No fiscal statement or tax rate statement was published; the one
# estimate is the impartial analysis's (and the ballot question's). It is
# the new district's revenue, and no archived source states a budget of
# the district (or of its five counties' transit) to scale it against
# (STANDARD.md 6.5; left open). How much of it this county would raise is
# printed nowhere, so the script does not say. The share of this county's
# money that goes to its transit authority (the analysis's 84.37
# percent) is left out of the neutral sections: where this county's
# money is spent is what the two sides dispute ("invests money directly
# into Santa Clara County communities"; "most of the tax dollars will be
# spent in the other four counties"), so stating it would weigh in
# (STANDARD.md 6.3). So is the oversight the analysis describes, which
# supporters call strong and opponents "toothless".

contest = "ca-2026-11-03-santa-clara-county-measure-rtm"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "RTM"
title = "Connect Bay Area Transit Initiative"
origin = "Public Transit Revenue Measure District"
summary = "To prevent major service cuts to BART and other transit, avoid increased traffic, and reduce pollution by: Preserving BART, Caltrain, VTA, SamTrans, AC Transit, Muni, other transit for everyone, including workers, students, seniors, persons with disabilities; Supporting transit safety, cleanliness, affordability, reliability; Repairing targeted roads/potholes; Requiring financial transparency, oversight, accountability; shall the measure enacting a 0.5% (Alameda, Contra Costa, San Mateo, Santa Clara counties) and 1% (San Francisco) sales tax for 14 years generating approximately $980,000,000 annually, be adopted?"

[[section]]
id = "what"
heading = "Measure RTM"

[[section.line]]
text = "Measure RTM asks the voters of this county, one of five in a regional transit district, whether to add a sales tax for public transit."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["sales tax for 14 years"]

[[section]]
id = "today"
heading = "The transit district"

[[section.line]]
id = "district"
text = "A 2025 state law created the five-county district, and lets its voters approve a sales tax for transit."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "county-line-map"

[[section.line]]
text = "Voters placed Measure RTM on the ballot by petition."
sources = ["impartial-analysis"]

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "rates"
text = "The tax would be 0.5 percent in this county and three others, and 1 percent in the fifth, for 14 years."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "bars"
title = "Sales tax the measure would add"
source = "impartial-analysis"
unit = "%"
labels = ["Alameda, Contra Costa, San Mateo, Santa Clara", "San Francisco"]
values = [0.5, 1]

[[section.line]]
id = "shares"
text = "After election and administrative costs, the measure splits the money among transit agencies, by shares it sets for each county."
sources = ["impartial-analysis", "resolution"]

[section.line.visual]
kind = "illustration"
name = "commuter-train"

[[section.line]]
id = "majority"
text = "Measure RTM needs a majority of all the votes cast in the five counties combined, not in each county."
sources = ["impartial-analysis", "resolution"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "fiscal"
heading = "What the impartial analysis says"

[[section.line]]
text = "The impartial analysis estimates the tax would raise about $980 million a year across the five counties."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say if it fails, BART could close 15 stations and cut service by 70 percent, and it invests directly in local communities."
sources = ["argument-for"]
basis = ["BART could close 15 stations and reduce service by 70%.", "The Regional Transit Measure also invests money directly into Santa Clara County communities"]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Prevents BART and Caltrain station closures", "Invests directly in local communities"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say it is a $14 billion bailout for a broken system, and most of the tax dollars will be spent in other counties."
sources = ["argument-against"]
basis = ["is a $14 billion-dollar bailout for a broken system.", "And yet most of the tax dollars will be spent in the other four counties!"]

[section.line.visual]
kind = "list"
source = "argument-against"
items = ["A $14 billion bailout for a broken system", "Most money spent in the other counties"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote is a vote to impose the sales tax for 14 years."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["sales tax for 14 years"]

[[section.line]]
text = "A no vote is a vote against imposing the tax."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["sales tax for 14 years"]

[[question]]
ask = "Which counties vote on this?"
lines = ["district"]

[[question]]
ask = "Does this county need to pass it on its own?"
lines = ["majority"]

[[question]]
ask = "How much of the money would be raised in this county?"
unanswered = true
