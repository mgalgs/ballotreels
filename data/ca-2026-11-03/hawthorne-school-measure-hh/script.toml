# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; who placed it and the vote it needs; what
# the money may and may not pay for; the tax rate statement's estimates,
# with its own caveat; one line per side; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the opening
# says "the voters of this school district". The card and title carry the
# names. "Counsel" is heard as "Council" (standard/speakability.txt), so
# the narration says "the impartial analysis". The last fiscal year is
# said with both years in full.
#
# The card quotes the Los Angeles County Registrar-Recorder/County Clerk's
# list "Measures Appearing on the Ballot", which prints the ballot question
# with no yes and no sentences, so the card has no boxes and the two vote
# lines highlight the same phrase of the question.
#
# The tax rate statement's average and highest rates are both $30 per
# $100,000 of assessed value; the script gives both, the total debt
# service, and the statement's own caveat on its estimates. The bonds are
# repaid from a tax on property in the district, not from the district's
# budget, and no archived source states that budget, so the figures have
# no budget scale (STANDARD.md 6.5; left open), as other school bonds' do.
#
# The argument in favor is the Registrar's printed copy. The list says
# "Opponents: None submitted.", so the no side says plainly that no
# argument against was submitted, citing the list (filed = false). Its
# clause on what the list records balances the yes line's length without
# a further claim.

contest = "ca-2026-11-03-hawthorne-school-measure-hh"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "HH"
title = "HAWTHORNE SCHOOL DISTRICT"
origin = "VOTE PASSAGE – 55% of the Votes Cast"
summary = "HAWTHORNE SCHOOL DISTRICT SCHOOL REPAIR/IMPROVEMENT MEASURE. To repair aging classrooms, ensure student health, safety and achievement and update technology, upgrade aging plumbing, electrical, lighting, heating/ventilation, safety/security systems, shall this Hawthorne School District measure be adopted to repair, construct, acquire classrooms, facilities, sites/equipment, and issue $110,000,000 in bonds, at legal rates, levy on average $30 per $100,000 assessed value (averaging $5,240,000 annually) while bonds are outstanding, require independent audits/oversight, all money for local schools?"

[[section]]
id = "what"
heading = "Measure HH"

[[section.line]]
text = "Measure HH asks the voters of this school district whether to approve $110 million in school bonds."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["issue $110,000,000 in bonds"]

[[section]]
id = "today"
heading = "How it reached the ballot"

[[section.line]]
id = "threshold"
text = "The district's governing board placed Measure HH on the ballot, and it needs 55 percent of the vote to pass."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "projects"
text = "The bond money could pay to repair and build classrooms and facilities, such as plumbing, electrical, heating and security systems."
sources = ["ballot-question", "impartial-analysis", "text"]

[section.line.visual]
kind = "illustration"
name = "school-roof-repair"

[[section.line]]
id = "limits"
text = "The money could not pay teacher or administrator salaries, and a citizens' oversight committee and yearly audits would be required."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "inspection-clipboard"

[[section]]
id = "fiscal"
heading = "What the tax rate statement says"

[[section.line]]
id = "rate"
text = "The district's tax rate statement estimates an average and a highest tax of $30 per $100,000 of assessed value, through 2068-2069."
sources = ["tax-statement"]

[section.line.visual]
kind = "bars"
title = "Estimated tax per $100,000 of assessed value, dollars"
source = "tax-statement"
unit = ""
labels = ["Average", "Highest"]
values = [30, 30]

[[section.line]]
id = "total"
text = "The statement puts the total to repay, with interest, at about $226.2 million, and says its figures are estimates only, which may vary."
sources = ["tax-statement"]

[section.line.visual]
kind = "illustration"
name = "debt-payments"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say the measure would repair and modernize local schools, and not a penny can be taken by the state or other districts."
sources = ["argument-for"]
basis = ["repair and modernize local schools in the Hawthorne School District", "not a penny can be taken by the state or other school districts"]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Repairs and modernizes schools", "State cannot take the funds"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "The official list of measures from the county, which names who filed each argument, says no argument against Measure HH was submitted."
sources = ["measure-list"]

[section.line.visual]
kind = "list"
source = "measure-list"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote approves the $110 million in school bonds."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["issue $110,000,000 in bonds"]

[[section.line]]
text = "A no vote rejects the $110 million in school bonds."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["issue $110,000,000 in bonds"]

[[question]]
ask = "How much tax would I pay, and for how long?"
lines = ["rate"]

[[question]]
ask = "What could the money be spent on?"
lines = ["projects", "limits"]

[[question]]
ask = "What vote does the measure need to pass?"
lines = ["threshold"]

[[question]]
ask = "What would the bonds cost in all?"
lines = ["total"]

[[question]]
ask = "How large is the bond next to the district's yearly budget?"
unanswered = true
