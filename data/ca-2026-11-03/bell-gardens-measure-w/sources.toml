# Archived sources for City of Bell Gardens Measure W, 2026-11-03 general
# election (sources/la-sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The Los Angeles County Registrar-Recorder/County Clerk's list "Measures
# Appearing on the Ballot" (sources/county-measure-list-excerpt.txt, the
# measure's entry) gives its letter, vote threshold and ballot question,
# and, on its "Supporters: ... Opponents: ..." line, that no primary
# argument was filed on either side ("Supporters: None submitted.
# Opponents: None submitted."): the card quotes it, and the sides cite it
# as the official statement of filing.
#
# The City Attorney's impartial analysis, as the Registrar prints it in
# its Interactive Sample Ballot, is the measure's neutral explanation and
# the only source of the sale's buyer, price and terms. The measure's full
# text and the resolution placing it were not gathered (the City's site
# blocks automated requests), so the script explains the measure from the
# analysis and the ballot question alone.

[contest]
id = "ca-2026-11-03-bell-gardens-measure-w"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:bell_gardens"
kind = "measure"
title = "City of Bell Gardens Measure W: Selling the City's Water System"

