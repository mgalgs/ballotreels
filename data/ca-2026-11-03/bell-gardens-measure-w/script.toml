# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; who serves the city's water
# today; why a vote is needed and how it reached the ballot; what would
# change (the buyer takes the whole system, rates held then set by the
# state commission, the commission's review); the price, as the analysis
# gives it; that neither side filed an argument; what a vote does.
#
# Only the ballot question and the City Attorney's impartial analysis
# were gathered (no full text), so every line is from those two, and the
# buyer, price and terms are only as the analysis states them. The
# analysis says the measure "permits, but does not require" the sale,
# and the change section says so.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". The buyer's name, Golden State
# Water Company, is the ballot question's own wording.
#
# The card quotes the measure's entry in the county's list "Measures
# Appearing on the Ballot", which prints no yes/no meanings, so the card
# has no boxes; the vote lines take both meanings from the analysis and
# highlight the same phrase of the question.
#
# The $41 million is money the city would receive, but no archived source
# states the city's budget, so it is given without a scale (STANDARD.md
# 6.5; left open, under [[question]]).
#
# Sides: the county's list says "Supporters: None submitted. Opponents:
# None submitted." filed = false on both, each line saying so in the same
# words.

contest = "ca-2026-11-03-bell-gardens-measure-w"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "W"
title = "CITY OF BELL GARDENS"
origin = "VOTE PASSAGE – Majority Vote 50%+1"
summary = "Shall the measure permitting the City of Bell Gardens to sell the Bell Gardens Municipal Water System to the Golden State Water Company be adopted?"

[[section]]
id = "what"
heading = "Measure W"

[[section.line]]
text = "Measure W asks the voters of this city whether to let the city sell the water system it owns and runs."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["to sell the Bell Gardens Municipal Water System"]

[[section]]
id = "background"
heading = "Why voters decide"

[[section.line]]
id = "law"
text = "State law says a city must hold a public hearing and get its voters' approval before selling its water system."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "law-book"

[[section.line]]
text = "The City Council held that hearing in June, and voted to ask for that approval."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "city-council-chamber"

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "today-split"
text = "Today, the city system serves about one-third of residents, and the Golden State Water Company serves the other two-thirds."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "water-service-line"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "takeover"
text = "Golden State would get the whole system, with its water rights, and serve every resident."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "water-pipes"

[[section.line]]
id = "rates"
text = "Rates would stay at current levels until January 2028; after that, the state utilities commission must approve any increase."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "utility-bills"

[[section.line]]
id = "review"
text = "The commission would first review the sale, and could approve it, deny it, or add conditions."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "sealed-order"

[[section]]
id = "fiscal"
heading = "What the city would receive"

[[section.line]]
id = "price"
text = "The impartial analysis says Golden State would pay the city $41 million, for any public purpose."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "bank-vault"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"
filed = false

[[section.line]]
text = "The official county list of measures for this election says that no argument for Measure W was submitted, by any group or person."
sources = ["arguments-filed"]

[section.line.visual]
kind = "list"
source = "arguments-filed"
items = ["No argument for was submitted"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "The official county list of measures for this election says that no argument against Measure W was submitted, by any group or person."
sources = ["arguments-filed"]

[section.line.visual]
kind = "list"
source = "arguments-filed"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote would permit the city to sell its water system to Golden State."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["to sell the Bell Gardens Municipal Water System"]

[[section.line]]
text = "A no vote would prohibit the sale, unless voters later approve a new and different proposal."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["to sell the Bell Gardens Municipal Water System"]

[[question]]
ask = "Who sets water rates if the system is sold?"
lines = ["rates", "review"]

[[question]]
ask = "Who gets water from the city's system now?"
lines = ["today-split"]

[[question]]
ask = "What could the city spend the money on?"
lines = ["price"]

[[question]]
ask = "How big is $41 million next to the city budget?"
unanswered = true
