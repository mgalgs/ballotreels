# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; why the district put it on the ballot (as the
# impartial analysis states it) and the vote it needs; what would change
# (the financing district, the rates, how long, where the money goes);
# the revenue and the spending limit; both sides, neither of which filed
# an argument; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the opening
# says "the voters of this community services district". The card, the
# title and the "Only voters in ..." line carry the names. "Counsel" is
# heard as "Council" (standard/speakability.txt), so the narration does
# not say it.
#
# The card quotes the County of Monterey Elections Department's List of
# Local Measures, which prints the ballot question with no yes and no
# sentences, so the card has no boxes and the vote lines take their
# meaning from the impartial analysis. That the district lacked the money
# for its road work is the impartial analysis's own statement, so it is
# told in the background attributed to the analysis.
#
# The first-year revenue ($999,736) is the district's, and no archived
# source states the district's budget, so it has no scale (STANDARD.md
# 6.5; left open). The appropriations limit is a ceiling the measure
# sets, not money raised or spent. The rates per parcel are exempt; the
# chart shows the highest first-year rate for each class of parcel in the
# rate and method of apportionment (page 11 of the full text).
#
# The list links no argument for or against Measure T: none was filed.
# Each side says so plainly; both sections are marked filed = false.

contest = "ca-2026-11-03-santa-lucia-csd-measure-t"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "measure-list"
number = "T"
title = "Community Facilities District No. 2 (Road Quality) of the Santa Lucia Community Services District"
origin = "2/3 Voter Approval Required"
summary = "Shall a special tax to maintain and operate Santa Lucia’s roads (including necessary resurfacing, rehabilitation, preventative treatments, and similar work) be levied annually for 15 years at an initial rate of $2,968 per year for developed and undeveloped estate residential parcels with rates for other parcels shown in Resolution No. 26-08, with all rates subject to a 2% annual inflation adjustment, initially generating approximately $999,736 and shall Community Facilities District No. 2 (Road Quality) of the Santa Lucia Community Services District have an appropriations limit of $1,350,000?"

[[section]]
id = "what"
heading = "Measure T"

[[section.line]]
text = "Measure T asks the voters of this community services district whether to approve a yearly special tax for its roads, for 15 years."
