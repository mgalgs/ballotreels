# Archived sources for San Diego Unified School District Measure M,
# 2026-11-03 general election (sources/sources.md). Every id here may be
# cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1). The guide's pages are cut from the San
# Diego County Registrar of Voters' Voter Information Guide (ballot type
# 329); "page" is the guide's printed footer number.
#
# One guide page prints the ballot label, County Counsel's Impartial
# Analysis and the Tax Information Statement; each is its own source.

[contest]
id = "ca-2026-11-03-san-diego-unified-measure-m"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/school_district:san_diego_city_unified_school_district"
kind = "measure"
title = "San Diego Unified Measure M: School Repair and Safety Bonds"

