# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and of whom; how a school bond is repaid and what it needs to
# pass; what the money would pay for and the charter set-aside; the
# district's tax statement; one line per side;
# what a vote does.
#
# "Counsel" is heard as "Council" (standard/speakability.txt), so the
# narration says "the county attorney's impartial analysis". The bond
# total, the charter set-aside and the debt service are repaid from a tax
# on property in the district, and no archived source states the
# district's budget, so they have no budget scale (STANDARD.md 6.5; left
# open). The set-aside is given as its share of the bonds, plain
# arithmetic on the analysis's two figures (567 / 3,500 = 16 percent).
# The fiscal line gives the tax statement's highest rate beside its
# average, as it prints both.
# The supporters' "will NOT raise our taxes" is their argument, so it
# stays out of the neutral sections (STANDARD.md 6.3), as do the audits
# and oversight committee it cites.
#
# No argument against Measure M was filed. The no side says so plainly;
# its section is marked filed = false.

contest = "ca-2026-11-03-san-diego-unified-measure-m"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-label"
number = "M"
title = "SAN DIEGO UNIFIED SCHOOL DISTRICT REPAIR, STUDENT SAFETY, NO TAX RATE INCREASE MEASURE"
origin = "The Board of Education for the San Diego Unified School District (“District”) placed this measure on the ballot."
summary = "shall San Diego Unified School District’s measure authorizing $3,500,000,000 in bonds at legal rates, levying $32 per $100,000 of assessed value, providing $204,000,000 annually while bonds are outstanding, requiring public spending disclosure, audits, citizens oversight, be adopted?"
yes = "A “YES” vote is in favor of authorizing the District to issue and sell $3,500,000,000 in general obligation bonds."
no = "A “NO” vote is against authorizing the District to issue and sell $3,500,000,000 in general obligation bonds."

[[section]]
id = "what"
heading = "Measure M"

[[section.line]]
text = "San Diego Unified Measure M asks the district's voters whether to approve $3.5 billion in school bonds."
sources = ["ballot-label"]

[section.line.visual]
kind = "page"
source = "ballot-label"
highlight = ["$3,500,000,000 in bonds"]

[[section]]
id = "today"
heading = "How a school bond works"

[[section.line]]
text = "The district would borrow the money and repay it from a tax on property in the district."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "bond-certificates"

[[section.line]]
text = "Measure M needs 55 percent of the vote to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "The money would repair roofs, plumbing and restrooms, remove asbestos and lead paint, and upgrade career and science classrooms."
sources = ["ballot-label"]

[section.line.visual]
kind = "illustration"
name = "school-classroom"

[[section.line]]
text = "The district would set aside $567 million of it, about 16 percent, for charter school projects."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "share"
title = "Measure M's bonds set aside for charter school projects"
