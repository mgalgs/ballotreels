# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks; Measure D's neighborhood petition and what it requires today;
# what would change and the steps that would still apply; why it is on
# the ballot and what it needs to pass; that the guide gives no cost
# estimate; one line per side; what a vote does.
#
# Not a tax measure: the guide prints no fiscal analysis or tax rate
# statement, so the fiscal line says the guide includes no cost estimate,
# as for Coronado Measure D. The page prints no subject heading over the
# ballot question, so the card's title is the page's own head, the
# city's name. The yes box quotes the analysis's yes sentence up to its
# last word: the guide ends it with a comma at a page break.
#
# The guide prints an argument in favor and the notice "NO ARGUMENT
# AGAINST MEASURE O WAS SUBMITTED": the no side is filed = false. The
# argument in favor's point that the measure itself rezones no land is
# its own, so it stays in its section (STANDARD.md 6.3), though the full
# text says it too.

contest = "ca-2026-11-03-albany-measure-o"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide-page"
number = "O"
title = "CITY OF ALBANY"
origin = "On June 1, 2026, the City Council voted to place Measure “O” on the November 3, 2026 General Municipal Election ballot."
summary = "Shall the measure authorizing the Albany City Council to amend the residential voter requirements for zoning changes to the R-1 zoned areas of the City established by Measure D (enacted by the Albany voters in 1978), without majority neighborhood voter approval, after following noticed public hearing and zoning ordinance amendment procedures prescribed by State Law and the Albany Municipal Code, be adopted?"
yes = "A “yes” vote on Measure “O” will authorize the City Council to make zoning changes within the R-1 zoned areas without majority neighborhood voter approval"
no = "A “no” vote on Measure “O” will not authorize the City Council to make zoning changes within the R-1 zoned areas without majority neighborhood voter approval"

[[section]]
id = "what"
heading = "Measure O"

[[section.line]]
text = "City of Albany Measure O asks Albany voters whether the City Council may change zoning in single-family areas without a neighborhood petition."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["without majority neighborhood voter approval"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Under Measure D, which Albany voters passed in 1978, a zoning change in a single-family area needs a petition from its neighbors."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "single-family-street"

[[section.line]]
text = "At least half of the resident voters within 300 feet of the change must sign it."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "neighborhood-petition"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "Measure O would let the City Council make those changes without the petition, after public hearings and the steps state law and city code require."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "county-building"

[[section.line]]
text = "Only voters can change Measure D, so Measure O needs a majority of Albany voters to pass."
sources = ["guide-page", "text"]

[section.line.visual]
kind = "illustration"
name = "ballot-box"

[[section]]
id = "fiscal"
heading = "What it would cost"

[[section.line]]
text = "The Alameda County guide does not include a cost estimate for the measure."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"
stamp = "None reported"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say an outdated rule makes it harder to meet housing needs, and Measure O approves no project itself."
sources = ["arguments"]
basis = ["Nearly five decades later, that outdated rule makes it harder for Albany to respond fairly and effectively to today’s housing needs.", "Measure O does not change zoning. It does not approve any specific project, increase density, or alter development standards immediately."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["An outdated rule slows housing", "Approves no project by itself"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "The Alameda County Composite Voter Information Guide says that no argument against Measure O was submitted for this election."
sources = ["arguments"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote authorizes the City Council to make those zoning changes without the neighborhood petition."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["will authorize"]

[[section.line]]
text = "A no vote does not authorize the City Council to make those zoning changes without the neighborhood petition."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["will not authorize"]
