# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the sales tax today and the
# city's half-percent tax that expires in 2031; what would change (the
# rate, no end date, a general tax needing a simple majority); the state
# cap and the pending state bill, as the impartial analysis states them;
# the analysis's revenue estimate; one line per side; what a vote does.
#
# The guide prints no fiscal analysis or tax rate statement; the one
# estimate is the City Attorney's Impartial Analysis's. No archived
# source states the city's general fund budget, so the $46 million has
# no scale (STANDARD.md 6.5; left open). The analysis says the Governor
# had not acted on Senate Bill 762 when it was written; no archived
# source says whether it was signed, so the script says only what the
# analysis says. The earlier tax is not named "Measure Q", so the
# narration does not mix two measure letters. "city's" is heard as
# "cities" (standard/speakability.txt), so the narration says "the city"
# or "Santa Rosa".
#
# The vote lines quote the card's yes/no lines. No argument against Measure L was submitted: the
# no side is filed = false.

contest = "ca-2026-11-03-santa-rosa-measure-l"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "measure-question"
number = "L"
title = "City of Santa Rosa"
origin = "The City Council of the City of Santa Rosa placed Measure L on the ballot."
summary = "City of Santa Rosa Community Safety/Financial Stability Measure. Shall the measure maintaining Santa Rosa’s quality of life, 911 emergency medical, police response to violent crimes; keeping all city fire stations open and public places safe/clean; fixing streets/repairing potholes; addressing homeless encampments; maintaining police, fire protection, other services, by reauthorizing the existing, voter approved sales tax at an updated 1¢ rate, providing approximately $46,000,000 annually until ended by voters; requiring audits, public disclosure, local control, be adopted?"
yes = "A “Yes” vote is a vote in favor of the Measure."
no = "A “No” vote is a vote against the Measure."

[[section]]
id = "what"
heading = "Measure L"

[[section.line]]
text = "City of Santa Rosa Measure L asks voters in Santa Rosa whether to replace a one-half percent sales tax with a 1 percent tax."
sources = ["measure-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "measure-question"
highlight = ["by reauthorizing the existing, voter approved sales tax at an updated 1¢ rate"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "The sales tax in Santa Rosa totals 10 percent, including a one-half percent city tax that expires on March 31, 2031."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "end-date"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "Measure L would raise the total to 10.5 percent, with no end date unless voters repeal it."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "city-storefronts"

[[section.line]]
text = "As a general tax, it could pay for any lawful city purpose, and it needs a simple majority."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "state-budget"

[[section.line]]
id = "state-cap"
text = "Without a state bill the Governor had not acted on when the analysis was written, the full increase may not take effect."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "unsigned-bill"

[[section]]
id = "fiscal"
heading = "What the impartial analysis says"

[[section.line]]
text = "The City Attorney's impartial analysis estimates $46 million a year, about $23 million more than the current tax."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "sales-receipt"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Measure L prevents more cuts to fire, police and 911 services, and keeps every city fire station open."
sources = ["arguments"]
basis = ["Prevent devastating cuts to fire, police, 911 emergency services and the essential City services Santa Rosa residents rely on", "Yes on L keeps all Santa Rosa fire stations open and running!"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Prevents cuts to fire, police and 911", "Keeps every fire station open"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure L was submitted for the Sonoma County voter guide, so no opposing view appears beside it."
sources = ["arguments"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote is a vote in favor of the measure."
sources = ["measure-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "measure-question"
highlight = ["in favor of the Measure"]

[[section.line]]
text = "A no vote is a vote against the measure."
sources = ["measure-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "measure-question"
highlight = ["against the Measure"]

[[question]]
ask = "Can the city actually collect the full increase under state law?"
lines = ["state-cap"]
