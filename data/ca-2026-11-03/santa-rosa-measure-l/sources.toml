# Archived sources for City of Santa Rosa Measure L, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# The Sonoma County Registrar of Voters publishes each measure's pages
# of its guide as one PDF, headed "Local Ballot Measure: L" and footed
# "Sonoma County" with the guide's page numbers (049M550 to 049M552); no
# cover page was archived, so the sources name those pages, not a guide
# title. One PDF backs every source here. The City Attorney's Impartial
# Analysis is the measure's neutral explanation. The guide prints no
# fiscal analysis or tax rate statement (a sales tax, not a bond).

[contest]
id = "ca-2026-11-03-santa-rosa-measure-l"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:santa_rosa"
kind = "measure"
title = "City of Santa Rosa Measure L: Reauthorizing the City Sales Tax at a 1 Percent Rate"

