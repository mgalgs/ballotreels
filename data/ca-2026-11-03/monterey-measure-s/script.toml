# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; how the tax got here (approved in
# 2014, extended in 2018, as the impartial analysis says, with no vote
# counts) and when it ends today; what would change (eight more years, to
# March 31, 2035, at the same rate; a special tax for streets, sidewalks,
# storm drains and access improvements; two-thirds to pass); the revenue
# as the ballot question gives it; one line per side; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". The card and title carry it.
#
# The card quotes the County of Monterey Elections Department's List of
# Local Measures, whose ballot question matches the signed Resolution No.
# 26-103 C.S.'s word for word. It prints no yes and no sentences, so the
# card has no boxes and the vote lines take their meaning from the City
# Attorney's impartial analysis.
#
# "Without increasing tax rates" is the ballot question's wording, and is
# said as the question's (the impartial analysis says the same: "without
# increasing the rate"). The resolution's findings (past vote shares, the
# repairs done, the cost of keeping streets in repair) are the City's
# claims of need and benefit and are not narrated; the supporters' own
# figures stay out of the neutral sections (STANDARD.md 6.3). The
# oversight committee and audits, which the supporters cite, are left out
# of the neutral sections too.
#
# The $12 million a year is the ballot question's and the impartial
# analysis's figure. No cited source states the City's general fund
# budget, so it has no scale (STANDARD.md 6.5; left open, under
# [[question]]).
#
# The sides distil the primary arguments filed with the City Clerk; the
# rebuttals are archived, not cited. Each side's second point is one the
# other side's argument does not contest head on, so neither line answers
# the other.

contest = "ca-2026-11-03-monterey-measure-s"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "measure-list"
number = "S"
title = "City of Monterey"
origin = "2/3 Voter Approval Required"
summary = "CONTINUATION OF STREET INFRASTRUCTURE REHABILITATION TAX. Without increasing tax rates, shall the City of Monterey measure to fix streets, potholes, and sidewalks, repair storm drains to keep beaches/Monterey Bay clean, improve street safety and access for senior citizens, disabled residents, and others by renewing the existing one-cent per dollar sales tax for 8 years, providing $12 million annually, requiring public disclosure of funds/independent audits, and all funds spent locally, be adopted?"

[[section]]
id = "what"
heading = "Measure S"

[[section.line]]
text = "Measure S asks the voters of this city whether to continue an existing 1 percent sales tax for street repair for 8 more years."
sources = ["measure-list", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "measure-list"
highlight = ["renewing the existing one-cent per dollar sales tax for 8 years"]

[[section]]
id = "background"
heading = "How the tax got here"

[[section.line]]
id = "history"
text = "The city attorney's impartial analysis says voters first approved the tax in 2014, and extended it in 2018."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "timeline"
source = "impartial-analysis"
labels = ["2014", "2018", "March 31, 2027"]
items = ["Voters approve the tax", "Voters extend the tax", "The tax is set to expire"]

[[section]]
id = "today"
heading = "The tax today"

[[section.line]]
id = "expires"
text = "Today the tax is set to expire on March 31, 2027, unless voters extend it."
sources = ["impartial-analysis"]

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "end"
text = "Measure S would keep the tax at the same rate until March 31, 2035."
sources = ["resolution", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "end-date"

[[section.line]]
id = "uses"
text = "As a special tax, its money could be spent only on streets, sidewalks, storm drains, and access improvements like curb ramps."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "storm-drain-street"

[[section.line]]
id = "threshold"
text = "Measure S needs two-thirds of the vote to pass."
sources = ["impartial-analysis", "measure-list"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "fiscal"
heading = "What the ballot question says"

[[section.line]]
id = "revenue"
text = "The ballot question says the measure renews the tax without increasing tax rates, providing $12 million a year."
sources = ["measure-list", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "measure-list"
highlight = ["providing $12 million annually"]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say preserving the progress with ongoing investment is five times cheaper than rebuilding later, and that most of the tax would be paid by non-residents."
sources = ["argument-for"]
basis = ["It is five times cheaper to preserve our progress with ongoing investment, than costly reconstruction later.", "the majority of tax will be paid by non-residents but will be invested in our neighborhoods."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Upkeep is five times cheaper", "Most of it paid by non-residents"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say homeowners must pay to fix the public sidewalks beside their homes while paying a tax for sidewalk repairs, and that sidewalk spending is down."
sources = ["argument-against"]
basis = ["homeowners must personally pay to fix the adjoining public sidewalk — while continuing to pay a tax that funds sidewalk repairs.", "Sidewalk spending remains down year-over-year: $233,846 — 42% below the comparable prior-year period."]

[section.line.visual]
kind = "list"
source = "argument-against"
items = ["Homeowners still pay for sidewalks", "Sidewalk spending is down"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote continues the 1 percent sales tax for 8 more years."
sources = ["impartial-analysis", "measure-list"]

[section.line.visual]
kind = "page"
source = "measure-list"
highlight = ["renewing the existing one-cent per dollar sales tax for 8 years"]

[[section.line]]
text = "A no vote does not extend the tax, which would no longer be collected after March 31, 2027."
sources = ["impartial-analysis", "measure-list"]

[section.line.visual]
kind = "page"
source = "measure-list"
highlight = ["renewing the existing one-cent per dollar sales tax for 8 years"]

[[question]]
ask = "Is this a new tax, and when would it end?"
lines = ["history", "expires", "end"]

[[question]]
ask = "What could the money be spent on?"
lines = ["uses"]

[[question]]
ask = "How big is $12 million a year next to the city budget?"
unanswered = true
