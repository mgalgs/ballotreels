# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and of whom; how a school bond is repaid and what it needs to
# pass; what the money would pay for; the district's tax statement; one
# line per side; what a vote does.
#
# The ballot question has no title line, so the card quotes the question
# (from the sample ballot, the one page that prints it) as its title, as
# Santee School District's card does, and the Impartial Analysis's
# statement of what the measure does as its summary, with its origin and
# yes and no lines. "Counsel" is heard as "Council"
# (standard/speakability.txt). The bond total and the debt service are
# repaid from a tax on property in the district, and no archived source
# states the district's budget, so they have no budget scale (STANDARD.md
# 6.5; left open). The fiscal line gives the tax statement's highest rate
# beside its average, as it prints both.
#
# Whether Measure M raises taxes is what the two sides dispute (the
# question opens "Without increasing current tax rates", the supporters
# repeat it, the Impartial Analysis says the bonds "would be repaid
# through an increase in property taxes", and the opponents' rebuttal
# calls it "A NEW TAX"), so the neutral sections give only the tax
# statement's rates and years and leave those words on the card
# (STANDARD.md 6.3). The opponents argue the ballot hides the repayment
# cost of $714 million; the fiscal section still gives the tax
# statement's total debt service, as every bond script does (STANDARD.md
# 6.4), and the opponents' line keeps their claim without repeating the
# figure. The $130 million General Fund balance is the opponents' figure,
# not an official source's. Sides come from the argument in favor and
# the argument against, not the rebuttals.

contest = "ca-2026-11-03-murrieta-valley-unified-measure-m"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-label"
number = "M"
title = "Without increasing current tax rates, to fix deteriorating roofs, plumbing, HVAC, electrical, safety systems, and repair/upgrade aging classrooms, science labs, career technology and school facilities to support college/career readiness in math, science, technology, arts, engineering, and skilled trades, shall Murrieta Valley Unified School District's measure be adopted authorizing $359,000,000 in bonds at legal rates, levying $60 per $100,000 assessed value ($22 million annually) while bonds are outstanding, with citizen oversight, audits and all money locally controlled?"
origin = "The Board of Education of the District, by adopting Resolution No. 25/26-18 (“Resolution”), elected to call an election to place this Measure on the ballot."
summary = "Measure M would enable the District to issue and sell bonds of up to a maximum of three hundred fifty-nine million ($359,000,000), at interest rates not to exceed legal limits."
yes = "A “YES” vote on Measure “M” is a vote to authorize the District to issue and sell bonds to provide financing of school facilities projects."
no = "A “NO” VOTE on Measure “M” is a vote to reject the District from issuing and selling bonds to provide financing of school facilities projects."

[[section]]
id = "what"
heading = "Measure M"

[[section.line]]
text = "Murrieta Valley Unified School District Measure M asks the district's voters whether to approve $359 million in school bonds."
sources = ["ballot-label"]

[section.line.visual]
kind = "page"
source = "ballot-label"
highlight = ["$359,000,000 in bonds"]

[[section]]
id = "today"
heading = "How a school bond works"

[[section.line]]
text = "The district would borrow the money and repay it from a tax on property in the district."
sources = ["tax-statement"]

[section.line.visual]
kind = "illustration"
name = "bond-certificates"

[[section.line]]
text = "Measure M needs 55 percent of the vote to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "The money would fix roofs, plumbing, heating and air conditioning, and electrical and safety systems, and upgrade aging classrooms and science labs."
sources = ["ballot-label"]

[section.line.visual]
kind = "illustration"
name = "school-classroom"

[[section]]
id = "fiscal"
heading = "What the tax statement says"

[[section.line]]
text = "The district's tax statement estimates an average tax of $49.64 per $100,000 of assessed value, and at most $60, through 2058-2059."
sources = ["tax-statement"]

[section.line.visual]
kind = "illustration"
name = "debt-payments"

[[section.line]]
text = "The statement estimates the total to repay, with interest, at about $714 million."
sources = ["tax-statement"]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Measure M repairs schools nearly 40 years old and older portables, without increasing tax rates."
sources = ["arguments"]
basis = ["neighborhood schools are nearly 40 years old", "classrooms now more than 30 years old", "Measure M will not increase tax rates; it simply renews our community’s"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Repairs aging schools and old portables", "Upgrades schools without increasing tax rates"]

[[section]]
