# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the 2025 law and district that
# let voters approve such a tax;
# what would change (the rates and years, where the money goes, the one
# district-wide vote total); the impartial analysis's revenue estimate;
# one line per side; what a vote does.
#
# The ballot calls it the "Regional Transit Measure", not by a letter;
# the title and badge say RTM, as the directory does, and the opening
# line names it both ways. The card quotes the ballot question from the
# district's Resolution No. 2, which prints no yes/no lines; as for Los
# Angeles County Measure A, the vote lines give the impartial analysis's
# meanings and both highlight the one phrase of the question they turn
# on.
#
# No fiscal statement or tax rate statement was published; the one
# estimate is the impartial analysis's (and the ballot question's). It is
# the new district's revenue, and no archived source states a budget of
# the district (or of its five counties' transit) to scale it against
# (STANDARD.md 6.5; left open). How much of it San Mateo County would
# raise is printed nowhere, so the script does not say. Each county's
# shares by agency (Section 12) are left out of the neutral sections:
# where San Mateo County's money goes is what the two sides dispute
# ("invests directly in San Mateo County"; "most ... would go to ...
# other counties"), so stating the shares would weigh in (STANDARD.md
# 6.3).

contest = "ca-2026-11-03-san-mateo-county-measure-rtm"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "RTM"
title = "Regional Transit Measure"
origin = "the initiative petition entitled the “Connect Bay Area Transit Initiative”"
summary = "To prevent major service cuts to BART and other transit, avoid increased traffic, and reduce pollution by: Preserving BART, Caltrain, VTA, SamTrans, AC Transit, Muni, other transit for everyone, including workers, students, seniors, persons with disabilities; Supporting transit safety, cleanliness, affordability, reliability; Repairing targeted roads/potholes; Requiring financial transparency, oversight, accountability; shall the measure enacting a 0.5% (Alameda, Contra Costa, San Mateo, Santa Clara counties), and 1% (San Francisco) sales tax for 14 years generating approximately $980,000,000 annually, be adopted?"

[[section]]
id = "what"
heading = "Measure RTM"

[[section.line]]
text = "San Mateo County Measure RTM, the Regional Transit Measure, asks voters in a five-county transit district whether to add a sales tax for transit."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["sales tax for 14 years"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "district"
text = "A 2025 state law lets voters in that district, San Mateo, Alameda, Contra Costa and Santa Clara counties and San Francisco, approve a sales tax for transit."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "county-line-map"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "rates"
text = "Measure RTM would add a 0.5 percent sales tax for 14 years, or 1 percent in San Francisco."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "bars"
title = "Sales tax the measure would add"
source = "impartial-analysis"
unit = "%"
labels = ["San Mateo, Alameda, Contra Costa, Santa Clara", "San Francisco"]
values = [0.5, 1]

[[section.line]]
id = "shares"
text = "The measure splits the money among agencies such as BART, Caltrain and Muni, by shares it sets for each county."
sources = ["impartial-analysis", "resolution"]

[section.line.visual]
kind = "illustration"
name = "commuter-train"

[[section.line]]
id = "majority"
text = "Measure RTM needs a majority of all the votes cast in the five counties combined, not in each county."
sources = ["impartial-analysis", "resolution"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "fiscal"
heading = "What the impartial analysis says"

[[section.line]]
text = "The impartial analysis estimates the tax would raise about $980 million a year across the district."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say that without it, Caltrain could close up to a third of its stations, and that it invests directly in San Mateo County."
sources = ["argument-for"]
basis = ["Without the Regional Transit Measure, Caltrain could close up to one-third of stations", "The Regional Transit Measure invests directly in San Mateo County, protecting Caltrain, SamTrans, and paratransit service"]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Prevents Caltrain and BART station closures", "Invests directly in San Mateo County"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say it is a $14 billion bailout for a broken system, sending most San Mateo County taxes to agencies serving other counties."
sources = ["argument-against"]
basis = ["The five-county Regional Transit Measure’s (RTM’s) tax increase is a $14 billion-dollar bailout for a broken system with irresponsible management.", "Most new RTM taxes from San Mateo County would go to fund transit agencies serving other counties, like San Francisco."]

[section.line.visual]
kind = "list"
source = "argument-against"
items = ["A $14 billion bailout for a broken system", "Local taxes fund agencies in other counties"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote is a vote to impose the sales tax for 14 years."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["sales tax for 14 years"]

[[section.line]]
text = "A no vote is a vote against imposing the tax."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["sales tax for 14 years"]

[[question]]
ask = "Which counties vote on this?"
lines = ["district"]

[[question]]
ask = "Does San Mateo County need to pass it on its own?"
lines = ["majority"]

[[question]]
ask = "How much of the money would be raised in San Mateo County?"
unanswered = true
