# Archived sources for Cambrian School District Measure Q, 2026-11-03
# general election (sources/sources.md, sources/rov-sources.md). Every id
# here may be cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# The County of Santa Clara Registrar of Voters' "List of Local Measures"
# page prints the measure's letter, ballot question and vote threshold and
# lists "Primary Argument Against (none filed)"; the argument in favor is
# its posted scan. No impartial analysis is archived: the list's analysis
# link for Q points to another measure's document, so the explanation
# rests on the ballot question alone. The measure's full text was not
# archived. A parcel tax has no tax rate statement: the measure's revenue
# figure is in its ballot question. The District's own Measure Q page
# (sources/district-measure-q-page-2026-10-28.html) is the District's
# material and is not cited.
#
# The ROV's PDF is a scan with no text layer. The passages cited were
# typed from the page images into sources/rov-argument-for-transcription.txt,
# which names the PDF and URL it copies; the source points at the
# transcription, and its url at the scan.

[contest]
id = "ca-2026-11-03-cambrian-measure-q"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/school_district:cambrian_elementary_school_district"
kind = "measure"
title = "Cambrian School District Measure Q: Parcel Tax for Educational Programs"

[[source]]
id = "measure-list"
kind = "official-title-summary"
publisher = "County of Santa Clara Registrar of Voters, List of Local Measures, November 3, 2026 General Election: Cambrian School District Measure Q"
credit = "List of Local Measures, Santa Clara County Registrar of Voters"
url = "https://vote.santaclaracounty.gov/list-local-measures-4"
file = "sources/rov-measure-list-2026-10-29.html"
retrieved = "2026-10-29"

[[source]]
id = "argument-for"
kind = "official-argument"
publisher = "Primary Argument in Favor of Measure Q, as filed with the Santa Clara County Registrar of Voters (transcribed from the scan; no argument against was filed)"
credit = "Argument in favor, Measure Q"
url = "https://files.santaclaracounty.gov/exjcpb1296/2026-08/measure-q_cambrian-school-district-parcel-tax_primary-argument-in-favor_redacted_final.pdf"
file = "sources/rov-argument-for-transcription.txt"
retrieved = "2026-10-29"
