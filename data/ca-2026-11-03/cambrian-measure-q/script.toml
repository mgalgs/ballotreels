# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; what it needs to pass; how the tax would
# change and how long it would last; what the money is for and who is
# exempt; the revenue figure; one line per side; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the opening
# says "the voters of this school district". The card and title carry the
# names.
#
# No impartial analysis is archived (the Registrar of Voters' analysis
# link for Q points to another measure's document), and the measure's
# full text was not archived, so every neutral line rests on the ballot
# question as the Registrar of Voters' List of Local Measures prints it.
# The District's own Measure Q page is not cited. The list prints the
# question with no yes and no sentences, so the card has no boxes and
# the vote lines highlight the question's own phrases. The ballot
# question's $1,000,000 a year is district revenue, and no archived
# source states the district's budget, so it has no scale (STANDARD.md
# 6.5; left open).
#
# The ballot question's purposes overlap the supporters' list, so the
# yes side takes the argument's other claims (pay, cuts, property
# values) and the neutral line keeps to the question's words.
#
# The List of Local Measures shows "Primary Argument Against (none
# filed)". The no side says so plainly; its section is marked
# filed = false.

contest = "ca-2026-11-03-cambrian-measure-q"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "measure-list"
number = "Q"
title = "Parcel Tax"
origin = "Cambrian School District"
summary = "To protect the quality of education in our local elementary and middle schools, provide funding for core academic programs in math, science, engineering, technology, reading, writing and arts, attract/retain highly qualified teachers, and maintain manageable class sizes, shall Cambrian School District's measure be adopted, levying $148/parcel for 8 years, its continuance subject to voter approval, with senior exemptions, annual inflation adjustments, providing $1,000,000 annually in locally controlled funding that can't be taken by the State?"

[[section]]
id = "what"
heading = "Measure Q"

[[section.line]]
id = "rate"
text = "Measure Q asks the voters of this school district whether to levy a parcel tax of $148 a parcel for eight years."
sources = ["measure-list"]

[section.line.visual]
kind = "page"
source = "measure-list"
highlight = ["levying $148/parcel for 8 years"]

[[section]]
id = "today"
heading = "How the tax works"

[[section.line]]
id = "threshold"
text = "Measure Q needs two-thirds of the vote to pass."
sources = ["measure-list"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section.line]]
id = "inflation"
text = "The tax would be adjusted each year for inflation, and continuing it would be subject to voter approval."
sources = ["measure-list"]

[section.line.visual]
kind = "page"
source = "measure-list"
highlight = ["its continuance subject to voter approval, with senior exemptions, annual inflation adjustments"]

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "uses"
text = "It names core programs in math, science, reading, writing and arts, keeping qualified teachers, and manageable class sizes."
sources = ["measure-list"]

[section.line.visual]
kind = "illustration"
name = "school-classroom"

[[section.line]]
id = "exempt"
text = "It also includes senior exemptions."
sources = ["measure-list"]

[section.line.visual]
kind = "illustration"
name = "senior-center"

[[section]]
id = "fiscal"
heading = "What the ballot question says"

[[section.line]]
id = "revenue"
text = "The ballot question says the tax would provide $1 million a year in locally controlled funding."
sources = ["measure-list"]

[section.line.visual]
kind = "page"
source = "measure-list"
highlight = ["providing $1,000,000 annually in locally controlled funding"]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Measure Q helps pay competitive teacher salaries and prevent further deep cuts, and that great schools protect property values."
sources = ["argument-for"]
basis = ["Measure _ helps provide competitive teacher salaries, prevent further deep cuts to vital instructional programs, library services, academic and mental health services, and avoid future teacher layoffs.", "Great schools protect property values and our quality of life."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Competitive teacher salaries, fewer cuts", "Great schools protect property values"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure Q was filed, so the list of local measures from the county shows only the argument for it."
sources = ["measure-list"]

[section.line.visual]
kind = "list"
source = "measure-list"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote levies the parcel tax of $148 a parcel for eight years."
sources = ["measure-list"]

[section.line.visual]
kind = "page"
source = "measure-list"
highlight = ["levying $148/parcel for 8 years"]

[[section.line]]
text = "A no vote does not levy the tax."
sources = ["measure-list"]

[section.line.visual]
kind = "page"
source = "measure-list"
highlight = ["be adopted"]

[[question]]
ask = "How much would a parcel pay?"
lines = ["rate", "inflation"]

[[question]]
ask = "Who would be exempt?"
lines = ["exempt"]

[[question]]
ask = "What would the money pay for?"
lines = ["uses"]

[[question]]
ask = "Does the district have a parcel tax now?"
unanswered = true

[[question]]
ask = "How large is $1 million a year next to the district's budget?"
unanswered = true
