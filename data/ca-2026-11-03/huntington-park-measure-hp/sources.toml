# Archived sources for City of Huntington Park Measure HP, 2026-11-03
# general election (sources/la-sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The Los Angeles County Registrar-Recorder/County Clerk's list "Measures
# Appearing on the Ballot" is the authority for the letter and the ballot
# question, quoted on the card; its "Opponents: None submitted." is the
# official statement that no argument against was filed (`measure-list`).
#
# The Registrar's Interactive Sample Ballot prints the City Attorney's
# impartial analysis (the measure's neutral explanation, the kind a
# state's attorney general's explanatory statement is; it gives no cost
# estimate) and the argument in favor, signed by the Mayor and a Council
# Member, the two the county's list names as supporters, saved as HTML.
# These supersede the copies in the City's consolidation packet
# (resolution.pdf, pages 17-20; the argument's scanned pages typed into
# sources/resolution-transcription.txt), which say the same. The packet,
# as the Board of Supervisors posts it, stays the source for Ordinance
# No. 2026-06, the measure's full text.

[contest]
id = "ca-2026-11-03-huntington-park-measure-hp"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:huntington_park"
kind = "measure"
title = "City of Huntington Park Measure HP: A Two-Term Lifetime Limit for City Council Members"

