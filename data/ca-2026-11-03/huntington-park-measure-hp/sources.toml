# Archived sources for City of Huntington Park Measure HP, 2026-11-03
# general election (sources/la-sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The Los Angeles County Registrar-Recorder/County Clerk's list "Measures
# Appearing on the Ballot" is the authority for the letter and the ballot
# question, quoted on the card; its "Opponents: None submitted." is the
# official statement that no argument against was filed (`measure-list`).
#
# resolution.pdf is the City's consolidation packet as the Board of
# Supervisors posts it: Resolutions No. 2026-25 and 2026-28, Ordinance
# No. 2026-06 (the measure's full text), the ballot question, the City
# Attorney's impartial analysis and, on pages 19 and 20, the argument in
# favor, signed by the Mayor and a Council Member, the two the county's
# list names as supporters. la-sources.md says the argument is not in the
# packet; it is, as scanned pages with no text layer, typed into
# sources/resolution-transcription.txt, which `argument-for` points at.
# The impartial analysis is the measure's neutral explanation, the kind a
# state's attorney general's explanatory statement is; it gives no cost
# estimate.

