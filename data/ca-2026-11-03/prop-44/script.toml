[[section.line]]
text = "Clinics falling short would pay a penalty, refunded if they comply within five years."
sources = ["lao-analysis"]

[section.line.visual]
kind = "illustration"
name = "penalty-refund"

[[section]]
id = "fiscal"
heading = "What the state's analyst says"

[[section.line]]
text = "The Legislative Analyst's Office says enforcement would cost the state low tens of millions a year, less than 1 percent of this year's General Fund spending, paid by clinic fees."
sources = ["lao-analysis", "budget"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section.line]]
text = "The Legislative Analyst's Office says other state and local costs are uncertain."
sources = ["lao-analysis"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Proposition 44 directs clinic money to patient care, not executive pay and overhead."
sources = ["arguments"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Directs clinic money to patient care, not executive pay", "Requires clinics to report publicly how money is spent"]

