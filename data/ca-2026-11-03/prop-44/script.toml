# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; who safety net clinics serve; how much of their revenue goes
# to health care today; the minimum Proposition 44 would set, and the
# penalty behind it; the analyst's cost estimate, and the other costs
# it calls uncertain; one point per side; what a vote does.

contest = "ca-2026-11-03-prop-44"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "quick-reference"
number = "44"
title = "REQUIRES COMMUNITY HEALTH CLINICS SPEND 90% OF REVENUE ON PROGRAM SERVICES. INITIATIVE STATUTE."
origin = "Put on the Ballot by Petition Signatures"
summary = "Imposes penalties on nonprofit Federally Qualified Health Centers (community clinics providing primary care to medically underserved areas and populations) that spend less than 90% of revenue on “program services” advancing their charitable purpose, including but not limited to patient services. Fiscal Impact: Increased state costs in the low tens of millions of dollars per year, covered by fees."
yes = "A YES vote on this measure means: Certain private nonprofit health care clinics would have to spend at least 90 percent of their revenue each year on providing health care services."
no = "A NO vote on this measure means: The new requirement on health care clinic spending would not go into effect."

[[section]]
id = "what"
heading = "Proposition 44"

[[section.line]]
text = "Proposition 44 is about how community health clinics spend money."
sources = ["quick-reference"]

[section.line.visual]
kind = "page"
source = "quick-reference"
highlight = ["community clinics providing primary care"]

[[section]]
id = "background"
heading = "Safety net clinics"

[[section.line]]
text = "About 2,000 safety net clinics in California mainly serve low-income and uninsured people."
sources = ["lao-analysis"]

[section.line.visual]
kind = "illustration"
name = "community-clinic"

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "On average, nonprofit clinics report spending about 80 percent of revenue on health care."
sources = ["lao-analysis"]

[section.line.visual]
kind = "share"
title = "Average share of revenue spent on health care services"
source = "lao-analysis"
unit = "%"
labels = ["Health care services"]
values = [80]

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "Proposition 44 would set a minimum of 90 percent."
sources = ["lao-analysis"]

[section.line.visual]
kind = "bars"
title = "Share of revenue spent on health care services"
source = "lao-analysis"
unit = "%"
labels = ["Today, on average", "Proposition 44, at least"]
