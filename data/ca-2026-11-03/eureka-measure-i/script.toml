# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; who pays the hotel tax today and
# at what rate; what would change (the added rate, from when, for how
# long, where the money goes, the vote it needs); the City's revenue
# estimate as the impartial analysis gives it; one line per side; what
# a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city", and the card and title carry
# the name.
#
# The guide prints no ballot question, so the card quotes it from the
# City Council's Resolution No. 2026-42, Section 1, as typed from the
# scan. The resolution prints only YES and NO boxes, no yes and no
# sentences, so the card has no boxes; the vote lines give the City
# Attorney's impartial analysis's own meanings, and both highlight the
# same phrase of the question. The ordinance was not obtained: every
# line here is stated in the question or the analysis.
#
# The services the question and the analysis list (police, fire,
# streets, parks and the rest), the audits and the oversight are the
# supporters' points too, so the neutral sections say only that a
# general tax goes into the general fund, and leave the list to the
# card and the yes side (STANDARD.md 6.3). The $700,000 is the City's
# estimate as the analysis gives it; no archived source states the
# City's general fund budget to give it a scale (STANDARD.md 6.5; left
# open, under [[question]]).
#
# The guide prints no argument against Measure I and does not say
# whether one was filed, so the no side says only that the guide prints
# none, filed = false (STANDARD.md 2.5).

contest = "ca-2026-11-03-eureka-measure-i"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "I"
title = "RESOLUTION NO. 2026- 42"
origin = "RESOLUTION OF THE CITY COUNCIL OF THE CITY OF EUREKA, CALIFORNIA"
summary = "To maintain police, fire, 911 emergency medical response, street repair and road safety, parks and recreation, community health and mental health services, local business and economic development, and other essential services impacted by tourism, shall an ordinance increasing the City of Eureka's existing hotel tax by 2%, paid only by guests of hotels and short-term vacation rentals, be adopted until ended by voters, providing approximately $700,000 annually, with independent financial audits and oversight by the City's Finance Advisory Committee?"

[[section]]
id = "what"
heading = "Measure I"

[[section.line]]
text = "Measure I asks the voters of this city whether to raise the hotel tax from 10 percent to 12 percent."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["increasing the City of Eureka's existing hotel tax by 2%"]

[[section]]
id = "today"
heading = "The hotel tax today"

[[section.line]]
id = "who-pays"
text = "Today, guests staying 30 days or less at hotels, motels, campgrounds and short-term rentals pay a 10 percent tax on top of the rent."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "hotel-front-desk"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "added"
text = "Measure I would add 2 percent more, starting January 1, 2027, until voters change or repeal it."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "bars"
title = "Hotel tax, percent of rent"
source = "impartial-analysis"
unit = "%"
labels = ["Today", "With Measure I"]
values = [10, 12]

[[section.line]]
id = "general"
text = "As a general tax, all of the money would go into the city general fund."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "state-budget"

[[section.line]]
text = "Measure I needs a simple majority to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "fiscal"
heading = "What the impartial analysis says"

[[section.line]]
id = "revenue"
text = "The city attorney's impartial analysis estimates that Measure I would bring in about $700,000 a year."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say visitors, not residents, pay the tax, and help pay for the city services they use."
sources = ["arguments"]
basis = ["This tax is paid by guests staying in hotels, motels, and short-term vacation rentals for fewer than 30 days, not by Eureka residents.", "while ensuring that visitors help pay for the services they use."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Paid by visitors, not residents", "Visitors help pay for services"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "The county voter guide prints only the argument in favor of Measure I, and none against it."
sources = ["arguments"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["No argument against was printed"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote raises the hotel tax by 2 percent, starting January 1, 2027."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["increasing the City of Eureka's existing hotel tax by 2%"]

[[section.line]]
text = "A no vote is a vote against the 2 percent increase."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["increasing the City of Eureka's existing hotel tax by 2%"]

[[question]]
ask = "Who pays the hotel tax?"
lines = ["who-pays"]

[[question]]
ask = "How long would the increase last?"
lines = ["added"]

[[question]]
ask = "What can the money be spent on?"
lines = ["general"]

[[question]]
ask = "How big is $700,000 a year next to the city budget?"
unanswered = true
