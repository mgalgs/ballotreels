# Archived sources for City of Eureka Measure I, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# The Humboldt County Office of Elections prints Measure I's impartial
# analysis (page 22) and an argument in favor (page 23) in its Full
# Voter Information Guide; it prints no argument against, no rebuttals,
# no fiscal statement and no ballot question (its sample ballot pages
# are placeholders). The ballot question is the City Council's, from
# Resolution No. 2026-42, Section 1, in the county's packet for the
# measure; those pages are a scan with no text layer, so the passages
# cited were typed from the page images into
# sources/resolution-2026-42-transcription.txt, whose url is the
# scan's (as Fowler Measure T's are). The ordinance raising the tax is
# not in the packet and was not obtained, so no source here is of kind
# official-text. The City Attorney's analysis gives the one revenue
# estimate; no tax rate statement applies to a hotel tax.

[contest]
id = "ca-2026-11-03-eureka-measure-i"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:eureka"
kind = "measure"
title = "City of Eureka Measure I: Hotel Tax Increase"

[[source]]
id = "ballot-question"
kind = "official-title-summary"
publisher = "City of Eureka, City Council Resolution No. 2026-42, requesting consolidation of the November 3, 2026 general municipal election, adopted July 7, 2026: the ballot question, Section 1, page 1 (transcribed from the scan), as posted by the Humboldt County Office of Elections, Measure I - City of Eureka Tax Measure"
credit = "Resolution No. 2026-42, City of Eureka"
url = "https://humboldtgov.org/DocumentCenter/View/156833/Measure-I---City-of-Eureka-Tax-Measure"
file = "sources/resolution-2026-42-transcription.txt"
