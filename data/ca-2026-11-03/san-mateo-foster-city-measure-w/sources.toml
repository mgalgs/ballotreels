# Archived sources for San Mateo-Foster City School District Measure W,
# 2026-11-03 general election (sources/sources.md). Every id here may be
# cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# San Mateo County publishes each measure's documents separately, not as
# one pamphlet: the Board of Trustees' resolution (whose Exhibit A is the
# ballot question, with its tax rate statement at the end), the
# impartial analysis, and each argument and rebuttal, as its own PDF on
# the Assessor-County Clerk-Recorder & Elections page. The impartial
# analysis prints no author.
#
# Every PDF here is a scan, with no text layer or an OCR one. Each
# source's `file` is therefore a transcription of the pages the script
# quotes, made by reading the page images, beside the PDF it transcribes
# (sources/<name>.txt for sources/<name>.pdf); `url` is the PDF's. The
# check reads a non-PDF file as plain text.
#
# The Census calls the district "San Mateo-Foster City Elementary School
# District"; its division follows divisions.tsv.

[contest]
id = "ca-2026-11-03-san-mateo-foster-city-measure-w"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/school_district:san_mateo-foster_city_elementary_school_district"
kind = "measure"
title = "San Mateo-Foster City School District Measure W: School Facility Bonds"

[[source]]
id = "ballot-question"
kind = "official-title-summary"
publisher = "Board of Trustees of the San Mateo-Foster City School District, Resolution No. 06/25-26, Exhibit A (ballot measure), as posted by San Mateo County Assessor-County Clerk-Recorder & Elections"
credit = "Resolution No. 06/25-26"
url = "https://smcacre.gov/system/files/2026-08/52-ENG-M306-Contest%20Code-Reso-SMFCSD%20Bond_Redacted.pdf"
file = "sources/resolution-full-text.txt"
retrieved = "2026-10-28"

