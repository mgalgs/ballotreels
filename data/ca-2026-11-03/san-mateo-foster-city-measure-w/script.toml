# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and of whom; how a school bond is repaid and what it needs to
# pass; what the money would pay for; the district's tax statement; one
# line per side; what a vote does.
#
# San Mateo County posts the measure's documents one by one, so the card
# quotes the ballot question (Exhibit A), the resolution's heading and
# its Section 1 from Resolution No. 06/25-26, and names that resolution
# as its document. The resolution prints no yes or no lines, so the card
# has none; the vote lines take their meanings from the impartial
# analysis and highlight the resolution's own phrases, as Utah's do. The
# impartial analysis prints no author, so the script never names one.
# The bond total and the debt service are repaid from a tax on property
# in the district, and no archived source states the district's budget,
# so they have no budget scale (STANDARD.md 6.5; left open). The tax
# statement gives $29 per $100,000 as both its average and its highest
# rate.
#
# The opponents' $755 million, per-student and test-score figures are
# their own and stay in their argument (STANDARD.md 6.3); the argument
# against says "Measure M" as filed, which the script does not quote.

contest = "ca-2026-11-03-san-mateo-foster-city-measure-w"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "W"
title = "To improve elementary and middle school classrooms for skilled trades, science, technology, engineering, and math; replace leaky roofs, old windows, fire alarms and emergency communications systems; provide affordable housing to attract/retain quality teachers/staff; acquire, construct, repair facilities, equipment, sites; shall San Mateo-Foster City School District's measure be adopted, authorizing $498,000,000 in bonds at legal interest rates, levying $29 per $100,000 assessed value, averaging $35,000,000 annually while bonds are outstanding, with audits, independent oversight, and funds used locally?"
origin = "RESOLUTION OF THE BOARD OF TRUSTEES OF SAN MATEO-FOSTER CITY SCHOOL DISTRICT ORDERING AN ELECTION, AND ESTABLISHING SPECIFICATIONS OF THE ELECTION ORDER"
summary = "submit to the electors of the District the question of whether bonds of the District in the aggregate principal amount of $498,000,000 (the \"Bonds\") shall be issued and sold for the purpose of raising money for the projects described in Exhibits \"A\" and \"B\" hereto."

[[section]]
id = "what"
heading = "Measure W"

[[section.line]]
text = "San Mateo-Foster City School District Measure W asks the district's voters whether to approve $498 million in school bonds."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["authorizing $498,000,000 in bonds"]

[[section]]
id = "today"
heading = "How a school bond works"

[[section.line]]
text = "The district would borrow the money and repay it from a tax on property in the district."
sources = ["tax-statement"]

[section.line.visual]
kind = "illustration"
name = "bond-certificates"

[[section.line]]
text = "Measure W needs 55 percent of the vote to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "The money would go to listed projects, such as shop and science classrooms, roofs, windows, fire alarms, and housing for teachers and staff."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "school-workshop"

[[section]]
id = "fiscal"
heading = "What the tax statement says"

[[section.line]]
text = "The district's tax statement estimates a tax of $29 per $100,000 of assessed value, on average and at most, through 2054-2055."
