[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Measure W repairs 60-year-old schools and houses teachers who struggle with the high cost of living."
sources = ["argument-for"]
basis = ["to repair 60-year-old school facilities, including aging underground pipes that risk sewer backups and expensive failures, leaky roofs, old plumbing, restrooms, windows and doors.", "to help our schools recruit and retain great teachers, who struggle with the high cost of living in our area, by repurposing old administrative buildings for teacher and staff housing."]

