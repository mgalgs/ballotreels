# Archived sources for City of San Carlos Measure G, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1). San Mateo County's Assessor-County Clerk-Recorder &
# Elections (ACRE) posts each document of the measure separately, as the
# City of San Carlos filed it; no printed voter guide was archived.
#
# The City Attorney's Impartial Analysis of Measure G is the measure's
# neutral explanation, the kind a state's attorney general's explanatory
# statement is, and the one estimate of revenue beside the ballot
# question's. No tax rate statement applies (a general tax), and no
# fiscal analysis is among ACRE's files.
#
# The resolution's text layer breaks up its lines, and the impartial
# analysis and both arguments have none. Each source that `check` reads
# verbatim (the card's ballot question, each side's basis) is a
# transcription of its page, read from the page image, in a .txt beside
# the PDF; the url is the PDF's.

[contest]
id = "ca-2026-11-03-san-carlos-measure-g"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:san_carlos"
kind = "measure"
title = "City of San Carlos Measure G: One-Half Cent Sales Tax for 14 Years"

