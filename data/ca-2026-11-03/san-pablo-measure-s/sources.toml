# Archived sources for City of San Pablo Measure S, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The guide page is the Contra Costa County Elections Division's Voter
# Information Guide page for Measure S, which prints, in order, the final
# ballot question, the City Attorney's impartial analysis, the argument
# in favor and its rebuttal, and the argument against and its rebuttal.
# contracostavote.gov answers a bot challenge, so the page was archived
# from the Internet Archive's capture of 2026-10-09; each url is that
# capture, and the original is https://www.contracostavote.gov/m9011-en-2/.
#
# The guide page is the final official text and wins over the earlier
# Legistar files: the draft resolution and the draft and revised ballot
# questions (sources/*.docx) are superseded and not cited. The
# initiative ordinance's pages after its first are a scan with no text
# layer, so the measure's full text is not cited either; the City
# Attorney's impartial analysis explains what it does. The one other
# source is the City Attorney's ballot title and summary prepared for
# the petition (Elections Code section 9203), cited only for the vote
# the measure needs, which the guide page does not state.
#
# The City Attorney's impartial analysis is the measure's neutral
# explanation, the kind a state's attorney general's explanatory
# statement is. No tax rate statement applies; the cost estimate is the
# analysis's (and the ballot question's), from the City's Elections Code
# section 9212 report.

