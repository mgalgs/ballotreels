# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; how it reached the ballot and the
# vote it needs; the city's rules today; what would change (the rent
# rollback, the yearly cap, the eviction and relocation rules); the cost
# estimate; one line per side; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". The card and title carry it.
#
# The card quotes the final ballot question from the county's Voter
# Information Guide page (an Internet Archive capture), which prints no
# yes/no lines, so the card has no YES/NO boxes; the vote lines give the
# City Attorney's meanings and highlight the same phrase.
#
# The cost estimate ($1.08 million to $2.36 million a year) is the City
# Attorney's, from the City's section 9212 report, and the ballot
# question's. No archived official source states the city's budget, so it
# has no scale (STANDARD.md 6.5; left open, under [[question]]). The
# $12,000 relocation payment is an amount per household (exempt).
#
# Sides: each line's basis is quoted from its own argument. The
# opponents' "up to $2.36 million" is the official estimate, said once
# in the fiscal line rather than in their section. The rebuttal to the
# argument against disputes the opponents' cost point only as to who pays
# (fees, not the general fund), which the fiscal line already states. No
# signer is named.

contest = "ca-2026-11-03-san-pablo-measure-s"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "S"
title = "MEASURE S"
origin = "CITY OF SAN PABLO"
summary = "Shall the proposed ordinance, prohibiting residential real property rental rate increases for some rental units that exceed sixty percent of the Consumer Price Index increase or three percent, whichever is lower, establishing a process for consideration of additional rent increases, requiring City administration estimated to cost approximately $1,080,000 to $2,360,000 annually, funded by annual rental property owner fees, limiting the grounds for evicting tenants of some rental units, and enacting additional housing regulations, be adopted?"

[[section]]
id = "what"
heading = "Measure S"

[[section.line]]
text = "Measure S asks the voters of this city whether to adopt limits on rent increases and on the reasons for evicting tenants."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["prohibiting residential real property rental rate increases", "limiting the grounds for evicting tenants"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "petition"
text = "Measure S reached the ballot by a citizens' petition, and it needs a majority of the vote to pass."
sources = ["impartial-analysis", "title-summary"]

[section.line.visual]
kind = "illustration"
name = "neighborhood-petition"

[[section.line]]
id = "today-rules"
text = "Today, local rules do not limit rent increases beyond what state law does."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "older-apartments"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "rollback"
text = "For existing tenants, rents would roll back to what was charged on July 1, 2025."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "lease-keys"

[[section.line]]
id = "cap"
text = "After that, yearly increases would generally be held to 60 percent of the rise in consumer prices, and no more than 3 percent."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "apartment-building"

[[section.line]]
id = "evictions"
text = "Landlords would need a specific legal reason to end a tenancy, and relocation payments would generally be at least $12,000."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "door-notice"

[[section]]
id = "fiscal"
heading = "What it would cost"

[[section.line]]
id = "cost"
text = "The city attorney's analysis says running the program would cost between $1.08 million and $2.36 million a year, paid by fees on rental property owners."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["estimated to cost approximately $1,080,000 to $2,360,000 annually, funded by annual rental property owner fees"]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say that limiting rent increases and preventing evictions without a reason will reduce homelessness and help families stay in their homes."
sources = ["argument-for"]
basis = ["Measure S will reduce homelessness and displacement of families in San Pablo by limiting rent increases to an amount that is fair to both tenants and landlords and by preventing evictions without a reason."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Reduces homelessness", "Keeps families in their homes"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say Measure S creates a costly new regulatory program, and that it does not create new housing or increase the housing supply."
sources = ["argument-against"]
basis = ["Measure S creates a new, costly regulatory program.", "This measure does not create new housing; it does not increase San Pablo’s housing supply"]

[section.line.visual]
kind = "list"
source = "argument-against"
items = ["A costly new city program", "Builds no new housing"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote approves the new rules, which effectively replace the current tenant ordinances of the city."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["Shall the proposed ordinance"]

[[section.line]]
text = "A no vote leaves the current tenant ordinances of the city in place."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["Shall the proposed ordinance"]

[[question]]
ask = "How much could rent go up each year?"
lines = ["rollback", "cap"]

[[question]]
ask = "What does the city do about rents today?"
lines = ["today-rules"]

[[question]]
ask = "Who pays for the program?"
lines = ["cost"]

[[question]]
ask = "How large is the cost next to the city's budget?"
unanswered = true
