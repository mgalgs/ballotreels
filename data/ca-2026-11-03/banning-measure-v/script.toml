[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Measure V preserves the planned housing capacity of the city, and will help Sunset Crossroads move forward."
sources = ["arguments"]
basis = ["Yes on Measure V preserves Banning’s planned housing capacity while", "Passing Measure V will help allow Sunset Crossroads to move forward,"]

[section.line.visual]
kind = "list"
