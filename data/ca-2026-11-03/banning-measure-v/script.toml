# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks; how a council ordinance came to the ballot (a referendum
# petition); why the city rezoned this site (the state's no-net-loss
# rule, tied to Sunset Crossroads); what the ordinance would change (the
# site's zoning, the density, the homes it makes room for); no cost
# estimate; one line per side; what a vote does.
#
# The guide prints no fiscal analysis, and the ordinance itself was not
# archived; the City Attorney's Impartial Analysis is the neutral
# explanation, and it is the analysis that ties this site to the Sunset
# Crossroads project. The card is the sample ballot's question, which
# has no short title and no yes/no lines: the card's title is the
# ballot's own header for the city's block, and the vote lines take
# their words from the Impartial Analysis.
#
# Sides come from the argument in favor and the argument against, not
# the rebuttals.

contest = "ca-2026-11-03-banning-measure-v"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot"
number = "V"
title = "CITY OF BANNING"
origin = "SAMPLE BALLOT"
summary = "Shall Ordinance No. 1619, which amends the land uses for property south of West Westward Avenue and east of Sunset Avenue to allow Very High Density Residential use on 41 acres of the 49.2-acre site, be adopted?"

[[section]]
id = "what"
heading = "Measure V"

[[section.line]]
text = "City of Banning Measure V asks voters in the city whether to rezone 41 acres for very high density housing."
sources = ["ballot", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot"
highlight = ["Very High Density Residential use on 41 acres"]

[[section]]
id = "background"
heading = "Sunset Crossroads and housing"

[[section.line]]
text = "State law requires the city to rezone other land when it approves the Sunset Crossroads project, so the city keeps its room for new homes."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "home-building"

[[section]]
id = "today"
heading = "How it reached the ballot"

[[section.line]]
text = "The City Council adopted this rezoning in April 2026."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "ballot-box"

[[section.line]]
text = "Voters then signed a referendum petition, so the rezoning takes effect only if voters approve it."
sources = ["impartial-analysis"]

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "The site is zoned for a school today, and would be zoned for 24 to 30 homes per acre."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "project-site"

[[section.line]]
text = "That would make room for at least 1,146 homes."
sources = ["impartial-analysis"]

[[section]]
id = "fiscal"
