# Archived sources for City of Inglewood Measure AT, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The Los Angeles County Registrar-Recorder/County Clerk's list "Measures
# Appearing on the Ballot" is the authority for the letter and the ballot
# question, quoted on the card; its "Supporters: None submitted." is the
# official statement that no argument in favor was filed (`measure-list`).
# The argument against is the Registrar's own copy from its Interactive
# Sample Ballot. The City Clerk's draft ordinance (by which the City
# Council could have adopted the initiative itself) is cited only for its
# recitals: that this is a citizens' initiative whose petition was
# certified. Its Exhibit A, the initiative's text, is not attached.
#
# Not found: the initiative's full text, an impartial analysis, the
# resolution placing the measure on the ballot, and any fiscal analysis.

