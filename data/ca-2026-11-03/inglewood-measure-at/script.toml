# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; how it reached the ballot and the
# cap the tax has today; what would change (the tiered rates, the cap,
# the vote it needs); what the ballot question says about revenue; both
# sides; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". The card and title carry it.
#
# What was not found: the initiative's full text, an impartial analysis,
# the resolution placing the measure on the ballot, and any fiscal
# analysis. So every neutral line says only what the ballot question
# says, and the City Clerk's draft ordinance is cited only for the
# initiative's certified petition. The script does not say today's rate,
# the cap's amount, which venues pay which tier, or how much money is
# involved: no archived source does (left open, under [[question]]).
#
# The card quotes the Los Angeles County Registrar-Recorder/County
# Clerk's list "Measures Appearing on the Ballot": the City's heading,
# the vote needed and the ballot question, which has no yes or no
# sentences, so the card has no boxes. The vote lines take their meaning
# from the question, and both highlight the same phrase.
#
# The argument against is the Registrar's printed copy. The no side
# takes its central claims: higher taxes could drive events and revenue
# away, risking jobs and services, and the real problem is city
# spending (the argument's "City Hall's wasteful spending", said
# without the proper name or the judgment word). Its figures (economic activity, jobs and tax revenue from a
# run of concerts) and its claim about the mayor are that side's alone
# and are not narrated. The list says "Supporters: None submitted.", so
# the yes side says plainly that no argument in favor was submitted,
# citing the list (filed = false). No venue is named.

contest = "ca-2026-11-03-inglewood-measure-at"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "AT"
title = "CITY OF INGLEWOOD"
origin = "VOTE PASSAGE – Majority Vote 50%+1"
summary = "Ordinance To Amend the Admissions Tax for Large Venues. Shall the ordinance amending the City's admissions tax on large venues to establish tiered rates of 10% and 2.5% based on venue seating capacity, and to remove the existing annual cap on admissions tax revenue, resulting in increased general fund revenues, be approved?"

[[section]]
id = "what"
heading = "Measure AT"

[[section.line]]
text = "Measure AT asks the voters of this city whether to change the tax on admission to large venues."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["amending the City's admissions tax on large venues"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "initiative"
text = "Measure AT is a citizens' initiative, on the ballot after its petition was certified."
sources = ["ordinance", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "neighborhood-petition"

[[section.line]]
id = "cap"
text = "Today, the admissions tax has an annual cap on the revenue it brings in."
sources = ["ballot-question"]

[section.line.visual]
kind = "illustration"
name = "event-tickets"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "rates"
text = "Measure AT would set tiered tax rates of 10 percent and 2.5 percent, based on how many seats a venue has."
sources = ["ballot-question"]

[section.line.visual]
kind = "illustration"
name = "large-arena-exterior"

[[section.line]]
text = "Measure AT would also remove the annual cap on admissions tax revenue."
sources = ["ballot-question"]

[[section.line]]
text = "Measure AT needs a majority yes vote to pass."
sources = ["ballot-question"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "fiscal"
heading = "What the ballot question says"

[[section.line]]
id = "revenue"
text = "The ballot question says the measure would increase general fund revenues, but gives no amount."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["resulting in increased general fund revenues"]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"
filed = false

[[section.line]]
text = "The official county list of measures, which names who filed each argument, says no argument in favor of Measure AT was submitted."
sources = ["measure-list"]

[section.line.visual]
kind = "list"
source = "measure-list"
items = ["No argument for was submitted"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say higher taxes could drive events and revenue away, risking jobs and services, and that the real problem is city spending."
sources = ["argument-against"]
basis = ["But higher taxes could DRAMATICALLY REDUCE City revenue.", "It's true that the stadiums aren't going anywhere. But the events can.", "DON'T PUT INGLEWOOD JOBS AND CITY SERVICES AT RISK", "The real problem is City Hall's wasteful spending."]

[section.line.visual]
kind = "list"
source = "argument-against"
items = ["Events and revenue could leave", "The problem is city spending"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote approves the ordinance changing the admissions tax on large venues."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["amending the City's admissions tax on large venues"]

[[section.line]]
