# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; how it reached the ballot (a
# citizens' petition); the funding the school district gets from the city
# today; what would change (the rate, who is exempt, where the money
# goes, oversight and how long it lasts); the revenue estimate; one line
# per side; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city", and the school district is "the
# school district". "City's" sounds like "cities"
# (standard/speakability.txt), so the narration says "the city".
#
# The card quotes the measure's entry in the county's list "Measures
# Appearing on the Ballot", which prints no yes/no meanings, so the card
# has no boxes; the vote lines take both meanings from the question and
# highlight the same phrase.
#
# The City Attorney's impartial analysis, printed in the Registrar's
# sample ballot, is the main source for what the measure does, and the
# fiscal line takes the $12 million a year from it. No archived official
# document gives the City's or the school district's budget to scale it
# (STANDARD.md 6.5; left open, under [[question]]); the $525 million
# City budget in the argument against is that side's figure, not an
# official total, so it is not used.
#
# Sides: each from its filed argument. Supporters: the measure replaces
# expiring City funding with a permanent source, and prevents the loss
# of up to 73 teachers. Opponents: schools get no more money, because the
# tax shifts the City's payment to residents. The rebuttals repeat these
# points; one line per side leaves no room for them.

contest = "ca-2026-11-03-santa-monica-measure-es"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "ES"
title = "CITY OF SANTA MONICA"
origin = "VOTE PASSAGE – Majority Vote 50%+1"
summary = "MEASURE ES: Shall a measure imposing a City of Santa Monica collected parcel tax of $495 per taxable parcel, adjusted annually for inflation, exempting qualifying seniors, affordable housing, non-profits, religious organizations, and schools, providing continual funding for Santa Monica's public schools, including retaining teachers, assisting disadvantaged students, supporting art, music, science, math, and early childhood education, keeping school facilities clean and safe for student and community use, generating an estimated $12,000,000 annually until repealed by voters, with oversight requirements, be adopted?"

[[section]]
id = "what"
heading = "Measure ES"

[[section.line]]
text = "Measure ES asks the voters of this city whether to tax each parcel of property every year to fund the local public schools."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["parcel tax of $495 per taxable parcel"]

[[section]]
id = "background"
heading = "How it got here"

[[section.line]]
text = "Measure ES is a citizens' initiative: the county verified enough petition signatures to place it on the ballot."
sources = ["resolution"]

[section.line.visual]
kind = "illustration"
name = "neighborhood-petition"

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "today-funding"
text = "The measure's text says the city now funds the school district partly through an agreement that expires on June 30, 2027."
sources = ["full-text", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "school-classroom"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "rate"
text = "Each parcel would be taxed $495 a year, rising each year with inflation."
sources = ["impartial-analysis", "full-text", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "city-parcels"

[[section.line]]
id = "exempt"
text = "Owners 65 or older living on their parcel, nonprofits, affordable housing, religious groups and schools could be exempt."
sources = ["impartial-analysis", "full-text"]

[[section.line]]
id = "uses"
text = "All the money would go to the school district, though not for administrator salaries, land or new buildings."
sources = ["impartial-analysis", "full-text"]

[section.line.visual]
kind = "illustration"
name = "school-roof-repair"

[[section.line]]
id = "end"
text = "The tax would last until voters repeal it, with an independent audit of the spending each year."
sources = ["impartial-analysis", "full-text", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "recurring-review"

[[section]]
id = "fiscal"
heading = "What it would raise"

[[section.line]]
id = "revenue"
text = "The impartial analysis estimates the tax would raise $12 million a year for the schools."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "special-tax"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say the tax replaces uncertain city funding with a permanent local source, preventing the loss of up to 73 teachers."
sources = ["argument-for"]
basis = ["Measure ES replaces uncertain City funding, scheduled to expire next year, with a permanent and stable local funding source that will protect educational excellence for future generations.", "Prevent the loss of up to 73 teachers"]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Permanent, stable school funding", "Keeps up to 73 teachers"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say schools get no more money, the city does, because the tax shifts payment from the city to residents, forever."
sources = ["argument-against"]
basis = ["Schools don't get more money out of this, the City does.", "This measure shifts payment from the City to the people of Santa Monica - forever."]

[section.line.visual]
kind = "list"
source = "argument-against"
items = ["Schools get no more money", "Shifts payment to residents forever"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote adopts the $495 parcel tax for the public schools."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["parcel tax of $495 per taxable parcel"]

[[section.line]]
text = "A no vote rejects the $495 parcel tax for the public schools."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["parcel tax of $495 per taxable parcel"]

[[question]]
ask = "Who would have to pay, and who would not?"
lines = ["rate", "exempt"]

[[question]]
ask = "What could the schools spend the money on?"
lines = ["uses"]

[[question]]
ask = "How long would the tax last?"
lines = ["end"]

[[question]]
ask = "How big is $12 million a year next to the city or school district budget?"
unanswered = true
