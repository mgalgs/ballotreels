# Archived sources for City of Santa Monica Measure ES, 2026-11-03 general
# election (sources/la-sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The Los Angeles County Registrar-Recorder/County Clerk's list "Measures
# Appearing on the Ballot" (sources/county-measure-list-excerpt.txt, the
# measure's entry) gives its letter, vote threshold and ballot question,
# and, on its "Supporters: ... Opponents: ..." line, who filed the
# primary arguments: the card quotes it, and the sides cite it as the
# official statement of filing. The City Council's resolution submitting
# the measure gives how it reached the ballot; the initiative's text,
# Exhibit 1 to it, gives what it does. That text is a scan with no text
# layer: the pages cited were typed into
# sources/full-text-transcription.txt, from which the script's facts are
# quoted. No impartial analysis and no argument text could be fetched
# (the City's site blocked downloads), and no fiscal statement applies;
# the revenue estimate is the ballot question's own.

[contest]
id = "ca-2026-11-03-santa-monica-measure-es"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:santa_monica"
kind = "measure"
title = "City of Santa Monica Measure ES: A $495 Parcel Tax for Public Schools"

