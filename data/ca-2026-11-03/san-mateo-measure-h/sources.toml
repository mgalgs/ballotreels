# Archived sources for City of San Mateo Measure H, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1). Each document is the copy the San Mateo
# County Assessor-County Clerk-Recorder & Elections (ACRE) posts on its
# election page; the county publishes each measure's documents
# separately, not as one pamphlet.
#
# Every PDF here is a scan with no text layer, so each cited one has a
# typed transcription beside it (sources/*.txt, its first lines saying
# which pages it copies), and `file` names the transcription, which the
# verbatim checks read as plain text; `url` is the PDF's.
#
# The ballot question is printed only in the Council's resolution (its
# Section 3), so the resolution backs two sources: the ballot label the
# card quotes, and the full text. ACRE posts no tax rate statement or
# fiscal analysis for this measure; the one revenue estimate is the
# resolution's and the City Attorney's. The rebuttals are archived and
# not cited.

[contest]
id = "ca-2026-11-03-san-mateo-measure-h"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:san_mateo"
kind = "measure"
title = "City of San Mateo Measure H: Quarter-Cent Sales Tax for City Services"

[[source]]
id = "ballot-label"
kind = "official-title-summary"
publisher = "City of San Mateo, Resolution No. 84 (2026), Section 3: the ballot question, filed with the San Mateo County Chief Elections Officer"
credit = "City of San Mateo Resolution No. 84 (2026)"
url = "https://smcacre.gov/system/files/2026-07/52-ENG-M301-Contest%20Code-Reso-San%20Mateo%20Transactions%20and%20Use%20Tax_Redacted.pdf"
file = "sources/resolution-full-text.txt"
