# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks; the sales tax today and who put the measure on the ballot; what
# would change (the rate, any city purpose); the impartial analysis's
# revenue estimate; one line per side; what a vote does.
#
# ACRE posts no tax rate statement or fiscal analysis (not a bond); the
# one revenue estimate is the City Attorney's (and the resolution's). No
# archived source states the city's general fund budget, so the $7
# million has no scale (STANDARD.md 6.5; left open). The figures in the
# arguments (a $16.8 million deficit, a $356 million budget) are the
# sides' own, so they are not used as a scale.
#
# The card quotes the Council's resolution, where the ballot question is
# printed; its origin is the resolution's adoption line. The resolution
# prints no yes/no statements, so the vote lines take the impartial
# analysis's "approves" and "rejects" and highlight the ballot question.
# The grocery exemption and the audits are left to the supporters, and
# the deficit to both sides, as each argument cites them (rule 6.3).

contest = "ca-2026-11-03-san-mateo-measure-h"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-label"
number = "H"
title = "SUBMITTING TO THE VOTERS A MEASURE TO INCREASE THE GENERAL TRANSACTIONS AND USE (SALES) TAX RATE BY AN ADDITIONAL ONE-QUARTER PERCENT (0.25%) UNTIL ENDED BY VOTERS"
origin = "RESOLUTION NO. 84 (2026) adopted by the City Council of the City of San Mateo, California, at a regular meeting held on July 20, 2026"
summary = "To provide funding for San Mateo city services, such as keeping local streets, sidewalks, parks, infrastructure, and community facilities safe, clean, and well-maintained, fixing potholes, providing fire protection, paramedic, crime prevention, and 9-1-1 emergency response, and improvements to traffic safety/traffic management, shall the City of San Mateo's ordinance establishing a one-quarter cent sales tax be adopted, providing 7 million dollars annually for general government use until ended by voters, with independent audits and all funds locally-controlled?"

[[section]]
id = "what"
heading = "Measure H"

[[section.line]]
text = "City of San Mateo Measure H asks voters in the city whether to add a quarter-cent sales tax."
sources = ["ballot-label"]

[section.line.visual]
kind = "page"
source = "ballot-label"
highlight = ["establishing a one-quarter cent sales tax"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Today, the city already charges a quarter-cent sales tax, set to expire in 2048."
sources = ["text"]

[section.line.visual]
kind = "illustration"
name = "city-storefronts"

[[section.line]]
text = "The City Council placed Measure H on the ballot, and it needs a simple majority to pass."
