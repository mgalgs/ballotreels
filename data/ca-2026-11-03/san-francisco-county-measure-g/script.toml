# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks; what the park replaced; the rule today; what would change, and
# the permits it needs; the Controller's Statement's costs, each with its
# scale, and the saving it also names (STANDARD.md 6.4); one line per
# side; what a vote does.
#
# The ballot and pamphlet call it "Proposition G", so the narration does;
# the directory keeps the project's measure name. The Controller's
# Statement on G names no budget total: the scale divides its figures by
# the "approximately $7 billion General Fund sources" the Controller's
# Statement on Proposition I gives (general-fund), each under 1 percent.
# The statement is headed "Controller's Statement" and signed by the
# Deputy City Controller; the narration names the statement, not the
# signer. "a.m." and "p.m." are read letter by letter
# (standard/speakability.txt), so the hours are said in words.

contest = "ca-2026-11-03-san-francisco-county-measure-g"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "digest"
number = "G"
title = "Allowing Private Vehicles on the Upper Great Highway in Sunset Dunes Park"
origin = "On July 23, 2026, the Department of Elections certified that the initiative petition calling for Proposition G to be placed on the ballot had a sufficient number of valid signatures to qualify the measure for the ballot."
summary = "Shall the City close Sunset Dunes Park from Monday at 4:00 a.m. through Friday at 6:00 p.m., unless a holiday falls on a weekday, in order to reopen the roadway known as the Upper Great Highway to private vehicles during that time?"
yes = "If you vote “yes,” you want to close Sunset Dunes Park from Monday at 4:00 a.m. through Friday at 6:00 p.m., unless a holiday falls on a weekday, in order to reopen the roadway known as the Upper Great Highway to private vehicles during that time."
no = "If you vote “no,” you do not want the City to make these changes."

