# Archived sources for City of Sunnyvale Measure I, 2026-11-03 general
# election. Every id here may be cited by script.toml.
#
# The Santa Clara County Registrar of Voters' List of Local Measures
# (sources/rov-measure-list-2026-10-29.html) is the authority for the
# measure's letter, its ballot question, verbatim, and its threshold
# ("Majority Vote Required"). The Registrar's posted copies of the City
# Attorney's impartial analysis and the filed arguments (sources/rov-*.pdf,
# described in sources/rov-sources.md) are scans with no text layer: each
# was typed from its page images into sources/rov-*-transcription.txt,
# which these sources point at for the verbatim checks; each url is the
# Registrar's PDF. The local copy of the proponents' rebuttal was saved
# under a truncated download name that matched the in-favor rebuttal's; the
# Registrar's own file is correctly named
# "...rebuttal-to-primary-argument-against_redacted_0.pdf", and its form
# ticks "Rebuttal to Argument Against".
#
# Earlier research archived only the city's draft resolution (June 11,
# 2026) and the council's draft argument; the Registrar's question,
# analysis and filed arguments supersede them, and the script needs
# neither, so they are not listed. Both rebuttals are archived beside the
# arguments; the script quotes neither, so they are not listed.

[contest]
id = "ca-2026-11-03-sunnyvale-measure-i"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:sunnyvale"
kind = "measure"
title = "City of Sunnyvale Measure I: Charter Amendment on Filling City Council Vacancies"

