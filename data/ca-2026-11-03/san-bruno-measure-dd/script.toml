# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks; the 2005 ordinance that allows safe and sane fireworks today, and
# who put the measure on the ballot; what would change (the ban); that no
# cost estimate is published; one line per side; what a vote does.
#
# The measure is not a tax. ACRE posts no fiscal analysis, and neither
# the resolution nor the impartial analysis gives a cost or revenue
# estimate, so the fiscal line says none is published.
#
# The card quotes the Council's resolution, where the ballot question is
# printed; its title is the resolution's heading, cut after the subject,
# and its origin is the clerk's adoption line. The ballot question is
# printed beside empty "Yes" and "No" boxes, with no yes/no statements,
# so the card has none; the vote lines take the impartial analysis's own
# meaning of each vote ("a vote to prohibit", "a vote to continue the
# limited sale, use and discharge") and highlight the same phrase of the
# ballot question.
#
# Rule 6.3: the resolution's recitals (the 2025 fire hazard maps, San
# Bruno and Pacifica the only cities in the county that allow these
# fireworks) are the supporters' points too, so they are left to the yes
# side or out; the nonprofits' fundraising is the opponents'. The
# supporters' fire counts and $200,000 figure are left out as dollar and
# number claims that need context; neither side's line uses a figure.

contest = "ca-2026-11-03-san-bruno-measure-dd"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-label"
number = "DD"
title = "A MEASURE THAT PROPOSES ADOPTION OF AN ORDINANCE TO PROHIBIT THE SALE, USE, OR DISCHARGE OF SAFE AND SANE FIREWORKS"
origin = "Resolution No. 2026 - 077 was introduced and adopted by the San Bruno City Council at a regular meeting on July 28, 2026"
summary = "Shall the City of San Bruno Safe and Sane Fireworks Ordinance be repealed to prohibit the sale, use, and discharge of safe and sane fireworks in the City of San Bruno?"

[[section]]
id = "what"
heading = "Measure DD"

[[section.line]]
text = "City of San Bruno Measure DD asks voters in the city whether to ban safe and sane fireworks."
sources = ["ballot-label"]

[section.line.visual]
