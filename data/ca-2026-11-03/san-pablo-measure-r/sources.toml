# Archived sources for City of San Pablo Measure R, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# Contra Costa County Elections' page for Measure R
# (sources/county-page.txt, read in a browser, since contracostavote.gov
# answers scripted fetches with a bot challenge) prints the ballot
# question, the City Attorney's impartial analysis, the argument in
# favor, the argument against, the rebuttal to the argument in favor,
# and the county's statement that no rebuttal to the argument against
# was filed. The City Attorney's impartial analysis is the measure's
# neutral explanation, the kind a state's attorney general's explanatory
# statement is.
#
# The City's own files are from its Legistar agenda system, for the City
# Council meeting of July 13, 2026, matter 26-379 (www.sanpabloca.gov
# answered HTTP 403).
#
# The placing document is the resolution submitting the tax to the
# voters (Attachment 1 to matter 26-379), whose Section 1 sets the ballot
# question. The archived copy is the agenda draft, a Word file with its
# number, date and vote left blank; the City's Legistar records the
# resolution as RES 2026-121 (matter), adopted with the attached ordinance
# at the July 13, 2026 meeting with no amendment recorded (adoption). The
# county's page prints the same ballot question word for word, so the
# draft's question, which the card quotes, is the one on the ballot. The
# Word files' text is copied into sources/*.txt, unchanged but for line
# breaks (the ballot question's table set as paragraphs), and each source
# points at the copy, its url at the Word file. The full text is Exhibit
# A, the transactions and use tax ordinance submitted to the voters.
#
# The resolution's and the ordinance's recitals are cited only for plain
# facts (the rates and their periods, when the tax would start, that it
# is a general tax); the ordinance's reasons for the tax are not used.

