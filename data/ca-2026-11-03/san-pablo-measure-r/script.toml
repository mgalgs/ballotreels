# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; how it reached the ballot and the
# vote it needs; what would change (the two rates and their periods, when
# it would start, a general tax, the audit and committee the ordinance
# sets); the revenue as the ballot question gives it; both sides, neither
# of which has an archived argument; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". The card and title carry the
# name, as for this city's Measure S. No person is named, and the
# Council's vote count is not stated.
#
# No impartial analysis was archived: every neutral line rests on the
# tax ordinance's own text and on the resolution placing it, and only on
# what they enact or record, never on the ordinance's reasons for the tax
# (its recitals on the Council's workplan and on sustaining services),
# which are the City's case. The card quotes the ballot question from
# Section 1 of the resolution, which prints only blank Yes and No lines,
# so the card has no YES/NO boxes and both vote lines highlight the same
# phrase. The ballot question's list of services is on the card, not
# narrated.
#
# The start date: the resolution says it depends on whether a state bill
# (SB 762) takes effect, and gives the three possible dates; no archived
# source says whether the bill became law, so the script names none of
# them as the one and does not name the bill.
#
# The $2 million and $1 million a year are the ballot question's
# figures. No archived source states the City's general fund budget, so
# they have no scale (STANDARD.md 6.5; left open, under [[question]]).
#
# No argument for or against Measure R was archived, and no document
# says whether any was filed. So the sides do not say none was filed:
# each says none is among the documents gathered (filed = false,
# STANDARD.md 2.5), as for Walnut Creek Measure U.

contest = "ca-2026-11-03-san-pablo-measure-r"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "R"
title = "A PROPOSED GENERAL TRANSACTIONS AND USE TAX"
origin = "CITY OF SAN PABLO"
summary = "To provide funding to maintain City services, including crime prevention, police protection, reducing illegal dumping, the City’s daily senior meal program, youth scholarship programs, assisting the homeless, street maintenance, and other general services, shall San Pablo enact a temporary ½-cent sales tax for 5 years, generating approximately $2,000,000 annually, then reduced to ¼-cent for 5 years, generating approximately $1,000,000 annually, then terminate; with all funds staying in San Pablo, citizen oversight, and mandated annual audits?"

