# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; how it reached the ballot and the
# vote it needs; what would change (the two rates and their periods, when
# it would start, a general tax, the audit and committee the ordinance
# sets); the revenue as the ballot question gives it; both sides, from
# the arguments printed on the county's page; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". The card and title carry the
# name, as for this city's Measure S. No person is named, and the
# Council's vote count is not stated.
#
# The neutral lines rest on the tax ordinance's own text, on the
# resolution placing it and on the City Attorney's impartial analysis
# printed on the county's page, and only on what they enact or state,
# never on the ordinance's reasons for the tax (its recitals on the
# Council's workplan and on sustaining services), which are the City's
# case. The card quotes the ballot question from Section 1 of the agenda
# draft of the resolution; the county prints the same question word for
# word, so it is the question on the ballot. The resolution prints only
# blank Yes and No lines,
# so the card has no YES/NO boxes and both vote lines highlight the same
# phrase. The ballot question's list of services is on the card, not
# narrated.
#
# The start date: the resolution says it depends on whether a state bill
# (SB 762) takes effect, and gives the three possible dates; no archived
# source says whether the bill became law, so the script names none of
# them as the one and does not name the bill. The impartial analysis
# lists the total rate "immediately after Measure R's approval", then in
# October 2027, October 2032 and 2037; it gives no start date, and its
# 2037 end agrees with the line's ten years from 2027, so the line stands.
#
# The $2 million and $1 million a year are the ballot question's
# figures, and the impartial analysis gives the same as the City's
# estimate. No neutral archived source states the City's general fund
# budget, so they have no scale (STANDARD.md 6.5; left open, under
# [[question]]).
#
# The sides come from the argument in favor and the argument against on
# the county's page, not from the rebuttal, each line on what its
# argument leads with and comes back to (for: a temporary tax to keep
# services as casino revenue declines; against: a ballot question that
# lists popular services, for a tax that guarantees none of them). No
# signer is named.

contest = "ca-2026-11-03-san-pablo-measure-r"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "R"
title = "A PROPOSED GENERAL TRANSACTIONS AND USE TAX"
origin = "CITY OF SAN PABLO"
summary = "To provide funding to maintain City services, including crime prevention, police protection, reducing illegal dumping, the City’s daily senior meal program, youth scholarship programs, assisting the homeless, street maintenance, and other general services, shall San Pablo enact a temporary ½-cent sales tax for 5 years, generating approximately $2,000,000 annually, then reduced to ¼-cent for 5 years, generating approximately $1,000,000 annually, then terminate; with all funds staying in San Pablo, citizen oversight, and mandated annual audits?"

[[section]]
id = "what"
heading = "Measure R"

[[section.line]]
text = "Measure R asks the voters of this city whether to add a sales tax of one-half percent for 5 years, then one-quarter percent for 5 years, after which it ends."
sources = ["ballot-question", "text"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["a temporary ½-cent sales tax for 5 years", "then reduced to ¼-cent for 5 years", "then terminate"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "placed"
text = "The city council placed Measure R on the ballot on July 13, 2026."
sources = ["adoption", "matter"]

[section.line.visual]
kind = "illustration"
name = "city-council-chamber"

[[section.line]]
id = "threshold"
text = "Measure R needs a simple majority to pass."
sources = ["resolution", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "ballot-box"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "start"
text = "The tax would start in 2027, on April 1, July 1 or October 1, depending on a state bill, and end 10 years later."
sources = ["resolution", "text"]

[section.line.visual]
kind = "illustration"
name = "end-date"

[[section.line]]
id = "uses"
text = "It is a general tax on retail sales in the city."
sources = ["resolution", "text", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "sales-receipt"

[[section.line]]
id = "oversight"
text = "Each year, independent auditors for the city would review the tax money, and a committee of at least five residents or local business representatives would review and report on its use."
sources = ["text", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section]]
id = "fiscal"
heading = "What it would raise"

[[section.line]]
id = "revenue"
text = "The ballot question says the tax would raise about $2 million a year at first, then about $1 million a year."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["generating approximately $2,000,000 annually", "generating approximately $1,000,000 annually"]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say the temporary tax keeps essential services in place while casino revenue, which pays for most of the general fund of the city, is declining."
sources = ["argument-for"]
basis = ["A Yes vote will help keep important services in place", "Casino revenue is declining. It funds 59% of the City’s general fund and has fallen $3.3 million short since 2023.", "The tax is temporary and shifts down, over time."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Keeps essential city services in place", "Casino revenue is falling short"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say the ballot question lists popular services to win votes, but the money goes to the general fund, with no guarantee of what is funded."
sources = ["argument-against"]
basis = ["Measure R’s ballot question lists budget line-items chosen to get more votes", "Measure R does not guarantee what will be funded, as the question-wording implies.", "The tax feeds the general fund spent on employee benefits and pensions"]

[section.line.visual]
kind = "list"
source = "argument-against"
items = ["Question lists services to win votes", "No guarantee of what is funded"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote adds the temporary sales tax for 10 years."
sources = ["ballot-question", "text"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["a temporary ½-cent sales tax for 5 years"]

[[section.line]]
text = "A no vote does not add the tax."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["a temporary ½-cent sales tax for 5 years"]

[[question]]
ask = "Who put this on the ballot?"
lines = ["placed"]

[[question]]
ask = "When would the tax start and end?"
lines = ["start"]

[[question]]
ask = "What could the money be spent on?"
lines = ["uses"]

[[question]]
ask = "Who would check how the money is spent?"
lines = ["oversight"]

[[question]]
ask = "How big are these amounts next to the city budget?"
unanswered = true
