# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and of whom; how a college bond is repaid and what it needs to
# pass; what the money would pay for; the district's tax statement; one
# line per side; what a vote does.
#
# The full text reprints the ballot question under its title line, so the
# card quotes that line as its title and the question as its summary; the
# origin and the yes and no lines are the Impartial Analysis's. The bond
# total and the debt service are repaid from a tax on property in the
# district, and no archived source states the district's budget, so they
# have no budget scale (STANDARD.md 6.5; left open). The tax statement
# gives one rate, $25, as both its average and its highest. "Counsel" is
# heard as "Council" (standard/speakability.txt).
#
# No argument against Measure Y was filed for the Riverside County guide,
# the one archived here; the no side says so, naming that guide, since
# San Bernardino County prints its own. Its section is marked
# filed = false.

contest = "ca-2026-11-03-san-bernardino-ccd-measure-y-riverside"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-label"
number = "Y"
title = "Local College Affordability, Job Training, Repairs Measure."
origin = "This Measure was placed on the ballot by a resolution adopted by the Board of Trustees of the San Bernardino Community College District (District)."
summary = "To maintain affordable college education access, by repairing /upgrading San Bernardino Valley College, Crafton Hills College; preparing students/ veterans for high-demand careers including skilled trades, firefighting, healthcare; providing safe drinking water; removing asbestos, mold; repairing deteriorating gas lines; acquiring, constructing, repairing facilities, sites, equipment; shall San Bernardino Community College District’s measure authorizing $898,000,000 in bonds at legal rates, levying $25 per $100,000 of assessed valuation ($56,000,000 annually) while bonds are outstanding, requiring oversight, audits, be adopted?"
yes = "A “yes” vote by at least ﬁfty-ﬁve percent of the voters voting on this Measure will authorize the District to issue bonds in the amount of $898,000,000 to be used solely for the purposes set forth in this ballot Measure."
no = "A “no” vote means that the District will not be authorized to issue and sell the $898,000,000 in bonds set forth in the Measure."

[[section]]
id = "what"
heading = "Measure Y"

[[section.line]]
text = "San Bernardino Community College District Measure Y asks the district's voters whether to approve $898 million in college bonds."
sources = ["ballot-label"]

[section.line.visual]
