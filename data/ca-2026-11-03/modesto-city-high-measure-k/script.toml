# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and of whom; how a school bond is repaid and what it needs to
# pass; that it extends an earlier bond's tax; what the money would pay
# for and what it may not; the district's tax statement; one line per
# side; what a vote does.
#
# The guide does not print the ballot question, so the card quotes the
# Registrar's Notice of Election: its title is the question's own head,
# its origin the notice's heading. The notice prints no yes and no
# sentences, so the card has no boxes, and the vote lines take their
# meaning from the ballot question, as Escalon U's do. "Counsel" is
# heard as "Council" (standard/speakability.txt), so the narration does
# not say it.
#
# That the bonds extend the current tax rate is the ballot question's
# and the tax statement's own wording; that the rate would be lower, and
# the $22 a year it would save, are the supporters' claims, so they stay
# in their section (STANDARD.md 6.3). The fiscal line gives the
# statement's average and its highest rate, both, with the year the
# highest first applies. The bond total and the debt service are repaid
# from a tax on property in the district, and no archived source states
# the district's budget, so they have no budget scale (STANDARD.md 6.5;
# left open).
#
# No argument against Measure K was filed: the guide prints "None
# filed". The no side says so plainly; its section is marked
# filed = false.

contest = "ca-2026-11-03-modesto-city-high-measure-k"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "K"
title = "High School Career Training/ Classroom Repair Extension Measure."
origin = "Modesto City Schools District - Measure K"
summary = "To upgrade classrooms/ labs for quality math, science, writing instruction; update career training facilities preparing students for the workforce; and repair deteriorating roofs, plumbing, heating/ cooling systems, shall Modesto City High School District’s measure be adopted authorizing $250,000,000 in bonds at legal rates, extending the current tax rate of $24 per $100,000 assessed value (no increase), providing approximately $14,000,000 annually while bonds are outstanding, with independent oversight/ all funds locally controlled?"

[[section]]
id = "what"
heading = "Measure K"

[[section.line]]
text = "Modesto City High School District Measure K asks the district's voters whether to approve $250 million in school bonds."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["authorizing $250,000,000 in bonds"]

[[section]]
id = "today"
heading = "How a school bond works"

[[section.line]]
text = "The district would borrow the money and repay it from a tax on property in the district."
sources = ["impartial-analysis", "tax-statement"]

[section.line.visual]
kind = "illustration"
name = "bond-certificates"

[[section.line]]
id = "extension"
text = "The bonds would extend an earlier bond's tax, with the rate not projected to rise above today's rate."
sources = ["tax-statement", "ballot-question"]

[[section.line]]
text = "Measure K needs 55 percent of the vote to pass."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "The money would upgrade classrooms, labs and career training facilities, and repair roofs, plumbing, and heating and cooling."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "school-workshop"

[[section.line]]
text = "Bond money could not pay teacher or administrator salaries, and a citizens' oversight committee would review spending."
sources = ["impartial-analysis"]

[[section]]
id = "fiscal"
heading = "What the tax statement says"

[[section.line]]
id = "rate"
text = "The district's tax statement estimates an average tax of $24 per $100,000 of assessed value, and at most $29."
sources = ["tax-statement"]

[section.line.visual]
kind = "bars"
title = "Estimated tax per $100,000 of assessed value"
source = "tax-statement"
unit = ""
labels = ["Average", "Highest"]
values = [24, 29]

[[section.line]]
text = "The statement puts the total to repay, with interest, at $480 million."
sources = ["tax-statement"]

[section.line.visual]
kind = "illustration"
name = "debt-payments"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say many high schools were built between the 1940s and 1960s, and Measure K would lower the tax rate."
sources = ["arguments"]
basis = ["Many of our local high schools were built between the 1940s and 1960s and require urgent repairs to meet modern academic and safety standards.", "Today, MCS has an opportunity to extend that funding AND lower the tax rate"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Schools built in the 1940s to 1960s", "Extends funding, lowers the tax rate"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "The Stanislaus County voter guide says that no argument against Measure K was filed by anyone in this election."
sources = ["arguments"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote authorizes the district to issue up to $250 million in bonds."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["authorizing $250,000,000 in bonds"]

[[section.line]]
text = "A no vote does not authorize the district to issue the bonds."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["be adopted"]

[[question]]
ask = "Would my property tax go up?"
lines = ["extension", "rate"]

[[question]]
ask = "How big is $250 million next to the district's budget?"
unanswered = true
