# Archived sources for Modesto City High School District Measure K,
# 2026-11-03 general election (sources/sources.md). Every id here may be
# cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# The Stanislaus County Registrar of Voters prints Measure K's full
# text, County Counsel's impartial analysis, the district's tax rate
# statement and the argument in favor on PDF pages 50-64 of its
# bilingual Voter Information Guide; sources/vig-measure-k-pdfpp50-64.pdf
# is those pages cut from it, and every source from it cites the full
# guide's URL with the pages. The guide does not print the ballot
# question: it is quoted from the Registrar's Notice of Election for
# Measure K. County Counsel's impartial analysis is the measure's
# neutral explanation, the kind a state's attorney general's
# explanatory statement is; the district's tax rate statement is its
# fiscal statement. The guide prints "None filed" under the argument
# against, and no rebuttals.

