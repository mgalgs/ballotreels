# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the salary today; what would
# change (the formula, what it comes to at today's minimum wage, that it
# rises with the minimum wage) and the vote it needs; no cost estimate;
# one line per side; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this county". The card and title carry
# it. "Counsel" is heard as "Council" (standard/speakability.txt), so
# the narration says "the impartial analysis".
#
# Tehama County posts no voter guide for this election. The card quotes
# the ballot question from Section 2 of the Board's Ordinance No. 2158,
# transcribed from the scan the county posts; it prints no yes/no lines,
# so the card has no YES/NO boxes and the vote lines give the impartial
# analysis's own meanings, both highlighting the same phrase of the
# question.
#
# The salary figures are per supervisor (per-person amounts, exempt
# from STANDARD.md 6.5). The analysis's $35,152 is at the current $16.90
# minimum wage; the argument against's $36,192 is at a January 1, 2027
# wage that no archived official source states, so the neutral line
# gives the analysis's figure, said as the analysis's, at today's wage.
# That the salary was last raised in 1989 is the supporters' central
# point (the rebuttal calls it "the core fact"), so it is said only in
# their line (STANDARD.md 6.3); the benefits beyond salary and raises
# coming without another vote are the opponents' points, said only in
# theirs. The change line says the salary rises with the minimum wage,
# as the analysis states it, without the opponents' "without another
# vote". No cost estimate was filed (not a tax), and no archived source
# states the total cost to the county, so none is computed.
#
# Both sides filed. The names of the signers are not narrated.

contest = "ca-2026-11-03-tehama-county-measure-e"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "E"
title = "COUNTY CHARTER AMENDMENT"
origin = "ORDINANCE NO. 2158"
summary = "Shall the measure amending the Tehama County Charter to establish the annual salary of members of the Board of Supervisors at the California state minimum wage multiplied by 2,080 hours be adopted?"

[[section]]
id = "what"
heading = "Measure E"

[[section.line]]
text = "Measure E asks the voters of this county whether to tie the pay of county supervisors to the state minimum wage."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["the California state minimum wage multiplied by 2,080 hours"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "today-pay"
text = "Today, the county charter pays each supervisor $1,045 a month, or $12,540 a year."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "county-building"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "formula"
text = "From 2027, the yearly salary would equal the state hourly minimum wage times 2,080 hours."
sources = ["impartial-analysis", "text", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["the California state minimum wage multiplied by 2,080 hours"]

[[section.line]]
id = "new-pay"
text = "At today's minimum wage of $16.90 an hour, the impartial analysis puts that at $35,152 a year."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "bars"
title = "Each supervisor's yearly salary, dollars"
source = "impartial-analysis"
unit = ""
labels = ["Today", "At $16.90 an hour"]
values = [12540, 35152]

[[section.line]]
id = "automatic"
text = "The salary would then rise automatically whenever the state minimum wage rises."
sources = ["impartial-analysis", "text"]

[[section.line]]
text = "Measure E needs a majority vote to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "fiscal"
heading = "What it would cost"

[[section.line]]
text = "The documents posted for Measure E do not include a cost estimate for the measure."
sources = ["impartial-analysis", "text"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"
stamp = "None reported"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say the salary has not changed since 1989, and that pay this low keeps working residents from serving."
sources = ["argument-for"]
basis = ["The current salary has remained unchanged since 1989", "so has the ability of ordinary working residents to serve in elected office.", "A compensation level that has lost most of its purchasing power creates an unintended barrier to public service"]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Salary unchanged since 1989", "Lets working residents serve"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say supervisors also get benefits beyond their base salary, and that future raises would come without another vote."
sources = ["argument-against"]
basis = ["Base salary is only one component of compensation.", "the base salary would automatically increase when the state minimum wage increases, without another vote of County voters."]

[section.line.visual]
kind = "list"
source = "argument-against"
items = ["Benefits come on top of salary", "Raises without another vote"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote sets the salary at the state minimum wage times 2,080 hours."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["be adopted?"]

[[section.line]]
text = "A no vote keeps today's salary of $1,045 a month."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["be adopted?"]

[[question]]
ask = "How much would each supervisor be paid?"
lines = ["today-pay", "formula", "new-pay"]

[[question]]
ask = "Would the salary keep changing after 2027?"
lines = ["automatic"]

[[question]]
ask = "What would the change cost the county each year?"
unanswered = true
