# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks; what the charter is; the term limit today; what would change,
# each change named as plainly as the others, in the order of County
# Counsel's Impartial Analysis (term limits first); that the guide gives
# no cost estimate; one line per side; what a vote does.
#
# "Counsel" is heard as "Council" (standard/speakability.txt), and
# "County's" as "Counties", so the narration names neither. The guide
# prints no fiscal analysis or tax rate statement: the fiscal line
# follows the no-cost-estimate wording. The supporters' "NO COST to
# TAXPAYERS" is their argument, not an official finding, so it stays out
# of the neutral sections (STANDARD.md 6.3).

contest = "ca-2026-11-03-sd-county-measure-a"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide-page"
number = "A"
title = "A TRANSPARENT, ACCOUNTABLE, MODERN COUNTY GOVERNMENT"
origin = "The Board of Supervisors (“Board”) for the County of San Diego (“County”) placed this measure on the ballot."
summary = "Shall the San Diego County Charter be amended to establish an Independent Ethics Commission, Independent Budget Analyst, Independent Program Auditor, confirmation of certain senior County leaders, and optional Board of Supervisors appointment of the Public Defender; increase term limits from two to three terms for the Board of Supervisors members; require public disclosure of spending and performance data; clarify non-interference provisions; and update terminology and structure?"
yes = "A “yes” vote is a vote in favor of the proposed Charter amendments."
no = "A “no” vote is a vote against amending the Charter."

[[section]]
id = "what"
heading = "Measure A"

[[section.line]]
text = "San Diego County Measure A asks county voters whether to make several changes to the County Charter."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["San Diego County Charter be amended"]

[[section]]
id = "background"
heading = "What the charter is"

[[section.line]]
text = "The charter sets out how county government is organized, and only voters can change it."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "constitution-page"

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Today, a county supervisor can serve at most two terms, or eight years."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "county-building"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "Measure A would allow three terms instead, or twelve years, counting time already served."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "end-date"

[[section.line]]
text = "Measure A would also create an ethics commission, and let the board appoint an independent budget analyst and program auditor."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "empty-commission-seat"

[[section.line]]
text = "The board would confirm some senior county officials, and all county spending data would be posted online."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section]]
id = "fiscal"
heading = "What it would cost"

[[section.line]]
text = "The San Diego County voter guide does not include a cost estimate for the measure."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"
stamp = "None reported"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Measure A fights corruption with an independent ethics commission, and adds watchdogs over county money."
sources = ["arguments"]
basis = ["To fight corruption and fraud, MEASURE A establishes an Independent Ethics Commission to investigate misconduct", "MEASURE A establishes an Independent Budget Analyst and Independent Program Auditor to track billions of taxpayer dollars"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["An independent ethics commission to fight corruption", "A budget analyst and auditor to track county money"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say Measure A undoes the two-term limit voters set, giving supervisors twelve years instead of eight."
sources = ["arguments"]
basis = ["You set a two-term limit for County Supervisors", "Measure A asks you to undo it.", "Supervisors a third term. Twelve years in the same seat instead of eight."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Undoes the two-term limit that voters set", "Wraps a term extension in nice-sounding promises"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote is a vote in favor of the proposed charter amendments."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["in favor of the proposed Charter amendments"]

[[section.line]]
text = "A no vote is a vote against amending the charter."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["against amending the Charter"]
