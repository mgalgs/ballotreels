# Archived sources for San Diego County Measure A, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1). The guide's pages are cut from the San
# Diego County Registrar of Voters' Voter Information Guide (ballot type
# 001); "page" is the guide's printed footer number.
#
# The full text the guide prints is Resolution 26-051 (May 19, 2026),
# which restates Resolution 26-024 (April 21, 2026) in its entirety;
# Ordinance 11013, calling the election, cites the April resolution. The
# script cites the guide's pages for the charter text.

[contest]
id = "ca-2026-11-03-sd-county-measure-a"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/county:san_diego"
kind = "measure"
title = "San Diego County Measure A: A Transparent, Accountable, Modern County Government"

[[source]]
id = "guide-page"
kind = "official-title-summary"
publisher = "San Diego County Registrar of Voters, Voter Information Guide, page SD 001-050: ballot label and County Counsel Impartial Analysis"
