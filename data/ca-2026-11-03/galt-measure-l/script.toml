# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and of whom; the two offices today (elected, residency, no
# qualifications); how it reached the ballot and what it needs; what
# would change (when, at whose pleasure, what the council could require,
# residency); no cost estimate; one line per side; what a vote does.
#
# Not a tax: the county page prints no fiscal statement, so the fiscal
# line says the page does not include a cost estimate. The page prints
# no full text of the measure; the City Attorney's Impartial Analysis
# covers what the script needs. The card's title is the item's own head
# on the page; its origin is the analysis's sentence on who placed the
# measure. The yes and no lines quote the analysis's own statement of
# what each vote does.
#
# The analysis compares elected and appointed officers on both
# residency and qualifications; the neutral sections give both halves.
# The supporters' argument also cites the missing qualifications, so
# their line uses their other points (most cities appoint; merit-based
# hiring), and leaves out their $168 million figure, which the archived
# sources give no city budget to scale against (STANDARD.md 6.3, 6.5).
# No argument against Measure L was filed: the no side says so plainly;
# its section is marked filed = false.

contest = "ca-2026-11-03-galt-measure-l"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-label"
number = "L"
title = "Measure L: City of Galt"
origin = "The Galt City Council directed that a measure be submitted to Galt voters pursuant to Government Code section 36508 concerning whether the offices of Galt City Treasurer and City Clerk shall be made appointive."
summary = "Shall the offices of Galt Treasurer and Galt City Clerk be appointive?"
yes = "A “yes” vote on this measure would approve of making the offices of Galt City Treasurer and City Clerk both appointive."
no = "A “no” vote on this measure would disapprove of making the offices of Galt City Treasurer and City Clerk appointive."

[[section]]
id = "what"
heading = "Measure L"

[[section.line]]
text = "City of Galt Measure L asks voters in the city whether the City Treasurer and City Clerk should be appointed instead of elected."
sources = ["ballot-label", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-label"
highlight = ["be appointive"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Today, both offices are elected, and each officeholder must live and be registered to vote in Galt."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "ballot-box"

[[section.line]]
text = "No minimum training or experience is required for either elected office."
sources = ["impartial-analysis"]

[[section.line]]
text = "The Galt City Council put the question to voters under state law, and it needs a simple majority."
sources = ["impartial-analysis"]

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "If Measure L passes, both offices would become appointed after the 2028 general election."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "job-application"

[[section.line]]
text = "Appointees would serve at the pleasure of the City Council, which could set education and training requirements and review their performance each year."
sources = ["impartial-analysis"]

[[section.line]]
text = "Appointees would not be subject to the state residency requirements."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "school-records"

[[section]]
id = "fiscal"
heading = "What it would cost"

[[section.line]]
text = "The Sacramento County Current Measure Information page does not include a cost estimate for the measure."
sources = ["ballot-label"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"
stamp = "None reported"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say most California cities appoint both offices, letting Galt hire professionals on merit."
sources = ["arguments"]
basis = ["approximately 80% of California cities appoint their City Treasurer, and more than 75% appoint their City Clerk.", "allowing the City Council to appoint qualified professionals through a competitive, merit-based process"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Most California cities appoint both offices", "Qualified professionals chosen on merit"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure L was filed with Sacramento County Voter Registration and Elections."
sources = ["arguments"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote approves making the offices of City Treasurer and City Clerk both appointive."
sources = ["ballot-label"]

[section.line.visual]
kind = "page"
source = "ballot-label"
highlight = ["would approve of making the offices"]

[[section.line]]
text = "A no vote disapproves of making the offices appointive, and they would remain elected."
sources = ["ballot-label"]

[section.line.visual]
kind = "page"
source = "ballot-label"
highlight = ["would disapprove of making the offices"]
