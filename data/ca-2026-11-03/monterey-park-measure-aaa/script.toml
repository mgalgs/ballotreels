# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the tax today, what it brings in,
# and how the measure reached the ballot; what would change (the two
# rates, where the money goes, the vote it needs); the revenue as the
# impartial analysis gives it; both sides; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". The card and title carry it.
#
# Every explaining line is the City Attorney's impartial analysis, with
# the ordinance's text beside it for the rates. That only guests pay the
# tax, never residents or businesses, is the argument in favor's point,
# so it stays with that side (STANDARD.md 6.3); the today line says only
# who is charged.
#
# The card quotes the Los Angeles County Registrar-Recorder/County
# Clerk's list "Measures Appearing on the Ballot": the City's heading,
# the vote needed and the ballot question, which has no yes or no
# sentences, so the card has no boxes. The vote lines give the impartial
# analysis's own meanings, and both highlight the same phrase.
#
# The argument in favor is the City's posted copy, signed by the five
# Council members the list names. The list says "Opponents: None
# submitted.", so the no side says plainly that no argument against was
# submitted, citing the list (filed = false). Neither side names anyone:
# the record names no one on the no side.
#
# The $600,000 a year is the figure the impartial analysis attributes to
# "public documents", and is said so. The analysis's $4.5 million is the
# current tax's yield, not a budget total. No archived official document
# states the City's general fund budget to give either figure a scale
# (STANDARD.md 6.5; left open, under [[question]]).

contest = "ca-2026-11-03-monterey-park-measure-aaa"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "AAA"
title = "CITY OF MONTEREY PARK"
origin = "VOTE PASSAGE – Majority Vote 50%+1"
summary = "Shall the ordinance maintaining City of Monterey Park's services like fire, police, 911 response; keeping public areas safe/clean; helping prevent property crimes/human trafficking in Monterey Park; repairing streets/potholes; for other city services; by increasing the transient occupancy tax paid only by hotel/motel guests from 13% to 14%, and short-term rental guests, from 13% to 16%, providing approximately $600,000 annually until ended by voters; requiring audits, spending disclosure, local control over all funds, be adopted?"

[[section]]
id = "what"
heading = "Measure AAA"

[[section.line]]
text = "Measure AAA asks the voters of this city whether to raise the tax on hotel, motel and short-term rental stays."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["increasing the transient occupancy tax"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "today-tax"
text = "Today, guests who stay 30 days or less at a hotel, motel or short-term rental pay a 13 percent tax, added to their bill."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "hotel-front-desk"

[[section.line]]
id = "today-yield"
text = "The tax is estimated to bring in $4.5 million in the 2026-2027 budget year."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "city-hotel"

[[section.line]]
text = "The City Council placed Measure AAA on the ballot."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "city-council-chamber"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "hotels"
text = "Measure AAA would raise the tax to 14 percent for hotel and motel guests."
sources = ["impartial-analysis", "full-text", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["hotel/motel guests from 13% to 14%"]

[[section.line]]
id = "rentals"
text = "For short-term rental guests, the tax would rise to 16 percent."
sources = ["impartial-analysis", "full-text", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["short-term rental guests, from 13% to 16%"]

[[section.line]]
id = "general"
text = "The city could use the added money for any general government purpose."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "public-funds-locked"

[[section.line]]
text = "Measure AAA needs a majority yes vote to pass."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "fiscal"
heading = "What the impartial analysis says"

[[section.line]]
id = "revenue"
text = "The city attorney's impartial analysis says public documents estimate about $600,000 more a year."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say the measure funds city services without raising taxes on residents or businesses, since only visitors pay it."
sources = ["argument-for"]
basis = ["Measure XX will enhance our quality of life in Monterey Park without raising taxes on residents or businesses.", "The Transient Occupancy Tax (TOT), also known as a hotel tax, is paid only by hotel, motel, and short-term rental guests who stay in our city."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["No new tax on residents", "Paid only by visitors"]

[[section]]
