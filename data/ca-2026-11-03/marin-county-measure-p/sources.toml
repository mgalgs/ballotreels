credit = "Voter Information Guide and Sample Ballot, County of Marin"
url = "https://assets.marincounty.gov/marincounty-prod/public/2026-09/VIG-BT26.pdf"
file = "sources/county-vig-bt26-measure-p-transcription.txt"
retrieved = "2026-10-30"

