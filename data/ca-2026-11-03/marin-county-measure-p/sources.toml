# Archived sources for Marin County Measure P, the Marin County Child Care
# Initiative, 2026-11-03 general election (sources/sources.md, its
# section "Feed documents retrieved 2026-10-30"). Every id here may be
# cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# The County of Marin's Voter Information Guide and Sample Ballot (ballot
# type 26, the only ballot type the Internet Archive captured) prints
# Measure P's ballot question, County Counsel's impartial analysis, the
# arguments for and against and both rebuttals, and its Full Text (the
# Board of Supervisors' resolution calling the election, which says the
# initiative's own text is not printed in the pamphlet). The card quotes
# the guide's ballot question. County Counsel's impartial analysis is the
# measure's neutral explanation, the kind a state's attorney general's
# explanatory statement is. No fiscal statement is printed: the revenue
# estimate is the impartial analysis's.
#
# The guide's text layer is partly garbled (a font with a broken
# character map), so the passages cited were typed from the page images
# into sources/county-vig-bt26-measure-p-transcription.txt, which names
# the PDF, its pages and the guide's URL; the guide's sources point at the
# transcription, and their url at the guide. The county's Measure P page
# (its text layer is clean) prints the same question and analysis word for
# word, and the vote the measure needs ("Votes required to pass: simple
# majority."), which the guide does not print.

[contest]
id = "ca-2026-11-03-marin-county-measure-p"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/county:marin"
kind = "measure"
title = "Marin County Measure P: A 15-Year Parcel Tax for Child Care and Early Education"

[[source]]
id = "guide-page"
