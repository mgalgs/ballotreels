# Recipe E, about 60 seconds or less, distilled: one claim per line. The
# chain: what it asks and whose measure it is; why a district has such a
# limit (the state constitution requires one) and how it changes each
# year; the vote it needs; what would change; that the guide has no cost
# estimate; both sides, which filed nothing; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this community services district", and
# the card and title carry the name. "Counsel" is heard as "Council"
# (standard/speakability.txt), so no line names the analysis's author.
#
# The guide prints no fiscal statement. The fiscal line follows the
# round's set form, "<guide> does not include a cost estimate for the
# measure", but names the guide as "the official voter guide for this
# election": its printed name carries the county's name, which the
# narration may not say, and "County's" is heard as "counties".
#
# The $3.5 million is a cap on the district's spending of tax proceeds,
# not a cost or revenue. No archived source states the district's
# budget to give it a scale (STANDARD.md 6.5; left open, under
# [[question]]).
#
# The card quotes the ballot question from the sample ballot (page 33),
# which prints only YES and NO boxes, no yes and no sentences, so the
# card has no boxes and the vote lines take their meaning from the
# question, both highlighting the same phrase. The card's origin is the
# impartial analysis's sentence on who placed the measure, in the same
# file. No archived source says
# what happens if the measure fails, so the no line says only that it
# does not set the limit.
#
# The guide prints "No Argument in Favor of Measure F2026 Was Filed" and
# "No Argument Against Measure F2026 Was Filed": both sides say so,
# filed = false (STANDARD.md 2.5), citing that page. The district's
# Measure E is not mentioned: no archived source for Measure F names it.

contest = "ca-2026-11-03-isla-vista-measure-f"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "F"
title = "Establishment of an Appropriations Limit."
origin = "This Measure was placed on the ballot by the Board of Directors of the Isla Vista Community Services District"
summary = "The appropriations limit on spending the proceeds of taxes imposed by the Isla Vista Community Services District may be established by the electors of the District. In succeeding years, the appropriations limit will be equal to the prior year's limit, subject only to specified adjustments in the Government Code; shall voters establish an appropriations limit of $3,500,000/fiscal year subject only to certain statutory adjustments, until voters decide to change it?"

[[section]]
id = "what"
heading = "Measure F"

[[section.line]]
text = "Measure F asks the voters of this community services district to set a yearly limit on the district's spending of tax money."
sources = ["ballot-question", "full-text"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["shall voters establish an appropriations limit"]

[[section]]
id = "background"
heading = "How the limit works"

[[section.line]]
id = "required"
text = "The state constitution requires units of government, including this district, to have such a spending limit."
sources = ["full-text"]

[section.line.visual]
kind = "illustration"
name = "spending-limit"

[[section.line]]
id = "adjusted"
text = "Voters may set the first limit, and the district's board then adjusts it each year for inflation and population."
sources = ["full-text"]

[[section]]
id = "today"
heading = "The vote it needs"

[[section.line]]
text = "Measure F needs a majority of the vote to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "amount"
text = "Measure F would set the limit at $3.5 million each fiscal year, adjusted under state law, until voters change it."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "spending-limit"

[[section]]
id = "fiscal"
heading = "What it would cost"

[[section.line]]
text = "The official voter guide for this election does not include a cost estimate for the measure."
sources = ["no-arguments"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section]]
