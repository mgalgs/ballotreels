[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote sets the yearly limit at $3.5 million."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["shall voters establish an appropriations limit"]

[[section.line]]
text = "A no vote does not set that limit."
sources = ["ballot-question"]

[section.line.visual]
