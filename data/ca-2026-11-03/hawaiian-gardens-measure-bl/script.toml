# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; how it reached the ballot; the
# tax today; what would change (the new rates, who stays exempt, when
# and for how long); the two official revenue figures; the argument for,
# and that no argument against was submitted; what a vote does.
#
# Only the ballot question, the City Attorney's impartial analysis and
# the argument for were gathered (no full text), so the neutral lines are
# from the question and the analysis alone.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". The card shows the name.
#
# The gross-receipts rate is under a dollar ($0.95 per $1,000), which
# the transcript check cannot hear reliably in any spelling
# (standard/speakability.txt); the line says "a set amount" and leaves
# the figure to the card, where the question prints it.
#
# Revenue: the ballot question says about $563,810, with no period, and
# the impartial analysis $450,000 a year; both are given, each
# attributed, in one line (rule 5b). The argument for's own $400,000 is
# that side's and is not used. No archived source states the City's
# general fund budget, so neither has a scale (STANDARD.md 6.5; left
# open). The flat rates are amounts per business, exempt.
#
# The card quotes the measure's entry in the county's list "Measures
# Appearing on the Ballot", which prints no yes/no meanings, so the card
# has no boxes; the vote lines take both meanings from the impartial
# analysis and highlight the same phrase of the question.
#
# Sides: the argument in favor is presented from its text; the county's
# list says "Opponents: None submitted.", and the no side says so
# (filed = false).

contest = "ca-2026-11-03-hawaiian-gardens-measure-bl"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "BL"
title = "CITY OF HAWAIIAN GARDENS"
origin = "VOTE PASSAGE – Majority Vote 50%+1"
summary = "Shall the measure to help fund general City services, such as public safety, street operations and maintenance, and parks and recreation services, by updating and simplifying the City's business license tax to levy a maximum annual $50 flat rate plus $0.95 per $1,000 of gross receipts above $30,000 for all businesses other than contractors, and a $175 flat rate for contractors, generating approximately $563,810 until ended by voters, all funds being local, be adopted?"

[[section]]
id = "what"
heading = "Measure BL"

[[section.line]]
text = "Measure BL asks the voters of this city whether to update and simplify the tax that businesses pay for a city license."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["updating and simplifying the City's business license tax"]

[[section]]
id = "background"
heading = "How it reached the ballot"

[[section.line]]
text = "The City Council voted unanimously in July to place Measure BL on the ballot, and it needs a simple majority to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "city-council-chamber"

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "today-tax"
text = "Today, the tax uses flat rates, employee counts or gross receipts across more than 30 kinds of business, a structure last updated in 1993."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "business-license-certificate"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "contractors"
text = "Contractors would pay a flat $175 a year."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["a $175 flat rate for contractors"]

[[section.line]]
id = "others"
text = "Most other businesses would pay $50 a year, plus a set amount for each $1,000 of gross receipts above $30,000."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["$50 flat rate plus $0.95 per $1,000 of gross receipts above $30,000"]

[[section.line]]
id = "exempt"
text = "Qualifying nonprofit groups, utilities, emergency aid services and licensed card clubs would stay exempt."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "city-storefronts"

[[section.line]]
id = "start"
text = "The new rates would start on January 1, 2027, and last until voters repeal them."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "end-date"

[[section]]
id = "fiscal"
heading = "What it would raise"

[[section.line]]
id = "revenue"
text = "The ballot question says the tax would generate about $563,810, and the impartial analysis estimates $450,000 a year."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "special-tax"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say the measure replaces 34 confusing categories with simple rates, cutting red tape for small businesses, and all the money stays local."
sources = ["argument-for"]
basis = ["Voting YES replaces 34 confusing categories with a streamlined, single gross receipts and flat contractor rate—cutting red tape for small businesses.", "All funds stay 100% in Hawaiian Gardens"]

[section.line.visual]
kind = "list"
