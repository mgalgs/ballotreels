# Archived sources for Burlingame Elementary School District Measure R,
# 2026-11-03 general election (sources/sources.md). Every id here may be
# cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# San Mateo County publishes each measure's documents separately, not as
# one pamphlet: the Board of Trustees' resolution (whose Exhibit B is the
# ballot question and Exhibit C the tax rate statement), the impartial
# analysis, and each argument and rebuttal, as its own PDF on the
# Assessor-County Clerk-Recorder & Elections page. The impartial
# analysis prints no author. The district calls itself "Burlingame
# School District" on the county's links and "Burlingame Elementary
# School District" in its resolution and ballot question; the title
# follows the ballot question.
#
# Every PDF here is a scan, with no text layer or an OCR one. Each
# source's `file` is therefore a transcription of the pages the script
# quotes, made by reading the page images, beside the PDF it transcribes
# (sources/<name>.txt for sources/<name>.pdf); `url` is the PDF's. The
# check reads a non-PDF file as plain text.

[contest]
id = "ca-2026-11-03-burlingame-elementary-measure-r"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/school_district:burlingame_elementary_school_district"
kind = "measure"
title = "Burlingame Elementary School District Measure R: School Facility Bonds"

[[source]]
id = "ballot-question"
kind = "official-title-summary"
publisher = "Board of Trustees of the Burlingame Elementary School District, Resolution No. 2025/2026-25, Exhibit B: Bond Measure (Abbreviated Form), as posted by San Mateo County Assessor-County Clerk-Recorder & Elections"
credit = "Resolution No. 2025/2026-25"
url = "https://smcacre.gov/system/files/2026-07/52-ENG-M105-Contest%20Code-Reso-Burlingame%20ESD%20Bon_Redacted.pdf"
file = "sources/resolution-full-text.txt"
retrieved = "2026-10-28"

[[source]]
id = "impartial-analysis"
kind = "official-fiscal-analysis"
publisher = "Impartial Analysis of Measure R (no author printed), as posted by San Mateo County Assessor-County Clerk-Recorder & Elections"
credit = "Impartial Analysis"
url = "https://smcacre.gov/system/files/2026-08/52-ENG-MR-ImpartialAnalysis-Burlingame-ESD-Bond.pdf"
file = "sources/impartial-analysis.txt"
retrieved = "2026-10-28"

[[source]]
id = "tax-statement"
