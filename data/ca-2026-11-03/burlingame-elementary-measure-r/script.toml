# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and of whom; how a school bond is repaid and what it needs to
# pass; what the money would pay for; the district's tax statement; one
# line per side; what a vote does.
#
# San Mateo County posts the measure's documents one by one, so the card
# quotes the ballot question (Exhibit B), the resolution's heading and
# its Section 2 from Resolution No. 2025/2026-25, and names that
# resolution as its document. The resolution prints no yes or no lines,
# so the card has none; the vote lines take their meanings from the
# impartial analysis and highlight the resolution's own phrases, as
# Utah's do. The impartial analysis prints no author, so the script
# never names one. The bond total and the debt service are repaid from a
# tax on property in the district, and no archived source states the
# district's budget, so they have no budget scale (STANDARD.md 6.5; left
# open). The tax statement gives $16 per $100,000 as both its average
# and its highest rate.
#
# The opponents' argument calls the bond "$97M" and earlier bonds
# "$56,000,000" each; the official documents say $100,000,000. Their
# figures stay in their argument (STANDARD.md 6.3), and the no line
# quotes neither.

contest = "ca-2026-11-03-burlingame-elementary-measure-r"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "R"
title = "To repair aging Burlingame schools and maintain academic excellence by fixing leaky roofs; removing dry rot, lead/asbestos; replacing aging plumbing/electrical systems; updating science, technology/engineering labs; and providing teachers with instructional tools to support student success, shall Burlingame Elementary School District's measure authorizing $100,000,000 in bonds at legal interest rates be adopted, at $16.00 per $100,000 of assessed value (approximately $6,567,830 annually) while bonds are outstanding, with oversight, audits, no funds for administrators, and local control?"
origin = "RESOLUTION CALLING FOR AN ELECTION AUTHORIZING THE ISSUANCE OF GENERAL OBLIGATION BONDS OF THE DISTRICT AT AN ELECTION TO BE HELD NOVEMBER 3, 2026"
summary = "The provisions of Prop 39 shall control the administration of the election to consider the bond proposition of the District (the \"Bond Proposition\"), such that a favorable vote of no less than 55% of the qualified voters voting at the election shall constitute approval thereof"

[[section]]
id = "what"
heading = "Measure R"

[[section.line]]
text = "Burlingame Elementary School District Measure R asks the district's voters whether to approve $100 million in school bonds."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["authorizing $100,000,000 in bonds"]

[[section]]
id = "today"
heading = "How a school bond works"

[[section.line]]
text = "The district would borrow the money and repay it from a tax on property in the district."
sources = ["tax-statement"]

[section.line.visual]
kind = "illustration"
name = "bond-certificates"

[[section.line]]
text = "Measure R needs 55 percent of the vote to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "The money would go to listed projects, such as classrooms and science labs, roofs, plumbing, electrical and safety systems."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "school-classroom"

[[section]]
id = "fiscal"
heading = "What the tax statement says"

[[section.line]]
text = "The district's tax statement estimates a tax of $16 per $100,000 of assessed value, on average and at most, through 2057-2058."
sources = ["tax-statement"]

[section.line.visual]
kind = "illustration"
name = "debt-payments"

[[section.line]]
text = "The statement estimates the total to repay, with interest, at about $195.5 million."
sources = ["tax-statement"]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Measure R repairs schools over 100 years old, with dry rot and leaky roofs, keeping funds local."
sources = ["argument-for"]
basis = ["But some of our schools are over 100 years old and their age is showing. Classrooms suffer from dry rot, leaky roofs, and outdated plumbing and electrical systems.", "By law, all funds remain under local control and may only be used in Burlingame schools"]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Repairs schools over 100 years old", "All funds stay in local schools"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say voters approved bonds to update classrooms in 2012 and 2016, and bond debt routinely doubles the cost."
sources = ["argument-against"]
basis = ["In 2016 voters approved $56,000,000 in debt to \"update classrooms\" and in 2012 they approved $56,000,000 to \"update classrooms\".", "Remember, financing school projects via bond debt, routinely doubles the cost of the project."]

[section.line.visual]
kind = "list"
source = "argument-against"
items = ["Bonds already passed in 2012 and 2016", "Bond debt doubles project costs"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote would let the district issue the bonds."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["measure authorizing $100,000,000 in bonds"]

[[section.line]]
text = "A no vote would prevent the district from issuing the bonds."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
