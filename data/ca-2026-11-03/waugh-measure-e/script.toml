# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; how a school bond is repaid and what it
# needs to pass; what the money may pay for; the district's tax rate
# statement; one line per side; what a vote does.
#
# The bond total and the debt service are repaid from a tax on property
# in the district, and no archived source states the district's budget,
# so they have no budget scale (STANDARD.md 6.5; left open). The fiscal
# line gives the statement's average rate beside its highest, as it
# prints both. The bar on spending bond money on salaries, the audits
# and the oversight committee are in the supporters' argument ("protects
# taxpayers"), so the neutral sections leave them out (STANDARD.md 6.3).
# The supporters' line leaves out the two schools' names, which read as
# a name the check cannot tell from a person's. "Counsel" is heard as
# "Council" (standard/speakability.txt), so the narration says "the
# impartial analysis".
#
# No argument against Measure E was submitted. The no side says so
# plainly; its section is marked filed = false.

contest = "ca-2026-11-03-waugh-measure-e"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "measure-question"
number = "E"
title = "Waugh School District"
origin = "The Waugh School District (“District”) Board of Trustees (“Board”) has placed on the ballot the question whether to issue $16,000,000 in bonds for such purposes."
summary = "To improve the quality of education; replace heating, ventilation and air-conditioning systems; modernize outdated classrooms, restrooms and school facilities; and make health, safety and security improvements, shall Waugh School District’s measure authorizing $16,000,000 in bonds, at legal interest rates, and levying approximately $30 per $100,000 of assessed valuation (raising $917,000 annually) while bonds are outstanding, be adopted, with a board appointed citizens’ oversight committee and annual independent audits to assure proper expenditure of funds?"
yes = "A “yes” vote on Measure E will authorize the District to issue up to $16,000,000 in bonds and levy taxes to pay for such bonded indebtedness."
no = "A “no” vote on Measure E will disapprove the issuance of bonds and the associated levy of the taxes."

