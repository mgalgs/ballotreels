# Archived sources for Waugh School District Measure E, 2026-11-03
# general election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# The Sonoma County Registrar of Voters publishes each measure's pages
# of its guide as one PDF, headed "Local Ballot Measure: E" and footed
# "Sonoma County" with the guide's page numbers (049M511 to 049M516); no
# cover page was archived, so the sources name those pages, not a guide
# title. One PDF backs every source here. County Counsel's Impartial
# Analysis is the measure's neutral explanation; the district's Tax Rate
# Statement is its fiscal statement. The pages print an argument in
# favor and "No Argument Was Submitted Against Measure E", and no
# rebuttals.
#
# The Census names the district Waugh Elementary School District
# (divisions.tsv); the ballot's name is Waugh School District.

[contest]
id = "ca-2026-11-03-waugh-measure-e"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/school_district:waugh_elementary_school_district"
kind = "measure"
title = "Waugh School District Measure E: School Renovation and Safety Bonds"

