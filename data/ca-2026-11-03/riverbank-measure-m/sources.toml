# Archived sources for City of Riverbank Measure M, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The Stanislaus County Registrar of Voters prints Measure M's full
# text, the City Attorney's impartial analysis, the arguments for and
# against and both rebuttals on PDF pages 93-102 of its bilingual Voter
# Information Guide; sources/vig-measure-m-pdfpp93-102.pdf is those
# pages cut from it, and every source from it cites the full guide's
# URL with the pages. The guide does not print the ballot question: it
# is quoted from the City Clerk's Notice Fixing Time for Submission of
# Arguments For or Against Measure M. The City Attorney's impartial
# analysis is the measure's neutral explanation, the kind a state's
# attorney general's explanatory statement is; it states the City
# Attorney's opinion that the measure is likely unconstitutional, which
# the script gives as that opinion, attributed. No fiscal statement is
# printed (not a tax measure).

[contest]
id = "ca-2026-11-03-riverbank-measure-m"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:riverbank"
kind = "measure"
title = "City of Riverbank Measure M: Voter Approval of Urban Development on Agricultural or Open Space Lands West of the City"

