# Archived sources for Merced Union High School District Measure X, the
# School Facilities Improvement District No. 2 bond (Atwater and Buhach Colony High Schools area),
# 2026-11-03 general election (sources/county-sources.md). Every id here
# may be cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# Who votes: the full text authorizes the bonds "By approval of this
# measure by at least 55% of the voters of School Facilities Improvement
# District No. 2 of the Merced Union High School District", and the tax
# rate statement says the bonds are repaid from "tax levies made upon the
# taxable property in the School Facilities Improvement District". The
# SFID has no boundary layer of its own, so the division is the county
# with a `voters` line, worded as the ballot question names it, as
# Yosemite Unified's SFID No. 1 Measure W is.
#
# Merced County Elections posts each measure's documents on its
# "November 3, 2026, General Election" page; no printed county guide was
# archived. The ballot question is quoted from the county's Measure X
# PDF. County Counsel's impartial analysis is the measure's neutral
# explanation, the kind a state's attorney general's explanatory
# statement is; the district's tax rate statement (headed "Tax
# Information Statement") is its fiscal statement. The county's list of
# ballot measures is the filing record.
#
# No argument against Measure X and no rebuttals are among the
# county's postings (sources/county-sources.md).

