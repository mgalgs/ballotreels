# Archived sources for City of Fairfield Measure Q, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# No printed Solano County voter guide was archived: these are the filed
# documents the Solano County Registrar of Voters posts on its Current
# Election Information page. The ballot question is quoted from
# Resolution No. 2026-158, which orders it "printed on the ballot". The
# resolution and the argument against are scans with no text layer: the
# passages `check` reads verbatim were typed from the page images into
# .txt transcriptions beside the PDFs, which name the PDF and URL they
# copy; those sources point at the transcriptions, and their urls at the
# scans. The City Attorney's impartial analysis is the measure's neutral
# explanation; it gives no cost estimate, and no fiscal statement was
# posted. The rebuttals are not cited.

[contest]
id = "ca-2026-11-03-fairfield-measure-q"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:fairfield"
kind = "measure"
title = "City of Fairfield Measure Q: Appointive City Clerk"

