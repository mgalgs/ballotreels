# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; what the clerk does; how the
# clerk is chosen today; what would change (who appoints, residency and
# pay, the current clerk's term, the vote it needs); that no cost
# estimate is given; one line per side; what a vote does.
#
# The card quotes the ballot question from Resolution No. 2026-158,
# which prints no yes/no lines. So the card has no YES/NO boxes, the
# vote lines give the impartial analysis's meanings, and both highlight
# the same phrase of the question. The clerk's duties are the
# resolution's, in its recitals.
#
# The impartial analysis notes that most California cities appoint
# their clerk; the supporters argue the same ("more than two-thirds"),
# so it stays out of the neutral sections (STANDARD.md 6.3). So does
# the ordinance's rule that only voters can bring back an elected clerk,
# which the opponents argue from. No fiscal statement was posted and the
# analysis gives no cost estimate: the fiscal line follows the
# no-cost-estimate wording, naming the analysis as the American Canyon
# and Sausalito scripts do.

contest = "ca-2026-11-03-fairfield-measure-q"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "Q"
title = "City of Fairfield Appointive City Clerk Measure"
origin = "RESOLUTION NO. 2026-158"
summary = "Shall the Office of City Clerk be appointive?"

[[section]]
id = "what"
heading = "Measure Q"

[[section.line]]
text = "City of Fairfield Measure Q asks Fairfield voters whether the city clerk should be appointed instead of elected."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["Shall the Office of City Clerk be appointive?"]

[[section]]
id = "background"
heading = "What the city clerk does"

[[section.line]]
text = "The city clerk keeps official records and meeting minutes, publishes city ordinances, and runs city elections."
sources = ["ballot-question"]

[section.line.visual]
kind = "illustration"
name = "school-records"

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Today, Fairfield voters elect the city clerk to a four-year term."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "ballot-box"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "who"
text = "Measure Q would have the city council appoint the clerk, and let the council hand that choice to the city manager."
sources = ["impartial-analysis", "text"]

[section.line.visual]
kind = "illustration"
name = "city-clerk-office"

[[section.line]]
text = "An appointed clerk would not have to live in Fairfield, and would be paid an amount the council sets."
sources = ["impartial-analysis"]

[[section.line]]
id = "when"
text = "The current clerk, elected in 2024, would finish her term in 2028, and could then be appointed."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "end-date"

[[section.line]]
text = "Measure Q needs a simple majority to pass."
sources = ["impartial-analysis"]

[[section]]
id = "fiscal"
heading = "What it would cost"

[[section.line]]
text = "The city attorney's impartial analysis does not include a cost estimate for the measure."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"
stamp = "None reported"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say the clerk should be chosen for qualifications, not campaign politics, since an elected clerk generally needs no training."
sources = ["argument-for"]
basis = ["ensure Fairfield’s City Clerk is selected for qualifications, experience, and professional competence—NOT campaign politics.", "Yet an elected candidate generally needs NO professional certification, relevant experience, or specialized training."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Chosen for qualifications, not politics", "Candidates need no training today"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say voters would lose direct control of the clerk, and transparency suffers when the clerk answers to officials it records."
sources = ["argument-against"]
basis = ["it reduces direct voter control over a core democratic function.", "When the Clerk answers to the same officials whose actions must be recorded and disclosed, transparency suffers."]

[section.line.visual]
kind = "list"
source = "argument-against"
items = ["Less direct control for voters", "Clerk answers to those it records"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote makes the city clerk position appointive."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["be appointive"]

[[section.line]]
text = "A no vote means the city clerk position will remain elected."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["be appointive"]

[[question]]
ask = "Who would choose the clerk?"
lines = ["who"]

[[question]]
ask = "What happens to the clerk serving now?"
lines = ["when"]
