# Archived sources for Hacienda La Puente Unified School District Measure
# B, 2026-11-03 general election (sources/la-sources.md). Every id here may
# be cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# The Los Angeles County Registrar-Recorder/County Clerk's list "Measures
# Appearing on the Ballot" prints each measure's letter, vote threshold and
# ballot question, and says in words who filed the primary arguments
# ("Supporters: None submitted. Opponents: None submitted."). The card
# quotes the ballot question from it (ballot-question), and the sides cite
# it as the Registrar's statement of filing (measure-list). The same
# excerpt backs both.
#
# The Registrar's Interactive Sample Ballot prints County Counsel's
# impartial analysis (the measure's neutral explanation), saved as HTML,
# with "NO ARGUMENT FOR OR AGAINST THIS MEASURE WAS SUBMITTED" under it.
# It says terms served on or after November 3, 2026 count toward the
# limit, where the resolution says December 11, 2026: the analysis wins.
# The measure is also explained from the Board of Education's Resolution
# No. 2025/26-38, as filed with the Los Angeles County Board of
# Supervisors. Its page 1 has only a garbled text layer and page 2 none:
# both were typed from the page images into
# sources/resolution-transcription.txt, which that source points at. A
# term limit has no tax rate statement, and the analysis gives no cost
# estimate.

