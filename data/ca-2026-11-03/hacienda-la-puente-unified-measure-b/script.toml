# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; how board terms work and how the measure
# reached the ballot (the board's own stated purpose and its split vote);
# what would change (the limit, which terms count, the vote it needs);
# that no document gathered gives a cost estimate; both sides, neither of
# which filed an argument; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the opening
# says "the voters of this school district". The card and title carry the
# names. The board's vote is said as who voted, not as a tally
# (standard/speakability.txt).
#
# The card quotes the Los Angeles County Registrar-Recorder/County Clerk's
# list "Measures Appearing on the Ballot", which prints the ballot question
# with no yes and no sentences, so the card has no boxes and the two vote
# lines highlight the same phrase of the question.
#
# The resolution's Section 3 and its draft ballot question say "two (2)
# consecutive" terms; the question the Registrar lists, which is the one on
# the ballot, says "no more than two (2) four-year terms during their
# lifetime", as the resolution's recitals do ("two (2) lifetime four-year
# terms"). The narration follows the ballot question and never says
# "consecutive".
#
# The board majority's purpose is stated as its own, from the resolution's
# recital (STANDARD.md 6.2), beside the split vote, so the dissent the
# record shows is told as plainly as the majority's reason. No impartial
# analysis was staged.
#
# The Registrar's list says in words "Supporters: None submitted.
# Opponents: None submitted.", so each side says plainly that no argument
# was submitted, citing the list, in the same words (filed = false on
# both, STANDARD.md 2.5).

contest = "ca-2026-11-03-hacienda-la-puente-unified-measure-b"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "B"
title = "HACIENDA LA PUENTE UNIFIED SCHOOL DISTRICT"
origin = "VOTE PASSAGE – Majority Vote 50%+1"
summary = "Shall members of the Board of Education of the Hacienda La Puente Unified School District be limited to serving no more than two (2) four-year terms during their lifetime regardless of the trustee area represented?"

[[section]]
id = "what"
heading = "Measure B"

[[section.line]]
text = "Measure B asks the voters of this school district whether to limit school board members to two four-year terms in a lifetime."
