# Archived sources for Carpinteria Measure I, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# Santa Barbara County Elections prints each ballot type's County Voter
# Information Guide as one PDF; pages 16 to 17 (impartial analysis,
# argument in favor) and 22 to 23 (sample ballot) of Ballot Type 12 were
# cut into one excerpt, which backs every source here. The ballot labels
# the measure "Measure I2026"; the project names it by its bare letter.
# The impartial analysis, written by the firm acting as City Attorney, is
# the measure's neutral explanation and gives the one revenue estimate;
# no tax rate statement or fiscal analysis applies to a sales tax. No
# argument against was filed. The guide does not print the ordinance's
# full text, and it was not fetched from the City, so no `official-text`
# source is listed; the analysis covers what the script needs.

[contest]
id = "ca-2026-11-03-carpinteria-measure-i"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:carpinteria"
kind = "measure"
title = "Carpinteria Measure I: Quarter-Cent Sales Tax for City Services"

