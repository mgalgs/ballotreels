# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the sales tax rate today; what
# would change (the new rate, when it starts and how long it lasts,
# where the money goes, the vote it needs); the City's revenue estimate
# as the impartial analysis gives it; one line per side; what a vote
# does.
#
# The card quotes the ballot label from the guide's sample ballot, which
# prints plain YES and NO boxes and no yes/no lines. So the card has no
# YES/NO boxes, its origin is the impartial analysis's sentence placing
# the measure, the vote lines give the analysis's meanings, and both
# highlight the same phrase of the label. The narration gives the rates
# as percents, as the analysis does, since a sales tax said in cents is
# transcribed in dollars (standard/speakability.txt).
#
# The analysis's list of exempt items (groceries, prescription medicine)
# is also the supporters' point ("WON'T be taxed"), as are the audits,
# the yearly disclosure and the uses the label lists, so the neutral
# sections leave them to the card and the yes side (STANDARD.md 6.3). No
# tax rate statement or fiscal analysis applies; the revenue is the
# City's projection as the impartial analysis gives it, and no archived
# source states the City's general fund budget to give it a scale
# (STANDARD.md 6.5; left open, under [[question]]). The guide does not
# print the ordinance, so nothing here cites it.
#
# No argument against Measure I was filed. The no side says so plainly;
# its section is marked filed = false.

contest = "ca-2026-11-03-carpinteria-measure-i"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "I"
title = "Carpinteria Public Safety, Roads, City Services Measure."
origin = "On June 22, 2026, the City Council voted to place Measure I2026, also known as the Carpinteria Public Safety, City Services Measure, on the November 3, 2026 general municipal election ballot."
summary = "To help repair streets/potholes/sidewalks; better prepare for/respond to wildfires/floods, other emergencies/natural disasters; keep public areas/parks safe/clean; help maintain sheriff's service/response, property crime/theft prevention efforts; address homelessness; support youth/senior programs; other general government purposes; shall City of Carpinteria's measure be adopted levying a 1/4¢ sales tax, providing approximately $700,000 annually until ended by voters, requiring audits, spending disclosure, funds locally controlled?"

[[section]]
id = "what"
heading = "Measure I"

[[section.line]]
text = "Measure I asks the voters of this city whether to raise the sales tax by a quarter percent."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["levying a 1/4¢ sales tax"]

[[section]]
id = "today"
heading = "The sales tax today"

[[section.line]]
id = "today-rate"
text = "Today, the total sales tax in the city is 9 percent, including a 1.25 percent city tax."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "bars"
title = "Total sales tax rate in the city"
source = "impartial-analysis"
unit = "%"
labels = ["Today", "With Measure I"]
values = [9, 9.25]

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "new-rate"
text = "Measure I would raise the city tax to 1.5 percent, and the total to 9.25 percent."
sources = ["impartial-analysis"]

[[section.line]]
id = "dates"
text = "The higher rate would start around April 2027 and last until voters repeal it."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "end-date"

[[section.line]]
id = "general"
text = "As a general tax, the city council could spend the money on any lawful purpose."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "city-council-chamber"

[[section.line]]
text = "Measure I needs a simple majority to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "fiscal"
heading = "What the impartial analysis says"

[[section.line]]
id = "revenue"
text = "The city attorney's impartial analysis projects about $700,000 a year in added general fund revenue."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say without Measure I, deeper cuts are unavoidable, and it is critical for street and pothole repairs."
sources = ["arguments"]
basis = ["without Measure I, deeper cuts are unavoidable.", "Measure I is critical to sustain ongoing maintenance, pothole repairs, and reduce further deterioration."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Avoids deeper cuts to services", "Repairs streets and potholes"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure I was filed, so the county voter guide prints only the one in favor."
sources = ["arguments"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote authorizes the quarter-percent sales tax."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["levying a 1/4¢ sales tax"]

[[section.line]]
text = "A no vote does not authorize the quarter-percent sales tax."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["levying a 1/4¢ sales tax"]

[[question]]
ask = "How much would the sales tax go up?"
lines = ["today-rate", "new-rate"]

[[question]]
ask = "When would it start, and how long would it last?"
lines = ["dates"]

[[question]]
ask = "What can the money be spent on?"
lines = ["general"]

[[question]]
ask = "How big is about $700,000 a year next to the city budget?"
unanswered = true
