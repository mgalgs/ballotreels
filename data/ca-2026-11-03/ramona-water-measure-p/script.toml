# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and whose measure it is; what Proposition NN's limit is today and
# how the district has read it; what would change (a separate spending
# limit, grants left out of both limits); that the guide gives no cost
# estimate; one line per side; what a vote does.
#
# The guide prints no fiscal statement (not a tax measure): the fiscal
# line follows the no-cost-estimate wording. District Counsel's Impartial
# Analysis is cited as the guide page; "Counsel" is heard as "Council"
# (standard/speakability.txt), so the narration does not name it. The
# limits are caps on the district's own spending and debt; no archived
# source states the district's budget, so they have no scale (STANDARD.md
# 6.5; left open). The 1988 date is the resolution's recital ("approved
# on November 8, 1988").
#
# No argument against was filed ("No Argument Against Measure P was filed
# with the Registrar of Voter's Office."): the no side says so, filed =
# false (STANDARD.md 2.5).

contest = "ca-2026-11-03-ramona-water-measure-p"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide-page"
number = "P"
title = "AMENDMENT OF PROPOSITION ‘NN’ TO MODERNIZE THE ORDINANCE."
origin = "The Board of Directors for the Ramona Municipal Water District (“District”) placed this measure on the ballot."
summary = "Shall the voters of the Ramona Municipal Water District adopt a measure amending Proposition ‘NN’ by (1) exempting grant funding and donations from the calculation of authorized expenditure limit; (2) increasing the expenditure limit for new projects from $1,000,000 to $10,000,000 where no debt is incurred; and (3) establishing annual adjustments to the expenditure limit based on the San Diego Area Consumer Price Index beginning January 1, 2028?"
yes = "A “yes” vote means the following: (1) grant funding and donations would be exempt from expenditure and debt limit calculations; (2) an “expenditure limit,” will be established in the initial amount of $10,000,000, with CPI adjustments beginning January 1, 2028; and (3) debt for major projects will be limited to the amounts initially established by Proposition NN as adjusted annually since 1989, currently approximately $3,300,000."
no = "A “no” vote means that Proposition NN would remain unchanged with no expenditure limit specified and the current debt limit of approximately $3,300,000 as adjusted annually since 1989 would remain in place."

