# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks; the tax today and how its money may be spent; what would change
# (the tax split in two at the same total rate, half for housing only);
# the Controller's Statement's two effects, the money moved out of the
# General Fund and the small overall loss from a new exemption, each with
# its scale; one line per side; what a vote does.
#
# The ballot and pamphlet call it "Proposition I", so the narration does.
# The Controller's Statement gives the total itself ("the approximately
# $7 billion General Fund sources"): $120 million is about 2 percent (1.7,
# rounded), $1 million less than 1 percent.
#
# How the housing money must be split (60, 25 and 10 percent) is argued by
# the opponents' rebuttal ("at least 70% of the money does not have to
# build housing"), and the 2020 measure behind the tax by the proponents,
# so neither is set up in a neutral section (STANDARD.md 6.3). That the
# total rate stays the same is the digest's own statement of what the
# measure does, so the change section says it, without the proponents'
# "no new taxes".

contest = "ca-2026-11-03-san-francisco-county-measure-i"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "digest"
number = "I"
title = "Changes to Real Property Transfer Tax"
origin = "On July 23, 2026, the Department of Elections certified that the initiative petition calling for Proposition I to be placed on the ballot had a sufficient number of valid signatures to qualify the measure for the ballot."
summary = "Shall the City permanently dedicate half of the transfer tax revenues collected when certain real estate with a value or sales price of more than $10,000,000 changes hands, which will continue to be taxed at rates of 5.5% to 6%, to be spent only on affordable housing, including social housing developments and housing assistance, and exempt certain sales from the dedicated portion of the tax, for an estimated annual revenue decrease of approximately $1 million?"
yes = "If you vote “yes,” you want to dedicate half of the transfer tax revenues when certain real estate with a value or sales price of more than $10,000,000 changes hands, to be spent only on affordable housing, including social housing developments and housing assistance."
no = "If you vote “no,” you do not want to make these changes."

[[section]]
id = "what"
heading = "Proposition I"

[[section.line]]
text = "Proposition I asks San Francisco voters whether to reserve half of the transfer tax on property sales over $10 million for affordable housing."
sources = ["digest"]

[section.line.visual]
kind = "page"
source = "digest"
highlight = ["Changes to Real Property Transfer Tax"]

