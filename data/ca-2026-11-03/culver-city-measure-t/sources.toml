# Archived sources for City of Culver City Measure T, 2026-11-03 general
# election (sources/la-sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The Los Angeles County Registrar-Recorder/County Clerk's list "Measures
# Appearing on the Ballot" is the authority for the measure's letter,
# ballot question and vote threshold, and says in words that no argument
# against was submitted ("Opponents: None submitted."); the City Clerk's
# page says the same ("An argument in opposition of the TOT Increase
# (Measure T) was not filed."). sources/county-measure-list-excerpt.txt
# is the measure's entry, cut from the list. The Registrar's Interactive
# Sample Ballot prints the City Attorney's impartial analysis (the
# measure's neutral explanation, which states the City's revenue
# estimate), the measure's full text and the argument in favor, saved as
# HTML; they supersede the same texts on the City Clerk's "Upcoming
# Election Information" page (sources/measure-page.html, not cited). The
# resolution (a scan) is not cited.

[contest]
id = "ca-2026-11-03-culver-city-measure-t"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:culver_city"
kind = "measure"
title = "City of Culver City Measure T: Raising the Hotel Guest Tax"

[[source]]
id = "ballot-question"
kind = "official-title-summary"
publisher = "Los Angeles County Registrar-Recorder/County Clerk, Measures Appearing on the Ballot, General Election November 3, 2026: City of Culver City, Measure T"
credit = "Los Angeles County Registrar-Recorder/County Clerk, Measures Appearing on the Ballot"
url = "https://content.lavote.gov/docs/rrcc/documents/final-measures-appearing-on-the-ballot-9-22-2026-v-2.pdf"
file = "sources/county-measure-list-excerpt.txt"
