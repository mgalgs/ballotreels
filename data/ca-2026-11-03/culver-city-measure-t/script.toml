# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the tax today (what it is, who
# collects it, its rate since 2012); the two steps up; where the money
# goes; the vote it needs; the City's revenue estimate; one line per
# side; what a vote does.
#
# No place name is narrated: the opening says "the voters of this city".
# The card quotes the Registrar-Recorder's list: the city's heading as
# the title, its vote-passage line as the origin, the ballot question as
# the summary. The list prints no yes/no statements; the vote lines take
# their meanings from the impartial analysis.
#
# The revenue is the City's General Fund money, so rule 6.5 asks for its
# scale; no archived source states the General Fund's total, so the
# figures are given without one.
#
# The list says no argument against was submitted: the no side says so
# plainly, citing it, and its section is marked filed = false. The yes
# line is kept as short as that line, so the word counts match.

contest = "ca-2026-11-03-culver-city-measure-t"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "T"
title = "CITY OF CULVER CITY"
origin = "VOTE PASSAGE – Majority Vote 50%+1"
summary = "Shall an ordinance to maintain Culver City emergency response/firefighter/paramedic/ police staffing; affordable housing/ mental health/ homeless reduction programs; improve streets, sidewalks, public transportation, infrastructure, parks and other general fund services by raising Culver City's transient occupancy tax paid by hotel/motel guests from 14% to 15% until March 1, 2028, and then to 16%, generating up to approximately $2,000,000 annually until ended by voters, requiring annual audits, public spending disclosures, with all funds used locally, be adopted?"

[[section]]
id = "what"
heading = "Measure T"

[[section.line]]
text = "Measure T asks the voters of this city whether to raise the tax that hotel guests pay on their rooms."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["transient occupancy tax paid by hotel/motel guests"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "who-pays"
text = "Hotel guests staying 30 days or less pay 14 percent of the room rate, a rate set in 2012."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "bars"
title = "Culver City hotel tax rate"
source = "impartial-analysis"
unit = "%"
labels = ["Today", "March 2027", "March 2028"]
values = [14, 15, 16]

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "Measure T would raise the rate to 15 percent in March 2027, then to 16 percent in March 2028."
sources = ["impartial-analysis"]

[[section.line]]
id = "uses"
text = "The money would go to the general fund, which pays for services such as emergency response, streets and parks."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "public-funds-locked"

[[section.line]]
text = "Measure T needs a simple majority to pass."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "fiscal"
heading = "What it would raise"

[[section.line]]
id = "revenue"
text = "The impartial analysis says the city expects up to about $1 million the first year, and $2 million a year after."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say visitors, not residents, pay for services they use, and the state cannot take the money."
sources = ["argument-for"]
basis = ["Measure T asks visitors — not Culver City residents — to help pay for the services they use while they’re here.", "Unlike other revenue, this local tax cannot be taken by Sacramento."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Visitors, not residents, pay it", "The state cannot take the money"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure T was submitted, according to the county Registrar's official list of ballot measures."
sources = ["ballot-question"]

[section.line.visual]
kind = "list"
source = "ballot-question"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote raises the hotel tax to 16 percent over two years."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["from 14% to 15% until March 1, 2028, and then to 16%"]

[[section.line]]
text = "A no vote keeps the hotel tax at 14 percent."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["from 14% to 15% until March 1, 2028, and then to 16%"]

[[question]]
ask = "Who pays this tax?"
lines = ["who-pays"]

[[question]]
ask = "What would the money be used for?"
lines = ["uses"]

[[question]]
ask = "How much money would it raise?"
lines = ["revenue"]
