# Archived sources for City of Benicia Measure X, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# No printed Solano County voter guide was archived: these are the filed
# documents the Solano County Registrar of Voters posts on its Current
# Election Information page. The ballot question is quoted from
# Resolution No. 26-77, which orders it (its Section 3); the Registrar's
# corrected Notice of Measures (August 10, 2026) prints the same
# question. The City Attorney's impartial analysis is the measure's
# neutral explanation; no tax rate statement or fiscal analysis was
# posted, and the one revenue estimate is the City's, as the question
# and the analysis give it. The Registrar posted an argument in favor
# and no argument against or rebuttals.

