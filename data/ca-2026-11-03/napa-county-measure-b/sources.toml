# Archived sources for Napa County Measure B, 2026-11-03 general election
# (sources/sources.md, its section "Feed documents retrieved 2026-10-30").
# Every id here may be cited by script.toml. `kind` must be one the
# standard allows (docs/STANDARD.md, section 1).
#
# The county's Elections page for Measure B
# (https://www.napacounty.gov/2471/County-of-Napa---Measure-B, read
# 2026-10-30 in a browser; scripted fetches get HTTP 403) gave County
# Counsel's impartial analysis, the ballot title and summary, and the
# argument in favor and the argument against as filed with the Election
# Division on August 14, 2026. The two arguments are scans: each page of
# argument was typed word for word into a transcription, which those
# sources point at, with their url at the county's PDF. The rebuttals
# were not archived and are not used. The rest are the files of the
# Board of Supervisors' Legistar record for its meeting of June 16,
# 2026, item 26-1244 (item A).
#
# The resolution calling the election sets the ballot question. The copy
# archived is the agenda copy (a Word file, its number and vote left
# blank); the Legistar minutes record that the Board adopted the
# resolution that day ("Motion Text: Adopt the Resolution." ... "Result:
# Passed"), with no amendment recorded. Its text was extracted into
# sources/resolution-text.txt, which names the file and URL it copies,
# and gives the question (set in a text box beside the YES and NO boxes)
# without the boxes; those sources point at the extraction, and their url
# at the Word file. The resolution also records that no fiscal impact
# statement by the County Auditor is required.
#
# The initiative's full text is a scan with no text layer. The passages
# cited were typed from the page images into
# sources/initiative-text-transcription.txt, which names the PDF and URL
# it copies; that source points at the transcription, and its url at the
# scan. The initiative's findings (its Section 2) are the proponents'
# text and are not cited. The Registrar's certificate of sufficiency
# (a scan) is not cited: the resolution states the certification.

