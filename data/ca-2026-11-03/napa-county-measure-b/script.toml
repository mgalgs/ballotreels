sources = ["argument-against"]
basis = ["Another election cycle and another proposition for an additional sales tax increase.", "On the heels of the City of Napa’s approval of a 1% sales tax increase and the current proposed American Canyon 1% sales tax increase, we are facing an additional ½ cent increase.", "Combining the Regional Park and Open Space District with a Wildfire Preparedness agency funding request is an attempt to gain passage of new tax that had been previously defeated by voters as standalone propositions.", "Each of these agencies has separate and independent boards of directors. This blurs accountability."]

[section.line.visual]
