# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; how it reached the ballot; what
# would change (the rate and its dates, where the money goes and what it
# may pay for, the oversight, the vote it needs); the ballot question's
# revenue estimate, and that no fiscal impact statement was required;
# both sides, neither of which has an archived argument; what a vote
# does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this county", and the park district is
# "the county's regional park and open space district". The card and
# title carry the names. No person is named. "Counsel" is heard as
# "Council" (standard/speakability.txt), and no impartial analysis was
# archived anyway.
#
# No impartial analysis was archived: every neutral line rests on the
# Board's resolution (its ballot question and recitals), the Board's
# minutes and the initiative's own text, and only on what they enact or
# record, never on the initiative's findings (its Section 2), which are
# the proponents' text, nor on the ballot question's list of purposes.
# The initiative is a scan: its lines cite the transcription of the
# passages used (sources/initiative-text-transcription.txt). The vote
# needed is said as the text says it ("a majority of the electors voting
# on the measure"), not inferred from the kind of tax.
#
# The $23,000,000 a year is the ballot question's estimate, attributed to
# it; the resolution says no fiscal impact statement by the County
# Auditor is required, and none was archived. No archived source states
# the county's general fund budget, so the figure has no scale
# (STANDARD.md 6.5; left open, under [[question]]).
#
# No argument for or against Measure B was archived, and no document
# says whether any was filed (the resolution only sets the deadlines).
# So the sides do not say none was filed: each says none is among the
# documents gathered (filed = false, STANDARD.md 2.5), as for Walnut
# Creek Measure U. The county's replacement Voter Information Guide for
# Measure B is not mentioned: no archived record says what it changed.

contest = "ca-2026-11-03-napa-county-measure-b"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "B"
title = "Shall Napa County Ordinance No. 2026-01 be adopted?"
origin = "NAPA COUNTY BOARD OF SUPERVISORS"
summary = "To reduce the risk of catastrophic wildfires; remove dry brush, dead trees, and fire hazards; establish firebreaks and fire-safe evacuation routes for residents and first responders; preserve natural open spaces, and protect water quality/supplies and land around lakes, rivers, and streams; shall Napa County's one-half cent sales tax measure be adopted, providing $23,000,000 annually for 18 years, with oversight, annual audits and local control?"

