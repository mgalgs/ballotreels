# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; how it reached the ballot; what
# would change (the rate and its dates, where the money goes and what it
# may pay for, the oversight, the vote it needs); the ballot question's
# revenue estimate, and that no fiscal impact statement was required;
# both sides, from the arguments filed with the county; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this county", and the park district is
# "the regional park and open space district". The card and title carry
# the names. No person, organization or past fire is named, and no
# website. "Counsel" is heard as "Council" (standard/speakability.txt),
# so no line names County Counsel's impartial analysis aloud.
#
# The neutral lines rest on the Board's resolution (its ballot question
# and recitals), the Board's minutes, the initiative's own text and
# County Counsel's impartial analysis, which states the same facts (the
# petition, the one-half percent rate, April 1, 2027 to March 31, 2045,
# the 50/50 split between the County and the park district, the uses,
# the simple-majority vote) and contradicts none of them. Never on the
# initiative's findings (its Section 2), which are the proponents' text,
# nor on the ballot question's list of purposes. The initiative is a
# scan: its lines cite the transcription of the passages used
# (sources/initiative-text-transcription.txt). The vote needed is said as
# the text says it ("a majority of the electors voting on the measure").
#
# The $23,000,000 a year is the ballot question's estimate, attributed to
# it; the resolution says no fiscal impact statement by the County
# Auditor is required, and none was archived. No archived source states
# the county's general fund budget, so the figure has no scale
# (STANDARD.md 6.5; left open, under [[question]]).
#
# Both arguments were filed and are printed on the county's page; each
# side quotes its argument's central claims (scans, cited through their
# transcriptions). The rebuttals were not archived. The argument
# against's own rate figures (its "9.25%" and "19% increase") are its
# arithmetic only and are not narrated. The cities it names, and the
# fires and website the argument in favor names, are not narrated.

contest = "ca-2026-11-03-napa-county-measure-b"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "B"
title = "Shall Napa County Ordinance No. 2026-01 be adopted?"
origin = "NAPA COUNTY BOARD OF SUPERVISORS"
summary = "To reduce the risk of catastrophic wildfires; remove dry brush, dead trees, and fire hazards; establish firebreaks and fire-safe evacuation routes for residents and first responders; preserve natural open spaces, and protect water quality/supplies and land around lakes, rivers, and streams; shall Napa County's one-half cent sales tax measure be adopted, providing $23,000,000 annually for 18 years, with oversight, annual audits and local control?"

[[section]]
id = "what"
heading = "Measure B"

[[section.line]]
text = "Measure B asks the voters of this county whether to add a one-half percent sales tax for wildfire preparedness, watersheds and open space."
sources = ["ballot-question", "text"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["one-half cent sales tax measure"]

[[section]]
id = "today"
heading = "How it reached the ballot"

[[section.line]]
id = "petition"
text = "Measure B is a citizens' initiative, placed on the ballot by the Board of Supervisors on June 16, after its petition signatures were certified."
sources = ["ballot-question", "minutes", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "neighborhood-petition"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "dates"
text = "The tax would run from April 2027 to March 2045."
sources = ["text", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "sales-receipt"

[[section.line]]
id = "split"
text = "Half the money would go to the regional park and open space district, and half would be distributed by the Board of Supervisors."
sources = ["text", "impartial-analysis"]

[section.line.visual]
kind = "bars"
