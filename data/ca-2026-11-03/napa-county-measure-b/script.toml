[[section.line]]
id = "uses"
text = "The money would pay for wildfire preparedness, such as fuel clearing and fuel breaks, and for protecting watersheds and open space."
sources = ["text", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "hillside-brush-clearing"

[[section.line]]
