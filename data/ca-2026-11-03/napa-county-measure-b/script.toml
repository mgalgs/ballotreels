[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["providing $23,000,000 annually for 18 years"]

[[section.line]]
id = "no-statement"
text = "The resolution says no fiscal impact statement by the county auditor is required."
sources = ["ballot-question"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"
filed = true

[[section.line]]
text = "Supporters say local funding would reduce wildfire risk and protect watersheds and open space, with an oversight committee and an auditor reviewing every penny spent."
sources = ["argument-for"]
basis = ["We need locally controlled funding to ensure a safer, more resilient Napa County for all.", "MEASURE B provides dedicated, local funding to tackle three critical, interconnected goals: Wildfire Preparedness, Watershed Protection, and Open Space Preservation.", "MEASURE B reduces catastrophic wildfire risk by clearing dry brush and fire hazards, establishing firebreaks, and creating fire-safe evacuation routes.", "A citizens’ oversight committee and independent auditor will review every penny spent."]

[section.line.visual]
