# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and that it is one package; what the Charter is and how the
# measure reached the ballot; the main changes the impartial analysis
# names; that the guide gives no cost; one line per side; what a vote
# does.
#
# The ballot question lists the sections; the analysis calls them "the
# 17 sections" and the argument against "21 changes", so the narration
# gives no count. The "electors" change to Section 10-6 is not in the
# impartial analysis; both sides argue over it, so it appears only in the
# no side's line, as that side's point (STANDARD.md 6.3). The guide
# prints no fiscal analysis, so the fiscal line says it includes no cost
# estimate. The card's yes/no lines are the analysis's own sentences on
# approval and rejection.

contest = "ca-2026-11-03-alameda-measure-m"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide-page"
number = "M"
title = "Proposed City Charter Amendment Ballot Measure"
origin = "The Alameda City Council placed this Measure on the November 3 ballot to allow voters to amend numerous sections of the City Charter"
summary = "Shall the measure amending City Charter Sections 2-1.1, 2-3, 2-10, 3-7(G), 3-14, 7-2(J), 8-2, 8-5, 10-3, 10-6, 10-7, 10-12, 12-4(A) and (B), 14-1, 17-10, 28-2, 28-3 and 28-4, and repealing Sections 12-3(D) and 23-3 to conform to existing practices and amend and repeal outdated provisions be adopted?"
yes = "If approved by the voters, this Measure would conform the City Charter to existing City and City Council practices and amend and repeal outdated provisions in the Charter."
no = "If the voters do not approve the Measure, all the Charter provisions referenced in this Measure will remain the same."

