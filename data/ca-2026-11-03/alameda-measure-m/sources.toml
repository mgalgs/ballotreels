# Archived sources for City of Alameda Measure M, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1). The guide's pages are cut from the
# Alameda County Registrar of Voters' Composite Voter Information Guide
# (PDF pages 790 to 794, printed AMM-1 to AMM-5).
#
# The guide prints no fiscal analysis (not a tax measure). Some lines of
# the guide are set in a font with no Unicode map; checks._unshifted
# reads them.

