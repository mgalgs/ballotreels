# Archived sources for City of Santa Monica Measure TT, 2026-11-03 general
# election (sources/la-sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The Los Angeles County Registrar-Recorder/County Clerk's list "Measures
# Appearing on the Ballot" (sources/county-measure-list-excerpt.txt, the
# measure's entry) gives its letter, vote threshold and ballot question,
# and, on its "Supporters: ... Opponents: ..." line, who filed the
# primary arguments ("Opponents: None submitted."): the card quotes it,
# and the sides cite it as the official statement of filing. The City
# Council's resolution submitting the measure, a text PDF, gives today's
# rates and rules and the Council's stated reasons in its recitals, and
# the ordinance amending Chapter 6.68 of the Municipal Code as Exhibit 1.
# No impartial analysis and no argument text could be fetched (the
# City's site blocked downloads), and no document gathered estimates the
# measure's effect on revenue.

[contest]
id = "ca-2026-11-03-santa-monica-measure-tt"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:santa_monica"
kind = "measure"
title = "City of Santa Monica Measure TT: Hotel Tax on Company-Booked Rooms During Major Events"

