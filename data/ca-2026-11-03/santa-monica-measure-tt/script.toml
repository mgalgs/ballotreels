[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["lodging paid for or obtained by corporate entities for stays over 30 days"]

[[question]]
ask = "Would the hotel tax rate go up?"
lines = ["today-rates", "same-rates"]

[[question]]
ask = "Who would pay the tax on long stays, and when?"
