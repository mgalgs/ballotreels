# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the hotel tax today (its rates,
# and the 30-day line in who owes it) and the question companies have
# raised about long block bookings, from the resolution's recitals; the
# Council's stated reason (STANDARD.md 6.2); what would change, from the
# ordinance (Exhibit 1), in the order the ballot question lists it; that
# no cost estimate is given; who filed the argument for, and that none
# was submitted against; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". The card shows the name.
#
# The card quotes the measure's entry in the county's list "Measures
# Appearing on the Ballot", which prints no yes/no meanings, so the card
# has no boxes; the vote lines take both meanings from the question and
# highlight the same phrase.
#
# The measure keeps today's rates and sets no new tax; no impartial
# analysis was fetched and no document gathered estimates its effect on
# revenue. The fiscal line follows the no-cost-estimate wording, naming
# the county's list (the card's guide) as "the official list of measures
# from the county" ("county's" is misheard as "counties"). The rates are
# percentages, not dollar figures (STANDARD.md 6.5 does not apply).
#
# Sides: the county's list names five supporters who filed the argument
# for (a firefighters' union local, a former mayor and three others) and
# says "Opponents: None submitted." The argument for's text could not be
# fetched: its line says only who filed it and that its text was not
# gathered, nothing reconstructed. The no side says that none was
# submitted. filed = false on both (neither has text to quote as a
# `basis`); word counts kept within 5%.

contest = "ca-2026-11-03-santa-monica-measure-tt"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "TT"
title = "CITY OF SANTA MONICA"
origin = "VOTE PASSAGE – Majority Vote 50%+1"
summary = "MEASURE TT: Shall the measure, which maintains the existing transient occupancy tax rates; authorizes the City Council to establish Major Event Periods, as defined, when the tax applies to lodging paid for or obtained by corporate entities for stays over 30 days, and to adjust the hotel and motel tax rate for such stays; clarifies that refunds require a natural person to complete at least thirty-one consecutive days of occupancy, and authorizes administrative regulations, be adopted?"

[[section]]
id = "what"
heading = "Measure TT"

[[section.line]]
text = "Measure TT asks the voters of this city whether to change how the hotel tax applies to rooms that companies book for long stays."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["lodging paid for or obtained by corporate entities for stays over 30 days"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "today-rates"
text = "Today, the hotel tax is 15 percent of the room charge at hotels, and 17 percent at home-shares."
sources = ["resolution"]

[section.line.visual]
kind = "bars"
title = "Santa Monica hotel tax rates today"
source = "resolution"
unit = "%"
labels = ["Hotels", "Home-shares"]
