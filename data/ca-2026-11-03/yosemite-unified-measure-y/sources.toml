# Archived sources for Yosemite Unified School District Measure Y,
# 2026-11-03 general election (sources/sources.md). Every id here may be
# cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# The Madera County Clerk-Recorder & Registrar of Voters posts each
# measure's filed documents on its election page; the printed County
# Voter Information Guide was not found online. The ballot question is
# quoted from Exhibit B, the "Abbreviated Form" of the measure, of the
# Board of Trustees' Resolution No. 2025/2026-20 (the registrar's legal
# notice prints the same words, but pdftotext joins its line-broken
# "air-conditioning"). County Counsel's impartial analysis is the
# measure's neutral explanation, the kind a state's attorney general's
# explanatory statement is; the district's tax rate statement is its
# fiscal statement.
#
# The district lies in Madera and Mariposa Counties (the registrar's
# notice); its division is the district's own, so the measure reaches
# its voters in both.
#
# Tax rate statement: the registrar posted the $61.2 million statement
# in the Measure W filing (its PDF pages 19-20) and the Measure W
# statement in this one; the right one was cut into
# sources/tax-rate-statement_from-W-filing-p19-20.pdf (sources.md).
#
# Every PDF but the legal notice is a scan with no text layer. The
# passages cited were typed from the page images into
# sources/*-transcription.txt, each naming the PDF and URL it copies;
# those sources point at the transcription, and their url at the scan.
# The registrar posts no argument against and no rebuttals.

[contest]
id = "ca-2026-11-03-yosemite-unified-measure-y"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/school_district:yosemite_unified_school_district"
kind = "measure"
title = "Yosemite Unified School District Measure Y: $61.2 Million School Facilities Bond"

[[source]]
id = "ballot-question"
kind = "official-title-summary"
publisher = "Yosemite Unified School District, Board of Trustees Resolution No. 2025/2026-20, adopted June 18, 2026: Exhibit B, Bond Measure (Abbreviated Form), PDF page 17 (transcribed from the scan)"
credit = "Resolution No. 2025/2026-20, Yosemite Unified School District"
url = "https://votemadera.com/wp-content/uploads/2026/08/Filed-Copy-Resol-No-2025.2026-20-YUSD-Bond_Redacted.pdf"
file = "sources/resolution-transcription.txt"
retrieved = "2026-10-28"

[[source]]
