# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; how a school bond is repaid and what it
# needs to pass; what the money would pay for and what it may not; the
# district's tax statement; one line per side; what a vote does.
#
# No place or school name is narrated (the narrator mispronounces
# them): the opening says "the voters of this school district" and the
# school is "the high school". The card and title carry the names.
# "Counsel" is heard as "Council" (standard/speakability.txt), so the
# narration does not say it.
#
# The card quotes the board's own abbreviated form (Exhibit B of its
# resolution); it prints no yes and no sentences, so the card has no
# boxes and the vote lines take their meaning from the impartial
# analysis, highlighting the ballot question's words. The bond total and
# the debt service are repaid from a tax on property in the district,
# not from the district's budget, and no archived source states that
# budget, so they have no budget scale (STANDARD.md 6.5; left open), as
# Escalon Unified Measure U's do. The tax statement's average and
# highest rates are both $59.98, so the fiscal line gives the one rate.
#
# The supporters' points on the school's age and the cost of delay are
# theirs, so the neutral sections leave them out (STANDARD.md 6.3).
#
# No argument against Measure Y is among the registrar's postings. The
# no side says so plainly; its section is marked filed = false.

contest = "ca-2026-11-03-yosemite-unified-measure-y"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "Y"
title = "BOND MEASURE for YOSEMITE UNIFIED SCHOOL DISTRICT"
origin = "Yosemite Unified School District Resolution No. 2025/2026-20"
summary = "With funds that cannot be taken by the State, shall Yosemite Unified School District's measure to renovate career training classrooms; repair/replace aging roofs, heating, ventilation and air-conditioning; and update fire alarms and emergency communication systems at Yosemite High School be adopted, authorizing $61.2 million in bonds with legal rates, average levies below $60 per $100,000 of assessed valuation ($4 million annually) while outstanding, taxpayer oversight, no funds for administrator salaries, pensions, or benefits and public disclosure of all spending?"

[[section]]
id = "what"
heading = "Measure Y"

[[section.line]]
text = "Measure Y asks the voters of this school district whether to approve $61.2 million in bonds for high school projects."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["authorizing $61.2 million in bonds"]

[[section]]
id = "today"
heading = "How a school bond works"

[[section.line]]
text = "The district would borrow the money and repay it from a tax on property in the district."
sources = ["impartial-analysis", "tax-statement"]

[section.line.visual]
kind = "illustration"
name = "bond-certificates"

[[section.line]]
text = "Measure Y needs 55 percent of the vote to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "The money would repair or replace roofs and heating and cooling systems, renovate career training classrooms, and update fire alarms."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "school-roof-repair"

[[section.line]]
text = "The money could not pay teacher or administrator salaries, and a citizens' oversight committee and yearly audits would check the spending."
sources = ["impartial-analysis"]

[[section]]
id = "fiscal"
heading = "What the tax statement says"

[[section.line]]
text = "The district's tax statement estimates a tax of $59.98 per $100,000 of assessed value, from 2027-2028 through 2047-2048."
sources = ["tax-statement"]

[section.line.visual]
kind = "illustration"
name = "debt-payments"

[[section.line]]
text = "The statement estimates the total to repay, with interest, at about $84.9 million."
sources = ["tax-statement"]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say the high school is aging, needs major repairs to stay safe, and delaying will cost more."
sources = ["argument-for"]
basis = ["Yosemite High School is aging. Major repairs and updates are now needed to keep the school safe and functional.", "Delaying will make it more expensive tomorrow."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["An aging school needs major repairs", "Delaying will cost more"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure Y appears among the filings that the county elections office posted for this election."
sources = ["argument-for"]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote authorizes the district to issue $61.2 million in bonds, repaid by a yearly property tax."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["authorizing $61.2 million in bonds"]

[[section.line]]
text = "A no vote does not authorize the district to issue the bonds."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["be adopted"]
