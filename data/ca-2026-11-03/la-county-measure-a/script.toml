# Recipe E, about 60 seconds, distilled: one claim per line. The chain: what it
# asks; the rules today (no strikes, good-faith bargaining); what would
# change (more workers barred from striking, a panel picks between final
# offers, its decision binding); the Auditor-Controller's fiscal
# statement, its cost and what it cannot predict; one line per side; what
# a vote does.
#
# The card quotes the ballot label, printed only in the ordinance, which
# prints no yes/no lines (County Counsel's analysis has them, on another
# document). So, as for Utah, the card has no YES/NO boxes, the vote
# lines give the analysis's meanings, and both highlight the one phrase
# of the question they turn on.
#
# "Counsel" is heard as "Council" and "county's" as "counties"
# (standard/speakability.txt), so the narration says neither. The
# fiscal statement's $4.1 billion (current pay for covered employees) is
# left out: no archived source states the county budget that would give
# it its scale (STANDARD.md 6.5).
#
# No argument against was submitted ("NO ARGUMENT AGAINST THIS MEASURE
# WAS SUBMITTED"): the no side is filed = false, as for Proposition 37.

contest = "ca-2026-11-03-la-county-measure-a"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-label"
number = "A"
title = "LOS ANGELES COUNTY CHARTER AMENDMENT REITERATING GOOD FAITH NEGOTIATION OBLIGATIONS AND ESTABLISHING IMPARTIAL BINDING ARBITRATION FOR CERTIFIED PUBLIC SAFETY EMPLOYEE DISPUTES"
origin = "The Board of Supervisors of the County of Los Angeles ordains as follows:"
summary = "Shall the measure amending the Los Angeles County Charter to prohibit strikes by district attorney investigators, medical examiners, and lifeguards; their supervisors; and nonadministrative civilian employees working in the Fire Department, Sheriff's Department, and the Department of Medical Examiner, reiterate existing legal obligations for good faith negotiations, and establish an impartial binding arbitration process for resolving labor disputes with certified public safety employee organizations representing County employees including firefighters, sheriffs, and the abovementioned employees, as specified in the charter amendment ordinance, be adopted?"

