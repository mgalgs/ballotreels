# Archived sources for Los Angeles County Measure A, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1). Each is the Registrar-Recorder/County
# Clerk's own web copy of the measure's document; no page range of the
# printed Sample Ballot and Voter Information Pamphlet was archived.
#
# The ballot label is printed only in the ordinance (its Section 2, "The
# exact form of the measure as it is to appear on the ballot"), so the
# ordinance backs two sources: the ballot label the card quotes, and the
# full text.

[contest]
id = "ca-2026-11-03-la-county-measure-a"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/county:los_angeles"
kind = "measure"
title = "Los Angeles County Measure A: Charter Amendment Establishing Impartial Binding Arbitration for Certified Public Safety Employee Disputes"

