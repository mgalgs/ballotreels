# Archived sources for Town of Ross Measure U, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The county's Measure U page (sources/county-page.txt, saved as text
# from a browser, since the site refuses scripted fetches) prints the
# ballot question, the vote required to pass, the Town Attorney's
# impartial analysis and the argument in favor, and says that no
# argument against Measure U was filed. The other files are the Town's
# for the Town Council meeting of July 9, 2026, item 16: the staff
# report, with Resolution No. 2637 (Attachment 1) and its Exhibit A,
# Ordinance No. 736, the measure's text, all in one PDF; and the final
# minutes of that meeting, which record the resolution's adoption. The
# item was continued from June 11 to revise the ballot language; the
# question quoted is the one Section 3 of the July 9 resolution prints.
# The Town's election page (sources/ross-nov2026.html) gives the letter U.
#
# The staff report is the Town staff's material: it is cited only for
# plain facts (the current tax's end date and this year's rate). The
# resolution's recitals are cited only for the tax's history (voters
# last approved it in 2022), never for its account of the service.

