# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the tax today (this year's
# rate, when it ends, the last approval); what would change
# (the rate, how it may rise, when it ends, where the money goes, the
# vote it needs); the revenue as the ballot question gives it; both
# sides (the argument in favor; none against was filed); what a vote
# does.
#
# No place name and no person is narrated: the opening says "the voters
# of this town", and the Ross Valley Paramedic Authority is not named.
# The card and title carry the names.
# No vote count of the Council or of past elections is given.
#
# What the tax does is stated from Ordinance No. 736 (the measure's
# text) and from Resolution No. 2637, whose Section 3 prints the ballot question the card quotes and whose
# Section 4 sets the two-thirds vote; the final minutes record that the
# Council adopted it on July 9, 2026. The question was revised before
# that meeting; the July 9 resolution's wording is the one quoted, and
# the county's Measure U page prints the same question (the card is left
# as it was). The page also prints the Town Attorney's impartial
# analysis, which agrees with every neutral line and is cited beside the
# ordinance where it states the same thing. The resolution prints only bare Yes and No cells, so the card has no
# YES/NO boxes and both vote lines highlight the same phrase. The
# resolution's recitals are used only for the last approval (2022); the staff report only for
# this year's rate and the current tax's end date. Neither one's account
# of the service's quality is used.
#
# The ballot question lists "annual audits, public spending disclosure";
# the ordinance's amended sections set neither, so the script narrates
# neither (the phrase stays on the card).
#
# The $111,000 a year is the ballot question's figure. No archived
# source states the Town's general fund budget, so it has no scale
# (STANDARD.md 6.5; left open, under [[question]]).
#
# The county's page prints an argument in favor of Measure U and says
# "No argument against Measure U was filed." It is not the text the
# other five paramedic tax measures print; the yes side distils its own
# points (its signers are not named). The no side says, as the county
# does, that none was filed (filed = false, STANDARD.md 2.5), as for
# California Proposition 1.

contest = "ca-2026-11-03-ross-measure-u"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "U"
title = "A MEASURE AUTHORIZING THE CONTINUATION OF A SPECIAL PARCEL TAX FOR PARAMEDIC SERVICES"
origin = "TOWN OF ROSS"
summary = "To maintain local ambulance services staffed by paramedics available to respond to 9-1-1 emergencies, shall the Ross Valley Paramedic Authority measure be adopted continuing for four years the paramedic services special tax of up to $107.50/residential living unit or 1,000 square feet of developed nonresidential property, adjusted up to $4/year, generating approximately $111,000 annually, with annual audits, public spending disclosure and all funds for local paramedic services?"

[[section]]
id = "what"
heading = "Measure U"

[[section.line]]
id = "asks"
text = "Measure U asks the voters of this town whether to continue a special tax for paramedic services for four more years."
sources = ["ballot-question", "text"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["continuing for four years the paramedic services special tax"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "current"
text = "A town staff report says this year's rate is $103.50, and the current tax ends in June 2027."
sources = ["staff-report", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "end-date"

[[section.line]]
id = "history"
text = "The resolution placing Measure U on the ballot says voters here last approved the tax in 2022."
sources = ["resolution", "minutes"]

[section.line.visual]
kind = "illustration"
name = "city-council-chamber"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "rate"
text = "The tax would be $107.50 a year for each home, and the same for each 1,000 square feet of other buildings."
sources = ["text", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "single-family-street"

[[section.line]]
id = "raise"
text = "The town council could raise the rate by up to $4 a year, to no more than $118 in the last year."
sources = ["text", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "special-tax"

[[section.line]]
id = "uses"
text = "The tax would end on June 30, 2031, and the ballot question says all funds would go to local paramedic services."
sources = ["text", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "valley-town-ambulance"

[[section.line]]
id = "threshold"
text = "Measure U needs two-thirds of the vote to pass."
sources = ["resolution", "text", "county-page", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "fiscal"
heading = "What it would raise"

[[section.line]]
id = "revenue"
text = "The ballot question says the tax would raise about $111,000 a year."
