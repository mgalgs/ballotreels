# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks; the tax today and when it ends; what would change (it continues
# until voters end it, what the money may pay for, the oversight
# committee); the two-thirds vote; the ballot question's revenue
# estimate; one line per side; what a vote does.
#
# The card quotes the ballot question from the Board of Supervisors'
# resolution (the guide prints none), which has no yes/no lines; as for
# Los Angeles County Measure A, the vote lines give County Counsel's
# Impartial Analysis's meanings and both highlight the phrase of the
# question they turn on. "Counsel" is heard as "Council"
# (standard/speakability.txt), so the narration says "the county
# attorney's impartial analysis".
#
# The ballot question's $250 million a year has no scale: no archived
# source states the Transportation Authority's budget (STANDARD.md 6.5;
# left open). The supporters' "does not increase taxes" and matching
# funds are their argument and stay in their section (STANDARD.md 6.3);
# the neutral lines say the rate stays the same only as the analysis
# does ("continue levying the already voter approved" tax).
#
# No argument against is printed in the guide (the Registrar's measures
# page: "No Argument Against was filed."): the no side is filed = false.

contest = "ca-2026-11-03-san-bernardino-county-measure-i"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-label"
number = "I"
title = "LOCAL TRANSPORTATION IMPROVEMENT PROGRAM"
origin = "RESOLUTION OF THE BOARD OF SUPERVISORS OF SAN BERNARDINO COUNTY CALLING A SPECIAL ELECTION AND SUBMITTING MEASURE I"
summary = "Without raising tax rates, shall an ordinance to fund repairing potholes; keeping local roads in good condition; completing freeway/highway projects to improve traffic flow/safety, reduce traffic bottlenecks; upgrading aging bridges/overpasses; creating local jobs; keeping student/senior/disabled/veteran transit fares low be adopted, extending the ½¢ voter-approved transportation sales tax, providing approximately $250,000,000 annually until ended by voters, requiring audits, oversight, spending disclosure, local control?"

[[section]]
id = "what"
heading = "Measure I"

[[section.line]]
text = "San Bernardino County Measure I asks county voters whether to extend the half-cent sales tax for transportation."
sources = ["ballot-label"]

[section.line.visual]
kind = "page"
source = "ballot-label"
highlight = ["extending the ½¢ voter-approved transportation sales tax"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Voters approved the current half-cent transportation sales tax in 2004, and it ends in March 2040."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "end-date"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "Measure I would keep the tax going after 2040, until voters end it."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "extend-deadline"

[[section.line]]
text = "The money could pay only for streets, roads, highways, freeways and public transit."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "open-road"

[[section.line]]
text = "An oversight committee would keep checking that the money follows the spending plan."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "recurring-review"

[[section.line]]
text = "Measure I needs two-thirds of the vote to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "fiscal"
heading = "What it would raise"

[[section.line]]
text = "The ballot question says the tax would provide about $250 million a year."
