# Archived sources for San Bernardino County Measure I, 2026-11-03
# general election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1). The guide's pages are cut from the San
# Bernardino County Registrar of Voters' comprehensive Voter Information
# Guide (VIG.pdf, PDF pages 210-221); "page" is the guide's printed
# footer number (SB COMPREHENSIVE-208 is PDF page 210).
#
# The guide prints no ballot question; the card quotes it from the Board
# of Supervisors' resolution calling the election, which sets out the
# measure "as it shall appear upon the ballot".

[contest]
id = "ca-2026-11-03-san-bernardino-county-measure-i"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/county:san_bernardino"
kind = "measure"
title = "San Bernardino County Measure I: Extending the Half-Cent Transportation Sales Tax"

