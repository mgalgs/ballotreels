# Archived sources for Grossmont-Cuyamaca Community College District Measure G,
# 2026-11-03 general election (sources/sources.md). Every id here may be
# cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1). The guide's pages are cut from the San
# Diego County Registrar of Voters' Voter Information Guide (ballot type
# 365); "page" is the guide's printed footer number.
#
# One guide page prints the ballot label, County Counsel's Impartial
# Analysis and the Tax Rate Statement; each is its own source.
#
# A community college district has no Census boundary, so the measure's
# division is the county and `voters` names the district
# (docs/SCRIPT-FORMAT.md). The district lies in San Diego County only, as
# its resolution names it ("Grossmont-Cuyamaca Community College District
# of San Diego County"), so it has one contest.

[contest]
id = "ca-2026-11-03-grossmont-cuyamaca-measure-g"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/county:san_diego"
kind = "measure"
title = "Grossmont-Cuyamaca Community College District Measure G: College Facility Bonds"
voters = "the Grossmont-Cuyamaca Community College District"

[[source]]
id = "ballot-label"
kind = "official-title-summary"
publisher = "San Diego County Registrar of Voters, Voter Information Guide, page SD 365-080: ballot label of Measure G"
credit = "Ballot label, San Diego County Voter Information Guide"
url = "https://www.sdvote.com/content/dam/rov/en/sb/SB-ENG-365.pdf"
file = "sources/vig365-p82-ballot-label-impartial-analysis-tax-rate-statement.pdf"
retrieved = "2026-10-28"

