# Archived sources for Columbia Elementary School District Measure D,
# 2026-11-03 general election (sources/county-sources.md). Every id here
# may be cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# Shasta County Elections prints each local measure's ballot question,
# impartial analysis, arguments, full text and tax rate statement in its
# County Voter Information Guide; each file here is that measure's pages
# cut from one ballot type's guide (BT24), whose page numbers each
# citation gives. The card quotes the ballot question page. County
# Counsel's impartial analysis is the measure's neutral explanation, the
# kind a state's attorney general's explanatory statement is; the
# district's tax rate statement is its fiscal statement. The ballot
# question page's "For and Against" box reads "Against None Submitted"
# (its header misprints "Measure C"; the guide's own error).

[contest]
id = "ca-2026-11-03-columbia-elementary-measure-d"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/school_district:columbia_elementary_school_district"
kind = "measure"
title = "Columbia Elementary School District Measure D: $11.5 Million School Facilities Bond"

[[source]]
