# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; how a citizens' initiative reached
# the ballot; what would change (how the tax is charged and for how long,
# what the money may pay for and what not, the oversight, the vote it
# needs); the district's revenue estimate; one line per side; what a vote
# does.
#
# No place name is narrated (the narrator mispronounces them): the opening
# says "the voters of this healthcare district", and the supporters' line
# "this county". The card, the title and the "Only voters in ..." line
# carry the names; the hospital is not named. No person is named.
# "Counsel" is heard as "Council" (standard/speakability.txt), so the
# narration says "the impartial analysis", never whose it is. The rate
# (14 cents a square foot) is left to the card: an amount under a dollar
# is transcribed either way (standard/speakability.txt).
#
# Every neutral line rests on the impartial analysis and the guide's
# ballot question, except the oversight committee, which the initiative's
# own text sets up (its Section 3, Section 6) and the ballot question
# names ("citizens' committee oversight"). The threshold is said as the
# county's Measure CC page states it ("simple majority"). The
# initiative's findings (its Section 2) are the proponents' text and are
# not cited. That the district may pledge the tax to repay bonds (the
# text's Section 3, Section 1 F) is the opponents' point, so it is left
# to them (STANDARD.md 6.3) and not narrated.
#
# The $12.4 million a year is the impartial analysis's estimate ("The
# Marin Healthcare District estimates revenue ..."), attributed to the
# district. No archived source states the district's budget, so the
# figure has no scale (STANDARD.md 6.5; left open, under [[question]]).
#
# Sides: the arguments as printed in the guide. The supporters' line
# distils the argument in favor's trauma-center and safety-standards
# claims; the opponents' line the argument against's square-foot and
# exemption claims. The rebuttals are not cited.

contest = "ca-2026-11-03-marin-healthcare-measure-cc"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide-page"
number = "CC"
title = "Marin Healthcare District - Emergency Healthcare Funding Measure"
origin = "This Measure was placed on the ballot following submission of a voter initiative petition containing the number of signatures required by law."
summary = "Shall the measure funding expanded and upgraded emergency room, intensive care, hospital, and other medical facilities to care for trauma, heart attack, stroke, and other patients and attract qualified doctors and nurses, with no funds for administrator salaries, by enacting a parcel tax of 14¢ per square foot of improved building area annually, generating approximately $12,400,000 annually for 30 years, subject to annual audits and citizens’ committee oversight, be adopted?"

[[section]]
id = "what"
heading = "Measure CC"

[[section.line]]
text = "Measure CC asks the voters of this healthcare district whether to adopt a 30-year parcel tax on buildings for emergency, intensive care and hospital facilities."
sources = ["guide-page", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["by enacting a parcel tax of 14¢ per square foot of improved building area annually"]

[[section]]
id = "today"
heading = "How it reached the ballot"

[[section.line]]
id = "petition"
text = "Measure CC is a citizens' initiative, placed on the ballot by a voter petition."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "neighborhood-petition"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "rate"
text = "The tax would be charged each year on each square foot of building area on a parcel, for 30 years."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "city-parcels"

[[section.line]]
id = "uses"
text = "The money could expand and modernize intensive care, trauma, triage and hospital facilities, and add emergency room and patient room capacity."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "valley-hospital"

[[section.line]]
id = "staff"
text = "It could also pay to hire and keep doctors and nurses, but not administrator salaries."
sources = ["impartial-analysis"]

[[section.line]]
id = "oversight"
text = "A committee of district residents would report each year on whether the money is spent as the measure requires, with a yearly independent audit."
sources = ["text"]

[section.line.visual]
kind = "illustration"
name = "inspection-clipboard"

[[section.line]]
id = "threshold"
text = "As an initiative, Measure CC needs a simple majority to pass."
sources = ["county-page", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "fiscal"
heading = "What it would raise"

[[section.line]]
id = "revenue"
text = "The district estimates the tax would raise about $12.4 million a year on average."
sources = ["impartial-analysis", "guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["generating approximately $12,400,000 annually for 30 years"]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say the hospital is the only trauma center in this county, and without investment it risks falling behind safety standards and losing services."
sources = ["argument-for"]
basis = ["MarinHealth Medical Center is the only designated trauma center in Marin County", "Without investment, our hospital risks falling behind safety standards and losing critical services."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["The only designated trauma center", "Keeps up with safety standards"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say charging by the square foot makes a modest house pay like a mansion, with no senior or low-income exemption, atop current bills."
sources = ["argument-against"]
basis = ["It’s crazy to charge by the square foot, not by what a home is worth: a modest house pays like a mansion.", "Atop your current bill, a 2,000-square-foot home pays $280 more yearly, $8,400 total, with no senior or low-income exemption."]

[section.line.visual]
kind = "list"
source = "argument-against"
items = ["A modest house pays like a mansion", "No senior or low-income exemption"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote adopts the parcel tax for 30 years."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["be adopted"]

[[section.line]]
text = "A no vote does not adopt the tax."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["be adopted"]

[[question]]
ask = "Who put this on the ballot?"
lines = ["petition"]

[[question]]
ask = "How is the tax charged, and for how long?"
lines = ["rate"]

[[question]]
ask = "What can the money pay for?"
lines = ["uses", "staff"]

[[question]]
ask = "Who checks the spending?"
lines = ["oversight"]

[[question]]
ask = "What vote does the measure need to pass?"
lines = ["threshold"]

[[question]]
ask = "How big is $12.4 million a year next to the district's budget?"
unanswered = true
