# Archived sources for Marin Healthcare District Measure CC, the Emergency
# Healthcare Funding Measure, 2026-11-03 general election
# (sources/sources.md, its section "Feed documents retrieved
# 2026-10-30"). Every id here may be cited by script.toml. `kind` must be
# one the standard allows (docs/STANDARD.md, section 1).
#
# Who votes: a healthcare district has no Census boundary, so the
# division is the county and `voters` names the district
# (docs/SCRIPT-FORMAT.md), as for Bear Valley Community Services District
# Measure R.
#
# The County of Marin's Voter Information Guide and Sample Ballot (ballot
# type 26, which covers part of the district) prints Measure CC's ballot
# question, County Counsel's impartial analysis, the arguments for and
# against, both rebuttals and the Full Text of Measure CC (the initiative
# ordinance). The card quotes the guide's ballot question. County
# Counsel's impartial analysis is the measure's neutral explanation, the
# kind a state's attorney general's explanatory statement is. No fiscal
# statement is printed: the revenue estimate is the impartial analysis's.
#
# The guide's text layer is partly garbled (a font with a broken
# character map), so the passages cited were typed from the page images
# into sources/county-vig-bt26-measure-cc-transcription.txt, which names
# the PDF, its pages and the guide's URL; the guide's sources point at the
# transcription, and their url at the guide. The county's Measure CC page
# (its text layer is clean) prints the same question, without the
# measure's name the guide sets before it, and the same analysis, and the
# vote the measure needs ("Votes required to pass: simple majority."),
# which the guide does not print.

[contest]
id = "ca-2026-11-03-marin-healthcare-measure-cc"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/county:marin"
kind = "measure"
title = "Marin Healthcare District Measure CC: A 30-Year Parcel Tax for Emergency, Intensive Care and Hospital Facilities"
voters = "the Marin Healthcare District"

