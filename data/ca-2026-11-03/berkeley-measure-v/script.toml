# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and of whom; who put it on the ballot and what it needs to pass;
# what would change (the rate, when it starts and ends, where the money
# goes); the impartial analysis's revenue estimate; one line per side;
# what a vote does.
#
# The guide prints no fiscal analysis or tax rate statement (not a
# bond); the one revenue estimate is the city's, in the ballot question
# and the City Attorney's Impartial Analysis. No archived source states
# the city's general fund budget (the "annual budget approaching $1
# billion" is the opponents' rebuttal, not an official total), so the
# estimate has no scale (STANDARD.md 6.5; left open). The range is said
# in words, as speakability.txt asks of a dollar range. The card's
# yes/no lines are the analysis's own.
#
# That the money goes to the general fund, for any city purpose, is how
# the analysis defines a general tax, so the change section says it;
# the opponents' point that it is not dedicated to the services
# supporters name stays in their list.

contest = "ca-2026-11-03-berkeley-measure-v"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide-page"
number = "V"
title = "CITY OF BERKELEY MEASURE V"
origin = "This measure was placed on the ballot by the City Council of the City of Berkeley."
summary = "Shall the measure levying a 0.5% sales tax in Berkeley, increasing the total sales tax rate in the City to 10.75%, estimated to generate $9,000,000 to $10,000,000 annually, with proceeds placed into the General Fund for general City uses, including but not limited to sustaining fire, police and 911 dispatch services, youth and senior services, and community programs, until ended by the voters, with independent audits, be adopted?"
yes = "A “Yes” vote is a vote in favor of the tax."
no = "A “No” vote is a vote against the tax."

[[section]]
id = "what"
heading = "Measure V"

[[section.line]]
text = "City of Berkeley Measure V asks voters in the city whether to add a half-cent sales tax."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["0.5% sales tax"]

[[section]]
id = "today"
heading = "How it reached the ballot"

[[section.line]]
text = "The City Council placed Measure V on the ballot, and it needs a simple majority to pass."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "ballot-box"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "The total sales tax rate in Berkeley would rise to 10.75 percent, from April 2027 until voters repeal it."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "city-storefronts"

[[section.line]]
text = "The money would go into the general fund, and could be spent on any city purpose."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "state-budget"

[[section]]
id = "fiscal"
heading = "What the impartial analysis says"

[[section.line]]
text = "The City Attorney's impartial analysis says the city estimates the tax will raise nine million to ten million dollars a year."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "income-taxes"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Measure V would prevent forced cuts to fire and police, prevent a fire station closure, and maintain emergency response."
sources = ["arguments"]
basis = ["Your Yes on V vote would prevent forced cuts on Fire and Police Departments from the recent budget shortfall, prevent the closure of Fire Station 4, and maintain the 911 emergency response and neighborhood safety patrols we rely upon."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Prevents cuts to fire, police and 911 service", "Protects youth programs, parks and public spaces"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say the permanent sales tax is regressive, and would fall hardest on students, low-income households, seniors and working families."
sources = ["arguments"]
basis = ["This measure would permanently increase Berkeley’s sales tax from 10.25% to 10.75%, regressive taxation that falls hardest on students, low-income households, seniors, and working families."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Regressive, hardest on low-income households", "Money not dedicated to police and fire"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote is a vote in favor of the tax."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["in favor of the tax"]

[[section.line]]
text = "A no vote is a vote against the tax."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["against the tax"]
