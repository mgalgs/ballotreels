# Archived sources for City of Los Angeles Initiative Ordinance FD
# (scripted as Measure FD, the site's convention), 2026-11-03 general
# election (sources/sources.md). All four come from one cut of the City
# Clerk's Voter Information Pamphlet, edition 201: the PDF's pages 12 and
# 90 to 111, the pamphlet's printed pages 10 (Ballot Summary) and 88 to
# 109.
#
# The Chief Legislative Analyst's Impartial Summary is the measure's
# neutral explanation, and the City Administrative Officer's Financial
# Impact Statement its fiscal analysis. Both sides argued, and both
# rebuttals were filed: the argument in favor (pages 90 to 92), the
# rebuttal to it (93 to 94), the argument against (95 to 96) and the
# rebuttal to that (97 to 98).

