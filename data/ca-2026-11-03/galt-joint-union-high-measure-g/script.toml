# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and of whom; how a school bond is repaid and what it needs to
# pass; what the money would pay for; the district's tax statement; one
# line per side; what a vote does.
#
# The card's title is the item's own head on the county's Current
# Measure Information page; its origin and yes and no lines are County
# Counsel's Impartial Analysis. "Counsel" is heard as "Council"
# (standard/speakability.txt), so the narration does not say it. The
# bond total and the debt service are repaid from a tax on property in
# the district, and no archived source states the district's budget, so
# they have no budget scale (STANDARD.md 6.5; left open). The fiscal line
# gives the tax statement's highest rate beside its average, as it
# prints both, with both years in full.
#
# The supporters' points on local control ("cannot be taken by the
# State") are theirs, so the neutral sections leave them to the card
# (STANDARD.md 6.3).
#
# No argument against Measure G was filed. The no side says so plainly;
# its section is marked filed = false.

contest = "ca-2026-11-03-galt-joint-union-high-measure-g"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-label"
number = "G"
title = "Measure G: Galt Joint Union High School District"
origin = "Measure G was placed on the ballot by the governing board of the Galt Joint Union High School District (“District”)."
summary = "Galt Joint Union High School District, Repair/Safety and Vocational Training Measure. To upgrade classrooms to maintain quality education/school safety by preparing students for skilled trades including welding/construction/plumbing; repairing leaky roofs; removing asbestos/mold; shall Galt Joint Union High School District’s measure be adopted, authorizing $43,000,000 in bonds at legal rates, levying $30 per $100,000 of assessed valuation, generating $3,100,000 annually, while bonds are outstanding, prohibiting funds for administrators salaries/pensions, requiring independent citizens’ oversight, audits, all funds locally controlled?"
yes = "A “YES” vote on Measure G means you wish to allow the District to issue bonds in an amount not to exceed $43 million dollars."
no = "A “NO” vote on Measure G means you do not wish to allow the District to issue the proposed bonds."

[[section]]
id = "what"
heading = "Measure G"

[[section.line]]
text = "Galt Joint Union High School District Measure G asks the district's voters whether to approve $43 million in high school bonds."
sources = ["ballot-label"]

[section.line.visual]
kind = "page"
source = "ballot-label"
highlight = ["$43,000,000 in bonds"]

[[section]]
id = "today"
heading = "How a school bond works"

[[section.line]]
text = "The district would borrow the money and repay it from a tax on property in the district."
sources = ["tax-statement"]

[section.line.visual]
kind = "illustration"
name = "bond-certificates"

[[section.line]]
text = "Measure G needs 55 percent of the vote to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "The money would upgrade classrooms to train students in trades like welding, construction and plumbing, repair leaky roofs, and remove asbestos and mold."
sources = ["ballot-label"]

[section.line.visual]
kind = "illustration"
name = "school-workshop"

[[section]]
id = "fiscal"
heading = "What the tax statement says"

[[section.line]]
text = "The district's tax statement estimates an average tax of $29.62 per $100,000 of assessed value, and at most $30, through 2055-2056."
sources = ["tax-statement"]

[section.line.visual]
kind = "illustration"
name = "debt-payments"

[[section.line]]
text = "The statement estimates the total to repay, with interest, at about $94 million."
sources = ["tax-statement", "impartial-analysis"]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Measure G expands trades training with local funds the state cannot take."
sources = ["arguments"]
basis = ["Measure G will upgrade and expand career vocational education programs with the equipment and classrooms needed to offer job training in good-paying fields including agriculture, engineering, and skilled trades including welding.", "All funds under local control and cannot be taken by the State", "Measure G provides dedicated local funding."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Expands skilled trades job training", "Local funds the state cannot take"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure G was filed with Sacramento County Voter Registration and Elections."
sources = ["arguments"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote allows the district to issue up to $43 million in bonds."
sources = ["ballot-label"]

[section.line.visual]
kind = "page"
source = "ballot-label"
highlight = ["you wish to allow the District to issue bonds"]

[[section.line]]
text = "A no vote does not allow the district to issue the proposed bonds."
sources = ["ballot-label"]

[section.line.visual]
kind = "page"
source = "ballot-label"
highlight = ["you do not wish to allow the District to issue the proposed bonds"]
