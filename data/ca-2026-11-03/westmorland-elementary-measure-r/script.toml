# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; how a school bond is repaid and what it
# needs to pass; what the money would pay for and what it may not; the
# district's tax rate statement; both sides, neither of which has an
# archived argument; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this school district", and the ballot
# question's one school is not named. The card and title carry the
# names. "Counsel" is heard as "Council" (standard/speakability.txt), so
# the narration does not say it, and the statement's "2056-2057" is
# written in full.
#
# The card quotes the ballot question as the Registrar's Measure R PDF
# prints it, with blank Yes and No lines and no yes/no sentences. So the
# card has no boxes, its origin is the impartial analysis's sentence
# placing the measure, the vote lines give the analysis's meanings, and
# both highlight the same phrase of the question.
#
# The tax rate is the statement's own figure, $24.86 per $100,000 (its
# average and highest rates are the same); the ballot question and the
# impartial analysis round it to $25, which the card shows as printed.
# The bond total and the debt service are repaid from a tax on property
# in the district, not from the district's budget, and no archived
# source states that budget, so they have no budget scale (STANDARD.md
# 6.5; left open), as Alview-Dairyland Measure V's do.
#
# No argument for or against Measure R was archived: the Registrar's
# Measure R PDF prints none, and with no full guide posted it is not
# known whether any was filed. So each side says none is printed in the
# posted pages (filed = false, STANDARD.md 2.5).

contest = "ca-2026-11-03-westmorland-elementary-measure-r"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "R"
title = "Westmorland Union Elementary School District Bond Measure"
origin = "This measure was placed on the ballot by the governing board of Westmorland Union Elementary School District"
summary = "To improve athletic facilities at Westmorland Elementary School; repair restrooms; upgrade outdated heating, ventilation, and electrical systems; repair, construct, acquire classrooms, sites and equipment, shall the Westmorland Union Elementary School District’s measure be adopted to issue $2,800,000 of bonds at legal rates, levy approximately $25/$100,000 of assessed value, generating approximately $218,799 annually while bonds are outstanding, with annual audits, independent citizens’ oversight, NO money for salaries, all money staying local?"

[[section]]
id = "what"
heading = "Measure R"

[[section.line]]
text = "Measure R asks the voters of this school district whether to approve $2.8 million in school bonds."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["to issue $2,800,000 of bonds"]

[[section]]
id = "today"
heading = "How a school bond works"

[[section.line]]
id = "repaid"
text = "The district would sell the bonds and repay them from a tax on property in the district."
sources = ["tax-statement", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "bond-certificates"

[[section.line]]
text = "Measure R needs 55 percent of the vote to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "projects"
text = "The money would go to classrooms, a gymnasium for school and community use, restrooms, and heating, ventilation and electrical systems."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "school-gym"

[[section.line]]
id = "limits"
text = "Bond money could not pay salaries, and a citizens' oversight committee and yearly audits would check the spending."
sources = ["impartial-analysis"]

[[section]]
id = "fiscal"
heading = "What the tax statement says"

[[section.line]]
id = "rate"
text = "The district's tax statement estimates $24.86 per $100,000 of assessed value each year, through 2056-2057."
sources = ["tax-statement"]

[section.line.visual]
kind = "illustration"
name = "debt-payments"

[[section.line]]
id = "total"
text = "The statement estimates the total to repay, with interest, at about $6.35 million."
sources = ["tax-statement"]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"
filed = false

[[section.line]]
text = "No argument for Measure R is printed in its posted pages."
sources = ["ballot-question"]

[section.line.visual]
kind = "list"
source = "ballot-question"
items = ["No argument for was printed"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure R is printed in its posted pages."
sources = ["ballot-question"]

[section.line.visual]
kind = "list"
source = "ballot-question"
items = ["No argument against was printed"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote authorizes the district to issue the bonds."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["to issue $2,800,000 of bonds"]

[[section.line]]
text = "A no vote does not authorize the district to issue the bonds."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["to issue $2,800,000 of bonds"]

[[question]]
ask = "Who pays for the bonds, and for how long?"
lines = ["repaid", "rate"]

[[question]]
ask = "What would the money pay for?"
lines = ["projects", "limits"]
