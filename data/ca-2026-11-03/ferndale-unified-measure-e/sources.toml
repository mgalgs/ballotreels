# Archived sources for Ferndale Unified School District Measure E,
# 2026-11-03 general election (sources/sources.md). Every id here may be
# cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# The Humboldt County Office of Elections prints Measure E's impartial
# analysis by County Counsel (page 15) and an argument in favor (page
# 16) in its Full Voter Information Guide; it prints no argument
# against, no rebuttals and no ballot question (its sample ballot pages
# are placeholders). The ballot question (Appendix B, "Abbreviated Form
# of Bond Measure") and the district's tax rate statement (Appendix C)
# are in the county's packet for the measure; those pages are a scan
# with no text layer, so they were typed from the page images into
# sources/appendix-b-c-transcription.txt, whose url is the scan's (as
# Dixon Unified Measure U's tax statement is). The full text (Appendix
# A, the project list) is also only a scan and is not cited: the
# analysis states what the project list covers.

[contest]
id = "ca-2026-11-03-ferndale-unified-measure-e"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/school_district:ferndale_unified_school_district"
kind = "measure"
title = "Ferndale Unified School District Measure E: Career Technical Education Facility Bonds"

[[source]]
