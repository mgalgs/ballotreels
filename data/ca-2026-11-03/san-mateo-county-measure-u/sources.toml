# Archived sources for San Mateo County Measure U, 2026-11-03
# consolidated general election (sources/sources.md). Every id here may
# be cited by script.toml. Each is a document San Mateo County's
# Assessor-County Clerk-Recorder & Elections (ACRE) posts on its election
# page; the county publishes no single pamphlet file, so each source
# names its own document.
#
# Measures L, AA, J and U are four charter amendments the Board of
# Supervisors placed on the ballot in one resolution, No. 081882, which
# prints each one's ballot question and new charter text; the same file
# backs the card's source (the ballot question) and the full text. The
# impartial analysis is a scan with no text layer, headed "IMPARTIAL
# ANALYSIS OF MEASURE [TBD]" and printing no author (the resolution
# assigns it to the County Attorney's Office); nothing in the script
# quotes it verbatim, so it is cited as archived. The argument in favor
# is a scan with no text layer too; its text, which the yes side's
# basis quotes, was typed from the page image into
# sources/argument-for-transcription.txt (naming the PDF and URL it
# copies), and that source points at the transcription. No argument
# against is among the documents the county posted.

