# Archived sources for City of Rocklin Measure C, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# Placer County Elections publishes no combined guide document; it posts
# each measure's guide pages as one PDF, headed "MEASURE C" and "1/2%
# TRANSACTIONS AND USE (SALES) TAX", paged MC1 to MC6. One PDF backs
# every source here. The City Attorney's Impartial Analysis is the
# measure's neutral explanation, of the kind the other Placer County
# measures give it, and gives the one revenue estimate; a sales tax has
# no tax rate statement. No argument against was submitted.

[contest]
id = "ca-2026-11-03-rocklin-measure-c"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:rocklin"
kind = "measure"
title = "Rocklin Measure C: Half-Cent Sales Tax for General City Services"

