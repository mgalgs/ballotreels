# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and of whom; how a hospital district bond is repaid and what it
# needs to pass; what the money would pay for; the district's tax
# statement; one line per side; what a vote does.
#
# The guide's Full Text prints the ballot question (the card's title);
# County Counsel's Impartial Analysis, on the same pages, gives the card's
# origin, summary and yes and no lines. A hospital district bond needs
# two-thirds of the vote, as the analysis says, not a school bond's 55
# percent. "Counsel" is heard as "Council" (standard/speakability.txt).
# The bond total and the debt service are repaid from a tax on property
# in the district, and no archived source states the district's budget,
# so they have no budget scale (STANDARD.md 6.5; left open). The fiscal
# line gives the tax statement's highest rate beside its average, as it
# prints both.
#
# No argument against Measure Q was filed. The no side says so plainly;
# its section is marked filed = false.

contest = "ca-2026-11-03-sb-mountains-hospital-measure-q"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide-page"
number = "Q"
title = "To repair and upgrade 75-year-old Mountains Community Hospital including: fixing deteriorating roofs, plumbing, electrical, and safety systems; upgrading/expanding emergency department, medical technology, and treatments; and maintaining local access to life-saving emergency medical care for accidents, heart attacks, strokes, and other emergencies, shall San Bernardino Mountains Community Hospital District's measure be adopted authorizing $61,000,000 in bonds at legal rates, levying $25 per $100,000 assessed value ($3,500,000 annually) while bonds are outstanding, with independent oversight and all money locally-controlled?"
origin = "This Measure was placed on the ballot by a resolution adopted by the Board of Directors of the San Bernardino Mountains Community Hospital District (District)."
summary = "The bond proceeds may only be used for specific projects listed in \"Exhibit B\" of the Measure."
yes = "A \"yes\" vote by at least two-thirds of the voters voting on this Measure will authorize the District to issue bonds in the amount of up to $61,000,000 to be used solely for the purposes set forth in this ballot Measure."
no = "A \"no\" vote means that the District will not be authorized to issue and sell up to $61,000,000 in bonds set forth in the Measure."

[[section]]
id = "what"
heading = "Measure Q"

[[section.line]]
text = "San Bernardino Mountains Community Hospital District Measure Q asks the district's voters whether to approve $61 million in hospital bonds."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["authorizing $61,000,000 in bonds"]

[[section]]
id = "today"
heading = "How a hospital bond works"

[[section.line]]
text = "The district would borrow the money and repay it from a tax on property in the district."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "bond-certificates"

[[section.line]]
text = "Measure Q needs two-thirds of the vote to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "The money would go to listed projects, such as a new emergency department and acute care wing, and earthquake safety upgrades at the hospital."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "mountain-hospital"

[[section]]
id = "fiscal"
heading = "What the tax statement says"

[[section.line]]
text = "The district's tax statement estimates an average tax of $23.37 per $100,000 of assessed value, and at most $25, through 2055-2056."
sources = ["tax-statement"]

[section.line.visual]
kind = "illustration"
name = "debt-payments"

[[section.line]]
