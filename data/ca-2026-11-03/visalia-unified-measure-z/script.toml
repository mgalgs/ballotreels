# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; how a school bond is repaid and what it
# needs to pass; what the money would pay for and what it may not; the
# district's tax rate statement; both sides, neither of which has an
# archived argument; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this school district". The card and title
# carry the names.
#
# The county guide could not be fetched, so no impartial analysis was
# archived. The card quotes the ballot question from the Registrar's
# notice of election, which prints "BONDS YES BONDS NO" and no yes/no
# sentences, so the card has no boxes and both vote lines highlight the
# same phrase of the question. Every line on what the bonds would do
# rests on Exhibit A of Resolution No. 26-27-05 as the Registrar posted
# it, and only on its project list and its rules, never on its "Goals
# and Purpose" paragraphs or the Board's list of what the District
# "must" do, which are the District's case for the bonds. The
# statement's "2051-52" is written in full.
#
# The bond total and the debt service are repaid from a tax on property
# in the district, not from the district's budget, and no archived
# source states that budget, so they have no budget scale (STANDARD.md
# 6.5; left open), as Meadows Union Elementary Measure P's do.
#
# No argument for or against Measure Z was archived, and no document
# says whether any was filed. So the sides do not say none was filed:
# each says none is among the documents gathered (filed = false,
# STANDARD.md 2.5), as for Walnut Creek Measure U.

contest = "ca-2026-11-03-visalia-unified-measure-z"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "notice"
number = "Z"
title = "Visalia Unified School District Special Bond Information"
origin = "PUBLICATION NOTICE OF SPECIAL BOND ELECTIONS"
summary = "To provide safe, modern schools by removing asbestos/lead pipes; continuing to provide safe drinking water; fixing deteriorating roofs, plumbing, HVAC, electrical systems; and repairing/upgrading aging classrooms, labs, career technology and facilities to support student achievement and college/career readiness; Shall Visalia Unified School District’s measure authorizing $158,000,000 in bonds at legal rates be adopted, levying 4 cents per $100 assessed value ($12,000,000 annually) while bonds are outstanding, with independent audits/oversight and all money locally controlled?"

