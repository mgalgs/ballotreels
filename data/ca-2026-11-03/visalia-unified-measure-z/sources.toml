credit = "Resolution No. 26-27-05, Visalia Unified School District"
url = "https://tc-web.widen.net/s/d22hggnlqz/resolution-no.-26-27-05-visalia-usd-resolution-to-order-an-election-for-a-school-bond-measure-on-nov-3.2026-1002434.1"
