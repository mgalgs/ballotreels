# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; how a school bond is repaid and what it needs
# to pass; what the money may pay for; the district's tax statement; one
# line per side; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the opening
# says "the voters of this school district". The card and title carry the
# names. "Counsel" is heard as "Council" (standard/speakability.txt), so
# the narration does not say it.
#
# The card quotes the Registrar of Voters' List of Local Measures, which
# prints the ballot question with no yes and no sentences, so the card has
# no boxes and the vote lines take their meaning from the impartial
# analysis. The bond total and the debt service are repaid from a tax on
# property in the district, not from the district's budget, and no
# archived source states that budget, so they have no budget scale
# (STANDARD.md 6.5; left open). The tax statement's average ($25.52) and
# highest ($30.00) rates are both said; the highest is only in the
# resolution's agenda version, which nothing from the Registrar
# contradicts.
#
# The supporters' "With NO increase in your current tax rate" is their
# argument, so the neutral sections leave it out (STANDARD.md 6.3), as San
# Diego Unified Measure M's script does; the card shows the ballot
# question's own "without increasing current tax rates" as printed, not
# highlighted.
#
# The List of Local Measures shows "Primary Argument Against (none
# filed)". The no side says so plainly; its section is marked
# filed = false.

contest = "ca-2026-11-03-alum-rock-measure-p"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "measure-list"
number = "P"
title = "General Obligation Bond"
origin = "Alum Rock Union Elementary School District"
summary = "With funds that cannot be taken by the State or Federal government, shall Alum Rock Union Elementary School District's measure to repair leaky roofs and plumbing; replace heating, ventilation, and air conditioning; and upgrade emergency communication and security systems be adopted, authorizing $100 million of bonds with legal rates, without increasing current tax rates, average levies below $26 per $100,000 of assessed valuation (raising $6.3 million annually while outstanding), audits, independent oversight, and disclosure of all spending?"

[[section]]
id = "what"
heading = "Measure P"

[[section.line]]
text = "Measure P asks the voters of this school district whether to approve $100 million in school bonds."
sources = ["measure-list", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "measure-list"
highlight = ["authorizing $100 million of bonds"]

[[section]]
id = "today"
heading = "How a school bond works"

[[section.line]]
text = "The district would borrow the money and repay it from a tax on property in the district."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "bond-certificates"

[[section.line]]
text = "Measure P needs 55 percent of the vote to pass."
sources = ["impartial-analysis", "measure-list"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "The listed projects include roofs, plumbing, heating and cooling, safety and emergency systems, classrooms and labs, and play areas for the youngest students."
sources = ["impartial-analysis", "text"]

[section.line.visual]
kind = "illustration"
name = "school-roof-repair"

[[section.line]]
text = "The money could not pay teacher or administrator salaries or other operating costs."
sources = ["impartial-analysis"]

[[section]]
id = "fiscal"
heading = "What the tax statement says"

[[section.line]]
text = "The district's tax statement estimates an average tax of $25.52 per $100,000 of assessed value, and at most $30, through 2053-2054."
sources = ["tax-statement", "impartial-analysis"]

[section.line.visual]
kind = "bars"
title = "Estimated tax per $100,000 of assessed value, dollars"
source = "tax-statement"
unit = ""
labels = ["Average", "Highest"]
values = [25.52, 30]

[[section.line]]
text = "The statement estimates the total to repay, with interest, at about $170 million."
sources = ["tax-statement", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "debt-payments"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say many schools are over 60 years old and urgently need repairs, and Measure P funds them with no increase in the current tax rate."
sources = ["argument-for"]
basis = ["schools are more than 60 years old and urgently need repairs.", "With NO increase in your current tax rate, your YES vote on Measure P will fund:"]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Schools over 60 years old need repairs", "No increase in the current tax rate"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure P was filed, so the list of local measures from the county shows only the argument in favor of the bonds."
sources = ["measure-list"]

[section.line.visual]
kind = "list"
source = "measure-list"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote authorizes the district to issue and sell up to $100 million in bonds for school facilities."
sources = ["impartial-analysis", "measure-list"]

[section.line.visual]
kind = "page"
source = "measure-list"
highlight = ["authorizing $100 million of bonds"]

[[section.line]]
text = "A no vote does not authorize the district to issue and sell the bonds."
sources = ["impartial-analysis", "measure-list"]

[section.line.visual]
kind = "page"
source = "measure-list"
highlight = ["be adopted"]
