# Archived sources for City of South Pasadena Measure SOS, 2026-11-03
# general election (sources/la-sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The Los Angeles County Registrar-Recorder/County Clerk's list "Measures
# Appearing on the Ballot" is the authority for the measure's letter,
# ballot question and vote threshold (two-thirds), and says in words that
# no argument against was submitted ("Opponents: None submitted.");
# sources/county-measure-list-excerpt.txt is the measure's entry, cut from
# it. The City posts the City Attorney's impartial analysis (the
# measure's neutral explanation), the argument in favor and the Tax Rate
# Statement (Exhibit A, signed by the City Manager), the measure's fiscal
# statement; all three are text PDFs. Ordinance No. 2416 and the City's
# measure page are not cited.

[contest]
id = "ca-2026-11-03-south-pasadena-measure-sos"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:south_pasadena"
kind = "measure"
title = "City of South Pasadena Measure SOS: $80 Million in Bonds for Streets, Sidewalks and Storm Drains"

