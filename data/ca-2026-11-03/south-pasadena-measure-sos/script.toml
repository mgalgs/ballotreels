# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; who placed it and the two-thirds
# it needs; what the bonds pay for; who repays them; the separate account
# and yearly report; the tax rate statement's average and highest rates
# and total repayment; one line per side; what a vote does.
#
# No place name is narrated: the opening says "the voters of this city".
# The card quotes the Registrar-Recorder's list: the city's heading as
# the title, its vote-passage line as the origin, the ballot question
# (with its printed name) as the summary. The list prints no yes/no
# statements; the vote lines take their meanings from the impartial
# analysis.
#
# The bonds are repaid by a tax on property in the city, not from the
# City's budget, so rule 6.5's scale does not apply, as for the other
# city bond measures. The argument's street ratings and repair costs are
# the supporters' own, so the neutral sections leave them out
# (STANDARD.md 6.3).
# The list says no argument against was submitted: the no side says so
# plainly, citing it, and is marked filed = false.

contest = "ca-2026-11-03-south-pasadena-measure-sos"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "SOS"
title = "CITY OF SOUTH PASADENA"
origin = "VOTE PASSAGE – 2/3 Votes (66.6% of Votes)"
summary = "SOUTH PASADENA STREET/ROAD/POTHOLE REPAIR, 9-1-1 SAFETY MEASURE. To fix damaged local streets/roads/sidewalks, repair potholes, address speeding/unsafe driving; improve emergency evacuation routes; upgrade/repair storm drains to prevent flooding, prevent cuts to City services; shall the City of South Pasadena measure authorizing $80,000,000 in bonds at legal rates, levying on average $33 per $100,000 of assessed valuation, generating approximately $4,400,000 annually while bonds are outstanding be adopted, requiring public spending disclosure, audits, all funds spent locally?"

[[section]]
id = "what"
heading = "Measure SOS"

[[section.line]]
text = "Measure SOS asks the voters of this city whether to issue $80 million in bonds to repair streets, sidewalks and storm drains."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["$80,000,000 in bonds"]

[[section]]
id = "today"
heading = "How it reached the ballot"

[[section.line]]
text = "The City Council placed Measure SOS on the ballot, and it needs two-thirds of voters to pass."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "uses"
text = "The bonds could pay for streets, sidewalks, curbs and gutters, evacuation routes and storm drains."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "storm-drain-street"

[[section.line]]
id = "who-repays"
text = "Property owners in the city would repay the bonds through a tax based on assessed value."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "homestead"

[[section.line]]
id = "accountability"
text = "The money must stay in a separate account, with a yearly public report on how it is spent."
