# Archived sources for City of San Mateo Measure F, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1). Each document is the copy the San Mateo
# County Assessor-County Clerk-Recorder & Elections (ACRE) posts on its
# election page; the county publishes each measure's documents
# separately, not as one pamphlet.
#
# Every PDF here is a scan with no text layer, so each cited one has a
# typed transcription beside it (sources/*.txt, its first lines saying
# which pages it copies), and `file` names the transcription, which the
# verbatim checks read as plain text; `url` is the PDF's.
#
# The ballot question is printed only in the Council's resolution (its
# Section 2), so the resolution backs two sources: the ballot label the
# card quotes, and the full text. Measure F is a Charter amendment, not
# a tax: ACRE posts no tax rate statement or fiscal analysis, and no
# source gives a cost estimate. ACRE posts an argument in favor only: no
# argument against and no rebuttals.

[contest]
id = "ca-2026-11-03-san-mateo-measure-f"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:san_mateo"
kind = "measure"
title = "City of San Mateo Measure F: Charter Amendment on District Elections, Council Meetings and Vacancies"

[[source]]
id = "ballot-label"
kind = "official-title-summary"
publisher = "City of San Mateo, Resolution No. 85 (2026), Section 2: the ballot question, filed with the San Mateo County Chief Elections Officer"
credit = "City of San Mateo Resolution No. 85 (2026)"
url = "https://smcacre.gov/system/files/2026-07/52-ENG-M209-Contest%20Code-Reso-San%20Mateo%20Charter%20Amendment_Redacted.pdf"
file = "sources/resolution-full-text.txt"
retrieved = "2026-10-28"

[[source]]
id = "impartial-analysis"
kind = "official-title-summary"
publisher = "City Attorney's Impartial Analysis of Measure F, by Prasanna W. Rasiah, City Attorney, City of San Mateo"
credit = "City Attorney's Impartial Analysis"
url = "https://smcacre.gov/system/files/2026-08/52-ENG-MF-ImpartialAnalysis-San-Mateo-Charter-Amendment-Redacted.pdf"
file = "sources/impartial-analysis.txt"
retrieved = "2026-10-28"

[[source]]
id = "argument-for"
