# Archived sources for City of Walnut Creek Measure T, 2026-11-03
# general election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# Contra Costa County's Voter Information Guide could not be fetched
# (contracostavote.gov answered a bot challenge), and www.walnutcreekca.gov
# answered HTTP 403. These are the City's files from its Granicus
# meeting archive, for the City Council meeting of May 19, 2026, item
# 5c. No impartial analysis, argument or rebuttal was reached, and no
# document says whether any argument was filed (Section 8 of the
# resolution only authorizes one in favor).
#
# The ballot question is quoted from Section 2 of the proposed
# resolution placing the measure (Attachment 1, the agenda copy, its
# number left blank). The agenda report's copy of the question drops
# "the"; the resolution's wording is the one quoted. The minutes record
# that the Council adopted the resolution, unanimously, as Resolution
# No. 26-31.
#
# The May 19 agenda report is City staff material. It is cited only for
# plain facts it states from state law and the Municipal Code (what the
# Treasurer does, the timing of the change, who would appoint, the
# residency rule) and for its account of the 1956 and 1996 measures,
# attributed to it; its reasons for the change are not used, nor is its
# $116,000, which is the City's budget for the whole November election.
# Attachment 2 (the Treasurer's duties, Government Code sections
# 41001-41007) and the October 6, 2026 agenda report on the City's
# endorsement are archived but not cited.

