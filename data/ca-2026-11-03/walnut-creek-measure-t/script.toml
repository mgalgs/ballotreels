source = "ballot-question"
highlight = ["Shall the office of the City Treasurer be appointive?"]

[[section.line]]
text = "A no vote keeps the office elected."
sources = ["ballot-question", "agenda-report"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["Shall the office of the City Treasurer be appointive?"]

