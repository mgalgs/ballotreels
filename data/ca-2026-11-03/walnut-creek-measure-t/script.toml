# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the office today and how the
# measure reached the ballot; what would change (when, who would
# appoint, the residency rule), the earlier votes, the vote it needs;
# no cost figure; both sides, from the arguments printed on the county's
# page; what a vote does.
#
# No place name and no person is narrated: the opening says "the voters
# of this city". "Appointive", the ballot's word, is said "appointed"
# (standard/speakability.txt). The card and title carry the names.
#
# The card quotes the ballot question from Section 2 of the resolution
# placing the measure, adopted as Resolution No. 26-31 (the minutes);
# the agenda report's copy drops "the". The card prints no yes/no lines
# (the resolution's "YES/NO" is left out of the quote), so both vote
# lines highlight the question.
#
# What the measure does is stated from the resolution and from what the
# City staff's agenda report says state law and the Municipal Code
# provide (Government Code sections 36508 to 36510, Municipal Code
# section 2-6.405(c)); the City Attorney's impartial analysis, printed on
# the county's page, agrees with each of those lines and is cited beside
# them. The report's reasons for the change (professional
# qualifications, staff could absorb the work, savings) are the City's
# case and stay out of the neutral sections. Its account of the 1956 and
# 1996 measures is attributed to it, without vote counts.
#
# No document gives a cost or saving for the measure itself: the
# report's $116,000 is the City's budget for the whole November
# election, so it is not used, and the fiscal line says neither the
# resolution nor the report puts a figure on the measure. The impartial
# analysis says the measure "would save future costs associated with
# candidate elections", with no figure; it does not contradict the line,
# which is left as it was.
#
# The sides come from the argument in favor and the argument against on
# the county's page, not from the rebuttals, each line on what its
# argument leads with and comes back to (for: qualifications; against:
# voters giving up the choice to the body the treasurer oversees). The
# arguments name the current treasurer and their signers; no name is
# narrated. One sentence of the argument against is garbled as printed
# ("Making the office appointive would let the / Council hires ..."), so
# it is not quoted.

contest = "ca-2026-11-03-walnut-creek-measure-t"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "T"
title = "TO DETERMINE WHETHER THE POSITION OF CITY TREASURER SHOULD BE CHANGED FROM ELECTED TO APPOINTIVE"
origin = "CITY OF WALNUT CREEK"
summary = "Shall the office of the City Treasurer be appointive?"

[[section]]
id = "what"
heading = "Measure T"

[[section.line]]
text = "Measure T asks the voters of this city whether the office of city treasurer should be appointed instead of elected."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["Shall the office of the City Treasurer be appointive?"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "elected"
text = "Today the treasurer, who oversees cash, investments and financial reporting for the city, is elected by voters."
sources = ["agenda-report", "ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "bank-vault"

[[section.line]]
id = "placed"
text = "The City Council voted unanimously in May to place Measure T on the ballot."
sources = ["minutes"]

[section.line.visual]
kind = "illustration"
name = "city-council-chamber"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "when"
text = "The treasurer elected on this same ballot would serve a full term; the office would become appointed when that term ends, or sooner if it falls vacant."
sources = ["agenda-report", "ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "empty-commission-seat"

[[section.line]]
id = "who"
text = "The city manager would then appoint the treasurer, who would not need to live in the city."
sources = ["agenda-report", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "city-clerk-office"

[[section.line]]
id = "history"
text = "A city staff report says voters turned down making the office appointed in 1956 and again in 1996."
sources = ["agenda-report"]

[section.line.visual]
kind = "illustration"
name = "newspaper-notices"

[[section.line]]
id = "threshold"
text = "Measure T needs a majority of the vote to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "ballot-box"

[[section]]
id = "fiscal"
heading = "What it would cost"

[[section.line]]
id = "cost"
text = "Neither the resolution placing Measure T on the ballot nor the staff report puts a dollar figure on what the measure would cost or save."
sources = ["ballot-question", "agenda-report"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"
stamp = "None reported"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say the only requirement to be elected treasurer is being a registered voter, and appointment would make sure future treasurers are qualified."
sources = ["argument-for"]
basis = ["Currently, the only requirement to be elected Walnut Creek City Treasurer, is to be “a registered voter” in our city.", "ensuring that future city treasurers are qualified to serve, subject to proper criteria, screening and background checks."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Only requirement today: be a voter", "Ensures future treasurers are qualified"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say voters would give up their right to elect the treasurer, and an appointed one could be replaced for raising unwelcome concerns."
sources = ["argument-against"]
basis = ["Measure T asks Walnut Creek voters to give up their right to elect the City Treasurer and hand that choice to the City Council.", "An appointed Treasurer serves at the Council’s pleasure and can be replaced for raising concerns the Council would rather not hear."]

[section.line.visual]
kind = "list"
source = "argument-against"
items = ["Voters give up their right to elect", "Could be replaced for raising concerns"]

[[section]]
