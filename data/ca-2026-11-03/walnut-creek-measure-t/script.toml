# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the office today and how the
# measure reached the ballot; what would change (when, who would
# appoint, the residency rule), the earlier votes, the vote it needs;
# no cost figure; both sides, neither of which has an archived argument;
# what a vote does.
#
# No place name and no person is narrated: the opening says "the voters
# of this city". "Appointive", the ballot's word, is said "appointed"
# (standard/speakability.txt). The card and title carry the names.
#
# The card quotes the ballot question from Section 2 of the resolution
# placing the measure, adopted as Resolution No. 26-31 (the minutes);
# the agenda report's copy drops "the". The card prints no yes/no lines
# (the resolution's "YES/NO" is left out of the quote), so both vote
# lines highlight the question.
#
# No impartial analysis was archived. What the measure does is stated
# from the resolution and from what the City staff's agenda report says
# state law and the Municipal Code provide (Government Code sections
# 36508 to 36510, Municipal Code section 2-6.405(c)); the report's
# reasons for the change (professional qualifications, staff could
# absorb the work, savings) are the City's case and are left out, as no
# argument on either side was archived. Its account of the 1956 and
# 1996 measures is attributed to it, without vote counts.
#
# No document gives a cost or saving for the measure itself: the
# report's $116,000 is the City's budget for the whole November
# election, so it is not used, and the fiscal line says neither the
# resolution nor the report puts a figure on the measure.
#
# No argument for or against Measure T was archived, and no document
# says whether any was filed (Section 8 of the resolution only
# authorizes one in favor). So the sides do not say none was filed: each
# says none is among the documents gathered (filed = false, STANDARD.md
# 2.5), as for Walnut Creek Measure U.

