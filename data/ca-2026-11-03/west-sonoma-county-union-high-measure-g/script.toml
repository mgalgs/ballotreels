# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; what a parcel tax is and what it needs to
# pass; how long the renewed tax would run and what it may pay for; the
# impartial analysis's estimate; one line per side; what a vote does.
#
# A parcel tax has no tax rate statement, and the pages print none; the
# one estimate is the impartial analysis's ($1,950,000 a year). The tax
# is paid into the district's budget, but no archived source states that
# budget, so the figure has no budget scale (STANDARD.md 6.5; left
# open). The supporters cite the senior exemption, the audits and
# oversight committee, and "without increasing the current parcel tax
# rate", so the neutral sections leave them out (STANDARD.md 6.3) and
# keep to the analysis's own words ("continue"); the card quotes the
# question's exemptions as printed. "Counsel" is heard as "Council"
# (standard/speakability.txt), so the narration says "the impartial
# analysis".
#
# No argument against Measure G was submitted. The no side says so
# plainly; its section is marked filed = false.

contest = "ca-2026-11-03-west-sonoma-county-union-high-measure-g"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "measure-question"
number = "G"
title = "West Sonoma County Union High School District"
origin = "The West Sonoma County Union High School District Board of Trustees has placed on the ballot the question of whether the District should continue an education parcel tax for the specific purposes stated in the full text of Measure G."
summary = "To continue supporting academic excellence for West Sonoma County Union students without increasing current tax rates; protect music, art, dance, shop, culinary and other career technical programs; retain teachers and staff; and keep class sizes low, shall West Sonoma County Union High School District’s measure be adopted, renewing its existing parcel tax for eight years at the same rate of $79 per parcel, raising approximately $1,950,000 annually with exemptions including seniors and all funds staying local?"
yes = "A “yes” vote on Measure G will authorize the District to continue the education parcel tax."
no = "A “no” vote on Measure G will not authorize the District to continue the tax."

