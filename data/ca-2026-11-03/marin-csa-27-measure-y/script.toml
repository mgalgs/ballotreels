# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the regional paramedic authority
# and the tax today; what would change (the most it could be, the yearly
# confirmation, the use of the money); the vote it needs; the revenue
# estimate; both sides, neither of which has an archived argument; what
# a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this service area", and the Ross Valley
# Paramedic Authority is "the regional paramedic authority". The card,
# title and `voters` line carry the names. No person is named.
#
# No impartial analysis was archived: the neutral lines rest on the
# ballot question, the resolution and its Exhibit A (the full ballot
# text), and the plain facts of the County staff report. The
# resolution's recitals and Exhibit A's findings of need and benefit,
# and the ballot question's opening purpose clause, are not narrated.
# The rate's basis (per housing unit or per 1,000 square feet) is the
# ballot question's. The card quotes the ballot question from Section 3
# of the resolution, named by its number; the resolution prints only
# YES and NO cells beside the question, so the card has no yes/no boxes
# and both vote lines highlight the same phrase of the question.
#
# The ballot question's "approximately $84,000 annually" is paramedic
# tax revenue. No archived source states the service area's or the
# paramedic authority's budget, so the figure has no scale (STANDARD.md
# 6.5; left open). The tax rates are amounts per housing unit or per
# 1,000 square feet (exempt).
#
# No argument for or against Measure Y was archived, and no document
# says whether any was filed. So the sides do not say none was filed:
# each says none is among the documents gathered (filed = false,
# STANDARD.md 2.5), as for Walnut Creek Measure U.

contest = "ca-2026-11-03-marin-csa-27-measure-y"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "Y"
title = "RESOLUTION NO. 2026-066"
origin = "BOARD OF SUPERVISORS OF THE COUNTY OF MARIN"
summary = "To maintain rapid 9-1-1 emergency response times and preserve the number of on-duty paramedics ready to respond to accidents/medical emergencies, shall the Ross Valley Paramedic Authority measure be adopted continuing for four years the paramedic services special tax of up to $107.50/residential living unit or 1,000 square feet of developed nonresidential property, adjusted up to $4/ year, generating approximately $84,000 annually, with annual audits, public spending disclosure and all funds for local paramedic services?"

