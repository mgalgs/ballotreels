# Archived sources for County Service Area 27 Measure Y, 2026-11-03
# general election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# Marin County's guide could not be archived, and the county's Measure Y
# page was not reached, so no impartial analysis or argument was
# archived and no document says whether any argument was filed. These
# are the Board of Supervisors' files for item 9b of its July 7, 2026
# meeting: the signed Resolution No. 2026-066, whose Section 3 is the
# ballot question and whose Exhibit A is the measure's full ballot text;
# the staff report; the vote certification; and the minutes. The vote
# certification and the minutes record the resolution's adoption; no
# line narrates it, so neither is cited.
#
# The question runs across a page break and beside YES and NO cells,
# which the PDF's text layer sets inside it, so the card's source
# (ballot-question) is sources/resolution-2026-066-ballot-question-extract.txt,
# the question copied from the text layer without them; its url is the
# PDF. Exhibit A is cited only for what it prints.
#
# The staff report is County staff's material: only its plain facts are
# cited (the current rate and its square-foot basis, the current tax's
# end, the yearly confirmation of the rate), never its statements of
# need or benefit. It is of kind public-record: no allowed kind fits a
# staff report exactly, and official-report is reserved for a
# nonpartisan fiscal office's reports.
#
# A county service area has no Census boundary, so the measure's
# division is the county and `voters` names the service area as the
# County's documents name it (docs/SCRIPT-FORMAT.md). The letter Y and
# the two-thirds vote are confirmed by the Registrar of Voters' Board of
# Supervisors staff report 26-4515.

