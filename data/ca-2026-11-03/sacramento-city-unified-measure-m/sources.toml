# Archived sources for Sacramento City Unified School District Measure M,
# 2026-11-03 general election (sources/sources.md). Every id here may be
# cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# Sacramento County publishes no single Voter Information Guide PDF (each
# voter's guide is issued through a portal); its "Current Measure
# Information" page prints each measure's ballot question, County
# Counsel's Impartial Analysis, full text, arguments and rebuttals.
# sources/county-measure-page-item.txt is the text of Measure M's item on
# that page; every source cites it. Measure M is a parcel tax, so the
# page prints no tax rate statement.

[contest]
id = "ca-2026-11-03-sacramento-city-unified-measure-m"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/school_district:sacramento_city_unified_school_district"
kind = "measure"
title = "Sacramento City Unified School District Measure M: Special Education Parcel Tax"

[[source]]
id = "ballot-label"
kind = "official-title-summary"
publisher = "Sacramento County Voter Registration and Elections, Current Measure Information, November 3, 2026, General Election: Measure M's ballot question, and the Impartial Analysis's statement of what a vote does"
credit = "Current Measure Information, Sacramento County"
url = "https://elections.saccounty.gov/us/en/election-information/current-measure-information.html"
file = "sources/county-measure-page-item.txt"
