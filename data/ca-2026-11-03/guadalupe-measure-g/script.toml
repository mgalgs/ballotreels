# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; what stays as it is (the city's
# cannabis rules, no new businesses); what would change (the top rates,
# the council's room to set lower ones, how long it lasts and where the
# money goes, the vote it needs); the ballot label's revenue estimate;
# one line per side; what a vote does.
#
# The card quotes the ballot question from the guide's sample ballot,
# which prints it under "CITY OF GUADALUPE" and "MEASURE G2026" with no
# title line and plain YES and NO boxes. So the card's title is the
# city's name as the ballot prints it (as Albany's and Coronado's are),
# its origin is the impartial analysis's sentence placing the measure,
# the vote lines give the analysis's meanings, and both highlight the
# same phrase of the question.
#
# The fees the city's two cannabis businesses pay today under their
# agreements, and that the retailer asked for a tax instead, are stated
# only in the argument in favor, so they stay in the yes side
# (STANDARD.md 6.3); the neutral sections say only what the impartial
# analysis says about today. The analysis gives no revenue estimate: the
# fiscal line quotes the ballot question's, attributed to it, and no
# archived source states the City's general fund budget to give it a
# scale (STANDARD.md 6.5; left open, under [[question]]).
#
# No argument against Measure G was filed. The no side says so plainly;
# its section is marked filed = false.

contest = "ca-2026-11-03-guadalupe-measure-g"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "G"
title = "CITY OF GUADALUPE"
origin = "The City Council of the City of Guadalupe has placed Measure G2026 (“Measure G”) on the ballot"
summary = "Shall the measure, to establish a local tax on gross receipts of cannabis businesses operating in Guadalupe, until ended by voters, authorizing the City Council to impose maximum tax rates up to 8% on retail, and up to 4% on all other, cannabis businesses, allowing the Council discretion to set lower rates, with all revenue estimated at approximately $78,000 annually, remaining in the City to support essential City services, be adopted?"

[[section]]
id = "what"
heading = "Measure G"

[[section.line]]
text = "Measure G asks the voters of this city whether to tax what cannabis businesses take in."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["to establish a local tax on gross receipts of cannabis businesses"]

[[section]]
id = "today"
heading = "What stays the same"

[[section.line]]
id = "rules"
text = "Measure G would not change the city rules for cannabis businesses, or allow any new ones to open."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "cannabis-shop-counter"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "rates"
text = "Cannabis stores could be taxed up to 8 percent of gross receipts, and other cannabis businesses up to 4 percent."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "bars"
title = "Highest tax rate the council could set"
source = "impartial-analysis"
unit = "%"
labels = ["Cannabis stores", "Other cannabis businesses"]
values = [8, 4]

[[section.line]]
id = "lower"
text = "The city council could set lower rates, but higher ones would need voter approval."
sources = ["impartial-analysis"]

[[section.line]]
id = "general"
text = "As a general tax, the money could pay for any city purpose, until voters repeal the tax."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "state-budget"

[[section.line]]
text = "Measure G needs a simple majority to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "fiscal"
heading = "What the ballot question says"

[[section.line]]
id = "revenue"
text = "The ballot question estimates the revenue at about $78,000 a year."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["estimated at approximately $78,000 annually"]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say replacing today's fee with a tax helps local businesses while keeping an important city revenue source."
sources = ["arguments"]
basis = ["A YES vote will replace the current public benefit fee structure with a locally controlled cannabis business tax, helping support a more predictable and business-friendly operating environment while maintaining an important source of City revenue.", "a locally controlled tax structure could support local businesses while continuing to generate revenue for essential City services."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["A business-friendly tax in place of a fee", "Keeps an important source of city revenue"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure G was filed, so the county voter guide prints only the one in favor."
sources = ["arguments"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote approves the cannabis business tax, up to its top rates."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["to establish a local tax on gross receipts of cannabis businesses"]

[[section.line]]
text = "A no vote does not approve the cannabis business tax."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["to establish a local tax on gross receipts of cannabis businesses"]

[[question]]
ask = "Would this let more cannabis businesses open?"
lines = ["rules"]

[[question]]
ask = "How high could the tax go?"
lines = ["rates", "lower"]

[[question]]
ask = "What can the money be spent on?"
lines = ["general"]

[[question]]
ask = "How big is about $78,000 a year next to the city budget?"
unanswered = true
