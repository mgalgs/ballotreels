# Archived sources for Guadalupe Measure G, 2026-11-03 general election
# (sources/sources.md). Every id here may be cited by script.toml.
# `kind` must be one the standard allows (docs/STANDARD.md, section 1).
#
# Santa Barbara County Elections prints each ballot type's County Voter
# Information Guide as one PDF; pages 28 to 38 (impartial analysis,
# argument in favor, full text) and 48 to 49 (sample ballot) of Ballot
# Type 103 were cut into one excerpt, which backs every source here. The
# ballot labels the measure "Measure G2026"; the project names it by its
# bare letter. The City Attorney's impartial analysis is the measure's
# neutral explanation; it gives no revenue estimate, and the one
# estimate is the ballot label's. No tax rate statement or fiscal
# analysis applies. No argument against was filed, and no rebuttals are
# printed. Measure G (a cannabis business tax) is a separate measure
# from the same City Council's Measure J (a transient occupancy tax) on
# the same ballot.

