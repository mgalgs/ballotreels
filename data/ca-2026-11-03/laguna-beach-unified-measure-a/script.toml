# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and of whom; how a school bond is repaid and what it needs to
# pass; what the money would pay for; the district's tax statement; one
# line per side; what a vote does.
#
# The guide prints a title line over the ballot question ("Safe, Modern
# Laguna Beach Unified School District School Bond Measure"); the card
# quotes the question itself as its title, as the other school bond
# cards do, and the impartial analysis's statement of what the measure
# does as its summary. The bond total and the debt service are repaid
# from a tax on property in the district, and no archived source states
# the district's budget, so they have no budget scale (STANDARD.md 6.5;
# left open). The fiscal line gives the tax statement's highest rate
# beside its average, as it prints both. "Without increasing current tax
# rates" is in the ballot question, which the card quotes; in the
# narration it is the supporters' claim, so it stays out of the neutral
# sections (STANDARD.md 6.3), as do their state matching funds.
#
# No argument against Measure A was submitted. The no side says so
# plainly; its section is marked filed = false.

contest = "ca-2026-11-03-laguna-beach-unified-measure-a"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-label"
number = "A"
title = "To repair and upgrade aging classrooms, science labs, career technology and school facilities to support college/career readiness in math, science, technology, arts, engineering, and skilled trades; and fix deteriorating roofs, plumbing, and electrical systems; shall Laguna Beach Unified School District’s measure be adopted authorizing $83 million in bonds at legal rates (without increasing current tax rates), levying $8.85 per $100,000 assessed value ($5 million annually) while bonds are outstanding, with independent audits, citizen oversight, all money locally controlled?"
origin = "This measure was placed on the ballot by the governing board (“Board”) of the Laguna Beach Unified School District (“District”)."
summary = "This measure, if approved by 55 percent of the votes cast on the measure, will authorize the District to issue and sell up to $83,000,000 in general obligation bonds."
yes = "A “YES” vote is a vote in favor of authorizing the District to issue and sell up to $83,000,000 in general obligation bonds."
no = "A “NO” vote is a vote against authorizing the District to issue and sell up to $83,000,000 in general obligation bonds."

