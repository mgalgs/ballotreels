# Archived sources for Laguna Beach Unified School District Measure A,
# 2026-11-03 general election (sources/sources.md). Every id here may be
# cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1). The six pages are Measure A's section
# (Section 11) of the Orange County Registrar of Voters' Voter
# Information Guide, posted as their own PDF; "page" is the page of that
# PDF, as the guide prints no page numbers on it.
#
# The section prints the ballot question, the Full Text, the Tax Rate
# Statement, the Impartial Analysis and the argument in favor; each is
# its own source.

[contest]
id = "ca-2026-11-03-laguna-beach-unified-measure-a"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/school_district:laguna_beach_unified_school_district"
kind = "measure"
title = "Laguna Beach Unified School District Measure A: School Repair and Upgrade Bonds"

[[source]]
