# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and whose measure it is; the hotel tax today, who placed Measure D
# on the ballot and the vote it needs; what would change (the rate, how
# long, where the money goes); the impartial analysis's revenue estimate;
# one line per side; what a vote does.
#
# The card quotes the ballot question from Resolution No 104-2026, which
# prints no yes/no lines (the City Attorney's analysis has them, in
# another document), so, as for Los Angeles County Measure A, the card has
# no YES/NO boxes, the vote lines give the analysis's meanings, and both
# highlight the one phrase of the question they turn on.
#
# Scale (STANDARD.md 6.5): the impartial analysis sets the estimated
# $5.7 million a year beside the about $22 million the hotel tax brought
# in for 2025-2026, and the fiscal line gives the two together, as the
# analysis does. No archived source states the general fund total, so no
# share of it is given (left open, under [[question]]).
#
# Both arguments were filed as "Measure __"; the script says Measure D.

contest = "ca-2026-11-03-burlingame-measure-d"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "D"
title = "A BALLOT MEASURE TO INCREASE THE CITY’S TRANSIENT OCCUPANCY TAX FROM TWELVE PERCENT (12%) TO FIFTEEN PERCENT (15%)"
origin = "RESOLUTION OF THE CITY COUNCIL OF THE CITY OF BURLINGAME"
summary = "To support city services such as: maintaining city streets/sidewalks and repairing potholes; maintaining parks and trees; enhancing emergency response, preparedness, and wildfire prevention; and for general government use; shall the City of Burlingame measure be adopted raising the transient occupancy (hotel) tax from 12% to 15%, paid only by hotel and lodging guests, until ended by voters, providing an estimated $5,700,000 annually, all funds locally controlled, with independent citizen oversight?"

[[section]]
id = "what"
heading = "Measure D"

[[section.line]]
text = "Burlingame Measure D asks city voters whether to raise the tax on hotel stays from 12 to 15 percent."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["from 12% to 15%"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "who-pays"
text = "Today, guests who stay less than 30 days at a Burlingame hotel or other short-term lodging pay a 12 percent tax."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "hotel-front-desk"

[[section.line]]
text = "The City Council placed Measure D on the ballot, and it needs a simple majority to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "ballot-box"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "Measure D would raise the rate to 15 percent, paid by the hotel guest, until voters repeal it."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "bars"
title = "Hotel tax rate"
source = "impartial-analysis"
unit = "%"
labels = ["Today", "Measure D"]
values = [12, 15]

[[section.line]]
text = "The money would go to the general fund, for any city purpose, and be audited every year."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "special-tax"

[[section]]
id = "fiscal"
heading = "What the impartial analysis says"

[[section.line]]
id = "revenue"
text = "The impartial analysis estimates about $5.7 million more a year, beside about $22 million the hotel tax brought in for 2025-2026."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "bars"
title = "Hotel tax revenue, dollars"
source = "impartial-analysis"
unit = "million"
labels = ["Received, 2025-2026", "Added by Measure D, a year"]
values = [22, 5.7]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say hotel guests would help fund the services they use, and the rate is among the lowest in the county."
sources = ["argument-for"]
basis = ["Voting YES on Measure __ ensures that hotel guests help fund the services they use, so local homeowners and residents don’t bear the full cost.", "Burlingame’s hotel tax rate is currently among the lowest in the County and has not been increased in more than 17 years."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Hotel guests help pay for services", "Rate among the lowest in the county"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say this is a 25 percent tax hike, and as a general tax it could fund anything the council picks."
sources = ["argument-against"]
basis = ["The Burlingame City Council expects voters to approve a huge, 25 PERCENT tax hike by saying residents won’t have to pay.", "So it could be diverted to literally anything the councilmembers pick."]

[section.line.visual]
kind = "list"
source = "argument-against"
items = ["A 25 percent tax hike", "Money could go to anything"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote approves raising the hotel tax from 12 to 15 percent."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["from 12% to 15%"]

[[section.line]]
text = "A no vote rejects Measure D and keeps the hotel tax at 12 percent."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["from 12% to 15%"]

[[question]]
ask = "Who pays the hotel tax?"
lines = ["who-pays"]

[[question]]
ask = "How much money would Measure D raise?"
lines = ["revenue"]

[[question]]
ask = "How big is $5.7 million a year next to the city budget?"
unanswered = true
