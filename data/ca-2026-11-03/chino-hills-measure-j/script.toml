# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks; the sales tax today and the city's share of it; what would change
# (the added cent, how long, where the money goes); how it reached the
# ballot and what it needs to pass; the impartial analysis's revenue
# estimate, with its scale; one line per side; what a vote does.
#
# The card quotes the ballot question from the City Council's resolution
# (the guide prints none), which has no yes/no lines; the vote lines
# give the City Attorney's Impartial Analysis's meanings and both
# highlight the phrase of the question they turn on. "City's" is heard
# as "cities" (standard/speakability.txt), so the narration says neither.
#
# Scale (STANDARD.md 6.5): $11.5 million a year against the $63.5 million
# of General Fund expenditures in the city's adopted 2026-27 budget, as
# the resolution's recitals state it: 11.5 / 63.5 = 18 percent. The
# exemptions (groceries, prescriptions, rent) and that no money goes to
# the state or county are the supporters' points too, so they stay out
# of the neutral sections (STANDARD.md 6.3). Sides come from the argument
# in favor and the argument against, not the rebuttals.

contest = "ca-2026-11-03-chino-hills-measure-j"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-label"
number = "J"
title = "Chino Hills Services Measure"
origin = "A RESOLUTION OF THE CITY OF CHINO HILLS, PLACING A PROPOSITION ON THE NOVEMBER 3, 2026 BALLOT"
summary = "Shall the measure protecting Chino Hills’ financial stability and maintaining City services including public safety response times; reducing wildfire risk; preparing for/responding to wildfires/natural disasters; helping prevent crime, thefts, burglaries; keeping public areas safe/clean; protecting Clean Water Act resources; preserving/maintaining open space; supporting other city services by establishing a 1¢ sales tax, providing approximately $11,500,000 annually until ended by voters; with audits, spending disclosure, all funds used locally, be adopted?"

[[section]]
id = "what"
heading = "Measure J"

[[section.line]]
text = "City of Chino Hills Measure J asks Chino Hills voters whether to add a one-cent sales tax."
sources = ["ballot-label"]

[section.line.visual]
kind = "page"
source = "ballot-label"
highlight = ["1¢ sales tax"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Today the sales tax in Chino Hills is 7.75 percent, and the city gets 1 percent."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "bars"
title = "Who gets today's 7.75% sales tax in Chino Hills"
source = "impartial-analysis"
unit = "%"
labels = ["State", "City", "County"]
values = [6, 1, 0.75]

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "Measure J would add 1 percent more, one cent on every dollar."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "city-storefronts"

[[section.line]]
text = "The tax would last until voters repeal it, and the council could suspend it at any time."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "end-date"

[[section.line]]
text = "The money would go to the general fund, for any lawful city purpose."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "state-budget"

[[section.line]]
text = "The City Council placed Measure J on the ballot, and it needs a simple majority to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "ballot-box"

[[section]]
id = "fiscal"
heading = "What it would raise"

[[section.line]]
text = "The city attorney's impartial analysis estimates $11.5 million a year, about 18 percent of general fund spending this year."
sources = ["impartial-analysis", "budget"]

[section.line.visual]
kind = "illustration"
name = "special-tax"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Measure J keeps police patrols and wildfire prevention, and has visitors help pay for services."
sources = ["arguments"]
basis = ["Maintains 911 emergency response and neighborhood police patrols", "Strengthens wildfire prevention and emergency preparedness", "Measure J allows visitors to help pay for the services and infrastructure they use."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Keeps police patrols and wildfire prevention", "Visitors help pay for the services they use"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say Chino Hills stays safe without this tax, with new water savings and millions in grants."
sources = ["arguments"]
basis = ["will not make our trail system disappear, and will not make our city less safe.", "The plant will bring $1 million a year back to the city.", "The city has a professional lobbyist and access to millions of dollars in grants from our congresspeople."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Chino Hills stays safe without this tax", "Water savings and grants bring in money"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote is a vote in favor of the one-cent sales tax."
sources = ["impartial-analysis", "ballot-label"]

[section.line.visual]
kind = "page"
source = "ballot-label"
highlight = ["1¢ sales tax"]

