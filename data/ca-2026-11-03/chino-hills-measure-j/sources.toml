# Archived sources for City of Chino Hills Measure J, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1). The guide's pages are cut from the San
# Bernardino County Registrar of Voters' comprehensive Voter Information
# Guide (VIG.pdf, PDF pages 222-229); "page" is the guide's printed
# footer number (SB COMPREHENSIVE-220 is PDF page 222).
#
# The guide prints no ballot question; the card quotes it from the City
# Council's resolution placing the measure (Section 2). The same
# resolution's recitals state the city's adopted 2026-27 General Fund
# budget, the total that gives the revenue estimate its scale.

