# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and of whom; the parcel tax today; what it needs to pass; what
# would change (the new rate and its length, what the money may pay
# for, who may be exempt); the impartial analysis's revenue estimate;
# one line per side; what a vote does.
#
# San Mateo County posts the measure's documents one by one, so the card
# quotes the ballot label, the resolution's heading and its Section 3
# from Resolution No. 09-2026, and names that resolution as its document.
# The resolution prints no yes or no lines, so the card has none. The
# posted impartial analysis ends after its "yes" sentence, so the yes
# line takes its meaning from it, and the no line from the resolution's
# Section 5 (Measure N's collection is unaffected unless this measure
# is adopted); the two-thirds threshold is the resolution's recital. No
# archived source gives Measure N's rate or when it ends, so the script
# gives neither. The impartial analysis prints no author, so the script
# never names one. No archived source states the district's budget, so
# the $2.6 million has no scale (STANDARD.md 6.5; left open); $239 is an
# amount per parcel (exempt).
#
# No argument against Measure Z appears among the documents San Mateo
# County posted for it (sources.md does not say whether one was filed),
# so the no side says that plainly and is marked filed = false.

contest = "ca-2026-11-03-cabrillo-unified-measure-z"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "Z"
title = "With funds that cannot be taken by the State or Federal Government and spent elsewhere, shall Cabrillo Unified School District's measure to support local students by hiring and retaining highly qualified teachers and specialized educators; and expanding career training and college readiness programs, including agriculture, construction, and welding be adopted, replacing the current parcel tax at $239 per parcel for five years, (raising $2,600,000 annually) with senior exemptions, no administrator salaries or pensions, and public disclosure of spending?"
origin = "RESOLUTION OF THE BOARD OF TRUSTEES OF THE CABRILLO UNIFIED SCHOOL DISTRICT, CALLING AN ELECTION FOR APPROVAL OF THE RENEWAL OF AN EDUCATION PARCEL TAX"
summary = "an election shall be held within the boundaries of the District on Tuesday, November 3, 2026, for the purpose of voting on a measure (\"Measure\") which will be presented to voters in substantially the form attached hereto as Exhibit A, containing the question of whether the District shall impose a qualified special tax for the educational purposes stated therein."

[[section]]
id = "what"
heading = "Measure Z"

[[section.line]]
text = "Cabrillo Unified School District Measure Z asks the district's voters whether to replace its current parcel tax with a tax of $239 per parcel."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["replacing the current parcel tax at $239 per parcel"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Today, the district levies a parcel tax that voters passed in November 2024."
sources = ["impartial-analysis", "text"]

[section.line.visual]
kind = "illustration"
name = "special-tax"

[[section.line]]
text = "Measure Z needs two-thirds of the vote to pass."
sources = ["text"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "A $239 tax per parcel would replace the 2024 tax from July 1, 2027, for up to five years."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "school-workshop"

[[section.line]]
text = "The money could pay for teachers, classes and career training, but not administrators' pay."
sources = ["impartial-analysis", "ballot-question"]

[[section.line]]
text = "Owners 65 or older, and some people receiving disability benefits, could apply to be exempt."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "senior-center"

[[section]]
id = "fiscal"
heading = "What the impartial analysis says"

[[section.line]]
text = "The impartial analysis says the tax is estimated to raise about $2.6 million a year."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Measure Z keeps qualified educators and grows career training, with local money the state cannot take."
sources = ["argument-for"]
basis = ["will help Cabrillo Unified attract and retain qualified, dedicated educators, strengthen career training and college readiness programs", "By law, Measure _ funds cannot be taken by the State or Federal Government and spent elsewhere."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Keeps qualified, dedicated educators", "Grows hands-on career training"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure Z appears in the published measure documents of San Mateo County for this election."
sources = ["argument-for"]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["No argument against was published"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote would impose the $239 parcel tax for up to five years."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["$239 per parcel for five years"]

[[section.line]]
text = "A no vote would not impose the new tax, leaving the 2024 parcel tax in place."
sources = ["text", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["whether the District shall impose a qualified special tax"]
