# Archived sources for City of Hercules Measure P, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# Contra Costa County's Voter Information Guide could not be fetched
# (contracostavote.gov answered a bot challenge), and www.herculesca.gov
# answered HTTP 403. These are the City's files from its Legistar agenda
# system, for the City Council meeting of July 28, 2026, item 26-200. No
# impartial analysis, argument or rebuttal was reached, and no document
# says whether any argument was filed.
#
# The placing document is the urgency ordinance calling the election
# (Attachment 1 to item 26-200), whose Section 3 sets the ballot question.
# The archived copy is the agenda copy, a Word file with its number and
# vote left blank; the City's Legistar record of the meeting (adoption)
# records the item adopted as Ordinance 558 on July 28, 2026, with no
# amendment recorded. The Word files' text is copied into
# sources/*.txt, unchanged but for line breaks, and each source points at
# the copy, its url at the Word file. The full text is Exhibit A, the
# transactions and use tax ordinance submitted to the voters.
#
# The urgency ordinance's recitals and Section 2 findings, and the City
# staff report (sources/hercules-P-staff-report.docx), are the City's
# case for the tax: they are not cited, and the script uses the
# ordinance only for what it does (the ballot question, the vote needed,
# that the tax is a general tax).

