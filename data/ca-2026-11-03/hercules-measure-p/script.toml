# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; how it reached the ballot and the
# state's cap on these taxes today; what would change (the rate and its
# length, the cap fallback, a general tax, the vote it needs); the
# revenue as the ballot question gives it; both sides, neither of which
# has an archived argument; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". The card and title carry the
# name. No person is named. "1 percent", not "one cent"
# (standard/speakability.txt).
#
# No impartial analysis was archived: every neutral line rests on the
# tax ordinance's own text and on the urgency ordinance placing it, and
# only on what they enact, never on the urgency ordinance's recitals and
# findings or the staff report, which are the City's case for the tax.
# The card quotes the ballot question from Section 3 of the urgency
# ordinance, which prints only blank Yes and No lines, so the card has no
# YES/NO boxes and both vote lines highlight the same phrase. The
# Council's vote count is not stated.
#
# The state cap: the urgency ordinance's recitals say SB 762 would exempt
# the tax from the 2 percent cap and was awaiting the Governor's
# signature; no archived source says whether it became law, so the script
# does not mention the bill. It says only what the tax ordinance itself
# provides (section 8-11.08): if the cap keeps the full 1 percent from
# being collected, the rate drops to the most allowed for as long as that
# lasts.
#
# The ballot question lists "audits, public disclosure"; the tax
# ordinance's text sets no audit, report or committee, so the script
# narrates none (the phrase stays on the card).
#
# The $4 million a year is the ballot question's figure. No archived
# source states the City's general fund budget, so it has no scale
# (STANDARD.md 6.5; left open, under [[question]]).
#
# No argument for or against Measure P was archived, and no document
# says whether any was filed. So the sides do not say none was filed:
# each says none is among the documents gathered (filed = false,
# STANDARD.md 2.5), as for Walnut Creek Measure U.

contest = "ca-2026-11-03-hercules-measure-p"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "P"
title = "Hercules Public Safety/ Financial Stability Measure."
origin = "City of Hercules"
summary = "Shall the measure providing Hercules with locally controlled funding to maintain financial stability/general city services, such as fast 911 response; neighborhood police patrols; water quality standards; keeping public areas/parks safe/ clean; repairing deteriorating streets/potholes; and retaining/attracting local businesses, by establishing a one-cent (1%) sales tax generating approximately $4,000,000 annually until ended by voters; requiring audits, public disclosure, and funds only for Hercules, be adopted?"

