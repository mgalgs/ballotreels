# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; how it reached the ballot; what
# would change (the added rate, what the money is for, the audits, how
# long it lasts and the vote it needs); the revenue estimate as the
# ballot question gives it; both sides, neither of which has an
# archived argument; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". The card and title carry the
# names.
#
# The card quotes the Tulare County Registrar of Voters' published
# notice of election, the question "to be displayed on each individual
# ballot", which prints no yes/no statements: so the card has no YES/NO
# boxes, and both vote lines highlight the same phrase of the question.
# The notice prints "retaining/ attracting" with a space the
# resolution's copy lacks; the card follows the notice.
#
# No impartial analysis was archived: every neutral line rests on the
# notice and on what the resolution and the ordinance (as the Registrar
# posted them, scans read from their page images) record or enact: the
# rate of "three quarters of a percent (.75%)" (ordinance, Sec.
# 3.13.050), the tax "additive" to any existing transactions and use
# tax (Section III), revenues "deposited into the City's General Fund
# and may be used for any lawful municipal purpose" (resolution,
# Section 4), and the adoption on June 23, 2026 (resolution, page 3).
# The "WHEREAS" findings of both (the City's priorities, its survey,
# "not one penny can be taken" by other governments) are the City's own
# claims, not facts, and are not used; the services the question lists
# and its audits are attributed to it (the ordinance's operative text
# has no audit section). No archived source gives the sales tax rate in
# the city today, so the script gives only the increase.
#
# The $3.4 million a year is the ballot question's estimate. No
# archived source states the City's general fund budget to give it a
# scale (STANDARD.md 6.5; left open, under [[question]]).
#
# No argument for or against Measure S was archived (the county's guide
# could not be fetched), and no document says whether any was filed. So
# the sides do not say none was filed: each says none is among the
# documents gathered (filed = false, STANDARD.md 2.5), as for Walnut
# Creek Measure U.

contest = "ca-2026-11-03-dinuba-measure-s"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "S"
title = "CITY OF DINUBA"
origin = "NOTICE OF A TRANSACTION AND USE TAX ELECTION"
summary = "Shall the measure maintaining 911 emergency response, crime investigation; retaining/ attracting well-trained firefighters/police/paramedics; repairing potholes/streets/alleys; addressing homelessness; keeping public areas/parks safe/clean/well-maintained; retaining/attracting local businesses; maintaining youth recreation programs and senior services, other general city services; establishing a ¾¢ sales tax, providing approximately $3,400,000 annually until ended by voters, requiring public spending disclosure, audits, all funds locally controlled, be adopted?"

