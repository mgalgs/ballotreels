# Archived sources for City of Dinuba Measure S, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The City's site (dinuba.org) and the county's (tularecounty.ca.gov)
# blocked downloads. The Tulare County Registrar of Voters' measure page
# is archived as the Internet Archive's capture of October 9, 2026; it
# prints the Registrar's published notice of election, whose ballot
# question ("to be displayed on each individual ballot") and vote
# requirement the card and script quote, so its url is that capture.
# The page links the City's placing resolution (a 3-page scan) and its
# Exhibit A, the ordinance (an 8-page scan), both archived as the
# Registrar posted them, with no text layer; each is cited by what its
# page images show.
#
# No impartial analysis, argument or rebuttal was reached (the county's
# guide is blocked), and no document says whether any argument was
# filed.

