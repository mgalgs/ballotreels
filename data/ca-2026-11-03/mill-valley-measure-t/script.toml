# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the tax today (how long the
# city has had one, when the current one expires); what would change
# (the rate and its yearly step, the staff report's word that it is no
# increase, the exemption for older homeowners at or below a median
# income, how long it lasts and what it pays for, the spending limit in
# the same question, the vote it needs); the revenue as the ballot
# question gives it; both sides, neither of which has an archived
# argument; what a vote does. The rates for second units, apartments and
# businesses are left to the Rate and Method, for length.
#
# No place name and no person is narrated: the opening says "the voters
# of this city", and the county housing authority is not named. The
# card and title carry the names. No vote count of the Council or of
# past elections is given.
#
# No impartial analysis was archived. What the tax does is stated from
# the Rate and Method of Apportionment (Exhibit B, the tax's full text)
# and the resolution forming the district (the services, the end date,
# the use of the money, the spending limit, the two-thirds vote); the
# card quotes the ballot proposition from Section 2 of the resolution
# calling the election. Both resolutions are agenda copies with their
# numbers left blank, and the proposition ends on "Resolution No.
# 26-___", quoted as printed; the draft action minutes record that the
# Council adopted both on July 29, 2026. The proposition prints only bare
# YES and NO cells, so the card has no YES/NO boxes and both vote lines
# highlight the same phrase. The staff report is used only for the
# tax's history, the current tax's expiry and its statement that the
# rate is no increase, attributed to it. The draft action minutes are
# cited for the Council's adoption of the resolutions.
#
# The question's "improved fire suppression" is the City's own word in
# the proposition; the narration says what the resolution's Exhibit A
# lists (fire suppression, including vegetation management and tree
# maintenance, and street and road repair), without "improved".
#
# The $1.9 million a year is the ballot question's figure. No archived
# source states the City's general fund budget, so it has no scale
# (STANDARD.md 6.5; left open, under [[question]]).
#
# No argument for or against Measure T was archived, and no document
# says whether any was filed (Attachment 5 only authorizes one in
# favor). So the sides do not say none was filed: each says none is
# among the documents gathered (filed = false, STANDARD.md 2.5), as for
# Walnut Creek Measure U.

