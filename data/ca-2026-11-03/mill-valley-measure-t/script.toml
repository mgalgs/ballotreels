# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the tax today (when the
# current one expires); what would change
# (the rate and its yearly step, the staff report's word that it is no
# increase and the impartial analysis's that the rates are increased,
# the exemption for older homeowners at or below a median
# income, how long it lasts and what it pays for, the spending limit in
# the same question, the vote it needs); the revenue as the ballot
# question gives it; both sides (an argument in favor; none against was
# filed); what a vote does. The rates for second units, apartments and
# businesses are left to the Rate and Method, for length.
#
# No place name and no person is narrated: the opening says "the voters
# of this city", and the county housing authority is described, not named. The
# card and title carry the names. No vote count of the Council or of
# past elections is given.
#
# What the tax does is stated from the Rate and Method of Apportionment
# (Exhibit B, the tax's full text) and the resolution forming the
# district (the services, the end date, the use of the money, the
# spending limit, the two-thirds vote). The card quotes the ballot
# question as the county's measure page prints it, ending "Resolution
# No. 26-49"; the resolution calling the election printed the same
# question in its agenda copy with the number left blank, and remains a
# source for the spending limit and the vote. The county's page prints
# only bare YES and NO, so the card has no YES/NO boxes and both vote
# lines highlight the same phrase. The draft action minutes are cited
# for the Council's adoption of the resolutions.
#
# The rate: the staff report says the $303 rate is no increase over
# what taxpayers pay now; the City Attorney's impartial analysis says
# the current tax was approved in 2016 at a base rate of $266 per
# residence and that Measure T renews it with the rates increased. Both
# are given, each attributed, one line each, neither reconciled; no
# arithmetic is done on them.
#
# The question's "improved fire suppression" is the City's own word in
# the proposition; the narration says what the resolution's Exhibit A
# lists (fire suppression, including vegetation management and tree
# maintenance, and street and road repair), without "improved".
#
# The $1.9 million a year is the ballot question's figure. No archived
# source states the City's general fund budget, so it has no scale
# (STANDARD.md 6.5; left open, under [[question]]).
#
# The county's page prints an argument in favor and says "No argument
# against Measure T was filed." The yes side gives the argument's points
# (its signers are not named); the no side says what the county says
# (filed = false, STANDARD.md 2.5).

contest = "ca-2026-11-03-mill-valley-measure-t"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "county-page"
number = "T"
title = "Community Facilities District No. 2026-1 (Municipal Services)"
origin = "City of Mill Valley"
summary = "To renew funding exclusively for improved fire suppression activities including vegetation management and tree maintenance, and road repair and street maintenance, shall the Mill Valley Municipal Service Tax be renewed within the City of Mill Valley Community Facilities District Number 2026-1, at a rate of $303 for single family residential property, with a 2% annual adjustment, raising an average of $1.9 million annually over 10 years, and shall the appropriations limit be established, all as specified in Mill Valley City Council Resolution No. 26-49?"

