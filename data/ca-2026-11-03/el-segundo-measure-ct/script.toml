# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; how it reached the ballot; how
# the 2022 change set today's rates; what would change for each kind of
# group; the revenue figure, from the ballot question; the argument for,
# and that no argument against was submitted; what a vote does.
#
# Only the ballot question, the City Attorney's impartial analysis and
# the argument for were gathered (no full text), so the neutral lines
# are from the question and the analysis alone. The analysis calls the
# 2022 result an "unintended consequence"; the argument for calls it a
# "loophole". Both words stay out of the neutral sections, which say
# only what changed and when (STANDARD.md 6.3).
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". The 2022 measure is not named
# by its letter, which reads to the name check as an undeclared name.
#
# The card quotes the measure's entry in the county's list "Measures
# Appearing on the Ballot", which prints no yes/no meanings, so the card
# has no boxes; the vote lines take both meanings from the impartial
# analysis and highlight the same phrase of the question.
#
# The $700,000 a year is the ballot question's figure; the analysis gives
# none, and no archived source states the City's general fund budget, so
# it is given without a scale (STANDARD.md 6.5; left open, under
# [[question]]). The $150 is a tax per organisation, exempt.
#
# Sides: the argument in favor, signed by the mayor, the mayor pro tem
# and three council members, is presented from its text; the county's
# list says "Opponents: None submitted.", and the no side says so
# (filed = false).

contest = "ca-2026-11-03-el-segundo-measure-ct"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "CT"
title = "CITY OF EL SEGUNDO"
origin = "VOTE PASSAGE – Majority Vote 50%+1"
summary = "Shall an Ordinance amending the City's Business License Tax Ordinance to restore and impose a business license tax on nonprofit organizations that do not serve a charitable purpose, and also to exempt charitable organizations from having to pay a business license tax, thereby indefinitely restoring approximately $700,000 general funds annually, be adopted?"

[[section]]
id = "what"
heading = "Measure CT"

[[section.line]]
text = "Measure CT asks the voters of this city whether to change how the business license tax applies to charities and other nonprofits."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["to restore and impose a business license tax on nonprofit organizations that do not serve a charitable purpose"]

[[section]]
id = "background"
heading = "How it reached the ballot"

[[section.line]]
text = "The City Council placed Measure CT on the ballot, and it needs a simple majority to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "city-council-chamber"

[[section.line]]
id = "before-2022"
text = "Before 2022, charities paid no business license tax, and nonprofits that do not serve a charitable purpose paid the regular tax."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "business-license-certificate"

[[section.line]]
id = "in-2022"
text = "In 2022, voters approved changes to the tax that set a flat $150 a year for charities and for all nonprofit organizations."
sources = ["impartial-analysis"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Today, charities and nonprofits that do not serve a charitable purpose both pay the $150 flat rate."
sources = ["impartial-analysis"]

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "nonprofits"
text = "Nonprofits that do not serve a charitable purpose would again pay the regular business license tax."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "city-storefronts"

[[section.line]]
id = "charities"
text = "Charities would no longer pay the $150 tax, and would be fully exempt."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "donation-checks"

[[section]]
id = "fiscal"
heading = "What it would raise"

[[section.line]]
id = "revenue"
text = "The ballot question says the change would restore about $700,000 a year to the general fund of the city."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["restoring approximately $700,000 general funds annually"]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say the measure closes a loophole letting nonprofits without a charitable purpose pay the rate meant for charities, and fully exempts true charities."
sources = ["argument-for"]
basis = ["An unintended loophole resulted: certain nonprofit entities that do not actually operate for charitable purposes have been able to claim the same flat $150 tax rate meant for local charities", "Instead of paying the $150 tax, true charitable organizations in El Segundo will be fully exempt from the Business License Tax"]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Closes a loophole", "Fully exempts true charities"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "The official county list of measures for this election says that no argument against Measure CT was submitted, by any group or person."
sources = ["arguments-filed"]

[section.line.visual]
kind = "list"
source = "arguments-filed"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote exempts charities fully, and has other nonprofits pay the regular tax."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["to restore and impose a business license tax on nonprofit organizations that do not serve a charitable purpose"]

[[section.line]]
text = "A no vote keeps the $150 yearly rate for both."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["to restore and impose a business license tax on nonprofit organizations that do not serve a charitable purpose"]

[[question]]
ask = "Who pays what today, and how did that come about?"
lines = ["before-2022", "in-2022"]

[[question]]
ask = "Who would pay more, and who less?"
lines = ["nonprofits", "charities"]

[[question]]
ask = "How big is $700,000 a year next to the city budget?"
unanswered = true
