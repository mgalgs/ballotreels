# Archived sources for Riverside County Measure A, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1). The guide's pages are cut from the
# Riverside County Registrar of Voters' County Voter Information Guide
# (ballot type 415; the Measure A pages are the same in every ballot
# type's guide); "page" is the guide's printed footer number.
#
# The guide prints the Expenditure Plan, not the ordinance; the
# ordinance is archived from the Riverside County Transportation
# Commission. The guide prints no fiscal analysis or tax rate statement
# (a sales tax, not a bond).

[contest]
id = "ca-2026-11-03-riverside-county-measure-a"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/county:riverside"
kind = "measure"
title = "Riverside County Measure A: Continuing the Half-Cent Transportation Sales Tax"

