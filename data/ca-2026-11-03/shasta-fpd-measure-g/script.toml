# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; the board today, who placed the measure on the
# ballot, and the vote it needs; what would change and the purpose the
# ballot question states; no cost estimate; both sides, neither of which
# has an argument among the documents; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the opening
# says "the voters of this fire protection district". The card, title and
# `voters` line carry the name. "Counsel" is heard as "Council"
# (standard/speakability.txt), so the narration does not say it.
#
# The card quotes the guide page's ballot question. pdftotext reads its
# yes and no boxes, set side by side, into each other, but County
# Counsel's analysis on the same page prints the same two sentences
# together, so the card's yes and no quote them from there. That the
# change is "to provide better representation for the district" is the
# ballot question's own statement of purpose, attributed to it.
#
# No argument for or against Measure G is printed, but no official
# document says in words that none was filed. So the sides do not say
# none was filed: each says none is among the documents gathered
# (filed = false, STANDARD.md 2.5), as for Livingston Measures T and U.

contest = "ca-2026-11-03-shasta-fpd-measure-g"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "G"
title = "SHASTA FIRE PROTECTION DISTRICT, NUMBER OF MEMBERS OF BOARD OF TRUSTEES"
origin = "Measure G"
summary = "Shasta Fire Protection District Services Measure. A YES vote would allow the Shasta Fire Protection District to increase its governing board from 3 members to 5 members to provide better representation for the district. Shall an ordinance authorizing an increase of the existing 3-person Board of Trustees to a 5-person Board of Trustees be adopted?"
yes = "If a majority of the voters voting on the measure vote “yes”, the Board of Trustees of the Shasta Fire Protection District will be increased to five members."
no = "A “no” vote on this measure will disapprove the proposal and there will be no change to the number of members on the Board of Trustees."

