# Archived sources for Beaumont Unified School District Measure B,
# 2026-11-03 general election (sources/sources.md). Every id here may be
# cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1). The guide's pages are cut from the San
# Bernardino County Registrar of Voters' comprehensive Voter Information
# Guide, PDF pages 177 to 182; "page" is the guide's printed footer
# number (SB COMPREHENSIVE-175 to -180).
#
# The guide's Full Text prints the ballot question; with the Impartial
# Analysis, which states what a yes and a no vote do, it is the card's
# source. The district is administered mainly by Riverside County: its
# Impartial Analysis is by Riverside County's County Counsel, and its
# Tax Rate Statement refers to Riverside County's tax rolls. The division
# is the district's Census boundary, as divisions.tsv gives it.

[contest]
id = "ca-2026-11-03-beaumont-unified-measure-b"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/school_district:beaumont_unified_school_district"
kind = "measure"
title = "Beaumont Unified School District Measure B: School Repair Bonds"

[[source]]
id = "guide-page"
kind = "official-title-summary"
publisher = "San Bernardino County Registrar of Voters, Voter Information Guide, pages SB COMPREHENSIVE-175 to -180: Bond Measure B's ballot question and Impartial Analysis"
