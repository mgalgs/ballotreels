# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and of whom; how a school bond is repaid and what it needs to
# pass; what the money would pay for; the district's tax statement; one
# line per side; what a vote does.
#
# The guide's Full Text prints the ballot question (the card's title);
# the Impartial Analysis, by Riverside County's County Counsel, on the
# same pages, gives the card's origin, summary and yes and no lines.
# "Counsel" is heard as "Council" (standard/speakability.txt). The bond
# total and the debt service are repaid from a tax on property in the
# district, and no archived source states the district's budget, so they
# have no budget scale (STANDARD.md 6.5; left open). The tax statement
# gives $20 per $100,000 as both its average and its highest rate. The
# supporters' "without increasing taxes" is their argument, so the
# neutral sections leave out the analysis's like sentence on current tax
# rates (STANDARD.md 6.3); the card quotes the question's "Without
# increasing current tax rates" as printed.
#
# No argument against Measure B was filed. The no side says so plainly;
# its section is marked filed = false.

contest = "ca-2026-11-03-beaumont-unified-measure-b"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide-page"
number = "B"
title = "Without increasing current tax rates, to repair/replace deteriorating roofs, plumbing, HVAC and electrical systems; improve student safety/security; repair/upgrade aging classrooms, science labs, school/career technology facilities at existing schools to support college/career readiness in health sciences, engineering, skilled trades; shall Beaumont Unified School District's measure be adopted authorizing $86,000,000 in bonds at legal rates, levying $20 per $100,000 assessed value ($6,000,000 annually) while bonds are outstanding, with audits, citizen oversight, all money locally controlled?"
origin = "The Board of Trustees of the District, by adopting Resolution No. 2026-27-03 (\"Resolution\"), elected to call an election to place this Measure on the ballot."
summary = "The purpose of Measure B is to enable voters to authorize or reject the Beaumont Unified School District (\"District\") issuing and selling bonds to provide financing for school facilities projects."
yes = "A \"YES\" vote on Measure \"B\" is a vote to authorize the District to issue and sell bonds to provide financing of school facilities projects."
no = "A \"NO\" VOTE on Measure \"B\" is a vote to reject the District from issuing and selling bonds to provide financing of school facilities projects."

[[section]]
id = "what"
heading = "Measure B"

[[section.line]]
text = "Beaumont Unified School District Measure B asks the district's voters whether to approve $86 million in school bonds."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["authorizing $86,000,000 in bonds"]

[[section]]
id = "today"
heading = "How a school bond works"

[[section.line]]
text = "The district would borrow the money and repay it from taxes on property in the district."
sources = ["tax-statement"]

[section.line.visual]
kind = "illustration"
name = "bond-certificates"

[[section.line]]
text = "Measure B needs 55 percent of the vote to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "The money would go to listed projects, such as repairing roofs, plumbing and air conditioning, and upgrading classrooms and science labs."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "school-classroom"

[[section]]
id = "fiscal"
heading = "What the tax statement says"

[[section.line]]
text = "The district's tax statement estimates a tax of $20 per $100,000 of assessed value, on average and at most, through 2056-2057."
sources = ["tax-statement"]

[section.line.visual]
kind = "illustration"
name = "debt-payments"

[[section.line]]
text = "The statement estimates the total to repay, with interest, at about $178 million."
sources = ["tax-statement"]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Measure B would repair aging schools and leaky roofs without increasing taxes."
sources = ["arguments"]
basis = ["our oldest schools are aging and are starting to show the wear and tear.", "Last year alone, our schools experienced 138 roof leaks.", "Measure B addresses these problems without increasing taxes by a single penny."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Repairs to roofs, plumbing and electrical systems", "Local funding, without increasing taxes"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure B was filed for the San Bernardino County voter guide."
sources = ["arguments"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote is a vote to let the district issue the bonds."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["a vote to authorize the District to issue and sell bonds"]

[[section.line]]
text = "A no vote is a vote to stop the district issuing the bonds."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["a vote to reject the District from issuing and selling bonds"]
