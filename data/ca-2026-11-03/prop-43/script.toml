[section.line.visual]
kind = "illustration"
name = "special-tax"

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Today, special taxes that local governments propose need two-thirds of the vote."
sources = ["title-summary", "lao-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section.line]]
text = "But court decisions let special taxes that voters propose pass with a majority."
sources = ["lao-analysis"]

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "From 2027, Proposition 43 would require two-thirds for voter-proposed special taxes too."
sources = ["lao-analysis"]

[section.line.visual]
kind = "illustration"
name = "ballot-box"

