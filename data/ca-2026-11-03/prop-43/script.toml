# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; what a special tax is; the two vote thresholds today, and
# the court decisions behind them; what Proposition 43 would change; the
# analyst's view; one point per side; what a vote does.

contest = "ca-2026-11-03-prop-43"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "quick-reference"
number = "43"
title = "LIMITS VOTERS’ ABILITY TO RAISE REVENUES FOR LOCAL GOVERNMENT SERVICES. LEGISLATIVE CONSTITUTIONAL AMENDMENT."
origin = "Put on the Ballot by the Legislature"
summary = "Limits voters’ ability to pass voter-proposed local special taxes by increasing percentage of votes needed to approve such ballot measures from a majority (over 50%) to two-thirds, beginning January 1, 2027. Fiscal Impact: Possibility that local government tax revenues will not go up as much in the future due to a higher vote threshold for certain taxes."
yes = "A YES vote on this measure means: Certain local government taxes would require two-thirds approval by voters."
no = "A NO vote on this measure means: Certain local government taxes could continue to be approved by voters with a majority vote."

[[section]]
id = "what"
heading = "Proposition 43"

[[section.line]]
text = "Proposition 43 is about the votes some local taxes need to pass."
sources = ["quick-reference"]

[section.line.visual]
kind = "page"
source = "quick-reference"
highlight = ["percentage of votes needed"]

[[section]]
id = "background"
heading = "What a special tax is"

[[section.line]]
text = "A special tax is a local tax used for one specific purpose."
