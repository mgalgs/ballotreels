# Archived sources for Lost Hills Union School District Measure E,
# 2026-11-03 general election (sources/county-sources.md). Every id here
# may be cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# Kern County Elections posts each local measure's filed documents on its
# page "November 3, 2026, General Election", which lists them client-side,
# so no document has its own recoverable URL: every source here cites that
# page. The ballot question is quoted from Exhibit A of the measure's full
# text as the county posts it (the same words open Exhibit B, the full
# text of the bond proposition); the county's letter list prints no
# ballot question. County Counsel's impartial analysis is the measure's
# neutral explanation, the kind a state's attorney general's explanatory
# statement is, and gives the district's tax rate estimate; the county
# posts no separate tax rate statement for Measure E.
#
# The argument in favor is a scan with no text layer, and leaves the
# measure's letter blank (Measure " "); the passages cited were typed from
# the page images into sources/county-argument-for-transcription.txt,
# which the source points at. The county posts no argument against and no
# rebuttals, but no official document says in words that none was filed.
# The district's resolution (sources/county-resolution.pdf, a scan) is not
# cited: the full text gives the question and the projects.

