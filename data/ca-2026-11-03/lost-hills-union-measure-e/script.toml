# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; how a school bond is repaid and what it needs
# to pass; what the money may pay for; the district's tax estimate, as the
# impartial analysis and the ballot question give it; one line per side;
# what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the opening
# says "the voters of this school district". The card and title carry the
# names. "Counsel" is heard as "Council" (standard/speakability.txt), so
# the narration does not say it.
#
# The card quotes the ballot question from Exhibit A of the measure's full
# text, which prints "Bonds – Yes" and "Bonds – No" but no yes and no
# sentences, so the vote lines take their meaning from the impartial
# analysis and both highlight the question's amount. The county posts no
# tax rate statement for Measure E: the fiscal lines give the district's
# estimate as the impartial analysis states it, and the yearly levy as the
# ballot question states it; neither gives the total to repay. The levy is
# paid by property owners, not from the district's budget, and no
# archived source states that budget, so it has no budget scale
# (STANDARD.md 6.5; left open), as other school bonds' do.
#
# The supporters cite the decade since the last local investment, the
# state's money for repairs, safety and security, health and comfort,
# teachers, the local economy and the taxpayer safeguards. The neutral
# sections describe the projects only as the ballot question names them
# and leave the safeguards and the salary ban out (STANDARD.md 6.3). The
# argument leaves the measure's letter blank; the script does not quote
# that line.
#
# The county posts no argument against Measure E, but no official document
# says in words that none was filed. So the no side does not say none was
# filed: it says none is among the documents the county has posted
# (filed = false, STANDARD.md 2.5), as for Livingston Measures T and U.

contest = "ca-2026-11-03-lost-hills-union-measure-e"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "E"
title = "Lost Hills Union School District Repair, Safety, Upgrade Measure"
origin = "EXHIBIT A"
summary = "To retain teachers / maintain quality local schools by upgrading older schools; ensure school safety / accessibility; repair deteriorating classrooms / bathrooms, update fire / electrical / lighting / security systems, replace air conditioning; repair, equip facilities; shall Lost Hills Union School District’s measure be adopted, authorizing $9,000,000 in bonds at legal rates, levying $30 per $100,000 of assessed valuation, ($720,000 annually) while bonds are outstanding, no money for administrators’ salaries, requiring spending disclosure / citizens oversight, all funds staying local?"

