# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and of whom; how a school bond is repaid and what it needs to
# pass; what the money would pay for; the district's tax statement; one
# line per side; what a vote does.
#
# The ballot label prints no title line above its question, so the card
# quotes the question as its title (as Utah's card does) and the
# impartial analysis's statement of what the measure does as its
# summary. The question names "Santee Elementary School District"; the
# guide's heading, the analysis and the tax statement say "Santee School
# District", which the title and narration use. "Counsel" is heard as
# "Council" (standard/speakability.txt). The bond total and the debt
# service are repaid from a tax on property in the district, and no
# archived source states the district's budget, so they have no budget
# scale (STANDARD.md 6.5; left open). The fiscal line gives the tax
# statement's highest rate beside its average, as it prints both. The
# supporters' "no increase in your current tax rate" is their argument,
# so it stays out of the neutral sections (STANDARD.md 6.3).
#
# No argument against Measure BB was filed. The no side says so plainly;
# its section is marked filed = false.

contest = "ca-2026-11-03-santee-school-measure-bb"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-label"
number = "BB"
title = "With funds that cannot be taken by the State and spent elsewhere, and no increase in tax rates, shall Santee Elementary School District’s measure: • repairing leaky roofs, plumbing, sewer systems • updating inefficient heating, ventilation, air-conditioning systems • building multipurpose instruction classrooms • repairing aging schools, classrooms be adopted authorizing $30 million of bonds with legal rates, average levies below $13 per $100,000 of assessed valuation ($2.2 million annually) while outstanding, audits, independent oversight, and full public disclosure of all spending?"
origin = "The Board of Education for the Santee School District (“District”) placed this measure on the ballot."
summary = "If approved by 55% of the votes cast, this measure will authorize the District to issue and sell general obligation bonds in an amount not to exceed $30,000,000."
yes = "A “YES” vote is in favor of authorizing the District to issue and sell $30,000,000 in general obligation bonds."
no = "A “NO” vote is against authorizing the District to issue and sell $30,000,000 in general obligation bonds."

[[section]]
id = "what"
heading = "Measure BB"

[[section.line]]
text = "Santee School District Measure BB asks the district's voters whether to approve $30 million in school bonds."
