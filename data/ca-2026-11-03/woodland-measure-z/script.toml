# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the urban limit line voters set
# in 2006 and its ban on city services beyond it; what would change
# (which businesses could be served, and that the city decides each
# case); that no cost estimate is given; one line per side; what a vote
# does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". The 2006 measure is told by
# its year, not its letter, so it is not confused with this one.
#
# The resolution and full text were not archived (the county page's
# "Full Text" tab only offers a copy from the City Clerk); the ballot
# question and the impartial analysis state what the measure does, and
# the script says nothing they do not. That the exception leaves out
# homes is in the analysis, but the supporters rest their case on it
# ("strictly prohibit new residential development"), so the neutral
# sections leave it to their line (STANDARD.md 6.3). No argument against
# was filed, so the no side sets `filed = false`.

contest = "ca-2026-11-03-woodland-measure-z"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "Z"
title = "City of Woodland Measure"
origin = "On June 16, 2026, the City Council voted to place Measure “Z” on the November 3, 2026 general municipal election ballot"
summary = "Shall the measure amending the policy establishing the City’s Urban Limit Line to permit the extension of sewer, water, and recycled water facilities to serve existing commercial facilities located on parcels with a boundary that falls wholly or partially within one mile of the Urban Limit Line and in operation on or prior to November 3, 2026, be adopted?"
yes = "A \"yes\" vote on Measure “Z” will allow the City to extend City sewer, potable water and services to existing commercial facilities within one mile of the ULL on a case by case basis, subject to City Council approval and all applicable regulatory approvals."
no = "A \"no\" vote on Measure “Z” will keep the language of Policy 2.A.1 in its current form as originally enacted by Measure “A”, and will prohibit any extension of City services or facilities beyond the ULL."

[[section]]
id = "what"
heading = "Measure Z"

[[section.line]]
text = "Measure Z asks the voters of this city whether to extend sewer and water service to some businesses just outside the urban limit line."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["permit the extension of sewer, water, and recycled water facilities"]

[[section]]
id = "background"
heading = "The urban limit line"

[[section.line]]
id = "line-2006"
text = "In 2006, voters set a permanent urban limit line, to contain growth and protect the farmland around the city."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "farm-and-timber-land"

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Today, the city may not extend public services to properties beyond that line."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "water-pipes"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "who-qualifies"
text = "Businesses on parcels within one mile of the line could be served, if they were operating by election day."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "town-edge-pipeline"

[[section.line]]
id = "case-by-case"
text = "The city would not have to serve them, and each extension would need city council approval."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "city-council-chamber"

[[section]]
id = "fiscal"
heading = "What it would cost"

[[section.line]]
text = "The voter guide for this county does not include a cost estimate for the measure."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"
stamp = "None reported"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Measure Z protects groundwater and water quality, and keeps the line's ban on new homes intact."
sources = ["arguments"]
basis = ["Measure Z protects the critical groundwater resources that residents and family farmers rely on", "eliminating septic systems that could contaminate groundwater and harm our environment", "Measure Z maintains the key Urban Limit Line protections that strictly prohibit new residential development"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Protects groundwater and water quality", "Keeps the ban on new homes"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure Z was filed by the July deadline, so only an argument in favor appears."
sources = ["arguments"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote lets the city extend service to those businesses, case by case."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["on a case by case basis"]

[[section.line]]
text = "A no vote keeps the ban on city services beyond the line."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["will prohibit any extension of City services or facilities beyond the ULL"]

[[question]]
ask = "Which businesses could get city sewer and water?"
lines = ["who-qualifies"]

[[question]]
ask = "Would the city have to serve every business that asks?"
lines = ["case-by-case"]

[[question]]
ask = "Which businesses, and how many, would qualify?"
unanswered = true
