# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; the district today (created by state law,
# covering the county, running its hospitals, required to put a funding
# source to voters); what would change (when the tax starts and how long
# it lasts, what it may pay for, the vote it needs); the full text's
# revenue estimate; both sides, neither of which has an archived
# argument; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this health care district", and no
# hospital is named. The card and title carry the names. "Counsel" is
# heard as "Council" and "county's" as "counties"
# (standard/speakability.txt), so the narration says neither.
#
# The card quotes the ballot question as the Registrar's Measure N PDF
# prints it, with blank Yes and No lines and no yes/no sentences, so the
# card has no boxes, the vote lines give the impartial analysis's
# meanings, and both highlight the same phrase of the question. The
# analysis does not say who placed the measure, so the card's origin is
# the District as the question names it.
#
# The background is the full text's own history of the District, as
# fact: the 2023 law creating it, its hospitals, and the 2024 law
# requiring its board to propose a funding source. The text's warnings of
# what would happen without the tax ("risk service reduction, quality
# decline, or potential closures") are its authors' case, not fact, so
# the script leaves them out, as it does the consultant's range of
# revenue "needed".
#
# The $8.9 million a year is the full text's estimate. No archived
# source states the District's budget to give it a scale (STANDARD.md
# 6.5; left open, under [[question]]).
#
# No argument for or against Measure N was archived: the Registrar's
# Measure N PDF prints none, and with no full guide posted it is not
# known whether any was filed. So each side says none is printed in the
# posted pages (filed = false, STANDARD.md 2.5).

contest = "ca-2026-11-03-imperial-valley-healthcare-measure-n"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "N"
title = "Maintaining Local Hospitals and Emergency Healthcare Services"
origin = "Imperial Valley Healthcare District"
summary = "To maintain local access to emergency medical care, fund hospital operations, maintenance, technology and equipment, expand services, retain qualified doctors and nurses, and achieve a financial position allowing the District to finance legally required seismic upgrades; shall Imperial Valley Healthcare District impose a parcel tax of $111.00 per parcel on the secured property tax roll until repealed, with independent audits and all funds dedicated to hospital services?"

