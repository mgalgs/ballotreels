# Archived sources for Solano County Measure H, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# No printed Solano County voter guide was archived: these are the filed
# documents the Solano County Registrar of Voters posts on its Current
# Election Information page. The ballot question is quoted from
# Resolution No. 2026-150, which orders it "included on the ballot"; the
# same scan carries the ordinance (Attachment A). The resolution and
# both arguments are scans with no text layer: the passages `check`
# reads verbatim were typed from the page images into .txt
# transcriptions beside the PDFs, which name the PDF and URL they copy;
# those sources point at the transcriptions, and their urls at the
# scans. County Counsel's impartial analysis is the measure's neutral
# explanation. No tax rate statement or fiscal analysis was posted; the
# one revenue estimate is the ballot question's, as the analysis gives
# it.
#
# No rebuttal to the argument against was posted; the rebuttal to the
# argument in favor is not cited.

