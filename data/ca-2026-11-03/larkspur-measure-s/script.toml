# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the regional paramedic authority
# and the tax today; what would change (the most it could be, the yearly
# confirmation, what the question says of its use); the vote it needs;
# the revenue estimate with its scale; both sides (the argument in
# favor; none against was filed); what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city", and the Ross Valley Paramedic
# Authority is "the regional paramedic authority". The card and title
# carry the names. No person is named.
#
# The neutral lines rest on the ballot question, the resolution (the
# measure's only text) and the plain facts of the City staff report; the
# county's Measure S page prints the same question (the card is left as
# it was) and the City Attorney's impartial analysis, which is cited
# beside the lines it states too (this year's rate and end date, the
# two-thirds vote). The analysis gives the yearly increase as "$3.50" in
# one paragraph and "up to $4" in another; the rate line keeps the
# ballot question's "up to $4", which the analysis's second statement
# matches, and does not cite the analysis. The resolution's recital of "responsive, high-quality" care, the ballot
# question's opening purpose clause and the staff report's praise of the
# authority are words of need and benefit and are not narrated; what
# the question promises of the money is attributed to the question. The
# card quotes the ballot question from Section 2 of the resolution,
# named by its number; the resolution prints only YES and NO cells
# beside the question, so the card has no yes/no boxes and both vote
# lines highlight the same phrase of the question.
#
# The ballot question's "approximately $834,000 annually" is paramedic
# tax revenue. Its scale is the regional paramedic authority's budget,
# the one the staff report sets the parcel tax against ("a significant
# portion of the approximately $3.8 million annual budget"): 834,000 /
# 3,800,000 = 22 percent (STANDARD.md 6.5). No archived source states
# the City's own general fund. The tax rates are amounts per housing
# unit or per 1,000 square feet (exempt).
#
# The county's page prints an argument in favor of Measure S and says
# "No argument against Measure S was filed." The yes side distils the
# argument (its signers are not named); "at the current tax rate" is the
# argument's own claim and stays in the yes line: the neutral lines give
# the rates as the question and the staff report do. The no side says,
# as the county does, that none was filed (filed = false, STANDARD.md
# 2.5), as for California Proposition 1.

contest = "ca-2026-11-03-larkspur-measure-s"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "S"
title = "RESOLUTION 46/26"
origin = "CITY OF LARKSPUR"
summary = "To maintain rapid 9-1-1 emergency response times and preserve the number of on-duty paramedics ready to respond to accidents/medical emergencies, shall the Ross Valley Paramedic Authority measure be adopted continuing for four years the paramedic services special tax of up to $107.50 / residential living unit or 1,000 square feet of developed nonresidential property, adjusted up to $4.00/ year, generating approximately $834,000 annually, with annual audits, public spending disclosure and all funds for local paramedic services?"

