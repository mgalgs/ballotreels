# Archived sources for City of Larkspur Measure S, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# Marin County's guide could not be archived, and the City's Elections
# page posts no impartial analysis or argument, so no argument was
# archived and no document says whether any was filed. These are the
# City's files: Resolution 46/26, which calls the election and whose
# Section 2 is the ballot question (no ordinance was attached: the
# resolution is the measure's only text); the staff report for item
# 8.1B of the June 3, 2026 City Council meeting; and the draft minutes
# of that meeting, which record that the Council adopted Resolution
# 46/26 (the posted resolution's signature lines are blank; its
# certification and the minutes both record its adoption on June 3,
# 2026; no line narrates it, so neither is cited for it). The City
# Clerk's Notice of Election of July 8, 2026 prints the same question.
#
# The question is set beside YES and NO cells, which the PDF's text
# layer interleaves with it, so the card's source (ballot-question) is
# sources/resolution-46-26-ballot-question-extract.txt, the question
# copied from the text layer without them; its url is the PDF.
#
# The staff report is the City staff's and the paramedic authority's
# material: only its plain facts are cited (the current and proposed
# yearly rates, the current tax's end, the yearly confirmation of the
# rate, and the authority's budget of "approximately $3.8 million"),
# never its statements of need or benefit, and never its attached draft
# ballot argument, which is not a filed argument. It is of kind
# public-record: no allowed kind fits a city staff report exactly, and
# official-report is reserved for a nonpartisan fiscal office's reports.
#
# The letter S and the two-thirds vote are confirmed by the Registrar of
# Voters' Board of Supervisors staff report 26-4515.

