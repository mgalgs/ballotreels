# Archived sources for City of Irvine Measure D, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1). Every source is a page of the Measure D section ("Ballot
# Measures-D", Section 11) of the Orange County Registrar of Voters'
# Voter Information Guide, one archived PDF; "page" is the section's own.
#
# The City Attorney's Impartial Analysis is the measure's neutral
# explanation, the kind a state's attorney general's explanatory
# statement is. No tax rate statement or fiscal analysis is printed (it
# is not a tax measure).

[contest]
id = "ca-2026-11-03-irvine-measure-d"
