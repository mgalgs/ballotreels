# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; what a charter is, as the
# resolution states the law; how it reached the ballot (the council, an
# advisory committee, two hearings); what would change, in the ballot
# question's own words, attributed to it, and the vote it needs; no cost
# estimate; one line per side; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". The card and title carry it.
#
# No impartial analysis was posted, and the charter's text is not in the
# county's file. So the neutral sections say only what Resolution No.
# 2026-83 states: the constitutional rule, the process, the question and
# the vote it needs. What the charter would let the city do (contracting,
# elections, prevailing wage) is argued by both sides in their own
# words, so it stays in their sections (STANDARD.md 6.3); the earlier
# committee draft is not the confirmed text and is not cited. The
# change section gives the ballot question's description attributed to
# the question, since the argument against disputes it.
#
# The card quotes the question as Resolution No. 2026-83 gives it, the
# county's copy, with no yes/no sentences. So the card has no boxes; the
# vote lines say what adopting means, and both highlight the same phrase.
#
# Both sides filed. Each line distils its argument's opening claim; the
# argument for's "rather than relying solely on" is kept as "rather than
# relying only on", not "instead of". No signer is named on either side.

contest = "ca-2026-11-03-mcfarland-measure-n"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "N"
title = "RESOLUTION NO. 2026-83"
origin = "The following question shall be placed on the ballot:"
summary = "Shall the City of McFarland adopt a City Charter that would provide local control over municipal affairs while remaining subject to state and federal law?"

[[section]]
id = "what"
heading = "Measure N"

[[section.line]]
text = "Measure N asks the voters of this city whether to adopt a city charter."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["adopt a City Charter"]

[[section]]
id = "background"
heading = "What a charter is"

[[section.line]]
id = "charter"
text = "The state constitution lets a city adopt a charter for its own governance, by a majority vote of its voters."
sources = ["resolution"]

[section.line.visual]
kind = "illustration"
name = "constitution-page"

[[section]]
id = "today"
heading = "How it reached the ballot"

[[section.line]]
id = "process"
text = "The City Council proposed the charter, and appointed an advisory committee to help draft it."
sources = ["resolution"]

[section.line.visual]
kind = "illustration"
name = "city-council-chamber"

[[section.line]]
text = "The council held two public hearings on it, in March and April 2026."
sources = ["resolution"]

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "question-says"
text = "The ballot question says the charter would provide local control over municipal affairs, while staying subject to state and federal law."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["local control over municipal affairs", "subject to state and federal law"]

[[section.line]]
text = "Measure N needs a majority vote to pass."
sources = ["resolution"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "fiscal"
heading = "What it would cost"

[[section.line]]
text = "The county elections page for this election does not include a cost estimate for the measure."
sources = ["resolution"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"
stamp = "None reported"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say the charter lets local officials accountable to local voters decide local affairs, rather than relying only on one-size-fits-all state laws."
sources = ["argument-for"]
basis = ["It allows decisions about local municipal affairs to be made by local elected officials accountable to McFarland voters rather than relying solely on one-size-fits-all state laws designed for cities across California.", "A charter city remains subject to state and federal laws on matters of statewide concern"]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Local decisions by locally accountable officials", "Still subject to state and federal law"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say the charter gives the city government too much authority, while it weakens competitive bidding, taxpayer protections and public accountability."
sources = ["argument-against"]
basis = ["It gives the government too much authority while weakening competitive bidding, taxpayer protections, and public accountability.", "many important decisions would be left to future ordinances adopted by the same City Council receiving this expanded authority."]

[section.line.visual]
kind = "list"
source = "argument-against"
items = ["Too much authority for the government", "Key rules left to future ordinances"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote adopts the proposed city charter."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["adopt a City Charter"]

[[section.line]]
text = "A no vote does not adopt the proposed city charter."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["adopt a City Charter"]

[[question]]
ask = "What is a city charter?"
lines = ["charter"]

[[question]]
ask = "Who wrote the charter, and how?"
lines = ["process"]

[[question]]
ask = "What exactly does the charter say?"
unanswered = true
