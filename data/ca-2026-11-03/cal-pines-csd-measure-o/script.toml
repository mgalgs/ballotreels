[section.line.visual]
kind = "illustration"
name = "water-pipes"

[[section.line]]
id = "duration"
text = "The tax would continue unless a later two-thirds vote of the district's voters ends it."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "special-tax"

[[section]]
