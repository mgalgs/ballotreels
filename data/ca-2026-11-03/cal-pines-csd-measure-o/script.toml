# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; which parcels pay the tax today
# and how much, and the vote Measure O needs; what would change (the new
# amount and when, what the money is for, how long it lasts); the
# impartial analysis's revenue estimate; both sides, neither of which
# has a posted argument; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this community services district". The
# card and title carry the name. The tax applies only to parcels in Lake
# Units 1B, 3 and 4 and the Mobile Home Park (County Counsel's "CSD
# Area"); the narration says "three of the district's lake units and its
# mobile home park", and the card's question names them. The whole
# District votes (the resolution's Section 7), so `voters` names it.
#
# Modoc County posts no voter guide, so the card quotes the ballot
# question from the District's Resolution No. 2026-F, which prints it
# with bare YES and NO boxes and no yes/no lines: the card has no YES/NO
# boxes, and the vote lines give County Counsel's own meanings. Every
# neutral line rests on the impartial analysis, the resolution or the
# ordinance (Exhibit A). That inflation and rising costs have made the
# existing tax inadequate is the District's finding, and with no
# argument posted for either side the script leaves it out (STANDARD.md
# 6.3).
#
# The analysis's $98,000 a year is District revenue, and no archived
# source states the District's budget, so it has no scale (STANDARD.md
# 6.5; left open). The tax amounts are per parcel (exempt).
#
# No argument for or against Measure O is posted by the county, and with
# no guide to check it is not known whether one was filed: each side
# says none is among the documents the county posted (filed = false,
# STANDARD.md 2.5), as Measure P's sides do.

contest = "ca-2026-11-03-cal-pines-csd-measure-o"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "O"
title = "Services Special Parcel Tax Measure"
origin = "California Pines Community Services District"
summary = "Shall the ordinance be adopted to provide additional annual revenue for community services district services, including power, water, and wastewater systems, collecting solid waste, and plowing and maintaining roads, by increasing the annual special parcel tax for the California Pines Community Services District from $66 to $116 on each nonexempt parcel in Lake Units 1B, 3, and 4, and the Mobilehome Park, generating approximately $98,000 a year, until ended by voters?"

[[section]]
id = "what"
heading = "Measure O"

[[section.line]]
text = "Measure O asks the voters of this community services district whether to raise a yearly parcel tax for district services in part of the district."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["increasing the annual special parcel tax"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "today-tax"
text = "Today, each parcel the tax applies to, in three of the district's lake units and its mobile home park, pays $66 a year."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["Lake Units 1B, 3, and 4, and the Mobilehome Park"]

[[section.line]]
id = "threshold"
text = "Measure O needs two-thirds of the vote to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "amount"
text = "Measure O would raise the tax to $116 a year per parcel, starting in the 2027-2028 fiscal year."
sources = ["impartial-analysis", "text"]

[section.line.visual]
kind = "bars"
title = "District services tax per parcel each year, in dollars"
