# Archived sources for City of Lincoln Measure F, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# Placer County Elections publishes no combined guide document; it posts
# each measure's guide pages as one PDF, headed "MEASURE F" and "LINCOLN
# PUBLIC SAFETY/TAXPAYER PROTECTION MEASURE", paged MF1 to MF7. One PDF
# backs every source here. The City Attorney's Impartial Analysis is the
# measure's neutral explanation, of the kind the other Placer County
# measures give it, and gives the one revenue estimate; a sales tax has
# no tax rate statement. No argument against was submitted. The
# ordinance is printed as "ORDINANCE XXXXB", its number not yet given.

