# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and of whom; what a public bank is;
# how it reached the ballot and what it needs to pass; what would change
# (the rates and term, where the money goes); the impartial analysis's
# revenue estimate; one line per side; what a vote does.
#
# The guide prints no fiscal analysis or tax rate statement (not a
# bond); the one revenue estimate is the city's, in the ballot question
# and the City Attorney's Impartial Analysis. No archived source states
# the city's general fund budget, so the estimate has no scale
# (STANDARD.md 6.5; left open).
#
# The yearly inflation increase is the opponents' argument ("automatic
# annual tax increases"), and the loans the fund could make if no bank
# is authorized by 2033 the supporters' rebuttal, so the neutral
# sections leave both out (STANDARD.md 6.3).
#
# The guide prints no yes/no lines for this measure, so, as for Utah, the
# card has no YES/NO boxes, and the two vote lines highlight the one
# phrase of the question they turn on.

contest = "ca-2026-11-03-berkeley-measure-z"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide-page"
number = "Z"
title = "CITY OF BERKELEY MEASURE Z"
origin = "This measure was placed on the ballot by an initiative petition signed by the requisite number of registered voters in the City of Berkeley."
summary = "Shall the measure creating a special parcel tax to capitalize and support a public bank to fund investments in affordable housing, green energy/infrastructure and small businesses, at rates of $0.06/square foot of residential improvements and $0.09/square foot of non-residential improvements, estimated to generate approximately $9,200,000 the first year and $58,300,000 over its six-year duration, with funds subject to review, allocation and approval by the City Council and regular audits, be adopted?"

[[section]]
id = "what"
heading = "Measure Z"

[[section.line]]
text = "City of Berkeley Measure Z asks voters in the city whether to add a parcel tax to start a public bank."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["to capitalize and support a public bank"]

[[section]]
id = "background"
heading = "What a public bank is"

[[section.line]]
text = "A public bank is a nonprofit bank owned by one or more local governments."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "bank-building"

[[section]]
id = "today"
heading = "How it reached the ballot"

[[section.line]]
text = "Voters signed a petition to put Measure Z on the ballot, and it needs a majority vote to pass."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "ballot-box"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "Homes would pay 6 cents and other property 9 cents a year per square foot of buildings, from 2027, for six years."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "special-tax"

[[section.line]]
text = "The money would start and support a public bank investing in affordable housing, green energy and small businesses."
sources = ["guide-page"]

[[section]]
id = "fiscal"
heading = "What the impartial analysis says"

[[section.line]]
text = "The City Attorney's impartial analysis says the city estimates the tax would raise $9.2 million in its first year, and $58.3 million in all."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "income-taxes"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Measure Z keeps Berkeley money local, investing in housing, green energy and small businesses, with profits going to the city."
sources = ["arguments"]
basis = ["Let's Keep Berkeley Money Local and invest in affordable housing, green energy, and our homegrown small businesses.", "With Measure Z, the bank's profits go to the city, not billionaires,"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Keeps Berkeley money local", "Bank profits go to the city"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say Berkeley would pay $58.3 million for an experimental bank that may never be authorized, and would subsidize other cities."
