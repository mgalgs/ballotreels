basis = ["$58.3 million for an experimental bank that may never receive regulatory authorization to operate.", "This measure requires Berkeley property taxpayers to subsidize other jurisdictions."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["A bank that may never be authorized", "Automatic yearly tax increases"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
