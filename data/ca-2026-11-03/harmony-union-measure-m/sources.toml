# Archived sources for Harmony Union School District Measure M,
# 2026-11-03 general election (sources/sources.md). Every id here may be
# cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# The Sonoma County Registrar of Voters publishes each measure's pages
# of its guide as one PDF, headed "Local Ballot Measure: M" and footed
# "Sonoma County" with the guide's page numbers (049M553 to 049M555); no
# cover page was archived, so the sources name those pages, not a guide
# title. One PDF backs every source here. County Counsel's Impartial
# Analysis is the measure's neutral explanation, and the one estimate of
# what the tax would raise: a parcel tax has no tax rate statement, and
# the pages print none. The pages print an argument in favor and "No
# Argument Was Submitted Against Measure M", and no rebuttals.

[contest]
id = "ca-2026-11-03-harmony-union-measure-m"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/school_district:harmony_union_school_district"
kind = "measure"
title = "Harmony Union School District Measure M: Education Parcel Tax"

