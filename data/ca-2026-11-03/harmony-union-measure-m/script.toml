# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; what a parcel tax is and what it needs to
# pass; how long it would run, what it would pay for and who may be
# exempt; the impartial analysis's estimate; one line per side; what a
# vote does.
#
# A parcel tax has no tax rate statement, and the pages print none; the
# one estimate is the impartial analysis's ($177,600 a year). The tax is
# paid into the district's budget, but no archived source states that
# budget, so the figure has no budget scale (STANDARD.md 6.5; left
# open). The supporters cite the audits, the oversight committee and the
# bar on administrator salaries, so the neutral sections leave them out
# (STANDARD.md 6.3); they do not cite the exemptions, which the neutral
# section gives, in short, from the impartial analysis. The vote lines
# highlight the words that differ between the two boxes, since the rest
# is printed in both. "Counsel" is heard as "Council"
# (standard/speakability.txt), so the narration says "the impartial
# analysis".
#
# No argument against Measure M was submitted. The no side says so
# plainly; its section is marked filed = false.

contest = "ca-2026-11-03-harmony-union-measure-m"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "measure-question"
number = "M"
title = "Harmony Union School District"
origin = "Measure M was placed on the ballot by the Governing Board of the District."
summary = "To maintain and enhance quality education programs by funding Harmony Union School District’s Garden Enrichment Program at Harmony and Salmon Creek School, a comprehensive farm-to-table interactive education program, as well as student mental health and academic intervention services, shall Harmony Union School District’s education parcel tax measure be adopted, at the rate of $75 per year (raising approximately $177,600 annually), for four years, with an exemption for those 65 years and older and all funds spent on local students?"
yes = "A “yes” vote on Measure M is a vote to approve an educational parcel tax of $75 per year per parcel at a fixed rate for four years, commencing in fiscal year 2027-28."
no = "A “no” vote on Measure M is a vote against the educational parcel tax of $75 per year per parcel at a fixed rate for four years."

