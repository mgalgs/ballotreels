# Archived sources for Calaveras Unified School District Measure A,
# 2026-11-03 general election (sources/sources.md). Every id here may be
# cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# The Calaveras County Clerk-Recorder / Registrar of Voters prints the
# whole measure in its Voter Information Pamphlet, cut here to pages 16
# to 28 of the PDF: the section cover (16), the impartial analysis with
# the ballot question at its head and the yes and no meanings (17), the
# district's tax rate statement (18), the argument in favor and
# "ARGUMENT AGAINST MEASURE A (None Filed)" (19), and the full text
# (20 to 28). The impartial analysis is the measure's neutral
# explanation; the tax rate statement is its fiscal statement. No
# rebuttals are printed. The district's Resolution No. 2025-26-31,
# posted by the county, is archived beside it and not cited.

