# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; how a school bond is repaid and what it needs
# to pass; what the money may pay for; the district's tax rate
# statement; one line per side; what a vote does.
#
# No name of the district, county or schools is narrated (the narrator
# mispronounces them): the opening says "the voters of this school
# district", and the supporters' line says "the district's schools".
# The card, title and chart titles carry the names. "Counsel" is heard
# as "Council" (standard/speakability.txt), so the narration says
# "impartial analysis" only.
#
# The card quotes the ballot question as the county's Voter Information
# Pamphlet prints it at the head of the impartial analysis, with the
# analysis's own yes and no meanings as its YES and NO boxes; the vote
# lines say those meanings, each highlighting its own box.
#
# The bond total and the debt service are repaid from a tax on property
# in the district, and no archived source states the district's budget,
# so they have no budget scale (STANDARD.md 6.5; left open). The tax
# statement's average rate is said with its highest rate beside it, so
# the average does not stand alone; the fiscal years are written in full
# (standard/speakability.txt). The bar on paying salaries, the audits and
# the oversight committee, the State matching funds and "no projected
# increase to existing tax rates" are in the supporters' argument, so
# the neutral sections leave them out (STANDARD.md 6.3); the card shows
# the ballot question's own words.
#
# The pamphlet prints "ARGUMENT AGAINST MEASURE A (None Filed)". The no
# side says so plainly; its section is marked filed = false.

contest = "ca-2026-11-03-calaveras-unified-measure-a"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "A"
title = "BOND MEASURE SUBMITTED TO THE VOTERS"
origin = "This Measure has been placed on the ballot by the Board of Education (“Board”) of the Calaveras Unified School District (“CUSD”)."
summary = "To improve the quality of education, upgrade and modernize outdated classrooms, restrooms and school facilities; expand/renovate career technical education classrooms and programs; replace leaky roofs and old HVAC systems; shall Calaveras Unified School District’s measure be adopted authorizing $66,800,000 of Bonds at legal rates, estimated levies averaging 4.9 cents per $100 assessed value ($4,750,000 annually) while bonds are outstanding, with annual audits, citizens’ oversight, all money staying local, with no projected increase to existing tax rates?"
yes = "A “YES” vote on Measure A would authorize the District to finance facility improvements at CUSD sites via the issuance of bonds in the amount of $66,800,000."
no = "A “NO” vote on Measure A is a vote against authorizing the District to issue bonds to finance the above school site facility improvements."

[[section]]
id = "what"
heading = "Measure A"

[[section.line]]
text = "Measure A asks the voters of this school district whether to approve $66,800,000 in school bonds."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["authorizing $66,800,000 of Bonds"]

[[section]]
id = "today"
heading = "How a school bond works"

[[section.line]]
id = "repaid"
text = "The district would sell the bonds and repay them from a tax on property in the district."
sources = ["tax-statement"]

[section.line.visual]
kind = "illustration"
name = "bond-certificates"

[[section.line]]
text = "Measure A needs 55 percent of the vote to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "projects"
text = "The money could go to projects such as modernizing classrooms, renovating career training facilities, and replacing leaky roofs and old heating and cooling systems."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "school-workshop"

[[section]]
id = "fiscal"
heading = "What the tax statement says"

[[section.line]]
id = "tax-rate"
text = "The district's tax rate statement estimates $49.44 a year per $100,000 of assessed value, on average, through 2060-2061."
sources = ["tax-statement", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "debt-payments"

[[section.line]]
id = "tax-peak"
text = "The statement estimates the highest rate at $58.03 per $100,000, starting in 2039-2040."
sources = ["tax-statement"]

[[section.line]]
text = "The statement estimates the total to repay, with interest, at about $161.6 million."
sources = ["tax-statement"]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say the district's schools, nearly 55 years old on average, must be upgraded, and Measure A would not raise tax rates."
sources = ["arguments"]
basis = ["The average age is nearly 55 years", "Aging classrooms and facilities must be upgraded", "Approving Measure A will improve our schools without increasing tax rates."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Schools average nearly 55 years old", "Will not increase tax rates"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure A was filed, so the county voter pamphlet prints only the argument in favor of the measure."
sources = ["arguments"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote would authorize the district to finance school improvements by issuing the bonds."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["would authorize the District to finance facility improvements"]

[[section.line]]
text = "A no vote is a vote against authorizing the district to issue the bonds."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["a vote against authorizing the District to issue bonds"]

[[question]]
ask = "Who would repay the bonds?"
lines = ["repaid"]

[[question]]
ask = "What would the bond money pay for?"
lines = ["projects"]

[[question]]
ask = "How much would property owners pay?"
lines = ["tax-rate", "tax-peak"]

[[question]]
ask = "How big is $66,800,000 next to the district's yearly budget?"
unanswered = true
