# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; what stays the same (the measure
# permits no cannabis business by itself); what would change (the
# starting and top rates, where the money goes, how long, the vote it
# needs); the two revenue estimates; both sides, neither with an archived
# argument; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". The card and title carry it.
#
# The card quotes the guide's "BALLOT MEASURE K" page, which prints the
# ballot question alone, with no yes and no sentences: the origin is the
# question's own "City of Willows", and both vote lines highlight the
# same phrase of the question. The impartial analysis's yes/no sentences
# call the measure a "transaction and use tax", which it is not (the
# ordinance says the tax "is not a sales and use tax"), so the vote lines
# do not quote them.
#
# Two official revenue estimates disagree: the ballot question says
# about $280,000 a year, and the guide's fiscal analysis, citing
# Resolution No. 28-2026, says about $260,000. Both are given in one
# line, each attributed, with neither preferred (rule 5b). The fiscal
# analysis's caveats (a lower first year at the 5 percent starting rate,
# administrative costs not yet determined) follow it. No archived source
# states the City's general fund budget, so the figures have no scale
# (STANDARD.md 6.5; left open, under [[question]]).
#
# The guide prints no argument for or against Measure K, but no official
# document says in words that none was filed. So the sides do not say
# none was filed: each says none is among the documents gathered
# (filed = false, STANDARD.md 2.5), as for Livingston Measures T and U.

contest = "ca-2026-11-03-willows-measure-k"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "K"
title = "BALLOT MEASURE K"
origin = "City of Willows"
summary = "Shall the City of Willows adopt a business tax on cannabis business activities of up to 10% of gross receipts, to fund unrestricted general revenue purposes such as police, ﬁre, roads, and recreation; which is expected to generate approximately $280,000 annually and will be levied until repealed by the voters or City Council?"

[[section]]
id = "what"
heading = "Measure K"

[[section.line]]
text = "Measure K asks the voters of this city whether to tax cannabis businesses on what they take in."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["a business tax on cannabis business activities of up to 10% of gross receipts"]

[[section]]
id = "today"
heading = "What stays the same"

[[section.line]]
id = "permit"
text = "Measure K would not, by itself, permit any cannabis business to operate in the city."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "cannabis-shop-counter"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "rates"
text = "The fiscal analysis says the rate would start at 5 percent for one year; the city council could then raise it, up to 10 percent."
sources = ["fiscal-analysis"]

[section.line.visual]
kind = "bars"
title = "Tax rate on gross receipts"
source = "fiscal-analysis"
unit = "%"
labels = ["First year", "Highest allowed"]
values = [5, 10]

[[section.line]]
id = "general"
text = "As a general tax, the money could pay for any city purpose, until the voters or the council repeal it."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "state-budget"

[[section.line]]
id = "threshold"
text = "Measure K needs a simple majority to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "fiscal"
heading = "What it would raise"

[[section.line]]
id = "revenue"
text = "The ballot question estimates about $280,000 a year, and the fiscal analysis estimates about $260,000 a year."
sources = ["ballot-question", "fiscal-analysis"]

[section.line.visual]
kind = "illustration"
name = "sales-receipt"

[[section.line]]
id = "caveats"
text = "The fiscal analysis adds that the first year may bring in less, and the cost of running the tax is not yet known."
sources = ["fiscal-analysis"]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"
filed = false

[[section.line]]
text = "No argument for Measure K appears among the official documents gathered for this video."
