# Archived sources for City of Willows Measure K, 2026-11-03 general
# election (sources/county-sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The Glenn County Elections Department's General Election Voter
# Information Guide prints Measure K's ballot question (page 19), its
# full text, Ordinance No. 770-2026 (pages 20 to 36), the Willows City
# Attorney's impartial analysis (page 37) and a "Fiscal Analysis of
# Measure K" (page 38); each was cut from the guide into its own file.
# The impartial analysis is the measure's neutral explanation, the kind a
# state's attorney general's explanatory statement is; the fiscal
# analysis is its fiscal statement (kept as county-tax-rate-statement.pdf,
# though it is no tax rate statement). The guide prints no argument for
# or against Measure K; its later pages are blank, and no official
# document says in words that none was filed.

