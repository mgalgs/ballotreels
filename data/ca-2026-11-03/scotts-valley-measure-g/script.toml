# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and of whom; who pays the hotel tax and where its money goes; what
# would change, with the impartial analysis's own $100 room example; the
# vote it needs; that no estimate of its revenue was published; one line
# per side; what a vote does.
#
# "City's" is heard as "cities" (standard/speakability.txt), so the
# narration says neither.
#
# No fiscal impact or tax rate statement was posted, and the City
# Attorney's analysis gives no revenue estimate; the $300,000 a year is
# the supporters' figure, so it stays in their argument and out of the
# neutral sections (STANDARD.md 6.3), as do the analysis's note that much
# of the tax would be paid by people from outside the city (the
# supporters' "Paid only by visitors") and the services the general fund
# pays for (their "parks, roads, public safety"). The fiscal line follows
# the no-cost-estimate wording, naming the documents actually seen: the
# printed county guide was not.
#
# The county's measure page posts no argument against Measure G and no
# rebuttals. The no side says only that none appears in the published
# measure documents, and is filed = false, as for Proposition 37.
#
# The card quotes the ballot question from the City Council's
# resolution, which prints no yes and no statements, so the vote lines
# take their meanings from the City Attorney's impartial analysis and
# highlight the one phrase of the question both votes turn on, as Utah's
# do.

contest = "ca-2026-11-03-scotts-valley-measure-g"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "G"
title = "RESOLUTION CALLING A MUNICIPAL ELECTION FOR NOVEMBER 3, 2026, REQUESTING THAT THE COUNTY CONSOLIDATE THE MUNICIPAL ELECTION WITH THE GENERAL ELECTION ON NOVEMBER 3, 2026, AND SUBMITTING THE QUALIFIED ELECTORS OF THE CITY OF SCOTTS VALLEY AT THE NOVEMBER 3, 2026, CONSOLIDATED GENERAL ELECTION A LOCAL BALLOT MEASURE REGARDING AN INCREASE IN THE CITY'S TRANSIENT OCCUPANCY TAX"
origin = "Pursuant to Government Code Section 53724 and Elections Code 9222, the City Council hereby submits the Ordinance attached hereto as Attachment A to the voters at the Election and orders the following question to be submitted to the voters at the Election:"
summary = "Shall the City of Scotts Valley adopt an ordinance amending Section 3.24.030 of the Municipal Code raising the transient occupancy tax rate from 11% to 13%?"

