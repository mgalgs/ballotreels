# Archived sources for Alview-Dairyland Union School District Measure V,
# 2026-11-03 general election (sources/sources.md). Every id here may be
# cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# The Madera County Clerk-Recorder & Registrar of Voters posts each
# measure's filed documents on its election page; the printed County
# Voter Information Guide was not found online. The ballot question is
# quoted from Appendix B, the "Abbreviated Form of Bond Measure", of the
# Board of Trustees' Resolution No. 26-27-02, as Yosemite Unified
# Measure Y's is from its board's resolution. County Counsel's impartial
# analysis is the measure's neutral explanation, the kind a state's
# attorney general's explanatory statement is; the district's tax rate
# statement (the resolution's Appendix C) is its fiscal statement.
#
# Every PDF but the legal notice is a scan with no text layer. The
# passages cited were typed from the page images into
# sources/*-transcription.txt, each naming the PDF and URL it copies;
# those sources point at the transcription, and their url at the scan.
# The registrar posts no argument against and no rebuttals.

[contest]
id = "ca-2026-11-03-alview-dairyland-measure-v"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/school_district:alview-dairyland_union_elementary_school_district"
kind = "measure"
title = "Alview-Dairyland Union School District Measure V: $7.3 Million School Facilities Bond"

