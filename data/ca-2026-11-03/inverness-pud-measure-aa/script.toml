# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; what an appropriations limit is
# and why the district puts this question every four years (the staff
# report's plain facts, attributed); who placed it and the vote it needs;
# what would change (the resolution's question); no cost estimate; both
# sides (an argument in favor; none against was filed); what a vote
# does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this utility district". The card, the
# title and the "Only voters in ..." line carry the name.
#
# The card quotes the ballot question from DRAFT Resolution 299-2026, the
# only copy online (sources.toml). The draft's adoption line still names
# April 21, 2026; the script takes the fact and the date of adoption
# from the approved May 19 minutes instead, and never repeats April 21.
# The resolution prints no yes/no lines, so the card has no boxes and the
# vote lines take their meaning from the question.
#
# The narration calls the appropriations limit "the spending limit" and
# says what it is (the staff report's own description: the most tax
# money the district may spend in a fiscal year). The measure's text
# says nothing about any tax rate, so the script says nothing about one.
# That the calculated limit is smaller than the tax money the district is
# entitled to, and that the district must ask every four years to keep
# the difference, are the staff report's statements, attributed to it.
# The figure in search snippets of the county's Measure AA page ($653,712)
# is in no archived document and is not used.
#
# Neither the resolution nor the staff report gives a cost figure, so
# the fiscal line says so, naming both; County Counsel's impartial
# analysis gives none either. The county's page prints an argument in
# favor and says "No argument against Measure AA was filed." The yes
# side gives the argument's points (its signers are not named); the no
# side says what the county says (filed = false, STANDARD.md 2.5).

contest = "ca-2026-11-03-inverness-pud-measure-aa"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "resolution"
number = "AA"
title = "PROPOSING AN ADJUSTMENT IN THE APPROPRIATIONS LIMIT"
origin = "Inverness Public Utility District"
summary = "Shall the measure adjusting the appropriations limit for the Inverness Public Utility District pursuant to Article XIIIB of the California Constitution so that for each of the fiscal years 2026/2027 through 2029/2030 the appropriations limit shall include the combined total of all applicable revenue sources be adopted?"

[[section]]
id = "what"
heading = "Measure AA"

[[section.line]]
text = "Measure AA asks the voters of this utility district whether to adjust its spending limit for four fiscal years."
sources = ["resolution"]

[section.line.visual]
kind = "page"
source = "resolution"
highlight = ["Shall the measure adjusting the appropriations limit"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "limit"
text = "Since 1979, the state constitution has required the board to set the most tax money the district may spend each fiscal year."
sources = ["staff-report"]

[section.line.visual]
kind = "illustration"
name = "spending-limit"

[[section.line]]
id = "gap"
text = "The district's staff report says its calculated limit is substantially smaller than the tax money it is entitled to, and that keeping the difference takes a vote every four years."
sources = ["staff-report"]

[section.line.visual]
kind = "illustration"
name = "recurring-review"

[[section.line]]
id = "placed"
text = "The board placed Measure AA on the ballot on May 19, 2026, and it needs a majority of the vote to pass."
sources = ["minutes", "minutes-approval", "county-report", "county-page", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "adjust"
text = "For fiscal years 2026-2027 through 2029-2030, the limit would include the combined total of all applicable revenue sources."
sources = ["resolution"]

[section.line.visual]
kind = "page"
source = "resolution"
highlight = ["the appropriations limit shall include the combined total of all applicable revenue sources"]

[[section]]
id = "fiscal"
heading = "What it would cost"

[[section.line]]
id = "cost"
text = "Neither the resolution nor the staff report on it includes a cost estimate for the measure."
sources = ["resolution", "staff-report"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"
stamp = "None reported"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Measure AA keeps the district's full share of property taxes for fire protection, and will not raise taxes."
sources = ["argument-for"]
basis = ["Measure AA simply authorizes the County of Marin to transmit to the Inverness Public Utility District the full amount of the District’s statutory share of the property tax dollars paid by owners of property within Inverness.", "These revenues support Inverness fire protection, fire prevention, first-responder medical care, and disaster preparedness and response.", "A YES VOTE WILL NOT RAISE TAXES, A NO VOTE WILL NOT REDUCE TAXES."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Keeps tax money local", "Does not raise taxes"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "The elections office of the county says on its page for this measure that no argument against Measure AA was filed."
sources = ["county-page"]

[section.line.visual]
kind = "list"
source = "county-page"
items = ["No argument against was filed"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote adjusts the limit to include the combined total of all applicable revenue sources, for those four years."
sources = ["resolution"]

[section.line.visual]
kind = "page"
source = "resolution"
highlight = ["the appropriations limit shall include the combined total of all applicable revenue sources"]

[[section.line]]
text = "A no vote does not adjust the limit."
sources = ["resolution"]

[section.line.visual]
kind = "page"
source = "resolution"
highlight = ["Shall the measure adjusting the appropriations limit"]

[[question]]
ask = "What is an appropriations limit?"
