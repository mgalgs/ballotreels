# Archived sources for Inverness Public Utility District Measure AA,
# 2026-11-03 general election (sources/sources.md). Every id here may be
# cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# A public utility district has no Census boundary, so the division is
# the county and `voters` names the district (docs/SCRIPT-FORMAT.md).
# The county's list of measures is the authority for the letter and the
# district; the Registrar of Voters' staff report 26-4515 (September 8,
# 2026) gives each measure's vote required ("requires 50% approval").
# The county's Measure AA page (sources/county-page.txt, read in a
# browser on 2026-10-30, since marincounty.gov refuses scripted fetches)
# prints the same ballot question, the vote required ("simple
# majority"), County Counsel's impartial analysis, the argument in favor,
# and its statement that no argument against was filed.
#
# The ballot question is quoted from the DRAFT Resolution 299-2026 in the
# District's May 19, 2026 board packet (Agenda Item No. 4): the only copy
# online, unsigned, its vote lines blank. Its "PASSED AND ADOPTED" line
# still names April 21, 2026, a meeting that was cancelled; the script
# never repeats that date. The fact and date of adoption come from the
# approved minutes of May 19, 2026, item 4B, approved on the consent
# calendar of June 16, 2026. The staff report's own copy of the question
# reads "2025/2026 through 2029/2030"; the resolution, the minutes and
# the item's title read 2026/2027, which the script follows.
#
# The packet extract staged by the research round
# (ipud-packet-2026-05-19-item4-resolution-299-2026.pdf) holds the wrong
# pages (the item list, a fence estimate, a photograph and the staff
# report's first page), not the resolution. The resolution was taken
# from the same URL as packet pages 10 to 12 (the staff report and the
# two pages of the draft resolution) into
# sources/ipud-packet-2026-05-19-item4-pages-10-12.pdf, which the
# resolution and staff report sources point at; it has a text layer.
#
# The District General Manager's staff report is the District staff's
# material: it is cited only for plain facts about the appropriations
# limit (what the constitution requires, how the District's calculated
# limit compares with its tax proceeds, the four-year cycle), each
# attributed to it.

[contest]
id = "ca-2026-11-03-inverness-pud-measure-aa"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/county:marin"
kind = "measure"
title = "Inverness Public Utility District Measure AA: Adjusting the District's Appropriations Limit for Fiscal Years 2026/2027 Through 2029/2030"
voters = "the Inverness Public Utility District"

[[contest.correction]]
date = "2026-10-30"
note = "The video now gives the argument in favor printed by the county, and says, as the county does, that no argument against was filed."

