# Archived sources for City of San Gabriel Measure PS, 2026-11-03 general
# election (sources/la-sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The Los Angeles County Registrar-Recorder/County Clerk's list "Measures
# Appearing on the Ballot" (sources/county-measure-list-excerpt.txt, the
# measure's entry) gives its letter, vote threshold and ballot question,
# which the card quotes, and, on its "Supporters: ... Opponents: ..."
# line, that the firefighters' and police officers' association
# presidents filed the argument for and that no argument against was
# submitted: the no side cites it as the official statement of filing.
#
# The City Attorney's impartial analysis, the full text of the ordinance
# and the argument in favor are the Registrar's copies, from its
# Interactive Sample Ballot. A sales tax has no tax rate statement; the
# ballot question and the analysis each give a revenue estimate, and they
# differ ($7,100,000 and $7,000,000), so the script gives both.

[contest]
id = "ca-2026-11-03-san-gabriel-measure-ps"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:san_gabriel"
kind = "measure"
title = "City of San Gabriel Measure PS: A 1% Sales Tax Until Ended by Voters"

[[source]]
id = "ballot-question"
kind = "official-title-summary"
publisher = "Los Angeles County Registrar-Recorder/County Clerk, Measures Appearing on the Ballot, November 3, 2026 (Rev. 9/22/26): City of San Gabriel, Measure PS"
credit = "Los Angeles County Registrar-Recorder/County Clerk, Measures Appearing on the Ballot"
url = "https://content.lavote.gov/docs/rrcc/documents/final-measures-appearing-on-the-ballot-9-22-2026-v-2.pdf"
file = "sources/county-measure-list-excerpt.txt"
retrieved = "2026-10-30"

