# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the two offices today; what
# would change (who appoints and from when, qualifications and
# residence, the city manager) and the vote it needs; the staff report's
# fiscal impact; one line per side; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". The card and title carry it.
# "Appointive" is heard as "appointed" (standard/speakability.txt), so
# the narration says "appointed"; the card quotes the question as
# printed.
#
# Tehama County posts no voter guide for this election. The card quotes
# the ballot question from Section 1 of the City's Resolution No.
# 21-2026, transcribed from the scan the county posts; it prints no
# yes/no lines, so the card has no YES/NO boxes and the vote lines give
# the impartial analysis's own meanings, both highlighting the same
# phrase of the question.
#
# The neutral lines give what the measure's text and the City
# Attorney's analysis say would change, including that the council could
# set qualifications and that residence would no longer be required.
# The clerk's and treasurer's duties are left to the card and the
# analysis, for length.
# That the jobs are technical, that today's three requirements are too
# few, and accountability through performance reviews are the argument
# in favor's points, said only in its line (STANDARD.md 6.3).
#
# The staff report's fiscal impact gives both sides of the ledger: the
# $5,000 to $8,000 the county estimates for adding the measure to this
# ballot, paid from the City's General Fund, and savings on future
# elections for the two offices, with no figure, and no added salary
# (each stays at $3,600 a year). No archived source
# states the City's General Fund, so the $5,000 to $8,000 has no budget
# scale (STANDARD.md 6.5; left open).
#
# No argument against Measure D is posted by the county, and it is not
# known whether one was filed (no guide is posted), so the no side says
# none is among the filings posted (filed = false, STANDARD.md 2.5), as
# Alview-Dairyland V's does. The argument in favor is signed by the
# mayor and mayor pro tem; with no one on the record for the other side,
# the script names no one.

contest = "ca-2026-11-03-red-bluff-measure-d"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "D"
title = "APPOINTIVE CITY CLERK-TREASURER"
origin = "CITY COUNCIL RESOLUTION NO. 21-2026"
summary = "Shall the Offices of City Clerk and City Treasurer be Appointive?"

[[section]]
id = "what"
heading = "Measure D"

[[section.line]]
text = "Measure D asks the voters of this city whether the city clerk and city treasurer should be appointed instead of elected."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["Shall the Offices of City Clerk and City Treasurer be Appointive?"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Today, the voters elect the clerk and the treasurer to four-year terms."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "city-clerk-office"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "when"
text = "From November 2028, or sooner if an office falls vacant, the City Council would appoint them instead."
sources = ["text", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "city-council-chamber"

[[section.line]]
id = "rules"
text = "The council could set minimum qualifications, and neither would have to live in the city."
sources = ["impartial-analysis", "text"]

[[section.line]]
id = "manager"
text = "The council could let the city manager make the appointments."
sources = ["text", "impartial-analysis"]

[[section.line]]
text = "Measure D needs a majority vote to pass."
sources = ["text"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "fiscal"
heading = "What it would cost"

[[section.line]]
text = "The city staff report says adding the measure to this ballot costs $5,000 to $8,000."
sources = ["staff-report"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section.line]]
id = "savings"
text = "The report says the city would then save on future elections for the two offices, with no change in pay."
sources = ["staff-report"]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say both jobs are highly technical, and that appointed officers would be held accountable through performance reviews."
sources = ["argument-for"]
basis = ["These responsibilities require specialized education, training, and experience.", "The City Treasurer is also a highly technical position.", "The appointed positions would be held accountable through performance evaluation rather than elections."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Both jobs are highly technical", "Accountable through performance reviews"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure D appears among the filings the county elections office has posted for this election."
sources = ["argument-for"]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["No argument against was posted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote makes the city clerk and city treasurer appointed positions."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["be Appointive?"]

[[section.line]]
text = "A no vote means the city clerk and city treasurer will continue to be elected."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["be Appointive?"]

[[question]]
ask = "Who would choose the clerk and treasurer, and when?"
lines = ["when", "manager"]

[[question]]
ask = "Would the change cost the city more in pay?"
lines = ["savings"]
