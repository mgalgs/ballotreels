# Archived sources for City of Red Bluff Measure D, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# Tehama County Elections posts no local voter guide for this election:
# it posts each measure's filed documents separately on its elections
# page. For Measure D these are the City Council's staff report and
# Resolution No. 21-2026 as one scan with no text layer (the passages
# used were typed from the page images into
# sources/resolution-21-2026-transcription.txt, which names the PDF and
# URL it copies): the resolution prints the ballot question (Section 1)
# and the measure's text (Section 2), and the staff report's "CITY
# FISCAL IMPACT" is the one fiscal statement; the City Attorney's
# impartial analysis, the measure's neutral explanation; and the
# argument in favor as filed (a scan, transcribed the same way). No
# argument against or rebuttal is posted; whether one was filed is not
# known.

