# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; how a school bond is repaid and what it
# needs to pass; what the money would pay for and what it may not; the
# district's tax rate statement, with its expectation about the total
# bond tax rate; both sides, neither of which has an archived argument;
# what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this school district". The card and title
# carry the names.
#
# The county guide could not be fetched, so no impartial analysis was
# archived. The card quotes the ballot question from the Registrar's
# notice of election, which prints "BONDS YES BONDS NO" and no yes/no
# sentences, so the card has no boxes and both vote lines highlight the
# same phrase of the question. Every line on what the bonds would do
# rests on Appendix A of Resolution No. 26-27-04 as the Registrar posted
# it, and only on its project list and its rules, never on the Board's
# recitals.
#
# The question's "with no tax rate increase" is the District's claim. The
# fiscal line gives it as the tax rate statement does, attributed: the
# District expects its levy not to raise the cumulative bond tax rate
# above 2025-26's $93.20 per $100,000; the next line gives the trade-off
# the full text states beside it (STANDARD.md 6.4): the expectation is no
# cap, and the measure extends the final maturity of the outstanding
# bonds. The statement's years are written
# in full.
#
# The bond total and the debt service are repaid from a tax on property
# in the district, not from the district's budget, and no archived
# source states that budget, so they have no budget scale (STANDARD.md
# 6.5; left open), as Meadows Union Elementary Measure P's do.
#
# No argument for or against Measure T was archived, and no document
# says whether any was filed. So the sides do not say none was filed:
# each says none is among the documents gathered (filed = false,
# STANDARD.md 2.5), as for Walnut Creek Measure U.

contest = "ca-2026-11-03-exeter-unified-measure-t"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "notice"
number = "T"
title = "EXETER UNIFIED SCHOOL DISTRICT BOND MEASURE"
origin = "PUBLICATION NOTICE OF SPECIAL BOND ELECTION"
summary = "To improve the quality of education; modernize/renovate outdated classrooms, restrooms, and school facilities; make health, safety and security improvements; and repair or replace leaky roofs; shall Exeter Unified School District’s measure be adopted authorizing $23,000,000 of bonds at legal rates, with no tax rate increase, generating on average $1,425,000 annually while bonds are outstanding at rates of approximately $38.70 per $100,000 assessed value, with annual audits, citizens’ oversight, NO money for salaries and all money staying local?"

