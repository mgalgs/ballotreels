publisher = "Exeter Unified School District, Tax Rate Statement (Appendix C, pages C-1 and C-2, to Resolution No. 26-27-04), as posted by the Tulare County Registrar of Voters (transcribed from the scan)"
credit = "Tax Rate Statement, Exeter Unified School District"
url = "https://tc-web.widen.net/s/cxfnf9nkm9/general-bond-resolution-2026"
file = "sources/general-bond-resolution-transcription.txt"
