# Archived sources for Shasta-Tehama-Trinity Joint Community College
# District Measure C, 2026-11-03 general election, as Tehama County's
# voters see it (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# Tehama County Elections posts no local voter guide for this election:
# it posts each measure's filed documents separately on its elections
# page, here three scans with no text layer, whose passages used were
# typed from the page images into sources/*-transcription.txt (each
# names the PDF and URL it copies). The district's resolution (17
# pages: a cover letter, Resolution No. 2025-26-18, and its Appendix A,
# the full text; Appendix B, the ballot question; and Appendix C, the
# tax rate statement, the measure's fiscal statement) is complete in
# this copy, and its appendices B and C read word for word as the
# Humboldt County copy does. The impartial analysis the county posts is
# signed by Joseph Larmour, County Counsel, by Renee Belcastro, Deputy
# County Counsel, and names no county; it is the measure's neutral
# explanation. The argument in favor is as filed (the copy received by
# Trinity County). No argument against is posted; Trinity's and
# Lassen's guides print that none was submitted.
#
# A community college district has no Census boundary, so the measure's
# division is the county and `voters` names the district
# (docs/SCRIPT-FORMAT.md). The district reaches into six counties (the
# tax rate statement names them); Shasta, its home county, keeps the
# plain shasta-tehama-trinity-jccd-measure-c, and Tehama, Trinity,
# Lassen, Modoc and Humboldt each stage the same measure under a
# suffixed id.

[contest]
id = "ca-2026-11-03-shasta-tehama-trinity-jccd-measure-c-tehama"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/county:tehama"
kind = "measure"
title = "Shasta-Tehama-Trinity Joint Community College District Measure C: College Facility Bonds"
voters = "the Shasta-Tehama-Trinity Joint Community College District"

