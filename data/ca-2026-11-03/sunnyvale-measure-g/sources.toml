# Archived sources for City of Sunnyvale Measure G, 2026-11-03 general
# election. Every id here may be cited by script.toml.
#
# The Santa Clara County Registrar of Voters' List of Local Measures
# (sources/rov-measure-list-2026-10-29.html) is the authority for the
# measure's letter, its ballot question, verbatim, and its threshold
# ("Majority Vote Required"). The Registrar's posted copies of the City
# Attorney's impartial analysis and the filed arguments (sources/rov-*.pdf,
# described in sources/rov-sources.md) are scans with no text layer: each
# was typed from its page images into sources/rov-*-transcription.txt,
# which these sources point at for the verbatim checks; each url is the
# Registrar's PDF.
#
# Earlier research archived only the city's draft resolution (dated June
# 11, 2026, from the council's agenda packet), whose Exhibit A is the
# proposed Charter Section 1309; it is cited for the charter text only,
# and the Registrar's question and analysis for everything else. The
# council's draft argument in favor is superseded by the filed one and is
# not listed. Both rebuttals are archived beside the arguments; the
# script quotes neither, so they are not listed.

[contest]
id = "ca-2026-11-03-sunnyvale-measure-g"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:sunnyvale"
kind = "measure"
title = "City of Sunnyvale Measure G: Charter Amendment on Public Works Contracting"

