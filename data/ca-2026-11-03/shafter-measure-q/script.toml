# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; how it reached the ballot; what
# would change (the rate in plain money, where the money goes, when it
# starts and ends, that it stays in the city, the vote it needs); the
# revenue estimate as the impartial analysis gives it; both sides,
# neither of which has an argument among the county's documents; what a
# vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". The card, title and chart
# title carry it. "City's" sounds like "cities" (standard/speakability.txt),
# so the narration says "the city". The council's vote is said as the
# analysis says it ("unanimously"), not as a tally.
#
# The card quotes the measure as Resolution No. 3105 prints it, the
# county's copy, with blank Yes and No boxes and no yes/no sentences. So
# the card has no boxes; the vote lines give the impartial analysis's
# own meanings, and both highlight the same phrase of the question. The
# uses the question and the analysis list are on the card, not narrated:
# the money is a general tax's, for any lawful city program.
#
# The analysis does not say whether the city has a sales tax of its own
# today, so the script draws no chart of rates: it gives the rate as the
# analysis does, $1 per $100.
#
# The $4 million a year is the impartial analysis's estimate. No
# archived official document states the City's general fund budget to
# give it a scale (STANDARD.md 6.5; left open, under [[question]]).
#
# Kern County Elections' page posts no argument for or against Measure Q,
# and no document says that none was filed. So the sides do not say none
# was filed: each says none is among the documents gathered (filed =
# false, STANDARD.md 2.5), as for Livingston T and U.

contest = "ca-2026-11-03-shafter-measure-q"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "Q"
title = "CITY OF SHAFTER SALES TAX MEASURE."
origin = "RESOLUTION NO. 3105"
summary = "Shall the measure to provide local funding for City of Shafter services and facilities, including police services, traffic enforcement, street repairs and safety improvements, library and recreation services, park maintenance, and other municipal services, by enacting a 1% sales tax generating approximately $4,000,000 annually until ended by voters, with annual audits, public review, and all revenue remaining with the City of Shafter, be adopted?"

[[section]]
id = "what"
heading = "Measure Q"

[[section.line]]
text = "Measure Q asks the voters of this city whether to add a 1 percent sales tax for city services."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["by enacting a 1% sales tax"]

[[section]]
id = "today"
heading = "How it reached the ballot"

[[section.line]]
text = "The City Council voted unanimously in July to place Measure Q on the ballot."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "city-council-chamber"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "rate"
text = "The tax would add $1 for every $100 spent, on top of current sales taxes."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "sales-receipt"

[[section.line]]
id = "general"
text = "As a general tax, the money would go to the general fund, for any lawful city program or service."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "state-budget"

[[section.line]]
id = "local"
text = "The revenue would stay in the city, and would not be shared with the state or the county."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "city-storefronts"

[[section.line]]
id = "end"
text = "The tax would start on April 1, 2027, last until repealed by voters, and needs a majority vote to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "end-date"

[[section]]
id = "fiscal"
heading = "What the impartial analysis says"

[[section.line]]
id = "revenue"
text = "The city attorney's impartial analysis estimates about $4 million a year in added local funding."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"
filed = false

[[section.line]]
text = "No argument for Measure Q appears among the official documents gathered for this video."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "list"
source = "impartial-analysis"
items = ["No argument for was found"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure Q appears among the official documents gathered for this video."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "list"
source = "impartial-analysis"
items = ["No argument against was found"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote on Measure Q authorizes the 1 percent sales tax."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["by enacting a 1% sales tax"]

[[section.line]]
text = "A no vote on Measure Q does not authorize the 1 percent sales tax."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["by enacting a 1% sales tax"]

[[question]]
ask = "What could the money be spent on?"
lines = ["general"]

[[question]]
ask = "When would the tax start and end?"
lines = ["end"]

[[question]]
ask = "Does the city already have a sales tax of its own?"
unanswered = true

[[question]]
ask = "How big is $4 million a year next to the city budget?"
unanswered = true
