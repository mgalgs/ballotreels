# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the registration rules today and
# why only voters can change them; what would change (a permit for each
# kind of rental, the caps, the spacing rule, who could amend the new
# rules); that no cost estimate is given; one line per side; what a
# vote does.
#
# The caps are both in the measure and in both sides' arguments (the
# supporters' "capping whole-home rentals at 2%", the opponents' "strict
# caps"), so the neutral sections give them once, from the impartial
# analysis. That the City Council could amend the new rules is the
# analysis's own statement of what changes; both sides' rebuttals argue
# over it, in opposite directions, and neither argument cited here
# relies on it. The analysis's expectation that the cap will block new
# whole-home permits for main houses is cited by the opponents'
# rebuttal, so it stays out of the neutral sections (STANDARD.md 6.3).
# The guide prints no fiscal statement and the analysis no cost
# estimate: the fiscal line follows the no-cost-estimate wording, with
# "the voter guide for this county" for the guide's name, since no place name is
# narrated. The opponents' "neighboring communities like Grass Valley"
# is said as "nearby towns" for the same reason.

contest = "ca-2026-11-03-nevada-city-measure-q"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "Q"
title = "Nevada City Residential Short-Term Rental Measure"
origin = "City of Nevada City"
summary = "Shall the measure that replaces the existing residential short-term rental registration rules with a new permitting system and more detailed permit eligibility and operating rules be adopted?"
yes = "A ‘yes’ vote is a vote to replace Nevada City’s existing residential short-term rental registration rules with a new permitting system and more detailed rules."
no = "A ‘no’ vote is a vote to retain the existing short-term rental registration rules."

[[section]]
id = "what"
heading = "Measure Q"

[[section.line]]
text = "Measure Q asks the voters of this city whether to replace its short-term rental registration rules with a new permit system."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["replaces the existing residential short-term rental registration rules with a new permitting system"]

[[section]]
id = "today"
heading = "Short-term rentals today"

[[section.line]]
id = "today-rules"
text = "Today, the owner of any single-family home in the city can register it for rentals of under thirty days."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "single-family-street"

[[section.line]]
text = "Voters adopted those rules by petition, so only voters can change them."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "ballot-box"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "permits"
text = "Measure Q would require a permit to rent out a whole home, or rooms where a host lives."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "rental-permit"

[[section.line]]
id = "caps"
text = "Whole-home permits would be capped at 2 percent of the homes in the city, and 1 percent for accessory units."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "bars"
title = "Cap on whole-home permits, share of the city's homes"
source = "impartial-analysis"
unit = "%"
labels = ["Main houses", "Accessory units"]
values = [2, 1]

[[section.line]]
id = "spacing"
text = "No new permit could go within 300 feet of another permitted rental."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "measuring-wheel-street"

[[section.line]]
id = "amend"
text = "The city council could amend the new rules."
sources = ["impartial-analysis", "text"]

[section.line.visual]
kind = "illustration"
name = "city-council-chamber"

[[section]]
id = "fiscal"
heading = "What it would cost"

[[section.line]]
text = "The voter guide for this county does not include a cost estimate for the measure."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"
stamp = "None reported"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say clear rules let rentals keep operating responsibly, help keep more homes available for local residents, and strengthen public safety."
sources = ["argument-for"]
basis = ["it establishes clear rules that allow them to continue operating responsibly while helping keep more homes available for local residents.", "Measure Q also strengthens public safety by requiring 24-hour emergency contacts"]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["More homes kept for local residents", "Stronger public safety rules"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say Measure Q puts broad new restrictions on responsible homeowners, and could send visitors and their spending to nearby towns."
sources = ["argument-against"]
basis = ["it imposes broad new restrictions on responsible homeowners who have followed the rules.", "reducing short-term rental availability could shift overnight visitors—and their spending—to neighboring communities"]

[section.line.visual]
kind = "list"
source = "argument-against"
items = ["New limits on responsible homeowners", "Visitors may spend elsewhere"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote replaces the registration rules with a new permit system and more detailed rules."
sources = ["ballot-question"]

[section.line.visual]
