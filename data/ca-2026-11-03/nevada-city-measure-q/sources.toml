# Archived sources for City of Nevada City Measure Q, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# Nevada County Elections prints each local measure in Section 3 of its
# Voter Information Guide; pages 70 to 80 of the guide's PDF were cut
# into one excerpt, which backs every source here. The City Attorney's
# Impartial Analysis is the measure's neutral explanation. The guide
# prints no fiscal statement for Measure Q and the analysis gives no
# cost estimate. The rebuttals (pages 72 to 74) are not cited.

