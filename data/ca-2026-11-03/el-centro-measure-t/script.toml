# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the City's half percent sales
# tax today; what would change (the added rate and the total, how long
# it lasts, what is exempt, where the money goes, the vote it needs);
# the City's revenue estimate as the impartial analysis gives it; both
# sides, neither of which has an archived argument; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". The card and title carry the
# name. "City's" sounds like "cities" (standard/speakability.txt), so the
# narration says "the city general fund". The rates are said as
# percents, as the analysis gives them, since a sales tax said in cents
# is transcribed in dollars.
#
# The card quotes the ballot question as the Registrar's Measure T PDF
# prints it, with blank Yes and No lines and no yes/no sentences. So the
# card has no boxes, its origin is the impartial analysis's sentence
# placing the measure, the vote lines give the analysis's meanings, and
# both highlight the same phrase of the question.
#
# The $8.4 million a year is the City's estimate as the impartial
# analysis gives it. No archived source states the City's general fund
# budget to give it a scale (STANDARD.md 6.5; left open, under
# [[question]]). The existing tax's 2047 end date is the ordinance's
# recital.
#
# No argument for or against Measure T was archived: the Registrar's
# Measure T PDF prints none, and with no full guide posted it is not
# known whether any was filed. So each side says none is printed in the
# posted pages (filed = false, STANDARD.md 2.5).

contest = "ca-2026-11-03-el-centro-measure-t"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "T"
title = "EL CENTRO PUBLIC SAFETY/CITY SERVICES MEASURE"
origin = "The City Council of El Centro placed Measure T on the ballot for the November 3, 2026, election"
summary = "Shall the measure maintaining 911 response; helping prevent crime; retaining/attracting well-trained firefighters/paramedics/police; repairing streets/potholes; keeping public areas/parks safe/clean; increasing driver/pedestrian safety; addressing homelessness; retaining/attracting local businesses; maintaining youth recreation, senior, library programs, other general city services; establishing a ½¢ sales tax, providing approximately $8,400,000 annually until ended by voters, requiring audits, public spending disclosure, all funds locally controlled, be adopted?"

[[section]]
id = "what"
heading = "Measure T"

[[section.line]]
text = "Measure T asks the voters of this city whether to add a second half percent sales tax."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["establishing a ½¢ sales tax"]

[[section]]
id = "today"
heading = "The sales tax today"

[[section.line]]
id = "today-rate"
text = "Today, the city already charges a half percent sales tax of its own, set to end in 2047."
sources = ["impartial-analysis", "text"]

[section.line.visual]
kind = "bars"
title = "City sales tax rate"
source = "impartial-analysis"
unit = "%"
labels = ["Today", "With Measure T"]
values = [0.5, 1]

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "new-rate"
text = "Measure T would add another half percent, for a total city rate of 1 percent."
sources = ["impartial-analysis"]

[[section.line]]
id = "term"
text = "The new tax would last until voters repeal it."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "end-date"

[[section.line]]
text = "Groceries and prescription medicine would not be taxed."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "grocery-bag"

[[section.line]]
id = "general"
text = "As a general tax, the money would go into the city general fund, for any city purpose."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "city-council-chamber"

[[section.line]]
text = "Measure T needs a simple majority to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "fiscal"
heading = "What the impartial analysis says"

[[section.line]]
id = "revenue"
text = "The city attorney's impartial analysis estimates about $8.4 million a year in added revenue."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"
filed = false

[[section.line]]
text = "No argument for Measure T is printed in its posted pages."
sources = ["ballot-question"]

[section.line.visual]
kind = "list"
source = "ballot-question"
items = ["No argument for was printed"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure T is printed in its posted pages."
sources = ["ballot-question"]

[section.line.visual]
kind = "list"
source = "ballot-question"
items = ["No argument against was printed"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote approves the added half percent sales tax."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["establishing a ½¢ sales tax"]

[[section.line]]
text = "A no vote rejects the added sales tax."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["establishing a ½¢ sales tax"]

[[question]]
ask = "How much would the sales tax go up?"
lines = ["today-rate", "new-rate"]

[[question]]
ask = "How long would it last?"
lines = ["term"]

[[question]]
ask = "What can the money be spent on?"
lines = ["general"]

[[question]]
ask = "How big is about $8.4 million a year next to the city budget?"
unanswered = true
