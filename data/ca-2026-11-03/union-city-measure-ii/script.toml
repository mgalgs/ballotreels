# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and of whom; the tax today, what it covers, when voters approved
# it and when it ends; who is exempt; what would change (the new end
# date, a general tax, the vote needed); the revenue estimate, as the
# impartial analysis gives it; one line per side; what a vote does.
#
# The guide prints no tax rate statement or fiscal analysis (not a
# bond); the revenue estimate is in the ballot question and the City
# Attorney's Impartial Analysis. No archived source states the city's
# General Fund budget (the ordinance says only that the tax's money goes
# to it), so the $7 million has no scale (STANDARD.md 6.5; left open).
#
# No argument against was submitted, but the guide prints a rebuttal to
# the argument in favor, which argues against the measure. The no side
# is that rebuttal's, and its line says it is a rebuttal, so the side is
# filed and a viewer is not told opponents printed nothing. The card's
# title is the guide page's own head. Much of the page's text layer is
# in glyph ids (checks._unshifted_text reads it back).

contest = "ca-2026-11-03-union-city-measure-ii"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide-page"
number = "II"
title = "CITY OF UNION CITY MEASURE II"
origin = "The City Council of the City of Union City is submitting to the voters"
summary = "“Union City Essential Services Extension Measure. To maintain critical city services, including 9-1-1 emergency response/paramedics/fire protection; street/pothole repair; neighborhood police patrols; crime/gun violence prevention programs; youth/senior programs; and other city services, shall the measure extending the City of Union City’s existing voter-approved utility users tax for 9 years at the current 5% rate (no increase), providing $7,000,000 annually, with senior/low-income exemptions, annual audits, and all funds locally controlled, be adopted?”"
yes = "A “Yes” vote is a vote to approve the extension of the voter-approved UUT for nine years at the current rate."
no = "A “No” vote is a vote to not extend the UUT and the UUT would no longer be levied after December 31, 2028."

