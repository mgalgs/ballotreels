# Archived sources for City of Union City Measure II, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. The guide's pages are cut from the Alameda County
# Registrar of Voters' Composite Voter Information Guide (965 pages);
# "pages" are the PDF's page numbers, with the printed footer (UMII-1 to
# UMII-5) beside them.
#
# The guide prints the ballot question, the City Attorney's Impartial
# Analysis, an argument in favor, the notice "NO ARGUMENT AGAINST MEASURE
# II WAS SUBMITTED", a rebuttal to the argument in favor, and the full
# text of the ordinance. It prints no tax rate statement.

