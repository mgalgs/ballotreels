# Archived sources for City of Santa Monica Measure GG, 2026-11-03 general
# election (sources/la-sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The Los Angeles County Registrar-Recorder/County Clerk's list "Measures
# Appearing on the Ballot" (sources/county-measure-list-excerpt.txt, the
# measure's entry) gives its letter, vote threshold and ballot question,
# and, on its "Supporters: ... Opponents: ..." line, who filed the
# primary arguments ("Opponents: None submitted."): the card quotes it,
# and the sides cite it as the official statement of filing. The City
# Council's resolution submitting the measure, a text PDF, gives today's
# charter rules in its recitals and the charter amendment itself as
# Exhibit 2 (pages 37 to 44). Its Exhibit 1, the Rent Control Board's
# and City Attorney's transmittals, is not cited. No impartial analysis
# and no argument text could be fetched (the City's site blocked
# downloads). Not a tax; no fiscal statement applies.

