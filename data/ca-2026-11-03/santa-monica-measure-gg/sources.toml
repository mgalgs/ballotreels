# Archived sources for City of Santa Monica Measure GG, 2026-11-03 general
# election (sources/la-sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The Los Angeles County Registrar-Recorder/County Clerk's list "Measures
# Appearing on the Ballot" (sources/county-measure-list-excerpt.txt, the
# measure's entry) gives its letter, vote threshold and ballot question:
# the card quotes it. Its "Opponents: None submitted." is contradicted by
# the Registrar's own Interactive Sample Ballot, which prints an argument
# against (with signers), beside the City Attorney's impartial analysis
# (the measure's neutral explanation), the argument for and both
# rebuttals, each saved as HTML; the sides follow the printed arguments.
# The City Council's resolution submitting the measure, a text PDF, gives
# today's charter rules in its recitals and the charter amendment itself
# as Exhibit 2 (pages 37 to 44). Not a tax; no fiscal statement applies.

[contest]
id = "ca-2026-11-03-santa-monica-measure-gg"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:santa_monica"
kind = "measure"
title = "City of Santa Monica Measure GG: Rent Control Board Terms, Fees and Eviction Rules"

