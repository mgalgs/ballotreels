# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the charter's rent board rules
# today (two terms, a $288 fee cap set by voters in 2014), from the
# resolution's recitals; the five changes, from the City Attorney's
# impartial analysis and the amendment's text (Exhibit 2), in the order
# the ballot question lists them; that no cost estimate is given; one
# line per side; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". The card shows the name.
#
# The card quotes the measure's entry in the county's list "Measures
# Appearing on the Ballot", which prints no yes/no meanings, so the card
# has no boxes; the vote lines take both meanings from the question and
# highlight the same phrase.
#
# Not a tax: no fiscal statement applies, and the impartial analysis
# gives no cost estimate; the fiscal line says so in the no-estimate
# wording. The $288 is a fee per unit, exempt from scaling (STANDARD.md
# 6.5). The eviction line follows the analysis: tenants who fail to give
# proof of eligibility (not only income) after a written request.
#
# Sides: the county's list says "Opponents: None submitted.", but the
# Registrar's sample ballot prints an argument against and a rebuttal,
# so both sides are presented from their filed texts. Supporters: the
# measure affirms the eviction protections as state law requires, and
# reserves affordable units for tenants who qualify. Opponents: it makes
# it easier for developers to evict affordable housing tenants, and
# (from their rebuttal) the rising fees raise rents.

contest = "ca-2026-11-03-santa-monica-measure-gg"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "GG"
title = "CITY OF SANTA MONICA"
origin = "VOTE PASSAGE – Majority Vote 50%+1"
summary = "MEASURE GG: Shall the City Charter be amended to: affirm the City of Santa Monica's just cause eviction laws; allow Rent Control Board Commissioners to serve up to three terms, including appointed service; annually increase the cap on rent controlled unit registration fees; clarify Rent Control Board authority to regulate timelines for deciding rent adjustment petitions; and permit eviction from affordable housing units for tenants who are not eligible or do not establish eligibility?"

[[section]]
id = "what"
heading = "Measure GG"

[[section.line]]
text = "Measure GG asks the voters of this city whether to make five changes to the rent control rules in the city charter."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["Shall the City Charter be amended to"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "today-terms"
text = "Today, the charter limits elected rent board members to two terms, without saying whether appointed terms count."
sources = ["impartial-analysis", "resolution"]

[section.line.visual]
kind = "illustration"
name = "empty-commission-seat"

[[section.line]]
id = "today-fee"
text = "In 2014, voters capped the yearly fee for registering each rent-controlled unit at $288."
sources = ["impartial-analysis", "resolution"]

[section.line.visual]
kind = "illustration"
name = "rental-permit"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "terms"
text = "Board members could serve three terms, with appointed terms counted."
sources = ["impartial-analysis", "resolution", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "empty-commission-seat"

[[section.line]]
id = "fee"
text = "From 2028, that cap would rise with inflation, by at most 5 percent a year."
sources = ["impartial-analysis", "resolution"]

[section.line.visual]
kind = "illustration"
name = "rental-permit"

[[section.line]]
id = "petitions"
text = "Board rules could allow good-cause extensions of the existing 120-day deadline for rent adjustment requests."
sources = ["impartial-analysis", "resolution"]

[section.line.visual]
kind = "illustration"
name = "case-file-phone"

[[section.line]]
id = "deed-restricted"
text = "Landlords could evict affordable housing tenants who do not qualify, or who fail to show proof of eligibility after a written request."
sources = ["impartial-analysis", "resolution", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "apartment-building"

[[section.line]]
id = "just-cause"
text = "And the charter would say its eviction protections go further than state law, so they apply in place of it."
sources = ["impartial-analysis", "resolution"]

[section.line.visual]
kind = "illustration"
name = "amended-page"

[[section]]
id = "fiscal"
heading = "What it would cost"

[[section.line]]
text = "The impartial analysis does not include a cost estimate for the measure."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"
stamp = "None reported"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say the measure affirms eviction protections as state law requires, and reserves affordable units for qualifying tenants."
sources = ["argument-for"]
basis = ["Now, state law requires that if the City adds new eviction protections, we must affirm that our just cause eviction laws are more protective and prevail over those provided under state law.", "Ensure that designated affordable housing units are reserved for tenants who income qualify."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Affirms eviction protections", "Affordable units for qualifying tenants"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say the measure makes evicting affordable housing tenants easier for developers, and raises rents through higher fees."
sources = ["argument-against", "rebuttal-to-argument-for"]
basis = ["Buried in this proposal, the city council inserted an amendment to the just cause eviction rules to make it easier for DEVELOPERS to evict tenants from affordable housing.", "This measure allows annual rental registration fees to rise every year.", "Because landlords legally pass half of these fees directly to renters, a \"YES\" vote is a direct vote to increase your rent."]

[section.line.visual]
kind = "list"
source = "argument-against"
items = ["Easier evictions from affordable housing", "Higher fees raise rents"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote makes these five changes to the city charter."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["Shall the City Charter be amended to"]

[[section.line]]
text = "A no vote leaves the city charter as it is."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["Shall the City Charter be amended to"]

[[question]]
ask = "How long can rent board members serve now, and under the measure?"
lines = ["today-terms", "terms"]

[[question]]
ask = "How much could the registration fee go up?"
lines = ["today-fee", "fee"]

[[question]]
ask = "Which tenants could be evicted under the new grounds?"
lines = ["deed-restricted"]

[[question]]
ask = "What does affirming the city's eviction laws do?"
lines = ["just-cause"]
