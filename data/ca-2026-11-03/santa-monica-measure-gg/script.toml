# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the charter's rent board rules
# today (two terms, a $288 fee cap set by voters in 2014), from the
# resolution's recitals; the five changes, from the amendment's text
# (Exhibit 2), in the order the ballot question lists them; that no cost
# estimate is given; who filed the argument for, and that none was
# submitted against; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". The card shows the name.
#
# The card quotes the measure's entry in the county's list "Measures
# Appearing on the Ballot", which prints no yes/no meanings, so the card
# has no boxes; the vote lines take both meanings from the question and
# highlight the same phrase.
#
# Not a tax: no fiscal statement applies, and no impartial analysis was
# fetched. The fiscal line follows the no-cost-estimate wording, naming
# the county's list (the card's guide) as "the official list of
# measures from the county" ("county's" is misheard as "counties"). The $288 is a fee per unit, exempt from scaling (STANDARD.md
# 6.5).
#
# Sides: the county's list names five supporters who filed the argument
# for (the Rent Control Board's chair, a former chair, a councilmember
# and two others) and says "Opponents: None submitted." The argument
# for's text could not be fetched: its line says only who filed it and
# that its text was not gathered, nothing reconstructed. The no side says
# that none was submitted. filed = false on both (neither has text to
# quote as a `basis`); word counts kept within 5%.

contest = "ca-2026-11-03-santa-monica-measure-gg"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "GG"
title = "CITY OF SANTA MONICA"
origin = "VOTE PASSAGE – Majority Vote 50%+1"
summary = "MEASURE GG: Shall the City Charter be amended to: affirm the City of Santa Monica's just cause eviction laws; allow Rent Control Board Commissioners to serve up to three terms, including appointed service; annually increase the cap on rent controlled unit registration fees; clarify Rent Control Board authority to regulate timelines for deciding rent adjustment petitions; and permit eviction from affordable housing units for tenants who are not eligible or do not establish eligibility?"

[[section]]
id = "what"
heading = "Measure GG"

[[section.line]]
text = "Measure GG asks the voters of this city whether to make five changes to the rent control rules in the city charter."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["Shall the City Charter be amended to"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "today-terms"
text = "Today, the charter limits elected rent board members to two terms, without saying whether appointed terms count."
sources = ["resolution"]

[section.line.visual]
kind = "illustration"
name = "empty-commission-seat"

[[section.line]]
id = "today-fee"
text = "In 2014, voters capped the yearly fee for registering each rent-controlled unit at $288."
sources = ["resolution"]

[section.line.visual]
kind = "illustration"
name = "rental-permit"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "terms"
text = "Board members could serve three terms, with appointed terms counted."
sources = ["resolution", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "empty-commission-seat"

[[section.line]]
id = "fee"
text = "From 2028, that cap would rise with inflation, by at most 5 percent a year."
sources = ["resolution"]

[section.line.visual]
kind = "illustration"
name = "rental-permit"

[[section.line]]
id = "petitions"
text = "Board rules could allow good-cause extensions of the existing 120-day deadline for rent adjustment requests."
sources = ["resolution"]

[section.line.visual]
kind = "illustration"
name = "case-file-phone"

[[section.line]]
id = "deed-restricted"
text = "Landlords could evict affordable housing tenants who do not qualify, or who refuse, after written notice, to show proof of income."
sources = ["resolution", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "apartment-building"

[[section.line]]
id = "just-cause"
text = "And the charter would say its eviction protections go further than state law, so they apply in place of it."
sources = ["resolution"]

[section.line.visual]
kind = "illustration"
name = "amended-page"

[[section]]
id = "fiscal"
heading = "What it would cost"

[[section.line]]
text = "The official list of measures from the county does not include a cost estimate for the measure."
sources = ["ballot-question"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"
stamp = "None reported"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"
filed = false

[[section.line]]
text = "The rent board chair, a former chair, a council member and two others filed an argument for Measure GG; its text was not gathered."
sources = ["arguments-filed"]

[section.line.visual]
kind = "list"
source = "arguments-filed"
items = ["Argument for filed; text not gathered"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "The official county list of measures for this election says that no argument against Measure GG was submitted, by any group or person."
sources = ["arguments-filed"]

[section.line.visual]
kind = "list"
source = "arguments-filed"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote makes these five changes to the city charter."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["Shall the City Charter be amended to"]

[[section.line]]
text = "A no vote leaves the city charter as it is."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["Shall the City Charter be amended to"]

[[question]]
ask = "How long can rent board members serve now, and under the measure?"
lines = ["today-terms", "terms"]

[[question]]
ask = "How much could the registration fee go up?"
lines = ["today-fee", "fee"]

[[question]]
ask = "Which tenants could be evicted under the new grounds?"
lines = ["deed-restricted"]

[[question]]
ask = "What does affirming the city's eviction laws do?"
lines = ["just-cause"]
