# Archived sources for Coast Life Support District Measure D, 2026-11-03
# general election, for Mendocino County voters (sources/sources.md).
# Every id here may be cited by script.toml. `kind` must be one the
# standard allows (docs/STANDARD.md, section 1).
#
# Mendocino County Elections posts each measure's Voter Information
# Guide pages as one PDF, linked from its "Measures on the Ballot" page;
# Measure D's are guide pages 23D1 to 23D3: the ordinance's full text,
# the County Counsels' Impartial Analysis (Mendocino and Sonoma), an
# argument in support, and "NO ARGUMENTS AGAINST MEASURE D WERE
# SUBMITTED." They print no ballot question. The Sonoma County Registrar
# of Voters' pages for the same measure do (page 049M507), so the card
# quotes the question from them: sources/sonoma-MeasD_EN.pdf is a copy
# of the PDF the Sonoma contest (coast-life-support-measure-d-sonoma)
# archived. A parcel tax has no tax rate statement, and neither county's
# pages print one, so the one estimate of what the tax would raise is
# the measure question's.
#
# A special district has no Census boundary, so the measure's division
# is the county and `voters` names the district
# (docs/SCRIPT-FORMAT.md). The district reaches Mendocino and Sonoma
# counties; Mendocino is the lead county, so this contest has no county
# suffix, and Sonoma's is coast-life-support-measure-d-sonoma.

[contest]
id = "ca-2026-11-03-coast-life-support-measure-d"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/county:mendocino"
kind = "measure"
title = "Coast Life Support District Measure D: Emergency Medical Services Parcel Tax"
voters = "the Coast Life Support District"

[[source]]
id = "measure-question"
kind = "official-title-summary"
publisher = "Sonoma County Registrar of Voters, Local Ballot Measure: D, page 049M507: Measure Question and What Your Vote Means"
credit = "Measure Question, Sonoma County Registrar of Voters"
url = "https://sonomacounty.gov/Main%20County%20Site/Administrative%20Support%20%26%20Fiscal%20Services/Registrar%20of%20Voters/Documents/Elections/2026/11-03-2026/SoCo_Nov2026GenElec_9761_MeasD_CoastLifeSuppDist_ParcelTax_EN.pdf"
file = "sources/sonoma-MeasD_EN.pdf"
retrieved = "2026-10-28"

[[source]]
id = "impartial-analysis"
kind = "official-title-summary"
publisher = "Impartial Analysis of Measure D, County Counsels of Mendocino and Sonoma Counties, Mendocino County Elections, Voter Information Guide pages for Measure D, pages 23D2 to 23D3"
credit = "Impartial Analysis, Mendocino County Elections"
url = "https://www.mendocinocounty.gov/files/assets/public/v/1/acre/elections/measure-d-clsd-special-tax.pdf"
file = "sources/measure-d-clsd-special-tax.pdf"
retrieved = "2026-10-28"

[[source]]
id = "arguments"
kind = "official-argument"
publisher = "Argument in Support of Measure D (no arguments against were submitted), Mendocino County Elections, Voter Information Guide pages for Measure D, page 23D3"
credit = "Argument in support, Mendocino County Elections"
url = "https://www.mendocinocounty.gov/files/assets/public/v/1/acre/elections/measure-d-clsd-special-tax.pdf"
file = "sources/measure-d-clsd-special-tax.pdf"
retrieved = "2026-10-28"

[[source]]
id = "text"
kind = "official-text"
publisher = "Full text of Measure D, an Ordinance of Coast Life Support District, Mendocino County Elections, Voter Information Guide pages for Measure D, pages 23D1 to 23D2"
credit = "Full text of Measure D, Mendocino County Elections"
url = "https://www.mendocinocounty.gov/files/assets/public/v/1/acre/elections/measure-d-clsd-special-tax.pdf"
file = "sources/measure-d-clsd-special-tax.pdf"
retrieved = "2026-10-28"
