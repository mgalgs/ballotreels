# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; today's tax and what it is for;
# who placed the measure; the vote it needs; what would
# change (the new tax, which parcels pay, what it pays for, how long it
# lasts, what happens if it fails); the impartial analysis's revenue
# estimate; both sides, which submitted nothing; what a vote does.
#
# No arguments were submitted ("NO ARGUMENTS FOR OR AGAINST THIS MEASURE
# WERE SUBMITTED"): both sides say so, filed = false (STANDARD.md 2.5),
# citing the pamphlet page that prints the notice. With no argument on
# either side, the resolution's finding that today's tax falls short is
# left out: it is the case for the measure, and nothing answers it. The
# pamphlet prints no tax rate statement; the revenue
# estimate is in the ballot question and County Counsel's impartial
# analysis, which the fiscal line names as the county attorney's
# ("Counsel" is heard as "Council", standard/speakability.txt). The
# money is the district's own revenue, and no archived source states a
# budget it would be part of, so it has no scale (STANDARD.md 6.5; left
# open). The per-parcel amounts are exempt. The ballot question and the
# analysis state no yearly adjustment, so the script states none.

contest = "ca-2026-11-03-showcase-ranches-measure-q"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide-page"
number = "Q"
title = "IMPARTIAL ANALYSIS OF MEASURE Q"
origin = "This Measure was placed on the ballot by the Board of Directors of the District"
summary = "Shall the measure to levy an annual special tax in the amount of $250.00 per year per parcel within the Showcase Ranches Community Services District commencing in FY 2026-2027 and continuing for an unlimited duration, to be used only for road and dam maintenance services and generating an annual revenue of approximately $37,750, to replace the current special tax of $125.00, be adopted?"
yes = "A “YES” vote is a vote to authorize the levy of the increased annual special tax in an amount of $250 per parcel, as provided in the Measure."
no = "A “NO” vote is a vote against the levy of the increased annual special tax."

[[section]]
id = "what"
heading = "Measure Q"

[[section.line]]
text = "Measure Q asks the voters of this community services district whether to raise its yearly tax for roads and dams from $125 to $250 per parcel."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["an annual special tax in the amount of $250.00"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Voters in the district approved today's $125 tax in 1984 for road, dam and levee maintenance."
sources = ["resolution"]

[section.line.visual]
kind = "illustration"
name = "earthen-dam"

[[section.line]]
text = "The district's board of directors placed Measure Q on the ballot."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "ballot-box"

[[section.line]]
text = "Measure Q needs two-thirds of the vote to pass."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "The new tax would start in the 2026-2027 fiscal year."
sources = ["guide-page"]

[section.line.visual]
kind = "bars"
title = "Yearly road and dam tax per parcel, in dollars"
source = "guide-page"
unit = ""
labels = ["Today", "Under Measure Q"]
values = [125, 250]

[[section.line]]
text = "An owner of several parcels would pay the new tax on each extra parcel only if a home is built on it."
sources = ["resolution"]

[[section.line]]
id = "use"
text = "The money could pay only for road and dam maintenance, and the tax would last until voters change or repeal it."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "special-tax"

[[section.line]]
text = "If Measure Q fails, the $125 tax stays."
