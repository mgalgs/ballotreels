[[section]]
id = "fiscal"
heading = "What the impartial analysis says"

[[section.line]]
text = "The county attorney's impartial analysis expects the tax to raise about $37,750 a year."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"
filed = false

[[section.line]]
text = "No argument for Measure Q was submitted."
