[[section.line]]
text = "No argument against Measure Q was submitted."
sources = ["guide-page"]

[section.line.visual]
kind = "list"
source = "guide-page"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote authorizes the increased tax of $250 per parcel a year."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["a vote to authorize the levy"]

[[section.line]]
