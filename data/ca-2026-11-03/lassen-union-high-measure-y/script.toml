# Recipe E, about 60 seconds, distilled: one claim per line, in the shape
# of the merged college bond scripts. The chain: what it asks and of
# whom; how a school bond is repaid and what it needs to pass; what the
# money may pay for; the district's tax rate statement; one line per
# side; what a vote does.
#
# The card quotes the abbreviated form (the ballot question) as the
# Local Voter Information Guide prints it on page 34, under the guide's
# running head; the guide prints no yes/no lines with it, so the card
# has no YES/NO boxes and the vote lines give the impartial analysis's
# own meanings, both highlighting the same phrase of the question. No
# name of the school, district or county is narrated: the card and the
# title show them.
#
# The bond total and the debt service are repaid from a tax on property
# in the district, and no archived source states the district's budget,
# so they have no budget scale (STANDARD.md 6.5; left open). The bond
# total is said exactly as the question prints it. The tax statement's
# average rate is the ballot's own figure; its highest rate is said
# beside it so the average does not stand alone. Its fiscal years are
# written in full (standard/speakability.txt); "approximately
# $36,816,735" is said as "about $36.8 million". The bar on salaries,
# the audits, the oversight committee and the state matching funds are
# in the supporters' argument, so the neutral sections leave them out
# (STANDARD.md 6.3).
#
# No argument against Measure Y was submitted. The no side says so
# plainly; its section is marked filed = false.

contest = "ca-2026-11-03-lassen-union-high-measure-y"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "Y"
title = "ABBREVIATED FORM OF LASSEN UNION HIGH SCHOOL DISTRICT BOND MEASURE “Y”"
origin = "LOCAL MEASURES"
summary = "To improve local schools; modernize, and renovate old classrooms, restrooms and school facilities; repair HVAC systems; make safety and security improvements; and build career technical, agriculture/ FFA, and science classrooms and labs; shall Lassen Union High School District’s measure be adopted authorizing $17,500,000 of bonds at legal rates, generating approximately $1,083,000 annually while bonds are outstanding at average rates of $29.55 per $100,000 assessed value, with annual audits, citizens’ oversight, no money for salaries and all money staying local?"

[[section]]
id = "what"
heading = "Measure Y"

[[section.line]]
text = "Measure Y asks the voters of this high school district whether to approve $17,500,000 in school bonds."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["authorizing $17,500,000 of bonds"]

[[section]]
id = "today"
heading = "How a school bond works"

[[section.line]]
text = "The district would sell the bonds and repay them from property taxes."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "bond-certificates"

[[section.line]]
text = "Measure Y needs 55 percent of the vote to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "projects"
text = "The money could go to projects such as renovating classrooms and restrooms, repairing heating and cooling, safety upgrades, and new career, agriculture and science classrooms."
sources = ["ballot-question", "text"]

[section.line.visual]
kind = "illustration"
name = "school-roof-repair"

[[section]]
id = "fiscal"
heading = "What the tax statement says"

[[section.line]]
id = "tax-rate"
text = "The district's tax rate statement estimates $29.55 a year per $100,000 of assessed value, on average, through 2060-2061."
sources = ["tax-statement", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "debt-payments"

[[section.line]]
id = "tax-peak"
text = "The statement estimates the highest rate at $30 per $100,000, from 2027-2028 through 2058-2059."
sources = ["tax-statement"]

[[section.line]]
text = "The statement estimates the total to repay, with interest, at about $36.8 million."
sources = ["tax-statement"]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say many school facilities are aging and need major improvements, and the bond would strengthen career and technical education."
sources = ["arguments"]
basis = ["many of our school facilities are aging and in need of significant improvements.", "Strengthen Career and Technical Education programs by constructing and modernizing classrooms"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Improves aging school facilities", "Strengthens career technical education"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure Y was submitted, so the county voter guide prints only the argument in favor of it."
sources = ["arguments"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote would approve the bond measure and authorize the bonds."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["authorizing $17,500,000 of bonds"]

[[section.line]]
text = "A no vote would disapprove the bond measure."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["authorizing $17,500,000 of bonds"]

[[question]]
ask = "What would the bond money pay for?"
lines = ["projects"]

[[question]]
ask = "How much would property owners pay?"
lines = ["tax-rate", "tax-peak"]

[[question]]
ask = "How big is $17,500,000 next to the district's yearly budget?"
unanswered = true
