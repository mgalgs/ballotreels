# Archived sources for Lassen Union High School District Measure Y,
# 2026-11-03 general election (sources/sources.md). Every id here may be
# cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# Lassen County Elections prints the whole measure in its Local Voter
# Information Guide, cut here to pages 28 to 34 of the PDF: County
# Counsel's impartial analysis (28), the argument in favor and "NO
# ARGUMENT AGAINST MEASURE “Y” WAS SUBMITTED" (29), the full text
# (30 to 33), and the abbreviated form (the ballot question) with the
# district's tax rate statement (34). The impartial analysis is the
# measure's neutral explanation; the tax rate statement is its fiscal
# statement. No rebuttals are printed.

