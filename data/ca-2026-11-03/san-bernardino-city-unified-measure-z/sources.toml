# Archived sources for San Bernardino City Unified School District
# Measure Z, 2026-11-03 general election (sources/sources.md). Every id
# here may be cited by script.toml. `kind` must be one the standard
# allows (docs/STANDARD.md, section 1). The guide's pages are cut from the
# San Bernardino County Registrar of Voters' comprehensive Voter
# Information Guide, PDF pages 264 to 271; "page" is the guide's printed
# footer number (SB COMPREHENSIVE-262 to -269).
#
# The archived guide pages print no ballot question for Measure Z (its
# Full Text opens with the bond authorization), so the card quotes the
# question from the Board of Education's resolution, which directs the
# Registrar to print it on the ballot. The Registrar's measures page links
# Z's "Impartial" to the argument in favor by mistake; County Counsel's
# Impartial Analysis is the one printed in the guide.

[contest]
id = "ca-2026-11-03-san-bernardino-city-unified-measure-z"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/school_district:san_bernardino_city_unified_school_district"
kind = "measure"
title = "San Bernardino City Unified School District Measure Z: School Repair and Construction Bonds"

