# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and of whom; how a school bond is repaid and what it needs to
# pass; what the money would pay for; the district's tax statement; one
# line per side; what a vote does.
#
# The archived guide pages print no ballot question for Measure Z, so the
# card quotes the question, and the resolution's own words for what the
# measure would do, from the Board of Education's Resolution No. 10.6,
# which directs the Registrar to put that question on the ballot. The
# resolution prints no yes or no lines, so the card has none; the vote
# lines take their meanings from County Counsel's Impartial Analysis and
# highlight the resolution's own phrases, as Utah's do. "Counsel" is heard
# as "Council" (standard/speakability.txt). The bond total and the debt
# service are repaid from a tax on property in the district, and no
# archived source states the district's budget, so they have no budget
# scale (STANDARD.md 6.5; left open). The tax statement gives $45 per
# $100,000 as both its average and its highest rate.
#
# No argument against Measure Z was filed. The no side says so plainly;
# its section is marked filed = false.

contest = "ca-2026-11-03-san-bernardino-city-unified-measure-z"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "Z"
title = "To repair/upgrade aging classrooms, labs, career technology, school facilities to support college/career readiness in math, science, engineering, arts, skilled trades; fix/replace deteriorating roofs, plumbing, HVAC, electrical; and upgrade schools to meet current health/safety codes and improve disabled access, shall San Bernardino City Unified School District’s measure authorizing $345,000,000 in bonds, at legal rates, be adopted, levying approximately $45 per $100,000 assessed value ($22,000,000 annually) while bonds are outstanding, with oversight, audits, and all money locally controlled?"
origin = "RESOLUTION OF THE BOARD OF EDUCATION OF THE SAN BERNARDINO CITY UNIFIED SCHOOL DISTRICT ORDERING A SCHOOL BOND ELECTION, AND AUTHORIZING NECESSARY ACTIONS IN CONNECTION THEREWITH"
summary = "the Board deems it necessary and advisable to submit such a school improvement bond measure to the electors, which, if approved by at least 55% of the votes cast, would permit the District to issue its bonds"

[[section]]
id = "what"
heading = "Measure Z"

[[section.line]]
text = "San Bernardino City Unified School District Measure Z asks the district's voters whether to approve $345 million in school bonds."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["authorizing $345,000,000 in bonds"]

[[section]]
id = "today"
heading = "How a school bond works"

[[section.line]]
text = "The district would borrow the money and repay it from a tax on property in the district."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "bond-certificates"

[[section.line]]
text = "Measure Z needs 55 percent of the vote to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "The money would go to listed projects, such as replacing portable classrooms with permanent ones and building a new school to reduce overcrowding."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "school-classroom"

[[section]]
id = "fiscal"
heading = "What the tax statement says"

[[section.line]]
text = "The district's tax statement estimates a tax of $45 per $100,000 of assessed value, on average and at most, through 2056-2057."
sources = ["tax-statement"]

[section.line.visual]
kind = "illustration"
name = "debt-payments"

[[section.line]]
text = "The statement estimates the total to repay, with interest, at about $670 million."
sources = ["tax-statement"]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Measure Z delivers essential repairs and safety upgrades to aging local schools."
sources = ["arguments"]
basis = ["Your YES vote on Measure Z will deliver essential repairs and safety upgrades.", "Many of our local schools were built over 55 years ago and need major repairs and updates."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Repairs to leaky roofs and aging air conditioning", "Schools upgraded to current safety codes"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure Z was filed for the San Bernardino County voter guide."
sources = ["arguments"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote is in favor of letting the district issue the bonds."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["would permit the District to issue its bonds"]

[[section.line]]
text = "A no vote is against letting the district issue the bonds."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["if approved by at least 55% of the votes cast"]
