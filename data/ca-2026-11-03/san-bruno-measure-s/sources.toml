url = "https://smcacre.gov/system/files/2026-08/52-ENG-MS-ImpartialAnalysis-San-Bruno-Hosuing-Permit-and-Development.pdf"
file = "sources/impartial-analysis.pdf"
retrieved = "2026-10-28"

[[source]]
