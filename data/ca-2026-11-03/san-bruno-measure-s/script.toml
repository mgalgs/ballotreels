# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks; what the 1977 ordinance requires today and who put the repeal on
# the ballot; what would change (who would decide those projects); that
# no cost estimate is published; one line per side; what a vote does.
#
# Not a tax: ACRE posts no fiscal analysis, and neither the resolution
# nor the impartial analysis gives a cost or revenue estimate, so the
# fiscal line says none is published. The argument's "up to $4 million
# annually" for the Crossings hotel is the supporters' own figure, not an
# official estimate: it is left out of the neutral sections and out of
# the supporters' line too (it would need a scale no source gives).
#
# The ballot question's own premise, that "State housing laws supersede
# local height limits", is also the supporters' central point, so the
# neutral sections leave it to the supporters' line (rule 6.3); it is not
# the measure's legal effect, which is only the repeal of Chapter 12.26.
# The Council's recital that projects would stay subject to the General
# Plan, zoning and environmental review is left out for the same reason
# (the Council also wrote the argument); the change line follows the
# impartial analysis instead.
#
# The card quotes the Council's resolution, where the ballot question is
# printed; its title is the resolution's heading, cut after the height
# limits, and its origin is the City Clerk's adoption line. The
# resolution prints only "Yes" and "No" boxes, no yes/no statements, so
# the card has none; the vote lines take the impartial analysis's own
# meanings ("remove" and "continue" the voter approval requirements) and
# highlight the same phrase of the ballot question.
#
# ACRE posts only an argument in favor: no argument against and no
# rebuttals. The no side is filed = false; its line says only that none
# appears in the published measure documents, since no "no argument was
# submitted" notice is posted.

contest = "ca-2026-11-03-san-bruno-measure-s"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-label"
number = "S"
title = "A MEASURE THAT PROPOSES ADOPTION OF AN ORDINANCE REPEALING INITIATIVE ORDINANCE NO. 1284 RELATING TO VOTER APPROVAL TO PERMIT BUILDINGS EXCEEDING THREE STORIES OR FIFTY FEET IN HEIGHT"
origin = "I hereby certify that foregoing Resolution No. 2026 - 075 was introduced and adopted by the San Bruno City Council at a regular meeting on July 28, 2026"
summary = "Shall City of San Bruno Ordinance No. 1284, the 1977 zoning initiative that requires voter approval before the City Council can approve buildings exceeding specified height limits, residential density increases beyond 1974 zoning, multi-story parking structures, and certain roadway changes, be repealed given that State housing laws supersede local height limits and the ordinance interacts with current City economic development goals?"

