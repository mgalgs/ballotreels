# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and whose measure it is; what the charter is and why voters decide
# council pay; the pay today; what would change and the vote it needs;
# the city's cost estimate; one line per side; what a vote does.
#
# The guide prints no ballot question and no yes/no lines on the card's
# page: the card quotes the ballot question from the City Council's
# resolution, and the vote lines quote the City Attorney's Impartial
# Analysis's yes/no statements, highlighting the card's own "be
# approved?". The fiscal line gives the analysis's figure ("the City has
# determined Measure D would result in an additional annual cost of
# $20,916"), not the supporters' "$12,600 per year", which is theirs and
# left out of their line too, so the video states one cost. No archived
# source states the city's General Fund total, so the cost has no scale
# (STANDARD.md 6.5; left open).
#
# That the $1 has not changed in 68 years, and that the measure adds no
# other pay, are points the supporters' argument makes ("Sixty-eight
# years later, that amount has never been changed"; "It provides no
# additional compensation"), so the neutral sections state the pay today
# and the charter's 1958 adoption, and neither point (STANDARD.md 6.3).
#
# No argument against was filed: the no side says so, filed = false
# (STANDARD.md 2.5).

contest = "ca-2026-11-03-needles-measure-d"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "D"
title = "CITY COUNCIL COMPENSATION-CHARTER AMENDMENT"
origin = "RESOLUTION OF THE CITY COUNCIL OF THE CITY OF NEEDLES CALLING FOR THE PLACEMENT OF A MEASURE ON THE BALLOT AT THE GENERAL MUNICIPAL ELECTION TO BE HELD ON TUESDAY, NOVEMBER 3, 2026"
summary = "Shall the proposed amendment to section 503 of the City Charter of the City of Needles to increase the compensation for each member of the City Council from $1 per month to $150 per month be approved?"

[[section]]
id = "what"
heading = "Measure D"

[[section.line]]
text = "City of Needles Measure D asks Needles voters whether to raise City Council pay from $1 a month to $150 a month."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["from $1 per month to $150 per month"]

[[section]]
id = "background"
heading = "What the charter is"

[[section.line]]
text = "Needles voters adopted the city charter in 1958, and only voters can change it, including council pay."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "constitution-page"

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Today, the charter pays each council member $1 a month."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "bars"
title = "Council member pay, in dollars a month"
source = "impartial-analysis"
unit = ""
labels = ["Today", "Measure D"]
values = [1, 150]

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "Measure D would raise that to $150 a month for each member."
sources = ["impartial-analysis"]

[[section.line]]
text = "Measure D needs a majority of the vote to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "fiscal"
heading = "What it would cost"

[[section.line]]
text = "The city attorney's impartial analysis says the city has found the raise would cost it $20,916 more each year."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Measure D recognizes the time council members give, and removes a financial barrier to public service."
sources = ["argument-for"]
basis = ["This modest amount recognizes the time, preparation, and responsibility required to serve the residents of Needles", "Providing reasonable compensation also helps remove a financial barrier to public service."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Recognizes the time and work of serving", "Removes a financial barrier to public service"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure D was filed, so the county voter guide prints only the argument of supporters."
sources = ["argument-for"]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote is in favor of raising council pay from $1 to $150 a month."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["be approved?"]

[[section.line]]
text = "A no vote leaves the charter unchanged, with council pay staying at $1 a month."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["be approved?"]

[[question]]
ask = "How big is the city's budget, compared with the cost?"
unanswered = true
