# Archived sources for City of Oroville Measure S, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# The Butte County Clerk-Recorder/Elections' Local Voter Information
# Guide prints Measure S on PDF pages 73 and 74 (printed footers
# 04-110326-71 and -72): the ballot question, the City Attorney's
# Impartial Analysis, "No argument in favor was filed." and "No argument
# against was filed." Its "FULL TEXT MEASURE S" only gives the City
# Clerk's number for a copy of the resolution; the City's posted
# Resolution No. 9465 prints the ballot question and the vote needed,
# but not its Exhibit A, the charter amendment's text. No tax rate
# statement or fiscal analysis applies (not a tax).

