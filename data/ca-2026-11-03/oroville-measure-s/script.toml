# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the Park Commission and its
# powers today; who placed it on the ballot and how its question
# describes the change; what would change (what stays and what the
# charter no longer governs, the advisory
# role, the recommendation the council must receive, what it does not
# do); the vote it needs; no cost estimate; both sides, neither of which
# filed an argument; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city", and the card and title carry
# the name.
#
# The card quotes the guide's page: its heading over the question, the
# question, the analysis's first sentence as the origin, and the
# analysis's yes and no sentences as the boxes. "Affirm the current and
# previous practice" is the City Council's wording in its question, so
# the narration gives it as the question's, never as the narrator's.
#
# The charter amendment's own text (Resolution No. 9465's Exhibit A) was
# not posted, and the guide prints only how to ask the City Clerk for
# it; the guide's question and the City Attorney's analysis cover what
# the standard needs. The guide's analysis does not state the vote
# needed; Resolution No. 9465, Section 3, does (a majority).
#
# Not a tax measure: the guide prints no fiscal analysis or tax rate
# statement, so the fiscal line says the guide does not include a cost
# estimate; the analysis's sentence that the measure would not itself
# appropriate or transfer money is a change line, with its other limits.
#
# The guide prints "No argument in favor was filed." and "No argument
# against was filed.": both sides say so plainly, each marked
# filed = false (STANDARD.md 2.5).

contest = "ca-2026-11-03-oroville-measure-s"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide-page"
number = "S"
title = "City of Oroville – Resolution 9465 – Charter Amendment: Park Commission"
origin = "The Oroville City Council placed Measure S on the ballot."
summary = "Shall the City of Oroville Charter be amended to affirm the current and previous practice of the Park Commission performing in an Advisory capacity to the City Council?"
yes = "A “yes” vote is a vote to amend the Charter as described above."
no = "A “no” vote is a vote to leave the existing Charter language unchanged."

[[section]]
id = "what"
heading = "Measure S"

[[section.line]]
text = "Measure S asks the voters of this city whether to rewrite the charter section on the Park Commission."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["Park Commission performing in an Advisory capacity"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Today the charter sets up a five-member Park Commission, appointed by the City Council to unpaid five-year terms."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "city-park-lawn"

[[section.line]]
text = "The charter also gives the commission and the parks department powers over park fees, funds and property."
sources = ["guide-page"]

[[section.line]]
text = "The City Council placed Measure S on the ballot, and its question says it affirms the current and previous advisory practice of the commission."
sources = ["guide-page", "resolution"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["affirm the current and previous practice"]

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "Measure S would keep the commission and its terms, but remove the charter's provisions on park operations, finances and property, leaving them to other city laws."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "amended-page"

[[section.line]]
id = "advise"
text = "The commission would advise the council on parks, and its recommendations would not bind the council."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "city-council-chamber"

[[section.line]]
id = "before"
text = "Before acting on city parks, the council would have to receive the commission's recommendation."
sources = ["guide-page"]

[[section.line]]
id = "limits"
text = "Measure S would not itself spend money, sell park land or abolish the commission, and needs a simple majority to pass."
sources = ["guide-page", "resolution"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "fiscal"
heading = "What it would cost"

[[section.line]]
text = "The Local Voter Information Guide does not include a cost estimate for the measure."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"
stamp = "None reported"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"
filed = false

[[section.line]]
text = "The county voter guide says that no argument for Measure S was filed."
sources = ["guide-page"]

[section.line.visual]
kind = "list"
source = "guide-page"
items = ["No argument for was filed"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "The county voter guide says that no argument against Measure S was filed."
sources = ["guide-page"]

[section.line.visual]
kind = "list"
source = "guide-page"
items = ["No argument against was filed"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote is a vote to amend the charter as the impartial analysis describes."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["amend the Charter as described above"]

[[section.line]]
text = "A no vote is a vote to leave the existing charter language unchanged."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["leave the existing Charter language unchanged"]

[[question]]
ask = "Would the council still have to listen to the commission?"
lines = ["advise", "before"]

[[question]]
ask = "Would this sell or close any parks?"
lines = ["limits"]
