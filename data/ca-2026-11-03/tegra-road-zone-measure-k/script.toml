# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; what the zone is, who votes in
# it and who placed the measure; the vote it needs; what would change
# (the new tax, how it may rise, what it pays for, how long it lasts,
# what happens if it fails); the impartial analysis's revenue estimate; both sides, which
# submitted nothing; what a vote does.
#
# No arguments were submitted ("NO ARGUMENTS FOR OR AGAINST THIS MEASURE
# WERE SUBMITTED"): both sides say so, filed = false (STANDARD.md 2.5),
# citing the pamphlet page that prints the notice. The pamphlet prints
# no tax rate statement; the revenue estimate is in the ballot question
# and County Counsel's impartial analysis, which the fiscal line names as
# the county attorney's ("Counsel" is heard as "Council",
# standard/speakability.txt). The money is the zone's own road revenue,
# and no archived source states a budget it would be part of, so it has
# no scale (STANDARD.md 6.5; left open). The per-parcel amounts are
# exempt. No archived source says where the zone is or how many parcels
# it has, so the script says neither.

contest = "ca-2026-11-03-tegra-road-zone-measure-k"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide-page"
number = "K"
title = "IMPARTIAL ANALYSIS OF MEASURE K"
origin = "This Measure was placed on the ballot by the Board of Supervisors of the County of El Dorado at the request of the advisory committee for the Zone"
summary = "Shall the measure to levy an annual special tax in an amount of $520.00 with annual adjustments tied to the Engineering News Record Construction Cost Index, not to exceed 3% annually, on each parcel of land within the Tegra Road Zone of Benefit commencing fiscal year 2027/2028, continuing for an unlimited duration, to be used only for road improvements and maintenance and generating an annual revenue of approximately $11,960.00, to replace the current benefit assessment of $260.00, be adopted?"
yes = "A “YES” vote is a vote to authorize the levy of the annual special tax in an amount of $520 per parcel, as provided in the Measure."
no = "A “NO” vote is a vote against the levy of the annual special tax."

[[section]]
id = "what"
heading = "Measure K"

[[section.line]]
text = "Tegra Road Zone of Benefit Measure K asks the zone's voters whether to replace its $260 yearly road assessment with a $520 tax per parcel."
