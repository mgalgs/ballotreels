# Archived sources for City of South El Monte Measure CL, 2026-11-03
# general election (sources/la-sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The Los Angeles County Registrar-Recorder/County Clerk's list "Measures
# Appearing on the Ballot" is the authority for the measure's letter,
# ballot question and vote threshold, and says in words that no argument
# against was submitted ("Opponents: None submitted.");
# sources/county-measure-list-excerpt.txt is the measure's entry, cut from
# it. The City posts the City Attorney's impartial analysis (the
# measure's neutral explanation) and the argument in favor, both text
# PDFs. Resolution No. 26-057 (a scan), the City Clerk's notice and the
# list's page PDF are not cited. Not a tax: no fiscal statement applies,
# and none was found.

