# Archived sources for City of Palo Alto Measure J, 2026-11-03 general
# election. Every id here may be cited by script.toml.
#
# The Santa Clara County Registrar of Voters' List of Local Measures
# (sources/rov-measure-list-2026-10-29.html) is the authority for the
# measure's letter, its ballot question, verbatim, and its threshold
# ("Majority Vote Required"); the Registrar's posted copies of the City
# Attorney's impartial analysis and the filed arguments (sources/rov-*.pdf,
# described in sources/rov-sources.md) are the documents the county
# prints. Those PDFs are scans with no text layer: each was typed from
# its page images into sources/rov-*-transcription.txt, which these
# sources point at for the verbatim checks; each url is the Registrar's
# PDF. The Registrar named the two arguments' files
# "transportation-use-tax"; their pages are Measure J's.
#
# No full text (the city's ordinance) was archived; the ballot question
# and the impartial analysis carry the explanation. No tax rate or fiscal
# statement was published; the city's revenue estimate is in both. Both
# rebuttals are archived beside the arguments; the script quotes neither,
# so they are not listed.

[contest]
id = "ca-2026-11-03-palo-alto-measure-j"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:palo_alto"
kind = "measure"
title = "City of Palo Alto Measure J: 0.5% Sales Tax for General City Services"

[[source]]
id = "ballot-question"
kind = "official-title-summary"
publisher = "County of Santa Clara Registrar of Voters, List of Local Measures, November 3, 2026 General Election: Measure J's ballot question and vote threshold"
credit = "Santa Clara County Registrar of Voters, List of Local Measures"
url = "https://vote.santaclaracounty.gov/list-local-measures-4"
file = "sources/rov-measure-list-2026-10-29.html"
retrieved = "2026-10-29"

[[source]]
id = "impartial-analysis"
kind = "official-title-summary"
publisher = "Christopher D. Jensen, City Attorney, City of Palo Alto, City Attorney’s Impartial Analysis of Measure J, as posted by the County of Santa Clara Registrar of Voters (transcribed from the scan)"
credit = "City Attorney’s Impartial Analysis of Measure J"
url = "https://files.santaclaracounty.gov/exjcpb1296/2026-08/measure-j_city-of-palo-alto_transactions-and-use-tax_ia_redacted.pdf"
file = "sources/rov-impartial-analysis-transcription.txt"
retrieved = "2026-10-29"

[[source]]
id = "argument-for"
kind = "official-argument"
publisher = "Primary Argument in Favor of Measure J, as filed with the Santa Clara County Registrar of Voters (transcribed from the scan)"
credit = "Argument in favor of Measure J, Santa Clara County Registrar of Voters"
url = "https://files.santaclaracounty.gov/exjcpb1296/2026-08/measure-j-transportation-use-tax-primary-argument-in-favor_redacted-v2.pdf"
file = "sources/rov-argument-for-transcription.txt"
retrieved = "2026-10-29"

[[source]]
id = "argument-against"
kind = "official-argument"
publisher = "Argument Against Measure J, as filed with the Santa Clara County Registrar of Voters (transcribed from the scan)"
credit = "Argument against Measure J, Santa Clara County Registrar of Voters"
