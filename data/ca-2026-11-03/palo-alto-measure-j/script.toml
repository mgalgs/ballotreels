# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; what a general tax is, and what
# the council says it intends to do with this one; how long it lasts and
# what it needs to pass; the city's revenue estimate; one line per side;
# what a vote does.
#
# No narrated line names the city, the school district or the community
# center (the narrator mispronounces proper names); the card and title
# show them.
#
# The council's advisory spending guidelines (to buy seven acres of the
# community center from the school district and modernize it) are in the
# neutral sections because the impartial analysis states them as what
# the measure is for, and the ballot question does not name the purchase.
# They are said as the analysis says them, advisory, with no price: the
# $65.5 million the opponents cite, and that the purchase is the real
# purpose, stay in their section (STANDARD.md 6.3); so do the supporters'
# building conditions and nonresident share. That the tax lasts until
# voters repeal it is the ballot question's and the analysis's, so it is
# said; the opponents' "permanent" is left to them.
#
# Scale (STANDARD.md 6.5): the $15.6 million a year goes into the city's
# general fund, and no archived source states that fund's total, so the
# figure has no scale (left open: the City of Palo Alto's adopted budget
# states it).
#
# The card quotes the Registrar of Voters' List of Local Measures, which
# prints no yes/no lines; the vote lines give the impartial analysis's
# meanings and highlight the one phrase of the question both turn on.

contest = "ca-2026-11-03-palo-alto-measure-j"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "J"
title = "Transactions and Use Tax"
origin = "City of Palo Alto"
summary = "City of Palo Alto Community Safety/Services Measure. To provide general city services including repairing Cubberley Community Center for current safety, earthquake, accessibility standards; upgrading deteriorating electrical systems, wiring, plumbing; acquiring outdoor space/sites; maintaining streets, safe, clean downtown/commercial cores; preparing for natural disasters; repairing deteriorating community spaces, libraries, shall City of Palo Alto’s measure enacting a 0.5% (1/2¢) sales tax, providing approximately $15,600,000 annually until ended by voters, with published financial audits, all funds used locally, be adopted?"

[[section]]
id = "what"
heading = "Measure J"

[[section.line]]
text = "Measure J asks the voters of this city whether to add a 0.5 percent sales tax for general city services."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["0.5% (1/2¢) sales tax"]

[[section]]
id = "today"
heading = "A general tax"

[[section.line]]
id = "general"
text = "Measure J is a general tax: the money would go into the general fund, and could pay for anything the city lawfully does."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "sales-receipt"

[[section.line]]
id = "guidelines"
text = "In June 2026, the City Council adopted advisory guidelines saying it intends to use the money to buy seven acres of a community center from the school district, and modernize it."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "community-center"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "duration"
text = "The tax would start in April 2027 and last until voters repeal it."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "end-date"

[[section.line]]
text = "Measure J needs a simple majority of the vote to pass."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "fiscal"
heading = "What the impartial analysis says"

[[section.line]]
text = "The city estimates the tax would raise about $15.6 million a year."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say it lets the city buy and renovate a center over 70 years old, with failing plumbing and electrical systems."
sources = ["argument-for"]
basis = ["Measure J enables the City to buy the land, cost-effectively renovate buildings", "The Cubberley Community Center is over 70 years old, has failing plumbing and electrical systems"]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Buys and repairs an aging community center", "Nonresidents pay 40 percent of the tax"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say its real purpose is paying the school district $65.5 million for the land, which the measure does not state."
sources = ["argument-against"]
basis = ["the real purpose of the sales tax increase is to enable the City to pay the Palo Alto School District $65.5 million to purchase the land at Cubberley.", "Why doesn't the Measure state this?"]

[section.line.visual]
kind = "list"
source = "argument-against"
items = ["Hides a $65.5 million land purchase", "A permanent tax for a one-time cost"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote approves a 0.5 percent increase to the local sales tax."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["0.5% (1/2¢) sales tax"]

[[section.line]]
text = "A no vote does not approve the increase."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["0.5% (1/2¢) sales tax"]

[[question]]
ask = "What would the money actually be spent on?"
lines = ["general", "guidelines"]

[[question]]
ask = "How long would the tax last?"
lines = ["duration"]

[[question]]
ask = "How big is the tax next to the city's budget?"
unanswered = true
