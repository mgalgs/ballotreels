# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; how it reached the ballot; what
# would change (the rate on top of existing taxes, where the money goes,
# how long it lasts, the vote it needs); the City's revenue estimate as
# the impartial analysis gives it; one line per side; what a vote does.
#
# The card quotes the ballot question from Resolution No. 2026-57,
# which prints no yes/no lines. So, as for Clayton Measure M, the card
# has no YES/NO boxes, the vote lines give the impartial analysis's
# meanings, and both highlight the same phrase of the question.
#
# How long it lasts: the ballot question says "until ended by voters";
# the ordinance and the impartial analysis say "until repealed by the
# City Council or the voters". The narration gives the ordinance's
# fuller wording, which the analysis repeats.
#
# No tax rate statement or fiscal analysis applies; the $3.7 million a
# year is the City's estimate, and no archived source states the City's
# general fund budget to give it a scale (STANDARD.md 6.5; left open,
# under [[question]]). The supporters' $4.1 million shortfall, their
# rate comparison with Napa, their visitors' share and the purchases
# the tax leaves out (groceries, prescriptions) are theirs, so they stay
# in their section or out (STANDARD.md 6.3), though the analysis also
# names the exemptions.
#
# No argument against appears among the documents the City posted, and
# the printed county guide was not seen (sources/sources.md), so the no
# side does not say none was filed: it says none was posted (filed =
# false, STANDARD.md 2.5), as for San Mateo County Measure J.

contest = "ca-2026-11-03-american-canyon-measure-p"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "P"
title = "American Canyon Public Safety, Parks, City Services Measure"
origin = "Measure P"
summary = "Shall an ordinance funding American Canyon’s general City services, such as maintaining 911 response / neighborhood police patrols; preventing crime; reducing wildfire risk by managing brush / other flammable vegetation; addressing speeding / unsafe driving; keeping public areas / parks safe / clean; maintaining and expanding safe places for children to play; maintaining parks, trails, youth / adult recreation, senior programming, among others; by establishing a 1% sales tax, providing approximately $3,700,000 annually until ended by voters, requiring audits, spending disclosure, funds locally controlled, be adopted?"

[[section]]
id = "what"
heading = "Measure P"

[[section.line]]
text = "City of American Canyon Measure P asks American Canyon voters whether to add a 1 percent sales tax for city services."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["by establishing a 1% sales tax"]

[[section]]
id = "today"
heading = "How it reached the ballot"

[[section.line]]
text = "The City Council voted 4 to 1 in June to place Measure P on the ballot."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "ballot-box"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "The tax would add $1 for every $100 spent in American Canyon, on top of existing state and county sales taxes."
sources = ["impartial-analysis", "text"]

[section.line.visual]
kind = "illustration"
name = "sales-receipt"

[[section.line]]
id = "general"
text = "The money would go into the general fund of the city, for any lawful purpose."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "state-budget"

[[section.line]]
id = "end"
text = "The tax would last until repealed by the City Council or by voters, and needs a simple majority to pass."
sources = ["text", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "end-date"

[[section]]
id = "fiscal"
heading = "What the impartial analysis says"

[[section.line]]
id = "revenue"
text = "The city attorney's impartial analysis says the city estimates Measure P would raise about $3.7 million a year."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Measure P protects police and wildfire prevention, and visitors are expected to pay over half."
sources = ["argument-for"]
basis = ["911 emergency response and neighborhood police patrols", "Wildfire risk reduction, vital when large areas of our city are rated", "More than half of that revenue is expected to come from visitors who shop here, so residents will not shoulder the cost alone."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Protects police and wildfire prevention", "Visitors expected to pay over half"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure P appears among the measure documents that the City of American Canyon posted."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "list"
source = "impartial-analysis"
items = ["No argument against was posted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote permits the city to impose the 1 percent sales tax."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["by establishing a 1% sales tax"]

[[section.line]]
text = "A no vote prohibits the city from imposing the 1 percent sales tax."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["by establishing a 1% sales tax"]

[[question]]
ask = "When would the tax end?"
lines = ["end"]

[[question]]
ask = "What can the money be spent on?"
lines = ["general"]

[[question]]
ask = "How big is $3.7 million a year next to the city budget?"
unanswered = true
