# Archived sources for City of American Canyon Measure P, 2026-11-03
# general election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# Napa County's Voter Information Guide could not be fetched
# (napacounty.gov answers plain requests with a 403), so these are the
# City Clerk's copies from the City of American Canyon's Ballot Measures
# page. The ballot question is quoted from Resolution No. 2026-57, which
# orders it to "appear on the ballot". The resolution is a scan with no
# text layer: its ballot question and adoption vote were typed from the
# page images into sources/resolution-2026-57-transcription.txt, which
# names the PDF and URL it copies; that source points at the
# transcription, and its url at the scan. The City Attorney's impartial
# analysis is the measure's neutral explanation, the kind a state's
# attorney general's explanatory statement is. No tax rate statement or
# fiscal analysis applies (a sales tax); the one revenue estimate is the
# City's, as the analysis gives it.
#
# The City's page lists headings for an argument against and both
# rebuttals with no document under them; whether any was filed is not
# confirmed against the printed county guide.

[contest]
id = "ca-2026-11-03-american-canyon-measure-p"
