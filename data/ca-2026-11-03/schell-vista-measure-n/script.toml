# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; what a spending limit is, and how the
# district's came to be raised; what the measure needs to pass; what a
# yes and a no would each do, as the impartial analysis states both
# (STANDARD.md 6.4); that the pages print no cost estimate; one line per
# side; what a vote does.
#
# The measure raises a spending limit and levies no tax, and the pages
# print no fiscal statement and no dollar figure, so the fiscal line
# says there is no cost estimate, naming the county's guide as the
# Alameda and Riverside scripts do. The analysis's "does not authorize
# ... increase the property tax rate" is the supporters' "not a new
# tax", so the neutral sections leave it out (STANDARD.md 6.3). The
# card's origin is the analysis's first sentence, not the one that says
# "Measure A" as printed. "Counsel" is heard as "Council"
# (standard/speakability.txt), so the narration says "the impartial
# analysis".
#
# No argument against Measure N was submitted. The no side says so
# plainly; its section is marked filed = false.

contest = "ca-2026-11-03-schell-vista-measure-n"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "measure-question"
number = "N"
title = "Schell-Vista Fire Protection District"
origin = "The Schell Vista Fire Protection District (“District”) has called a special election to ask voters to increase the District’s appropriations (spending) limit for four years, the maximum period allowed by law."
summary = "Shall the Schell Vista Fire Protection District adopt Ordinance No. 2026-01 retaining the District’s increased limits on appropriations to assure continued fire, rescue and emergency medical services?"
yes = "A “yes” vote on Measure N is a vote to continue the previously approved increase in the District’s appropriations (spending) limit for an additional four years."
no = "A “no” vote on Measure N is a vote against continuing the previously approved increase in the District’s appropriations (spending) limit."

[[section]]
id = "what"
heading = "Measure N"

[[section.line]]
text = "Schell-Vista Fire Protection District Measure N asks the district's voters whether to keep its higher spending limit for four more years."
sources = ["measure-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "measure-question"
highlight = ["retaining the District’s increased limits on appropriations"]

[[section]]
id = "today"
heading = "How the spending limit works"

[[section.line]]
text = "The California Constitution sets a yearly limit on a government's spending of tax money, which voters may raise for up to four years at a time."
