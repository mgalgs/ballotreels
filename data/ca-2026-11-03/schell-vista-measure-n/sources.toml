# Archived sources for Schell-Vista Fire Protection District Measure N,
# 2026-11-03 general election (sources/sources.md). Every id here may be
# cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# The Sonoma County Registrar of Voters publishes each measure's pages
# of its guide as one PDF, headed "Local Ballot Measure: N" and footed
# "Sonoma County" with the guide's page numbers (049M556 to 049M558); no
# cover page was archived, so the sources name those pages, not a guide
# title. One PDF backs every source here. County Counsel's Impartial
# Analysis is the measure's neutral explanation. The measure raises a
# spending limit and levies no tax; the pages print no fiscal statement
# or cost estimate. They print an argument in favor and "No Argument Was
# Submitted Against Measure N", and no rebuttals. One sentence of the
# printed analysis says "Measure A" where every other line says
# Measure N; as printed.
#
# A fire protection district has no Census boundary, so the measure's
# division is the county and `voters` names the district
# (docs/SCRIPT-FORMAT.md). The guide's heading spells the district
# "Schell-Vista"; its question and analysis, "Schell Vista".

[contest]
id = "ca-2026-11-03-schell-vista-measure-n"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/county:sonoma"
kind = "measure"
title = "Schell-Vista Fire Protection District Measure N: Spending Limit Extension"
voters = "the Schell-Vista Fire Protection District"

