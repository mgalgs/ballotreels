# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the tax the city already has and
# how the measure reached the ballot; what would change (the added rate,
# what is exempt, where the money goes, how long it lasts and the vote
# it needs); the revenue estimate as the impartial analysis gives it;
# both sides, neither of which has an argument among the county's
# documents; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". The card, title and chart
# title carry it. "City's" sounds like "cities" (standard/speakability.txt),
# so the narration says "the city".
#
# The card quotes the measure as Resolution No. 2026-37 prints it to
# appear on the ballot, the county's copy, with blank YES and NO boxes
# and no yes/no sentences. So the card has no boxes; the vote lines give
# the impartial analysis's own meanings, and both highlight the same
# phrase of the question. The uses the question lists are on the card,
# not narrated: the money is a general tax's, for any general fund
# purpose.
#
# The $2.35 million a year is the impartial analysis's estimate. No
# archived official document states the City's general fund budget to
# give it a scale (STANDARD.md 6.5; left open, under [[question]]).
#
# Kern County Elections' page posts no argument for or against Measure H,
# and no document says that none was filed. So the sides do not say none
# was filed: each says none is among the documents gathered (filed =
# false, STANDARD.md 2.5), as for Livingston T and U.

contest = "ca-2026-11-03-arvin-measure-h"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "H"
title = "RESOLUTION NO. 2026-37"
origin = "THE CITY COUNCIL OF THE CITY OF ARVIN"
summary = "To protect funding for the City of Arvin's local police and fire departments, 911 emergency response, street and road repairs, parks, youth and senior services, and other general city services, shall the measure establishing a 1% transactions and use tax in the City of Arvin, providing approximately $2,350,000 annually, until ended by voters, with all funds staying local, audited independently, and publicly disclosed, be adopted?"

[[section]]
id = "what"
heading = "Measure H"

[[section.line]]
text = "Measure H asks the voters of this city whether to add a second 1 percent local sales tax for general city services."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["establishing a 1% transactions and use tax"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "today-rate"
text = "Today, the city already charges one local sales tax, at 1 percent."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "sales-receipt"

[[section.line]]
text = "The City Council placed Measure H on the ballot."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "city-council-chamber"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
