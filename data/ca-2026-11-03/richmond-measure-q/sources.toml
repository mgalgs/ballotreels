# Archived sources for City of Richmond Measure Q, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# Contra Costa County's Voter Information Guide could not be fetched
# (contracostavote.gov answered a bot challenge), so these are the City's
# own signed copies from its 2026 General Election Information page. The
# ballot question is quoted from Section 1 of Resolution No. 143-26,
# which places the measure. The City Attorney's impartial analysis is the
# measure's neutral explanation, the kind a state's attorney general's
# explanatory statement is; the Finance Director's financial analysis is
# the measure's tax rate statement (Elections Code section 9401), its
# fiscal statement.
#
# Resolution No. 143-26 is a scan with no text layer. Its title and
# Sections 1 and 2 were typed from the page images into
# sources/resolution-143-26-transcription.txt, which names the PDF and
# URL it copies; the source points at the transcription, and its url at
# the scan. Neither rebuttal is cited.

[contest]
id = "ca-2026-11-03-richmond-measure-q"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:richmond"
kind = "measure"
title = "City of Richmond Measure Q: $120 Million in Bonds for Fire Stations"

[[source]]
id = "ballot-question"
kind = "official-title-summary"
publisher = "City of Richmond, City Council, Resolution No. 143-26, adopted July 28, 2026: Section 1, the ballot question, pages 1 and 2 (transcribed from the scan)"
