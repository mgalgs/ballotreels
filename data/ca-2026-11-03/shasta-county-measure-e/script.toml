# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; what eminent domain is, and what the 2005
# Supreme Court decision the impartial analysis cites allows today; what
# the amendment would bar, and the vote it needs; no cost estimate; one line per side; what a vote does. Measure F,
# the other charter amendment on this ballot, follows the same chain.
#
# No place name is narrated (the narrator mispronounces them): the opening
# says "the voters of this county", and the charter is "the county
# charter". "Counsel" is heard as "Council" and "consent" as "can sense"
# (standard/speakability.txt), so the narration says neither: the owner's
# "agreement" stands for the analysis's "consent".
#
# Every neutral line rests on the ballot question page and County
# Counsel's impartial analysis. The opponents cite the state law that
# already limits eminent domain (Proposition 99) and the 2024 vote on an
# earlier measure, and the supporters cite protecting property owners, so
# neither appears in a neutral section (STANDARD.md 6.3). The guide prints
# no fiscal statement; the opponents' estimate of the cost of placing the
# measure on the ballot is theirs, and is not used in the fiscal line.
#
# The card quotes the ballot question page with its yes and no sentences.

contest = "ca-2026-11-03-shasta-county-measure-e"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "E"
title = "Limitation on Exercise of Eminent Domain"
origin = "Charter Amendment Measure E"
summary = "Shall Measure E (Adding to the Shasta County Charter) be adopted? This measure adds a subsection to the Shasta County Charter. The proposed addition would restrict the County’s authority to exercise eminent domain to acquire property from any private owner, without such owner’s consent, when the purpose of the acquisition is to convey the property acquired to any private party."
yes = "If approved by a majority of the qualified electors, the Ordinance would provide that the County Board of Supervisors cannot authorize the County to use its power of eminent domain for the purpose of acquiring property from any private Owner thereof, without the Owner’s consent, when the County’s purpose in acquiring the property is to convey the property to another private party."
no = "A “No” Vote on this measure means the County Board of Supervisors will keep its current ability to authorize the County to use its power of eminent domain for the purpose of acquiring property from any private owner thereof without the owner’s consent even though the County’s purpose in acquiring the property is to convey the property to some other private party which the County Board of Supervisors has determined will put the property to a more economically beneficial use."

[[section]]
id = "what"
heading = "Measure E"

[[section.line]]
text = "Measure E asks the voters of this county whether to add a limit on eminent domain to the county charter."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
