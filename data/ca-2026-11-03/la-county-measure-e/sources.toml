# Archived sources for Los Angeles County Measure E, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1). Each is the Registrar-Recorder/County
# Clerk's own web copy of the measure's document; no page range of the
# printed Sample Ballot and Voter Information Pamphlet was archived.
#
# The ordinance's Section 2 gives "The exact form of the measure as it is
# to appear on the ballot", so it backs the ballot label and the full
# text. The Registrar's final list "Measures Appearing on the Ballot"
# (Rev. 9/22/26) prints the title with "BUDGET ALLOCATION" added, so the
# card quotes the list (county-list, an excerpt of its page 3).

[contest]
id = "ca-2026-11-03-la-county-measure-e"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/county:los_angeles"
kind = "measure"
title = "Los Angeles County Measure E: Ethics Commission and Community Investment Charter Amendment"

[[contest.correction]]
date = "2026-10-30"
note = "The card now quotes the county's final list of measures on the ballot, whose title adds the words \"Budget Allocation\" to the one in the proposed ordinance."

