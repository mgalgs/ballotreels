# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and whose measure it is; that no limit applies today, who placed
# Measure CC on the ballot and the vote it needs; the limit, how a partial
# term counts, and from when; that no cost estimate is published; one
# line per side; what a vote does.
#
# The card quotes the ballot question from Resolution No. 30-2026, which
# prints no yes/no lines (the City Attorney's analysis has them, in
# another document), so, as for Los Angeles County Measure A, the card has
# no YES/NO boxes, the vote lines give the analysis's meanings, and both
# highlight the one phrase of the question they turn on.
#
# The argument in favor says members "must step away for two years
# before seeking a seat again"; the ordinance states no such break, so
# the neutral sections say only what the impartial analysis says, and
# the supporters' line does not repeat the two years. Both arguments were
# filed as "Measure ___"; the script says Measure CC.

contest = "ca-2026-11-03-east-palo-alto-measure-cc"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "CC"
title = "A MEASURE TO AMEND THE MUNICIPAL CODE TO ESTABLISH TERM LIMITS FOR CITY COUNCIL POSITIONS"
origin = "A RESOLUTION OF THE CITY COUNCIL OF THE CITY OF EAST PALO ALTO"
summary = "Shall the measure providing that no person shall be eligible to serve for more than three (3) consecutive full terms on the City Council be adopted, with service of partial terms exceeding two years qualifying as a full term?"

[[section]]
id = "what"
heading = "Measure CC"

[[section.line]]
text = "East Palo Alto Measure CC asks city voters whether to limit City Council members to three consecutive full terms."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["three (3) consecutive full terms"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Today, the city code does not limit how long someone may serve on the City Council."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "legislative-chamber"

[[section.line]]
text = "The City Council placed Measure CC on the ballot, and it needs a majority to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "ballot-box"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "limit"
text = "Measure CC would allow at most three consecutive four-year terms, or 12 years."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "end-date"

[[section.line]]
text = "A partial term of more than two years would count as a full term."
sources = ["impartial-analysis"]

[[section.line]]
id = "start"
text = "Only terms beginning after December 2026 would count, so earlier service would not."
sources = ["impartial-analysis"]

[[section]]
id = "fiscal"
heading = "What the documents say"

[[section.line]]
text = "The published measure documents of San Mateo County do not include a cost estimate for the measure."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"
stamp = "None reported"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say term limits bring new voices and new ideas into city hall, and the limit applies going forward only."
sources = ["argument-for"]
basis = ["Term limits bring new voices, new ideas, and new energy into City Hall.", "Measure ___ is written to be fair. It applies going forward only."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["New voices and new ideas", "Applies going forward only"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say voters already limit terms by voting members out, and limits keep seasoned members from regional leadership posts."
sources = ["argument-against"]
basis = ["East Palo Alto already has term limits. It’s called voting out your city representatives when they are not meeting the community’s needs.", "East Palo Altans disadvantage ourselves with term limits, handicapping our seasoned elected representatives from holding leadership positions on vital regional bodies."]

[section.line.visual]
kind = "list"
source = "argument-against"
items = ["Voters can already vote members out", "Keeps leaders from regional posts"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote adopts these term limits for City Council members."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["three (3) consecutive full terms"]

[[section.line]]
text = "A no vote means City Council members would not be subject to term limits."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["three (3) consecutive full terms"]

[[question]]
ask = "How long could someone serve on the City Council?"
lines = ["limit"]

[[question]]
ask = "Would years already served count against current members?"
lines = ["start"]
