credit = "Argument in favor, San Mateo County Assessor-County Clerk-Recorder & Elections"
url = "https://smcacre.gov/system/files/2026-08/52-ENG-M302-Contest%20Code-4ArgInFavor-City%20of%20Brisbane%20Business%20License%20Tax_Redacted.pdf"
file = "sources/argument-for.pdf"
