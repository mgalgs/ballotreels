# Archived sources for City of Brisbane Measure X, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# San Mateo County publishes each measure's documents separately, as
# PDFs filed by the city with the Assessor-County Clerk-Recorder &
# Elections office, not as one pamphlet. The ballot question is printed
# in the City Council's Resolution No. 2026-28, Section 1; the City
# Attorney's impartial analysis is the measure's neutral explanation,
# the kind a state's attorney general's explanatory statement is. No
# tax rate statement or separate fiscal analysis was filed: the one
# revenue estimate is the City's, as the ballot question and the
# impartial analysis give it.
#
# The resolution is a scan whose OCR layer breaks the ballot question
# ("$25, 000"; the YES and NO boxes inside it). The card's verbatim check
# reads its transcription (sources/resolution-full-text.transcription.txt,
# made from the page images), which a source whose file is not a PDF
# gives it; the PDF beside it is the archived copy, and the url is the
# PDF's. The argument in favor's OCR layer reads cleanly where it is
# quoted.

[contest]
id = "ca-2026-11-03-brisbane-measure-x"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:brisbane"
kind = "measure"
title = "City of Brisbane Measure X: Replacing the Tiered Business License Tax With a Gross Receipts Rate"

[[source]]
id = "ballot-question"
kind = "official-title-summary"
publisher = "City of Brisbane, Resolution No. 2026-28, Section 1: the ballot question, page 2, as filed with San Mateo County Assessor-County Clerk-Recorder & Elections"
credit = "Ballot question, Resolution No. 2026-28"
url = "https://smcacre.gov/system/files/2026-07/52-ENG-M302-Contest%20Code-Reso-City%20of%20Brisbane%20Business%20License%20Tax_Redacted_1.pdf"
file = "sources/resolution-full-text.transcription.txt"
retrieved = "2026-10-28"

[[source]]
id = "impartial-analysis"
kind = "official-title-summary"
publisher = "Samantha W. Zutler, City of Brisbane City Attorney, Measure X City Attorney's Impartial Analysis (August 14, 2026), San Mateo County Assessor-County Clerk-Recorder & Elections"
credit = "City Attorney's Impartial Analysis of Measure X"
url = "https://smcacre.gov/system/files/2026-08/52-ENG-MX-ImpartialAnalysis-City-of-Brisbane-Business-License-Tax.pdf"
file = "sources/impartial-analysis.pdf"
retrieved = "2026-10-28"

[[source]]
id = "argument-for"
