# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the tiered tax today and where
# its money goes; the new rate for small and for other businesses, the
# cost-of-operations floor, and exemptions it ends; the City's revenue
# estimate; one line per side; what a vote does.
#
# The card quotes the ballot question, printed only in the City
# Council's resolution, which prints no yes/no lines. So, as for Los
# Angeles County Measure E, the card has no YES/NO boxes, the vote lines
# give the impartial analysis's meanings, and both highlight the same
# phrase of the question.
#
# The official record conflicts on the nonprofit exemption: the
# ordinance's recital says the measure keeps the exemptions "applicable
# to nonprofit organizations", while the amended code strikes that
# exemption and the impartial analysis lists it among those deleted
# (sources/sources.md). The script gives the analysis, then the
# recital, and says in the same line that the amended code text strikes
# the exemption, so the recital is not left standing alone. No tax rate statement
# was filed; the $1,000,000 a year is the City's estimate, and no
# archived source states the city's budget to give it a scale
# (STANDARD.md 6.5; left open, under [[question]]). The supporters' "haven't been adjusted
# since 1983" is theirs (STANDARD.md 6.3), so it stays in their section;
# their "fair share" is on the judgment-word list, so the line says
# "their share".
#
# No argument against is among the measure documents San Mateo County
# publishes: the no side is filed = false, as for Proposition 37.

contest = "ca-2026-11-03-brisbane-measure-x"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "X"
title = "RESOLUTION OF THE CITY COUNCIL OF THE CITY OF BRISBANE SUBMITTING TO THE ELECTORS IN THE NOVEMBER 3, 2026 ELECTION A BALLOT MEASURE TO UPDATE THE CITY'S BUSINESS LICENSE TAX"
origin = "Pursuant to Elections Code section 9222, the City Council of the City of Brisbane hereby approves the ballot language, and the Ordinance attached hereto as Attachment A, to be placed on the ballot and submitted to the voters of the City at the November 3, 2026 election."
summary = "Shall the measure updating the City's Business License Tax by replacing the current tiered structure with a $50 tax for businesses with annual gross receipts of $25,000 or less and $50 plus $1.00 per $1,000 of gross receipts above $25,000 for most other businesses; establishing a minimum tax base equal to the cost of operations for businesses whose operating costs exceed gross receipts; and raising approximately $1,000,000 annually, until repealed by voters, be adopted?"

[[section]]
id = "what"
heading = "Measure X"

[[section.line]]
text = "City of Brisbane Measure X asks the voters of Brisbane whether to replace the tiered business license tax with one formula based on gross receipts."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["replacing the current tiered structure"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Today, most businesses pay tiered rates, from $50 for the smallest to $1,300 plus 4 cents per $1,000 for the largest."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "city-storefronts"

[[section.line]]
text = "The tax is a general tax: its money goes into the General Fund for general city services."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "state-budget"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "Businesses with gross receipts of $25,000 or less would pay $50, and most others $50 plus $1 per $1,000 above that."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "city-storefronts"

[[section.line]]
text = "A business whose operating costs exceed its gross receipts would be taxed on its cost of operations."
sources = ["ballot-question", "impartial-analysis"]

[[section.line]]
id = "exemptions-end"
text = "The impartial analysis says Measure X would end some exemptions, including those for newspapers, nonprofits and veterans."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "amended-page"

[[section.line]]
id = "nonprofits"
text = "A preamble of the ordinance says nonprofit exemptions would stay, but the amended code it adopts strikes the nonprofit exemption."
sources = ["text", "impartial-analysis"]

[[section]]
id = "fiscal"
heading = "What the analysis says"

[[section.line]]
id = "revenue"
text = "The city attorney's impartial analysis says the city estimates Measure X would raise about $1 million more a year."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "set-aside-funds"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say raising fees unchanged since 1983 makes businesses contribute their share to city services."
sources = ["argument-for"]
basis = ["This measure is a reasonable update to Brisbane's Business License Tax to ensure that businesses contribute their fair share toward City Services.", "It raises fees that haven't been adjusted since 1983"]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Businesses contribute their share", "Fees unchanged since 1983"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure X appears in the published measure documents of San Mateo County."
sources = ["argument-for"]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["No argument against was published"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote replaces the tiered rates with the new formula."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["replacing the current tiered structure"]

[[section.line]]
text = "A no vote keeps the current tax structure in place."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["replacing the current tiered structure"]

[[question]]
ask = "How much money would the new tax raise?"
lines = ["revenue"]

[[question]]
ask = "How big is the new money next to the city budget?"
unanswered = true

[[question]]
ask = "Would nonprofits still be exempt?"
lines = ["exemptions-end", "nonprofits"]
