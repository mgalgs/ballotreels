# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and of whom; the parcel tax today and when it ends; what it needs
# to pass; what would change (the rate, its length, inflation, what the
# money may pay for); the impartial analysis's revenue estimate; one
# line per side; what a vote does.
#
# San Mateo County posts the measure's documents one by one, so the card
# quotes the ballot question (Exhibit A-I), the resolution's heading and
# its Section 2 from Resolution No. 2026-06-10-B, and names that
# resolution as its document. The resolution prints no yes or no lines,
# so the card has none; the vote lines take their meanings from the
# impartial analysis and highlight the resolution's own phrases, as
# Utah's do. The impartial analysis prints no author, so the script
# never names one. No archived source states the district's budget, so
# the $1.3 million has no scale (STANDARD.md 6.5; left open); $118 is an
# amount per parcel (exempt).
#
# No archived official source gives Measure D's current rate, so the
# script does not say whether $118 is more, less or the same; "without
# increasing taxes" stays on the card and in the supporters' line, and
# the opponents' "$1,180 over the next 10 years" in their argument
# (STANDARD.md 6.3).

contest = "ca-2026-11-03-pacifica-school-measure-t"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "T"
title = "To renew expiring local funding without increasing taxes, with local funding for elementary/middle schools the state cannot take away, to support strong math, science, history, reading/writing programs; attract/retain qualified teachers/counselors; maintain art/music/outdoor education programs, libraries and computer instruction, shall Pacifica School District's measure be adopted, levying $118 per parcel, raising $1,300,000 annually for 10 years, with senior exemptions, independent oversight and no money for administrator salaries?"
origin = "RESOLUTION CALLING PARCEL TAX ELECTION"
summary = "This resolution shall stand as the order to the San Mateo County Superintendent of Schools to call an election within the boundaries of the District on November 3, 2026, for the purpose of proposing to the electors of the District the measure contained in Exhibit A hereto."

[[section]]
id = "what"
heading = "Measure T"

[[section.line]]
text = "Pacifica School District Measure T asks the district's voters whether to renew its parcel tax at $118 per parcel for ten years."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["levying $118 per parcel"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Today, the district levies a parcel tax that voters renewed in 2016, which expires on June 30, 2027."
sources = ["impartial-analysis", "text"]

[section.line.visual]
kind = "illustration"
name = "special-tax"

[[section.line]]
text = "Measure T needs two-thirds of the vote to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "The tax would continue through June 2037, rising each year with inflation."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "library-shelves"

[[section.line]]
text = "The money could pay for academic programs, teachers, libraries and help for struggling students, but not administrator salaries."
sources = ["impartial-analysis"]

[[section]]
id = "fiscal"
heading = "What the impartial analysis says"

[[section.line]]
text = "The impartial analysis says the tax is estimated to raise $1.3 million each year."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Measure T keeps qualified teachers, libraries and outdoor education, without raising taxes by a single penny."
sources = ["argument-for"]
basis = ["to renew local education funding that protects excellent academic programs, including library services and outdoor education, and retains qualified teachers without raising taxes by a single penny."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Keeps teachers, libraries, outdoor education", "Renews funding without raising taxes"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say enrollment fell by 280 since 2021, and other district funds can pay for administration without limits."
sources = ["argument-against"]
basis = ["The district wants to extend the last parcel tax of $118 per year for another 10 years, while the enrollment declined by 280 since 2021.", "But, funds generated separately from this parcel tax can be used for administration expenses without limits."]

[section.line.visual]
kind = "list"
source = "argument-against"
items = ["Enrollment down 280 since 2021", "Other funds pay administration freely"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote would impose the $118 parcel tax, adjusted for inflation, for ten years."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["raising $1,300,000 annually for 10 years"]

[[section.line]]
text = "A no vote would not allow the tax to be levied, and the current one ends in June 2027."
sources = ["impartial-analysis", "text", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["renew expiring local funding"]
