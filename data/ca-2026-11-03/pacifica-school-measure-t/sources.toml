# Archived sources for Pacifica School District Measure T, 2026-11-03
# general election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# San Mateo County publishes each measure's documents separately, not as
# one pamphlet: the Board of Trustees' resolution (whose Exhibit A-I is
# the ballot question), the impartial analysis, and each argument and
# rebuttal, as its own PDF on the Assessor-County Clerk-Recorder &
# Elections page. The impartial analysis prints no author. A parcel tax
# has no tax rate statement; the revenue estimate is the impartial
# analysis's (and the ballot question's).
#
# Every PDF here is a scan with no usable text layer. Each source's
# `file` is therefore a transcription of the pages the script quotes,
# made by reading the page images, beside the PDF it transcribes
# (sources/<name>.txt for sources/<name>.pdf); `url` is the PDF's. The
# check reads a non-PDF file as plain text.

[contest]
id = "ca-2026-11-03-pacifica-school-measure-t"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/school_district:pacifica_school_district"
kind = "measure"
title = "Pacifica School District Measure T: Education Parcel Tax Renewal"

[[source]]
id = "ballot-question"
kind = "official-title-summary"
publisher = "Board of Trustees of the Pacifica School District, Resolution No. 2026-06-10-B, Exhibit A-I: Abbreviation of the Measure, as posted by San Mateo County Assessor-County Clerk-Recorder & Elections"
credit = "Resolution No. 2026-06-10-B"
url = "https://smcacre.gov/system/files/2026-06/52-ENG-M103-Contest%20Code-Reso-Pacifica%20SD%20Parcel%20Tax_Redacted.pdf"
