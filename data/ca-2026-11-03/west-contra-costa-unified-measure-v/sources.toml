# Archived sources for West Contra Costa Unified School District Measure
# V, 2026-11-03 general election (sources/sources.md). Every id here may
# be cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# Every source is one page: the Contra Costa County Elections Division's
# Voter Information Guide page for Measure V, which prints, in order, the
# ballot question, County Counsel's impartial analysis, the argument in
# favor and its rebuttal, the argument against and its rebuttal, and the
# full text of the measure. contracostavote.gov answers a bot challenge,
# so the page was archived from the Internet Archive's capture of
# 2026-10-09; each url is that capture, and the original is
# https://www.contracostavote.gov/m9004-en-2/. Where the page and the
# District's own parcel tax page (sources/district-parcel-tax-page.html)
# differ, the guide page wins; the District's page is not cited.
#
# County Counsel's impartial analysis is the measure's neutral
# explanation, the kind a state's attorney general's explanatory
# statement is. A parcel tax has no tax rate statement: the revenue
# figure is the ballot question's.

[contest]
id = "ca-2026-11-03-west-contra-costa-unified-measure-v"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/school_district:west_contra_costa_unified_school_district"
kind = "measure"
title = "West Contra Costa Unified School District Measure V: Renewing the Parcel Tax for Nine Years"

[[source]]
id = "ballot-question"
kind = "official-title-summary"
publisher = "Contra Costa County Elections Division, Voter Information Guide, Measure V page (https://www.contracostavote.gov/m9004-en-2/, Internet Archive capture of October 9, 2026): the ballot question"
