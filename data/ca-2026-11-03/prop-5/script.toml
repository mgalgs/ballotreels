# Recipe E, 60 seconds, distilled: one claim per line. The chain: what a
# recall is; the two questions on a recall ballot today; what dropping
# the second question changes and how the office is filled instead; the
# analyst's costs and savings; one point per side; what a vote does.

contest = "ca-2026-11-03-prop-5"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "quick-reference"
number = "5"
title = "CHANGES RECALL ELECTION PROCESS FOR STATEWIDE OFFICERS. LEGISLATIVE CONSTITUTIONAL AMENDMENT."
origin = "Put on the Ballot by the Legislature"
summary = "Under current law, voters elect replacement candidates at the same time as the recall election. This measure instead fills recall vacancies by subsequent special election or appointment. Fiscal Impact: Net fiscal effect unknown. In the event of a recall, savings or costs of millions of dollars to administer the election depending on the office recalled."
yes = "A YES vote on this measure means: Recall elections would no longer include a question about who should fill the vacancy. Instead, vacancies typically would be filled through special elections or appointments, depending on the office and timing."
no = "A NO vote on this measure means: Voters would continue to be asked who should fill the vacancy as part of recall elections."

[[section]]
id = "what"
heading = "Proposition 5"

[[section.line]]
text = "Proposition 5 is about recalls, which let voters remove a state official early."
sources = ["quick-reference", "lao-analysis"]

[section.line.visual]
kind = "page"
source = "quick-reference"
highlight = ["CHANGES RECALL ELECTION PROCESS"]

