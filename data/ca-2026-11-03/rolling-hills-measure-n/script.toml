# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is (Zone 1, not the whole district);
# today's assessment; what Zone 1 is and why one subdivision is left out;
# who placed the measure; the vote it needs; what would change (the new
# tax beside the assessment, how it may rise, what it pays for, how long
# it lasts, the spending limit, what happens if it fails); the impartial
# analysis's revenue estimate; one line per side; what a vote does.
#
# Only Zone No. 1 is taxed: the opening says the measure is Zone 1's and
# the zone line says what Zone 1 leaves out, without the subdivision's
# name (narrated lines speak no place names; the card, title and
# `voters` show it). The analysis states where the tax is levied, not
# who votes; `voters` is Zone 1 as the round's handoff decided.
#
# An argument in favor was printed; no argument against was ("NO
# ARGUMENTS AGAINST THIS MEASURE WERE SUBMITTED"), so the no side says
# so, filed = false (STANDARD.md 2.5), citing the pamphlet page that
# prints the notice. The supporters' list of projects is theirs, so it
# stays in their section or out (STANDARD.md 6.3).
#
# The pamphlet prints no tax rate statement; the revenue estimate is in
# the ballot question and County Counsel's impartial analysis, which the
# fiscal line names as the county attorney's ("Counsel" is heard as
# "Council", standard/speakability.txt). No archived source states the
# district's budget, so the figure has no scale (STANDARD.md 6.5; left
# open). The per-parcel amounts are exempt. The chart sets the new tax
# beside the assessment it would be added to, both per parcel and both
# as the analysis states them; it adds nothing up.

contest = "ca-2026-11-03-rolling-hills-measure-n"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide-page"
number = "N"
title = "IMPARTIAL ANALYSIS OF MEASURE N"
origin = "This Measure was placed on the ballot by the Board of Directors of the District"
summary = "Shall the measure authorizing the Rolling Hills Community Services District to levy a special tax in the amount of $250 per parcel annually, subject to an annual inflation adjustment not to exceed 3%, on all parcels within the District, except the Sierramonte subdivision, generating $87,250 annually, until ended by voters, and increasing the District's appropriations limit, to maintain District infrastructure and services, including fire mitigation, roads, drainage, lighting, landscaping, and parks, be approved?"
yes = "A “YES” vote is a vote to authorize the levy of the annual special tax in an amount of $250 per parcel within Zone No. 1, as provided in the Measure."
no = "A “NO” vote is a vote against the levy of the annual special parcel tax."

[[section]]
id = "what"
heading = "Measure N"

[[section.line]]
text = "Measure N asks the voters of Zone 1 of this community services district whether to add a yearly tax of $250 per parcel."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["a special tax in the amount of $250 per"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Every property in the district pays a $200 yearly assessment, unchanged since 1987."
sources = ["ordinance"]

[section.line.visual]
kind = "illustration"
name = "street-trees-lights"

[[section.line]]
id = "voters"
text = "Zone 1 is the whole district except one gated subdivision that keeps up its own infrastructure through a homeowners' association."
sources = ["ordinance", "guide-page"]

[[section.line]]
text = "The district's board of directors placed Measure N on the ballot."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "ballot-box"

[[section.line]]
text = "Measure N needs two-thirds of the vote to pass."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "The new tax would come on top of the $200 assessment, which would not change."
sources = ["guide-page"]

[section.line.visual]
kind = "bars"
title = "Yearly charges per parcel in Zone 1, in dollars"
source = "guide-page"
unit = ""
labels = ["Today's assessment", "Measure N's new tax"]
values = [200, 250]

[[section.line]]
text = "The tax could rise each year with inflation, by no more than 3 percent."
sources = ["guide-page"]

[[section.line]]
id = "use"
text = "The money could pay only for district services in Zone 1, such as fire mitigation, roads, drainage, lighting and parks."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "hillside-brush-clearing"

[[section.line]]
text = "The tax would last until voters change or repeal it, and the district's spending limit would rise to match."
sources = ["guide-page", "ordinance"]

[section.line.visual]
kind = "illustration"
name = "special-tax"

[[section]]
id = "fiscal"
heading = "What the impartial analysis says"

[[section.line]]
text = "The county attorney's impartial analysis expects the tax to raise about $87,250 a year."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say the assessment has not kept pace with repair costs, and upkeep now will head off costlier repairs later."
sources = ["argument-for"]
basis = ["This amount is inadequate, and does not keep pace with the rising costs of repair and inflation.", "By investing in ongoing preventative maintenance today, the District will reduce the likelihood of more costly repairs in the future."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Assessment lags repair costs", "Upkeep now prevents costlier repairs"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure N was submitted, the voter pamphlet of this county says, and it prints no rebuttals."
sources = ["guide-page"]

[section.line.visual]
kind = "list"
source = "guide-page"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote authorizes the tax of $250 per parcel a year in Zone 1."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["a vote to authorize the levy"]

[[section.line]]
text = "A no vote is against the tax, and the $200 assessment stays."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["a vote against the levy"]

[[question]]
ask = "Who pays the tax?"
lines = ["voters"]

[[question]]
ask = "What can the money be spent on?"
lines = ["use"]

[[question]]
ask = "How many parcels are in Zone 1?"
unanswered = true

[[question]]
ask = "How big is $87,250 a year next to what the district spends today?"
unanswered = true
