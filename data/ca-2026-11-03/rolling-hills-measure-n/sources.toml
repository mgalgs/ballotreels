# Archived sources for Rolling Hills Community Services District Measure
# N, 2026-11-03 general election (sources/sources.md). Every id here may
# be cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1). The pages are cut from the El Dorado
# County Elections Department's Voter Information Pamphlet (PDF pages 80
# to 86, printed pages 24 to 30); "pages" below are the printed numbers.
#
# A community services district is a special district: the division is
# the county, and `voters` names the district's Zone No. 1, where the
# tax would be levied, as County Counsel's impartial analysis does
# (docs/SCRIPT-FORMAT.md). The pamphlet prints the district's ordinance
# with the ballot question, an argument in favor, the notice that no
# argument against was submitted, and the impartial analysis; no
# rebuttals and no tax rate statement (a special parcel tax).

[contest]
id = "ca-2026-11-03-rolling-hills-measure-n"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/county:el_dorado"
kind = "measure"
title = "Rolling Hills Community Services District Measure N: A $250 Yearly Parcel Tax in Zone No. 1 for District Services"
voters = "the Rolling Hills Community Services District, Zone No. 1 (this excludes the Sierramonte subdivision)"

[[source]]
id = "guide-page"
kind = "official-title-summary"
publisher = "El Dorado County Elections Department, El Dorado County Voter Information Pamphlet, Statewide General Election, November 3, 2026, pages 29 and 30: ballot question, notice that no argument against was submitted, and County Counsel’s Impartial Analysis of Measure N"
credit = "Impartial Analysis of Measure N, El Dorado County Voter Information Pamphlet"
url = "https://www.eldoradocounty.ca.gov/files/assets/county/v/2/documents/government/elections/20261103/complete-booklet.pdf"
file = "sources/vip-pp80-86-measure-n.pdf"
retrieved = "2026-10-28"

