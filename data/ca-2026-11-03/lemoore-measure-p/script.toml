# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; who pays the hotel tax today and
# at what rate; what would change (the new rate, for how long, where the
# money goes, the vote it needs); the ballot label's revenue estimate;
# both sides, neither of which filed an argument; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city", and the card and title carry
# the name. "City's" sounds like "cities", so the narration says "the
# city general fund".
#
# The card quotes the county's Ballot Label PDF (English text), which
# prints no yes and no sentences, and the impartial analysis gives none:
# so the card has no boxes, and the vote lines take their meaning from
# the label's own "from 8% to 12%", highlighted for both. The vote it
# needs (a majority) is the resolution's Section 4, which also makes the
# tax take effect only once the City Council approves it by a two-thirds
# vote; the script leaves that second step out for length. The
# ordinance's effective date is printed two ways (January 1, 2027 in its
# title and recitals, July 1, 2026 in its text), so the script gives
# none.
#
# The $512,000 a year is the ballot label's estimate; no archived source
# states the city's general fund budget, so it has no scale (STANDARD.md
# 6.5; left open, under [[question]]).
#
# The impartial analysis states that no arguments for or against were
# filed: each side says so plainly, and both sections are marked
# filed = false (STANDARD.md 2.5).

contest = "ca-2026-11-03-lemoore-measure-p"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "P"
title = "MEASURE P"
origin = "CITY OF LEMOORE"
summary = "Shall the measure amending the Lemoore Municipal Code to increase the maximum Transient Occupancy (Hotel) Tax paid by hotel and vacation rental guests from 8% to 12%, providing approximately $512,000 annually for general City services, including police, fire, parks and recreation, infrastructure maintenance, and other general governmental purposes, until ended by voters, be adopted?"

[[section]]
id = "what"
heading = "Measure P"

[[section.line]]
text = "Measure P asks the voters of this city whether to raise the hotel tax from 8 percent to 12 percent."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["from 8% to 12%"]

[[section]]
id = "today"
heading = "The hotel tax today"

[[section.line]]
id = "who-pays"
text = "Today, visitors pay an 8 percent tax on stays of 30 days or less at hotels, motels, inns and other short-term rentals."
sources = ["impartial-analysis", "text"]

[section.line.visual]
kind = "bars"
title = "Hotel tax rate"
source = "impartial-analysis"
unit = "%"
labels = ["Today", "With Measure P"]
values = [8, 12]

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "Measure P would raise the rate to 12 percent, until voters end the tax."
sources = ["impartial-analysis", "ballot-question"]

[[section.line]]
id = "general"
text = "As a general tax, the money would go into the city general fund, for any general fund purpose."
sources = ["impartial-analysis", "text"]

[section.line.visual]
kind = "illustration"
name = "city-council-chamber"

[[section.line]]
text = "Measure P needs a majority of the vote to pass."
sources = ["text"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "fiscal"
heading = "What the ballot label says"

[[section.line]]
id = "revenue"
text = "The ballot label estimates that the measure would provide about $512,000 a year for general city services."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["providing approximately $512,000 annually"]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"
filed = false

[[section.line]]
text = "No argument for Measure P was filed, the impartial analysis says."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "list"
source = "impartial-analysis"
items = ["No argument for was submitted"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure P was filed, the impartial analysis says."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "list"
source = "impartial-analysis"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote raises the hotel tax from 8 percent to 12 percent."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["from 8% to 12%"]

[[section.line]]
text = "A no vote keeps the hotel tax at 8 percent."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["from 8% to 12%"]

[[question]]
ask = "Who pays the tax?"
lines = ["who-pays"]

[[question]]
ask = "What can the money be spent on?"
lines = ["general"]

[[question]]
ask = "How big is about $512,000 a year next to the city budget?"
unanswered = true
