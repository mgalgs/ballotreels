# Archived sources for City of Lemoore Measure P, the transient occupancy
# (hotel) tax increase, 2026-11-03 general election
# (sources/county-sources.md). Every id here may be cited by script.toml.
# `kind` must be one the standard allows (docs/STANDARD.md, section 1).
#
# Kings County Elections posts the measure's ballot label, the City
# Attorney's impartial analysis and the City Council's resolution on its
# "Current Election Information" page; the voter guides by ballot type
# repeat the label and analysis verbatim. The City Attorney's impartial
# analysis is the measure's neutral explanation, the kind a state's
# attorney general's explanatory statement is. No fiscal analysis or tax
# rate statement applies (a general tax); the one revenue estimate is the
# ballot label's.
#
# The resolution (Resolution No. 2026-22, with the ordinance as its
# Attachment A) is a scan with no text layer; the pages cited were typed
# from the page images into sources/county-full-text-transcription.txt,
# which names the PDF and URL it copies. That source points at the
# transcription, and its url at the scan.
#
# The impartial analysis states: "No Arguments For or Against were filed
# for this measure."

