# Archived sources for Rocklin Unified School District Measure D,
# 2026-11-03 general election (sources/sources.md). Every id here may be
# cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# Placer County Elections publishes no combined guide document; it posts
# each measure's guide pages as one PDF, headed "MEASURE D" and "SCHOOL
# BOND ELECTION – ROCKLIN UNIFIED SCHOOL DISTRICT", paged MD1 to MD8. One
# PDF backs every source here. County Counsel's Impartial Analysis is the
# measure's neutral explanation; the district's Tax Rate Statement is its
# fiscal statement.

[contest]
id = "ca-2026-11-03-rocklin-unified-measure-d"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/school_district:rocklin_unified_school_district"
kind = "measure"
title = "Rocklin Unified Measure D: School Facility Bonds"

