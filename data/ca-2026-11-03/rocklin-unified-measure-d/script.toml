# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; how a school bond is repaid and what it needs
# to pass; what the money would pay for; the district's tax rate
# statement; one line per side; what a vote does.
#
# The card's title is the PDF's own head; its origin and yes and no lines
# are County Counsel's Impartial Analysis (the origin stops before the
# resolution's number, which pdftotext breaks at a hyphen). "Counsel" is
# heard as "Council" (standard/speakability.txt), so the narration says
# "the impartial analysis". The bond total and the debt service are
# repaid from a tax on property in the district, and no archived source
# states the district's budget, so they have no budget scale
# (STANDARD.md 6.5; left open). The fiscal line gives the statement's
# average rate beside its highest, as it prints both.
#
# Whether Measure D raises taxes is the dispute between the sides
# (supporters: "Without increasing existing tax rates"; opponents: those
# claims "deserve careful scrutiny"), so the neutral sections give only
# the tax statement's own figures (STANDARD.md 6.3); the card quotes the
# question's "no projected tax rate increase" as printed.
#
# Sides come from the argument in favor and the argument against, not
# the rebuttals.

contest = "ca-2026-11-03-rocklin-unified-measure-d"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "D"
title = "SCHOOL BOND ELECTION – ROCKLIN UNIFIED SCHOOL DISTRICT"
origin = "This measure was placed on the ballot by the governing board of the District"
summary = "To upgrade, renovate, modernize and expand classrooms, schools, and career technical education buildings; repair/ replace leaky roofs and outdated heating/ cooling systems; and make safety/ security improvements with no projected tax rate increase, shall Rocklin Unified School District’s measure authorizing $288,000,000 of bonds at legal rates be adopted, generating on average $15,800,000 annually while bonds are outstanding at approximate rates of $59 per $100,000 assessed value, with audits, citizens’ oversight, no money for salaries and funds staying local?"
yes = "A “YES” vote on this Measure would authorize the Rocklin Unified School District to borrow money through the sale of bonds in an amount not exceeding $288,000,000, to be repaid from revenues generated by an annual tax levied on taxable property within the District."
no = "A “NO” vote on this Measure is a vote against authorizing the District to issue the proposed general obligation bonds."

[[section]]
id = "what"
heading = "Measure D"

[[section.line]]
text = "Rocklin Unified School District Measure D asks the district's voters whether to approve $288 million in school bonds."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["authorizing $288,000,000 of bonds"]

[[section]]
id = "today"
heading = "How a school bond works"

[[section.line]]
text = "The district would sell the bonds and repay them from a yearly tax on property in the district."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "bond-certificates"

[[section.line]]
text = "Measure D needs 55 percent of the vote to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "projects"
text = "The money would upgrade classrooms and career training buildings, replace leaky roofs and old heating and cooling, and improve safety."
sources = ["ballot-question"]

[section.line.visual]
kind = "illustration"
name = "school-workshop"

[[section]]
id = "fiscal"
heading = "What the tax statement says"

[[section.line]]
id = "tax-rate"
text = "The district's tax rate statement estimates an average tax of $58.55 per $100,000 of assessed value, and at most $60, until 2062-2063."
sources = ["tax-statement", "impartial-analysis"]

[section.line.visual]
kind = "bars"
title = "Estimated tax per $100,000 of assessed value"
source = "tax-statement"
unit = ""
labels = ["Average", "Highest"]
values = [58.55, 60]

[[section.line]]
text = "The statement estimates the total to repay, with interest, at about $657 million."
sources = ["tax-statement"]

[section.line.visual]
kind = "illustration"
name = "debt-payments"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Measure D renovates schools without raising tax rates, and qualifies them for $82 million in state matching funds."
sources = ["arguments"]
basis = ["Without increasing existing tax rates, Measure D will upgrade and renovate schools in the District to better educate local children and provide a safe learning environment.", "Voting YES on D will also qualify our schools to receive $82 million in state matching funds, bringing taxpayer dollars back to Rocklin."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Renovates schools, no tax rate increase", "$82 million in state matching funds"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say falling enrollment leaves schools with room to spare, and claims that tax rates will not rise deserve careful scrutiny."
sources = ["arguments"]
basis = ["District data shows enrollment has declined by 578 students over the past 5 years to 11,598, compared to a capacity of more than 13,400.", "Therefore, claims that taxpayers will not see increased tax rates deserve careful scrutiny."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Enrollment down, schools have spare room", "No-tax-increase claims need scrutiny"]

