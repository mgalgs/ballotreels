# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the city's sales tax today; what
# would change (the new rate and total, ten years and then it ends, a
# general tax into the general fund, a simple majority); the ballot
# question's revenue estimate; one line per side; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". The card, title and chart title
# carry it.
#
# The card quotes the County of Monterey Elections Department's List of
# Local Measures, whose ballot question matches the signed Resolution No.
# 26-023's word for word. It prints no yes and no sentences, so the card
# has no boxes and the vote lines take their meaning from the City
# Attorney's impartial analysis.
#
# The uses named in the change section are the impartial analysis's; the
# supporters also cite streets, storm drains and parks, so their line
# keeps to their other points (delay makes repairs cost more; visitors
# help pay), and the neutral sections say nothing of either
# (STANDARD.md 6.3).
#
# The $1 million a year is the ballot question's figure. No cited source
# states the City's general fund budget (the July 7 staff report gives
# only deficits), so it has no scale (STANDARD.md 6.5; left open, under
# [[question]]).
#
# The City Clerk's page says "No argument against was submitted", so the
# no side says so, citing that page (filed = false, STANDARD.md 2.5).

contest = "ca-2026-11-03-pacific-grove-measure-r"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "measure-list"
number = "R"
title = "City of Pacific Grove"
origin = "Majority Voter Approval Required"
summary = "Preserving General Services Measure. Shall the measure, to provide funding for the City of Pacific Grove services, such as keeping streets, sidewalks, beaches, parks, playgrounds and public facilities safe, clean, and well-maintained; repairing/replacing aging infrastructure; fixing potholes and streets; and providing fire protection, paramedic, crime prevention, and 9-1-1 response by establishing a 0.375% transactions and use (\"sales\") tax, providing approximately $1,000,000 annually for 10 years, with independent audits, and all money locally controlled, be adopted?"

[[section]]
id = "what"
heading = "Measure R"

[[section.line]]
text = "Measure R asks the voters of this city whether to add a three-eighths of 1 percent sales tax for 10 years."
sources = ["measure-list", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "measure-list"
highlight = ["establishing a 0.375% transactions and use (\"sales\") tax"]

[[section]]
id = "today"
heading = "The tax today"

[[section.line]]
text = "Today the city charges its own sales tax of 1.5 percent, on top of state and other local sales taxes."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "sales-receipt"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "Measure R would raise that city rate to 1.875 percent."
sources = ["resolution", "impartial-analysis"]

[section.line.visual]
kind = "bars"
title = "City of Pacific Grove's own sales tax rate"
source = "resolution"
unit = "%"
labels = ["Today", "With Measure R"]
values = [1.5, 1.875]

[[section.line]]
id = "end"
text = "The increase would last 10 years, then end on its own."
sources = ["impartial-analysis", "resolution"]

[section.line.visual]
kind = "illustration"
name = "end-date"

[[section.line]]
id = "uses"
text = "As a general tax, the money would go to the general fund, for purposes including public safety, repairs, and upkeep of streets, beaches and parks."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "state-budget"

[[section.line]]
id = "threshold"
text = "Measure R needs a simple majority to pass."
sources = ["impartial-analysis", "measure-list"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "fiscal"
heading = "What the ballot question says"

[[section.line]]
id = "revenue"
text = "The ballot question says the tax would raise about $1 million a year."
sources = ["measure-list"]

[section.line.visual]
kind = "page"
source = "measure-list"
highlight = ["providing approximately $1,000,000 annually for 10 years"]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say putting off repairs only makes them cost more, and that visitors, not just residents, would help pay."
sources = ["argument-for"]
basis = ["But delaying necessary repairs does not make them disappear, it makes them more expensive.", "Visitors will help cover the cost.", "sales tax is paid by everyone making taxable purchases, not just residents."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Delayed repairs cost more", "Visitors help pay the cost"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "The city clerk's election page lists the argument in favor, and says no argument against Measure R was submitted."
sources = ["city-page"]

[section.line.visual]
kind = "list"
source = "city-page"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote approves the sales tax increase for 10 years."
sources = ["impartial-analysis", "measure-list"]

[section.line.visual]
kind = "page"
source = "measure-list"
highlight = ["establishing a 0.375% transactions and use (\"sales\") tax"]

[[section.line]]
text = "A no vote does not approve the sales tax increase."
sources = ["impartial-analysis", "measure-list"]

[section.line.visual]
kind = "page"
source = "measure-list"
highlight = ["establishing a 0.375% transactions and use (\"sales\") tax"]

[[question]]
ask = "When would the tax end?"
lines = ["end"]

[[question]]
ask = "What could the money be spent on?"
lines = ["uses"]

[[question]]
ask = "How big is $1 million a year next to the city budget?"
unanswered = true
