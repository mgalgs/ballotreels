# Archived sources for City of Pacific Grove Measure R, 2026-11-03
# general election (sources/county-sources.md, sources/sources.md). Every
# id here may be cited by script.toml. `kind` must be one the standard
# allows (docs/STANDARD.md, section 1).
#
# The County of Monterey Elections Department's List of Local Measures
# gives Measure R's letter, vote threshold and ballot question, and says
# the measure's documents are filed with the city clerk. The City Clerk
# posts them on the City's election page: the City Council's signed
# Resolution No. 26-023, adopted July 7, 2026, whose ballot question
# matches the county's word for word, with the full ordinance as its
# Exhibit A; the City Attorney's impartial analysis, the measure's neutral
# explanation (the kind a state's attorney general's explanatory
# statement is); and the argument in favor. The same page says "No
# argument against was submitted".
#
# The July 7 meeting packet (a draft of the resolution, the staff report
# and polling) and the minutes are archived but not cited: the signed
# resolution supersedes the draft, and no line needs the staff report.
# No tax rate statement or fiscal analysis applies (a sales tax); the one
# revenue estimate is the ballot question's.

[contest]
id = "ca-2026-11-03-pacific-grove-measure-r"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:pacific_grove"
kind = "measure"
title = "City of Pacific Grove Measure R: A New 0.375% Sales Tax for 10 Years"

[[source]]
id = "measure-list"
kind = "official-title-summary"
publisher = "County of Monterey Elections Department, List of Local Measures, November 3, 2026 General Election: Measure R - City of Pacific Grove"
credit = "List of Local Measures, Monterey County Elections"
url = "https://www.countyofmonterey.gov/government/departments-a-h/elections/list-of-local-measures"
file = "sources/county-measure-list.html"
retrieved = "2026-10-29"

