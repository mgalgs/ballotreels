# Archived sources for Meadows Union Elementary School District Measure
# Q, 2026-11-03 general election (sources/sources.md). Every id here may
# be cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# The Imperial County Registrar of Voters posts each measure's pages as
# one PDF (the ballot question, full text and project list, the
# District's tax rate statement and County Counsel's impartial
# analysis); no countywide Voter Information Guide is posted online.
# County Counsel's impartial analysis is the measure's neutral
# explanation, the kind a state's attorney general's explanatory
# statement is; the District's tax rate statement is its fiscal
# statement. The Registrar's Measure Q PDF prints no argument for or
# against and no rebuttal; with no full guide posted, it is not known
# whether any was filed.
#
# The ballot question says "$2,260,400 of bonds"; the tax rate statement
# and the impartial analysis say "up to $2,260,000".

[contest]
id = "ca-2026-11-03-meadows-elementary-measure-q"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/school_district:meadows_union_elementary_school_district"
kind = "measure"
title = "Meadows Union Elementary School District Measure Q: $2.26 Million School Facilities Bond"

