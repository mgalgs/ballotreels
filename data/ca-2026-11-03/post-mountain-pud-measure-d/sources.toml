# Archived sources for Post Mountain Public Utility District Measure D,
# 2026-11-03 general election (sources/sources.md). Every id here may be
# cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# Trinity County Elections prints the whole measure in its Consolidated
# County Voter Information Guide, cut here to pages 18 to 21 of the PDF
# (printed pages 17 to 20): the ballot question, with its yes and no
# meanings and "For None submitted." / "Against None submitted." (18),
# the impartial analysis (19) and the full text of the district's
# Ordinance No. 2026-01 (20 and 21). The impartial analysis is the
# measure's neutral explanation and gives the district's revenue
# estimate; a flat parcel tax has no tax rate statement, and none is
# printed. No arguments or rebuttals were submitted. The district's
# Resolution No. 2026-02, posted by the county as a scan, is archived
# beside it and not cited.
#
# A public utility district has no Census boundary, so the measure's
# division is the county and `voters` names the district
# (docs/SCRIPT-FORMAT.md).

[contest]
id = "ca-2026-11-03-post-mountain-pud-measure-d"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/county:trinity"
kind = "measure"
title = "Post Mountain Public Utility District Measure D: $100 Yearly Special Tax per Parcel for Road Maintenance"
voters = "the Post Mountain Public Utility District"

[[source]]
id = "ballot-question"
kind = "official-title-summary"
