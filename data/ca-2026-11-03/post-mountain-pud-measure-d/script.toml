# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the roads the district keeps up,
# where its review stands and the vote it needs; what would change (the
# tax, what it pays for, how long it lasts); the
# impartial analysis's revenue estimate; both sides, which submitted
# nothing; what a vote does.
#
# The card quotes the ballot question as Trinity County's Consolidated
# County Voter Information Guide prints it on page 18, headed "Ballot
# Question" under the page's running head, with the two-thirds sentence
# printed beneath it and the yes and no meanings the guide prints below
# that; the vote lines say those meanings, each highlighting its own
# box. No name of the district, county or commission is narrated: the
# card, title and `voters` line show them.
#
# The 27 miles of roads and the commission's review are facts of record
# in the ordinance's recitals (Resolution 2024-03, "a Resolution of
# Intent to Initiate Dissolution", and Resolution No. 2025-07,
# "extending the remediation period through December 31, 2026 ... to
# allow additional time for the District to establish a sustainable
# funding source for road maintenance"), said as the ordinance says them
# and with no claim about what a no vote would bring. The recitals' rate
# study ($180,500 a year for basic road maintenance) is left out: the
# same recitals dispute the study's road count, and the two cannot both
# be told in a minute.
#
# The guide prints no tax rate statement; the one revenue estimate is the
# district's, as the impartial analysis gives it ("Counsel" is heard as
# "Council", standard/speakability.txt, so it is named the impartial
# analysis). No archived source states the district's budget, so the
# estimate has no scale (STANDARD.md 6.5; left open). The $100 per
# parcel is exempt.
#
# Neither an argument for nor one against Measure D was submitted ("For
# None submitted." "Against None submitted."): both sides say so,
# filed = false (STANDARD.md 2.5), citing the guide page that prints it.

contest = "ca-2026-11-03-post-mountain-pud-measure-d"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "D"
title = "Ballot Question"
origin = "Local Ballot Measure D"
summary = "To maintain local road maintenance authority and provide dedicated funding for road maintenance and related services, shall a measure imposing a $100 annual special tax per parcel, raising approximately $100,000 annually until repealed by voters with all funds spent locally, be adopted pursuant to Post Mountain PUD Ordinance No. 2026-01? This measure is subject to approval by two-thirds of the votes voting on the measure to pass."
yes = "A “yes” vote is a vote in favor of authorizing the one hundred ($100.00) dollar annual special tax per parcel for road maintenance and related services within the District."
no = "A “no” vote is a vote against authorizing the special tax."

[[section]]
id = "what"
heading = "Measure D"

[[section.line]]
text = "Measure D asks the voters of this utility district whether to approve a $100 yearly tax per parcel for road maintenance."
