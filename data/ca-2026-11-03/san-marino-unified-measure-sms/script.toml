# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; the two parcel taxes today, who placed the
# measure and the vote it needs; what would change (the combined rate,
# its term and yearly adjustment, the exemptions, what the money may pay
# for); the full text's revenue estimate; one line per side; what a vote
# does.
#
# No place name is narrated (the narrator mispronounces them): the opening
# says "the voters of this school district". The card and title carry the
# names. The two existing taxes are called by their amounts, not by their
# letters, so they are not confused with this measure.
#
# "Renew" is the measure's own word: its full text and the impartial
# analysis say it combines and extends (renews) the two existing taxes.
# The ballot question's "without increasing the existing rates" and the
# argument's "Not a Tax Increase" are left to the card and the yes side;
# the narration gives the figures ($1,084 and $415 today, $1,499 combined)
# and the impartial analysis's account of what each vote does to the two
# taxes, so a viewer can see the effect on both outcomes.
#
# The card quotes the Los Angeles County Registrar-Recorder/County Clerk's
# list "Measures Appearing on the Ballot", which prints the ballot question
# with no yes and no sentences, so the card has no boxes; the vote lines
# give the impartial analysis's meanings and highlight the same phrase.
#
# The $6.1 million a year is the district's estimate in the full text. No
# archived official document states the district's budget to give it a
# scale (STANDARD.md 6.5; left open, under [[question]]). The argument's
# "10% of its annual budget" is that side's claim and stays in its line.
#
# The argument in favor is the Registrar's printed copy. The list says
# "Opponents: None submitted.", so the no side says plainly that no
# argument against was submitted, citing the list (filed = false).

contest = "ca-2026-11-03-san-marino-unified-measure-sms"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "SMS"
title = "SAN MARINO UNIFIED SCHOOL DISTRICT"
origin = "VOTE PASSAGE – 2/3 Votes (66.6% of Votes)"
summary = "San Marino Unified School District Quality Education Measure Without increasing the existing rates and to protect/maintain quality education programs, classroom instruction, prevent class size increases or teaching position reductions, attract/retain high-quality teachers/employees, support advanced programs in math, science, engineering, technology, shall San Marino Unified School District's measure to combine and renew their existing parcel taxes for 6 years at $1,499 (combined) with senior exemptions, raising approximately $6,100,000 annually, annual adjustments, requiring spending disclosure be adopted?"

[[section]]
id = "what"
heading = "Measure SMS"

[[section.line]]
text = "Measure SMS asks the voters of this school district whether to combine and renew two parcel taxes for six years."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["combine and renew their existing parcel taxes for 6 years at $1,499 (combined)"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "today-taxes"
text = "Today, the district levies two parcel taxes: $1,084 a year through June 2027, and $415 a year through June 2031."
sources = ["impartial-analysis", "text"]

[section.line.visual]
kind = "bars"
title = "Parcel taxes today, dollars per parcel a year"
source = "impartial-analysis"
unit = ""
labels = ["Through June 2027", "Through June 2031"]
values = [1084, 415]

[[section.line]]
id = "threshold"
text = "The district's governing board placed Measure SMS on the ballot, and it needs two-thirds of the vote to pass."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "rate"
text = "Measure SMS would levy one $1,499 tax on each parcel from July 2027 to June 2033, rising each year by up to 3 percent."
sources = ["impartial-analysis", "text"]

[section.line.visual]
kind = "illustration"
name = "city-parcels"

[[section.line]]
id = "exempt"
text = "Owners 65 or older, and some with disabilities, could apply for an exemption on the home they live in."
sources = ["impartial-analysis", "text"]

[section.line.visual]
kind = "illustration"
name = "senior-center"

[[section.line]]
id = "uses"
text = "The money could pay for teachers and counselors, current programs, class sizes, library media specialists and technology."
sources = ["impartial-analysis", "text"]

[section.line.visual]
kind = "illustration"
name = "school-classroom"

[[section]]
id = "fiscal"
heading = "What the measure's text estimates"

[[section.line]]
id = "revenue"
text = "The measure's full text estimates the tax would raise $6.1 million a year, varying from year to year."
sources = ["text", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["raising approximately $6,100,000 annually"]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say that without the measure the district would cut about 10 percent of its budget, and every dollar stays local."
sources = ["argument-for"]
basis = ["Without Measure SMS the District will have to cut approximately 10% of its annual budget", "Every dollar stays local and supports only San Marino students"]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Avoids cutting 10% of budget", "Every dollar stays local"]

[[section]]
id = "no"
