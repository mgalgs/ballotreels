# Archived sources for Bellflower Unified School District Measure SM,
# 2026-11-03 general election (sources/la-sources.md). Every id here may be
# cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# The Los Angeles County Registrar-Recorder/County Clerk's list "Measures
# Appearing on the Ballot" prints each measure's letter, vote threshold and
# ballot question, and says in words who filed the primary arguments
# ("Supporters: ... Opponents: None submitted."). The card quotes the
# ballot question from it (ballot-question), and the no side cites it as
# the Registrar's statement of filing (measure-list). The same excerpt
# backs both.
#
# The Registrar's Interactive Sample Ballot prints County Counsel's
# impartial analysis (the measure's neutral explanation), the full text,
# the district's tax rate statement and the argument in favor, saved as
# HTML, with "NO ARGUMENT AGAINST THIS MEASURE WAS SUBMITTED" under the
# argument. These supersede the district's copies (its resolution and
# Measure SM page, not cited).

[contest]
id = "ca-2026-11-03-bellflower-unified-measure-sm"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/school_district:bellflower_unified_school_district"
kind = "measure"
title = "Bellflower Unified School District Measure SM: $135 Million School Facilities Bond"

