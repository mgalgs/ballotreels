# Archived sources for Bellflower Unified School District Measure SM,
# 2026-11-03 general election (sources/la-sources.md). Every id here may be
# cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# The Los Angeles County Registrar-Recorder/County Clerk's list "Measures
# Appearing on the Ballot" prints each measure's letter, vote threshold and
# ballot question, and says in words who filed the primary arguments
# ("Supporters: ... Opponents: None submitted."). The card quotes the
# ballot question from it (ballot-question), and the sides cite it as the
# Registrar's statement of filing (measure-list). The same excerpt backs
# both.
#
# No impartial analysis and no argument text was staged. The measure is
# explained from the district's resolution: its Exhibit B (the full ballot
# text, a text page of the copy filed with the Board of Supervisors) and
# its Exhibit C (the tax rate statement), which only the district's own
# Measure SM page prints. The page's FAQ and overview are not cited. The
# scanned pages of resolution.pdf (cover and signature pages) are not
# cited, so none is transcribed.

[contest]
