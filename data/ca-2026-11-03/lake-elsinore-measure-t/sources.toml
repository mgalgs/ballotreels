# Archived sources for City of Lake Elsinore Measure T, 2026-11-03
# general election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1). The guide's pages are cut from the
# Riverside County Registrar of Voters' County Voter Information Guide
# (ballot type 98, a Lake Elsinore precinct); "page" is the guide's
# printed footer number.
#
# The guide prints the measure's full text (the ordinance), the City
# Attorney's Impartial Analysis and the argument in favor; it prints "NO
# ARGUMENT FILED AGAINST MEASURE “T”", no rebuttals, and no fiscal
# analysis.

[contest]
id = "ca-2026-11-03-lake-elsinore-measure-t"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:lake_elsinore"
kind = "measure"
title = "City of Lake Elsinore Measure T: Appointed City Treasurer"

