text = "The district owns the land and buildings of the hospital, and once ran the hospital itself."
sources = ["ballot-question"]

[section.line.visual]
kind = "illustration"
name = "valley-hospital"

[[section.line]]
id = "original"
text = "In 2011, district voters approved a 15-year lease of the hospital, with an option to buy, to the operator that runs it today."
sources = ["ballot-question", "impartial-analysis"]

[[section]]
id = "today"
heading = "Why it is on the ballot"

[[section.line]]
