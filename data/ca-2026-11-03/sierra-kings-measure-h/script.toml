# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; who owns the hospital and how
# it came to be leased (the 2011 lease); why it is on the ballot (state
# law on a district's assets); what would change (the term, the option
# to buy, the care the board's resolution describes, fair market value,
# the vote it needs); what it costs as the ballot question states it;
# one line per side; what a vote does.
#
# No place or organisation name is narrated (the narrator mispronounces
# them): the opening says "the voters of this health care district", and
# the hospital's operator is "its current operator". The card, title and
# voters line carry the names.
#
# No printed guide was found, so the card quotes the ballot question
# from Resolution No. 328, paragraph 2, as typed from the scan. It
# prints no yes/no lines, so the card has no YES/NO boxes; the vote
# lines both highlight the same phrase of the question.
#
# The lease itself is not posted. What the new lease would do comes from
# County Counsel's impartial analysis (the term and renewals, the
# possible sale, the independent appraisal) and from the resolution's recital of
# the Memorandum of Understanding (the full-time acute care hospital
# with walk-in emergency care, and the board's approval subject to a
# fair market value appraisal), attributed to the board's resolution.
# "Fair" is on the judgment-word list, so the narration says "market
# value".
# Neither states the rent or a price, so the narration says nothing of
# them (under [[question]], unanswered).
#
# "No new taxes, bonds, or assessments": the ballot question's own
# words, so the fiscal section quotes them as the ballot question's.
# The argument in favor says the same ("not a tax, bond, or
# assessment"); its line distils its other two points (access to the
# hospital's care, and that it could close without its operator) so
# the neutral section and the side do not repeat each other
# (STANDARD.md 6.3).

contest = "ca-2026-11-03-sierra-kings-measure-h"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "H"
title = "RESOLUTION NO. 328"
origin = "SIERRA KINGS HEALTH CARE DISTRICT"
summary = "Shall the measure to assure continued operation of Sierra Kings Health Care District's hospital facility at 372 West Cypress Avenue, Reedley, California, as an acute care hospital, in accordance with District Board Resolution No. 328 adopted July 27, 2026, by having the District enter with Reedley Community Hospital, the existing operator, a twenty year lease with options to extend the lease and purchase the property, with no new taxes, bonds, or assessments on District residents, be adopted?"

[[section]]
id = "what"
heading = "Measure H"

[[section.line]]
text = "Measure H asks the voters of this health care district whether to lease the district's hospital to its current operator for another 20 years."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["a twenty year lease"]

[[section]]
id = "background"
heading = "The hospital"

[[section.line]]
