# Recipe E, 60 seconds, distilled: one claim per line. The chain: what
# it is about; who builds homes and where the state comes in; how the
# state pays its share today (bonds); what the measure would borrow and
# for what; the analyst's cost and what the money would buy; one point
# per side; what a vote does.
#
# No argument against Proposition 1 was submitted to the voter guide.
# The no side says so plainly, in the same number of words as the yes
# side. The yes list shows the supporters' points as submitted; the no
# section is marked filed = false and its list says nothing was filed.

contest = "ca-2026-11-03-prop-1"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "quick-reference"
number = "1"
title = "AUTHORIZES BONDS FOR HOUSING AFFORDABILITY PROGRAMS. LEGISLATIVE STATUTE."
origin = "Put on the Ballot by the Legislature"
summary = "Authorizes $11.25 billion in state general obligation bonds for housing affordability programs, including multifamily rental housing, mortgages for veterans, supportive housing, preservation of existing affordable housing, and downpayment assistance. Fiscal Impact: Increased state cost of $500 million to $600 million annually for about 25 years to repay the housing bond."
yes = "A YES vote on this measure means: The state could borrow $11.25 billion to support veterans and affordable housing."
no = "A NO vote on this measure means: The state could not borrow $11.25 billion to support veterans and affordable housing."

[[section]]
id = "what"
heading = "Proposition 1"

[[section.line]]
text = "Proposition 1 is about borrowing money for housing."
sources = ["quick-reference"]

[section.line.visual]
kind = "page"
source = "quick-reference"
highlight = ["bonds for housing affordability programs"]

[[section]]
id = "background"
heading = "Who pays for new homes"

[[section.line]]
text = "Most new homes in California are built with private money alone."
sources = ["lao-analysis"]

[section.line.visual]
kind = "illustration"
name = "home-building"

[[section.line]]
text = "The state helps pay for some homes, usually for people with low incomes."
sources = ["lao-analysis"]

[section.line.visual]
kind = "illustration"
name = "state-budget"

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Today, the state often pays its share with bonds: borrowing now and repaying with interest over time."
sources = ["lao-analysis"]

[section.line.visual]
kind = "illustration"
name = "debt-payments"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "Proposition 1 would let the state borrow $11.25 billion for housing programs."
sources = ["lao-analysis"]

[section.line.visual]
kind = "bars"
title = "Largest uses of Proposition 1's bond, dollars"
source = "lao-analysis"
unit = "billion"
labels = ["Rental housing", "Veterans' home loans", "Homeownership", "Infrastructure"]
values = [7.2, 1.25, 1.1, 0.5]

[[section]]
id = "fiscal"
heading = "What the state's analyst says"

[[section.line]]
text = "The Legislative Analyst's Office says repaying the bond would cost $500 million to $600 million a year for about 25 years, about one-quarter of 1 percent of the state's General Fund."
sources = ["lao-analysis"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section.line]]
text = "It says the money would help fund up to 40,000 rental homes and help up to 40,000 households own homes."
sources = ["lao-analysis"]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Proposition 1 builds affordable homes for veterans, seniors and working families."
sources = ["arguments"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Affordable homes for veterans, seniors and working families", "Builds homes without raising taxes"]

