# Archived sources for Town of San Anselmo Measure V, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The county's Measure V page (sources/county-page.txt, read in a
# browser on 2026-10-30, since marincounty.gov refuses scripted fetches)
# prints the same ballot question, the vote required, the Town
# Attorney's impartial analysis, and its statements that no argument in
# favor and no argument against was filed. The others are the Town's files
# from its Upcoming Elections page: the Town Council's signed Resolution
# No. 2026-4628 (adopted June 9, 2026), whose Section 3 is the ballot
# question and whose Exhibit "A" is the full text, an ordinance adding
# Chapter 9 "Paramedic Services Tax" to Title 8 of the Town's code; and
# the Town Attorney's Impartial Analysis of Measure V, the measure's
# neutral explanation. The Town's page labels arguments in favor, against
# and rebuttals but links no file. A parcel tax has no tax rate
# statement; the one revenue estimate is the ballot question's, which
# the impartial analysis repeats.
#
# The resolution is a Docusign scan with no text layer, and the impartial
# analysis is a scan whose text layer misreads words. The pages cited
# were typed from the page images into the two transcriptions, which
# name the PDF and URL each copies; the sources point at the
# transcriptions, and their url at the scans.
#
# The letter V and the two-thirds vote are confirmed by the Registrar of
# Voters' Board of Supervisors staff report 26-4515, listing every
# measure on the county's November 3, 2026 ballot.

