# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the regional paramedic authority
# and the tax today; what would change (the rate, the yearly increase,
# the use and the end date); the vote it needs; the revenue estimate;
# both sides, for neither of which an argument was filed; what a vote
# does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this town", and the Ross Valley Paramedic
# Authority is "the regional paramedic authority". The card and title
# carry the names. No person is named.
#
# The neutral lines rest on the Town Attorney's Impartial Analysis (the
# neutral explanation) and on the ordinance, Exhibit "A" to Resolution
# No. 2026-4628. The resolution's recitals that the community has
# received "responsive, high-quality" care, and the ballot question's
# opening purpose clause, are the Council's words of need and benefit
# and are not narrated. The card quotes the ballot question from Section
# 3 of the resolution, named by its number; the resolution prints only
# "Yes" and "No" cells beside the question, so the card has no yes/no
# boxes, and the vote lines take their meanings from the impartial
# analysis and highlight the question's own phrase.
#
# The ballot question's "approximately $688,000 annually" is paramedic
# tax revenue. No archived source states the Town's or the paramedic
# authority's budget, so the figure has no scale (STANDARD.md 6.5; left
# open). The tax rates are amounts per housing unit or per 1,000 square
# feet (exempt).
#
# The county's page says no argument in favor and no argument against
# Measure V was filed, so each side says so, attributed to the county
# (filed = false, STANDARD.md 2.5). The county prints the same ballot
# question and impartial analysis as the Town's files.

contest = "ca-2026-11-03-san-anselmo-measure-v"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "V"
title = "RESOLUTION NO. 2026-4628"
origin = "TOWN OF SAN ANSELMO"
summary = "To maintain rapid 9-1-1 emergency response times and preserve the number of on-duty paramedics ready to respond to accidents/medical emergencies, shall the Ross Valley Paramedic Authority measure be adopted continuing for four years the paramedic services special tax of up to $107.50/residential living unit or 1,000 square feet of developed nonresidential property, adjusted up to $4/ year, generating approximately $688,000 annually, with annual audits, public spending disclosure and all funds for local paramedic services?"

[[section]]
id = "what"
heading = "Measure V"

[[section.line]]
text = "Measure V asks the voters of this town whether to continue a parcel tax for paramedic services for four more years."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
