# Archived sources for City of Clearlake Measure D, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The Lake County Registrar of Voters prints the measure in its Voter's
# Pamphlet, "Measures, Analyses and Arguments", pamphlet pages 017M521
# to 017M522, posted as one PDF: the ballot question and the City
# Attorney's impartial analysis (017M521), the measure's neutral
# explanation; the argument in favor and "NO ARGUMENT AGAINST MEASURE D
# WAS SUBMITTED." (017M522). The registrar also posts the ballot
# question alone. The full text (Ordinance No. 287-2026) is not printed
# and was not retrieved; the measure has no tax and no fiscal statement.
# No rebuttals are printed.

