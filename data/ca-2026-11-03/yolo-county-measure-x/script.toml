# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; who votes on a tax that applies
# only outside the cities; what would change (the rate, with the
# impartial analysis's own $100 example; where the money goes and for
# how long); the ballot question's revenue estimate; one line per side;
# what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this county". "Counsel" is heard as
# "Council" (standard/speakability.txt), so the narration does not name
# the impartial analysis's author.
#
# Who votes: County Counsel's analysis says the electors are those
# "residing within Yolo County, including its incorporated and
# unincorporated areas", though the tax applies only in the
# unincorporated area; a background line says both.
#
# The one revenue figure is the ballot question's "approximately an
# additional $250,000 annually". No archived source states the county's
# general fund budget, so it has no scale (STANDARD.md 6.5; left open,
# under [[question]]). The supporters' points (visitors pay, nearby
# rates are already 12 percent) stay in their line (STANDARD.md 6.3).
# No argument against was filed, so the no side sets `filed = false`.

contest = "ca-2026-11-03-yolo-county-measure-x"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "X"
title = "YOLO COUNTY UNINCORPORATED AREA HOTEL TAX"
origin = "Measure X was placed on the ballot by a unanimous vote of the Yolo County Board of Supervisors."
summary = "To fund local programs and services – such as maintaining health and human service program levels, enhancing public safety, and supporting emergency preparedness projects – shall the ordinance increasing Yolo County’s Transient Occupancy Tax, which is paid only by hotel/lodging/short-term rental guests in unincorporated areas (excluding cities), from 8% to 12% of the total rent charged, providing approximately an additional $250,000 annually until ended by voters, be adopted?"
yes = "A “yes” vote on Measure X approves Ordinance No. 1585 and the proposed increase in the TOT from 8% to 12%."
no = "A “no” vote on Measure X is a vote against authorizing the proposed changes in Ordinance No. 1585 and the TOT rate would remain at 8%."

[[section]]
id = "what"
heading = "Measure X"

[[section.line]]
text = "Measure X asks the voters of this county whether to raise the hotel tax outside the cities from 8 to 12 percent."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["from 8% to 12% of the total rent charged"]

[[section]]
id = "background"
heading = "Who votes"

[[section.line]]
id = "who-votes"
text = "Voters in the cities vote too, though the tax would apply only outside them."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "county-line-map"

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "who-pays"
text = "Lodging guests pay the tax, on stays of up to 30 days."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "hotel-front-desk"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "From January 2027, a $100 night would cost a guest $112 with the tax, not $108."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "bars"
title = "Hotel tax outside the cities, share of the rent"
source = "impartial-analysis"
unit = "%"
labels = ["Today", "Measure X"]
values = [8, 12]

[[section.line]]
text = "The money would go to the general fund of the county, for any lawful use, until voters repeal the tax."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "state-budget"

[[section]]
id = "fiscal"
heading = "What the ballot question says"

[[section.line]]
id = "revenue"
text = "The ballot question estimates about $250,000 a year in added revenue."
sources = ["ballot-question"]

[section.line.visual]
kind = "illustration"
name = "travel-receipts"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say visitors pay the tax, not residents, and that most local governments nearby already charge 12 percent."
sources = ["arguments"]
basis = ["The TOT is tax paid for by tourists and visitors who stay in our hotels, motels or short-term rentals", "residents do not pay this tax unless they stay in one of these local lodging options.", "most local jurisdictions are already at 12%."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Paid by visitors, not residents", "Most nearby rates already 12 percent"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure X was filed by the July deadline, so only an argument in favor appears."
sources = ["arguments"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote approves raising the tax from 8 to 12 percent."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["approves Ordinance No. 1585 and the proposed increase in the TOT from 8% to 12%"]

[[section.line]]
text = "A no vote keeps the rate at 8 percent."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["the TOT rate would remain at 8%"]

[[question]]
ask = "Do voters in the cities get a say, and would they pay the tax?"
lines = ["who-votes"]

[[question]]
ask = "Who pays the tax?"
lines = ["who-pays"]

[[question]]
ask = "How big is $250,000 a year next to the county's budget?"
unanswered = true
