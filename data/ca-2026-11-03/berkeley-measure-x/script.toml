# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and of whom; who put it on the ballot and what it needs to pass;
# what would change (exemptions fixed at the start of a tenancy, the 10
# percent cap, the fee waiver for nonprofits); the guide's lack of a
# cost estimate; one line per side; what a vote does.
#
# The guide prints no fiscal analysis (not a tax measure). The analysis
# lists nine changes; the three the ballot question leads with are told.
# That the Council's vote was unanimous, and that the cap matches state
# law, are the supporters' argument, so the neutral lines leave them out
# (STANDARD.md 6.3).
#
# The guide prints no yes/no lines for this measure, so, as for Utah, the
# card has no YES/NO boxes, and the two vote lines highlight the one
# phrase of the question they turn on.

contest = "ca-2026-11-03-berkeley-measure-x"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide-page"
number = "X"
title = "CITY OF BERKELEY MEASURE X"
origin = "This measure was placed on the ballot by the City Council of the City of Berkeley."
summary = "Shall the measure to amend the Rent Stabilization and Eviction for Just Cause Ordinance by making most rent control and registration exemptions inapplicable to units that were not exempt when the current tenancy began; allowing modification or waiver of fees for subsidized units owned or leased by nonprofits; changing the annual registration deadline; limiting annual rent increases to ten percent; and allowing tenant associations in smaller properties, be adopted?"

