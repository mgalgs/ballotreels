# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; how it reached the ballot; the
# sales tax rate today, as the City gives it; what would change (the
# added rate, what is not taxed, a general tax, how long it lasts, the
# vote it needs); the revenue estimate as the ballot question gives it;
# both sides, neither of which has an archived argument; what a vote
# does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". The card and title carry the
# names.
#
# The card quotes the Siskiyou County Clerk's Notice of Election, which
# prints the question with blank YES and NO lines but no yes/no
# statements: so the card has no YES/NO boxes. Resolution No. 30-2026
# orders the same question word for word.
#
# Every neutral line rests on the City Attorney's impartial analysis,
# the notice, and the resolution and ordinance (the rate, 3.30.050 and
# 3.30.070; a general tax, by the ordinance's title; no end date, as
# Section 3 of the resolution says and the ordinance bears out; a
# majority, Section 2). The City's Measure K page is cited, attributed
# to the City, for the date the Council acted and the combined rate
# today; its account of the City's finances is not used, nor is the
# agenda memorandum.
#
# The $1,700,000 a year is the ballot question's estimate. No archived
# source states the City's general fund budget to give it a scale
# (STANDARD.md 6.5; left open, under [[question]]).
#
# No argument for or against Measure K was archived, and no document
# says whether any was filed (the resolution authorizes an argument in
# favor; nothing records one submitted). So the sides do not say none
# was filed: each says none is among the documents gathered (filed =
# false, STANDARD.md 2.5), as for Walnut Creek Measure U.

contest = "ca-2026-11-03-weed-measure-k"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "K"
title = "CITY OF WEED"
origin = "NOTICE OF ELECTION"
summary = "Shall a measure maintaining 911 emergency services, fire protection and wildfire prevention, emergency medical response; 24-hour police patrol/protection, building safety and inspection; streets, roads, sidewalks and City infrastructure; snow removal, and other general City services, long-term financial stability, by establishing a 1.5% sales tax providing approximately $1,700,000 annually until repealed by voters, subject to regular audits, be adopted?"

