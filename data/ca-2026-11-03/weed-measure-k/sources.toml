# Archived sources for City of Weed Measure K, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# Siskiyou County posts no voter guide, only a Notice of Election per
# measure. The ballot question is quoted from the County Clerk's Notice
# of Election for Measure K, the authority for the letter and the
# question; Section 2 (the second so numbered) of the City's Resolution
# No. 30-2026 orders the same question word for word. No argument or
# rebuttal was reached, and no document says whether any was filed (the
# notice and the resolution only invite or authorize them).
#
# The City Attorney's impartial analysis is the measure's neutral
# explanation, the kind a state's attorney general's explanatory
# statement is; it has a text layer and is cited as archived. The
# resolution and Ordinance No. 493-2026 (the measure's full text) are
# the City's unsigned copies of the versions the Council approved,
# scans with no text layer: the passages cited were typed from the page
# images into sources/resolution-30-2026-transcription.txt and
# sources/ordinance-493-2026-transcription.txt, which name the PDFs and
# URLs they copy; those sources point at the transcriptions, and their
# urls at the scans. The City's Measure K page is cited for two plain
# facts only, attributed to the City: the date the Council placed the
# measure (July 9, 2026) and the combined sales tax rate today. The
# July 9 agenda memorandum (the City staff's material) is not cited.

