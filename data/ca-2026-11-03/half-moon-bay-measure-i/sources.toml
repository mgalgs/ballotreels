# Archived sources for City of Half Moon Bay Measure I, 2026-11-03
# general election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# San Mateo County publishes each measure's documents separately, as
# PDFs filed by the city with the Assessor-County Clerk-Recorder &
# Elections office, not as one pamphlet. The ballot question is printed
# in the City Council's Resolution No. 2026-39, Section 3(a); the City
# Attorney's impartial analysis is the measure's neutral explanation, the
# kind a state's attorney general's explanatory statement is. Not a tax
# measure: no fiscal analysis or tax rate statement was filed.
#
# The resolution and the argument in favor are scans with no text layer.
# The verbatim checks read each one's transcription
# (sources/*.transcription.txt, made from the page images), which a
# source whose file is not a PDF gives them; the PDF beside it is the
# archived copy, and the url is the PDF's.

[contest]
id = "ca-2026-11-03-half-moon-bay-measure-i"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:half_moon_bay"
kind = "measure"
title = "City of Half Moon Bay Measure I: Redefining the Measure D Downtown Area as the Town Center"

