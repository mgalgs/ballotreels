# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; what Measure D does and why its
# downtown area matters; how the downtown area is drawn today; what
# would change, and how many homes' parcels it moves; that the Coastal
# Commission must certify it; no cost estimate; one line per side; what
# a vote does.
#
# The card quotes the ballot question, printed only in the City
# Council's resolution, which prints no yes/no lines (the impartial
# analysis says only that a yes vote is in favor and a no vote against).
# So, as for Los Angeles County Measure E, the card has no YES/NO boxes,
# the vote lines give the analysis's meanings, and both highlight the
# same phrase of the question.
#
# The resolution's recital that the measure "will not change the
# location, density or intensity of development permitted" is the
# Council's own finding, which the impartial analysis does not repeat,
# so the neutral sections leave it out. "city's" is heard as "cities"
# (standard/speakability.txt), so the narration says "of the city".
#
# No argument against is among the measure documents San Mateo County
# publishes: the no side is filed = false, as for Proposition 37.

contest = "ca-2026-11-03-half-moon-bay-measure-i"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "I"
title = "Measure to Amend the Downtown Area for Residential Growth Management Policies"
origin = "The City Council hereby approves the submission of the proposed Ordinance, as set forth in the form attached hereto as Exhibit A, to the voters of the City of Half Moon Bay at the November 3, 2026, general municipal election."
summary = "Shall the Measure, amending the City of Half Moon Bay Local Coastal Land Use Plan, Title 17 (Subdivisions) and Title 18 (Zoning) of the Half Moon Bay Municipal Code, and other conforming edits so that the Measure D “Downtown Area” is redefined as the area designated as the “Town Center” (Figure 2-2) of the Local Coastal Land Use Plan, be adopted?"

[[section]]
id = "what"
heading = "Measure I"

[[section.line]]
text = "City of Half Moon Bay Measure I asks the voters of Half Moon Bay whether to redraw the Measure D downtown area."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["the Measure D “Downtown Area” is redefined"]

[[section]]
id = "background"
heading = "Measure D"

[[section.line]]
text = "Measure D, adopted by voters in 1999, limits new homes each year to 1 percent growth in population."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "home-building"

[[section.line]]
text = "Measure D steers most new homes downtown, where the City Council may allow 0.5 percent more."
sources = ["impartial-analysis"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Today, the downtown area is the redevelopment survey area adopted in 1998."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "downtown-boundary-map"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "Measure I would make the downtown area the Town Center on the land use plan map."
sources = ["impartial-analysis", "ballot-question"]

[[section.line]]
id = "parcels"
text = "The impartial analysis says 286 residential parcels would join the downtown area, and 40 would leave it."
