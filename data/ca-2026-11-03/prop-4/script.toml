# Recipe E, 60 seconds, distilled: one claim per line. The chain: what
# it is about; the ban today and its exception; what lifting it does and
# what it leaves open; the analyst's cost to the state and to any
# government that creates a program; one point per side; what a vote does.

contest = "ca-2026-11-03-prop-4"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "quick-reference"
number = "4"
title = "REPEALS PROHIBITION AGAINST PUBLIC FUNDING OF ELECTION CAMPAIGNS. LEGISLATIVE STATUTE."
origin = "Put on the Ballot by the Legislature"
summary = "Repeals prohibition on state and local governments offering public funding of candidate election campaigns. Public funding programs may not use funds earmarked for education, transportation, or public safety. Fiscal Impact: Ongoing costs to the state of a few hundred thousand dollars each year for the Fair Political Practices Commission to answer questions from state and local governments about public campaign finance programs."
yes = "A YES vote on this measure means: State and local governments could create public campaign financing programs for public office candidates, subject to limits on which public funds could be used, how the public funds could be used, and who could receive them."
no = "A NO vote on this measure means: State and most local governments would remain unable to create public campaign finance programs for public office candidates."

