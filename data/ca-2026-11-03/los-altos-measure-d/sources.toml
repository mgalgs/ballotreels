# Archived sources for City of Los Altos Measure D, 2026-11-03 general
# election (sources/rov-sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The Santa Clara County Registrar of Voters' List of Local Measures is
# the authority for the measure's letter, ballot question and vote
# threshold. The impartial analysis and the arguments are the Registrar's
# posted copies, scans with no text layer: their verbatim checks read
# their transcriptions (sources/rov-*-transcription.txt, made from the
# page images); the urls are the PDFs'. No full text of the initiative
# is archived; the ballot question and the City Attorney's impartial
# analysis, the measure's neutral explanation, carry what it would do.
# Both rebuttals are archived and transcribed; the script quotes neither,
# so they are not listed here.

[contest]
id = "ca-2026-11-03-los-altos-measure-d"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:los_altos"
kind = "measure"
title = "City of Los Altos Measure D: Voter Approval to Sell, Lease or Alter the Downtown Parking Plazas"

