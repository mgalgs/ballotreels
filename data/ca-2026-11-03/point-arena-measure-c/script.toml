# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; who pays the hotel tax today and
# at what rate; what would change (the added rate, from when, for how
# long, where the money goes, the vote it needs); the revenue estimate as
# the impartial analysis gives it; one line per side; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city", and the card and title carry
# the name.
#
# The guide pages print no ballot question, so the card quotes it from
# the City Clerk's public notice of the measure. The notice prints no yes
# and no sentences, so the card has no boxes; the vote lines give the
# City Attorney's impartial analysis's own meanings, and both highlight
# the same phrase of the question.
#
# The question says the tax would continue "until repealed by the City
# Council or the city voters", the analysis "until repealed by the
# voters"; the script says only "until it is repealed", which both
# state. The services the analysis lists, and the roads, parks and pier,
# are the supporters' points, so the neutral sections say only that the
# money goes into the general fund (STANDARD.md 6.3); the supporters'
# figure for this year's hotel tax ($200,000) is theirs too, and no
# official source states it. The $35,833 is the analysis's estimate; no
# archived source states the City's general fund budget to give it a
# scale (STANDARD.md 6.5; left open, under [[question]]).
#
# The guide pages print "NO ARGUMENT AGAINST MEASURE C WAS SUBMITTED."
# The no side says so plainly; its section is marked filed = false.

contest = "ca-2026-11-03-point-arena-measure-c"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "C"
title = "Public Notice: Transient Occupancy Tax Measure"
origin = "the Point Arena City Council voted to place a measure on the November 3, 2026 General Election ballot"
summary = "Shall Ordinance No. 247 amending Chapter 3.30.030 of the Point Arena Municipal Code to increase the City of Point Arena’s existing Transient Occupancy Tax (a bed tax paid when overnight visitors rent a room) from twelve percent (12%) to fourteen percent (14%) to fund public services and maintain public areas, effective April 1, 2027, which proposed rate increase and amendment is anticipated to raise an additional $35,833 per year in revenue and which will continue until repealed by the City Council or the city voters, be adopted?"

[[section]]
id = "what"
heading = "Measure C"

[[section.line]]
text = "Measure C asks the voters of this city whether to raise the hotel tax from 12 percent to 14 percent."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["from twelve percent (12%) to fourteen percent (14%)"]

[[section]]
id = "today"
heading = "The hotel tax today"

[[section.line]]
id = "who-pays"
text = "Today, guests who stay 30 days or less at a hotel, inn, motel or other lodging pay a 12 percent tax on the room rent."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "hotel-front-desk"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "added"
text = "Measure C would add 2 percent more, starting April 1, 2027, until it is repealed."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "bars"
title = "Hotel tax, percent of room rent"
source = "impartial-analysis"
unit = "%"
labels = ["Today", "With Measure C"]
values = [12, 14]

[[section.line]]
id = "general"
text = "The added money would go into the city general fund."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "state-budget"

[[section.line]]
text = "Measure C needs a simple majority to pass."
sources = ["text"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "fiscal"
heading = "What the impartial analysis says"

[[section.line]]
id = "revenue"
text = "The city attorney's impartial analysis says the added 2 percent would bring in about $35,833 a year."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say visitors, not residents, pay the tax, and every dollar stays local for services visitors use."
sources = ["arguments"]
basis = ["The TOT is paid by visitors staying in local hotels, motels, inns, and vacation rentals—not by Point Arena residents unless they choose to stay in one of these accommodations.", "Visitors enjoy and rely on our roads, sidewalks, parks, parking areas, public restrooms, and the City pier.", "Every dollar generated by Measure C will remain in Point Arena and be used to support local services and community needs."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Paid by visitors, not residents", "Every dollar stays local"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure C was submitted for the printed voter guide pages on this city measure."
sources = ["arguments"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote approves the proposed increase to the hotel tax."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["from twelve percent (12%) to fourteen percent (14%)"]

[[section.line]]
text = "A no vote rejects the proposed increase to the hotel tax."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["from twelve percent (12%) to fourteen percent (14%)"]

[[question]]
ask = "Who pays the hotel tax?"
lines = ["who-pays"]

[[question]]
ask = "How long would the increase last?"
lines = ["added"]

[[question]]
ask = "What can the money be spent on?"
lines = ["general"]

[[question]]
ask = "How big is $35,833 a year next to the city budget?"
unanswered = true
