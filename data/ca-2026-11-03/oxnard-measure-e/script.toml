# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the tax today and when it ends;
# how it reached the ballot; what would change (no end date, the same
# rate and rules) and the vote it needs; the ballot question's revenue
# figure; both sides, neither of which has an archived argument; what a
# vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". The card and title carry the
# name.
#
# No impartial analysis was archived: what Measure E does comes from the
# ordinance (Exhibit A, the full text) and the resolution placing it,
# only from what they enact or record as fact; both are scans, quoted
# from their transcription. Their recitals on what would be lost without
# the measure are the City's case and are not narrated. The card and the
# question's figures are the county's printed question (county-ballot),
# not the resolution's longer draft with its list of services (see
# sources.toml). The end date is the ordinance's "March 31, 2029"
# (the staff report gives it three ways), said as "March 2029". The
# staff report is cited only for the 2008 vote. The Council's adoption
# of the resolution is from the June 16 minutes, without its tally; the
# minutes' failed motion to reword the question is not narrated. The
# County's August 4 consent item 12 shows the measure consolidated with
# the November 3 election.
#
# The $20 million a year is the ballot question's figure; no archived
# source states the City's general fund budget for a matching year to
# give it a scale (STANDARD.md 6.5; left open, under [[question]]).
#
# No argument for or against Measure E was archived. The county's page
# lists supporters and opponents, so each side says so and that their
# argument is not among the documents gathered (filed = false: no text,
# STANDARD.md 2.5). Their names are not narrated.

