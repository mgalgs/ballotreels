# Archived sources for City of Oxnard Measure E, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The County of Ventura's measures page ("county-ballot", saved as text
# from a browser, since it gives scripted fetches an empty body) gives
# the letter E and the question as it is printed on the ballot. That
# question differs from the one in the June 16 resolution (Section 4,
# "substantially as follows"): it is titled "City of Oxnard Extension of
# Measure O Sales Tax" and lists no services. The card quotes the
# county's; no archived record says when or why the wording changed. The
# page also lists the measure's supporters and opponents, but no
# argument's text was reached.
#
# These are the City's files from its CivicClerk portal, for the City
# Council meeting of June 16, 2026, item N.6: packet pages 2458 to 2478
# (the staff report, with a text layer; Attachment 1, the resolution
# placing the measure; and its Exhibit A, the ordinance), and the
# meeting's minutes. The resolution, the ordinance and the minutes are
# scans with no text layer: the pages cited were typed from the page
# images into sources/oxnard-cc-2026-06-16-item-N6-resolution-and-
# ordinance-transcription.txt and sources/oxnard-cc-2026-06-16-minutes-
# transcription.txt, which name the scans and their URLs; the sources
# for them point at the transcriptions, and their urls at the scans.
#
# The resolution archived is the agenda copy, "Resolution (revised)",
# its number left blank and unsigned. The minutes record that the
# Council adopted it as Resolution No. 16,071 on the motion to approve
# the recommended action, after a motion to reword the ballot question
# failed for want of a second. Section 4 gives the question
# "substantially as follows" (the ballot prints the county's wording,
# above), and Section 5 sets the majority vote. No impartial analysis, argument or rebuttal was
# reached: Section 11 asks the City Attorney for an analysis and lets
# any person file an argument, and no filed argument is archived.
#
# The staff report is City staff material. It is cited only for plain
# facts it states (Measure O's approval in 2008 and its end in March
# 2029), attributed to it; its reasons for the measure, its account of
# the City's finances, the election's cost and the opinion survey it
# reports are not used.
#
# The County of Ventura's Board of Supervisors approved, as consent item
# 12 on August 4, 2026, the requests of the agencies in Exhibit 1 to
# consolidate their elections with the November 3, 2026 General
# Election; Exhibit 1 lists the City of Oxnard among the six local
# measures. They are cited for the fact that the measure is on Ventura
# County's November 3 ballot.

