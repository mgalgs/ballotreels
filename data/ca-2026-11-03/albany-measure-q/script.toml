# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks; the fire and emergency medical parcel tax today; what would
# change (low-income relief, a lower yearly cap, new rates if a very
# large parcel becomes exempt, leaseholds taxed) and what it needs to
# pass; the impartial analysis's revenue estimate; one line per side;
# what a vote does.
#
# The guide prints no fiscal analysis or tax rate statement; the one
# revenue estimate is the City Attorney's, in the ballot question and the
# Impartial Analysis. No archived source states Albany's budget, so the
# $2,500,000 has no scale (STANDARD.md 6.5; left open). The page prints
# no subject heading over the ballot question, so the card's title is
# the page's own head, the city's name.
#
# The guide prints an argument in favor and the notice "NO ARGUMENT
# AGAINST MEASURE Q WAS SUBMITTED": the no side is filed = false. Golden
# Gate Fields, and the share of the tax it pays, are the argument's own
# facts, so they stay in its section (STANDARD.md 6.3); the neutral
# lines give only the analysis's "any parcel 500,000 square feet or
# larger".

contest = "ca-2026-11-03-albany-measure-q"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide-page"
number = "Q"
title = "CITY OF ALBANY"
origin = "On July 20, 2026, the City Council voted to place Measure “Q” on the November 3, 2026 General Municipal Election ballot."
summary = "Shall the measure updating the Emergency Medical Services, Advanced Life Support, and Fire Protection Special Tax on residential and commercial property, by adding low-income tax exemptions and rebates, and adjusting the rate from $0.0807 per square foot to the new rates as provided in the measure if a parcel over 500,000 square feet in size becomes exempt from this tax, providing an estimated $2,500,000 annually until ended by voters, be adopted?"
yes = "A “yes” vote on Measure “Q” will approve this amendment to the EMS/ALS/Fire parcel tax."
no = "A “no” vote on Measure “Q” will not approve this amendment to the EMS/ALS/Fire parcel tax."

[[section]]
id = "what"
heading = "Measure Q"

[[section.line]]
text = "City of Albany Measure Q asks Albany voters whether to update the parcel tax that pays for fire protection and emergency medical services."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["Emergency Medical Services, Advanced Life Support, and Fire Protection Special Tax"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Albany voters approved the tax in 2022; it is charged by the square foot of land, and very low-income residents are exempt or get a rebate."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "fire-station-engine"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "Measure Q would cut the tax in half for low-income homeowners, and give low-income renters a rebate of half the tax on their unit."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "special-tax"

[[section.line]]
text = "Yearly increases for inflation would be capped at 3 percent, down from 5."
sources = ["guide-page"]

[[section.line]]
text = "If any parcel of 500,000 square feet or more became tax exempt, the tax could instead be charged by the square foot of building, or of undeveloped land."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "zoning-map"

[[section.line]]
text = "Leaseholders on exempt land would pay the tax, and Measure Q needs two-thirds of Albany voters to pass."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "fiscal"
heading = "What the impartial analysis says"

[[section.line]]
text = "The City Attorney's analysis estimates the tax would raise $2,500,000 a year, kept in a fund for paramedics, firefighting and ambulances."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "set-aside-funds"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Measure Q protects fire funding if Golden Gate Fields becomes a park, and closes a tax loophole."
sources = ["arguments"]
basis = ["Measure Q protects funding for our Fire Department if Golden Gate Fields becomes a park, while also making immediate improvements.", "Measure Q immediately closes a tax loophole."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Protects fire and medical funding", "Closes a tax loophole"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "The Alameda County Composite Voter Information Guide says that no argument against Measure Q was submitted for this election."
sources = ["arguments"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote approves these changes to the fire and emergency medical parcel tax."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["will approve"]

[[section.line]]
text = "A no vote does not approve these changes to the fire and emergency medical parcel tax."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["will not approve"]
