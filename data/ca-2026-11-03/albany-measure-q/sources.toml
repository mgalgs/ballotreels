# Archived sources for City of Albany Measure Q, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1). The guide's pages are cut from the
# Alameda County Registrar of Voters' Composite Voter Information Guide
# (965 pages); "PDF page" is the full guide's page number, and the
# pages' printed footers are AMQ-1 onward.
#
# The guide prints an argument in favor and the notice "NO ARGUMENT
# AGAINST MEASURE Q WAS SUBMITTED", and no rebuttals.
#
# The guide prints no tax rate statement or fiscal analysis; the City
# Attorney's Impartial Analysis is the measure's neutral explanation.
#
# Some lines of these pages are set in a font whose text layer is
# glyph ids shifted 29 places; quotes from them match only once the
# alameda-4 round's decoder in ballotreels/checks.py is merged.

