# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and of whom; how a school bond is repaid and what it needs to
# pass; what the money would pay for; the district's tax statement; one
# line per side; what a vote does.
#
# The bond total and the debt service are repaid from a tax on property
# in the district, and no archived source states the district's budget,
# so they have no budget scale (STANDARD.md 6.5; left open), as for
# Santee School District Measure BB. The fiscal line gives the tax
# statement's highest rate beside its average, as it prints both, and
# says its fiscal years in full ("2058-59" printed). The supporters' "low
# tax rates" and the 2022 measure are their argument, so they stay out
# of the neutral sections (STANDARD.md 6.3). "Counsel" is heard as
# "Council" (standard/speakability.txt).
#
# The impartial analysis prints no yes and no sentences, so the card has
# no boxes; the vote lines take their meanings from the ballot question,
# one phrase each, as Utah's do. No argument against Measure K was
# submitted: the no side says so plainly and is marked filed = false.
# The card's title is the guide page's own head. Much of the page's text
# layer is in glyph ids (checks._unshifted_text reads it back).

contest = "ca-2026-11-03-sunol-glen-unified-measure-k"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide-page"
number = "K"
title = "SUNOL GLEN UNIFIED SCHOOL DISTRICT BOND MEASURE K"
origin = "This Measure is placed on the ballot by the governing board of the District."
summary = "To improve the quality of local education; complete the Main Building retrofit and renovation; replace deteriorating plumbing, electrical, sewer, heating and ventilation systems; and modernize and upgrade old classrooms and restrooms; shall Sunol Glen Unified School District’s measure be adopted authorizing $6,100,000 of bonds at legal rates, generating on average $431,700 annually while bonds are outstanding at approximate rates of $35 per $100,000 assessed value, with audits, citizens’ oversight, no money for salaries and funds staying local?"

[[section]]
id = "what"
heading = "Measure K"

[[section.line]]
text = "Sunol Glen Unified School District Measure K asks the district's voters whether to approve $6.1 million in school bonds."
sources = ["guide-page"]

[section.line.visual]
