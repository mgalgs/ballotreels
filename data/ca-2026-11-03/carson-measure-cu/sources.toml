# Archived sources for City of Carson Measure CU, 2026-11-03 general
# election (sources/la-sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The Los Angeles County Registrar-Recorder/County Clerk's list "Measures
# Appearing on the Ballot" is the authority for the letter and the ballot
# question, quoted on the card; its "Supporters: ... Opponents: None
# submitted." line states in words who filed the primary arguments, so
# the same file backs `measure-list`, the official statement of filing.
# The Registrar's Interactive Sample Ballot prints the argument in favor
# that the list's supporters filed, with "NO ARGUMENT AGAINST THIS MEASURE
# WAS SUBMITTED" under it, and the full text of the charter amendments,
# saved as HTML; the full text supersedes the resolution's Exhibit A for
# what the charter would say. The City Attorney's impartial analysis is
# the measure's neutral explanation, the kind a state's attorney
# general's explanatory statement is; it gives no cost estimate.
# Resolution No. 26-098 is the City's operative text, and its ballot
# question says "Charter Reform" where the county's list says "Charter
# Update": the county's wins on the card. Resolution No. 26-092, which
# 26-098 supersedes, and the resolution setting argument priorities are
# not cited.

