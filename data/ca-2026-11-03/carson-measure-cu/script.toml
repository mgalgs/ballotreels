# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the two charter rules it changes
# most (term limits, the council vote to put a tax to voters) and how
# the measure reached the ballot; what would change (those two rules,
# the oil refinery provisions, campaign disclosure, the smaller changes,
# the vote it needs); that the analysis gives no cost estimate; both
# sides as the county's list records them; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". The card and title carry it.
#
# Every change is told as the City Attorney's impartial analysis tells
# it, and the term-limit change as the charter text says it ("There
# shall be no limit on the number of terms"). The ballot question's own
# descriptions ("update term limits to increase voter options", "No Tax
# Increase") are on the card, not narrated. The refinery line keeps both
# halves of the analysis's paragraph: the restrictions it removes, and
# that it would not itself impose or increase any tax.
#
# The card quotes the Los Angeles County Registrar-Recorder/County
# Clerk's list "Measures Appearing on the Ballot": the City's heading,
# the vote needed and the ballot question, which has no yes or no
# sentences, so the card has no boxes. The vote lines give the impartial
# analysis's own meanings, and both highlight the same phrase.
#
# The yes side comes from the argument in favor, filed by the mayor,
# three council members and a restaurant owner, with its basis: voters
# could choose who they want on the council, and the measure does not
# create a tax. The list and the sample ballot say no argument against
# was submitted, so the no side says so plainly, citing the list (filed
# = false). The no line's clause on what the list records balances the
# yes line's length without a further claim.

contest = "ca-2026-11-03-carson-measure-cu"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "CU"
title = "CITY OF CARSON"
origin = "VOTE PASSAGE – Majority Vote 50%+1"
summary = "Carson City Government Accountability, Charter Update, No Tax Increase Measure. Shall the measure amending the Carson City Charter require campaign contribution transparency; make the City Charter consistent with State law on referring ballot measures for voter approval; update term limits to increase voter options; update City Treasurer duties; clarify and clean up inconsistent or outdated language, be adopted?"

[[section]]
id = "what"
heading = "Measure CU"

[[section.line]]
text = "Measure CU asks the voters of this city whether to amend several sections of the city charter."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["amending the Carson City Charter"]

[[section]]
id = "today"
heading = "The charter today"

[[section.line]]
id = "today-terms"
text = "Today, the charter limits council members to three four-year terms."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "constitution-page"

[[section.line]]
id = "today-tax"
text = "Putting a tax before voters takes a two-thirds vote of the council."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section.line]]
text = "The City Council placed Measure CU on the ballot."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "city-council-chamber"

[[section]]
id = "change"
