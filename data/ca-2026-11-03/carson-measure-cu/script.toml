[section.line.visual]
kind = "illustration"
name = "coastal-industrial-yard"

[[section.line]]
text = "The state's campaign contribution disclosure rules would be written into the charter."
sources = ["impartial-analysis", "full-text"]

[section.line.visual]
kind = "illustration"
name = "donation-checks"

[[section.line]]
id = "other"
