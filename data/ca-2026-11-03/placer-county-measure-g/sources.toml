# Archived sources for Placer County Measure G, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# Placer County Elections publishes no combined guide document; it posts
# each measure's guide pages as one PDF, headed "MEASURE G" and
# "PROPOSAL TO AMEND PLACER COUNTY CHARTER SECTION 206", paged MG1 to
# MG2. One PDF backs every source here. County Counsel's Impartial
# Analysis is the measure's neutral explanation, of the kind the other
# Placer County measures give it. Not a tax measure: the pages print no
# fiscal statement, and no argument for or against was submitted.

