# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; how a vacant seat is filled today; how it
# reached the ballot and what it needs; what would change (the longer
# window, the election for the rest of the term, when the appointee
# stays); no cost estimate; both sides, which filed nothing; what a vote
# does.
#
# The card's title is the PDF's own head; its origin and yes and no lines
# are County Counsel's Impartial Analysis (the origin stops before the
# ordinance's number). "Counsel" is heard as "Council"
# (standard/speakability.txt), and no county name is narrated, so the
# narration says "the impartial analysis" and "this county". Not a tax
# measure: the pages print no fiscal statement, so the fiscal line says
# they include no cost estimate; "county's" is heard as "counties", so
# it names them "the Measure G voter guide pages".
#
# The pages print "NO ARGUMENT IN FAVOR OF MEASURE G WAS SUBMITTED" and
# "NO ARGUMENT AGAINST MEASURE G WAS SUBMITTED": both sides say so,
# filed = false (STANDARD.md 2.5), citing those pages.

contest = "ca-2026-11-03-placer-county-measure-g"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "G"
title = "PROPOSAL TO AMEND PLACER COUNTY CHARTER SECTION 206"
origin = "This measure was placed on the ballot by the Board of Supervisors of the County of Placer"
summary = "Shall the measure amending Article II, Section 206 of the Placer County Charter to extend the deadline for filling a vacancy on the Board of Supervisors from 30 days to 60 days, providing additional time for the Board to make an appointment before the Governor fills the vacancy, and requiring vacancies occurring 130 days or more before a statewide direct primary election be filled temporarily by appointment and placed on the ballot at that election, be adopted?"
yes = "A “YES” vote on Measure G is a vote to amend the Placer County Charter to extend the period for appointment by the Board of Supervisors from 30 days to 60 days and to establish procedures for an election to fill the remainder of an unexpired term under specified circumstances."
no = "A “NO” vote on Measure G is a vote to leave the current Charter language unchanged, including the 30-day period for appointment by the Board of Supervisors and the existing procedure for appointment by the Governor if the Board does not fill the vacancy within that period."

[[section]]
id = "what"
heading = "Measure G"

[[section.line]]
text = "Measure G asks the voters of this county whether to change how an empty seat on the Board of Supervisors is filled."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
