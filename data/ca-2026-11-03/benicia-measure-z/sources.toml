# Archived sources for City of Benicia Measure Z, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# No printed Solano County voter guide was archived: these are the filed
# documents the Solano County Registrar of Voters posts on its Current
# Election Information page. The ballot question is quoted from
# Resolution No. 26-82, which orders it (its Section 4); the Registrar's
# corrected Notice of Measures (August 10, 2026) prints the same
# question. The City Attorney's impartial analysis is the measure's
# neutral explanation; no tax rate statement or fiscal analysis was
# posted, and the one revenue estimate is the City's, as the question
# and the analysis give it. The argument against, and the first page of
# the argument in favor, are scans with no text layer: the passages
# `check` reads verbatim were typed from the page images into
# transcriptions beside the PDFs, which name the PDF and URL they copy;
# those sources point at the transcriptions, and their urls at the PDFs.
# The rebuttals are not cited.

[contest]
id = "ca-2026-11-03-benicia-measure-z"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:benicia"
kind = "measure"
title = "City of Benicia Measure Z: Real Property Transfer Tax"

