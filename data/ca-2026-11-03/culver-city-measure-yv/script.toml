# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the age rule today and the city's
# power over its own elections; what the charter change does; the three
# conditions each body must meet first; the vote it needs; no cost
# estimate; one line per side; what a vote does.
#
# No place name is narrated: the opening says "the voters of this city",
# and the Culver City Unified School District is "the school district".
# The card quotes the Registrar-Recorder's list: the city's heading as
# the title, its vote-passage line as the origin, the ballot question as
# the summary. The list prints no yes/no statements; the vote lines take
# their meanings from the impartial analysis.
#
# The 2022 vote on a similar measure appears only in the arguments, so
# the neutral sections leave it out (STANDARD.md 6.3).

contest = "ca-2026-11-03-culver-city-measure-yv"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "YV"
title = "CITY OF CULVER CITY"
origin = "VOTE PASSAGE – Majority Vote 50%+1"
summary = "Shall the measure amending the City of Culver City Charter to allow Culver City residents aged 16 and 17, who are otherwise eligible to vote under state and local law, to vote on City and School District candidates and ballot measures, provided that each legislative body has approved budgetary funds and determined logistical systems are in place, and that inclusion would not prevent consolidation of City or School District elections with county elections, be adopted?"

[[section]]
id = "what"
heading = "Measure YV"

[[section.line]]
text = "Measure YV asks the voters of this city whether residents aged 16 and 17 should vote in city and school district elections."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["residents aged 16 and 17"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Today, voters must be at least 18 under state law, which the city charter follows."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "ballot-box"

[[section.line]]
id = "power"
text = "The state constitution lets charter cities run their own city elections."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "constitution-page"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "Measure YV would let eligible 16- and 17-year-olds vote in city and school board elections."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "amended-page"

[[section.line]]
id = "conditions"
text = "First, the City Council and the school board must each fund any added election costs and confirm systems are ready."
sources = ["impartial-analysis"]

[[section.line]]
text = "Including younger voters also must not block combining those elections with county elections."
sources = ["impartial-analysis"]

[[section.line]]
text = "Measure YV needs a simple majority to pass."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "fiscal"
heading = "What it would cost"

[[section.line]]
text = "The county Registrar's list of measures does not include a cost estimate for the measure."
sources = ["ballot-question"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"
stamp = "None reported"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say local decisions shape the lives of teens, and people who vote once eligible stay engaged for life."
sources = ["argument-for"]
basis = ["Decisions by the Mayor, City Council, and School Board affect their schools, parks, transportation, public safety, recreation programs, and future opportunities.", "Research shows that people who vote when they first become eligible are more likely to remain engaged throughout their lives."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Local decisions shape teens' lives", "Early voters stay engaged for life"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say students would become a captive voting bloc, and strangers with political motives would court and contact teens."
sources = ["argument-against"]
basis = ["The fact is, this measure makes our students a captive, impressionable voting bloc.", "That means your 16-year old child would be getting contacted - and courted - by strangers with political motives."]

[section.line.visual]
kind = "list"
source = "argument-against"
items = ["Students become a captive voting bloc", "Strangers would contact teen voters"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote lowers the voting age to 16 for these elections, once the conditions are met."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["residents aged 16 and 17"]

[[section.line]]
text = "A no vote does not lower the voting age."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["residents aged 16 and 17"]

[[question]]
ask = "Can a city set its own voting age?"
lines = ["power"]

[[question]]
ask = "Would 16-year-olds vote right away?"
lines = ["conditions"]
