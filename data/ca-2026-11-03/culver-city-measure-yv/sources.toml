# Archived sources for City of Culver City Measure YV, 2026-11-03 general
# election (sources/la-sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The Los Angeles County Registrar-Recorder/County Clerk's list "Measures
# Appearing on the Ballot" is the authority for the measure's letter,
# ballot question and vote threshold, and names who filed the arguments;
# sources/county-measure-list-excerpt.txt is the measure's entry, cut from
# it. The Registrar's Interactive Sample Ballot gives the City Attorney's
# impartial analysis, the full text, and the arguments and rebuttals as
# filed (HTML, retrieved 2026-10-30); they supersede the City Clerk's
# copies on its "Upcoming Election Information" page (measure-page.html,
# no longer cited). The impartial analysis is the measure's neutral
# explanation. The resolution (a scan) is not cited. A charter amendment,
# not a tax: no fiscal statement applies, and none was found.

[contest]
id = "ca-2026-11-03-culver-city-measure-yv"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:culver_city"
kind = "measure"
title = "City of Culver City Measure YV: Voting at 16 and 17 in City and School District Elections"

