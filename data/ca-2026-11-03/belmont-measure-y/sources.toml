# Archived sources for City of Belmont Measure Y, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1). San Mateo County's Assessor-County Clerk-Recorder &
# Elections (ACRE) posts each document of the measure separately, as the
# City of Belmont filed it; no printed voter guide was archived.
#
# The City Attorney's Impartial Analysis is the measure's neutral
# explanation, the kind a state's attorney general's explanatory
# statement is, and the one estimate of revenue beside the ballot
# question's. Measure Y is a special tax, not a bond: no tax rate
# statement or fiscal analysis is among ACRE's files.
#
# Every file is a scan with no usable text layer. Each source that
# `check` reads verbatim (the card's ballot question, each side's basis)
# is a transcription of its page, read from the page image, in a .txt
# beside the PDF; the url is the PDF's.

[contest]
id = "ca-2026-11-03-belmont-measure-y"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:belmont"
kind = "measure"
title = "City of Belmont Measure Y: Special Tax Per Square Foot of Buildings for a New Community Center"

