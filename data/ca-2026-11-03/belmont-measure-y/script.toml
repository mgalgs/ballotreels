# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and whose measure it is; who put Measure Y on the ballot and the
# vote it needs; what would change (the rates, who is exempt, where the
# money goes, how long, and that the rate can rise); the revenue estimate
# the impartial analysis gives; one line per side; what a vote does.
#
# The card quotes the ballot question from Resolution No. 2026 – 69, which
# prints no yes/no lines (the City Attorney's analysis has them, in
# another document), so, as for Los Angeles County Measure A, the card has
# no YES/NO boxes, the vote lines give the analysis's meanings, and both
# highlight the one phrase of the question they turn on.
#
# The rates are per square foot (exempt from STANDARD.md 6.5); the $7.1
# million is city revenue, and no archived source states the city budget
# it would scale against (left open, under [[question]]).
#
# The center's age and size are the supporters' facts (rule 6.3), so they
# appear only in the supporters' line; the senior exemption is in the
# ballot question and the analysis, so the neutral section states it.
# The petition's group is named in the analysis but not in a source of a
# kind rule 9.1 allows, so the script says "a citizen petition". Both
# arguments were filed as "Measure ___"; the script says Measure Y.

contest = "ca-2026-11-03-belmont-measure-y"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "Y"
title = "City of Belmont Community Center Tax Measure"
origin = "AN ORDINANCE PROPOSED BY CITIZEN INITIATIVE"
summary = "Shall the ordinance providing funding for and maintaining supervised children's play, youth, teen and adult programs, childcare, afterschool and senior programs in a disabled accessible, fire and earthquake resistant community center, usable as an emergency health and disaster relief facility, levying 33¢ per square foot of residential improvements and 54¢ per square foot of nonresidential improvements, providing $7,100,000 annually until ended by voters, with senior exemptions and independent audits, increasing the appropriation limit, be adopted?"

[[section]]
id = "what"
heading = "Measure Y"

[[section.line]]
text = "Belmont Measure Y asks city voters whether to approve a special tax on building space to fund a new community center."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["community center"]

[[section]]
id = "today"
heading = "How it got here"

[[section.line]]
text = "A citizen petition put Measure Y on the ballot, and it needs a simple majority to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "ballot-box"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "rates"
text = "The tax would start July 1, 2027, at 33 cents per square foot of homes, and 54 cents for other buildings."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "bars"
title = "Measure Y tax per square foot, cents"
source = "impartial-analysis"
unit = ""
labels = ["Homes", "Other property"]
values = [33, 54]

[[section.line]]
id = "exempt"
text = "Owners 65 and older who live in their homes would be exempt."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "homestead"

[[section.line]]
text = "The money would go to a special fund to build and run the center, until voters repeal the tax."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "community-center"

[[section.line]]
id = "increases"
text = "The City Council could raise the rate each year by the growth in inflation or income indexes."
sources = ["impartial-analysis"]

[[section]]
id = "fiscal"
heading = "What the impartial analysis says"

[[section.line]]
id = "revenue"
text = "The impartial analysis estimates about $7.1 million for the fund in the first year."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "set-aside-funds"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Belmont has outgrown its 75-year-old center, and that every dollar would be protected in a special fund."
sources = ["argument-for"]
basis = ["Belmont is a city of 27,000, sharing a 75-year-old community center originally built when the population was 5,000.", "Every dollar is protected. Revenue is earmarked for a dedicated special fund for the community center."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Replaces a 75-year-old center", "Every dollar in a special fund"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say everyone would be forced to pay this special tax increase, and that Belmont must live within its budget."
sources = ["argument-against"]
basis = ["The proponents want voters to approve a “special” tax hike that everyone will be forced to pay.", "Send a message that Belmont must live within the city budget."]

[section.line.visual]
kind = "list"
source = "argument-against"
items = ["Everyone is forced to pay", "Live within the city budget"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote would approve Measure Y and the tax."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["levying 33¢ per square foot"]

[[section.line]]
text = "A no vote would reject Measure Y."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["levying 33¢ per square foot"]

[[question]]
ask = "Who would pay, and how much?"
lines = ["rates", "exempt"]

[[question]]
ask = "Could the tax go up later?"
lines = ["increases"]

[[question]]
ask = "How big is $7.1 million a year next to the city budget?"
unanswered = true
