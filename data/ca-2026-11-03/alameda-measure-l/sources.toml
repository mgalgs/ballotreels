# Archived sources for City of Alameda Measure L, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1). The guide's pages are cut from the
# Alameda County Registrar of Voters' Composite Voter Information Guide
# (PDF pages 783 to 789, printed AML-1 to AML-7).
#
# One guide page prints the ballot question and the City Attorney's
# Impartial Analysis; the Tax Rate Statement, the measure's fiscal
# statement, follows it. Some lines of the guide are set in a font with
# no Unicode map; the checks do not yet read them (a decoder from
# another round will).

