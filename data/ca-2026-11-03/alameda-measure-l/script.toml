# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and of whom; how it reached the ballot and the two-thirds it
# needs; what the money would pay for and how the bonds are repaid; the
# tax rate statement's estimates; one line per side; what a vote does.
#
# The Tax Rate Statement is the fiscal statement; its tax rates and
# debt service are given as it prints them (the total rounded to the
# tenth of a million, "about"). The bonds are repaid from a tax on
# property in the city, and no archived source states the city's budget,
# so the $300 million and the $662.2 million have no budget scale
# (STANDARD.md 6.5; left open). The fiscal line gives the statement's
# highest rate beside its average, as it prints both.
#
# The ballot question opens with the act's name and its acronym spelled
# out ("SAFER Alameda Act — Preparing Alameda for Sea-Level Rise, ...");
# the card quotes the name as its title and the question that follows as
# its summary. Sides come from the argument in favor and the argument
# against, not the rebuttals; the argument against's "project list"
# point is its own, so the neutral lines name the measure's categories
# and examples as the analysis gives them and say nothing of a list.

contest = "ca-2026-11-03-alameda-measure-l"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide-page"
number = "L"
title = "SAFER Alameda Act"
origin = "This measure was placed on the ballot by the City Council of the City of Alameda."
summary = "To prepare for emergencies, earthquakes and sea-level rise; prevent flooded Tubes; repair potholes; keep streets safe and accessible; maintain response to fires, accidents, and medical emergencies; prevent Bay pollution; and protect shorelines; shall the City of Alameda measure issuing $300,000,000 in bonds, levying $49/$100,000 of assessed value, generating approximately $19,000,000 annually while bonds are outstanding, requiring oversight, public disclosures, and local control, be adopted?"
yes = "A “Yes” vote is a vote to allow the City to issue general obligation bonds in the amount of $300,000,000 to fund certain capital improvement projects."
no = "A “No” vote is a vote not to allow the issuance of general obligation bonds in any amount."

[[section]]
id = "what"
heading = "Measure L"

[[section.line]]
text = "City of Alameda Measure L asks voters in the city whether to issue $300 million in bonds for flood, earthquake and street projects."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["$300,000,000 in bonds"]

[[section]]
id = "today"
heading = "How it reached the ballot"

[[section.line]]
text = "The City Council placed Measure L on the ballot, and it needs a yes vote from two-thirds of voters to pass."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "The money could pay for sea walls and levees, storm drains and pumps, and other flood projects."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "shoreline-seawall"

[[section.line]]
text = "It could also pay for earthquake retrofits of fire stations, a new fire station, and street paving and pothole repair."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "fire-station-engine"

[[section.line]]
text = "Property owners in the city would repay the bonds through a tax based on assessed value."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "homestead"

[[section]]
id = "fiscal"
heading = "What the tax rate statement says"

[[section.line]]
text = "The tax rate statement estimates an average tax of $47.97 per $100,000 of assessed value, and at most $49.49, through 2061."
sources = ["tax-statement"]

[section.line.visual]
kind = "illustration"
name = "debt-payments"

[[section.line]]
text = "The statement estimates the total to repay, with interest, at about $662.2 million."
sources = ["tax-statement"]

[section.line.visual]
kind = "bars"
title = "Measure L bonds, in millions of dollars"
source = "tax-statement"
unit = ""
labels = ["Bonds issued", "Total to repay"]
values = [300, 662.2]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say the island is on the front lines of sea-level rise, and fire stations and storm sewers do not meet earthquake standards."
sources = ["arguments"]
basis = ["As an island community, we’re on the front lines of sea-level rise.", "Fire stations, storm sewers, and other critical infrastructure are decades old and don’t meet current earthquake safety standards."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["The island faces sea-level rise and flooding", "Fire stations and sewers are not quake-safe"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say the Council should name specific projects, where they are and what each costs, instead of sending voters broad funding categories."
sources = ["arguments"]
basis = ["Council has a duty to explain what specifically it is asking voters to fund", "and the cost of each listed project", "Instead of forwarding a specific project list, my colleagues are forwarding you a broad set of funding categories"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["No list of specific projects and places", "No cost given for each project"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
