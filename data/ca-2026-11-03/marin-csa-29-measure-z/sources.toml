# Archived sources for County Service Area No. 29 (Paradise Cay) Measure
# Z, 2026-11-03 general election (sources/sources.md). Every id here may
# be cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# A county service area has no Census boundary, so the division is the
# county and `voters` names the service area as the County's documents
# do: "County Service Area No. 29" in the resolution, with the "Paradise
# Cay" the county's list of measures and the Registrar's staff report
# 26-4515 put beside it. The list is the authority for the letter (the
# Board's documents do not carry it); the staff report 26-4515 gives the
# vote required ("requires 2/3 approval"). Marin County's own Measure Z
# page has no capture, so no impartial analysis, argument or rebuttal
# was reached, and no document says whether any argument was filed.
#
# The card quotes the ballot question from the signed Board of
# Supervisors Resolution No. 2026-032, which is also the measure's whole
# text (there is no ordinance); it has a text layer. The heading over the
# question misprints "PARADISE BAY"; the card's title quotes only the
# heading's first line, "COUNTY SERVICE AREA NO. 29". The vote
# certification and the minutes record the adoption on May 19, 2026.
#
# The Department of Public Works staff report is the County staff's
# material: it is cited only for plain facts, attributed to it (that the
# service area is waterfront parcels only, and today's rate and
# revenue). Its history of earlier renewals, its past dredging cost and
# its ten-year revenue projection are not used.

