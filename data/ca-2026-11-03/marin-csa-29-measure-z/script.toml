# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the tax the service area pays
# today and when it ends; who placed the measure and the vote it needs;
# what would change (the rate, its yearly rise, the term, what it pays
# for, what happens if it fails); the ballot question's revenue
# estimate; both sides, neither of which has an archived argument; what
# a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this service area", and the channels run
# "to the bay". The card, the title and the "Only voters in ..." line
# carry the names.
#
# The card quotes the ballot question from Resolution No. 2026-032,
# which prints no yes/no lines, so the card has no boxes and the vote
# lines take their meaning from the question. Its title is the first
# line of the heading over the question; the second line's "Paradise
# Bay" misprint is not quoted.
#
# Every rule of the tax is from the resolution, which is the measure's
# whole text. The Public Works staff report is cited for two plain
# facts only, attributed to it: the service area is waterfront parcels,
# and today's rate and yearly revenue. Its account of the need for
# dredging, its past dredging cost and its ten-year revenue projection
# are not used.
#
# The ballot question's estimate ($272,800, for which it gives no period)
# is narrated as printed, with no period added; it is the service area's
# revenue, and no archived source states the service area's
# budget, so the figure has no scale (STANDARD.md 6.5; left open). The
# per-lot amounts are exempt.
#
# No argument for or against Measure Z was archived, and no document
# says whether any was filed, so each side says none is among the
# documents gathered (filed = false, STANDARD.md 2.5), as for Walnut
# Creek Measure U.

contest = "ca-2026-11-03-marin-csa-29-measure-z"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "resolution"
number = "Z"
title = "COUNTY SERVICE AREA NO. 29"
origin = "Marin County Board of Supervisors"
summary = "For ongoing maintenance dredging in the principal waterways of Paradise Cay along with the north and south entry channels to San Francisco Bay, shall the measure for an annual parcel tax in County Service Area No. 29, for $2,200 per lot per year commencing in July 2027 providing an estimated $272,800 and automatically increasing 3% each year thereafter, for a total of ten years, be adopted?"

