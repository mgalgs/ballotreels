# Archived sources for Kentfield Fire Protection District Measure BB,
# 2026-11-03 general election (sources/sources.md). Every id here may be
# cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# The county's Measure BB page (sources/county-page.txt, saved as text
# from a browser, since the site refuses scripted fetches) prints the
# ballot question, the vote required to pass, County Counsel's
# impartial analysis and the argument in favor, and says that no
# argument against Measure BB was filed. The other files are the
# District's: pages 30 to 35 of its June 10, 2026 Board of Directors
# packet, the staff report and Resolution
# No. 7-2026, whose Section 3 is the ballot question (the resolution is
# the measure's only text; it has no ordinance), and the minutes of that
# meeting. The resolution archived is the DRAFT in the packet: its vote
# lines are blank and it is unsigned. No signed copy was found. The
# minutes record that the Board approved Resolution 7-2026 at that
# meeting, and they are cited for that fact.
#
# The packet pages are a scan with no text layer. They were typed from
# the page images into
# sources/2026-06-10-packet-pp30-35-staff-report-resolution-7-2026-transcription.txt,
# which names the PDF and URL it copies; the sources from the packet
# point at the transcription, and their url at the scan.
#
# The staff report is District staff's material: only its plain facts
# are cited (the current rate and its square-foot basis, the current
# tax's end, the yearly confirmation of the rate), never its statements
# of need or benefit, and never its "BALLOT ARGUMENT" section, a
# proposed text (the filed argument cited is the one the county
# prints). It and the minutes are of kind public-record: no allowed kind fits a staff report or minutes exactly,
# and official-report is reserved for a nonpartisan fiscal office's
# reports.
#
# A fire protection district has no Census boundary, so the measure's
# division is the county and `voters` names the district
# (docs/SCRIPT-FORMAT.md). The letter BB and the two-thirds vote are
# confirmed by the Registrar of Voters' Board of Supervisors staff report
# 26-4515.

[contest]
id = "ca-2026-11-03-kentfield-fpd-measure-bb"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/county:marin"
kind = "measure"
title = "Kentfield Fire Protection District Measure BB: Continuing the Paramedic Services Special Tax for Four Years"
voters = "the Kentfield Fire Protection District"

[[contest.correction]]
date = "2026-10-30"
note = "The video now gives the argument in favor printed by the county, and says, as the county does, that no argument against was filed."

