# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the regional paramedic authority
# and the tax today; what would change (the most it could be, the yearly
# confirmation, the use of the money); how it reached the ballot and the
# vote it needs; the revenue estimate; both sides (the argument in
# favor; none against was filed); what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this fire district", and the Ross Valley
# Paramedic Authority is "the regional paramedic authority". The card,
# title and `voters` line carry the names. No person is named, and no
# vote count is given.
#
# The resolution is the measure's only text: the neutral lines rest on
# the ballot question, the resolution, the plain facts of the District
# staff report, and the minutes. The county's Measure BB page prints the
# same question (the card is left as it was) and County Counsel's
# impartial analysis, which agrees with every neutral line and is cited
# beside the rate and the vote it needs. The resolution archived is the
# draft in the June 10, 2026 packet (vote lines blank, unsigned); the card cites it as the draft,
# and the minutes are the record that the Board approved it. The
# resolution's recital of "responsive, high-quality" care, the ballot
# question's opening purpose clause and the staff report's proposed
# ballot argument are not narrated; what the question promises of the
# money is attributed to the question. The card quotes the ballot
# question from Section 3 of the draft resolution, named by its number;
# the resolution prints no yes/no lines, so the card has none, and both
# vote lines highlight the same phrase of the question.
#
# The ballot question's "approximately $326,000 annually" is paramedic
# tax revenue. No archived source states the District's or the paramedic
# authority's budget, so the figure has no scale (STANDARD.md 6.5; left
# open). The tax rates are amounts per housing unit or per 1,000 square
# feet (exempt).
#
# The county's page prints an argument in favor of Measure BB and says
# "No argument against Measure BB was filed." The yes side distils the
# argument (its signers are not named); "at the current tax rate" is the
# argument's own claim and stays in the yes line: the neutral lines give
# the rates as the question, the staff report and County Counsel's
# impartial analysis do. The no side says, as the county does, that none
# was filed (filed = false, STANDARD.md 2.5), as for California
# Proposition 1.

contest = "ca-2026-11-03-kentfield-fpd-measure-bb"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "BB"
title = "RESOLUTION NO. 7-2026"
origin = "BOARD OF DIRECTORS OF THE KENTFIELD FIRE PROTECTION DISTRICT"
summary = "To maintain rapid 9-1-1 emergency response times and preserve the number of on-duty paramedics ready to respond to accidents/medical emergencies, shall the Ross Valley Paramedic Authority measure be adopted continuing for four years the paramedic services special tax of up to $107.50/residential living unit or 1,000 square feet of developed nonresidential property, adjusted up to $4/year, generating approximately $326,000 annually, with annual audits, public spending disclosure and all funds for local paramedic services?"

[[section]]
id = "what"
heading = "Measure BB"

[[section.line]]
text = "Measure BB asks the voters of this fire district whether to continue a parcel tax for paramedic services for four more years."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["continuing for four years the paramedic services special tax"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "authority"
text = "The tax pays for paramedic care from the regional paramedic authority, which eight local governments formed in 1982."
sources = ["text"]

[section.line.visual]
kind = "illustration"
name = "valley-town-ambulance"

[[section.line]]
id = "rate-today"
text = "This year the tax is $103.50 per housing unit, or per 1,500 square feet of other buildings, and it ends in June 2027."
