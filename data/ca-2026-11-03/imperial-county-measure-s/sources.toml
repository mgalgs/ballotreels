# Archived sources for Imperial County Measure S, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# The Imperial County Registrar of Voters posts each measure's pages as
# one PDF (the ballot question, full text, argument and impartial
# analysis); no countywide Voter Information Guide is posted online. The
# packet's own text layer joins "locally-controlled" across a line break,
# so the card quotes a transcription of its page 1 question and page 13
# opening sentence (sources/ballot-question-transcription.txt, naming the
# PDF and URL it copies). County Counsel's impartial analysis is the
# measure's neutral explanation, the kind a state's attorney general's
# explanatory statement is. No fiscal analysis or tax rate statement
# applies (a sales tax); the one revenue estimate is the ballot
# question's. The packet prints an argument in favor and no argument
# against or rebuttal.

[contest]
id = "ca-2026-11-03-imperial-county-measure-s"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/county:imperial"
kind = "measure"
title = "Imperial County Measure S: Public Safety Sales Tax"

