# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; how it reached the ballot (a citizens'
# initiative); how the tax would be collected; what the money could pay
# for and who would check it; the vote the measure's own text names; the
# ballot question's revenue estimate; one line per side; what a vote
# does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this county". The card and title carry
# the names. "Counsel" is heard as "Council" (standard/speakability.txt),
# so the narration says "the impartial analysis". The rate is said as a
# percent (the full text's "one-half of one percent (0.5%)"), since a
# sales tax said in cents is transcribed in dollars.
#
# The card quotes the ballot question as the Registrar's Measure S PDF
# prints it, from a transcription (sources.toml). The page prints blank
# Yes and No lines and no yes/no sentences, so the card has no boxes,
# its origin is the impartial analysis's sentence on how the measure
# reached the ballot, the vote lines give the analysis's meanings, and
# both highlight the same phrase of the question.
#
# Vote needed: the impartial analysis states none. The initiative's own
# text says the tax applies "if a majority of electors voting on the
# measure vote to approve" it; the script says only that, attributed to
# the measure's text, and nothing about which threshold the county will
# apply.
#
# The $20 million a year is the ballot question's estimate. No archived
# source states the county's budget to give it a scale (STANDARD.md 6.5;
# left open, under [[question]]).
#
# The 911 response, the fire stations and equipment, the oversight
# committee and audits are also points the argument in favor makes. The
# fund's uses, the committee and the audit are what the measure does, as
# the impartial analysis states them, so the change section gives them in
# the analysis's words; the supporters' line keeps their claims (better
# response, deteriorated stations) to their own section (STANDARD.md
# 6.3).
#
# The Registrar's Measure S PDF prints an argument in favor and no
# argument against. The no side says so plainly; its section is marked
# filed = false.

contest = "ca-2026-11-03-imperial-county-measure-s"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "S"
title = "Imperial County Public Safety Sales and Use Tax Initiative"
origin = "an initiative that was placed on the ballot by a petition signed by the requisite number of voters"
summary = "IMPERIAL COUNTY 911 RESPONSE/PUBLIC SAFETY PROTECTION. To maintain/improve emergency/911 response, fire/paramedic/sheriff services; prepare/respond to earthquakes/disasters; reduce crime; retain/attract qualified firefighters/paramedics/sheriff’s deputies; address homelessness; upgrade aging lifesaving fire equipment, fire stations, emergency facilities; shall Imperial County’s locally-controlled measure establishing a ½-cent transactions and use (sales) tax, generating approximately $20,000,000 annually, expiring in 20 years, be adopted; requiring audits, spending disclosure, funds cannot be diverted for other purposes?"

[[section]]
id = "what"
heading = "Measure S"

[[section.line]]
text = "Measure S asks the voters of this county whether to add a half percent sales tax for public safety."
sources = ["ballot-question", "text"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["establishing a ½-cent transactions and use (sales) tax"]

[[section]]
id = "today"
heading = "How it reached the ballot"

[[section.line]]
id = "initiative"
text = "Voters placed Measure S on the ballot by signing a petition."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "neighborhood-petition"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "term"
text = "The state would collect the tax along with existing sales taxes, for 20 years."
sources = ["impartial-analysis", "text"]

[section.line.visual]
kind = "illustration"
name = "sales-receipt"

[[section.line]]
id = "uses"
text = "The money would go to a public safety fund for fire stations, sheriff and coroner buildings, and fire equipment."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "fire-station-engine"

[[section.line]]
id = "oversight"
text = "A citizens' committee and a yearly independent audit would check the spending."
sources = ["impartial-analysis"]

[[section.line]]
id = "threshold"
text = "The measure's own text says the tax takes effect with a majority vote."
sources = ["text"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "fiscal"
heading = "What it would raise"

[[section.line]]
id = "revenue"
text = "The ballot question estimates about $20 million a year in revenue."
sources = ["ballot-question"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Measure S would improve emergency response and upgrade deteriorated fire stations and equipment."
sources = ["argument-for"]
basis = ["Improve 911 emergency response across Imperial County.", "Upgrade deteriorated fire stations, public safety facilities and lifesaving vehicles/equipment."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Improves emergency response", "Upgrades fire stations and equipment"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "The posted pages for Measure S print one argument in favor, and none against it."
sources = ["argument-for"]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["No argument against was printed"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote raises the sales tax by a half percent for 20 years."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["establishing a ½-cent transactions and use (sales) tax"]

[[section.line]]
text = "A no vote does not raise the sales tax."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["establishing a ½-cent transactions and use (sales) tax"]

[[question]]
ask = "Who put this on the ballot?"
lines = ["initiative"]

[[question]]
ask = "How long would the tax last?"
lines = ["term"]

[[question]]
ask = "What could the money be spent on, and who checks it?"
lines = ["uses", "oversight"]

[[question]]
ask = "What vote does it need to pass?"
lines = ["threshold"]

[[question]]
ask = "How big is about $20 million a year next to the county budget?"
unanswered = true
