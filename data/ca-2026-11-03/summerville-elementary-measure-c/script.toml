# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; how a school bond is repaid and what it needs
# to pass; what the money may pay for; the district's tax rate statement;
# one line per side; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the opening
# says "the voters of this school district". The card and title carry the
# names. "Counsel" is heard as "Council" (standard/speakability.txt), so
# the narration does not say it.
#
# The card quotes the ballot question page of the Tuolumne County
# Elections Local Voter Information Guide, with its yes and no sentences.
# The bond total and the debt service are repaid from a tax on property
# in the district, not from the district's budget, and no archived source
# states that budget, so they have no budget scale (STANDARD.md 6.5; left
# open), as other school bonds' do. The tax statement gives one figure,
# $30, for both its average and its highest rate.
#
# The supporters cite the school's age, its deteriorating systems, the
# oversight and audits and the ban on salaries, so the neutral sections
# describe the projects only as the impartial analysis lists them and
# leave the oversight and the salary ban out (STANDARD.md 6.3).
#
# The ballot question page says "No argument against was filed.", so the
# no side says so (filed = false, STANDARD.md 2.5).

contest = "ca-2026-11-03-summerville-elementary-measure-c"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "C"
title = "Summerville Elementary School District Proposed Bond Measure"
origin = "Local Ballot Measures: School Bond Measure C"
summary = "Summerville Elementary School Basic Repairs Measure: To support quality education at our Summerville Elementary School by providing clean, safe classrooms; repairing leaky roofs, heating and cooling systems, aging plumbing, sewer and electrical lines; and upgrading fire safety systems and fire alarms, shall Summerville Elementary School District’s measure authorizing $3,400,000 in bonds, at legal rates, estimated levies of approximately $30 per $100,000 assessed valuation ($250,000 annually) while bonds are outstanding, requiring audits, public spending disclosure, citizens’ oversight, and keeping funds local, be adopted?"
yes = "A “YES” vote on Measure C is a vote to authorize the issuance of bonds in the amount of $3,400,000 to be financed by an annual property tax."
no = "A “NO” vote on Measure C is a vote against the issuance of the proposed bonds."

[[section]]
id = "what"
heading = "Measure C"

[[section.line]]
text = "Measure C asks the voters of this school district whether to approve $3.4 million in school bonds."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["authorizing $3,400,000 in bonds"]

[[section]]
id = "today"
heading = "How a school bond works"

[[section.line]]
id = "repay"
text = "The district would sell the bonds and repay them from a yearly tax on property in the district."
sources = ["impartial-analysis", "tax-statement"]

[section.line.visual]
kind = "illustration"
name = "bond-certificates"

[[section.line]]
id = "threshold"
text = "Measure C needs 55 percent of the vote to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "projects"
text = "The bond money could pay only for repairing, rebuilding and equipping the district's school facilities."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "school-classroom"

[[section.line]]
id = "project-list"
text = "The district's examples include repairing classrooms, restrooms, plumbing and sewer lines, replacing leaky roofs, and upgrading fire alarms."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "school-roof-repair"

[[section]]
id = "fiscal"
heading = "What the tax statement says"

[[section.line]]
id = "rate"
text = "The district's tax rate statement estimates a tax of $30 per $100,000 of assessed value, collected until the 2053-2054 fiscal year."
sources = ["tax-statement"]

[section.line.visual]
kind = "bars"
title = "Estimated tax per $100,000 of assessed value, dollars"
source = "tax-statement"
unit = ""
labels = ["Average", "Highest"]
values = [30, 30]

[[section.line]]
id = "total"
text = "The statement estimates the total to repay, with interest, at about $6.9 million."
sources = ["tax-statement"]

[section.line.visual]
kind = "illustration"
name = "debt-payments"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say the school is over 60 years old with deteriorating infrastructure, and citizens' oversight and yearly audits are required."
sources = ["argument-for"]
basis = ["Our beloved school is over 60 years old, and though it may look good on the outside, the infrastructure is rapidly deteriorating on the inside.", "Independent citizens’ oversight and annual financial and performance audits are required"]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Repairs a school over 60 years old", "Oversight and yearly audits required"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure C was filed, so the county voter guide prints only the argument of the supporters."
sources = ["ballot-question"]

[section.line.visual]
kind = "list"
source = "ballot-question"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote is a vote to authorize $3.4 million in bonds, financed by an annual property tax."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["a vote to authorize the issuance of bonds"]

[[section.line]]
text = "A no vote is a vote against issuing the proposed bonds."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["a vote against the issuance of the proposed bonds"]

[[question]]
ask = "How would the bonds be paid back?"
lines = ["repay", "total"]

[[question]]
ask = "How much tax would I pay, and for how long?"
lines = ["rate"]

[[question]]
ask = "What could the money be spent on?"
lines = ["projects", "project-list"]

[[question]]
ask = "What vote does the measure need to pass?"
lines = ["threshold"]

[[question]]
ask = "How large is the bond next to the district's yearly budget?"
unanswered = true
