# Archived sources for City of Salinas Measure H, 2026-11-03 general
# election (sources/county-sources.md, sources/sources.md). Every id here
# may be cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# The County of Monterey Elections Department's List of Local Measures
# gives Measure H's letter, vote threshold and ballot question, and says
# "All related documents are filed and on public review with the city
# clerk." The impartial analysis, the arguments and any rebuttals are
# not posted online by the county or the City, so none is cited.
#
# Measure H is a referendum on Ordinance No. 2687, whose signed copy (a
# text PDF) is the measure's full text. The City Council's resolution
# calling the election is archived from its agenda packet (a Word file,
# its number and vote left blank); its ballot question matches the
# county's word for word, so it is the resolution adopted. Its text was
# extracted into sources/resolution-calling-election-draft-2026-04-15.txt,
# which names the file and URL it copies; that source points at the
# extraction, and its url at the Word file. The City Attorney's impartial
# analysis in the same packet is an unsigned draft that may differ from
# the one filed, and is not cited; nor is the council report.

[contest]
id = "ca-2026-11-03-salinas-measure-h"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:salinas"
kind = "measure"
title = "City of Salinas Measure H: Referendum on Repealing Four Rental Housing Ordinances"

