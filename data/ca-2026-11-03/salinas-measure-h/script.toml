# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; how it reached the ballot (the
# council's ordinance, the referendum petition, the council's choice to
# put it to a vote); what the ordinance repeals; that no cost estimate is
# among the documents; the two sides, whose arguments are not online;
# what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". The card and title carry it.
#
# Only the county's List of Local Measures (the card), Ordinance No. 2687
# and the City Council's resolution, whose ballot question matches the
# county's word for word, are cited. The four ordinances are named as
# the ordinance and the ballot question name them; what each does is
# described only in the City Attorney's draft impartial analysis, which
# may differ from the one filed and is not cited, so the script says no
# more than their titles. The petitioners' committee, named in the
# resolution, is not named (STANDARD.md 9 permits naming, never requires
# it, and no one is named for the other side).
#
# A yes vote adopts the ordinance and repeals the four; a no vote does
# not adopt it. Both vote lines say only that, from the ballot question.
#
# The county says the measure's documents are filed with the city clerk;
# none is online, so it is not known whether any argument was filed. Each
# side says only that any argument is filed with the city clerk and is
# not online (filed = false, STANDARD.md 2.5), and presents no side.

contest = "ca-2026-11-03-salinas-measure-h"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "measure-list"
number = "H"
title = "City of Salinas"
origin = "Majority Voter Approval Required"
summary = "Shall Ordinance No. 2687, which repeals the Residential Rental Registration Ordinance, the Rent Stabilization Ordinance, the Tenant Protection and Just Cause Eviction Ordinance, and the Tenant Anti-Harassment Ordinance, be adopted?"

[[section]]
id = "what"
heading = "Measure H"

[[section.line]]
text = "Measure H asks the voters of this city whether to adopt an ordinance that repeals four city ordinances on rental housing."
