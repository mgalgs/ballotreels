# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and whose measure it is; how the bonds are repaid and the vote they
# need; what the money would pay for, and the impartial analysis's caveat
# that approval does not guarantee the projects; the tax information
# statement's estimates; one line per side; what a vote does.
#
# The tax rate and the bond total are given as the statement and the
# ballot give them. The bonds are repaid from a tax on property in the
# district, and no archived source states the district's budget, so the
# total repaid has no scale (STANDARD.md 6.5; left open). The citizens'
# oversight and audits are the supporters' point too ("Annual independent
# audits and a citizens' oversight committee will ensure funds are spent
# as promised"), so the neutral lines leave them to the card and the yes
# side (STANDARD.md 6.3). County Counsel's Impartial Analysis is cited as
# the guide page; "Counsel" is heard as "Council"
# (standard/speakability.txt).
#
# No argument against was filed ("No Argument Against Measure L was filed
# with the Office of the Registrar of Voters"): the no side says so,
# filed = false (STANDARD.md 2.5).

contest = "ca-2026-11-03-mountain-empire-measure-l"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide-page"
number = "L"
title = "MOUNTAIN EMPIRE UNIFIED SCHOOL DISTRICT"
origin = "The Board of Education for the Mountain Empire Unified School District (“District”) placed this measure on the ballot."
summary = "To repair, replace, or reconstruct deteriorating classrooms, science labs, career technical education and school facilities at Mountain Empire High School that don’t meet building safety/earthquake safety standards; remove asbestos, lead pipes, mold; and replace/fix roofs plumbing, sewer, electrical, and aging portables, shall Mountain Empire Unified School District’s measure authorizing $23,000,000 in bonds at legal rates be adopted, levying approximately $38 per $100,000 of assessed valuation ($2,542,353 annually) while bonds are outstanding, with independent oversight, audits, and all money locally controlled?"
yes = "A “YES” vote is in favor of authorizing the District to issue and sell $23,000,000 in general obligation bonds."
no = "A “NO” vote is against authorizing the District to issue and sell $23,000,000 in general obligation bonds."

[[section]]
id = "what"
heading = "Measure L"

[[section.line]]
text = "Mountain Empire Unified School District Measure L asks the district's voters whether to approve $23 million in bonds for its high school."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["$23,000,000 in bonds"]

[[section]]
id = "today"
heading = "How school bonds work"

[[section.line]]
text = "The bonds would be repaid, with interest, by a yearly tax on the assessed value of property in the district."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "bond-certificates"

[[section.line]]
text = "Measure L needs 55 percent of the vote to pass."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "The money would repair or rebuild high school classrooms and labs, remove asbestos, lead pipes and mold, and fix roofs and plumbing."
