[section.line.visual]
kind = "illustration"
name = "school-classroom"

[[section.line]]
id = "project-list"
text = "The ballot question names roofs, heating, cooling and plumbing, modernizing schools, transitional kindergarten and arts classrooms, a new high school stadium, and campus safety."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["To replace aging roofs, heating, cooling, and plumbing", "modernize outdated school facilities", "transitional kindergarten classrooms", "new high school stadium", "improve campus safety"]

[[section]]
