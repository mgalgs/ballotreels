# Archived sources for Tehachapi Unified School District Measure D,
# 2026-11-03 general election (sources/county-sources.md). Every id here
# may be cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# Kern County Elections posts each local measure's filed documents on its
# page "November 3, 2026, General Election", which lists them client-side,
# so no document has its own recoverable URL: every source here cites that
# page. The ballot question is quoted from Appendix B, the "Abbreviated
# Form of Bond Measure", of the Board of Trustees' Resolution No.
# 01JUL26, as Yosemite Unified Measure Y's is from its board's resolution;
# the county's letter list prints no ballot question. County Counsel's
# impartial analysis is the measure's neutral explanation, the kind a
# state's attorney general's explanatory statement is; the district's tax
# rate statement (the resolution's Appendix C) is its fiscal statement.
#
# The resolution and the argument are scans with no text layer. The
# passages cited were typed from the page images into
# sources/*-transcription.txt, each naming the PDF it copies; those
# sources point at the transcription. The county posts no argument
# against and no rebuttals, but no official document says in words that
# none was filed.

[contest]
id = "ca-2026-11-03-tehachapi-unified-measure-d"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/school_district:tehachapi_unified_school_district"
kind = "measure"
title = "Tehachapi Unified School District Measure D: $61 Million School Facilities Bond"

[[source]]
id = "ballot-question"
kind = "official-title-summary"
publisher = "Tehachapi Unified School District, Board of Trustees Resolution No. 01JUL26: Appendix B, Abbreviated Form of Bond Measure, page 11, as posted by Kern County Elections (transcribed from the scan)"
credit = "Resolution No. 01JUL26, Tehachapi Unified School District"
url = "https://www.kernvote.com/elections/upcoming-elections/november-3-2026-general-election"
file = "sources/county-resolution-transcription.txt"
