# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; when voters approved the tax and
# when it would end; how it reached the ballot; what is taxed today;
# what would change (no end date, what stays untaxed, where the money
# goes); the revenue figure, from the ballot question; the argument for,
# and that no argument against was submitted; what a vote does.
#
# Only the ballot question, the City Attorney's impartial analysis and
# the argument for were gathered (no full text), so the neutral lines are
# from the question and the analysis alone. The analysis's paragraph on
# what another agency could do with the rate cap if the tax expired is a
# consequence of a no vote with no counterpart for a yes vote, close to
# the argument's "local control"; it is left out (STANDARD.md 6.3, 6.4).
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". The card shows the name.
#
# The card quotes the measure's entry in the county's list "Measures
# Appearing on the Ballot", which prints no yes/no meanings, so the card
# has no boxes; the vote lines take both meanings from the impartial
# analysis and highlight the same phrase of the question.
#
# The $1.3 million a year is the ballot question's figure; the analysis
# gives none, and no archived source states the City's general fund
# budget, so it is given without a scale (STANDARD.md 6.5; left open).
#
# Sides: the argument in favor is presented from its text; the county's
# list says "Opponents: None submitted.", and the no side says so
# (filed = false).

contest = "ca-2026-11-03-cudahy-measure-ok"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "OK"
title = "CITY OF CUDAHY"
origin = "VOTE PASSAGE – Majority Vote 50%+1"
summary = "Keep Cudahy Sales Tax Revenues Local Measure To preserve and continue the City's existing local funding stream, which may be used to support general City services, including, but not limited to, street, sidewalk and City building repair; park maintenance and enhancements; and youth and recreational programs, shall the City's existing 3/4% transactions (sales) and use tax be extended indefinitely, unless repealed by voters, providing approximately $1.3 million annually for local use?"

[[section]]
id = "what"
heading = "Measure OK"

[[section.line]]
text = "Measure OK asks the voters of this city whether to keep an existing local sales tax of three-quarters of a percent, with no end date."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["existing 3/4% transactions (sales) and use tax be extended indefinitely"]

[[section]]
id = "background"
heading = "How it reached the ballot"

[[section.line]]
id = "expires"
text = "Voters approved the tax in 2018, and it is set to expire on March 31, 2029."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "end-date"

[[section.line]]
text = "The City Council placed Measure OK on the ballot, and it needs a simple majority to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "city-council-chamber"

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "today-tax"
text = "Today, the tax is paid on top of the countywide sales tax, on most goods and restaurant meals sold in the city."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "sales-receipt"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "no-end"
text = "The measure would remove the 2029 end date, so the tax would continue until voters repeal it."
sources = ["impartial-analysis", "ballot-question"]

[[section.line]]
id = "exempt"
text = "Prescription drugs and most groceries would stay untaxed."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "grocery-bag"

[[section.line]]
id = "uses"
text = "The money would keep going only to the city, for any public purpose."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "state-budget"

[[section]]
id = "fiscal"
heading = "What it would raise"

[[section.line]]
id = "revenue"
text = "The ballot question says the tax would provide about $1.3 million a year for local use."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["providing approximately $1.3 million annually for local use"]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say the measure is no new tax or higher rate, and without it the city would lose local funding for everyday services."
sources = ["argument-for"]
basis = ["Measure OK does not create a new tax and does not increase the current sales tax rate.", "Without this measure, Cudahy would lose an important source of locally controlled funding that helps maintain the services our community relies on every day."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Not a new tax or a higher rate", "Keeps funding for city services"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "The official county list of measures for this election says that no argument against Measure OK was submitted, by any group or person."
sources = ["arguments-filed"]

[section.line.visual]
kind = "list"
source = "arguments-filed"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote continues the tax until voters repeal it."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["existing 3/4% transactions (sales) and use tax be extended indefinitely"]

[[section.line]]
text = "A no vote leaves the tax to expire in March 2029."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["existing 3/4% transactions (sales) and use tax be extended indefinitely"]

[[question]]
ask = "When does the tax end now, and when would it end?"
lines = ["expires", "no-end"]

[[question]]
ask = "What is taxed, and what is not?"
lines = ["today-tax", "exempt"]

[[question]]
ask = "How big is $1.3 million a year next to the city budget?"
unanswered = true
