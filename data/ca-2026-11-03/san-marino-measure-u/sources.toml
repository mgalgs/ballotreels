# Archived sources for City of San Marino Measure U, 2026-11-03 general
# election (sources/la-sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The Los Angeles County Registrar-Recorder/County Clerk's list "Measures
# Appearing on the Ballot" is the authority for the letter and the ballot
# question, quoted on the card; its "Opponents: None submitted." is the
# official statement that no argument against was filed (`measure-list`).
#
# staff-report.pdf is the City Manager's July 8, 2026 staff report as
# excerpted from the City Council's agenda packet (packet pages 105-142
# of 303). It carries, as attachments, Resolution No. R-26-28 (packet
# pages 111-114), which places the measure and states what it changes,
# Ordinance No. O-26-1427 (pages 115-141), the measure's full text, and
# the argument in favor (page 142), the draft the Council approved to be
# signed by its members, with the measure letter not yet filled in; the
# county's list names the five Council members as its filers. The
# packet's resolution is the unsigned draft, its vote left blank; its
# ballot question matches the county's word for word. The staff report's
# own pages are the City's case and are not cited. No impartial analysis
# was gathered; the revenue figure is the ballot question's.

