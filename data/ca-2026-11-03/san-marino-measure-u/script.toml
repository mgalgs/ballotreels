# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; what the tax is charged on, its
# rate and end date today, and how the measure reached the ballot; what
# would change (the rate, no end date, where the money goes, the vote it
# needs); the revenue as the impartial analysis gives it; both sides;
# what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". The card, title and chart
# title carry it.
#
# The ballot question says "extending the currently existing utility
# users tax at a rate of 6 percent"; the resolution placing the measure
# says it would "increase the tax rate for the UUT from 5% to 6%" and
# delete the repeal date of March 31, 2027, as the City Attorney's
# impartial analysis does. The script says both, in the opening and in
# the today and change lines. The
# tax's history (three voter renewals, the 2015 cut from 6 to 5 percent)
# is told only by the argument in favor, so it is left to that side
# (STANDARD.md 6.3) and not narrated. What the measure does comes from
# the impartial analysis, the resolution and the ordinance; the fiscal
# line gives the City's revenue estimate as the analysis reports it.
#
# The card quotes the Los Angeles County Registrar-Recorder/County
# Clerk's list "Measures Appearing on the Ballot": the City's heading,
# the vote needed and the ballot question, which has no yes or no
# sentences, so the card has no boxes. The vote lines take the two
# meanings from the question and the resolution, and both highlight the
# same phrase.
#
# The argument in favor is cited from the Registrar's sample ballot copy,
# signed by the five Council members the county's list names; it matches
# the draft in the Council's agenda packet, so the yes line is unchanged.
# The yes side names no one. The list
# says "Opponents: None submitted.", so the no side says plainly that no
# argument against was submitted, citing the list (filed = false). Its
# clause on what the list records balances the yes line's length
# without a further claim.
#
# The $2.62 million a year is the City's estimate as the impartial
# analysis reports it (the ballot question states it too). No archived
# official document states the City's general fund budget to give it a
# scale (STANDARD.md 6.5; left open, under [[question]]): the argument's
# "approximately 6% of the City's General Fund" is that side's claim.

contest = "ca-2026-11-03-san-marino-measure-u"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "U"
title = "CITY OF SAN MARINO"
origin = "VOTE PASSAGE – Majority Vote 50%+1"
summary = "SAN MARINO SERVICE PRESERVATION MEASURE. To maintain existing funding which supports essential San Marino services including: police, fire, paramedic, emergency preparedness, repairing streets and sidewalks and other City infrastructure, providing youth and senior programs, and general government use; shall the City of San Marino measure be adopted extending the currently existing utility users tax at a rate of 6 percent, raising $2,620,000 annually, until ended by voters?"

[[section]]
id = "what"
heading = "Measure U"

[[section.line]]
text = "Measure U asks the voters of this city whether to extend the utility users tax with no end date, and raise its rate from 5 to 6 percent."
sources = ["ballot-question", "resolution"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["extending the currently existing utility users tax at a rate of 6 percent"]

[[section]]
id = "today"
heading = "The tax today"

[[section.line]]
id = "charged"
text = "The tax is charged on telecommunications, video, electricity, gas and water service."
sources = ["impartial-analysis", "ordinance"]

[section.line.visual]
kind = "illustration"
name = "utility-bills"

[[section.line]]
id = "today-rate"
text = "Today the rate is 5 percent, and the tax is set to end on March 31, 2027."
sources = ["impartial-analysis", "resolution"]

[section.line.visual]
kind = "illustration"
name = "end-date"

[[section.line]]
text = "The City Council placed Measure U on the ballot."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "city-council-chamber"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "rate"
text = "Measure U would raise the rate to 6 percent."
sources = ["impartial-analysis", "resolution", "ordinance"]

[section.line.visual]
kind = "bars"
title = "Utility users tax rate in San Marino"
source = "resolution"
unit = "%"
labels = ["Today", "With Measure U"]
values = [5, 6]

[[section.line]]
id = "end"
text = "Measure U would remove the end date, so the tax would last until ended by voters."
sources = ["impartial-analysis", "resolution", "ordinance"]

[section.line.visual]
kind = "illustration"
name = "hourglass-plans"

[[section.line]]
id = "general"
text = "As a general tax, the money would go to the general fund, for the usual expenses of the city."
sources = ["impartial-analysis", "ordinance", "resolution"]

[section.line.visual]
kind = "illustration"
name = "state-budget"

[[section.line]]
text = "Measure U needs a majority yes vote to pass."
sources = ["impartial-analysis", "resolution", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "fiscal"
heading = "What the impartial analysis says"

[[section.line]]
id = "revenue"
text = "The city attorney's impartial analysis says the city estimates about $2.62 million a year in revenue."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "save-more"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say the tax has funded police, fire and other services for decades, and renewing it avoids further cuts to core services."
sources = ["argument-for"]
basis = ["a critical source of revenue which has supported San Marino services for decades, will continue to reliably fund services such as our Police Department, Fire Department, emergency preparedness", "the core functions we benefit from today that are most essential to our community will not have to be reduced further"]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Funds police, fire and more", "Avoids further service cuts"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "The official county list of measures, which names who filed each argument, says that no argument against Measure U was submitted."
sources = ["measure-list"]

[section.line.visual]
kind = "list"
source = "measure-list"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote extends the utility users tax at 6 percent, until ended by voters."
sources = ["ballot-question", "resolution"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["extending the currently existing utility users tax at a rate of 6 percent"]

[[section.line]]
text = "A no vote rejects the extension, and the tax would end on March 31, 2027."
sources = ["ballot-question", "resolution"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["extending the currently existing utility users tax at a rate of 6 percent"]

[[question]]
ask = "Is this a new tax, and what does it apply to?"
lines = ["charged", "today-rate"]

[[question]]
ask = "Would the rate go up?"
lines = ["today-rate", "rate"]

[[question]]
ask = "What happens if the measure fails?"
lines = ["today-rate"]

[[question]]
ask = "How big is $2.62 million a year next to the city budget?"
unanswered = true
