# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks; the business license tax today and where its money goes; what
# would change (gross receipts instead of employees, the new rates) and
# what it needs to pass; the impartial analysis's revenue estimate; one
# line per side; what a vote does.
#
# The guide prints no fiscal analysis or tax rate statement; the one
# revenue estimate is the City Attorney's, in the ballot question and the
# Impartial Analysis. No archived source states Albany's General Fund
# budget, so the $600,000 has no scale (STANDARD.md 6.5; left open; the
# rebuttal to the argument against gives a budget figure, but an
# argument is not a source for the scale). The page prints no subject
# heading over the ballot question, so the card's title is the page's
# own head, the city's name.
#
# The guide prints an argument on each side and a rebuttal to each. Each
# side's line takes its own argument's lead points, not the rebuttals'.

contest = "ca-2026-11-03-albany-measure-r"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide-page"
number = "R"
title = "CITY OF ALBANY"
origin = "On July 20, 2026, the City Council voted to place Measure “R” on the November 3, 2026 General Municipal Election ballot."
summary = "Shall the measure supporting City of Albany general services, such as fire protection, public safety, environmental and community service programs, by increasing the City's business license tax to those rates specified in the measure, levying the tax upon business gross receipts instead of number of employees, and updating local tax collection procedures, providing an estimated additional $600,000 annually, until ended by voters, with all funds remaining local which cannot be taken by Sacramento be adopted?"
yes = "A “yes” vote on Measure “R” will approve this amendment to the City’s business license tax code."
no = "A “no” vote on Measure “R” will not approve this amendment to the City’s business license tax code."

[[section]]
id = "what"
heading = "Measure R"

[[section.line]]
text = "City of Albany Measure R asks Albany voters whether to raise the business license tax and base it on what a business takes in."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["levying the tax upon business gross receipts instead of number of employees"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Today, businesses in Albany pay a yearly license tax set at a flat rate or by their average number of employees."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "city-storefronts"

[[section.line]]
text = "The money goes to the General Fund and may pay for any city expense."
sources = ["guide-page"]

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "Under Measure R, a business taking in up to $200,000 a year would pay a flat $50 or $200."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "special-tax"

[[section.line]]
text = "Above $200,000, retail businesses would pay $1 for each $1,000 they take in, and most other businesses $5."
sources = ["guide-page"]

[[section.line]]
text = "Residential landlords would pay $120 per rental unit, and Measure R needs a majority of Albany voters to pass."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "ballot-box"

[[section]]
id = "fiscal"
heading = "What the impartial analysis says"

[[section.line]]
text = "The City Attorney's analysis estimates the new rates would raise an additional $600,000 a year, starting in 2027."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say the old tax charges many small businesses as much as larger ones, and Measure R lowers it for most businesses."
sources = ["arguments"]
basis = ["This outdated structure requires many small businesses to pay the same amount of tax as larger businesses with far greater revenue.", "With this restructuring, Measure R lowers the tax for more than seven out of ten retail and service businesses."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Small firms now pay as much as large", "Lowers the tax for most businesses"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say taxing gross receipts ignores costs like rent and payroll, so low-margin businesses like grocery stores would pay a much higher tax."
sources = ["arguments"]
basis = ["It taxes, not the money that you can take home, but all of the incoming revenue to your business without the ability to make deductions for rent, inventory, payroll, healthcare benefits and overhead, including utilities.", "will end up paying a much higher tax on their actual net income."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Ignores rent, payroll and other costs", "Low-margin stores pay far more"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote approves these changes to the business license tax."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["will approve"]

[[section.line]]
text = "A no vote does not approve these changes to the business license tax."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["will not approve"]
