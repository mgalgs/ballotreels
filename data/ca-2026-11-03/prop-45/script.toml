# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; the review today; the tighter time limits and the narrower
# court review; the analyst's early costs and the uncertain longer term; one point per side; what a vote does.

contest = "ca-2026-11-03-prop-45"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "quick-reference"
number = "45"
title = "MODIFIES ENVIRONMENTAL REVIEW FOR CERTAIN PROJECTS. INITIATIVE STATUTE."
origin = "Put on the Ballot by Petition Signatures"
summary = "Amends California Environmental Quality Act (CEQA) to expedite environmental review for certain projects (including most housing, transportation, water, and health projects) by setting deadlines to complete environmental review and resolve lawsuits challenging project approvals. Fiscal Impact: Initial costs for state and local governments, likely in the high tens of millions of dollars—potentially exceeding $100 million—annually, partly covered by fees. Uncertain, potentially more significant positive or negative longer-term fiscal effects."
yes = "A YES vote on this measure means: Certain public and private projects would be eligible for new project review and court challenge procedures. For example, new procedures would tighten time limits for environmental review and reduce the scope of what courts can consider when reviewing legal challenges."
no = "A NO vote on this measure means: Public and private projects would continue to use existing project review and court challenge procedures."

