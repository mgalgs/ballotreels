# Archived sources for Town of Yountville Measure Y, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# Napa County's Voter Information Guide could not be fetched
# (napacounty.gov answers plain requests with a 403), so these are the
# Town of Yountville's own copies from its Measure Y page. The ballot
# question is quoted from the Town Clerk's June 16, 2026 staff report,
# which the Town's page labels "Staff report with official ballot
# language"; the adopted Resolution No. 26-4427 was not retrieved. The
# Town Attorney's impartial analysis is the measure's neutral
# explanation, the kind a state's attorney general's explanatory
# statement is. No full text was posted beyond the question, and no tax
# rate statement or fiscal analysis applies (not a tax).
#
# The impartial analysis and the argument in favor are scans with no
# text layer. Their words were typed from the page images into
# sources/*-transcription.txt, each naming the PDF and URL it copies;
# those sources point at the transcription, and their url at the scan.
#
# The Town posts no argument against and no rebuttals; whether any was
# filed is not confirmed against the printed county guide.

