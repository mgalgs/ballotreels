# Archived sources for San Francisco Proposition B, 2026-11-03 general
# election (sources/sources.md). San Francisco is a consolidated city and
# county, so its propositions are countywide: the division is the
# county. "page" is the Voter Information Pamphlet & Sample Ballot's
# printed page number (the PDF's page less 2).
#
# The pamphlet's impartial materials are the Ballot Simplification
# Council's digest and the Controller's Statement, on one cut of pages.
# The Controller's Statement on B gives no General Fund total; the one on
# Proposition C, on the pamphlet's page 77, does ("approximately $7
# billion General Fund sources"), and is archived here as
# sources/prop-c-controller-statement.pdf (a copy of C's own cut) for the
# scale of B's costs (STANDARD.md 6.5). The paid arguments (pages 74 to
# 77) are not cited.

