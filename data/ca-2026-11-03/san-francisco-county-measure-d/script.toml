# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks; the four ways a measure reaches the ballot today, and what a
# petition takes; what would change, in the digest's order; the
# Controller's finding; one line per side; what a vote does.
#
# The Controller's Statement prints dollar figures only as examples (a
# pamphlet page, a special election) of savings it says cannot be
# determined, so the fiscal line gives its finding alone. The supporters'
# "longest and most confusing ballots" and the opponents' cost of
# gathering signatures stay in the sides (STANDARD.md 6.3).

contest = "ca-2026-11-03-san-francisco-county-measure-d"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "digest"
number = "D"
title = "Changes to Ballot Measure Process"
origin = "On July 23, 2026, the Department of Elections certified that the initiative petition calling for Proposition D to be placed on the ballot had a sufficient number of valid signatures to qualify the measure for the ballot."
summary = "Shall the City amend the Charter to increase the requirements for signature initiatives from 2% to 8% of registered voters in San Francisco (currently from about 10,600 to about 42,500 signatures), increase the requirements for calling special elections, allow signature initiatives to be withdrawn before an election, and remove the ability of a minority of Board of Supervisors members or the Mayor to place measures on the ballot?"
yes = "If you vote “yes,” you want to increase the requirements for signature initiatives from 2% to 8% of registered voters (currently from about 10,600 to about 42,500 signatures), increase the requirements for special elections, allow signature initiatives to be withdrawn, and remove the ability of a minority of Board members or the Mayor to place measures on the ballot."
no = "If you vote “no,” you do not want to make these changes."

[[section]]
id = "what"
heading = "Proposition D"

[[section.line]]
text = "San Francisco Proposition D asks voters whether to raise the requirements for putting measures on the city ballot."
sources = ["digest"]

[section.line.visual]
kind = "page"
source = "digest"
highlight = ["Shall the City amend the Charter"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Today, a measure can reach the ballot by a vote of the Board of Supervisors, by four supervisors, by the mayor alone, or by petition."
sources = ["digest"]

[section.line.visual]
kind = "illustration"
name = "ballot-box"

[[section.line]]
text = "A petition needs signatures from 2 percent of registered voters, about 10,600 people."
sources = ["digest"]

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "Proposition D would raise the petition requirement to 8 percent of registered voters, about 42,500 signatures."
sources = ["digest"]

[section.line.visual]
kind = "bars"
title = "Signatures a petition needs"
source = "digest"
unit = ""
labels = ["Today", "Proposition D"]
values = [10600, 42500]

[[section.line]]
text = "Proposition D would end the power of four supervisors, or of the mayor alone, to place a measure on the ballot."
sources = ["digest"]

[section.line.visual]
kind = "illustration"
name = "legislative-chamber"

[[section.line]]
text = "Proposition D would also let petitions be withdrawn, and raise the bar for calling a special election."
sources = ["digest"]

[[section]]
id = "fiscal"
heading = "What it would cost"

[[section.line]]
text = "The City Controller says Proposition D would have a minimal impact on the cost of government."
sources = ["controller"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Proposition D gives more voters a voice, since a minority of supervisors or the mayor alone can put anything on the ballot."
sources = ["arguments"]
basis = ["PROPOSITION D GIVES MORE VOTERS A VOICE ON WHAT APPEARS ON BALLOTS.", "Currently a minority of supervisors, just 2% of voters or the mayor acting alone, can throw anything on the ballot without public input, transparency or proven community support."]

