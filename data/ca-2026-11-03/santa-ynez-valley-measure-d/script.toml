# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; how a school bond is repaid and what it
# needs to pass; what the money may pay for; the district's tax rate
# statement; one line per side; what a vote does.
#
# The card quotes the ballot label from the guide's sample ballot, which
# prints plain BONDS-YES and BONDS-NO boxes and no yes/no lines. So the
# card has no YES/NO boxes, its origin is the impartial analysis's
# sentence placing the measure, the vote lines give the analysis's
# meaning, and both highlight the same phrase of the label. "Counsel" is
# heard as "Council" (standard/speakability.txt), so the narration says
# "the impartial analysis".
#
# The bond total and the debt service are repaid from a tax on property
# in the district, and no archived source states the district's budget,
# so they have no budget scale (STANDARD.md 6.5; left open, as for Dixon
# Unified's Measure U). The fiscal line gives the statement's average
# rate beside its highest, as it prints both, and writes its "2060-61"
# in full (standard/speakability.txt). The school's age, its portable
# classrooms, the state matching funds, the bar on paying salaries from
# the bonds, and the oversight committee and audits are in the
# supporters' argument, so the neutral sections leave them out
# (STANDARD.md 6.3); the card quotes the label's "with independent
# audits/ oversight" as printed.
#
# No argument against Measure D was filed. The no side says so plainly;
# its section is marked filed = false.

contest = "ca-2026-11-03-santa-ynez-valley-measure-d"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "D"
title = "Santa Ynez Valley Union High School Quality Education/ Career Training Measure."
origin = "This measure was placed on the ballot by the Board of Education of the Santa Ynez Valley Union High School District, which is the governing board of the District."
summary = "To repair/ upgrade aging classrooms, labs, instructional technology, career training and school facilities to support college/ career readiness in math, science, technology, engineering, and skilled trades; fix roofs, plumbing, HVAC, electrical systems; and improve school safety/ security, shall Santa Ynez Valley Union High School District's measure authorizing $80,000,000 in bonds at legal rates be adopted, levying $22/ $100,000 assessed value ($4,200,000 annually) while bonds are outstanding, with independent audits/ oversight and all funds locally controlled?"

[[section]]
id = "what"
heading = "Measure D"

[[section.line]]
text = "Measure D asks the voters of this high school district whether to approve $80 million in school bonds."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["authorizing $80,000,000 in bonds"]

[[section]]
id = "today"
heading = "How a school bond works"

[[section.line]]
text = "The district would sell the bonds and repay them from property taxes, on top of the taxes owners pay now."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "bond-certificates"

[[section.line]]
text = "Measure D needs 55 percent of the vote to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "projects"
text = "The money would go to listed projects, such as upgrading classrooms, labs and career training facilities, and fixing roofs, plumbing and electrical systems."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "school-workshop"

[[section]]
id = "fiscal"
heading = "What the tax statement says"

[[section.line]]
id = "tax-rate"
text = "The district's tax rate statement estimates an average tax of $21.73 per $100,000 of assessed value, and at most $23.38, through 2060-2061."
sources = ["tax-statement"]

[section.line.visual]
kind = "bars"
title = "Estimated tax per $100,000 of assessed value"
source = "tax-statement"
unit = ""
labels = ["Average", "Highest"]
values = [21.73, 23.38]

[[section.line]]
text = "The statement estimates the total to repay, with interest, at about $142.1 million."
sources = ["tax-statement"]

[section.line.visual]
kind = "illustration"
name = "debt-payments"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say the high school was built ninety years ago, and its 27 portable classrooms over 25 years old are falling apart."
sources = ["arguments"]
basis = ["but it was built in 1937 -- ninety years ago.", "SYVUHS has 27 portable classrooms that are over 25 years old and are falling apart."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["A high school built in 1937", "27 portable classrooms falling apart"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure D was filed, so the county voter guide prints only the argument in favor of the measure."
sources = ["arguments"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote is in favor of letting the district issue up to $80 million in bonds."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["authorizing $80,000,000 in bonds"]

[[section.line]]
text = "A no vote is against letting the district issue the bonds."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["authorizing $80,000,000 in bonds"]

[[question]]
ask = "What would the bond money pay for?"
lines = ["projects"]

[[question]]
ask = "How much would property owners pay?"
lines = ["tax-rate"]

[[question]]
ask = "How big is $80 million next to the district's yearly budget?"
unanswered = true
