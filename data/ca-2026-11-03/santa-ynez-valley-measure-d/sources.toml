# Archived sources for Santa Ynez Valley Union High School District
# Measure D, 2026-11-03 general election (sources/sources.md). Every id
# here may be cited by script.toml. `kind` must be one the standard
# allows (docs/STANDARD.md, section 1).
#
# Santa Barbara County Elections prints each ballot type's County Voter
# Information Guide as one PDF; pages 26 to 31 (impartial analysis, tax
# rate statement, argument in favor, full text) and 36 to 37 (sample
# ballot) of Ballot Type 40 were cut into one excerpt, which backs every
# source here. The ballot labels the measure "Measure D2026"; the project
# names it by its bare letter. County Counsel's impartial analysis is the
# measure's neutral explanation; the district's Tax Rate Statement is its
# fiscal statement. No argument against was filed, and no rebuttals are
# printed.

[contest]
id = "ca-2026-11-03-santa-ynez-valley-measure-d"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/school_district:santa_ynez_valley_union_high_school_district"
kind = "measure"
title = "Santa Ynez Valley Union High School District Measure D: School Facility Bonds"

