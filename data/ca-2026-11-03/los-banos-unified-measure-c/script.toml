# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; how a school bond is repaid and what it needs
# to pass; what the money may pay for; the district's tax rate
# statement; one line per side; what a vote does. The same shape as
# Calaveras Unified Measure A.
#
# No name of the district, county or schools is narrated (the narrator
# mispronounces them): the opening says "the voters of this school
# district", and the supporters' line says "district schools". The card,
# title and chart titles carry the names. "Counsel" is heard as
# "Council" (standard/speakability.txt), so the narration says
# "impartial analysis" only.
#
# The card quotes the ballot question as Merced County Elections posts
# it, with blank Yes and No lines and no yes/no sentences, under its own
# heading (the district's name; "MEASURE C" beside SUMMARY). So the card
# has no boxes; the vote lines give the impartial analysis's own
# meanings, and both highlight the same phrase of the question.
#
# The bond total and the debt service are repaid from a tax on property
# in the district, and no archived source states the district's budget,
# so they have no budget scale (STANDARD.md 6.5; left open). The tax
# statement gives one rate, $32.00 per $100,000, as both its average and
# its highest, every year from 2027-2028 through 2059-2060, so one line
# says it. The bar on salaries, the audits and oversight, and the
# overcrowding and aging buildings are in the supporters' argument; the
# neutral sections give only the projects the ballot question lists, as
# the question itself states them, and leave the rest to that side
# (STANDARD.md 6.3).
#
# No argument against Measure C was filed: the county posts none, and
# its List of Ballot Measures shows none. The no side says so plainly;
# its section is marked filed = false.

contest = "ca-2026-11-03-los-banos-unified-measure-c"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "C"
title = "LOS BANOS UNIFIED SCHOOL DISTRICT"
origin = "MEASURE C"
summary = "In order to repair/upgrade aging classrooms, science labs, career technology and school facilities to support college/career readiness in math, science, technology, arts, engineering, and skilled trades; fix deteriorating roofs, plumbing, HVAC, and electrical systems; and construct school facilities/classrooms to relieve overcrowding; shall Los Banos Unified School District’s measure authorizing $99,000,000 in bonds at legal rates be adopted, levying approximately $32/$100,000 assessed value ($5,000,000 annually) while bonds are outstanding, with independent audits/oversight and local control?"

[[section]]
id = "what"
heading = "Measure C"

[[section.line]]
text = "Measure C asks the voters of this school district whether to approve $99 million in school bonds."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["authorizing $99,000,000 in bonds"]

[[section]]
id = "today"
heading = "How a school bond works"

[[section.line]]
id = "repaid"
text = "The district would sell the bonds and repay them from a tax on property in the district."
sources = ["tax-statement", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "bond-certificates"

[[section.line]]
text = "Measure C needs 55 percent of the vote to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "projects"
text = "The ballot question lists projects such as upgrading classrooms and labs, fixing roofs and plumbing, and building classrooms to relieve overcrowding."
sources = ["ballot-question"]

[section.line.visual]
kind = "illustration"
name = "school-classroom"

[[section]]
id = "fiscal"
heading = "What the tax statement says"

[[section.line]]
id = "tax-rate"
text = "The district's tax rate statement estimates $32 a year per $100,000 of assessed value, through 2059-2060."
sources = ["tax-statement", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "debt-payments"

[[section.line]]
id = "total"
text = "The statement estimates the total to repay, with interest, at about $178 million."
sources = ["tax-statement"]

[section.line.visual]
kind = "bars"
title = "Measure C, in dollars"
source = "tax-statement"
unit = ""
labels = ["Bonds", "Total to repay"]
values = [99000000, 177966209]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say many district schools are 50 to over 100 years old, and new classrooms are needed to relieve severe overcrowding."
sources = ["argument-for"]
basis = ["many Los Banos schools were built 50-100+ years ago", "Additional classrooms and facilities are needed to relieve severe overcrowding."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Many schools 50 to 100+ years old", "Relieves severe overcrowding"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure C was filed with the county elections office, which posts only the argument in favor of the measure."
sources = ["measure-list", "argument-for"]

[section.line.visual]
kind = "list"
source = "measure-list"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote is in favor of authorizing the district to issue and sell up to $99 million in bonds."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["authorizing $99,000,000 in bonds"]

[[section.line]]
text = "A no vote is against authorizing the district to issue and sell the bonds."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["authorizing $99,000,000 in bonds"]

[[question]]
ask = "Who would repay the bonds?"
lines = ["repaid"]

[[question]]
ask = "What would the bond money pay for?"
lines = ["projects"]

[[question]]
ask = "How much would property owners pay, and for how long?"
lines = ["tax-rate", "total"]

[[question]]
ask = "How big is $99 million next to the district's yearly budget?"
unanswered = true
