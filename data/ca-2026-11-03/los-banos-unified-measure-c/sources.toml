# Archived sources for Los Banos Unified School District Measure C,
# 2026-11-03 general election (sources/county-sources.md). Every id here
# may be cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# Merced County Elections (the Registrar of Voters) posts each measure's
# filed documents on its "November 3, 2026, General Election" page, one
# PDF each, all text: for Measure C, the ballot question, the full text,
# County Counsel's impartial analysis, the district's tax rate statement
# and the argument in favor. The bond is $99,000,000, as the county's
# ballot question, the analysis and the tax rate statement all print it
# (an earlier district agenda title said $70,000,000; the county record
# supersedes it). The impartial analysis is the measure's neutral
# explanation; the tax rate statement is its fiscal statement. The
# county posts no argument against and no rebuttals. (Its List of Ballot
# Measures, printed before arguments were due, leaves every argument
# field blank, even this measure's filed argument in favor.)

[contest]
id = "ca-2026-11-03-los-banos-unified-measure-c"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/school_district:los_banos_unified_school_district"
kind = "measure"
title = "Los Banos Unified School District Measure C: School Facilities Bonds"

