# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks; who put it on the ballot and what it needs to pass; what would
# change (when the tax runs, where the money goes, who reviews it); the
# impartial analysis's revenue estimate; one line per side; what a vote
# does.
#
# The guide prints no fiscal analysis or tax rate statement (not a
# bond); the one revenue estimate is the City Attorney's, in the ballot
# label and the Impartial Analysis. No archived source states the
# city's general fund budget, so the $14 million has no scale
# (STANDARD.md 6.5; left open). The card's yes/no lines are the
# analysis's own.
#
# Sides come from the argument in favor and the argument against, not
# the rebuttals.

contest = "ca-2026-11-03-santee-measure-y"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide-page"
number = "Y"
title = "1% GENERAL TRANSACTIONS AND USE (SALES) TAX FOR TEN (10) YEARS"
origin = "On June 24, 2026, the City Council voted to place Measure “Y” on the November 3, 2026 General Municipal Election ballot."
summary = "To provide funding for City of Santee services and infrastructure, such as fixing streets and potholes; keeping streets, sidewalks, parks and public facilities safe, clean, and well-maintained; repairing / replacing aging infrastructure and stormdrains; local traffic management; fire protection, paramedic, crime prevention, and 911 emergency response, shall City of Santee’s measure establishing a one cent sales tax be adopted, providing approximately $14,000,000 annually for city services for 10 years, with independent audits, citizens’ committee oversight, and all funds locally controlled?"
yes = "A “yes” vote on Measure “Y” will authorize the 1% transactions and use (sales) tax for 10 years."
no = "A “no” vote on Measure “Y” will not authorize the 1% transactions and use (sales) tax for 10 years."

[[section]]
id = "what"
heading = "Measure Y"

[[section.line]]
text = "City of Santee Measure Y asks voters in the city whether to add a one-cent sales tax for 10 years."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["one cent sales tax"]

[[section]]
id = "today"
heading = "How it reached the ballot"

[[section.line]]
