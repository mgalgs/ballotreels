# Archived sources for City of Palos Verdes Estates Measure PVE, 2026-11-03
# general election (sources/la-sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The Los Angeles County Registrar-Recorder/County Clerk's list "Measures
# Appearing on the Ballot" (sources/county-measure-list-excerpt.txt, the
# measure's entry) gives its letter, vote threshold (two-thirds: a special
# tax) and ballot question, which the card quotes, and, on its
# "Supporters: ... Opponents: ..." line, who filed the argument for and
# that no argument against was submitted: the no side cites it as the
# official statement of filing.
#
# The City Attorney's impartial analysis and the argument in favor are
# the Registrar's copies, from its Interactive Sample Ballot. The
# measure's full text was not gathered (the City's site blocks automated
# requests), so the script explains the measure from the analysis and the
# ballot question alone. Both give the same revenue estimate.

[contest]
id = "ca-2026-11-03-palos-verdes-estates-measure-pve"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:palos_verdes_estates"
kind = "measure"
title = "City of Palos Verdes Estates Measure PVE: Extending and Raising the Police Parcel Tax for 6 Years"

