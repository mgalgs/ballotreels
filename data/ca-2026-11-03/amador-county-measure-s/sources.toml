# Archived sources for Amador County Measure S, 2026-11-03 general
# election (sources/county-sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# Amador County Elections posts each measure's documents as separate PDFs
# on its "2026 General Election" page: Measure S's ballot question (which
# also lists the supporter who signed the argument in favor and
# "Opponents: None submitted"), County Counsel's impartial analysis, the
# argument in favor, and the Board of Supervisors' Resolution No. 26-110
# placing the measure. No separate full text was published: the measure
# re-establishes an existing fee, and the resolution is its text. County
# Counsel's impartial analysis is the measure's neutral explanation; no
# fiscal statement was printed, and the one revenue estimate is the
# ballot question's. The resolution is a scan with no text layer: its
# three pages were typed from the page images into
# sources/county-resolution-transcription.txt, which that source points
# at, its url at the scan.

[contest]
id = "ca-2026-11-03-amador-county-measure-s"
