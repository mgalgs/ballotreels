[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["generating approximately $55,000 annually"]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say abandoned vehicles cause blight and hazards, and without the fee, the program's reserves would run out."
