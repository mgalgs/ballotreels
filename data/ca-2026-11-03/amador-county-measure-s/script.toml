[[section.line]]
id = "uses"
text = "The money could pay only for removing abandoned vehicles, and the State Controller would review the program every year."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "inspection-clipboard"

[[section.line]]
id = "threshold"
text = "Measure S needs two-thirds of the vote to pass."
sources = ["impartial-analysis", "resolution"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "fiscal"
heading = "What it would raise"

[[section.line]]
id = "revenue"
text = "The ballot question estimates the fee would raise about $55,000 a year."
