# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the program and how it is paid
# for (since 1991, renewed every ten years; renewed in 2012, rejected in
# 2022); what would change (the fee for ten years, what it may pay for,
# the yearly review, the vote it needs); the ballot question's revenue
# estimate; one line per side; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this county", and the cities the analysis
# names are "cities included". The card and title carry the names.
# "Counsel" is heard as "Council" (standard/speakability.txt), so the
# narration says "the impartial analysis".
#
# The card quotes Amador County Elections' Measure S Question page: its
# heading as printed (with its stray "OF"), "MEASURE S", and the ballot
# question. The page's "Supporters: ... Opponents: None submitted" line
# is left off the card (SCRIPT-FORMAT.md, the card); the no side says
# it. The page prints "Yes" and "No" with no sentences, so the vote lines
# give the impartial analysis's meanings and both highlight the
# question's same phrase.
#
# The analysis's own words set the background: the fee is the
# authority's only funding, and voters renewed it in 2012 and rejected it
# in 2022. That the authority's reserves would run out without it, the
# vehicles it has removed, and the harm abandoned vehicles do are the
# supporters' points, so they stay in the yes side (STANDARD.md 6.3).
#
# No fiscal statement was printed; the fiscal line gives the ballot
# question's estimate, attributed to it. No archived source states the
# County's general fund budget, so the $55,000 has no scale (STANDARD.md
# 6.5; left open, under [[question]]). The fee per vehicle is a
# per-person amount, exempt.
#
# The ballot question page says "Opponents: None submitted", so the no
# side says plainly that no argument against was submitted (filed =
# false, STANDARD.md 2.5).

contest = "ca-2026-11-03-amador-county-measure-s"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "S"
title = "RENEWAL OF THE ABANDONED VEHICLE ABATEMENT OF PROGRAM AND FEES."
origin = "MEASURE S"
summary = "To continue addressing community blight by removing and disposing abandoned and wrecked, or dismantled vehicles, shall the Abandoned Vehicle Abatement Program and the associated vehicle registration fee of $1 per vehicle and $3 per certain commercial vehicles be re-established for a ten year period, generating approximately $55,000 annually to be used exclusively for the removal and disposal of abandoned and wrecked vehicles throughout the county and incorporated cities?"

[[section]]
id = "what"
heading = "Measure S"

[[section.line]]
text = "Measure S asks the voters of this county whether to bring back a vehicle registration fee that pays to remove abandoned vehicles."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["the associated vehicle registration fee of $1 per vehicle and $3 per certain commercial vehicles be re-established"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "authority"
text = "Since 1991, a county authority has removed abandoned and wrecked vehicles from public and private property, cities included."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "country-road"

[[section.line]]
id = "funding"
text = "Its only funding was a yearly fee on each vehicle registered in the county, which had to be renewed every 10 years."
sources = ["impartial-analysis", "resolution"]

[section.line.visual]
kind = "illustration"
name = "id-card"

[[section.line]]
id = "history"
text = "Voters renewed the fee in 2012, then turned it down in 2022."
sources = ["impartial-analysis", "resolution"]

[section.line.visual]
kind = "timeline"
source = "impartial-analysis"
labels = ["1991", "2012", "2022"]
items = ["The authority is set up", "Voters renew the fee", "Voters turn the fee down"]

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "fee"
text = "Measure S would bring the fee back for 10 years: $1 a vehicle, and $3 for certain commercial vehicles."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "bars"
title = "Yearly fee per vehicle, dollars"
source = "ballot-question"
unit = ""
labels = ["Each vehicle", "Certain commercial vehicles"]
