# Archived sources for City of Cudahy Measure H, 2026-11-03 general
# election (sources/la-sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The Los Angeles County Registrar-Recorder/County Clerk's list "Measures
# Appearing on the Ballot" (sources/county-measure-list-excerpt.txt, the
# measure's entry) gives its letter, vote threshold and ballot question,
# which the card quotes, and, on its "Supporters: ... Opponents: ..."
# line, that two Councilmembers filed the argument for and that no
# argument against was submitted: the no side cites it as the official
# statement of filing.
#
# The City Attorney's impartial analysis and the argument in favor are
# the Registrar's copies, from its Interactive Sample Ballot. The
# measure's full text and the rent stabilization ordinance it protects
# were not gathered (the City's site blocks automated requests), so the
# script explains the measure from the analysis and the ballot question
# alone. Neither gives a cost estimate.

[contest]
id = "ca-2026-11-03-cudahy-measure-h"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:cudahy"
kind = "measure"
title = "City of Cudahy Measure H: Voter Approval to Raise the 3% Rent Increase Cap"

