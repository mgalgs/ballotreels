# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; where the rent law came from and
# how the measure reached the ballot; what the law does today and how
# the Council can change it; what would change (voters for the cap, two
# thirds of the Council for the rest, nothing else); that no official
# document gives a cost estimate; the argument for, and that no argument
# against was submitted; what a vote does.
#
# Only the ballot question, the City Attorney's impartial analysis and
# the argument for were gathered (no full text, no copy of the rent
# law), so the neutral lines are from the question and the analysis
# alone. The argument's figures on renters and average rent are that
# side's and stay in it (STANDARD.md 6.3); they are not used.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". The card shows the name.
#
# The card quotes the measure's entry in the county's list "Measures
# Appearing on the Ballot", which prints no yes/no meanings, so the card
# has no boxes; the vote lines take both meanings from the impartial
# analysis and highlight the same phrase of the question.
#
# Sides: the argument in favor is presented from its text; the county's
# list says "Opponents: None submitted.", and the no side says so
# (filed = false).

contest = "ca-2026-11-03-cudahy-measure-h"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "H"
title = "CITY OF CUDAHY"
origin = "VOTE PASSAGE – Majority Vote 50%+1"
summary = "Cudahy Rent Stabilization Protection Measure To safeguard tenant protections codified under Cudahy Municipal Code Chapter 5.13, including provisions that prevent excessive rent increases and stabilize rents over time while affording landlords reasonable returns, shall voter approval be required for any increase to the 3% maximum ceiling by which rents can be increased annually under Chapter 5.13, and 2/3 approval of the full City Council be required to otherwise amend or repeal Chapter 5.13?"

[[section]]
id = "what"
heading = "Measure H"

[[section.line]]
text = "Measure H asks the voters of this city whether to require their approval to raise the 3 percent cap on yearly rent increases."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["voter approval be required for any increase to the 3% maximum ceiling"]

[[section]]
id = "background"
heading = "How it reached the ballot"

[[section.line]]
id = "origin"
text = "The City Council adopted the rent stabilization law in 2023, and placed Measure H on this ballot."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "city-council-chamber"

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "today-cap"
text = "Today, a landlord may raise the rent on a covered unit once a year, by the change in consumer prices or 3 percent, whichever is lower."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "older-apartments"

[[section.line]]
id = "today-council"
text = "The City Council can amend or repeal the law by a simple majority vote."
sources = ["impartial-analysis"]

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "voters"
text = "Raising the 3 percent cap, or removing it, would need the approval of voters."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "ballot-box"

[[section.line]]
id = "two-thirds"
text = "Any other change, including a cap below 3 percent, would need two-thirds of the full City Council."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section.line]]
id = "same-rules"
text = "The rent limits, exemptions and procedures in the law would stay as they are."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "law-book"

[[section]]
id = "fiscal"
heading = "What it would cost"

[[section.line]]
text = "The county Registrar's list of measures and the impartial analysis do not include a cost estimate for the measure."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"
stamp = "None reported"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say the measure protects renters from sudden rent hikes, and keeps a future council majority from weakening or repealing the rules."
sources = ["argument-for"]
basis = ["including protecting renters from sudden, extreme rent hikes", "protect stricter rules from being repealed or weakened by a future City Council majority."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Protects renters from sudden hikes", "Rules safe from a future majority"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "The official county list of measures for this election says that no argument against Measure H was submitted, by any group or person."
sources = ["arguments-filed"]

[section.line.visual]
kind = "list"
source = "arguments-filed"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote requires voter approval to raise the 3 percent cap, and two-thirds of the council for other changes."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["voter approval be required for any increase to the 3% maximum ceiling"]

[[section.line]]
text = "A no vote leaves the rent stabilization law as it is."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["voter approval be required for any increase to the 3% maximum ceiling"]

[[question]]
ask = "What does the rent law allow today?"
lines = ["today-cap", "today-council"]

[[question]]
ask = "Would rents or the cap change right away?"
lines = ["same-rules"]

[[question]]
ask = "Could the council still lower the cap?"
lines = ["two-thirds"]
