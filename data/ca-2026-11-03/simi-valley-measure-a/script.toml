# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the tax today; how it reached
# the ballot; what would change (the new rate, a general tax, no end
# date) and the vote it needs; the ballot question's revenue figure;
# both sides, neither of which has an archived argument; what a vote
# does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". The card and title carry the
# name.
#
# No impartial analysis was archived: what Measure A does comes from the
# ordinance (Exhibit A, the full text) and Resolution No. 2026-25
# placing it, only from what they enact. The services the ballot
# question lists are the City's stated purpose, so the narration
# attributes them to the question. The staff report is cited only for
# the rate today and who pays it. Its reasons, its history of the tax,
# the election's cost and the voter survey are not used. The Council's
# adoption of the resolution is from the June 8 minutes, without its
# tally; the County's August 4 consent item 12 shows the measure
# consolidated with the November 3 election.
#
# The $400,000 a year is the ballot question's figure; no archived
# source states the City's general fund budget to give it a scale
# (STANDARD.md 6.5; left open, under [[question]]).
#
# No argument for or against Measure A was archived. The Council set
# rules for filing arguments (Resolution No. 2026-27), but no document
# gathered says whether any was filed. So the sides do not say none was
# filed: each says none is among the documents gathered (filed = false,
# STANDARD.md 2.5), as for Walnut Creek Measure U.

contest = "ca-2026-11-03-simi-valley-measure-a"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "A"
title = "RESOLUTION NO. 2026-25"
origin = "CITY OF SIMI VALLEY"
summary = "Shall the measure providing funding for general city services in Simi Valley, such as 9-1-1 emergency response, police and crime prevention, keeping streets, sidewalks, and infrastructure safe, clean and well-maintained, and senior citizen services by increasing the City of Simi Valley’s transient occupancy tax rate from 10% to 12% (paid only by hotel/short-term lodging guests), providing approximately $400,000 annually until ended by voters, with independent audits and all money locally controlled, be adopted?"

