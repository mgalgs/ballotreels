# Archived sources for City of Simi Valley Measure A, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The letter A is not confirmed by an archived official record. The
# County of Ventura's measures page and voter guide could not be read
# (both answered a bot challenge), and www.simivalley.org answered HTTP
# 403. The County's records name the City's measure but give no letter;
# the letter is published under the operator's rule for letters every
# checkable one of which matched an official page.
#
# These are the City's files from its Granicus meeting archive, for the
# City Council meeting of June 8, 2026, item 9B: the staff report with
# its attachments, among them Resolution No. 2026-25 placing the
# measure (Attachment A), whose Exhibit A is the ordinance raising the
# transient occupancy tax, and the minutes of that meeting. The copy of
# the resolution archived is the unsigned one in the agenda packet; the
# minutes record that the Council adopted Resolution No. 2026-25. The
# ballot question is quoted from its Section 2 ("the exact form of the
# question"), the vote it needs from its Section 4. No impartial
# analysis, argument or rebuttal was reached: the Council asked the City
# Attorney for an analysis (Resolution No. 2026-26) and set rules for
# arguments (Resolution No. 2026-27), and no filed argument is archived.
#
# The staff report is City staff material. It is cited only for plain
# facts it states (the rate today and who pays it); its reasons for the
# measure, its account of the tax's history, its election cost and the
# voter survey it attaches (Attachment E) are not used.
#
# The County of Ventura's Board of Supervisors approved, as consent item
# 12 on August 4, 2026, the requests of the agencies in Exhibit 1 to
# consolidate their elections with the November 3, 2026 General
# Election; Exhibit 1 lists the City of Simi Valley among the six local
# measures. They are cited for the fact that the measure is on Ventura
# County's November 3 ballot.

