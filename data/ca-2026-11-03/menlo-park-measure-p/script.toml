# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and whose measure it is; who decides on the downtown parking
# plazas today, and the housing plan that names them; what would need a
# public vote, what would not, and from when; that no cost estimate is
# published; one line per side; what a vote does.
#
# The card quotes the ballot question from Resolution No. 7008, which
# prints "Should", not "Shall"; it is quoted as printed. The resolution
# prints no yes/no lines (the City Attorney's analysis has them, in
# another document), so, as for Los Angeles County Measure A, the card has
# no YES/NO boxes, the vote lines give the analysis's meanings, and both
# highlight the one phrase of the question they turn on.
#
# No fiscal analysis is among the measure's published documents, so the
# fiscal line says so. The supporters' "tens of millions" for garages and
# the opponents' "millions in legal fees" are city costs with no archived
# budget total (STANDARD.md 6.5), so each side's line keeps its point
# without the figure. Both arguments say "Measure X" or "Measure __"
# (filed before the letter was assigned); the script says Measure P.
# "City's" and "county's" are heard as plurals
# (standard/speakability.txt), so the narration says neither.

contest = "ca-2026-11-03-menlo-park-measure-p"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "P"
title = "Downtown Parking Plazas Ordinance Initiative"
origin = "submitting to the voters of the City of Menlo Park a citizen initiative"
summary = "Should the measure, which prohibits the City of Menlo Park from making changes to City-owned downtown parking lot properties, including selling, leasing, or conveying any of the properties, authorizing a new use such as housing development on any of the properties, or modifying, altering, or constructing improvements on any of the properties, if such change would diminish parking availability, access or convenience, unless the voters pass another ballot measure to approve the change, be adopted?"

[[section]]
id = "what"
heading = "Measure P"

[[section.line]]
text = "Menlo Park Measure P asks city voters whether to require a public vote before changes that reduce parking on downtown city lots."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["City-owned downtown parking lot properties"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "plazas"
text = "Today, the City Council decides how city land is used, including eight downtown parking plazas."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "downtown-parking-lot"

[[section.line]]
id = "housing-plan"
text = "The housing plan of Menlo Park calls for at least 345 affordable homes on some of these plazas."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "home-building"

[[section.line]]
text = "A citizen petition put Measure P on the ballot."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "ballot-box"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "public-vote"
text = "Measure P would require voter approval to sell or lease a plaza, or to build on one in a way that permanently reduces parking."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["unless the voters pass another ballot measure to approve the change"]

[[section.line]]
id = "housing-vote"
text = "That would include the affordable homes, if they reduced parking."
sources = ["impartial-analysis"]

[[section.line]]
text = "Repairs, and work that keeps or adds parking, would need no vote."
sources = ["impartial-analysis"]

[[section.line]]
text = "Measure P would reach back to May 15, 2025, and only voters could repeal it."
sources = ["impartial-analysis"]

[[section]]
id = "fiscal"
heading = "What the documents say"

[[section.line]]
id = "no-estimate"
text = "The published measure documents of San Mateo County do not include a cost estimate for the measure."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"
stamp = "None reported"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Measure P gives voters a say before plazas become high-rises, and the city could be on the hook for garages."
sources = ["argument-for"]
basis = ["Vote YES! on Measure __ to give voters a say before the City Council can permanently convert downtown parking plazas into high-rise developments.", "Menlo Park could be on the hook for tens of millions to build public garages."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Voters get a say before high-rises", "City could pay to build garages"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say Measure P blocks new garages with affordable homes above, and likely breaks state law, risking legal fees and delay."
sources = ["argument-against"]
basis = ["If approved, Measure X would block Menlo Park's ability to replace aging surface parking lots with modern garages and add affordable homes above.", "Independent analysis finds it likely violates state laws, risking millions in legal fees and years of delay."]

[section.line.visual]
kind = "list"
source = "argument-against"
items = ["Blocks garages with homes above", "Risks legal fees and delay"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote approves Measure P, so these changes to the plazas would need a public vote."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["unless the voters pass another ballot measure to approve the change"]

[[section.line]]
text = "A no vote rejects Measure P, and the City Council keeps deciding how the plazas are used."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["unless the voters pass another ballot measure to approve the change"]

[[question]]
ask = "Which parking lots does Measure P cover?"
lines = ["plazas"]

[[question]]
ask = "What would it mean for the plan to build affordable homes on the plazas?"
lines = ["housing-plan", "housing-vote"]

[[question]]
ask = "What would Measure P cost the city?"
lines = ["no-estimate"]
