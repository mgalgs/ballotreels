# Archived sources for City of Menlo Park Measure P, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1). San Mateo County's Assessor-County Clerk-Recorder &
# Elections (ACRE) posts each document of the measure separately, as the
# City of Menlo Park filed it; no printed voter guide was archived.
#
# The City Attorney's Impartial Analysis is the measure's neutral
# explanation, the kind a state's attorney general's explanatory
# statement is. No fiscal analysis is among ACRE's files (Measure P is
# not a tax measure).
#
# The resolution and both arguments are scans: the resolution's text
# layer misreads words ("ofthe"), and the arguments have none. Each
# source that `check` reads verbatim (the card's ballot question, each
# side's basis) is a transcription of its page, read from the page
# image, in a .txt beside the PDF; the url is the PDF's.

[contest]
id = "ca-2026-11-03-menlo-park-measure-p"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:menlo_park"
kind = "measure"
title = "City of Menlo Park Measure P: Voter Approval for Changes to City-Owned Downtown Parking Lots"

