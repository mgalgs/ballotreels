# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the office today (elected, and
# why the voters decide); what would change (who appoints, from when, at
# whose pleasure, residency, the duties unchanged); no cost estimate; both
# sides, neither of which filed an argument; what a vote does. The same
# shape as City of Livingston Measures T and U.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". The card and title carry it.
#
# The card quotes the ballot question as Merced County Elections posts
# it, with blank Yes and No lines and no yes/no sentences. So the card
# has no boxes; the vote lines give the impartial analysis's own
# meanings, and both highlight the question.
#
# The ordinance's recitals give the City Council's reasons (no contested
# election in a decade, the cost of each election, the skills the job
# needs, residency). With no argument filed on either side, the script
# states what the measure does and leaves the reasons out, as Livingston
# T and U do, so the council's case is not heard with no reply beside it.
#
# No argument for or against Measure V was filed: the county posts none,
# and its List of Ballot Measures shows none. Each side says so plainly
# (filed = false, STANDARD.md 2.5).

contest = "ca-2026-11-03-los-banos-measure-v"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "V"
title = "APPOINTED CITY TREASURER."
origin = "MEASURE V"
summary = "Shall the office of City Treasurer be appointive?"

[[section]]
id = "what"
heading = "Measure V"

[[section.line]]
text = "Measure V asks the voters of this city whether the city treasurer should be appointed instead of elected."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["Shall the office of City Treasurer be appointive?"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Today, the voters of the city elect the city treasurer."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "ballot-box"

[[section.line]]
text = "State law requires the city to have a treasurer, and lets its voters decide whether the office is elected or appointed."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "law-book"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "when"
text = "The City Council would appoint a treasurer when the current term ends, or sooner if the office falls vacant."
sources = ["text", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "city-council-chamber"

[[section.line]]
text = "An appointed treasurer would serve at the pleasure of the council, and would not have to live or vote in the city."
sources = ["text", "impartial-analysis"]

[[section.line]]
id = "duties"
text = "The duties, such as keeping and investing city funds, would not change."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "bank-vault"

[[section]]
id = "fiscal"
heading = "What it would cost"

[[section.line]]
text = "The documents the county posts for Measure V do not include a cost estimate for the measure."
sources = ["measure-list", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"
stamp = "None reported"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"
filed = false

[[section.line]]
text = "No argument for Measure V was filed with the county elections office."
sources = ["measure-list"]

[section.line.visual]
kind = "list"
source = "measure-list"
items = ["No argument for was submitted"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure V was filed with the county elections office."
sources = ["measure-list"]

[section.line.visual]
kind = "list"
source = "measure-list"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote changes the city treasurer from an elected office to an appointed office."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["Shall the office of City Treasurer be appointive?"]

[[section.line]]
text = "A no vote keeps the city treasurer an elected office."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["Shall the office of City Treasurer be appointive?"]

[[question]]
ask = "Who would choose the treasurer, and when?"
