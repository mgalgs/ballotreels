# Archived sources for City of Los Banos Measure V, 2026-11-03 general
# election (sources/county-sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# Merced County Elections (the Registrar of Voters) posts each measure's
# filed documents on its "November 3, 2026, General Election" page, one
# PDF each, all text: for Measure V, the ballot question, the full text
# (the ordinance, Exhibit "A" to City Council Resolution No. 7115) and
# the City Attorney's impartial analysis, which is the measure's neutral
# explanation, the kind a state's attorney general's explanatory
# statement is. Not a tax: no fiscal statement applies. No argument for
# or against was filed: the county posts none for Measure V, and its
# List of Ballot Measures (the election official's record of what was
# filed, printed August 7, 2026) shows none.

