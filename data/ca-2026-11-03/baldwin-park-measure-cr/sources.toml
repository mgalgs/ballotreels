# Archived sources for City of Baldwin Park Measure CR, 2026-11-03 general
# election (sources/la-sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The Los Angeles County Registrar-Recorder/County Clerk's list "Measures
# Appearing on the Ballot" prints each measure's letter, vote threshold and
# ballot question, and says in words who filed the primary arguments
# ("Supporters: ... Opponents: None submitted."). The card quotes the
# ballot question from it (ballot-question), and the sides cite it as the
# Registrar's statement of filing (measure-list). The same excerpt backs
# both.
#
# No impartial analysis and no argument text was staged (the resolution
# directs the City Attorney to write one; no copy was found). The measure
# is explained from the City's Resolution No. 2026-023 and its Exhibit A,
# Ordinance No. 1529. The resolution's pages 1 and 2 are a scan with no
# text layer: they were typed from the page images into
# sources/resolution-transcription.txt, which that source points at. The
# City's FAQ and community presentation are not cited. A general tax has no
# tax rate statement; the one revenue figure is the ballot question's own.

