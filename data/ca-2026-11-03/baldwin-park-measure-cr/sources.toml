# Archived sources for City of Baldwin Park Measure CR, 2026-11-03 general
# election (sources/la-sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The Los Angeles County Registrar-Recorder/County Clerk's list "Measures
# Appearing on the Ballot" prints each measure's letter, vote threshold and
# ballot question, and says in words who filed the primary arguments
# ("Supporters: ... Opponents: None submitted."). The card quotes the
# ballot question from it (ballot-question), and the sides cite it as the
# Registrar's statement of filing (measure-list). The same excerpt backs
# both.
#
# The Registrar's Interactive Sample Ballot prints the City Attorney's
# impartial analysis (the measure's neutral explanation) and the argument
# in favor, saved as HTML, with "NO ARGUMENT AGAINST THIS MEASURE WAS
# SUBMITTED" under the argument. The analysis describes Measure CB's 2022
# retailer tax rates (0.5% medicinal, 4% adult use, adjustable by the
# Council); the resolution states the current rate, 4%, and stays the
# source for it. The measure is also explained from the City's
# Resolution No. 2026-023 and its Exhibit A, Ordinance No. 1529. The
# resolution's pages 1 and 2 are a scan with no text layer: they were
# typed from the page images into sources/resolution-transcription.txt,
# which that source points at. The City's FAQ and community presentation
# are not cited. A general tax has no tax rate statement, and the analysis
# gives no revenue estimate; the one revenue figure is the ballot
# question's own.

