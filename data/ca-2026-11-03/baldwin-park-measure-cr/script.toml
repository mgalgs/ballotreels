# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; the tax the city already charges cannabis
# stores, and why the City Council placed the measure; what would change
# (who would pay, at what rate, where the money goes, when it starts and
# the vote it needs); the one revenue estimate,
# the ballot question's own; one line per side; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the opening
# says "the voters of this city". The card, title and chart title carry it.
# "City's" sounds like "cities" (standard/speakability.txt), so the
# narration says "the city".
#
# The card quotes the Los Angeles County Registrar-Recorder/County Clerk's
# list "Measures Appearing on the Ballot", which prints the ballot question
# with no yes and no sentences, so the card has no boxes and the two vote
# lines highlight the same phrase of the question. The services the
# question lists are on the card, not narrated: the money is a general
# tax's, for any lawful city purpose.
#
# What the measure does comes from the City Attorney's impartial analysis,
# the resolution and the ordinance. The Council's purpose is stated as its
# own, from the resolution's recital (STANDARD.md 6.2). The analysis
# gives no revenue estimate and no fiscal analysis was staged; the fiscal
# line says the $1 million a year is the ballot question's projection. No
# archived official document states the city's general fund budget to
# give it a scale (STANDARD.md 6.5; left open, under [[question]]).
#
# The yes side comes from the filed argument in favor, with its basis:
# all cannabis businesses would pay, not just some, and the money cannot
# be seized. The Registrar's list and the sample ballot say no argument
# against was submitted, so the no side says so plainly, citing the list
# (filed = false).

contest = "ca-2026-11-03-baldwin-park-measure-cr"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "CR"
title = "CITY OF BALDWIN PARK"
origin = "VOTE PASSAGE – Majority Vote 50%+1"
summary = "Good Government Cannabis Reform Measure To fund general city services in Baldwin Park, such as cleaning trash/graffiti, fixing streets/potholes, crime prevention, 911 emergency response, and providing afterschool/youth employment programs, shall the measure applying the City of Baldwin Park's existing 4% cannabis retailing tax rate to non-retail cannabis businesses, providing a projected $1,000,000 annually in additional locally controlled funding until ended by voters, that can't be taken by the state, with public independent audits be adopted?"

[[section]]
id = "what"
heading = "Measure CR"

[[section.line]]
text = "Measure CR asks the voters of this city whether to tax cannabis businesses that are not stores."
sources = ["ballot-question", "ordinance"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["existing 4% cannabis retailing tax rate to non-retail cannabis businesses"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "today-rate"
text = "Today, the city taxes cannabis stores at 4 percent of their gross receipts."
sources = ["resolution"]

[section.line.visual]
kind = "illustration"
name = "cannabis-shop-counter"

[[section.line]]
id = "purpose"
text = "The City Council placed Measure CR on the ballot to tax all cannabis businesses at the same rate, for general city purposes."
sources = ["resolution"]

[section.line.visual]
kind = "illustration"
name = "city-council-chamber"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "who"
text = "Growers, manufacturers, distributors and other cannabis businesses would pay 4 percent of their gross receipts, as stores do."
sources = ["impartial-analysis", "ordinance"]

[section.line.visual]
kind = "bars"
title = "Baldwin Park cannabis business tax, percent of gross receipts"
source = "ordinance"
unit = "%"
labels = ["Stores today", "Others with Measure CR"]
values = [4, 4]

[[section.line]]
id = "general"
text = "As a general tax, the money would go to the general fund, for any lawful city purpose."
sources = ["impartial-analysis", "ordinance"]

[section.line.visual]
kind = "illustration"
name = "state-budget"

[[section.line]]
id = "start"
text = "The tax would start in 2027 and last until ended by voters; it needs a majority yes vote to pass."
sources = ["impartial-analysis", "ordinance", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "end-date"

[[section]]
id = "fiscal"
heading = "What the ballot question says"

[[section.line]]
id = "revenue"
text = "The ballot question itself projects $1 million a year in added funding; no separate fiscal analysis was gathered."
sources = ["ballot-question"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
id = "yes-case"
text = "Supporters say all cannabis businesses would pay, not just some, and the money cannot be seized."
sources = ["argument-for"]
basis = ["It simply updates an existing city ordinance to ensure all cannabis businesses - not just some – are properly paying their fair share for the city services we all expect and deserve!", "By law, NO MONEY can be seized by Los Angeles County, the state or federal government."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["All cannabis businesses pay", "Money cannot be seized"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "According to the county registrar's official list of measures, no argument against Measure CR was submitted."
sources = ["measure-list"]

[section.line.visual]
kind = "list"
source = "measure-list"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote approves the 4 percent tax on cannabis businesses that are not stores."
sources = ["ballot-question", "ordinance"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["existing 4% cannabis retailing tax rate to non-retail cannabis businesses"]

[[section.line]]
text = "A no vote rejects the 4 percent tax on cannabis businesses that are not stores."
sources = ["ballot-question", "ordinance"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["existing 4% cannabis retailing tax rate to non-retail cannabis businesses"]

[[question]]
ask = "Which businesses would pay the tax?"
lines = ["who"]

[[question]]
ask = "Does the city already tax cannabis?"
lines = ["today-rate"]

[[question]]
ask = "What could the money be spent on?"
lines = ["general"]

[[question]]
ask = "When would the tax start and end?"
lines = ["start"]

[[question]]
ask = "How big is $1 million a year next to the city budget?"
unanswered = true

[[question]]
ask = "What do the supporters argue?"
lines = ["yes-case"]
