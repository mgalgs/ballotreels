# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; the tax the city already charges cannabis
# stores, and why the City Council placed the measure; what would change
# (who would pay, at what rate, where the money goes, when it starts and
# the vote it needs); the one revenue estimate,
# the ballot question's own; one line per side; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the opening
# says "the voters of this city". The card, title and chart title carry it.
# "City's" sounds like "cities" (standard/speakability.txt), so the
# narration says "the city".
#
# The card quotes the Los Angeles County Registrar-Recorder/County Clerk's
# list "Measures Appearing on the Ballot", which prints the ballot question
# with no yes and no sentences, so the card has no boxes and the two vote
# lines highlight the same phrase of the question. The services the
# question lists are on the card, not narrated: the money is a general
# tax's, for any lawful city purpose.
#
# No impartial analysis was staged, so what the measure does comes from the
# resolution and the ordinance alone. The Council's purpose is stated as
# its own, from the resolution's recital (STANDARD.md 6.2). No fiscal
# analysis was staged; the fiscal line says the $1 million a year is the
# ballot question's projection. No archived official document states the
# city's general fund budget to give it a scale (STANDARD.md 6.5; left
# open, under [[question]]).
#
# The Registrar's list names the supporters who filed an argument in
# favor, but its text was not staged; the side says only that it was filed
# and is not among the documents gathered, and never guesses what it says.
# The list says in words "Opponents: None submitted.", so the no side says
# plainly that none was submitted, citing the list. Both sides set filed =
# false; their lines are still kept equal in words and close in spoken
# length.

contest = "ca-2026-11-03-baldwin-park-measure-cr"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "CR"
title = "CITY OF BALDWIN PARK"
origin = "VOTE PASSAGE – Majority Vote 50%+1"
summary = "Good Government Cannabis Reform Measure To fund general city services in Baldwin Park, such as cleaning trash/graffiti, fixing streets/potholes, crime prevention, 911 emergency response, and providing afterschool/youth employment programs, shall the measure applying the City of Baldwin Park's existing 4% cannabis retailing tax rate to non-retail cannabis businesses, providing a projected $1,000,000 annually in additional locally controlled funding until ended by voters, that can't be taken by the state, with public independent audits be adopted?"

[[section]]
id = "what"
heading = "Measure CR"

[[section.line]]
text = "Measure CR asks the voters of this city whether to tax cannabis businesses that are not stores."
sources = ["ballot-question", "ordinance"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["existing 4% cannabis retailing tax rate to non-retail cannabis businesses"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "today-rate"
text = "Today, the city taxes cannabis stores at 4 percent of their gross receipts."
