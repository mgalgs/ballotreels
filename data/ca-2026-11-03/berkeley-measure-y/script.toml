# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and of whom; how it reached the ballot and what it needs to pass;
# what would change (the rate and how the money is split);
# the impartial analysis's revenue estimate; one line per side; what a
# vote does.
#
# The guide prints no fiscal analysis or tax rate statement (not a
# bond); the one revenue estimate is the city's, in the ballot question
# and the City Attorney's Impartial Analysis. No archived source states
# the city's general fund budget, so the estimate has no scale
# (STANDARD.md 6.5; left open). The split of the money is the
# analysis's own percentages, in the order it lists them.
#
# The Civic Arts Commission's oversight is argued by both sides (the
# supporters' "strict oversight", the opponents' "no guardrails" and
# Council approval), so the neutral sections leave it to the card's
# question (STANDARD.md 6.3), as are the exemptions, which the
# supporters' rebuttal cites.
#
# The guide prints no yes/no lines for this measure, so, as for Utah, the
# card has no YES/NO boxes, and the two vote lines highlight the one
# phrase of the question they turn on.

contest = "ca-2026-11-03-berkeley-measure-y"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide-page"
number = "Y"
title = "CITY OF BERKELEY MEASURE Y"
origin = "This measure was placed on the ballot by an initiative petition signed by the requisite number of registered voters in the City of Berkeley."
summary = "Shall the measure creating a special parcel tax to fund grants for performing arts organizations, art projects, art organization operational and programmatic expenses and capital projects, community festivals, and administrative costs, with oversight by the City’s Civic Arts Commission, at a rate of $0.07 per square foot of improvements, estimated to generate approximately $6,300,000 annually and $84,800,000 over its twelve-year duration, be adopted?"

[[section]]
id = "what"
heading = "Measure Y"

[[section.line]]
text = "City of Berkeley Measure Y asks voters in the city whether to add a parcel tax for arts grants."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["special parcel tax"]

[[section]]
id = "today"
heading = "How it reached the ballot"

[[section.line]]
text = "Voters signed a petition to put Measure Y on the ballot, and it needs a majority vote to pass."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "ballot-box"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "Property owners would pay a yearly tax on each square foot of buildings, from 2027, for 12 years."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "special-tax"

[[section.line]]
text = "Three-quarters of the money would go to performing arts groups, and the rest to artists, building projects, festivals and running the program."
sources = ["guide-page"]

[section.line.visual]
kind = "share"
title = "How Measure Y's tax would be split"
source = "guide-page"
unit = "%"
labels = ["Performing arts groups", "Artists and arts groups", "Arts building projects", "Community festivals", "Running the program"]
values = [75, 5, 10, 5, 5]

[[section]]
id = "fiscal"
heading = "What the impartial analysis says"

[[section.line]]
text = "The City Attorney's impartial analysis says the city estimates the tax would raise $6.3 million in its first year, and $84.8 million in all."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "income-taxes"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Measure Y preserves the nonprofit theater, music, dance and arts venues that keep Berkeley an arts destination."
sources = ["arguments"]
basis = ["YES on Y preserves Berkeley’s nonprofit performing arts theater, music, dance, and visual arts venues for children, adults, and seniors, maintaining Berkeley as an arts and cultural destination for generations to come."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Preserves nonprofit arts venues", "Supports jobs and the local economy"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say arts groups that weathered the pandemic are now financially stable, and the tax rewards failing business strategies."
sources = ["arguments"]
basis = ["The arts organizations that weathered those years are now financially stable.", "A measure that rewards failing business strategies while leaving distribution open to political influence is bad policy."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Arts groups are financially stable again", "No objective criteria for awarding grants"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote means the parcel tax for arts grants would be created."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["creating a special parcel tax"]

[[section.line]]
text = "A no vote means the parcel tax would not be created."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["creating a special parcel tax"]
