# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks; who sets the purchasing rules and approves contracts today; what
# would change, in the digest's order; the Controller's finding; one line
# per side; what a vote does.
#
# The approval thresholds ($10 million, $25 million, $4.5 million) are
# the size of a contract that needs the board's vote, not money the city
# spends or receives, so they carry no budget share (STANDARD.md 6.5).
# The supporters' contracting costs and corruption cases, and the
# opponents' "concentrate power", stay in the sides (6.3).

contest = "ca-2026-11-03-san-francisco-county-measure-e"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "digest"
number = "E"
title = "City Administrator’s Authority and Changes to City Contracting"
origin = "On July 23, 2026, the Department of Elections certified that the initiative petition calling for Proposition E to be placed on the ballot had a sufficient number of valid signatures to qualify the measure for the ballot."
summary = "Shall the City amend the Charter to give the City Administrator more authority by centralizing the City’s purchasing rules and processes, changing how the City approves purchasing rules, changing when contracts and leases require Board of Supervisors approval, and extending the City Administrator’s term?"
yes = "If you vote “yes,” you want to give the City Administrator more authority by centralizing the City’s Purchasing rules and processes, changing how the City approves Purchasing rules, changing when contracts and leases require Board approval, and extending the City Administrator’s term."
no = "If you vote “no,” you do not want to make these changes."

[[section]]
id = "what"
heading = "Proposition E"

[[section.line]]
text = "San Francisco Proposition E asks voters whether to give the City Administrator more authority over city purchasing and contracts."
sources = ["digest"]

[section.line.visual]
kind = "page"
source = "digest"
highlight = ["Shall the City amend the Charter"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Today, the City Administrator handles most city purchasing, but the Board of Supervisors sets the rules for choosing contractors."
sources = ["digest"]

[section.line.visual]
kind = "illustration"
name = "county-building"

[[section.line]]
text = "The board must approve contracts that cost the city $10 million or more."
sources = ["digest"]

[section.line.visual]
kind = "bars"
title = "Contracts that need the board's approval, $ millions and up"
source = "digest"
unit = ""
labels = ["Today", "Proposition E"]
values = [10, 25]

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "Proposition E would raise the approval threshold to $25 million, and let only the City Administrator propose purchasing rules, which the board and mayor could reject but not amend."
sources = ["digest"]

[[section.line]]
text = "The City Administrator would set purchasing rules for all departments, and serve a ten-year term instead of five."
sources = ["digest"]

[section.line.visual]
kind = "illustration"
name = "inspection-clipboard"

[[section]]
id = "fiscal"
heading = "What it would cost"

[[section.line]]
text = "The City Controller says Proposition E would have a minimal impact on the cost of government, at a level that cannot be determined."
sources = ["controller"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Proposition E slashes waste in contracting, with transparent standards so contracts go to whoever is best for the job."
sources = ["arguments"]
basis = ["PROP E SLASHES WASTE IN CITY CONTRACTING.", "E empowers a professional City Administrator to set transparent standards so contracts are awarded based on who is best for the job, not who is best connected."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Slashes waste in city contracting", "Awards contracts on merit, not connections"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say Proposition E concentrates power and weakens checks and balances, raising the threshold for supervisors to approve major contracts."
sources = ["arguments"]
basis = ["One measure expands City Administrator authority, raising the dollar threshold for Supervisor approval of major contracts.", "treats the system of checks and balances itself as the enemy.", "rewrite the City Charter and concentrate power in his hands."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Treats checks and balances as the enemy", "Less board review of major contracts"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote means you want to give the City Administrator more authority, and make these changes."
sources = ["digest"]

[section.line.visual]
kind = "page"
source = "digest"
highlight = ["you want to give the City Administrator more authority"]

[[section.line]]
text = "A no vote means you do not want to make these changes."
sources = ["digest"]

[section.line.visual]
kind = "page"
source = "digest"
highlight = ["you do not want to make these changes"]
