# Archived sources for San Francisco Proposition E, 2026-11-03 general
# election (sources/sources.md). San Francisco is a consolidated city and
# county, so its propositions are countywide: the division is the
# county. "page" is the Voter Information Pamphlet & Sample Ballot's
# printed page number (the PDF's page less 2).
#
# The pamphlet's impartial materials are the Ballot Simplification
# Council's digest and the Controller's Statement, on one cut of pages.
# The paid arguments (pages 98 to 99) are not cited.

