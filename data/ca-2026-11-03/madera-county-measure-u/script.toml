# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the tax today, where it applies
# and what it raises; what would change (the rate, where the money goes,
# no end date, the vote needed); the two official revenue estimates and
# the cost; one line per side; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this county". The card and title carry
# it. "Counsel" is heard as "Council" (standard/speakability.txt), so the
# narration calls County Counsel's analysis "the impartial analysis".
#
# Two estimates: the impartial analysis and the ballot question give
# $1.78 million a year; the Auditor-Controller's fiscal impact statement
# gives $1.85 million and $25,000 a year in added costs. Both are said,
# each attributed. No archived source states the county's general fund
# budget, so the dollar figures have no budget scale (STANDARD.md 6.5;
# left open, under [[question]]); the analysis's own figure for what the
# tax raises today stands beside the increase.
#
# The impartial analysis says guests "who stay for a period of less than
# 30 days", the fiscal statement "stays of 30-days or less"; the
# narration says "short stays", which both agree on.
#
# No argument against Measure U is among the registrar's postings. The
# no side says so plainly; its section is marked filed = false.

contest = "ca-2026-11-03-madera-county-measure-u"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "U"
title = "County Measure – Transient Occupancy Tax (TOT Increase)"
origin = "NOTICE IS HEREBY GIVEN to the qualified electors of Madera County, California"
summary = "Shall Madera County’s existing transient occupancy tax paid only by hotel/short term rental guests be increased by two percent (2%), providing approximately $1,780,000 annually until ended by voters, requiring independent audits, and all funds will be used locally to enhance 911 emergency response; maintain law enforcement; repair damaged roads; protect water quality; retain and attract jobs and businesses; and other general County services?"

[[section]]
id = "what"
heading = "Measure U"

[[section.line]]
text = "Measure U asks the voters of this county whether to raise the tax on short hotel and rental stays from 9 to 11 percent."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["be increased by two percent (2%)"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "where"
text = "Today, guests on short stays at lodging outside city limits pay a 9 percent tax, which brings in about $8 million for the county."
sources = ["fiscal-impact", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "hotel-front-desk"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "Measure U would raise the rate to 11 percent, with no end date."
sources = ["impartial-analysis", "fiscal-impact"]

[section.line.visual]
kind = "bars"
title = "Tax on short stays outside city limits, share of the rent"
source = "impartial-analysis"
unit = "%"
labels = ["Today", "With Measure U"]
values = [9, 11]

[[section.line]]
id = "general"
text = "The added money could pay for any governmental purpose, and Measure U needs a simple majority to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "state-budget"

[[section]]
id = "fiscal"
heading = "What the fiscal statements say"

[[section.line]]
text = "The impartial analysis estimates $1.78 million a year in added revenue."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "travel-receipts"

[[section.line]]
text = "The fiscal impact statement estimates $1.85 million a year, and $25,000 a year in added costs."
sources = ["fiscal-impact"]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say visitors use local roads and emergency services, and the tax recovers those costs without burdening residents."
sources = ["argument-for"]
basis = ["Visitors use our streets, roads, and emergency services as they enjoy all that Madera County has to offer", "Raising the TOT represents a fair approach to recover the increased costs associated with visitor stays in our County, without burdening residents."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Visitors use roads and emergency services", "Recovers costs without burdening residents"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure U appears among the filings that the county elections office posted for this election."
sources = ["argument-for"]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote raises the tax on short stays to 11 percent."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["be increased by two percent (2%)"]

[[section.line]]
text = "A no vote keeps the tax at 9 percent."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["existing transient occupancy tax"]

[[question]]
ask = "Where does the tax apply?"
lines = ["where"]

[[question]]
ask = "What can the money be spent on?"
lines = ["general"]

[[question]]
ask = "How big is $1.78 million a year next to the county budget?"
unanswered = true
