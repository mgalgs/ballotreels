# Archived sources for Madera County Measure U, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The Madera County Clerk-Recorder & Registrar of Voters posts each
# measure's filed documents on its election page; the printed County
# Voter Information Guide was not found online. The ballot question is
# quoted from the registrar's own legal notice, "Notice of Date Fixed for
# Submitting Arguments", which has a text layer. County Counsel's
# impartial analysis is the measure's neutral explanation, the kind a
# state's attorney general's explanatory statement is; the
# Auditor-Controller's fiscal impact statement is its fiscal statement.
#
# Who votes: the tax applies only in the unincorporated areas (the
# impartial analysis), but the notice is given "to the qualified
# electors of Madera County", and the ordinance takes effect once "the
# voters of the County of Madera have approved the measure". So the
# division is the county, with no `voters` line, as Fresno County
# Measure A's is.
#
# The impartial analysis, fiscal impact statement and argument in favor
# are scans with no text layer. The passages cited were typed from the
# page images into sources/*-transcription.txt, each naming the PDF and
# URL it copies; those sources point at the transcription, and their
# url at the scan (as Fresno County Measure A's do). The registrar
# posts no argument against and no rebuttals.

[contest]
id = "ca-2026-11-03-madera-county-measure-u"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/county:madera"
kind = "measure"
title = "Madera County Measure U: Transient Occupancy Tax Increase"

