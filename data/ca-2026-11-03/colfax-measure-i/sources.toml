# Archived sources for City of Colfax Measure I, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# Placer County Elections' page for Measure I could not be reached (its
# measure PDF returned HTTP 404 and its index answered a bot challenge),
# so no impartial analysis, argument or rebuttal was archived, and no
# document says whether any argument was filed (the resolution only
# authorizes and invites them). The ballot question is quoted from the
# county's list "Measures to Appear on Ballot", the authority for the
# letter, the question and the vote needed ("Requires 2/3 vote to
# pass"); Section 3 of the City's resolution prints the same question
# word for word under the short title "Colfax Streets and Sidewalks
# Sales Tax".
#
# The ordinance (the measure's full text) and the resolution submitting
# it are cited from the City's July 22, 2026 agenda packet, item 8B
# (packet pages 207 to 220): the copies published with the agenda, with
# the ordinance's and resolution's numbers and votes left blank. The
# ordinance's sections are numbered 3.06 (its first, 3.60.010, and its
# Section 1 say Chapter 3.60); the script names no section. The draft
# minutes of that meeting, published in the August 26, 2026 packet
# (item 2B, packet pages 13 to 17), record the ordinance's and the
# resolution's adoption. The staff report in item 8B is the City staff's
# material and is not cited.

