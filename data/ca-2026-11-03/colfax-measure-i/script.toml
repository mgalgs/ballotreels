# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; how it reached the ballot; what
# would change (the rate and how long it lasts, the special fund and
# what it pays for, borrowing against the tax, the audits and the
# committee, the vote it needs); the revenue estimate as the ballot
# question gives it; both sides, neither of which has an archived
# argument; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". The card and title carry the
# names.
#
# The card quotes Placer County Elections' list "Measures to Appear on
# Ballot", which prints the question and the vote it needs but no yes/no
# statements: so the card has no YES/NO boxes.
#
# No impartial analysis was archived: every neutral line rests on the
# county's list, on the resolution submitting the measure (a special
# tax, by its title) and on what the ordinance, the measure's full text,
# enacts: the 1 percent rate (3.06.050, 3.06.070), until ended by voters
# (3.06.160), the special fund and its uses (3.06.170 A and D),
# borrowing against the tax (3.06.170 C), the yearly audit (3.06.180)
# and the advisory committee (3.06.190). The resolution's "WHEREAS"
# findings on the City's roads and revenue are the City's own claims and
# are not used. The draft minutes give the fact of adoption. The staff
# report is not cited.
#
# The $1,864,000 a year is the ballot question's estimate. No archived
# source states the City's general fund budget to give it a scale
# (STANDARD.md 6.5; left open, under [[question]]).
#
# No argument for or against Measure I was archived, and no document
# says whether any was filed (the draft minutes record draft arguments
# in favor from two councilmembers, not a filing). So the sides do not
# say none was filed: each says none is among the documents gathered
# (filed = false, STANDARD.md 2.5), as for Walnut Creek Measure U.

contest = "ca-2026-11-03-colfax-measure-i"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "I"
title = "Measure I – City of Colfax"
origin = "Requires 2/3 vote to pass"
summary = "Shall the measure to fund construction, improvement, maintenance, repair, and replacement of streets, sidewalks, and other infrastructure within the public right-of-way, including drainage and sewers, and administration of the measure, by adopting a 1% transactions and use (sales) tax providing approximately $1,864,000 annually until ended by voters, with independent audits, public spending disclosure, and a citizen oversight committee, and all funds spent locally, be adopted?"

