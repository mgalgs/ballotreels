# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the council's ban today, what a
# data center is, who can change the ban, and how the measure reached
# the ballot; what would change (a voter-approved ban, who could change
# it, the vote it needs); that the analysis gives no cost estimate; both
# sides; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". The card and title carry it.
#
# Every explaining line is the City Attorney's impartial analysis,
# including the definition of a data center the measure amends. What
# data centers do to water, power, air or noise is the argument in
# favor's case, so it stays with that side (STANDARD.md 6.3).
#
# The card quotes the Los Angeles County Registrar-Recorder/County
# Clerk's list "Measures Appearing on the Ballot": the City's heading,
# the vote needed and the ballot question, which has no yes or no
# sentences, so the card has no boxes. The vote lines give the impartial
# analysis's own meanings, and both highlight the same phrase.
#
# The argument in favor is the Registrar's printed copy, signed by all
# five Council members. The list says "Opponents: None submitted.", so
# the no side says plainly that no argument against was submitted,
# citing the list (filed = false). Neither side names anyone: the record
# names no one on the no side.

contest = "ca-2026-11-03-alhambra-measure-db"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "DB"
title = "CITY OF ALHAMBRA"
origin = "VOTE PASSAGE – Majority Vote 50%+1"
summary = "Data Centers Prohibited. Shall an ordinance be adopted affirming the Council adopted ban on \"Data Centers\" by amending the Alhambra Municipal Code to again define \"Data Centers\" and prohibit them in all zones of the City?"

[[section]]
id = "what"
heading = "Measure DB"

[[section.line]]
text = "Measure DB asks the voters of this city whether to adopt the council's ban on data centers as a voter-approved law."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["prohibit them in all zones of the City"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "today-ban"
text = "The City Council has already banned data centers throughout the city."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "zoning-map"

[[section.line]]
id = "define"
text = "Data centers are facilities used mainly to process, store and transmit electronic data."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "server-racks"

[[section.line]]
id = "today-change"
text = "As things stand, the council could change or repeal that ban on its own."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "city-council-chamber"

[[section.line]]
text = "The City Council placed Measure DB on the ballot."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "city-council-chamber"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "voter-law"
text = "Measure DB would adopt the ban as a law of the voters, stating that data centers are prohibited in all zones."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["prohibit them in all zones of the City"]

[[section.line]]
id = "only-voters"
text = "Only the voters could then change or repeal the ban."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "ballot-box"

[[section.line]]
text = "Measure DB needs a majority yes vote to pass."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "fiscal"
heading = "What the impartial analysis says"

[[section.line]]
text = "The city attorney's impartial analysis does not include a cost estimate for the measure."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"
stamp = "None reported"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say data centers can use millions of gallons of water, and so much electricity that they strain the power grid."
sources = ["argument-for"]
basis = ["Data centers can use millions of gallons of water to keep their computers cool.", "Data centers use massive amounts of electricity, adding stress to the power grid and may increase costs for residents."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Heavy water use", "Strain on the power grid"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "The official county list of measures, which names who filed each argument, says no argument against Measure DB was submitted."
sources = ["measure-list"]

[section.line.visual]
kind = "list"
source = "measure-list"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote adopts the ban as a voter-approved law that only voters could change."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["prohibit them in all zones of the City"]

[[section.line]]
text = "A no vote leaves the council's ban in place, which the council could later change."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["prohibit them in all zones of the City"]

[[question]]
ask = "Are data centers allowed in the city now?"
lines = ["today-ban"]

[[question]]
ask = "What counts as a data center?"
lines = ["define"]

[[question]]
ask = "Who could change the ban if this passes, and if it fails?"
lines = ["today-change", "only-voters"]
