# Archived sources for City of Alhambra Measure DB, 2026-11-03 general
# election (sources/la-sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The Los Angeles County Registrar-Recorder/County Clerk's list "Measures
# Appearing on the Ballot" is the authority for the letter and the ballot
# question, quoted on the card; its "Opponents: None submitted." is the
# official statement that no argument against was filed (`measure-list`).
# The City Attorney's impartial analysis and the argument in favor are
# the Registrar's own copies from its Interactive Sample Ballot (the
# City's .docx analysis is the same document). The impartial analysis is
# the measure's neutral explanation, the kind a state's attorney
# general's explanatory statement is, and quotes the definition the
# measure amends; it gives no cost estimate. The ordinance
# (full-text.docx, which the check cannot read) and the consolidation
# resolution (a scan) add nothing the script needs and are not cited.

[contest]
id = "ca-2026-11-03-alhambra-measure-db"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:alhambra"
kind = "measure"
title = "City of Alhambra Measure DB: A Voter-Approved Ban on Data Centers"

