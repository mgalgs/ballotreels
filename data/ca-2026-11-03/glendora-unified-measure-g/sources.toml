# Archived sources for Glendora Unified School District Measure G,
# 2026-11-03 general election (sources/la-sources.md). Every id here may be
# cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# The Los Angeles County Registrar-Recorder/County Clerk's list "Measures
# Appearing on the Ballot" prints each measure's letter, vote threshold and
# ballot question; the card quotes the ballot question from it
# (ballot-question).
#
# The Registrar's Interactive Sample Ballot gives the County Counsel's
# impartial analysis, the district's tax rate statement, the full text of
# the bond measure, and the arguments and rebuttals as filed (HTML,
# retrieved 2026-10-30). The full text and the tax rate statement
# supersede the copies in the district's Board Resolution No. 26-27-01
# (resolution.pdf, its Appendices A and C, no longer cited); the passages
# the script cites read the same in both. The impartial analysis is the
# measure's neutral explanation, the kind the state rounds give an
# analyst's explanation.

[contest]
id = "ca-2026-11-03-glendora-unified-measure-g"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/school_district:glendora_unified_school_district"
kind = "measure"
title = "Glendora Unified School District Measure G: $86 Million School Repair Bond"

