# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; the tax for the district's earlier bonds and
# what the measure needs to pass; what would change (the rate the district
# expects to keep, and that the expectation is no legal limit; what the
# money may pay for); the district's tax rate statement; one line per
# side; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the opening
# says "the voters of this school district". The card and title carry the
# names. The fiscal years "2025-26" and "2056-2057" are said in full
# (standard/speakability.txt).
#
# The bonds voters approved in 2000 were also called Measure G. To keep
# the two apart, the narration calls those "the bonds voters approved in
# 2000" and says "Measure G" only of this one.
#
# The card quotes the Los Angeles County Registrar-Recorder/County Clerk's
# list "Measures Appearing on the Ballot", which prints the ballot question
# with no yes and no sentences, so the card has no boxes and the two vote
# lines highlight the same phrase of the question.
#
# No impartial analysis was staged, so what the measure does comes from
# its full text and the tax rate statement alone. The full text says the
# district expects the rate not to rise, and says in the same paragraph
# that the expectation is no cap and that the final maturity is extended;
# the script states all three (STANDARD.md 6.4). The bond total and the
# debt service are repaid from a tax on property in the district, not from
# the district's budget, and no archived source states that budget, so
# they have no budget scale (STANDARD.md 6.5; left open), as other school
# bonds' do.
#
# The Registrar's list names who filed an argument for and an argument
# against, but neither text was staged. Each side says only that its
# argument was filed and is not among the documents gathered, in the same
# words, and never guesses what it says. No filer is named, on either side
# alike. Both sides set filed = false.

