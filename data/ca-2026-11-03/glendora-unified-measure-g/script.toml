# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; the tax for the district's earlier bonds and
# what the measure needs to pass; what would change (the rate the district
# expects to keep, and that the expectation is no legal limit; what the
# money may pay for); the district's tax rate statement; one line per
# side; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the opening
# says "the voters of this school district". The card and title carry the
# names. The fiscal years "2025-26" and "2056-2057" are said in full
# (standard/speakability.txt).
#
# The bonds voters approved in 2000 were also called Measure G. To keep
# the two apart, the narration calls those "the bonds voters approved in
# 2000" and says "Measure G" only of this one.
#
# The card quotes the Los Angeles County Registrar-Recorder/County Clerk's
# list "Measures Appearing on the Ballot", which prints the ballot question
# with no yes and no sentences, so the card has no boxes and the two vote
# lines highlight the same phrase of the question.
#
# What the measure does rests on the County Counsel's impartial analysis
# ("Counsel" is heard as "Council", so the lines do not name the office),
# the full text and the tax rate statement, the Registrar's copies. The
# full text and the statement say the district expects the rate not to
# rise, and say beside it that the expectation is no cap and that the
# final maturity is extended; the script states all three (STANDARD.md
# 6.4). The bond total and the debt service are repaid from a tax on
# property in the district, not from the district's budget, and no
# archived source states that budget, so they have no budget scale
# (STANDARD.md 6.5; left open), as other school bonds' do.
#
# The sides come from the arguments and rebuttals the Registrar prints.
# Each side's headline point (no rise in the rate; no binding cap on it)
# is already stated, both halves alike, in the neutral lines from the
# official statements, so each side's line gives its other main point
# rather than repeat it (STANDARD.md 6.3): for supporters, schools nearly
# 70 years old and state matching funds; for opponents, that the tax for
# the 2000 bonds ends in 2027 if Measure G fails (their rebuttal), and
# the property exchange the district has not weighed. Here "Measure G"
# is said of this measure only; the 2000 bonds are "the old bonds". No
# filer is named, on either side alike.

contest = "ca-2026-11-03-glendora-unified-measure-g"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "G"
title = "GLENDORA UNIFIED SCHOOL DISTRICT"
origin = "VOTE PASSAGE – 55% of the Votes Cast"
summary = "Glendora Unified School District Classroom Repair Extension Measure. To repair or replace deteriorating roofs, plumbing, HVAC, electrical systems; remove asbestos and lead pipes; upgrade classrooms, labs, facilities to support college/career readiness in math, science, engineering, technology and skilled trades; shall Glendora Unified School District's measure be adopted, authorizing $86,000,000 in bonds at legal rates (without increasing current tax rates), levying approximately $33 per $100,000 assessed value ($5,000,000 annually) while bonds are outstanding, with independent oversight/audits, and funds locally controlled?"

[[section]]
id = "what"
heading = "Measure G"

[[section.line]]
text = "Measure G asks the voters of this school district whether to approve $86 million in school bonds."
sources = ["ballot-question", "text"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["authorizing $86,000,000 in bonds"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "earlier-bonds"
text = "Property owners here already pay a tax for school bonds voters approved in 2000: $33 per $100,000 of assessed value in 2025-2026."
sources = ["tax-statement", "text"]

[section.line.visual]
kind = "illustration"
name = "bond-certificates"

[[section.line]]
id = "threshold"
text = "Measure G needs 55 percent of the vote to pass."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "same-rate"
text = "The district expects the new bonds would not raise that $33 rate, but the tax would be collected for more years."
sources = ["text", "tax-statement"]

[section.line.visual]
kind = "illustration"
name = "extend-deadline"

[[section.line]]
id = "no-cap"
text = "The measure says the district's expectation is not a legal limit on the tax rate."
sources = ["text", "tax-statement"]

[[section.line]]
id = "projects"
text = "The bond money could pay for roof, plumbing and heating repairs, removing asbestos and lead pipes, and upgrading classrooms and labs."
sources = ["text", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "school-roof-repair"

[[section]]
id = "fiscal"
heading = "What the tax rate statement says"

[[section.line]]
id = "rate"
text = "The district's tax rate statement estimates the tax for these bonds at $33 per $100,000 of assessed value, through 2056-2057."
sources = ["tax-statement", "impartial-analysis"]

[section.line.visual]
kind = "bars"
title = "Estimated tax per $100,000 of assessed value, dollars"
source = "tax-statement"
unit = ""
labels = ["Average", "Highest"]
values = [33, 33]

[[section.line]]
id = "total"
text = "The statement estimates the total to repay, with interest, at about $161.3 million."
sources = ["tax-statement", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "debt-payments"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
id = "yes-line"
text = "Supporters say many school buildings are nearly 70 years old with failing systems, and Measure G would help qualify for state matching funds."
sources = ["argument-for", "rebuttal-to-against"]
basis = ["many classrooms and school facilities are nearly 70 years old.", "Aging pipes, roofs, plumbing, sewer lines, air conditioning, and electrical systems are failing now", "This fiscally responsible plan also helps our schools qualify for $50,000,000 or more in state matching funds", "Measure G allows Glendora to compete for over $50,000,000 in matching funds"]

[section.line.visual]
kind = "list"
source = "argument-for"
