# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; how a citizens' initiative reached the ballot;
# who runs the zoo; what would change (the tax, when and how long, where
# the money goes, the vote it needs); the impartial analysis's revenue
# estimate; one line per side; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the opening
# says "the voters of this county". The card and title carry the name.
# "Counsel" is heard as "Council" (standard/speakability.txt), so the
# narration does not say it. The zoo is named by its full name, as the
# card prints it, not by its acronym.
#
# The card quotes the question from the Board of Supervisors' resolution,
# which prints no yes and no sentences, so the vote lines take their
# meaning from the impartial analysis's own "Yes" and "No" sentences and
# both highlight the question's tax. The vote threshold is a majority, as
# the impartial analysis and the ordinance's own findings state it.
#
# The revenue (about $24 million a year) would go to a special fund for
# the zoo, and no archived source states the county's budget, so it has no
# scale (STANDARD.md 6.5; left open).
#
# The supporters cite the zoo's aging infrastructure and small exhibits,
# its affordability, field trips, the dedicated money, the oversight and
# audits and the cost per purchase. The neutral sections say where the
# money must go, as the impartial analysis states it, and leave the
# oversight committee and audits out (STANDARD.md 6.3).
#
# The county posts no argument against Measure Z, but no official document
# says in words that none was filed. So the no side does not say none was
# filed: it says none is among the documents the county has posted
# (filed = false, STANDARD.md 2.5), as for Livingston Measures T and U.

contest = "ca-2026-11-03-kern-county-measure-z"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "Z"
title = "CALIFORNIA LIVING MUSEUM ZOO IMPROVEMENT AND CONSERVATION ACT OF 2026."
origin = "Resolution No. 2026-280"
summary = "Shall a measure establishing a countywide retail transactions and use tax of 0.125% (one-eighth of one percent) to fund the maintenance, improvement, and operation of the California Living Museum (CALM Zoo) be adopted, providing an estimated twenty-four million dollars annually until repealed by voters, with all revenue dedicated exclusively to CALM, managed by the Kern County Superintendent of Schools, and requiring independent audits and oversight by the Independent Taxpayer Oversight Committee?"

[[section]]
id = "what"
heading = "Measure Z"

[[section.line]]
text = "Measure Z asks the voters of this county whether to add a sales tax of one-eighth of 1 percent to fund the California Living Museum zoo."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["countywide retail transactions and use tax of 0.125%"]

[[section]]
