# Archived sources for City of Walnut Creek Measure U, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# Contra Costa County Elections' page for Measure U
# (sources/county-page.txt, read in a browser, since contracostavote.gov
# answers scripted fetches with a bot challenge) prints the ballot
# question, the City Attorney's impartial analysis, the argument in
# favor, and the county's statements that no argument against and no
# rebuttal to either side was filed (the statement on the argument
# against is cited as its own source, argument-against). The City
# Attorney's impartial analysis is the measure's neutral explanation,
# the kind a state's attorney general's explanatory statement is. The county's question is
# word for word the one in Section 2 of the City's resolution, which the
# card quotes.
#
# The City's own files are from its agenda system, for the City Council
# meeting of July 21, 2026, item 6b (www.walnutcreekca.gov answered
# HTTP 403). The ballot question is quoted from Section 2 of the City's
# resolution submitting the initiative to the voters (Attachment 3 to
# item 6b). The question runs across a page break, where the PDF's text layer sets
# the page number, the YES and NO cells and the next page's running
# header inside it, so the card's source (ballot-question) is
# sources/resolution-ballot-question-extract.txt, the question copied
# from the text layer without them; its url is the PDF. The resolution's
# other facts are cited from the PDF itself (resolution). The Council
# could place the initiative only "without alteration" (Elections Code
# section 9215). The copy archived is the one in the agenda packet,
# with its number left blank; the errata sheet for item 6b changes only
# its Section 8, on ballot arguments, so the question stands as quoted.
# The full text is the Walnut Creek Senior Housing Transit Village
# Initiative as received by the City Clerk (a scan with a text layer).
#
# The two Council agenda reports (April 21 and July 21, 2026) are the
# City staff's material and the errata sheet changes nothing the script
# says; none is cited, since the resolution, the initiative and the
# impartial analysis state every fact the script uses.

[contest]
