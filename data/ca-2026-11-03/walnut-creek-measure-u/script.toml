# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; how it reached the ballot and the
# vote it needs; the site today; what would change (the new district's
# uses, and the protection of what it allows); no cost estimate; the
# argument in favor, and the county's statement that no argument
# against was filed; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city", and the site is "a 2.4-acre
# site", never its streets. The card and title carry the names.
#
# The neutral lines rest on the resolution submitting the initiative, on
# the initiative's own text and on the City Attorney's impartial analysis
# printed on the county's page, which agrees with each of them; never on
# the initiative's "Benefits, Purpose and Intent" section, which is the
# proponents' text.
# The City staff's agenda reports are not cited. The card quotes the
# ballot question from Section 2 of the resolution, which prints no
# yes/no lines (it is copied, without the page break's furniture, into
# sources/resolution-ballot-question-extract.txt), so the card has no
# YES/NO boxes and both vote lines highlight the same phrase of the
# question.
#
# Neither the resolution nor the initiative gives a cost figure (nor
# does the impartial analysis), so the fiscal line says so, naming both
# documents. The staff report's figures from
# the City's section 9212 report are not used.
#
# The county's page prints the argument in favor and says "No Argument
# Against was filed." The yes side distils the argument's two central
# claims (seniors pushed away from their families; over 200 senior homes
# near transit without raising taxes), naming no signer; the no side
# says, attributed to the county, that none was filed (filed = false,
# STANDARD.md 2.5), as for CA Proposition 1. No rebuttal was filed.

contest = "ca-2026-11-03-walnut-creek-measure-u"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "U"
title = "THE WALNUT CREEK SENIOR HOUSING TRANSIT VILLAGE INITIATIVE"
origin = "CITY OF WALNUT CREEK"
summary = "Shall the measure amending the City of Walnut Creek General Plan, the North Downtown Specific Plan, and the Municipal Code to redesignate a 2.4 acre site at the northeast corner of North California Boulevard and Ygnacio Valley Road from office uses to mixed use residential uses, and to create a new Mixed Use Residential Senior & Commercial zoning district to limit allowable uses on the site to multifamily senior housing (primarily 55 years of age or older) and commercial uses compatible with senior housing, be adopted?"

[[section]]
id = "what"
heading = "Measure U"

[[section.line]]
text = "Measure U asks the voters of this city whether to change the rules for a 2.4-acre site from office uses to senior housing and shops."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["redesignate a 2.4 acre site", "from office uses to mixed use residential uses"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "petition"
text = "Measure U is a citizens' initiative, which qualified with 5,000 valid signatures from voters in the city."
sources = ["resolution", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "neighborhood-petition"

[[section.line]]
id = "site"
text = "Today the site's plans call for office uses, and it holds office buildings."
sources = ["resolution"]

[section.line.visual]
kind = "illustration"
name = "office-tower"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "uses"
text = "A new zoning district would limit the site to apartments mainly for people 55 or older, and businesses suited to senior housing."
sources = ["ballot-question", "text", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "mixed-use-storefronts"

[[section.line]]
id = "locked"
text = "Later city rules could not reduce what the initiative allows on the site, except by a vote of the people or by approving an application from the site's owner."
sources = ["text", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "zoning-map"

[[section.line]]
id = "threshold"
text = "Measure U needs a majority of the vote to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "ballot-box"

[[section]]
id = "fiscal"
heading = "What it would cost"

[[section.line]]
id = "cost"
text = "Neither the resolution placing Measure U on the ballot nor the initiative's text includes a cost estimate for the measure."
sources = ["resolution", "text"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"
stamp = "None reported"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say seniors are being pushed far from their families, and Measure U allows over 200 senior homes near transit, without raising taxes."
sources = ["argument-for"]
basis = ["many seniors and older adults are being pushed out further and further into the East Bay, away from their families", "updating zoning in North Downtown Walnut Creek to permit over 200 units of high-quality senior housing and community-serving retail near BART – without raising taxes."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Seniors pushed far from family", "Senior homes without new taxes"]

[[section]]
id = "no"
