# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the settlement limit today, how
# old it is and why only the charter can change it; what would change
# (who sets the limit, the ordinance already adopted, what still goes to
# the council); that no cost estimate was given; one line per side; what
# a vote does.
#
# No narrated line names the city (the narrator mispronounces proper
# names); the card and title show it. The no side filed no argument (the
# Registrar's list: "(none filed)"), so its line says so.
#
# Dollar figures: $50,000 and $250,000 are the most one settlement may
# be without the council, not money a budget pays or receives in total,
# so they have no scale (STANDARD.md 6.5). The analysis's note that the
# limit was never adjusted for inflation is left to the supporters, who
# argue it ("$50,000 in 1989 is worth over $130,000 today"); the
# neutral line gives the ballot question's "unchanged since 1989"
# (STANDARD.md 6.3). The ordinance's date is the analysis's (August
# 2026); the argument says July.
#
# The card quotes the Registrar of Voters' List of Local Measures, which
# prints no yes/no lines; the vote lines give the impartial analysis's
# meanings and highlight the one phrase of the question both turn on.

contest = "ca-2026-11-03-sunnyvale-measure-h"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "H"
title = "City Charter Amendment - City Manager's Authority to Settle Claims"
origin = "City of Sunnyvale"
summary = "Shall Section 1314 of the City Charter be amended to authorize the City Council to adopt an ordinance establishing the maximum amount the City Manager may approve to settle legal claims against the City, instead of the current $50,000 limit established by state law and unchanged since 1989, while retaining City Council approval authority for settlements exceeding the amount set by the ordinance? "

[[section]]
id = "what"
heading = "Measure H"

[[section.line]]
text = "Measure H asks the voters of this city whether to let the council set how large a legal claim the city manager may settle."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["maximum amount the City Manager may approve to settle legal claims"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "limit-today"
text = "Today a state law requires council approval to settle any claim against the city for more than $50,000."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "case-file-phone"

[[section.line]]
id = "since-1989"
text = "The Legislature set that limit in 1989, and only a charter amendment can change it for the city."
sources = ["impartial-analysis", "ballot-question"]

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "by-ordinance"
text = "Measure H would let the council set the limit by ordinance, and raise or lower it later without another charter amendment."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "city-council-chamber"

[[section.line]]
id = "ordinance"
text = "In August 2026, the council adopted an ordinance setting the limit at $250,000 if Measure H passes."
sources = ["impartial-analysis"]

[[section.line]]
id = "above-limit"
text = "Settlements above the limit would still need council approval, in a closed session as today."
sources = ["impartial-analysis", "ballot-question"]

[[section]]
id = "fiscal"
heading = "What it would cost"

[[section.line]]
