# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and of whom; how a school bond is repaid and what it needs to
# pass; what the money would pay for; the district's tax statement; one
# line per side; what a vote does.
#
# The card's title is the item's own head on the county's Current
# Measure Information page; its origin and yes and no lines are County
# Counsel's Impartial Analysis. "Counsel" is heard as "Council"
# (standard/speakability.txt), so the narration does not say it. The
# bond total and the debt service are repaid from a tax on property in
# the district, and no archived source states the district's budget, so
# they have no budget scale (STANDARD.md 6.5; left open). The fiscal line
# gives the tax statement's highest rate beside its average, as it
# prints both, with both years in full.
#
# Whether Measure D raises taxes is the supporters' point ("Measure D
# will not raise your tax rate"), so the neutral sections give only the
# tax statement's rates and years (STANDARD.md 6.3).
#
# No argument against Measure D was filed. The no side says so plainly;
# its section is marked filed = false.

contest = "ca-2026-11-03-natomas-unified-measure-d"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-label"
number = "D"
title = "Measure D: Natomas Unified School District"
origin = "Measure D was placed on the ballot by the governing board of the Natomas Unified School District (“District”)."
summary = "Natomas Schools Repair, Safety, Education Measure. To continue providing quality education/ career training; repair aging infrastructure/ electrical systems/ classrooms/ leaky roofs; improve school safety/ security/ access for students with disabilities/ safe play areas, by repairing, constructing, acquiring classrooms/ facilities, shall Natomas Unified School District's measure authorizing $300,000,000 in bonds at legal rates; levying $60 per $100,000 of assessed valuation; raising approximately $22,000,000 annually while bonds are outstanding; requiring oversight, disclosure, audits, no money for administrators' salaries, be adopted?"
yes = "A “YES” vote on Measure D means you wish to allow the District to issue bonds in an amount not to exceed $300 million dollars."
no = "A “NO” vote on Measure D means you do not wish to allow the District to issue the proposed bonds."

[[section]]
id = "what"
heading = "Measure D"

[[section.line]]
text = "Natomas Unified School District Measure D asks the district's voters whether to approve $300 million in school bonds."
sources = ["ballot-label"]

[section.line.visual]
kind = "page"
source = "ballot-label"
highlight = ["$300,000,000 in bonds"]

[[section]]
id = "today"
heading = "How a school bond works"

[[section.line]]
text = "The district would borrow the money and repay it from a tax on property in the district."
sources = ["tax-statement"]

[section.line.visual]
kind = "illustration"
name = "bond-certificates"

[[section.line]]
text = "Measure D needs 55 percent of the vote to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "The money would repair aging classrooms, electrical systems and leaky roofs, and improve school safety and access for students with disabilities."
sources = ["ballot-label"]

[section.line.visual]
kind = "illustration"
name = "school-classroom"

[[section]]
id = "fiscal"
heading = "What the tax statement says"

[[section.line]]
text = "The district's tax statement estimates an average tax of $59.38 per $100,000 of assessed value, and at most $60, through 2053-2054."
sources = ["tax-statement"]

[section.line.visual]
kind = "illustration"
name = "debt-payments"

[[section.line]]
text = "The statement estimates the total to repay, with interest, at about $600 million."
sources = ["tax-statement", "impartial-analysis"]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Measure D repairs classrooms and expands career training, without raising tax rates."
sources = ["arguments"]
basis = ["Measure D will help provide safe campuses, repair aging classrooms, and expand hands-on career training opportunities.", "Measure D will not raise your tax rate."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Repairs aging classrooms, safer campuses", "Career training, no tax rate increase"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure D was filed with Sacramento County Voter Registration and Elections."
sources = ["arguments"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote allows the district to issue up to $300 million in bonds."
sources = ["ballot-label"]

[section.line.visual]
kind = "page"
source = "ballot-label"
highlight = ["you wish to allow the District to issue bonds"]

[[section.line]]
text = "A no vote does not allow the district to issue the proposed bonds."
sources = ["ballot-label"]

[section.line.visual]
kind = "page"
source = "ballot-label"
highlight = ["you do not wish to allow the District to issue the proposed bonds"]
