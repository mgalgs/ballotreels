# Archived sources for City of Berkeley Measure W, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1). The guide's pages are cut from the
# Alameda County Registrar of Voters' Composite Voter Information Guide
# (PDF pages 856 to 864); "page" is the guide's printed footer number.
# The guide prints no fiscal analysis for Measure W, and no argument
# against it ("NO ARGUMENT AGAINST MEASURE W WAS SUBMITTED").
#
# The guide's Times New Roman fonts are embedded as CID TrueType with no
# Unicode map, so pdftotext reads most of the text as glyph ids
# shifted 29 places from the letters; the checks read it through the
# decoder another round adds to ballotreels/checks.py.

[contest]
id = "ca-2026-11-03-berkeley-measure-w"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:berkeley"
kind = "measure"
title = "City of Berkeley Measure W: Charter Amendment on Elections, Filing Fees, Petitions and Public Campaign Financing"

