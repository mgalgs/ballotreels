# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and of whom; who put it on the ballot and what it needs to pass;
# what would change (the filing fee, candidate statements, the public
# financing cap, the petition and vacancy rules); the guide's lack of a
# cost estimate; one line per side; what a vote does.
#
# The guide prints no fiscal analysis (not a tax measure). The public
# financing cap ($250,000 to $400,000 per four-year cycle) is money of
# the city's Fair Elections Fund, and no archived source states the
# fund's or the city's budget, so it has no scale (STANDARD.md 6.5; left
# open). That the Council's vote was unanimous is the supporters'
# argument, so the neutral line says only that the Council placed it.
#
# No argument against Measure W was submitted ("NO ARGUMENT AGAINST
# MEASURE W WAS SUBMITTED"): the no side is filed = false, as for San
# Diego Unified Measure M.
#
# The guide prints no yes/no lines for this measure, so, as for Utah, the
# card has no YES/NO boxes, and the two vote lines highlight the one
# phrase of the question they turn on.

contest = "ca-2026-11-03-berkeley-measure-w"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide-page"
number = "W"
title = "CITY OF BERKELEY MEASURE W"
origin = "This measure was placed on the ballot by the City Council of the City of Berkeley."
summary = "Shall the measure amending the City Charter to reduce candidate filing fees; eliminate signatures in lieu of filing fee process; eliminate certain personal information from candidate statements; clarify and revise initiative, referendum and recall processes; amend election timelines for filling Mayor and Councilmember vacancies; increase the maximum amount from the public campaign financing fund for administration and enforcement from $250,000 to $400,000 per four-year election cycle; and make other changes be adopted?"

