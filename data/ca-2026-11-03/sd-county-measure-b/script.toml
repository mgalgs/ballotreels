# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks; how it reached the ballot and what it needs to pass; what would
# change (where the tax applies and for how long, where the money goes,
# who checks the spending); the impartial analysis's revenue estimate;
# one line per side; what a vote does.
#
# The guide prints no fiscal analysis or tax rate statement; its one
# revenue estimate is in County Counsel's Impartial Analysis, which the
# fiscal line names. "Counsel" is heard as "Council"
# (standard/speakability.txt), so the narration says "the county
# attorney's impartial analysis". No archived source states the county's
# budget, so the estimate has no scale (STANDARD.md 6.5; left open).
#
# Sides come from the argument in favor and the argument against, not
# the rebuttal (the guide prints a rebuttal to the argument against only).

contest = "ca-2026-11-03-sd-county-measure-b"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide-page"
number = "B"
title = "MEASURE TO FUND SAN DIEGO COUNTY HEALTH & SAFETY SERVICES"
origin = "This measure was placed on the ballot by a petition signed by the requisite number of voters."
summary = "To clean-up sewage pollution in Tijuana River Valley, improve wildfire prevention, emergency response, access to healthcare, food assistance, childhood development services, and authorized administrative expenses; shall the measure authorizing a half-cent sales tax raising an estimated $400,000,000 to $450,000,000 annually, requiring citizen oversight, public spending disclosure, and independent annual audits, and lasting until ended by voters, be adopted?"
yes = "A YES vote would impose a half-cent sales tax for use to clean-up sewage pollution in the Tijuana River Valley, public safety, wildfire prevention, healthcare, childcare and nutrition services."
no = "A NO vote would reject a half-cent sales tax for use to clean-up sewage pollution in the Tijuana River Valley, public safety, wildfire prevention, healthcare, childcare and nutrition services."

[[section]]
id = "what"
heading = "Measure B"

[[section.line]]
