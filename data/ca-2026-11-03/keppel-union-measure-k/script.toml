# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; who placed it and the vote it needs; what
# the money may and may not pay for; the tax rate statement's estimates,
# with its own caveat; one line per side; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the opening
# says "the voters of this school district". The card and title carry the
# names. "Counsel" is heard as "Council" (standard/speakability.txt), so
# the narration says "the impartial analysis". The fiscal year "2065-66"
# is said in full.
#
# The card quotes the Los Angeles County Registrar-Recorder/County Clerk's
# list "Measures Appearing on the Ballot", which prints the ballot question
# with no yes and no sentences, so the card has no boxes and the two vote
# lines highlight the same phrase of the question.
#
# The tax rate statement's average and highest rates are both $30 per
# $100,000 of assessed value; the script gives both, the total debt
# service, and the statement's own word that these are estimates, not
# maximum amounts. The bonds are repaid from a tax on property in the
# district, not from the district's budget, and no archived source states
# that budget, so the figures have no budget scale (STANDARD.md 6.5; left
# open), as other school bonds' do.
#
# The argument in favor is the Registrar's printed copy. The list says
# "Opponents: None submitted.", so the no side says plainly that no
# argument against was submitted, citing the list (filed = false). Its
# clause on what the list records balances the yes line's length without
# a further claim.

contest = "ca-2026-11-03-keppel-union-measure-k"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "K"
title = "KEPPEL UNION SCHOOL DISTRICT"
origin = "VOTE PASSAGE – 55% of the Votes Cast"
summary = "Keppel Union School District Classroom Repair, Safety, Upgrade Measure. To repair leaky roofs, deteriorating plumbing, electrical, gas lines; provide safe drinking water; remove asbestos, lead paint, mold; improve fire safety, security, emergency communications; ensure safe children's play areas; upgrade classroom technology, science labs; shall Keppel Union School District's measure authorizing $27,000,000 in bonds at legal rates, levies averaging $30 per $100,000 assessed valuation ($1,700,000 annually) while bonds are outstanding, be adopted, requiring oversight, audits, spending disclosure, all funds for local schools?"

[[section]]
id = "what"
heading = "Measure K"

[[section.line]]
text = "Measure K asks the voters of this school district whether to approve $27 million in school bonds."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["authorizing $27,000,000 in bonds"]

[[section]]
id = "today"
heading = "How it reached the ballot"

[[section.line]]
id = "threshold"
text = "The district's governing board placed Measure K on the ballot, and it needs 55 percent of the vote to pass."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "projects"
text = "The bond money could pay to repair or replace school buildings, such as roofs, plumbing, gas lines, and fire and security systems."
sources = ["impartial-analysis", "text"]

[section.line.visual]
kind = "illustration"
name = "school-roof-repair"

[[section.line]]
id = "limits"
text = "The money could not pay teacher or administrator salaries, and a citizens' oversight committee and yearly audits would be required."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "inspection-clipboard"

[[section]]
id = "fiscal"
heading = "What the tax rate statement says"

[[section.line]]
id = "rate"
text = "The district's tax rate statement estimates an average and a highest tax of $30 per $100,000 of assessed value, through 2065-2066."
sources = ["tax-statement"]

[section.line.visual]
kind = "bars"
title = "Estimated tax per $100,000 of assessed value, dollars"
source = "tax-statement"
unit = ""
labels = ["Average", "Highest"]
values = [30, 30]

[[section.line]]
id = "total"
text = "The statement puts the total to repay, with interest, at about $67.8 million, and says its figures are estimates, not maximum amounts."
sources = ["tax-statement"]

[section.line.visual]
kind = "illustration"
name = "debt-payments"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say the district's schools are aging and in dire need of repairs, and the state cannot take this funding away."
sources = ["argument-for"]
basis = ["Our TK-8 elementary schools are aging and in dire need of repairs.", "The State CANNOT take this funding away."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Aging schools need repairs", "State cannot take the funds"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "The official list of measures from the county, which names who filed each argument, says no argument against Measure K was submitted."
sources = ["measure-list"]

[section.line.visual]
kind = "list"
source = "measure-list"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote approves the $27 million in school bonds."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["authorizing $27,000,000 in bonds"]

[[section.line]]
text = "A no vote rejects the $27 million in school bonds."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["authorizing $27,000,000 in bonds"]

[[question]]
ask = "How much tax would I pay, and for how long?"
lines = ["rate"]

[[question]]
ask = "What could the money be spent on?"
lines = ["projects", "limits"]

[[question]]
ask = "What vote does the measure need to pass?"
lines = ["threshold"]

[[question]]
ask = "What would the bonds cost in all?"
lines = ["total"]

[[question]]
ask = "How large is the bond next to the district's yearly budget?"
unanswered = true
