# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and of whom; the hotel tax today and who pays it; who put it on
# the ballot and what it needs to pass; what would change (the two steps,
# no end date, a general tax); the city's revenue estimate, as the
# impartial analysis gives it; one line per side; what a vote does.
#
# The guide prints no tax rate statement or fiscal analysis (not a
# bond); the revenue estimate is the city's, in the ballot question and
# the City Attorney's Impartial Analysis. No archived source states the
# city's General Fund budget, so the $1.4 million and $2.8 million have
# no scale (STANDARD.md 6.5; left open). The guide prints no full text
# (sources.toml).
#
# The card's title is the guide page's own head. Much of the page's text
# layer is in glyph ids (checks._unshifted_text reads it back); the
# ballot question and the yes and no sentences are quoted from the page
# as printed. The supporters' deficit forecast and the opponents' "50%
# rate hike" are their arguments, so they stay out of the neutral
# sections (STANDARD.md 6.3).

contest = "ca-2026-11-03-pleasanton-measure-hh"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide-page"
number = "HH"
title = "CITY OF PLEASANTON MEASURE HH"
origin = "Measure HH was placed on the ballot by the Pleasanton City Council"
summary = "Shall a measure be adopted to increase the City’s Uniform Transient Occupancy Tax paid by hotel guests from 8% to 10% on July 1, 2027, and to 12% on July 1, 2028, generating an estimated $1.4 to $2.8 million per year in additional revenue, that can be used to maintain city services, such as: police and fire protection; park and street maintenance; recreation programs; and other general government uses, until ended by voters?"
yes = "A “yes” vote on Measure HH favors enacting the proposed ordinance that would increase the City’s TOT rate to 10% on July 1, 2027, and to 12% on July 1, 2028."
no = "A “no” vote on Measure HH opposes the proposed ordinance and would maintain the City’s TOT rate at the existing 8%."

[[section]]
id = "what"
heading = "Measure HH"

[[section.line]]
text = "City of Pleasanton Measure HH asks voters in the city whether to raise the hotel tax from 8 percent to 12 percent."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
