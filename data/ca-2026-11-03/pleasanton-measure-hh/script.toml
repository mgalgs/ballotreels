basis = ["is paid primarily by visitors staying in hotels and short-term lodging, rather than by Pleasanton residents or property owners.", "Based on the City of Pleasanton’s 10-year financial forecast, annual General Fund operating deficits will", "Vote YES to protect the high-quality city services that make Pleasanton a great place to live, work, and visit."]

