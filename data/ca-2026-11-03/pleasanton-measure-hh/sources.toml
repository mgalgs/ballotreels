# Archived sources for City of Pleasanton Measure HH, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. The guide's pages are cut from the Alameda County
# Registrar of Voters' Composite Voter Information Guide (965 pages);
# "pages" are the PDF's page numbers, with the printed footer (PMHH-1 to
# PMHH-3) beside them.
#
# The guide prints the ballot question, the City Attorney's Impartial
# Analysis, an argument in favor and an argument against, and a rebuttal
# to each. It prints no tax rate statement and no full text: the
# analysis says the City Clerk mails the ordinance on request, and the
# City's own copy sits behind a Laserfiche viewer that returned empty
# files (sources.md), so no official-text source is archived.

[contest]
id = "ca-2026-11-03-pleasanton-measure-hh"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:pleasanton"
kind = "measure"
title = "City of Pleasanton Measure HH: Hotel Tax Increase"

