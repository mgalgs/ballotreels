# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and of whom; who pays the hotel tax; the rate today and where the
# money goes; who placed it and what it needs; the first step to 11
# percent and the council's power up to 13; the ballot question's revenue
# figure; one line per side; what a vote does.
#
# No narrated line names the city or the county (the card and title show
# them). The card quotes the Registrar's List of Local Measures: its
# heading for the measure as the title, the city as the origin, the
# ballot question as the summary. The list prints no yes/no statements
# and the analysis's are bare ("a vote in favor of Measure (X)"), so the
# vote lines take their meanings from the analysis's account of the rate
# and highlight the question's one phrase both votes turn on.
#
# The supporters' "residents do not pay" and "unchanged since 1983", and
# the opponents' "31 PERCENT", are theirs, so no neutral line states
# them (STANDARD.md 6.3); the opponents' line leaves their percentage out
# rather than narrate a figure no neutral source states. The supporters'
# $300,000 at 11 percent is theirs too. No archived source gives the
# city's general fund total, so the $700,000 goes without a scale (rule
# 6.5; listed as open).

contest = "ca-2026-11-03-gilroy-measure-b"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "B"
title = "Transient Occupancy Tax"
origin = "City of Gilroy"
summary = "To maintain critical City services such as street/pothole repair, park and recreation programs, emergency preparedness for storms, flooding and wildfires, and police and fire response shall the City of Gilroy measure raising the Transient Occupancy Tax (hotel tax) rate from 9% to a maximum of 13%, set by Council resolution, providing $700,000 annually paid only by hotel/lodging guests, with annual independent audits, that cannot be taken by Sacramento, until ended by voters, be adopted?"

[[section]]
id = "what"
heading = "Measure B"

[[section.line]]
text = "Measure B asks the voters of this city whether to raise the hotel tax from 9 percent to a maximum of 13 percent."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["from 9% to a maximum of 13%"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "who-pays"
text = "Guests of hotels, short-term rentals and other lodging pay the tax on stays of 30 days or less."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "hotel-front-desk"

[[section.line]]
id = "general-fund"
text = "The money goes to the general fund, and may be used for any lawful purpose."
sources = ["impartial-analysis"]

[[section.line]]
text = "The City Council placed Measure B on the ballot, and it needs a simple majority to pass."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
