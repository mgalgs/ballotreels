# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the rates today; what would
# change (the single rate, its start and no end date, the yearly audit
# and oversight, the Council's power to amend, the kind of tax and the
# vote it needs); the ballot question's revenue figure; both sides, from
# the arguments printed on the county's page; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". The card and title carry the
# name.
#
# What Measure O does comes from the ordinance (its full text, with the
# redlined Chapter 5.05) and the resolution placing it, only from what
# they enact; the City Attorney's impartial analysis, printed on the
# county's page, agrees with each of those lines and is cited beside
# them. The redline strikes
# the tiered gross receipts schedule (1.00 down to 0.30 mil per dollar,
# that is $1 per $1,000 on the first $25,000 and less on each step
# above) and sets one-tenth of one percent, $1 per $1,000, keeping the
# $25 minimum; the per-employee and flat schedules for other kinds of
# business are unchanged, so the narration speaks of businesses taxed on
# their gross receipts. The resolution's findings and the ballot
# question's purpose list are the City's case and are not narrated; the
# question's claim that smaller businesses would pay less than larger
# ones stays on the card, and the narration states only the two
# schedules. The City staff's agenda report is cited only for the date
# the tax would take effect.
#
# The $2.9 million a year is the ballot question's figure (the staff
# report rounds it to about $3 million; the impartial analysis gives the
# same $2.9 million); no archived source states the City's general fund
# budget to give it a scale (STANDARD.md 6.5; left
# open, under [[question]]).
#
# The sides come from the argument in favor and the argument against on
# the county's page, not from the rebuttals, each line on what its
# argument leads with and comes back to (for: large businesses paying
# their fair share, so smaller ones and residents are not unfairly
# shouldering the cost; against: who pays, and where the money goes).
# No signer and no business is named.

contest = "ca-2026-11-03-concord-measure-o"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "O"
title = "Ballot Question and Election Information"
origin = "City of Concord"
summary = "To protect City of Concord services/ensure smaller businesses pay less than larger businesses, shall the measure be adopted to: repair potholes on neighborhood and major streets; maintain 9-1-1 emergency response; keep parks/playgrounds safe/clean; relieve traffic congestion along major corridors; maintain senior/youth programs; for general government use; by updating Concord’s 37-year-old business license rates to 0.1% of gross receipts until ended by voters, providing an additional $2,900,000 annually, requiring independent citizen oversight?"

[[section]]
id = "what"
heading = "Measure O"

[[section.line]]
text = "Measure O asks the voters of this city whether to replace the tiered business license tax on gross receipts with one rate, $1 for every $1,000."
sources = ["ballot-question", "text"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["updating Concord’s 37-year-old business license rates to 0.1% of gross receipts"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "tiers"
text = "Today, a business taxed on its gross receipts pays $1 per $1,000 on its first $25,000, and lower rates on each step above that."
sources = ["text", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "business-license-certificate"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "rate"
text = "Measure O would charge $1 per $1,000 on all gross receipts, with a $25 minimum, and exempt businesses taking in $5,000 a year or less."
sources = ["text", "resolution", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "city-storefronts"

[[section.line]]
id = "end"
text = "City staff say it would take effect in January 2027, and it would last until voters repeal it."
sources = ["staff-report", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "end-date"

[[section.line]]
id = "audit"
text = "Independent auditors would report each year on $2.9 million of the new money, for review by an existing citizens' oversight committee."
sources = ["text", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "recurring-review"

[[section.line]]
id = "amend"
text = "The City Council could amend these rules later, but not raise or extend the tax without voters."
sources = ["text"]

[section.line.visual]
kind = "illustration"
name = "city-council-chamber"

[[section.line]]
id = "general"
text = "It is a general tax, and it needs a majority of the vote to pass."
sources = ["text", "resolution", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "ballot-box"

[[section]]
id = "fiscal"
heading = "What it would raise"

[[section.line]]
id = "revenue"
text = "The ballot question says Measure O would provide an additional $2.9 million a year."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["providing an additional $2,900,000 annually"]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say the update makes large businesses pay their share, so smaller ones and residents do not have to shoulder the cost of services."
sources = ["argument-for"]
basis = ["ensure that large businesses are paying their fair share, and smaller businesses are not unfairly shouldering the cost of keeping Concord a safe, well-maintained community.", "Measure O ensures smaller businesses, homeowners, and residents aren’t unfairly shouldering the cost of vital local services"]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Large businesses pay their share", "Smaller businesses not overburdened"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say a business tax is in effect a tax on everyone who shops, and its money is not locked into roads or emergency response."
sources = ["argument-against"]
basis = ["A tax on business is, in actual effect, a tax on everyone who spends money in Concord.", "This measure funds the General Fund, not a locked account earmarked specifically for roads or emergency response."]

[section.line.visual]
kind = "list"
source = "argument-against"
items = ["A tax on everyone who shops", "Not locked into roads or emergencies"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote replaces the tiered rates with the single rate of $1 per $1,000."
sources = ["ballot-question", "text"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["updating Concord’s 37-year-old business license rates to 0.1% of gross receipts"]

[[section.line]]
text = "A no vote keeps today's tiered rates."
sources = ["ballot-question", "text"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["updating Concord’s 37-year-old business license rates to 0.1% of gross receipts"]

