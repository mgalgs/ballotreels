# Archived sources for City of Concord Measure O, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# Contra Costa County's Voter Information Guide could not be fetched
# (contracostavote.gov answered a bot challenge). These are the City's
# own files: its "Ballot Question and Election Information" page, and
# item 4.a of the City Council's July 28, 2026 agenda: the resolution
# placing the measure (Attachment 1) and the proposed ordinance with
# its redlined Chapter 5.05 of the Municipal Code (Exhibit A, from the
# agenda packet), which is the measure's full text. Both are agenda
# copies, with their numbers and the Council's vote left blank. No
# impartial analysis, argument or rebuttal was reached, and no document
# says whether any argument was filed.
#
# The card quotes the ballot question from the City's page, which
# prints the same text as Section 3 of the resolution. The July 28
# agenda report is City staff material; the script cites it only for
# the date the change would take effect.

[contest]
id = "ca-2026-11-03-concord-measure-o"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:concord"
kind = "measure"
title = "City of Concord Measure O: A Single Business License Tax Rate of 0.1% of Gross Receipts"

