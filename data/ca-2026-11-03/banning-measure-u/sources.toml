# Archived sources for City of Banning Measure U, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1). The guide's pages are cut from the
# Riverside County Registrar of Voters' County Voter Information Guide
# (ballot type 404, a Banning precinct); "page" is the guide's printed
# footer number.
#
# Measure U is a referendum on Ordinance No. 1618, one of three (with
# Measures V and W) on the same project. The guide does not print the
# ordinance; the City's copy was not retrieved, so no official-text
# source is listed. The guide prints no fiscal analysis.

[contest]
id = "ca-2026-11-03-banning-measure-u"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:banning"
kind = "measure"
title = "City of Banning Measure U: Rezoning Land for the Sunset Crossroads Project"

