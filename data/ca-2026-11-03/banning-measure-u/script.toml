# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks; how a council ordinance came to the ballot (a referendum
# petition); what the ordinance would change (the land's zoning, before
# and after, and the project it allows); no cost estimate; one line per
# side; what a vote does.
#
# The guide prints no fiscal analysis, and the ordinance itself was not
# archived; the City Attorney's Impartial Analysis is the neutral
# explanation. The project's figures (jobs, warehouse floor area, city
# revenue) are the arguments' and stay in the sides (STANDARD.md 6.3).
# The card is the sample ballot's question, which has no short title
# and no yes/no lines: the card's title is the ballot's own header for
# the city's block, and the vote lines take their words from the
# Impartial Analysis.
#
# Sides come from the argument in favor and the argument against, not
# the rebuttals.

contest = "ca-2026-11-03-banning-measure-u"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot"
number = "U"
title = "CITY OF BANNING"
origin = "SAMPLE BALLOT"
summary = "Shall Ordinance No.1618, amending the land uses for property located South of I-10 and the Union Pacific Railroad and West of Sunset Avenue allowing General Commercial, Industrial, Open Space — Parks and Resources land uses on the property and pre-zoning territory within the City's Sphere of Influence located South of the North Boundary of Western Avenue and West of Sunset Avenue for General Commercial, Industrial, Open Space — Parks and Resources land uses, be adopted?"

[[section]]
id = "what"
heading = "Measure U"

[[section.line]]
text = "City of Banning Measure U asks voters in the city whether to approve a zoning change for land west of Sunset Avenue."
sources = ["ballot", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot"
highlight = ["amending the land uses"]

[[section]]
id = "today"
heading = "How it reached the ballot"

[[section.line]]
text = "The City Council adopted the zoning change in April 2026."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "ballot-box"

[[section.line]]
text = "Voters then signed a referendum petition, so the change takes effect only if voters approve it."
sources = ["impartial-analysis"]

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "Today the land is zoned for homes, general commercial use, parks and open space."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "project-site"

[[section.line]]
text = "Measure U would zone it for general commercial, industrial, park and open space uses, under the Sunset Crossroads plan."
sources = ["impartial-analysis", "ballot"]

[[section.line]]
text = "The owner of the property could then build a project with those uses."
sources = ["impartial-analysis"]

[[section]]
id = "fiscal"
heading = "What it would cost"

[[section.line]]
text = "The Riverside County guide does not include a cost estimate for the measure."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"
stamp = "None reported"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say the project would create more than 3,700 permanent jobs, and would bring new shopping and dining closer to home."
sources = ["arguments"]
basis = ["Sunset Crossroads will create more than 3,700 permanent jobs,", "Yes on U will also bring new shopping and dining options closer to home."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["More than 3,700 permanent jobs", "New shopping and dining closer to home"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say nearly 5 million square feet of warehouses means more trucks, pollution and traffic, and Banning can grow without them."
sources = ["arguments"]
basis = ["Nearly 5 million square feet of mega-warehouses means more heavy", "trucks, more diesel pollution, more traffic, more noise, and more harm", "We can have better, long-term jobs and the development Banning wants", "without the mega-warehouses we don’t need."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["More trucks, pollution and traffic", "Banning can grow without the warehouses"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote means Ordinance 1618 will take effect."
sources = ["impartial-analysis", "ballot"]

[section.line.visual]
kind = "page"
