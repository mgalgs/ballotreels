# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and of whom; the parcel tax today; what it needs to pass; what
# would change (the new rate and its length, what the money may pay
# for); the impartial analysis's revenue estimate;
# one line per side; what a vote does.
#
# San Mateo County posts the measure's documents one by one, so the card
# quotes the ballot question, the resolution's heading and its order
# calling the election from Resolution No. 2025-2026/19 (Exhibit B and
# Section I), and names that resolution as its document. The resolution
# prints no yes or no lines, so the card has none; the vote lines take
# their meanings from the impartial analysis and highlight the
# resolution's own phrases, as Utah's do. The impartial analysis prints
# no author, so the script never names one. No archived source states
# the district's budget, so the $3.4 million has no scale (STANDARD.md
# 6.5; left open); $58 and $98 are amounts per parcel (exempt).
#
# The neutral sections give both rates, as the impartial analysis does,
# and leave "replacement" against "raises the tax" to the sides. The
# opponent's bond and other-tax figures are that side's own and stay in
# its argument (STANDARD.md 6.3). Sides come from the argument in favor
# and the argument against, not the supporters' rebuttal (no rebuttal
# to the argument in favor was posted).

contest = "ca-2026-11-03-jefferson-union-high-measure-m"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "M"
title = "With funds that cannot be taken by the State or Federal Government and spent elsewhere, shall Jefferson Union High School District's measure to directly support teachers and academic programs; expand / enhance career training and college preparedness classes; and hire and retain qualified teachers and counselors at Jefferson High School, Oceana High School, Shasta High School, Terra Nova High School, Thornton High School, and Westmoor High School be adopted, replacing the 2018 parcel tax at $98 per parcel for ten years (raising $3.4 million annually) with full public disclosure of all spending?"
origin = "RESOLUTION ORDERING AN ELECTION FOR THE PURPOSE OF SUBMITTING TO THE QUALIFIED ELECTORS OF THE DISTRICT THE QUESTION OF LEVYING AN EDUCATION PARCEL TAX UPON EACH PARCEL IN THE DISTRICT FOR EDUCATIONAL PURPOSES"
summary = "The Board hereby orders an election and submits to the electors of the District the question of whether an education parcel tax shall be levied and collected in the District for the specific purposes as set forth more fully in the ballot proposition"

[[section]]
id = "what"
heading = "Measure M"

[[section.line]]
text = "Jefferson Union High School District Measure M asks the district's voters whether to replace its 2018 parcel tax with a tax of $98 per parcel."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["replacing the 2018 parcel tax at $98 per parcel"]

[[section]]
