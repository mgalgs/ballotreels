# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; how a citizens' initiative reached the ballot;
# the rates the board adopted; what the measure would do and the vote it
# needs; no cost estimate; one line per side; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the opening
# says "the voters of this community services district". The card, the
# title and the "Only voters in ..." line carry the names. "Counsel" is
# heard as "Council" (standard/speakability.txt), so the narration does
# not say it.
#
# The card quotes the question from the board's Resolution No. 26-50,
# which prints no yes and no sentences, so the vote lines take their
# meaning from the impartial analysis's own "Yes" and "No" sentences and
# both highlight the question's subject.
#
# No official source states how much the rates rose or what repeal would
# do to the district's revenue: the "near doubling" is the supporters'
# claim and the revenue loss of about $10 million through 2031 is the
# opponents' (which the supporters call false). So each stays in its own
# side (STANDARD.md 6.3), and the fiscal line says the impartial analysis
# gives no cost estimate. The opponents' line gives the revenue loss
# without its dollar figure: no archived source states the district's
# budget, which the figure would need beside it (STANDARD.md 6.5), and
# the two side lines stay level in spoken length.
#
# Measure S, on the same ballot, repeals the district's police tax; it is
# a separate measure with its own sides and is not mentioned here.

contest = "ca-2026-11-03-bear-valley-csd-measure-r"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "R"
title = "RESOLUTION NO. 26-50"
origin = "OF THE BEAR VALLEY COMMUNITY SERVICES DISTRICT BOARD OF DIRECTORS"
summary = "Shall the Bear Valley Community Services District adopt an ordinance of the Board of Directors of the Bear Valley Community Services District Repeal of Water Rate Increases Enacted By Resolution No. 26-29 Of The Bear Valley Community Services District Board Of Directors On March 26, 2026?"

[[section]]
id = "what"
heading = "Measure R"

[[section.line]]
text = "Measure R asks the voters of this community services district whether to repeal the water rate increases its board adopted in March 2026."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["Repeal of Water Rate Increases"]

[[section]]
id = "background"
heading = "How it reached the ballot"

[[section.line]]
id = "petition"
text = "Measure R is a citizens' initiative, placed on the ballot by a petition signed by at least 10 percent of the district's registered voters."
sources = ["impartial-analysis", "resolution"]

[section.line.visual]
kind = "illustration"
name = "neighborhood-petition"

[[section.line]]
text = "The board then ordered it put to the voters without changes."
sources = ["impartial-analysis", "resolution"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "rates"
text = "On March 26, 2026, the district's board adopted updated water rates for the properties it serves."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "utility-bills"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "repeal"
text = "Measure R would repeal the March 2026 rate increases in full."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "water-service-line"

[[section.line]]
id = "threshold"
text = "Measure R needs a majority of the vote to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "fiscal"
heading = "What it would cost"

[[section.line]]
id = "no-estimate"
text = "The impartial analysis does not include a cost estimate for the measure."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"
stamp = "None reported"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say the board voted to nearly double water rates within four years, threatening home values and residents' ability to stay."
sources = ["argument-for"]
basis = ["Board of Directors voted to nearly DOUBLE WATER RATES within four years", "These outrageously high and destructive increases threaten home values and the ability of families, seniors and fixed income residents to continue to live in Bear Valley."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Rates nearly doubled within four years", "Threatens home values and residents"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say repeal would cut the revenue needed for essential projects on a complex water system more than 50 years old."
sources = ["argument-against"]
basis = ["the delivery of water in Bear Valley Springs depends upon a very complex system that is over 50 years old", "if the approved rates are repealed, revenue would be reduced by approximately $10 million through 2031.", "cause deferment or cancellation of essential projects"]

[section.line.visual]
kind = "list"
source = "argument-against"
items = ["Less revenue for essential projects", "Water system over 50 years old"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote repeals the water rate increases the board adopted in March 2026."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["Repeal of Water Rate Increases"]

[[section.line]]
text = "A no vote keeps the water rates the board adopted in March 2026 in place."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["Repeal of Water Rate Increases"]

[[question]]
ask = "Who put this on the ballot?"
lines = ["petition"]

[[question]]
ask = "What would happen to my water rates?"
lines = ["rates", "repeal"]

[[question]]
ask = "How much did the rates go up?"
unanswered = true

[[question]]
ask = "How would repeal affect the district's budget?"
lines = ["no-estimate"]

[[question]]
ask = "What vote does the measure need to pass?"
lines = ["threshold"]
