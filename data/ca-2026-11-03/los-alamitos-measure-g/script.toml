# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and who placed it; the hotel tax today and what it raises; what
# would change (the rate; a general tax for any city service); the
# ballot question's revenue estimate; one line per side; what a vote
# does.
#
# The City Attorney's Impartial Analysis is cited as the guide page. The
# guide prints no tax rate statement or fiscal analysis; the one estimate
# of the added revenue is the ballot question's (the analysis gives the
# same figure without a period). It and today's $600,000 are city
# revenue, and no archived source states the city's general fund budget,
# so they have no budget scale (STANDARD.md 6.5; left open); the analysis
# states today's revenue itself, which the script gives beside the
# estimate. That visitors pay and that the state cannot take the money
# are the supporters' points, so they stay out of the neutral sections
# (STANDARD.md 6.3). The script names no one.
#
# No argument against was submitted ("No argument against this measure
# was submitted."): the no side says so, filed = false (STANDARD.md 2.5).

contest = "ca-2026-11-03-los-alamitos-measure-g"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide-page"
number = "G"
title = "City of Los Alamitos, Los Alamitos Hotel Tax (TOT Measure)"
origin = "Measure G was placed on the ballot by the Los Alamitos City Council"
summary = "Shall the ordinance providing funding for City of Los Alamitos’ general services such as maintaining 911 emergency response and police services; providing neighborhood police patrols; maintaining parks; supporting youth, afterschool, and senior programs; repairing streets and potholes; by increasing the City of Los Alamitos’ transient occupancy tax, paid only by hotel/motel and short-term rental guests, from 8% to 12%, providing approximately $300,000 annually be adopted?"
yes = "A “yes” vote on Measure G is a vote to increase the TOT tax rate from 8% to 12%."
no = "A “no” vote on Measure G is a vote to maintain the current TOT tax rate at 8%."

[[section]]
id = "what"
heading = "Measure G"

[[section.line]]
text = "Los Alamitos Measure G asks the voters of Los Alamitos whether to raise the hotel tax from 8 percent to 12 percent."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["increasing the City of Los Alamitos’ transient occupancy tax"]

[[section.line]]
text = "The Los Alamitos City Council placed Measure G on the ballot."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "school-board-room"

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Today, hotel guests in Los Alamitos pay an 8 percent tax on room rent, for stays of 30 days or less."
sources = ["guide-page"]

[section.line.visual]
kind = "bars"
title = "Los Alamitos hotel tax rate"
source = "guide-page"
unit = "%"
labels = ["Today", "With Measure G"]
