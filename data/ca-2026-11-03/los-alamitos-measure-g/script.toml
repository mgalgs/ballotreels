[[section.line]]
text = "That tax brings about $600,000 a year into the general fund, which pays for general city services."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "city-storefronts"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
