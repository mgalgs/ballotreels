# Archived sources for Liberty Union High School District Measure X,
# 2026-11-03 general election (sources/sources.md). Every id here may be
# cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# Every source is one page: Contra Costa County Elections' page for
# Measure X (read in a browser and saved as text, sources/county-page.txt),
# which prints, in order, the ballot question the card quotes, County
# Counsel's impartial analysis (the measure's neutral explanation, the
# kind a state's attorney general's explanatory statement is), the
# District's tax rate statement (the measure's fiscal statement), the
# argument in favor and its rebuttal, and the argument against and its
# rebuttal. The page goes on to print the measure's full text and bond
# project list, which were not saved, so no source here is the full text:
# the impartial analysis is cited for what the measure provides. The
# District's own Measure X page (sources/district-measure-x-page.html)
# is its informational material and is not cited.

[contest]
id = "ca-2026-11-03-liberty-union-high-measure-x"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/school_district:liberty_union_high_school_district"
kind = "measure"
title = "Liberty Union High School District Measure X: $165 Million in School Facilities Repair and Upgrade Bonds"

