[section.line.visual]
kind = "page"
source = "county-page"
highlight = ["authorizing $165,000,000 in bonds at legal rates"]

[[question]]
ask = "What would the money pay for?"
lines = ["uses", "guarantee"]

[[question]]
ask = "What would it cost a property owner?"
lines = ["rate"]

[[question]]
ask = "Who checks how the money is spent?"
lines = ["oversight"]

[[question]]
ask = "How large is the bond next to the district's budget?"
unanswered = true
