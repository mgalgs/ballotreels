# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; who proposed it and the vote it
# needs; what the money could pay for, and who would check the spending;
# what approval does not guarantee; the tax rate statement's estimates;
# one line per side; what a vote does.
#
# No place name is narrated (the narrator mispronounces them), nor the
# names of the district's high schools (one shares the district's name):
# the opening says "the voters of this school district". The card and
# the title carry the names. No person or organization is named.
#
# The card quotes the ballot question as the county's Measure X page
# prints it. The page prints no yes/no lines, so the card has no boxes;
# the vote lines give County Counsel's meanings. The neutral lines rest
# on the impartial analysis (not named aloud: "Counsel" is heard as
# "Council"); the full text and project list were not archived.
#
# The figures are the tax rate statement's, attributed to it, as
# printed: an average and a highest rate both of $20 per $100,000 of
# assessed value, the last year "2057-58" (narrated "2057-2058",
# standard/speakability.txt), and total debt service of "approximately
# $350 million". No per-home figure is computed. No archived source
# states the district's budget, so the $165 million and the $350 million
# have no scale (STANDARD.md 6.5; left open); the rate per $100,000 of
# assessed value is a per-property amount, exempt.
#
# Sides: each line's basis is quoted from its own argument, not the
# rebuttals. The yes side's "$35 million in state matching funds" and
# the no side's $700,000-home figures and earlier bond amounts are left
# out to keep the sides' spoken length even; the neutral "guarantee" line
# gives the impartial analysis's caution on state matching funds.

contest = "ca-2026-11-03-liberty-union-high-measure-x"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "county-page"
number = "X"
title = "MEASURE X"
origin = "LIBERTY UNION HIGH SCHOOL DISTRICT"
summary = "In order to repair and improve aging classrooms, fix deteriorating roofs, plumbing, heating, ventilation and electrical systems, remove asbestos/ lead pipes, upgrade science labs, libraries, technology and other facilities to support college/ career readiness in math, science, health, engineering, arts and skilled trades; shall Liberty Union High School District’s measure be adopted authorizing $165,000,000 in bonds at legal rates, levying $20 per $100,000 assessed value (raising $11,300,000 annually) while bonds are outstanding and all funds benefiting local schools?"

[[section]]
id = "what"
heading = "Measure X"

[[section.line]]
text = "Measure X asks the voters of this school district whether to approve $165 million in bonds to repair and upgrade school facilities."
sources = ["county-page", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "county-page"
highlight = ["authorizing $165,000,000 in bonds at legal rates"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "placed"
text = "The district proposed the bonds by resolution, and the measure needs 55 percent of the vote to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "school-board-room"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "uses"
text = "The money could pay for projects such as roofs, plumbing, heating and electrical systems, removing asbestos and lead pipes, and science labs."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "school-roof-repair"

[[section.line]]
id = "oversight"
text = "A citizens' oversight committee and yearly performance and financial audits would check the spending."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "inspection-clipboard"

[[section.line]]
id = "guarantee"
text = "Approval does not guarantee funding beyond the bond money, and some projects may count on state matching funds that are not assured."
sources = ["impartial-analysis"]

[[section]]
id = "fiscal"
heading = "What the tax statement says"

[[section.line]]
id = "rate"
text = "The district's tax rate statement estimates a tax of $20 per $100,000 of assessed value, both on average and at its highest, through 2057-2058."
sources = ["tax-statement"]

[section.line.visual]
kind = "bars"
title = "Estimated tax per $100,000 of assessed value, dollars"
source = "tax-statement"
unit = ""
labels = ["Average over the bonds' life", "Highest"]
values = [20, 20]

[[section.line]]
id = "repay"
text = "The statement puts the total to repay, with interest, at about $350 million."
sources = ["tax-statement"]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say many facilities are over 60 years old and need critical repairs, and that oversight and audits are required."
sources = ["argument-for"]
basis = ["Measure X will fund critical repairs and upgrades needed for student success.", "Many facilities are more than 60 years old.", "Independent citizens’ oversight and annual audits are required to ensure funds are spent as promised."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Aging facilities need critical repairs", "Required oversight and yearly audits"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say Measure X adds costs to two existing bonds still being paid off, and its project list is not specific."
sources = ["argument-against"]
basis = ["Measure X increases costs for residents by $350 million of total debt service through 2058.", "Liberty Union High School District (LUHSD) is still paying off existing construction/maintenance bonds", "Vote No because Measure X’s project list isn’t sufficiently specific."]

[section.line.visual]
kind = "list"
source = "argument-against"
items = ["Adds to two bonds still owed", "Project list is not specific"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote is in favor of authorizing the bonds."
sources = ["impartial-analysis", "county-page"]

[section.line.visual]
kind = "page"
source = "county-page"
highlight = ["authorizing $165,000,000 in bonds at legal rates"]

[[section.line]]
text = "A no vote is against authorizing the bonds."
