# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; how it reached the ballot; the
# tax today; what would change (the new rate and total, a general tax
# into the general fund, until ended by voters, a simple majority); the
# revenue as the ballot question gives it; the two sides, whose
# arguments are not online; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". The card, title and chart
# title carry it.
#
# Only the county's List of Local Measures (the card) and the City
# Council's Resolution No. 2026-042, adopted and signed, whose ballot
# question matches the county's word for word, are cited; its Exhibit A
# is the ordinance voters would adopt. The ballot question's list of uses
# is on the card, and not narrated: the money is a general tax's, for
# unrestricted general city purposes.
#
# The county says the measure's documents are filed with the city clerk;
# none is online, so it is not known whether any argument was filed. Each
# side says only that any argument is filed with the city clerk and is
# not online (filed = false, STANDARD.md 2.5), and presents no side.
#
# The $1.9 million and $11.7 million a year are the ballot question's
# figures. No archived source states the City's general fund budget, so
# they have no scale (STANDARD.md 6.5; left open, under [[question]]).

contest = "ca-2026-11-03-carmel-by-the-sea-measure-m"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "measure-list"
number = "M"
title = "City of Carmel-By-The-Sea"
origin = "Majority Voter Approval Required"
summary = "To upgrade streets/sidewalks, address beach erosion, enhance wildfire preparedness, maintain City trees, and fund other general government purposes in City of Carmel-by-the-Sea, shall the measure establishing a new 2% transient occupancy tax, paid by lodging guests, in addition to the existing 10% transient occupancy tax, increasing the total tax rate to 12%, with the new 2% tax generating approximately $1,900,000 annually, and the total 12% tax generating $11,700,000 annually, until ended by voters, be adopted?"

[[section]]
id = "what"
heading = "Measure M"

[[section.line]]
text = "Measure M asks the voters of this city whether to add a new 2 percent tax on lodging stays, on top of the existing 10 percent tax."
sources = ["measure-list", "resolution"]

[section.line.visual]
kind = "page"
source = "measure-list"
highlight = ["establishing a new 2% transient occupancy tax"]

[[section]]
id = "background"
heading = "How it reached the ballot"

[[section.line]]
text = "All five members of the City Council voted to place Measure M on the ballot."
sources = ["resolution"]

[section.line.visual]
kind = "illustration"
name = "city-council-chamber"

[[section]]
id = "today"
heading = "The tax today"

[[section.line]]
text = "Lodging guests pay a tax of 10 percent of the rent charged."
sources = ["resolution"]

[section.line.visual]
kind = "illustration"
name = "hotel-front-desk"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "Measure M would add a new 2 percent tax, for a total of 12 percent of the rent."
sources = ["resolution"]

[section.line.visual]
kind = "bars"
title = "Lodging tax rate in Carmel-by-the-Sea"
source = "resolution"
unit = "%"
labels = ["Today", "With Measure M"]
values = [10, 12]

[[section.line]]
id = "uses"
text = "As a general tax, the money from the new tax would go to the general fund, for any general city purpose."
sources = ["resolution"]

[section.line.visual]
kind = "illustration"
name = "state-budget"

[[section.line]]
id = "end"
text = "The new tax would last until ended by voters, and needs a simple majority to pass."
sources = ["resolution"]

[section.line.visual]
kind = "illustration"
name = "end-date"

[[section]]
id = "fiscal"
heading = "What the ballot question says"

[[section.line]]
id = "revenue"
text = "The ballot question says the new tax would raise about $1.9 million a year, and the total tax about $11.7 million."
sources = ["measure-list"]

[section.line.visual]
kind = "bars"
title = "Lodging tax revenue a year, Carmel-by-the-Sea"
source = "measure-list"
unit = ""
labels = ["New 2% tax", "Total 12% tax"]
values = [1900000, 11700000]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"
filed = false

[[section.line]]
text = "Any argument for Measure M is filed with the city clerk, and is not online."
sources = ["measure-list"]

[section.line.visual]
kind = "list"
source = "measure-list"
items = ["Filed with the city clerk, not online"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "Any argument against Measure M is filed with the city clerk, and is not online."
sources = ["measure-list"]

[section.line.visual]
kind = "list"
source = "measure-list"
items = ["Filed with the city clerk, not online"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote adopts the new 2 percent tax on lodging stays."
sources = ["measure-list", "resolution"]

[section.line.visual]
kind = "page"
source = "measure-list"
highlight = ["establishing a new 2% transient occupancy tax"]

[[section.line]]
text = "A no vote does not adopt the new 2 percent tax on lodging stays."
sources = ["measure-list", "resolution"]

[section.line.visual]
kind = "page"
source = "measure-list"
highlight = ["establishing a new 2% transient occupancy tax"]

[[question]]
ask = "What could the money be spent on?"
lines = ["uses"]

[[question]]
ask = "When would the new tax end?"
lines = ["end"]

[[question]]
ask = "What do supporters and opponents say?"
unanswered = true

[[question]]
ask = "How big is $1.9 million a year next to the city budget?"
unanswered = true
