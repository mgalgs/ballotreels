# Archived sources for City of Carmel-by-the-Sea Measure M, 2026-11-03
# general election (sources/county-sources.md, sources/sources.md). Every
# id here may be cited by script.toml. `kind` must be one the standard
# allows (docs/STANDARD.md, section 1).
#
# The County of Monterey Elections Department's List of Local Measures
# gives Measure M's letter, vote threshold and ballot question, and says
# "All related documents are filed and on public review with the city
# clerk." The impartial analysis, the arguments and any rebuttals are
# not posted online by the county or the City, so none is cited.
#
# The City Council's Resolution No. 2026-042, adopted and signed June 2,
# 2026, orders the measure; its ballot question matches the county's word
# for word, and its Exhibit A is the proposed Ordinance No. 2026-002, the
# measure's full text. The City's PDF is a scan whose OCR layer garbles
# many characters, so the passages cited were typed from the page images
# into sources/resolution-2026-042-transcription.txt, which names the PDF
# and URL it copies; that source points at the transcription, and its
# url at the scan.

[contest]
id = "ca-2026-11-03-carmel-by-the-sea-measure-m"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:carmel-by-the-sea"
kind = "measure"
title = "City of Carmel-by-the-Sea Measure M: A New 2% Transient Occupancy Tax"

[[source]]
id = "measure-list"
kind = "official-title-summary"
publisher = "County of Monterey Elections Department, List of Local Measures, November 3, 2026 General Election: City of Carmel-By-The-Sea Measure M"
