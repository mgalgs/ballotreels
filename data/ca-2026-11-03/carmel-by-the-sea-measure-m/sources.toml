credit = "Resolution No. 2026-042, City of Carmel-by-the-Sea"
url = "https://ci.carmel.ca.us/sites/main/files/file-attachments/2026-06-02_r_2026-042_-_ordering_submission_of_ballot_measure_for_tot_for_11-3-26_election.pdf?1781647367"
