# Archived sources for El Rancho Unified School District Measure ED, 2026-11-03
# general election (sources/la-sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The Los Angeles County Registrar-Recorder/County Clerk's list "Measures
# Appearing on the Ballot" prints the measure's letter, vote threshold and
# ballot question, and says in words who filed the primary arguments
# ("Supporters: ... Opponents: None submitted."). The card quotes the
# ballot question from it (ballot-question), and the no side cites it as
# the Registrar's statement of filing (measure-list).
#
# The impartial analysis, the full text, the tax rate statement and the
# argument in favor are the Registrar's own copies from its Interactive
# Sample Ballot, saved as HTML (the contest data's URL is in each file).

[contest]
id = "ca-2026-11-03-el-rancho-unified-measure-ed"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/school_district:el_rancho_unified_school_district"
kind = "measure"
title = "El Rancho Unified School District Measure ED: $118 Million School Repair Bond"

[[source]]
id = "ballot-question"
kind = "official-title-summary"
publisher = "Los Angeles County Registrar-Recorder/County Clerk, Measures Appearing on the Ballot, General Election November 3, 2026 (Rev. 9/22/26): El Rancho Unified School District, Measure ED"
credit = "Measures Appearing on the Ballot, Los Angeles County Registrar-Recorder/County Clerk"
url = "https://content.lavote.gov/docs/rrcc/documents/final-measures-appearing-on-the-ballot-9-22-2026-v-2.pdf"
