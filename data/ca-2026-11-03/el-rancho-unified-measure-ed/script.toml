# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; who placed it and the vote it needs; what
# the money may and may not pay for; the tax rate statement's estimates,
# with its own caveat; one line per side; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the opening
# says "the voters of this school district". The card and title carry the
# names. "Counsel" is heard as "Council" (standard/speakability.txt), so
# the narration says "the impartial analysis". The last fiscal year is
# said with both years in full.
#
# The card quotes the Los Angeles County Registrar-Recorder/County Clerk's
# list "Measures Appearing on the Ballot", which prints the ballot question
# with no yes and no sentences, so the card has no boxes and the two vote
# lines highlight the same phrase of the question.
#
# The tax rate statement's average rate is $54.19 and its highest $60
# per $100,000 of assessed value; the script gives both, the total debt
# service, and the statement's own caveat on its estimates. The bonds are
# repaid from a tax on property in the district, not from the district's
# budget, and no archived source states that budget, so the figures have
# no budget scale (STANDARD.md 6.5; left open), as other school bonds' do.
#
# The argument in favor is the Registrar's printed copy. The list says
# "Opponents: None submitted.", so the no side says plainly that no
# argument against was submitted, citing the list (filed = false). Its
# clause on what the list records balances the yes line's length without
# a further claim.

contest = "ca-2026-11-03-el-rancho-unified-measure-ed"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "ED"
title = "EL RANCHO UNIFIED SCHOOL DISTRICT"
origin = "VOTE PASSAGE – 55% of the Votes Cast"
summary = "With funds that cannot be taken by the State or Federal government, shall El Rancho Unified School District's measure to update inefficient heating and air-conditioning systems; replace aging plumbing and roofs; improve school safety; and modernize and equip classrooms and facilities be adopted, authorizing $118 million in bonds with legal rates, average annual levies below $55 per $100,000 of assessed valuation ($7.9 million annually while outstanding), annual audits, no administrator salaries, independent oversight, and disclosure of all spending?"

[[section]]
id = "what"
heading = "Measure ED"

[[section.line]]
text = "Measure ED asks the voters of this school district whether to approve $118 million in school bonds."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["authorizing $118 million in bonds"]

[[section]]
id = "today"
heading = "How it reached the ballot"

[[section.line]]
id = "threshold"
text = "The district's governing board placed Measure ED on the ballot, and it needs 55 percent of the vote to pass."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "projects"
text = "The bond money could pay to update heating and air conditioning, replace plumbing and roofs, improve school safety, and modernize classrooms."
sources = ["ballot-question", "impartial-analysis", "text"]

[section.line.visual]
kind = "illustration"
name = "school-roof-repair"

[[section.line]]
id = "limits"
text = "The money could not pay teacher or administrator salaries, and a citizens' oversight committee and yearly audits would be required."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "inspection-clipboard"

[[section]]
id = "fiscal"
heading = "What the tax rate statement says"

[[section.line]]
id = "rate"
text = "The district's tax rate statement estimates an average tax of $54.19 per $100,000 of assessed value, and a highest of $60, through 2057-2058."
sources = ["tax-statement"]

[section.line.visual]
kind = "bars"
title = "Estimated tax per $100,000 of assessed value, dollars"
source = "tax-statement"
unit = ""
labels = ["Average", "Highest"]
values = [54.19, 60]

[[section.line]]
id = "total"
text = "The statement puts the total to repay, with interest, at about $246.5 million, and says its figures are estimates, not maximum amounts."
sources = ["tax-statement"]

[section.line.visual]
kind = "illustration"
name = "debt-payments"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say the measure keeps schools safe and functional before repairs become costly emergencies, and the funds cannot be taken by the state."
sources = ["argument-for"]
basis = ["keeping our schools safe and functional today, before necessary repairs become costly emergencies", "funds cannot be taken by the state or federal government and spent elsewhere"]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Repairs before costly emergencies", "State cannot take the funds"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "The official list of measures from the county, which names who filed each argument, says no argument against Measure ED was submitted."
sources = ["measure-list"]

[section.line.visual]
kind = "list"
source = "measure-list"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote approves the $118 million in school bonds."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["authorizing $118 million in bonds"]

[[section.line]]
text = "A no vote rejects the $118 million in school bonds."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["authorizing $118 million in bonds"]

[[question]]
ask = "How much tax would I pay, and for how long?"
lines = ["rate"]

[[question]]
ask = "What could the money be spent on?"
lines = ["projects", "limits"]

[[question]]
ask = "What vote does the measure need to pass?"
lines = ["threshold"]

[[question]]
ask = "What would the bonds cost in all?"
lines = ["total"]

[[question]]
ask = "How large is the bond next to the district's yearly budget?"
unanswered = true
