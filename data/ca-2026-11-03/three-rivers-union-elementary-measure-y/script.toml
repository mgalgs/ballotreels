# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; how long the tax runs and the vote it needs;
# what the money may pay for, the share set aside for the athletic
# fields, its limits and who is exempt; the revenue figure; both sides, neither of
# which has an archived argument; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this school district", and the fields are
# "the school's upper athletic fields". The card and title carry the
# names.
#
# The county guide could not be fetched, so no impartial analysis was
# archived. The card quotes the ballot question from the Registrar's
# notice of election (its own words, "to be displayed on each individual
# ballot"), and every line on what the tax does rests on the Board's
# Resolution No. 27-01 and its Exhibit A as the Registrar posted them.
# The notice prints the ballot's "Yes ___ No ___" blanks and no yes/no
# sentences, so the card has no boxes and both vote lines highlight the
# same phrase of the question. The question's opening purpose ("To
# offset inflation and limited state funding") and the resolution's
# recitals are the District's case for the tax, and are not narrated.
#
# The ballot question's $276,000 a year is district revenue, and no
# archived source states the district's budget, so it has no scale
# (STANDARD.md 6.5; left open). $120 is an amount per parcel (exempt).
#
# No argument for or against Measure Y was archived, and no document
# says whether any was filed. So the sides do not say none was filed:
# each says none is among the documents gathered (filed = false,
# STANDARD.md 2.5), as for Walnut Creek Measure U.

contest = "ca-2026-11-03-three-rivers-union-elementary-measure-y"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "notice"
number = "Y"
title = "THREE RIVERS UNION ELEMENTARY SCHOOL DISTRICT"
origin = "PUBLICATION NOTICE OF A SPECIAL PARCEL TAX ELECTION"
summary = "To offset inflation and limited state funding, shall the Three Rivers Union Elementary School District's measure to levy a $120 parcel tax for eight years (raising approximately $276,000 annually) to fund school operations and maintenance costs including utilities; facility/grounds upkeep/safety improvements, and a community garden, with no money used for teacher or administrative salaries and setting aside at least 25% for improvements to and maintenance of Three Rivers School's upper athletic fields for community use during non-school hours, be adopted?"

