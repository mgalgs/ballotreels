# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the rate today; what would
# change (the new rate and the combined rate, the existing Measure M tax
# beside it, where the money goes, when it starts and how long it lasts,
# the vote it needs); the ballot question's revenue estimate; one line
# per side; what a vote does.
#
# The card quotes the ballot question from Resolution No. 2026-106,
# which prints no yes/no lines. So the card has no YES/NO boxes, the
# vote lines give the impartial analysis's meanings, and both highlight
# the same phrase of the question. A rate in cents is misheard
# (standard/speakability.txt), so the narration gives it as the analysis
# does, "one percent (1%)".
#
# The impartial analysis's background, a projected general fund deficit
# of about $12 million after about $9 million in cuts, is argued by both
# sides (a "structural budget deficit"; a "temporary budget shortfall"),
# so it stays in their sections, not the neutral ones (STANDARD.md 6.3);
# it also has no budget total to give it a scale. The analysis gives no
# revenue estimate; the $28 million a year is the ballot question's
# ("twenty-eight million dollars"), and no archived source states the
# City's general fund budget to give it a scale (STANDARD.md 6.5; left
# open, under [[question]]). The opponents' city rate (0.875 percent)
# differs from the analysis's city share (1.75 percent, with Measure M);
# the narration gives only the analysis's figures. That the tax leaves
# out groceries and prescriptions is the supporters' point, so the
# neutral lines leave it out (STANDARD.md 6.3).

contest = "ca-2026-11-03-vacaville-measure-v"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "V"
title = "Vacaville Essential Services Measure of 2026"
origin = "RESOLUTION NO. 2026-106"
summary = "Shall the citizens of Vacaville adopt a measure maintaining the City’s financial stability and essential services—including 911 emergency response; fire and ambulance protection; crime prevention; parks and recreation; safe public spaces; supporting local businesses; repairing streets; and other general City services—by establishing an additional one-cent sales tax providing approximately twenty-eight million dollars annually, with local control, citizens oversight, annual audits, and public reporting, until ended by voters?"

[[section]]
id = "what"
heading = "Measure V"

[[section.line]]
text = "Measure V asks the voters of this city whether to add a new 1 percent sales tax for city services."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["establishing an additional one-cent sales tax"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Today, the combined sales tax rate in the city is 8.125 percent, and the city keeps 1.75 percent of it."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "sales-receipt"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "Measure V would raise the combined rate to 9.125 percent."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "bars"
title = "Combined sales tax rate in Vacaville"
source = "impartial-analysis"
unit = "%"
labels = ["Today", "With Measure V"]
values = [8.125, 9.125]

[[section.line]]
text = "The new tax would be in addition to an existing three-quarter percent city sales tax, which would not change."
sources = ["impartial-analysis"]

[[section.line]]
id = "general"
text = "The money would go into the city general fund for any lawful purpose, with a citizens oversight committee and independent audits."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "state-budget"

[[section.line]]
id = "end"
text = "The tax would start in April 2027 and last until repealed by voters, and the measure needs a simple majority."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "end-date"

[[section]]
id = "fiscal"
heading = "What it would raise"

[[section.line]]
id = "revenue"
text = "The ballot question estimates Measure V would raise about $28 million a year."
sources = ["ballot-question"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say a structural budget deficit threatens city services, and visitors who shop in the city will help pay for them."
sources = ["argument-for"]
basis = ["Vacaville faces a structural budget deficit due to decreased revenues and rising costs which threatens many services our families rely on.", "Visitors and non-residents who shop in Vacaville will help pay for the services they use, reducing the burden on Vacaville residents."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Budget deficit threatens services", "Visitors who shop here help pay"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say the budget shortfall is temporary but the tax is permanent, and the council can spend it however it chooses."
sources = ["argument-against"]
basis = ["The City faces a temporary budget shortfall, but Measure V proposes a permanent high tax increase.", "the money goes to the City's general fund, to be spent however the City Council chooses."]

[section.line.visual]
kind = "list"
source = "argument-against"
items = ["Temporary shortfall, permanent tax", "Council spends it as it chooses"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote approves the additional 1 percent sales tax."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["establishing an additional one-cent sales tax"]

[[section.line]]
text = "A no vote rejects the additional 1 percent sales tax."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["establishing an additional one-cent sales tax"]

[[question]]
ask = "When would the tax start and end?"
lines = ["end"]

[[question]]
ask = "What can the money be spent on?"
lines = ["general"]

[[question]]
ask = "How big is $28 million a year next to the city budget?"
unanswered = true
