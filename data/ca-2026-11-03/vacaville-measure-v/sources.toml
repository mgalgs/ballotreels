credit = "City Attorney’s Impartial Analysis of Measure V"
url = "https://content.solanocounty.gov/sites/default/files/2026-08/Impartial_Analysis.FINAL_Measure_V.pdf"
file = "sources/impartial-analysis-transcription.txt"
retrieved = "2026-10-28"

