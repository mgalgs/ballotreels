# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and who placed it; the sales tax today; what would change (the
# rate, how long, the two funds); the city's revenue estimate as the
# impartial analysis gives it; one line per side; what a vote does.
#
# The City Attorney's Impartial Analysis is cited as the guide page. The
# guide prints no tax rate statement or fiscal analysis; the one revenue
# estimate is the city's, as the analysis reports it. It is city revenue,
# and no archived source states the city's budget, so it has no scale
# (STANDARD.md 6.5; left open). That visitors pay part of the tax, that
# groceries are exempt, and that the city pays about $12 million a year
# for fire service are the sides' points, so they stay out of the neutral
# sections (STANDARD.md 6.3). The script names no one.

contest = "ca-2026-11-03-san-clemente-measure-m"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide-page"
number = "M"
title = "City of San Clemente, San Clemente Natural Hazards Sales Tax Citizens Initiative"
origin = "A petition signed by the requisite number of San Clemente voters placed Measure M on the ballot"
summary = "Shall the measure establishing two funds dedicated to protecting San Clemente from natural hazards of beach erosion and fires and a 1% sales tax increase, providing approximately $15,000,000 annually for 10 years, requiring public spending disclosure, independent audits, all funds used locally for specified purposes only, including sand replenishment/ nourishment/ retention, beach erosion control, maintaining/ restoring beach access/ water quality and supporting fire protection/ prevention programs/ services, be adopted?"
yes = "A “Yes” vote is a vote in favor of the tax."
no = "A “No” vote is a vote against the tax."

[[section]]
id = "what"
heading = "Measure M"

[[section.line]]
text = "San Clemente Measure M asks the voters of San Clemente whether to add a 1 percent sales tax for beach and fire protection."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["a 1% sales tax increase"]

[[section.line]]
text = "Voters placed Measure M on the ballot by signing a petition."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "ballot-box"

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Today, the sales tax in San Clemente is 7.75 percent."
sources = ["guide-page"]

[section.line.visual]
kind = "bars"
title = "Sales tax rate in San Clemente"
source = "guide-page"
unit = "%"
labels = ["Today", "With Measure M"]
values = [7.75, 8.75]

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "Measure M would raise it to 8.75 percent for 10 years."
sources = ["guide-page"]

[[section.line]]
text = "Half the money would go to a beach fund, with at least 70 percent of that spent on adding sand and controlling erosion."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "beach-sand-replenishment"

[[section.line]]
text = "The other half would go to a fund for fire protection and wildfire prevention."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "hillside-brush-clearing"

[[section.line]]
text = "A city committee would review the spending, and both funds would be audited every year."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "recurring-review"

[[section]]
id = "fiscal"
heading = "What it would raise"

[[section.line]]
text = "The impartial analysis says the city estimates the tax would raise about $15 million a year."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Measure M restores beaches and prevents wildfires before disaster strikes, with every dollar legally restricted to those uses."
sources = ["arguments"]
basis = ["Vote YES to restore San Clemente’s beaches, protect our neighborhoods, and secure our future.", "Investing in wildfire prevention before disaster strikes, not after, helps protect lives, homes, and neighborhoods", "Every dollar is legally restricted: 50% for wildfire prevention and fire protection, and 50% for beach protection"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Restores beaches and prevents wildfires", "Every dollar legally restricted"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say Measure M makes the city the highest-taxed in South Orange County, and fire money could replace existing funding."
sources = ["arguments"]
basis = ["An 8.75% tax would make San Clemente the highest-taxed in South Orange County.", "Without that safeguard, new tax revenue could replace existing funding instead of increasing fire protection."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Highest sales tax in South Orange County", "Fire money could replace existing funds"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote is a vote in favor of the tax."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["in favor of the tax"]

[[section.line]]
text = "A no vote is a vote against the tax."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["against the tax"]
