# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks; what the fund pays for; how it is funded today;
# what would change; the Controller's cost, with the General Fund total
# the Controller gives beside it; one line per side; what a vote does.
#
# Every dollar figure is about the General Fund, whose total the
# Controller's Statement gives ("approximately $7 billion"). The
# contribution figures are yearly: last year's $50.8 million is under 1
# percent of it and the $125 million goal about 2 percent; the
# Controller's $60 million is for 2034-2035, so the total is stated beside
# it as today's rather than divided into it (STANDARD.md 6.5). The higher
# income limit for down payment loans is the opponents' point, and "no
# new taxes" and the freeze in a deficit (their "fiscal guardrails") the
# supporters', so each stays in its side (6.3).

contest = "ca-2026-11-03-san-francisco-county-measure-c"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "digest"
number = "C"
title = "Contributions to the Housing Trust Fund"
origin = "On July 14, 2026, the Board of Supervisors voted 11 to 0 to place Proposition C on the ballot."
summary = "Shall the City amend the Charter to change how the City’s annual contributions to the Housing Trust Fund are set, increase funding and expand programs for affordable housing, and extend the Fund to 2058?"
yes = "If you vote “yes,” you want to amend the Charter to change how the City’s annual contributions to the Housing Trust Fund are set, increase funding and expand programs for affordable housing, and extend the Fund to 2058."
no = "If you vote “no,” you do not want to make these changes."

[[section]]
id = "what"
heading = "Proposition C"

[[section.line]]
text = "San Francisco Proposition C asks voters whether to put more city money into the Housing Trust Fund, and extend the fund to 2058."
sources = ["digest"]

[section.line.visual]
kind = "page"
source = "digest"
highlight = ["Shall the City amend the Charter"]

[[section]]
id = "background"
heading = "What the fund does"

[[section.line]]
text = "The Housing Trust Fund pays to build, buy and improve affordable housing, and makes down payment loans."
sources = ["digest"]

[section.line.visual]
kind = "illustration"
name = "home-building"

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Each year the city puts money into the fund, rising or falling with General Fund revenue."
sources = ["digest"]

[section.line.visual]
kind = "illustration"
name = "set-aside-funds"

[[section.line]]
text = "Last year the city put in $50.8 million, less than 1 percent of the General Fund of about $7 billion."
sources = ["digest", "controller"]

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "Proposition C would make the yearly payment grow faster, until it reaches $125 million, about 2 percent of the General Fund."
sources = ["digest", "controller"]

[section.line.visual]
kind = "bars"
title = "Yearly payment into the fund, $ millions"
source = "digest"
unit = ""
labels = ["Last year", "Prop C target"]
values = [50.8, 125]

[[section.line]]
text = "The fund could also pay for streets and sidewalks serving affordable housing, and would last until 2058 instead of 2043."
sources = ["digest"]

[section.line.visual]
kind = "illustration"
name = "end-date"

[[section]]
id = "fiscal"
heading = "What it would cost"

[[section.line]]
text = "The City Controller says Proposition C would cost about $6 million more in 2028-2029, growing to about $60 million a year by 2034-2035; the General Fund today is about $7 billion."
sources = ["controller"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Proposition C renews the main source of money for affordable housing in San Francisco, and raises no one's taxes."
sources = ["arguments"]
basis = ["Proposition C won’t solve that alone, but it renews San Francisco’s most significant source of funding for affordable housing.", "Prop C does not raise anyone’s taxes."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Renews the main fund for affordable housing", "Does not raise anyone's taxes"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say the trust fund has failed at its job, and Proposition C doubles its size without requiring a single additional home."
sources = ["arguments"]
basis = ["Instead of a fix, this measure doubles the fund’s size, locks it in for 30 more years, and stretches it thinner", "Nothing in the measure requires a single additional unit to get built.", "A program that already failed at one job doesn’t get fixed by giving it five new jobs and more money."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Doubles a fund that has failed", "Sets no target for new homes built"]

