# Archived sources for Allan Hancock Joint Community College District
# Measure H, 2026-11-03 general election, as San Luis Obispo County's
# voters see it (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The San Luis Obispo County Clerk-Recorder prints each ballot type's
# County Voter Information Guide as one PDF; pages 25 to 36 of Ballot
# Type 53 (full text, impartial analysis, tax rate statement, argument in
# favor, and the notice that no argument against was filed) were cut
# into one excerpt, which backs every source here. The guide's full text
# opens with the ballot label and its "Bonds – Yes" and "Bonds - No"
# boxes. The ballot labels the measure "Measure H-26"; the project names
# it by its bare letter. County Counsel's impartial analysis is the
# measure's neutral explanation; the district's Tax Rate Statement is
# its fiscal statement. No argument against was filed, and no rebuttals
# are printed. The district's resolution ordering the election
# (sources/resolution-no-26-21.pdf) is archived but not cited: the guide
# prints everything the script says.
#
# A community college district has no Census boundary, so the measure's
# division is the county and `voters` names the district
# (docs/SCRIPT-FORMAT.md). Santa Barbara County administers the district
# and stages the same bond as allan-hancock-measure-h; this copy carries
# the county suffix.

[contest]
id = "ca-2026-11-03-allan-hancock-measure-h-san-luis-obispo"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/county:san_luis_obispo"
kind = "measure"
title = "Allan Hancock Joint Community College District Measure H: College Facility Bonds"
voters = "the Allan Hancock Joint Community College District"

