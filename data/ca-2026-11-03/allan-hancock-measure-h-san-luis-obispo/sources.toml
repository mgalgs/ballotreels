credit = "Ballot label, San Luis Obispo County Voter Information Guide"
url = "https://www.slocounty.ca.gov/departments/clerk-recorder/forms-documents/elections-and-voting/current-elections/2026-11-03/voter-information-guides/ballot-type-53-november-3,-2026,-general-election-voter-information-guide"
