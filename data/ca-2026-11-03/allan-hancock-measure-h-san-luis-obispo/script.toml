# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; how a college bond is repaid and what it
# needs to pass; what the money may pay for; the district's tax rate
# statement; one line per side; what a vote does. The same bond is on
# Santa Barbara County's ballots (allan-hancock-measure-h); this script
# says what that one does, from San Luis Obispo County's guide.
#
# The card quotes the ballot label as the guide's full text prints it,
# over plain "Bonds – Yes" and "Bonds - No" boxes and no yes/no lines.
# So the card has no YES/NO boxes, its origin is the impartial analysis's
# sentence placing the measure, the vote lines give the analysis's
# meaning, and both highlight the same phrase of the label. "Counsel" is
# heard as "Council" (standard/speakability.txt), so the narration says
# "the impartial analysis". No name of the college or district is
# narrated: the card, title and `voters` line show it.
#
# The bond total and the debt service are repaid from a tax on property
# in the district, and no archived source states the district's budget,
# so they have no budget scale (STANDARD.md 6.5; left open, as for the
# Santa Barbara County copy). The tax statement gives $19 per $100,000
# as both its average and its highest rate, and the fiscal line writes
# its "2067-68" in full (standard/speakability.txt); the total to repay,
# "approximately $618,176,000", is said as "about $618 million". The
# four-year degrees the label lists (a university center, in the
# supporters' words), the bar on paying salaries from the bonds, and the
# oversight committee and audits are in the supporters' argument, so the
# neutral sections leave them out (STANDARD.md 6.3); the card quotes the
# label as printed.
#
# No argument against Measure H was filed ("There was no argument
# against Measure H-26 filed"). The no side says so plainly; its section
# is marked filed = false.

contest = "ca-2026-11-03-allan-hancock-measure-h-san-luis-obispo"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "H"
title = "ALLAN HANCOCK JOINT COMMUNITY COLLEGE DISTRICT AFFORDABLE HIGHER EDUCATION."
origin = "This measure was placed on the ballot by the Board of Trustees of the Allan Hancock Joint Community College District, which is the governing board of the District."
summary = "To repair/upgrade Allan Hancock College's aging classrooms, labs, career training facilities; construct classrooms, improve affordable education for students/veterans in science, math, nursing, welding, machining, skilled trades; offer local four-year degrees with Cal-Poly partnership; fix roofs, plumbing, electrical; and remove asbestos; shall Allan Hancock College's measure authorizing $290 million in bonds at legal rates be adopted, levying $19/$100,000 assessed value ($16 million annually while bonds are outstanding), with citizen oversight of locally controlled funding?"

[[section]]
id = "what"
heading = "Measure H"

[[section.line]]
text = "Measure H asks the voters of this community college district whether to approve $290 million in college bonds."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["authorizing $290 million in bonds"]

[[section]]
id = "today"
heading = "How a college bond works"

[[section.line]]
text = "The district would sell the bonds and repay them from property taxes, on top of the taxes owners pay now."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "bond-certificates"

[[section.line]]
text = "Measure H needs 55 percent of the vote to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "projects"
text = "The money would go to listed projects, such as upgrading aging classrooms, labs and career training facilities, fixing roofs and plumbing, and removing asbestos."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "school-workshop"

[[section]]
id = "fiscal"
heading = "What the tax statement says"

[[section.line]]
id = "tax-rate"
text = "The district's tax rate statement estimates a tax of $19 per $100,000 of assessed value, on average and at most, through 2067-2068."
sources = ["tax-statement"]

[section.line.visual]
kind = "illustration"
name = "debt-payments"

[[section.line]]
text = "The statement estimates the total to repay, with interest, at about $618 million."
sources = ["tax-statement"]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say two in five local high school graduates rely on the college, which trains nurses, firefighters and skilled workers."
sources = ["arguments"]
basis = ["Two in every five local high school graduates rely on Hancock for affordable, local higher education and job training.", "It trains local nurses, healthcare workers, firefighters and first responders who keep us safe, and skilled workers who fuel our economy."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Two in five local graduates rely on it", "Trains nurses, first responders, trades"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure H was filed, so the county voter guide prints only the argument in favor of the measure."
sources = ["arguments"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote is in favor of letting the district issue up to $290 million in bonds."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["authorizing $290 million in bonds"]

[[section.line]]
text = "A no vote is against letting the district issue the bonds."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["authorizing $290 million in bonds"]

[[question]]
ask = "What would the bond money pay for?"
lines = ["projects"]

[[question]]
ask = "How much would property owners pay?"
lines = ["tax-rate"]

[[question]]
ask = "How big is $290 million next to the district's yearly budget?"
unanswered = true
