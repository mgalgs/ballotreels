# Archived sources for Sonoma County Junior College District Measure AB,
# 2026-11-03 general election, for Sonoma County voters
# (sources/sources.md). Every id here may be cited by script.toml.
# `kind` must be one the standard allows (docs/STANDARD.md, section 1).
#
# The Sonoma County Registrar of Voters publishes each measure's pages
# of its guide as one PDF, headed "Local Ballot Measure: AB" and footed
# "Sonoma County" with the guide's page numbers (049M501 to 049M506); no
# cover page was archived, so the sources name those pages, not a guide
# title. One PDF backs every source here. The County Counsels' Impartial
# Analysis (Sonoma, Mendocino and Marin) is the measure's neutral
# explanation; the district's Tax Rate Statement is its fiscal statement.
#
# A community college district has no Census boundary, so the measure's
# division is the county and `voters` names the district
# (docs/SCRIPT-FORMAT.md). The district reaches Sonoma, Marin and
# Mendocino counties: this contest is Sonoma's, the lead county where the
# arguments were filed; santa-rosa-junior-college-measure-ab-marin is
# Marin's, and Mendocino's is not staged.

[contest]
id = "ca-2026-11-03-santa-rosa-junior-college-measure-ab"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/county:sonoma"
kind = "measure"
title = "Sonoma County Junior College District Measure AB: College Facility Bonds"
voters = "the Sonoma County Junior College District (Santa Rosa Junior College)"

