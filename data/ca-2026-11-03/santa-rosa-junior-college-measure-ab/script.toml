# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; how a college bond is repaid, what it needs
# to pass, and which counties vote; what the money may and may not pay
# for; the district's tax rate statement; one line per side; what a vote
# does.
#
# The bond total and the debt service are repaid from a tax on property
# in the district, and no archived source states the district's budget,
# so they have no budget scale (STANDARD.md 6.5; left open). The fiscal
# line gives the statement's average rate beside its highest, as it
# prints both. The supporters' "without increasing tax rates" (it
# replaces expiring bonds) is their argument, so the neutral sections
# keep to the new bonds' own figures (STANDARD.md 6.3), and leave out
# the bar on spending bond money on salaries, which supporters cite; the card quotes
# the question's "Without increasing tax rates" as printed. "Counsel" is
# heard as "Council" (standard/speakability.txt), so the narration says
# "the impartial analysis".
#
# Sides come from the argument in favor and the argument against, not
# the rebuttals.

contest = "ca-2026-11-03-santa-rosa-junior-college-measure-ab"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "measure-question"
number = "AB"
title = "Sonoma County Junior College District"
origin = "The Sonoma County Junior College District (“District”) Board of Trustees (“Board”) has placed on the ballot in Sonoma, Marin, and Mendocino Counties the question of whether to issue bonds in the amount of $830,000,000 for such purposes."
summary = "Without increasing tax rates, to improve facilities to train students for careers in nursing/firefighting/first responders, building trades, agriculture, auto mechanics; attract/retain high quality faculty, prepare students for universities; repair leaky roofs; repair, construct, and acquire classrooms/sites/facilities/equipment, shall the Sonoma County Junior College District measure be adopted authorizing $830,000,000 in bonds at legal rates, levying $25 per $100,000 of assessed valuation ($55,300,000 annually), while bonds are outstanding, and with oversight/audits/local control?"
yes = "A “yes” vote on Measure AB will authorize the District to issue the bonds and levy taxes to pay for the indebtedness."
no = "A “no” vote on Measure AB will not authorize either the issuance of bonds or the associated levy of taxes."

[[section]]
