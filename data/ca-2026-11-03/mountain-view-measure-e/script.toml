# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and of whom; what a city charter is; who placed it and what it
# needs; what would change (wording, the vacancy deadline, reading
# ordinances, board qualifications); no cost estimate; one line per side;
# what a vote does.
#
# No narrated line names the city or the county (the narrator mispronounces
# place names; the card and title show them), so the fiscal and no-side
# lines name "the Registrar of Voters". The card quotes the Registrar's
# List of Local Measures: its heading for the measure as the title, the
# city as the origin, the ballot question as the summary. The list prints
# no yes/no statements, so the vote lines take their meanings from the
# question and highlight the one phrase both votes turn on, as Utah's do.
# No argument against Measure E was filed: the no side says so plainly;
# its section is marked filed = false.

contest = "ca-2026-11-03-mountain-view-measure-e"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "E"
title = "City Charter Amendment - Modernizing Provisions"
origin = "City of Mountain View"
summary = "Shall the measure amending the City Charter to modernize provisions by replacing gender-specific terms with gender-neutral language; extending the time to take action to fill a council vacancy from 30 to 60 days; eliminating the requirement to read ordinances and resolutions in full; authorizing Council to establish qualifications for legislatively created boards, commissions, and committees; updating outdated terminology; improving internal consistency, and making clarifying edits to align with State law and current practices, be adopted?"

[[section]]
id = "what"
heading = "Measure E"

[[section.line]]
text = "Measure E asks the voters of this city whether to update parts of the city charter."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
