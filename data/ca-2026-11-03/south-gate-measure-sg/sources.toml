# Archived sources for City of South Gate Measure SG, 2026-11-03 general
# election (sources/la-sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The Los Angeles County Registrar-Recorder/County Clerk's list "Measures
# Appearing on the Ballot" (sources/county-measure-list-excerpt.txt, the
# measure's entry) gives its letter, vote threshold and ballot question,
# and, on its "Supporters: ... Opponents: ..." line, who filed the
# primary arguments: the card quotes it, and the sides cite it as the
# official statement of filing. The City Council's Resolution No.
# 2026-35-CC, a text PDF, gives the ballot question, the City Clerk's
# certification of the Council's vote, and the ordinance (Exhibit A) with
# its rates, exemption and recitals. The City's August 2026 budget
# presentation (sources/staff-report.pdf, page 4) is cited for one plain
# fact no other document states, that the City levies no utility users
# tax today, in a background line only; its General Fund revenue figure
# is not used to scale the revenue estimate (STANDARD.md 6.5 takes a
# total only from a fiscal statement or a nonpartisan fiscal office). The
# City's water bill insert, web pages, notices and the resolution calling
# the election are not cited. No impartial analysis and no argument text
# could be found. A general utility users tax has no tax rate statement;
# the revenue estimate is the ballot question's.

