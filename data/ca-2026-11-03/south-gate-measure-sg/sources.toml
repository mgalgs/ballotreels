# Archived sources for City of South Gate Measure SG, 2026-11-03 general
# election (sources/la-sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The Los Angeles County Registrar-Recorder/County Clerk's list "Measures
# Appearing on the Ballot" (sources/county-measure-list-excerpt.txt, the
# measure's entry) gives its letter, vote threshold and ballot question:
# the card quotes it. The Registrar's Interactive Sample Ballot prints the
# City Attorney's impartial analysis (the measure's neutral explanation,
# which states that the City levies no utility users tax today and gives
# City staff's revenue estimate), the arguments for and against and both
# rebuttals, each saved as HTML. The City Council's Resolution No.
# 2026-35-CC, a text PDF, gives the ballot question, the City Clerk's
# certification of the Council's vote, and the ordinance (Exhibit A) with
# its rates, exemption and recitals. The City's budget presentation, water
# bill insert, web pages, notices and the resolution calling the election
# are not cited. A general utility users tax has no tax rate statement.

[contest]
id = "ca-2026-11-03-south-gate-measure-sg"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:south_gate"
kind = "measure"
title = "City of South Gate Measure SG: An 8% Utility Users Tax"

