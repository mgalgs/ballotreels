# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; that the city levies no such tax
# now, and how the measure reached the ballot (the Council's vote, from
# the City Clerk's certification); the Council's stated reason, the
# financial emergency its ordinance declares (its purpose, STANDARD.md
# 6.2), given without the deficit figure, which no archived source lets
# us scale; what would change (the rate and the services it covers, who
# is exempt, where the money goes, how long it lasts, what the Council
# could amend); the revenue estimate, which only the ballot question
# gives; who filed each side's argument; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". The card shows the name. The
# Council's vote is said as who voted, not as a tally
# (standard/speakability.txt); no member is named.
#
# The card quotes the measure's entry in the county's list "Measures
# Appearing on the Ballot", which prints no yes/no meanings, so the card
# has no boxes; the vote lines take both meanings from the question and
# highlight the same phrase.
#
# No impartial analysis was found, and a general utility users tax has no
# tax rate statement: the fiscal line attributes the $10.4 million a year
# to the ballot question, which states it. Its scale is left open
# (STANDARD.md 6.5): the only archived total, the General Fund revenue in
# the City's budget presentation, is not from a fiscal statement or a
# nonpartisan fiscal office (under [[question]]).
#
# Sides: the county's list names who filed each primary argument
# (supporters: a councilmember, a former councilmember and three local
# groups; opponents: two taxpayers associations, one statewide and one
# for the county), but neither argument's text could be found. Each side
# says only who filed and that its text was not gathered; nothing is
# reconstructed. filed = false on both, as for any side with no argument
# text to quote (no `basis` is possible); the lists say the argument was
# filed. Each side is described by role or kind, not by name.

contest = "ca-2026-11-03-south-gate-measure-sg"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "SG"
title = "CITY OF SOUTH GATE"
origin = "VOTE PASSAGE – Majority Vote 50%+1"
summary = "SOUTH GATE FISCAL EMERGENCY STREET MAINTENANCE, YOUTH PROGRAMS, PARKS FUNDING PROTECTION MEASURE. Shall an ordinance preventing cuts to City of South Gate services including maintaining streets and sidewalks; maintaining school crossing guards, parks/ recreation programs, police 911 and support services, and other General Fund uses by establishing an 8% utility user tax, exempting low income seniors, annually providing approximately $10,400,000 until ended by voters; requiring independent audits, public disclosure of all spending, local control, to benefit South Gate residents, be adopted?"

[[section]]
id = "what"
heading = "Measure SG"

[[section.line]]
text = "Measure SG asks the voters of this city whether to add an 8 percent tax to utility bills, for general city services."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["establishing an 8% utility user tax"]

[[section]]
