# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; that the city levies no such tax
# now (the impartial analysis), and how the measure reached the ballot
# (the Council's vote, from the City Clerk's certification); the
# Council's stated reason, the financial emergency its ordinance declares
# (its purpose, STANDARD.md 6.2), given without the deficit figure, which
# no archived source lets us scale; what would change (the rate and the
# services it covers, who is exempt, where the money goes, how long it
# lasts, what the Council could amend), from the City Attorney's
# impartial analysis and the ordinance; the revenue estimate; one line
# per side; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". The card shows the name. The
# Council's vote is said as who voted, not as a tally
# (standard/speakability.txt); no member is named.
#
# The card quotes the measure's entry in the county's list "Measures
# Appearing on the Ballot", which prints no yes/no meanings, so the card
# has no boxes; the vote lines take both meanings from the question and
# highlight the same phrase.
#
# A general utility users tax has no tax rate statement: the fiscal line
# attributes the $10.4 million a year to City staff, as the impartial
# analysis does. Its scale is left open (STANDARD.md 6.5): no fiscal
# statement or nonpartisan fiscal office in the archive states the
# General Fund's total (under [[question]]).
#
# Sides: each from its filed argument. Supporters: costs keep rising
# while locally controlled revenue is limited, and without new revenue
# more services may be cut. Opponents: the tax never expires and would
# cost about $600 per household a year (their own figure, attributed).
# The supporters' $9.4 million deficit, in their rebuttal, is left out,
# as the neutral lines leave out the deficit figure.

contest = "ca-2026-11-03-south-gate-measure-sg"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "SG"
title = "CITY OF SOUTH GATE"
origin = "VOTE PASSAGE – Majority Vote 50%+1"
summary = "SOUTH GATE FISCAL EMERGENCY STREET MAINTENANCE, YOUTH PROGRAMS, PARKS FUNDING PROTECTION MEASURE. Shall an ordinance preventing cuts to City of South Gate services including maintaining streets and sidewalks; maintaining school crossing guards, parks/ recreation programs, police 911 and support services, and other General Fund uses by establishing an 8% utility user tax, exempting low income seniors, annually providing approximately $10,400,000 until ended by voters; requiring independent audits, public disclosure of all spending, local control, to benefit South Gate residents, be adopted?"

[[section]]
id = "what"
heading = "Measure SG"

[[section.line]]
text = "Measure SG asks the voters of this city whether to add an 8 percent tax to utility bills, for general city services."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["establishing an 8% utility user tax"]

[[section]]
id = "background"
heading = "How it got here"

[[section.line]]
id = "no-uut"
text = "The impartial analysis says the city does not charge a utility users tax now."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "utility-bills"

[[section.line]]
text = "Four of the five City Council members voted to place Measure SG on the ballot."
sources = ["resolution"]

[section.line.visual]
kind = "illustration"
name = "city-council-chamber"

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "The measure's own text declares a financial state of emergency, citing an ongoing deficit in the general fund."
sources = ["resolution"]

[section.line.visual]
kind = "illustration"
name = "state-budget"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "rate"
text = "Phone, video, electricity, gas and water bills in the city would carry an 8 percent tax, collected by the utilities."
sources = ["impartial-analysis", "resolution", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "utility-bills"

[[section.line]]
id = "exempt"
text = "People 65 or older with low household incomes could apply to be exempt at their home."
sources = ["impartial-analysis", "resolution"]

[section.line.visual]
kind = "illustration"
name = "senior-center"

[[section.line]]
id = "uses"
text = "The money would go to the general fund for any lawful city purpose, with no end date unless voters repeal the tax."
sources = ["impartial-analysis", "resolution", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "end-date"

[[section.line]]
id = "amend"
text = "The City Council could amend the tax without a vote, but not to increase it."
sources = ["impartial-analysis", "resolution"]

[section.line.visual]
kind = "illustration"
name = "amended-page"

[[section]]
id = "fiscal"
heading = "What it would raise"

[[section.line]]
id = "revenue"
text = "The impartial analysis says city staff estimate the tax would raise about $10.4 million a year."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "special-tax"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say costs keep rising while local revenue is limited, and without new revenue, more services may be cut."
sources = ["argument-for"]
basis = ["Employee costs, equipment, supplies, infrastructure maintenance, and other operating expenses have increased, while the City has limited locally controlled revenue available to meet these growing costs.", "Without additional ongoing revenue, the City may need to consider further reductions to programs, staffing, maintenance, and other services."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Costs rising, local revenue limited", "Avoids more service cuts"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say the tax never expires, costing about $600 per household a year, when families can least afford it."
