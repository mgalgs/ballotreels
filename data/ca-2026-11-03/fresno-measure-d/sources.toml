# Archived sources for City of Fresno Measure D, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The Fresno County Registrar of Voters posts each measure's filed
# documents on its election page; no printed Voter Information Guide
# was found online. The ballot question, and the recital that the
# county's Measure C transportation tax is set to expire on June 30,
# 2027, are quoted from City Council Resolution No. 2026-179. The City
# Attorney's impartial analysis is the measure's neutral explanation,
# the kind a state's attorney general's explanatory statement is. No tax
# rate statement or fiscal analysis applies (a sales tax); the one
# revenue estimate is the City's, as the analysis gives it.
#
# Every PDF is a scan with no text layer. The passages cited were typed
# from the page images into sources/*-transcription.txt, each naming the
# PDF and URL it copies; those sources point at the transcription, and
# their url at the scan (as Clayton Measure M's do). The rebuttals are
# archived but not cited.

[contest]
id = "ca-2026-11-03-fresno-measure-d"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:fresno"
kind = "measure"
title = "City of Fresno Measure D: Roads, Public Safety and City Services Sales Tax"

