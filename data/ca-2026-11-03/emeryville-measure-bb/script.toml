# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and of whom; how the business license tax works today; who put it
# on the ballot and what it needs to pass; what would change (seven
# categories taxed on gross receipts, the small-business amount, the
# cap, the start date, a general fund tax); the revenue figure, as the
# ballot question gives it; one line per side; what a vote does.
#
# The guide prints no tax rate statement or fiscal analysis (not a
# bond), and the City Attorney's Impartial Analysis gives no revenue
# estimate; the one figure is the ballot question's $12,400,000 a year,
# attributed to it. No archived source states the city's General Fund
# budget, so it has no scale (STANDARD.md 6.5; left open). The
# supporters' "approximately $6 million annually" is their argument, so
# it stays in their section's source, not the neutral ones (STANDARD.md
# 6.3). The $25, $300,000 and $800,000 are amounts per business
# (exempt).
#
# The impartial analysis prints no yes and no sentences, so the card has
# no boxes; the vote lines take their meanings from the ballot question,
# one phrase each, as Utah's do. No argument against Measure BB was
# submitted: the no side says so plainly and is marked filed = false.
# The card's title is the guide page's own head. Much of the page's text
# layer is in glyph ids (checks._unshifted_text reads it back).

contest = "ca-2026-11-03-emeryville-measure-bb"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide-page"
number = "BB"
title = "CITY OF EMERYVILLE MEASURE BB"
origin = "This measure was placed on the ballot by the City Council."
summary = "City Services/Business License Reform Measure. “To protect City of Emeryville services/ensure smaller businesses pay less than larger businesses, shall the measure be adopted to: keep parks/playgrounds safe; repair potholes/maintain streets; maintain 9-1-1 response; improve crime prevention; maintain senior/youth services; general government use; by updating/simplifying Emeryville’s 42 year old business license rates up to 0.4% of gross receipts (described in the ordinance) until ended by voters, providing $12,400,000 annually, requiring independent oversight?”"

[[section]]
id = "what"
heading = "Measure BB"

[[section.line]]
text = "City of Emeryville Measure BB asks voters in the city whether to rewrite its business license tax."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["Business License Reform Measure"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Today, the business license tax has 56 categories, most taxed at a flat rate or by employees, days open, vehicles or other assets."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "city-storefronts"

[[section.line]]
text = "The City Council placed Measure BB on the ballot, and it needs a majority vote to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "ballot-box"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "Measure BB would cut the categories to seven, most taxed at 0.1, 0.3 or 0.4 percent of gross receipts."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "state-budget"

[[section.line]]
text = "Businesses with $100,000 or less in receipts would pay $25, and the most any business pays in a year would rise from $300,000 to $800,000."
sources = ["impartial-analysis"]

[[section.line]]
text = "The new rates would start on January 1, 2027, and the money could go to any legitimate city purpose."
sources = ["impartial-analysis"]

[[section]]
id = "fiscal"
heading = "What the ballot question says"

[[section.line]]
text = "The ballot question says Measure BB would provide $12.4 million a year; the City Attorney's impartial analysis gives no estimate."
sources = ["guide-page", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Measure BB modernizes a 42-year-old tax, shifts more to larger businesses, and spares residents."
sources = ["arguments"]
basis = ["to modernize our nearly 42-year-old business license tax system", "helps ensure that larger, more profitable businesses pay their fair share while small businesses are not unfairly burdened.", "Measure BB applies only to businesses and does not increase taxes on residents or homeowners."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Modernizes a 42-year-old tax", "Larger businesses pay more, not residents"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure BB was submitted for this election's Alameda County Composite Voter Information Guide."
sources = ["arguments"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote adopts the measure and its new business license rates."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["shall the measure be adopted"]

[[section.line]]
text = "A no vote keeps the 42-year-old business license tax as it is."
sources = ["guide-page", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["42 year old business license"]
