# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and whose measure it is; the vote it needs; what would change (the
# rate and when it starts, where the money goes and for how long, the
# audit); the impartial analysis's revenue estimate; one line per side;
# what a vote does.
#
# The guide prints no ballot question, no tax rate statement and no
# yes/no statements: the card quotes the ballot question from the City
# Council's resolution, and the vote lines take their meanings from it
# (SCRIPT-RECIPE.md, "Vote lines"). The one revenue estimate is in the
# City Attorney's Impartial Analysis, as "approximately $3,000,000", and
# in the ballot question, as "annually". No archived source states the
# city's General Fund total, so the estimate has no scale (STANDARD.md
# 6.5; left open). The $100 million in street projects is the
# supporters' point (their argument; the Council's recitals), so it
# stays out of the neutral sections (STANDARD.md 6.3).
#
# No argument against was filed: the no side says so, filed = false
# (STANDARD.md 2.5).

contest = "ca-2026-11-03-adelanto-measure-p"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "P"
title = "Transactions and Use Tax"
origin = "A RESOLUTION OF THE CITY COUNCIL OF THE CITY OF ADELANTO, CALIFORNIA"
summary = "Shall the measure to provide funding for Adelanto city services, such as paving streets and fixing potholes, fire protection, paramedic, and 911 response; law enforcement and crime prevention; keeping public areas/parks safe/clean; addressing homelessness; and repairing aging storm drains, pipes, bridges, and public areas by establishing a 1% transactions and use tax, providing approximately $3,000,000 annually until ended by voters, requiring audits, public spending disclosure, all money controlled locally, be adopted?"

[[section]]
id = "what"
heading = "Measure P"

[[section.line]]
text = "City of Adelanto Measure P asks Adelanto voters whether to add a 1 percent sales tax to fund city services."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["establishing a 1% transactions and use tax"]

[[section]]
id = "today"
heading = "What it needs to pass"

[[section.line]]
text = "Measure P needs a majority of the vote to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "cents-per-dollar"
text = "Stores in the city would charge 1 percent more on taxable sales from April 1, 2027, or one cent on each dollar."
sources = ["impartial-analysis", "resolution"]

[section.line.visual]
kind = "illustration"
name = "special-tax"

[[section.line]]
text = "The money would go to the city general fund, for any city purpose, until voters end the tax."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "end-date"

[[section.line]]
text = "An independent accountant would audit the money every year."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section]]
id = "fiscal"
heading = "What the impartial analysis says"

[[section.line]]
text = "The city attorney's impartial analysis estimates the tax would raise about $3,000,000 a year."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "set-aside-funds"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Measure P speeds 911 response, with one fire station for 55 square miles, and fixes potholes."
sources = ["argument-for"]
basis = ["Adelanto has just one fire station covering 55 square miles", "Measure P ensures firefighters, paramedics, and law enforcement officers can respond quickly and reliably when we need them most.", "Measure P lets us fix potholes, repair aging infrastructure"]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Quick fire, paramedic and police response", "Fixes potholes and aging streets"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure P was filed, so the county voter guide prints only the argument of supporters."
sources = ["argument-for"]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote adopts the 1 percent tax for city services."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["be adopted?"]

[[section.line]]
text = "A no vote means the tax is not adopted."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["be adopted?"]

[[question]]
ask = "How much would the tax cost a shopper?"
lines = ["cents-per-dollar"]

[[question]]
ask = "How big is the city's budget, compared with the tax?"
unanswered = true
