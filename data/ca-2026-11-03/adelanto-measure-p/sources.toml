# Archived sources for City of Adelanto Measure P, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1). The guide's pages are cut from the San
# Bernardino County Registrar of Voters' Voter Information Guide; "page"
# is the guide's printed footer number (its PDF pages are two higher).
#
# The guide does not print the ballot question; it is printed only in the
# City Council's resolution (its Section 3.C, "The question to be
# presented to the voters"), so the resolution backs two sources: the
# ballot question the card quotes, and the Council's text.

[contest]
id = "ca-2026-11-03-adelanto-measure-p"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:adelanto"
kind = "measure"
title = "City of Adelanto Measure P: 1% Transactions and Use Tax for City Services"

