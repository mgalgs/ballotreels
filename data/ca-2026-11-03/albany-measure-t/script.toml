# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks; who placed it and what it needs to pass; what it would do (the
# rate and its yearly rise, the cap on large parcels, low-income relief,
# leaseholds, the dedicated fund); the impartial analysis's revenue
# estimate; one line per side; what a vote does.
#
# The guide prints no fiscal analysis or tax rate statement; the one
# revenue estimate is the City Attorney's, in the ballot question and the
# Impartial Analysis. No archived source states Albany's budget, so the
# $775,000 has no scale (STANDARD.md 6.5; left open). The page prints no
# subject heading over the ballot question, so the card's title is the
# page's own head, the city's name. The Impartial Analysis says nothing
# of how street trees and lights are paid for now; the argument in
# favor's account of it is its own (STANDARD.md 6.3), so "Today" gives
# only who placed the measure and what it needs.
#
# The guide prints an argument in favor and the notice "NO ARGUMENT
# AGAINST MEASURE T WAS SUBMITTED": the no side is filed = false.

contest = "ca-2026-11-03-albany-measure-t"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide-page"
number = "T"
title = "CITY OF ALBANY"
origin = "On July 6, 2026, the City Council voted to place Measure “T” on the November 3, 2026 General Municipal Election ballot."
summary = "Shall the measure to enact a special parcel tax on non-exempt property in the City at $0.0354 per lot square foot to maintain and improve public street trees and streetlighting to enhance local safety and sustainability, subject to an annual consumer price index adjustment up to 3%, exempting qualifying low-income residents, providing an estimated $775,000 annually until ended by voters, be adopted?"
yes = "A “yes” vote on Measure “T” will approve this street trees and streetlighting improvement and maintenance parcel tax."
no = "A “no” vote on Measure “T” will not approve this street trees and streetlighting improvement and maintenance parcel tax."

[[section]]
id = "what"
heading = "Measure T"

[[section.line]]
text = "City of Albany Measure T asks Albany voters whether to create a new parcel tax to maintain and improve street trees and streetlights."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["to maintain and improve public street trees and streetlighting"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "The City Council placed Measure T on the ballot in July, and it needs two-thirds of Albany voters to pass."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "Starting in July 2027, property owners would pay a yearly tax by the square foot of land, rising with inflation by up to 3 percent a year."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "street-trees-lights"

[[section.line]]
text = "Only the first 500,000 square feet of any parcel would be taxed."
sources = ["guide-page"]

[[section.line]]
text = "Very low-income residents would pay nothing, low-income residents half, and leaseholders on exempt land would pay too."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "special-tax"

[[section.line]]
text = "The money would go to a fund for street trees and streetlighting, with a yearly report on how it is spent."
