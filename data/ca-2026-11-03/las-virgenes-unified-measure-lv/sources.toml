# Archived sources for Las Virgenes Unified School District Measure LV, 2026-11-03
# general election (sources/la-sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The Los Angeles County Registrar-Recorder/County Clerk's list "Measures
# Appearing on the Ballot" prints the measure's letter, vote threshold and
# ballot question, and says in words who filed the primary arguments
# ("Supporters: ... Opponents: None submitted."). The card quotes the
# ballot question from it (ballot-question), and the no side cites it as
# the Registrar's statement of filing (measure-list).
#
# The impartial analysis, the full text and the argument in favor are the
# Registrar's own copies from its Interactive Sample Ballot, saved as HTML
# (the contest data's URL is in each file). A parcel tax has no tax rate
# statement.

[contest]
id = "ca-2026-11-03-las-virgenes-unified-measure-lv"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/school_district:las_virgenes_unified_school_district"
kind = "measure"
title = "Las Virgenes Unified School District Measure LV: Renewing the $98 School Parcel Tax for Twelve Years"

[[source]]
id = "ballot-question"
kind = "official-title-summary"
publisher = "Los Angeles County Registrar-Recorder/County Clerk, Measures Appearing on the Ballot, General Election November 3, 2026 (Rev. 9/22/26): Las Virgenes Unified School District, Measure LV"
