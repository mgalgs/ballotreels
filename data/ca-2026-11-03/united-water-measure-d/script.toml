# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; who placed it, how it reached the
# ballot and the vote it needs; what the money would pay for, what it
# could not pay for, and who would check the spending; the measure's own
# estimate of the tax; both sides, neither of which has an archived
# argument; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this water district", and the projects are
# described without their names. The card and the title carry the names.
#
# The card quotes Exhibit B of the District's Resolution No. 2026-13, the
# Ballot Measure Statement, from the June 10, 2026 packet copy
# (sources.toml); its lead-in, the measure's name, is the card's title.
# The packet copy is unsigned; the minutes of June 10, 2026 record the
# resolution's adoption, and the script dates the order from them. The
# ballot's "Bonds – Yes" and "Bonds – No" are its choices, not yes/no
# sentences, so the card has no boxes and the vote lines take their
# meaning from the question.
#
# What the money pays for is Exhibit A's facilities list and its
# taxpayer protections, as enacted; Exhibit A's findings and each
# project's statement of why it is required are the District's and are
# not used. No tax rate statement was archived, so the tax figures are
# the ones the ballot question and Exhibit A's repayment projection
# print, attributed to the measure, with their period as printed; no
# total to repay is stated in either, so none is narrated (the staff
# report's estimate is the District staff's, and is not used). No
# archived source states the District's budget, so the $350 million and
# the $23 million a year have no scale (STANDARD.md 6.5; left open); the
# tax per $100,000 of assessed value is a per-property amount, exempt.
#
# No argument for or against Measure D was archived, and no document
# says whether any was filed, so each side says none is among the
# documents gathered (filed = false, STANDARD.md 2.5), as for Walnut
# Creek Measure U.

contest = "ca-2026-11-03-united-water-measure-d"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "D"
title = "United Water Conservation District 2026 Water Supply, Conservation and Water Quality Bond Measure."
origin = "Board of Directors of the United Water Conservation District"
summary = "In order to construct and complete water supply, conservation, storage and water quality facilities required to meet customer demands, conserve water resources and comply with governmental requirements; shall United Water Conservation District’s facilities bond measure be approved authorizing $350,000,000 in bonds at legal interest rates, levying $24 per $100,000 of assessed value (approximately $23,000,000 annually on average) while bonds are outstanding with strict accountability requirements included?"

