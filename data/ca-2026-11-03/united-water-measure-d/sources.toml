# Archived sources for United Water Conservation District Measure D,
# 2026-11-03 general election (sources/sources.md). Every id here may be
# cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# A water conservation district has no Census boundary, so the division
# is the county and `voters` names the district (docs/SCRIPT-FORMAT.md,
# docs/ARCHITECTURE.md "Special districts"). The County of Ventura Board
# of Supervisors' August 4, 2026 consent item 12 (the board letter, its
# Exhibit 1 listing "UNITED WATER CONSERVATION DISTRICT" among the six
# local measures, and the minute order recording its approval) is the
# record that the measure is on the county's November 3, 2026 ballot; it
# gives no letters.
#
# THE LETTER D IS NOT CONFIRMED BY AN ARCHIVED OFFICIAL RECORD. Ventura
# County's measures page and voter guide could not be read (a bot
# challenge), and neither the District's bond page nor any other archived
# District or county document prints a letter. The operator decided to
# publish such letters where every letter that could be checked against
# an official page matched (Rio Elementary B and Santa Paula Unified C
# did); no document that is not an official record is cited.
#
# For the same reason no impartial analysis, argument, rebuttal or tax
# rate statement was reached, and no document says whether any argument
# was filed. Resolution No. 2026-13 lets District officers send the
# Registrar of Voters any tax rate statement (Section 17), but none was
# archived.
#
# The ballot question, the full text and the resolution are quoted from
# the copy of Resolution No. 2026-13 in the District's June 10, 2026 board
# packet (item 6.3; the extract keeps packet pages 1 to 4, the agenda,
# and 232 to 249). That copy is unsigned, its vote lines blank, so the
# fact and date of adoption come from the minutes of the June 10, 2026
# meeting, item 6.3 (a scan; the page cited is typed into
# sources/uwcd-2026-06-10-board-minutes-pp1-5-transcription.txt). Section
# 18 of the resolution lets District officers conform the wording to the
# county's requirements; the script quotes the text the Board adopted
# and says nothing about possible changes.
#
# Exhibit A's "Findings of the Board" and the need stated in each
# project's description are the District's: the script uses only what
# Exhibit A enacts (which facilities, the taxpayer protections, the
# repayment projection). The staff report, the Water Code 74800 report,
# the bond page and the press release are the District's own material
# and are not cited.

