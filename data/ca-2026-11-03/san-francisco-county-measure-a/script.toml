[section.line.visual]
kind = "illustration"
name = "amended-page"

[[section.line]]
text = "Proposition A would also eliminate, combine, or move out of the charter some commissions and advisory bodies."
sources = ["digest"]

[[section.line]]
text = "The Board of Supervisors would then amend some voter-approved laws to carry out the changes."
sources = ["digest"]

[section.line.visual]
kind = "illustration"
name = "law-book"

[[section]]
id = "fiscal"
heading = "What it would cost"

[[section.line]]
text = "The City Controller says Proposition A would save $365,000 to $450,000 a year, less than 1 percent of the General Fund of about $7 billion."
sources = ["controller", "general-fund"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Proposition A makes small fixes to an outdated charter, like ending a commission overseeing a department that no longer exists."
sources = ["arguments"]
basis = ["The mayor and a supermajority of the Board of Supervisors agreed on 110 small fixes that will help city government serve you better.", "the Sanitation and Streets Commission oversees a department that doesn’t exist"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Cleans up an outdated city charter", "Ends commissions that serve no purpose"]

