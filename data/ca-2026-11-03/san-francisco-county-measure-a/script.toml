# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks; what the charter is and why only voters can change it; what the
# pamphlet's digest says of it today; what would change, in the digest's order; the
# Controller's savings, with the General Fund beside them; one line per
# side; what a vote does.
#
# The supporters' "110 small fixes" and "zombie commissions" and the
# opponents' Proposition C oversight body are each side's own, so they
# stay in the sides (STANDARD.md 6.3). That the Board of Supervisors would
# amend voter-approved laws to carry the changes out is in the ballot
# question itself, so the change section says it. The Controller's
# Statement gives no General Fund total; the one on Proposition C does
# ($7 billion), cited for the share (6.5).

contest = "ca-2026-11-03-san-francisco-county-measure-a"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "digest"
number = "A"
title = "Charter Changes Affecting Various City Departments and Commissions"
origin = "On July 14, 2026, the Board of Supervisors voted 9 to 2 to place Proposition A on the ballot."
summary = "Shall the City amend the Charter to align it with how some City departments currently operate, change some processes, eliminate or reorganize certain commissions and advisory bodies, and require the Board of Supervisors to amend voter-approved laws to enact some of these changes?"
yes = "If you vote “yes,” you want to amend the Charter to align it with how some City departments currently operate, change some processes, eliminate or reorganize certain commissions and advisory bodies, and require the Board of Supervisors to amend voter-approved laws to enact some of these changes."
no = "If you vote “no,” you do not want to make these changes."

[[section]]
id = "what"
heading = "Proposition A"

[[section.line]]
text = "San Francisco Proposition A asks voters whether to update the City Charter, and eliminate or reorganize some commissions."
sources = ["digest"]

[section.line.visual]
kind = "page"
source = "digest"
highlight = ["Shall the City amend the Charter"]

[[section]]
id = "background"
heading = "What the charter is"

[[section.line]]
text = "The charter is the constitution of San Francisco, and only voters can change it."
sources = ["digest"]

[section.line.visual]
kind = "illustration"
name = "constitution-page"

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "The charter and other voter-approved laws create many city commissions, and the voter pamphlet says some of these laws have become obsolete."
sources = ["digest"]

[section.line.visual]
kind = "illustration"
name = "empty-commission-seat"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
