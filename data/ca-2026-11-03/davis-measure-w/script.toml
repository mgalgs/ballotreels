# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; why a farmland project comes to
# the voters; what the plan would allow (homes, affordable homes, park,
# trails, shops) and that its features are locked in; that no cost
# estimate is given; one line per side; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city", and the project is "a new
# neighborhood", not its name. The card and title carry both.
#
# The developer's $6.8 million for affordable housing is money paid into
# the city, and no archived source states the city's budget, so it is
# left out rather than said without a scale (STANDARD.md 6.5). The
# supporters' $21 million park figure, "without taxpayer subsidies" and
# the share of affordable homes they give (20 percent) are theirs and
# stay in their line (STANDARD.md 6.3); the neutral line gives the
# analysis's "at least 250" affordable units.
#
# The analysis prints yes and no in one sentence, so the card's yes and
# no are its two halves, quoted as printed. "favors" is not narrated
# (standard/speakability.txt); the vote lines say "supports". No
# argument against was filed, so the no side sets `filed = false`.

contest = "ca-2026-11-03-davis-measure-w"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "W"
title = "City of Davis Measure W"
origin = "Measure W was placed on the ballot by the City of Davis City Council."
summary = "Shall Resolution No. 26-052 be adopted to amend the Davis General Plan to approve a residential development to include parks, trails, open space, and neighborhood retail areas, by changing the land use designations for the Willowgrove property from Agriculture to Urban Agriculture Transition Area, Park/Recreation, Neighborhood Greenbelt, Neighborhood Retail, and Residential Low, Medium, and High Density, and by establishing the Baseline Project Features?"
yes = "A “yes” vote favors the General Plan amendments and baseline project features"
no = "a “no” vote opposes them."

[[section]]
id = "what"
heading = "Measure W"

[[section.line]]
text = "Measure W asks the voters of this city whether to let about 232 acres of farmland become a new neighborhood."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["approve a residential development"]

[[section]]
id = "background"
heading = "Why it is on the ballot"

[[section.line]]
id = "why-vote"
text = "City rules require a vote of the people to turn farmland or open space into urban uses."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "farmland-town-edge"

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "The site is now set aside for farming, and the city could annex it if Measure W passes."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "project-site"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "homes"
text = "The plan allows 1,250 homes, at least 250 of them affordable, plus a park with a gym, trails and shops."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "bars"
title = "Homes the plan allows"
source = "impartial-analysis"
unit = ""
labels = ["All homes", "Affordable, at least"]
values = [1250, 250]

[[section.line]]
id = "locked-in"
text = "These features could not be changed much later without another vote."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "ballot-box"

[[section]]
id = "fiscal"
heading = "What it would cost"

[[section.line]]
text = "The voter guide for this county does not include a cost estimate for the measure."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"
stamp = "None reported"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Measure W brings homes young families can afford, and a regional park funded by the developer."
sources = ["arguments"]
basis = ["Davis needs housing that our young families, teachers, local workforce, downsizing residents, and next generation can afford.", "Measure W provides 1,250 homes, including 20% permanently affordable homes", "Willowgrove also brings a $21+ million regional public park funded by the developer, not local taxpayers."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Homes young families can afford", "A regional park the developer funds"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure W was filed by the July deadline, so only an argument in favor appears."
sources = ["arguments"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote supports the general plan changes and the project features."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["favors the General Plan amendments and baseline project features"]

[[section.line]]
text = "A no vote opposes the general plan changes and the project features."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["opposes them"]

[[question]]
ask = "Why does this need a vote at all?"
lines = ["why-vote"]

[[question]]
ask = "How many homes, and how many affordable?"
lines = ["homes"]

[[question]]
ask = "Could the developer change the plan after the vote?"
lines = ["locked-in"]
