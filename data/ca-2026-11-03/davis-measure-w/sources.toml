# Archived sources for City of Davis Measure W, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# Yolo County ACE's Elections Branch posts each local measure on its own
# web page, with tabs for the ballot question, the impartial analysis,
# the full text, the arguments and the rebuttals; the county says this is
# the material published in its voter guide.
# sources/county-measure-w-page.html is Measure W's page; the City
# Attorney's Impartial Analysis and the signed argument in favor are
# also archived as the PDFs the page links, and the full text
# (Resolution No. 26-052) only as a PDF. The City Attorney's Impartial
# Analysis is the measure's neutral explanation. No fiscal statement is
# printed (a land-use measure); no argument against was filed, so there
# are no rebuttals.
#
# The credits call the guide the "Yolo County Voter Information Guide":
# the county's pages name it only as the "County Voter Information
# Guide" and no cover page was archived, so the county name in the title
# is unconfirmed.

[contest]
id = "ca-2026-11-03-davis-measure-w"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:davis"
kind = "measure"
title = "City of Davis Measure W: Willowgrove General Plan Amendment"

