# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; how the measure reached the
# ballot; what would change (the added rate, what sales taxes do not
# reach, where the money goes, the audits and the term, the vote it
# needs); the revenue estimate as the impartial analysis gives it; both
# sides as the county's list records them; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". The card and title carry it.
# "1 percent", not "1 cent" (standard/speakability.txt). The Council's
# vote is said as who voted, not as a tally.
#
# The impartial analysis's sentences on out-of-town shoppers sharing the
# cost and on the cuts the measure is meant to prevent are left out:
# they are the City's case, and no argument against is there to set
# beside them (STANDARD.md 6.3). The ballot question's list of uses is
# on the card, not narrated: the money is a general tax's, for any
# general city purpose.
#
# The card quotes the Los Angeles County Registrar-Recorder/County
# Clerk's list "Measures Appearing on the Ballot": the City's heading,
# the vote needed and the ballot question, which has no yes or no
# sentences, so the card has no boxes. The vote lines give the impartial
# analysis's own meanings, and both highlight the same phrase.
#
# The list names two supporters, with no titles, who filed an argument
# in favor whose text is not among the documents gathered: the yes side
# says only that two supporters filed one and that its text was not
# gathered (filed = false, no basis to quote). The list says "Opponents:
# None submitted.", so the no side says plainly that no argument against
# was submitted, citing the list. Its clause on what the list records
# balances the yes line's length without a further claim.
#
# The $6 million a year is the City's estimate as the impartial analysis
# reports it. No archived official document states the City's general
# fund budget to give it a scale (STANDARD.md 6.5; left open, under
# [[question]]).

contest = "ca-2026-11-03-diamond-bar-measure-q"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "Q"
title = "CITY OF DIAMOND BAR"
origin = "VOTE PASSAGE – Majority Vote 50%+1"
summary = "To maintain local funding for emergency response/Sheriff protection; keep Diamond Bar's neighborhoods/public areas safe/clean; prevent property crimes/burglaries; minimize the risk of wildfires; prepare for/respond to wildfires/other natural disasters; maintain roads/prevent potholes; for other general city services; shall a measure be adopted establishing a 1¢ sales tax, providing approximately $6,000,000 annually until ended by voters, requiring audits/spending disclosure, all funds benefiting Diamond Bar residents?"

[[section]]
id = "what"
heading = "Measure Q"

[[section.line]]
text = "Measure Q asks the voters of this city whether to add a 1 percent local sales tax for general city services."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["establishing a 1¢ sales tax"]

[[section]]
id = "today"
heading = "How it reached the ballot"

[[section.line]]
text = "Four of the five members of the City Council voted to place Measure Q on the ballot."
sources = ["resolution"]

[section.line.visual]
kind = "illustration"
name = "city-council-chamber"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "rate"
text = "The 1 percent tax would be paid on top of current sales taxes, and collected the same way."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "sales-receipt"

[[section.line]]
id = "exempt"
text = "Sales taxes do not apply to groceries, prescription medicine, utilities and several kinds of services."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "grocery-bag"

[[section.line]]
id = "general"
text = "As a general tax, the money would go to the general fund, for any general city purpose."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "state-budget"

[[section.line]]
id = "end"
text = "Annual audits would be required, and the tax would last until ended by voters."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "end-date"

[[section.line]]
text = "Measure Q needs a majority yes vote to pass."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "fiscal"
heading = "What the impartial analysis says"

[[section.line]]
id = "revenue"
text = "The city attorney's impartial analysis says the city estimates $6 million more a year, varying with retail sales."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "save-more"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"
filed = false

[[section.line]]
text = "Two supporters filed an argument for Measure Q; its text is not among the official documents gathered for this video."
sources = ["measure-list"]

[section.line.visual]
kind = "list"
source = "measure-list"
items = ["Filed by supporters; text not gathered"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "The official county list of measures, which names who filed each argument, says no argument against Measure Q was submitted."
sources = ["measure-list"]

[section.line.visual]
kind = "list"
source = "measure-list"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote authorizes the 1 percent sales tax."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["establishing a 1¢ sales tax"]

[[section.line]]
text = "A no vote does not authorize the sales tax."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["establishing a 1¢ sales tax"]

[[question]]
ask = "What purchases does the sales tax not reach?"
lines = ["exempt"]

[[question]]
ask = "What could the money be spent on?"
lines = ["general"]

[[question]]
ask = "When would the tax end?"
lines = ["end"]

[[question]]
ask = "How big is $6 million a year next to the city budget?"
unanswered = true
