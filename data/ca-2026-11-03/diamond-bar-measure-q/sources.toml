id = "ca-2026-11-03-diamond-bar-measure-q"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:diamond_bar"
kind = "measure"
title = "City of Diamond Bar Measure Q: A 1% Sales Tax Until Ended by Voters"

