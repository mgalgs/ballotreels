# Archived sources for City of Diamond Bar Measure Q, 2026-11-03 general
# election (sources/la-sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The Los Angeles County Registrar-Recorder/County Clerk's list "Measures
# Appearing on the Ballot" is the authority for the letter and the ballot
# question, quoted on the card; its "Supporters: ... Opponents: None
# submitted." line states in words who filed the primary arguments, so
# the same file backs `measure-list`, the official statement of filing.
# The Registrar's Interactive Sample Ballot prints the argument in favor
# that the list's supporters filed, saved as HTML, with "NO ARGUMENT
# AGAINST THIS MEASURE WAS SUBMITTED" under it. The City Attorney's
# impartial analysis is the measure's neutral explanation, the kind a
# state's attorney general's explanatory statement is, and gives the
# City's revenue estimate. Resolution No. 2026-28 (a scan with a text
# layer) places the measure, records the Council's vote and has the
# ordinance as Exhibit A. The staff report is the City's own case and is
# not cited.

