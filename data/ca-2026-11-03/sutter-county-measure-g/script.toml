# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; where the tax would apply and who
# would collect and share it; what the money could pay for, and what
# happens after a yes vote (the board adopts it, no earlier than April
# 2027); the impartial analysis's revenue estimate; one line per side;
# what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this county", and the two cities the
# analysis names are "two of its cities". The card and title carry the
# names. "Counsel" is heard as "Council" (standard/speakability.txt), so
# the narration says "the impartial analysis". A sales tax in cents is
# said as a percent (speakability.txt): "1 percent".
#
# The card quotes the pamphlet's "MEASURE G BALLOT QUESTION" page, which
# prints no yes and no sentences: the vote lines give the impartial
# analysis's, and both highlight the same phrase of the question.
#
# The supporters cite the oversight committee and audits as protections;
# the opponents say the committee only recommends, the audits look back,
# and the ballot's list of uses is not binding. So the neutral sections
# say only what the analysis says of the money's use (a general tax, any
# county purpose) and leave the committee and audits to the sides
# (STANDARD.md 6.3). That voters turned down two earlier sales taxes is
# stated only by the opponents, so it is not in the background.
#
# No archived source states the County's general fund budget, so the
# $22.5 million has no scale (STANDARD.md 6.5; left open, under
# [[question]]).

contest = "ca-2026-11-03-sutter-county-measure-g"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "G"
title = "MEASURE G BALLOT QUESTION"
origin = "COUNTY OF SUTTER"
summary = "SUTTER COUNTY SAFETY/ WATER PROTECTION MEASURE. Shall the measure developed by Sutter County, City of Yuba City and City of Live Oak to ensure adequate drinking water supplies; prevent fire station closure; maintain countywide services such as fire/emergency medical response; sheriff’s/police patrols; repairing roads; supporting local businesses; and other general purposes, by establishing a 1¢ sales tax until ended by voters, raising about $22,500,000 annually the State cannot take, requiring audits, citizens’ oversight, public review/ spending disclosure, be adopted?"

[[section]]
id = "what"
heading = "Measure G"

[[section.line]]
text = "Measure G asks the voters of this county whether to add a 1 percent sales tax."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["by establishing a 1¢ sales tax until ended by voters"]

[[section]]
id = "today"
heading = "Where it would apply"

[[section.line]]
id = "where"
text = "The tax would apply across the county, inside its cities and outside them."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "sales-receipt"

[[section.line]]
id = "shared"
text = "The state would collect it, like today's sales taxes, and pay it to the county and two of its cities under an agreement."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "county-building"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "general"
text = "As a general tax, the money would go to the county general fund and could pay for any county purpose."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "state-budget"

[[section.line]]
id = "adopt"
text = "If a majority votes yes, the board of supervisors may then adopt the tax, to start no earlier than April 1, 2027."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "fiscal"
heading = "What it would raise"

[[section.line]]
id = "revenue"
text = "The impartial analysis estimates $22.5 million a year, with the tax in place until voters repeal it."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["raising about $22,500,000 annually"]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say it protects fire and emergency response, patrols, water and roads, and that all of it stays local, with audits and oversight."
sources = ["argument-for"]
basis = ["When a fire breaks out, a family calls 911, or our community needs safe, reliable drinking water", "Measure G protects the basic local services Sutter County residents depend on every day", "Measure G provides a locally controlled source of funding for vital services. Every dollar stays local.", "Measure G includes strong taxpayer protections"]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Protects fire, patrols, water and roads", "Local money, with audits and oversight"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say the listed uses are not binding, future boards could spend it on anything, and it hits seniors and low-income families hardest."
sources = ["argument-against"]
basis = ["This is a general tax. The money goes straight into the general fund.", "is not a binding promise. Future Boards can spend it on anything they choose.", "Seniors on fixed incomes—Social Security or pensions that barely keep up—and low-income families feel a sales tax the hardest."]

[section.line.visual]
kind = "list"
source = "argument-against"
items = ["The list of uses is not binding", "Hits seniors and low-income families hardest"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote is in favor of approving the ordinance that establishes the tax."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["by establishing a 1¢ sales tax until ended by voters"]

[[section.line]]
text = "A no vote is against approving the ordinance that establishes the tax."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["by establishing a 1¢ sales tax until ended by voters"]

[[question]]
ask = "Where would the tax apply, and who gets the money?"
lines = ["where", "shared"]

[[question]]
ask = "What could the money be spent on?"
lines = ["general"]

[[question]]
ask = "When would the tax start, and what vote does it need?"
lines = ["adopt"]

[[question]]
ask = "How much would it raise, and for how long?"
lines = ["revenue"]

[[question]]
ask = "How big is $22.5 million next to the county budget?"
unanswered = true
