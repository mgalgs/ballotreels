# Archived sources for Sutter County Measure G, 2026-11-03 general
# election (sources/county-sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# Sutter County Clerk-Recorder/Elections prints Measure G's ballot
# question, full text (the proposed ordinance adding Chapter 105), County
# Counsel's impartial analysis, both arguments and both rebuttals on
# pages 17 to 26 of its County Voter Information Pamphlet. The pages run
# on with no breaks, so each file below shares its first or last page
# with its neighbour; each source is only the document its heading names,
# and every quote is from that document's own part of the page. The
# pamphlet was fetched from the county's site through a browser; the url
# is the Sample Ballot and Pamphlet page that posts it. County Counsel's
# impartial analysis is the measure's neutral explanation and its one
# revenue estimate; no tax rate statement or other fiscal analysis
# applies to a sales tax.

[contest]
id = "ca-2026-11-03-sutter-county-measure-g"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/county:sutter"
kind = "measure"
title = "Sutter County Measure G: 1 Percent Sales Tax"

