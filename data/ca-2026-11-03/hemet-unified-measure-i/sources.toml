# Archived sources for Hemet Unified School District Measure I,
# 2026-11-03 general election (sources/sources.md). Every id here may be
# cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1). The guide's pages are cut from the
# County of Riverside Registrar of Voters' County Voter Information Guide
# (ballot type 415); "page" is the guide's printed footer number.
#
# The ballot question is printed only on the sample ballot, whose
# columns of English and Spanish text pdftotext reads line by line across
# each other. The card therefore quotes sources/guide-pages.txt: the
# sample ballot page's text as poppler's `pdftotext -raw` extracts it
# from sources/sample-ballot-page.pdf (in the PDF's own reading order),
# followed by the measure pages' text as plain `pdftotext` extracts it
# from sources/voter-guide-measure-pages.pdf. The other sources cite the
# PDFs themselves.

[contest]
id = "ca-2026-11-03-hemet-unified-measure-i"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/school_district:hemet_unified_school_district"
kind = "measure"
title = "Hemet Unified Measure I: School Repair and Safety Bonds"

[[source]]
id = "ballot-label"
kind = "official-title-summary"
publisher = "County of Riverside Registrar of Voters, County Voter Information Guide, pages RV 415-021 and RV 415-050: Measure I's ballot question on the sample ballot, and the Impartial Analysis's statement of what a vote does"
credit = "Riverside County Voter Information Guide"
url = "https://docs.voteinfo.net/voterInformation/root1103/ballots/bt000415.pdf"
file = "sources/guide-pages.txt"
retrieved = "2026-10-28"

