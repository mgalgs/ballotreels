# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; how it reached the ballot; the
# tax today; what would change (the new rate and when, what the money is
# for, the Council's limited powers to amend the tax, the vote it
# needs); the revenue estimate as the ballot question gives it; both
# sides, neither of which has an archived argument; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". The card and title carry the
# names.
#
# The card quotes the Siskiyou County Clerk's Notice of Election, which
# prints the question with blank YES and NO lines but no yes/no
# statements: so the card has no YES/NO boxes.
#
# No impartial analysis was archived: every neutral line rests on the
# notice, on what Resolution No. 2026-22 finds or enacts (the 10 percent
# rate today, Section 3; a general tax paid into the General Fund,
# Section 5; a majority of the voters, Section 8) and on Exhibit A, the
# measure's text. The minutes give the fact of adoption. The agenda
# memorandum (the City staff's case for the increase) is not cited.
#
# The $245,000 a year is the ballot question's estimate. No archived
# source states the City's general fund budget to give it a scale
# (STANDARD.md 6.5; left open, under [[question]]).
#
# No argument for or against Measure G was archived, and no document
# says whether any was filed (the resolution authorizes an argument in
# favor; nothing records one submitted). So the sides do not say none
# was filed: each says none is among the documents gathered (filed =
# false, STANDARD.md 2.5), as for Walnut Creek Measure U.

contest = "ca-2026-11-03-yreka-measure-g"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "G"
title = "CITY OF YREKA"
origin = "NOTICE OF ELECTION"
summary = "To provide funding (all funds used for local services) for infrastructure and general City services, including, but not limited to, public safety, park and recreation programming, community events, and local economic development, shall the City increase the transient occupancy tax (hotel tax) rate from 10% to 12% on July 1, 2027, with an estimated increase of $245,000.00 generated annually from the resulting tax and will remain in effect until repealed or amended?"

