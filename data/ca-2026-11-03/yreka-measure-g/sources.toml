# Archived sources for City of Yreka Measure G, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# Siskiyou County posts no voter guide, only a Notice of Election per
# measure. The ballot question is quoted from the County Clerk's Notice
# of Election for Measure G, which is the authority for the letter and
# the question; Section 4 of the City's Resolution No. 2026-22 prints
# the same question word for word. No impartial analysis, argument or
# rebuttal was reached, and no document says whether any argument was
# filed (the notice and the resolution only invite or authorize them).
#
# The resolution and its Exhibit A (the code amendments, the measure's
# full text) are cited from the City's June 16, 2026 agenda packet
# (packet pages 77 to 86 cut from the 118-page packet): the copy
# published with the agenda, its vote left blank. The minutes of that
# meeting record the resolution's adoption; they are a scan with no text
# layer, so the passage cited was typed from the page images into
# sources/2026-06-16-council-minutes-transcription.txt, which names the
# PDF and URL it copies; that source points at the transcription, and
# its url at the scan. The agenda memorandum in the packet is the City
# staff's material and is not cited.

[contest]
id = "ca-2026-11-03-yreka-measure-g"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:yreka"
kind = "measure"
title = "City of Yreka Measure G: Raising the Hotel Tax from 10% to 12%"

