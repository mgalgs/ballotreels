# Archived sources for City of Los Angeles Charter Amendment PRK (scripted
# as Measure PRK, the site's convention), 2026-11-03 general election
# (sources/sources.md). All four come from one cut of the City Clerk's
# Voter Information Pamphlet, edition 201: the PDF's pages 9 and 60 to 66,
# the pamphlet's printed pages 7 (Ballot Summary) and 58 to 64.
#
# The Chief Legislative Analyst's Impartial Summary is the measure's
# neutral explanation, and the City Administrative Officer's Financial
# Impact Statement its fiscal analysis. No argument against was submitted
# (printed page 61); the pamphlet still prints a "Rebuttal Argument in
# Favor" (page 62), with no argument against for it to answer, and it is
# archived with the argument in favor as printed.

