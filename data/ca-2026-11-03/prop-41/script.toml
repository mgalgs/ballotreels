# Recipe E, 60 seconds, distilled: one claim per line. The chain: what a
# special tax is; how the spending limit works today; the three changes
# (audits, the limit, conflicting measures void); the analyst's cost,
# who pays it and the possible savings; one point per side; what a vote
# does. Prop 40 appears only in the opponents' section (rule 6.3).

contest = "ca-2026-11-03-prop-41"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "quick-reference"
number = "41"
title = "PROHIBITS NEW STATE TAXES THAT EXCLUDE REVENUES FROM STATE SPENDING LIMIT. REQUIRES AUDITS FOR NEW STATE SPECIAL TAXES. INITIATIVE CONSTITUTIONAL AMENDMENT."
origin = "Put on the Ballot by Petition Signatures"
summary = "Nullifies state taxes enacted after January 1, 2026 that exempt their revenues from voter-approved state spending limit. Requires pre-election and recurring audits of programs funded by new special taxes. Fiscal Impact: The net fiscal effect is unknown as it depends on future decisions by voters, the Legislature, and other policymakers."
yes = "A YES vote on this measure means: When special taxes are proposed by voter initiatives, the California State Auditor would review programs funded by the tax before the initiative appears on the ballot. The California State Auditor also would regularly review programs funded by special taxes approved by voters or the Legislature. In addition, the state might not be able to exclude any new special tax spending from its spending limit."
no = "A NO vote on this measure means: The California State Auditor’s responsibility to review government programs would not change. The state spending limit requirements would not change."

