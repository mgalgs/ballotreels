# Archived sources for Lincoln Unified School District Measure V,
# 2026-11-03 general election (sources/sources.md). Every id here may be
# cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# The San Joaquin County Registrar of Voters prints Measure V's ballot
# question, full text, the district's tax rate statement and County
# Counsel's impartial analysis on printed pages 591-594 of its composite
# County of San Joaquin Voter Information Guide & Sample Ballot;
# sources/vig-measure-v-pp591-594.pdf is those pages cut from it, and
# every source cites the full guide's URL with the pages. County
# Counsel's impartial analysis is the measure's neutral explanation, the
# kind a state's attorney general's explanatory statement is; the
# district's tax rate statement is its fiscal statement. The guide
# prints no argument for or against Measure V and no rebuttals, so there
# is no official-argument source.

[contest]
id = "ca-2026-11-03-lincoln-unified-measure-v"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/school_district:lincoln_unified_school_district"
kind = "measure"
title = "Lincoln Unified School District Measure V: School Facilities and Safety Bonds"

