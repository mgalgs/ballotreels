[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "fiscal"
heading = "What it would raise"

[[section.line]]
id = "revenue"
text = "The impartial analysis estimates the tax would raise $432,000 a year."
