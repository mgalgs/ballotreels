# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the regional paramedic authority
# and the tax today; what would change (the higher rate and the years,
# what the money may pay for); the vote it needs; the revenue estimate;
# one line per side; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this town", and the Ross Valley Paramedic
# Authority is "a regional paramedic authority". The card and title
# carry the names. No person is named.
#
# The neutral lines rest on the Town Attorney's impartial analysis and
# the Ordinance. The analysis says the measure extends the tax and
# increases its rate: today's tax is $103.50 per housing unit or per
# 1,500 square feet of other buildings, and Measure R's first year is up
# to $107.50 per housing unit or per 1,000 square feet. The analysis and
# the Ordinance give different maximums for the later years
# (sources.toml), so the script gives neither schedule: it says the rate
# may rise by up to $4 a year, as the ballot question does.
#
# The card quotes the ballot question as the county's Measure R page
# prints it now, its stray spaces ("$107. 50", "$432, 000") included.
# The page prints only YES and NO cells beside the question, so the card
# has no boxes and the vote lines take their meaning from the impartial
# analysis ("A 'yes' vote on Measure 'R' will approve this parcel tax.").
#
# The $432,000 a year is the analysis's estimate of Town revenue. No
# archived source states the Town's budget or the paramedic authority's,
# so it has no scale (STANDARD.md 6.5; left open). The rates per housing
# unit or per square foot are per-property amounts, exempt.
#
# The yes side is the argument in favor: its "at the current tax rate
# with modest annual increases" is its own claim, attributed, and the
# neutral lines before it give the analysis's rates. The county's page
# says "No argument against Measure R was filed.": the no side says so,
# attributed to the county (filed = false, STANDARD.md 2.5).

contest = "ca-2026-11-03-fairfax-measure-r"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "county-page"
number = "R"
title = "Measure R"
origin = "Town of Fairfax"
summary = "To maintain 9-1-1 emergency response times and the number of Ross Valley Paramedic Authority on-duty paramedics ready to respond to accidents/medical emergencies, shall the measure be adopted extending the Fairfax paramedic services special tax for four years at a rate of up to $107. 50/residential living unit or 1,000 square feet of developed nonresidential property, adjusted by up to $4.00/year, generating approximately $432, 000 annually, with annual audits; public spending disclosure; all funds for local paramedic services?"

[[section]]
id = "what"
heading = "Measure R"

[[section.line]]
text = "Measure R asks the voters of this town whether to continue a parcel tax for paramedic services for four more years."
sources = ["county-page", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "county-page"
highlight = ["extending the Fairfax paramedic services special tax for four years"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "authority"
text = "The tax pays for paramedic services from a regional paramedic authority that the town belongs to."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "valley-town-ambulance"

[[section.line]]
id = "rate-today"
text = "Today the tax is $103.50 per housing unit, or per 1,500 square feet of other buildings, and it ends in June 2027."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "city-parcels"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "rate"
text = "Measure R would raise the tax to up to $107.50 per housing unit, or per 1,000 square feet of other buildings, rising up to $4 a year until June 2031."
sources = ["impartial-analysis", "county-page", "text"]

[section.line.visual]
kind = "page"
source = "county-page"
highlight = ["adjusted by up to $4.00/year"]

[[section.line]]
id = "use"
text = "The money could pay only for paramedic and emergency medical services from the regional authority, with a yearly report on spending."
