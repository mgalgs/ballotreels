# Archived sources for Town of Fairfax Measure R, 2026-11-03 general
# election (sources/sources.md, its section "Marin County Elections
# measure page, read 2026-10-30"). Every id here may be cited by
# script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# The division is the Town's Census place, place:fairfax (divisions.tsv:
# "Town of Fairfax").
#
# The County of Marin's page for Measure R (read in a browser and saved
# as text, sources/county-page.txt) prints the ballot question the card
# quotes, the vote it needs ("Votes required to pass: 2/3 voter
# approval."), the Town Attorney's impartial analysis (the measure's
# neutral explanation, the kind a state's attorney general's explanatory
# statement is), the argument in favor, and the county's statement that
# no argument against was filed. The county says Measure R's ballot
# label was corrected after an earlier announcement; the label its page
# prints now is the one quoted. The page links no full text: the Town's
# Resolution No. 2026-24 (text layer) is the measure's record: Section 3
# the ballot question, Section 4 the Council's approval of the Ordinance
# and the two-thirds vote, and Exhibit A the Ordinance, the measure's
# text. The resolution's recitals ("responsive, high-quality" care) are
# the Town's words of benefit and are not narrated.
#
# The impartial analysis and the Ordinance print different yearly
# maximums after 2027-2028 (the analysis: $111.00, $114.50 and $118.00;
# the Ordinance, Section 3.44.030: $111.50, $115.50 and $119.50). The
# script picks neither: it gives the first year's maximum, on which both
# agree, and the ballot question's "adjusted by up to $4.00/year", which
# both schedules keep within.

[contest]
id = "ca-2026-11-03-fairfax-measure-r"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:fairfax"
kind = "measure"
title = "Town of Fairfax Measure R: Continuing the Paramedic Services Parcel Tax for Four Years"

