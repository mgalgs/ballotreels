# Archived sources for El Dorado County Measure S, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1). The pages are cut from the El Dorado
# County Elections Department's Voter Information Pamphlet (PDF pages
# 101 to 117, printed pages 45 to 61); "pages" below are the printed
# numbers.
#
# The pamphlet prints the full text, which ends with the ballot
# question, both arguments, both rebuttals and County Counsel's
# impartial analysis. No tax rate statement or fiscal analysis applies
# (a sales tax); the one revenue estimate is the ballot question's.

