# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks; how it reached the ballot and the vote it needs; what
# would change (where the tax applies, how the first year's money is
# split, where it goes after that, which hospitals qualify, who checks
# the spending); the ballot question's revenue estimate; one line per
# side; what a vote does.
#
# The pamphlet prints no tax rate statement or fiscal analysis (a sales
# tax); its one revenue estimate is the ballot question's, which the
# fiscal line names. County Counsel's impartial analysis is the neutral
# explanation, named as the county attorney's where it is said ("Counsel"
# is heard as "Council", standard/speakability.txt). No archived source
# states the county's budget, so the $13 million has no scale
# (STANDARD.md 6.5; left open).
#
# Sides come from the arguments for and against, not the rebuttals.
# The supporters' wildfire figures and their claim that visitors pay a
# share, and the opponents' tax-rate figures and their naming of one
# hospital, are theirs, so they stay in their sections or out
# (STANDARD.md 6.3). The rate is said in words ("three-eighths of 1
# percent"), not in cents per purchase (standard/speakability.txt).

contest = "ca-2026-11-03-el-dorado-county-measure-s"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide-page"
number = "S"
title = "IMPARTIAL ANALYSIS OF MEASURE S"
origin = "This Measure was placed on the ballot by a petition signed by the requisite number of voters."
summary = "To update hospital facilities, equipment, and technologies and maintain local access to emergency rooms; reduce wildfire risk by supporting local fire protection/prevention such as removing dry brush and other fire hazards; and provide rapid 9-1-1 emergency response to fires, accidents, and medical emergencies, shall the measure enacting a 3/8% sales tax for 30 years in El Dorado County, providing approximately $13,000,000 annually, with independent oversight, audits, and local control, be adopted?"
yes = "A “YES” vote is a vote to authorize the imposition of a three-eighths (3/8) of one percent sales tax within El Dorado County."
no = "A “NO” vote is a vote against the imposition of a three-eighths (3/8) of one percent sales tax within El Dorado County."

[[section]]
id = "what"
heading = "Measure S"

[[section.line]]
text = "El Dorado County Measure S asks county voters whether to add a three-eighths of 1 percent sales tax for 30 years, for hospitals and fire protection."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["a 3/8% sales tax for 30 years in El Dorado County"]

[[section]]
