# Archived sources for City of Burbank Measure CC, 2026-11-03 general
# election (sources/la-sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The Los Angeles County Registrar-Recorder/County Clerk's list "Measures
# Appearing on the Ballot" is the authority for the letter and the ballot
# question, quoted on the card; its "Opponents: None submitted." is the
# official statement that no argument against was filed (`measure-list`).
# The City Attorney's impartial analysis, the full text of the charter
# amendment and the argument in favor are the Registrar's own copies from
# its Interactive Sample Ballot, which supersede la-sources.md's earlier
# "blocked" notes. The impartial analysis is the measure's neutral
# explanation, the kind a state's attorney general's explanatory
# statement is; it gives no cost estimate. Resolution No. 26-29,725 (a
# scan, whose Exhibit A is the same amendment) is not cited.

[contest]
id = "ca-2026-11-03-burbank-measure-cc"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:burbank"
kind = "measure"
title = "City of Burbank Measure CC: Removing the Charter's Citywide Election Requirement for the City Council"

