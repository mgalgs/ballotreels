# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; how a school bond is repaid and what it needs
# to pass; what the money may pay for; the district's tax rate statement;
# one line per side; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the opening
# says "the voters of this school district". The card and title carry the
# names. "Counsel" is heard as "Council" (standard/speakability.txt), so
# the narration does not say it.
#
# The card quotes the County of Monterey Elections Department's List of
# Local Measures, which prints the ballot question with no yes and no
# sentences, so the card has no boxes and the vote lines take their
# meaning from the impartial analysis. The bond total and the debt service
# are repaid from a tax on property in the district, not from the
# district's budget, and no archived source states that budget, so they
# have no budget scale (STANDARD.md 6.5; left open), as other school
# bonds' do. The tax statement gives one figure, $36.00, for both its
# average and its highest rate.
#
# The supporters cite the schools' age, failing systems, the oversight
# and audits, safety upgrades and the ban on salaries, so the neutral
# sections describe the projects only as the impartial analysis lists
# them and leave the oversight and the salary ban out (STANDARD.md 6.3).
#
# The list links no argument against Measure I. The no side says so
# plainly; its section is marked filed = false.

contest = "ca-2026-11-03-carmel-unified-measure-i"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "measure-list"
number = "I"
title = "Carmel Unified School District"
origin = "55% Voter Approval Required"
summary = "To update local schools, replace aging roofs, failing heating, cooling, ventilation, plumbing, electrical and sewer with efficient systems; improve student/ school safety; repair/ replace old buildings and aging portables with permanent classrooms; update classrooms/playgrounds; improve disability access; shall Carmel Unified School District's measure be adopted, authorizing $250,000,000 in bonds at legal rates, levying $36 per $100,000 of assessed value, averaging $17,700,000 annually while bonds are outstanding, with independent oversight/ audits, no money for salaries, exclusively for CUSD?"

[[section]]
id = "what"
heading = "Measure I"

[[section.line]]
text = "Measure I asks the voters of this school district whether to approve $250 million in school bonds."
sources = ["measure-list", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "measure-list"
highlight = ["authorizing $250,000,000 in bonds"]

[[section]]
id = "today"
heading = "How a school bond works"

[[section.line]]
id = "repay"
text = "The district would sell the bonds and repay them from a yearly tax on property in the district."
sources = ["impartial-analysis", "tax-statement"]

[section.line.visual]
kind = "illustration"
name = "bond-certificates"

[[section.line]]
id = "threshold"
text = "Measure I needs 55 percent of the vote to pass."
sources = ["impartial-analysis", "measure-list", "text"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "projects"
text = "The bond money could pay only for the projects the measure lists."
sources = ["impartial-analysis", "text"]

[section.line.visual]
kind = "illustration"
name = "school-roof-repair"

[[section.line]]
id = "project-list"
text = "Those include replacing aging roofs and heating, plumbing and electrical systems, and replacing aging portables with permanent classrooms."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "school-classroom"

[[section]]
id = "fiscal"
heading = "What the tax statement says"

[[section.line]]
id = "rate"
text = "The district's tax rate statement estimates a tax of $36 per $100,000 of assessed value, through 2053-2054."
sources = ["tax-statement"]

[section.line.visual]
kind = "bars"
title = "Estimated tax per $100,000 of assessed value, dollars"
source = "tax-statement"
unit = ""
labels = ["Average", "Highest"]
values = [36, 36]

[[section.line]]
id = "total"
text = "The statement estimates the total to repay, with interest, at about $482.1 million."
sources = ["tax-statement"]

[section.line.visual]
kind = "illustration"
name = "debt-payments"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say many schools are nearly 90 years old with failing systems, and citizen oversight and audits would ensure the money is used as intended."
sources = ["argument-for"]
basis = ["Many of our schools and facilities are nearly 90 years old.", "aging roofs, failing heating and cooling systems, deteriorating water and sewer lines, and outdated electrical infrastructure are increasingly disrupting classrooms", "Independent citizens' oversight, annual reports and audits ensure funds are used as intended"]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Repairs schools nearly 90 years old", "Oversight and audits ensure intended use"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure I was filed, so the list of local measures from the county shows only the argument in favor of the measure."
sources = ["measure-list"]

[section.line.visual]
kind = "list"
source = "measure-list"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote is in favor of issuing $250 million in general obligation bonds for the purposes the measure sets out."
sources = ["impartial-analysis", "measure-list"]

[section.line.visual]
kind = "page"
source = "measure-list"
highlight = ["authorizing $250,000,000 in bonds"]

[[section.line]]
text = "A no vote is against issuing the bonds."
sources = ["impartial-analysis", "measure-list"]

[section.line.visual]
kind = "page"
source = "measure-list"
highlight = ["be adopted"]

[[question]]
ask = "How would the bonds be paid back?"
lines = ["repay", "total"]

[[question]]
ask = "How much tax would I pay, and for how long?"
lines = ["rate"]

[[question]]
ask = "What could the money be spent on?"
lines = ["projects", "project-list"]

[[question]]
ask = "What vote does the measure need to pass?"
lines = ["threshold"]

[[question]]
ask = "How large is the bond next to the district's yearly budget?"
unanswered = true
