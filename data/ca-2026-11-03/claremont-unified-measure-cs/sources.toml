# Archived sources for Claremont Unified School District Measure CS,
# 2026-11-03 general election (sources/la-sources.md). Every id here may be
# cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# The Los Angeles County Registrar-Recorder/County Clerk's list "Measures
# Appearing on the Ballot" prints each measure's letter, vote threshold and
# ballot question, and says in words who filed the primary arguments
# ("Supporters: ... Opponents: ..."). The card quotes the ballot question
# from it (ballot-question), and the sides cite it as the Registrar's
# statement of filing (measure-list). The same excerpt backs both.
#
# No impartial analysis, no tax rate statement and no argument text was
# staged: the resolution delegates the tax rate statement's filing to the
# Registrar, and no copy was found. The measure is explained from the
# district's Resolution No. 23-2026, a text PDF, and its Exhibit B (the
# full text ballot proposition and project list). The one tax estimate is
# the ballot question's own. The June 18, 2026 board agenda
# (staff-report.html) adds no fact the script needs and is not cited.

[contest]
id = "ca-2026-11-03-claremont-unified-measure-cs"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/school_district:claremont_unified_school_district"
kind = "measure"
title = "Claremont Unified School District Measure CS: $77 Million School Repair Bond"

