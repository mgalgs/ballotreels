# Archived sources for Claremont Unified School District Measure CS,
# 2026-11-03 general election (sources/la-sources.md). Every id here may be
# cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# The Los Angeles County Registrar-Recorder/County Clerk's list "Measures
# Appearing on the Ballot" prints each measure's letter, vote threshold and
# ballot question; the card quotes the ballot question from it
# (ballot-question).
#
# The Registrar's Interactive Sample Ballot gives the County Counsel's
# impartial analysis, the district's tax rate statement, the full text,
# and the arguments and rebuttals as filed (HTML, retrieved 2026-10-30).
# The impartial analysis is the measure's neutral explanation, the kind
# the state rounds give an analyst's explanation; the tax rate statement
# is the fiscal statement. The district's Resolution No. 23-2026 (text)
# still backs the lines on the ballot question and the bond's repayment.
# The June 18, 2026 board agenda (staff-report.html) adds no fact the
# script needs and is not cited.

[contest]
id = "ca-2026-11-03-claremont-unified-measure-cs"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/school_district:claremont_unified_school_district"
kind = "measure"
title = "Claremont Unified School District Measure CS: $77 Million School Repair Bond"

