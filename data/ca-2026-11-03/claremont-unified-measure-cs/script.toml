# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; how a school bond is repaid and what it needs
# to pass; what the money may pay for; the tax estimate the ballot
# question itself gives; one line per side; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the opening
# says "the voters of this school district". The card and title carry the
# names.
#
# The card quotes the Los Angeles County Registrar-Recorder/County Clerk's
# list "Measures Appearing on the Ballot", which prints the ballot question
# with no yes and no sentences, so the card has no boxes and the two vote
# lines highlight the same phrase of the question.
#
# No impartial analysis and no tax rate statement were staged, so what the
# measure does comes from the resolution and its full text alone, and the
# fiscal lines say the estimate is the ballot question's own. The ballot
# question's "without increasing current taxes" is said as the ballot
# question's claim, not the narrator's. The bond total and the yearly levy
# are repaid from a tax on property in the district, not from the
# district's budget, and no archived source states that budget, so they
# have no budget scale (STANDARD.md 6.5; left open), as other school
# bonds' do.
#
# The Registrar's list names who filed an argument for and an argument
# against, but neither text was staged. Each side says only that its
# argument was filed and is not among the documents gathered, in the same
# words, and never guesses what it says. No filer is named, on either side
# alike. Both sides set filed = false.

contest = "ca-2026-11-03-claremont-unified-measure-cs"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "CS"
title = "CLAREMONT UNIFIED SCHOOL DISTRICT"
origin = "VOTE PASSAGE – 55% of the Votes Cast"
summary = "CLAREMONT UNIFIED SCHOOL DISTRICT CLASSROOM SAFETY, HEALTH AND REPAIR MEASURE. To repair/upgrade aging classrooms, heating/air conditioning/electrical/plumbing systems, improve safety/security, fix leaky/deteriorating roofs, repair/construct/equip classroom sites/facilities without increasing current taxes, shall the Claremont Unified School District's measure authorizing $77,000,000 of bonds at legal rates, levying approximately $32/$100,000 of assessed value ($5,000,000 annually) while bonds are outstanding, be adopted, requiring audits/independent oversight, no money for inappropriate administrator salaries, all funds staying local?"

[[section]]
id = "what"
heading = "Measure CS"

[[section.line]]
text = "Measure CS asks the voters of this school district whether to approve $77 million in school bonds."
