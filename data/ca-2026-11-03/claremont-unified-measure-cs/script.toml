# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; how a school bond is repaid and what it needs
# to pass; what the money may pay for; the tax rate statement's estimates;
# one line per side; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the opening
# says "the voters of this school district". The card and title carry the
# names.
#
# The card quotes the Los Angeles County Registrar-Recorder/County Clerk's
# list "Measures Appearing on the Ballot", which prints the ballot question
# with no yes and no sentences, so the card has no boxes and the two vote
# lines highlight the same phrase of the question.
#
# What the measure does rests on the County Counsel's impartial analysis
# ("Counsel" is heard as "Council", so the lines do not name the office),
# with the full text for the project list. The fiscal lines give the
# district's tax rate statement's estimates as it states them. The bond
# total and the debt service are repaid from a tax on property in the
# district, not from the district's budget, and no archived source states
# that budget, so they have no budget scale (STANDARD.md 6.5; left open),
# as other school bonds' do.
#
# The sides come from the arguments and rebuttals the Registrar prints.
# That current tax rates would not rise is the supporters' point (their
# argument and rebuttal), so the neutral fiscal lines no longer repeat
# the ballot question's "without increasing current taxes" (STANDARD.md
# 6.3); the card quotes it as printed. The opponents answer that point in
# their rebuttal (taxes would fall when the old bond ends), so the no line
# gives that beside their argument's falling enrollment. No filer is
# named, on either side alike.

contest = "ca-2026-11-03-claremont-unified-measure-cs"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "CS"
title = "CLAREMONT UNIFIED SCHOOL DISTRICT"
origin = "VOTE PASSAGE – 55% of the Votes Cast"
summary = "CLAREMONT UNIFIED SCHOOL DISTRICT CLASSROOM SAFETY, HEALTH AND REPAIR MEASURE. To repair/upgrade aging classrooms, heating/air conditioning/electrical/plumbing systems, improve safety/security, fix leaky/deteriorating roofs, repair/construct/equip classroom sites/facilities without increasing current taxes, shall the Claremont Unified School District's measure authorizing $77,000,000 of bonds at legal rates, levying approximately $32/$100,000 of assessed value ($5,000,000 annually) while bonds are outstanding, be adopted, requiring audits/independent oversight, no money for inappropriate administrator salaries, all funds staying local?"

[[section]]
id = "what"
heading = "Measure CS"

[[section.line]]
text = "Measure CS asks the voters of this school district whether to approve $77 million in school bonds."
sources = ["ballot-question", "text"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["authorizing $77,000,000 of bonds"]

[[section]]
id = "today"
heading = "How a school bond works"

[[section.line]]
id = "repay"
text = "The district would sell the bonds and repay them from a yearly tax on property in the district."
sources = ["ballot-question", "text"]

[section.line.visual]
kind = "illustration"
name = "bond-certificates"

[[section.line]]
id = "threshold"
text = "Measure CS needs 55 percent of the vote to pass."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "projects"
text = "The bond money could pay only for the school projects the measure lists."
sources = ["impartial-analysis", "full-text"]

[section.line.visual]
kind = "illustration"
name = "school-roof-repair"

[[section.line]]
id = "project-list"
text = "Those include repairing classrooms, heating, air conditioning, plumbing and electrical systems, improving safety and security, and replacing leaky roofs."
sources = ["full-text"]

[section.line.visual]
kind = "illustration"
name = "school-classroom"

[[section]]
id = "fiscal"
heading = "What the tax rate statement says"

[[section.line]]
id = "rate"
text = "The district's tax rate statement estimates a tax of $31.96 per $100,000 of assessed value each year, through 2056-2057."
sources = ["tax-statement", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "debt-payments"

[[section.line]]
id = "total"
text = "The statement estimates the total to repay, with interest, at about $153.7 million."
sources = ["tax-statement", "impartial-analysis"]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
id = "yes-line"
text = "Supporters say Measure CS would fund safety and repair work at every school without raising the current school bond tax rate."
sources = ["argument-for", "rebuttal-to-against"]
basis = ["This measure does not increase the current school bond tax rate.", "This will provide $77 million for critical repairs and improvements at every school site", "Homeowners will not experience any increase in their annual property tax rate as a result of this bond"]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Safety and repairs at every school", "No rise in the current tax rate"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
id = "no-line"
text = "Opponents say district enrollment is falling, and that taxes would drop when the old bond ends unless Measure CS extends them."
sources = ["argument-against", "rebuttal-to-for"]
basis = ["expects enrollment to decrease by 125 students annually for the foreseeable future", "when that bond expires your taxes will DECREASE", "this measure would effectively extend that year 2000 bond to the year 2060"]

[section.line.visual]
kind = "list"
source = "argument-against"
items = ["District enrollment is falling", "Taxes would drop as old bond ends"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote approves the $77 million in school bonds."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["authorizing $77,000,000 of bonds"]

[[section.line]]
text = "A no vote rejects the $77 million in school bonds."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["authorizing $77,000,000 of bonds"]

[[question]]
ask = "How would the bonds be paid back?"
lines = ["repay", "rate"]

[[question]]
ask = "How much tax would I pay, and for how long?"
lines = ["rate"]

[[question]]
ask = "What could the money be spent on?"
lines = ["projects", "project-list"]

[[question]]
ask = "What vote does the measure need to pass?"
lines = ["threshold"]

[[question]]
ask = "What would the bonds cost in all, with interest?"
lines = ["total"]

[[question]]
ask = "What do the supporters and the opponents argue?"
lines = ["yes-line", "no-line"]

[[question]]
ask = "How large is the bond next to the district's yearly budget?"
unanswered = true
