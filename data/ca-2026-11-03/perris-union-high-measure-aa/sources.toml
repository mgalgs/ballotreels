# Archived sources for Perris Union High School District Measure AA,
# 2026-11-03 general election (sources/sources.md). Every id here may be
# cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1). The guide's pages are cut from the
# County of Riverside Registrar of Voters' County Voter Information Guide
# (ballot type 49); "page" is the guide's printed footer number.
#
# One file holds the guide's pages for Measure AA: the full text (which
# reprints the ballot question), the Tax Rate Statement, County Counsel's
# Impartial Analysis and the argument in favor; each is its own source.

[contest]
id = "ca-2026-11-03-perris-union-high-measure-aa"
