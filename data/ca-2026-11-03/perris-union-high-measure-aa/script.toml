# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and of whom; how a school bond is repaid and what it needs to
# pass; what the money would pay for; the district's tax statement; one
# line per side; what a vote does.
#
# The full text reprints the ballot question, which has no title line, so
# the card quotes the question as its title (as Santee School District's
# card does), the Impartial Analysis's statement of what the measure does
# as its summary, and the analysis's yes and no lines. The title keeps
# "Perris Union High School District" whole: the City of Perris has a
# Measure C on this ballot. "Counsel" is heard as "Council"
# (standard/speakability.txt). The bond total and the debt service are
# repaid from a tax on property in the district, and no archived source
# states the district's budget, so they have no budget scale (STANDARD.md
# 6.5; left open). The fiscal line gives the tax statement's highest rate
# beside its average, as it prints both. "Without increasing current tax
# rates" is the supporters' argument as well as the question's opening,
# so the neutral sections keep to the tax statement's own figures and
# leave those words on the card (STANDARD.md 6.3).
#
# No argument against Measure AA was filed. The no side says so plainly;
# its section is marked filed = false.

contest = "ca-2026-11-03-perris-union-high-measure-aa"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-label"
number = "AA"
title = "Without increasing current tax rates, to repair/ acquire/ upgrade/ construct classrooms, career technical education / school sites and facilities to support college/career readiness in math, science, technology, engineering, and skilled trades; remove hazardous materials where needed; and improve school safety/security systems, shall Perris Union High School District’s measure be adopted authorizing $187,000,000 in bonds at legal rates, levying $20 per $100,000 assessed value (averaging $12 million annually) while bonds are outstanding, with citizen oversight, audits and independent audits?"
origin = "The Board of Trustees of the District, by adopting Resolution No. 04:26-27 (“Resolution”), elected to call an election to place this Measure on the ballot."
summary = "Measure AA would enable the District to issue and sell bonds of up to a maximum amount of one-hundred and eighty-seven million dollars ($187,000,000), at legal rates, levying twenty dollars ($20) per one-hundred thousand dollars ($100,000) of assessed value while the bonds are outstanding."
yes = "A “YES” vote on Measure “AA” is a vote to authorize the District to issue and sell bonds to provide ﬁnancing of school facilities projects."
no = "A “NO” vote on Measure “AA” is a vote to reject the District from issuing and selling bonds to provide ﬁnancing of school facilities projects."

