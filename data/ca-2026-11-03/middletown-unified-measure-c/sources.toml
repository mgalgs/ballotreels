# Archived sources for Middletown Unified School District Measure C,
# 2026-11-03 general election (sources/sources.md). Every id here may be
# cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# The Lake County Registrar of Voters prints the whole measure in its
# Voter's Pamphlet, "Measures, Analyses and Arguments", pamphlet pages
# 017M501 to 017M506, posted as one PDF: the ballot question and the
# start of the full text, Exhibit A (017M501), the rest of the full text
# with the Bond Project List (017M502 to 017M504), County Counsel's
# impartial analysis and the district's Tax Information Statement,
# Exhibit B (017M505), and the argument in favor with "NO ARGUMENT
# AGAINST MEASURE C WAS SUBMITTED" (017M506). The impartial analysis is
# the measure's neutral explanation; the tax information statement is
# its fiscal statement. No rebuttals are printed.

