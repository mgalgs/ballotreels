# Recipe E, about 60 seconds, distilled: one claim per line, in the shape
# of the merged school bond scripts (Lassen Union High Y). The chain:
# what it asks and of whom; how a school bond is repaid and what it
# needs to pass; what the money may pay for; the district's tax
# information statement; one line per side; what a vote does.
#
# The card quotes the ballot question as the Voter's Pamphlet prints it
# on page 017M501, under the section's running head. The pamphlet prints
# only "Yes" and "No" blanks with it, no yes/no statements, so the card
# has no YES/NO boxes and the vote lines give the impartial analysis's
# own meanings, both highlighting the same phrase of the question. No
# name of the school, district or county is narrated: the card and the
# title show them.
#
# The bond total, the $2,155,000 a year and the debt service are repaid
# from a tax on property in the district, and no archived source states
# the district's budget, so they have no budget scale (STANDARD.md 6.5;
# left open). The bond total is said exactly as the question prints it.
# The tax statement's average rate is said beside its highest rate,
# which is the ballot's "approximately $49"; its fiscal years are
# written in full (standard/speakability.txt); "approximately
# $77,562,917" is said as "about $77.6 million". The projects line
# follows the ballot question's list, which the Bond Project List
# repeats; its "to improve the quality of education" is the district's
# purpose and is left out. The audits, the citizens' oversight, the bar
# on salaries and money staying local are in the supporters' argument,
# so the neutral sections leave them out (STANDARD.md 6.3).
#
# No argument against Measure C was submitted. The no side says so
# plainly; its section is marked filed = false. With no one on the
# record for the other side, the script names none of the argument's
# signers.

contest = "ca-2026-11-03-middletown-unified-measure-c"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "C"
title = "MIDDLETOWN UNIFIED SCHOOL DISTRICT SCHOOL BOND MEASURE “C”"
origin = "MEASURES, ANALYSES AND ARGUMENTS"
summary = "To improve the quality of education; repair/replace leaky roofs; construct/improve science, technology, engineering, arts, mathematics, agriculture, and career technical education facilities; and replace outdated heating, ventilation and air-conditioning systems; shall Middletown Unified School District’s measure authorizing $38,000,000 of bonds, at legal rates, and levying approximately $49 per $100,000 of assessed value ($2,155,000 annually) while bonds are outstanding, be adopted, with annual audits, independent citizens’ oversight, NO money for administrator salaries and all money spent locally?"

[[section]]
id = "what"
heading = "Measure C"

[[section.line]]
text = "Measure C asks the voters of this school district whether to approve $38,000,000 in school bonds."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["authorizing $38,000,000 of bonds"]

[[section]]
id = "today"
heading = "How a school bond works"

[[section.line]]
text = "The district would sell the bonds over time and repay them from a tax on property in the district."
sources = ["tax-statement"]

[section.line.visual]
kind = "illustration"
name = "bond-certificates"

[[section.line]]
text = "Measure C needs 55 percent of the vote to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "projects"
text = "The money could go to projects such as repairing roofs, replacing heating and cooling systems, and building science, agriculture and career classrooms."
sources = ["ballot-question", "text"]

[section.line.visual]
kind = "illustration"
name = "school-roof-repair"

[[section]]
id = "fiscal"
heading = "What the tax statement says"

[[section.line]]
id = "tax-rate"
text = "The district's tax statement estimates $47.33 a year per $100,000 of assessed value, on average, through 2061-2062."
sources = ["tax-statement"]

[section.line.visual]
kind = "illustration"
name = "debt-payments"

[[section.line]]
id = "tax-peak"
text = "The statement estimates the highest rate at $49 per $100,000, in 2026-2027."
sources = ["tax-statement"]

[[section.line]]
text = "The statement estimates the total to repay, with interest, at about $77.6 million."
sources = ["tax-statement"]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say many classrooms and school facilities are outdated, and the measure protects taxpayers with audits and citizens' oversight."
sources = ["arguments"]
basis = ["many classrooms and school facilities in the Middletown Unified School District are outdated and inadequate to provide students with the proper school facilities they need to succeed.", "Measure C makes financial sense and protects taxpayers.", "By law, spending must be reviewed and annually audited by an independent citizens’ oversight committee."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Many classrooms are outdated", "Audits and citizens' oversight"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure C was submitted, so the county voter guide prints only the argument in favor of it."
sources = ["arguments"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote supports selling up to $38,000,000 in bonds for the listed school projects."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["authorizing $38,000,000 of bonds"]

[[section.line]]
text = "A no vote is a vote against selling the bonds."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["authorizing $38,000,000 of bonds"]

[[question]]
ask = "What would the bond money pay for?"
lines = ["projects"]

[[question]]
ask = "How much would property owners pay?"
lines = ["tax-rate", "tax-peak"]

[[question]]
ask = "How big is $38,000,000 next to the district's yearly budget?"
unanswered = true
