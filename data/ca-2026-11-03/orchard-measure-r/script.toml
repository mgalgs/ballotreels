# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; how the tax would be charged and what it
# needs to pass; what the money may pay for and who is exempt; the
# revenue estimate; one line per side; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the opening
# says "the voters of this school district". The card and title carry the
# names. "Counsel" is heard as "Council" (standard/speakability.txt), so
# the narration does not say it. The rate, 4 cents a square foot, is an
# amount under a dollar, which no spelling narrates reliably
# (standard/speakability.txt): the narration says how the tax is charged
# and leaves the figure to the card, where it is highlighted.
#
# The card quotes the Registrar of Voters' List of Local Measures, which
# prints the ballot question with no yes and no sentences, so the card has
# no boxes and the vote lines take their meaning from the impartial
# analysis. The ballot question's $1.4 million a year is district
# revenue, and no archived source states the district's budget, so it has
# no scale (STANDARD.md 6.5; left open). The caps per parcel are exempt.
#
# The supporters cite core programs in math, science and reading, and
# property values, so the neutral sections name the analysis's other
# purposes. Only the Registrar of Voters' record is archived; the full
# text was not, and the impartial analysis carries the explanation.
#
# The List of Local Measures shows "Primary Argument Against (none
# filed)". The no side says so plainly; its section is marked
# filed = false.

contest = "ca-2026-11-03-orchard-measure-r"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "measure-list"
number = "R"
title = "Parcel Tax"
origin = "Orchard School District"
summary = "To enhance and create quality educational opportunities, attract and retain teachers and staff, support Science, Technology, Engineering, Arts and Mathematics (STEAM) education and visual and performing arts, shall the Orchard School District measure levying a parcel tax at the rate of 4 cents per building square foot (not-to-exceed $7,500 non-residential and $89 residential per parcel), raising $1.4 million annually for eight years beginning July 1, 2027, with senior exemptions and all expenditures audited be adopted?"

[[section]]
id = "what"
heading = "Measure R"

[[section.line]]
text = "Measure R asks the voters of this school district whether to approve a parcel tax for eight years, beginning July 1, 2027."
sources = ["measure-list", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "measure-list"
highlight = ["levying a parcel tax"]

[[section]]
id = "today"
heading = "How the tax works"

[[section.line]]
id = "rate"
text = "The tax would be charged each year by the square foot of building on a parcel."
sources = ["measure-list", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "measure-list"
highlight = ["4 cents per building square foot"]

[[section.line]]
id = "caps"
text = "A home would pay at most $89 a year, and other property at most $7,500."
sources = ["impartial-analysis", "measure-list"]

[section.line.visual]
kind = "page"
source = "measure-list"
highlight = ["not-to-exceed $7,500 non-residential and $89 residential per parcel"]

[[section.line]]
id = "threshold"
text = "Measure R needs two-thirds of the vote to pass."
sources = ["impartial-analysis", "measure-list"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "uses"
text = "The money could pay only for listed purposes, such as keeping teachers, counselors and health staff, and classes in coding and robotics."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "school-classroom"

[[section.line]]
id = "exempt"
text = "Owners aged 65 or older who live in their home could apply for an exemption, and so could some residents with disabilities."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "special-tax"

[[section]]
id = "fiscal"
heading = "What the ballot question says"

[[section.line]]
id = "revenue"
text = "The ballot question says the tax would raise $1.4 million a year."
sources = ["measure-list"]

[section.line.visual]
kind = "page"
source = "measure-list"
highlight = ["raising $1.4 million annually"]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Measure R protects strong core programs in math, science and reading, and that quality schools and classrooms protect property values."
sources = ["argument-for"]
basis = ["Maintain and protect strong core academic programs in math, science and reading", "Quality schools and classrooms protect and enhance our property values and support our students."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Protects math, science and reading", "Quality schools protect property values"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure R was filed, so the list of local measures from the county shows only the argument for it."
sources = ["measure-list"]

[section.line.visual]
kind = "list"
source = "measure-list"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote levies the parcel tax, with its yearly caps, for eight years beginning July 1, 2027."
sources = ["impartial-analysis", "measure-list"]

[section.line.visual]
kind = "page"
source = "measure-list"
highlight = ["levying a parcel tax"]

[[section.line]]
text = "A no vote does not levy the tax."
sources = ["impartial-analysis", "measure-list"]

[section.line.visual]
kind = "page"
source = "measure-list"
highlight = ["be adopted"]

[[question]]
ask = "How much would a home pay?"
lines = ["rate", "caps"]

[[question]]
ask = "Who would be exempt?"
lines = ["exempt"]

[[question]]
ask = "What would the money pay for?"
lines = ["uses"]

[[question]]
ask = "Does the district have a parcel tax now?"
unanswered = true

[[question]]
ask = "How large is $1.4 million a year next to the district's budget?"
unanswered = true
