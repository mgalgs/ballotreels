# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and whose measure it is; the vote it needs; what would change (the
# rate and what it leaves out, when it starts and for how long, what the
# money may pay for and the audit); the impartial analysis's revenue
# estimate; one line per side; what a vote does.
#
# The guide prints no ballot question and no tax rate statement: the card
# quotes the ballot question from the City Council's resolution. The
# City Attorney's Impartial Analysis gives the yes/no meanings, which the
# vote lines quote, highlighting the card's own "be adopted?". Its
# estimate, "an additional $2,000,000 in annual funding", has no archived
# General Fund total beside it, so it has no scale (STANDARD.md 6.5; left
# open). That visitors would pay the tax too is the supporters' point
# ("visitors and tourists pay their fair share"), so it stays out of the
# neutral sections (STANDARD.md 6.3), though the analysis says it; so
# does the exemption for groceries and medicine ("Groceries and
# prescription medications WON'T be taxed"), which the neutral line
# covers as "taxable goods".
#
# No argument against was filed: the no side says so, filed = false
# (STANDARD.md 2.5).

contest = "ca-2026-11-03-twentynine-palms-measure-g"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "G"
title = "ADOPTION OF A 1% TRANSACTIONS (SALES) AND USE TAX"
origin = "A RESOLUTION OF THE CITY COUNCIL OF THE CITY OF TWENTYNINE PALMS, CALIFORNIA"
summary = "Shall the measure funding services for City of Twentynine Palms residents (including those required for maintaining 911 and emergency response times, police officers and patrols; repairing streets/sidewalks; responding to floods/natural disasters; maintaining clean and safe public parks; and upgrading the animal shelter) by levying a transaction (sales) and use tax of 1%, providing approximately $2,000,000 in funds annually until ended by voters, requiring audits, public spending disclosures, and that all funds are used locally, be adopted?"

[[section]]
id = "what"
heading = "Measure G"

[[section.line]]
text = "Measure G asks this city's voters whether to add a 1 percent sales tax for city services."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["transaction (sales) and use tax of 1%"]

[[section]]
id = "today"
heading = "What it needs to pass"

[[section.line]]
text = "Measure G needs a majority of the vote to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "dollar-per-hundred"
text = "The tax would be one dollar for every $100 spent on taxable goods in the city."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "special-tax"

[[section.line]]
text = "The tax would start April 1, 2027, and stay until voters repeal it."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "end-date"

[[section.line]]
text = "The money could go only to local services and local priorities, checked by a yearly audit."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section]]
id = "fiscal"
heading = "What the impartial analysis says"

[[section.line]]
text = "The city attorney's impartial analysis estimates the tax would bring the city $2,000,000 a year."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "set-aside-funds"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Measure G funds roads, public safety and the animal shelter, and has visitors pay their share."
sources = ["argument-for"]
basis = ["Measure G is critical to ensure our road maintenance, public safety, emergency preparedness, animal shelter, and other local services remain functional", "Measure G will ensure that Twentynine Palms visitors and tourists pay their fair share.", "This means non-residents will help pay for our streets, police, and other services."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Keeps roads, public safety and the shelter going", "Visitors and tourists help pay for services"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure G was filed, so the county voter guide prints only the argument of supporters."
sources = ["argument-for"]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote will authorize the 1 percent sales tax."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["be adopted?"]

[[section.line]]
text = "A no vote will not authorize the 1 percent sales tax."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["be adopted?"]

[[question]]
ask = "How much would the tax cost a shopper?"
lines = ["dollar-per-hundred"]

[[question]]
ask = "How big is the city's budget, compared with the tax?"
unanswered = true
