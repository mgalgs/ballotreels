[[question]]
ask = "Who would pay the tax?"
lines = ["who-pays", "rate"]

[[question]]
ask = "What could the money be spent on?"
lines = ["uses"]

[[question]]
ask = "How big is $194,600 next to the library district's yearly budget?"
unanswered = true
