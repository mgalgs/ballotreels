id = "ballot-summary"
kind = "official-title-summary"
publisher = "Ballot Summary for Lassen Library District Special Tax Measure “Z”, Lassen County Elections, Local Voter Information Guide for the November 3, 2026 General Election, page 39 of the PDF"
