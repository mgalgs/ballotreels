# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks; the sales tax today; how it reached the ballot and what it needs
# to pass; what would change (the added cent, how long, where the money
# goes); the impartial analysis's revenue estimate; one line per side;
# what a vote does.
#
# The card quotes the ballot question from the City Council's resolution
# (the guide prints none), which has no yes/no lines; the vote lines
# give the City Attorney's Impartial Analysis's meanings and both
# highlight the phrase of the question they turn on. "City's" is heard
# as "cities" (standard/speakability.txt), so the narration says neither.
#
# The estimate is city staff's, as the analysis attributes it, and has no
# scale: no archived source states the city's general fund budget
# (STANDARD.md 6.5; left open). That visitors pay part of the tax is the
# supporters' point, so it stays out of the neutral sections (STANDARD.md
# 6.3).
#
# No argument against is printed in the guide (the Registrar's measures
# page: "No Argument Against was filed."): the no side is filed = false.

contest = "ca-2026-11-03-highland-measure-e"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-label"
number = "E"
title = "City of Highland Public Safety and Local Control Measure"
origin = "A RESOLUTION OF THE CITY COUNCIL OF THE CITY OF HIGHLAND, CALIFORNIA, APPROVING AND ORDERING THAT A GENERAL TAX MEASURE BE SUBMITTED TO VOTERS OF THE CITY OF HIGHLAND"
summary = "To maintain local funding for police, fire, emergency services; and improve critical infrastructure, including maintaining roads, bridges, drainage, 5th Street Corridor Interchange, and other improvement projects; shall the City of Highland enact a 1¢ sales tax, providing approximately $6.35 million annually, remaining in effect until ended by voters, with funds staying in the City and generated from purchases paid by both visitors and City residents?"

[[section]]
id = "what"
heading = "Measure E"

[[section.line]]
text = "City of Highland Measure E asks Highland voters whether to add a one-cent sales tax."
sources = ["ballot-label"]

[section.line.visual]
kind = "page"
source = "ballot-label"
highlight = ["1¢ sales tax"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Today the total sales tax rate in Highland is 7.75 percent."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "city-storefronts"

[[section.line]]
text = "The City Council voted unanimously to put Measure E on the ballot, and it needs a simple majority to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "ballot-box"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "Measure E would add 1 percent, one cent on every dollar of taxable sales."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "special-tax"

[[section.line]]
text = "The tax would last until voters end it."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "end-date"

[[section.line]]
text = "The money would go to the general fund, for any lawful city program or service."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "state-budget"

[[section]]
id = "fiscal"
heading = "What it would raise"

[[section.line]]
text = "The impartial analysis says city staff estimate the tax would raise about $6.35 million a year."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "set-aside-funds"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Measure E maintains police, fire and emergency services, which Highland would otherwise have to cut."
sources = ["argument-for"]
basis = ["Vote YES on Measure E to maintain funding needed for City police, fire, and emergency services", "Without a new revenue stream, the City will be forced to cut public safety services and essential infrastructure projects."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Maintains police, fire and emergency services", "Visitors pay their share when they shop here"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure E was submitted, so the county voter guide prints only the supporters' argument."
sources = ["argument-for"]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote adopts the one-cent sales tax."
sources = ["impartial-analysis", "ballot-label"]

[section.line.visual]
kind = "page"
source = "ballot-label"
highlight = ["1¢ sales tax"]

[[section.line]]
text = "A no vote does not adopt the one-cent sales tax."
sources = ["impartial-analysis", "ballot-label"]

[section.line.visual]
kind = "page"
source = "ballot-label"
highlight = ["1¢ sales tax"]
