# Archived sources for City of Highland Measure E, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1). The guide's pages are cut from the San
# Bernardino County Registrar of Voters' comprehensive Voter Information
# Guide (VIG.pdf, PDF pages 191-196); "page" is the guide's printed
# footer number (SB COMPREHENSIVE-189 is PDF page 191).
#
# The guide prints no ballot question; the card quotes it from the City
# Council's resolution placing the measure.

[contest]
id = "ca-2026-11-03-highland-measure-e"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:highland"
kind = "measure"
title = "City of Highland Measure E: One-Cent General Sales Tax"

