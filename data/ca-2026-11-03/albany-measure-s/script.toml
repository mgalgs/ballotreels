# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks; the transfer tax today and where its money goes; what would
# change (five rates by sale price, when they start) and what it needs to
# pass; the impartial analysis's revenue estimate; one line per side;
# what a vote does.
#
# The guide prints no fiscal analysis or tax rate statement; the one
# revenue estimate is the City Attorney's, in the ballot question and the
# Impartial Analysis. No archived source states Albany's General Fund
# budget, so the $1,000,000 has no scale (STANDARD.md 6.5; left open; the
# rebuttal to the argument against gives a budget figure, but an
# argument is not a source for the scale). The page prints no subject
# heading over the ballot question, so the card's title is the page's
# own head, the city's name.
#
# The chart's percentiles are the Impartial Analysis's as printed; the
# guide's text layer drops the digits of all but "75th", so they were
# read from the page. The analysis's "yes" and "no" sentences are set
# half in a shifted font and cannot be quoted, so the card has no yes
# and no boxes, and the two vote lines take their meaning from the
# ballot question's own words, highlighting the same phrase, as Los
# Angeles County Measure E's do.
#
# The guide prints an argument on each side and a rebuttal to each. Each
# side's line takes its own argument's lead points, not the rebuttals'.

contest = "ca-2026-11-03-albany-measure-s"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide-page"
number = "S"
title = "CITY OF ALBANY"
origin = "Measure “S” was placed on the ballot by the Albany City Council on July 20, 2026"
summary = "To support City of Albany general services, with funding that cannot be taken by Sacramento, including: street and park maintenance, recreation, public safety, and environmental programs, shall a measure adjusting the City’s real property transfer tax rate from $15.00 to between $10.00 and $30.00 per $1,000 purchased, depending upon the property’s purchase price, providing an additional $1,000,000 annually, until ended by voters, with all funds remaining local be adopted?"

[[section]]
id = "what"
heading = "Measure S"

[[section.line]]
text = "City of Albany Measure S asks Albany voters whether to change the tax paid when property is sold, so the rate depends on the price."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["depending upon the property’s purchase price"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Since 2020, Albany has taxed property sales at a single rate of 1.5 percent of the price, or $15 for each $1,000."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "down-payment"

[[section.line]]
text = "The money goes to the General Fund and may pay for any city expense."
sources = ["guide-page"]

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "Measure S would set five rates, from 1 percent for the lowest-priced quarter of sales to 3 percent for the top tenth."
sources = ["guide-page"]

[section.line.visual]
kind = "bars"
title = "Rate by sale price, against the last 12 months of sales"
source = "guide-page"
unit = "%"
labels = ["Below 25th percentile", "25th to 50th", "50th to 75th", "75th to 90th", "90th and up"]
values = [1.0, 1.5, 2.0, 2.5, 3.0]

[[section.line]]
text = "The new rates would start in 2027, and Measure S needs a majority of Albany voters to pass."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "ballot-box"

[[section]]
id = "fiscal"
heading = "What the impartial analysis says"

[[section.line]]
text = "The City Attorney's analysis estimates the new rates would raise an additional $1,000,000 a year."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Measure S keeps funding city services, cutting the rate on the lowest-priced quarter of sales and raising it above the median."
sources = ["arguments"]
basis = ["Measure S ensures we continue funding these services by adjusting the transfer tax when properties sell.", "Measure S cuts the rate for properties in the lowest quarter by value while raising it for properties that sell for more than the median."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Keeps funding city services", "Lower rate for lower-priced sales"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say Measure S adds thousands of dollars to the cost of buying or selling a home, making Albany even less affordable."
sources = ["arguments"]
basis = ["Measure S increases the cost of buying and selling property, making Albany even less affordable.", "Add thousands of dollars to the cost of buying or selling a home"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Adds thousands to a home sale", "Makes Albany less affordable"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote adopts the five rates, from $10 to $30 for each $1,000 of the price."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["from $15.00 to between $10.00 and $30.00 per $1,000 purchased"]

[[section.line]]
text = "A no vote keeps today's single rate of $15 for each $1,000 of the price."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["from $15.00 to between $10.00 and $30.00 per $1,000 purchased"]
