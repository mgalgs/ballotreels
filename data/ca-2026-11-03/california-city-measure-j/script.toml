# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; the tax today and who collects it; what would
# change (the rate, a general tax, the vote it needs); the impartial
# analysis's revenue estimate and the question's duration; one line per
# side; what a vote does.
#
# No place name is narrated (the narrator mispronounces them, and this
# city's name is a phrase the narration would read as words): the opening
# says "the voters of this city". The card and title carry the name.
#
# The card quotes the ballot question from the City Council's resolution,
# which prints no yes and no sentences, so the vote lines take their
# meaning from the impartial analysis's own "yes" and "no" sentences and
# both highlight the question's rates.
#
# The revenue ($75,000 a year) is the City's, and no archived source
# states the City's general fund budget, so it has no scale (STANDARD.md
# 6.5; left open).
#
# The supporters cite the rate unchanged since 2006, visitors' share of
# the cost of services, that residents do not pay unless they stay in local
# lodging, and that the money stays local. The neutral sections say who
# collects the tax and what the money may be used for, as the impartial
# analysis says it, and leave who does not pay and the rate's history out
# (STANDARD.md 6.3).
#
# The county posts no argument against Measure J, but no official document
# says in words that none was filed. So the no side does not say none was
# filed: it says none is among the documents the county has posted
# (filed = false, STANDARD.md 2.5), as for Livingston Measures T and U.

contest = "ca-2026-11-03-california-city-measure-j"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "J"
title = "RESOLUTION NO. 26-3253"
origin = "A RESOLUTION OF THE CITY COUNCIL OF THE CITY OF CALIFORNIA CITY, CALIFORNIA"
summary = "Shall an ordinance be adopted to amend the transient occupancy tax provisions of the California City Municipal Code to increase the tax imposed on transient occupants of hotels from 6% to 10% of the rent charged by the hotel operator, estimated to generate $75,000 annually, the revenues of which shall be used for general government operations, in perpetuity, be adopted?"

[[section]]
id = "what"
heading = "Measure J"

[[section.line]]
text = "Measure J asks the voters of this city whether to raise the tax on hotel stays from 6 percent to 10 percent."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["from 6% to 10% of the rent charged by the hotel operator"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "today-rate"
text = "Today the city charges a tax of 6 percent of the rent for a room in a hotel or other lodging."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "hotel-front-desk"

[[section.line]]
id = "who-collects"
text = "The hotel operator collects the tax from guests and sends it to the city."
sources = ["impartial-analysis"]

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "new-rate"
text = "Measure J would raise the rate by 4 percentage points, to 10 percent."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "bars"
title = "Hotel room tax, percent of the rent"
source = "impartial-analysis"
unit = "%"
labels = ["Today", "Measure J"]
values = [6, 10]

[[section.line]]
id = "general-tax"
text = "The increase is a general tax, so the city could spend the money on any general government purpose."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "city-council-chamber"

[[section.line]]
id = "threshold"
text = "Measure J needs a simple majority of the vote to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "fiscal"
heading = "What the analysis says"

[[section.line]]
id = "revenue"
text = "The city attorney's impartial analysis estimates the increase would raise about $75,000 a year."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section.line]]
id = "duration"
text = "The ballot question says the higher tax would continue in perpetuity."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["in perpetuity"]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say the rate has stayed at 6 percent since 2006, and visitors should help pay for the services they use."
sources = ["argument-for"]
basis = ["California City's Transient Occupancy Tax rate has remained at 6% since 2006", "A YES vote on Measure J will allow visitors to California City to contribute a greater share toward the cost of the public services they use while visiting our community."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Rate unchanged at 6 percent since 2006", "Visitors share the cost of services"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure J appears among the official documents gathered for this video; only the argument in favor does."
sources = ["measure-list"]

[section.line.visual]
kind = "list"
source = "measure-list"
items = ["No argument against was found"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote would allow the city to set the hotel tax at 10 percent."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["from 6% to 10% of the rent charged by the hotel operator"]

[[section.line]]
text = "A no vote would keep the hotel tax at 6 percent."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["from 6% to 10% of the rent charged by the hotel operator"]

[[question]]
ask = "Who pays this tax?"
lines = ["today-rate", "who-collects"]

[[question]]
ask = "What could the city spend the money on?"
lines = ["general-tax"]

[[question]]
ask = "How much money would it raise, and for how long?"
lines = ["revenue", "duration"]

[[question]]
ask = "What vote does the measure need to pass?"
lines = ["threshold"]

[[question]]
ask = "How large is the new revenue next to the city's budget?"
unanswered = true
