# Archived sources for Gilroy Unified School District Measure M, 2026-11-03
# general election (sources/sources.md, sources/rov-sources.md). Every id
# here may be cited by script.toml. `kind` must be one the standard
# allows (docs/STANDARD.md, section 1).
#
# The County of Santa Clara Registrar of Voters posts each local measure's
# letter, ballot question and vote threshold on its "List of Local
# Measures" page, with its impartial analysis, arguments and rebuttals as
# separate scans. The card quotes the ballot question from that page.
# County Counsel's impartial analysis is the measure's neutral
# explanation, the kind a state's attorney general's explanatory
# statement is. The full text and the tax rate statement come from the
# county voter guide's page proof that the district posts (the ROV posts
# neither); the tax rate statement is the measure's fiscal statement.
#
# The ROV's PDFs are scans with no text layer. The passages cited were
# typed from the page images into sources/rov-*-transcription.txt, each
# naming the PDF and URL it copies; those sources point at the
# transcription, and their url at the scan. The file the ROV names
# "rebuttal-to-in-favor-position" is the opponents' rebuttal; the one
# named "rebuttal-to-opposition" is the proponents' (its form ticks
# "Rebuttal to the Argument Against / Proponent").

[contest]
id = "ca-2026-11-03-gilroy-unified-measure-m"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/school_district:gilroy_unified_school_district"
kind = "measure"
title = "Gilroy Unified School District Measure M: $295 Million School Facilities Bond"

