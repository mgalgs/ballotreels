# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; how a school bond is repaid and what it needs
# to pass; what the money may pay for; the district's tax statement; one
# line per side; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the opening
# says "the voters of this school district". The card and title carry the
# names. "Counsel" is heard as "Council" (standard/speakability.txt), so
# the narration does not say it.
#
# The card quotes the Registrar of Voters' List of Local Measures, which
# prints the ballot question with no yes and no sentences, so the card has
# no boxes and the vote lines take their meaning from the impartial
# analysis. The bond total and the debt service are repaid from a tax on
# property in the district, not from the district's budget, and no
# archived source states that budget, so they have no budget scale
# (STANDARD.md 6.5; left open), as other school bonds' do. The tax
# statement's average ($59.14) and highest ($60.00) rates are both said.
#
# The supporters cite old classrooms, leaky roofs, plumbing, fire alarms and cameras, the
# oversight committee's audits and the ban on salaries, so the neutral
# sections leave those out (STANDARD.md 6.3) and describe the projects by
# the impartial analysis's other items. The opponents' own interest
# estimate ($447 million total in the argument, $560.5 million in the
# rebuttal) is theirs and is not narrated; the fiscal section gives the
# tax statement's figure.

contest = "ca-2026-11-03-gilroy-unified-measure-m"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "measure-list"
number = "M"
title = "School Bonds"
origin = "Gilroy Unified School District"
summary = "To improve the quality of education; construct, upgrade, and modernize classrooms, restrooms, and school facilities; make safety and security improvements; renovate or construct career technical education classrooms; and replace leaky roofs; shall Gilroy Unified School District's measure authorizing $295,000,000 in bonds, at legal rates, and levying approximately $59 per $100,000 of assessed value (raising $18,300,000 annually) while bonds are outstanding, be adopted, with annual audits, independent oversight, NO money for teacher/administrator salaries and all money spent locally?"

[[section]]
id = "what"
heading = "Measure M"

[[section.line]]
text = "Measure M asks the voters of this school district whether to approve $295 million in school bonds."
sources = ["measure-list", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "measure-list"
highlight = ["authorizing $295,000,000 in bonds"]

[[section]]
id = "today"
heading = "How a school bond works"

[[section.line]]
text = "The district would borrow the money and repay it from a tax on property in the district."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "bond-certificates"

[[section.line]]
text = "Measure M needs 55 percent of the vote to pass."
sources = ["impartial-analysis", "measure-list"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "State law lets school bonds pay only for building, repairing and equipping schools, or for land."
sources = ["impartial-analysis"]

[[section.line]]
text = "The listed projects include replacing portable classrooms with permanent ones, and modernizing classrooms, restrooms, libraries and playfields."
sources = ["impartial-analysis", "text"]

[section.line.visual]
kind = "illustration"
name = "school-classroom"

[[section]]
id = "fiscal"
heading = "What the tax statement says"

[[section.line]]
text = "The district's tax statement estimates an average tax of $59.14 per $100,000 of assessed value, and at most $60, through 2059-2060."
sources = ["tax-statement"]

[section.line.visual]
kind = "bars"
title = "Estimated tax per $100,000 of assessed value, dollars"
source = "tax-statement"
unit = ""
labels = ["Average", "Highest"]
values = [59.14, 60]

[[section.line]]
text = "The statement estimates the total to repay, with interest, at about $623.3 million."
sources = ["tax-statement"]

[section.line.visual]
kind = "illustration"
name = "debt-payments"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Measure M would fix old classrooms, plumbing and safety systems, and a citizens' committee would audit all of the spending each year."
sources = ["argument-for", "rebuttal-for"]
basis = ["Measure M upgrades and renovates old and inadequate classrooms", "Upgrading or replacing deteriorating plumbing and sewer systems", "Making safety improvements including fire alarms and security cameras", "spending must be reviewed and annually audited by an independent citizens' oversight committee."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Fixes classrooms, plumbing and safety", "Citizens' committee audits spending yearly"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say Measure M means about 30 years of taxes to repay the debt, while most students are behind grade level in English and math."
sources = ["argument-against", "rebuttal-against"]
basis = ["That's an IOU to Wall Street bankers that you'd have to repay—through your taxes—for around 30 YEARS.", "Percentage of students behind grade level in English = 59.77%", "Percentage behind grade level in math = 67.58%"]

[section.line.visual]
kind = "list"
source = "argument-against"
items = ["About 30 years of taxes to repay debt", "Most students behind in English and math"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote authorizes the district to issue and sell up to $295 million in bonds for school facilities."
sources = ["impartial-analysis", "measure-list"]

[section.line.visual]
kind = "page"
source = "measure-list"
highlight = ["authorizing $295,000,000 in bonds"]

[[section.line]]
text = "A no vote does not authorize the district to issue and sell the bonds."
sources = ["impartial-analysis", "measure-list"]

[section.line.visual]
kind = "page"
source = "measure-list"
highlight = ["be adopted"]
