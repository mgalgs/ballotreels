# Archived sources for Rio Elementary School District Measure B,
# 2026-11-03 general election (sources/sources.md). Every id here may be
# cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# The division is the district's Census school district,
# school_district:rio_elementary_school_district (divisions.tsv). The
# County of Ventura Board of Supervisors' August 4, 2026 consent item 12
# (the board letter, its Exhibit 1 listing "RIO ELEMENTARY SCHOOL
# DISTRICT" among the six local measures, and the minute order recording
# its approval) is the record that the measure is on the county's
# November 3, 2026 ballot; it gives no letters. Ventura County's measures
# page and voter guide could not be read (a bot challenge), so the letter
# B comes from the District's own Measure B page, and no impartial
# analysis, argument or rebuttal was reached; no document says whether
# any argument was filed.
#
# The District's Resolution No. 2526/20 ordering the election is a scan
# with no text layer, archived as the pages of the June 24, 2026 board
# packet that hold it (item 9.1). The pages cited were typed from the
# page images into
# sources/rio-2026-06-24-packet-resolution-2526-20-transcription.txt,
# which names the scan and its URL. The packet copy is unsigned (its
# adoption date and vote lines are blank, as are the tax rate
# statement's date and signature), so it is cited as the packet copy,
# and the fact and date of adoption come from the minutes of the June 24,
# 2026 meeting (also a scan, transcribed beside it). The minutes' item
# title says "November 2, 2026"; the resolution says November 3, which
# the script follows. Exhibit B is the ballot question the card quotes;
# Exhibit A is the full text with the project list and the
# accountability provisions; Exhibit C is the tax rate statement, the
# measure's fiscal statement.
#
# Exhibit A's statements of the measure's goal and of need are the
# District's: the script uses only what Exhibit A enacts (what the money
# may and may not pay for, how it is to be shared among schools, the
# oversight and audits). The District's Measure B page is cited only for
# the letter.

