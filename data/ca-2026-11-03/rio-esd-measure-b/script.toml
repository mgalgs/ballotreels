# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; who placed it, how it reached the
# ballot and the vote it needs; what the money would pay for, how it is
# shared among schools, what it could not pay for, and who would check
# the spending; the tax rate statement's estimates; both sides, neither
# of which has an archived argument; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this school district". The card and the
# title carry the names.
#
# The card quotes Exhibit B of the District's Resolution No. 2526/20, the
# ballot question, from the transcription of the June 24, 2026 packet
# copy (sources.toml). That copy is unsigned; the minutes of June 24,
# 2026 record the resolution's adoption, and the script dates the order
# from them. The ballot's "YES" and "NO" are its choices, not yes/no
# sentences, so the card has no boxes and the vote lines take their
# meaning from the question.
#
# What the money pays for is the question's own list and Exhibit A's
# project list, as enacted, with Exhibit A's rule that every school gets
# some money and older, unimproved schools get priority; Exhibit A's
# statements of the measure's goal and of need (and the resolution's
# recitals) are the District's and are not used. The figures are the tax
# rate statement's, attributed to it. No archived source states the
# district's budget, so the $78 million and the $158,188,000 to repay
# have no scale (STANDARD.md 6.5; left open), as for the other school
# bonds; the tax per $100,000 of assessed value is a per-property
# amount, exempt.
#
# No argument for or against Measure B was archived, and no document
# says whether any was filed, so each side says none is among the
# documents gathered (filed = false, STANDARD.md 2.5), as for Walnut
# Creek Measure U.

contest = "ca-2026-11-03-rio-esd-measure-b"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "B"
title = "RESOLUTION NO. 2526/20"
origin = "Board of Trustees of the Rio Elementary School District"
summary = "To improve the quality of education and provide facility equity at all schools; make safety/ security improvements; upgrade/ modernize classrooms, restrooms and school facilities; replace leaky roofs; construct libraries and classrooms; and renovate plumbing and electrical systems, shall Rio Elementary School District's measure authorizing $78,000,000 of bonds with legal rates, raising on average $4,500,000 annually, at approximately $28.21 per $100,000 assessed value be adopted, with annual audits, independent oversight, NO money for salaries, and all funds staying local?"

