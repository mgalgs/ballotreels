# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; today's tax, who placed the
# measure; the vote it needs; what would change (the new tax, how it may
# change, what it pays for, how long it lasts, what happens if it
# fails); the impartial analysis's revenue estimate; one line per side;
# what a vote does.
#
# An argument in favor was printed; no argument against was ("NO
# ARGUMENTS AGAINST THIS MEASURE WERE SUBMITTED"), so the no side says
# so, filed = false (STANDARD.md 2.5), citing the pamphlet page that
# prints the notice. The supporters' figures (paving costs per foot, the
# next project's dates and costs) are theirs, so they stay in their
# section or out (STANDARD.md 6.3); the yes line gives none of them, to
# keep the two sides' spoken length even.
#
# The pamphlet prints no tax rate statement; the revenue estimate is in
# the ballot question and County Counsel's impartial analysis, which the
# fiscal line names as the county attorney's ("Counsel" is heard as
# "Council", standard/speakability.txt). The money is the district's own
# road revenue, and no archived source states a budget it would be part
# of, so it has no scale (STANDARD.md 6.5; left open). The per-parcel
# amounts are exempt. The ballot question and the analysis tie the
# yearly adjustment to a construction cost index and state no cap, so
# the script states none.

contest = "ca-2026-11-03-golden-west-measure-r"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide-page"
number = "R"
title = "IMPARTIAL ANALYSIS OF MEASURE R"
origin = "This Measure was placed on the ballot by the Board of Directors of the District"
summary = "Shall the measure to enact an annual Special Tax in the amount of $300.00, adjusted annually per the Engineering News Record Construction Cost Index, on each parcel of land within the Golden West Community Services District, commencing fiscal year 2027-2028 and continuing for an unlimited duration, to be used only for road maintenance and improvements and generating an annual revenue of approximately $135,300.00, to replace the current Special Tax of $120.00, be adopted?"
yes = "A “YES” vote is a vote to authorize the levy of the increased annual special tax in an amount of $300 per parcel, as provided in the Measure."
no = "A “NO” vote is a vote against the levy of the increased annual special tax."

[[section]]
id = "what"
heading = "Measure R"

[[section.line]]
text = "Measure R asks the voters of this community services district whether to raise its yearly road tax from $120 to $300 per parcel."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["an annual Special Tax in the amount of"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Voters in the district approved today's $120 road tax in 1984, and the tax has not been raised since."
sources = ["resolution"]

[section.line.visual]
kind = "illustration"
name = "country-road"

[[section.line]]
text = "The district's board of directors placed Measure R on the ballot."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "ballot-box"

[[section.line]]
text = "Measure R needs two-thirds of the vote to pass."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "The new tax would apply to each parcel in the district, starting in the 2027-2028 fiscal year."
sources = ["guide-page"]

[section.line.visual]
kind = "bars"
title = "Yearly road tax per parcel, in dollars"
source = "guide-page"
unit = ""
labels = ["Today", "Under Measure R"]
values = [120, 300]

[[section.line]]
text = "The tax could be adjusted each year with a construction cost index."
sources = ["guide-page"]

[[section.line]]
id = "use"
text = "The money could pay only for road improvements and maintenance, and the tax would last until voters change or repeal it."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "special-tax"

[[section.line]]
text = "If Measure R fails, the $120 tax stays."
sources = ["guide-page"]

[[section]]
id = "fiscal"
heading = "What the impartial analysis says"

[[section.line]]
text = "The county attorney's impartial analysis expects the tax to raise about $135,300 a year."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say repaving costs have climbed fast, and the higher tax would finish the next big project sooner, for less."
sources = ["argument-for"]
basis = ["Our 2020 asphalt re-paving project cost $35 per foot of roadway.", "Today, the cost is $94 per foot.", "If costs and revenues continue on their present trajectories, our next major project – resurfacing District roads on the east side of Highway 49 – is project to be completed in 2042 at a cost of $2.5 million.", "If this Measure passes, completion advances to 2035 at a cost of $1.7 million."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Repaving costs up since 2020", "Next project sooner, for less"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure R was submitted, the voter pamphlet of this county says, and it prints no rebuttals."
sources = ["guide-page"]

[section.line.visual]
kind = "list"
source = "guide-page"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote authorizes the increased tax of $300 per parcel a year."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["a vote to authorize the levy"]

[[section.line]]
text = "A no vote is against the increased tax, and the $120 tax stays."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["a vote against the levy"]

[[question]]
ask = "What can the money be spent on?"
lines = ["use"]

[[question]]
ask = "Where is the district, and how many parcels are in it?"
unanswered = true

[[question]]
ask = "How big is $135,300 a year next to what the district spends on its roads?"
unanswered = true
