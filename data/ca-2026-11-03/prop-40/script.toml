# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about (a one-time tax on billionaires); who would pay it; how
# income is taxed today; how much, and where the money would go; the analyst's
# view of both the revenue it raises and the income tax it may cost; one
# point per side; what a vote does. The school-funding and spending-limit
# exemptions and the retirement-account rules are left to the sides:
# opponents argue from them (rule 6.3); the card shows the exemptions.

contest = "ca-2026-11-03-prop-40"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "quick-reference"
number = "40"
title = "IMPOSES ONE-TIME TAX ON CERTAIN TAXPAYERS. INITIATIVE CONSTITUTIONAL AMENDMENT AND STATUTE."
origin = "Put on the Ballot by Petition Signatures"
summary = "Imposes 5% tax on certain taxpayers with assets over $1 billion; revenue primarily for health care. Exempts revenues from constitutional requirements for school funding and spending limit. Fiscal Impact: Temporary revenue increase of tens of billions of dollars spread over several years from wealth tax on billionaires. Possible ongoing decrease of less than $1 billion per year in income tax revenue from billionaires."
yes = "A YES vote on this measure means: The state would collect a one-time tax from billionaires equal to 5 percent of their wealth."
no = "A NO vote on this measure means: The state would not collect a one-time tax from billionaires equal to 5 percent of their wealth."

[[section]]
id = "what"
heading = "Proposition 40"

[[section.line]]
text = "Proposition 40 is about a one-time tax on billionaires."
sources = ["quick-reference"]

[section.line.visual]
kind = "page"
source = "quick-reference"
highlight = ["wealth tax on billionaires"]

[[section]]
id = "background"
heading = "California's billionaires"

[[section.line]]
