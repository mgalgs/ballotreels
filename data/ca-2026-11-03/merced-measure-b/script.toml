# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; what the ballot question names
# the money for, and that it is a general tax needing a simple majority;
# what would change (the rate, collected by the state, how long it
# lasts, the oversight the question lists, what the council could amend);
# the revenue as the ballot question gives it; both sides, neither of
# which has an archived argument; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". The card and title carry it.
#
# The card quotes the ballot question from draft Resolution 2026-52, the
# agenda-packet copy, which sets it out with blank YES and NO boxes and
# no yes/no lines. So the card has no YES/NO boxes, and both vote lines
# highlight the same phrase of the question. The copy is unsigned and
# Legistar records no vote, so the script does not say the Council
# placed it or by what vote. Its origin line is the resolution's own
# opening words.
#
# The services the ballot question names are said as the question's
# words, and set beside the resolution's "general tax" (STANDARD.md
# 6.2). The ordinance itself has no oversight or audit sections; those
# are said as the ballot question's.
#
# No impartial analysis, argument or rebuttal was archived: the county
# guide could not be fetched (sources/sources.md), and it is not known
# whether any was filed. So the sides do not say none was filed: each
# says none is among the documents gathered (filed = false, STANDARD.md
# 2.5), as for St. Helena Measure S.
#
# No tax rate statement applies; the $18 million a year is the ballot
# question's figure. The only archived total is a staff forecast chart
# attached to the agenda, not an adopted budget or a fiscal statement,
# so the figure has no scale (STANDARD.md 6.5; left open, under
# [[question]]).

contest = "ca-2026-11-03-merced-measure-b"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "B"
title = "City of Merced Vital Services Protection Measure"
origin = "A RESOLUTION OF THE CITY COUNCIL OF THE CITY OF MERCED, CALIFORNIA"
summary = "Shall the measure to maintain local quality of life/ general city services, such as 911 police/ emergency medical/ natural disaster response; responding quickly to neighborhood fires/ retaining firefighters; gang prevention; addressing homelessness; fixing roads/potholes; and keeping parks safe/clean, by establishing a 1¢ sales tax, providing approximately $18,000,000 annually until ended by voters, with public disclosure, independent audits, citizen oversight, and all funds for Merced, be adopted?"

