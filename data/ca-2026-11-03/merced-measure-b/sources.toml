# Archived sources for City of Merced Measure B, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The Merced County voter guide and the City's own election pages could
# not be fetched (both blocked), so no impartial analysis, argument or
# rebuttal was archived, and it is not known whether any was filed. The
# ballot question and the ordinance's full text are quoted from the
# City Council's August 3, 2026 agenda packet: draft Resolution 2026-52
# with its Exhibit A. That copy is unsigned, with its number, date and
# vote blank; Legistar records no action on it. The letter "B" is not
# printed in any archived official record.
#
# The PDF is a scan with no text layer. The passages cited were typed
# from the page images into sources/*-transcription.txt, each naming the
# PDF and URL it copies; both sources point at a transcription, and
# their url at the scan (as Coalinga Measure J's do). No tax rate
# statement applies (a sales tax); the one revenue figure is the ballot
# question's.

[contest]
id = "ca-2026-11-03-merced-measure-b"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:merced"
kind = "measure"
title = "City of Merced Measure B: Vital Services Protection Sales Tax"

[[source]]
id = "ballot-question"
kind = "official-title-summary"
