# Archived sources for City of Merced Measure B, 2026-11-03 general
# election (sources/county-sources.md, sources/sources.md). Every id here
# may be cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# Merced County Elections (the Registrar of Voters) posts each measure's
# filed documents on its "November 3, 2026, General Election" page, one
# PDF each, all text: the ballot question, the full text of the
# ordinance, the City Attorney's impartial analysis, and the arguments
# for and against. These supersede the City's agenda-packet copies
# archived earlier (an unsigned draft resolution and a presentation),
# which are not cited. The City Attorney's impartial analysis is the
# measure's neutral explanation, the kind a state's attorney general's
# explanatory statement is. No tax rate statement or fiscal analysis
# applies (a general sales tax); the one revenue estimate is the City's,
# as the analysis gives it. The county's List of Ballot Measures shows no
# rebuttal filed, and none is posted.

[contest]
id = "ca-2026-11-03-merced-measure-b"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:merced"
kind = "measure"
title = "City of Merced Measure B: A 1¢ Sales Tax Until Ended by Voters"

[[source]]
id = "ballot-question"
kind = "official-title-summary"
publisher = "Merced County Elections, Measure B, ballot question, November 3, 2026, General Election"
