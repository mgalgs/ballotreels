# Archived sources for City of Grover Beach Initiative Measure F,
# 2026-11-03 general election (sources/sources.md). Every id here may be
# cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# The San Luis Obispo County Clerk-Recorder prints each ballot type's
# County Voter Information Guide as one PDF; pages 32 to 37 of Ballot
# Type 38 (the measure's full text, the City Attorney's impartial
# analysis, the arguments for and against, and a rebuttal to each) were
# cut into one excerpt. The guide does not print the ballot question;
# the City Council's Resolution No. 26-20, which submits the citizens'
# initiative to the voters, prints it in Section 1. The resolution is a
# scan with a text layer. The impartial analysis is the measure's
# neutral explanation. No tax rate statement or fiscal
# statement applies. The ballot labels the measure "Initiative Measure
# F-26"; the project names it by its bare letter.

