id = "ca-2026-11-03-grover-beach-measure-f"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:grover_beach"
kind = "measure"
title = "Grover Beach Measure F: Building Height Limits and Mixed-Use Commercial Space"

