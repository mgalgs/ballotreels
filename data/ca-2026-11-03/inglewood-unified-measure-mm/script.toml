# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; who placed it and the vote it needs; what
# the money may and may not pay for; the tax rate statement's estimates,
# with its own caveat; one line per side; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the opening
# says "the voters of this school district". The card and title carry the
# names. "Counsel" is heard as "Council" (standard/speakability.txt), so
# the narration says "the impartial analysis". The last fiscal year is
# said with both years in full.
#
# The card quotes the ballot question, which has no yes and no
# sentences, so the card has no boxes and the two vote lines highlight
# the same phrase of the question.
#
# The tax rate statement's average and highest rates are both $60 per
# $100,000 of assessed value; the script gives both, the total debt
# service, and the statement's own caveat on its estimates. The bonds are
# repaid from a tax on property in the district, not from the district's
# budget, and no archived source states that budget, so the figures have
# no budget scale (STANDARD.md 6.5; left open), as other school bonds' do.
#
# The staged excerpt of the Registrar's list reads "$ I 00,000" in the
# ballot question, a text-extraction slip. The card quotes the same
# question from the Registrar's full text of the measure, which prints it
# at its head, word for word, with "$100,000"; its heading line, not the
# list's vote line, is the card's origin.
#
# The argument in favor is the Registrar's printed copy. The list says
# "Opponents: None submitted.", so the no side says plainly that no
# argument against was submitted, citing the list (filed = false). Its
# clause on what the list records balances the yes line's length without
# a further claim.

contest = "ca-2026-11-03-inglewood-unified-measure-mm"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "MM"
title = "INGLEWOOD UNIFIED SCHOOL DISTRICT"
origin = "FULL TEXT OF BALLOT MEASURE MM"
summary = "Inglewood Unified School District Safety, Repair, Upgrade Measure. To repair/upgrade classrooms/labs including science, engineering, career/skilled trades to help recruit/retain teachers; repair deteriorating gas lines; remove asbestos, lead paint, mold; provide safe drinking water; construct, repair equip sites, facilities; shall Inglewood Unified School District's measure authorizing $396,000,000 in bonds, at legal rates, levying $60 per $100,000 of assessed valuation ($26,000,000 annually) while bonds are outstanding, be adopted, requiring oversight, audits, spending disclosure, all funds for local schools?"

[[section]]
id = "what"
heading = "Measure MM"

[[section.line]]
text = "Measure MM asks the voters of this school district whether to approve $396 million in school bonds."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["authorizing $396,000,000 in bonds"]

[[section]]
id = "today"
heading = "How it reached the ballot"

[[section.line]]
id = "threshold"
text = "The district's governing board placed Measure MM on the ballot, and it needs 55 percent of the vote to pass."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "projects"
text = "The bond money could pay to upgrade classrooms and labs, repair gas lines, remove asbestos, lead paint and mold, and provide safe drinking water."
sources = ["ballot-question", "impartial-analysis", "text"]

[section.line.visual]
kind = "illustration"
name = "school-roof-repair"

[[section.line]]
id = "limits"
text = "The money could not pay teacher or administrator salaries, and a citizens' oversight committee and yearly audits would be required."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "inspection-clipboard"

[[section]]
id = "fiscal"
heading = "What the tax rate statement says"

[[section.line]]
id = "rate"
text = "The district's tax rate statement estimates an average and a highest tax of $60 per $100,000 of assessed value, through 2057-2058."
sources = ["tax-statement"]

[section.line.visual]
kind = "bars"
title = "Estimated tax per $100,000 of assessed value, dollars"
source = "tax-statement"
unit = ""
labels = ["Average", "Highest"]
values = [60, 60]

[[section.line]]
id = "total"
text = "The statement puts the total to repay, with interest, at about $813 million, and says its figures are estimates only, which may vary."
sources = ["tax-statement"]

[section.line.visual]
kind = "illustration"
name = "debt-payments"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say many schools built in the 1920s and 1930s are in dire need of repairs, and the state cannot take the funding."
sources = ["argument-for"]
basis = ["Others, including many built in the 1920s and 30's, are in dire need of repairs and upgrades.", "The State CANNOT take this funding away."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Many old schools need repairs", "State cannot take the funds"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "The official list of measures from the county, which names who filed each argument, says no argument against Measure MM was submitted."
sources = ["measure-list"]

[section.line.visual]
kind = "list"
source = "measure-list"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote approves the $396 million in school bonds."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["authorizing $396,000,000 in bonds"]

[[section.line]]
text = "A no vote rejects the $396 million in school bonds."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["authorizing $396,000,000 in bonds"]

[[question]]
ask = "How much tax would I pay, and for how long?"
lines = ["rate"]

[[question]]
ask = "What could the money be spent on?"
lines = ["projects", "limits"]

[[question]]
ask = "What vote does the measure need to pass?"
lines = ["threshold"]

[[question]]
ask = "What would the bonds cost in all?"
lines = ["total"]

[[question]]
ask = "How large is the bond next to the district's yearly budget?"
unanswered = true
