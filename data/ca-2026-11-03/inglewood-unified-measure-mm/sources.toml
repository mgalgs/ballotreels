# Archived sources for Inglewood Unified School District Measure MM, 2026-11-03
# general election (sources/la-sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The Los Angeles County Registrar-Recorder/County Clerk's list "Measures
# Appearing on the Ballot" prints the measure's letter, vote threshold and
# ballot question, and says in words who filed the primary arguments
# ("Supporters: ... Opponents: None submitted."). The no side cites it as
# the Registrar's statement of filing (measure-list). Its staged excerpt
# reads "$ I 00,000" in the ballot question, a text-extraction slip, so
# the card quotes the same question from the Registrar's full text of the
# measure, which prints it at its head with "$100,000" (ballot-question).
#
# The impartial analysis, the full text, the tax rate statement and the
# argument in favor are the Registrar's own copies from its Interactive
# Sample Ballot, saved as HTML (the contest data's URL is in each file).

[contest]
id = "ca-2026-11-03-inglewood-unified-measure-mm"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/school_district:inglewood_unified_school_district"
kind = "measure"
title = "Inglewood Unified School District Measure MM: $396 Million School Repair Bond"

[[source]]
id = "ballot-question"
kind = "official-title-summary"
publisher = "Los Angeles County Registrar-Recorder/County Clerk, Interactive Sample Ballot: Full Text of Ballot Measure MM, Inglewood Unified School District, the ballot question it prints at its head"
credit = "Full Text of Ballot Measure MM, Los Angeles County Registrar-Recorder/County Clerk"
url = "https://isb.lavote.gov/parsed/4348/contests/bmc10933.json"
file = "sources/full-text.html"
