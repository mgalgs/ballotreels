# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and whose measure it is; the tax hotel guests pay today, who placed
# Measure J on the ballot and the vote it needs; what would change (the
# rates by hotel size, what the tax is charged on, where the money goes);
# the impartial analysis's revenue estimate; one line per side; what a
# vote does.
#
# No argument against was submitted ("No argument against this measure
# was submitted."): the no side says so, filed = false (STANDARD.md 2.5),
# in as many words as the yes side. The guide prints no fiscal analysis
# or tax rate statement; the one estimate is the City's, as the City
# Attorney's Impartial Analysis reports it, which the fiscal line names.
# It is city revenue, and no archived source states the city's budget, so
# it has no scale (STANDARD.md 6.5; left open, under [[question]]).

contest = "ca-2026-11-03-orange-city-measure-j"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide-page"
number = "J"
title = "City of Orange, City of Orange Hotel Guest Tax Modification Measure"
origin = "The City Council of the City of Orange is submitting Measure J to the voters"
summary = "Shall the measure updating the City of Orange’s existing Transient Occupancy Tax, a tax on persons occupying hotel rooms by increasing the tax rate from 10% to 14% for hotels with 11 or more rooms and applying the tax to online and other travel companies, generating approximately $3,000,000 annually for general City purposes including police, fire and emergency response, parks, and street and infrastructure maintenance, until ended by voters, be adopted?"
yes = "A “Yes” vote on Measure J authorizes the City to amend the Transient Occupancy Tax by increasing the tax rate from 10 percent to 14 percent for hotels with eleven (11) or more accommodations, applying the tax online and other travel companies, and updating the tax to apply to the full amount charged to hotel guests, as provided in the ordinance."
no = "A “No” vote on Measure J does not authorize those changes to the City’s Transient Occupancy Tax."

[[section]]
id = "what"
heading = "Measure J"

[[section.line]]
text = "City of Orange Measure J asks city voters whether to raise the hotel tax from 10 to 14 percent at larger hotels."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
