# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks; the tax today (last updated in 1994, its cap); what would change
# (a tax on gross receipts, the small-business flat rate, the rates by
# kind of business and the new cap, when it starts); the impartial
# analysis's revenue estimate; one line per side; what a vote does.
#
# The card quotes the ballot question from the City Council's resolution
# (the guide prints none), which has no yes/no lines; the vote lines
# give the City Attorney's Impartial Analysis's meanings and both
# highlight the phrase of the question they turn on. "City's" is heard
# as "cities" (standard/speakability.txt), so the narration says neither.
#
# The analysis's $3.3 million a year has no scale: no archived source
# states the city's general fund budget (STANDARD.md 6.5; left open). The
# analysis's finding that the current structure taxes small businesses at
# a higher proportional rate is the supporters' point ("small businesses
# pay significantly higher rates"), so the neutral lines give only the
# cap it rests on (STANDARD.md 6.3). Sides come from the argument in
# favor and the argument against, not the rebuttals.

contest = "ca-2026-11-03-upland-measure-m"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-label"
number = "M"
title = "Upland Business License Reform Measure"
origin = "A RESOLUTION OF THE CITY COUNCIL OF THE CITY OF UPLAND, CALIFORNIA CALLING FOR THE PLACEMENT OF A GENERAL BUSINESS LICENSE TAX MEASURE"
summary = "To modernize City of Upland’s 31-year-old business license tax, with no tax increase to residents, lowering taxes on most small businesses, and ensuring large businesses pay their fair share for general city services such as: fixing potholes/streets; repairing infrastructure; and 9-1-1 response, shall the measure with rates between 0.065% and 0.2% of gross receipts, generating $3.3 million in local funds until ended by voters, and requiring independent audits, be adopted?"

[[section]]
id = "what"
heading = "Measure M"

[[section.line]]
text = "City of Upland Measure M asks Upland voters whether to change how the city taxes businesses."
sources = ["ballot-label"]

[section.line.visual]
kind = "page"
source = "ballot-label"
highlight = ["business license tax"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Upland last updated its business license tax in 1994."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "city-storefronts"

[[section.line]]
text = "Today the tax is capped at $864 for most businesses taking in over $1.4 million."
sources = ["impartial-analysis"]

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "Measure M would base the tax mainly on gross receipts."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "special-tax"

[[section.line]]
text = "Businesses taking in under $100,000 a year would pay a flat $75."
sources = ["impartial-analysis"]

[[section.line]]
text = "Above that, the rate would depend on the kind of business, with a cap of $28,000 a year."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "bars"
title = "Tax rate on gross receipts over $100,000"
source = "impartial-analysis"
unit = "%"
labels = ["Retail and commercial", "Contractors", "Rental", "General service", "Professional service"]
values = [0.065, 0.15, 0.2, 0.125, 0.125]

[[section.line]]
text = "The new rates would start in 2028 and last until voters end them."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "end-date"

[[section]]
id = "fiscal"
heading = "What it would raise"

[[section.line]]
text = "The city attorney's impartial analysis estimates $3.3 million a year, $2.1 million more than the current tax."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "set-aside-funds"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Measure M makes the largest businesses pay their share, and lowers taxes for most small businesses."
sources = ["arguments"]
basis = ["YES on M ensures the largest businesses step up and pay their fair share", "YES on M reduces taxes for a majority of small, mom and pop businesses"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Largest businesses step up and pay their share", "Lower taxes for most small businesses"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say Measure M triples the business tax, and that businesses will pass the cost on to consumers."
sources = ["arguments"]
basis = ["Outrageous bloated government bureaucracy doesn't justify tripling the business tax to $3.3 million annually!", "The proposed $3.3 million tax increase on businesses gross sales receipts will be passed onto we consumers."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Triples the business tax to $3.3 million", "The cost gets passed on to consumers"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote approves this change to the business license tax."
sources = ["impartial-analysis", "ballot-label"]

[section.line.visual]
kind = "page"
source = "ballot-label"
highlight = ["business license tax"]

[[section.line]]
text = "A no vote does not approve this change to the business license tax."
sources = ["impartial-analysis", "ballot-label"]

[section.line.visual]
kind = "page"
source = "ballot-label"
highlight = ["business license tax"]
