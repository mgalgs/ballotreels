# Archived sources for City of Redwood City Measure E, 2026-11-03
# general election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1). Each document is the copy the San Mateo
# County Assessor-County Clerk-Recorder & Elections (ACRE) posts on its
# election page; the county publishes each measure's documents
# separately, not as one pamphlet.
#
# The Council's resolution (PDF pages 1-5) has a clean text layer, so
# the two sources it backs cite the PDF itself: the ballot label the card
# quotes (Section 4, the ballot question) and the full text. Its Exhibit
# A, the initiative ordinance (PDF pages 6-51), is a scan and is not
# cited. The impartial analysis and the arguments are scans with no text
# layer, so each has a typed transcription beside it (sources/*.txt, its
# first lines saying which pages it copies), and `file` names the
# transcription; `url` is the PDF's.
#
# ACRE posts no tax rate statement or fiscal analysis (not a tax
# measure); the one cost estimate is the ballot question's. The Section
# 9212 report the Council requested is not among ACRE's files. Both
# rebuttals are archived and not cited.

[contest]
id = "ca-2026-11-03-redwood-city-measure-e"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:redwood_city"
kind = "measure"
title = "City of Redwood City Measure E: Rent Increase Limits and Just-Cause Eviction Protections"

[[source]]
id = "ballot-label"
kind = "official-title-summary"
publisher = "City of Redwood City, Resolution No. 16425, Section 4: the ballot question, filed with the San Mateo County elections office"
