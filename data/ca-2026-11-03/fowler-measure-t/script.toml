# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; why the council placed it (the
# county's Measure C transportation tax is set to expire); the city's
# own rate today; what would change (the new rate and when it starts,
# what is exempt, how long it lasts and when it would end sooner, the
# vote it needs); the revenue estimate as the
# impartial analysis gives it; one line per side; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city", and the county transportation
# tax is "Measure C", never its full name. The card and title carry it.
#
# No printed guide was found, so the card quotes the ballot question
# from Resolution No. 2854, Section 4, as typed from the scan. It prints
# no yes/no lines, so the card has no YES/NO boxes; the vote lines both
# highlight the same phrase of the question.
#
# How long it lasts: the ballot question says "until ended by voters";
# the ordinance (Section 3-11.16(a)) says thirty years unless voters
# extend it, and (c) ends it sooner once county voters approve a tax to
# succeed or replace Measure C, the State sets its start, and the
# council confirms by resolution that it is that successor. The
# narration gives both official wordings, side by side, and the early
# end, in one line. That the money goes to the general fund is left
# out for length; the opening's "for general city services" carries it. The opponents' "would never end" is theirs; their line distils
# the two points the rest of their argument makes (the burden, and
# voluntary giving first), so it does not set their words against the
# ordinance's.
#
# The council's reason (the resolution's synopsis: "to help offset the
# loss of Measure C funding") is the authors' purpose (STANDARD.md 6.2);
# no argument in favor was filed, so no side owns it. No archived
# source states the city's general fund budget, so the $300,000 a year
# has no scale (STANDARD.md 6.5; left open, under [[question]]).

contest = "ca-2026-11-03-fowler-measure-t"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "T"
title = "RESOLUTION NO. 2854"
origin = "A RESOLUTION OF THE CITY COUNCIL OF THE CITY OF FOWLER"
summary = "To fund general City services, such as local police, fire protection, emergency response, repair streets and roads, improve aging infrastructure, maintain parks and public facilities, and other general City services, shall the measure, establishing a one-half cent (½¢) transactions and use tax providing approximately $300,000.00 annually until ended by voters and public reporting consistent with State law as required, be adopted?"

