# Archived sources for City of Fowler Measure T, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The Fresno County Registrar of Voters posts each measure's filed
# documents on its election page; no printed Voter Information Guide
# was found online. The ballot question is quoted from City Council
# Resolution No. 2854, Section 4. The City Attorney's impartial
# analysis is the measure's neutral explanation, the kind a state's
# attorney general's explanatory statement is. No tax rate statement or
# fiscal analysis was filed; the one revenue estimate is the analysis's
# (and the ballot question's).
#
# Every PDF is a scan with no text layer. The passages cited were typed
# from the page images into sources/*-transcription.txt, each naming the
# PDF and URL it copies; those sources point at the transcription, and
# their url at the scan (as Firebaugh Measure F's do). No argument in
# favor and no rebuttals were filed (the Registrar's page lists none).
# The affidavit of publication is archived but not cited.

[contest]
id = "ca-2026-11-03-fowler-measure-t"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:fowler"
kind = "measure"
title = "City of Fowler Measure T: Half-Cent Sales Tax for General City Services"

[[source]]
id = "ballot-question"
kind = "official-title-summary"
