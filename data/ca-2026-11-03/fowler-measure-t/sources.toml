credit = "Resolution No. 2854, City of Fowler"
url = "https://www.fresnocountyca.gov/files/sharedassets/county/v/1/county-clerk-registrar-of-voters/1_election-pages/2026_3_nov_statewide-general/measures/fowler-parcel-tax/resolution_redacted.pdf"
