# Archived sources for City of Los Angeles Charter Amendment EE (scripted
# as Measure EE, the site's convention), 2026-11-03 general election
# (sources/sources.md). All four come from one cut of the City Clerk's
# Voter Information Pamphlet, edition 201: the PDF's pages 8 and 47 to 59,
# the pamphlet's printed pages 6 (Ballot Summary) and 45 to 57.
#
# The Chief Legislative Analyst's Impartial Summary is the measure's
# neutral explanation, and the City Administrative Officer's Financial
# Impact Statement its fiscal analysis. Both sides argued; a rebuttal to
# the argument against was filed, none to the argument in favor.

