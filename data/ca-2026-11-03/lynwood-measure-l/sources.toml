# Archived sources for City of Lynwood Measure L, 2026-11-03 general
# election (sources/la-sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The Los Angeles County Registrar-Recorder/County Clerk's list "Measures
# Appearing on the Ballot" (sources/county-measure-list-excerpt.txt, the
# measure's entry) gives its letter, vote threshold and ballot question,
# and, on its "Supporters: ... Opponents: ..." line, who filed the
# primary arguments ("Opponents: None submitted."): the card quotes it,
# and the sides cite it as the official statement of filing.
#
# The measure's text and the resolutions placing it are only in the
# City's August 4, 2026 staff-report packet (sources/staff-report.pdf, a
# text PDF of 76 pages, Agenda Item 6.1): the resolution approving the
# form of the ordinance is on PDF pages 51 to 53, and the ordinance it
# attaches (Attachment No. 1) on pages 54 to 73; the script cites its
# recitals (pages 54 to 56), the tax and exemptions (pages 60 and 61)
# and the operative date (page 72). The packet holds the resolutions as
# proposed, unsigned and with blank vote lines; no adopted copy was
# found. The staff report itself (pages 1 to 6) is the City's own, cited
# for plain facts only: its "Fiscal Impact" section (page 5) compares the
# revenue estimate with the City's General Fund, and is cited as the
# measure's fiscal statement for that comparison, as Red Bluff D's staff
# report is. The Registrar's Interactive Sample Ballot prints the City
# Attorney's impartial analysis (the measure's neutral explanation, which
# states that the City levies no such tax today and gives the City's
# revenue estimate) and the argument in favor, saved as HTML, with "NO
# ARGUMENT AGAINST THIS MEASURE WAS SUBMITTED" under it. The City's
# Measure L web page is not cited.

