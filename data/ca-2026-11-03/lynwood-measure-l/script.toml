# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; that the city charges no hotel
# tax today; what would change, from the City Attorney's impartial
# analysis and the ordinance (who pays and on what, online bookings, who
# is exempt, where the money goes, how long it lasts, what the Council
# may change); the revenue estimate with the staff report's own
# comparison to the General Fund; the argument for, and that none was
# submitted against; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". The card shows the name.
#
# The card quotes the measure's entry in the county's list "Measures
# Appearing on the Ballot", which prints no yes/no meanings, so the card
# has no boxes; the vote lines take both meanings from the question and
# highlight the same phrase. The services the question lists are on the
# card; the narration says once that the money may go to any purpose, as
# the ordinance says the list is only illustrative.
#
# The $751,315 a year is the City's estimate as the impartial analysis
# reports it (the ballot question states it too), and the staff
# report's Fiscal Impact section states its scale in words, "approximately
# 1.69 percent of the City's reported General Fund", which the fiscal line
# quotes (STANDARD.md 6.5). The staff report is cited for nothing else;
# its reasons for the tax are not used.
#
# Sides: the yes side comes from the argument in favor filed by the four
# supporters the county's list names, with its basis: hotel and motel
# visitors use city streets and services without paying for them, and
# residents would not pay this tax. The list and the sample ballot say no
# argument against was submitted, so the no side says so (filed = false);
# word counts kept within 5%.

contest = "ca-2026-11-03-lynwood-measure-l"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "L"
title = "CITY OF LYNWOOD"
origin = "VOTE PASSAGE – Majority Vote 50%+1"
summary = "Lynwood Public Safety/Community Protection/City Services Measure To maintain 911 emergency response; prevent crime, including gang/juvenile crime and human trafficking; address homelessness; keep parks/public areas safe/clean; address speeding/unsafe driving; repair streets/potholes; support youth/senior programs, other general city services, shall the City of Lynwood ordinance establishing a 12% transient occupancy tax, (paid only by hotel/motel guests), be adopted, providing approximately $751,315 annually until ended by voters, requiring audits/public spending disclosure, all funds locally controlled/benefitting Lynwood residents?"

[[section]]
id = "what"
heading = "Measure L"

[[section.line]]
text = "Measure L asks the voters of this city whether to tax hotel and motel stays at 12 percent, for general city services."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["establishing a 12% transient occupancy tax"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "today-none"
text = "Today, the city does not tax hotel and motel stays."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "city-hotel"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "rate"
text = "Guests staying 30 days or less would pay 12 percent of what they pay for the room."
sources = ["impartial-analysis", "ordinance", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "hotel-front-desk"

[[section.line]]
id = "online"
text = "The tax would apply to the full price, including fees, and online travel companies would collect it too."
sources = ["impartial-analysis", "ordinance"]

[section.line.visual]
kind = "illustration"
name = "online-booking-laptop"

[[section.line]]
id = "exempt"
text = "Government travelers, emergency shelter stays and residents displaced from their homes by a disaster would be exempt."
sources = ["impartial-analysis", "ordinance"]

[section.line.visual]
kind = "illustration"
name = "fire-damaged-lot"

[[section.line]]
id = "uses"
text = "The money would go to the general fund for any city purpose, with yearly audits, until voters repeal the tax."
sources = ["impartial-analysis", "ordinance", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "recurring-review"

[[section.line]]
id = "council-rate"
text = "The City Council could lower the rate and raise it again, but never above 12 percent without another vote."
sources = ["impartial-analysis", "ordinance"]

[section.line.visual]
kind = "illustration"
name = "city-council-chamber"

[[section]]
id = "fiscal"
heading = "What it would raise"

[[section.line]]
id = "revenue"
text = "The impartial analysis says the city estimates about $751,315 a year, which the city staff report puts at approximately 1.69 percent of the general fund."
sources = ["impartial-analysis", "staff-report"]

[section.line.visual]
kind = "illustration"
name = "special-tax"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
id = "yes-case"
text = "Supporters say hotel and motel visitors use city streets and services without paying for them, and residents would not pay this tax."
sources = ["argument-for"]
basis = ["People who stay in motels and hotels use our streets, public safety services, and community facilities without paying for them.", "This is NOT a tax on Lynwood residents."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Visitors use services without paying", "Not a tax on residents"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "The official county list of measures for this election says that no argument against Measure L was submitted, by any group or person."
sources = ["arguments-filed"]

[section.line.visual]
kind = "list"
source = "arguments-filed"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote adopts the 12 percent hotel tax."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["establishing a 12% transient occupancy tax"]

[[section.line]]
text = "A no vote rejects the 12 percent hotel tax."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["establishing a 12% transient occupancy tax"]

[[question]]
ask = "Who would pay the tax?"
lines = ["rate", "online", "exempt"]

[[question]]
ask = "Does the city have a hotel tax now?"
lines = ["today-none"]

[[question]]
ask = "What could the money be spent on, and for how long?"
lines = ["uses"]

[[question]]
ask = "How big is the revenue next to the city budget?"
lines = ["revenue"]

[[question]]
ask = "What do the supporters argue?"
lines = ["yes-case"]
