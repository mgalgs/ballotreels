[section.line.visual]
kind = "illustration"
name = "home-building"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "Measure H would allow up to 2,900 homes in those five areas: 2,160 for low incomes or below, and 740 for moderate incomes."
sources = ["guide-page"]

[section.line.visual]
