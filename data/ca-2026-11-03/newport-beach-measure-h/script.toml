# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and who placed it; what state housing law requires; what would
# change (the limit and its split by income, that only voters could
# change it later, that it approves no project); that the guide gives no
# cost estimate; one line per side; what a vote does.
#
# The City Attorney's Impartial Analysis is cited as the guide page. The
# guide prints no fiscal statement (not a tax measure): the fiscal line
# follows the no-cost-estimate wording. Two things stay out of the
# neutral sections because a side argues them (STANDARD.md 6.3): the
# City Council's 2024 approval of 8,174 units (the supporters', and the
# initiative's own findings), and the analysis's warning that the
# measure could constrain the city's compliance with state housing law
# (the opponents'). The script names no one.

contest = "ca-2026-11-03-newport-beach-measure-h"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide-page"
number = "H"
title = "City of Newport Beach, City of Newport Beach General Plan - Amendment"
origin = "The measure was placed on the ballot by a petition signed by the requisite number of voters"
summary = "Shall the measure to amend the City of Newport Beach’s General Plan Land Use Element allowing 2,900 new affordable housing units (2,160 reserved for extremely low-, very low-, and low-income households; and 740 for moderate-income households) with densities of 20 - 50 dwelling units per acre, plus State of California allowed housing density bonuses, in Dover/Westcliff (174), Newport Center (870), West Newport Mesa (406), Airport Area (929), and Coyote Canyon (521), be adopted?"
yes = "A “YES” vote is a vote in favor of the amending the General Plan."
no = "A “NO” vote is a vote against amending the General Plan."

[[section]]
id = "what"
heading = "Measure H"

[[section.line]]
text = "Newport Beach Measure H asks the voters of Newport Beach whether to amend the General Plan's housing rules for five areas."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["amend the City of Newport Beach’s General Plan Land Use Element"]

[[section.line]]
text = "Voters placed Measure H on the ballot by signing a petition."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "ballot-box"

[[section]]
id = "background"
heading = "What state law requires"

[[section.line]]
text = "State law requires Newport Beach to plan enough sites for its share of the region's housing needs, at each income level."
