basis = ["Housing developments in high-cost jurisdictions often require substantial public subsidies, yet the measure identifies no funding source for those subsidies.", "Nor does it identify funding sources for roads, utilities, parks, public safety, or related infrastructure.", "The measure also raises serious questions about compliance with state housing law.", "Failure to maintain compliance carries real consequences, including court intervention, limits on local land use authority, and financial penalties."]

