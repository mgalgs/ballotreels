[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Measure H reverses the council's approval of 8,174 homes, with a plan meeting state housing law."
sources = ["arguments"]
basis = ["Behind our backs, the City Council approved the construction of 8,174 new housing units in Newport Beach.", "VOTE YES on Measure H to reverse the City Council", "A responsible plan that follows state housing laws", "the housing plan the community has proposed in Measure H satisfies state housing laws"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Reverses the approval of 8,174 homes", "A plan that follows state housing law"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say Measure H identifies no funding for subsidies or infrastructure, and risks financial penalties under housing law."
