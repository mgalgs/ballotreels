# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and of whom; how a school bond is repaid and what it needs to
# pass; what the money would pay for; the district's tax statement; one
# line per side; what a vote does.
#
# The guide prints a long title line over the ballot question ("Westminster
# School District Classroom Repair, School Safety/Security, Quality
# Education Improvement Measure"); the card quotes the question itself as
# its title, as the other school bond cards do, and the impartial
# analysis's statement of what the measure does as its summary. The bond
# total and the debt service are repaid from a tax on property in the
# district, and no archived source states the district's budget, so they
# have no budget scale (STANDARD.md 6.5; left open). The tax statement
# gives the same rate, $30.00, as its average and its highest, "the same
# in every fiscal year", so the fiscal line says so once. The supporters'
# up to $90 million in state matching funds is their argument, so it
# stays out of the neutral sections (STANDARD.md 6.3).
#
# No argument against Measure B was submitted. The no side says so
# plainly; its section is marked filed = false.

contest = "ca-2026-11-03-westminster-school-measure-b"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-label"
number = "B"
title = "To provide safe, modern schools by repairing, upgrading and equipping aging classrooms, labs, instructional technology, and school facilities to support student achievement in math, science, technology, arts and engineering, fixing deteriorated roofs, plumbing, HVAC, electrical systems and improving school safety/security systems, shall Westminster School District’s measure authorizing $128,000,000 in bonds at legal rates be adopted, levying $30 per $100,000 assessed value ($8,000,000 annually) while bonds are outstanding, with citizen oversight, independent audits, all money locally-controlled?"
origin = "This measure was placed on the ballot by the governing board (“Board”) of the Westminster School District (“District”)."
summary = "This measure, if approved by 55 percent of the votes cast on the measure, will authorize the District to issue and sell up to $128,000,000 in general obligation bonds."
yes = "A “YES” vote is a vote in favor of authorizing the District to issue and sell up to $128,000,000 in general obligation bonds."
no = "A “NO” vote is a vote against authorizing the District to issue and sell up to $128,000,000 in general obligation bonds."

[[section]]
