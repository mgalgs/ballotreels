# Archived sources for County of Santa Cruz Measure E, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# Santa Cruz County Elections posts each measure's documents as separate
# PDFs on the measure's page. The ballot question is printed in the
# Board of Supervisors' resolution calling the election (page 3); County
# Counsel's impartial analysis is the measure's neutral explanation, the
# kind a state's attorney general's explanatory statement is; the County
# Auditor-Controller's fiscal impact statement is its fiscal statement.
# The ordinance's recitals give the county's Fiscal Year 2026-27 General
# Fund total, the scale for the yearly revenue (STANDARD.md 6.5), as
# Chino Hills Measure J's resolution does for its city.
#
# The argument for is a scan with no text layer. Its verbatim checks read
# its transcription (sources/argument-for.transcription.txt, made from
# the page image); the PDF beside it is the archived copy, and the url is
# the PDF's. Both rebuttals are archived beside them; the script quotes
# neither, so they are not listed here.

[contest]
id = "ca-2026-11-03-santa-cruz-county-measure-e"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/county:santa_cruz"
kind = "measure"
title = "County of Santa Cruz Measure E: Half-Cent Sales Tax for Five Years"

[[source]]
id = "ballot-question"
kind = "official-title-summary"
publisher = "Santa Cruz County Board of Supervisors, Resolution Calling for an Election to Raise the Retail Transactions and Use Tax by One-Half Cent, page 3, as posted by Santa Cruz County Elections"
credit = "Ballot question, Board of Supervisors resolution"
url = "https://votescount.santacruzcountyca.gov/Portals/16/nov26/Measure%20E%20Resolution.pdf"
file = "sources/resolution.pdf"
retrieved = "2026-10-28"

[[source]]
