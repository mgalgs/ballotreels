[section.line.visual]
kind = "illustration"
name = "sales-receipt"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "rates-change"
text = "Measure E would raise each rate by half a percent, from April 2027 through April 2032."
sources = ["impartial-analysis"]

[section.line.visual]
