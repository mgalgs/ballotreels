# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the two kinds of town; what
# Portola Valley is and charges today; what the charter and the new tax
# would do, and who may change the rate; the town's revenue estimate;
# one line per side; what a vote does.
#
# The card quotes the ballot question, printed only in the Town
# Council's resolution, which prints no yes/no lines (the impartial
# analysis has them, in another document). So, as for Los Angeles
# County Measure E, the card has no YES/NO boxes, the vote lines give
# the analysis's meanings, and both highlight the same two phrases of
# the question. The question reads "by adopting a charter for the Town
# of Portola Valley solely for, and establishing a real property
# transfer tax": words look to be missing after "solely for", but that is
# how the resolution prints it, so the card quotes it as printed. The
# resolution lets the Town Manager and Town Attorney make "minor
# non-substantive revisions" to the question, so the printed ballot may
# read otherwise.
#
# The question's "Autonomy Measure" and "maintaining Portola Valley's
# independent status" are the Council's words, which the opponents
# dispute ("a false excuse"); they stay on the card, and the narration
# says what the measure does instead. The $2 million a year is the
# Town's estimate, and no archived source states the town's budget to
# give it a scale (STANDARD.md 6.5; left open, under [[question]]). The
# opponents' $45,000 is a tax per home sale, exempt from the scale rule.

contest = "ca-2026-11-03-portola-valley-measure-n"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "N"
title = "Town of Portola Valley Autonomy Measure."
origin = "Pursuant to the requirements of the laws of the State of California, the Town Council hereby calls an election to be held in the Town of Portola Valley, California, on Tuesday, November 3, 2026, at which it shall submit to the voters of Portola Valley a measure that, if approved by a majority vote, would make Portola Valley a Charter Town and adopt a real property transfer tax."
summary = "Shall the measure maintaining Portola Valley’s independent status be adopted, providing: wildfire prevention/vegetation management; 911 emergency response/police patrols; local zoning/planning services; storm drain repair; and general government services; by adopting a charter for the Town of Portola Valley solely for, and establishing a real property transfer tax of $10 per $1,000, paid by buyers or sellers of property, until ended by voters, providing approximately $2,000,000 in locally controlled funding annually, with independent oversight?"

[[section]]
id = "what"
heading = "Measure N"

[[section.line]]
text = "Town of Portola Valley Measure N asks the voters of Portola Valley whether to adopt a town charter and a higher tax on property sales."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["by adopting a charter for the Town of Portola Valley", "establishing a real property transfer tax of $10 per $1,000"]

[[section]]
id = "background"
heading = "Two kinds of town"

[[section.line]]
text = "In California, a general law town must follow state law, while a charter town may set its own rules on municipal affairs."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "law-book"

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Portola Valley is a general law town, and taxes property sales at the most state law allows it: 27.5 cents per $500."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "homestead"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "The charter would give the town its own powers over local taxes, and would not change existing local laws."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "constitution-page"

[[section.line]]
text = "The transfer tax would become $10 per $1,000 of the price, and the buyer and seller can agree who pays."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "down-payment"

[[section.line]]
text = "The Town Council could lower or end the tax, but raising it would need another vote of the people."
sources = ["impartial-analysis"]

[[section]]
id = "fiscal"
heading = "What the analysis says"

[[section.line]]
id = "revenue"
text = "The impartial analysis of the town attorney says the tax would raise about $2 million a year, for any town purpose."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "set-aside-funds"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Measure N gives Portola Valley the resources to be self-reliant, and prevents a county takeover of local zoning."
sources = ["argument-for"]
basis = ["It’s more important than ever that Portola Valley has the resources to be self-reliant in these uncertain times.", "prevents a County takeover of our local zoning and planning services."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Resources to stay self-reliant", "No county takeover of zoning"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say only the few residents selling each year would pay, $45,000 and up on an average home sale."
sources = ["argument-against"]
basis = ["Only the 2-3% of residents selling properties each year would pay tax of $45,000 and up on an average-priced home sale, while the 97-98% of non-selling residents and renters get a free pass."]

[section.line.visual]
kind = "list"
source = "argument-against"
items = ["Falls only on sellers", "Average sale pays $45,000+"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
id = "vote-yes"
text = "A yes vote adopts the charter and authorizes the transfer tax."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["by adopting a charter for the Town of Portola Valley", "establishing a real property transfer tax of $10 per $1,000"]

[[section.line]]
id = "vote-no"
text = "A no vote is a vote against both the charter and the tax."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["by adopting a charter for the Town of Portola Valley", "establishing a real property transfer tax of $10 per $1,000"]

[[question]]
ask = "Can voters approve the charter without the tax?"
