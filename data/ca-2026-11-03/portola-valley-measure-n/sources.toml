credit = "Town Attorney's Impartial Analysis of Measure N"
url = "https://smcacre.gov/system/files/2026-08/52-ENG-MN-ImpartialAnalysis-PortolaValley-Transfer-Tax.pdf"
file = "sources/impartial-analysis.pdf"
retrieved = "2026-10-28"

