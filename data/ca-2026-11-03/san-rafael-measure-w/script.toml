# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; who placed it on the ballot; how
# the transfer tax works today; what would change (the
# rate, with the impartial analysis's own $1 million example; where the
# money goes; how long it lasts and who reviews it; the vote it needs);
# the city's revenue estimate (today's $1.5 million beside it on the
# chart, as the analysis states it); one line per side; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the opening
# says "the voters of this city". The card and title carry the names. No
# person is named.
#
# Every neutral line rests on the City Attorney's impartial analysis and
# the guide's ballot question, except that the tax is a general tax, which
# the ordinance's own text states (its Section 6) and which explains the
# majority vote the analysis gives. The card's yes and no sentences are
# the impartial analysis's ("A YES vote approves the measure." "A NO vote
# rejects the measure. The current rate would remain in effect."), and
# the vote lines quote them, one highlight in each box.
#
# The $6 million a year is the impartial analysis's estimate ("The City
# estimates ..."), attributed to the city, with the analysis's own total.
# No archived source states the city's general fund budget, so the
# figures have no scale (STANDARD.md 6.5; left open, under [[question]]).
#
# Sides: the arguments as printed in the guide. The supporters' line
# distils the argument in favor's emergency-response and infrastructure
# claims; the opponents' line the argument against's "Wrong Time for a
# Housing Tax" paragraph. The rebuttals are not cited.

contest = "ca-2026-11-03-san-rafael-measure-w"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide-page"
number = "W"
title = "San Rafael Essential Services Protection Measure."
origin = "The San Rafael City Council has placed this measure on the ballot."
summary = "To provide locally controlled funding for essential city services, such as fire protection, paramedics, rapid 9-1-1 emergency response times; preventing street/road deterioration; addressing impacts of homelessness/litter/illegal dumping; and other services, shall the City of San Rafael’s measure be adopted increasing the current real property transfer tax rate from 0.2% to 1% (only paid upon sale), generating approximately $7,500,000 annually until ended by voters, with annual audits and public spending disclosure?"
yes = "A YES vote approves the measure."
no = "A NO vote rejects the measure. The current rate would remain in effect."

[[section]]
id = "what"
heading = "Measure W"

[[section.line]]
text = "Measure W asks the voters of this city whether to raise the tax paid when property is sold from 0.2 percent to 1 percent of the price."
sources = ["guide-page", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["increasing the current real property transfer tax rate from 0.2% to 1%"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "placed"
text = "The City Council placed Measure W on the ballot."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "city-council-chamber"

[[section.line]]
id = "how-it-works"
text = "The transfer tax is paid once, when property changes hands, by the seller, the buyer or both, as they agree."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "home-for-sale"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "example"
text = "Measure W would raise the rate to 1 percent, so the tax on a $1 million sale would go from $2,000 to $10,000."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "bars"
title = "Transfer tax on a $1 million sale, in dollars"
source = "impartial-analysis"
unit = ""
labels = ["Today", "If Measure W passes"]
values = [2000, 10000]

[[section.line]]
id = "uses"
text = "The money would go into the general fund of the city, which pays for services such as fire protection, paramedics and street repair."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "fire-station-engine"

[[section.line]]
id = "duration"
text = "The higher rate would last until voters change it, and a city tax oversight committee would review how the money is spent."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "inspection-clipboard"

[[section.line]]
id = "threshold"
text = "As a general tax, Measure W needs a majority of the votes to pass."
sources = ["impartial-analysis", "text"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "fiscal"
heading = "What it would raise"

[[section.line]]
id = "revenue"
text = "The city estimates the higher rate would raise about $6 million more a year, for a total of $7.5 million."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "bars"
title = "Transfer tax revenue a year in dollars, city estimate"
source = "impartial-analysis"
unit = "million"
labels = ["Today", "If Measure W passes"]
values = [1.5, 7.5]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Measure W maintains rapid 9-1-1 response as emergency calls rise, and repairs aging infrastructure before it costs more to fix."
sources = ["argument-for"]
basis = ["With the number of 9-1-1 emergency calls rising, more on-duty firefighters and paramedics are needed to maintain rapid response to heart attacks, strokes, fires, accidents, and other emergencies.", "Voting Yes on W maintains the essential city services and repairs aging infrastructure before it becomes more expensive to fix later."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Rapid 9-1-1 response as calls rise", "Repairs before they cost more"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say Measure W is a 400 percent tax increase on people buying or selling homes, burdening first-time buyers and seniors who downsize."
sources = ["argument-against"]
basis = ["Measure W is a 400% tax increase on people buying or selling homes.", "That adds another burden on first-time buyers and seniors trying to downsize."]

[section.line.visual]
kind = "list"
source = "argument-against"
items = ["A 400% increase on home sales", "A burden on buyers and seniors"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote approves the measure, raising the rate to 1 percent."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["approves the measure"]

[[section.line]]
text = "A no vote rejects the measure, and the current rate would remain in effect."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["rejects the measure"]

[[question]]
ask = "Who put this on the ballot?"
lines = ["placed"]

[[question]]
ask = "Who pays the tax, and when?"
lines = ["how-it-works", "example"]

[[question]]
ask = "What can the money be spent on?"
lines = ["uses"]

[[question]]
ask = "How long would the higher rate last?"
lines = ["duration"]

[[question]]
ask = "How big is $6 million a year next to the city budget?"
unanswered = true
