# Archived sources for Plumas Lake Elementary School District Measure H,
# 2026-11-03 general election (sources/sources.md). Every id here may be
# cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# Yuba County Elections posts the whole measure as one five-page PDF,
# headed on every page "MEASURE H Plumas Lake Elementary School
# District": the ballot question and full text (pages 1 and 2), the
# impartial analysis by Yuba County Counsel (3), the district's tax rate
# statement (4), and "No Argument in Favor of Measure H Filed" beside the
# argument against (5). Its page codes (0581126-EM001 to EM005) look like
# the county guide's, but the PDF does not name a guide, so the card
# names the PDF as headed. The impartial analysis is the measure's
# neutral explanation; the tax rate statement is its fiscal statement.
# No rebuttals are printed.

[contest]
