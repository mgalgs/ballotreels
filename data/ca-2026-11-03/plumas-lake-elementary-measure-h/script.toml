# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; how a school bond is repaid and what it needs
# to pass; what the money would pay for; the district's tax rate
# statement; one line per side; what a vote does.
#
# No name of the district or its schools is narrated (the narrator
# mispronounces them): the opening says "the voters of this school
# district", and the school is "the district's new junior high school".
# The card, title and chart titles carry the names. "Counsel" is heard
# as "Council" (standard/speakability.txt), so the narration does not
# say it.
#
# The card quotes the ballot question as the county's Measure H pages
# print it. They print bare Yes and No boxes and no yes and no meanings,
# and the impartial analysis gives none, so the card has no YES and NO
# boxes and the vote lines take their meaning from the question's own
# words, each highlighting the bond authorization.
#
# The ballot question says the school's earlier parts were paid for from
# builder fees and State funds, and the argument against says the
# district went ahead with a smaller school without a bond. That history
# is an argument's point (and the question's), so the neutral sections
# leave it to the card and the no side (STANDARD.md 6.3).
#
# The bond total and the debt service are repaid from a tax on property
# in the district, and no archived source states the district's budget,
# so they have no budget scale (STANDARD.md 6.5; left open). The tax
# statement's average rate is said with its highest rate beside it; the
# fiscal years are written in full (standard/speakability.txt).
#
# The county prints "No Argument in Favor of Measure H Filed" beside the
# argument against. The yes side says so plainly; its section is marked
# filed = false.

contest = "ca-2026-11-03-plumas-lake-elementary-measure-h"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "H"
title = "BALLOT QUESTION"
origin = "The Resolution was placed on the ballot by the District Board of Trustees."
summary = "To construct/furnish a gymnasium, an essential component of the new Plumas Lake Junior High School, all prior components of which have been funded from builder fees and State funds and not from any tax burden on District property owners, shall the Plumas Lake Elementary School District issue $9,000,000 in bonds at legal rates, annually levying approximately $12 per $100,000 of assessed valuation, generating approximately $426,000 annually while bonds are outstanding, with strict accountability including audits and public spending disclosures?"

[[section]]
id = "what"
heading = "Measure H"

[[section.line]]
text = "Measure H asks the voters of this school district whether to approve $9,000,000 in bonds to build a gymnasium."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["issue $9,000,000 in bonds"]

[[section]]
id = "today"
heading = "How a school bond works"

[[section.line]]
id = "repaid"
text = "The district would sell the bonds and repay them from a tax on property in the district."
sources = ["tax-statement"]

[section.line.visual]
kind = "illustration"
name = "bond-certificates"

[[section.line]]
text = "Measure H needs 55 percent of the vote to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "projects"
text = "The money would build and furnish a new gymnasium at the district's new junior high school, with the utilities and disabled access it needs."
sources = ["impartial-analysis", "text"]

[section.line.visual]
kind = "illustration"
name = "school-gym"

[[section.line]]
text = "The bond money could not pay teacher or administrator salaries or other operating costs."
sources = ["impartial-analysis"]

[[section]]
id = "fiscal"
heading = "What the tax statement says"

[[section.line]]
id = "tax-rate"
text = "The district's tax rate statement estimates $12.54 a year per $100,000 of assessed value, on average, through 2056-2057."
sources = ["tax-statement"]

[section.line.visual]
kind = "illustration"
name = "debt-payments"

[[section.line]]
id = "tax-peak"
text = "The statement estimates the highest rate at $19 per $100,000, from 2028-2029 through 2032-2033."
sources = ["tax-statement"]

[[section.line]]
text = "The statement estimates the total to repay, with interest, at about $17.5 million."
sources = ["tax-statement"]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"
filed = false

[[section.line]]
text = "No argument in favor of Measure H was filed, so the measure pages from county elections print only the argument against the measure."
sources = ["arguments"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["No argument for was submitted"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say voters repeatedly rejected district bonds, and the district already found another way to build a smaller school without a bond."
sources = ["arguments"]
basis = ["voters have repeatedly rejected District bond measures since 2016", "Then the District proved there was another way.", "moved forward with a smaller school without a school bond"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Voters rejected past bonds", "District found another way"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote authorizes the district to issue $9,000,000 in bonds for the gymnasium."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["issue $9,000,000 in bonds"]

[[section.line]]
text = "A no vote does not authorize the district to issue the bonds."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["issue $9,000,000 in bonds"]

[[question]]
ask = "Who would repay the bonds?"
lines = ["repaid"]

[[question]]
ask = "What would the bond money pay for?"
lines = ["projects"]

[[question]]
ask = "How much would property owners pay?"
lines = ["tax-rate", "tax-peak"]

[[question]]
ask = "How big is $9,000,000 next to the district's yearly budget?"
unanswered = true
