# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; what the zone is, who votes in
# it and who placed the measure; the vote it needs; what would change
# (the new tax, how it may change, what it pays for, how long it lasts,
# what happens if it fails); the impartial analysis's revenue estimate;
# one line per side; what a vote does.
#
# An argument in favor was printed; no argument against was ("NO
# ARGUMENTS AGAINST THIS MEASURE WERE SUBMITTED"), so the no side says
# so, filed = false (STANDARD.md 2.5), citing the pamphlet page that
# prints the notice. The supporters' figures (the parcel count, today's
# revenue, the county's fees, the cost per day, past projects) are
# theirs, so they stay in their section or out (STANDARD.md 6.3).
#
# The pamphlet prints no tax rate statement; the revenue estimate is in
# the ballot question and County Counsel's impartial analysis, which the
# fiscal line names as the county attorney's ("Counsel" is heard as
# "Council", standard/speakability.txt). The money is the zone's own
# road revenue, and no archived source states a budget it would be part
# of, so it has no scale (STANDARD.md 6.5; left open). The per-parcel
# amounts are exempt. The ballot question and the analysis tie the
# yearly adjustment to a construction cost index and state no cap, so
# the script states none.

contest = "ca-2026-11-03-fernwood-cothrin-ranch-road-zone-measure-m"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide-page"
number = "M"
title = "IMPARTIAL ANALYSIS OF MEASURE M"
origin = "This Measure was placed on the ballot by the Board of Supervisors of the County of El Dorado at the request of the advisory committee for the Zone"
summary = "Shall the measure to levy an annual special tax in an amount of $375.00 with annual adjustments tied to the Engineering News Record Construction Cost Index on each parcel of land within the Fernwood-Cothrin Ranch Zone of Benefit commencing fiscal year 2027/2028 and continuing for an unlimited duration, to be used only for road improvements and maintenance and generating an annual revenue of approximately $99,000.00, to replace the current special tax of $150.00, be adopted?"
yes = "A “YES” vote is a vote to increase the annual special tax in the Fernwood-Cothrin Ranch Road Zone of Benefit from $150 to $375 per parcel, as provided in the Measure."
no = "A “NO” vote is a vote against the increase of the special tax."

