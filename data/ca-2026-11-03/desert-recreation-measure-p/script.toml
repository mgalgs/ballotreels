# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and of whom; what the district does and what the tax needs to
# pass; how the tax works and who is exempt; what the money would pay
# for; the one revenue estimate; one line per side; what a vote does.
#
# The card quotes the ballot question's title line as its title and the
# question as its summary (from the sample ballot, the one page that
# prints it); the origin and the yes and no lines are the Impartial
# Analysis's. "Counsel" is heard as "Council"
# (standard/speakability.txt).
#
# The guide prints no tax rate statement or fiscal analysis for this
# parcel tax; the one revenue estimate is the ballot question's
# "providing $11,300,000 annually until ended by voters". That is money
# paid into the district's budget, but no archived source states the
# district's budget, so it has no budget scale (STANDARD.md 6.5; left
# open). The ordinance's own findings (a structural deficit, cuts without
# new funding) make the supporters' case, so they stay out of the
# neutral sections (STANDARD.md 6.3).
#
# No argument against Measure P was filed. The no side says so plainly;
# its section is marked filed = false.

contest = "ca-2026-11-03-desert-recreation-measure-p"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-label"
number = "P"
title = "LOCAL PARK REPAIR/SAFETY AND SENIOR/YOUTH SERVICES MEASURE."
origin = "The Board of Directors of the District, by adopting Resolution No. 26-25 (“Resolution”), elected to call an election to place this Measure on the ballot."
summary = "To maintain safe drinking water, address homelessness, repair aging gas/sewer lines, remove asbestos/mold at parks/recreation facilities; maintain cooling centers, services for vulnerable seniors, youth gang/drug prevention programs; shall Desert Recreation District's measure be adopted levying 5¢ per building square foot annually, providing $11,300,000 annually until ended by voters, adjusting the appropriations limit; requiring spending disclosure, audits, all funds staying local; exempting low-income seniors?"
yes = "A “YES” vote on Measure “P” is a vote to authorize the District to establish a special parcel tax to provide ﬁnancing of park projects."
no = "A “NO” VOTE on Measure “P” is a vote to reject the District from establishing a special parcel tax to provide ﬁnancing of park projects."

