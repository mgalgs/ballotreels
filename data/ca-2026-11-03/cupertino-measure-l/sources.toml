# Archived sources for City of Cupertino Measure L, 2026-11-03 general
# election (sources/sources.md, sources/rov-sources.md). Every id here may
# be cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# The Santa Clara County Registrar of Voters' List of Local Measures is
# the authority for the measure's letter, ballot question and vote
# threshold ("Majority Vote Required": the two-thirds in the question is
# the vote the ordinance would require of future proposals), and says no
# argument against was filed. The impartial analysis and the argument in
# favor are the Registrar's posted copies, scans with no text layer:
# their verbatim checks read their transcriptions
# (sources/rov-*-transcription.txt, made from the page images); the urls
# are the PDFs'. The City Attorney's impartial analysis is the measure's
# neutral explanation. The July 21 council packet's draft resolution and
# ordinance are archived beside them; the script cites nothing only they
# state, so they are not listed.

[contest]
id = "ca-2026-11-03-cupertino-measure-l"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:cupertino"
kind = "measure"
title = "City of Cupertino Measure L: Two-Thirds Voter Approval to Rezone or Develop Parks and Open Space"

[[source]]
id = "ballot-question"
kind = "official-title-summary"
publisher = "County of Santa Clara Registrar of Voters, List of Local Measures, November 3, 2026 General Election: Measure L"
credit = "Santa Clara County Registrar of Voters, List of Local Measures"
url = "https://vote.santaclaracounty.gov/list-local-measures-4"
file = "sources/rov-measure-list-2026-10-29.html"
retrieved = "2026-10-29"

[[source]]
id = "impartial-analysis"
kind = "official-title-summary"
publisher = "City Attorney, City of Cupertino, City Attorney's Impartial Analysis of Measure L (August 13, 2026), County of Santa Clara Registrar of Voters"
credit = "City Attorney's Impartial Analysis of Measure L"
url = "https://files.santaclaracounty.gov/exjcpb1296/2026-08/measure-l-cupertino-initiative-ordinance-amendment-impartial-analysis_redacted.pdf"
file = "sources/rov-impartial-analysis-transcription.txt"
retrieved = "2026-10-29"

[[source]]
id = "argument-for"
kind = "official-argument"
publisher = "Argument in Favor of Measure L, as filed with the Santa Clara County Registrar of Voters (no argument against was filed)"
