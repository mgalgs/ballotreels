# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and of whom; which land it covers; who placed it and the two vote
# thresholds (Measure L's own majority, and the two-thirds it would
# require later); what would need a vote and what would not; adding and
# removing land; no cost estimate; one line per side; what a vote does.
#
# No narrated line names the city or the county (the card and title show
# them). The card quotes the Registrar's List of Local Measures: its
# heading for the measure as the title, the city as the origin, the
# ballot question as the summary. The list prints no yes/no statements;
# the vote lines take their meanings from the impartial analysis's "yes"
# and "no" sentences and highlight the question's one phrase both votes
# turn on.
#
# Supporters' "right now, parks can be rezoned without asking the voters"
# is their point, so the neutral sections describe only what the measure
# would require (STANDARD.md 6.3). No argument against Measure L was
# filed: the no side says so plainly; its section is marked filed = false.

contest = "ca-2026-11-03-cupertino-measure-l"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "L"
title = "General Plan Amendment"
origin = "City of Cupertino"
summary = "Shall an ordinance amending the City of Cupertino General Plan be adopted to mandate that any attempt to rezone parks, parklands or open space to residential, commercial or industrial uses, or any proposal for residential, commercial or industrial development in parks, parkland or open space, must be placed before Cupertino voters and secure two-thirds support in the City's next general election?"

[[section]]
id = "what"
heading = "Measure L"

[[section.line]]
text = "Measure L asks the voters of this city whether rezoning or developing parks and open space should first need two-thirds voter approval."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["secure two-thirds support"]

[[section]]
id = "background"
heading = "The land it covers"

[[section.line]]
id = "land"
text = "Measure L covers land marked as parks and open space on the land use map of the general plan."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "zoning-map"

[[section]]
id = "today"
heading = "How it reached the ballot"

[[section.line]]
id = "threshold"
text = "The City Council placed Measure L on the ballot, and Measure L itself needs a simple majority to pass."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "vote-needed"
text = "Rezoning that land, or approving homes, businesses or industry on it, would need two-thirds of voters at a general election."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "city-park-lawn"

[[section.line]]
text = "Uses already allowed under the park designation would not need a vote."
sources = ["impartial-analysis"]

[[section.line]]
id = "add-remove"
text = "The City Council could add land by a four-fifths vote, but removing land or changing the measure would take two-thirds of voters."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "open-space-hills"

[[section]]
id = "fiscal"
heading = "What it would cost"

[[section.line]]
text = "The Registrar of Voters' List of Local Measures does not include a cost estimate for the measure."
sources = ["ballot-question"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"
stamp = "None reported"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say voters, not just five council members, should decide on rezoning parks."
sources = ["argument-for"]
basis = ["shouldn't a decision this big be made by the people, not just five council members?", "parks and open space can be rezoned for housing, offices, or industrial use—without ever asking the voters who use them."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Voters decide on rezoning parks", "Park improvements can still go ahead"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure L was filed with the county Registrar of Voters."
sources = ["ballot-question"]

[section.line.visual]
kind = "list"
source = "ballot-question"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote approves the ordinance requiring a two-thirds vote."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["secure two-thirds support"]

[[section.line]]
text = "A no vote rejects the ordinance."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["secure two-thirds support"]

[[question]]
ask = "Which land does it cover?"
lines = ["land"]

[[question]]
ask = "What vote does Measure L itself need?"
lines = ["threshold"]

[[question]]
ask = "Could the protected land ever change?"
lines = ["add-remove"]
