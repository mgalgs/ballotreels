# Archived sources for Reed Union School District Measure O, 2026-11-03
# general election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The division is the district's Census school district,
# school_district:reed_union_elementary_school_district (divisions.tsv:
# "Reed Union Elementary School District"). The county's list of
# measures is the authority for the letter; the Registrar of Voters'
# staff report 26-4515 (September 8, 2026) gives the vote required
# ("requires 55% approval"). The county's Measure O page
# (sources/county-page.txt, read in a browser on 2026-10-30, since
# marincounty.gov refuses scripted fetches) prints the same ballot
# question, the vote required, County Counsel's impartial analysis, the
# tax rate statement (its figures the same as Exhibit C's), the argument
# in favor, and its statement that no argument against was filed.
#
# The District's Resolution No. 07-2025/2026 ordering the election is a
# 15-page scan with no text layer. The pages cited (3, 5, 6, 7, 8, 13 and
# 15) were typed from the page images into
# sources/reed-resolution-07-2025-2026-ordering-election-transcription.txt,
# which names the scan and its URL; every District source below
# points at the transcription, and its url at the scan. Page 5 is the
# clerk's certificate of adoption on June 8, 2026 (it writes the number
# "No. 7-2026-27"; the title page reads "07-2025/2026"). Exhibit A (page 6)
# is the ballot question the card quotes; Exhibit B (pages 7 to 13) is the
# full text with the project list and the accountability provisions;
# Exhibit C (page 15, the signed copy) is the tax rate statement, the
# measure's fiscal statement.
#
# Exhibit B's own statements of need and benefit, and the resolution's
# recitals, are the District's: the script uses only what Exhibit B
# enacts (which schools, what the money may and may not pay for, the
# oversight and audits). The District's Measure O page is the District's
# informational material and is not cited.

