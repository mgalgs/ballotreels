# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; how a school bond works; who
# placed it and the vote it needs; what the money would pay for, what it
# could not pay for, and who would check the spending; the tax rate
# statement's estimates; both sides, neither of which has an archived
# argument; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this school district", and the schools are
# "the district's three schools". The card and the title carry the
# names.
#
# The card quotes Exhibit A of the District's Resolution No.
# 07-2025/2026, the ballot question, from the transcription of the scan
# (sources.toml). Its bold lead-in is the card's title. The ballot's
# "Bonds – Yes" and "Bonds – No" are its choices, not yes/no sentences,
# so the card has no boxes and the vote lines take their meaning from
# the question.
#
# What the money pays for is the question's own list and Exhibit B's
# project list, as enacted; Exhibit B's statements of need and benefit
# (and the resolution's recitals) are the District's and are not used.
# The figures are the tax rate statement's, attributed to it. No
# archived source states the district's budget, so the $115 million and
# the $213 million to repay have no scale (STANDARD.md 6.5; left open),
# as for the other school bonds; the tax per $100,000 of assessed value
# is a per-property amount, exempt.
#
# No argument for or against Measure O was archived, and no document
# says whether any was filed (the resolution only authorizes the filing
# of one in favor), so each side says none is among the documents
# gathered (filed = false, STANDARD.md 2.5), as for Walnut Creek
# Measure U.

contest = "ca-2026-11-03-reed-union-measure-o"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "O"
title = "Reed Union School District Repair, Safety, Upgrade Measure"
origin = "Board of Trustees of the Reed Union School District"
summary = "To support quality education and retain/attract quality teachers by upgrading all Reed schools, keeping them safe; repairing deteriorating classrooms/bathrooms, leaky roofs; updating fire/electrical/security systems and earthquake safety; removing mold/asbestos; constructing, repairing facilities, acquiring equipment; shall a measure authorizing $115,000,000 in bonds at legal rates, levying $30 per $100,000 of assessed valuation, ($6,200,000 annually) while bonds are outstanding, requiring citizens’ oversight, spending disclosure/audits, be adopted?"

[[section]]
id = "what"
heading = "Measure O"

[[section.line]]
text = "Measure O asks the voters of this school district whether to approve $115 million in bonds for school repairs and upgrades."
