basis = ["the buildings and infrastructure are deteriorating and need our help", "Roofs leak. Pipes and wiring are wearing out.", "Portables have developed mold, and a few have been closed because they simply aren't safe for kids anymore.", "All bond funds must be spent locally and cannot be taken by the State."]

