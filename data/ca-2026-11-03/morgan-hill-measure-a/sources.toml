# Archived sources for City of Morgan Hill Measure A, 2026-11-03 general
# election (sources/sources.md, sources/rov-sources.md). Every id here may
# be cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# The Santa Clara County Registrar of Voters' List of Local Measures is
# the authority for the measure's letter, ballot question and vote
# threshold, and says no argument against was filed. The impartial
# analysis and the argument in favor are the Registrar's posted copies,
# which supersede the city's copies archived beside them: scans with no
# text layer, whose verbatim checks read their transcriptions
# (sources/rov-*-transcription.txt, made from the page images); the urls
# are the PDFs'. The City Attorney's impartial analysis is the measure's
# neutral explanation and gives the city's savings estimate. The city's
# full-text ordinance is archived beside them; the script cites nothing
# only it states, so it is not listed.

[contest]
id = "ca-2026-11-03-morgan-hill-measure-a"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:morgan_hill"
kind = "measure"
title = "City of Morgan Hill Measure A: City Treasurer Change from Elective to Appointive Office"

[[source]]
id = "ballot-question"
kind = "official-title-summary"
publisher = "County of Santa Clara Registrar of Voters, List of Local Measures, November 3, 2026 General Election: Measure A"
