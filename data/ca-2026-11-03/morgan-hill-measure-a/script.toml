# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and of whom; why the city has a treasurer and how it is chosen
# today; what the treasurer does; who would appoint, when; what it needs;
# the city's savings estimate; one line per side; what a vote does.
#
# No narrated line names the city or the county (the card and title show
# them), and none says "appointive", which the transcript check hears as
# "appointed" (standard/speakability.txt). The card quotes the Registrar's
# List of Local Measures: its heading for the measure as the title, the
# city as the origin, the ballot question as the summary. The list prints
# no yes/no statements; the vote lines take their meanings from the
# impartial analysis's "yes" and "no" sentences and highlight the
# question's one phrase both votes turn on.
#
# The supporters' count of cities that appoint their treasurer is theirs,
# so no neutral section mentions it (STANDARD.md 6.3). No archived source
# gives the city's general fund total, so the savings go without a scale
# (rule 6.5; listed as open). No argument against Measure A was filed:
# the no side says so plainly; its section is marked filed = false.

contest = "ca-2026-11-03-morgan-hill-measure-a"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "A"
title = "City Treasurer Change from Elective to Appointive Office"
origin = "City of Morgan Hill"
summary = "Shall the office of the City Treasurer be appointive?"

[[section]]
id = "what"
heading = "Measure A"

[[section.line]]
text = "Measure A asks the voters of this city whether the City Treasurer should be appointed instead of elected."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["City Treasurer be appointive"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "elected"
text = "Voters elect the City Treasurer every four years, and the current term ends in 2028."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "bank-vault"

[[section.line]]
id = "qualifications"
text = "An elected treasurer must be at least 18, live in the city and be registered to vote, with no required education or professional background."
sources = ["impartial-analysis"]

[[section.line]]
id = "duties"
text = "The City Treasurer oversees collecting and safeguarding city funds."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "bank-building"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "appointed"
text = "If Measure A passes, the city manager would appoint the treasurer based on experience and ability, starting in 2028 or at an earlier vacancy."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "job-application"

[[section.line]]
text = "Measure A needs a majority to pass."
sources = ["ballot-question"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "fiscal"
heading = "What it would save"

[[section.line]]
id = "savings"
text = "The city estimates savings of about $40,000 a year in personnel costs, and $15,000 in election costs every four years."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say treasurers need public finance expertise, and most California cities appoint theirs."
sources = ["argument-for"]
basis = ["These responsibilities require expertise in public finance, investments, banking, accounting, debt management, and compliance with complex state laws.", "Most California cities, including every city in Santa Clara County, already appoint their City Treasurer."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["The job requires finance expertise", "Most California cities appoint theirs"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure A was filed with the county Registrar of Voters."
sources = ["ballot-question"]

[section.line.visual]
kind = "list"
source = "ballot-question"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote makes the City Treasurer an appointed position."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["City Treasurer be appointive"]

[[section.line]]
text = "A no vote means voters keep electing the City Treasurer."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["City Treasurer be appointive"]

[[question]]
ask = "What does the treasurer do?"
lines = ["duties"]

[[question]]
ask = "What qualifications does the treasurer need today?"
lines = ["qualifications"]

[[question]]
ask = "Who would choose the treasurer, and when?"
lines = ["appointed"]

[[question]]
ask = "How big are the savings next to the city's budget?"
unanswered = true
