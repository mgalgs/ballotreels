[section.line.visual]
kind = "illustration"
name = "storm-drain-street"

[[section.line]]
id = "oversight"
text = "The city would report the revenue each year, and a citizens' committee would review the reports and audits."
sources = ["resolution"]

[section.line.visual]
kind = "illustration"
name = "recurring-review"

[[section]]
id = "fiscal"
heading = "What it would raise"

[[section.line]]
