basis = ["Los Angeles County is requesting a major increase in the cost of our contracted County Fire Department Services.", "Additionally, the County is imposing new charges of an additional 4 million dollars for Lifeguard Services and Beach Maintenance.", "Every dollar raised by Measure HB stays right here in Hermosa Beach.", "Hermosa Beach faces large new outside charges from LA County for fire and lifeguard services."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Higher county fire and lifeguard charges", "Every dollar stays local"]

