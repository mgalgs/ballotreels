[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section.line]]
id = "general"
text = "A general tax goes into the general fund, and may be spent on any lawful city purpose."
sources = ["resolution", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "state-budget"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "rate"
text = "Measure HB would add a half percent tax on retail sales in the city, with no end date unless voters repeal it."
