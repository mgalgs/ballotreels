# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; how it reached the ballot (the
# Council's vote, from the City Clerk's certification); how a general tax
# works today (a majority of voters must approve it; its money may go to
# any lawful purpose), from the resolution's recitals; what would change
# (where the tax applies, how long it lasts, where the money goes, the
# reporting and oversight); the revenue estimate, as the impartial
# analysis reports it; one line per side; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". The card shows the name. The
# Council's vote is said as who voted, not as a tally
# (standard/speakability.txt); no member is named.
#
# The card quotes the measure's entry in the county's list "Measures
# Appearing on the Ballot", which prints no yes/no meanings, so the card
# has no boxes; the vote lines take both meanings from the question and
# highlight the same phrase. The uses the question lists are said once,
# beside the rule that a general tax may fund any city purpose.
#
# What the measure does rests on the City Attorney's impartial analysis
# (the Registrar's copy) and the resolution. A general sales tax has no
# tax rate statement: the fiscal line gives the $2 million a year as the
# analysis reports the measure's estimate, with its caveat that revenue
# depends on taxable sales. No archived official document gives the
# City's general fund budget to scale it (STANDARD.md 6.5; left open,
# under [[question]]). The sales tax rates today and with the measure
# appear only in the opponents' argument, so the neutral sections give
# none (STANDARD.md 6.3).
#
# Sides: from the arguments and rebuttals the Registrar prints. For
# supporters, the higher charges the county seeks for fire and lifeguard
# services and that every dollar stays local; for opponents, a rate
# above neighboring cities and a budget balanced this year without the
# tax. That the money may go to any purpose, that the tax has no end
# date, and the oversight committee are stated once, in the neutral
# lines, from the official documents. No signer is named, on either side
# alike, and no figure is spoken in a side line.

contest = "ca-2026-11-03-hermosa-beach-measure-hb"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "HB"
title = "CITY OF HERMOSA BEACH"
origin = "VOTE PASSAGE – Majority Vote 50%+1"
summary = "Shall the measure to adopt a one-half percent (0.5%) local transactions and use (sales) tax providing approximately two million dollars ($2,000,000) annually until ended by voters (with citizens' oversight, independent audits, public reporting, and all funds remaining under local control) to maintain public safety services; repair and maintain streets, sidewalks, storm drains, parks, public facilities, and other infrastructure; address long-term fiscal sustainability; and support other general governmental purposes be adopted?"

[[section]]
id = "what"
heading = "Measure HB"

[[section.line]]
text = "Measure HB asks the voters of this city whether to add a half percent sales tax for general city services."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["one-half percent (0.5%) local transactions and use (sales) tax"]

[[section]]
id = "background"
heading = "How it got here"

[[section.line]]
text = "Four of the five City Council members voted to place Measure HB on the ballot."
sources = ["resolution"]

[section.line.visual]
kind = "illustration"
name = "city-council-chamber"

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Under the state constitution, a new general city tax must be approved by a majority of voters."
