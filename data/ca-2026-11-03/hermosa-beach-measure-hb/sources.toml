# Archived sources for City of Hermosa Beach Measure HB, 2026-11-03
# general election (sources/la-sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The Los Angeles County Registrar-Recorder/County Clerk's list "Measures
# Appearing on the Ballot" (sources/county-measure-list-excerpt.txt, the
# measure's entry) gives its letter, vote threshold and ballot question:
# the card quotes it. The Registrar's Interactive Sample Ballot gives the
# City Attorney's impartial analysis and the arguments and rebuttals as
# filed (HTML, retrieved 2026-10-30); the impartial analysis is the
# measure's neutral explanation. The City Council's Resolution No.
# 26-7574, as transmitted to the Los Angeles County Board of Supervisors,
# gives how the measure reached the ballot (with the City Clerk's
# certification of the Council's vote), the rules for a general tax, the
# oversight committee, and the proposed ordinance as Exhibit A. The
# ordinance's Attachment 1, the full text of the new Chapter 3.26, is not
# in the archived file, and the Registrar printed no full text. A general
# sales tax has no tax rate statement; the revenue estimate is the
# measure's own, as the impartial analysis reports it.

[contest]
id = "ca-2026-11-03-hermosa-beach-measure-hb"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:hermosa_beach"
kind = "measure"
title = "City of Hermosa Beach Measure HB: A Half Percent Sales Tax for General City Services"

