# Archived sources for City of Whittier Measure EV, 2026-11-03 general
# election (sources/la-sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The Los Angeles County Registrar-Recorder/County Clerk's list "Measures
# Appearing on the Ballot" (sources/county-measure-list-excerpt.txt, the
# measure's entry) gives its letter, vote threshold and ballot question,
# which the card quotes. Its "Supporters: None submitted. Opponents: None
# submitted." line is contradicted by the Registrar's own Interactive
# Sample Ballot, which prints an argument in favor and an argument
# against (sources/argument-for.html, sources/argument-against.html):
# the list (Rev. 9/22/26) is the earlier document, so the sides follow
# the printed arguments and the list is not cited for filing.
#
# The City Attorney's impartial analysis and the full text of the
# ordinance amending the charter, as the Registrar prints them, are the
# measure's neutral explanation and its text. Neither gives a cost
# estimate.

[contest]
id = "ca-2026-11-03-whittier-measure-ev"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:whittier"
kind = "measure"
title = "City of Whittier Measure EV: Moving City Elections from April to November"

[[source]]
id = "ballot-question"
kind = "official-title-summary"
publisher = "Los Angeles County Registrar-Recorder/County Clerk, Measures Appearing on the Ballot, November 3, 2026 (Rev. 9/22/26): City of Whittier, Measure EV"
credit = "Los Angeles County Registrar-Recorder/County Clerk, Measures Appearing on the Ballot"
url = "https://content.lavote.gov/docs/rrcc/documents/final-measures-appearing-on-the-ballot-9-22-2026-v-2.pdf"
file = "sources/county-measure-list-excerpt.txt"
retrieved = "2026-10-30"

[[source]]
id = "impartial-analysis"
kind = "official-title-summary"
publisher = "Impartial Analysis of Measure EV, by Keith Collins, City Attorney, as printed by the Los Angeles County Registrar-Recorder/County Clerk in its Interactive Sample Ballot"
credit = "City Attorney's Impartial Analysis of Measure EV"
url = "https://isb.lavote.gov/parsed/4348/contests/bmc10876.json"
file = "sources/impartial-analysis.html"
retrieved = "2026-10-30"

[[source]]
id = "text"
