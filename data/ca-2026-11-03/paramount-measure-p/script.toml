# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; how the measure reached the
# ballot; what would change (who pays and at what top rates, the phase-in
# and yearly increases, what the money may pay for, the oversight and the
# term, the two-thirds vote it needs); the revenue estimate as the
# impartial analysis gives it; both sides as the county's list records
# them; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". The card, title and chart
# title carry it.
#
# The rates are under a dollar a square foot, which the narration cannot
# say reliably (standard/speakability.txt): the line says how the tax is
# charged and the chart prints the analysis's three top rates. The
# ballot question's list of uses is on the card; the narrated uses are
# the analysis's four categories.
#
# The card quotes the Los Angeles County Registrar-Recorder/County
# Clerk's list "Measures Appearing on the Ballot": the City's heading,
# the vote needed and the ballot question, which has no yes or no
# sentences, so the card has no boxes. The vote lines give the impartial
# analysis's own meanings, and both highlight the same phrase.
#
# The yes side comes from the argument in favor filed by the supporters
# the list names (the mayor, the sheriff, two organizations and a
# business owner), with its basis: heavy truck traffic damages local
# streets, and a typical small business property would pay less than $100
# a year (their own figure, attributed). The list and the sample ballot
# say no argument against was submitted, so the no side says so plainly,
# citing the list (filed = false). The no line's clause on what the list
# records balances the yes line's length without a further claim.
#
# The $4 million a year is the City's estimate as the impartial analysis
# reports it. No archived official document states the City's general
# fund budget to give it a scale (STANDARD.md 6.5; left open, under
# [[question]]); the City's mailer is not a source for it.

contest = "ca-2026-11-03-paramount-measure-p"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "P"
title = "CITY OF PARAMOUNT"
origin = "VOTE PASSAGE – 2/3 Votes (66.6% of Votes)"
summary = "City of Paramount Public Safety, Environment, Streets and Business Improvement Measure Without taxing residential property owners or renters, shall the ordinance to fund services for Paramount 911 response/public safety; reducing crime; responding to business burglaries; addressing street racing; monitoring/improving water/air quality; repairing streets/potholes; supporting businesses by annually levying between 8¢ and 13¢ per square foot on industrial/commercial properties only, with annual adjustments up to 3%, raising approximately $4,000,000 annually until ended by voters, requiring audits, spending disclosure, local control, be adopted?"

[[section]]
id = "what"
heading = "Measure P"

[[section.line]]
text = "Measure P asks the voters of this city whether to tax commercial and industrial property each year, by the square foot, for set purposes."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["per square foot on industrial/commercial properties only"]

[[section]]
id = "today"
heading = "How it reached the ballot"

[[section.line]]
text = "The City Council placed Measure P on the ballot by a unanimous vote."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "city-council-chamber"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "rates"
text = "Commercial, industrial and vacant parcels would each have a top yearly rate per square foot, and residential property would not be taxed."
sources = ["impartial-analysis", "full-text"]

[section.line.visual]
kind = "bars"
title = "Top yearly rate per square foot in Paramount"
source = "impartial-analysis"
unit = "$"
labels = ["Commercial", "Industrial", "Vacant"]
values = [0.08, 0.11, 0.13]

[[section.line]]
id = "phase"
text = "The rates would phase in over three years, then could rise by up to 3 percent a year for inflation."
sources = ["impartial-analysis", "full-text"]

[section.line.visual]
kind = "illustration"
name = "warehouse-loading-docks"

[[section.line]]
id = "uses"
text = "As a special tax, the money could pay only for roads, public safety, environmental services and business programs."
sources = ["impartial-analysis", "full-text"]

[section.line.visual]
kind = "illustration"
name = "special-tax"

[[section.line]]
id = "end"
text = "An oversight committee would monitor the money, and the tax would last until ended by voters."
sources = ["impartial-analysis", "full-text"]

[section.line.visual]
kind = "illustration"
name = "end-date"

[[section.line]]
text = "Measure P needs two-thirds of the votes to pass."
sources = ["impartial-analysis", "hearing-notice", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "fiscal"
heading = "What the impartial analysis says"

[[section.line]]
id = "revenue"
text = "The city attorney's impartial analysis says the city estimates about $4 million a year in new local revenue."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "save-more"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
id = "yes-case"
text = "Supporters say heavy truck traffic damages local streets, and a typical small business property would pay less than $100 a year."
sources = ["argument-for"]
basis = ["Paramount faces rising costs to maintain essential services and repair local streets damaged by heavy truck traffic.", "Because the tax is based on property size, a typical small business property will pay less than $100 annually, while massive corporate distribution centers will pay their appropriate share."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Heavy trucks damage local streets", "Small properties under $100 yearly"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "The official county list of measures, which names who filed each argument, says that no argument against Measure P was submitted."
sources = ["measure-list"]

[section.line.visual]
kind = "list"
source = "measure-list"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote is to adopt the parcel tax ordinance."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["per square foot on industrial/commercial properties only"]

[[section.line]]
text = "A no vote is to not adopt the parcel tax ordinance."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["per square foot on industrial/commercial properties only"]

[[question]]
ask = "Who would pay the tax, and how much?"
lines = ["rates", "phase"]

[[question]]
ask = "What could the money be spent on?"
lines = ["uses"]

[[question]]
ask = "When would the tax end?"
lines = ["end"]

[[question]]
ask = "How big is $4 million a year next to the city budget?"
unanswered = true

[[question]]
ask = "What do the supporters argue?"
lines = ["yes-case"]
