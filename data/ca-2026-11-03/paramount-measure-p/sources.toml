# Archived sources for City of Paramount Measure P, 2026-11-03 election
# (sources/la-sources.md). Every id here may be cited by script.toml.
# `kind` must be one the standard allows (docs/STANDARD.md, section 1).
#
# The Los Angeles County Registrar-Recorder/County Clerk's list "Measures
# Appearing on the Ballot" is the authority for the letter, the ballot
# question and the vote threshold, quoted on the card; its "Supporters:
# ... Opponents: None submitted." line states in words who filed the
# primary arguments, so the same file backs `measure-list`, the official
# statement of filing. The Registrar's Interactive Sample Ballot prints
# the argument in favor that the list's supporters filed, with "NO
# ARGUMENT AGAINST THIS MEASURE WAS SUBMITTED" under it, and the full text
# of the ordinance, saved as HTML. The City Attorney's impartial analysis
# is the measure's neutral explanation, the kind a state's attorney
# general's explanatory statement is, and gives the City's revenue
# estimate; the full text agrees with it on the rates, phase-in, uses,
# oversight committee and term. The City Clerk's notice of
# public hearing states the two-thirds vote a special tax needs. The
# City's mailer and web pages are its own case for the measure and are
# not cited.

