# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and whose measure it is; the tax and its cap today, who pays it and
# who placed Measure C on the ballot; what would change for small and for
# larger businesses; the two revenue figures the guide prints; one line
# per side; what a vote does.
#
# The guide prints two revenue figures and does not reconcile them: the
# ballot question's "approximately $5,600,000 annually", and the impartial
# analysis's "an additional $4.6 million dollars annually" beside current
# receipts of "approximately $1 million". The fiscal section states each
# as its source prints it, attributed, without adding them up. They are
# city revenue, and no archived source states the city's budget, so they
# have no scale (STANDARD.md 6.5; left open, under [[question]]). The
# guide does not state the vote Measure C needs, so the script says
# nothing of it.
#
# No argument against was submitted ("No argument against this measure
# was submitted."): the no side says so, filed = false (STANDARD.md 2.5),
# in as many words as the yes side. The supporters' $1 million business
# paying $500 is an amount per business, exempt from the scale rule.

contest = "ca-2026-11-03-costa-mesa-measure-c"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide-page"
number = "C"
title = "City of Costa Mesa, The Costa Mesa Fair Business License Reform, Small Business Protection Measure"
origin = "The Measure was placed on the ballot by the City Council."
summary = "Without taxing residents, shall the measure be adopted, updating Costa Mesa’s 41-year-old business license tax, ensuring large businesses pay their proportionate share and helping fund general city services including keeping public areas safe/clean; preventing crime/burglaries; addressing homelessness; maintaining Costa Mesa’s financial stability; revising the tax rate to 50¢ per $1,000 gross receipts, with no increase for small businesses; generating approximately $5,600,000 annually until ended by voters, requiring audits, spending disclosure, funds locally controlled?"
yes = "A “yes” vote would approve reforming the business license tax, leaving the tax unchanged for small businesses and establishing an updated rate for businesses earning over $500,000 annually, raising $4.6 million annually to support crime prevention, police and fire services, homelessness prevention, roads, sidewalks and parks and other general city services, and to help the City maintain fiscal stability."
no = "A ”no” vote would leave the existing business license tax in place and maintain the existing $200 cap adopted in 1985."

[[section]]
id = "what"
heading = "Measure C"

[[section.line]]
text = "Costa Mesa Measure C asks city voters whether to raise the business license tax for businesses earning more than $500,000 a year."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["updating Costa Mesa’s 41-year-old business license tax"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Today, no business pays more than $200 a year, under a cap set in 1985."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "city-storefronts"

[[section.line]]
text = "The tax is charged to businesses, not to residents, and the City Council placed Measure C on the ballot."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "ballot-box"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "who-pays"
text = "Businesses earning $500,000 a year or less would pay no more than now, which the impartial analysis says is over 72 percent of them."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "share"
title = "Existing businesses whose tax stays the same"
source = "impartial-analysis"
unit = "%"
labels = ["Over 72%"]
values = [72]

[[section.line]]
text = "Larger businesses would pay 50 cents per $1,000 of gross receipts, up to $15,000 a year."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "special-tax"

[[section]]
id = "fiscal"
heading = "What the guide says"

[[section.line]]
id = "revenue"
text = "The city attorney's impartial analysis says the tax brings in about $1 million today, and the measure would raise an additional $4.6 million a year."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "set-aside-funds"

[[section.line]]
text = "The ballot question says the updated tax would generate about $5.6 million a year."
sources = ["guide-page"]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say license costs have not risen since 1985, and a $1 million business would pay $500 a year."
sources = ["arguments"]
basis = ["Costa Mesa has not increased the cost of a business license since 1985.", "a business with $1 million in sales will pay $500 per year for its business license"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["No increase since 1985", "$1 million in sales pays $500 a year"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure C was submitted, so none is printed in the official Orange County Voter Information Guide."
sources = ["arguments"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote approves the reform, leaving the tax unchanged for small businesses and setting a new rate for those earning over $500,000."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["would approve reforming the business license tax"]

[[section.line]]
text = "A no vote leaves the existing tax and its $200 cap from 1985 in place."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["would leave the existing business license tax"]

[[question]]
ask = "Would small businesses pay more?"
lines = ["who-pays"]

[[question]]
ask = "How much money would the tax raise?"
lines = ["revenue"]

[[question]]
ask = "How big is the new money next to the city's budget?"
unanswered = true
