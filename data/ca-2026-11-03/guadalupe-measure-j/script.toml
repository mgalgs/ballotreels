# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; who pays the tax today; what
# would change (the rate, the lodgings it would reach and those it would
# exempt, where the money goes, the vote it needs); the ballot label's
# revenue estimate; one line per side; what a vote does.
#
# The card quotes the ballot question from a transcription of the
# guide's sample ballot (sources.toml says why), which prints it under
# "CITY OF GUADALUPE" and "MEASURE J2026" with no title line and plain
# YES and NO boxes. So the card's title is the city's name as the ballot
# prints it (as Measure G's is), its origin the page's head, "Sample
# Ballot"; the vote lines give the impartial analysis's meanings, and
# both highlight the same phrase of the question. The tax's name,
# "transient occupancy tax", is kept to the card and title; the
# narration says what it is, a tax on short lodging stays.
#
# That the city has no commercial lodging today but short-term rentals,
# and how the rate compares with nearby places, are stated only in the
# argument in favor, so they stay in the yes side (STANDARD.md 6.3). The
# analysis gives no revenue estimate: the fiscal line quotes the ballot
# question's, attributed to it, and no archived source states the City's
# general fund budget to give it a scale (STANDARD.md 6.5; left open,
# under [[question]]).
#
# No argument against Measure J was filed. The no side says so plainly;
# its section is marked filed = false.

contest = "ca-2026-11-03-guadalupe-measure-j"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "J"
title = "CITY OF GUADALUPE"
origin = "Sample Ballot"
summary = "Shall the measure be adopted to support public safety and other essential City services by increasing, until ended by voters, the City's transient occupancy tax from 6% to 12%, paid only by persons who rent lodgings in the City for 30 days or less, and by extending the tax to RV parks/campgrounds, which is anticipated to raise up to $20,000 annually, and more, if additional lodging facilities open in the City?"

[[section]]
id = "what"
heading = "Measure J"

[[section.line]]
text = "Measure J asks the voters of this city whether to raise its tax on short lodging stays."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["transient occupancy tax from 6% to 12%"]

[[section]]
id = "today"
heading = "The tax today"

[[section.line]]
id = "who-pays"
text = "Today, guests of hotels, motels and similar lodging pay a 6 percent tax on stays of 30 days or less."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "hotel-front-desk"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "rate"
text = "Measure J would raise the rate to 12 percent of the rent."
sources = ["impartial-analysis", "text"]

[section.line.visual]
kind = "bars"
title = "Tax rate on short lodging stays"
source = "impartial-analysis"
unit = "%"
labels = ["Today", "With Measure J"]
values = [6, 12]

[[section.line]]
id = "reach"
text = "The tax would also cover RV parks and campgrounds, and exempt six kinds of stays, such as state park campsites."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "country-campground"

[[section.line]]
id = "general"
text = "As a general tax, the money could pay for any city purpose, until voters repeal the tax."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "state-budget"

[[section.line]]
text = "Measure J needs a simple majority to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "fiscal"
heading = "What the ballot question says"

[[section.line]]
id = "revenue"
text = "The ballot question estimates up to $20,000 a year, and more if new lodging opens in the city."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["anticipated to raise up to $20,000 annually"]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say visitors, not residents, would pay for vital city services, and 12 percent is still lower than most nearby."
sources = ["arguments"]
basis = ["A YES vote on Measure J2026 will raise revenues for vital City services, to be paid for by visitors to the City with zero costs to Guadalupe residents.", "Raising the City's TOT rate to 12% will keep the City's rate competitive, but comparable and lower than most other local jurisdictions."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Paid by visitors, not residents", "Still lower than most nearby rates"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure J was filed, so the county voter guide prints only the argument in favor of the measure."
sources = ["arguments"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote raises the rate and applies the tax to more kinds of lodging."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["transient occupancy tax from 6% to 12%"]

[[section.line]]
text = "A no vote does not raise the rate or apply the tax to more kinds of lodging."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["transient occupancy tax from 6% to 12%"]

[[question]]
ask = "Who pays this tax?"
lines = ["who-pays", "reach"]

[[question]]
ask = "What can the money be spent on?"
lines = ["general"]

[[question]]
ask = "How big is up to $20,000 a year next to the city budget?"
unanswered = true
