# Archived sources for Guadalupe Measure J, 2026-11-03 general election
# (sources/sources.md). Every id here may be cited by script.toml.
# `kind` must be one the standard allows (docs/STANDARD.md, section 1).
#
# Santa Barbara County Elections prints each ballot type's County Voter
# Information Guide as one PDF; pages 39 to 43 (impartial analysis,
# argument in favor, full text) and 48 to 49 (sample ballot) of Ballot
# Type 103 were cut into one excerpt, which backs every source here but
# the ballot question. The sample ballot sets the Measure J label beside
# Proposition 44's, and pdftotext reads the two columns into each other,
# so the label `check` reads verbatim was typed from the page into a
# transcription beside the PDF, which names the PDF, page and URL it
# copies; that source points at the transcription, and its url at the
# guide. The ballot labels the measure "Measure J2026"; the project names
# it by its bare letter. The City Attorney's impartial analysis is the
# measure's neutral explanation; it gives no revenue estimate, and the
# one estimate is the ballot label's. No tax rate statement or fiscal
# analysis applies. No argument against was filed, and no rebuttals are
# printed. Measure J (a transient occupancy tax) is a separate measure
# from the same City Council's Measure G (a cannabis business tax) on the
# same ballot.

