# Archived sources for Regional Measure RTM, 2026-11-03 general election
# (sources/sources.md), as San Francisco's own Voter Information Pamphlet
# & Sample Ballot prints it: San Francisco's rate (1 percent) and the
# arguments filed in San Francisco. The other four counties of the Public
# Transit Revenue Measure District print their own. "page" is the
# pamphlet's printed page number (the PDF's page less 2).
#
# The measure covers all of San Francisco, so its division is the county
# and it has no `voters`; it passes on the votes of all five counties
# together. The pamphlet prints no Controller's Statement, digest or paid
# arguments for it: the impartial analysis by the District's legal
# counsel is its neutral explanation and the one revenue estimate.

