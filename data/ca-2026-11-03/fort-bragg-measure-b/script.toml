items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote approves the ordinance continuing the fire equipment tax for ten years."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["authorize a $50 annual parcel tax for 10 years"]

[[section.line]]
text = "A no vote rejects the ordinance continuing the fire equipment tax for ten years."
