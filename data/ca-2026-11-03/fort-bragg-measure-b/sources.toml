# Archived sources for City of Fort Bragg Measure B, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# Mendocino County Elections posts each measure's Voter Information
# Guide pages as one PDF, linked from its "Measures on the Ballot" page;
# Measure B's are guide pages 23B1 to 23B3: the ordinance's full text,
# the City Attorney's Impartial Analysis, an argument in favor, and "NO
# ARGUMENT AGAINST MEASURE B WAS SUBMITTED." The pages print no ballot
# question and, for a flat parcel tax, no tax rate statement. The ballot
# question is the City Council's, from Resolution No. 5039-2026, Section
# 3; the City posts the resolution as a scan with no text layer, so the
# passages cited were typed from the page images into
# sources/resolution-5039-2026-transcription.txt, whose url is the
# scan's (as Eureka Measure H's are).

[contest]
id = "ca-2026-11-03-fort-bragg-measure-b"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:fort_bragg"
kind = "measure"
title = "City of Fort Bragg Measure B: Fire Equipment Parcel Tax"

