# Archived sources for City of McFarland Measure P, 2026-11-03 general
# election (sources/county-sources.md, sources/sources.md). Every id here
# may be cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# Kern County Elections posts each local measure's documents on its page
# "November 3, 2026, General Election", which renders its document list
# in the browser, so each file's url is that page. For Measure P it
# posts the City's Resolution No. 2026-95, which orders the measure
# submitted, gives the exact ballot question (Section 4) and the reasons
# in its recitals, and the City Attorney's impartial analysis (headed
# "Impartial Analysis by City Counsel"). The resolution's file omits its
# Exhibit A, the ordinance. The resolution is a scan with no text layer:
# its pages were typed from the page images into
# sources/county-resolution-transcription.txt, which those sources point
# at. The impartial analysis is the measure's neutral explanation, the
# kind a state's attorney general's explanatory statement is. The City's
# agenda packet copies archived earlier are not cited. The page posts no
# argument for or against, and no document says none was filed. Not a
# tax: no fiscal statement applies, and none was posted.

[contest]
id = "ca-2026-11-03-mcfarland-measure-p"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:mcfarland"
kind = "measure"
title = "City of McFarland Measure P: Council Authority to Amend the Animal Feeding Operations Law"

[[source]]
id = "ballot-question"
kind = "official-title-summary"
publisher = "City of McFarland, Resolution No. 2026-95, Section 4, Ballot Question, as posted by Kern County Elections, November 3, 2026, General Election (transcribed from the scan)"
credit = "Resolution No. 2026-95, City of McFarland"
url = "https://www.kernvote.com/elections/upcoming-elections/november-3-2026-general-election"
file = "sources/county-resolution-transcription.txt"
retrieved = "2026-10-29"

