[section.line.visual]
kind = "illustration"
name = "amended-page"

[[section.line]]
id = "hearing"
text = "Any change would first need a public hearing, with proper notice."
sources = ["impartial-analysis", "resolution"]

[[section.line]]
id = "no-change"
text = "Measure P itself would not change the current rules."
sources = ["impartial-analysis"]

[[section.line]]
text = "Measure P needs a majority vote to pass."
sources = ["impartial-analysis", "resolution"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "fiscal"
heading = "What it would cost"

[[section.line]]
text = "The county elections page for this election does not include a cost estimate for the measure."
