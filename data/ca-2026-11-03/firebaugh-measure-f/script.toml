# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; how it reached the ballot; what
# would change (the rates, where the money goes, the oversight, how long
# it lasts and the vote it needs); the revenue estimate as the impartial
# analysis gives it; one line per side; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". The card and title carry it.
#
# No printed guide was found, so the card quotes the ballot language
# from Resolution No. 26-46, Section 4, as typed from the scan. It
# prints no yes/no lines, so the card has no YES/NO boxes; the vote
# lines both highlight the same phrase of the question.
#
# Rates: the chart and the narration give the four the ordinance and the
# impartial analysis agree on. The agricultural rate is left out: the
# ordinance charges $95 per acre, the analysis $95 per parcel.
#
# Use of the money: the neutral line says only what the ordinance's
# special fund allows ("fire and emergency services"). The round-the-
# clock coverage the supporters argue for, and the volunteer staffing
# they describe, stay in their own line (STANDARD.md 6.3).
#
# No archived source states the city's general fund or fire budget, so
# the $240,000 a year has no scale (STANDARD.md 6.5; left open, under
# [[question]]).

contest = "ca-2026-11-03-firebaugh-measure-f"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "F"
title = "RESOLUTION NO. 26-46"
origin = "A RESOLUTION OF THE CITY COUNCIL OF THE CITY OF FIREBAUGH"
summary = "To ensure 24/7 response to fires and medical emergencies such as heart attacks, strokes, and car accidents; hire/train firefighters/EMTs; upgrade safety equipment, vehicles/life-saving rescue tools, shall a measure be adopted to enact a $95/year parcel tax for single family homes and specified amounts for multifamily, commercial, agricultural, and industrial parcels, providing approximately $240,000/year until ended by voters; requiring independent oversight; funds used only for Firebaugh Fire Department response?"

[[section]]
id = "what"
heading = "Measure F"

[[section.line]]
text = "Measure F asks the voters of this city whether to add a yearly parcel tax to pay for fire and emergency response."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["to enact a $95/year parcel tax"]

[[section]]
id = "today"
heading = "How it reached the ballot"

[[section.line]]
text = "The city council placed Measure F on the ballot in August, with no votes against."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "city-council-chamber"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "rates"
text = "Each single-family home would pay $95 a year, each apartment unit $65, and commercial and industrial parcels more."
sources = ["impartial-analysis", "text"]

[section.line.visual]
kind = "bars"
title = "Yearly tax under Measure F, in dollars"
source = "impartial-analysis"
unit = ""
labels = ["Single-family home", "Apartment unit", "Commercial parcel", "Industrial parcel"]
values = [95, 65, 495, 750]

[[section.line]]
id = "use"
text = "The money would go into a special fund, used only for fire and emergency services."
sources = ["text", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "fire-station-engine"

[[section.line]]
text = "A committee of five residents would review the spending and report each year."
sources = ["text"]

[section.line.visual]
kind = "illustration"
name = "inspection-clipboard"

[[section.line]]
id = "end"
text = "The tax would have no end date, and needs two-thirds of the votes to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "fiscal"
heading = "What the impartial analysis says"

[[section.line]]
id = "revenue"
text = "The city attorney's impartial analysis estimates that the tax would raise about $240,000 a year."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "city-parcels"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say the department relies almost entirely on volunteers, and Measure F would ensure emergency coverage around the clock."
sources = ["argument-for"]
basis = ["Today, Firebaugh's Fire Department depends almost entirely on volunteer firefighters who often have full-time jobs.", "will ensure 24-hour, 7-day a week emergency response coverage"]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Volunteers can't always be at the station", "Firefighters ready 24 hours a day"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say even a $95 parcel tax could make life noticeably harder for families, and this tax would never end."
sources = ["argument-against"]
basis = ["even a $95 parcel tax could make life noticeably harder", "This tax would collect about $240,000 every year from the people of Firebaugh, and it would never end."]

[section.line.visual]
kind = "list"
source = "argument-against"
items = ["A $95 tax makes life harder", "The tax would never end"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote enacts the parcel tax, at $95 a year for each single-family home."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["to enact a $95/year parcel tax"]

[[section.line]]
text = "A no vote does not enact the parcel tax."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["to enact a $95/year parcel tax"]

[[question]]
ask = "How much would each property pay?"
lines = ["rates"]

[[question]]
ask = "What can the money be spent on, and when would the tax end?"
lines = ["use", "end"]

[[question]]
ask = "How big is $240,000 a year next to the city budget?"
unanswered = true
