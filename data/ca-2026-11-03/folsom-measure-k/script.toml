# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and of whom; the limit today and since when; how it reached the
# ballot and what it needs; what would change, and where it applies; no
# cost estimate; one line per side; what a vote does.
#
# Not a tax: the county page prints no fiscal statement, so the fiscal
# line says the page does not include a cost estimate. The $150 and $500
# are amounts per donor, not a government's money (STANDARD.md 6.5,
# exempt). The card's title is the item's own head on the page; its
# origin is the analysis's sentence on who placed the measure.
#
# The supporters' history (why voters set the limit in 1994, independent
# expenditure committees since) is theirs, so the neutral sections give
# only the analysis's date and figure (STANDARD.md 6.3). No argument
# against Measure K was filed: the no side says so plainly; its section
# is marked filed = false.

contest = "ca-2026-11-03-folsom-measure-k"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-label"
number = "K"
title = "Measure K: City of Folsom"
origin = "On July 14, 2026, the City Council voted to place Measure K on the November ballot."
summary = "Shall the measure increasing the campaign contribution limit from $150 to $500 per donor per election on campaigns for Folsom City Council be adopted?"
yes = "A “yes” vote on Measure K will authorize an increase in the campaign contribution limit applicable to candidates for Folsom City Council from $150 to $500 per person per election."
no = "A “no” vote on Measure K will not authorize an increase in the campaign contribution limit applicable to candidates for Folsom City Council from $150 to $500 per person per election. The $150 per person per election campaign contribution limit will remain in place."

[[section]]
id = "what"
heading = "Measure K"

[[section.line]]
text = "City of Folsom Measure K asks voters in the city whether to raise the limit on donations to City Council candidates from $150 to $500."
sources = ["ballot-label"]

[section.line.visual]
kind = "page"
source = "ballot-label"
highlight = ["increasing the campaign contribution limit from $150 to $500"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "In 1994, Folsom voters set a limit of $150 per person, per election, on donations to council candidates."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "law-book"

[[section.line]]
text = "The limit has not been updated since 1994."
sources = ["impartial-analysis"]

[[section.line]]
text = "The City Council placed Measure K on the ballot, and it needs a simple majority."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "ballot-box"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "Measure K would raise the limit to $500 per person, per election."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "donation-checks"

[[section.line]]
text = "Measure K would apply only to Folsom City Council elections, not to ballot measures."
sources = ["impartial-analysis"]

[[section]]
id = "fiscal"
heading = "What it would cost"

[[section.line]]
text = "The Sacramento County Current Measure Information page does not include a cost estimate for the measure."
sources = ["ballot-label"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"
stamp = "None reported"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say raising the limit lets residents support candidates directly, leveling the playing field."
sources = ["arguments"]
basis = ["Measure K would raise the limit to $500, allowing residents to provide more support directly to the candidate of their choice.", "we can take a step toward leveling the playing field."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Lets residents support candidates directly", "Levels the playing field in city elections"]

