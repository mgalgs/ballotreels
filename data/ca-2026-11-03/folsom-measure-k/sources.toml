# Archived sources for City of Folsom Measure K, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# Sacramento County publishes no single Voter Information Guide PDF (each
# voter's guide is issued through a portal); its "Current Measure
# Information" page prints each measure's ballot question, impartial
# analysis, full text and arguments. sources/county-measure-page-item.txt
# is the text of Measure K's item on that page; every source cites it.
# Measure K is not a tax: the page prints no fiscal statement. The
# analysis is the City Attorney's, as its heading and signature give it.

[contest]
id = "ca-2026-11-03-folsom-measure-k"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:folsom"
kind = "measure"
title = "City of Folsom Measure K: City Council Campaign Contribution Limit"

[[source]]
id = "ballot-label"
kind = "official-title-summary"
publisher = "Sacramento County Voter Registration and Elections, Current Measure Information, November 3, 2026, General Election: Measure K's ballot question, and the Impartial Analysis's statement of what a vote does"
credit = "Current Measure Information, Sacramento County"
url = "https://elections.saccounty.gov/us/en/election-information/current-measure-information.html"
file = "sources/county-measure-page-item.txt"
