# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; how it reached the ballot; what
# would change (the rate and whom it applies to, what the money is
# for, how long it lasts and who may repeal it, the vote
# it needs); the revenue estimate as the ballot question gives it; both
# sides, neither of which has an archived argument; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". The card and title carry the
# names.
#
# The card quotes the Tulare County Registrar of Voters' published
# notice of election, the question "to be displayed on each individual
# ballot", which prints no yes/no statements: so the card has no YES/NO
# boxes, and both vote lines highlight the same phrase of the question.
#
# The Registrar's copy of Resolution No. 2026-016 is signed and records
# its adoption "at a regular meeting on this 26 day of May" (page 2,
# handwritten). The City's June 8 staff report calls that meeting the
# first reading and June 8 the second reading and adoption; the
# Registrar's copy wins, so the script says May 2026.
#
# What the tax does comes from the full text, Ordinance No. 538 (read
# from the scanned packet's page images): ten percent of the rent paid
# by each transient (3.44.020), a transient being an occupant for "thirty
# (30) consecutive days or less" (3.44.010 J), and repealable or
# amendable by the Council "without a vote of the people", while any
# increase needs voter approval (3.44.150). The
# ballot question's "remain in effect until repealed by the voters" is
# attributed to it, and the Council's power under 3.44.150 is stated
# beside it so neither reads as the whole story. The draft impartial
# analysis and draft argument in the same packet are not the printed
# ones and are not used (so nothing here says how many hotels the city
# has).
#
# The $250,000 a year per hotel is the ballot question's estimate. No
# archived source states the City's general fund budget to give it a
# scale (STANDARD.md 6.5; left open, under [[question]]).
#
# No argument for or against Measure P was archived (the county's guide
# could not be fetched), and no document says whether any was filed. So
# the sides do not say none was filed: each says none is among the
# documents gathered (filed = false, STANDARD.md 2.5), as for Walnut
# Creek Measure U.

contest = "ca-2026-11-03-farmersville-measure-p"
template = "measure"
template_version = 2
standard_version = 2

[card]
