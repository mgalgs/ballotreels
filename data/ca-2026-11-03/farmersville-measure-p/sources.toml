# Archived sources for City of Farmersville Measure P, 2026-11-03
# general election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The county's site (tularecounty.ca.gov) is behind a Cloudflare
# challenge. The Tulare County Registrar of Voters' measure page is
# archived as the Internet Archive's capture of October 9, 2026; it
# prints the Registrar's published notice of election, whose ballot
# question ("to be displayed on each individual ballot") and vote
# requirement the card and script quote, so its url is that capture.
# The page links the City's placing resolution, archived as the
# Registrar posted it (a 2-page scan, no text layer).
#
# The resolution says the measure's complete text is "attached hereto
# as Exhibit 'A'", but the Registrar's copy is the resolution alone.
# The full text (Ordinance No. 538, Chapter 3.44) is archived from the
# City Council's June 8, 2026 agenda packet (a scan, read from its page
# images). The same packet prints a draft impartial analysis and a draft
# argument for the measure: neither is the version the county's guide
# prints (the guide is blocked), so neither is listed or used. No
# document says whether any argument was filed with the Registrar.

