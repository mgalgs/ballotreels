credit = "Notice of Election, Stanislaus County Registrar of Voters"
url = "https://www.stanvote.gov/pdf/public_notices/20261103_notice_of_election_publication-measure-n-sylvan.pdf"
file = "sources/notice-measure-n-sylvan.pdf"
