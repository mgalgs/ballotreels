# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; how a school bond is repaid and what it needs
# to pass; what the money may pay for; the impartial analysis's figures
# from the district's tax rate statement; one line per side; what a vote
# does. The same shape as Le Grand Union High Measure A.
#
# No name of the district, county or school is narrated (the narrator
# mispronounces them): the opening says "the voters of this school
# district", and the supporters' line says "district schools". The card,
# title and chart titles carry the names. "Counsel" is heard as "Council"
# (standard/speakability.txt), so the narration says "impartial
# analysis" only.
#
# The card quotes Measure L's entry on the county's List of Local
# Measures: the district's name as its heading, the vote threshold and
# the ballot question, with no yes/no sentences. So the card has no
# boxes; the vote lines give the impartial analysis's own meanings, and
# both highlight the same phrase of the question.
#
# The county posts no tax rate statement for Measure L; the impartial
# analysis restates the district's (its highest rate and the final year),
# so the fiscal lines name the analysis. The ballot question's
# "$2,800,000 annually" is on the card. The bonds are repaid from a tax
# on property in the district, and no archived source states the
# district's budget, so they have no budget scale (STANDARD.md 6.5; left
# open). Each side's own facts stay in its section (STANDARD.md 6.3): the
# schools' age and the asbestos and lead pipes (supporters; the ballot
# question's list is on the card, and "change" names other projects), and
# the analysis's note that approval does not guarantee every project,
# the bar on paying salaries, and the earlier bonds (opponents, and in
# part supporters).

contest = "ca-2026-11-03-north-monterey-county-unified-measure-l"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "measure-list"
number = "L"
title = "North Monterey County Unified School District"
origin = "55% Voter Approval Required"
summary = "To repair and upgrade older schools to meet current health/safety codes; remove asbestos/lead pipes; fix deteriorating roofs, plumbing, dry rot, HVAC and electrical systems; improve school safety/security; and upgrade aging classrooms including science, technology, and skilled trades facilities; shall North Monterey County Unified School District’s measure authorizing $40,000,000 in bonds at legal rates be adopted, levying $32 per $100,000 assessed value ($2,800,000 annually) while bonds are outstanding, with citizen oversight, independent audits and all money locally controlled?"

[[section]]
id = "what"
heading = "Measure L"

[[section.line]]
text = "Measure L asks the voters of this school district whether to approve $40 million in school bonds."
sources = ["measure-list", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "measure-list"
highlight = ["authorizing $40,000,000 in bonds"]

[[section]]
id = "today"
heading = "How a school bond works"

[[section.line]]
id = "repaid"
text = "The district would sell the bonds and repay them with a yearly tax on property in the district."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "bond-certificates"

[[section.line]]
text = "Measure L needs 55 percent of the vote to pass."
sources = ["impartial-analysis", "measure-list"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "projects"
text = "The ballot question lists projects such as fixing roofs, plumbing, heating and electrical systems, and upgrading classrooms."
sources = ["measure-list"]

[section.line.visual]
kind = "illustration"
name = "school-roof-repair"

[[section]]
id = "fiscal"
heading = "What the impartial analysis says"

[[section.line]]
id = "tax-rate"
text = "The impartial analysis, citing the district's tax rate statement, estimates the highest rate at about $32 a year per $100,000 of assessed value."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "debt-payments"

[[section.line]]
id = "end"
text = "The analysis says the tax is expected to be collected through 2054."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "end-date"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say nearly all district schools were built over 60 years ago and don't meet safety codes, and some have asbestos and lead pipes."
sources = ["argument-for"]
basis = ["Nearly all our schools were built over 60 years ago and don't meet current health and safety codes.", "others have hazardous materials such as asbestos and lead pipes"]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Schools over 60 years old", "Removes asbestos and lead pipes"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say school bonds are like credit cards, repaid with interest over 30 years, and the district should fund upkeep within its existing budget."
sources = ["argument-against"]
basis = ["School bonds are like credit cards. The repairs are charged today, but you repay the debt with interest at unknown rates over 30 years.", "NMCUSD should prioritize maintenance within its existing budget"]

[section.line.visual]
kind = "list"
source = "argument-against"
items = ["Debt repaid with interest", "Maintain within existing budget"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote is in favor of issuing $40 million in school bonds."
sources = ["impartial-analysis", "measure-list"]

[section.line.visual]
kind = "page"
source = "measure-list"
highlight = ["authorizing $40,000,000 in bonds"]

[[section.line]]
text = "A no vote is against issuing $40 million in school bonds."
sources = ["impartial-analysis", "measure-list"]

[section.line.visual]
kind = "page"
source = "measure-list"
highlight = ["authorizing $40,000,000 in bonds"]

[[question]]
ask = "Who would repay the bonds?"
lines = ["repaid"]

[[question]]
ask = "What would the bond money pay for?"
lines = ["projects"]

[[question]]
ask = "How much would property owners pay, and for how long?"
lines = ["tax-rate", "end"]

[[question]]
ask = "How big is $40 million next to the district's yearly budget?"
unanswered = true
