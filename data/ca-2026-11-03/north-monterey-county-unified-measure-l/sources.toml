# Archived sources for North Monterey County Unified School District
# Measure L, 2026-11-03 general election (sources/county-sources.md,
# sources/sources.md). Every id here may be cited by script.toml. `kind`
# must be one the standard allows (docs/STANDARD.md, section 1).
#
# The County of Monterey Elections Department posts each local measure's
# letter, vote threshold and ballot question on its List of Local
# Measures page, with links to its filed documents: for Measure L, the
# full text, the County Counsel's impartial analysis, the arguments for
# and against, and both rebuttals, all scans with no text layer. The
# impartial analysis and the two arguments were typed from their page
# images into sources/county-*-transcription.txt, each naming the PDF and
# URL it copies; those sources point at the transcription, and their url
# at the scan. The full text and the rebuttals are not cited, so not
# transcribed. County Counsel's impartial analysis is the measure's
# neutral explanation, the kind a state's attorney general's explanatory
# statement is.
#
# The county posts no tax rate statement for Measure L. The impartial
# analysis restates the district's (its highest rate and final year), so
# it is the source of those figures, attributed in the narration to the
# analysis. The district's resolution and facilities page archived
# earlier are superseded by the county's copies and not cited.

