# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; what the charter pays the mayor
# and council members today, and since when; what would change (the new
# pay, when, and how it would be adjusted later); the vote it needs;
# that the guide has no cost estimate; both sides, which the guide
# prints nothing for; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city", and the card and title carry
# the name.
#
# The guide prints no ballot question, so the card quotes it from the
# City Council's Resolution No. 2026-32, Section 1, as typed from the
# scan. The resolution prints only YES and NO boxes, no yes and no
# sentences, so the card has no boxes; the vote lines give the City
# Attorney's impartial analysis's own meanings, and both highlight the
# same phrase of the question. The text of the charter amendment (the
# resolution's Exhibit A) was not obtained: every line here is stated in
# the question or the analysis.
#
# The pay figures are amounts per person, exempt from a budget scale
# (STANDARD.md 6.5). The guide prints no fiscal statement, so the
# fiscal line follows the round's set form, naming the guide as "the
# official voter guide for this election" (its printed name carries the
# county's name, which the narration may not say).
#
# The guide's page for Measure H prints the impartial analysis and no
# argument for or against; it does not say whether any was filed. So
# both sides say only that the guide prints none, filed = false
# (STANDARD.md 2.5), and their lists say "printed", not "submitted".

contest = "ca-2026-11-03-eureka-measure-h"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "H"
title = "RESOLUTION NO. 2026-32"
origin = "A RESOLUTION OF THE CITY COUNCIL OF THE CITY OF EUREKA, CALIFORNIA"
summary = "Shall Sections 310 and 405 of the Eureka City Charter be amended to authorize the Eureka City Council to establish compensation for the Mayor and Councilmembers by ordinance, including an initial salary of $1,250 per month for the Mayor and $1,000 per month for Councilmembers, with future annual adjustments subject to review by the Finance Advisory Committee?"

[[section]]
id = "what"
heading = "Measure H"

[[section.line]]
text = "Measure H asks the voters of this city whether to let the city council set the pay of the mayor and council members."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["to establish compensation for the Mayor and Councilmembers by ordinance"]

[[section]]
