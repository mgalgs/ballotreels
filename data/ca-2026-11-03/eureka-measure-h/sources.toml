# Archived sources for City of Eureka Measure H, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# The Humboldt County Office of Elections prints Measure H's impartial
# analysis on page 21 of its Full Voter Information Guide, and nothing
# else for the measure: no ballot question (its sample ballot pages are
# placeholders), no argument for or against, no rebuttals and no fiscal
# statement. The ballot question is the City Council's, from Resolution
# No. 2026-32, Section 1, in the county's packet for the measure; those
# pages are a scan with no text layer, so the passages cited were typed
# from the page images into sources/resolution-2026-32-transcription.txt,
# whose url is the scan's (as Fowler Measure T's are). The text of the
# charter amendment (the resolution's Exhibit A) is not in the packet
# and was not obtained, so no source here is of kind official-text.

[contest]
id = "ca-2026-11-03-eureka-measure-h"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:eureka"
kind = "measure"
title = "City of Eureka Measure H: Mayor and Councilmember Pay"

