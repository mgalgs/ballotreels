# Archived sources for Southern Humboldt Community Healthcare District
# Measure K, 2026-11-03 general election, as Humboldt County's voters see
# it (sources/sources.md). Every id here may be cited by script.toml.
# `kind` must be one the standard allows (docs/STANDARD.md, section 1).
#
# The Humboldt County Office of Elections prints County Counsel's
# impartial analysis and the argument in favor in its Full Voter
# Information Guide (pages 26 and 27 of the PDF, cut into one excerpt),
# and posts the district's own documents as one packet: the board's
# resolution, the full text of the measure, the ballot question (Exhibit
# B) and the tax rate statement (Exhibit C). Those packet pages are scans
# with no text layer; the passages used were typed from the page images
# into sources/packet-transcription.txt, which names the PDF and URL it
# copies, and the ballot question and tax rate statement point at it. The
# impartial analysis is the measure's neutral explanation; the tax rate
# statement is its fiscal statement. No argument against was filed, and no
# rebuttals are printed.
#
# A health care district has no Census boundary, so the measure's
# division is the county and `voters` names the district
# (docs/SCRIPT-FORMAT.md). The district reaches into Mendocino County (the
# resolution's recitals), where the same measure is staged separately as
# southern-humboldt-healthcare-measure-k-mendocino; Humboldt County, where
# the district mostly lies, keeps the plain name.

[contest]
id = "ca-2026-11-03-southern-humboldt-healthcare-measure-k"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/county:humboldt"
kind = "measure"
title = "Southern Humboldt Community Healthcare District Measure K: Hospital Bonds"
voters = "the Southern Humboldt Community Healthcare District"

