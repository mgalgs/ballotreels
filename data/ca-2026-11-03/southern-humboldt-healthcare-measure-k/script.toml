# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; how the bond is repaid and what it needs to
# pass; what the money may pay for, and the impartial analysis's caution
# about one use; the district's tax rate statement; one line per side;
# what a vote does.
#
# The card quotes the ballot question from Exhibit B of the district's
# Resolution No. 26:06, transcribed from the scan the county posts; the
# exhibit prints plain BONDS – YES and BONDS – NO boxes and no yes/no
# lines. So the card has no YES/NO boxes, its origin is the resolution's
# title, the vote lines give the question's meaning, and both highlight
# the same phrase of it. "Counsel" is heard as "Council"
# (standard/speakability.txt), so the narration says "the impartial
# analysis". No name of the hospital, district or county is narrated: the
# card, title and `voters` line show them.
#
# The bond total and the debt service are repaid from a tax on property
# in the district, and no archived source states the district's budget,
# so they have no budget scale (STANDARD.md 6.5; left open). The rate is
# said as the statement's "$80 per $100,000" (not "8 cents per $100",
# which speakability.txt rules out), and its "2052-53" in full. The
# analysis's note that medical equipment "likely does not fall within the
# constitutional exemption" for the bond tax is the one caution a neutral
# source gives; it is said as the analysis says it. The matching funds,
# the state deadline and the oversight committee are the supporters'
# points, so the neutral sections leave them out (STANDARD.md 6.3).
#
# No argument against Measure K was filed. The no side says so plainly;
# its section is marked filed = false.

contest = "ca-2026-11-03-southern-humboldt-healthcare-measure-k"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "K"
title = "BALLOT QUESTION/ABBREVIATED FORM OF BALLOT MEASURE"
origin = "RESOLUTION OF THE BOARD OF DIRECTORS OF THE SOUTHERN HUMBOLDT COMMUNITY HEALTHCARE DISTRICT ORDERING AN ELECTION TO AUTHORIZE THE ISSUANCE OF GENERAL OBLIGATION BONDS"
summary = "To replace 77 year-old Jerold Phelps Community Hospital with a modern hospital to provide life-saving emergency care for victims of accidents, heart attacks, strokes, and other emergencies, improve Emergency Room facilities, operating rooms, provide advanced medical equipment/technology and life flight services; and qualify for matching funds shall Southern Humboldt Healthcare District's measure authorizing $25,000,000 in bonds be adopted, levying 8 cents per $100 assessed value (raising $2,000,000 annually) while bonds are outstanding, with independent citizen oversight and all funds staying local?"

[[section]]
id = "what"
heading = "Measure K"

[[section.line]]
text = "Measure K asks the voters of this health care district whether to approve $25 million in bonds for a new hospital."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["authorizing $25,000,000 in bonds"]

[[section]]
id = "today"
heading = "How the bond works"

[[section.line]]
text = "The district would sell the bonds and repay them with a property tax."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "bond-certificates"

[[section.line]]
text = "Measure K needs two-thirds of the vote to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "projects"
text = "The money would pay for projects such as a new hospital, an upgraded emergency room and a heliport."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "mountain-hospital"

[[section.line]]
id = "equipment"
text = "The impartial analysis says medical equipment, one planned use, likely falls outside the legal exception allowing this tax."
sources = ["impartial-analysis"]

[[section]]
id = "fiscal"
heading = "What the tax statement says"

[[section.line]]
id = "tax-rate"
text = "The tax rate statement estimates $80 a year per $100,000 of assessed value, through 2052-2053."
sources = ["tax-statement"]

[section.line.visual]
kind = "illustration"
name = "debt-payments"

[[section.line]]
