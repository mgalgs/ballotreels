sources = ["tax-statement", "impartial-analysis"]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say the hospital, built 77 years ago in a converted home, must be replaced within 3 years or close."
sources = ["arguments"]
basis = ["Built 77 years ago in a converted home, the hospital does not meet current standards for health, safety, or access for the disabled.", "State law requires the building be replaced with a modern facility in the next 3 years or be closed."]

[section.line.visual]
