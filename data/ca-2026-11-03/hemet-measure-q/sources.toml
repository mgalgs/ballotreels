# Archived sources for City of Hemet Measure Q, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1). The guide's pages are cut from the
# Riverside County Registrar of Voters' County Voter Information Guide
# (ballot type 415, a Hemet precinct); "page" is the guide's printed
# footer number.
#
# The guide does not print the measure's full text (the ordinance); the
# City Clerk's copy was not retrieved, so no official-text source is
# listed. The guide prints no fiscal analysis or tax rate statement (a
# sales tax, not a bond).

[contest]
id = "ca-2026-11-03-hemet-measure-q"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:hemet"
kind = "measure"
title = "City of Hemet Measure Q: One Cent Sales Tax for City Services"

[[source]]
id = "ballot"
kind = "official-title-summary"
publisher = "Riverside County Registrar of Voters, County Voter Information Guide, page RV 415-020: sample ballot, Measure Q"
credit = "Sample ballot, Riverside County Voter Information Guide"
url = "https://docs.voteinfo.net/voterInformation/root1103/ballots/bt000415.pdf"
file = "sources/sample-ballot-page.pdf"
retrieved = "2026-10-28"

[[source]]
