# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks; who put it on the ballot and what it needs to pass; what would
# change (the rate, how long it lasts, where the money goes, the city's
# existing sales tax); the impartial analysis's revenue estimate; one
# line per side; what a vote does.
#
# The guide prints no fiscal analysis or tax rate statement (not a
# bond), and the ordinance itself was not archived; the City Attorney's
# Impartial Analysis is the neutral explanation. No archived source
# states the city's general fund budget, so the $16 million has no scale
# (STANDARD.md 6.5; left open). The card is the sample ballot's
# question, which prints no yes/no lines; the vote lines take their
# words from the Impartial Analysis.
#
# Sides come from the argument in favor and the argument against, not
# the rebuttals.

contest = "ca-2026-11-03-hemet-measure-q"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot"
number = "Q"
title = "Hemet Public Safety, Essential City Services Measure."
origin = "CITY OF HEMET"
summary = "Shall a measure funding general city services such as 9-1-1 emergency response, public safety; reducing drug-related crime; keeping public areas safe/clean; addressing homelessness; reducing wildfire risks; providing safe, clean drinking water; repairing streets/potholes; maintaining library services; attracting/retaining businesses, by establishing a 1¢ sales tax providing approximately $16,000,000 annually until ended by voters, subject to oversight, public spending disclosure, all funds controlled locally, be adopted?"

[[section]]
id = "what"
heading = "Measure Q"

[[section.line]]
text = "City of Hemet Measure Q asks voters in the city whether to add a one-cent sales tax."
sources = ["ballot", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot"
highlight = ["by establishing a 1¢ sales tax"]

[[section]]
id = "today"
heading = "How it reached the ballot"

[[section.line]]
text = "The City Council placed Measure Q on the ballot, and it needs a simple majority to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "ballot-box"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "The 1 percent tax would add one cent for each dollar spent on taxable goods, until voters end it."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "city-storefronts"

[[section.line]]
text = "The money would go into the general fund of the city, for any lawful city program or service."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "state-budget"

[[section.line]]
text = "The sales tax the city already collects under an earlier measure would stay in effect."
sources = ["impartial-analysis"]

[[section]]
id = "fiscal"
heading = "What the impartial analysis says"

[[section.line]]
text = "The City Attorney's impartial analysis estimates the tax would provide $16 million a year."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "dispatch-desk"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Measure Q keeps police and firefighters available, and the city has no more room to cut without hurting public safety."
sources = ["arguments"]
basis = ["Measure Q is critical to ensuring our police and firefighter/", "paramedics are available for Hemet residents when needed.", "but there is no more room to cut without impacting critical city services, including public safety."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Keeps police and firefighters available", "No room left to cut without hurting services"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say Hemet has a spending problem, not a revenue problem, and its sales tax would top every city in six counties."
sources = ["arguments"]
basis = ["HAVE A REVENUE PROBLEM - WE HAVE A SPENDING PROBLEM!", "If Measure Q passes, the City of Hemet sales tax rate would be 9.75%", "the highest of any city in the counties of Riverside, San Bernardino,"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["A spending problem, not a revenue problem", "Highest city sales tax in six counties"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote will authorize the 1 percent sales tax."
sources = ["impartial-analysis", "ballot"]

[section.line.visual]
kind = "page"
source = "ballot"
highlight = ["by establishing a 1¢ sales tax"]

[[section.line]]
text = "A no vote will not authorize the 1 percent sales tax."
