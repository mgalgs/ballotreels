# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; how a school bond is repaid and what it
# needs to pass; what the money may pay for; the district's tax rate
# statement; one line per side; what a vote does.
#
# The bond total and the debt service are repaid from a tax on property
# in the district, and no archived source states the district's budget,
# so they have no budget scale (STANDARD.md 6.5; left open). The fiscal
# line gives the statement's average rate beside its highest, as it
# prints both. The impartial analysis says the tax would be in addition
# to current property taxes, so the neutral line says so. The bar on
# spending bond money on salaries, the audits and the oversight
# committee are in the supporters' argument ("strong taxpayer
# protections"), so the neutral sections leave them out (STANDARD.md
# 6.3). "Counsel" is heard as "Council" (standard/speakability.txt), so
# the narration says "the impartial analysis".
#
# No argument against Measure O was submitted. The no side says so
# plainly; its section is marked filed = false.

contest = "ca-2026-11-03-old-adobe-union-measure-o"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "measure-question"
number = "O"
title = "Old Adobe Union School District"
origin = "The Old Adobe Union School District Board of Education has placed on the ballot the question of whether to issue $48,000,000 in bonds for such purposes."
summary = "To improve the quality of education; repair/replace leaky roofs; make health, safety and security improvements; replace outdated HVAC systems; make accessibility (ADA) improvements, modernize classrooms, restrooms and school facilities, including multi-purpose rooms; shall Old Adobe Union School District’s measure be adopted authorizing $48,000,000 of bonds at legal rates, generating on average $2,800,000 annually while bonds are outstanding at approximate rates of $25 per $100,000 assessed value, with annual audits, oversight, no money for salaries, all money staying local?"
yes = "A “yes” vote on Measure O will authorize the District to issue the bonds and levy taxes to pay for the indebtedness."
no = "A “no” vote on Measure O will not authorize either the issuance of bonds or the associated levy of taxes."

[[section]]
