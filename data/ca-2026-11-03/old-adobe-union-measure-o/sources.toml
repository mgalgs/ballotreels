# Archived sources for Old Adobe Union School District Measure O,
# 2026-11-03 general election (sources/sources.md). Every id here may be
# cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# The Sonoma County Registrar of Voters publishes each measure's pages
# of its guide as one PDF, headed "Local Ballot Measure: O" and footed
# "Sonoma County" with the guide's page numbers (049M559 to 049M563); no
# cover page was archived, so the sources name those pages, not a guide
# title. One PDF backs every source here. County Counsel's Impartial
# Analysis is the measure's neutral explanation; the district's Tax Rate
# Statement is its fiscal statement. The pages print an argument in
# favor and "No Argument Was Submitted Against Measure O", and no
# rebuttals.
#
# The Census names the district Old Adobe Union Elementary School
# District (divisions.tsv); the ballot's name is Old Adobe Union School
# District.

[contest]
id = "ca-2026-11-03-old-adobe-union-measure-o"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/school_district:old_adobe_union_elementary_school_district"
kind = "measure"
title = "Old Adobe Union School District Measure O: School Repair and Modernization Bonds"

