# Archived sources for Yosemite Unified School District Measure W, the
# School Facilities Improvement District No. 1 bond, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# Who votes: the registrar's notice is given "to the qualified electors
# of the School Facilities Improvement District No. 1 of the Yosemite
# Unified School District (the "SFID") of Madera County", and the bonds
# are repaid from taxes on property within the SFID (the impartial
# analysis). The SFID has no boundary layer of its own, so the division
# is the county with a `voters` line, as a special district's is.
#
# The Madera County Clerk-Recorder & Registrar of Voters posts each
# measure's filed documents on its election page; the printed County
# Voter Information Guide was not found online. The ballot question is
# quoted from Exhibit B, the "Abbreviated Form", of the Board of
# Trustees' Resolution No. 2025/2026-19, as Measure Y's is from its
# resolution. County Counsel's impartial analysis is the measure's
# neutral explanation, the kind a state's attorney general's
# explanatory statement is; the district's tax rate statement is its
# fiscal statement.
#
# Tax rate statement: the registrar posted the $18 million statement in
# the Measure Y filing (its PDF pages 19-20) and the Measure Y statement
# in this one; the right one was cut into
# sources/tax-rate-statement_from-Y-filing-p19-20.pdf (sources.md).
#
# Every PDF but the legal notice is a scan with no text layer. The
# passages cited were typed from the page images into
# sources/*-transcription.txt, each naming the PDF and URL it copies;
# those sources point at the transcription, and their url at the scan.
# The registrar posts no argument against and no rebuttals.

[contest]
