# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom (one area of the school district); who votes
# and who pays; how the bond is repaid and what it needs to pass; what
# the money would pay for and what it may not; the district's tax
# statement; one line per side; what a vote does.
#
# No place or school name is narrated (the narrator mispronounces
# them): the opening says "voters in one area of this school district"
# and the schools are "two elementary schools". The card, title and the
# `voters` line carry the names. "Counsel" is heard as "Council"
# (standard/speakability.txt), so the narration does not say it.
#
# The card quotes the board's own abbreviated form (Exhibit B of its
# resolution); it prints no yes and no sentences, so the card has no
# boxes and the vote lines take their meaning from the impartial
# analysis. The future elementary school is in the impartial analysis,
# not the ballot question, and is attributed to it. The bond total and
# the debt service are repaid from a tax on property in the area, not
# from the district's budget, and no archived source states that
# budget, so they have no budget scale (STANDARD.md 6.5; left open). The
# tax statement's average and highest rates are both $59.81, so the
# fiscal line gives the one rate.
#
# No argument against Measure W is among the registrar's postings. The
# no side says so plainly; its section is marked filed = false.

contest = "ca-2026-11-03-yosemite-unified-sfid-1-measure-w"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "W"
title = "BOND MEASURE for YOSEMITE UNIFIED SCHOOL DISTRICT SCHOOL FACILITIES IMPROVEMENT DISTRICT NO. 1"
origin = "Yosemite Unified School District School Facilities Improvement District No. 1 Resolution No. 2025/2026-19"
summary = "With funds that cannot be taken by the State and spent elsewhere, shall Yosemite Unified School District's measure to repair leaky roofs, plumbing, heating, ventilation, and air-conditioning; renovate classrooms; and, update fire alarms and emergency communication systems at Coarsegold Elementary and Rivergold Elementary be adopted, authorizing $18 million in bonds with legal rates, levies below $60 per $100,000 of assessed valuation ($1.2 million annually) while outstanding, audits, taxpayer oversight, no funds for administrator salaries, and public disclosure of all spending?"

[[section]]
id = "what"
heading = "Measure W"

[[section.line]]
text = "Measure W asks voters in one area of this school district whether to approve $18 million in bonds for elementary schools."
sources = ["ballot-question", "notice", "impartial-analysis"]

[section.line.visual]
