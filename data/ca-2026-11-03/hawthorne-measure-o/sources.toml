# Archived sources for City of Hawthorne Measure O, 2026-11-03 general
# election (sources/la-sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The Los Angeles County Registrar-Recorder/County Clerk's list "Measures
# Appearing on the Ballot" is the authority for the letter and the ballot
# question, quoted on the card; its "Opponents: None submitted." is the
# official statement that no argument against was filed (`measure-list`).
# The City Attorney's impartial analysis and the argument in favor are
# the Registrar's own copies from its Interactive Sample Ballot. The
# impartial analysis is the measure's neutral explanation, the kind a
# state's attorney general's explanatory statement is; it gives no
# revenue estimate. The staff report (the City Council's agenda item,
# with Resolution No. 8613 and Ordinance No. 2264) is cited only for the
# ordinance's own text; its fiscal discussion is the City's and is not
# cited.

