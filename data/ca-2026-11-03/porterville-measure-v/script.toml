# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; how it reached the ballot; how
# an empty council seat is filled today; what would change (appointment
# or special election by the time left, the rule for a majority of
# seats, the vote it needs); no cost estimate; both sides, neither of
# which has an archived argument; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". The card and title carry the
# names.
#
# The Registrar's notice prints two charter amendment questions, each
# headed "CITY OF PORTERVILLE CHARTER AMENDMENT". Measure V's is the one
# whose words match Section 3 of Resolution No. 60-2026 (Charter Section
# 16), not merely the second. The notice prints no yes/no statements:
# so the card has no YES/NO boxes, and both vote lines highlight the
# same phrase of the question.
#
# No impartial analysis was archived: every neutral line rests on the
# notice and on what Resolution No. 60-2026 (as the Registrar posted
# it) records or enacts. Today's rule is the existing Section 16 as
# Section 4 prints it, struck out (read from the page images): the
# Council appoints until the next general municipal election, the Mayor
# fills a seat the Council has not filled within thirty days, and a
# special election is called when a majority of seats are vacant. The
# new text is Exhibit A, which keeps the majority rule and the
# recall exclusion. The resolution's "WHEREAS" finding (that a clear
# process "promotes consistency, continuity of representation") is the
# City's own claim and is not used.
#
# Neither the notice nor the resolution gives a cost figure, so the
# fiscal line says so, naming both.
#
# No argument for or against Measure V was archived (the county's guide
# could not be fetched), and no document says whether any was filed. So
# the sides do not say none was filed: each says none is among the
# documents gathered (filed = false, STANDARD.md 2.5), as for Walnut
# Creek Measure U.

contest = "ca-2026-11-03-porterville-measure-v"
template = "measure"
