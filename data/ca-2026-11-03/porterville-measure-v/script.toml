origin = "NOTICE OF ELECTION FOR TWO CHARTER AMENDMENTS"
summary = "Shall the City Charter be amended to require that vacancies on the City Council be filled by appointment of the City Council when less than one year remains in the unexpired term, and by a special election when one year or more remains in the unexpired term?"

