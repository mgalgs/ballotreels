# Archived sources for City of Porterville Measure V, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The county's site (tularecounty.ca.gov) is behind a Cloudflare
# challenge. The Tulare County Registrar of Voters' page for the City's
# two charter amendments is archived as the Internet Archive's capture
# of October 9, 2026; it prints the Registrar's published notice of
# election, which gives both ballot questions ("each to be presented on
# the individual ballot") and the vote needed. Measure V's question is
# the one that matches Section 3 of Resolution No. 60-2026 (Charter
# Section 16); the other is Measure U's (Section 61, Resolution No.
# 59-2026).
#
# Resolution No. 60-2026, as the Registrar posted it, rescinds and
# replaces the City's June resolution (No. 45-2026) and prints the
# complete text of the amendment (Section 4, the existing Section 16 with
# its deletions struck out and its additions underlined, read from the
# page images; and Exhibit A, the new Section 16). The drafts in the
# City's June 16 and July 21 agenda packets are not used: the
# Registrar's copy wins. No impartial analysis, argument or rebuttal was
# reached (the county's guide is blocked), and no document says whether
# any argument was filed.

