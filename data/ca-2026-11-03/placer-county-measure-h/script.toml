# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; who the County Executive Officer is and how
# the officer is removed today; how it reached the ballot and what it
# needs; what would change and what would not; no cost estimate; both
# sides, which filed nothing; what a vote does.
#
# The card's title is the PDF's own head; its origin and yes and no lines
# are County Counsel's Impartial Analysis (the origin stops before the
# ordinance's number). "Counsel" is heard as "Council", and "county's"
# as "counties" (standard/speakability.txt), and no county name is
# narrated, so the narration says "the impartial analysis", "of the
# county" and "the Measure H voter guide pages". Not a tax measure: the
# pages print no fiscal statement, so the fiscal line says they include
# no cost estimate.
#
# The ballot question gives the measure a purpose ("providing greater
# flexibility in negotiating employment terms for recruitment and
# retention, while preserving Board of Supervisors' oversight"). With no
# argument on either side to answer it, the narration leaves that
# purpose to the card, which quotes it, and says only what the
# impartial analysis says the measure does.
#
# The pages print "NO ARGUMENT IN FAVOR OF MEASURE H WAS SUBMITTED" and
# "NO ARGUMENT AGAINST MEASURE H WAS SUBMITTED": both sides say so,
# filed = false (STANDARD.md 2.5), citing those pages.

contest = "ca-2026-11-03-placer-county-measure-h"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "H"
title = "PROPOSAL TO AMEND PLACER COUNTY CHARTER SECTION 502"
origin = "This measure was placed on the ballot by the Board of Supervisors of the County of Placer"
summary = "Shall the measure amending Article V, Section 502(a) of the Placer County Charter to allow alternative procedures for the removal of the County Executive Officer if specified in an employment agreement, providing greater flexibility in negotiating employment terms for recruitment and retention, while preserving Board of Supervisors’ oversight, be adopted?"
yes = "A “YES” vote on Measure H is a vote to amend the Placer County Charter to allow an employment contract between the Board of Supervisors and the County Executive Officer to establish provisions governing removal of the County Executive Officer."
no = "A “NO” vote on Measure H is a vote to leave the current Charter language unchanged, under which the County Executive Officer may be removed by an affirmative vote of three members of the Board of Supervisors, and the Charter would not authorize an employment contract to provide otherwise."

