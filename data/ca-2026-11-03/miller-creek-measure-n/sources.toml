# Archived sources for Miller Creek School District Measure N, 2026-11-03
# general election (sources/sources.md, its section "Marin County
# Elections measure page, read 2026-10-30"). Every id here may be cited
# by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# The division is the district's Census school district, which the
# Census still names by the district's former name:
# school_district:dixie_elementary_school_district (divisions.tsv:
# "Dixie Elementary School District"). Everywhere a viewer sees it, the
# measure is Miller Creek's.
#
# The County of Marin's page for Measure N (read in a browser and saved
# as text, sources/county-page.txt) prints the ballot question the card
# quotes, the vote it needs ("Votes required to pass: 55% voter
# approval."), County Counsel's impartial analysis (the measure's neutral
# explanation, the kind a state's attorney general's explanatory
# statement is), the District's tax rate statement (the measure's fiscal
# statement), the argument in favor, and the county's statement that no
# argument against was filed. The county's "Full text of Measure N" page
# (sources/county-full-text.txt) is the bond measure: its findings, the
# accountability requirements and the Bond Project List. The findings
# are the District's words of need and benefit and are not narrated.
# The District's own local-funding page is its informational material
# and is not cited.

[contest]
id = "ca-2026-11-03-miller-creek-measure-n"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/school_district:dixie_elementary_school_district"
kind = "measure"
