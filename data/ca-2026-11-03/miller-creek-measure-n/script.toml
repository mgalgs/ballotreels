# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; who placed it and the vote it
# needs; what the money could and could not pay for, and who would check
# the spending; the tax rate statement's estimates; one line per side;
# what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this school district". The card and the
# title carry the names. No person is named.
#
# The card quotes the ballot question as the county's Measure N page
# prints it, its lead-in ("... Classroom Repair/ Upgrade Measure.") as the
# card's title. The page prints "BONDS—YES BONDS—NO", choices rather
# than yes/no sentences, so the card has no boxes and the vote lines take
# their meaning from the question and the impartial analysis.
#
# The neutral lines rest on County Counsel's impartial analysis and the
# measure's full text (neither named aloud: "Counsel" is heard as
# "Council"). The figures are the tax rate statement's,
# attributed to it, as printed: its average is $27.55, not the ballot
# question's rounded $28, which the card shows. The statement gives the
# last year as "fiscal year 2060-61"; it is narrated "2060-2061"
# (standard/speakability.txt). No archived source states the district's
# budget, so the $67 million and the $132.5 million to repay have no
# scale (STANDARD.md 6.5; left open), as for the other school bonds; the
# tax per $100,000 of assessed value and on the average home are
# per-property amounts, exempt.
#
# The yes side is the argument in favor; its "$7 million in state
# matching funds" is its own claim, attributed. The county's page says
# "No argument against Measure N was filed.": the no side says so,
# attributed to the county (filed = false, STANDARD.md 2.5).

contest = "ca-2026-11-03-miller-creek-measure-n"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "county-page"
number = "N"
title = "Miller Creek Elementary School District Classroom Repair/ Upgrade Measure"
origin = "Board of Trustees of the Miller Creek Elementary School District"
summary = "To improve aging local elementary/middle schools by fixing bathrooms, plumbing, roofs, HVAC, and electrical systems; upgrading classrooms to support high quality math, science, technology, reading, writing, arts/music instruction; and improve school security/ student safety, shall Miller Creek Elementary School District’s measure be adopted authorizing $67,000,000 in bonds at legal rates, with levies averaging $28 per $100,000 assessed value ($3,800,000 annually) while bonds are outstanding, independent oversight, audits and all funds locally controlled?"

[[section]]
id = "what"
heading = "Measure N"

[[section.line]]
text = "Measure N asks the voters of this school district whether to approve $67 million in bonds for school repairs and upgrades."
sources = ["county-page"]

[section.line.visual]
kind = "page"
source = "county-page"
highlight = ["authorizing $67,000,000 in bonds"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "placed"
text = "The board of trustees placed Measure N on the ballot, and it needs 55 percent of the vote."
sources = ["impartial-analysis", "county-page"]

[section.line.visual]
kind = "illustration"
name = "school-board-room"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "uses"
text = "The money could pay only for listed projects, such as bathrooms, plumbing, roofs, heating and cooling, and classrooms."
sources = ["impartial-analysis", "text"]

[section.line.visual]
kind = "illustration"
name = "school-roof-repair"

[[section.line]]
id = "salaries"
text = "The bond money could not pay salaries or other operating costs."
sources = ["impartial-analysis", "text"]

[[section.line]]
id = "oversight"
text = "A citizens' oversight committee and yearly audits would review the spending."
sources = ["impartial-analysis", "text"]

[section.line.visual]
kind = "illustration"
name = "inspection-clipboard"

[[section]]
id = "fiscal"
heading = "What the tax statement says"

[[section.line]]
id = "rate"
text = "The district's tax rate statement estimates an average tax of $27.55 per $100,000 of assessed value, and at most $30, through 2060-2061."
sources = ["tax-statement"]

[section.line.visual]
kind = "bars"
title = "Estimated tax per $100,000 of assessed value, dollars"
source = "tax-statement"
unit = ""
labels = ["Average over the bonds' life", "Highest, 2027-28 to 2055-56"]
values = [27.55, 30]

[[section.line]]
id = "home"
text = "For the average home in the district, the statement estimates a tax of about $245."
sources = ["tax-statement"]

[[section.line]]
id = "repay"
text = "The statement puts the total to repay, with interest, at about $132.5 million."
sources = ["tax-statement"]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say most district schools were built 60 to 70 years ago, and Measure N helps qualify for about $7 million in state matching funds."
sources = ["argument-for"]
basis = ["With most MCSD schools built 60 to 70 years ago, aging classrooms need repairs and updates", "Measure N helps MCSD qualify for approximately $7 million in state matching funds"]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Schools built 60 to 70 years ago", "About $7 million in state matching funds"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure N was filed, according to the page for the measure from the county, so only the argument in favor appears there."
sources = ["county-page"]

[section.line.visual]
kind = "list"
source = "county-page"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
