[section.line.visual]
kind = "page"
source = "county-page"
highlight = ["authorizing $67,000,000 in bonds"]

[[question]]
ask = "What would the money pay for?"
lines = ["uses", "salaries"]

[[question]]
ask = "What would it cost a property owner?"
lines = ["rate", "home"]

[[question]]
ask = "Who checks how the money is spent?"
lines = ["oversight"]

[[question]]
ask = "How large is the bond next to the district's budget?"
unanswered = true
