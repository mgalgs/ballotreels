# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; how it reached the ballot; what
# would change (the rate, where the money goes, the oversight, how long
# it lasts and the vote it needs); the revenue estimate as the impartial
# analysis gives it; one line per side; what a vote does.
#
# The guide does not print the ballot question, so the card quotes it
# from Resolution No. 2026-79, as typed from the scan (the OCR has
# "benefiting"; the page prints "benefitting"). The resolution prints
# no yes/no lines, so, as for American Canyon Measure P, the card has
# no YES/NO boxes; the vote lines give the impartial analysis's own
# meanings, and both highlight the same phrase of the question.
#
# How long it lasts: the ballot question says "until ended by voters",
# and the narration says that. (The ordinance's section 3.14.120 lets
# the City Council repeal the chapter; its Section 8 says only a vote
# of the electors may; the narration does not choose between them.)
#
# No tax rate statement or fiscal analysis applies; the $9.4 million a
# year is the impartial analysis's estimate, and no archived source
# states the City's general fund budget to give it a scale (STANDARD.md
# 6.5; left open, under [[question]]). The resolution's and ordinance's
# recitals (the $5.6 million in cuts, the 911 call share, visitors
# paying) are the Council's case, and the supporters' argument makes
# several of them, so the neutral sections leave them out (STANDARD.md
# 6.3).
#
# No argument against Measure P was filed: the guide prints "None
# filed". The no side says so plainly; its section is marked
# filed = false.

contest = "ca-2026-11-03-ceres-measure-p"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "P"
title = "CERES 911 EMERGENCY RESPONSE, COMMUNITY SAFETY, ESSENTIAL SERVICES MEASURE."
origin = "RESOLUTION NO. 2026-79"
summary = "Shall the measure to maintain 911 response/police patrols; hire/retain qualified police officers; prevent gang activity from nearby cities; address homelessness/clear encampments; maintain essential and general city services, by establishing a 1¢ local sales tax providing approximately $9,400,000 annually until ended by voters, requiring independent audits, public spending disclosure, all funds benefitting Ceres residents, no money for the State, with citizens’ oversight, be adopted?"

[[section]]
id = "what"
heading = "Measure P"

[[section.line]]
text = "City of Ceres Measure P asks Ceres voters whether to add a 1 percent sales tax for city services."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["by establishing a 1¢ local sales tax"]

[[section]]
id = "today"
heading = "How it reached the ballot"

[[section.line]]
text = "The City Council placed Measure P on the ballot in June, with one member voting no."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "ballot-box"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "The sales tax rate in Ceres would rise from 8.375 percent to 9.375 percent."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "bars"
title = "Sales tax rate in Ceres"
source = "impartial-analysis"
unit = "%"
labels = ["Today", "With Measure P"]
values = [8.375, 9.375]

[[section.line]]
id = "general"
text = "The money would go into the general fund of the city, for any lawful purpose."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "state-budget"

[[section.line]]
text = "A citizens' oversight committee would review the spending each year."
sources = ["impartial-analysis"]

[[section.line]]
id = "end"
text = "The tax would last until ended by voters, and needs a simple majority to pass."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "end-date"

[[section]]
id = "fiscal"
heading = "What the impartial analysis says"

[[section.line]]
id = "revenue"
text = "The city attorney's impartial analysis estimates that Measure P would raise about $9.4 million a year."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "sales-receipt"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Measure P keeps 911 response times fast, and prevents any further budget cuts that threaten public safety."
sources = ["arguments"]
basis = ["Maintains fast 911 response times by ensuring Ceres has enough First", "Yes on P prevents any further budget cuts that threaten our safety."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Keeps 911 response fast", "Prevents further budget cuts"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "The Stanislaus County voter guide says that no argument against Measure P was filed by anyone in this election."
sources = ["arguments"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote on Measure P authorizes the 1 percent sales tax."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["by establishing a 1¢ local sales tax"]

[[section.line]]
text = "A no vote on Measure P does not authorize the 1 percent sales tax."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["by establishing a 1¢ local sales tax"]

[[question]]
ask = "When would the tax end?"
lines = ["end"]

[[question]]
ask = "What can the money be spent on?"
lines = ["general"]

[[question]]
ask = "How big is $9.4 million a year next to the city budget?"
unanswered = true
