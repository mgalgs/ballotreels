# Archived sources for City of Ceres Measure P, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The Stanislaus County Registrar of Voters prints Measure P's full
# text, the City Attorney's impartial analysis and the argument in favor
# on PDF pages 77-89 of its bilingual Voter Information Guide;
# sources/vig-measure-p-pdfpp77-89.pdf is those pages cut from it, and
# every source from it cites the full guide's URL with the pages. The
# guide does not print the ballot question: it is quoted from City of
# Ceres Resolution No. 2026-79, Section 2, which submits it to the
# voters. The resolution is a scan whose text layer is rough OCR: its
# ballot question, Section 1 and adoption vote were typed from the page
# images into sources/resolution-2026-79-transcription.txt, which names
# the PDF and URL it copies; that source points at the transcription,
# and its url at the scan (as American Canyon Measure P's does). The
# City Attorney's impartial analysis is the measure's neutral
# explanation, the kind a state's attorney general's explanatory
# statement is. No tax rate statement or fiscal analysis applies (a
# sales tax); the one revenue estimate is the analysis's. The guide
# prints "None filed" under the argument against, and no rebuttals.

[contest]
id = "ca-2026-11-03-ceres-measure-p"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:ceres"
kind = "measure"
title = "City of Ceres Measure P: A 1¢ Local Sales Tax Until Ended by Voters"

