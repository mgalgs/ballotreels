# Archived sources for City of Ontario Measure H, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1). The guide's pages are cut from the San
# Bernardino County Registrar of Voters' comprehensive Voter Information
# Guide (VIG.pdf, PDF pages 206-209); "page" is the guide's printed
# footer number (SB COMPREHENSIVE-204 is PDF page 206).
#
# The guide prints no ballot question; the card quotes it from the City
# Council's resolution placing the measure (Section 3, and again in
# Resolution No. 2026-137).

[contest]
id = "ca-2026-11-03-ontario-measure-h"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:ontario"
kind = "measure"
title = "City of Ontario Measure H: Half-Cent General Sales Tax"

