# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; how a parcel tax is charged and what it needs
# to pass; how long it runs, who may be exempt and what the money is for;
# the ballot question's revenue estimate; one line per side; what a vote
# does.
#
# No place name is narrated (the narrator mispronounces them): the opening
# says "the voters of this school district". The card and title carry the
# names. "Counsel" is heard as "Council" (standard/speakability.txt), so
# the narration does not say it.
#
# The card quotes the County of Monterey Elections Department's List of
# Local Measures, which prints the ballot question with no yes and no
# sentences, so the card has no boxes and the vote lines take their
# meaning from the impartial analysis. The ballot question's $800,000 a
# year is district revenue, and no archived source states the district's
# budget, so it has no scale (STANDARD.md 6.5; left open). The $85 per
# parcel is exempt.
#
# Every purpose the analysis lists is also in the supporters' list, and a
# voter needs to know what the tax pays for, so the change section names
# them as the analysis does; the supporters' line keeps to their other
# points (local control of the money, keeping teachers and staff), and the
# neutral sections leave out the oversight and the ban on administrator
# pay, which they also cite (STANDARD.md 6.3).
#
# The list links no argument against Measure K. The no side says so
# plainly; its section is marked filed = false.

contest = "ca-2026-11-03-pacific-grove-unified-measure-k"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "measure-list"
number = "K"
title = "Pacific Grove Unified School District"
origin = "2/3 Voter Approval Required"
summary = "With funds that cannot be taken by State or Federal government officials and spent elsewhere, shall Pacific Grove Unified School District's parcel tax measure enhancing reading and math programs; improving services for students with disabilities; keeping before- and after-school programs affordable; and supporting student mental health counseling at Forest Grove Elementary School, Robert Down Elementary School, Pacific Grove Middle School, Pacific Grove Adult Education Center, Pacific Grove Community High School and Pacific Grove High School be adopted at $85 per parcel for five years (raising approximately $800,000 annually), no administrator salaries, pensions or benefits, and full disclosure of spending?"

[[section]]
id = "what"
heading = "Measure K"

[[section.line]]
text = "Measure K asks the voters of this school district whether to approve a parcel tax of $85 a year for five years."
sources = ["measure-list", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "measure-list"
highlight = ["at $85 per parcel for five years"]

[[section]]
id = "today"
heading = "How a parcel tax works"

[[section.line]]
id = "parcel"
text = "A parcel tax charges the same amount on each parcel of taxable land in the district, whatever its value."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "city-parcels"

[[section.line]]
id = "threshold"
text = "Measure K needs two-thirds of the vote to pass."
sources = ["impartial-analysis", "measure-list"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "years"
text = "The tax would be collected each year from 2026-2027 through 2031-2032."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "timeline"
source = "impartial-analysis"
labels = ["2026-2027", "2031-2032"]
items = ["First year of the tax", "Last year of the tax"]

[[section.line]]
id = "exempt"
text = "Some people over 65, and people receiving supplemental security income for a disability, could apply to be exempt."
sources = ["impartial-analysis"]

[[section.line]]
id = "uses"
text = "The money would go to reading and math programs, services for students with disabilities, before- and after-school programs, and mental health counseling."
sources = ["impartial-analysis", "measure-list"]

[section.line.visual]
kind = "illustration"
name = "school-classroom"

[[section]]
id = "fiscal"
heading = "What the ballot question says"

[[section.line]]
id = "revenue"
text = "The ballot question says the tax would raise about $800,000 a year."
sources = ["measure-list"]

[section.line.visual]
kind = "page"
source = "measure-list"
highlight = ["raising approximately $800,000 annually"]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say the money stays local, unable to be taken by the state or federal government, and helps keep strong teachers, counselors and staff."
sources = ["argument-for"]
basis = ["A YES vote on Measure _ will provide Pacific Grove schools with locally controlled funding that cannot be taken by the State or federal government and spent elsewhere.", "Retain strong educators, counselors and staff who know our students and are dedicated to helping them succeed."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Money stays under local control", "Keeps teachers, counselors and staff"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure K was filed, so the list of local measures from the county shows only the argument in favor of the measure."
sources = ["measure-list"]

[section.line.visual]
kind = "list"
source = "measure-list"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote is in favor of a parcel tax of $85 per parcel each year for five years, for the purposes the measure sets out."
sources = ["impartial-analysis", "measure-list"]

[section.line.visual]
kind = "page"
source = "measure-list"
highlight = ["at $85 per parcel for five years"]

[[section.line]]
text = "A no vote is against the parcel tax."
sources = ["impartial-analysis", "measure-list"]

[section.line.visual]
kind = "page"
source = "measure-list"
highlight = ["be adopted"]

[[question]]
ask = "How much would my parcel pay, and for how long?"
lines = ["parcel", "years"]

[[question]]
ask = "Who can be exempt?"
lines = ["exempt"]

[[question]]
ask = "What would the money pay for?"
lines = ["uses"]

[[question]]
ask = "How large is $800,000 next to the district's budget?"
unanswered = true
