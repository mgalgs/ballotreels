# Archived sources for Paso Robles Joint Unified School District Measure
# G, 2026-11-03 general election (sources/sources.md). Every id here may
# be cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# The San Luis Obispo County Clerk-Recorder prints each ballot type's
# County Voter Information Guide as one PDF; pages 33 to 43 of Ballot
# Type 1 (full text, impartial analysis, tax rate statement, argument in
# favor, argument against, rebuttal to the argument against, and the
# notice that no rebuttal to the argument in favor was filed) were cut
# into one excerpt, which backs every source here. The guide's full text
# opens with the ballot question. The ballot labels the measure "Measure
# G-26"; the project names it by its bare letter. County Counsel's
# impartial analysis is the measure's neutral explanation; the
# district's Tax Rate Statement is its fiscal statement. The county's
# separate postings of the resolution, notice, analysis and arguments
# (sources/) are archived but not cited: the guide prints all of them.
#
# The district also lies in Monterey County, which is not staged here;
# San Luis Obispo County, where the district's city lies, keeps the
# plain name.

