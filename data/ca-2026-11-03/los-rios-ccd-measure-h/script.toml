# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and of whom; how a college bond is repaid and what it needs to
# pass; what the money would pay for; the district's tax statement; one
# line per side; what a vote does.
#
# The card's title is the item's own head on the county's Current
# Measure Information page; its origin and yes and no lines are County
# Counsel's Impartial Analysis. "Counsel" is heard as "Council"
# (standard/speakability.txt), so the narration does not say it. The
# bond total and the debt service are repaid from a tax on property in
# the improvement district, and no archived source states the
# district's budget, so they have no budget scale (STANDARD.md 6.5; left
# open). The fiscal line gives the tax statement's highest rate beside
# its average, as it prints both, with both years in full.
#
# Whether Measure H raises taxes is part of what the two sides dispute
# (supporters: "WITHOUT RAISING TAXES"; opponents: "another forever
# multi-year tax obligation on property owners"), so the neutral sections
# give only the tax statement's rates and years and leave the ballot
# question's "no increase in tax rates" to the card (STANDARD.md 6.3).
# Sides come from the argument in favor and the argument against, not the
# rebuttals.

contest = "ca-2026-11-03-los-rios-ccd-measure-h"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-label"
number = "H"
title = "Measure H: Los Rios Community College District School Facilities Improvement District No. 1"
origin = "Measure H was placed on the ballot by the governing board of the Los Rios Community College School Facilities District No.1 (“District”)."
summary = "With funds that cannot be taken by the State, public disclosure of all spending, and no increase in tax rates, shall Los Rios Community College District's measure to prepare students, workers, veterans for jobs with affordable college and career training facilities; provide safe drinking water; and repair leaky roofs be adopted authorizing $1.1 billion in bonds with legal rates, average levies below $17 per $100,000 assessed valuation ($74,500,000 annually while outstanding), independent audits, oversight, and all funds staying local?"
yes = "A “YES” vote on Measure H means you wish to allow the District to issue bonds in an amount not to exceed $1.1 billion dollars."
no = "A “NO” vote on Measure H means you do not wish to allow the District to issue the proposed bonds."

[[section]]
id = "what"
heading = "Measure H"

[[section.line]]
text = "Los Rios Community College District Measure H asks voters in part of the district whether to approve $1.1 billion in college bonds."
sources = ["ballot-label", "tax-statement"]

[section.line.visual]
kind = "page"
source = "ballot-label"
highlight = ["$1.1 billion in bonds"]

[[section]]
id = "today"
heading = "How a college bond works"

[[section.line]]
text = "The district would borrow the money and repay it from a tax on property in that part of the district."
sources = ["tax-statement"]

[section.line.visual]
kind = "illustration"
name = "bond-certificates"

[[section.line]]
text = "Measure H needs 55 percent of the vote to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "The money would pay for college career training facilities, safe drinking water and roof repairs."
sources = ["ballot-label"]

[section.line.visual]
kind = "illustration"
name = "university-hall"

[[section]]
id = "fiscal"
heading = "What the tax statement says"

[[section.line]]
text = "The district's tax statement estimates an average tax of $16.55 per $100,000 of assessed value, and at most $20.80, through 2050-2051."
sources = ["tax-statement"]

[section.line.visual]
kind = "illustration"
name = "debt-payments"

[[section.line]]
text = "The statement estimates the total to repay, with interest, at about $1.79 billion."
sources = ["tax-statement"]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Measure H keeps local colleges affordable and fixes leaky roofs and drinking water, all without raising taxes."
