# Archived sources for Los Rios Community College District Measure H,
# 2026-11-03 general election (sources/sources.md). Every id here may be
# cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# Sacramento County publishes no single Voter Information Guide PDF (each
# voter's guide is issued through a portal); its "Current Measure
# Information" page prints each measure's ballot question, County
# Counsel's Impartial Analysis, full text, tax rate statement, arguments
# and rebuttals. sources/county-measure-page-item.txt is the text of
# Measure H's item on that page; every source cites it.
#
# School Facilities Improvement District No. 1 is part of the Los Rios
# Community College District and has no Census boundary, so the
# measure's division is the county and `voters` names it
# (docs/SCRIPT-FORMAT.md). Yolo County also lists Measure H for its voters
# inside the improvement district; that county's contest is not staged
# here.

[contest]
id = "ca-2026-11-03-los-rios-ccd-measure-h"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/county:sacramento"
kind = "measure"
title = "Los Rios Community College District Measure H: College Facility Bonds"
voters = "the Los Rios Community College District School Facilities Improvement District No. 1"

[[source]]
id = "ballot-label"
kind = "official-title-summary"
publisher = "Sacramento County Voter Registration and Elections, Current Measure Information, November 3, 2026, General Election: Measure H's ballot question, and the Impartial Analysis's statement of what a vote does"
credit = "Current Measure Information, Sacramento County"
url = "https://elections.saccounty.gov/us/en/election-information/current-measure-information.html"
file = "sources/county-measure-page-item.txt"
retrieved = "2026-10-28"

