# Archived sources for Pleasant Ridge Union Elementary School District
# Measure M, 2026-11-03 general election (sources/sources.md). Every id
# here may be cited by script.toml. `kind` must be one the standard
# allows (docs/STANDARD.md, section 1).
#
# Nevada County Elections prints each local measure in Section 3 of its
# Voter Information Guide; pages 56 to 62 of the guide's PDF were cut
# into one excerpt, which backs every source here. The Impartial
# Analysis is the measure's neutral explanation; the District's Tax Rate
# Statement is its fiscal statement. The guide prints an argument in
# favor and "No Argument Against Measure M was submitted", and no
# rebuttals.

[contest]
id = "ca-2026-11-03-pleasant-ridge-elementary-measure-m"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/school_district:pleasant_ridge_union_elementary_school_district"
kind = "measure"
title = "Pleasant Ridge Union Elementary Measure M: School Repair Bonds"

