[[section.line]]
text = "No argument against Measure M was submitted for the voter guide that the county election office printed on this measure."
sources = ["arguments"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote is in favor of letting the district issue and sell up to $19.8 million in bonds."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["a vote in favor of authorizing"]

[[section.line]]
