# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; how a school bond is repaid and what it
# needs to pass; what the money would pay for; the district's tax rate
# statement; one line per side; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this school district". The card and title
# carry the names. "Counsel" is heard as "Council"
# (standard/speakability.txt), so the narration does not say it.
#
# Tehama County posts no voter guide for this election, and its page
# labels the measure "Los Molinos Elementary School District"; the
# district's resolution and the impartial analysis say Unified, and so
# do the title and division. The card quotes the board's ballot label
# (Exhibit A of its Resolution No. 6-18-26B), transcribed from the scan
# the county posts, without the quotation marks the exhibit sets around
# it. It prints no yes and no sentences, so the card has no boxes and
# the vote lines take their meaning from the impartial analysis, both
# highlighting the same phrase of the question.
#
# The bond total and the debt service are repaid from a tax on property
# in the district, not from the district's budget, and no archived
# source states that budget, so they have no budget scale (STANDARD.md
# 6.5; left open). The tax statement's average ($58.97) and highest
# ($60.00) rates are both said; its fiscal year is written in full
# (standard/speakability.txt). The schools' age, the state matching
# funds, the bar on paying salaries, the audits and the oversight
# committee are in the argument in favor, so the neutral sections leave
# them out (STANDARD.md 6.3); the card shows the question's own words.
# The supporters' line names no figure for the matching funds, so it
# needs no scale.
#
# No argument against Measure G is posted by the county, and it is not
# known whether one was filed (no guide is posted), so the no side says
# none is among the filings posted (filed = false, STANDARD.md 2.5).

contest = "ca-2026-11-03-los-molinos-unified-measure-g"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "G"
title = "BALLOT LABEL"
origin = "RESOLUTION NO. 6-18-26B"
summary = "To improve local schools; modernize/upgrade old classrooms, restrooms and school facilities; improve career technical education classrooms and labs; make safety and security improvements; construct a new elementary gymnasium; and construct new classrooms, shall Los Molinos Unified School District issue $9,800,000 of bonds at legal rates, generating on average $608,000 annually while bonds are outstanding at a rate of $59 per $100,000 assessed value, with annual audits, independent citizens' oversight, NO money for salaries and all money staying local?"

[[section]]
id = "what"
heading = "Measure G"

[[section.line]]
text = "Measure G asks the voters of this school district whether to approve $9.8 million in school bonds."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["issue $9,800,000 of bonds"]

[[section]]
