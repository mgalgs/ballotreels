# Archived sources for Los Molinos Unified School District Measure G,
# 2026-11-03 general election (sources/sources.md). Every id here may be
# cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# Tehama County Elections posts no local voter guide for this election:
# it posts each measure's filed documents separately on its elections
# page, where it labels this one "Los Molinos Elementary School
# District"; the district's own resolution and the impartial analysis
# say Los Molinos Unified School District, as divisions.tsv does. The
# district's Resolution No. 6-18-26B is a scan with no text layer; the
# passages used were typed from the page images into
# sources/resolution-transcription.txt (it names the PDF and URL it
# copies): Exhibit A, the ballot label (the ballot question); Exhibit B,
# the full ballot text with its project list; and Exhibit C, the tax
# rate statement, the measure's fiscal statement. County Counsel's
# impartial analysis is the neutral explanation, and the argument in
# favor is as filed (a scan, transcribed the same way; the argument page
# names no signers). No argument against or rebuttal is posted; whether
# one was filed is not known.
#
# A unified school district with a Census boundary: the division is its
# school_district.

[contest]
id = "ca-2026-11-03-los-molinos-unified-measure-g"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/school_district:los_molinos_unified_school_district"
kind = "measure"
title = "Los Molinos Unified School District Measure G: School Facility Bonds"

