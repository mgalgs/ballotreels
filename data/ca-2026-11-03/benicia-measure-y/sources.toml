# Archived sources for City of Benicia Measure Y, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# No printed Solano County voter guide was archived: these are the filed
# documents the Solano County Registrar of Voters posts on its Current
# Election Information page. The ballot question is quoted from
# Resolution No. 26-81, which orders it (its Section 4); the Registrar's
# corrected Notice of Measures (August 10, 2026) prints the same
# question. The City Attorney's impartial analysis is the measure's
# neutral explanation; it gives no cost estimate, and no fiscal
# statement applies. The argument against is a scan with no text layer:
# the passages `check` reads verbatim were typed from the page image into
# sources/argument-against-transcription.txt, which names the PDF and URL
# it copies; that source points at the transcription, and its url at the
# scan. The rebuttals are not cited.

[contest]
id = "ca-2026-11-03-benicia-measure-y"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:benicia"
kind = "measure"
title = "City of Benicia Measure Y: Limited City Charter"

