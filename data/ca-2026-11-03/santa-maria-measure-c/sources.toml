# Archived sources for Santa Maria Measure C, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# Santa Barbara County Elections prints each ballot type's County Voter
# Information Guide as one PDF; pages 26 to 31 (impartial analysis,
# argument in favor, full text) and 36 to 37 (sample ballot) of Ballot
# Type 73 were cut into one excerpt, which backs every source here. The
# ballot labels the measure "Measure C2026"; the project names it by its
# bare letter. The City Attorney's impartial analysis is the measure's
# neutral explanation and gives the one revenue estimate; no tax rate
# statement or fiscal analysis applies to a sales tax. No argument
# against was filed, and no rebuttals are printed. The City Council's
# resolution placing the measure was not obtained (the City's site
# refused the download); the guide prints the ordinance in full.

[contest]
id = "ca-2026-11-03-santa-maria-measure-c"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:santa_maria"
kind = "measure"
title = "Santa Maria Measure C: Half-Cent Sales Tax for City Services"

