# Archived sources for Acalanes Union High School District Measure W,
# 2026-11-03 general election (sources/sources.md). Every id here may be
# cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# Contra Costa County Elections' page for Measure W
# (sources/county-page.txt, read in a browser, since contracostavote.gov
# answers scripted fetches with a bot challenge) prints the ballot
# question, County Counsel's impartial analysis, the argument in favor,
# the argument against and both rebuttals. County Counsel's impartial
# analysis is the measure's neutral explanation, the kind a state's
# attorney general's explanatory statement is. The county's question is
# word for word the one the card quotes from Exhibit B.
#
# The District's official text archived is the Governing Board's executed Resolution No. 26-27-01 (adopted August
# 5, 2026), whose Exhibit A is the full text of the measure and Exhibit B
# its ballot question. The card quotes Exhibit B, and every neutral line
# rests on the resolution, with the impartial analysis cited beside the
# lines it supports. The District's "Measure W Resolution" web page
# (sources/district-measure-w-resolution-page.html) prints the same
# question and part of Exhibit A; it is the District's own material and
# is not cited, since the scan is readable. A parcel tax has no tax rate
# statement: the measure's revenue figure is in its ballot question.
#
# The resolution is a scan with no text layer. The pages cited were typed
# from the page images into sources/resolution-26-27-01-transcription.txt,
# which names the PDF and URL it copies; both sources point at the
# transcription, and their url at the scan.

[contest]
id = "ca-2026-11-03-acalanes-high-measure-w"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/school_district:acalanes_union_high_school_district"
kind = "measure"
title = "Acalanes Union High School District Measure W: Parcel Tax for Educational Programs"

[[contest.correction]]
date = "2026-10-30"
note = "The video now gives the arguments for and against printed by the county, which it had said were not among the documents gathered."

