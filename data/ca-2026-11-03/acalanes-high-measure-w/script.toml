# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; the district's parcel taxes today; what it
# needs to pass; what the money may pay for, its limits and who is
# exempt; the revenue figure; both sides, from the arguments printed on
# the county's page; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the opening
# says "the voters of this high school district". The card and title
# carry the names.
#
# Every neutral line rests on the Governing Board's Resolution No.
# 26-27-01 and its Exhibit A, the measure's full text; County Counsel's
# impartial analysis, printed on the county's page, is cited beside the
# lines it supports. It says "the current parcel tax would be increased
# by $168" and that the total would be $469 a parcel; the measure's text
# says it "does not impact the existing parcel taxes". Both say the two
# existing taxes stay and the new $168 is added to them, so the line on
# the existing taxes stands, citing the measure's text only. The card
# quotes Exhibit B, the ballot question, and names the resolution as its
# document, as San Mateo County's resolution cards do. The resolution
# prints no yes or no lines, so the card has none; the vote lines
# highlight the question's own phrases. The District's web pages are not
# cited. The ballot question's $6,000,000 a year is district revenue,
# and no archived source states the district's budget, so it has no
# scale (STANDARD.md 6.5; left open). $168 and $301 are amounts per
# parcel (exempt).
#
# The sides come from the argument in favor and the argument against on
# the county's page, not from the rebuttals, each line on what its
# argument leads with and comes back to (for: protecting the schools'
# quality after years of short state funding, and cuts that will
# continue without it; against: a spending problem, not a revenue one,
# and a bigger tax after voters rejected one last year). No signer,
# school or earlier measure is named.

contest = "ca-2026-11-03-acalanes-high-measure-w"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "W"
title = "EDUCATION PARCEL TAX"
origin = "GOVERNING BOARD ACALANES UNION HIGH SCHOOL DISTRICT"
summary = "Shall the measure supporting high-quality education in local high schools by: • Attracting/retaining highly qualified teachers • continuing advanced academic programs in science, technology, engineering, math, and arts that prepare students for success in college and careers • maintaining manageable class sizes with Acalanes Union High School District levying a $168 parcel tax for eight years, with senior exemptions, citizens' oversight and independent audits, providing $6,000,000 annually in local school funding that cannot be taken by the State, be adopted?"

[[section]]
id = "what"
heading = "Measure W"

[[section.line]]
id = "rate"
text = "Measure W asks the voters of this high school district whether to levy a parcel tax of $168 a parcel for eight years, beginning with the 2027-2028 fiscal year."
sources = ["text", "ballot-question"]

[section.line.visual]
