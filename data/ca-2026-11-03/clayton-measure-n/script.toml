# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; what the tax pays for and what
# it is today, with its end date; what would change (ten more years, the
# new rate, yearly raises within a cap, the two-thirds vote); that the
# analysis gives no revenue estimate; one line per side; what a vote
# does.
#
# The card quotes the ballot question from the City Clerk's Notice of
# Special Measure Election, which prints no yes/no lines. So, as for
# Brisbane Measure X, the card has no YES/NO boxes, the vote lines give
# the impartial analysis's meanings, and both highlight the same phrase
# of the question.
#
# The yearly increase with inflation is on the ballot itself ("including
# annual inflationary adjustments") and in the impartial analysis, so the
# neutral section states it as the analysis does, with its 3 percent
# cap; that the tax "would rise with inflation" is also the opponents'
# first point, and their line says it as theirs. The tax rates are per
# parcel or per acre, exempt from a budget scale (STANDARD.md 6.5). The
# impartial analysis gives no revenue estimate, and the county's guide
# could not be fetched, so the fiscal line names the analysis, not the
# guide; the argument in favor's $1.5 million a year is that side's, and
# is left out with its scale unknown.

contest = "ca-2026-11-03-clayton-measure-n"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "N"
title = "CITYWIDE LANDSCAPE MAINTENANCE EXTENSION AND ALTERATION OF RATE OF EXISTING SPECIAL TAX"
origin = "CITY OF CLAYTON – MEASURE N"
summary = "Shall the measure to fund on-going trail system operations and maintenance, roadway landscaping, open space weed abatement, and related services of the Clayton Community Facility District No. 2007-1 (Citywide Landscape Maintenance) by extending the special tax for ten years and amending its rate and methodology to $354.45/year per residential parcel and $354.45/year per non-residential acre, including annual inflationary adjustments, subject to citizen’s committee oversight, be approved?"

[[section]]
id = "what"
heading = "Measure N"

[[section.line]]
text = "City of Clayton Measure N asks the voters of Clayton whether to extend and raise the special tax for trails and landscaping."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["extending the special tax for ten years"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "since-2007"
text = "Since 2007, the tax has paid for trails, roadway landscaping and weed clearing on open space, and it ends in June 2027."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "open-space-hills"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "rate-new"
text = "Measure N would extend the tax to June 2037 and raise it from $312.84 to $354.45 a year for each home parcel, or each acre of other property."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "bars"
title = "Yearly tax per home parcel"
source = "impartial-analysis"
unit = "dollars"
labels = ["Today", "From July 2027"]
values = [312.84, 354.45]

[[section.line]]
id = "inflation"
text = "After that, the City Council could raise the rate with inflation, up to 3 percent a year."
sources = ["impartial-analysis"]

[[section.line]]
id = "threshold"
text = "Measure N needs two-thirds of the votes cast to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "fiscal"
heading = "What the impartial analysis says"

[[section.line]]
id = "revenue"
text = "The impartial analysis does not include an estimate of how much the tax would raise."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say the general fund cannot adequately pay for landscaping and trails, and the tax supports fire mitigation in open spaces."
