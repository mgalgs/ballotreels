# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks; how the transfer tax works today and the foreclosure exception;
# how it reached the ballot; what would change (foreclosure transfers
# taxed, the exceptions kept, where the money goes); the City Auditor's
# revenue and cost estimates beside the ballot question's own; one line
# per side; what a vote does.
#
# The City Auditor's Impartial Analysis is the fiscal statement. Its
# first-year estimate ($10.4 million to $13.8 million) differs from the
# ballot question's ($4-$13 million annually), which the card shows, so
# the fiscal section says both. No archived source states the city's
# general fund budget, so neither has a scale (STANDARD.md 6.5; left
# open).
#
# No argument against was submitted (the guide says so), so the no side
# says that and nothing more (filed = false). The guide's analyses print
# no "yes" and "no" statements, so the vote lines take their meanings
# from the ballot question, as Utah's do.

contest = "ca-2026-11-03-oakland-measure-ff"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide-page"
number = "FF"
title = "CITY OF OAKLAND"
origin = "This Measure was placed on the ballot by the City Council."
summary = "Shall the measure amending Oakland’s Real Property Transfer Tax Ordinance to eliminate the foreclosure exception for all property transfers except transfers converting commercial property to certain housing or healthcare uses, transfers to community banking organizations, and certain transfers of residential properties of four units or less, and allowing the City Council to establish, amend, or remove foreclosure-related exceptions, raising approximately $4-$13 million annually pursuant to tax rates in Oakland Municipal Code section 4.20.020, beginning January 1, 2027 until repealed, be adopted?"

[[section]]
id = "what"
heading = "Measure FF"

[[section.line]]
text = "City of Oakland Measure FF asks voters in the city whether to apply its real property transfer tax to most transfers made through foreclosure."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["eliminate the foreclosure exception"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Oakland taxes certain transfers of real property, but transfers made through foreclosure are generally exempt."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "homestead"

[[section.line]]
text = "The City Council placed Measure FF on the ballot, and it needs a simple majority to pass."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "ballot-box"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "From January 2027, foreclosure transfers would be taxed at the rates already in city law."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "end-date"

[[section.line]]
text = "Exceptions would remain for buildings turned into certain housing or health care, for community banks, and for some homes of four units or less."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "renovated-house"

[[section.line]]
text = "The City Council could change those exceptions, and the money could be used for any city purpose."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "state-budget"

[[section]]
id = "fiscal"
heading = "What the City Auditor says"

[[section.line]]
text = "The City Auditor estimates the tax would raise between 10.4 and 13.8 million dollars in its first year, at a cost to the city of about 593 to 651 thousand dollars."
sources = ["auditor"]

[section.line.visual]
kind = "illustration"
name = "special-tax"

[[section.line]]
text = "The ballot question itself estimates 4 to 13 million dollars a year."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["raising approximately $4-$13 million annually"]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say investors who take property through foreclosure avoid a tax families pay, and Measure FF would close that loophole."
sources = ["arguments"]
basis = ["When families buy homes, they pay Oakland’s real property transfer tax.", "But when hedge funds or investors acquire property through foreclosure or deed-in-lieu transfers they are exempt", "Measure FF closes this loophole so foreclosure transfers are taxed fairly."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Investors stop avoiding a tax families pay", "Homeowners in foreclosure stay exempt"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure FF was submitted, and none appears in the Alameda County Composite Voter Information Guide for this election."
sources = ["arguments"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote means most transfers made through foreclosure in Oakland would be taxed."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["eliminate the foreclosure exception"]

[[section.line]]
text = "A no vote means the foreclosure exception stays as it is."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["eliminate the foreclosure exception"]
