# Archived sources for Fresno County Measure A, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The Fresno County Registrar of Voters posts each measure's filed
# documents on its election page; no printed Voter Information Guide
# was found online. The ballot question is quoted from Board of
# Supervisors Resolution No. 26-257, Section 5, whose recitals also say
# who votes: "the voters of Fresno County, including the voters of both
# the incorporated and the unincorporated areas", at a countywide
# election. So, although the tax applies only in the unincorporated
# area, the measure is on every county voter's ballot: the division is
# the county and there is no `voters` line. County Counsel's impartial
# analysis is the measure's neutral explanation, the kind a state's
# attorney general's explanatory statement is. The Auditor-Controller/
# Treasurer-Tax Collector's fiscal impact statement is the measure's
# official fiscal statement.
#
# Every PDF is a scan with no text layer. The passages cited were typed
# from the page images into sources/*-transcription.txt, each naming the
# PDF and URL it copies; those sources point at the transcription, and
# their url at the scan (as Clayton Measure M's do). The rebuttals are
# archived but not cited.

[contest]
