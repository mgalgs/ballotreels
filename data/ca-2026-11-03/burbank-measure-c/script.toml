# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; how it reached the ballot and the
# vote it needs; the rate today and since when; what would change (the
# new rate and start date, who pays, where the money goes and for how
# long); the revenue estimate; the argument for, and that no argument
# against was submitted; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". The card shows the name.
#
# The card quotes the measure's entry in the county's list "Measures
# Appearing on the Ballot", which prints no yes/no meanings, so the card
# has no boxes; the vote lines take both meanings from the impartial
# analysis and highlight the same phrase of the question.
#
# The ordinance's recitals on the City's projected deficit and on other
# cities' higher rates are left out of the neutral sections: the argument
# for makes both points (STANDARD.md 6.3).
#
# The $3 million a year is the City's estimate, as the ballot question
# and the impartial analysis both give it. No archived source states the
# City's General Fund budget, so it is given without a scale (STANDARD.md
# 6.5; left open, under [[question]]).
#
# Sides: the argument in favor, signed by the mayor, vice mayor and three
# council members, is presented from its text; the county's list says
# "Opponents: None submitted.", and the no side says so (filed = false).

contest = "ca-2026-11-03-burbank-measure-c"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "C"
title = "CITY OF BURBANK"
origin = "VOTE PASSAGE – Majority Vote 50%+1"
summary = "CITY OF BURBANK CITY SERVICES MEASURE: MEASURE C: To maintain services including fire, paramedic, police, 911 response; prepare for/respond to wildfires/other disasters; prevent property crimes; keep public areas/neighborhoods clean/safe; address homelessness; support youth programs, senior services, other general city services; shall the measure increasing Burbank's transient occupancy tax, paid only by hotel/motel guests, from 10% to 12%, providing approximately $3,000,000 annually until ended by voters, requiring audits, spending disclosures, funds used locally, be adopted?"

[[section]]
id = "what"
heading = "Measure C"

[[section.line]]
text = "Measure C asks the voters of this city whether to raise the tax on hotel and motel stays from 10 percent to 12 percent."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["increasing Burbank's transient occupancy tax"]

[[section]]
id = "background"
heading = "How it reached the ballot"

[[section.line]]
text = "The City Council placed Measure C on the ballot; as a general tax, it needs a simple majority to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "city-council-chamber"

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "today-rate"
text = "Today, hotel guests pay a 10 percent tax on the rent for a room, a rate that has not risen since 1983."
sources = ["impartial-analysis", "text"]

[section.line.visual]
kind = "illustration"
name = "hotel-front-desk"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "rate"
text = "The rate would rise to 12 percent on January 1, 2027, paid only by hotel guests, who are mostly visitors."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "city-hotel"

[[section.line]]
id = "uses"
text = "The money would go into the general fund for local city services, with a yearly financial report, until voters end the tax."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "state-budget"

[[section]]
id = "fiscal"
heading = "What it would raise"

[[section.line]]
id = "revenue"
text = "The impartial analysis says the city estimates the increase would bring in $3 million a year in added revenue."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "special-tax"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say visitors would help pay the cost of the city services they use, and the money stays in the city for local priorities."
sources = ["argument-for"]
basis = ["Measure C would ensure visitors pay their fair share of the cost of maintaining those services.", "The funding stays in Burbank and cannot be used by the state or federal government.", "It can only be used to support local priorities"]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Visitors help pay for services", "Money stays local"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "The official county list of measures for this election says that no argument against Measure C was submitted, by any group or person."
sources = ["arguments-filed"]

[section.line.visual]
kind = "list"
source = "arguments-filed"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote is a vote for the 2 percent increase in the hotel tax."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["increasing Burbank's transient occupancy tax"]

[[section.line]]
text = "A no vote is a vote against an increase in the hotel tax."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["increasing Burbank's transient occupancy tax"]

[[question]]
ask = "Who pays the tax?"
lines = ["rate"]

[[question]]
ask = "What would the money pay for, and for how long?"
lines = ["uses"]

[[question]]
ask = "How big is $3 million a year next to the city budget?"
unanswered = true
