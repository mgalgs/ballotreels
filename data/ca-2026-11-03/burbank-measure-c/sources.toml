# Archived sources for City of Burbank Measure C, 2026-11-03 general
# election (sources/la-sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The Los Angeles County Registrar-Recorder/County Clerk's list "Measures
# Appearing on the Ballot" (sources/county-measure-list-excerpt.txt, the
# measure's entry) gives its letter, vote threshold and ballot question,
# which the card quotes, and, on its "Supporters: ... Opponents: ..."
# line, that the City Council filed the argument for and that no argument
# against was submitted: the no side cites it as the official statement
# of filing.
#
# The City Attorney's impartial analysis, the full text of the ordinance
# and the argument in favor are the Registrar's copies, from its
# Interactive Sample Ballot. Measure C is a general tax, so no tax rate
# statement applies; the revenue estimate is the City's, as the ballot
# question and the impartial analysis both give it.

