# Archived sources for City of Los Angeles Charter Amendment PRT (scripted
# as Measure PRT, the site's convention), 2026-11-03 general election
# (sources/sources.md). All four come from one cut of the City Clerk's
# Voter Information Pamphlet, edition 201: the PDF's pages 10 and 67 to
# 72, the pamphlet's printed pages 8 (Ballot Summary) and 65 to 70.
#
# The Chief Legislative Analyst's Impartial Summary is the measure's
# neutral explanation, and the City Administrative Officer's Financial
# Impact Statement its fiscal analysis. No argument against was submitted
# (printed page 68), and no rebuttals.

