[section.line.visual]
kind = "illustration"
name = "loan-papers"

[[section.line]]
id = "board"
text = "Of the seven airport commissioners, three would have to live near Los Angeles International Airport and two near Van Nuys Airport, up from one each."
sources = ["summary", "text"]

[section.line.visual]
kind = "illustration"
name = "empty-commission-seat"

[[section.line]]
id = "waterfront"
text = "The harbor would set aside part of its operating income each year for waterfront public access projects, with the harbor board deciding how much."
sources = ["summary", "text"]

[section.line.visual]
kind = "illustration"
name = "shoreline-seawall"

[[section.line]]
text = "Anyone seeking a harbor lease, or a harbor development that needs a coastal permit, would have to disclose the expected effects on jobs."
sources = ["summary", "text"]

[section.line.visual]
kind = "illustration"
name = "warehouse-loading-docks"

[[section]]
id = "fiscal"
heading = "What it would cost"

[[section.line]]
id = "cost"
text = "The City Administrative Officer says the harbor already sets aside 10 percent of its operating income, about $28.6 million a year, and calls the other changes cost-neutral."
sources = ["financial-impact"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Measure PRT gives neighbors of the airports more representation on the airport board, and keeps effects on local jobs in port decisions."
