# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the lease limits today; what would change, in the Impartial
# Summary's four parts; the City Administrative Officer's statement; the
# one side that argued; what a vote does.
#
# The card quotes the pamphlet: the title and ballot question from the
# measure's own page (printed page 65), and the yes and no meanings from
# its Ballot Summary (printed page 8). The heading above them, "CITY OF
# LOS ANGELES CHARTER AMENDMENT PRT", stands in for an origin: the
# pamphlet does not say who placed the measure on the ballot.
#
# The Financial Impact Statement gives its own scale for the harbor
# money: "10 percent of its operating income", about $28.6 million a
# year (STANDARD.md 6.5, quoting the comparison it makes); the line says
# both, and that the other three changes are "cost-neutral". The measure
# itself leaves the amount to the Board of Harbor Commissioners, and the
# change line says so, so the 10 percent reads as today's practice, not a
# rule. The supporters' "stronger voice" for airport neighbors and their
# "local jobs" are theirs (6.3), so they stay in their section. No
# argument against was submitted: the no side is filed = false, as for
# Measure TE.

contest = "ca-2026-11-03-los-angeles-measure-prt"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "summary"
number = "PRT"
title = "CITY AIRPORTS, HARBOR, AND WATER AND POWER DEPARTMENTS."
origin = "CITY OF LOS ANGELES CHARTER AMENDMENT PRT"
summary = "Shall the City Charter be amended to: require the Harbor Department to allocate funds for waterfront public access projects; require disclosure of workforce impacts for certain Harbor Department leases and agreements; increase maximum terms for certain leases; and change the composition requirement for the Airport Commission?"
yes = "A YES VOTE MEANS: You want the Charter to be amended to make the changes described above regarding the City’s Airports, Harbor, and Water and Power departments."
no = "A NO VOTE MEANS: You do not want the Charter to be amended to make the changes described above regarding the City’s Airports, Harbor, and Water and Power departments."

[[section]]
id = "what"
heading = "Measure PRT"

[[section.line]]
text = "City of Los Angeles Measure PRT asks voters in the city whether to change charter rules for the airports, the harbor, and the Department of Water and Power."
sources = ["summary"]

[section.line.visual]
kind = "page"
source = "summary"
highlight = ["Shall the City Charter be amended"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Today, the City Council can approve leases of up to 50 years for the airports and the water and power department, and up to 66 years for the harbor."
sources = ["summary"]

[section.line.visual]
kind = "illustration"
name = "loan-papers"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
