# Archived sources for City of Arroyo Grande Measure C, 2026-11-03
# general election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The San Luis Obispo County Clerk-Recorder prints each ballot type's
# County Voter Information Guide as one PDF; pages 27 to 30 of Ballot
# Type 42 (the City Attorney's impartial analysis, the arguments for and
# against, and a rebuttal to each) were cut into one excerpt. The guide
# prints neither the ballot question nor the ordinance. The ballot
# question is quoted from the City of Arroyo Grande's own election page,
# which prints the question for each of its two measures; the same page
# is archived for Measure D (arroyo-grande-measure-d/sources), and a copy
# is kept here so this contest's card has its own archived file. The
# City's resolutions placing the measure (sources/resolution-no-2026-045.pdf
# and -047.pdf) are scans with no text layer, so they are archived but
# not cited. The ordinance itself (the resolution's Exhibit A) is not
# cited; the impartial analysis is the measure's neutral explanation.
# No tax rate statement applies; the one revenue estimate is the City
# staff's, as the analysis gives it. The ballot labels the measure
# "Measure C-26"; the project names it by its bare letter.

[contest]
id = "ca-2026-11-03-arroyo-grande-measure-c"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:arroyo_grande"
kind = "measure"
title = "Arroyo Grande Measure C: Cannabis Business Tax"

