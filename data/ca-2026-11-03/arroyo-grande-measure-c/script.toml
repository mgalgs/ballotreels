# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; what stays as it is (cannabis
# sales banned, a separate law needed to allow them); what would change
# (the top rate, the council's room to set it lower, a general tax with
# no end date, the vote it needs); the City staff's revenue estimate;
# one line per side; what a vote does.
#
# The card quotes the ballot question from the City's election page,
# which prints it under "CITY OF ARROYO GRANDE" and "MEASURE C-26" with
# no title line and no yes/no lines; the guide's pages for the measure
# do not print the question. So the card's title is the city's heading
# as printed, its origin is the page's own heading, the vote lines give
# the impartial analysis's meanings, and both highlight the same phrase
# of the question. No place name is narrated: the opening says "the
# voters of this city", and the card and title carry the name.
#
# The revenue estimate is the City staff's, as the impartial analysis
# gives it (at a 6 percent rate; the ballot question prints the same
# $500,000). No archived source states the City's general fund budget,
# so the figure has no scale (STANDARD.md 6.5; left open, under
# [[question]]). That cannabis is bought elsewhere and taxed there, the
# figure for a neighbouring city, the County's cannabis budget and the
# fees businesses might pay are the sides' own, so they stay in the
# sides (STANDARD.md 6.3).

contest = "ca-2026-11-03-arroyo-grande-measure-c"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "C"
title = "CITY OF ARROYO GRANDE MEASURE C-26"
origin = "General Municipal Election - Nov 3, 2026"
summary = "Shall the measure to maintain Arroyo Grande City services, including public safety, road maintenance, infrastructure repair, recreational programs, and other general City services by enacting a tax of up to 10% of gross receipts on cannabis businesses operating in the city if such businesses are permitted, estimated to generate approximately $500,000 annually, with spending oversight and until ended by voters, be adopted?"

[[section]]
id = "what"
heading = "Measure C"

[[section.line]]
text = "Measure C asks the voters of this city whether to tax cannabis businesses, if the city ever allows them."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["enacting a tax of up to 10% of gross receipts on cannabis businesses"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "rules"
text = "Commercial cannabis sales are banned in the city today, and Measure C would not allow them."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "cannabis-shop-counter"

[[section.line]]
id = "separate-law"
text = "The city council would have to adopt a separate law before any cannabis business could open."
sources = ["impartial-analysis"]

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "rate"
text = "The council could set the tax at up to 10 percent of what a cannabis business takes in."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "special-tax"

[[section.line]]
id = "general"
text = "As a general tax, the money could pay for any city purpose, until voters repeal the tax."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "state-budget"

[[section.line]]
text = "Measure C needs a simple majority to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "fiscal"
heading = "What the city estimates"

[[section.line]]
id = "revenue"
text = "City staff estimate the tax could bring in about $500,000 a year, if it were set at 6 percent."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["estimated to generate approximately $500,000 annually"]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say cannabis tax money now goes to other communities, and this would keep it here to help pay for police and roads."
sources = ["arguments"]
basis = ["Right now, the tax money from those sales goes to other communities.", "Measure C helps keep those tax dollars here to support Arroyo Grande.", "That money could help pay for important City services like police and emergency response, road repairs, parks and recreation programs, and other local needs."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Keeps cannabis tax money in the city", "Helps pay for police, roads and parks"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say enforcing cannabis rules often costs more than the tax brings in, and the measure opens a path to cannabis shops."
sources = ["arguments"]
basis = ["often the cost of enforcement and regulation exceeds the revenue.", "Your \"NO\" vote avoids a path to approve \"pot shops\" and \"cannabis hoop houses\"."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Enforcement can cost more than it raises", "Opens a path toward cannabis shops"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote authorizes the city to impose a cannabis business tax of up to 10 percent."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["enacting a tax of up to 10% of gross receipts on cannabis businesses"]

[[section.line]]
text = "A no vote does not authorize the tax."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["enacting a tax of up to 10% of gross receipts on cannabis businesses"]

[[question]]
ask = "Would this let cannabis businesses open in the city?"
lines = ["rules", "separate-law"]

[[question]]
ask = "How high could the tax go?"
lines = ["rate"]

[[question]]
ask = "What could the money be spent on?"
lines = ["general"]

[[question]]
ask = "How big is about $500,000 a year next to the city budget?"
unanswered = true
