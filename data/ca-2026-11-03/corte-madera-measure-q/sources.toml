# Archived sources for Town of Corte Madera Measure Q, 2026-11-03
# general election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# Marin County's Voter Information Guide could not be fetched
# (marincounty.gov blocked the download), so no impartial analysis,
# argument or rebuttal was reached, and no document says whether any
# argument was filed (Section 6 of the resolution only provides for one
# in favor on behalf of the Town). These are the Town's files for the
# Town Council meeting of June 2, 2026, item 7.B: the staff report, with
# Resolution No. 24/2026 (Attachment 1, the agenda copy, its vote left
# blank) and its Exhibit A, the draft ordinance (its number left blank),
# the measure's text, all in one PDF; and the minutes of that meeting,
# which record the resolution's adoption. The Town's records leave the
# letter blank ("Measure __"); the county's list of measures
# (sources/county-measure-list.html) gives it as Q.
#
# The same PDF prints, as Attachment 2, a draft "Argument in Favor of
# Measure __". It is a draft, not a filed argument, and is not cited.
# The staff report is the Town staff's material: it is cited only for
# plain facts (this year's rate and the current tax's end date). The
# resolution's recitals are cited only for the tax's history (voters
# last approved it in 2022), never for its account of the service.

