# Archived sources for Town of Corte Madera Measure Q, 2026-11-03
# general election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The county's Measure Q page (sources/county-page.txt, saved as text
# from a browser, since the site refuses scripted fetches) prints the
# ballot question, the vote required to pass, the Town Attorney's
# impartial analysis and the argument in favor, and says that no
# argument against Measure Q was filed. The other files are the Town's
# for the Town Council meeting of June 2, 2026, item 7.B: the staff
# report, with Resolution No. 24/2026 (Attachment 1, the agenda copy, its
# vote left blank) and its Exhibit A, the draft ordinance (its number
# left blank), the measure's text, all in one PDF; and the minutes of
# that meeting, which record the resolution's adoption. The Town's
# records leave the letter blank ("Measure __"); the county's list of
# measures (sources/county-measure-list.html) and its page give it as Q.
#
# The same PDF prints, as Attachment 2, a draft "Argument in Favor of
# Measure __". It is a draft; the filed argument cited is the one the
# county prints.
#
# The staff report is the Town staff's material: it is cited only for
# plain facts (this year's rate and the current tax's end date). The
# resolution's recitals are cited only for the tax's history (voters
# last approved it in 2022), never for its account of the service.

[contest]
id = "ca-2026-11-03-corte-madera-measure-q"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:corte_madera"
kind = "measure"
title = "Town of Corte Madera Measure Q: Continuing the Paramedic Services Special Tax for Four Years"

