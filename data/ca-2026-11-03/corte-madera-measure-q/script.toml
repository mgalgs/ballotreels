number = "Q"
title = "A MEASURE AUTHORIZING THE CONTINUATION OF A SPECIAL PARCEL TAX FOR PARAMEDIC SERVICES"
origin = "TOWN OF CORTE MADERA"
summary = "To maintain rapid 9-1-1 emergency response times and preserve the number of on-duty paramedics ready to respond to accidents/medical emergencies, shall the Ross Valley Paramedic Authority measure be adopted continuing for four years the paramedic services special tax of up to $94.50/ residential living unit or 1,000 square feet of developed nonresidential property, adjusted up to $7.75/ year, generating approximately $786,000 annually, with annual audits, public spending disclosure and all funds for local paramedic services?"

