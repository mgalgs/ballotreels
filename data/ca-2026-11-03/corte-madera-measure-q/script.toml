[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "fiscal"
heading = "What it would raise"

[[section.line]]
id = "revenue"
text = "The ballot question says the tax would raise about $786,000 a year."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["generating approximately $786,000 annually"]

[[section]]
id = "yes"
heading = "Why some vote yes"
