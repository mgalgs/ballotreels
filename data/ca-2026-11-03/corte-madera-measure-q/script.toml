# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the tax today (this year's
# rate, when it ends, the last approval); what would change (the rate,
# how far it may rise, when it ends, where the money goes, the yearly
# report, the vote it needs); the revenue as the ballot question gives
# it; both sides, neither of which has an archived argument; what a vote
# does.
#
# No place name and no person is narrated: the opening says "the voters
# of this town", and the Ross Valley Paramedic Authority is not named.
# The card and title carry the names. No vote count of the Council or of
# past elections is given (the staff report's share for 2022 is left
# out, as is the minutes' roll call).
#
# No impartial analysis was archived. What the tax does is stated from
# the draft ordinance (the measure's text, its number left blank) and
# from Resolution No. 24/2026, whose Section 3 prints the ballot question
# the card quotes and whose Section 4 sets the two-thirds vote. The
# archived resolution is the agenda copy, its vote left blank; the
# minutes record that the Council adopted it on June 2, 2026. The
# resolution prints only bare Yes and No cells, so the card has no
# YES/NO boxes and both vote lines highlight the same phrase. The
# ordinance gives the rate as "$94.50 to a maximum of $117.75"; the
# yearly step of up to $7.75 is the ballot question's. The resolution's
# recitals are used only for the last approval (2022); the staff report
# only for this year's rate and the current tax's end date. The staff
# report's account of the need for a higher rate, and the draft argument
# in favor printed with it, are not used.
#
# The $786,000 a year is the ballot question's figure. No archived
# source states the Town's general fund budget, so it has no scale
# (STANDARD.md 6.5; left open, under [[question]]).
#
# No argument for or against Measure Q was archived, and no document
# says whether any was filed (Section 6 of the resolution only provides
# for one in favor; the draft printed with the staff report is not a
# filed argument). So the sides do not say none was filed: each says
# none is among the documents gathered (filed = false, STANDARD.md 2.5),
# as for Walnut Creek Measure U.

contest = "ca-2026-11-03-corte-madera-measure-q"
template = "measure"
template_version = 2
