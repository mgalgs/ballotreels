# "Ballot at a glance" figures for the 2026-11-03 California general
# election (docs/SCRIPT-FORMAT.md, "glance.toml"). Each quote is the
# Legislative Analyst's own summary of the measure's fiscal impact, as
# printed under the Official Title and Summary.

[prop-1]
source = "title-summary"
quote = "Increased state cost of $500 million to $600 million annually for about 25 years to repay the housing bond."
amount = 600000000
period = "per-year"
direction = "cost"

[prop-2]
source = "title-summary"
status = "none-printed"
quote = "State budget reserves would be higher."

[prop-3]
source = "title-summary"
quote = "Maintains $5 billion to $15 billion of annual state income tax revenue by making a temporary tax increase on high-income earners permanent instead of letting it expire in 2031."
amount = 15000000000
period = "per-year"

[prop-4]
source = "title-summary"
status = "words"
magnitude = 100000
quote = "Ongoing costs to the state of a few hundred thousand dollars each year for the Fair Political Practices Commission to answer questions from state and local governments about public campaign finance programs."
period = "per-year"
direction = "cost"

[prop-5]
source = "title-summary"
status = "not-determined"
quote = "Net fiscal effect unknown. Possible state and local government savings or costs of millions of dollars to administer recall elections."
direction = "mixed"

[prop-37]
source = "title-summary"
status = "no-material-impact"
quote = "No direct state or local costs."

[prop-38]
source = "title-summary"
quote = "Increased state cost of $500 million to $600 million annually for about 20 years to repay the medical research bond."
amount = 600000000
period = "per-year"
direction = "cost"

[prop-39]
source = "title-summary"
status = "words"
magnitude = 100000000
quote = "State and local government costs of between tens of millions of dollars and low hundreds of millions of dollars each year to implement new voting requirements."
period = "per-year"
direction = "cost"

# The summary sizes the wealth tax itself only in words ("tens of
# billions of dollars", over several years); its one dollar figure is the
# possible yearly income tax loss, which `period` describes. The
# magnitude is the larger, so that is the sort value.
[prop-40]
source = "title-summary"
quote = "Temporary state revenue increase from a new wealth tax on billionaires. These wealth tax revenues probably would add up to tens of billions of dollars spread over several years. Possible ongoing decrease of less than $1 billion per year in state income tax revenue collected from billionaires."
amount = 1000000000
magnitude = 10000000000
period = "per-year"
direction = "mixed"

[prop-41]
source = "title-summary"
status = "not-determined"
quote = "Unknown net fiscal effect."

[prop-42]
source = "title-summary"
status = "none-printed"
quote = "Possibility that tax revenues will not go up as much in the future."

[prop-43]
source = "title-summary"
status = "none-printed"
quote = "Possibility that local government tax revenues will not go up as much in the future due to a higher vote threshold for certain taxes."

[prop-44]
source = "title-summary"
status = "words"
magnitude = 10000000
quote = "Increased state costs in the low tens of millions of dollars per year to enforce the new requirements on certain private nonprofit health care clinics, covered by fees charged to the affected clinics."
period = "per-year"
direction = "cost"

[prop-45]
source = "title-summary"
quote = "Initial costs for state and local governments, likely in the high tens of millions of dollars annually—potentially exceeding $100 million annually—to implement new project review and court challenge procedures for eligible projects."
amount = 100000000
magnitude = 10000000
period = "per-year"
direction = "cost"

# San Diego County Measure A: the guide prints no fiscal statement.
[sd-county-measure-a]
source = "guide-page"
status = "none-printed"

# San Diego County Measure B: the guide prints no fiscal analysis; the
# one estimate is in its ballot label (and County Counsel's Impartial
# Analysis, whose sentence pdftotext interleaves with the next column).
[sd-county-measure-b]
source = "guide-page"
quote = "a half-cent sales tax raising an estimated $400,000,000 to $450,000,000 annually"
amount = 450000000
period = "per-year"

# Los Angeles County Measure A: the Auditor-Controller's statement sizes
# only the cost of an arbitration, and only in words; it says it cannot
# predict the effect on labor costs.
[la-county-measure-a]
source = "fiscal-statement"
status = "words"
magnitude = 1000000
quote = "direct administrative costs of arbitration, including arbitrator fees, legal fees, and staff support, which could total tens of thousands to millions of dollars depending on the complexity and duration of the arbitration."
period = "unstated"
direction = "cost"

# Los Angeles County Measure E: the Auditor-Controller's statement.
[la-county-measure-e]
source = "fiscal-statement"
quote = "This measure requires the County Board of Supervisors (Board) to appropriate a minimum of $14.3 million for the Ethics Commission's and Office of Ethics Compliance's annual operating budget, beginning in Fiscal Year 2027-28."
amount = 14300000
period = "per-year"

# San Diego Unified Measure M: the district's Tax Information Statement.
[san-diego-unified-measure-m]
source = "tax-statement"
quote = "The best estimate of the total debt service, including the principal and interest that would be required to be repaid if all of the bonds are issued and sold is approximately $8,100,000,000."
amount = 8100000000
period = "unstated"

# Vista Unified Measure N: the district's Tax Rate Statement, its total
# debt service ("The best estimate from official sources of the total
# debt service, including the principal and interest, that would be
# required to be repaid if all the bonds are issued and sold is ...").
# pdftotext interleaves the page's two columns, so the quote is the
# line's end, the one run it keeps whole.
[vista-unified-measure-n]
source = "tax-statement"
quote = "the bonds are issued and sold is $1,154,254,750."
amount = 1154254750
period = "unstated"