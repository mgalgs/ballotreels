# Recipe E, 60 seconds, distilled: one claim per line, about 120 words,
# so the narration can breathe. The chain: what it is about; why the
# fund exists (revenue swings, the budget must balance); what it costs;
# the stopping point today and under Proposition 2; the analyst's view;
# one point per side; what a vote does.

contest = "ca-2026-11-03-prop-2"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "quick-reference"
number = "2"
title = "INCREASES STATE’S RAINY DAY FUND. LEGISLATIVE CONSTITUTIONAL AMENDMENT."
origin = "Put on the Ballot by the Legislature"
summary = "Increases California's Rainy Day Fund, approved by voters in 2014, to provide funding for education, health care, public safety, and other essential services during economic downturns. Fiscal Impact: State budget reserves would be higher."
yes = "A YES vote on this measure means: Rules for building state budget reserves and paying down extra state debts would change. As a result, state budget reserves would be higher. The state also would be required to make extra debt payments for longer."
no = "A NO vote on this measure means: Rules for building state budget reserves and paying down extra state debts would not change."

[[section]]
id = "what"
heading = "Proposition 2"

[[section.line]]
text = "Proposition 2 is about California's Rainy Day Fund."
sources = ["quick-reference"]

[section.line.visual]
kind = "page"
source = "quick-reference"
highlight = ["Increases California's Rainy Day Fund"]

[[section]]
id = "background"
heading = "Why a rainy day fund"

[[section.line]]
text = "California's tax money rises and falls with the stock market, but its budget has to balance every year."
sources = ["lao-analysis", "lao-volatility"]

[section.line.visual]
kind = "figure"
figure = "steady-spending-volatile-revenue"
title = "Revenue swings; spending grows steadily"
source = "lao-volatility"

[[section.line]]
text = "So the state puts money into the fund in good years, to use in bad years."
sources = ["lao-analysis"]

[section.line.visual]
kind = "illustration"
name = "rainy-day"

[[section.line]]
text = "The trade-off is that money in the fund isn't spent on programs that year."
sources = ["lao-analysis"]

[section.line.visual]
kind = "illustration"
name = "trade-off"

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Today, required deposits stop once the fund reaches 10 percent."
sources = ["lao-analysis"]

[section.line.visual]
kind = "illustration"
name = "fund-target"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "Under Proposition 2, deposits would continue until the fund reaches 20 percent."
sources = ["lao-analysis"]

[section.line.visual]
kind = "bars"
title = "Rainy Day Fund target, share of main-budget taxes"
source = "lao-analysis"
unit = "%"
labels = ["Today", "Proposition 2"]
values = [10, 20]

[[section]]
id = "fiscal"
heading = "What the state's analyst says"

[[section.line]]
text = "The Legislative Analyst's Office says budgets would be somewhat easier to balance in downturns."
sources = ["lao-analysis"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Proposition 2's bigger fund would protect schools and services in a downturn."
sources = ["arguments"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Protects schools, health care and public safety in downturns", "Stops overspending when there is a surplus"]

