# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; how council pay is set today and why only
# voters can change it; what state law allows; how it reached the ballot
# and what it needs; what would change (the new pay, the inflation
# adjustment); no cost estimate; one line per side; what a vote does.
#
# The card's title is the PDF's own head; its origin and yes and no lines
# are the City Attorney's Impartial Analysis. No city name is narrated
# ("this city"). Not a tax measure: the pages print no fiscal statement,
# so the fiscal line says they include no cost estimate. The pay figures
# are amounts per council member (STANDARD.md 6.5, exempt). The argument
# in favor's "$153,000 annually for the entire Council" is that side's
# figure and is left out, as are the analysis's note that members get no
# medical or other benefits and its statement of what state law allows a
# city of this size, both of which the argument in favor cites
# (STANDARD.md 6.3); the card quotes the question's "less than allowed
# under State law" as printed.
#
# Sides come from the argument in favor and the argument against, not
# the rebuttals. The argument against supports a pay increase and
# opposes the automatic yearly one, and its line says what it opposes.

contest = "ca-2026-11-03-roseville-measure-a"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "A"
title = "COUNCIL COMPENSATION ADJUSTMENT AND INFLATION LIMITATION MEASURE"
origin = "This measure is being placed on the ballot by the City Council for the City of Roseville, after receiving input from the public"
summary = "Shall the Charter of the City of Roseville be amended to adjust councilmember compensation from the current $600 a month that was established by voters 26 years ago, to $2,550 a month, with annual incremental adjustments tied to inflation not to exceed 5%, which is less than allowed under State law?"
yes = "A “yes” vote is a vote in favor of the proposed amendment to the Charter."
no = "A “no” vote is a vote against the proposed amendment to the Charter."

[[section]]
id = "what"
heading = "Measure A"

[[section.line]]
text = "Measure A asks the voters of this city whether to raise city council pay from $600 a month to $2,550 a month."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["to $2,550 a month"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "pay-2000"
text = "Voters set council pay at $600 a month in 2000, and it has not changed since."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "city-council-chamber"

[[section.line]]
text = "The City Council placed Measure A on the ballot, and it needs a majority to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "Measure A would set each council member's pay at up to $2,550 a month, with no extra for the mayor."
sources = ["impartial-analysis", "text"]

[section.line.visual]
kind = "bars"
title = "Council member pay, dollars a month"
source = "impartial-analysis"
unit = ""
labels = ["Today", "Measure A"]
values = [600, 2550]

[[section.line]]
id = "inflation"
text = "The pay would then rise each year with the state's consumer price index, by no more than 5 percent."
sources = ["impartial-analysis", "text"]

[[section]]
id = "fiscal"
heading = "What it would cost"

[[section.line]]
text = "The Measure A voter guide pages do not include a cost estimate for the measure."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"
stamp = "None reported"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say pay frozen for 26 years should reach the amount state law allows, so more people can afford to serve."
sources = ["arguments"]
basis = ["For 26 years, Roseville City Council compensation has remained frozen at $600 per month", "This measure updates compensation to $2,550 per month, the amount authorized under state law for a city of Roseville’s size.", "Updating Council compensation helps ensure working professionals, parents, and community members from more backgrounds can realistically consider serving Roseville, easing the financial strain public service requires."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Pay frozen for 26 years", "More people can afford to serve"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say automatic raises, which other city employees do not get, should be voted on apart from the pay increase."
sources = ["arguments"]
basis = ["However I have always opposed an automatic increase.", "Why should we have an automatic salary increase for council member compensation when all other city employees do not", "Two separate proposals; increase salary and automatic increase."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["No automatic yearly raises", "Vote on pay and raises separately"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote is a vote for the amendment to the charter."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["is a vote in favor of the proposed amendment"]

[[section.line]]
text = "A no vote is a vote against the amendment to the charter."
