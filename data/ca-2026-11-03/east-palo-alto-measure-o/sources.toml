# Archived sources for City of East Palo Alto Measure O, 2026-11-03
# general election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1). San Mateo County's Assessor-County Clerk-Recorder &
# Elections (ACRE) posts each document of the measure separately, as the
# City of East Palo Alto filed it; no printed voter guide was archived.
#
# The City Attorney's Impartial Analysis of Measure O is the measure's
# neutral explanation, the kind a state's attorney general's explanatory
# statement is; it gives the City's estimates of the tax rates and the
# total debt service. The ordinance refers to a tax rate statement "on
# file with the City Clerk", which is not among ACRE's files.
#
# The resolution's text layer misreads words, the argument in favor has
# none, and the argument against's misreads some. Each source that
# `check` reads verbatim (the card's ballot question, each side's basis)
# is a transcription of its page, read from the page image, in a .txt
# beside the PDF; the url is the PDF's. No rebuttal to the argument in
# favor is among ACRE's files.

[contest]
id = "ca-2026-11-03-east-palo-alto-measure-o"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:east_palo_alto"
kind = "measure"
title = "City of East Palo Alto Measure O: $125,000,000 in Bonds for a Library, Civic Center, Water and Storm Drain Projects"

