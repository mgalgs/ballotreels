# Archived sources for City of Palmdale Measure DE, 2026-11-03 general
# election (sources/la-sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The Los Angeles County Registrar-Recorder/County Clerk's list "Measures
# Appearing on the Ballot" is the authority for the letter and the ballot
# question, quoted on the card; its "Supporters: None submitted.
# Opponents: None submitted." is the official statement that no argument
# was filed on either side (`measure-list`). No impartial analysis was
# printed or gathered: what the measure does comes from the full text of
# Ordinance No. 1669 as the Registrar prints it in its Interactive Sample
# Ballot. Resolution No. CC 2026-047 (a scan, whose Exhibit A is the same
# ordinance) adds nothing the script needs and is not cited.

[contest]
id = "ca-2026-11-03-palmdale-measure-de"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:palmdale"
kind = "measure"
title = "City of Palmdale Measure DE: A Mayor Elected Citywide Beginning in 2028"

