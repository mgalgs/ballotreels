# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the charter rule that lets the
# council set how the mayor is chosen, the council's districts, and how
# the measure reached the ballot; what would change (the first election
# and term, the mayor's role, what stays the same, the vote it needs);
# that no document gives a cost estimate; both sides; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". The card and title carry it.
#
# No impartial analysis was printed or gathered, so every explaining
# line is Ordinance No. 1669's own text (its recitals and Section 2). No
# gathered document says how the mayor is chosen today, so the script
# does not say (left open, under [[question]]). "At-large" is said as
# "citywide", which is what the ordinance means by it ("elected at-large
# by the voters of the City").
#
# The card quotes the Los Angeles County Registrar-Recorder/County
# Clerk's list "Measures Appearing on the Ballot": the City's heading,
# the vote needed and the ballot question, which has no yes or no
# sentences, so the card has no boxes. The vote lines take their meaning
# from the question, and both highlight the same phrase.
#
# The list says "Supporters: None submitted. Opponents: None
# submitted.", so each side says plainly, in the same words, that no
# argument was submitted, citing the list (filed = false on both).

contest = "ca-2026-11-03-palmdale-measure-de"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "DE"
title = "CITY OF PALMDALE"
origin = "VOTE PASSAGE – Majority Vote 50%+1"
summary = "Shall the ordinance establishing the office of Mayor as an at-large, elected position beginning with the November 2028 general municipal election be adopted?"

[[section]]
id = "what"
heading = "Measure DE"

[[section.line]]
text = "Measure DE asks the voters of this city whether to make the mayor an office elected by voters citywide."
sources = ["ballot-question", "ordinance"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["the office of Mayor as an at-large, elected position"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "charter"
text = "The city charter lets the City Council set, by ordinance, how the mayor is chosen."
sources = ["ordinance"]

[section.line.visual]
kind = "illustration"
name = "constitution-page"

[[section.line]]
text = "Council members are elected by district."
sources = ["ordinance"]

[section.line.visual]
kind = "illustration"
name = "district-map"

[[section.line]]
text = "The City Council proposed this ordinance and placed it before voters."
sources = ["ordinance"]

[section.line.visual]
kind = "illustration"
name = "city-council-chamber"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "term"
text = "Starting with the November 2028 election, voters citywide would elect a mayor every four years, for a four-year term."
sources = ["ordinance", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["beginning with the November 2028 general municipal election"]

[[section.line]]
id = "role"
text = "The mayor would be a voting member of the City Council and would run its meetings."
sources = ["ordinance"]

[section.line.visual]
kind = "illustration"
name = "legislative-chamber"

[[section.line]]
id = "districts"
text = "The council districts and the council-manager form of government would stay as they are."
sources = ["ordinance"]

[section.line.visual]
kind = "illustration"
name = "district-map"

[[section.line]]
text = "Measure DE needs a majority yes vote to pass."
sources = ["ballot-question", "ordinance"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "fiscal"
heading = "What the official documents say"

[[section.line]]
text = "Neither the ordinance nor the official list of measures includes a cost estimate for the measure."
sources = ["ordinance", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"
stamp = "None reported"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"
filed = false

[[section.line]]
text = "The official county list of measures, which names who filed each argument, says no argument for Measure DE was submitted."
sources = ["measure-list"]

[section.line.visual]
kind = "list"
source = "measure-list"
items = ["No argument for was submitted"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "The official county list of measures, which names who filed each argument, says no argument against Measure DE was submitted."
sources = ["measure-list"]

[section.line.visual]
kind = "list"
source = "measure-list"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote adopts the ordinance to have voters elect the mayor citywide."
sources = ["ballot-question", "ordinance"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["the office of Mayor as an at-large, elected position"]

[[section.line]]
text = "A no vote rejects the ordinance to have voters elect the mayor citywide."
