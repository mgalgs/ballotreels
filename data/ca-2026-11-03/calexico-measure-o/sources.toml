# Archived sources for City of Calexico Measure O, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# The Imperial County Registrar of Voters posts each measure's pages as
# one PDF (the ballot question, the ordinance and the City Attorney's
# impartial analysis); no countywide Voter Information Guide is posted
# online. The City Attorney's impartial analysis is the measure's
# neutral explanation, the kind a state's attorney general's
# explanatory statement is. No fiscal analysis or tax rate statement
# applies (a sales tax); the revenue estimates are the City's, as the
# analysis and the ballot question give them. The Registrar's Measure O
# PDF prints no argument for or against and no rebuttal; with no full
# guide posted, it is not known whether any was filed.

