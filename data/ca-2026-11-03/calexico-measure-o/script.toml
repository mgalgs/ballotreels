# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the City's half percent general
# sales tax today and when it ends; what would change (the rate and its
# step up, how long it lasts, how the money is split, who checks it, the
# vote it needs); the City's revenue estimates as the impartial analysis
# gives them; both sides, neither of which has an archived argument;
# what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". The card and title carry the
# name. The rates are said as percents, as the analysis gives them.
#
# The card quotes the ballot question as the Registrar's Measure O PDF
# prints it, with blank Yes and No lines and no yes/no sentences. So the
# card has no boxes, its origin is the impartial analysis's sentence
# placing the measure, the vote lines give the analysis's meanings, and
# both highlight the same phrase of the question.
#
# The $4 million and $8 million a year are the City's estimates as the
# impartial analysis gives them. No archived source states the City's
# general fund budget to give them a scale (STANDARD.md 6.5; left open,
# under [[question]]).
#
# No argument for or against Measure O was archived: the Registrar's
# Measure O PDF prints none, and with no full guide posted it is not
# known whether any was filed. So each side says none is printed in the
# posted pages (filed = false, STANDARD.md 2.5).

contest = "ca-2026-11-03-calexico-measure-o"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "O"
title = "CITY OF CALEXICO PUBLIC SAFETY SALES TAX"
origin = "On July 1, 2026, the City Council unanimously voted to place Measure O on the November 3, 2026 General Municipal Election ballot."
summary = "Shall the measure to maintain and enhance public safety services in the City of Calexico, including police protection, fire suppression, emergency medical response, disaster preparedness and related operations, by levying a special sales tax initially at ½%, adjusting to 1% on October 1, 2030, for 20 years providing approximately $4,000,000 annually (at 1/2%) and $8,000,000 annually (at 1%), subject to annual audits, public reporting, citizens’ committee oversight, with all funds in Calexico, be adopted?"

[[section]]
id = "what"
heading = "Measure O"

[[section.line]]
text = "Measure O asks the voters of this city whether to approve a sales tax for public safety."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["levying a special sales tax"]

[[section]]
id = "today"
heading = "The sales tax today"

[[section.line]]
id = "today-rate"
text = "Today, the city has a half percent general sales tax, which ends in September 2030."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "sales-receipt"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "rate"
text = "Measure O would start at a half percent, rise to 1 percent in October 2030, and end in 2047."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "end-date"

[[section.line]]
id = "split"
text = "Half the money would go to police and crime prevention, and half to fire, paramedic and disaster services."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "fire-station-engine"

[[section.line]]
id = "oversight"
text = "A citizens' committee would review the spending, and the tax would be audited every year."
sources = ["impartial-analysis"]

[[section.line]]
text = "Measure O needs two-thirds of the vote to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "fiscal"
heading = "What the impartial analysis says"

[[section.line]]
id = "revenue"
text = "The city attorney's impartial analysis estimates $4 million a year at a half percent, and $8 million at 1 percent."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "bars"
title = "Estimated revenue a year, millions of dollars"
source = "impartial-analysis"
unit = ""
labels = ["At a half percent", "At 1 percent"]
values = [4, 8]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"
filed = false

[[section.line]]
text = "No argument for Measure O is printed in its posted pages."
sources = ["ballot-question"]

[section.line.visual]
kind = "list"
source = "ballot-question"
items = ["No argument for was printed"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure O is printed in its posted pages."
sources = ["ballot-question"]

[section.line.visual]
kind = "list"
source = "ballot-question"
items = ["No argument against was printed"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote authorizes the special sales tax."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["levying a special sales tax"]

[[section.line]]
text = "A no vote does not authorize the special sales tax."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["levying a special sales tax"]

[[question]]
ask = "How much would the sales tax go up, and for how long?"
lines = ["today-rate", "rate"]

[[question]]
ask = "What can the money be spent on, and who checks it?"
lines = ["split", "oversight"]

[[question]]
ask = "How big is $4 million to $8 million a year next to the city budget?"
unanswered = true
