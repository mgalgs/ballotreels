[[question]]
ask = "Who pays for the bonds?"
lines = ["repaid", "tax-rate"]

[[question]]
ask = "What would the money pay for?"
lines = ["projects"]

[[question]]
ask = "How much would it cost in all?"
lines = ["debt-service"]

[[question]]
ask = "How big are the bonds next to the district's budget?"
unanswered = true
