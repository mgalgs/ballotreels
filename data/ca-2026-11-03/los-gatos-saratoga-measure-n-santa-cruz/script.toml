# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and of whom; how a school bond is repaid and what it needs to
# pass; what the money would pay for; the district's tax rate statement;
# one line per side; what a vote does.
#
# This contest is the Santa Cruz County part of the district; Santa Clara
# County, the lead county, carries its own for the rest. The script is
# the same story either way, and names neither county.
#
# "Counsel" is heard as "Council" (standard/speakability.txt), so the
# narration does not name County Counsel; a fiscal year is written with
# both years in full ("2056-2057"). The threshold is the impartial
# analysis's 55 percent, not the "Majority" the Santa Cruz notice of
# election prints in its heading.
#
# Scale (STANDARD.md 6.5): the $321 million in bonds and the $690
# million of debt service are repaid from a tax on property in the
# district, and no archived source states the district's budget, so they
# have no budget scale (left open), as for San Diego Unified Measure M.
# The tax rate statement's average and highest rates are both $30.00 per
# $100,000, so the fiscal line gives the one figure.
#
# Facts the sides cite stay in their sections (STANDARD.md 6.3): that the
# money cannot pay administrator salaries, the audits and oversight
# committee, and that no funds can be taken by the state (the
# supporters'); the 2014 bond (the opponents').
#
# The card quotes the ballot question from the district's full text,
# which prints no yes and no statements, so the vote lines take their
# meanings from County Counsel's impartial analysis and highlight the one
# phrase of the question both votes turn on, as Utah's do.

contest = "ca-2026-11-03-los-gatos-saratoga-measure-n-santa-cruz"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "N"
title = "FULL TEXT BALLOT PROPOSITION OF THE LOS GATOS-SARATOGA UNION HIGH SCHOOL DISTRICT BOND MEASURE ELECTION NOVEMBER 3, 2026"
origin = "The following is the full proposition presented to the voters by the Los Gatos-Saratoga Union High School District."
summary = "To maintain quality academic facilities at Los Gatos High School and Saratoga High School by replacing leaky roofs and failing restrooms, plumbing, electrical, heating/ cooling systems; improving school safety; updating, repairing and equipping schools including science, technology, engineering, arts, math, robotics, and career/ college readiness classrooms/ labs; shall Los Gatos-Saratoga Union High School District's measure be adopted, authorizing $321,000,000 in bonds at legal rates, levying approximately $30 per $100,000 assessed value ($23,000,000 annually) while bonds are outstanding, with oversight, annual audits, and local control?"

[[section]]
id = "what"
heading = "Measure N"

[[section.line]]
text = "Los Gatos-Saratoga Union High School District Measure N asks the district's voters whether to approve $321 million in school bonds."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["authorizing $321,000,000 in bonds"]

[[section]]
id = "today"
heading = "How a school bond works"

[[section.line]]
id = "repaid"
text = "The district would borrow the money and repay it from a yearly tax on property in the district."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "bond-certificates"

[[section.line]]
text = "Measure N needs 55 percent of the vote to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "projects"
text = "The money would replace roofs, restrooms, plumbing, electrical and heating systems, improve safety, and update classrooms and labs at the two high schools."
sources = ["ballot-question"]

[section.line.visual]
kind = "illustration"
name = "school-classroom"

[[section]]
id = "fiscal"
heading = "What the tax statement says"

[[section.line]]
id = "tax-rate"
text = "The district's tax rate statement estimates a tax of $30 per $100,000 of assessed value each year, through 2056-2057."
sources = ["tax-statement"]

[section.line.visual]
kind = "illustration"
name = "debt-payments"

[[section.line]]
id = "debt-service"
text = "The statement estimates the total to repay, with interest, at about $690 million."
sources = ["tax-statement"]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Measure N repairs high school buildings up to 100 years old, where roofs leak and plumbing fails."
sources = ["argument-for"]
basis = ["Yet some high school buildings are between 65, 75, and even 100 years old, and in desperate need of repairs and updates.", "Roofs leak, plumbing fails and outdated energy systems are inefficient."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Repairs aging buildings, roofs and plumbing", "Upgrades classrooms and labs"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say Measure N is more bond debt, and the roofs a 2014 bond listed for replacing need replacing again."
sources = ["argument-against"]
basis = ["When school boards ask voters permission to go into debt with bond like Measure", "The $99,000,000 bond voters approved in 2014 listed \"replacing leaky and aging roofs\" that apparently need replacing again!"]

[section.line.visual]
kind = "list"
source = "argument-against"
items = ["Puts the district into more bond debt", "A 2014 bond already listed new roofs"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote allows the district to sell up to $321 million in bonds, repaid by a yearly property tax."
