# Archived sources for Allan Hancock Joint Community College District
# Measure H, 2026-11-03 general election, as Ventura County's voters see
# it (sources/sources.md). Every id here may be cited by script.toml.
# `kind` must be one the standard allows (docs/STANDARD.md, section 1).
#
# The letter H is not confirmed by an archived official record for
# Ventura County. The County of Ventura's measures page and voter guide
# could not be read (both answered a bot challenge); the County's records
# name the district's measure but give no letter, and the letter is
# published under the operator's rule for letters every checkable one of
# which matched an official page. Santa Barbara County, which
# administers the district's election, prints it as "Measure H2026".
#
# Santa Barbara County Elections prints each ballot type's County Voter
# Information Guide as one PDF; pages 20 to 27 (impartial analysis, tax
# rate statement, argument in favor, full text) and 48 to 49 (sample
# ballot) of Ballot Type 103 were cut into one excerpt, copied here from
# the Santa Barbara County contest (allan-hancock-measure-h), which backs
# every source but the County of Ventura's. The project names the
# measure by its bare letter. County Counsel's impartial analysis is the
# measure's neutral explanation; the district's Tax Rate Statement is its
# fiscal statement. No argument against was filed, and no rebuttals are
# printed. The district's resolution ordering the election
# (sources/resolution-no-26-21.pdf, copied from the San Luis Obispo
# County contest) is archived but not cited: the guide prints everything
# the script says.
#
# The County of Ventura's Board of Supervisors approved, as consent item
# 12 on August 4, 2026, the requests of the agencies in Exhibit 1 to
# consolidate their elections with the November 3, 2026 General
# Election; Exhibit 1 lists the Allan Hancock Joint Community College
# District among the six local measures. They are cited for the fact
# that the measure is on Ventura County's November 3 ballot.
#
# A community college district has no Census boundary, so the measure's
# division is the county and `voters` names the district
# (docs/SCRIPT-FORMAT.md). Santa Barbara County administers the district
# and stages the same bond as allan-hancock-measure-h; San Luis Obispo
# County's copy is allan-hancock-measure-h-san-luis-obispo, and this copy
# carries the county suffix too.

[contest]
id = "ca-2026-11-03-allan-hancock-measure-h-ventura"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/county:ventura"
kind = "measure"
title = "Allan Hancock Joint Community College District Measure H: College Facility Bonds"
voters = "the Allan Hancock Joint Community College District"

