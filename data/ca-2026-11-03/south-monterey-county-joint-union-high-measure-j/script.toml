# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; how the schools are run today and who put the
# question on the ballot; what would change (two new unified districts,
# three dissolved, five small districts kept, new boards, the start
# year); the vote it needs; the cost line; one line per side; what a vote
# does.
#
# No place name is narrated (the narrator mispronounces them): the opening
# says "the voters of this high school district", and the two new
# districts are told apart by the areas they cover, not by name. The card
# and title carry the names. "Counsel" is heard as "Council"
# (standard/speakability.txt), so the narration does not say it.
#
# Measure J is a reorganization, not a tax: there is no tax rate
# statement and the impartial analysis prints no cost estimate, so the
# fiscal line says so. The full text reports the plan's feasibility study
# finding no cut in per-pupil funding and lower administrative costs;
# supporters argue efficiency and sound finances and opponents fiscal
# risk, so that finding is left out of the neutral sections rather than
# set beside one side (STANDARD.md 6.3). Likewise the State Board of
# Education's and county committee's approval, which the supporters cite
# as unanimous, is left to their side.
#
# The card quotes the County of Monterey Elections Department's List of
# Local Measures, which prints the question with no yes and no sentences,
# so the card has no boxes and the vote lines take their meaning from the
# impartial analysis.

contest = "ca-2026-11-03-south-monterey-county-joint-union-high-measure-j"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "measure-list"
number = "J"
title = "South Monterey County Joint Union High School District"
origin = "Majority Voter Approval Required"
summary = "Measure for the Reorganization of School Districts. Shall South Monterey County Joint Union High School District (SMCJUHSD) be reorganized to form a new unified school district covering the territory of Greenfield Union School District to be known as Greenfield Unified School District, and a second unified school district covering the rest of the territory of SMCJUHSD to be known as King City Joint Unified School District, resulting in the dissolution of Greenfield Union School District, King City Union School District, and SMCJUHSD?"

[[section]]
id = "what"
heading = "Measure J"

[[section.line]]
text = "Measure J asks the voters of this high school district whether to reorganize it into two new unified school districts."
sources = ["measure-list", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "measure-list"
highlight = ["Measure for the Reorganization of School Districts."]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "today-districts"
text = "Today, this district runs the high schools, while separate elementary districts run the schools up to grade 8."
sources = ["text"]

[section.line.visual]
kind = "illustration"
name = "district-map"

[[section.line]]
id = "threshold"
text = "Measure J needs a majority of the vote to pass."
sources = ["measure-list"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "two-districts"
text = "One new district would cover one elementary district's area, and a second the rest of this district, each running every grade through grade 12."
sources = ["measure-list", "impartial-analysis", "text"]

[section.line.visual]
kind = "illustration"
name = "county-line-map"

[[section.line]]
id = "dissolved"
text = "This district and two elementary districts would be dissolved, while five small elementary districts would keep their own boards."
sources = ["impartial-analysis", "text"]

[[section.line]]
id = "boards"
text = "Voters would elect each new district's board at this election, and the new districts would start in the 2028-2029 school year."
sources = ["text", "impartial-analysis"]

[section.line.visual]
kind = "timeline"
source = "text"
labels = ["November 3, 2026", "2028-2029 school year"]
items = ["Voters elect the two new boards", "The new districts take effect"]

[[section]]
id = "fiscal"
heading = "What it would cost"

[[section.line]]
text = "The impartial analysis does not include a cost estimate for the measure."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"
stamp = "None reported"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say students would get one continuous path from the earliest grades through graduation, and the plan won unanimous approval after years of study."
sources = ["argument-for", "rebuttal-for"]
basis = ["students in King City and Greenfield will benefit from one continuous educational pathway", "Measure J creates a continuous educational system that aligns curriculum, student support, and academic pathways from the earliest grades through graduation.", "This proposal is the result of years of careful study and received unanimous approval from both the Monterey County Committee on School District Organization and the California State Board of Education."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["One continuous path through graduation", "Unanimous approval after years of study"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say dissolving an elementary district that did not seek this ends local control, and elementary programs could be cut for high school priorities."
sources = ["argument-against"]
basis = ["A NO vote prevents dissolution of King City Union School District (KCUSD) preserving local control of King City's elementary schools.", "King City did not seek unification and its students were not the focus.", "elementary programs—such as KCUSD's Dual Language Immersion program—could be overlooked or cut to meet high school priorities."]

[section.line.visual]
kind = "list"
source = "argument-against"
items = ["Ends local control of elementary schools", "Elementary programs could be cut"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote is in favor of reorganizing this district into two new unified districts, dissolving it and two elementary districts."
sources = ["impartial-analysis", "measure-list"]

[section.line.visual]
kind = "page"
source = "measure-list"
highlight = ["be reorganized to form a new unified school district"]

[[section.line]]
text = "A no vote is against the reorganization, so all three of today's districts would remain."
sources = ["impartial-analysis", "measure-list"]

[section.line.visual]
kind = "page"
source = "measure-list"
highlight = ["resulting in the dissolution of"]

[[question]]
ask = "Which districts would be dissolved, and which would stay?"
lines = ["two-districts", "dissolved"]

[[question]]
ask = "Who would run the new districts, and when would they start?"
lines = ["boards"]

[[question]]
ask = "What vote does the measure need to pass?"
lines = ["threshold"]
