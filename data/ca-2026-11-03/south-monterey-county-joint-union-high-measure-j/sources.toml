# Archived sources for South Monterey County Joint Union High School
# District Measure J, 2026-11-03 general election
# (sources/county-sources.md). Every id here may be cited by script.toml.
# `kind` must be one the standard allows (docs/STANDARD.md, section 1).
#
# The County of Monterey Elections Department posts each local measure's
# letter, vote threshold and ballot question on its "List of Local
# Measures" page, with links to each filed document. The card quotes the
# ballot question from that page. County Counsel's impartial analysis is
# the measure's neutral explanation, the kind a state's attorney
# general's explanatory statement is. The "Full Text" the county posts is
# a one-page statement of the reorganization (a text PDF). Measure J is
# not a tax and has no tax rate statement. Both sides filed an argument,
# and the proponents a rebuttal to the argument against; no rebuttal to
# the argument in favor was filed.
#
# The county's other PDFs are scans with no text layer. The passages
# cited were typed from the page images into
# sources/county-*-transcription.txt, each naming the PDF and URL it
# copies; those sources point at the transcription, and their url at the
# scan.

[contest]
id = "ca-2026-11-03-south-monterey-county-joint-union-high-measure-j"
