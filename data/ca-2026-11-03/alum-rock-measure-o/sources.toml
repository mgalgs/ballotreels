# Archived sources for Alum Rock Union Elementary School District Measure
# O, 2026-11-03 general election (sources/sources.md,
# sources/rov-sources.md). Every id here may be cited by script.toml.
# `kind` must be one the standard allows (docs/STANDARD.md, section 1).
#
# The County of Santa Clara Registrar of Voters posts each local measure's
# letter, ballot question and vote threshold on its "List of Local
# Measures" page, with its impartial analysis and arguments as separate
# scans; the page lists "Primary Argument Against (none filed)" for
# Measure O. The card quotes the ballot question from that page. County
# Counsel's impartial analysis is the measure's neutral explanation. The
# full text is the board's resolution as posted for its July 16, 2026
# agenda (unsigned, vote lines blank); it is cited only for what the
# analysis does not give. A parcel tax has no tax rate statement: the
# measure's revenue estimate is in its ballot question.
#
# The ROV's PDFs are scans with no text layer. The passages cited were
# typed from the page images into sources/rov-*-transcription.txt, each
# naming the PDF and URL it copies; those sources point at the
# transcription, and their url at the scan.

[contest]
id = "ca-2026-11-03-alum-rock-measure-o"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/school_district:alum_rock_union_elementary_school_district"
kind = "measure"
title = "Alum Rock Union Elementary School District Measure O: Replacement Education Parcel Tax"

[[source]]
