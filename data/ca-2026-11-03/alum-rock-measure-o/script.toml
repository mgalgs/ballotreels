# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; the tax today and the vote Measure O needs;
# what would change (the rate and years, what the money may pay for, who
# is exempt); the revenue estimate; one line per side; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the opening
# says "the voters of this school district". The card and title carry the
# names. "Counsel" is heard as "Council" (standard/speakability.txt), so
# the narration does not say it.
#
# Measure O replaces the 2022 Measure I parcel tax, which the impartial
# analysis gives as "$214.10 per parcel, adjusted annually": the script
# says "adjusted each year" beside that figure, and the chart labels it
# as approved, so neither suggests it is today's exact rate.
#
# The card quotes the Registrar of Voters' List of Local Measures, which
# prints the ballot question with no yes and no sentences, so the card has
# no boxes and the vote lines take their meaning from the impartial
# analysis. The ballot question's $6.5 million a year is district
# revenue, and no archived source states the district's budget, so it has
# no scale (STANDARD.md 6.5; left open). The tax per parcel is exempt.
#
# The List of Local Measures shows "Primary Argument Against (none
# filed)". The no side says so plainly; its section is marked
# filed = false.

contest = "ca-2026-11-03-alum-rock-measure-o"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "measure-list"
number = "O"
title = "Parcel Tax"
origin = "Alum Rock Union Elementary School District"
summary = "With funds that cannot be taken by State or Federal Government officials, shall Alum Rock Union Elementary School District's measure to protect services for students with disabilities; improve reading, writing, math and science programs; attract and retain highly qualified teachers; and support students experiencing housing instability be adopted, by replacing the current tax at $310 per parcel for seven years, while raising $6.5 million annually with senior exemptions, and public disclosure of all spending?"

[[section]]
id = "what"
heading = "Measure O"

[[section.line]]
text = "Measure O asks the voters of this school district whether to replace their parcel tax with a tax of $310 a parcel for seven years."
sources = ["measure-list", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "measure-list"
highlight = ["replacing the current tax at $310 per parcel for seven years"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "today-tax"
text = "In 2022, the district's voters approved a parcel tax of $214.10 a parcel, adjusted each year, for seven years."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "bars"
title = "Parcel tax per parcel, dollars"
source = "impartial-analysis"
unit = ""
labels = ["2022 tax, as approved", "Measure O"]
values = [214.10, 310]

[[section.line]]
id = "threshold"
text = "Measure O needs two-thirds of the vote to pass."
sources = ["impartial-analysis", "measure-list"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "amount"
text = "The 2022 tax would stop, and the new tax of $310 a parcel would run each year from July 1, 2027, for seven years."
sources = ["impartial-analysis", "text"]

[section.line.visual]
kind = "illustration"
name = "special-tax"

[[section.line]]
id = "uses"
text = "The money could pay only for listed purposes, such as reading, math and science, special education, and pay for teachers and staff."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "school-classroom"

[[section.line]]
id = "exempt"
text = "Owners aged 65 or older who live on their parcel could apply for an exemption, and so could some residents with disabilities."
sources = ["impartial-analysis"]

[[section]]
id = "fiscal"
heading = "What the ballot question says"

[[section.line]]
id = "revenue"
text = "The ballot question says the tax would raise $6.5 million a year."
sources = ["measure-list", "text"]

[section.line.visual]
kind = "page"
source = "measure-list"
highlight = ["raising $6.5 million annually"]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Measure O protects the teachers, services and programs already at work in schools, and its funds cannot be taken by the state."
sources = ["argument-for"]
basis = ["Your YES vote on Measure O protects the teachers, services and programs already at work in our schools.", "Measure O funds cannot be taken by State or Federal government officials and spent elsewhere."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Protects teachers, services and programs", "Funds cannot be taken by the state"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure O was filed, so the list of local measures from the county shows only the argument in favor of it."
sources = ["measure-list"]

[section.line.visual]
kind = "list"
source = "measure-list"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote replaces the existing parcel tax with the new $310 tax for seven years, beginning July 1, 2027."
sources = ["impartial-analysis", "measure-list"]

[section.line.visual]
kind = "page"
source = "measure-list"
highlight = ["replacing the current tax at $310 per parcel for seven years"]

[[section.line]]
text = "A no vote does not replace the tax."
sources = ["impartial-analysis", "measure-list"]

[section.line.visual]
kind = "page"
source = "measure-list"
highlight = ["be adopted"]

[[question]]
ask = "Is this a new tax, or does it replace one?"
lines = ["today-tax", "amount"]

[[question]]
ask = "Who would be exempt?"
lines = ["exempt"]

[[question]]
ask = "What would the money pay for?"
lines = ["uses"]

[[question]]
ask = "How large is $6.5 million a year next to the district's budget?"
unanswered = true
