# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and whose measure it is; what the tax is and who pays it; the rate
# today; what would change (the phases, where the money goes and for how
# long) and the vote it needs; the city's revenue estimate; one line per
# side; what a vote does.
#
# The guide prints no ballot question: the card quotes it from the City
# Council's resolution, and the vote lines quote the City Attorney's
# Impartial Analysis's yes/no statements, highlighting the card's own
# "be adopted?". The guide prints no fiscal statement; the one estimate
# is the City's, in the impartial analysis. No archived source states
# the city's General Fund total, so it has no scale (STANDARD.md 6.5;
# left open). That residents do not pay the tax, and the outside study
# of lodging demand, are the supporters' points, so they stay out of the
# neutral sections (STANDARD.md 6.3); the analysis's "paid by the
# transient occupant" stays in, as the ballot question says it too.
#
# No argument against was filed: the no side says so, filed = false
# (STANDARD.md 2.5).

contest = "ca-2026-11-03-needles-measure-k"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "K"
title = "CITY OF NEEDLES QUALITY OF LIFE AND ESSENTIAL CITY SERVICES MEASURE"
origin = "RESOLUTION OF THE CITY COUNCIL OF THE CITY OF NEEDLES"
summary = "Shall the measure to maintain and improve quality of life by supporting local businesses and jobs; keeping public areas safe, clean, and well maintained; maintaining and improving streets, parks, and other public infrastructure; and funding other general City services, by increasing the City of Needles Transient Occupancy Tax paid primarily by hotel, motel, and short-term rental guests from 10% to 14% in phases, generating approximately $400,000 annually, with annual public disclosure and remaining in effect until ended by voters, be adopted?"

[[section]]
id = "what"
heading = "Measure K"

[[section.line]]
text = "City of Needles Measure K asks Needles voters whether to raise the tax on hotel and other short stays to 14 percent."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["from 10% to 14% in phases"]

[[section]]
id = "background"
heading = "What the tax is"

[[section.line]]
id = "who-pays"
text = "Guests pay this tax on stays of 30 days or less at hotels, motels, RV parks and short-term rentals."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "city-storefronts"

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Today, the rate is 10 percent of the rent."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "bars"
title = "Tax rate, percent of the rent"
source = "impartial-analysis"
unit = "%"
labels = ["Today", "From 2027", "From 2029", "From 2030"]
values = [10, 12, 13, 14]

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "Measure K would raise the rate to 12 percent in 2027, 13 percent in 2029, and 14 percent in 2030."
sources = ["impartial-analysis"]

[[section.line]]
text = "The money could pay for any city purpose, until voters end the tax."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "special-tax"

[[section.line]]
text = "Measure K needs a majority of the vote to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "fiscal"
heading = "What the impartial analysis says"

[[section.line]]
text = "The impartial analysis says the city expects about $200,000 a year at first, and about $400,000 from 2030."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "bars"
title = "Expected new revenue each year, in dollars"
source = "impartial-analysis"
unit = ""
labels = ["From 2027", "From 2029", "From 2030"]
values = [200000, 300000, 400000]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Measure K asks visitors to contribute more toward Needles, and keeps the money for local services."
sources = ["argument-for"]
basis = ["Measure K asks those visitors to contribute more toward maintaining the community and services they use.", "These funds remain local and can support streets, parks, public infrastructure, public safety, economic development, and other essential City services."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Visitors contribute more toward Needles", "Money stays local for streets, parks and safety"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure K was filed, so the county voter guide prints only the argument of supporters."
sources = ["argument-for"]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote is in favor of raising the tax to 14 percent in phases."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["be adopted?"]

[[section.line]]
text = "A no vote is against the measure, keeping the tax at 10 percent."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["be adopted?"]

[[question]]
ask = "Who pays the tax?"
lines = ["who-pays"]

[[question]]
ask = "How big is the city's budget, compared with the tax?"
unanswered = true
