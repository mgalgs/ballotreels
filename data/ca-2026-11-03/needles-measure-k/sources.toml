# Archived sources for City of Needles Measure K, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1). The guide's pages are cut from the San
# Bernardino County Registrar of Voters' Voter Information Guide; "page"
# is the guide's printed footer number (its PDF pages are two higher).
#
# The guide prints neither the ballot question nor the full text: the
# question is in the City Council's resolution (its Section 3), which
# the card quotes, and the ordinance is in the full text posted beside
# it.

