# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and of whom; how a school bond is repaid and what it needs to
# pass; what the money would pay for; the district's tax statement; one
# line per side; what a vote does.
#
# The guide's Full Text prints the ballot question (the card's title);
# County Counsel's Impartial Analysis, on the same pages, gives the card's
# origin, summary and yes and no lines. "Counsel" is heard as "Council"
# (standard/speakability.txt). The bond total and the debt service are
# repaid from a tax on property in the district, and no official archived
# source states the district's budget (the $173 million in the argument
# against is that side's figure), so they have no budget scale
# (STANDARD.md 6.5; left open). The fiscal line gives the tax statement's
# highest rate beside its average, as it prints both.
#
# Both sides filed. Each line keeps to its own argument's main point: the
# supporters' "Repair schools. Protect students. Prepare our children for
# the future."; the opponent's earlier bond still being repaid and the
# district's budget.

contest = "ca-2026-11-03-upland-unified-measure-a"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide-page"
number = "A"
title = "To improve the quality of education by modernizing, constructing, upgrading and equipping classrooms, restrooms/school facilities, career technical classrooms/labs; replace roofs; make safety/security improvements; and renovate/replace electrical/plumbing/sewer systems; shall Upland Unified School District's measure be adopted, authorizing $236,700,000 of bonds at legal rates, levying approximately $47.50 per $100,000 assessed value (raising $14,200,000 annually) while bonds are outstanding, with audits, independent oversight, NO money for salaries, including administrators, only Upland USD educational facilities?"
origin = "This Measure was placed on the ballot by a resolution adopted by the Board of Education of the Upland Unified School District (District)."
summary = "The bond proceeds may only be used for the types of projects listed in the Measure which is contained in Exhibit B to the Resolution."
yes = "A \"yes\" vote by at least fifty-five percent of the voters voting on this Measure will authorize the District to issue bonds in the amount of $236,700,000 to be used solely for the purposes set forth in this ballot Measure."
no = "A \"no\" vote means that the District will not be authorized to issue and sell the $236,700,000 in bonds set forth in the Measure."

[[section]]
id = "what"
heading = "Measure A"

[[section.line]]
text = "Upland Unified School District Measure A asks the district's voters whether to approve $236.7 million in school bonds."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["authorizing $236,700,000 of bonds"]

[[section]]
id = "today"
heading = "How a school bond works"

[[section.line]]
text = "The district would borrow the money and repay it from a tax on property in the district."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "bond-certificates"

[[section.line]]
text = "Measure A needs 55 percent of the vote to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
