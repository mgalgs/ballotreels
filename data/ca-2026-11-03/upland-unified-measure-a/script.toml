sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "school-classroom"

[[section]]
id = "fiscal"
heading = "What the tax statement says"

[[section.line]]
text = "The district's tax statement estimates an average tax of $47.46 per $100,000 of assessed value, and at most $49, through 2062-2063."
