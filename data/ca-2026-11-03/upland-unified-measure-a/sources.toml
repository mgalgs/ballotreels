# Archived sources for Upland Unified School District Measure A,
# 2026-11-03 general election (sources/sources.md). Every id here may be
# cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1). The guide's pages are cut from the San
# Bernardino County Registrar of Voters' comprehensive Voter Information
# Guide, PDF pages 168 to 176; "page" is the guide's printed footer
# number (SB COMPREHENSIVE-166 to -174).
#
# The guide's Full Text prints the ballot question ("the full proposition
# presented to the voters"); with County Counsel's Impartial Analysis,
# which states what a yes and a no vote do, it is the card's source. Its
# wording differs a little from both versions in the district's
# resolution (it ends "NO money for salaries, including administrators,
# only Upland USD educational facilities?"); the card quotes the guide's.

[contest]
id = "ca-2026-11-03-upland-unified-measure-a"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/school_district:upland_unified_school_district"
kind = "measure"
title = "Upland Unified School District Measure A: School Facility Bonds"

