# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; today's tax, who placed the
# measure; the vote it needs; what would change (the new tax, how it may
# rise, what it pays for, how long it lasts, what happens if it fails);
# the impartial analysis's revenue estimate; one line per side; what a
# vote does.
#
# An argument in favor was printed; no argument against was ("NO
# ARGUMENTS AGAINST THIS MEASURE WERE SUBMITTED"), so the no side says
# so, filed = false (STANDARD.md 2.5), citing the pamphlet page that
# prints the notice. The supporters' figures (paving estimates, the
# district's yearly income) are theirs, so they stay in their section or
# out (STANDARD.md 6.3).
#
# The pamphlet prints no tax rate statement; the revenue estimate is in
# the ballot question and County Counsel's impartial analysis, which the
# fiscal line names as the county attorney's ("Counsel" is heard as
# "Council", standard/speakability.txt). The money is the district's own
# road revenue, and no official source states a budget it would be part
# of (the supporters' "$55,000 annually" is theirs), so it has no scale
# (STANDARD.md 6.5; left open). The per-parcel amounts are exempt. The
# start year is the ballot question's ("commencing fiscal year
# 2026/2027").

contest = "ca-2026-11-03-garden-valley-ranch-measure-h"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide-page"
number = "H"
title = "IMPARTIAL ANALYSIS OF MEASURE H"
origin = "This Measure was placed on the ballot by the Board of Directors of the District"
summary = "Shall the measure to levy an annual special tax in an amount of $250.00 with annual adjustments tied to the Consumer Price Index (CPI) not to exceed 4% on each parcel of land within the Garden Valley Ranch Community Service District commencing fiscal year 2026/2027 and continuing for an unlimited duration, to be used only for road improvement and maintenance and generating an annual revenue of approximately $44,000.00, to replace the current special tax of $150.00, be adopted?"
yes = "A “YES” vote is a vote to authorize the levy of the increased annual special tax in an amount of $250 per parcel, as provided in the Measure."
no = "A “NO” vote is a vote against the levy of the increased annual special tax."

[[section]]
id = "what"
heading = "Measure H"

[[section.line]]
text = "Measure H asks the voters of this community services district whether to raise its yearly road tax from $150 to $250 per parcel."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["an annual special tax in an amount of $250.00"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Voters in the district approved today's $150 tax to maintain and improve its roads."
