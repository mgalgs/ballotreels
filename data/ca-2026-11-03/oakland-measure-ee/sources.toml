# Archived sources for City of Oakland Measure EE, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1). The guide's pages are cut from the
# Alameda County Registrar of Voters' Composite Voter Information Guide
# (PDF pages 933 to 946, printed OMEE-1 to OMEE-14).
#
# The guide prints two impartial analyses: the City Attorney's (what the
# measure does) and the City Auditor's (its financial impact), the
# measure's fiscal statement. Some lines of the guide are set in a font
# with no Unicode map; the checks do not yet read them (a decoder
# from another round will).

