# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; how a school bond is repaid and what it
# needs to pass; what the money may pay for; the district's tax rate
# statement; one line per side; what a vote does.
#
# The card quotes the ballot question from the district's revised
# Appendix B, "Abbreviated Form of Bond Measure", which prints no yes/no
# lines. So the card has no YES/NO boxes, the vote lines give County
# Counsel's impartial analysis's meanings, and both highlight the same
# phrase of the question. "Counsel" is heard as "Council"
# (standard/speakability.txt), so the narration says "the impartial
# analysis".
#
# The bond total and the debt service are repaid from a tax on property
# in the district, and no archived source states the district's budget,
# so they have no budget scale (STANDARD.md 6.5; left open, as for
# Windsor Unified's Measure J). The fiscal line gives the statement's
# average rate beside its highest, as it prints both, and writes its
# "2061-62" in full (standard/speakability.txt). That the money stays
# local, the bar on paying salaries from it, and the oversight
# committee and audits are in the supporters' argument, and the
# opponents argue the last bond's oversight failed, so the neutral
# sections leave them out (STANDARD.md 6.3); the card quotes the
# question's "with citizen oversight, independent audits" as printed.
# The opponents name the district's 2016 bond by its letter; the
# narration says "its 2016 bond".

contest = "ca-2026-11-03-dixon-unified-measure-u"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "U"
title = "ABBREVIATED FORM OF BOND MEASURE"
origin = "APPENDIX B"
summary = "To fix deteriorating roofs, plumbing, gas, and electrical systems, remove asbestos/lead pipes, repair/upgrade aging classrooms, science labs, technology and school facilities to support college/ career readiness in math, science, technology, arts, engineering, and skilled trades; shall Dixon Unified School District’s measure authorizing $49,000,000 in bonds at legal rates be adopted, levying approximately $30 per $100,000 assessed value ($3,000,000 annually) while bonds are outstanding, with citizen oversight, independent audits, and all money locally controlled?"

[[section]]
id = "what"
heading = "Measure U"

[[section.line]]
text = "Measure U asks the voters of this school district whether to approve $49 million in school bonds."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["authorizing $49,000,000 in bonds"]

[[section]]
id = "today"
heading = "How a school bond works"

[[section.line]]
text = "The district would sell the bonds and repay them, with interest, from property taxes in the district."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "bond-certificates"

[[section.line]]
text = "Measure U needs 55 percent of the vote to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "projects"
text = "The money could replace aging portable classrooms, fix roofs, pipes and heating, and make health and safety improvements to school buildings."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "school-roof-repair"

[[section.line]]
text = "The district would decide which projects come first, and passing the measure does not guarantee every listed project."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "school-classroom"

[[section]]
id = "fiscal"
heading = "What the tax statement says"

[[section.line]]
id = "tax-rate"
text = "The district's tax rate statement estimates an average tax of $29 per $100,000 of assessed value, and at most $30, until 2061-2062."
sources = ["tax-statement"]

[section.line.visual]
kind = "bars"
title = "Estimated tax per $100,000 of assessed value"
source = "tax-statement"
unit = ""
labels = ["Average", "Highest"]
values = [29, 30]

[[section.line]]
text = "The statement estimates the total to repay, with interest, at about $105 million."
sources = ["tax-statement"]

[section.line.visual]
kind = "illustration"
name = "debt-payments"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say most district schools are 60 to 70 years old, with failing pipes causing leaks, and all the money stays local."
sources = ["argument-for"]
basis = ["most of our schools were built so long ago (60 to 70 years) that underground pipes and infrastructure are failing, resulting in gas leaks, water leaks, and sewage backups.", "ALL funds STAY LOCAL for DUSD schools/students"]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Aging schools with failing pipes", "All the money stays local"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say the district has not properly maintained its schools, and the oversight committee for its 2016 bond has not done its job."
sources = ["argument-against"]
basis = ["the pattern is clear: facilities are not being properly maintained.", "Yet the Measure Q oversight committee - which is supposed to ensure transparency - has not done its job.", "repeating many of the same promises made under Measure Q in 2016."]

[section.line.visual]
kind = "list"
source = "argument-against"
items = ["Schools not properly maintained", "Last bond’s oversight fell short"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote means up to $49 million in bonds may be issued for the school projects in the measure."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["authorizing $49,000,000 in bonds"]

[[section.line]]
text = "A no vote means the bonds will not be authorized."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["authorizing $49,000,000 in bonds"]

[[question]]
ask = "What would the bond money pay for?"
lines = ["projects"]

[[question]]
ask = "How much would property owners pay?"
lines = ["tax-rate"]
