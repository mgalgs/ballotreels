# Archived sources for Dixon Unified School District Measure U,
# 2026-11-03 general election (sources/sources.md). Every id here may be
# cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# No printed Solano County voter guide was archived: these are the filed
# documents the Solano County Registrar of Voters posts on its Current
# Election Information page. The ballot question is quoted from the
# district's revised Appendix B, "Abbreviated Form of Bond Measure",
# which its July 28, 2026 letter asks the Registrar to put in place of
# the first one (to give the tax rate per $100,000 rather than per $100);
# sources.md finds the Notice of Measures prints the same words. County
# Counsel's impartial analysis is the measure's neutral explanation; the
# district's Tax Rate Statement (Appendix C) is its fiscal statement. The
# statement is a scan with no text layer: the passages `check` reads
# verbatim were typed from the page image into a transcription beside
# the PDF, which names the PDF and URL it copies; that source points at
# the transcription, and its url at the scan. The rebuttals are not
# cited.

[contest]
id = "ca-2026-11-03-dixon-unified-measure-u"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/school_district:dixon_unified_school_district"
kind = "measure"
title = "Dixon Unified School District Measure U: School Repair Bonds"

