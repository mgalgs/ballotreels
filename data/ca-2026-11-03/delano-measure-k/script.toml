# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the three mayor questions on
# this ballot and how they reached it; how the mayor is chosen today;
# what would change (an elected mayor and four council members, from
# when, who may run, the vote each measure needs); no cost estimate; both
# sides, neither of which has an argument among the county's documents;
# what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". The card and title carry it.
# The council's vote is said as who voted, not as a tally.
#
# The one official text is the City's Resolution No. 2025-43, which
# orders the three questions (K, L and M) submitted together and
# attaches two ordinances: an elected mayor with a two-year term, and
# with a four-year term. Measure K's question sets no term; Measures L
# and M ask it. The script says that much, and nothing about how the
# three would combine beyond what the documents say (see [[question]]):
# the resolution does not say what follows if K passes and neither term
# measure does, or both do.
#
# The card quotes K's box as the resolution prints it: its question,
# and its own "Yes" and "No" sentences, which take the card's YES and NO
# boxes (the "No" sentence starts in lower case, as printed). The vote
# lines quote them, each highlighted in its box.
#
# Kern County Elections' page posts no impartial analysis and no
# argument for or against Measure K, and no document says that none was
# filed. So the sides do not say none was filed: each says none is
# among the documents gathered (filed = false, STANDARD.md 2.5), as for
# Livingston T and U.

contest = "ca-2026-11-03-delano-measure-k"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "K"
title = "ELECTIVE OFFICE OF MAYOR"
origin = "RESOLUTION NO. 2025 - 43"
summary = "Shall the electors elect a mayor and four city council members?"
yes = 'A "Yes" vote means the citizens directly elect the mayor;'
no = 'a "No" vote continues the practice that the council chooses one of its number to preside as Mayor on an annual basis.'

[[section]]
id = "what"
heading = "Measure K"

[[section.line]]
text = "Measure K asks the voters of this city whether to elect the mayor directly, along with four council members."
sources = ["ballot-question"]

