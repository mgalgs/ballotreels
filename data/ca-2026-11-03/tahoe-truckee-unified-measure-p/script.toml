# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; the parcel tax today and when it ends; what
# it needs to pass; what would change (the new rate, its length,
# inflation, what the money may pay for); the measure's revenue
# estimate, as the impartial analysis reports it; one line per side;
# what a vote does. The exemptions are left to the card's question
# ("senior exemptions") to keep the film near 60 seconds.
#
# The card's title is the PDF's own head; its origin and yes and no lines
# are County Counsel's Impartial Analysis (the origin stops before the
# resolution's number, which pdftotext breaks at a hyphen). "Counsel" is
# heard as "Council" (standard/speakability.txt), so the narration says
# "the impartial analysis". The district prints its name without a
# hyphen ("Tahoe Truckee"); the narration says it as printed.
#
# No archived source states the district's budget for the $7 million a
# year to be compared with, so it has no scale (STANDARD.md 6.5; left
# open). The measure's own findings put parcel tax funding at "over 5%"
# of the budget and the argument in favor at "over 6%"; both describe
# today's tax, not the $7 million, and the larger is a side's, so
# neither is used. $148, $40 and $188 are amounts per parcel (exempt).
#
# Sides come from the argument in favor and the argument against; no
# rebuttal to the argument in favor was submitted, and the rebuttal to
# the argument against is not used.

contest = "ca-2026-11-03-tahoe-truckee-unified-measure-p"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "P"
title = "EDUCATION PARCEL TAX MEASURE – TAHOE TRUCKEE UNIFIED SCHOOL DISTRICT"
origin = "This measure was placed on the ballot by the governing board of the District"
summary = "To protect quality education in local schools, continue supporting math, science, engineering, technology, arts, and skilled trades/job training programs preparing students for success in college/careers; attracting/retaining highly qualified teachers; and maintaining manageable class sizes, shall Tahoe Truckee Unified School District’s measure be adopted, renewing the expiring $148 annual school parcel tax with a $40 increase, for nine years, with senior exemptions, annual inflation adjustments, independent oversight/ audits, and all funds (approximately $7,000,000 annually) benefiting local students?"
yes = "A “YES” vote on this Measure is a vote to authorize the special tax described in the measure."
no = "A “NO” vote on this Measure is a vote against the proposed special tax. If the measure is not approved, Measure AA will continue to be collected according to its existing terms."

