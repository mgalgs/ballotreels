# Archived sources for City of Culver City Measure AA, 2026-11-03 general
# election (sources/la-sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The Los Angeles County Registrar-Recorder/County Clerk's list "Measures
# Appearing on the Ballot" is the authority for the measure's letter,
# ballot question and vote threshold, and names who filed the arguments;
# sources/county-measure-list-excerpt.txt is the measure's entry, cut from
# it. The City Clerk's "Upcoming Election Information" page prints the
# City Attorney's impartial analysis, the argument in favor and the
# argument in opposition (and both rebuttals, not cited) for all three of
# the city's measures. The impartial analysis is the measure's neutral
# explanation, the kind a state's attorney general's explanation is.
# Resolution No. 2026-R083, which accepts the petition and places the
# initiative on the ballot, is a scan with no text layer: its first two
# pages were typed from the page images into
# sources/resolution-transcription.txt, which that source points at. No
# tax rate statement or other fiscal statement was found; the ballot
# question states the yearly revenue.

[contest]
id = "ca-2026-11-03-culver-city-measure-aa"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:culver_city"
kind = "measure"
title = "City of Culver City Measure AA: Special Parcel Tax for Local Public Schools"

