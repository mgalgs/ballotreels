# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and who placed it; the council today; what would change (the
# limit, the break, when it starts counting); that the guide gives no
# cost estimate; one line per side; what a vote does.
#
# The City Attorney's Impartial Analysis is cited as the guide page. The
# guide prints no fiscal statement (not a tax measure): the fiscal line
# follows the no-cost-estimate wording. The sides' records (the share of
# Orange County cities with limits; how long past members have served)
# are their own points, so they stay out of the neutral sections
# (STANDARD.md 6.3). The script names no one.

contest = "ca-2026-11-03-laguna-beach-measure-e"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide-page"
number = "E"
title = "City of Laguna Beach, An Ordinance of the People of the City of Laguna Beach, California, Adding Section 2.04.080 to the Laguna Beach Municipal Code to Establish Term Limits for City Council Members"
origin = "Measure E was placed on the ballot by a citizens’ initiative petition."
summary = "Shall an ordinance to amend the Laguna Beach Municipal Code by enacting a limit on consecutive years of service by members of the City Council to a combined total of two four-year consecutive terms, with the ability to again serve as a Councilmember after a lapse of service of at least two years, be adopted?"
yes = "A “yes” vote on Measure E will approve the establishment of City Council term limits as described above."
no = "A “no” vote on Measure E will not approve the establishment of City Council term limits as described above and the City of Laguna Beach will continue not to have City Council term limits."

[[section]]
id = "what"
heading = "Measure E"

[[section.line]]
text = "Laguna Beach Measure E asks the voters of Laguna Beach whether to set term limits for City Council members."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["enacting a limit on consecutive years of service"]

[[section.line]]
text = "Measure E was placed on the ballot by a citizens' initiative petition."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "ballot-box"

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Today, Laguna Beach elects five City Council members to four-year terms, with no term limits."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "school-board-room"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "Measure E would limit members to two four-year terms in a row."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "end-date"

[[section.line]]
text = "After a break of two years, a person could serve two more terms."
sources = ["guide-page"]

[[section.line]]
text = "Only terms starting with the November 2026 election would count toward the limit."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "extend-deadline"

[[section]]
id = "fiscal"
heading = "What it would cost"

[[section.line]]
text = "The Orange County Voter Information Guide does not include a cost estimate for the measure."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"
stamp = "None reported"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say incumbents hold big advantages, and term limits level the playing field, bringing fresh ideas."
sources = ["arguments"]
basis = ["Running against an incumbent is a big deterrent for newcomers", "Term limits helps level the playing field.", "Term limits also enliven our democracy by bringing more people with fresh new ideas onto council."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Levels the field against incumbents", "Brings in new people and fresh ideas"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say elections already hold members accountable, and limits force out experienced officials voters still trust."
sources = ["arguments"]
basis = ["Term limits don’t add accountability — elections are the real accountability mechanism.", "they force out experienced officials on an arbitrary clock.", "voters stripped of the right to reelect leaders they still trust."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Elections already hold members accountable", "Forces out experienced officials"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote approves term limits for the City Council."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["will approve the establishment of City Council term limits"]

[[section.line]]
text = "A no vote means Laguna Beach will continue to have no council term limits."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["will continue not to have City Council term limits"]
