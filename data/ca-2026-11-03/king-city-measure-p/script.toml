# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the tax today and when it ends;
# what would change (the rate, no end date, a general tax into the
# general fund, an oversight committee, a simple majority); the revenue
# as the resolution gives it; the two sides, whose arguments are not
# online; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". The card, title and chart
# titles carry it. "1.5 percent", not "1.5 cents"
# (standard/speakability.txt).
#
# Only the county's List of Local Measures (the card) and the City
# Council's Resolution No. 2026-5097, adopted and signed, whose ballot
# question matches the county's word for word, are cited; its Exhibit A
# is the ordinance voters would adopt. The ballot question says the tax
# is reauthorized "at a rate of 1.5¢"; the resolution says this raises
# today's 1% rate by 0.5% and removes its 2029 end date, so the script
# says both, from the resolution. The ballot question's list of uses is
# on the card, and not narrated: the tax is a general tax. The
# resolution's recitals that argue for the tax (the City's finances, its
# volunteer fire department, its streets) are left out: they are the
# City's case, and no argument is online to set beside them (STANDARD.md
# 6.3). The resolution's certificate leaves the council's vote blank, so
# the script does not give one.
#
# The county says the measure's documents are filed with the city clerk;
# none is online, so it is not known whether any argument was filed. Each
# side says only that any argument is filed with the city clerk and is
# not online (filed = false, STANDARD.md 2.5), and presents no side.
#
# The $1.2 million and $3.6 million a year are the resolution's figures.
# No archived source states the City's general fund budget, so they have
# no scale (STANDARD.md 6.5; left open, under [[question]]).

contest = "ca-2026-11-03-king-city-measure-p"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "measure-list"
number = "P"
title = "King City Public Safety, Local Services Measure."
origin = "City of King"
summary = "Shall the measure continuing King City’s locally controlled funding for general city services, such as maintaining 911 fire, medical, police response, gang/violent crime prevention/investigation, and King City’s financial stability; providing firefighter protective clothing/ breathing equipment; repairing streets/ potholes, by reauthorizing its sales tax at a rate of 1.5¢, providing approximately $3,600,000 annually until ended by voters; requiring audits, public disclosure, citizens’ oversight, all funds benefit King City residents, be adopted?"

[[section]]
id = "what"
heading = "Measure P"

[[section.line]]
text = "Measure P asks the voters of this city whether to raise the local sales tax from 1 percent to 1.5 percent, and keep it until ended by voters."
sources = ["measure-list", "resolution"]

[section.line.visual]
kind = "page"
source = "measure-list"
highlight = ["by reauthorizing its sales tax at a rate of 1.5¢"]

[[section]]
id = "today"
heading = "The tax today"

[[section.line]]
id = "today-end"
text = "The city has a general sales tax of 1 percent, which expires on April 1, 2029."
sources = ["resolution"]

[section.line.visual]
kind = "illustration"
name = "sales-receipt"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "Measure P would raise the rate to 1.5 percent."
sources = ["resolution"]

[section.line.visual]
kind = "bars"
title = "Local sales tax rate in King City"
source = "resolution"
unit = "%"
labels = ["Today", "With Measure P"]
values = [1, 1.5]

[[section.line]]
id = "end"
text = "The tax would no longer expire in 2029, and would remain in effect until ended by voters."
sources = ["resolution"]

[section.line.visual]
kind = "illustration"
name = "end-date"

[[section.line]]
id = "uses"
text = "As a general tax, the money would go to the general fund, and a community committee would recommend how to spend it."
sources = ["resolution"]

[section.line.visual]
kind = "illustration"
name = "city-council-chamber"

[[section.line]]
text = "Measure P needs a simple majority to pass."
sources = ["resolution", "measure-list"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "fiscal"
heading = "What the resolution says"

[[section.line]]
id = "revenue"
