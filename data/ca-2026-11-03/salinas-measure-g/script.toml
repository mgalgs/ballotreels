# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; how the tax began and when it
# would end today; what would change (no end date, the oversight
# committee, general services, a simple majority); the revenue as the
# ballot question gives it; the two sides, whose arguments are not
# online; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". The card and title carry it.
# "1 percent", not "1 cent" (standard/speakability.txt).
#
# Only the county's List of Local Measures (the card) and the City
# Council's resolution, whose ballot question matches the county's word
# for word, are cited. The resolution's recitals that argue for the tax
# (the 2014 vote share, the survey, that no budget cuts could replace
# it) are left out: they are the City's case, and no argument is online
# to set beside them (STANDARD.md 6.3). The ballot question's list of
# uses and "Without raising taxes" are on the card, not narrated.
#
# The county says the measure's documents are filed with the city clerk;
# none is online, so it is not known whether any argument was filed. Each
# side says only that any argument is filed with the city clerk and is
# not online (filed = false, STANDARD.md 2.5), and presents no side.
#
# The $30 million a year is the ballot question's figure. No archived
# source states the City's general fund budget, so it has no scale
# (STANDARD.md 6.5; left open, under [[question]]).

contest = "ca-2026-11-03-salinas-measure-g"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "measure-list"
number = "G"
title = "City of Salinas"
origin = "Majority Voter Approval Required"
summary = "Without raising taxes, shall the City of Salinas renew Measure G maintaining the existing 1¢ local sales tax providing approximately $30,000,000 annually until ended by the voters to continue funding street and sidewalk repairs and other long-term infrastructure projects, parks, youth and senior programs, police, fire, and emergency response, homeless reduction, and other general city services, with independent citizen oversight, annual audits, and all funds dedicated to and remaining in Salinas?"

[[section]]
id = "what"
heading = "Measure G"

[[section.line]]
text = "Measure G asks the voters of this city whether to renew an existing 1 percent sales tax until ended by voters."
sources = ["measure-list", "resolution"]

[section.line.visual]
kind = "page"
source = "measure-list"
highlight = ["renew Measure G maintaining the existing 1¢ local sales tax"]

[[section]]
id = "background"
heading = "How the tax began"

[[section.line]]
id = "began"
text = "Voters approved the tax in 2014, to last 15 years and end in 2030 unless voters changed it."
sources = ["resolution"]

[section.line.visual]
kind = "timeline"
source = "resolution"
labels = ["2014", "2030"]
items = ["Voters approve a 1% sales tax", "The tax is set to end"]

[[section]]
id = "today"
heading = "The tax today"

[[section.line]]
text = "The tax is 1 percent of the price of goods sold in the city."
sources = ["resolution"]

[section.line.visual]
kind = "illustration"
name = "sales-receipt"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "end"
text = "Measure G would keep the rate at 1 percent and remove the 2030 end date, so the tax lasts until voters end or change it."
sources = ["resolution"]

[section.line.visual]
kind = "illustration"
name = "end-date"

[[section.line]]
id = "uses"
text = "The money would support general city services, and a committee of members of the public would review and report on its use."
sources = ["resolution"]

[section.line.visual]
kind = "illustration"
name = "city-council-chamber"

[[section.line]]
text = "Measure G needs a simple majority to pass."
sources = ["resolution", "measure-list"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "fiscal"
heading = "What the ballot question says"

[[section.line]]
id = "revenue"
text = "The ballot question says the tax provides about $30 million a year."
sources = ["measure-list"]

[section.line.visual]
kind = "page"
source = "measure-list"
highlight = ["providing approximately $30,000,000 annually"]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"
filed = false

[[section.line]]
text = "Any argument for Measure G is filed with the city clerk, and is not online."
sources = ["measure-list"]

[section.line.visual]
kind = "list"
source = "measure-list"
items = ["Filed with the city clerk, not online"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "Any argument against Measure G is filed with the city clerk, and is not online."
sources = ["measure-list"]

[section.line.visual]
kind = "list"
source = "measure-list"
items = ["Filed with the city clerk, not online"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote renews the 1 percent sales tax until ended by voters."
sources = ["measure-list", "resolution"]

[section.line.visual]
kind = "page"
source = "measure-list"
highlight = ["renew Measure G maintaining the existing 1¢ local sales tax"]

[[section.line]]
text = "A no vote does not renew the tax, which would end in 2030."
sources = ["measure-list", "resolution"]

[section.line.visual]
kind = "page"
source = "measure-list"
highlight = ["renew Measure G maintaining the existing 1¢ local sales tax"]

[[question]]
ask = "When does the tax end today?"
lines = ["began"]

[[question]]
ask = "What could the money be spent on, and who watches it?"
lines = ["uses"]

[[question]]
ask = "What do supporters and opponents say?"
unanswered = true

[[question]]
ask = "How big is $30 million a year next to the city budget?"
unanswered = true
