# Archived sources for Stinson Beach County Water District Measure EE,
# 2026-11-03 general election (sources/sources.md, its section "Marin
# County Elections measure page, read 2026-10-30"). Every id here may be
# cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# Who votes: a county water district has no Census boundary, so the
# division is the county and `voters` names the district
# (docs/SCRIPT-FORMAT.md), as for Inverness Public Utility District
# Measure AA.
#
# The County of Marin's page for Measure EE (read in a browser and saved
# as text, sources/county-page.txt) prints the ballot question the card
# quotes, the vote it needs ("Votes required to pass: simple
# majority."), County Counsel's impartial analysis (the measure's neutral
# explanation, the kind a state's attorney general's explanatory
# statement is), the argument in favor, and the county's statement that
# no argument against was filed. No fiscal statement is printed. The
# county's "Full text of Measure EE" page (sources/county-full-text.txt)
# is the District's Resolution No. GB 2026-03, adopted May 16, 2026,
# which orders the election and states the question; its recital of the
# District's "best interests" is the Board's and is not narrated.

[contest]
id = "ca-2026-11-03-stinson-beach-cwd-measure-ee"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/county:marin"
kind = "measure"
title = "Stinson Beach County Water District Measure EE: Setting the District's Appropriations Limit for Fiscal Years 2026-2027 Through 2029-2030"
voters = "the Stinson Beach County Water District"

