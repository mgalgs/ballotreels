# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; what an appropriations limit is
# (the impartial analysis), who placed it and the vote it needs; what
# would change if it passes and if it fails, and that it raises no tax
# rate (all the analysis's); no cost estimate; one line per side; what a
# vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this water district". The card, the title
# and the "Only voters in ..." line carry the name. No person is named.
#
# The narration calls the appropriations limit "the spending limit", as
# the impartial analysis does ("also known as an appropriations limit"),
# and says what it is in the analysis's words. The analysis is not named
# by its author ("Counsel" is heard as "Council"). That the measure "does
# not authorize the District to impose a new assessment or increase any
# property tax rate" is the analysis's, said as its own line; the
# argument's claim about water rates is the yes side's only.
#
# The card quotes the ballot question as the county's Measure EE page
# prints it. The page prints only YES and NO cells beside the question,
# so the card has no boxes and the vote lines take their meaning from the
# impartial analysis ("whether the District's current appropriations
# limit should continue for another four years").
#
# The county's page prints no fiscal statement, so the fiscal line says
# it includes no cost estimate (glance status "none-printed"). The
# $1,536,312 limit is a figure about the district's budget, and no
# archived source states that budget, so it has no scale (STANDARD.md
# 6.5; left open); it is left to the card, not narrated.
#
# The yes side is the argument in favor. The county's page says "No
# argument against Measure EE was filed.": the no side says so,
# attributed to the county (filed = false, STANDARD.md 2.5).

contest = "ca-2026-11-03-stinson-beach-cwd-measure-ee"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "county-page"
number = "EE"
title = "Measure EE"
origin = "Stinson Beach County Water District"
summary = "Shall the appropriations limit of the Stinson Beach County Water District for Fiscal Year 2026-2027 be established at $1,536,312 and should the limit for that Fiscal Year (i.e., $1,536,312) be used to determine the limits for Fiscal Years 2026-2027 through 2029-2030?"

[[section]]
id = "what"
heading = "Measure EE"

[[section.line]]
text = "Measure EE asks the voters of this water district whether to keep its current spending limit for another four years."
