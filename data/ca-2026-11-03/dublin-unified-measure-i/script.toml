# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and of whom; the parcel tax today and when it ends; what it needs
# to pass; what would change (the new rate, its length, inflation, what
# the money may pay for, who is exempt); the district's revenue
# estimate, as the impartial analysis gives it; one line per side; what
# a vote does.
#
# A parcel tax, not a bond: the guide prints no tax rate statement. The
# revenue estimate is the district's, in the ballot question and County
# Counsel's Impartial Analysis. No archived source states the district's
# budget, so the $2.9 million has no scale (STANDARD.md 6.5; left open);
# the $96, $48 and $144 are amounts per parcel (exempt). The supporters'
# "$12 million already cut" and "$2 million annually" are their
# argument, so they stay out of the neutral sections (STANDARD.md 6.3).
# "Counsel" is heard as "Council" (standard/speakability.txt), so the
# narration says "the impartial analysis".
#
# The impartial analysis prints no yes and no sentences, so the card has
# no boxes; the vote lines take their meanings from the ballot question,
# one phrase each, as Utah's do. No argument against Measure I was
# submitted: the no side says so plainly and is marked filed = false.
# The card's title is the guide page's own head. Much of the page's text
# layer is in glyph ids (checks._unshifted_text reads it back).

contest = "ca-2026-11-03-dublin-unified-measure-i"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide-page"
number = "I"
title = "DUBLIN UNIFIED SCHOOL DISTRICT MEASURE I"
origin = "This Measure is placed on the ballot by the governing board of the District."
summary = "“Shall the measure to support quality education, provide local funding that cannot be taken by the State, maintain small class sizes, attract/retain quality teachers, and provide enhanced science, technology, engineering, visual and performing arts, reading, writing, and math programs, by renewing the expiring $96 school parcel tax, adding $48 per parcel, providing approximately $2,900,000 annually for nine years, with senior exemptions, annual inflation adjustments, independent oversight, and all funds locally controlled, be adopted?”"

[[section]]
id = "what"
heading = "Measure I"

[[section.line]]
text = "Dublin Unified School District Measure I asks the district's voters whether to renew its $96 parcel tax and add $48 per parcel."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["renewing the expiring $96 school parcel tax"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Today, the district levies a $96 parcel tax that voters passed in 2019, which ends on June 30, 2028."
sources = ["guide-page", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "school-classroom"

[[section.line]]
text = "Measure I needs two-thirds of the vote to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "On July 1, 2027, a tax of $144 per parcel a year would replace the current tax, for nine years."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "special-tax"

[[section.line]]
text = "The rate would rise each year with inflation, and the money could go only to the school purposes the measure lists."
sources = ["impartial-analysis"]

[[section.line]]
text = "Owners 65 or older, and some people receiving disability benefits, could apply to be exempt."
sources = ["impartial-analysis"]

[[section]]
id = "fiscal"
heading = "What the impartial analysis says"

[[section.line]]
text = "The impartial analysis says the district estimates the tax would provide about $2.9 million a year."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Measure I keeps classes small, retains strong teachers, and updates funding unchanged since 2008."
sources = ["arguments"]
basis = ["Without this locally controlled funding, classrooms will face larger class sizes, reduced academic programs, and greater difficulty recruiting and retaining outstanding teachers.", "updates parcel tax funding that has remained unchanged since 2008"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Small classes and strong teachers", "Updates funding unchanged since 2008"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure I was submitted for this election's Alameda County Composite Voter Information Guide."
sources = ["arguments"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote renews the parcel tax and adds $48 per parcel."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["adding $48 per parcel"]

[[section.line]]
text = "A no vote lets the expiring $96 parcel tax end in June 2028."
sources = ["guide-page", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["the expiring $96 school parcel tax"]
