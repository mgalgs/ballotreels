# Archived sources for Allan Hancock Joint Community College District
# Measure H, 2026-11-03 general election, as Santa Barbara County's
# voters see it (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# Santa Barbara County Elections prints each ballot type's County Voter
# Information Guide as one PDF; pages 20 to 27 (impartial analysis, tax
# rate statement, argument in favor, full text) and 48 to 49 (sample
# ballot) of Ballot Type 103 were cut into one excerpt, which backs every
# source here. The ballot labels the measure "Measure H2026"; the project
# names it by its bare letter. County Counsel's impartial analysis is the
# measure's neutral explanation; the district's Tax Rate Statement is its
# fiscal statement. No argument against was filed, and no rebuttals are
# printed.
#
# A community college district has no Census boundary, so the measure's
# division is the county and `voters` names the district
# (docs/SCRIPT-FORMAT.md). The district reaches into San Luis Obispo
# County, where the same bond is Measure H-26, staged separately as
# allan-hancock-measure-h-san-luis-obispo; Santa Barbara County, which
# administers the district, keeps the plain name.

[contest]
id = "ca-2026-11-03-allan-hancock-measure-h"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/county:santa_barbara"
kind = "measure"
title = "Allan Hancock Joint Community College District Measure H: College Facility Bonds"
voters = "the Allan Hancock Joint Community College District"

