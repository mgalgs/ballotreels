# Archived sources for City of Berkeley Bond Measure U, 2026-11-03
# general election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1). The guide's pages are cut from the
# Alameda County Registrar of Voters' Composite Voter Information Guide
# (PDF pages 843 to 848); "page" is the guide's printed footer number.
#
# vig-pp843-848.pdf is the cut as archived. Its Times New Roman fonts
# are embedded as CID TrueType with no Unicode map, so pdftotext reads
# most of the text as glyph numbers. vig-pp843-848-text-layer.pdf is the
# same file with one change: a ToUnicode map added to those fonts, from
# Times New Roman's own glyph order (glyph 3-97 is ASCII 32-126; the
# ligatures, curly quotes, dashes and bullet by their glyph numbers),
# checked against the printed pages. The sources below cite it, so the
# checks can read the guide's words.

