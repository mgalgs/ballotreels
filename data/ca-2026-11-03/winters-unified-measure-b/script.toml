# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; that the district's voters in
# both its counties decide it; how a school bond is repaid and the vote
# it needs; what the money may pay for; the district's tax rate
# statement; one line per side; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this school district", and the two
# counties are not named. The district reaches into two counties, and
# its one contest (the `school_district:` division) covers both; the
# background line says so, so no viewer takes it for one county's vote.
# "Counsel" is heard as "Council" (standard/speakability.txt), so the
# narration does not name the impartial analysis's author.
#
# The bond total and the debt service are repaid from a tax on property
# in the district, not from the district's budget, so they need no
# budget scale (STANDARD.md 6.5). The fiscal line gives the tax
# statement's average and highest rates as it prints them, with both
# years in full. That bond money cannot pay salaries is in the
# analysis, but the supporters cite it too, so the neutral line leaves it
# out (STANDARD.md 6.3). No argument against was filed, so the no side
# sets `filed = false`.

contest = "ca-2026-11-03-winters-unified-measure-b"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "B"
title = "Bond Measure"
origin = "This measure was placed on the ballot by the Board of Trustees of the Winters Joint Unified School District, which lies within Yolo and Solano Counties."
summary = "To improve the quality of education; repair or replace leaky roofs; modernize/renovate outdated classrooms, restrooms and school facilities; and replace deteriorating plumbing and sewer systems; shall Winters Joint Unified School District’s measure authorizing $29,900,000 in bonds, at legal interest rates, and levying approximately $49 per $100,000 of assessed valuation (raising $1,600,000 annually) while bonds are outstanding, be adopted, with a Board-appointed citizens’ oversight committee and annual independent audits to assure proper expenditure of funds?"
yes = "A \"YES\" vote is a vote to authorize the District to issue up to $29,900,000 in general obligation bonds and to levy the property tax necessary to repay them."
no = "A \"NO\" vote is a vote against authorizing the bonds and the associated property tax."

[[section]]
id = "what"
heading = "Measure B"

[[section.line]]
text = "Measure B asks the voters of this school district whether to approve $29.9 million in school bonds."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["authorizing $29,900,000 in bonds"]

[[section]]
id = "background"
heading = "Who votes"

[[section.line]]
id = "two-counties"
text = "The district reaches into two counties, and its voters in both decide Measure B."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "county-line-map"

[[section]]
id = "today"
heading = "How a school bond works"

[[section.line]]
text = "The district would repay the bonds from a tax on property in the district, and Measure B needs 55 percent to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "bond-certificates"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "projects"
text = "The money could go only to listed projects, such as roofs, plumbing, sewers, heating and classrooms."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "school-roof-repair"

[[section]]
id = "fiscal"
heading = "What the tax statement says"

[[section.line]]
id = "tax-rate"
text = "The district's tax statement estimates an average tax of $46 per $100,000 of assessed value, and at most $49, through 2061-2062."
sources = ["tax-statement"]

[section.line.visual]
kind = "illustration"
name = "debt-payments"

[[section.line]]
text = "The statement estimates the total to repay, with interest, at $58.6 million."
sources = ["tax-statement"]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Measure B upgrades outdated classrooms, and its funds stay local, audited by an independent citizens' committee."
sources = ["arguments"]
basis = ["aging classrooms and facilities must be upgraded since many do not meet 21st-century educational and technological standards.", "By law, spending must be reviewed and annually audited by an independent citizens' oversight committee.", "All bond funds must be spent locally"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Upgrades outdated classrooms", "Local funds, audited by citizens"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure B was filed by the July deadline, so only an argument in favor appears."
sources = ["arguments"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote authorizes the bonds and the property tax to repay them."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["a vote to authorize the District to issue up to $29,900,000 in general obligation bonds"]

[[section.line]]
text = "A no vote is a vote against the bonds and the property tax."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
