# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; how the measure reached the
# ballot; what would change (how the tax is charged, who is exempt, what
# the money may pay for, the audits, the term and the two-thirds vote it
# needs); the revenue estimate as the impartial analysis gives it; one
# line per side; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". The card and title carry it.
# The rate is under a dollar a square foot, which the narration cannot
# say reliably (standard/speakability.txt): the card shows it, and the
# line says how the tax is charged. The exemptions are the ordinance's
# (Section 4.110.130 D and E): owners with very low household incomes,
# and owners with a senior or disability exemption from the utility
# users tax.
#
# The card quotes the Los Angeles County Registrar-Recorder/County
# Clerk's list "Measures Appearing on the Ballot": the City's heading,
# the vote needed and the ballot question, which has no yes or no
# sentences, so the card has no boxes. The vote lines give the impartial
# analysis's own meanings, and both highlight the same phrase. The
# analysis's paragraph on what the City may face without the measure is
# left out with the measure's stated benefits: both are the City's case.
#
# The sides come from the arguments and rebuttals the Registrar prints:
# for supporters, fewer firefighters than 75 years ago against calls that
# grew more than tenfold, and stations that fail earthquake standards; for
# opponents, that only property owners would pay for a service everyone
# uses, and that audits cannot guarantee results. The audits and the
# limit on uses are stated once, in the neutral lines, from the impartial
# analysis. No filer is named or described, on either side alike.
#
# The $22.1 million a year is the impartial analysis's estimate. No
# archived official document states the City's general fund budget to
# give it a scale (STANDARD.md 6.5; left open, under [[question]]).

contest = "ca-2026-11-03-pasadena-measure-pfd"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "PFD"
title = "CITY OF PASADENA"
origin = "VOTE PASSAGE – 2/3 Votes (66.6% of Votes)"
summary = "City of Pasadena 911 Firefighter/Paramedic Emergency Medical/Wildfire Preparedness/Response Measure. To help maintain fire, paramedic, 911 response; prepare for/respond to wildfires/earthquakes/medical emergencies; recruit/retain well-trained firefighters; maintain lifesaving equipment/fire alert communication; shall City of Pasadena's measure annually levy 19¢ per square foot of improved property, with low-income senior exemption, providing approximately $22,100,000 annually, expiring after 14 years, requiring accountability, independent audits, oversight, public spending disclosure; all funds must be used to support local fire protection/emergency medical response services, be adopted?"

[[section]]
id = "what"
heading = "Measure PFD"

[[section.line]]
text = "Measure PFD asks the voters of this city whether to levy a yearly parcel tax for fire, paramedic and wildfire services."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["annually levy 19¢ per square foot of improved property"]

[[section]]
id = "today"
heading = "How it reached the ballot"

[[section.line]]
text = "The City Council placed Measure PFD on the ballot."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "city-council-chamber"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "rate"
text = "The tax would be a fixed rate on each square foot of improved property."
sources = ["impartial-analysis", "ordinance"]

[section.line.visual]
kind = "illustration"
name = "city-parcels"

[[section.line]]
id = "exempt"
text = "Owners with very low household incomes would be exempt, as would seniors and disabled owners exempt from the utility users tax."
sources = ["impartial-analysis", "ordinance"]

[section.line.visual]
kind = "illustration"
name = "utility-bills"

[[section.line]]
id = "uses"
text = "The money would go to a special fund, only for fire, paramedic and wildfire services, and fire stations and equipment."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "fire-station-engine"

[[section.line]]
text = "Annual independent audits and public spending disclosure would be required."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section.line]]
id = "end"
text = "The tax would expire after 14 years, and needs two-thirds of the votes to pass."
sources = ["impartial-analysis", "ordinance"]

[section.line.visual]
kind = "illustration"
name = "end-date"

[[section]]
id = "fiscal"
heading = "What the impartial analysis says"

[[section.line]]
id = "revenue"
text = "The city attorney's impartial analysis says the tax would raise about $22.1 million a year."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "save-more"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
id = "yes-line"
text = "Supporters say the city has fewer firefighters than 75 years ago while calls grew more than tenfold, and two stations fail earthquake standards."
sources = ["argument-for", "rebuttal-to-against"]
basis = ["Pasadena has fewer firefighters today than it did 75 years ago in the 1950s.", "Pasadena has fewer firefighters than we did 75 years ago, while emergency calls have increased more than tenfold.", "Two fail earthquake safety standards and could be condemned."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Fewer firefighters, more emergency calls", "Stations fail earthquake standards"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
id = "no-line"
text = "Opponents say only property owners would bear a tax for services everyone uses, and audits cannot guarantee repaired stations or faster response times."
sources = ["argument-against", "rebuttal-to-for"]
basis = ["Firefighters serve everyone: homeowners, renters, workers, tourists, businesses, commuters, Rose Bowl guests, and people experiencing homelessness.", "But only property owners bear the higher tax burden.", "it does not guarantee completed station repairs, faster response times, successful recruitment, or fewer overlapping emergencies."]

[section.line.visual]
kind = "list"
source = "argument-against"
items = ["Only property owners would pay", "Audits do not guarantee results"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote approves the special parcel tax for fire and emergency services, with a 14-year sunset."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["annually levy 19¢ per square foot of improved property"]

[[section.line]]
text = "A no vote rejects the tax, leaving the city to fund fire and emergency services with available resources only."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["annually levy 19¢ per square foot of improved property"]

[[question]]
ask = "Who would pay, and who is exempt?"
lines = ["rate", "exempt"]

[[question]]
ask = "What could the money be spent on?"
lines = ["uses"]

[[question]]
ask = "When would the tax end?"
lines = ["end"]

[[question]]
ask = "What do the supporters and the opponents argue?"
lines = ["yes-line", "no-line"]

[[question]]
ask = "How big is $22.1 million a year next to the city budget?"
unanswered = true
