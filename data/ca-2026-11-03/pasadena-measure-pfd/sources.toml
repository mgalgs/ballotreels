# Archived sources for City of Pasadena Measure PFD, 2026-11-03 general
# election (sources/la-sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The Los Angeles County Registrar-Recorder/County Clerk's list "Measures
# Appearing on the Ballot" is the authority for the letter, the ballot
# question and the vote threshold, quoted on the card; its "Supporters:
# ... Opponents: ..." line states in words who filed the primary
# arguments, so the same file backs `measure-list`, the official
# statement of filing. Neither argument's text was gathered. The City
# Attorney's impartial analysis (a scan with a text layer) is the
# measure's neutral explanation, the kind a state's attorney general's
# explanatory statement is, and gives the revenue estimate. Resolution
# No. 10203's Exhibit A is the ordinance, the measure's full text. The
# staff report, fact sheet, voter guide and web pages are the City's own
# material and are not cited.

