# Archived sources for City of Pasadena Measure PFD, 2026-11-03 general
# election (sources/la-sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The Los Angeles County Registrar-Recorder/County Clerk's list "Measures
# Appearing on the Ballot" is the authority for the letter, the ballot
# question and the vote threshold, quoted on the card. The Registrar's
# Interactive Sample Ballot gives the full text (the ordinance adding
# Chapter 4.110) and the arguments and rebuttals as filed (HTML, retrieved
# 2026-10-30); its full text supersedes the copy in Resolution No. 10203's
# Exhibit A (resolution.pdf, no longer cited), and reads the same in the
# sections the script cites. The Registrar printed no impartial analysis
# for the measure; the City Attorney's (a scan with a text layer, from the
# City's site) is the measure's neutral explanation, the kind a state's
# attorney general's explanatory statement is, and gives the revenue
# estimate. The staff report, fact sheet, voter guide and web pages are
# the City's own material and are not cited.

