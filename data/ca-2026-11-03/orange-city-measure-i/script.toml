# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and whose measure it is; who placed it on the ballot and the vote
# it needs; what would change (what the tax is charged on, where the money
# goes, who checks it, when it ends); the impartial analysis's revenue
# estimate; one line per side; what a vote does.
#
# The guide prints no fiscal analysis or tax rate statement; the one
# estimate is the City's, as the City Attorney's Impartial Analysis
# reports it, which the fiscal line names. It is city revenue, and no
# archived source states the city's budget, so it has no scale
# (STANDARD.md 6.5; left open, under [[question]]).
#
# Sides come from each argument, not the rebuttals. Each side's city
# dollar figures (the supporters' $37.5 million in cuts, the opponents'
# $42 million in added spending) have no budget total in the archive, so
# the lines use the sides' other points; the opponents' $800 a household
# is a per-household amount, exempt from the scale rule. pdftotext
# interleaves each argument with its rebuttal, so each basis is a run the
# extraction keeps whole.

contest = "ca-2026-11-03-orange-city-measure-i"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide-page"
number = "I"
title = "City of Orange, City of Orange Public Safety/Essential Services Measure"
origin = "The City Council of the City of Orange is submitting Measure I to the voters"
summary = "To maintain City of Orange’s quality of life, such as 9-1-1 response; maintaining police/fire protection; preventing crimes/thefts; retaining/attracting well-trained police officers/firefighters; keeping public parks safe/clean; addressing homelessness; wildfire protection/prevention; repairing streets/potholes; critical infrastructure improvements; shall a measure establishing a 1¢ sales tax, providing approximately $37,000,000 annually for general revenue/government purposes, expiring after 13 years, with independent oversight committee, all funds benefiting Orange residents, be adopted?"
yes = "A “Yes” vote on Measure I authorizes the City to establish the one percent (1.0%) general transactions and use tax for thirteen (13) years."
no = "A “No” vote on Measure I does not authorize the City to establish the one percent (1.0%) general transactions and use tax."

