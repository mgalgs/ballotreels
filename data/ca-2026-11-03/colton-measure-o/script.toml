# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks; the office today (elected, four-year term, when it ends); what
# state law allows and why it takes a vote; what would change (who
# appoints, when, and who sets the requirements); that the guide gives no
# cost estimate; one line per side; what a vote does.
#
# The card quotes the ballot question from the City Council's resolution
# (the guide prints none), which has no yes/no lines; the vote lines
# give the City Attorney's Impartial Analysis's meanings and both
# highlight the one phrase of the question. Not a tax measure: the guide
# prints no fiscal statement, so the fiscal line follows the
# no-cost-estimate wording. The supporters' "potential election cost
# savings" is their argument and stays out of it (STANDARD.md 6.3).
#
# The analysis names the current treasurer; the script does not, as no
# side's argument names him and STANDARD.md 9.1 limits names to roles in
# the record of this measure.
#
# No argument against is printed in the guide (the Registrar's measures
# page: "No Argument Against was filed."): the no side is filed = false.

contest = "ca-2026-11-03-colton-measure-o"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-label"
number = "O"
title = "CHANGE THE OFFICE OF CITY TREASURER FROM AN ELECTED OFFICE TO AN APPOINTED OFFICE"
origin = "A RESOLUTION OF THE CITY COUNCIL OF THE CITY OF COLTON, CALIFORNIA, SUBMITTING TO THE QUALIFIED VOTERS OF THE CITY OF COLTON A MEASURE"
summary = "Shall the office of Colton City Treasurer be appointive?"

[[section]]
id = "what"
heading = "Measure O"

[[section.line]]
text = "City of Colton Measure O asks Colton voters whether the city treasurer should be appointed instead of elected."
sources = ["ballot-label", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-label"
highlight = ["be appointive"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Today Colton voters elect the city treasurer to a four-year term, and the current term ends in November 2028."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "ballot-box"

[[section.line]]
text = "State law lets Colton have an elected or an appointed treasurer, but a switch to appointed needs a majority of voters."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "law-book"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "If Measure O passes, the City Council would appoint the next treasurer when the current term ends."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "nominee-list"

[[section.line]]
text = "The council would set the education and training requirements, and review the treasurer's performance."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "inspection-clipboard"

[[section]]
id = "fiscal"
heading = "What it would cost"

[[section.line]]
text = "The San Bernardino County Voter Information Guide does not include a cost estimate for the measure."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"
stamp = "None reported"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Measure O ensures a qualified professional treasurer, screened for experience, education and a background check."
sources = ["argument-for"]
basis = ["This would ensure that the role of City Treasurer would be screened for experience, education, work ethics, and would be subject to a thorough background check.", "A City Treasurer should be a professional accountant who is qualified to perform the required duties"]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Professional qualifications and experience", "More accountability and performance reviews"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure O was submitted, so the county voter guide prints only the supporters' argument."
sources = ["argument-for"]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote makes the treasurer an appointed office, with no treasurer election in 2028 unless voters change it again."
sources = ["impartial-analysis", "ballot-label"]

[section.line.visual]
kind = "page"
source = "ballot-label"
highlight = ["be appointive"]

[[section.line]]
text = "A no vote keeps the treasurer an elected office, up for election again in November 2028."
sources = ["impartial-analysis", "ballot-label"]

[section.line.visual]
kind = "page"
source = "ballot-label"
highlight = ["be appointive"]
