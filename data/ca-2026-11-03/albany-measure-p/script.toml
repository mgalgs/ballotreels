# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks; the street and storm drain parcel tax today; what would change
# (low-income relief, a lower yearly cap, a new rate if a very large
# parcel becomes exempt, leaseholds taxed) and what it needs to pass; the
# impartial analysis's revenue estimate; one line per side; what a vote
# does.
#
# The guide prints no fiscal analysis or tax rate statement; the one
# revenue estimate is the City Attorney's, in the ballot question and the
# Impartial Analysis. No archived source states Albany's budget, so the
# $1,400,000 has no scale (STANDARD.md 6.5; left open). The page prints
# no subject heading over the ballot question, so the card's title is
# the page's own head, the city's name.
#
# The guide prints an argument in favor and the notice "NO ARGUMENT
# AGAINST MEASURE P WAS SUBMITTED": the no side is filed = false. Golden
# Gate Fields, and the share of the tax it pays, are the argument's own
# facts, so they stay in its section (STANDARD.md 6.3); the neutral
# lines give only the analysis's "any parcel 500,000 square feet or
# larger".

contest = "ca-2026-11-03-albany-measure-p"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide-page"
number = "P"
title = "CITY OF ALBANY"
origin = "On July 20, 2026, the City Council voted to place Measure “P” on the November 3, 2026 General Municipal Election ballot."
summary = "Shall the measure updating the Street Paving and Storm Drain Special Tax, by adding very low-income rebates and low-income tax exemptions and rebates; applying the tax to possessory interests; and if a parcel over 500,000 square feet becomes exempt from this tax, adjusting the rate from $167.65 per equivalent residential unit to $0.0638 per lot square foot as provided in the measure, providing an estimated $1,400,000 annually until ended by voters, be adopted?"
yes = "A “yes” vote on Measure “P” will approve this amendment to the street paving/storm drainage parcel tax."
no = "A “no” vote on Measure “P” will not approve this amendment to the street paving/storm drainage parcel tax."

[[section]]
id = "what"
heading = "Measure P"

[[section.line]]
text = "City of Albany Measure P asks Albany voters whether to update the parcel tax that pays for street paving and storm drains."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["Street Paving and Storm Drain Special Tax"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Albany voters approved the tax in 2006; it is now $167.65 a year per residential unit, and very low-income homeowners are exempt."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "storm-drain-street"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "Measure P would cut the tax in half for low-income homeowners, and give rebates to low-income and very low-income renters."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "special-tax"

[[section.line]]
text = "Yearly increases for inflation would be capped at 3 percent, down from 5."
sources = ["guide-page"]

[[section.line]]
text = "If any parcel of 500,000 square feet or more became tax exempt, the City Council could instead charge by the square foot of land, at a rate the measure sets."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "zoning-map"

[[section.line]]
text = "Leaseholders on exempt land would pay the tax, and Measure P needs two-thirds of Albany voters to pass."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "fiscal"
heading = "What the impartial analysis says"

[[section.line]]
text = "The City Attorney's analysis estimates the tax would raise $1,400,000 a year, kept in a fund for streets and storm drains."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "set-aside-funds"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Measure P protects street funding if Golden Gate Fields becomes a park, and closes a tax loophole."
sources = ["arguments"]
basis = ["Measure P protects funding for our streets and storm drains if Golden Gate Fields becomes a park, while also making immediate improvements.", "Measure P immediately closes a tax loophole."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Protects street and drain funding", "Closes a tax loophole"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "The Alameda County Composite Voter Information Guide says that no argument against Measure P was submitted for this election."
sources = ["arguments"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote approves these changes to the street paving and storm drain parcel tax."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["will approve"]

[[section.line]]
text = "A no vote does not approve these changes to the street paving and storm drain parcel tax."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["will not approve"]
