# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; how it reached the ballot; what
# would change (the plan and code amended, the authority ended, the vote
# it needs); what the ballot question says about revenue; both sides;
# what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". The card and title carry it.
#
# What was not found: the initiative's full text, an impartial analysis,
# the resolution placing the measure on the ballot, and any fiscal
# analysis. So every neutral line says only what the ballot question
# says, and the City Clerk's draft ordinance is cited only for the
# initiative's certified petition. The script does not say how much
# advertising there is today, what "certain available properties" are,
# or how much revenue is involved: no archived source does (left open,
# under [[question]]).
#
# The card quotes the Los Angeles County Registrar-Recorder/County
# Clerk's list "Measures Appearing on the Ballot": the City's heading,
# the vote needed and the ballot question, which has no yes or no
# sentences, so the card has no boxes. The vote lines take their meaning
# from the question's own short title, and both highlight it.
#
# The argument in favor is the Registrar's printed copy. The yes side
# takes its central policy claims: residents, not one private company,
# should control advertising on public streets, and the measure limits
# billboard clutter, with an exception for major events. Its figures
# (a share of city revenue, a contribution, the signatures) and its
# claims about the mayor, a 40-year agreement and a backroom deal are
# that side's alone and are not narrated; the contribution is not
# narrated at all. The list says "Opponents: None submitted.", so the no
# side says plainly that no argument against was submitted, citing the
# list (filed = false). No person, company or venue is named.

contest = "ca-2026-11-03-inglewood-measure-bb"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "BB"
title = "CITY OF INGLEWOOD"
origin = "VOTE PASSAGE – Majority Vote 50%+1"
summary = "Ordinance To Eliminate Advertising on Public Right-Of-Way. Shall the ordinance to amend the General Plan and Inglewood Municipal Code to eliminate the City's authority to allow advertising on the public right-of-way and certain available properties, resulting in a loss of general fund revenues, be approved?"

