# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and of whom; how a school bond is repaid and what it needs to
# pass; what the money would pay for and what it may not; the
# district's tax statement; one line per side; what a vote does.
#
# The card's title is the guide page's own head; its origin is the tax
# rate statement's first sentence, the guide's one statement of who
# holds the election (the impartial analysis prints no origin and no
# yes and no sentences, so the card has no boxes, and the vote lines
# take their meaning from the ballot question, as Dublin I's do).
# "Counsel" is heard as "Council" (standard/speakability.txt), so the
# narration does not say it. The bond total and the debt service are
# repaid from a tax on property in the district, and no archived source
# states the district's budget, so they have no budget scale
# (STANDARD.md 6.5; left open). The tax statement's average and highest
# rates are both $18, so the fiscal line gives the one rate, with the
# first and last years in full.
#
# The supporters' points on the schools' age and safety codes are
# theirs, so the neutral sections leave them out (STANDARD.md 6.3).
#
# No argument against Measure U was printed. The no side says so
# plainly; its section is marked filed = false.

contest = "ca-2026-11-03-escalon-unified-measure-u"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-label"
number = "U"
title = "ESCALON UNIFIED SCHOOL DISTRICT"
origin = "An election will be held in the Escalon Unified School District (the “District”) on November 3, 2026, to authorize the sale of up to $26,000,000 in general obligation bonds."
summary = "To provide safe, modern schools by upgrading/repairing aging classrooms, science labs, career technology and school facilities to support college/career readiness in math, science, technology, arts, engineering, and skilled trades; and fixing deteriorating roofs, plumbing, HVAC, and electrical systems; shall Escalon Unified School District’s measure authorizing $26,000,000 in bonds at legal rates be adopted, levying approximately $18 per $100,000 assessed value ($1,700,000 annually) while bonds are outstanding, with independent audits, citizen oversight and all money locally controlled?"

[[section]]
id = "what"
heading = "Measure U"

[[section.line]]
text = "Measure U asks the voters of this school district whether to approve $26 million in school bonds."
sources = ["ballot-label"]

[section.line.visual]
kind = "page"
source = "ballot-label"
highlight = ["authorizing $26,000,000 in bonds"]

[[section]]
id = "today"
heading = "How a school bond works"

[[section.line]]
text = "The district would borrow the money and repay it from a tax on property in the district."
sources = ["tax-statement", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "bond-certificates"

[[section.line]]
text = "Measure U needs 55 percent of the vote to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "The money would upgrade and repair classrooms, science labs and career technology facilities, and fix roofs, plumbing, heating and cooling, and electrical systems."
sources = ["ballot-label"]

[section.line.visual]
kind = "illustration"
name = "school-roof-repair"

[[section.line]]
text = "The money could not pay teacher or administrator salaries, and a citizens' oversight committee and yearly audits would check the spending."
sources = ["impartial-analysis"]

[[section]]
id = "fiscal"
heading = "What the tax statement says"

[[section.line]]
text = "The district's tax statement estimates a tax of $18 per $100,000 of assessed value, from 2027-2028 through 2057-2058."
sources = ["tax-statement"]

[section.line.visual]
kind = "illustration"
name = "debt-payments"

[[section.line]]
text = "The statement estimates the total to repay, with interest, at about $61 million."
sources = ["tax-statement"]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say most district schools were built over 70 years ago and don't meet current safety codes."
sources = ["arguments"]
basis = ["Unfortunately, most Escalon schools were built over 70 years ago and don’t meet current health and safety codes."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Most schools built over 70 years ago", "Not up to current safety codes"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure U was printed in the San Joaquin County voter guide for this election."
sources = ["arguments"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote authorizes the district to issue up to $26 million in bonds."
sources = ["ballot-label", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-label"
highlight = ["authorizing $26,000,000 in bonds"]

[[section.line]]
text = "A no vote does not authorize the district to issue the bonds."
sources = ["ballot-label", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-label"
highlight = ["be adopted"]
