# Archived sources for Escalon Unified School District Measure U,
# 2026-11-03 general election (sources/sources.md). Every id here may be
# cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# The San Joaquin County Registrar of Voters prints Measure U's ballot
# question, full text, the district's tax rate statement, County
# Counsel's impartial analysis and the argument in favor on printed
# pages 581-585 of its composite County of San Joaquin Voter Information
# Guide & Sample Ballot; sources/vig-measure-u-pp581-585.pdf is those
# pages cut from it, and every source cites the full guide's URL with
# the pages. County Counsel's impartial analysis is the measure's
# neutral explanation, the kind a state's attorney general's
# explanatory statement is; the district's tax rate statement is its
# fiscal statement. The guide prints no argument against and no
# rebuttals.

