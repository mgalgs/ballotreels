# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; how a school bond is repaid and what it
# needs to pass; what the money may pay for; the district's tax rate
# statement; one line per side; what a vote does.
#
# The bond total and the debt service are repaid from a tax on property
# in the district, and no archived source states the district's budget,
# so they have no budget scale (STANDARD.md 6.5; left open). The fiscal
# line gives the statement's average rate beside its highest, as it
# prints both. The supporters' "without increasing tax rates" (the
# statement's expectation that today's bond tax rate will not rise) and
# the bar on spending bond money on salaries, the audits and the
# oversight committee are all in their argument, so the neutral sections
# leave them out (STANDARD.md 6.3); the card quotes the question's
# "without increasing projected tax rates" as printed. "Counsel" is heard
# as "Council" (standard/speakability.txt), so the narration says "the
# impartial analysis".
#
# No argument against Measure J was submitted. The no side says so
# plainly; its section is marked filed = false.

contest = "ca-2026-11-03-windsor-unified-measure-j"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "measure-question"
number = "J"
title = "Windsor Unified School District"
origin = "The Windsor Unified School District (“District”) Board of Trustees (“Board”) has placed on the ballot the question of whether to issue $96,000,000 in bonds for such purposes."
summary = "Windsor Unified School District Classroom Repair/No Tax Increase Measure. To upgrade aging classrooms, labs, career training and school facilities for college/career readiness in math, science, technology, engineering, skilled trades; and fix deteriorating roofs, plumbing, HVAC, electrical, and safety systems, shall Windsor Unified School District’s measure be adopted authorizing $96,000,000 in bonds at legal rates, without increasing projected tax rates, levying approximately $46 per $100,000 while bonds are outstanding ($6,000,000 annually), requiring independent oversight/audits and local control?"
yes = "A “yes” vote on Measure J will authorize the District to issue the bonds and levy taxes to pay for the indebtedness."
no = "A “no” vote on Measure J will not authorize either the issuance of bonds or the associated levy of taxes."

[[section]]
id = "what"
heading = "Measure J"

[[section.line]]
text = "Windsor Unified School District Measure J asks the district's voters whether to approve $96 million in school bonds."
sources = ["measure-question"]

[section.line.visual]
