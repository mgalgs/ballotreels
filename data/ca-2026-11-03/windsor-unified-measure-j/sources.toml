# Archived sources for Windsor Unified School District Measure J,
# 2026-11-03 general election (sources/sources.md). Every id here may be
# cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# The Sonoma County Registrar of Voters publishes each measure's pages
# of its guide as one PDF, headed "Local Ballot Measure: J" and footed
# "Sonoma County" with the guide's page numbers (049M536 to 049M541); no
# cover page was archived, so the sources name those pages, not a guide
# title. One PDF backs every source here. County Counsel's Impartial
# Analysis is the measure's neutral explanation; the district's Tax Rate
# Statement is its fiscal statement. The pages print an argument in
# favor and "No Argument Was Submitted Against Measure J", and no
# rebuttals.

[contest]
id = "ca-2026-11-03-windsor-unified-measure-j"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/school_district:windsor_unified_school_district"
kind = "measure"
title = "Windsor Unified School District Measure J: School Repair Bonds"

