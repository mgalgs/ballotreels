# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and whose measure it is; the 2018 tax and its scheduled drop and
# end, and what it is charged on; the vote it needs; what would change;
# the impartial
# analysis's revenue estimate; one line per side; what a vote does.
#
# No argument against was submitted ("No argument against this measure
# was submitted."): the no side says so, filed = false (STANDARD.md 2.5),
# in about as many words as the yes side. The guide prints no fiscal
# analysis or tax rate statement; the one estimate is the City Attorney's
# Impartial Analysis's, which the fiscal line names. It is city revenue,
# and no archived source states the city's budget, so it has no scale
# (STANDARD.md 6.5; left open, under [[question]]).

contest = "ca-2026-11-03-santa-ana-measure-n"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide-page"
number = "N"
title = "City of Santa Ana, Santa Ana Streets, Public Safety, Essential City Services Measure"
origin = "was placed on the ballot by a vote of the Santa Ana City Council."
summary = "To maintain city services, such as fixing potholes; keeping streets, sidewalks, parks, and playgrounds safe and clean; removing graffiti and litter; providing fire protection, paramedic, crime prevention, and 911 emergency response, shall City of Santa Ana’s ordinance be amended to maintain the 1.5 cent sales tax without sunset providing approximately $84,000,000 annually for services until ended by voters, with independent audits, resident oversight, and all money locally controlled?"
yes = "A “YES” vote on the measure is a vote in favor of continuing a local transactions and use tax in the City of Santa Ana at the current rate of one and one half (1.5) cents without a rate reduction or sunset provision to fund general city services until ended by the voters."
no = "A “NO” vote on the measure is a vote against removing the rate reduction from one and one half (1.5) cents to one (1) cent scheduled to occur on April 1, 2029 and against removing the sunset provision which would end the transactions and use tax on April 1, 2039."

