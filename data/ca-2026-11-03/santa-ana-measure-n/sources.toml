# Archived sources for City of Santa Ana Measure N, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1). Every source is a page of the Measure N section ("Ballot
# Measures-N", Section 11) of the Orange County Registrar of Voters'
# Voter Information Guide, one archived PDF; "page" is the section's own.
#
# The Santa Ana City Attorney's Impartial Analysis is the measure's
# neutral explanation, the kind a state's attorney general's explanatory
# statement is. No argument against was submitted, and no tax rate
# statement or fiscal analysis is printed (it is not a bond).

