# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and of whom; who pays the hotel tax and how; the rate today and
# since when; who placed it and what it needs; where the money would go;
# the City Attorney's estimate and the ballot question's total; one line
# per side; what a vote does.
#
# No narrated line names the city or the county (the card and title show
# them). The card quotes the Registrar's List of Local Measures: its
# heading for the measure as the title, the city as the origin, the
# ballot question (with the soft hyphen the page prints in "short-term")
# as the summary. The list prints no yes/no statements; the vote lines
# take their meanings from the impartial analysis's "yes" and "no"
# sentences and highlight the question's one phrase both votes turn on.
#
# The analysis's comparison with other cities' rates is the supporters'
# point too, so no neutral line repeats it (STANDARD.md 6.3); the
# supporters' $5.5 million is theirs and stays in the argument. No
# archived source gives the city's general fund total, so the revenue
# figures go without a scale (rule 6.5; listed as open). No argument
# against Measure F was filed: the no side says so plainly; its section
# is marked filed = false.

contest = "ca-2026-11-03-mountain-view-measure-f"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "F"
title = "Transient Occupancy Tax"
origin = "City of Mountain View"
summary = "Shall the measure to provide locally controlled funding for repairing potholes, streets and sidewalks, improving police, fire, and 911 emergency response services, supporting affordable housing, and adding new parks, and other general government services by authorizing City Council to increase the City of Mountain View's existing Transient Occupancy Tax paid by hotel and short­-term rental guests from 10% up to 15%, generating up to $5,200,000 annually until ended by voters, with independent audits, be adopted?"

[[section]]
id = "what"
heading = "Measure F"

[[section.line]]
text = "Measure F asks the voters of this city whether to let the City Council raise the hotel tax from 10 up to 15 percent."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["from 10% up to 15%"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "who-pays"
text = "Hotel and short-term rental guests pay the tax on stays under 30 days, with their room bills."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "hotel-front-desk"

[[section.line]]
text = "Voters last raised the rate in 1991, and today it is 10 percent."
sources = ["impartial-analysis"]

[[section.line]]
text = "The City Council placed Measure F on the ballot unanimously, and it needs a majority to pass."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "uses"
text = "The money would go to the general fund, for any government purpose, such as streets, emergency services and parks."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "storm-drain-street"

[[section]]
id = "fiscal"
heading = "What it would raise"

[[section.line]]
id = "per-point"
text = "The City Attorney's analysis says each 1 percent increase could bring in about $1.1 million more a year."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section.line]]
id = "total"
text = "The ballot question puts the total at up to $5.2 million a year."
sources = ["ballot-question"]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say the tax rate here is lower than in most county cities."
sources = ["argument-for"]
basis = ["10% TOT rate is lower than rates in most Santa Clara County cities."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Rate is lower than in most nearby cities", "Pays for streets, services and parks"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure F was filed with the county Registrar of Voters."
sources = ["ballot-question"]

[section.line.visual]
kind = "list"
source = "ballot-question"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote lets the City Council raise the rate up to 15 percent."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["from 10% up to 15%"]

[[section.line]]
text = "A no vote rejects the ordinance, and the rate stays at 10 percent."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["from 10% up to 15%"]

[[question]]
ask = "Who pays the hotel tax?"
lines = ["who-pays"]

[[question]]
ask = "What would the money pay for?"
lines = ["uses"]

[[question]]
ask = "How much would it raise?"
lines = ["per-point", "total"]

[[question]]
ask = "How big is that next to the city's budget?"
unanswered = true
