# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; how a college bond is repaid and what it
# needs to pass; what the money may pay for; the district's tax rate
# statement; one line per side; what a vote does.
#
# The card quotes the ballot question from Appendix B of the district's
# Resolution No. 2025-26-18, transcribed from the scan Humboldt County
# posts; the appendix prints plain Bonds—Yes and Bonds—No and no yes/no
# lines. So the card has no YES/NO boxes, its origin is the resolution's
# title, and the vote lines give the impartial analysis's own meanings
# ('A "yes" vote is to authorize the issuance of the bonds'), both
# highlighting the same phrase of the question. No name of the college,
# district or counties is narrated: the card, title and `voters` line
# show them.
#
# The bond total and the debt service are repaid from a tax on property
# in the district, and no archived source states the district's budget,
# so they have no budget scale (STANDARD.md 6.5; left open). The bond
# total is said exactly as the question prints it. The tax statement's
# average rate is the ballot's own figure; its highest rate, about twice
# the average and for a dozen years, is said beside it so the average
# does not stand alone. Its fiscal years are written in full
# (standard/speakability.txt); "approximately $264,800,000" is said as
# "about $264.8 million". The bar on paying salaries, the audits and the
# oversight committee, and "without increasing tax rates" are in the
# supporters' argument, so the neutral sections leave them out
# (STANDARD.md 6.3).
#
# No argument against Measure C was filed in Humboldt County's guide.
# The no side says so plainly; its section is marked filed = false.

contest = "ca-2026-11-03-shasta-tehama-trinity-jccd-measure-c-humboldt"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "C"
title = "ABBREVIATED FORM OF BOND MEASURE"
origin = "RESOLUTION OF THE BOARD OF TRUSTEES OF THE SHASTA-TEHAMA-TRINITY JOINT COMMUNITY COLLEGE DISTRICT ORDERING AN ELECTION TO AUTHORIZE THE ISSUANCE OF GENERAL OBLIGATION BONDS"
summary = "To improve college facilities serving students, veterans, and residents; renovate job training spaces including welding, public safety, agriculture and nursing; make accessibility improvements for the disabled; and acquire, construct, and renovate classrooms/ buildings; shall Shasta-Tehama-Trinity Joint Community College District's measure be adopted authorizing $129,630,000 of bonds at legal rates, estimated levies averaging $7.76 per $100,000 assessed value (raising $7,800,000 annually) while bonds are outstanding with annual audits, independent citizens' oversight committee, and all funds remaining local?"

[[section]]
id = "what"
heading = "Measure C"

[[section.line]]
text = "Measure C asks the voters of this community college district whether to approve $129,630,000 in college bonds."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
