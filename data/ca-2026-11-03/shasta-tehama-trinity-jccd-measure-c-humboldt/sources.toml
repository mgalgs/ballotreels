# Archived sources for Shasta-Tehama-Trinity Joint Community College
# District Measure C, 2026-11-03 general election, as Humboldt County's
# voters see it (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The Humboldt County Office of Elections prints the impartial analysis
# and the argument in favor in its Full Voter Information Guide (pages 11
# and 12 of the PDF, cut into one excerpt), under a page heading that
# misnames the measure a "Special Utilities Improvement and Operations
# Parcel Tax Measure"; the analysis beneath it describes the bond, and
# only the analysis is quoted. The county also posts the district's own
# documents as one packet of scans with no text layer: the board's
# resolution, the full text of the measure (Appendix A), the ballot
# question (Appendix B) and the tax rate statement (Appendix C). The
# passages used were typed from the page images into
# sources/packet-transcription.txt, which names the PDF and URL it
# copies, and the ballot question and tax rate statement point at it. The
# impartial analysis is the measure's neutral explanation; the tax rate
# statement is its fiscal statement. No argument against was filed in
# Humboldt's guide, and no rebuttals are printed.
#
# A community college district has no Census boundary, so the measure's
# division is the county and `voters` names the district
# (docs/SCRIPT-FORMAT.md). The district reaches into six counties (the
# tax rate statement names them); Shasta, its home county, keeps the
# plain shasta-tehama-trinity-jccd-measure-c, and Tehama, Trinity, Lassen,
# Modoc and Humboldt each stage the same measure under a suffixed id.

[contest]
id = "ca-2026-11-03-shasta-tehama-trinity-jccd-measure-c-humboldt"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/county:humboldt"
kind = "measure"
title = "Shasta-Tehama-Trinity Joint Community College District Measure C: College Facility Bonds"
voters = "the Shasta-Tehama-Trinity Joint Community College District"

