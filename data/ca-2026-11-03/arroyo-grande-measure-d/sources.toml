# Archived sources for City of Arroyo Grande Measure D, 2026-11-03
# general election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The San Luis Obispo County Clerk-Recorder prints each ballot type's
# County Voter Information Guide as one PDF; pages 31 and 32 of Ballot
# Type 42 (the City Attorney's impartial analysis and the argument in
# favor) were cut into one excerpt. The guide prints neither the ballot
# question nor the ordinance, and no argument against or rebuttal, with
# no notice saying whether one was filed. The ballot question is quoted
# from the City of Arroyo Grande's own election page, which prints it;
# the City's Notice of Election (sources/Notice-of-Election-2026.pdf)
# prints the same question but is not cited, since its text runs the
# ballot's YES and NO boxes into the question. No resolution placing
# the measure and no full text of the ordinance were found; the
# impartial analysis is the measure's neutral explanation. No tax rate
# statement or fiscal statement applies. The ballot labels the measure
# "Measure D-26"; the project names it by its bare letter.

[contest]
id = "ca-2026-11-03-arroyo-grande-measure-d"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:arroyo_grande"
kind = "measure"
title = "Arroyo Grande Measure D: State Water Project Participation"

