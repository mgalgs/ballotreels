# Archived sources for City of Arcata Measure G, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# The Humboldt County Office of Elections prints Measure G's impartial
# analysis (page 19) and an argument in favor (page 20) in its Full
# Voter Information Guide; it prints no argument against, no rebuttals,
# no fiscal statement and no ballot question (its sample ballot pages
# are placeholders). The ballot question is the City Council's, from
# Resolution No. 256-63, page 3, in the county's packet for the
# measure; that page is a scan with no text layer, so it was typed from
# the page image into sources/resolution-256-63-transcription.txt,
# whose url is the scan's (as Fowler Measure T's are). The packet's
# text-layer copy of Ordinance No. 1589 (packet pages 14 to 22) is the
# full text. The City Attorney's analysis gives the one revenue
# estimate; no tax rate statement applies to a sales tax. The packet's
# copies of the argument carry a 2020 "received" stamp; the guide's
# printed argument is the one cited.

