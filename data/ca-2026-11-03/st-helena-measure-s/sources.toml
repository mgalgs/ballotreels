# Archived sources for City of St. Helena Measure S, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# Napa County's Voter Information Guide could not be fetched
# (napacounty.gov answers plain requests with a 403), so these are the
# City of St. Helena's own Measure S pages. The ballot question is
# quoted from the City's "Measure S - Ballot Question" page. The City
# Attorney's impartial analysis is the measure's neutral explanation,
# the kind a state's attorney general's explanatory statement is. No tax
# rate statement or fiscal analysis applies (a sales tax); the one
# revenue estimate is the analysis's. The City's resolution placing the
# measure (sources/resolution-2026-070.pdf) is a scan with no text
# layer and is not cited.
#
# The City posts no argument for or against Measure S; whether any was
# filed is not confirmed against the printed county guide.

