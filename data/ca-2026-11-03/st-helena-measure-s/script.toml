# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; how it reached the ballot; what
# would change (the rate on top of current taxes, where the money goes
# and that it stays in the city, how long it lasts, the vote it needs);
# the impartial analysis's revenue estimate; both sides, neither of
# which has a posted argument; what a vote does.
#
# The card quotes the ballot question from the City's Measure S page,
# which prints no yes/no lines. So, as for Clayton Measure M, the card
# has no YES/NO boxes, the vote lines give the impartial analysis's
# meanings, and both highlight the same phrase of the question.
#
# No argument for or against Measure S is among the documents the City
# posted, and the printed county guide was not seen (sources/sources.md),
# so the sides do not say none was filed: each says none was posted
# (filed = false, STANDARD.md 2.5), as for San Mateo County Measure J.
# With no side's argument to keep out of the neutral sections
# (STANDARD.md 6.3), the analysis's "would remain in the City" stays in.
#
# No tax rate statement or fiscal analysis applies; the $2 million a
# year is the City Attorney's estimate, and no archived source states
# the City's general fund budget to give it a scale (STANDARD.md 6.5;
# left open, under [[question]]).

contest = "ca-2026-11-03-st-helena-measure-s"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "S"
title = "St. Helena City Services Measure"
origin = "City of St. Helena - Measure S"
summary = "To maintain/improve St. Helena’s long-term finances and maintain 911 fire/public safety response, St. Helena’s infrastructure including repairing roads/potholes/sidewalks; reducing local wildfire risk by managing brush/other fuels; maintain parks; supporting local businesses; for other general city services; shall the measure be adopted establishing a ½¢ locally controlled sales tax, generating approximately $2,000,000 annually until ended by voters, requiring independent audits, public spending disclosure, all funds benefiting St. Helena residents?"

[[section]]
id = "what"
heading = "Measure S"

[[section.line]]
text = "City of St. Helena Measure S asks St. Helena voters whether to add a one-half percent sales tax for city services."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["establishing a ½¢ locally controlled sales tax"]

[[section]]
id = "today"
heading = "How it reached the ballot"

[[section.line]]
text = "The City Council voted in July to place Measure S on the ballot."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "ballot-box"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "The tax would be paid on top of current sales taxes, and collected the same way."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "sales-receipt"

[[section.line]]
id = "general"
text = "The money would go into the general fund of the city, for any lawful program, improvement or service."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "state-budget"

[[section.line]]
text = "All of the money would stay in St. Helena, not shared with the state or the county."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "city-storefronts"

[[section.line]]
id = "end"
text = "The tax would last until voters repeal it, and needs a simple majority to pass."
sources = ["impartial-analysis", "text"]

[section.line.visual]
kind = "illustration"
name = "end-date"

[[section]]
id = "fiscal"
heading = "What the impartial analysis says"

[[section.line]]
id = "revenue"
text = "The city attorney's impartial analysis estimates Measure S would raise about $2 million a year."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"
filed = false

[[section.line]]
text = "No argument for Measure S appears among the measure documents that the City of St. Helena posted."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "list"
source = "impartial-analysis"
items = ["No argument for was posted"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure S appears among the measure documents that the City of St. Helena posted."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "list"
source = "impartial-analysis"
items = ["No argument against was posted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote authorizes the one-half percent sales tax."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["establishing a ½¢ locally controlled sales tax"]

[[section.line]]
text = "A no vote does not authorize the one-half percent sales tax."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["establishing a ½¢ locally controlled sales tax"]

[[question]]
ask = "When would the tax end?"
lines = ["end"]

[[question]]
ask = "What can the money be spent on?"
lines = ["general"]

[[question]]
ask = "How big is $2 million a year next to the city budget?"
unanswered = true
