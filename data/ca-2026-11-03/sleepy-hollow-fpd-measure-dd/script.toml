text = "Measure DD would allow up to $107.50 per housing unit or 1,000 square feet of other buildings, rising up to $4 a year instead of $3."
sources = ["ballot-question", "staff-report"]

[[section.line]]
id = "confirm"
text = "Each year the fire district board confirms the rate, and the yearly increase is not automatic."
sources = ["staff-report"]

[section.line.visual]
kind = "illustration"
name = "recurring-review"

[[section.line]]
id = "use"
