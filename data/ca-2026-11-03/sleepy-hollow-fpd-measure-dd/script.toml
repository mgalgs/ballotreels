# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the regional paramedic authority
# and the tax today; what would change (the most it could be, the
# adjustment cap, the yearly confirmation, the use of the money); how it
# reached the ballot and the vote it needs; the revenue estimate; both
# sides (the argument in favor; none against was filed); what a vote
# does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this fire district", and the Ross Valley
# Paramedic Authority is "the regional paramedic authority". The card,
# title and `voters` line carry the names. No person is named, and no
# vote count is given.
#
# The ordinance (the resolution's Exhibit "A") is a blank page: the
# neutral lines rest on the ballot question, the resolution, and the
# plain facts of the District staff report. The county's Measure DD page
# prints the same question (the card is left as it was) and County
# Counsel's impartial analysis, which agrees with every neutral line and
# is cited beside the rate and the vote it needs. The resolution is
# posted with a "DRAFT -- REQUIRES BOARD APPROVAL" header, but its certification records it as
# passed and adopted on June 3, 2026; the adoption line attributes that
# to the resolution itself, and the county's listing confirms the
# measure is on the ballot. The minutes of that meeting do not name the
# resolution and are not cited. The resolution's recital of
# "responsive, high-quality" care, the ballot question's opening purpose
# clause and the staff report's statements of need are not narrated;
# what the question promises of the money is attributed to the
# question. The card quotes the ballot question from Section 3 of the
# resolution, named by its number; both vote lines highlight the same
# phrase of the question.
#
# The ballot question's "approximately One Hundred Five Thousand Dollars
# ($105,000) annually" is paramedic tax revenue. No archived source
# states the District's or the paramedic authority's budget, so the
# figure has no scale (STANDARD.md 6.5; left open). The tax rates are
# amounts per housing unit or per 1,000 square feet (exempt).
#
# The county's page prints an argument in favor of Measure DD and says
# "No argument against Measure DD was filed." The yes side distils the
# argument (its signers are not named); "at the current tax rate" is the
# argument's own claim and stays in the yes line: the neutral lines give
# the rates as the question, the staff report and County Counsel's
# impartial analysis do. The no side says, as the county does, that none
# was filed (filed = false, STANDARD.md 2.5), as for California
# Proposition 1.

contest = "ca-2026-11-03-sleepy-hollow-fpd-measure-dd"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "DD"
title = "RESOLUTION NO. 2026-5"
origin = "Board of Directors of the Sleepy Hollow Fire Protection District"
summary = "To maintain rapid 9-1-1 emergency response times and preserve the number of on-duty paramedics ready to respond to accidents/medical emergencies, shall the Ross Valley Paramedic Authority measure be adopted continuing for four years the paramedic services special tax of up to $107.50/residential living unit or 1,000 square feet of developed nonresidential property, adjusted up to $4/ year, generating approximately One Hundred Five Thousand Dollars ($105,000) annually, with annual audits, public spending disclosure and all funds for local paramedic services?"

[[section]]
id = "what"
heading = "Measure DD"

[[section.line]]
text = "Measure DD asks the voters of this fire district whether to continue a parcel tax for paramedic services for four more years."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["continuing for four years the paramedic services special tax"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "authority"
text = "The tax pays for paramedic care from the regional paramedic authority, which eight local governments formed in 1982."
sources = ["text"]

[section.line.visual]
kind = "illustration"
name = "valley-town-ambulance"

[[section.line]]
id = "rate-today"
text = "This year the tax is $103.50 per housing unit, or per 1,500 square feet of other buildings, and it ends in June 2027."
sources = ["staff-report"]

[section.line.visual]
kind = "illustration"
name = "city-parcels"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
