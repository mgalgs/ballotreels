# Archived sources for Sleepy Hollow Fire Protection District Measure DD,
# 2026-11-03 general election (sources/sources.md, its section "Feed
# documents retrieved 2026-10-30"). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The county's Measure DD page (sources/county-page.txt, saved as text
# from a browser, since the site refuses scripted fetches) prints the
# ballot question, the vote required to pass, County Counsel's
# impartial analysis and the argument in favor, and says that no
# argument against Measure DD was filed. The other files are the
# District's, from its board page:
# Resolution No. 2026-5, whose Section 3 is the ballot question, and the
# staff report for the June 3, 2026 special meeting. The resolution is
# cited as posted: its header reads "DRAFT -- REQUIRES BOARD APPROVAL",
# yet its certification records it as "PASSED AND ADOPTED at a Special
# Meeting ... on the 3rd day of June 2026" (unsigned). Its Exhibit "A",
# the ordinance, is a blank page; nothing here stands in for it. The
# minutes of that meeting do not name Resolution No. 2026-5, so they are
# not cited; the resolution's own certification and the county's listing
# of Measure DD are the record that it was adopted.
#
# The staff report is District staff's material: only its plain facts
# are cited (the current rate and its square-foot basis, the change of
# the yearly adjustment cap, the current tax's end, the yearly
# confirmation of the rate), never its statements of need or benefit.
# It is of kind public-record: no allowed kind fits a staff report
# exactly, and official-report is reserved for a nonpartisan fiscal
# office's reports. The staged RVPA rate table
# (resolution-2026-5-exhibit-a-tax-rates.pdf) is an exhibit to the
# authority's joint powers agreement, not the ordinance, and is not
# cited.
#
# A fire protection district has no Census boundary, so the measure's
# division is the county and `voters` names the district
# (docs/SCRIPT-FORMAT.md). The letter DD and the two-thirds vote are
# confirmed by the Registrar of Voters' Board of Supervisors staff report
# 26-4515.

[contest]
id = "ca-2026-11-03-sleepy-hollow-fpd-measure-dd"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/county:marin"
kind = "measure"
title = "Sleepy Hollow Fire Protection District Measure DD: Continuing the Paramedic Services Special Tax for Four Years"
voters = "the Sleepy Hollow Fire Protection District"

[[contest.correction]]
date = "2026-10-30"
note = "The video now gives the argument in favor printed by the county, and says, as the county does, that no argument against was filed."

