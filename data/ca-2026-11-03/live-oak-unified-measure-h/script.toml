# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; how a school bond is repaid and what it needs
# to pass; what the money may pay for; the district's tax rate statement;
# one line per side; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the opening
# says "the voters of this school district". The card and title carry the
# names. "Counsel" is heard as "Council" (standard/speakability.txt), so
# the narration does not say it.
#
# The pamphlet prints the ballot label under the heading "ABBREVIATED
# FORM OF BOND MEASURE", with no yes and no sentences, so the card has no
# boxes and the vote lines take their meaning from the impartial
# analysis. The card's origin is the district's name as the tax rate
# statement on the same page prints it. The bond total and the debt
# service are repaid from a tax on property in the district, not from the
# district's budget, and no archived source states that budget, so they
# have no budget scale (STANDARD.md 6.5; left open), as other school
# bonds' do.
#
# The ballot label names a new elementary school and upgraded athletic
# fields, so the projects line says that much, from the label. That the
# classrooms are overcrowded, and the audits, oversight and salary ban
# as protections, are the supporters' points, so they stay in the yes
# side (STANDARD.md 6.3).
#
# The pamphlet prints no argument against Measure H, but no official
# document says in words that none was filed. So the no side does not
# say none was filed: it says none is among the documents gathered
# (filed = false, STANDARD.md 2.5), as for Livingston Measures T and U.

contest = "ca-2026-11-03-live-oak-unified-measure-h"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "H"
title = "ABBREVIATED FORM OF BOND MEASURE"
origin = "Live Oak Unified School District"
summary = "To improve the quality of education; construct a new elementary school to reduce student overcrowding; and upgrade athletic fields and facilities for school and community use; shall Live Oak Unified School District’s measure be adopted authorizing $33.2 million of bonds at legal rates, generating approximately $1.97 million annually while bonds are outstanding at average rates of $56 per $100,000 assessed value, with annual audits, independent citizens’ oversight, NO money for salaries and all money staying local?"

[[section]]
id = "what"
heading = "Measure H"

[[section.line]]
text = "Measure H asks the voters of this school district whether to approve $33.2 million in school bonds."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["authorizing $33.2 million of bonds"]

[[section]]
id = "today"
heading = "How a school bond works"

[[section.line]]
id = "repay"
text = "The district would sell the bonds and repay them from a yearly tax on property in the district."
sources = ["impartial-analysis", "tax-statement"]

[section.line.visual]
kind = "illustration"
name = "bond-certificates"

[[section.line]]
id = "threshold"
text = "Measure H needs 55 percent of the vote to pass."
sources = ["impartial-analysis", "text"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "projects"
text = "The bond money could pay only for the projects on the list in the measure."
sources = ["impartial-analysis", "text"]

[section.line.visual]
kind = "illustration"
name = "school-classroom"

[[section.line]]
id = "project-list"
text = "The ballot question names a new elementary school and upgraded athletic fields for school and community use."
sources = ["ballot-question"]

[section.line.visual]
kind = "illustration"
name = "school-sports"

[[section]]
id = "fiscal"
heading = "What the tax statement says"

[[section.line]]
id = "rate"
text = "The district's tax rate statement estimates an average tax of $55.62 per $100,000 of assessed value, and at most $59, through 2060-2061."
sources = ["tax-statement"]

[section.line.visual]
kind = "bars"
title = "Estimated tax per $100,000 of assessed value, dollars"
source = "tax-statement"
unit = ""
labels = ["Average", "Highest"]
values = [55.62, 59]

[[section.line]]
id = "total"
text = "The statement estimates the total to repay, with interest, at about $67.1 million."
sources = ["tax-statement"]

[section.line.visual]
kind = "illustration"
name = "debt-payments"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say elementary classrooms are overcrowded, and that annual audits, citizen oversight and no money for salaries protect taxpayers."
sources = ["argument-for"]
basis = ["our elementary classrooms and school facilities in the Live Oak Unified School District are overcrowded and inadequate to provide students with the learning environments they need to succeed.", "Measure H makes financial sense and protects taxpayers.", "By law, spending must be reviewed and annually audited by an independent citizens’ oversight committee.", "Funds are required to be spent only on schools, not for administrator or teacher salaries."]

[section.line.visual]
kind = "list"
