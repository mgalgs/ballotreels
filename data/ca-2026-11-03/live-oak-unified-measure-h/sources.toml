# Archived sources for Live Oak Unified School District Measure H,
# 2026-11-03 general election (sources/county-sources.md). Every id here
# may be cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# Sutter County Clerk-Recorder/Elections prints Measure H's full text,
# its ballot label (under the heading "ABBREVIATED FORM OF BOND
# MEASURE"), the district's tax rate statement, County Counsel's
# impartial analysis and an argument in favor on pages 27 to 32 of its
# County Voter Information Pamphlet. The pages run on with no breaks, so
# each file below shares a page with its neighbour; each source is only
# the document its heading names. The pamphlet was fetched from the
# county's site through a browser; the url is the Sample Ballot and
# Pamphlet page that posts it. County Counsel's impartial analysis is the
# measure's neutral explanation; the tax rate statement is its fiscal
# statement. The pages print no argument against and no rebuttal, and no
# official document says in words whether one was filed.

[contest]
id = "ca-2026-11-03-live-oak-unified-measure-h"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/school_district:live_oak_unified_school_district"
kind = "measure"
title = "Live Oak Unified School District Measure H: $33.2 Million School Bond"

[[source]]
id = "ballot-question"
kind = "official-title-summary"
