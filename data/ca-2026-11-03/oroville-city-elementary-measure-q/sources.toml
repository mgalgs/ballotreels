# Archived sources for Oroville City Elementary School District Measure
# Q, 2026-11-03 general election (sources/sources.md). Every id here may
# be cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# The Butte County Clerk-Recorder/Elections' Local Voter Information
# Guide prints Measure Q on PDF pages 58 to 70 (printed footers
# 04-110326-56 to -68): the ballot question and County Counsel's
# Impartial Analysis (58 to 59), an argument in favor (59 to 60), "No
# argument against was filed." (61), the full text with its project list
# (61 to 68) and the District's Tax Information Statement (68 to 70). No
# rebuttals are printed. The County also posts the District's signed
# resolution and tax rate statement, and County Counsel's signed
# analysis, as separate files (archived beside the guide pages; the
# script cites the guide).

