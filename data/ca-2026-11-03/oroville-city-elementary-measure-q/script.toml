# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; how a school bond is repaid and
# the vote it needs; what the money could pay for and the projects the
# question names; the District's tax information statement (its rate,
# its years, the total to repay); one line per side; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this school district", and the card and
# title carry the name. "Counsel" is heard as "Council"
# (standard/speakability.txt), so the narration says "the impartial
# analysis" and never names its author.
#
# The card quotes the guide's page: its heading over the question, the
# question (its "(approximately $1,000,00 annually)" as printed, which
# the narration never repeats) and the analysis's sentence on who placed
# it on the ballot. The ballot prints only "Bond – YES" and "Bond – NO",
# and the analysis gives no yes and no sentences, so the card has no
# YES/NO boxes; the vote lines take their meaning from the analysis's
# description of what approval allows, and both highlight the same
# phrase of the question.
#
# The bond total and the debt service are repaid from a tax on property
# in the district, and no archived source states the district's budget,
# so they have no budget scale (STANDARD.md 6.5; left open, as for
# Ferndale Unified's Measure E). The fiscal line gives the statement's
# rate, which it prints as both its average and its highest, and writes
# its "2059-60" in full (standard/speakability.txt). "Without increasing
# current tax rates" is the supporters' argument as well as the
# question's opening (and the statement's expectation), so the neutral
# sections keep to the statement's own rate, years and total and leave
# those words on the card (STANDARD.md 6.3), as do the state matching
# funds, the oversight committee, the audits and the bar on paying
# salaries, which the argument in favor makes its points.
#
# The guide prints "No argument against was filed." The no side says so
# plainly; its section is marked filed = false.

contest = "ca-2026-11-03-oroville-city-elementary-measure-q"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide-page"
number = "Q"
title = "Oroville City Elementary School District Bond Measure"
origin = "This measure is placed on the ballot by the governing board of the District."
summary = "Without increasing current tax rates, to repair and replace leaky roofs and windows; construct facilities for career technical education; upgrade inadequate electrical and air-conditioning systems; make health, safety and security improvements and repair classrooms, restrooms and school facilities, shall Oroville City Elementary School District’s measure authorizing $16,000,000 of bonds at legal rates be adopted, with average levies of $16 per $100,000 assessed value (approximately $1,000,00 annually), while bonds are outstanding, citizens’ oversight, annual audits, and all money staying local?"

[[section]]
id = "what"
heading = "Measure Q"

[[section.line]]
text = "Measure Q asks the voters of this school district whether to approve $16 million in school bonds."
sources = ["guide-page"]

[section.line.visual]
