[section.line.visual]
kind = "list"
source = "ballot-question"
items = ["No argument against was found"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote is in favor of raising the parcel tax from $25 to $75 a year."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["from $25 to $75 on each nonexempt parcel"]

[[section.line]]
