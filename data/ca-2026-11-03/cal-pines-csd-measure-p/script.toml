# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the tax each parcel pays today
# and the vote Measure P needs; what would change (the new amount and
# when, what the money is for, how long it lasts); the impartial
# analysis's revenue estimate; both sides, neither of which has a posted
# argument; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this community services district". The
# card and title carry the name.
#
# Modoc County posts no voter guide, so the card quotes the ballot
# question from the District's Resolution No. 2026-G, which prints it
# with bare YES and NO boxes and no yes/no lines: the card has no YES/NO
# boxes, and the vote lines give County Counsel's own meanings ('A "yes"
# vote is a vote in favor of increasing ...'). Every neutral line rests
# on the impartial analysis, the resolution or the ordinance (Exhibit
# A). That the existing tax is inadequate and services may be cut is the
# District's finding, and with no argument posted for either side the
# script leaves it out (STANDARD.md 6.3).
#
# The analysis's $755,000 a year is District revenue, and no archived
# source states the District's budget, so it has no scale (STANDARD.md
# 6.5; left open). The tax amounts are per parcel (exempt).
#
# No argument for or against Measure P is posted by the county, and with
# no guide to check it is not known whether one was filed. So the sides
# do not say none was filed: each says none is among the documents the
# county posted (filed = false, STANDARD.md 2.5), as Tulelake Multi-County
# FPD I's no side does.

contest = "ca-2026-11-03-cal-pines-csd-measure-p"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "P"
title = "Fire Services Special Parcel Tax Measure"
origin = "California Pines Community Services District"
summary = "Shall the ordinance be adopted to provide additional annual revenue to fund fire protection and prevention services, including the necessary personnel, apparatus, equipment, gear, vehicles, and prudent reserves, by increasing the annual special parcel tax for the California Pines Community Services District from $25 to $75 on each nonexempt parcel in the District, generating additional annual revenue of approximately $755,000, until ended by voters?"

[[section]]
id = "what"
heading = "Measure P"

[[section.line]]
text = "Measure P asks the voters of this community services district whether to raise its yearly parcel tax for fire protection."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["increasing the annual special parcel tax"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "today-tax"
text = "Today, each parcel the tax applies to pays $25 a year for fire protection and prevention services."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "fire-station-engine"

[[section.line]]
id = "threshold"
text = "Measure P needs two-thirds of the vote to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "amount"
text = "Measure P would raise the tax to $75 a year per parcel, starting in the 2027-2028 fiscal year."
sources = ["impartial-analysis", "text"]

[section.line.visual]
kind = "bars"
title = "Fire services tax per parcel each year, in dollars"
source = "impartial-analysis"
unit = ""
labels = ["Today", "Under Measure P"]
values = [25, 75]

[[section.line]]
id = "uses"
text = "The money would go to a special fund used only for fire protection and prevention, including staff, equipment and vehicles."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "set-aside-funds"

[[section.line]]
id = "duration"
text = "The tax would continue unless a later two-thirds vote of the district's voters ends it."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "special-tax"

[[section]]
id = "fiscal"
heading = "What the analysis says"

[[section.line]]
id = "revenue"
text = "The impartial analysis estimates the increase would bring in about $755,000 more each year."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"
filed = false

[[section.line]]
text = "No argument for Measure P appears among the official documents that the county has posted online for this ballot measure."
sources = ["ballot-question"]

[section.line.visual]
kind = "list"
source = "ballot-question"
items = ["No argument for was found"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
