# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the office today (elected, and
# on this same ballot with no candidates); what would change (who
# appoints, from when, at whose pleasure, residency, the city manager);
# no cost estimate; both sides, neither of which has an archived
# argument; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". The card and title carry it.
#
# The one official text archived is the City's notice "Measures to be
# Voted On", which prints the measure's explanatory statement and its
# question in one box, with blank YES and NO boxes and no yes/no lines.
# The card quotes the box; it has no YES/NO boxes, and both vote lines
# highlight the same phrase of the question. Every line rests on the
# notice: no resolution, impartial analysis or argument was archived.
# The notice does not say what vote the measure needs or what the treasurer
# does, so the script does not say either.
#
# The notice's page 1 lists the city treasurer's two-year term on this same
# ballot with "NO CANDIDATES". It is said flatly in "today", as a fact
# of the ballot a voter will see beside Measure U, with no reason given
# for it, since no side's argument was archived to own it (STANDARD.md
# 6.3).
#
# No argument for or against Measure U was archived: the county guide
# could not be fetched (sources/sources.md), and it is not known whether
# any was filed. So the sides do not say none was filed: each says none
# is among the documents gathered (filed = false, STANDARD.md 2.5), as
# for St. Helena Measure S.

contest = "ca-2026-11-03-livingston-measure-u"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "notice"
number = "U"
title = "MEASURE U (APPOINTIVE CITY TREASURER)"
origin = "MEASURES TO BE VOTED ON"
summary = "The City Treasurer shall no longer be an elective official in the City of Livingston. From and after November 2028, or upon earlier vacancy in the office of City Treasurer, the City Treasurer shall be appointed by the City Council. The City Treasurer so appointed shall hold office at the pleasure of the City Council and, notwithstanding California Government Code section 36502 to the contrary, is not required to be a resident or elector in the City. The City Council may by Ordinance vest in the City Manager its authority to appoint the City Treasurer. Shall the office of the City Treasurer be Appointive?"

