# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the city's existing sales tax
# and when it ends; what would change (the added rate, from when, the
# combined rate, how long the added tax lasts, where the money goes,
# the vote it needs); the City's revenue estimate as the impartial
# analysis gives it; one line per side; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city", and the card and title carry
# the name. The rate is said as a percent ("0.75 percent", as the
# resolution sets it), since a sales tax said in cents is transcribed
# in dollars (standard/speakability.txt).
#
# The guide prints no ballot question, so the card quotes it from the
# City Council's Resolution No. 2026-12, Section 1, as typed from the
# scan. The resolution's Yes and No boxes carry no sentences, so the
# card has no boxes; the vote lines give the City Attorney's impartial
# analysis's own meanings, and both highlight the same phrase of the
# question. The ordinance was not posted (its Exhibit A is a
# placeholder): every line here is stated in the analysis or the
# resolution.
#
# The services the question and the analysis list, the audits, the
# oversight and the money staying local are the supporters' points
# too, so the neutral sections say only that a general tax may pay for
# any legitimate city purpose, and leave the list to the card and the
# yes side (STANDARD.md 6.3). The $1.8 million is the City's estimate
# as the analysis gives it; no archived source states the City's
# general fund budget to give it a scale (STANDARD.md 6.5; left open,
# under [[question]]). The argument in favor is signed by the Mayor;
# the opposing side names no one, so the yes line names no one either
# (STANDARD.md 9.3).
#
# The guide prints no argument against Measure D and does not say
# whether one was filed, so the no side says only that the guide prints
# none, filed = false (STANDARD.md 2.5).

contest = "ca-2026-11-03-fortuna-measure-d"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "D"
title = "Fortuna Essential Services Funding Measure"
origin = "RESOLUTION NO. 2026-12"
summary = "Shall the measure to maintain essential City services, such as protecting public safety; increasing and restoring police officers; repairing aging/ deteriorating streets and potholes; providing programs for seniors and youth; and keeping parks clean and safe, by authorizing a ¾-cent sales tax in the City of Fortuna, generating $1,800,000 annually for general government use until ended by voters, requiring independent audits, community oversight, and all funds staying in Fortuna, be adopted?"

[[section]]
id = "what"
heading = "Measure D"

[[section.line]]
text = "Measure D asks the voters of this city whether to add a second 0.75 percent local sales tax."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["by authorizing a ¾-cent sales tax"]

[[section]]
id = "today"
heading = "The sales tax today"

[[section.line]]
id = "existing"
text = "Today, the city already has a 0.75 percent sales tax, set to end on March 31, 2033."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "sales-receipt"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "added"
text = "Measure D would add another 0.75 percent from April 1, 2027, for a combined city rate of 1.5 percent until the first tax ends."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "bars"
title = "City sales tax rate"
source = "impartial-analysis"
unit = "%"
labels = ["Today", "With Measure D, to March 2033"]
values = [0.75, 1.5]

[[section.line]]
id = "after"
text = "The added tax would continue after 2033, unless repealed by voters, or reduced or repealed by the council as the law allows."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "end-date"

[[section.line]]
id = "general"
text = "As a general tax, the money may be used for any legitimate city purpose."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "state-budget"

[[section.line]]
text = "Measure D needs a majority of the vote to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "fiscal"
heading = "What the impartial analysis says"

[[section.line]]
id = "revenue"
text = "The city attorney's impartial analysis estimates that Measure D would bring in about $1.8 million a year."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say the tax gives stable local funding for city services, and the state cannot take it."
sources = ["arguments"]
basis = ["By providing a stable local funding source, Measure D will help the City continue implementing community priorities, maintaining essential services, and supporting a strong local economy.", "Revenues remain local, are independently audited, and cannot be taken by Sacramento for state purposes."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Stable local funding for services", "The state cannot take it"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "The county voter guide prints only the argument in favor of Measure D, and none against it."
sources = ["arguments"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["No argument against was printed"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote approves the added 0.75 percent sales tax."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["by authorizing a ¾-cent sales tax"]

[[section.line]]
text = "A no vote is a vote against the added 0.75 percent sales tax."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["by authorizing a ¾-cent sales tax"]

[[question]]
ask = "Does the city already have a sales tax of its own?"
lines = ["existing"]

[[question]]
ask = "How long would the added tax last?"
lines = ["added", "after"]

[[question]]
ask = "What can the money be spent on?"
lines = ["general"]

[[question]]
ask = "How big is $1.8 million a year next to the city budget?"
unanswered = true
