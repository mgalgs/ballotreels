# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and of whom; who appoints the City Attorney today; how it reached
# the ballot and what it needs; what would change (who appoints, the
# hearing, the 90-day bar); no cost estimate; one line per side; what a
# vote does.
#
# Not a tax: the county page prints no fiscal statement, so the fiscal
# line says the page does not include a cost estimate. "County's" is
# heard as "counties" (standard/speakability.txt), so it names "the
# Sacramento County Current Measure Information page". The card's title
# is the item's own head on the page; its origin is the analysis's
# sentence on who placed the measure.
#
# The supporters' count of cities whose councils appoint the city
# attorney (469 of 482, said as "most") is theirs, so no neutral section
# mentions it (STANDARD.md 6.3). No argument against Measure I was filed:
# the no side says so plainly; its section is marked filed = false.

contest = "ca-2026-11-03-folsom-measure-i"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-label"
number = "I"
title = "Measure I: City of Folsom"
origin = "On July 14, 2026, the City Council placed Measure “I” on the November 3, 2026 General Municipal Election ballot."
summary = "Shall the measure amending the Adopted Charter of the City of Folsom to have the City Council appoint and direct the City Attorney and to make related operational changes, be adopted?"
yes = "A “yes” vote on Measure “I” will authorize a Charter amendment to give the City Council the authority to appoint, suspend or remove the City Attorney, subject to the procedural and timing rules above."
no = "A “no” vote on Measure “I” will not authorize a Charter amendment to give the City Council the authority to appoint, suspend or remove the City Attorney, subject to the procedural and timing rules above."

[[section]]
id = "what"
heading = "Measure I"

[[section.line]]
text = "City of Folsom Measure I asks voters in the city whether the City Council, not the city manager, should appoint the City Attorney."
sources = ["ballot-label", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-label"
highlight = ["to have the City Council appoint and direct the City Attorney"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Today, the city manager appoints and removes the City Attorney, Folsom's chief legal officer."
sources = ["impartial-analysis", "text"]

[section.line.visual]
kind = "illustration"
name = "law-book"

[[section.line]]
text = "The City Council placed Measure I on the ballot, and it needs a simple majority."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "ballot-box"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "Measure I would let the City Council appoint, suspend or remove the City Attorney."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "city-council-chamber"

[[section.line]]
text = "The City Attorney would get a public hearing before removal, and could not be removed within 90 days of a new council member taking office."
sources = ["impartial-analysis", "text"]

[[section]]
id = "fiscal"
heading = "What it would cost"

[[section.line]]
text = "The Sacramento County Current Measure Information page does not include a cost estimate for the measure."
sources = ["ballot-label"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"
stamp = "None reported"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say most California councils appoint their city attorney, keeping accountability with elected officials."
sources = ["arguments"]
basis = ["City councils appoint the city attorney in 469 of California’s 482 incorporated cities.", "accountability should rest with the elected officials who represent the public, not with an appointed administrator."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Councils appoint the city attorney in most cities", "Accountability rests with elected officials"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure I was filed with Sacramento County Voter Registration and Elections."
sources = ["arguments"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote authorizes the charter amendment letting the City Council appoint, suspend or remove the City Attorney."
sources = ["ballot-label"]

[section.line.visual]
kind = "page"
source = "ballot-label"
highlight = ["will authorize a Charter amendment"]

[[section.line]]
text = "A no vote does not authorize that charter amendment."
sources = ["ballot-label"]

[section.line.visual]
