# Archived sources for Lynx Trail Road Zone of Benefit Measure A,
# 2026-11-03 general election (sources/sources.md). Every id here may be
# cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1). The pages are cut from the El Dorado
# County Elections Department's Voter Information Pamphlet (PDF pages
# 61 to 63, printed pages 5 to 7); "pages" below are the printed numbers.
#
# A zone of benefit of County Service Area 9 is a special district: the
# division is the county, and `voters` names the zone as the impartial
# analysis does (docs/SCRIPT-FORMAT.md). The pamphlet prints the
# Board of Supervisors' resolution with the ballot question, the notice
# that no arguments were submitted, and County Counsel's impartial
# analysis; no tax rate statement applies (a special parcel tax).

[contest]
id = "ca-2026-11-03-lynx-trail-road-zone-measure-a"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/county:el_dorado"
kind = "measure"
title = "Lynx Trail Road Zone of Benefit Measure A: A $450 Road Tax per Parcel, Replacing the $300 Tax"
voters = "the Lynx Trail Road Zone of Benefit #98130 of County Service Area 9"

[[source]]
id = "guide-page"
kind = "official-title-summary"
publisher = "El Dorado County Elections Department, El Dorado County Voter Information Pamphlet, Statewide General Election, November 3, 2026, pages 6 and 7: ballot question, notice that no arguments were submitted, and County Counsel’s Impartial Analysis of Measure A"
credit = "Impartial Analysis of Measure A, El Dorado County Voter Information Pamphlet"
url = "https://www.eldoradocounty.ca.gov/files/assets/county/v/2/documents/government/elections/20261103/complete-booklet.pdf"
