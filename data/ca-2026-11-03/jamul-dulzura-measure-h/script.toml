sources = ["tax-statement"]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Measure H fixes leaking roofs, failing pipes and termite damage at district schools without increasing existing tax rates."
sources = ["argument-for"]
basis = ["Vote YES on Measure H to repair and upgrade classrooms and school", "facilities in the Jamul-Dulzura Union School District without increasing existing tax rates.", "Out of 61 roofs across our schools, 58 are leaking and need replacement", "underground pipes and infrastructure are failing", "Replace wood and support beams that have extensive termite damage and dry rot"]

[section.line.visual]
kind = "list"
