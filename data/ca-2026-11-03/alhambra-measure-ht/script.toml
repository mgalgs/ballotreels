# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the tax today, the stays and
# lodgings it covers, and how the measure reached the ballot; what would
# change (the lodgings, the stays, the unchanged rate, where the money
# goes and how long the tax lasts, the vote it needs); the revenue as
# the impartial analysis gives it; both sides; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city". The card and title carry it.
#
# Every explaining line is the City Attorney's impartial analysis. The
# argument in favor's case (short-term rental guests use the same
# services; a loophole) stays with that side (STANDARD.md 6.3).
#
# The card quotes the Los Angeles County Registrar-Recorder/County
# Clerk's list "Measures Appearing on the Ballot": the City's heading,
# the vote needed and the ballot question, which has no yes or no
# sentences, so the card has no boxes. The vote lines give the impartial
# analysis's own meanings, and both highlight the same phrase.
#
# The argument in favor is the Registrar's printed copy; its signers'
# roles are not printed, so the yes side names no one. The list says
# "Opponents: None submitted.", so the no side says plainly that no
# argument against was submitted, citing the list (filed = false). Its
# clause on what the list records balances the yes line's length
# without a further claim.
#
# The $134,000 a year is the City Attorney's figure. No archived
# official document states the City's general fund budget to give it a
# scale (STANDARD.md 6.5; left open, under [[question]]).

contest = "ca-2026-11-03-alhambra-measure-ht"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "HT"
title = "CITY OF ALHAMBRA"
origin = "VOTE PASSAGE – Majority Vote 50%+1"
summary = "Modernization/No Tax Rate Increase Measure. To maintain city services, such as: Fire protection, paramedic, 911 emergency response, crime prevention and keeping streets, infrastructure, and parks safe and well-maintained shall City of Alhambra's measure modernizing the hotel/motel transient occupancy tax be adopted at the current 12% rate for stays up to 30 days to include short-term lodging, providing an additional $134,000 annually for city services until ended by voters, with all money locally controlled?"

[[section]]
id = "what"
heading = "Measure HT"

[[section.line]]
text = "Measure HT asks the voters of this city whether to apply the hotel tax to more kinds of lodging and to longer stays."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["at the current 12% rate for stays up to 30 days to include short-term lodging"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "today-tax"
text = "Today, hotel and motel guests pay a 12 percent tax on their room rent, for stays of 21 days or less."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "hotel-front-desk"

[[section.line]]
id = "today-places"
text = "The tax covers only motels with six or more rooms and hotels with services such as restaurants or meeting rooms."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "city-hotel"

[[section.line]]
text = "The City Council placed Measure HT on the ballot."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "city-council-chamber"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "rentals"
text = "Measure HT would apply the tax to any place offering temporary lodging, including short-term rentals of homes."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "online-booking-laptop"

[[section.line]]
id = "stays"
text = "Measure HT would also cover stays of up to 30 days, as state law allows."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "end-date"

[[section.line]]
id = "rate"
text = "The 12 percent rate would not change."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "hotel-front-desk"

[[section.line]]
id = "general"
text = "As a general tax, the money could fund any lawful city service, and the tax would last until voters repeal it."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "public-funds-locked"

[[section.line]]
text = "Measure HT needs a majority yes vote to pass."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "fiscal"
heading = "What the impartial analysis says"

[[section.line]]
id = "revenue"
text = "The city attorney's impartial analysis says the change would raise about $134,000 a year."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say short-term rental guests use the same city services as hotel guests, and should pay the same tax."
sources = ["argument-for"]
basis = ["these guests use the same city services — 911, roads, and parks — as hotel guests do.", "It just requires visitors staying in short-term neighborhood rentals to pay the same tax paid by hotel guests."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["They use the same services", "Same tax as hotel guests"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "The official county list of measures, which names who filed each argument, says no argument against Measure HT was submitted."
sources = ["measure-list"]

[section.line.visual]
kind = "list"
source = "measure-list"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote extends the 12 percent tax to short-term rentals and stays up to 30 days."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["at the current 12% rate for stays up to 30 days to include short-term lodging"]

[[section.line]]
text = "A no vote keeps the tax limited to hotels and motels, for stays up to 21 days."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["at the current 12% rate for stays up to 30 days to include short-term lodging"]

[[question]]
ask = "Would the tax rate go up?"
lines = ["rate"]

[[question]]
ask = "Which stays and lodgings would the tax cover?"
lines = ["today-tax", "today-places", "rentals", "stays"]

[[question]]
ask = "How big is $134,000 a year next to the city budget?"
unanswered = true
