# Archived sources for City of Solana Beach Measure C, 2026-11-03
# general election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1). The guide's pages are cut from the San
# Diego County Registrar of Voters' Voter Information Guide (ballot type
# 236, a Solana Beach precinct); "page" is the guide's printed footer
# number.
#
# The guide prints an argument in favor and no argument against, and no
# rebuttals.

[contest]
id = "ca-2026-11-03-solana-beach-measure-c"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:solana_beach"
kind = "measure"
title = "City of Solana Beach Measure C: Hotel Tax Update and 1% Rate Increase"

