# Archived sources for Red Bluff Joint Union High School District
# Measure H, 2026-11-03 general election (sources/sources.md). Every id
# here may be cited by script.toml. `kind` must be one the standard
# allows (docs/STANDARD.md, section 1).
#
# Tehama County Elections posts no local voter guide for this election:
# it posts each measure's filed documents separately on its elections
# page. For Measure H these are the district's Resolution No. 2026.27-1
# (so printed on its first page; the county's sources notes call it
# 2026-27), a scan with no text layer whose passages used were typed
# from the page images into sources/resolution-2026-27-transcription.txt
# (it names the PDF and URL it copies): Exhibit A, the full text with its
# project list; Exhibit B, the abbreviated form (the ballot question);
# and Exhibit C, the tax rate statement, the measure's fiscal statement.
# County Counsel's impartial analysis is the neutral explanation, and
# the argument in favor is as filed (a scan, transcribed the same way).
# No argument against or rebuttal is posted; whether one was filed is
# not known. The district reaches into Shasta County too (the
# resolution's "of Tehama and Shasta Counties"); Shasta's copies were
# not checked.
#
# A high school district with a Census boundary: the division is its
# school_district, which covers its voters in both counties.

[contest]
id = "ca-2026-11-03-red-bluff-juhsd-measure-h"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/school_district:red_bluff_joint_union_high_school_district"
kind = "measure"
title = "Red Bluff Joint Union High School District Measure H: School Facility Bonds"

