# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; how a school bond is repaid and what it
# needs to pass; what the money would pay for; the district's tax rate
# statement; one line per side; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this high school district". The card and
# title carry the names. "Counsel" is heard as "Council" and "EMTs" as a
# word (standard/speakability.txt), so the narration says neither.
#
# Tehama County posts no voter guide for this election. The card quotes
# the board's abbreviated form (Exhibit B of its Resolution No.
# 2026.27-1), transcribed from the scan the county posts: its bold
# heading as the card's title, the question as its summary. It prints
# no yes and no sentences, so the card has no boxes and the vote lines
# take their meaning from the impartial analysis, both highlighting the
# same phrase of the question.
#
# The bond total and the debt service are repaid from a tax on property
# in the district, not from the district's budget, and no archived
# source states that budget, so they have no budget scale (STANDARD.md
# 6.5; left open), as Humboldt's Measure C copy's do. The tax statement's
# average ($18.73) and highest ($18.77) rates are both said. Its fiscal
# year is written in full (standard/speakability.txt). The state
# matching money, the bar on paying administrator salaries, the audits
# and the oversight committee are in the argument in favor, so the
# neutral sections leave them out (STANDARD.md 6.3); the card shows the
# question's own words.
#
# No argument against Measure H is posted by the county, and it is not
# known whether one was filed (no guide is posted), so the no side says
# none is among the filings posted (filed = false, STANDARD.md 2.5). The
# argument in favor names its signers; with no one on the record for
# the other side, the script names no one.

contest = "ca-2026-11-03-red-bluff-juhsd-measure-h"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "H"
title = "Red Bluff Joint Union High School District Career Preparation/ Repairs Measure."
origin = "RESOLUTION NO. 2026.27-1"
summary = "To provide career/ technical education facilities training students for local jobs as nurses, EMTs, firefighters, others; repair/ upgrade deteriorating classrooms and buildings; maintain clean drinking water; improve campus safety, shall Red Bluff Joint Union High School District's measure authorizing $19,000,000 of bonds at legal rates, raising $1,600,000 annually via levying $19 per $100,000 of assessed value while bonds are outstanding, requiring local control, citizen oversight, audits, public spending disclosure, no money for administrator salaries, be adopted?"

[[section]]
id = "what"
heading = "Measure H"

[[section.line]]
text = "Measure H asks the voters of this high school district whether to approve $19 million in school bonds."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["authorizing $19,000,000 of bonds"]

[[section]]
id = "today"
heading = "How a school bond works"

[[section.line]]
text = "The district would borrow the money and repay it from a tax on property in the district."
sources = ["impartial-analysis", "tax-statement"]

[section.line.visual]
kind = "illustration"
name = "bond-certificates"

[[section.line]]
text = "Measure H needs 55 percent of the vote to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "projects"
text = "The money would pay for career training facilities for local jobs such as nurses and firefighters, and for classroom, drinking water and safety repairs."
sources = ["impartial-analysis", "ballot-question", "text"]

[section.line.visual]
kind = "illustration"
name = "school-workshop"

[[section]]
id = "fiscal"
heading = "What the tax statement says"

[[section.line]]
id = "tax-rate"
text = "The district's tax rate statement estimates an average tax of $18.73 per $100,000 of assessed value, and at most $18.77, through 2050-2051."
sources = ["tax-statement"]

[section.line.visual]
kind = "bars"
title = "Estimated tax per $100,000 of assessed value, dollars"
source = "tax-statement"
unit = ""
labels = ["Average", "Highest"]
values = [18.73, 18.77]

[[section.line]]
text = "The statement estimates the total to repay, with interest, at about $37.7 million."
sources = ["tax-statement"]

[section.line.visual]
kind = "illustration"
name = "debt-payments"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Measure H would train students for local first responder jobs and bring millions in state money."
sources = ["argument-for"]
basis = ["Yes on H prepares our students for good-paying local jobs as First Responders", "Yes on H unlocks our fair share of MILLIONS of dollars from Sacramento"]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Trains students for first responder jobs", "Brings millions in state money"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure H appears among the filings the county elections office has posted for this election."
sources = ["argument-for"]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["No argument against was posted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote approves selling the bonds, to be repaid by a tax on property."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["authorizing $19,000,000 of bonds"]

[[section.line]]
text = "A no vote does not approve selling the bonds."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["authorizing $19,000,000 of bonds"]

[[question]]
ask = "What would the bond money pay for?"
lines = ["projects"]

[[question]]
ask = "How much would property owners pay?"
lines = ["tax-rate"]

[[question]]
ask = "How big is $19 million next to the district's yearly budget?"
unanswered = true
