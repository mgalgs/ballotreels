# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the elected treasurer today and
# the appointed director of finance beside it; who placed it on the
# ballot and how its question describes the post; what would change and
# who would do the work; the vote it needs; the City's savings estimate
# as the impartial analysis gives it; both sides, neither of which filed
# an argument; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this city", and the card and title carry
# the name.
#
# The card quotes the guide's page: its heading over the question, the
# question, the analysis's first sentence as the origin, and the
# analysis's yes and no sentences as the boxes. "Vacant and no longer
# needed" is the City Council's wording in its question, so the
# narration gives it as the question's, never as the narrator's.
#
# The charter amendment's own text (Resolution No. 9465's Exhibit A) was
# not posted, and the guide prints only how to ask the City Clerk for
# it; the guide's question and the City Attorney's analysis cover what
# the standard needs (the question, a neutral explanation, the sides).
#
# The $65,000 a year is the City's estimate as the analysis gives it; no
# archived source states the City's general fund budget to give it a
# scale (STANDARD.md 6.5; left open, under [[question]]).
#
# The guide prints "No argument in favor was filed." and "No argument
# against was filed.": both sides say so plainly, each marked
# filed = false (STANDARD.md 2.5).

contest = "ca-2026-11-03-oroville-measure-r"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide-page"
number = "R"
title = "City of Oroville – Resolution 9465 – Charter Amendment: Removing City Treasurer Position"
origin = "The Oroville City Council placed Measure R on the ballot."
summary = "Shall the City of Oroville Charter be amended to delete the vacant and no longer needed City Treasurer position, saving the City approximately $65,000 annually?"
yes = "A “yes” vote is a vote to eliminate the City Treasurer position as described above."
no = "A “no” vote is a vote to retain the existing Charter provisions."

[[section]]
id = "what"
heading = "Measure R"

[[section.line]]
text = "Measure R asks the voters of this city whether to remove the elected City Treasurer from the city charter."
