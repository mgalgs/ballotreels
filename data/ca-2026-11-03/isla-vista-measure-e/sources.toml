# Archived sources for Isla Vista Community Services District Measure E
# (printed on the ballot as "Measure E2026"), 2026-11-03 general election
# (sources/sources.md). Every id here may be cited by script.toml. `kind`
# must be one the standard allows (docs/STANDARD.md, section 1).
#
# All four are pages of one file: the Santa Barbara County Voter
# Information Guide and Sample Ballot for Ballot Type 31, pages 18 to 24
# (impartial analysis, argument in favor, notice that no argument against
# was filed, full text) and 32 to 33 (sample ballot, with the ballot
# question on page 33). County Counsel's impartial analysis is the
# measure's neutral explanation, the kind a state's analyst's or
# attorney general's explanation is. The guide prints no tax rate
# statement or other fiscal statement for the measure.

