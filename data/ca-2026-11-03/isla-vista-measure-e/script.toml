# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the district's existing utility
# tax; the vote it needs; what would change (the new rates, what the
# money may fund, how long it lasts); the revenue the ballot question
# estimates; one line per side; what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the
# opening says "the voters of this community services district", and
# the card and title carry the name. "Counsel" is heard as "Council"
# (standard/speakability.txt), so the analysis is the county attorney's.
#
# The ballot and the analysis say "methane"; the measure's text defines
# methane as "natural or manufactured gas used for light, heat, or
# power", so the narration says "gas", citing the text.
#
# The card quotes the ballot question from the sample ballot (page 33),
# which prints only YES and NO boxes, no yes and no sentences, so the
# card has no boxes and the vote lines take their meaning from the
# question itself, both highlighting the same phrase. The ballot prints
# the letter "E2026"; the card's number is the bare letter, as the title.
#
# The guide prints no tax rate statement or fiscal statement. The one
# revenue estimate, about $1.2 million a year, is the ballot question's
# (the full text gives the same), attributed to it. It is government revenue,
# but no archived source states the district's budget to give it a
# scale (STANDARD.md 6.5; left open, under [[question]]). The district's
# companion Measure F, an appropriations limit, is not mentioned in the
# neutral sections: supporters cite "a strict annual limit" as their
# point (STANDARD.md 6.3).
#
# The guide prints "No Argument Against Measure E2026 Was Filed": the no
# side says so plainly, filed = false (STANDARD.md 2.5).

contest = "ca-2026-11-03-isla-vista-measure-e"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "E"
title = "Increased Isla Vista Municipal Infrastructure and Services."
origin = "ISLA VISTA COMMUNITY SERVICES DISTRICT"
summary = "To fund local improvements to housing services; community based public safety; transportation, parking, and public transit; clean and safe public spaces, including lighting and sidewalks; and community facilities and events, shall voters authorize a Utility Users' Tax of 7% on methane and 6% on trash, sewage, water, and electric, authorizing establishment of exemptions, generating approximately $1,200,000 additional annually, until repealed by voters?"

