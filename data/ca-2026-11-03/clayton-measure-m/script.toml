# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; how it reached the ballot; what
# would change (the rate, its start and no end date, where the money
# goes, the vote it needs); the impartial analysis's revenue estimate;
# one line per side; what a vote does.
#
# The card quotes the ballot question from the City Clerk's Notice of
# Special Measure Election, which prints no yes/no lines. So, as for
# Brisbane Measure X, the card has no YES/NO boxes, the vote lines give
# the impartial analysis's meanings, and both highlight the same phrase
# of the question.
#
# No tax rate statement or fiscal analysis applies; the $1,000,000 a
# year is the City Attorney's estimate, and no archived source states
# the City's general fund budget to give it a scale (STANDARD.md 6.5;
# left open, under [[question]]). Clayton's current sales tax rate is
# printed only in the argument against (8.75%, 9.75% with Measure M), so
# it stays in that side's section (STANDARD.md 6.3). The supporters'
# $1.18 million deficit is left out: no archived source gives the budget
# it would need for its scale.

contest = "ca-2026-11-03-clayton-measure-m"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "M"
title = "CITY OF CLAYTON SALES TAX MEASURE"
origin = "CITY OF CLAYTON – MEASURE M"
summary = "To provide local funding to maintain City of Clayton programs, services, and facilities, including: police services, traffic enforcement and road safety, road and sidewalk improvements, enhance library and recreation opportunities, park maintenance, recruitment and retention of city employees and other city services, shall the City of Clayton levy a 1% sales tax until ended by voters generating approximately $1,000,000 annually, subject to public review, the annual audit and all funds benefitting Clayton?"

[[section]]
id = "what"
heading = "Measure M"

[[section.line]]
text = "City of Clayton Measure M asks the voters of Clayton whether to add a 1 percent sales tax to pay for city services."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["levy a 1% sales tax until ended by voters"]

[[section]]
id = "today"
heading = "How it reached the ballot"

[[section.line]]
text = "The City Council voted unanimously in June to place Measure M on the ballot."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "ballot-box"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "end"
text = "The tax would add $1 for every $100 spent in Clayton, from April 2027 until voters repeal it."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "sales-receipt"

[[section.line]]
id = "general"
text = "Measure M is a general tax: its money can pay for any lawful program or service of the city."
sources = ["impartial-analysis", "text"]

[section.line.visual]
kind = "illustration"
name = "state-budget"

[[section]]
id = "fiscal"
heading = "What the impartial analysis says"

[[section.line]]
id = "revenue"
text = "The city attorney's impartial analysis estimates Measure M would raise about $1 million a year."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say that without it, the city will struggle to sustain police services, repair streets and preserve parks, and that every dollar stays local."
sources = ["argument-for"]
basis = ["This deficit means that without action, the City will struggle to sustain our current police services, repair our streets and sidewalks, preserve parks and recreation programs, and maintain aging infrastructure.", "That means 100% of all revenues generated stay in Clayton."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Sustains police, streets and parks", "All of the money stays in Clayton"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say Measure M would spike the sales tax rate to 9.75 percent, punishing working families and seniors, and is a permanent tax hike."
sources = ["argument-against"]
basis = ["Measure M would spike that rate to 9.75%, punishing working families and fixed-income seniors.", "Clayton's Measure M is a permanent tax hike."]

[section.line.visual]
kind = "list"
source = "argument-against"
items = ["Spikes the sales tax rate to 9.75%", "A permanent tax hike"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote authorizes the 1 percent sales tax."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["levy a 1% sales tax until ended by voters"]

[[section.line]]
text = "A no vote does not authorize the 1 percent sales tax."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["levy a 1% sales tax until ended by voters"]

[[question]]
ask = "When would the tax end?"
lines = ["end"]

[[question]]
ask = "What can the money be spent on?"
lines = ["general"]

[[question]]
ask = "How big is $1 million a year next to the city budget?"
unanswered = true
