credit = "District's Tax Rate Statement, Measure N"
url = "https://votescount.santacruzcountyca.gov/Portals/16/nov26/Measure%20N%20Tax%20Rate%20Statement.pdf"
file = "sources/tax-rate-statement.transcription.txt"
retrieved = "2026-10-28"

[[source]]
id = "argument-for"
