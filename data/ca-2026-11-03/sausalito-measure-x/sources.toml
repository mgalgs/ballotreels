# Archived sources for City of Sausalito Measure X, the Arts, Industrial
# & Maritime Preservation and Improvement Initiative, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# Every file is the City of Sausalito's, from the City Clerk's "Measure
# X (2026)" page and the documents it links. The Marin County guide
# could not be archived (marincounty.gov refused the requests), so these
# are the city's copies of the impartial analysis and the arguments,
# not the guide's printed pages. The card quotes the page's "AIM Ballot
# Question" (the resolution's scanned copy of the ballot label reads
# badly through pdftotext). The City Attorney's Impartial Analysis is
# the measure's neutral explanation; no fiscal analysis or tax rate
# statement was archived (the page lists two Elections Code 9212 impact
# reports, not archived). The full text and both rebuttals are scans
# with no text layer; no line cites them.

