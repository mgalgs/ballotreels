# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; what the money may pay for and the vote
# Measure Y needs; what would change (the most each parcel would pay, the
# yearly increase, how the rate is set, how long the tax lasts); the
# ballot question's revenue estimate; both sides, neither of which filed
# an argument; what a vote does.
#
# No place or district name is narrated (the narrator mispronounces
# them): the opening says "the voters of this community services
# district", and the fire district the service agreement names is
# "another fire protection provider". The card, title, chart title and
# `voters` line carry the names. "Counsel" is heard as "Council"
# (standard/speakability.txt), so the narration does not say it.
#
# The official record differs on how long the tax lasts. The ballot
# question says "continuing until ended by voters"; the ordinance
# (Section 4) says ten years from July 1, 2027, "or until such a time
# that the out-of-area service agreement is no longer in effect", and
# the impartial analysis "until June 30, 2037 ... whichever occurs
# first". The term line gives the ordinance's and analysis's term (the
# law voters would adopt); the next line says, neutrally, that the
# ballot question describes the tax as "continuing until ended by
# voters", highlighting those words on the card. The script does not
# say why they differ.
#
# The card quotes the ballot question as the guide's sample ballot
# prints it. pdftotext reads the label's heading in two pieces around
# the question, so the card's title is the heading the guide prints over
# the full text and the analysis; its YES and NO boxes are the impartial
# analysis's yes and no meanings, which the vote lines say, each
# highlighting its own box.
#
# The ballot question's $64,500 in year one is district revenue, and no
# archived source states the district's budget, so it has no scale
# (STANDARD.md 6.5; left open). The tax per parcel is exempt.
#
# The guide prints "NO ARGUMENT IN FAVOR OF MEASURE Y WAS SUBMITTED"
# and "NO ARGUMENT AGAINST MEASURE Y WAS SUBMITTED". Each side says so
# plainly; both sections are marked filed = false.

contest = "ca-2026-11-03-mesa-csd-measure-y"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "Y"
title = "MESA COMMUNITY SERVICES DISTRICT SPECIAL PARCEL TAX FOR FIRE PROTECTION"
origin = "MESA COMMUNITY SERVICES DISTRICT"
summary = "Shall the Mesa Community Services District adopt an ordinance establishing annual special parcel tax of up to $500 per developed parcel and up to $250 per undeveloped parcel, with up to a 3.5% annual escalator, raising approximately $64,500 in year one, to fund an Out of Area Service Agreement with the Bishop Fire Protection District providing fire protection and related services, with all funds used locally for these purposes only, continuing until ended by voters, and subject to annual review?"
yes = "A “YES” vote is a vote to approve a special tax upon real property within the District for fire protection."
no = "A “NO” vote is a vote against a special tax upon real property within the District for fire protection."

[[section]]
id = "what"
heading = "Measure Y"

[[section.line]]
text = "Measure Y asks the voters of this community services district whether to approve a yearly parcel tax for fire protection."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["establishing annual special parcel tax"]

[[section]]
id = "today"
heading = "How the tax would work"

[[section.line]]
id = "uses"
text = "The money could pay only for a fire protection service agreement with another fire protection provider, and the costs of running the tax."
sources = ["impartial-analysis", "text"]

[section.line.visual]
kind = "illustration"
name = "fire-station-engine"

[[section.line]]
id = "threshold"
text = "Measure Y needs two-thirds of the vote to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "rate"
text = "Each developed parcel would pay up to $500 a year, and each undeveloped parcel up to $250."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "bars"
title = "Most each parcel could pay a year, before any yearly increase, in dollars"
source = "impartial-analysis"
unit = ""
labels = ["Developed parcel", "Undeveloped parcel"]
values = [500, 250]

[[section.line]]
text = "The rate could rise up to 3.5 percent a year, if the service agreement includes that increase."
sources = ["impartial-analysis", "text"]

[[section.line]]
id = "term"
text = "The ordinance and the impartial analysis say the tax would begin July 1, 2027, and end by June 30, 2037, or sooner if the service agreement ends."
sources = ["text", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "end-date"

[[section.line]]
id = "question-term"
text = "The ballot question itself describes the tax as continuing until ended by voters."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["continuing until ended by voters"]

[[section]]
id = "fiscal"
heading = "What the ballot question says"

[[section.line]]
id = "revenue"
text = "The ballot question estimates the tax would raise about $64,500 in its first year."
sources = ["ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["raising approximately $64,500 in year one"]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"
filed = false

[[section.line]]
text = "No argument for Measure Y was submitted, the county voter guide says."
sources = ["arguments"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["No argument for was submitted"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure Y was submitted, the county voter guide says."
sources = ["arguments"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote is a vote to approve a special tax on property in the district for fire protection."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["a vote to approve a special tax"]

[[section.line]]
text = "A no vote is a vote against a special tax on property in the district for fire protection."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["a vote against a special tax"]

[[question]]
ask = "What would the money pay for?"
lines = ["uses"]

[[question]]
ask = "How much would my parcel pay?"
lines = ["rate"]

[[question]]
ask = "How long would the tax last?"
lines = ["term", "question-term"]

[[question]]
ask = "What vote does the measure need to pass?"
lines = ["threshold"]

[[question]]
ask = "How large is $64,500 next to the district's budget?"
unanswered = true
