# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; what the zone is, who votes in
# it and who placed the measure; the vote it needs; what would change
# (the new tax, what it pays for, how long it lasts, what happens if it
# fails); the impartial analysis's revenue estimate; one line per side;
# what a vote does.
#
# An argument in favor was printed; no argument against was ("NO
# ARGUMENTS AGAINST THIS MEASURE WERE SUBMITTED"), so the no side says
# so, filed = false (STANDARD.md 2.5), citing the pamphlet page that
# prints the notice. The supporters' account of rising costs, heavier
# traffic and the roads in the zone is theirs, so it stays in their
# section or out (STANDARD.md 6.3); the year the $325 was set is said
# only there, as their claim.
#
# The pamphlet prints no tax rate statement; the revenue estimate is in
# the ballot question and County Counsel's impartial analysis, which the
# fiscal line names as the county attorney's ("Counsel" is heard as
# "Council", standard/speakability.txt). The money is the zone's own
# road revenue, and no archived source states a budget it would be part
# of, so it has no scale (STANDARD.md 6.5; left open). The per-parcel
# amounts are exempt.

contest = "ca-2026-11-03-walnut-drive-road-zone-measure-j"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide-page"
number = "J"
title = "IMPARTIAL ANALYSIS OF MEASURE J"
origin = "This Measure was placed on the ballot by the Board of Supervisors of the County of El Dorado at the request of the advisory committee for the Zone"
summary = "Shall the measure to levy an annual special tax in an amount of $525.00 on each parcel of land within the Walnut Drive Zone of Benefit commencing fiscal year 2027/2028 and continuing for an unlimited duration, to be used only for road improvements and maintenance and generating an annual revenue of approximately $39,375, to replace the current benefit assessment of $325, be adopted?"
yes = "A “YES” vote is a vote to authorize the levy of an annual special tax in the Walnut Drive Road Zone of Benefit in an amount of $525 per parcel, as provided in the Measure."
no = "A “NO” vote is a vote against the levy of the special tax."

