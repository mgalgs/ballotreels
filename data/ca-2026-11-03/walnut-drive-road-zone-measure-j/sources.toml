# Archived sources for Walnut Drive Road Zone of Benefit Measure J,
# 2026-11-03 general election (sources/sources.md). Every id here may be
# cited by script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1). The pages are cut from the El Dorado
# County Elections Department's Voter Information Pamphlet (PDF pages
# 67 to 69, printed pages 11 to 13); "pages" below are the printed numbers.
#
# A zone of benefit of County Service Area 9 is a special district: the
# division is the county, and `voters` names the zone as the impartial
# analysis does (docs/SCRIPT-FORMAT.md). The pamphlet prints the
# Board of Supervisors' resolution with the ballot question, an argument
# in favor, the notice that no argument against was submitted, and
# County Counsel's impartial analysis; no rebuttals and no tax rate
# statement (a special parcel tax).

[contest]
id = "ca-2026-11-03-walnut-drive-road-zone-measure-j"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/county:el_dorado"
kind = "measure"
title = "Walnut Drive Road Zone of Benefit Measure J: A $525 Road Tax per Parcel, Replacing the $325 Assessment"
voters = "the Walnut Drive Road Zone of Benefit #98124 of County Service Area 9"

