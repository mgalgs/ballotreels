# Archived sources for County of Sonoma Measure H, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# The Sonoma County Registrar of Voters publishes each measure's pages
# of its guide as one PDF, headed "Local Ballot Measure: H" and footed
# "Sonoma County" with the guide's page numbers (049M520 to 049M527); no
# cover page was archived, so the sources name those pages, not a guide
# title. One PDF backs every source here. County Counsel's Impartial
# Analysis is the measure's neutral explanation; the County Auditor's
# Fiscal Impact Statement is its fiscal statement (a sales tax: no tax
# rate statement).

[contest]
