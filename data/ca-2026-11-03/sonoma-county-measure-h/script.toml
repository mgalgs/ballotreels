# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the tax today and when it ends;
# that it is a special tax needing two-thirds; what would change (how
# long, where the money goes); the two revenue figures as printed; one
# line per side; what a vote does.
#
# The ballot question and the Impartial Analysis say about $15.5 million
# a year; the County Auditor's Fiscal Impact Statement estimates $17.1
# million in the first full year, 2029-2030. The fiscal line gives both,
# each attributed, so the card's figure and the statement's do not
# seem to disagree unexplained. No archived source states the county's
# general fund budget, so neither has a scale (STANDARD.md 6.5; left
# open). "Counsel" is heard as "Council" (standard/speakability.txt), so
# the narration says "the impartial analysis".
#
# The supporters' "without raising taxes" is their argument and stays in
# their section (STANDARD.md 6.3); the neutral sections say only that the
# measure extends the existing tax, as the analysis and fiscal statement
# do. No argument against Measure H was submitted: the no side is
# filed = false.

contest = "ca-2026-11-03-sonoma-county-measure-h"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "measure-question"
number = "H"
title = "County of Sonoma"
origin = "The Board of Supervisors unanimously voted to place this measure on the ballot."
summary = "Without raising taxes, to improve and protect Sonoma County’s regional and neighborhood parks; safeguard water supplies, streams, rivers; reduce future wildfire risk; preserve fish and wildlife habitat; conserve natural areas for future generations; expand walking, hiking, and biking trails; shall Sonoma County continue a one-eighth-cent special transaction and use tax (sales tax) countywide until ended by voters, providing approximately $15.5 million annually, with community oversight, public disclosure, and annual audits?"
yes = "A “yes” vote on Measure H will authorize the County to extend the sales tax rate of one-eighth cent on each dollar countywide."
no = "A “no” vote on Measure H will prohibit the County from extending the proposed sales tax."

[[section]]
id = "what"
heading = "Measure H"

[[section.line]]
text = "County of Sonoma Measure H asks voters across the county whether to continue a sales tax for parks."
sources = ["measure-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "measure-question"
highlight = ["continue a one-eighth-cent special transaction and use tax (sales tax) countywide"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Voters first approved the tax, one-eighth of 1 percent, in 2018, and it expires on March 31, 2029."
sources = ["fiscal-statement"]

[section.line.visual]
kind = "illustration"
name = "end-date"

[[section.line]]
text = "As a special tax, its money may be spent only on the purposes the measure lists, and it needs two-thirds of the vote."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "Measure H would extend the tax from April 1, 2029, until voters repeal it."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "mountain-park"

[[section.line]]
id = "allocation"
text = "One-third of the money would go to city parks, and two-thirds to regional parks, trails and open space."
sources = ["fiscal-statement"]

[section.line.visual]
kind = "share"
title = "Where the tax would go"
source = "fiscal-statement"
unit = "%"
labels = ["City parks", "Regional park upkeep", "Access and trails", "Nature and fire safety"]
values = [33.3, 25.0, 23.4, 18.3]

[[section]]
id = "fiscal"
heading = "What it would raise"

[[section.line]]
text = "The ballot question says about $15.5 million a year; the County Auditor estimates $17.1 million in the first full year, 2029-2030."
sources = ["measure-question", "fiscal-statement"]

[section.line.visual]
kind = "illustration"
name = "sales-receipt"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Measure H renews funding that protects parks, reduces wildfire risk and keeps water clean, all without raising taxes."
sources = ["arguments"]
basis = ["Vote Yes on Measure H to protect and enhance Sonoma County’s regional parks and city parks, reduce wildfire risk, and safeguard clean water, without raising taxes.", "Measure H renews existing funding and does not increase the tax rate."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Parks, wildfire safety and clean water", "Renews funding at the same rate"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure H was submitted for the Sonoma County voter guide, so no opposing view appears beside it."
sources = ["arguments"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote will authorize the county to extend the sales tax."
sources = ["measure-question"]

[section.line.visual]
kind = "page"
source = "measure-question"
highlight = ["will authorize the County to extend"]

[[section.line]]
text = "A no vote will prohibit the county from extending the sales tax."
sources = ["measure-question"]

[section.line.visual]
kind = "page"
source = "measure-question"
