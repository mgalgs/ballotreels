# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and of whom; how a school bond is repaid and what it needs to
# pass; what the money would pay for; the district's tax statement; one
# line per side; what a vote does.
#
# The ballot label prints no title line above its question, so the card
# quotes the question as its title (as Utah's card does) and the
# impartial analysis's statement of what the measure does as its
# summary. "Counsel" is heard as "Council" (standard/speakability.txt).
# The bond total and the debt service are repaid from a tax on property
# in the district, and no archived source states the district's budget,
# so they have no budget scale (STANDARD.md 6.5; left open). The
# supporters' "WON'T raise your tax rate" and the 2002 bond it extends
# are their argument, so they stay out of the neutral sections
# (STANDARD.md 6.3).
#
# No argument against Measure K was filed. The no side says so plainly;
# its section is marked filed = false.

contest = "ca-2026-11-03-fallbrook-elementary-measure-k"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-label"
number = "K"
title = "To update local elementary and middle schools without increasing tax rates; replace failing roofs, plumbing and electrical systems; improve school safety; construct/repair/acquire classrooms, labs, facilities, equipment, and sites; and qualify for State matching funds; shall Fallbrook Union Elementary School District’s measure be adopted, authorizing $76,000,000 in bonds at legal rates, levying a projected $30 per $100,000 assessed value while bonds are outstanding, generating $5,000,000 annually, with public oversight, audits, no funds for administrators, all funds staying local?"
origin = "The Governing Board for the Fallbrook Union Elementary School District (“District”) placed this measure on the ballot."
summary = "If approved by 55% of the votes cast, this measure will authorize the District to issue and sell general obligation bonds in an amount not to exceed $76,000,000."
yes = "A “YES” vote is in favor of authorizing the District to issue and sell $76,000,000 in general obligation bonds."
no = "A “NO” vote is against authorizing the District to issue and sell $76,000,000 in general obligation bonds."

[[section]]
id = "what"
heading = "Measure K"

[[section.line]]
text = "Fallbrook Union Elementary School District Measure K asks the district's voters whether to approve $76 million in school bonds."
sources = ["ballot-label"]

[section.line.visual]
kind = "page"
source = "ballot-label"
highlight = ["$76,000,000 in bonds"]

[[section]]
id = "today"
heading = "How a school bond works"

[[section.line]]
text = "The district would borrow the money and repay it from a tax on property in the district."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "bond-certificates"

[[section.line]]
text = "Measure K needs 55 percent of the vote to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "The money would replace failing roofs, plumbing and electrical systems, improve school safety, and build or repair classrooms and labs."
sources = ["ballot-label"]

[section.line.visual]
kind = "illustration"
name = "school-classroom"

[[section]]
id = "fiscal"
heading = "What the tax statement says"

[[section.line]]
text = "The district's tax statement estimates a tax of $30 per $100,000 of assessed value, collected through 2062-2063."
sources = ["tax-statement"]

[section.line.visual]
kind = "illustration"
name = "debt-payments"

[[section.line]]
text = "The statement estimates the total to repay, with interest, at about $167 million."
sources = ["tax-statement"]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Measure K repairs aging neighborhood schools without raising the current tax rate."
sources = ["arguments"]
basis = ["WITHOUT raising your tax rate, VOTE YES on Measure K to repair aging", "Measure K WON’T raise your tax rate."]

[section.line.visual]
kind = "list"
source = "arguments"
