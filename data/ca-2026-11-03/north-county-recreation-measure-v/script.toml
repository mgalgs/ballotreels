# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and of whom; what the district manages and the vote it
# needs; what would change (the tax per parcel, how long, what the money
# is for); the ballot question's revenue estimate; one line per side;
# what a vote does.
#
# No place name is narrated (the narrator mispronounces them): the opening
# says "the voters of this recreation and park district". The card, the
# title and the "Only voters in ..." line carry the names. "Counsel" is
# heard as "Council" (standard/speakability.txt), so the narration does
# not say it.
#
# The card quotes the County of Monterey Elections Department's List of
# Local Measures, which prints the ballot question with no yes and no
# sentences, so the card has no boxes and the vote lines take their
# meaning from the impartial analysis. The $300,000 a year is district
# revenue, and no archived source states the district's budget, so it has
# no scale (STANDARD.md 6.5; left open). The $82 per parcel is exempt.
#
# The uses are named as the impartial analysis lists them, since a voter
# needs to know what the tax pays for. The supporters' line keeps to
# their own reasons (the gym that serves as an emergency shelter, which
# no neutral source mentions, and the senior center having outgrown its
# space), and leaves out the gym's cost estimate, a figure about the
# district's money with no budget beside it.
#
# The list links no argument against Measure V. The no side says so
# plainly; its section is marked filed = false.

contest = "ca-2026-11-03-north-county-recreation-measure-v"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "measure-list"
number = "V"
title = "North County Recreation and Park District"
origin = "2/3 Voter Approval Required"
summary = "Shall the measure to expand the community senior center; provide clean, safe parks; enhance recreational programs for youth and seniors; ensure disability accessibility; maintain park restrooms; and retain staff to operate facilities at North County Recreation and Park District, by levying $82.00 annually per parcel, raising approximately $300,000.00 per year until ended by voters, be adopted?"

[[section]]
id = "what"
heading = "Measure V"

[[section.line]]
text = "Measure V asks the voters of this recreation and park district whether to approve a parcel tax of $82 a year."
sources = ["measure-list", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "measure-list"
highlight = ["by levying $82.00 annually per parcel"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "district"
text = "The district manages neighborhood parks and community facilities, including a community senior center."
sources = ["text"]

[section.line.visual]
kind = "illustration"
name = "city-park-lawn"

[[section.line]]
id = "threshold"
text = "Measure V needs two-thirds of the vote to pass."
sources = ["impartial-analysis", "measure-list"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "amount"
text = "Each property in the district would pay $82 a year."
sources = ["impartial-analysis", "text"]

[section.line.visual]
kind = "illustration"
name = "city-parcels"

[[section.line]]
id = "duration"
text = "The tax would continue until the district's voters repeal it."
sources = ["impartial-analysis", "text"]

[[section.line]]
id = "uses"
text = "The money would go to expanding the senior center, clean and safe parks and restrooms, disability access, recreation programs, and staff to maintain the district's properties."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "senior-center"

[[section]]
id = "fiscal"
heading = "What the ballot question says"

[[section.line]]
id = "revenue"
text = "The ballot question says the tax would raise about $300,000 a year."
sources = ["measure-list"]

[section.line.visual]
kind = "page"
source = "measure-list"
highlight = ["raising approximately $300,000.00 per year"]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say the gym that serves as an emergency shelter needs a new heating and cooling system, and the senior center has outgrown its space."
sources = ["argument-for"]
basis = ["When disaster strikes, the NCRPD gym serves as a designated emergency shelter.", "The gym needs an HVAC replacement", "Our Senior Center has outgrown its space."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Upgrades the gym used as a shelter", "Expands the outgrown senior center"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure V was filed, so the list of local measures from the county shows only the argument in favor of the measure."
sources = ["measure-list"]

[section.line.visual]
kind = "list"
source = "measure-list"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote is in favor of an annual parcel tax of $82 per parcel, as the measure sets out."
sources = ["impartial-analysis", "measure-list"]

[section.line.visual]
kind = "page"
source = "measure-list"
highlight = ["by levying $82.00 annually per parcel"]

[[section.line]]
text = "A no vote is against the parcel tax."
sources = ["impartial-analysis", "measure-list"]

[section.line.visual]
kind = "page"
source = "measure-list"
highlight = ["be adopted"]

[[question]]
ask = "How much would my property pay, and for how long?"
lines = ["amount", "duration"]

[[question]]
ask = "What would the money pay for?"
lines = ["uses"]

[[question]]
ask = "How large is $300,000 next to the district's budget?"
unanswered = true
