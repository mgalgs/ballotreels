# Archived sources for Fresno County Measure S, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1).
#
# The Fresno County Registrar of Voters posts each measure's filed
# documents on its election page; no printed Voter Information Guide
# was found online. The ballot question is quoted from Board of
# Supervisors Resolution No. 26-294, Section 5. County Counsel's
# impartial analysis is the measure's neutral explanation, the kind a
# state's attorney general's explanatory statement is. The
# Auditor-Controller/Treasurer-Tax Collector's fiscal impact statement
# is the measure's official fiscal statement.
#
# Which election: Resolution No. 26-294 (August 11, 2026) consolidates
# the measure with the March 7, 2028 Statewide Primary Election, reading
# Assembly Bill 1923 together with the Elections Code's 88-day rule. The
# later impartial analysis (filed September 2, 2026) says the measure
# "is being submitted to the voters at the November 3, 2026 election as
# required by Assembly Bill 1923", the arguments were filed for the
# November 3, 2026 election, and the registrar lists Measure S on its
# November 3, 2026 election page. The script follows the registrar and
# the analysis; the resolution is cited only for the ballot question.
#
# Every PDF is a scan with no text layer. The passages cited were typed
# from the page images into sources/*-transcription.txt, each naming the
# PDF and URL it copies; those sources point at the transcription, and
# their url at the scan (as Clayton Measure M's do). The rebuttals and
# the Elections Code 9111 report are archived but not cited.

