# Archived sources for City of Westminster Measure O, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows (docs/STANDARD.md,
# section 1). Every source is a page of the Measure O section ("Ballot
# Measures-O", Section 11) of the Orange County Registrar of Voters'
# Voter Information Guide, one archived PDF; "page" is the section's own.
#
# The City Attorney's Impartial Analysis is the measure's neutral
# explanation, the kind a state's attorney general's explanatory
# statement is. Neither an argument in favor nor one against was
# submitted (page 1 prints the notices), and no tax rate statement or
# fiscal analysis is printed.

[contest]
id = "ca-2026-11-03-westminster-measure-o"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:westminster"
kind = "measure"
title = "Westminster Measure O: Raising the Hotel Guest Tax From 8% to 12%"

