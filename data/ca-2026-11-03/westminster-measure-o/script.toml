# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and whose measure it is; the tax hotel guests pay today, who placed
# Measure O on the ballot and the vote it needs; what would change (the
# rate, where the money goes, the audit, when it starts); the ballot
# question's revenue estimate; both sides, which filed nothing; what a
# vote does.
#
# No arguments were submitted ("No argument in favor of this measure was
# submitted." and "No argument against this measure was submitted."):
# both sides say so, filed = false (STANDARD.md 2.5), citing the guide
# page that prints the notices. The guide prints no fiscal analysis or tax
# rate statement, and the impartial analysis gives no estimate; the one
# estimate is the ballot question's, which the fiscal line names. It is
# city revenue, and no archived source states the city's budget, so it has
# no scale (STANDARD.md 6.5; left open, under [[question]]).

contest = "ca-2026-11-03-westminster-measure-o"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide-page"
number = "O"
title = "City of Westminster, Westminster City Services Measure"
origin = "The measure was placed on the ballot by the City Council of the City of Westminster."
summary = "To fund general city services such as fire, paramedic, police, 911 emergency response, disaster preparedness, keeping public areas safe/clean; addressing homelessness; maintaining parks, and addressing speeding/unsafe driving; shall the measure increasing Westminster’s tax paid by hotel/motel guests (transient occupancy tax), from 8% to 12%, providing approximately $452,000 annually in new funds until ended by voters, requiring audits, spending disclosures, funds controlled locally, be adopted?"
yes = "A YES vote is a vote to increase the rate of the Hotel Tax to 12%."
no = "A NO vote is a vote to not increase the rate of the Hotel Tax."

[[section]]
id = "what"
heading = "Measure O"

[[section.line]]
text = "Westminster Measure O asks city voters whether to raise the tax on hotel and motel stays from 8 to 12 percent."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["from 8% to 12%"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Today, guests who stay 30 days or less at a Westminster hotel or motel pay an 8 percent tax, collected by the hotel."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "hotel-front-desk"

[[section.line]]
text = "The City Council placed Measure O on the ballot, and it needs a majority to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "ballot-box"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "Measure O would raise the rate to 12 percent, starting January 1, 2027, until voters repeal it."
sources = ["impartial-analysis", "text", "guide-page"]

[section.line.visual]
kind = "bars"
title = "Hotel guest tax rate"
source = "impartial-analysis"
unit = "%"
labels = ["Today", "Measure O"]
values = [8, 12]

[[section.line]]
text = "The money would go to the general fund, for any lawful city purpose, and be audited every year."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "special-tax"

[[section]]
id = "fiscal"
heading = "What the guide says"

[[section.line]]
id = "revenue"
text = "The ballot question says the higher rate would bring in about $452,000 a year in new funds."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "set-aside-funds"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"
filed = false

[[section.line]]
text = "No argument for Measure O was submitted for the Orange County Voter Information Guide."
sources = ["guide-page"]

[section.line.visual]
kind = "list"
source = "guide-page"
items = ["No argument for was submitted"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure O was submitted for the Orange County Voter Information Guide."
sources = ["guide-page"]

[section.line.visual]
kind = "list"
source = "guide-page"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote is a vote to increase the hotel tax rate to 12 percent."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["a vote to increase"]

[[section.line]]
text = "A no vote is a vote to not increase the hotel tax rate."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["a vote to not increase"]

[[question]]
ask = "How much money is at stake?"
