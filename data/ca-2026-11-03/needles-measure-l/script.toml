# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and whose measure it is; how the bonds are repaid; the vote it
# needs; what would change (what the money may pay for, the audits); the
# tax rate statement's rate and total; one line per side; what a vote
# does.
#
# The guide prints no ballot question: the card quotes it from the City
# Council's ordinance (sources.toml), and the vote lines quote the City
# Attorney's yes/no statements, highlighting the card's own "shall the
# City of Needles measure be approved". The bond
# total and the debt service are repaid by a property tax on property in
# the city, not from the city's budget, so neither takes a scale
# (STANDARD.md 6.5, exempt). The tax rate statement's last year of
# collection (fiscal year 2058-59) and its highest-rate years (through
# 2060-61) disagree, so the script gives neither.
#
# No argument against was filed: the no side says so, filed = false
# (STANDARD.md 2.5).

contest = "ca-2026-11-03-needles-measure-l"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "L"
title = "CITY OF NEEDLES"
origin = "AN ORDINANCE OF THE CITY COUNCIL OF THE CITY OF NEEDLES"
summary = "To improve the City of Needles including roads and transportation infrastructure; repairing and repaving streets; fixing potholes; maintaining community safety; improving parks and recreational facilities; and revitalizing downtown Main Street; shall the City of Needles measure be approved authorizing $11,200,000 of bonds at legal rates, generating on average $739,971 annually while bonds are outstanding at a rate of $60 per $100,000 assessed value, with annual audits, independent citizens' oversight, NO money for salaries and all money staying in Needles?"

[[section]]
id = "what"
heading = "Measure L"

[[section.line]]
text = "City of Needles Measure L asks Needles voters whether the city may borrow up to $11,200,000 through bonds for streets, parks and other public works."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["$11,200,000 of bonds"]

[[section]]
id = "background"
heading = "How the bonds are repaid"

[[section.line]]
text = "The bonds would be repaid by a property tax on property in the city."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "bond-certificates"

[[section]]
id = "today"
heading = "What it needs to pass"

[[section.line]]
text = "Measure L needs two-thirds of the vote to pass."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "vote-thresholds"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "The money could repair streets, potholes and sidewalks, improve parks and public buildings, and help revitalize downtown Main Street."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "open-road"

[[section.line]]
text = "Yearly independent audits would check that the money goes only to these projects."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section]]
id = "fiscal"
heading = "What the tax rate statement says"

[[section.line]]
id = "tax-rate"
text = "The tax rate statement estimates the tax at $60 a year per $100,000 of assessed value."
sources = ["tax-statement"]

[section.line.visual]
kind = "illustration"
name = "special-tax"

[[section.line]]
text = "The statement puts the total to be repaid, with interest, at about $25.16 million."
sources = ["tax-statement"]

[section.line.visual]
kind = "bars"
title = "Borrowed and repaid, in millions of dollars"
source = "tax-statement"
unit = ""
labels = ["Bonds", "Total repaid with interest"]
values = [11.2, 25.16]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Measure L repairs streets and potholes, with taxpayer protections: no money for salaries, and yearly audits."
sources = ["argument-for"]
basis = ["Measure L authorizes up to $11.2 million in general obligation bonds to repair and repave deteriorating streets, fix potholes", "Measure L includes strong taxpayer protections.", "Bond proceeds cannot be used for City employee salaries or general operating expenses.", "The measure requires accountability safeguards, including annual audits"]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Repairs streets, potholes, sidewalks and parks", "No money for salaries; yearly audits"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure L was filed, so the county voter guide prints only the argument of supporters."
sources = ["argument-for"]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote would authorize the city to sell up to $11,200,000 in bonds for these repairs."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["shall the City of Needles measure be approved"]

[[section.line]]
text = "A no vote would not authorize the bonds."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["shall the City of Needles measure be approved"]

[[question]]
ask = "How much would a property owner pay?"
lines = ["tax-rate"]
