# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks and whose measure it is; how the bonds are repaid; the vote it
# needs; what would change (what the money may pay for, the audits); the
# tax rate statement's rate and total; one line per side; what a vote
# does.
#
# The card quotes the guide's page, not the ballot question
# (sources.toml); the vote lines quote its yes/no statements. The bond
# total and the debt service are repaid by a property tax on property in
# the city, not from the city's budget, so neither takes a scale
# (STANDARD.md 6.5, exempt). The tax rate statement's last year of
# collection (fiscal year 2058-59) and its highest-rate years (through
# 2060-61) disagree, so the script gives neither.
#
# No argument against was filed: the no side says so, filed = false
# (STANDARD.md 2.5).

contest = "ca-2026-11-03-needles-measure-l"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "impartial-analysis"
number = "L"
title = "CITY OF NEEDLES"
origin = "The City Council of Needles has voted to place a Measure on the November 3, 2026 ballot to seek voter approval to issue general obligation bonds up to $11,200,000."
summary = "The funds raised through these bonds would finance the cost of acquiring, constructing, improving, renovating, and equipping municipal improvements and public infrastructure within the City, including but not limited to, improvements to roads and transportation infrastructure, street rehabilitation, street repaving, and pothole repair, public facilities, parks and recreational facilities, community safety improvements, and the revitalization of Downtown Main Street."
yes = "A \"yes\" vote would authorize the issuance and sale of general obligation bonds in the amount up to $11,200,000 to fund street, roadway, and pothole repair improvements, sidewalk and pedestrian safety improvements, and upgrade park and recreational facilities including restrooms, irrigation, landscaping, and parking at City parks and recreational facilities."
no = "A \"no\" vote would not authorize the issuance and sale of the bonds."

[[section]]
id = "what"
heading = "Measure L"

[[section.line]]
text = "City of Needles Measure L asks Needles voters whether the city may borrow up to $11,200,000 through bonds for streets, parks and other public works."
sources = ["impartial-analysis"]

[section.line.visual]
