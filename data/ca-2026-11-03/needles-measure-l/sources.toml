# Archived sources for City of Needles Measure L, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1). The guide's pages are cut from the San
# Bernardino County Registrar of Voters' Voter Information Guide; "page"
# is the guide's printed footer number (its PDF pages are two higher).
#
# The guide prints no ballot question. The question is in the City
# Council's ordinance (its Section 7, "Ballot Proposition"), but the
# ordinance's text runs a document footer into the middle of it, so no
# card can quote it verbatim; the card quotes the guide's own page
# instead: the City Attorney's Impartial Analysis and its yes/no
# statements.

[contest]
id = "ca-2026-11-03-needles-measure-l"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:needles"
kind = "measure"
title = "City of Needles Measure L: $11,200,000 in General Obligation Bonds for Streets, Parks and Public Infrastructure"

