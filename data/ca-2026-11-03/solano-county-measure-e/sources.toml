# Archived sources for Solano County Measure E, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# No printed Solano County voter guide was archived: these are the filed
# documents the Solano County Registrar of Voters posts on its Current
# Election Information page. The ballot question is quoted from
# Resolution No. 2026-164, which orders it "included on the ballot". The
# resolution and the argument in favor are scans with no text layer:
# the passages `check` reads verbatim were typed from the page images
# into .txt transcriptions beside the PDFs, which name the PDF and URL
# they copy; those sources point at the transcriptions, and their urls
# at the scans. County Counsel's impartial analysis is the measure's
# neutral explanation. No tax rate statement or fiscal analysis was
# posted (a business license tax); the one revenue estimate is county
# staff's, as the analysis gives it.
#
# No rebuttal to the argument against was posted; the rebuttal to the
# argument in favor is not cited.

[contest]
id = "ca-2026-11-03-solano-county-measure-e"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/county:solano"
kind = "measure"
title = "Solano County Measure E: Business License Tax on Energy Facilities and Data Centers"

