# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the charter's contracting rules
# today and how old they are; what would change (the approval threshold,
# the lowest-bidder rule and its new exception, what design-build is);
# what the impartial analysis says of savings; one line per side; what a
# vote does.
#
# No narrated line names the city (the narrator mispronounces proper
# names); the card and title show it. The no side filed no argument (the
# Registrar's list: "(none filed)"), so its line says so, naming the
# Registrar without the county's name.
#
# Dollar figures: $1,000 and $250,000 are per-contract thresholds, not
# money a budget pays or receives, so they have no scale (STANDARD.md
# 6.5). The supporters' "more than $400 million in critical
# infrastructure" is left out: no archived source states the city's
# budget to scale it against. The impartial analysis projects savings
# with no dollar figure, and the fiscal line says only what it says.
#
# The card quotes the Registrar of Voters' List of Local Measures, which
# prints no yes/no lines; the vote lines give the impartial analysis's
# meanings and highlight the one phrase of the question both turn on.

contest = "ca-2026-11-03-santa-clara-measure-c"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "C"
title = "Public Works Charter Amendment"
origin = "City of Santa Clara"
summary = 'Shall the measure proposing to amend the City Charter to update rules for public works contracting, setting the threshold for Council approval and formal bidding at $250,000, retaining provisions for awards of standard contracts to the lowest responsive and responsible bidder, and also allowing for competitive "best value" contracting to improve project quality, expedite project completion, and minimize risks, all as set forth in a City ordinance approved at a public meeting, be adopted?'

[[section]]
id = "what"
heading = "Measure C"

[[section.line]]
text = "Measure C asks the voters of this city whether to amend the city charter to update its rules for public works contracts."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["update rules for public works contracting"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "today-rules"
text = "Today the charter requires council approval for public works contracts over $1,000, and awards every contract to the lowest responsible bidder."
sources = ["impartial-analysis", "resolution"]

[section.line.visual]
kind = "illustration"
name = "project-site"

[[section.line]]
id = "since-1952"
text = "Those rules were enacted in 1952 and have not changed since."
sources = ["impartial-analysis"]

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "threshold"
text = "Measure C would raise the threshold for council approval to $250,000, and the city manager would approve smaller contracts."
sources = ["impartial-analysis", "resolution"]

[section.line.visual]
kind = "illustration"
name = "city-council-chamber"

[[section.line]]
id = "best-value"
text = "Most contracts would still go to the lowest responsive and responsible bidder, with exceptions for best value contracting such as design-build."
sources = ["impartial-analysis", "resolution"]

[section.line.visual]
kind = "illustration"
name = "hourglass-plans"

[[section.line]]
id = "design-build"
text = "In design-build, one contract goes to a single design and construction team, chosen as the most qualified bidder."
sources = ["impartial-analysis"]

[[section]]
id = "fiscal"
heading = "What the impartial analysis says"

[[section.line]]
text = "The impartial analysis projects savings in staff time, as smaller contracts would no longer go to the council, and possibly from best value contracting."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say the outdated charter allows only one contracting method, which often delays complex projects."
sources = ["argument-for"]
basis = ["but the outdated City of Santa Clara Charter limits us to only one: Design-Bid-Build (DBB).", "it often delays complex projects because every detail must be designed before construction can begin."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Ends a one-method limit that delays projects", "Lets the city choose the best method per project"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "No argument against Measure C was filed with the Registrar of Voters for this county."
sources = ["ballot-question"]

[section.line.visual]
kind = "list"
source = "ballot-question"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote replaces the charter's public works rules with the updated rules."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["update rules for public works contracting"]

[[section.line]]
text = "A no vote keeps the existing rules without amendment."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["update rules for public works contracting"]

[[question]]
ask = "What are the rules today?"
lines = ["today-rules", "since-1952"]

[[question]]
ask = "What is design-build?"
lines = ["design-build"]

[[question]]
ask = "Who would approve the smaller contracts?"
lines = ["threshold"]
