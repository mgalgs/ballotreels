# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks; whose measure it is (a five-county district the Legislature
# made) and how it reached the ballot; what would change (the rates,
# where Alameda County's share goes, the oversight); the analysis's
# revenue estimate; one line per side; what a vote does.
#
# The guide prints no fiscal analysis or tax rate statement; the one
# revenue estimate is the Legal Counsel's, in the ballot question and the
# Impartial Analysis. The $980 million is the district's, across five
# counties; no archived source states a budget of the district or its
# transit agencies to compare it with, so it has no scale (STANDARD.md
# 6.5; left open).
#
# The full text's findings (deficits, cuts) are the initiative
# proponents' case and so appear only in the sides (rule 6.3), from the
# arguments. Sides come from the argument in favor and the argument
# against, not the rebuttals.

contest = "ca-2026-11-03-alameda-county-measure-rtm"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide-page"
number = "RTM"
title = "REGIONAL TRANSIT MEASURE RTM"
origin = "This measure was placed on the ballot by voter initiative, signed by the requisite number of voters within the Public Transit Revenue Measure District (“District”)."
summary = "To prevent major service cuts to BART and other transit, avoid increased traffic, and reduce pollution by: Preserving BART, Caltrain, VTA, SamTrans, AC Transit, Muni, other transit for everyone, including workers, students, seniors, persons with disabilities; Supporting transit safety, cleanliness, affordability, reliability; Repairing targeted roads/potholes; Requiring financial transparency, oversight, accountability; shall the measure enacting a 0.5% (Alameda, Contra Costa, San Mateo, Santa Clara counties), and 1% (San Francisco) sales tax for 14 years generating approximately $980,000,000 annually, be adopted?"
yes = "A “yes” vote is a vote to impose the tax described above for 14 years."
no = "A “no” vote is a vote against imposing the tax."

[[section]]
id = "what"
heading = "Measure RTM"

[[section.line]]
text = "Regional Transit Measure RTM asks voters across Alameda County whether to add a half-cent sales tax for public transit, for 14 years."
sources = ["guide-page"]

[section.line.visual]
kind = "page"
source = "guide-page"
highlight = ["sales tax for 14 years"]

[[section]]
id = "background"
heading = "Whose measure it is"

[[section.line]]
id = "district"
text = "In 2025 the Legislature created a transit district covering Alameda, Contra Costa, San Mateo and Santa Clara counties and San Francisco."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "county-line-map"

[[section]]
id = "today"
heading = "How it reached the ballot"

[[section.line]]
text = "Voters placed Measure RTM on the ballot by petition, and it needs a majority of votes across the whole district."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "ballot-box"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "The tax would be half a percent in the four counties and 1 percent in San Francisco."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "city-storefronts"

[[section.line]]
id = "allocation"
text = "In Alameda County, 64.7 percent of the money raised would go to BART for transit operations."
sources = ["guide-page"]

[section.line.visual]
kind = "share"
title = "Alameda County's tax money going to BART"
source = "guide-page"
unit = "%"
labels = ["BART"]
