[[section.line]]
text = "An independent oversight committee would check that the money is handed out as the measure requires."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section]]
id = "fiscal"
heading = "What the impartial analysis says"

[[section.line]]
text = "The impartial analysis estimates the tax would raise about $980 million a year across the five counties."
sources = ["guide-page"]

[section.line.visual]
kind = "illustration"
name = "special-tax"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say that without the measure, BART could close 15 stations, and AC Transit could cut service and lay off workers, meaning longer waits."
sources = ["arguments"]
basis = ["Without the Regional Transit Measure, BART could be forced to scale their system back to what it looked like in 1976, closing 15 stations", "And AC Transit could see service reductions and layoffs - resulting in longer waits"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Prevents deep cuts to BART and AC Transit", "Agencies must show cost savings to keep funds"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say the tax would push the sales tax to 11.25 percent in most of the county, and BART and AC Transit are mismanaged."
