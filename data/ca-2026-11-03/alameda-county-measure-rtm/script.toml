basis = ["The RTM is a NEW TAX that would raise the Sales Tax rate to 11.25% in most of Alameda County.", "BART and AC Transit are grossly mismanaged."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Sales tax of 11.25% in most of the county", "BART and AC Transit are mismanaged"]

