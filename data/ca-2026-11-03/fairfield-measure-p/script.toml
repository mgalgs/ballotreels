# Recipe E, about 60 seconds, distilled: one claim per line. The chain:
# what it asks and whose measure it is; the tax today and when it ends;
# what would change (the rate and its end, the total rate, where the
# money goes, the vote it needs); the City's revenue estimate as the
# impartial analysis gives it; one line per side; what a vote does.
#
# The card quotes the ballot question from Resolution No. 2026-159,
# which prints no yes/no lines. So the card has no YES/NO boxes, the
# vote lines give the impartial analysis's meanings, and both highlight
# the same phrase of the question. The ballot question says "up to
# one-cent per dollar"; the narration gives the rate as the analysis and
# the resolution do ("by 1%", "from 1% to 2%"), since a rate in cents is
# misheard (standard/speakability.txt).
#
# Today's end date, March 31, 2033, is the one the ordinance strikes
# from the code (its Section 3). No tax rate statement or fiscal
# analysis applies; the $24 million a year is the City's estimate, and
# no archived source states the City's general fund budget to give it a
# scale (STANDARD.md 6.5; left open, under [[question]]). What the tax
# has paid for and the rising cost of services are the supporters'
# points, and the removed end date and the council's discretion the
# opponents', so each stays in its side's section (STANDARD.md 6.3).

contest = "ca-2026-11-03-fairfield-measure-p"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-question"
number = "P"
title = "City of Fairfield Measure P Update Measure"
origin = "RESOLUTION NO. 2026-159"
summary = "To provide and protect funding for Fairfield’s services, such as police, fire, 911 emergency response, neighborhood safety, street and sidewalk repair, homelessness prevention and response, and general governmental use, shall an ordinance be adopted to extend the City’s sales tax and increase the rate by up to one-cent per dollar until ended by voters, adding approximately $24 million annually, with independent citizen oversight, annual audits, public spending reports, and all funds locally controlled?"

[[section]]
id = "what"
heading = "Measure P"

[[section.line]]
text = "Measure P asks the voters of this city whether to extend the city sales tax and raise it by 1 percent."
sources = ["ballot-question", "impartial-analysis"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["extend the City’s sales tax and increase the rate"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "today-end"
text = "Today, the city has a 1 percent sales tax that is set to expire in March 2033."
sources = ["text", "impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "end-date"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "end"
text = "Measure P would make the city tax 2 percent, and keep it in place until ended by voters."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "illustration"
name = "sales-receipt"

[[section.line]]
text = "The total sales tax rate in the city would go from 8.375 percent to 9.375 percent, with groceries and prescriptions still exempt."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "bars"
title = "Total sales tax rate in Fairfield"
source = "impartial-analysis"
unit = "%"
labels = ["Today", "With Measure P"]
values = [8.375, 9.375]

[[section.line]]
id = "general"
text = "The money could be spent on any general city purpose, and the measure needs a simple majority."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "state-budget"

[[section]]
id = "fiscal"
heading = "What the impartial analysis says"

[[section.line]]
id = "revenue"
text = "The city attorney's impartial analysis says the city estimates Measure P would raise about $24 million a year in new revenue."
sources = ["impartial-analysis"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say Measure P has protected police, fire and street repair for years, and the cost of city services has risen sharply."
sources = ["argument-for"]
basis = ["For more than a decade, Measure P has provided locally controlled funding", "Measure P helped protect neighborhood police patrols, maintain fire and emergency medical response, and repair local streets and roads.", "But the cost of providing essential city services has increased dramatically."]

[section.line.visual]
kind = "list"
source = "argument-for"
items = ["Has protected police, fire and streets", "City service costs have risen"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say Measure P removes the end date, so the tax could continue forever, and the council can spend it on anything."
sources = ["argument-against"]
basis = ["Measure P removes the previous sunset clause, meaning this tax could continue forever unless voters later repeal it.", "where they can be spent on any purpose the City Council chooses."]

[section.line.visual]
kind = "list"
source = "argument-against"
items = ["Removes the tax’s end date", "Council may spend it on anything"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote adopts the sales tax ordinance."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["extend the City’s sales tax and increase the rate"]

[[section.line]]
text = "A no vote does not adopt the sales tax ordinance."
sources = ["impartial-analysis", "ballot-question"]

[section.line.visual]
kind = "page"
source = "ballot-question"
highlight = ["extend the City’s sales tax and increase the rate"]

[[question]]
ask = "When does the current tax end, and when would the new one?"
lines = ["today-end", "end"]

[[question]]
ask = "What can the money be spent on?"
lines = ["general"]

[[question]]
ask = "How big is $24 million a year next to the city budget?"
unanswered = true
