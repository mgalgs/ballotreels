# Archived sources for City of Fairfield Measure P, 2026-11-03 general
# election (sources/sources.md). Every id here may be cited by
# script.toml. `kind` must be one the standard allows
# (docs/STANDARD.md, section 1).
#
# No printed Solano County voter guide was archived: these are the filed
# documents the Solano County Registrar of Voters posts on its Current
# Election Information page. The ballot question is quoted from
# Resolution No. 2026-159, which orders it "printed on the ballot". The
# resolution is a scan with no text layer: the passages `check` reads
# verbatim were typed from the page images into
# sources/resolution-transcription.txt, which names the PDF and URL it
# copies; that source points at the transcription, and its url at the
# scan. The City Attorney's impartial analysis is the measure's neutral
# explanation. No tax rate statement or fiscal analysis applies (a sales
# tax); the one revenue estimate is the City's, as the analysis gives
# it. The rebuttals are not cited.

[contest]
id = "ca-2026-11-03-fairfield-measure-p"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/place:fairfield"
kind = "measure"
title = "City of Fairfield Measure P: Extend and Increase the City Sales Tax Until Ended by Voters"

