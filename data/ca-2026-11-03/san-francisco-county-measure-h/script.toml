# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# asks; what Muni is and how it is paid for today; what would change (the
# tax, its range and term, the senior discount); the Controller's
# Statement's revenue and its cost to run, each with its scale; one line
# per side; what a vote does.
#
# The ballot and pamphlet call it "Proposition H", so the narration does.
# The Controller's Statement on H names no budget total: the scale
# divides its figures by the "approximately $7 billion General Fund
# sources" the Controller's Statement on Proposition I gives
# (general-fund): $177 million is about 3 percent (2.5, rounded), $4
# million to $6 million less than 1 percent. The revenue would go to a
# Muni fund, not the General Fund; the General Fund is the denominator
# because the statement names none (STANDARD.md 6.5).
#
# That the money may go only to Muni, and that landlords may pass part of
# the tax to rent-controlled tenants, are each argued by a side (the
# proponents' "H ONLY FUNDS MUNI SERVICE", the opponents' "Renters
# aren't spared"), so neither is set up in a neutral section (6.3).
# Dollar ranges are said "between ... and ..." (standard/speakability.txt).

contest = "ca-2026-11-03-san-francisco-county-measure-h"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "digest"
number = "H"
title = "Parcel Tax to Fund Muni Operations"
origin = "On June 12, 2026, the Department of Elections certified that the initiative petition calling for Proposition H to be placed on the ballot had a sufficient number of valid signatures to qualify the measure for the ballot."
summary = "Shall the City fund Muni service through a new annual parcel tax on real estate at rates ranging from $129 per parcel up to a maximum of $400,000 per parcel, depending on the type of property and its size and adjusted annually for inflation, for estimated revenue of $177 million a year for 15 years?"
yes = "If you vote “yes,” you want the City to fund Muni service through a new annual parcel tax on real estate."
no = "If you vote “no,” you do not want to make these changes."

[[section]]
id = "what"
heading = "Proposition H"

[[section.line]]
text = "Proposition H asks San Francisco voters whether to fund Muni with a new yearly tax on parcels of real estate."
