# Archived sources for San Francisco Proposition H, 2026-11-03
# consolidated general election (sources/sources.md). Every id here may
# be cited by script.toml. The pages are cut from the Department of
# Elections' San Francisco Voter Information Pamphlet & Sample Ballot;
# "pages" are the pamphlet's printed page numbers (its PDF pages less 2).
#
# San Francisco prints no county counsel analysis: the Ballot
# Simplification Council's digest and the Controller's Statement are
# each labelled "an impartial analysis of this measure". One file holds
# the ballot question, digest and Controller's Statement, so it backs two
# sources of different kinds.
#
# The Controller's Statement on Proposition H names no budget total. The
# total behind the script's scale (STANDARD.md 6.5), "the approximately
# $7 billion General Fund sources", is from the Controller's Statement on
# Proposition I in the same pamphlet, copied here as
# sources/prop-i-controller-statement.pdf so the contest directory stands
# alone.

[contest]
id = "ca-2026-11-03-san-francisco-county-measure-h"
election = "ca-2026-11-03"
division = "ocd-division/country:us/state:ca/county:san_francisco"
kind = "measure"
title = "San Francisco Proposition H: Parcel Tax to Fund Muni Operations"

[[source]]
id = "digest"
kind = "official-title-summary"
publisher = "San Francisco Department of Elections, Voter Information Pamphlet & Sample Ballot, pages 124 to 125: ballot question and Digest by the Ballot Simplification Council"
credit = "Digest, San Francisco Voter Information Pamphlet"
url = "https://media.api.sf.gov/documents/N26_EN_VIP.pdf"
file = "sources/ballot-question-digest-controller-statement.pdf"
retrieved = "2026-10-28"

