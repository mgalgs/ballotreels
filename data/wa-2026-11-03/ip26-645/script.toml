# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; the tax the Legislature passed in 2026; what the measure would
# repeal and prohibit; what the Office of Financial Management says the
# state would lose, and what the state would save; one point per side;
# what a vote does.
#
# The full designation is said once, in the opening line; after that the
# script says "the measure", which reads faster aloud. Cut for time: the
# line on what the general fund pays for (schools, colleges, health
# care), which the card's public investment disclosure still shows.
#
# The card quotes the ballot as the Attorney General says it is displayed:
# the ballot title plus the public investment impact disclosure that state
# law prints with it (RCW 29A.72.050). Washington's pamphlet prints no "a YES
# vote means" lines, so the card has none, and the two vote lines take
# their meaning from one phrase of the Concise Description, highlighted
# alike.
#
# The tax credits and exemptions passed with the tax, which the measure
# leaves in place, are argued over by both sides (kept, or put at risk),
# so they are left to the sides (rule 6.3).
#
# Scale (rule 6.5): the Fiscal Impact Statement compares its $11.4
# billion and $150 million to no budget total. The Forecast Council's
# September 2026 forecast prints revenue for the funds subject to the
# budget outlook by fiscal year (Table 3.17) but no five-year sum, so
# each figure is compared year by year: the statement's yearly losses
# (Table 1) are 7 to 10 percent of each year's forecast for 2029 to
# 2031, when the tax would be collected (3,108/43,652; 4,432/46,604;
# 3,892/47,517), and its largest yearly saving (Table 2, $53.9 million
# in 2028) is under 1 percent of that year's $38,942 million.

contest = "wa-2026-11-03-ip26-645"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot"
number = "IP26-645"
title = "Initiative Measure No. IP26-645 concerns state and local taxes."
origin = "Initiative Measure IP26-645"
summary = "This measure would repeal a 9.9% tax on annual individual income over $1,000,000; prohibit taxes measured by individual income and taxes on individual income or the receipt of individual income; and define “income.” This measure would decrease funding for public K-12 education, higher education (including universities and community colleges), and human services (primarily healthcare)."

