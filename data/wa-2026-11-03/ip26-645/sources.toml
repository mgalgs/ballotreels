# Archived sources for Washington Initiative Measure IP26-645, 2026-11-03
# general election. Every id here may be cited by script.toml. `kind` must
# be one the standard allows (docs/STANDARD.md, section 1).
#
# The Attorney General's public investment impact disclosure is a
# statement of the measure's fiscal effect that state law requires on the
# ballot, so it is kept as a fiscal source beside the Office of Financial
# Management's Fiscal Impact Statement.

[contest]
id = "wa-2026-11-03-ip26-645"
election = "wa-2026-11-03"
division = "ocd-division/country:us/state:wa"
kind = "measure"
title = "Initiative Measure IP26-645: State and local taxes"

