# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; how school sports work today (separate teams by sex, rules
# against discrimination by sex or gender identity); what the measure
# would bar, whom the Attorney General says it would affect, and what
# students would need; what the Office of Financial Management says it
# costs; one point per side; what a vote does.
#
# The card quotes the Attorney General's ballot title: its Statement of
# Subject and Concise Description. Washington's pamphlet prints no "a YES
# vote means" lines, so the card has none, and the two vote lines take
# their meaning from the Concise Description's two verbs, highlighted
# alike.
#
# How verification would be done (exams, tests, records) is the heart of
# both sides' arguments, so it is left to them (rule 6.3); the neutral
# sections say only that a health care provider would verify.
#
# The Office of Financial Management's one-time state cost is said in its
# own word, "minor", not as a dollar figure: the archive holds no state
# budget total to give that figure its scale.

contest = "wa-2026-11-03-il26-638"
template = "measure"
template_version = 2
standard_version = 2

