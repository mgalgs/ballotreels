# Contest index for the 2026-11-03 Washington general election
# (docs/ARCHITECTURE.md). One [[contest]] entry per contest on the
# ballot. `number` is a measure's ballot designation (a string), as the
# Voters' Pamphlet heads its page ("Initiative Measure IL26-001"). Titles
# pair that designation with the measure's subject, in the words of its
# ballot title's Statement of Subject ("... concerns state and local
# taxes").

[election]
id = "wa-2026-11-03"
state = "ocd-division/country:us/state:wa"
title = "Washington General Election, November 3, 2026"

