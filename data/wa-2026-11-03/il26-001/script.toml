# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; how the list of parents' rights came to be; one change
# parents would see (the records deadline) and one thing the list would
# lose (the 2025 entries), so the neutral sections state both what the
# measure adds and what it removes (rule 6.4); what the Office of
# Financial Management says it costs the state; one point per side; what
# a vote does.
#
# The full designation is said once, in the opening line; after that the
# script says "the measure", which reads faster aloud. Cut for time: the
# line that the Legislature changed the list in 2025 (the timeline still
# shows it, and the change line names the 2025 entries) and the line on
# school districts' minor, indeterminate costs.
#
# The card quotes the ballot title, as the Attorney General's letter
# repeats it above the explanatory statement: its Statement of Subject and
# Concise Description. Washington's pamphlet prints no "a YES vote means"
# lines, so the card has none, and the two vote lines take their meaning
# from one phrase of the Concise Description, highlighted alike.
#
# The sides' points about crime notification, abuse investigations and
# gender identity belong to them (rule 6.3), and appear only there.

contest = "wa-2026-11-03-il26-001"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-title"
number = "IL26-001"
title = "Initiative Measure No. IL26-001 concerns parental rights relating to their children in public school."
origin = "Initiative to the Legislature"
summary = "This measure would repeal amendments to a statute listing certain rights of parents and guardians of public-school children and re-enact the law as it was originally enacted by Initiative to the Legislature 2081."

[[section]]
id = "what"
heading = "Initiative Measure IL26-001"

[[section.line]]
text = "Initiative Measure IL26-001 is about parents' rights in public schools."
sources = ["ballot-title"]

[section.line.visual]
kind = "page"
source = "ballot-title"
highlight = ["parental rights relating to their children in public school"]

[[section]]
id = "background"
heading = "How the list came about"

[[section.line]]
text = "In 2024, the Legislature passed Initiative 2081, a list of parents' rights at school."
sources = ["explanatory"]

[section.line.visual]
kind = "timeline"
source = "explanatory"
labels = ["2024", "2025"]
items = ["The Legislature passes Initiative 2081's list of parents' rights", "The Legislature changes the list"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Today, schools have up to 45 days to provide a child's records."
sources = ["explanatory"]

[section.line.visual]
kind = "illustration"
name = "school-records"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "The measure would restore the 2024 list, with records due in ten business days."
sources = ["ballot-title", "explanatory"]

[section.line.visual]
kind = "page"
source = "ballot-title"
highlight = ["re-enact the law as it was originally enacted"]

[[section.line]]
text = "The 2025 entries on language access and special education would come off the list."
sources = ["explanatory"]

[[section]]
id = "fiscal"
heading = "What the state's fiscal statement says"

[[section.line]]
text = "The Office of Financial Management sees no cost to the state, and minor, uncertain costs for school districts."
sources = ["fiscal"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say the measure restores parents' rights to school information, and stops schools keeping secrets from families."
sources = ["arguments"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Restores parents' access to records and notices", "Stops schools withholding information from parents"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"

[[section.line]]
text = "Opponents say the measure endangers child abuse victims, and ends immediate parental notice of crimes against students."
sources = ["arguments"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Gives sensitive information to parents accused of abuse", "Ends immediate notice when students are crime victims"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote means the 2025 amendments would be repealed."
sources = ["ballot-title", "explanatory"]

[section.line.visual]
kind = "page"
source = "ballot-title"
highlight = ["repeal amendments"]

[[section.line]]
text = "A no vote means the 2025 amendments would not be repealed."
sources = ["ballot-title", "explanatory"]

[section.line.visual]
kind = "page"
source = "ballot-title"
highlight = ["repeal amendments"]
