# Archived sources for Vermont Proposal 3, 2026-11-03 general election.
# Every id here may be cited by script.toml. `kind` must be one the
# standard allows (docs/STANDARD.md, section 1).
#
# Vermont prints no voter guide, no explanation and no arguments for or
# against a proposal of amendment, so there is no source of kind
# official-argument; both side sections say so, citing the ballot. The
# card quotes the ballot's "OFFICIAL STATE CONSTITUTIONAL AMENDMENT
# BALLOT" panel, as printed on the City of Burlington's sample ballot for
# Chittenden-17 (page 1, left column).
#
# The adopted text is quoted from the ballot and the Senate Journal of
# March 20, 2025 only. The legislature's "As adopted by the Senate,
# Official" PDF (sources/pr3-as-adopted-official.pdf) lays the adopted
# text over a struck-through 2023 draft whose dues clause the enacted
# text does not have, so it is not cited.

[contest]
id = "vt-2026-11-03-proposal-3"
election = "vt-2026-11-03"
division = "ocd-division/country:us/state:vt"
kind = "measure"
title = "Proposal 3: Right to Collectively Bargain"

[[source]]
id = "ballot"
kind = "official-title-summary"
publisher = "City of Burlington, Official Vermont General Election Ballot, November 3, 2026, Burlington, Chittenden-17 (sample ballot), page 1"
credit = "Official Vermont General Election Ballot"
url = "https://burlingtonvt.gov/DocumentCenter/View/12827/Chi-17-Sample?bidId="
file = "sources/burlington-sample-ballot-chittenden-17.pdf"
retrieved = "2026-10-27"

