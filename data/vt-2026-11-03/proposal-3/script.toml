# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; how it reached the ballot (adopted in 2024, and again in
# 2025); that the constitution has no such article today; what the
# new article says, in its own terms; that the ballot gives no cost
# estimate; that neither side has an official argument; what a vote does.
#
# The card quotes the ballot's panel: the article's heading as printed,
# "Article 23. [Right to collectively bargain]", as its title; the ballot
# question's lead-in as its origin; and the article's whole text as its
# summary. The ballot prints no explanation, no "a YES vote means" lines
# and no fiscal statement, so the card has none of them, and the vote
# lines take their two meanings from the card's title and lead-in.
#
# The adopted text is quoted from the ballot and the Senate Journal,
# never from the "As adopted" PDF, whose struck 2023 draft has a dues
# clause the enacted text does not. Both proposals add an "Article 23",
# and no source says how they would be numbered if both pass, so the
# narration says "a new article". The last clause (agreements requiring
# membership as a condition of employment) is said in the article's own
# words. Sec. 1's purpose is not on the ballot and is not used.
#
# Vermont publishes no official arguments for or against a proposal, so
# both sides are filed = false and each says so once, in the same number
# of words.

contest = "vt-2026-11-03-proposal-3"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot"
number = "3"
title = "Article 23. [Right to collectively bargain]"
origin = "To see if the voters will amend the Vermont Constitution by adding Article 23 to read:"
summary = "That employees have a right to organize or join a labor organization for the purpose of collectively bargaining with their employer through an exclusive representative of their choosing for the purpose of negotiating wages, hours, and working conditions and to protect their economic welfare and safety in the workplace. Therefore, no law shall be adopted that interferes with, negates, or diminishes the right of employees to collectively bargain with respect to wages, hours, and other terms and conditions of employment and workplace safety, or that prohibits the application or execution of an agreement between an employer and a labor organization representing the employer’s employees that requires membership in the labor organization as a condition of employment."

