# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; how it reached the ballot (adopted in 2024, and again in 2026);
# that it adds a new article rather than changing one; what the new
# article says, in its own terms; that the ballot gives no cost
# estimate; that neither side has an official argument; what a vote does.
#
# The card quotes the ballot's panel: the article's heading as printed,
# "Article 23. [Equality of rights]", as its title; the ballot question's
# lead-in as its origin; and the article's whole text as its summary. The
# ballot prints no explanation, no "a YES vote means" lines and no fiscal
# statement, so the card has none of them, and the vote lines take their
# two meanings from the card's title and lead-in.
#
# Sec. 1, the Legislature's stated purpose, is not on the ballot and
# argues for the amendment ("would expand upon the principles of equality
# and liberty"), so it is not used: with no official argument on either
# side, it would speak for one side alone. The "today" line says only
# that the article is new, not that the constitution says nothing on
# equality (the purpose itself cites Articles 1 and 7). The listed
# characteristics are said in full, in the article's order and words.
# Both proposals add an "Article 23", and no source says how they would
# be numbered if both pass, so the narration says "a new article".
#
# Vermont publishes no official arguments for or against a proposal, so
# both sides are filed = false and each says so once, in the same number
# of words.

contest = "vt-2026-11-03-proposal-4"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot"
number = "4"
title = "Article 23. [Equality of rights]"
origin = "To see if the voters will amend the Vermont Constitution by adding Article 23 to read:"
summary = "That the people are guaranteed equal protection under the law. The State shall not deny equal treatment under the law on account of a person’s race, ethnicity, sex, religion, disability, sexual orientation, gender identity, gender expression, or national origin. Nothing in this Article shall be interpreted or applied to prevent the adoption or implementation of measures intended to provide equality of treatment and opportunity for members of groups that have historically been subject to discrimination."

