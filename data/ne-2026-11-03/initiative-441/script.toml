# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; how sports wagers are placed today; what Initiative 441 would
# add, and how many platforms each operator could use; that no cost
# estimate exists; two points per side; what a vote does.
#
# The card quotes the Secretary of State's informational pamphlet: the
# ballot question, its "Proposed by Initiative Petition" line, the full
# text's object statement and the explanatory statements for a vote
# "FOR" and "AGAINST". Nebraska prints no fiscal statement. What is new
# in the law is read from the PDF's underscoring (online wagers, the
# two-platform cap), not from the text extract.
#
# Initiative Measure 440, on the same ballot, is not mentioned: neither
# the pamphlet nor 441's text states how the two relate. The 70 percent
# share of wagering tax revenue is the supporters' claim (they say it
# comes from existing gaming law, not this text), said as theirs. No
# person is named.

contest = "ne-2026-11-03-initiative-441"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "pamphlet"
number = "441"
title = "Shall statutes be enacted that: (1) Allow persons located within Nebraska to place sports wagers through an Internet-based platform when offered by an authorized gaming operator conducting games of chance within a licensed racetrack enclosure in Nebraska or the operator’s platform provider; and (2) Regulate such sports wagers?"
origin = "Proposed by Initiative Petition"
summary = "The object of this petition is to enact a statute allowing sports wagers to be placed within the State of Nebraska through Internet-based platforms offered by an authorized gaming operator, or its contracted platform provider, and regulate such sports wagers."
yes = "A vote “FOR” will enact statutes allowing persons located within Nebraska to place sports wagers through an Internet-based platform when offered by an authorized gaming operator conducting games of chance within a licensed racetrack enclosure in Nebraska or the operator’s platform provider, and regulating such sports wagers."
no = "A vote “AGAINST” means no such statutes will be enacted."

