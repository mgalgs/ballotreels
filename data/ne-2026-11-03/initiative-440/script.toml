# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; what the Constitution allows
# today; what Initiative 440 would allow; that no cost estimate exists;
# two points per side; what a vote does.
#
# The card quotes the Secretary of State's informational pamphlet: the
# ballot question, its "Proposed by Initiative Petition" line, the full
# text's object statement and the explanatory statements for a vote
# "FOR" and "AGAINST". Nebraska prints no fiscal statement.
#
# The amendment authorizes laws; it does not itself set rules for
# wagering, and the script says so in the ballot's words. Initiative
# Measure 441, on the same ballot, is not mentioned: neither the
# pamphlet nor 440's text states how the two relate.
#
# Each side gets two points from its argument, in its own words. The
# "$166 million" is the supporters' projection, said as theirs; no
# official source states a ten-year total to scale it against
# (STANDARD.md rule 6.5), so it has none. No person is named.

contest = "ne-2026-11-03-initiative-440"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "pamphlet"
number = "440"
title = "Shall the Nebraska Constitution be amended to authorize the enactment of laws allowing persons located within Nebraska to place sports wagers through an Internet-based platform when offered by an authorized gaming operator conducting games of chance within a licensed racetrack enclosure in Nebraska?"
origin = "Proposed by Initiative Petition"
summary = "The object of this petition is to amend the Nebraska Constitution to state that laws may be enacted allowing sports wagers to be placed within the State of Nebraska through an Internet-based platform offered by an authorized gaming operator."
yes = "A vote “FOR” will amend the Nebraska Constitution to authorize the enactment of laws to allow persons located within Nebraska to place sports wagers through an Internet-based platform when offered by an authorized gaming operator conducting games of chance within a licensed racetrack enclosure in Nebraska."
no = "A vote “AGAINST” means the Nebraska Constitution will not be amended in this manner."

