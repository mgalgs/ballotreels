# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; that the section is new; what schools would have to do, and
# which teams it would cover; that no cost estimate exists; two points
# per side; what a vote does.
#
# The card quotes the Secretary of State's informational pamphlet. Its
# ballot question is split where the pamphlet prints it: the question,
# ending at its question mark, is the title, and the sentence after it
# ("The amendment would apply to ...") the summary. The object statement
# in the full text is not quoted: its wording ("constitutional
# protections", "equal access") is the supporters' framing, which their
# argument repeats. The FOR/AGAINST statements are the vote boxes.
#
# Every neutral line keeps to the ballot's and the text's own terms
# ("biological sex", "students of the male sex", "coed or mixed").
# Each side gets two points from its argument, in its own words and
# terms. No person is named, and nothing outside the archived sources is
# mentioned.

contest = "ne-2026-11-03-initiative-442"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "pamphlet"
number = "442"
title = "Shall the Nebraska Constitution be amended to provide: (1) Schools must expressly designate each athletic team or sport as one of the following based on biological sex: (a) Males, men, or boys; (b) females, women, or girls; or (c) coed or mixed; and (2) Athletic teams or sports designated for females, women, or girls shall not be open to students of the male sex?"
origin = "Proposed by Initiative Petition"
summary = "The amendment would apply to all athletic teams or sports sponsored by public schools or postsecondary educational institutions, and private schools or educational institutions whose athletic teams or sports compete against public schools or institutions."
yes = "A vote “FOR” will amend the Nebraska Constitution to provide: (1) Schools must expressly designate each athletic team or sport as one of the following based on biological sex: (a) Males, men, or boys; (b) females, women, or girls; or (c) coed or mixed; and (2) Athletic teams or sports designated for females, women, or girls shall not be open to students of the male sex. The amendment would apply to all athletic teams or sports sponsored by public schools or postsecondary educational institutions, and private schools or educational institutions whose athletic teams or sports compete against public schools or institutions."
no = "A vote “AGAINST” means the Nebraska Constitution will not be amended in this manner."

