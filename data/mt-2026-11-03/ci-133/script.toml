# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; the powers the constitution reserves to the people today;
# what the amendment would secure and require, in three of the ballot
# statement's terms; that the pamphlet prints no cost estimate; one point
# per side; what a vote does.
#
# The card quotes the Voter Information Pamphlet's ballot language: its
# heading, its origin line, the ballot statement (verbatim, with the
# pamphlet's own "fi" ligatures, as pdftotext extracts them) and the
# ballot's YES/NO lines. No fiscal statement exists, so the card has no
# fiscal quote and the fiscal section says only that the pamphlet prints
# no cost estimate, as Arizona's and Ohio's measures do. The opponents'
# "$1 million" is what they say signature drives cost, not a
# government's money; it is not used.
#
# Neutral lines keep to the ballot statement's terms; neither side's
# framing ("government interference", "trojan horse", "special
# interests") is used outside its own section. The ballot statement's
# "interference by the government" states the amendment's purpose and
# is the supporters' theme, so the narration does not use it; the
# "change" line says what the complete text does instead (a fundamental
# right the government may not burden without a compelling interest),
# and puts the 90-day deadline on the government. Each side gets its two
# most concrete points, in its own words, with equal words. No person
# the arguments name is named.

contest = "mt-2026-11-03-ci-133"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "pamphlet"
number = "CI-133"
title = "CONSTITUTIONAL INITIATIVE NO. 133"
origin = "A CONSTITUTIONAL AMENDMENT PROPOSED BY INITIATIVE PETITION"
summary = "The Montana constitution reserves to the people the powers of initiative and referendum. CI-133 amends the constitution to secure this fundamental right from interference by the government. Speciﬁcally, CI-133 requires impartial, predictable, open, and timely processes for ballot issues. Petitions and ballot statements must be approved within 90 days of the initial submission, and legal challenges to ballot qualiﬁcation must be resolved before the deadline for ﬁnalizing ballots. CI-133 requires the state to allow ample time for signature gathering, prohibits disqualiﬁcation of petitions because of minor or technical issues, allows voters to withdraw their signatures if they so choose, and prohibits the use of government resources to support or oppose a ballot measure."
yes = "YES on Constitutional Amendment CI-133"
no = "NO on Constitutional Amendment CI-133"

