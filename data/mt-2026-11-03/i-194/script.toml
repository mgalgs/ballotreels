# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about, and what the ballot statement counts as an artificial
# person; the legal privileges Montana law gives them today; what the
# initiative would exclude from their powers, the penalty, and what it
# exempts; that the pamphlet prints no cost estimate; one point per side;
# what a vote does.
#
# The card quotes the Voter Information Pamphlet's ballot language: its
# heading, its origin line, the ballot statement (verbatim, with the
# pamphlet's own "fi" ligatures, as pdftotext extracts them) and the
# ballot's YES/NO lines. No fiscal statement exists, so the card has no
# fiscal quote and the fiscal section says only that the pamphlet prints
# no cost estimate, as Arizona's and Ohio's measures do.
#
# "Today" says only what the complete text states the state confers on
# an artificial person (limited liability among its charter
# privileges). It does not say what Montana's campaign laws allow these
# groups today: no archived official source states it, and the text's
# findings on it are the initiative's own. No dollar figure is used:
# the supporters' state budget comparison and campaign spending figures
# stay out, as do the court cases the opponents cite. Each side gets its
# two most concrete points, in its own words, with equal words.
# No person the arguments name is named.

contest = "mt-2026-11-03-i-194"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "pamphlet"
number = "I-194"
title = "INITIATIVE NO. 194"
origin = "A LAW PROPOSED BY INITIATIVE PETITION"
summary = "I-194, if passed, limits the powers of artiﬁcial persons to those powers necessary or convenient as provided by law. These powers must exclude contributing anything of value to candidate elections, supporting or opposing political parties, or supporting or opposing state or local ballot issues. Artiﬁcial persons include non-proﬁts, trusts, partnerships, corporations, trade associations, or unincorporated associations and includes all such entities doing business in Montana. Any violation of I-194 is punished by forfeiting all privileges to do business in Montana. Those privileges may be, but are not automatically, restored upon disgorgement and certiﬁcation of compliance with I-194. I-194 does not apply to the distribution of news, commentary, or editorial content. I-194 also does not apply to the state of Montana, political subdivisions, individuals, political committees, or public corporations."
yes = "YES on Initiative I-194"
no = "NO on Initiative I-194"

