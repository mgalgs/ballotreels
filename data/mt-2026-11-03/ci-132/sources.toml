# Archived sources for Montana Constitutional Initiative No. 132 (CI-132),
# 2026-11-03 general election. Every id here may be cited by script.toml.
# `kind` must be one the standard allows (docs/STANDARD.md, section 1).
#
# Montana's Secretary of State prints a ballot issue's ballot language,
# complete text, arguments for and against and both rebuttals in one
# section of the Voter Information Pamphlet, so several sources below
# share one archived file: that section's pages, cut from the full
# pamphlet. The ballot language and complete text are also archived as
# the Secretary of State publishes them. No fiscal statement exists: the
# pamphlet prints none and the ballot language carries none.

[contest]
id = "mt-2026-11-03-ci-132"
election = "mt-2026-11-03"
division = "ocd-division/country:us/state:mt"
kind = "measure"
title = "Constitutional Amendment CI-132: Nonpartisan Judicial Elections"

