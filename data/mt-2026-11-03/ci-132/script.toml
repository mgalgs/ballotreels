# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; how it reached the ballot; that the constitution has no such
# section today; the one sentence it would add; that the pamphlet prints
# no cost estimate; one point per side; what a vote does.
#
# The card quotes the Voter Information Pamphlet's ballot language: its
# heading, its origin line, the ballot statement and the ballot's
# YES/NO lines. No fiscal statement exists, so the card has no fiscal
# quote and the fiscal section says only that the pamphlet prints no
# cost estimate, as Arizona's and Ohio's measures do.
#
# The amendment is one sentence of law. No archived official source
# states how Montana's judicial elections work today, so "today" says
# only that the amendment's sentence is not in the constitution (the
# text adds it as a new section); that the amendment "makes the current
# system permanent" is the opponents' claim and stays in their section.
# Each side gets its two most concrete points, in its own words, with
# equal words: a principle and a money figure each (neither figure is a
# government's money, so neither takes a budget scale). No person the
# arguments name is named.

contest = "mt-2026-11-03-ci-132"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "pamphlet"
number = "CI-132"
title = "CONSTITUTIONAL INITIATIVE NO. 132"
origin = "A CONSTITUTIONAL AMENDMENT PROPOSED BY INITIATIVE PETITION"
summary = "CI-132 amends the Montana Constitution to require that judicial elections remain nonpartisan."
yes = "YES on Constitutional Amendment CI-132"
no = "NO on Constitutional Amendment CI-132"

