# Archived sources for Colorado Proposition 135, 2026-11-03 general
# election. Every id here may be cited by script.toml. `kind` must be one
# the standard allows (docs/STANDARD.md, section 1).
#
# Colorado's Legislative Council Staff prints each measure's Quick Ballot
# Reference Guide entry, its analysis (with the arguments for and
# against, which Legislative Council Staff writes, and the fiscal
# impact), and its ballot title and text in the 2026 Colorado State
# Ballot Information Booklet, so several sources below share one
# archived file: that measure's pages, cut from the full booklet. The
# full fiscal impact statement the booklet condenses is archived beside
# it, and the initiative's final text as filed with the Secretary of
# State.

[contest]
id = "co-2026-11-03-proposition-135"
election = "co-2026-11-03"
division = "ocd-division/country:us/state:co"
kind = "measure"
title = "Proposition 135: Prohibit Surgery on Minors in Response to Perception of Sex or Gender"

[[source]]
id = "blue-book"
kind = "official-title-summary"
publisher = "Colorado Legislative Council Staff, 2026 Colorado State Ballot Information Booklet, Proposition 135: Quick Ballot Reference Guide, analysis and ballot title, pages 13, 59 to 61 and 94 to 95"
credit = "Colorado State Ballot Information Booklet, Proposition 135"
url = "https://content.leg.colorado.gov/sites/default/files/2026-blue-book-en-accessible.pdf"
file = "sources/guide-section.pdf"
retrieved = "2026-10-27"

