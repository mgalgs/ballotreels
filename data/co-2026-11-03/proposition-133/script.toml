# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; the penalty today; the penalty and the added act under the
# proposition; when Legislative Council Staff says its costs begin and
# how they grow; one point per side; what a vote does.
#
# The card quotes the State Ballot Information Booklet: the ballot title
# as printed in its Text & Titles section, its origin and vote-needed
# line, the first sentence of its "How does Proposition 133 change the
# crime of child sex trafficking?" as the summary and its YES/NO lines.
#
# The narration says "trading anything of value for" where the booklet
# says "to buy or sell" (a listener hears "buy" as "by"). That judges
# could no longer weigh the facts of a case is the opponents' point and
# stays in their section. The costs begin in budget year 2041-42, which
# the booklet ("about 14 years") and the fiscal statement ("about 15
# years") both print, so the line names the year; no official total exists
# for that year to scale them by. The booklet prints one argument for
# and one against; each side's list takes two points from its one
# argument.

contest = "co-2026-11-03-proposition-133"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "blue-book"
number = "133"
title = "Shall there be a change to the Colorado Revised Statutes modifying existing law concerning human trafficking of a minor for sexual servitude, and, in connection therewith, creating new law expanding human trafficking of a minor for sexual servitude to include knowingly trading anything of monetary value to buy or sell sexual activity with a minor and increasing the penalty to be life in prison without parole or release?"
origin = "Placed on the ballot by citizen initiative • Passes with a majority vote"
summary = "Proposition 133 increases the penalty for child sex trafficking to life in prison without the possibility of parole, and removes judicial discretion in sentencing."
yes = "A “yes” vote on Proposition 133 increases the penalties for child sex trafficking to life in prison without parole, and expands child sex trafficking to include buying sexual activity with a minor."
no = "A “no” vote on Proposition 133 keeps the existing felony criminal penalties for child sex trafficking with a sentencing range of 8 to 48 years in prison plus a mandatory parole period."

