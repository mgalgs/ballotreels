# Archived sources for Colorado Proposition NN, 2026-11-03 general
# election. Every id here may be cited by script.toml. `kind` must be one
# the standard allows (docs/STANDARD.md, section 1).
#
# Colorado's Legislative Council Staff prints each measure's Quick Ballot
# Reference Guide entry, its analysis (with the arguments for and
# against, which Legislative Council Staff writes, and the fiscal
# impact), and its ballot title and text in the 2026 Colorado State
# Ballot Information Booklet, so several sources below share one
# archived file: that measure's pages, cut from the full booklet. The
# full fiscal impact statement the booklet condenses is archived beside
# it. The legislature referred the measure as Senate Bill 26-135; the
# act as passed and its final fiscal note are archived too.

[contest]
id = "co-2026-11-03-proposition-nn"
election = "co-2026-11-03"
division = "ocd-division/country:us/state:co"
kind = "measure"
title = "Proposition NN: Keep and Spend Money for Education and Other Purposes"

[[source]]
id = "blue-book"
kind = "official-title-summary"
publisher = "Colorado Legislative Council Staff, 2026 Colorado State Ballot Information Booklet, Proposition NN: Quick Ballot Reference Guide, analysis and ballot title, pages 11, 41 to 47 and 84 to 88"
credit = "Colorado State Ballot Information Booklet, Proposition NN"
url = "https://content.leg.colorado.gov/sites/default/files/2026-blue-book-en-accessible.pdf"
file = "sources/guide-section.pdf"
retrieved = "2026-10-27"

[[source]]
id = "fiscal-impact"
kind = "official-fiscal-analysis"
publisher = "Colorado Legislative Council Staff, Fiscal Impact of Proposition NN, in the 2026 Colorado State Ballot Information Booklet, pages 46 to 47"
credit = "Legislative Council Staff, State Ballot Information Booklet"
url = "https://content.leg.colorado.gov/sites/default/files/2026-blue-book-en-accessible.pdf"
file = "sources/guide-section.pdf"
retrieved = "2026-10-27"

[[source]]
