[section.line.visual]
kind = "list"
source = "arguments"
items = ["Unnecessary: current law provides ample guidance", "Could block laws giving voters critical information"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote requires plain-language titles, defined as an eighth-grade reading level."
sources = ["blue-book"]

[section.line.visual]
kind = "page"
source = "blue-book"
