# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; how penalties work today; the three changes the proposition
# would make; what Legislative Council Staff says it costs; one point per
# side; what a vote does.
#
# The card quotes the State Ballot Information Booklet: the ballot title
# as printed in its Text & Titles section, its origin and vote-needed
# line, the first paragraph of its "How will penalties change under
# Proposition 132?" as the summary and its YES/NO lines.
#
# That fentanyl is the leading cause of overdose deaths sits close to
# both sides' points on overdose deaths, so it is left out of the
# neutral lines. The booklet prints one argument for and one against;
# each side's list takes two points from its one argument. The General
# Fund costs are stated without a scale: no archived source gives the
# General Fund's total.

contest = "co-2026-11-03-proposition-132"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "blue-book"
number = "132"
title = "Shall there be a change to the Colorado Revised Statutes concerning criminal penalties for fentanyl and certain synthetic opioids, and, in connection therewith, increasing the felony classifications of drug-related crimes for distribution, manufacturing, dispensing, sale, or possession of fentanyl and certain synthetic opioids; creating mandated treatment for certain drug felony violations based on possession amount; and changing sentencing provisions to narrow or eliminate exemptions for crimes related to fentanyl and certain synthetic opioids and drug-related deaths?"
origin = "Placed on the ballot by citizen initiative • Passes with a majority vote"
summary = "Proposition 132 increases criminal penalties for fentanyl offenses by expanding felony charges for possession and distribution, imposing longer prison sentences, and limiting judicial discretion."
yes = "A “yes” vote on Proposition 132 makes possession of any amount of fentanyl a felony, requires a mandatory minimum 8-year prison sentence for any quantity of fentanyl distribution, and eliminates options to reduce penalties for certain possession and distribution offenses."
no = "A “no” vote on Proposition 132 keeps minor possession charges of fentanyl a misdemeanor, maintains tiered felony penalties for fentanyl distribution based on drug quantity, and keeps options to reduce penalties for certain possession and distribution offenses."

