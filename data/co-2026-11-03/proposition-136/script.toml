# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; the rate today; what the proposition would set, and that the
# rate itself would not change; what happens if Amendment 87 also
# passes; what Legislative Council Staff says it costs; one point per
# side; what a vote does.
#
# The card quotes the State Ballot Information Booklet: the ballot title
# as printed in its Text & Titles section, its origin and vote-needed
# line, its answer to "What does Proposition 136 do?" as the summary and
# its YES/NO lines.
#
# The conflict with Amendment 87 is stated once, in the booklet's words
# ("the exact outcome is unclear"; "the state legislature or a court
# will determine how to resolve any conflicts"). That the constitution
# already requires voters to approve a tax rate increase is a fact the
# opponents' argument rests on, so it stays in their section (rule 6.3).
# The booklet prints one argument for and one against; each side's list
# takes two points from its one argument.

contest = "co-2026-11-03-proposition-136"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "blue-book"
number = "136"
title = "Shall there be a change to the Colorado Revised Statutes capping the state income tax rate at 4.4% of federal taxable income for individuals and corporations?"
origin = "Placed on the ballot by citizen initiative • Passes with a majority vote"
summary = "The measure limits the state income tax rate for individuals and corporations to the current rate of 4.4 percent of taxable income beginning on January 1, 2027."
yes = "A “yes” vote on Proposition 136 establishes the current state income tax rate of 4.4 percent as the maximum rate."
no = "A “no” vote on Proposition 136 keeps the current state income tax rate of 4.4 percent without establishing a new limit in statute."

