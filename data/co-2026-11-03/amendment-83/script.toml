# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; who regulates hunting and fishing today; the right and the
# policy the amendment would add, and the regulation it keeps; what
# Legislative Council Staff says it changes and costs; one point per
# side; what a vote does.
#
# The card quotes the State Ballot Information Booklet: the ballot title
# as printed in its Text & Titles section, its origin and vote-needed
# line, its answer to "What does Amendment 83 do?" as the summary and its
# YES/NO lines.
#
# The booklet prints one argument for and one against; each side's list
# takes two points from its one argument. The supporters' $115 million
# of license revenue stays out: their line keeps their point without it.

contest = "co-2026-11-03-amendment-83"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "blue-book"
number = "83"
title = "Shall there be an amendment to the Colorado Constitution creating a constitutional right to hunt, fish, and harvest fish and wildlife by traditional methods, including all species of fish and wildlife managed by the state except non-game species, endangered species, or any species that is illegal to hunt under federal law, and, in connection therewith, establishing hunting and fishing as the preferred means of managing fish and wildlife populations; and preserving the right of the state to regulate hunting, fishing, and wildlife management if necessary for sound scientific wildlife conservation and management, public safety, or to preserve the future of hunting and fishing opportunities for all species?"
origin = "Placed on the ballot by citizen initiative • Passes with 55 percent of the vote"
summary = "Amendment 83 establishes a right in the Colorado Constitution to fish and hunt certain wildlife, and establishes hunting and fishing as the preferred means of managing fish and wildlife populations."
yes = "A “yes” vote on Amendment 83 establishes a state constitutional right to hunt and fish."
no = "A “no” vote on Amendment 83 means that hunting and fishing will continue as allowed under existing state and federal law."

