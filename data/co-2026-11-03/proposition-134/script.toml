[[section.line]]
text = "Supporters say females should be able to compete against other females, and the proposition protects the safety of female athletes."
sources = ["arguments"]
basis = ["Females should be able to compete against other females.", "Allowing biological males to participate on female teams or in female sports jeopardizes the safety and physical and emotional boundaries of female athletes.", "The measure creates a reasonable policy grounded in biological sex that promotes the safety of all participants."]

