# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; who sets the policy today; who would play on which teams
# (the vote line gives the designations), and what the booklet says is unclear; what
# Legislative Council Staff says it costs; one point per side; what a
# vote does.
#
# The card quotes the State Ballot Information Booklet: the ballot title
# as printed in its Text & Titles section, its origin and vote-needed
# line, its answer to "What does the measure do?" as the summary (its
# list of the three designations cannot be quoted whole: the bullets
# print as a letter in the PDF's text, so the summary is its next
# sentences) and its YES/NO lines.
#
# Neutral lines use the booklet's own terms: "biological sex",
# "biological males", "biological females", "coeducational" and "gender
# identity". Each side's points use its own section's words. Federal
# developments the booklet reports (an executive order, a court ruling,
# a lawsuit and settlement) are left out for length; none is named in
# either side's argument.

contest = "co-2026-11-03-proposition-134"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "blue-book"
number = "134"
title = "Shall there be a change to the Colorado Revised Statutes creating new law restricting participation in all K-12 and collegiate school sports based on the participant’s sex as determined by certain aspects of their biological reproductive system, and, in connection therewith, requiring a school, institution of higher education, or athletic association to designate each school or intramural athletic team or sport as male, female, or coeducational; only allowing participants to compete on the team or sport of their designated sex or to compete on a coeducational team; creating an exception to allow a female to participate on a male-designated team or sport if there is no female team available; prohibiting a government entity, licensing or accrediting organization, or athletic association from entertaining a complaint, opening an investigation, or taking other adverse action against a school for maintaining separate teams or sports for females; and providing the commissioner of education with the authority to enforce the proposed initiative for K-12 school districts?"
origin = "Placed on the ballot by citizen initiative • Passes with a majority vote"
summary = "Under the measure, students must compete on teams that match their biological sex or on a coeducational team. Biological females are allowed to participate on a team or sport designated for biological males if there is no equivalent female team offered for that sport. Participation on a coeducational or mixed team or sport is open to all."
yes = "A “yes” vote on Proposition 134 means that all school-based athletic teams and sports must be designated as being for biological males or biological females only, or as mixed, and requires schools and school districts to adopt policies on sex eligibility for sports."
no = "A “no” vote on Proposition 134 means that individual schools, school districts, and athletic associations may continue to set their own policies in alignment with current state and federal law about who is eligible to participate on a team or in a sport."

[[section]]
id = "what"
heading = "Proposition 134"

[[section.line]]
text = "Proposition 134 is about who may play on school sports teams."
sources = ["blue-book"]

[section.line.visual]
kind = "page"
source = "blue-book"
highlight = ["restricting participation in all K-12 and collegiate school sports"]

[[section]]
