# Archived sources for Maryland Question 3, 2026-11-03 general election.
# Every id here may be cited by script.toml. `kind` must be one the
# standard allows (docs/STANDARD.md, section 1).
#
# Maryland mails no voter pamphlet. The State Board of Elections' page
# "Ballot Questions for the November 3, 2026 Election" (Election Law
# 7-103(e)) prints each question's title and ballot text; for Question 3
# it prints the text the Supreme Court of Maryland's per curiam order of
# September 3, 2026 directed it to use (the purpose paragraph of Chapter
# 881), and no "A vote FOR / AGAINST" lines. The act's own ballot wording
# is not on the ballot. The same page lists county charter and bond
# questions, whose lines are not Question 3's. dls-summary-section.pdf is
# page 1 (the covering letter) and page 6 (Question 3's summary, a
# scanned image with no text layer) of the Department of Legislative
# Services' summaries (Election Law 7-105(b)); amendment-text-section.pdf
# is Question 3's page of the Board's "Text of Proposed Constitutional
# Amendment". Chapter 881 is an act of the August 2026 special session,
# though the General Assembly's site files it under the 2026 regular
# session. There is no ballot fiscal statement: the Department's Fiscal
# and Policy Note on the bill is the official one. Maryland publishes no
# official arguments for or against an amendment, so there is no source
# of kind official-argument: both side sections say so, citing the
# Board's page, which prints none.

[contest]
id = "md-2026-11-03-question-3"
election = "md-2026-11-03"
division = "ocd-division/country:us/state:md"
kind = "measure"
title = "Question 3: Electoral Districts – General Assembly and Congressional Representatives"

