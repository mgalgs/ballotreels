# Recipe E, 60 seconds, distilled: one claim per line. The chain: what
# the register of probate is; how the amendment got on the ballot and the
# vote it needs; what the constitution says today and where the office's
# duties went; what the amendment would change; that no cost estimate
# exists; the two sides; what a vote does.
#
# New Hampshire has no voter guide. The card quotes the Secretary of
# State's "Questions on the General Election Ballot 2026": the heading the
# sheet prints over the question as its title, the sheet's own heading
# ("2026 General Election") as its origin, under the badge QUESTION 1, and
# the question, in its quotation marks, as its summary: the words the
# ballot prints, including the full new text of articles 71 and 81. The
# sheet prints no short title, so contests.toml pairs "Question 1" with
# CACR 13's own words ("the office of register of probate ... be
# eliminated"). It prints no "a yes vote means" lines, so the card has
# none, and the vote lines take their meanings from the question's words.
#
# The explanation is CACR 13's Voters' Guide (section VIII), told nearly
# word for word; the two-thirds vote is CACR 13's section VII. The House
# and Senate tallies the sheet prints are left out, as Wisconsin's are.
#
# Fiscal: no fiscal note exists for a constitutional amendment concurrent
# resolution and the sheet prints no cost; no dollar figure appears, so
# none needs a scale.
#
# New Hampshire publishes no official arguments for or against a ballot
# question, so both sides are filed = false and each says so once, in the
# same number of words.

contest = "nh-2026-11-03-question-1"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "questions"
number = "1"
title = "Questions Relating to Constitutional Amendments proposed by the 2026 General Court"
origin = "2026 General Election"
summary = "“Are you in favor of eliminating the office of register of probate by amending articles 71 and 81 of the second part of the constitution to read as follows: [Art.] 71. [County Treasurers, County Attorneys, Sheriffs, and Registers of Deeds Elected.] The county treasurers, county attorneys, sheriffs and registers of deeds, shall be elected by the inhabitants of the several towns, in the several counties in the State, according to the method now practiced, and the laws of the state, provided nevertheless the legislature shall have authority to alter the manner of certifying the votes, and the mode of electing those officers; but not so as to deprive the people of the right they now have of electing them. [Art.] 81. [Judges Not to Act as Counsel.] No judge shall be of counsel, act as advocate, or receive any fees as advocate or counsel, in any probate business which is pending, or may be brought into any court of probate in the county of which he or she is judge.”"

