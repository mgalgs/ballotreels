# Archived sources for Hawaii Question 1, 2026-11-03 general election.
# Every id here may be cited by script.toml. `kind` must be one the
# standard allows (docs/STANDARD.md, section 1).
#
# The Office of Elections' 2026 Voter Guide prints each proposed
# amendment on one page of statements provided by the Department of the
# Attorney General: the title, the ballot question, an explanation, the
# meaning of a "yes", a "no" and a blank vote, and the ratification rule.
# guide-section.pdf is Question 1's page (page 73) cut from the full
# guide. Hawaii publishes no official arguments for or against a
# proposed amendment, and no fiscal statement on one, so there is no
# source of kind official-argument or official-fiscal-analysis.
#
# The amendment is S.B. No. 121 (2025). legislature-notice-section.pdf
# is its full text as adopted, pages 1 and 2 of the Legislature's Notice
# of Proposed Constitutional Amendments. The Legislature's files were
# fetched from the same paths on data.capitol.hawaii.gov, because
# www.capitol.hawaii.gov blocked scripted fetches; the urls are the
# canonical ones.

[contest]
id = "hi-2026-11-03-question-1"
election = "hi-2026-11-03"
division = "ocd-division/country:us/state:hi"
kind = "measure"
title = "Question 1: Increasing the Timeframe for the Hawaii Senate to Consider and Act on Judicial Appointments"

