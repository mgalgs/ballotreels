# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; how long the Senate has today, and why that can mean a
# special session; what Question 1 would change; that the guide gives no
# cost estimate; the two sides; what a vote does, and what it takes to
# pass.
#
# The card quotes the 2026 Voter Guide's page for Question 1, statements
# the Department of the Attorney General provided: the title line as the
# origin, the ballot question as the title, the explanation as the
# summary, and its MEANING OF "YES" VOTE / "NO" VOTE sentences. No fiscal
# statement exists, so the card has no fiscal quote.
#
# Hawaii publishes no official arguments for or against a proposed
# amendment, so both sides are filed = false and each says so once, in
# the same number of words. The bill's findings (including its $5,000
# cost of a special session) are the Legislature's own purpose, not an
# argument, and are not on the yes side; the figure is left out, since
# no archived source gives the budget that would scale it (rule 6.5).
#
# The narration says "approve" for the guide's "consent" (the transcript
# check mishears "consents"). Hawaii's ratification rule is unusual, so
# the vote section states it once, in the guide's terms.

contest = "hi-2026-11-03-question-1"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide"
number = "1"
title = "Shall the Constitution of the State of Hawaii be amended to allow the Senate more time to consider and act on the appointments of justices and judges, by increasing the timeframe from thirty days to sixty days for appointments made between April 1 and December 31 when the senate is not in regular session or is about to adjourn the regular session?"
origin = "QUESTION #1: Increasing the Timeframe for the Hawaii Senate to Consider and Act on Judicial Appointments."
summary = "The proposed amendment would amend article VI, section 3, of the Hawaii State Constitution to extend from thirty days to sixty days the timeframe for Senate consideration of a judicial appointment if the appointment is made between April 1 and December 31, which is typically when the Legislature is nearing adjournment of a regular session or is not in regular session. The Senate confirmation process for justices and judges of the Hawaii Supreme Court, Intermediate Court of appeals, and Circuit Courts, currently provides that the Governor shall make an appointment within thirty days of receiving a list of nominees from the Judicial Selection Commission. The Senate is then required to consent to or reject the Governor’s appointment within thirty days or be deemed to have consented to the appointment. Because the Hawaii State Legislature is a part-time legislature and only meets in regular session part of the year, the Senate may need to convene in a special session for the sole purpose of acting on a judicial appointment. The purpose of the amendment is to allow greater flexibility in scheduling special sessions and thus limit the number of special sessions that may be needed to consider judicial appointments."
yes = "A “yes” vote would extend from thirty days to sixty days the time allowed for the Senate to consider judicial appointments made between April 1 and December 31."
no = "A “no” vote would make no change to the Hawaii State Constitution and leave in place the requirement that the Senate consider a judicial appointment within thirty days or be deemed to have consented to the appointment."

