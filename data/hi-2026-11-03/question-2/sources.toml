# Archived sources for Hawaii Question 2, 2026-11-03 general election.
# Every id here may be cited by script.toml. `kind` must be one the
# standard allows (docs/STANDARD.md, section 1).
#
# The Office of Elections' 2026 Voter Guide prints each proposed
# amendment on one page of statements provided by the Department of the
# Attorney General: the title, the ballot question, an explanation, the
# meaning of a "yes", a "no" and a blank vote, and the ratification rule.
# guide-section.pdf is Question 2's page (page 74) cut from the full
# guide. Hawaii publishes no official arguments for or against a
# proposed amendment, and no fiscal statement on one, so there is no
# source of kind official-argument or official-fiscal-analysis.
#
# The amendment is S.B. No. 3219, H.D. 3, C.D. 1 (2026).
# legislature-notice-section.pdf is its full text as adopted, pages 3 to
# 8 of the Legislature's Notice of Proposed Constitutional Amendments.
# The Legislature's files were fetched from the same paths on
# data.capitol.hawaii.gov, because www.capitol.hawaii.gov blocked
# scripted fetches; the urls are the canonical ones.

[contest]
id = "hi-2026-11-03-question-2"
election = "hi-2026-11-03"
division = "ocd-division/country:us/state:hi"
kind = "measure"
title = "Question 2: Directing the Hawaii State Legislature to Establish Procedures for Counties to Issue RISE Bonds, Exempt from County Debt Limits"

