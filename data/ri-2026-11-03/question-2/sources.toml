# Archived sources for Rhode Island Question 2, 2026-11-03 general election.
# Every id here may be cited by script.toml. `kind` must be one the
# standard allows (docs/STANDARD.md, section 1).
#
# guide-section.pdf is cut from the Secretary of State's Voter
# Information Handbook: page 8 (the cost table for all five bond
# questions and the shared ballot proposition) and pages 11, Question
# 2's own (its ballot label, what a vote to approve or reject means,
# its explanation and purpose, its timetable, useful life and "Total
# cost:" table). One file backs two sources: the ballot label and its
# explanation (official-title-summary), and the handbook's cost
# estimate (official-fiscal-analysis), the only fiscal statement the
# handbook prints.
#
# Rhode Island publishes no official arguments for or against its bond
# questions, so there is no source of kind official-argument: both side
# sections say so, citing the handbook, which prints none.
#
# The Senate Fiscal Office's article summaries of the FY 2027 budget are
# deliberately not archived or cited: their Article 5 text was carried
# over from the Governor's proposal and does not match the act as
# passed.

[contest]
id = "ri-2026-11-03-question-2"
election = "ri-2026-11-03"
division = "ocd-division/country:us/state:ri"
kind = "measure"
title = "Question 2: Housing and Homeownership"

[[source]]
id = "handbook"
kind = "official-title-summary"
publisher = "Rhode Island Secretary of State, Voter Information Handbook: A Guide to State Referenda and Voting Procedures in Rhode Island, General Election November 3, 2026, pages 8 and 11"
credit = "Rhode Island Voter Information Handbook 2026"
url = "https://vote.sos.ri.gov/Forms/Elections/Guides/VoterRef26.pdf"
file = "sources/guide-section.pdf"
retrieved = "2026-10-27"

