# Recipe E, 60 seconds, distilled: one claim per line. The chain: what
# the question would borrow, and for what; what a bond is and who repays
# it; how the five bond questions are decided; the bond's uses, and the two amounts the label sets aside; the
# handbook's cost estimate, with its caveat; the sides; what a vote does.
#
# The card quotes the Secretary of State's Voter Information Handbook:
# the ballot label's title, the ballot label's whole description paragraph; the act it was passed in
# (page 8's "Chapter 084 Public Laws 2026"), the total under the
# question's "Total cost:" table, and the handbook's own "Your vote to
# “Approve” means" and "Your vote to “Reject” means" lines.
#
# Rhode Island publishes no official arguments for or against its bond
# questions, so both sides are filed = false and each says so once, in
# the same number of words. The handbook's "Explanation and purpose" is
# the state's description of the projects, not an argument for them; the
# change section uses only its amounts and what each would pay for.
#
# Scale (STANDARD.md rule 6.5): the handbook compares the borrowing
# with no budget, so the scale would be the state's general revenue
# budget for FY 2027. No archived source states that total, so the
# $120 million and its cost are stated without a scale until one is
# archived. The House Fiscal Advisory Staff's debt ratios are a
# different comparison and are not used. Annual debt service is left
# out: the handbook gives none, nor is a timetable or useful life said.
# No person the handbook names is named.

contest = "ri-2026-11-03-question-2"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "handbook"
number = "2"
title = "2. HOUSING AND HOMEOWNERSHIP - $120,000,000"
origin = "Chapter 084 Public Laws 2026"
summary = "To increase and preserve the availability of affordable and accessible housing to meet the needs of all Rhode Islanders and support community revitalization through the redevelopment of existing structures, new construction, property acquisition, and infrastructure improvements. Of this amount, at least twenty-five million dollars ($25,000,000) shall be allocated towards increasing production of housing intended for homeownership and up to ten million dollars ($10,000,000) may be used to support a program for public housing development."
fiscal = "$192,586,000"
yes = "Your vote to “Approve” means that you support the State issuing $120,000,000 in general obligation bonds to increase housing and homeownership."
no = "Your vote to “Reject” means that you are against the State issuing $120,000,000 in general obligation bonds to increase housing and homeownership."

