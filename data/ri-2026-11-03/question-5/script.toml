# Recipe E, 60 seconds, distilled: one claim per line. The chain: what
# the question would borrow, and for what; what a bond is and who repays
# it; how the five bond questions are decided; the eight programs, the two largest by name and amount (the only two on the chart, which cannot show eight legibly) and the other six by the range of their amounts; the
# handbook's cost estimate, with its caveat; the sides; what a vote does.
#
# The card quotes the Secretary of State's Voter Information Handbook:
# the ballot label's title, the ballot label's description, its clause before "to be allocated as follows:", since the eight programs that follow are split around the vote boxes; the act it was passed in
# (page 8's "Chapter 084 Public Laws 2026"), the total under the
# question's "Total cost:" table, and the handbook's own "Your vote to
# “Approve” means" and "Your vote to “Reject” means" lines.
#
# Rhode Island publishes no official arguments for or against its bond
# questions, so both sides are filed = false and each says so once, in
# the same number of words. The handbook's "Explanation and purpose" is
# the state's description of the projects, not an argument for them; the
# change section uses only its amounts and what each would pay for.
#
# Scale (STANDARD.md rule 6.5): the handbook compares the borrowing
# with no budget, so the scale would be the state's general revenue
# budget for FY 2027. No archived source states that total, so the
# $55 million and its cost are stated without a scale until one is
# archived. The House Fiscal Advisory Staff's debt ratios are a
# different comparison and are not used. Annual debt service is left
# out: the handbook gives none, nor is a timetable or useful life said.
# No person the handbook names is named.

contest = "ri-2026-11-03-question-5"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "handbook"
number = "5"
title = "5. GREEN ECONOMY BONDS - $55,000,000"
