# Recipe E, 60 seconds, distilled: one claim per line. The chain: what
# the question would borrow, and for what; what a bond is and who repays
# it; how the five bond questions are decided; the three projects and
# their amounts; the handbook's cost estimate, with its caveat; the
# sides; what a vote does.
#
# The card quotes the Secretary of State's Voter Information Handbook:
# the ballot label's title and description (its clause before "to be
# allocated as follows:", since the list of projects that follows is
# printed beside the vote boxes, not run on from it), the act it was
# passed in (page 8's "Chapter 084 Public Laws 2026"), the total under
# the question's "Total cost:" table, and the handbook's own "Your vote
# to “Approve” means" and "Your vote to “Reject” means" lines.
#
# Rhode Island publishes no official arguments for or against its bond
# questions, so both sides are filed = false and each says so once, in
# the same number of words. The handbook's "Explanation and purpose" is
# the state's description of the projects, not an argument for them; the
# change section uses only its amounts and what each would build.
#
# Scale (STANDARD.md rule 6.5): the handbook compares the borrowing
# with no budget, so the scale would be the state's general revenue
# budget for FY 2027. No archived source states that total, so the
# $275 million and its cost are stated without a scale until one is
# archived. The House Fiscal Advisory Staff's debt ratios are a
# different comparison and are not used. Annual debt service is left
# out: the handbook gives none. Each project's timetable and useful life
# differ, so neither is said for the whole bond. No person the handbook
# names is named.

contest = "ri-2026-11-03-question-1"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "handbook"
number = "1"
title = "1. HIGHER EDUCATION FACILITIES - $275,000,000"
origin = "Chapter 084 Public Laws 2026"
summary = "For capital improvements to higher education facilities"
fiscal = "$441,333,250"
yes = "Your vote to “Approve” means that you support the State issuing $275,000,000 in general obligation bonds for improvements to higher education facilities."
no = "Your vote to “Reject” means that you are against the State issuing $275,000,000 in general obligation bonds for improvements to higher education facilities."

