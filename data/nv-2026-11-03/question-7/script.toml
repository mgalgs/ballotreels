# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; why it is on the ballot again (the second vote, as the
# booklet's digest states it); when voters show identification today;
# what in-person and mail voters would do; what the fiscal note says it
# costs, and what it cannot estimate; one point per side; what a vote
# does.
#
# The card quotes the Secretary of State's booklet, 2026 Statewide
# Ballot Questions: the ballot question, its initiative petition line,
# the explanation's first sentence, the fiscal note's headline and the
# explanation's "Yes" and "No" vote lines.
#
# The fiscal note (Legislative Counsel Bureau, July 29, 2024) gives about
# $6,750 for voter-system changes and says the cost of free alternative
# identification cannot be determined; the two are stated side by side so
# the figure never reads as the whole cost. The $6,750 is the state's
# money, but no archived source states the General Fund total it would
# be scaled against, so it is stated without a scale (STANDARD.md rule
# 6.5) until one is archived. Each side gets two points from its
# argument, not its rebuttal, in its own words. No person the booklet
# names is named.

contest = "nv-2026-11-03-question-7"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "booklet"
number = "7"
title = "Should the Nevada Constitution be amended to require voters to either present photo identification to verify their identity when voting in-person or to provide certain personal information to verify their identity when voting by mail ballot?"
origin = "Initiative Petition C-02-2023"
summary = "This initiative, if enacted, changes Article 2 of the Nevada Constitution to create a requirement for voters to provide identification before they receive a ballot."
fiscal = "FINANCIAL IMPACT – YES"
yes = "A “Yes” vote would amend Article 2 of the Nevada Constitution to require in-person Nevada voters to present certain identification and mail ballot voters to provide certain information in order to cast a legal ballot."
no = "A “No” vote would keep the Nevada Constitution in its current form."

[[section]]
id = "what"
heading = "Question 7"

[[section.line]]
text = "Question 7 would put voter identification rules in Nevada's Constitution."
sources = ["booklet"]

[section.line.visual]
kind = "page"
source = "booklet"
highlight = ["provide identification before they receive a ballot"]

[[section]]
id = "background"
heading = "A second vote"

[[section.line]]
text = "Approved by voters in 2024, the amendment needs a second approval to take effect."
sources = ["booklet", "fiscal-note"]

[section.line.visual]
kind = "illustration"
name = "ballot-box"

[[section]]
id = "today"
