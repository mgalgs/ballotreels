# Archived sources for Nevada Question 7 (Initiative Petition C-02-2023),
# 2026-11-03 general election. Every id here may be cited by script.toml.
# `kind` must be one the standard allows (docs/STANDARD.md, section 1).
#
# Nevada's Secretary of State prints a question's ballot question,
# explanation and digest, arguments for and against with their
# rebuttals, the Legislative Counsel Bureau's fiscal note and the full
# text in one section of its booklet "2026 Statewide Ballot Questions",
# so every source below shares one archived file: that section's pages
# (18 to 28), cut from the full booklet. Clark County's reprint of the
# same pages (sources/clark-county-ballot-questions-reprint.pdf) is
# archived as a second copy and cited nowhere: the booklet has all of it.

[contest]
id = "nv-2026-11-03-question-7"
election = "nv-2026-11-03"
division = "ocd-division/country:us/state:nv"
kind = "measure"
title = "Question 7: Photo Identification and Voter Verification"

[[source]]
id = "booklet"
kind = "official-title-summary"
publisher = "Nevada Secretary of State, 2026 Statewide Ballot Questions, Question 7: ballot question and explanation and digest, pages 18 to 20"
credit = "Nevada 2026 Statewide Ballot Questions, Question 7"
url = "https://www.nvsos.gov/home/showpublisheddocument/20519/639233354596030000"
file = "sources/guide-section.pdf"
retrieved = "2026-10-27"

