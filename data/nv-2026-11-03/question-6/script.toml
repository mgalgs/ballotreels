# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; why it is on the ballot again (two votes); what Nevada law
# says today; what the amendment would add, up to and after fetal
# viability; what the fiscal note says; one point per side; what a vote
# does.
#
# The card quotes the Secretary of State's booklet, 2026 Statewide
# Ballot Questions: the ballot question, its initiative petition line,
# the explanation's first sentence, the fiscal note's headline and the
# explanation's "Yes" and "No" vote lines.
#
# Every word is contested here, so the neutral lines keep to the ballot
# question's and the full text's own terms ("fundamental right",
# "qualified healthcare professional", "fetal viability", "pregnant
# individual"). The second vote is stated once, as the fiscal note
# states it: the booklet's explanation for this question does not say
# it. Current law is the digest's; neither side's list repeats it. Each
# side gets two points from its argument, not its rebuttal, in its own
# words. The fiscal note is dated 2024 and finds the cost cannot be
# determined; no figure, so no scale. No person the booklet names is
# named.

contest = "nv-2026-11-03-question-6"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "booklet"
number = "6"
title = "Should the Nevada Constitution be amended to create an individual’s fundamental right to an abortion, without interference by state or local governments, whenever the abortion is performed by a qualified healthcare professional until fetal viability or when necessary to protect the health or life of the pregnant individual at any point during the pregnancy?"
origin = "Initiative Petition C-05-2023"
summary = "This initiative, if approved by the voters, amends the Nevada Constitution to create a constitutional right to abortion."
fiscal = "FINANCIAL IMPACT – CANNOT BE DETERMINED"
yes = "A “Yes” vote would create a new section of the Nevada Constitution to establish a person’s constitutional right to abortion, so that a person can make decisions about matters relating to abortion and reproductive healthcare, without interference from state or local governments."
no = "A “No” vote would keep the Nevada Constitution in its current form and would not impact the availability of abortion as a statutory right under Nevada law."

