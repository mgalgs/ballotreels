# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; the four requirements to vote today; what the measure would
# reword, and that it would not change the requirements; what the
# Statement of Costs estimates; the supporters' points; that no statement
# in opposition was received; what a vote does.
#
# The card quotes the Official Election Pamphlet's "Ballot Language" box:
# the act's title, the ballot language and its question, "Should this
# initiative become law?". The box heads itself "Ballot Measure No. 3 -
# USCV"; the card's origin line quotes the page's own heading, "Ballot
# Measure No. 3 - 25USCV", the measure's designation everywhere else. The
# box prints only "Yes" and "No" over the choices, so the card has no
# yes/no lines, and the vote lines take their two meanings from the
# ballot language's own sentences.
#
# No statement in opposition was received: the pamphlet says so, and the
# no side says so once, in the pamphlet's words, filed = false. The
# Statement of Costs is the agencies' estimate of the cost to implement
# the initiative; no archived source gives the state's budget, so the
# total is said without a scale. The statement in support is signed by
# its sponsors; no one is named.

contest = "ak-2026-11-03-ballot-measure-3"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "pamphlet"
number = "3"
title = "An Act Addressing Voter Qualification"
origin = "Ballot Measure No. 3 - 25USCV"
summary = "Alaska law requires that someone must be a United States citizen and meet other requirements to vote. This act would specify that only those who are United States citizens and meet the other requirements may vote. This act would not change the requirements to vote. Should this initiative become law?"

[[section]]
id = "what"
heading = "Ballot Measure 3"

[[section.line]]
text = "Ballot Measure 3 is a proposed law about who may vote in Alaska elections."
sources = ["pamphlet"]

[section.line.visual]
kind = "page"
source = "pamphlet"
highlight = ["Voter Qualification"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Today, a voter must be a United States citizen, at least 18, a 30-day resident, and registered."
sources = ["pamphlet"]

[section.line.visual]
kind = "illustration"
name = "ballot-box"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "The measure would reword the law to say only a person who meets all four requirements may vote."
sources = ["pamphlet", "text"]

[section.line.visual]
kind = "illustration"
name = "law-book"

[[section.line]]
text = "The Legislative Affairs Agency Summary says the requirements to vote would not change."
sources = ["pamphlet"]

[section.line.visual]
kind = "page"
source = "pamphlet"
highlight = ["This act would not change the requirements to vote."]

[[section]]
id = "fiscal"
heading = "What it would cost"

[[section.line]]
text = "The state's statement of costs estimates $114,050 to implement the measure, for public hearings, petition review and translations."
sources = ["costs"]

[section.line.visual]
kind = "bars"
title = "Statement of Costs by agency, in dollars"
source = "costs"
unit = ""
labels = ["Lieutenant Governor", "Division of Elections"]
values = [15000, 99050]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"

[[section.line]]
text = "Supporters say the measure closes a gap, making clear that only citizens may vote."
sources = ["arguments"]
basis = ["Current law says citizens may vote, but it does not specifically state that only citizens may vote.", "This measure closes that gap and makes Alaska law unmistakably clear."]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["Makes clear only citizens may vote", "Clearer guidance for election officials"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "The pamphlet says the Division of Elections did not receive a statement in opposition."
sources = ["arguments"]

[section.line.visual]
kind = "list"
source = "arguments"
items = ["No argument against was submitted"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote means the law would say only citizens meeting the other requirements may vote."
sources = ["pamphlet"]

[section.line.visual]
kind = "page"
source = "pamphlet"
highlight = ["only those who are United States citizens and meet the other requirements may vote"]

[[section.line]]
text = "A no vote keeps today's wording: a voter must be a citizen and meet other requirements."
sources = ["pamphlet"]

[section.line.visual]
kind = "page"
source = "pamphlet"
highlight = ["must be a United States citizen and meet other requirements"]
