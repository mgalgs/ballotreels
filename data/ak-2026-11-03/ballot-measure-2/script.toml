# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; how Alaska's elections work today, since the 2020 vote; the
# measure's two main changes (primaries and general elections; campaign
# finance rules); what the Statement of Costs estimates; one line per
# side; what a vote does.
#
# The card quotes the Official Election Pamphlet's "Ballot Language" box:
# the act's title, the ballot language and its question, "Should this
# initiative become law?". The box prints only "Yes" and "No" over the
# choices, so the card has no yes/no lines, and the vote lines take their
# two meanings from the ballot language's own sentences.
#
# The neutral lines come from the ballot language and the Legislative
# Affairs Agency Summary. The summary's two sentences that the act
# "Reenacts unconstitutional law" are not narrated; neither is every
# repeal it lists. The Statement of Costs is the agencies' estimate of the
# cost to implement the initiative; no archived source gives the state's
# budget, so the total is said without a scale. Each side's line is from
# its statement, without its figures; the statements are signed, and no
# one is named.

contest = "ak-2026-11-03-ballot-measure-2"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "pamphlet"
number = "2"
title = "An Act Restoring Political Party Primaries, Ending Ranked-Choice General Elections, and Repealing Recent Campaign Finance Laws"
origin = "Ballot Measure No. 2 - 24ESEG"
summary = "This act would get rid of open primary elections, where all candidates appear on one ballot. It would also get rid of ranked-choice general elections. It would bring back political party primaries and single-choice general elections. It would also repeal certain campaign finance rules that were added by a 2020 ballot measure. Elections would occur as they did before open primaries and ranked choice voting. In the primary election, voters would choose a party’s ballot, unless prohibited by the party’s bylaws. They would only vote for candidates on that ballot. The winning candidate from each primary would be the party’s nominee. In the general election, voters would vote for only one candidate in each race. The candidate with the most votes would win. Party petitions, special runoff elections, and other processes would return. Candidates for governor and lieutenant governor would run separately in political party primaries and then together in the general election. This act would also repeal campaign finance rules that were passed in 2020. It would remove the limits on donations to joint campaigns for governor and lieutenant governor. It would remove limits and disclosure rules under current law, including for digital ads, out-of-state donations, undisclosed donations, and the true source of donations. It would change the meaning of a campaign expenditure and remove some fines. Should this initiative become law?"

