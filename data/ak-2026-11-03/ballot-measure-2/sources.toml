# Archived sources for Alaska Ballot Measure 2 (24ESEG), 2026-11-03
# general election. Every id here may be cited by script.toml. `kind`
# must be one the standard allows (docs/STANDARD.md, section 1).
#
# The Division of Elections prints each ballot measure's Ballot Language,
# Legislative Affairs Agency Summary, Statement of Costs, full text and
# statements in support and in opposition in its 2026 Official Election
# Pamphlet (Region II edition; the ballot measure pages are the same in
# every region). The archived PDFs are this measure's pages cut from the
# full pamphlet: guide-section.pdf is pages 105 to 108, guide-full-text.pdf
# pages 109 to 136 and guide-statements.pdf pages 137 to 138. Page numbers
# below are the pamphlet's printed ones.

[contest]
id = "ak-2026-11-03-ballot-measure-2"
election = "ak-2026-11-03"
division = "ocd-division/country:us/state:ak"
kind = "measure"
title = "Ballot Measure 2: An Act Restoring Political Party Primaries, Ending Ranked-Choice General Elections, and Repealing Recent Campaign Finance Laws"

[[source]]
id = "pamphlet"
kind = "official-title-summary"
publisher = "Alaska Division of Elections, 2026 Official Election Pamphlet, Ballot Measure No. 2 - 24ESEG: Ballot Language and Legislative Affairs Agency Summary, pages 105 to 106"
credit = "Official Election Pamphlet, Ballot Measure 2"
url = "https://www.elections.alaska.gov/election/2026/General/OEPbooks/2026%20Alaska%20General%20VP_Region%202_ENG_web.pdf"
file = "sources/guide-section.pdf"
retrieved = "2026-10-30"

