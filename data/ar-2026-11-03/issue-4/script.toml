# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; why it is on the ballot; what the bonds would pay for; the
# limits the ballot question and Act 578 set, and how the bonds are
# repaid; one line per side; what a vote does.
#
# Arkansas publishes no official voter guide and no cost estimate. The
# card quotes the Secretary of State's Notice to the Public: the ballot
# title, the ballot question as its summary, and the ballot's two
# choices, "FOR Issuance of ..." and "AGAINST Issuance of ...", as its
# yes and no. Every number comes from the ballot question or Act 578,
# never from the university guide. No interest or total-cost figure is
# published, so none is given. The dollar figures have no scale: no
# archived official source states the state's general revenue total
# (STANDARD.md rule 6.5), so the scale is left open.
#
# The University of Arkansas Division of Agriculture's guide (STANDARD.md
# rule 1.2) gives one line of explanation, that voters must approve most
# general obligation bonds, and the sides, "What do supporters say?" and
# "What do opponents say?": unattributed examples of what each side has
# made public, which the Division does not endorse. Each line relying on
# it names it. For: the future needs more money, and every county has
# received at least one of these loans. Against: borrowing means paying
# interest at higher rates, and the broad language leaves unclear who
# could benefit.

contest = "ar-2026-11-03-issue-4"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "notice"
number = "4"
title = "Arkansas Water, Waste Disposal, and Pollution Abatement Facilities Financing Act of 2025."
origin = "The 95th General Assembly refers the following question to a vote of the people on November 3, 2026"
summary = "Shall the Arkansas Natural Resources Commission be authorized to issue general obligation bonds under the authority of the Arkansas Water, Waste Disposal, and Pollution Abatement Facilities Financing Act of 2025, for the financing and refinancing of the development of water, waste disposal, water pollution control, abatement and prevention, drainage, irrigation, flood control, and wetlands and aquatic resources projects to serve the citizens of the State of Arkansas, in total principal amount not to exceed five hundred million dollars ($500,000,000), with no more than one hundred sixty-five million dollars ($165,000,000) in total principal amount of such bonds to be issued to finance and refinance the development of irrigation facilities, in series from time to time in principal amounts not to exceed, without prior approval of the General Assembly, sixty million dollars ($60,000,000) in any two-year period beginning on July 1 of each odd-numbered year, which bonds shall be secured by a pledge of the full faith and credit of the State of Arkansas?"
yes = "FOR Issuance of State of Arkansas Water, Waste Disposal, and Pollution Abatement Facilities general obligation bonds."
no = "AGAINST Issuance of State of Arkansas Water, Waste Disposal, and Pollution Abatement Facilities general obligation bonds."

