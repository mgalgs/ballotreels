# Archived sources for Arkansas Issue 4, 2026-11-03 general election.
# Every id here may be cited by script.toml. `kind` must be one the
# standard allows (docs/STANDARD.md, section 1).
#
# Arkansas publishes no official voter guide and no official arguments.
# The Secretary of State's Notice to the Public prints Issue 4's ballot
# title, ballot question and the ballot's two choices, and no text, so
# Act 578 of 2025 is the text. Every number comes from those two. The
# University of Arkansas Division of Agriculture's ballot guide
# (STANDARD.md rule 1.2) is cited for one line of explanation and for
# what supporters and opponents say.

[contest]
id = "ar-2026-11-03-issue-4"
election = "ar-2026-11-03"
division = "ocd-division/country:us/state:ar"
kind = "measure"
title = "Issue 4: Arkansas Water, Waste Disposal, and Pollution Abatement Facilities Financing Act of 2025"

[[source]]
id = "notice"
kind = "official-title-summary"
publisher = "Arkansas Secretary of State, Notice to the Public, Issue No. 4: ballot title and ballot question"
credit = "Arkansas Secretary of State, Issue No. 4"
url = "https://www.sos.arkansas.gov/uploads/elections/Issue_No._4_Act_578_of_2026_.pdf"
file = "sources/sos-issue-4-certified.pdf"
retrieved = "2026-10-27"

[[source]]
