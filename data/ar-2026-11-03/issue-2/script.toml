# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; the right as the Constitution states it today; the purposes,
# items and wording the amendment would add; that no cost estimate
# exists; one line per side; what a vote does.
#
# Arkansas publishes no official voter guide. The card quotes the
# Secretary of State's Notice to the Public: the popular name as its
# title, the ballot title as its summary; the notice prints no "a FOR
# vote means" lines, so the card has none. Neutral lines use the ballot
# title's own terms.
#
# The sides come from the University of Arkansas Division of
# Agriculture's guide, "What do supporters say?" and "What do opponents
# say?" (STANDARD.md rule 1.2): unattributed examples of what each side
# has made public, which the Division does not endorse. Each side's line
# names the guide the same way. For: the amendment makes it clear the
# right covers ammunition, accessories and components, and strengthens
# it against calls to disarm law-abiding citizens. Against: the right is
# already protected, and the amendment could make firearm-safety laws
# harder to defend and enforce.

contest = "ar-2026-11-03-issue-2"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "notice"
number = "2"
title = "A Constitutional Amendment to Amend Arkansas Constitution, Article 2, § 5, to Protect the Right to Keep and Bear Arms."
origin = "the 95th General Assembly refers the following constitutional amendment to a vote of the people on November 3, 2026"
summary = "AN AMENDMENT TO THE ARKANSAS CONSTITUTION TO PROVIDE THAT THE CITIZENS OF THE STATE OF ARKANSAS SHALL HAVE THE RIGHT TO KEEP AND BEAR ARMS FOR THEIR COMMON DEFENSE, FOR LAWFUL HUNTING AND RECREATIONAL USE, AND FOR ANY OTHER LAWFUL PURPOSE; PROVIDING THAT THE RIGHT TO KEEP AND BEAR ARMS INCLUDES WITHOUT LIMITATION THE POSSESSION AND USE OF AMMUNITION, FIREARM ACCESSORIES, AND FIREARM COMPONENTS; AND PROVIDING THAT THE RIGHT TO KEEP AND BEAR ARMS IS A NATURAL, FUNDAMENTAL, AND INDIVIDUAL RIGHT THAT SHALL NOT BE INFRINGED."

