# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; what local governments may fund today; the programs and
# districts the amendment would allow, and how district property would be
# taxed; that no cost estimate exists; one line per side; what a vote
# does.
#
# Arkansas publishes no official voter guide. The card quotes the
# Secretary of State's Notice to the Public: the popular name as its
# title, the ballot title as its summary; the notice prints no "a FOR
# vote means" lines, so the card has none. The tax line states both
# halves of the text's rule (exempt from other taxes, taxed by the
# district), so neither the effect nor its cost is passed over (rule
# 6.4).
#
# The sides come from the University of Arkansas Division of
# Agriculture's guide, "What do supporters say?" and "What do opponents
# say?" (STANDARD.md rule 1.2): unattributed examples of what each side
# has made public, which the Division does not endorse. Each side's line
# names the guide the same way. For: Arkansas is the only state in its
# region without such districts, and they would help communities compete
# without raising taxes. Against: district property comes off the tax
# rolls and the cost shifts to everyone outside the district, and the
# government picks which businesses benefit.

contest = "ar-2026-11-03-issue-3"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "notice"
number = "3"
title = "A Constitutional Amendment Concerning Economic Development in the State of Arkansas; and Authorizing the General Assembly to Provide for the Creation of Economic Development Districts Within Cities, Counties, or Cooperative Areas to Promote Economic Development Within the Economic Development District."
origin = "the 95th General Assembly refers the following constitutional amendment to a vote of the people on November 3, 2026"
summary = "AN AMENDMENT TO THE ARKANSAS CONSTITUTION CONCERNING ECONOMIC DEVELOPMENT IN THE STATE OF ARKANSAS; AND AUTHORIZING THE GENERAL ASSEMBLY TO PROVIDE FOR THE CREATION OF ECONOMIC DEVELOPMENT DISTRICTS WITHIN CITIES, COUNTIES, OR COOPERATIVE AREAS TO PROMOTE ECONOMIC DEVELOPMENT WITHIN THE ECONOMIC DEVELOPMENT DISTRICT."

