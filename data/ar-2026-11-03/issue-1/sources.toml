# Archived sources for Arkansas Issue 1, 2026-11-03 general election.
# Every id here may be cited by script.toml. `kind` must be one the
# standard allows (docs/STANDARD.md, section 1).
#
# Arkansas publishes no official voter guide and no official arguments.
# The Secretary of State's Notice to the Public prints the popular name,
# ballot title and full text; the University of Arkansas Division of
# Agriculture's ballot guide (STANDARD.md rule 1.2) is cited only for
# what supporters and opponents say.

[contest]
id = "ar-2026-11-03-issue-1"
election = "ar-2026-11-03"
division = "ocd-division/country:us/state:ar"
kind = "measure"
title = "Issue 1: The Citizens Only Voting Amendment"

