# Contest index for the 2026-11-03 Arkansas general election
# (docs/ARCHITECTURE.md). One [[contest]] entry per contest on the
# ballot. `number` is a measure's ballot designation (a string). Arkansas
# publishes no official voter guide; titles pair the designation with
# the measure's short title as the Secretary of State's Notice to the
# Public prints it (its popular name, or a bond act's ballot title).

[election]
id = "ar-2026-11-03"
state = "ocd-division/country:us/state:ar"
title = "Arkansas General Election, November 3, 2026"

