# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; how proof of identity works today (the ballot's own "yes" line
# says it); what Proposition 144 would require, offer and change for the
# courts; what the Legislative Council says about paying for it; one
# point per side; what a vote does.
#
# The card quotes Arizona's General Election Guide: the ballot format's
# descriptive title and its "yes"/"no" vote lines, and the Analysis by
# Legislative Council through its third item (the whole analysis set the
# card too small to read; the "yes" line, quoted whole, lists the rest).
# No fiscal statement exists for a measure the
# Legislature refers, so the card has no fiscal quote; the fiscal section
# gives only what the analysis itself states (the Legislature must
# appropriate the money), with no dollar figure.
#
# The sides are drawn from what the arguments filed most commonly say,
# attributed to "supporters" and "opponents", with equal words. The
# existing ID law appears in "today" because the ballot's "yes" line
# states it; the opponents' point that the measure repeats existing law is
# not used, so the fact is not argued in a neutral section.

contest = "az-2026-11-03-prop-144"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide"
number = "144"
title = "REQUIRES ALL VOTERS, INCLUDING VOTERS WHO VOTE BY MAIL, TO SHOW GOVERNMENT-ISSUED ID TO VOTE IN EACH ELECTION; MAKES OTHER CHANGES TO ELECTION ADMINISTRATION AND CAMPAIGN FINANCE PROHIBITIONS."
origin = "PROPOSED AMENDMENT TO THE CONSTITUTION BY THE LEGISLATURE"
summary = "Proposition 144 would amend the Arizona Constitution to: 1. Reaffirm that only United States citizens may register to vote and vote in Arizona elections. 2. Require voters to present valid government-issued proof of identity before casting a ballot in each election, as prescribed by law. 3. Require that voters be provided the option to have their ballots tabulated at their voting location on election day."
yes = "A “yes” vote shall have the effect of amending the Arizona Constitution to: (1) require voters to show proof of identity when voting in each election, including when voting by mail; (2) changing existing proof of identity requirements to limit acceptable documentation to government-issued ID; (3) require election officials to provide all voters the option to have their ballot tabulated at their voting location on election day; (4) prohibit foreign nationals from contributing or spending to influence elections in Arizona and prohibit anyone from knowingly accepting such contributions, similar to prohibitions that already exist in federal law; (5) create a new standard for judicial review of election laws under the Arizona Constitution, which may make it harder to challenge election laws; and (6) require the legislature to appropriate money necessary to implement these provisions."
no = "A “no” vote shall have the effect of maintaining current constitutional provisions governing elections."

