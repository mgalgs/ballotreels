# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; the ban the constitution already has (the ballot's own lines
# say so); what Proposition 142 would add; that the guide prints no cost
# estimate; one point per side; what a vote does.
#
# The card quotes Arizona's General Election Guide: the ballot format's
# descriptive title and its "yes"/"no" vote lines, and the opening of the
# Analysis by Legislative Council, through its first item (the whole
# analysis set the card too small to read; the "yes" line, quoted whole,
# lists the rest). No fiscal statement exists for a measure the
# Legislature refers, so the card has no fiscal quote and the fiscal
# section says only that the guide prints no cost estimate.
#
# The sides are drawn from what the arguments filed most commonly say,
# attributed to "supporters" and "opponents", with equal words. The
# existing ban appears in "today" because the ballot's own lines state
# it; the opponents' point that the measure is unnecessary for that reason
# is not used, so the fact is not argued in a neutral section.

contest = "az-2026-11-03-prop-142"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide"
number = "142"
title = "ADDS FURTHER DETAILS TO THE CONSTITUTIONAL PROHIBITION AGAINST PREFERENTIAL TREATMENT OR DISCRIMINATION BY THE STATE BASED ON RACE, ETHNICITY, OR OTHER CLASSES."
origin = "PROPOSED AMENDMENT TO THE CONSTITUTION BY THE LEGISLATURE"
summary = "Proposition 142 would amend the Arizona Constitution to provide that this state and cities, towns, counties, public universities, community colleges, school districts and any other political subdivisions: 1. Are prohibited from granting preferential treatment to or discriminating against individuals or groups based on race, sex, color, ethnicity or national origin in public employment, education or contracting, even if a part of a federal program."
yes = "A “yes” vote shall have the effect of amending the Arizona Constitution’s current prohibition against preferential treatment or discrimination by the state based on race, ethnicity, or other classes, to specifically prohibit: (1) compelling individuals to support preferential treatment or discrimination based on race or ethnicity as a condition of education, employment, or contract opportunities; (2) spending public money on positions in public education responsible for promoting preferential treatment or discrimination based on race or ethnicity; and (3) implementing disciplinary practices that treat students or employees differently based on race or ethnicity. Prohibited conduct includes requiring or asking an applicant, employee, student, or contractor to provide a statement in support of race-based diversity, equity, and inclusion beyond upholding the federal Equal Protection Clause or asking such a person to discuss the person’s race or ethnicity or experience with others’ race or ethnicity. The amendment contains certain exceptions for health services, legal, and other reasons."
no = "A “no” vote shall have the effect of maintaining the current prohibition in the Arizona Constitution against preferential treatment or discrimination by the state based on race, ethnicity, or other classes."

