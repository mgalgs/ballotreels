# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; where it comes from (the Legislature's findings tie it to
# Proposition 314); what exists today; what Proposition 317 would declare
# and require; that the guide prints no cost estimate; one point per
# side; what a vote does.
#
# The card quotes Arizona's General Election Guide: the ballot format's
# descriptive title and its "yes"/"no" vote lines, and the Analysis by
# Legislative Council. No fiscal statement exists for a measure the
# Legislature refers, so the card has no fiscal quote and the fiscal
# section says only that the guide prints no cost estimate.
#
# One argument was filed on each side. The sides are drawn from what the
# arguments say, attributed to "supporters" and "opponents".

contest = "az-2026-11-03-prop-317"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide"
number = "317"
title = "DECLARES THAT DRUG CARTELS ARE TERRORIST ORGANIZATIONS; DIRECTS THE ARIZONA DEPARTMENT OF HOMELAND SECURITY TO DO EVERYTHING IN ITS AUTHORITY TO ADDRESS DRUG CARTELS."
origin = "REFERRED TO THE PEOPLE BY THE LEGISLATURE"
summary = "Proposition 317 would declare that drug cartels (associations of persons engaging in human smuggling, drug trafficking for profit or any act of terrorism) are terrorist organizations. The proposition would: 1. Require the Arizona Department of Homeland Security to use all lawful means available within its authority to address threats posed by drug cartels. 2. Declare that this proposition does not support an alien's claim for asylum under federal law."
yes = "A “yes” vote shall have the effect of: (1) declaring drug cartels as terrorist organizations and directing the Arizona Department of Homeland Security to do everything in its authority to address threats posed by drug cartels; (2) defining “drug cartel” to mean an ongoing formal or informal association of persons engaged in human smuggling, drug trafficking, or any act defined as terrorism under Arizona law; and (3) clarifying that this measure does not support an alien’s asylum claim."
no = "A “no” vote shall have the effect of maintaining the current laws relating to terrorism and the Arizona Department of Homeland Security."

