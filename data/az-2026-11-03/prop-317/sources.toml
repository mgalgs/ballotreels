# Archived sources for Arizona Proposition 317, 2026-11-03 general
# election. Every id here may be cited by script.toml. `kind` must be one
# the standard allows (docs/STANDARD.md, section 1).
#
# Arizona prints a measure's full text, the Legislative Council's
# analysis, the arguments for and against and its ballot format in one
# section of its General Election Guide (the 2026 Publicity Pamphlet), so
# several sources below share one archived file: that section's pages, cut
# from the full guide. The Secretary of State also publishes the arguments
# as filed, separately. No fiscal statement exists: the guide prints none
# for a measure the Legislature refers.

[contest]
id = "az-2026-11-03-prop-317"
election = "az-2026-11-03"
division = "ocd-division/country:us/state:az"
kind = "measure"
title = "Proposition 317: Arizona Department of Homeland Security"

[[source]]
id = "guide"
kind = "official-title-summary"
publisher = "Arizona Secretary of State, Arizona's General Election Guide, November 3, 2026, Proposition 317: ballot format, pages 101 to 105"
credit = "Arizona's General Election Guide, Proposition 317"
url = "https://apps.azsos.gov/election/BallotMeasures/2026/2026-AZ-Publicity-Pamphlet.pdf"
file = "sources/guide-section.pdf"
