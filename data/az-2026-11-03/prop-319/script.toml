# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; what the law allows today; what Proposition 319 would change
# (a contract deadline, local votes, a 10-year renewal); that the guide
# prints no cost estimate; one point per side; what a vote does.
#
# The card quotes Arizona's General Election Guide: the ballot format's
# descriptive title and its "yes"/"no" vote lines, and the Analysis by
# Legislative Council. No fiscal statement exists for a measure the
# Legislature refers, so the card has no fiscal quote and the fiscal
# section says only that the guide prints no cost estimate.
#
# The Legislature's stated intent (officers, not for-profit companies;
# safety, not revenue) is left out: supporters make the same case, so it
# belongs to their side (STANDARD 6.3), and the sides are drawn from what
# the arguments filed most commonly say, with equal words.

contest = "az-2026-11-03-prop-319"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide"
number = "319"
title = "PROHIBITS STATE AGENCIES AND LOCAL GOVERNMENTS FROM USING PHOTO ENFORCEMENT SYSTEMS FOR TRAFFIC ENFORCEMENT UNLESS PROVIDED BY CONTRACT AS OF DECEMBER 31, 2026; REQUIRES LOCAL GOVERNMENTS TO OBTAIN VOTER APPROVAL TO CONTINUE THEIR USE."
origin = "REFERRED TO THE PEOPLE BY THE LEGISLATURE"
summary = "Proposition 319 would prohibit a local authority or state agency from using a photo enforcement system for speeding or traffic control device violations unless the local authority or state agency has a contract in place before December 31, 2026 to operate a photo enforcement system. If the local authority has a photo enforcement system contract in place before December 31, 2026, Proposition 319 would require the local authority to seek approval from the voters at the next general election to continue to operate the photo enforcement system. If the voters fail to approve the continued operation of the existing photo enforcement system, Proposition 319 would require that the local authority cease operations of the photo enforcement system within 90 days after the election. If the voters approve the continued operation of the existing photo enforcement system, Proposition 319 would allow the continued operation of the photo enforcement system for a period of 10 years. At the conclusion of each 10-year period, the local authority must seek approval from the voters for the continued operation of the photo enforcement system for a period of an additional 10 years."
yes = "A “yes” vote shall have the effect of: (1) prohibiting state agencies and local governments from using photo enforcement systems to identify violators of traffic laws unless the agency or government contracts to use those systems by December 31, 2026; and (2) requiring local governments to obtain voter approval of existing photo enforcement systems at the next regular general election and every 10 years afterward to continue using photo enforcement systems."
no = "A “no” vote shall have the effect of maintaining the current laws governing photo enforcement systems."

