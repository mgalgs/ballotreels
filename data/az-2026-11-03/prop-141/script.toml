# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; that the constitution has no such section today; what
# Proposition 141 would bar, and whom it exempts; that the guide prints no
# cost estimate; one point per side; what a vote does.
#
# The card quotes Arizona's General Election Guide: the ballot format's
# descriptive title and its "yes"/"no" vote lines, and the Analysis by
# Legislative Council. No fiscal statement exists for a measure the
# Legislature refers, so the card has no fiscal quote and the fiscal
# section says only that the guide prints no cost estimate. No dollar
# figure is used: the road funding figures in the arguments against are
# the opponents' own and are not repeated across them.
#
# The sides are drawn from what the arguments filed most commonly say,
# attributed to "supporters" and "opponents", with equal words.

contest = "az-2026-11-03-prop-141"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide"
number = "141"
title = "PROHIBITS TAXES OR FEES BASED ON VEHICLE MILES TRAVELED AND LAWS MONITORING OR LIMITING VEHICLE MILES TRAVELED WITHOUT CONSENT."
origin = "PROPOSED AMENDMENT TO THE CONSTITUTION BY THE LEGISLATURE"
summary = "Proposition 141 would amend the Arizona Constitution to prohibit this state and any county, city, town, municipal corporation or other political subdivision of this state from: 1. Imposing a tax or fee based on the number of miles a person travels in a motor vehicle. 2. Monitoring or limiting the number of miles a person travels in a motor vehicle, unless the person voluntarily consents. Proposition 141 would not apply to the following: 1. The miles traveled by a person in a motor vehicle if the motor vehicle is a commercial vehicle that operates in more than one state and an interstate agreement is established for reporting fuel taxes or registration fees. 2. The miles traveled by a person in a motor vehicle if the motor vehicle is owned and operated by this state or a county, city, town, municipal corporation or other political subdivision of this state."
yes = "A “yes” vote shall have the effect of amending the Arizona Constitution to prohibit: (1) taxes or fees based on motor vehicle miles traveled; and (2) laws or rules that monitor or limit motor vehicle miles traveled without consent. These prohibitions do not apply in certain instances to interstate commercial vehicles or to vehicles owned by the state or local governments."
no = "A “no” vote shall have the effect of maintaining the current constitutional language related to taxation."

