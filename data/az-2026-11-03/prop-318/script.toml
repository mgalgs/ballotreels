# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; what the law already requires and of whom (the ballot's own
# "yes" line says it); what Proposition 318 would extend and add; that the
# guide prints no cost estimate; one point per side; what a vote does.
#
# The card quotes Arizona's General Election Guide: the ballot format's
# descriptive title and its "yes"/"no" vote lines, and the first two
# sentences of the Analysis by Legislative Council (the whole analysis set
# the card too small to read). No fiscal statement exists for a measure the
# Legislature refers, so the card has no fiscal quote and the fiscal
# section says only that the guide prints no cost estimate.
#
# The sides are drawn from what the arguments filed most commonly say,
# attributed to "supporters" and "opponents", with equal words. The
# existing law appears in "today" because the ballot's "yes" line states
# it; the opponents' point that the measure is unnecessary for that reason
# is not used, so the fact is not argued in a neutral section.

contest = "az-2026-11-03-prop-318"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide"
number = "318"
title = "REQUIRES ALL SCHOOLS AND ATHLETIC ASSOCIATIONS TO DESIGNATE ATHLETIC TEAMS AS MALE, FEMALE, OR COED BASED ON THE BIOLOGICAL SEX OF THE ATHLETES AS DEFINED AT BIRTH; PROHIBITS THESE ENTITIES FROM AUTHORIZING USE OF PRIVATE SPACES NOT DESIGNATED FOR A PERSON’S SEX."
origin = "REFERRED TO THE PEOPLE BY THE LEGISLATURE"
summary = "Proposition 318 would prohibit males from playing in female interscholastic and intramural sports based on the biological sex of the participating athletes as recorded at birth on the athletes' original birth certificates. This proposition would amend Arizona law to require public and private schools and athletic associations that sponsor an interscholastic or intramural athletic team or sport to expressly designate such teams and sports as \"males\", \"men\", \"boys\", \"females\", \"women\", \"girls\", \"coeducational\" or \"mixed\"."
yes = "A “yes” vote shall have the effect of: (1) requiring private schools, public schools, and athletic associations to designate every athletic team as male, female, or coed/mixed based on sex and to prevent males from joining female teams; existing law imposes this requirement only on public schools and those competing against them; (2) prohibiting schools and athletic associations from authorizing anyone to use private spaces (such as restrooms) not designated for that individual’s sex; (3) defining “sex” as an individual’s biological status as male or female as recorded at birth on an original birth certificate; and (4) authorizing athletes to sue schools and athletic associations that knowingly violate this law."
no = "A “no” vote shall have the effect of maintaining the current laws relating to student athletics."

