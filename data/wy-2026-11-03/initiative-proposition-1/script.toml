# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; how the exemption list works today; what the proposition would
# add and who would qualify; what the ballot's Estimated Fiscal Impact says
# it would do to state revenue, and what that estimate leaves out; the two
# sides; what a vote does, and the pass rule. The designation is said
# once, in the opening line; after that, "the proposition" and "the law".
#
# The card quotes page 1 of the Secretary of State's 2026 General Election
# Statewide Ballot Propositions: the heading (origin), the ballot language
# whole (title), and the Estimated Fiscal Impact block (fiscal). Wyoming
# prints no explanation or digest, so the summary is the page's own line
# naming the initiative, the least redundant passage beside the ballot
# language. There are no "a vote FOR means" lines, so the card has no
# yes/no, and the vote lines take their two meanings from the ballot's
# question, "Shall a law be enacted".
#
# The proposition is a statute (it creates W.S. 39-11-105(a)(xliii)), not
# a constitutional amendment: the ballot asks "Shall a law be enacted".
#
# Fiscal: the narration keeps to the ballot's own state-only estimate and
# says once, in its words, that it leaves out local governments. The
# Legislative Service Office's wider estimate, including local levies,
# measures something else and is not used. Scale (rule 6.5): the
# statement names no budget, and no archived source states the state's
# General Fund (or School Foundation Program) total for fiscal year 2028,
# so the figure is stated without a scale; left open. The text's "tax
# year 2025" against the statement's "earliest applicable tax year would
# be 2027" is not resolved: the narration gives the statement's 2027,
# attributed to the estimate, and the card carries both.
#
# Wyoming publishes no official arguments for or against an initiative,
# so both sides are filed = false and each says so once, in the same
# number of words. The pass rule is said once, in the Voter's Guide's
# words ("approved by a majority of those voting in the General
# Election").
#
# Left out for time: the one-exemption-per-owner rule, the sworn claim
# with the county assessor and the yearly confirmation, the penalty for
# false claims (all on the card).

contest = "wy-2026-11-03-initiative-proposition-1"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "propositions"
number = "One"
title = "Shall a law be enacted: Establishing a property tax exemption for qualified homeowners’ primary residence in the amount of fifty percent (50%) of the assessed value of the dwelling; AND Defining “homeowner” and “primary residence”; providing that no more than one exemption shall apply to a single property or be claimed by a single owner per year; requiring a homeowner to be a resident of Wyoming for at least one year and to have occupied the primary residence for at least six months of the previous tax year to qualify; requiring an initial sworn claim to be filed with the county assessor by the fourth Monday in May; providing for continuing the exemption in subsequent years through annually confirming eligibility; providing a penalty for false claims; clarifying that the exemption applies to the residential structure; and specifying applicability?"
origin = "PROPOSED INITIATIVE PROPOSITION NUMBER ONE"
summary = "People’s Initiative to Limit Property Tax in Wyoming through a Homeowner’s Property Exemption"
fiscal = "Anticipated Revenue / (decrease) Fiscal Year 2028 ($92,614,266) Fiscal Year 2029 ($95,855,766) The above estimate is based on residential property assessed value and property tax data from the Computer Assisted Mass Appraisal (CAMA) system provided by the Department of Revenue in 2023. The future fiscal impact estimates are derived by using the January 2023 Consensus Revenue Estimating Group (CREG) report, estimating annual growth of 3.5% for properties in the future years. This is an estimate of fiscal impact to the State of Wyoming only and does not include an estimate of any impact upon political subdivisions. The proposition references a beginning in 2025, but if passed in 2026 the earliest applicable tax year would be 2027, with impact to the state beginning in 2028. Fiscal impact will apply to each year so long as the exemption is in place. Future impacts depend on unpredictable economic conditions."

