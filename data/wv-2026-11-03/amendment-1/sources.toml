# Archived sources for West Virginia Amendment 1, 2026-11-03 general
# election. Every id here may be cited by script.toml. `kind` must be one
# the standard allows (docs/STANDARD.md, section 1).
#
# West Virginia has no voter pamphlet and no official arguments for or
# against an amendment, so there is no source of kind official-argument.
# The Legislature's enrolled resolution numbers and designates the
# amendment and states its Summary of Purpose; the Secretary of State's
# Public Notice prints the same title, summary and full text, and the
# ballot prints them over the choices FOR and AGAINST.
#
# The enrolled resolution prints only the new text of Article IV,
# section 1; the old text is the Constitution as it stands. The
# introduced resolution (sources/sjr9-introduced.html) and the Secretary
# of State's release of an explainer video (sources/sos-video-press-release.html)
# are archived for reference and not cited: the video was not
# transcribed. The Legislature's status URL with btype=res serves Senate
# Bill 9; the resolution's own page is Resolution_History.cfm.
#
# sample-ballot-wood-precinct-8.pdf is page 1 of Wood County's sample
# ballots (one ballot style); every style ends with the same
# "Amendment No. 1". No fiscal note for SJR 9 is on the Legislature's
# 2026 list.

[contest]
id = "wv-2026-11-03-amendment-1"
election = "wv-2026-11-03"
division = "ocd-division/country:us/state:wv"
kind = "measure"
title = "Amendment No. 1: Citizenship Requirement to Vote in West Virginia Elections Amendment"

[[source]]
id = "notice"
kind = "official-title-summary"
publisher = "West Virginia Secretary of State, Public Notice of a proposed Amendment to the West Virginia Constitution, July 23, 2026"
credit = "West Virginia Secretary of State, Public Notice"
url = "https://sos.wv.gov/article/secretary-warner-issues-public-notice-proposed-amendment-west-virginia-constitution-will"
file = "sources/sos-public-notice-press-release.html"
retrieved = "2026-10-27"

