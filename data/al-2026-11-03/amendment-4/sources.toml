# Archived sources for Alabama Statewide Amendment 4, 2026-11-03
# general election. Every id here may be cited by script.toml. `kind`
# must be one the standard allows (docs/STANDARD.md, section 1).
#
# Alabama publishes no voter pamphlet. The official explanation is the
# Fair Ballot Commission's ballot statement (Ala. Code 17-6-81): the
# ballot text, placement and a plain-language summary, ending with the
# effect of a yes and a no vote and a one-line cost statement. It backs
# two sources: fbc (the card) and fbc-cost (its cost sentence, Alabama's
# one official fiscal statement printed for voters). Alabama publishes
# no official arguments for or against an amendment, so there is no
# source of kind official-argument: both side sections say so, citing
# the statement, which prints none.
#
# The Legislative Services Agency's fiscal note cited is the third, on
# the bill as enacted (07/14/2026). sb5-fiscal-note-1.pdf and -2.pdf (as
# introduced, as passed the Senate) are archived and say the same, and
# are cited by no line. ALISON also returns 2025 notes for an unrelated
# "Senate Bill 5"; those are not this bill and are not archived.
#
# act-2026-424-sos-signed.pdf is the signed Act as filed with the
# Secretary of State, a scan with an OCR layer; the script quotes the
# enrolled copy from ALISON instead and cites the scan by no line.

[contest]
id = "al-2026-11-03-amendment-4"
election = "al-2026-11-03"
division = "ocd-division/country:us/state:al"
kind = "measure"
title = "Statewide Amendment 4: The Star-Spangled Banner in Public Schools"

[[source]]
id = "fbc"
kind = "official-title-summary"
publisher = "Alabama Fair Ballot Commission, Ballot Statement for Statewide Amendment 4, November 3, 2026 Statewide General Election"
credit = "Alabama Fair Ballot Commission, Ballot Statement"
url = "https://www.sos.alabama.gov/sites/default/files/2026-08/FBCStatewideAmendment-4.pdf"
file = "sources/fbc-statewide-amendment-4.pdf"
