# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; what the Constitution requires today; what local boards would
# have to adopt (the pledge each school day, student-led prayer), the
# students' right to opt out and who reviews violations; what the two
# official cost statements say; the two sides; what a vote does.
#
# The card quotes the Fair Ballot Commission's ballot statement: the
# ballot text as title, the Act it was proposed by as origin, the
# plain-language summary's "If approved" paragraph and the one after it
# as summary, and its yes and no sentences. The statement's cost
# sentence sits under no heading, so the card has no fiscal quote
# (ballots.py).
#
# The subject is contested, so the script keeps to the statement's own
# terms: "student-initiated and student-led prayer", no student required
# to take part, the right to opt out "based on their own beliefs", and
# review by the local superintendent.
#
# The two official cost statements differ, and both are given,
# attributed: the Commission says no costs or taxes; the Legislative
# Services Agency's fiscal note on the version passed by the House (the
# enacted text) estimates $100,000 of proclamation expenses from the
# State General Fund. No archived source states the State General Fund
# total for fiscal year 2027, so the figure is stated without its scale
# (left open).
#
# Alabama publishes no official arguments for or against an amendment:
# both sides are filed = false and each says so once, in the same number
# of words. No person is named.

contest = "al-2026-11-03-amendment-3"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "fbc"
number = "3"
title = "Proposing an amendment to the Constitution of Alabama of 2022, to require local boards of education to adopt policies requiring each public K-12 school to recite The Pledge of Allegiance to the United States flag at the beginning of each school day; and to require local boards of education to adopt a policy authorizing student-initiated and student-led prayer."
origin = "Proposed by Act No. 2026-379 (House Bill 511, 2026 Regular Legislative Session)"
summary = "If approved, this amendment would require each local board of education to adopt a policy requiring each public K-12 school to conduct the Pledge of Allegiance to the United States flag at the beginning of each school day and give students the opportunity to voluntarily recite the Pledge of Allegiance. The amendment would also require each local board of education to adopt a policy allowing student-initiated and student-led prayer in public K-12 schools. No student could be required to participate in the prayer, and students would have the right to opt out of participating in the Pledge of Allegiance or the prayer based on their own beliefs. Reported violations would be reviewed by the local superintendent of education."
yes = "If the majority of voters vote “yes” on Amendment 3, the Alabama Constitution will be changed."
no = "If the majority of voters vote “no” on Amendment 3, the Alabama Constitution will not be changed."

