# Recipe E, 60 seconds, distilled. The chain: what it is about; where a
# law like it has been tried, and what happened to it; who it would reach
# today; what the initiative would ban and who would be fined; what the
# Chief Financial Officer says it costs, and what that cost depends on;
# the two sides; what a vote does.
#
# Precedent (STANDARD.md section 10) is every enacted law in the archived
# records (sources/precedent/README.md) that bans these sales: California's
# (which also bans the force-feeding, as Initiative 86 does), then the city
# sales bans of Chicago, New York City, Pittsburgh and Portland, Oregon,
# each with its outcomes: Chicago's ban upheld then repealed; New York
# City's upheld on appeal but kept unenforced by an injunction. Leaving a
# place out would pick which outcomes a voter hears. Brookline's bylaw is
# not told: its records are not archived (README Part 4). Who it affects
# comes only from the initiative's text and the Chief Financial Officer;
# no official record says how many businesses sell these products, so the
# questions record says so and the script does not.

# The card quotes the Voter Guide's page: the short title, the summary
# statement, and the ballot's two choices, "Yes, to approve" and "No, to
# reject", which the card draws in its YES and NO boxes.
#
# The District publishes no official arguments for or against an
# initiative, so both sides are filed = false and each says so once, in
# the same number of words. The initiative's own findings (sec. 2 of its
# text) are its authors' case for it and are left out of the neutral
# sections (STANDARD.md 6.3), as campaign arguments are left out
# everywhere.
#
# Scale (rule 6.5): the $314,000 spans fiscal years 2026 to 2029, and the
# Chief Financial Officer's budget prints Local Funds expenditures and
# commitments for each of those years (Table 1) but no four-year sum, so
# it is compared year by year: the largest yearly cost, $109,000 in FY
# 2027, is under 1 percent of that year's $11,339.5 million.

contest = "dc-2026-11-03-initiative-86"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide"
number = "86"
title = "Prohibiting Force-Feeding of Birds Act of 2026."
origin = "BALLOT INITIATIVE"
summary = "If enacted, this Initiative would: (a) Prohibit any person from force-feeding a bird for the purpose of enlarging the bird’s liver beyond normal size; (b) Ban the sale or distribution of any product resulting from force-feeding a bird, including foie gras; (c) Define force-feeding as inserting a tube into the bird’s throat to deliver excessive feed; (d) Provide for enforcement by the Department of Energy and Environment during routine food safety inspections; and (e) Provide for civil penalties."
yes = "Yes, to approve"
no = "No, to reject"

[[section]]
id = "what"
heading = "Initiative 86"

[[section.line]]
text = "Initiative 86 is about force-feeding birds to enlarge their livers, and foods like foie gras."
sources = ["guide"]

[section.line.visual]
kind = "page"
source = "guide"
highlight = ["force-feeding a bird for the purpose of enlarging the bird’s liver"]

[[section]]
id = "background"
heading = "Similar laws elsewhere"

[[section.line]]
id = "california"
text = "California banned the force-feeding and sales in 2004; a court struck the sales ban down, then an appeals court upheld it."
sources = ["ca-law", "ca-court-2017", "ca-court-2022"]

[section.line.visual]
kind = "illustration"
name = "law-book"
stamp = "California"

[[section.line]]
id = "chicago"
text = "Chicago banned restaurant sales in 2006; a court upheld the ban, then the city repealed it in 2008."
sources = ["chicago-law", "chicago-court-2007", "chicago-repeal"]

[section.line.visual]
kind = "illustration"
name = "legislative-chamber"
stamp = "Chicago"

[[section.line]]
id = "new-york-city"
text = "New York City passed a sales ban in 2019; an appeals court upheld it in 2026, but a court order kept it from being enforced."
sources = ["nyc-law", "nyc-court-2026"]

[section.line.visual]
kind = "illustration"
name = "sealed-order"
stamp = "New York City"

[[section.line]]
id = "pittsburgh-portland"
text = "Pittsburgh passed a sales ban in 2023; Portland, Oregon, passed one that starts December 31."
