# Recipe E, 60 seconds, distilled. The chain: what it is about; where a
# law like it has been tried, and what happened to it; who it would reach
# today; what the initiative would ban and who would be fined; what the
# Chief Financial Officer says it costs, and what that cost depends on;
# the two sides; what a vote does.
#
# Precedent (STANDARD.md section 10) is every enacted law in the archived
# records (sources/precedent/README.md) that bans these sales: California's
# (which also bans the force-feeding, as Initiative 86 does), then the city
# sales bans of Chicago, New York City, Pittsburgh and Portland, Oregon.
# One page lists them, the next their outcomes: Chicago's ban upheld then
# repealed; New York City's upheld on appeal but kept unenforced by an
# injunction; California's 2015 ruling against its sales ban is folded
# into the appeals that reversed it (rule 10.3). Leaving a place out would
# pick which outcomes a voter hears. Brookline's bylaw is
# not told: its records are not archived (README Part 4). Who it affects
# comes only from the initiative's text and the Chief Financial Officer;
# no official record says how many businesses sell these products, so the
# questions record says so and the script does not.

# The card quotes the Voter Guide's page: the short title, the summary
# statement, and the ballot's two choices, "Yes, to approve" and "No, to
# reject", which the card draws in its YES and NO boxes.
#
# The District publishes no official arguments for or against an
# initiative, so both sides are filed = false and each says so once, in
# the same number of words. The initiative's own findings (sec. 2 of its
# text) are its authors' case for it and are left out of the neutral
# sections (STANDARD.md 6.3), as campaign arguments are left out
# everywhere.
#
# Scale (rule 6.5): the $314,000 spans fiscal years 2026 to 2029, and the
# Chief Financial Officer's budget prints Local Funds expenditures and
# commitments for each of those years (Table 1) but no four-year sum, so
# it is compared year by year: the largest yearly cost, $109,000 in FY
# 2027, is under 1 percent of that year's $11,339.5 million.

contest = "dc-2026-11-03-initiative-86"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "guide"
number = "86"
title = "Prohibiting Force-Feeding of Birds Act of 2026."
origin = "BALLOT INITIATIVE"
summary = "If enacted, this Initiative would: (a) Prohibit any person from force-feeding a bird for the purpose of enlarging the bird’s liver beyond normal size; (b) Ban the sale or distribution of any product resulting from force-feeding a bird, including foie gras; (c) Define force-feeding as inserting a tube into the bird’s throat to deliver excessive feed; (d) Provide for enforcement by the Department of Energy and Environment during routine food safety inspections; and (e) Provide for civil penalties."
yes = "Yes, to approve"
no = "No, to reject"

[[section]]
id = "what"
heading = "Initiative 86"

[[section.line]]
text = "Initiative 86 is about force-feeding birds to enlarge their livers, and foods like foie gras."
sources = ["guide"]

[section.line.visual]
kind = "page"
source = "guide"
highlight = ["force-feeding a bird for the purpose of enlarging the bird’s liver"]

[[section]]
id = "background"
heading = "Similar laws elsewhere"

[[section.line]]
id = "passed"
text = "Between 2004 and 2026, California, Chicago, New York City, Pittsburgh and Portland, Oregon, passed bans on these sales."
sources = ["ca-law", "chicago-law", "nyc-law", "pittsburgh-law", "portland-law"]

[section.line.visual]
kind = "timeline"
source = "ca-law"
labels = ["2004", "2006", "2019", "2023", "2026"]
items = ["California", "Chicago", "New York City", "Pittsburgh", "Portland, Oregon"]

[[section.line]]
id = "outcomes"
text = "Courts upheld the bans in California, Chicago and New York City; Chicago then repealed its ban, and a court order kept New York's from being enforced."
sources = ["ca-court-2017", "ca-court-2022", "chicago-court-2007", "chicago-repeal", "nyc-court-2026", "pittsburgh-law", "portland-law"]

[section.line.visual]
kind = "list"
source = "chicago-repeal"
items = ["California: upheld in court", "Chicago: upheld, then repealed in 2008", "New York City: upheld, but not enforced", "Pittsburgh: took effect in 2023", "Portland, Oregon: takes effect December 31"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "no-bird-farms"
text = "The Chief Financial Officer knows of no bird farms in the District."
sources = ["fiscal"]

[section.line.visual]
kind = "illustration"
name = "city-storefronts"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "bans"
text = "Initiative 86 would ban the force-feeding, and selling the products or bringing them in for business."
sources = ["guide", "formulation"]

[section.line.visual]
kind = "page"
source = "guide"
highlight = ["Ban the sale or distribution"]

[[section.line]]
id = "fines"
text = "From July 2027, restaurants, stores and others breaking the ban could be fined $1,000 to $5,000 a day."
sources = ["fiscal", "formulation"]

[section.line.visual]
kind = "illustration"
name = "inspection-clipboard"

[[section]]
id = "fiscal"
heading = "What the official estimate says"

[[section.line]]
text = "The Chief Financial Officer estimates a cost of $314,000 over four years, less than 1 percent of any year's local spending."
sources = ["fiscal", "budget"]

[section.line.visual]
kind = "bars"
title = "Yearly cost of Initiative 86, dollars"
source = "fiscal"
unit = "thousand"
labels = ["FY 2026", "FY 2027", "FY 2028", "FY 2029"]
values = [0, 109, 101, 104]

[[section.line]]
text = "Carrying out the ban waits until its cost is budgeted."
sources = ["fiscal"]

[[section]]
id = "yes"
heading = "Why some vote yes"
