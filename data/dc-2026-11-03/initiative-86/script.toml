# The questions a first-time DC voter is left with (STANDARD.md rule
# 10.1), each with the lines that answer it or marked as answered by no
# official source.

[[question]]
ask = "Has anywhere else done this, and what happened?"
lines = ["california", "chicago", "new-york-city", "pittsburgh-portland"]

[[question]]
ask = "Who would this affect?"
lines = ["no-bird-farms", "bans", "fines"]

[[question]]
ask = "How many restaurants and stores in the District sell these products?"
unanswered = true
