# Precedent (STANDARD.md section 10, rule 1.2): other governments' official
# records of a similar law, of kind precedent-record, citable only in a
# background section. sources/precedent/README.md quotes the passage behind
# each fact and lists what no official record confirmed. The script
# describes California's law, the one archived law that, like Initiative
# 86, bans the force-feeding itself as well as sales (none bans importing,
# as Initiative 86 does); the city sales bans do not fit the length budget
# beside it (script.toml's header). The other archived records (New York City,
# Chicago, Pittsburgh, Portland, Oregon; the Supreme Court dockets) are not
# listed, since the video's page lists every source here as one it used.

[[source]]
id = "ca-law"
kind = "precedent-record"
publisher = "California State Legislature, Senate Bill 1520 (2004), Force fed birds, chaptered text, Statutes of 2004, Chapter 904"
credit = "California Statutes of 2004, Chapter 904"
url = "https://www.leginfo.ca.gov/pub/03-04/bill/sen/sb_1501-1550/sb_1520_bill_20040929_chaptered.html"
file = "sources/precedent/ca-sb1520-2004-chaptered.html"
retrieved = "2026-10-28"

