# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; the yearly limits on growth in fair cash value today and as
# the measure would set them; the senior freeze today and how the
# measure would change it; what the ballot title says it costs; the two
# sides; what a vote does.
#
# The card quotes the Attorney General's Final Ballot Title: the
# question as title, the designation as origin, the whole paragraph as
# summary, and the choice lines as printed. The choice lines say nothing
# of what a vote does, so the vote lines take their two meanings from
# the summary's "Currently" and "If approved" sentences, one highlight
# each.
#
# The ballot title lists five income bands and rates for seniors; the
# script gives only their shape (no increase at or below the median
# income, up to 1.75 percent above it), as the handoff asks, and leaves
# the table to the card. The rule that the limits do not apply when a
# property is sold or improved is unchanged and left out.
#
# Fiscal: the title says the state impact is unknown; no amount exists,
# so none is implied and rule 6.5 has nothing to scale.
#
# Oklahoma publishes no official arguments for or against a state
# question, so both sides are filed = false and each says so once, in
# the same number of words. No person is named. "Property's", "area's"
# and "senior's" are not narrated (each sounds like its plural).

contest = "ok-2026-11-03-state-question-847"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-title"
number = "847"
title = "Shall the proposal be approved?"
origin = "State Question 847, Legislative Referendum 381"
summary = "This measure amends article 10, sections 8B and 8C of the Oklahoma Constitution. Currently, section 8B limits annual growth in fair cash value to 5% for most real property or 3% for homesteads and agricultural land. If approved, the measure would limit annual growth in fair cash value for tax year 2027 and after to 4% for most real property or 1.75% for homesteads and agricultural land. Currently, section 8C prohibits any increase in fair cash value of homestead property for persons age sixty-five (65) or older whose income does not exceed certain limits, sometimes referred to as the “senior freeze.” Instead of prohibiting any increase in fair cash value for these homesteads, there would be an annual limit of 1.75%. The measure eliminates the income cap on gross household income to qualify for the senior freeze. If approved, the annual limit on an increase in fair cash value would be tied to how much gross household income the homestead owner had in the preceding year. If a homeowner’s gross household income from the previous year was at or below the median income for their county or area (as determined by the U.S. Department of Housing and Urban Development’s estimated median income amount for the county or metropolitan statistical area), a homeowner’s homestead fair cash value cannot be increased. If the income amount was in excess of certain thresholds, the limit on increases in fair cash value for homesteads owned by persons age 65 or older could be 0.35% (income over 100% up to 120%); 0.7% (income over 120% up to 140%); 1.05% (income over 140% up to 160%); 1.4% (income over 160% up to 180%); or 1.75% (income over 180%). If passed, this measure would have a fiscal impact on the state, but the exact impact is unknown."
yes = "For the proposal – YES"
no = "Against the proposal – NO"

