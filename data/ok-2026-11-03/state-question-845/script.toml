# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; what the commission does; how its members are chosen today;
# who would choose them; who could serve; what the ballot title says it
# costs; the two sides; what a vote does.
#
# The card quotes the CLEAN version of the Attorney General's corrected
# Final Ballot Title (sources.toml): the question as title, the
# designation as origin, the whole paragraph as summary, and the choice
# lines as printed. The choice lines say nothing of what a vote does, so
# the vote lines take their two meanings from the summary's "Currently"
# and "If approved" sentences, one highlight each.
#
# Today's rules are told as the ballot title tells them (districts as
# constituted in 1967). The title's changes to terms and to filling
# vacancies are left out for length.
#
# Oklahoma publishes no official arguments for or against a state
# question, so both sides are filed = false and each says so once, in
# the same number of words. No person is named. "Commission's" and
# "Governor's" are not narrated (each sounds like its plural).

contest = "ok-2026-11-03-state-question-845"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-title"
number = "845"
title = "Shall the proposal be approved?"
origin = "State Question 845, Legislative Referendum 379"
summary = "This measure amends article 7-B, section 3 of the Oklahoma Constitution, changing the Judicial Nominating Commission’s structure. Currently appointments are based on congressional districts as constituted in 1967. If approved, appointments to the fifteen-member Commission will be as follows: 1) Governor appoints six members, including one from each congressional district as of the time of their appointment; 2) the Oklahoma Bar Association appoints six members, including one from each congressional district as of the date of selection; and 3) no less than eight members select three at-large members. The measure will permit any number of the commissioners to be licensed attorneys in Oklahoma or another state. The prohibition against immediate family members from practicing law will be removed. The measure changes terms so that at-large commissioners would serve a two-year term, and all other commissioners would serve a six-year term. Additionally, it removes restrictions on political party membership for members appointed by the Governor and at-large members. The measure also permits a commissioner to succeed himself or herself. Vacancies will be filled in the same manner as a commissioner is appointed or selected for the remainder of the relevant term. This measure will not have a fiscal impact."
yes = "For the proposal – YES"
no = "Against the proposal – NO"

