sources = ["text"]

[section.line.visual]
kind = "illustration"
name = "court-gavel"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "The amendment would require nonpartisan elections for all probate judges too."
sources = ["booklet", "text"]

[section.line.visual]
kind = "page"
source = "booklet"
highlight = ["all probate judges shall be elected in nonpartisan elections"]

[[section.line]]
text = "Other judges would still be chosen as they were in 1983, unless local law changes that."
