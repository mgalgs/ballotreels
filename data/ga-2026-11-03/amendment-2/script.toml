# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; where probate courts sit; which judges the constitution
# elects on a nonpartisan basis; what Amendment 2 would add, and which
# judges it leaves as they are; what the booklet says about cost; the
# two sides; what a vote does.
#
# The card quotes the Secretary of State's booklet, page 7: the ballot
# question as its title, the Constitutional Amendments Publication
# Board's short caption as its origin, and the Summary's first sentence
# (the rest names the article and paragraph amended). The booklet prints
# no "a YES vote means" lines and no fiscal statement, so the card has
# neither, and the vote lines take their two meanings from the summary
# and the ballot question.
#
# The sources do not say how probate judges are elected today or what a
# nonpartisan election is, so no line says either; the "today" line
# names only the judges the revised paragraph elects on a nonpartisan
# basis besides probate judges. The no vote is said as the constitution
# gaining no such requirement, not as any judge's election staying
# partisan.
#
# Fiscal: the booklet prints no cost estimate, and no fiscal note
# exists. Georgia publishes no official arguments for or against an
# amendment, so both sides are filed = false and each says so once, in
# the same number of words.

contest = "ga-2026-11-03-amendment-2"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "booklet"
number = "2"
title = "Shall the Constitution of Georgia be amended so as to require that all probate court judges be elected in nonpartisan elections?"
origin = "Provides for the nonpartisan election of all probate court judges."
summary = "This proposal provides that all probate judges shall be elected in nonpartisan elections."

[[section]]
id = "what"
heading = "Amendment 2"

[[section.line]]
text = "Amendment 2 is about how Georgia elects probate court judges."
sources = ["booklet"]

[section.line.visual]
kind = "page"
source = "booklet"
highlight = ["probate court judges"]

[[section]]
id = "background"
heading = "Probate courts"

[[section.line]]
text = "Each Georgia county has a probate court, and the office of its judge keeps these amendments on file for the public."
