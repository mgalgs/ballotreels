# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; that the constitution has no such fund today; what Amendment
# 3 would let the General Assembly do: create the fund, dedicate
# existing revenues to it, spend it only on 9-1-1 systems, and keep its
# money from lapsing; what the booklet says about cost; the two sides;
# what a vote does.
#
# The card quotes the Secretary of State's booklet, page 7: the ballot
# question as its title, the Constitutional Amendments Publication
# Board's short caption as its origin, and the Summary's first sentence
# (the rest names the article and paragraph amended). The booklet prints
# no "a YES vote means" lines and no fiscal statement, so the card has
# neither, and the vote lines are said as the fund being added to the
# constitution or left out of it: the sources do not say what the
# General Assembly could do without the amendment.
#
# The amendment names no dollar amount and no new tax; the revenues are
# "certain existing revenues", as the ballot question says. No dollar
# figure appears, so none needs a scale. No fiscal note exists.
#
# Georgia publishes no official arguments for or against an amendment,
# so both sides are filed = false and each says so once, in the same
# number of words.

contest = "ga-2026-11-03-amendment-3"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "booklet"
number = "3"
title = "Shall the Constitution of Georgia be amended so as to authorize the General Assembly to dedicate certain existing revenues, including revenues reallocated by law, to a nonlapsing fund to be used exclusively for the expansion, maintenance, and operation of emergency 9-1-1 systems in this state?"
origin = "Authorizes creation of Georgia Next Generation 9-1-1 Fund for 9-1-1 systems expansion, maintenance, and operation."
summary = "This proposal authorizes the General Assembly to provide by general law for the creation of the Georgia Next Generation 9-1-1 Fund."

