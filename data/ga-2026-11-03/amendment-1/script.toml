# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; how conservation use land is taxed, and what owners promise
# in return; the acreage ceiling today and under Amendment 1; what the
# official documents say about cost; the two sides; what a vote does.
#
# The card quotes the Secretary of State's booklet, page 7: the ballot
# question as its title, the Constitutional Amendments Publication
# Board's short caption as its origin, and the Summary. The booklet
# prints no "a YES vote means" lines and no fiscal statement, so the
# card has neither, and the vote lines take their two meanings from the
# summary's "from 2,000 acres to 4,000 acres". The ballot question's
# "for the purpose of protecting family farmland" is quoted on the card
# only; no line narrates it.
#
# Fiscal: the booklet prints no cost estimate; the Department of
# Community Affairs' local fiscal note says only that none could be
# performed with current data, and the line says no more than that. No
# dollar figure appears, so none needs a scale.
#
# Georgia publishes no official arguments for or against an amendment,
# so both sides are filed = false and each says so once, in the same
# number of words.

contest = "ga-2026-11-03-amendment-1"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "booklet"
number = "1"
title = "Shall the Constitution of Georgia, for the purpose of protecting family farmland, be amended so as to increase the maximum acreage to qualify for assessment and taxation as a bona fide conservation use property from 2,000 acres to 4,000 acres?"
origin = "Increases the maximum qualifying acreage for assessment and taxation as bona fide conservation use property."
summary = "This proposal increases the maximum acreage to qualify for assessment and taxation as a bona fide conservation use property from 2,000 acres to 4,000 acres."

[[section]]
id = "what"
heading = "Amendment 1"

[[section.line]]
text = "Amendment 1 is about farm and timber land that Georgia taxes as conservation use property."
sources = ["booklet", "text"]

[section.line.visual]
kind = "page"
source = "booklet"
highlight = ["bona fide conservation use property"]

[[section]]
id = "background"
heading = "How conservation use works"

[[section.line]]
text = "Such land is taxed on a formula that includes its current use and yearly productivity."
sources = ["text"]

[section.line.visual]
kind = "illustration"
name = "farm-and-timber-land"

[[section.line]]
text = "Owners promise to keep the land in that use; breaking the promise within ten years means repaying the tax savings."
sources = ["text"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Today, the acreage ceiling for one owner is 2,000 acres."
sources = ["booklet", "text"]

[section.line.visual]
kind = "bars"
title = "Most acres one owner can qualify"
source = "booklet"
unit = "acres"
labels = ["Today", "Under Amendment 1"]
values = [2000, 4000]

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "The amendment would raise the ceiling to 4,000 acres."
sources = ["booklet", "text"]

[section.line.visual]
kind = "page"
source = "booklet"
highlight = ["from 2,000 acres to 4,000 acres"]

[[section]]
id = "fiscal"
heading = "What the official documents say"

[[section.line]]
text = "The state's amendment booklet does not include a cost estimate for the amendment."
sources = ["booklet"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"
stamp = "None reported"

[[section.line]]
text = "The Department of Community Affairs said current data did not allow a local fiscal note."
sources = ["fiscal-note"]

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"
filed = false

[[section.line]]
text = "The state's booklet includes no official argument for the amendment."
sources = ["booklet"]

[section.line.visual]
kind = "list"
source = "booklet"
items = ["No official argument for was published"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
