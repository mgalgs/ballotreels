# Contest index for the 2026-11-03 Louisiana general election
# (docs/ARCHITECTURE.md). One [[contest]] entry per contest on the
# ballot. `number` is a measure's ballot designation (a string). The
# Secretary of State's "Statements of Proposed Constitutional
# Amendments" numbers the ten amendments 1 to 10 in ballot order; titles
# pair "Amendment" and that number with the amendment's "Abstract" as
# the sheet prints it (it ends with no period).

[election]
id = "la-2026-11-03"
state = "ocd-division/country:us/state:la"
title = "Louisiana General Election, November 3, 2026"

[[contest]]
id = "la-2026-11-03-amendment-1"
kind = "measure"
division = "ocd-division/country:us/state:la"
title = "Amendment 1: Allows a one-time transfer of a property tax exemption for the surviving spouse of a disabled veteran"
number = "1"

[[contest]]
id = "la-2026-11-03-amendment-2"
kind = "measure"
division = "ocd-division/country:us/state:la"
title = "Amendment 2: Authorizes a local taxing authority to levy a lower millage rate without losing its ability to adjust to the prior year’s maximum authorized millage rate"
number = "2"

[[contest]]
id = "la-2026-11-03-amendment-3"
kind = "measure"
division = "ocd-division/country:us/state:la"
title = "Amendment 3: Prohibits post-conviction bail for a defendant who is convicted of an aggravated offense against a victim who is a minor"
number = "3"

[[contest]]
id = "la-2026-11-03-amendment-4"
kind = "measure"
division = "ocd-division/country:us/state:la"
title = "Amendment 4: Places a lifetime term limit on a person who has served as governor for more than one and one-half terms"
number = "4"

[[contest]]
id = "la-2026-11-03-amendment-5"
kind = "measure"
division = "ocd-division/country:us/state:la"
title = "Amendment 5: Authorizes a state retirement system receiving nonrecurring state monies to apply those monies to any of its outstanding unfunded accrued liability (UAL) rather than its oldest UAL first"
number = "5"

[[contest]]
id = "la-2026-11-03-amendment-6"
kind = "measure"
division = "ocd-division/country:us/state:la"
title = "Amendment 6: Authorizes extension of an additional property tax exemption for owners who are 65 or older"
number = "6"

[[contest]]
id = "la-2026-11-03-amendment-7"
kind = "measure"
division = "ocd-division/country:us/state:la"
title = "Amendment 7: Authorizes the use of public funds to identify, inventory, remove, or replace certain water lines on property owned by utility customers"
number = "7"

[[contest]]
id = "la-2026-11-03-amendment-8"
kind = "measure"
division = "ocd-division/country:us/state:la"
title = "Amendment 8: Prohibits expropriation of property by a foreign adversary or an agent of a foreign adversary"
number = "8"

[[contest]]
id = "la-2026-11-03-amendment-9"
kind = "measure"
division = "ocd-division/country:us/state:la"
title = "Amendment 9: Increases the income limit for qualifying for the special property tax assessment level from $100,000, to be adjusted annually for inflation beginning in 2026, to $150,000, to be adjusted annually for inflation beginning in 2028"
number = "9"

[[contest]]
id = "la-2026-11-03-amendment-10"
kind = "measure"
division = "ocd-division/country:us/state:la"
title = "Amendment 10: Authorizes an exemption from property taxes for blighted or derelict property that has been rehabilitated and requires the legislature to enact laws relative to implementation and administration of the exemption"
number = "10"
