# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; how the exemption works for surviving spouses today; what
# Amendment 1 would let them do, and its limit; what the Legislative
# Fiscal Office says; the two sides; what a vote does.
#
# The card quotes the Secretary of State's "Statements of Proposed
# Constitutional Amendments": the ballot question whole, the Abstract,
# and the "Proposed Constitutional Amendment" paragraph on the transfer.
# The sheet prints no "a yes vote means" lines, so the card has none, and
# the vote lines take their two meanings from the ballot question.
#
# Fiscal: the Legislative Fiscal Office's note expects revenue may fall
# but "the aggregate revenue impact is not expected to be significant".
# Its $168,000 is the value of today's exemption for all 229 surviving
# spouses, not the amendment's effect, so the script gives the count and
# the office's expectation that few will move, and no dollar figure. The
# Secretary of State's ballot cost paragraph is the election's cost, not
# the amendment's.
#
# Louisiana publishes no official arguments for or against an
# amendment, so both sides are filed = false and each says so once, in
# the same number of words. No person is named.

contest = "la-2026-11-03-amendment-1"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "statements"
number = "1"
title = "Do you support an amendment to allow the surviving spouse of a deceased veteran with a service-connected disability, who receives the additional property tax exemption, to make a one-time transfer of the additional property tax exemption to a subsequent qualifying property? (Effective January 1, 2027) (Amends Article VII, Section 21(K)(1))"
origin = "Allows a one-time transfer of a property tax exemption for the surviving spouse of a disabled veteran"
summary = "Proposed Constitutional Amendment provides that once the surviving spouse of a deceased disabled veteran with a service-connected disability is eligible for and has taken the additional exemption, if the surviving spouse then acquires a different property that qualifies for the homestead exemption, the surviving spouse shall be entitled to a one-time transfer of the exemption on that subsequent homestead; however, the exemption shall be limited in value to the amount of the additional exemption claimed on the prior homestead in the last year for which it was claimed."

[[section]]
id = "what"
heading = "Amendment 1"

[[section.line]]
text = "Amendment 1 is about a tax exemption for surviving spouses of disabled veterans."
sources = ["statements"]

[section.line.visual]
kind = "page"
source = "statements"
highlight = ["surviving spouse of a deceased veteran with a service-connected disability"]

[[section]]
