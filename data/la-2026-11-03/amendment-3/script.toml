# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; the right to bail today, and bail after a conviction; what
# Amendment 3 would change; what the Legislative Fiscal Office says; the
# two sides; what a vote does.
#
# The card quotes the Secretary of State's "Statements of Proposed
# Constitutional Amendments": the ballot question whole, the Abstract,
# and the "Proposed Constitutional Amendment" paragraph. The sheet prints
# no "a yes vote means" lines, so the card has none, and the vote lines
# take their two meanings from the card's own words.
#
# The sheet lists the offenses R.S. 15:541 calls aggravated; the
# narration does not, and says "certain aggravated offenses against a
# minor", as the sheet's own summary words allow.
#
# Fiscal: the Legislative Fiscal Office's note expects "an indeterminable
# increase in Local Funds expenditures", as those convicted stay in
# parish jails; it gives no dollar figure, so none needs a scale. Its
# paragraph on the Secretary of State's ballot costs is the election's
# cost, not the amendment's.
#
# Louisiana publishes no official arguments for or against an
# amendment, so both sides are filed = false and each says so once, in
# the same number of words. No person is named.

contest = "la-2026-11-03-amendment-3"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "statements"
number = "3"
title = "Do you support an amendment to prohibit a defendant from being released on any post-conviction bail if the defendant is convicted of an aggravated offense against a minor child? (Adds Article I, Section 18(C))"
origin = "Prohibits post-conviction bail for a defendant who is convicted of an aggravated offense against a victim who is a minor"
summary = "Proposed Constitutional Amendment provides an additional exception to the right to bail for a person convicted of an aggravated offense as defined by R.S. 15:541 when the offense is committed against a victim who is a minor."

[[section]]
id = "what"
heading = "Amendment 3"

[[section.line]]
text = "Amendment 3 is about bail for people convicted of certain aggravated offenses against a minor."
