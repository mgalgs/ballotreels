# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; what the special assessment level does and for whom; the
# income limit today; what Amendment 9 would change, and who absorbs the
# lost revenue; what the Legislative Fiscal Office says; the two sides;
# what a vote does.
#
# The card quotes the Secretary of State's "Statements of Proposed
# Constitutional Amendments": the ballot question whole, the Abstract,
# and the "Proposed Constitutional Amendment" paragraph on the new limit.
# The sheet prints no "a yes vote means" lines, so the card has none, and
# the vote lines take their two meanings from the card's own words. The
# income limits are per household (exempt from STANDARD rule 6.5).
#
# Amendment 9 is Act 220 of the 2025 Regular Session. The Legislative
# Fiscal Office's note on it contradicts itself: its subject line
# ("Removes the AVT special assessment income cap") and some sentences
# describe removing the limit, while its summary of the enrolled bill
# says the limit rises to $150,000, which is what the Act does. The
# script cites only that summary and the note's bottom line (revenue
# "can only serve to decrease"; its magnitude "cannot be determined").
#
# digest-hb300-reengrossed.pdf is not cited: the résumé digest describes
# the Act as enacted.
#
# Louisiana publishes no official arguments for or against an
# amendment, so both sides are filed = false and each says so once, in
# the same number of words. No person is named.

contest = "la-2026-11-03-amendment-9"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "statements"
number = "9"
title = "Do you support an amendment to increase the maximum amount of income a person may receive and still qualify for the special assessment level for residential property receiving the homestead exemption? (Effective January 1, 2027) (Amends Article VII, Section 18(G)(1)(a)(ii))"
origin = "Increases the income limit for qualifying for the special property tax assessment level from $100,000, to be adjusted annually for inflation beginning in 2026, to $150,000, to be adjusted annually for inflation beginning in 2028"
summary = "Proposed Constitutional Amendment extends eligibility, beginning with tax year 2027, to qualified persons whose adjusted gross income for the year prior to an application for the special assessment level is $150,000 or less, with the income limit being adjusted annually for inflation beginning with the 2028 tax year."

[[section]]
id = "what"
heading = "Amendment 9"

[[section.line]]
text = "Amendment 9 is about the income limit for the special assessment level on homes."
sources = ["statements"]

[section.line.visual]
kind = "page"
source = "statements"
highlight = ["special assessment level"]

[[section]]
id = "background"
heading = "The special assessment level"

[[section.line]]
text = "For homeowners 65 and older, some disabled owners and others, the special assessment level keeps the assessment of the home from rising."
sources = ["statements", "digest"]

[section.line.visual]
kind = "illustration"
name = "homestead"

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Today, an owner also needs adjusted gross income of $100,000 or less, adjusted for inflation from 2026."
sources = ["statements", "digest"]

[section.line.visual]
kind = "illustration"
name = "income-taxes"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "The amendment would raise the limit to $150,000 from 2027, adjusted for inflation from 2028."
sources = ["statements", "act"]

[section.line.visual]
kind = "bars"
title = "Income limit for the special assessment level, dollars"
source = "statements"
unit = "thousand"
labels = ["Today, before inflation", "From 2027"]
values = [100, 150]

[[section.line]]
text = "Taxing authorities would absorb the lost revenue, not other taxpayers."
sources = ["statements", "digest"]

[[section]]
id = "fiscal"
heading = "What the fiscal note says"

[[section.line]]
text = "The Legislative Fiscal Office says the change can only decrease local property tax revenue, by an amount that cannot be determined."
sources = ["fiscal-note"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"
filed = false

[[section.line]]
text = "Louisiana publishes no official argument for the amendment."
sources = ["statements"]

[section.line.visual]
kind = "list"
source = "statements"
items = ["No official argument for was published"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "Louisiana publishes no official argument against the amendment."
sources = ["statements"]

[section.line.visual]
kind = "list"
source = "statements"
items = ["No official argument against was published"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote raises the income limit to $150,000."
sources = ["statements"]

[section.line.visual]
kind = "page"
source = "statements"
highlight = ["to $150,000"]

[[section.line]]
text = "A no vote keeps the $100,000 limit, adjusted for inflation."
