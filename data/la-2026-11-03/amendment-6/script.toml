# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; the homestead exemption today; that a parish or municipality
# could offer the new exemption only after its own voters approve it;
# how the exemption would grow with age; who absorbs the lost revenue;
# what the Legislative Fiscal Office says; the two sides; what a vote
# does.
#
# The card quotes the Secretary of State's "Statements of Proposed
# Constitutional Amendments": the ballot question whole (it runs across
# one of the sheet's column breaks; Ballot.card_column_breaks), the
# Abstract, and the "Proposed Constitutional Amendment" paragraph on the
# local election. The sheet prints no "a yes vote means" lines, so the
# card has none, and the vote lines take their two meanings from the
# card's own words.
#
# Every line about who would benefit says the exemption needs a second,
# local vote first. The chart's amounts are per home (exempt from
# STANDARD rule 6.5).
#
# Fiscal: the Legislative Fiscal Office's note expects "an indeterminable
# but significant decrease in ad valorem tax revenues to local taxing
# authorities to the extent that the exemptions are approved through
# local elections". Its $630 a year and $19.4 million are illustrations,
# not estimates, and are not used.
#
# Amendments 6 and 10 both add Article VII, Section 21(P); neither Act
# says how the two would be designated if both pass, and the script does
# not speculate.
#
# Louisiana publishes no official arguments for or against an
# amendment, so both sides are filed = false and each says so once, in
# the same number of words. No person is named.

contest = "la-2026-11-03-amendment-6"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "statements"
number = "6"
title = "Do you support an amendment to authorize parishes and municipalities to extend an additional property tax exemption for property subject to the homestead exemption that is owned and occupied by a person who is at least sixty-five years of age and who qualifies for the special assessment level? (Effective January 1, 2028) (Adds Article VII, Section 21(P))"
origin = "Authorizes extension of an additional property tax exemption for owners who are 65 or older"
summary = "Proposed Constitutional Amendment authorizes a parish or a municipality to implement the additional exemption if it is approved by a majority of the electors of the parish or municipality voting at an election called for that purpose."

[[section]]
id = "what"
heading = "Amendment 6"

[[section.line]]
text = "Amendment 6 is about an extra tax exemption for homeowners 65 and older, if local voters approve."
sources = ["statements"]

[section.line.visual]
kind = "page"
source = "statements"
highlight = ["additional property tax exemption"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Today, the homestead exemption covers the first $75,000 of market value."
sources = ["statements", "digest"]

[section.line.visual]
kind = "illustration"
name = "homestead"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
text = "A parish or municipality could offer the new exemption only after its own voters approve it."
sources = ["statements", "act"]

[section.line.visual]
kind = "page"
source = "statements"
highlight = ["approved by a majority of the electors of the parish or municipality"]

[[section.line]]
text = "Where approved, owners at the special assessment level would get an exemption that grows with age, from $60,000 to $300,000 of market value."
sources = ["statements", "digest"]

[section.line.visual]
kind = "bars"
title = "Added exemption where locally approved, by age, dollars of market value"
source = "statements"
unit = "thousand"
labels = ["65 to 68", "69 to 72", "73 to 76", "77 to 80", "81 and up"]
values = [60, 120, 180, 240, 300]

[[section.line]]
text = "Taxing authorities would absorb the lost revenue, not other taxpayers."
sources = ["statements", "digest"]

[[section]]
id = "fiscal"
heading = "What the fiscal note says"

[[section.line]]
text = "The Legislative Fiscal Office expects a significant drop in local property tax revenue where voters approve, by an amount it cannot determine."
sources = ["fiscal-note"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"
filed = false

[[section.line]]
text = "Louisiana publishes no official argument for the amendment."
sources = ["statements"]

[section.line.visual]
kind = "list"
source = "statements"
items = ["No official argument for was published"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "Louisiana publishes no official argument against the amendment."
sources = ["statements"]

[section.line.visual]
kind = "list"
source = "statements"
items = ["No official argument against was published"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote lets parishes and municipalities offer the exemption after a local vote."
sources = ["statements"]

[section.line.visual]
kind = "page"
source = "statements"
highlight = ["authorize parishes and municipalities to extend an additional property tax exemption"]

[[section.line]]
