# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; how property tax exemptions are listed today; what
# Amendment 10 would add, and what the Legislature would decide later;
# what the Legislative Fiscal Office says; the two sides; what a vote
# does.
#
# The card quotes the Secretary of State's "Statements of Proposed
# Constitutional Amendments": the ballot question whole, the Abstract,
# and the "Proposed Constitutional Amendment" paragraph adding the
# exemption. The sheet prints no "a yes vote means" lines, so the card
# has none, and the vote lines take their two meanings from the card's
# own words.
#
# Fiscal: the Legislative Fiscal Office's note says the effect on local
# property tax revenue "is indeterminable" and depends on how many
# parishes adopt the exemption and how much rehabilitation follows; it
# gives no dollar figure, so none needs a scale.
#
# Amendments 6 and 10 both add Article VII, Section 21(P); neither Act
# says how the two would be designated if both pass, and the script does
# not speculate.
#
# Louisiana publishes no official arguments for or against an
# amendment, so both sides are filed = false and each says so once, in
# the same number of words. No person is named.

contest = "la-2026-11-03-amendment-10"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "statements"
number = "10"
title = "Do you support an amendment to allow property tax exemptions for blighted or derelict properties that have been rehabilitated, and to require the legislature to enact laws providing for administration of these exemptions? (Effective January 1, 2027) (Adds Article VII, Section 21(P))"
origin = "Authorizes an exemption from property taxes for blighted or derelict property that has been rehabilitated and requires the legislature to enact laws relative to implementation and administration of the exemption"
summary = "Proposed Constitutional Amendment retains the present constitution and adds an optional property tax exemption for blighted or derelict property that has been rehabilitated."

