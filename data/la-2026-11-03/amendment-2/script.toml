# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; what a millage rate is and how rates reset after each
# reassessment; the use-it-or-lose-it rule today; what Amendment 2 would
# change; what the Legislative Fiscal Office says; the two sides; what a
# vote does.
#
# The card quotes the Secretary of State's "Statements of Proposed
# Constitutional Amendments": the ballot question whole, the Abstract,
# and the "Proposed Constitutional Amendment" paragraph. The sheet prints
# no "a yes vote means" lines, so the card has none, and the vote lines
# take their two meanings from the card's own words.
#
# Fiscal: the Legislative Fiscal Office's note says the amendment "may
# result in foregone ad valorem tax revenues" and "the extent of any
# decrease is indeterminable"; it gives no dollar figure, so none needs a
# scale. Its paragraph on the Secretary of State's ballot costs is the
# election's cost, not the amendment's.
#
# Louisiana publishes no official arguments for or against an
# amendment, so both sides are filed = false and each says so once, in
# the same number of words. No person is named.

contest = "la-2026-11-03-amendment-2"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "statements"
number = "2"
title = "Do you support an amendment to allow a local taxing authority to continue to levy a lower millage rate without losing its ability to adjust to the maximum authorized millage rate from a prior year’s reassessment? (Effective January 1, 2027) (Amends Article VII, Section 23(C))"
origin = "Authorizes a local taxing authority to levy a lower millage rate without losing its ability to adjust to the prior year’s maximum authorized millage rate"
summary = "Proposed Constitutional Amendment allows a taxing authority to continue to levy a lower millage rate without subsequently losing its ability to adjust to the maximum authorized millage rate from a prior year’s reassessment."

[[section]]
id = "what"
heading = "Amendment 2"

[[section.line]]
