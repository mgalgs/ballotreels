heading = "Where the money goes"

[[section.line]]
text = "At least 25 percent of nonrecurring money in the official state forecast must go to state retirement systems."
sources = ["statements", "digest"]

[section.line.visual]
kind = "illustration"
name = "set-aside-funds"

[[section]]
id = "today"
heading = "Today"

[[section.line]]
text = "Today, each system must apply the money to its oldest unfunded accrued liability first."
