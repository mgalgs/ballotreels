# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; where nonrecurring state money goes today, and the
# oldest-first rule; what Amendment 5 would change; what the Legislative
# Auditor's actuarial note says; the two sides; what a vote does.
#
# The card quotes the Secretary of State's "Statements of Proposed
# Constitutional Amendments": the ballot question whole, the Abstract,
# and the "Proposed Constitutional Amendment" paragraph. The sheet prints
# no "a yes vote means" lines, so the card has none, and the vote lines
# take their two meanings from the card's own words.
#
# Fiscal: the bill's fiscal statement is the Legislative Auditor's
# actuarial note (its state-government part prepared by the Legislative
# Fiscal Office): it "is not expected to have any measurable effects on
# retirement related fiscal costs and revenues during the five-year
# measurement period". It gives no dollar figure, so none needs a scale.
# Its paragraph on the Secretary of State's ballot costs is the
# election's cost, not the amendment's.
#
# Louisiana publishes no official arguments for or against an
# amendment, so both sides are filed = false and each says so once, in
# the same number of words. No person is named.

contest = "la-2026-11-03-amendment-5"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "statements"
number = "5"
title = "Do you support an amendment to authorize a state retirement system to apply any nonrecurring state monies it receives to any of its unfunded accrued liability rather than requiring application to its oldest unfunded accrued liability? (Amends Article VII, Section 10(D)(2)(b)(iii))"
origin = "Authorizes a state retirement system receiving nonrecurring state monies to apply those monies to any of its outstanding unfunded accrued liability (UAL) rather than its oldest UAL first"
summary = "Proposed Constitutional Amendment removes the requirement that a statewide retirement system apply nonrecurring monies received to its oldest unfunded accrued liability first."

[[section]]
id = "what"
heading = "Amendment 5"

[[section.line]]
text = "Amendment 5 is about nonrecurring state money paid to state retirement systems."
sources = ["statements"]

[section.line.visual]
