# Recipe E, 60 seconds, distilled: one claim per line. The chain: what
# the ballot asks; what the constitution says about the fund today; what
# the amendment would put in its place; separately, the payout law that
# takes effect only if it passes; that there is no cost estimate; the two
# sides; what a vote does, and what a blank does.
#
# The card quotes the Secretary of State's "Constitutional amendments"
# page: the title and question as the ballot prints them, and beside
# SUMMARY the page's "authorized by" line. Minnesota numbers no
# amendment, so the card has no number and draws no badge. The page
# prints no "yes means / no means" lines, so the card has none, and the
# vote lines say only what each vote does to the amendment, in the same
# few words.
#
# The ballot question's own claims ("increase the funding", "without
# raising individual income or property taxes") are the Legislature's
# wording: the opening line quotes the first as what the ballot asks, and
# no line repeats either in the narrator's voice. Today's rules are the
# words the session law marks deleted; the amendment's are the words the
# Attorney General's statement summarises. The constitutional change and
# the law that takes effect with it are kept in separate lines. The
# statement's 4.5 percent is a rule for the fund's yearly payout, not a
# cost, so it has no dollar scale.
#
# Fiscal: no cost estimate is printed, and no fiscal note exists for HF
# 3900. Minnesota publishes no official arguments for or against an
# amendment, so both sides are filed = false and each says so once, in
# the same number of words. The Attorney General's statement is the
# state's neutral description, not an argument for. No person or
# organisation is named.
#
# The blank-ballot line is the page's instruction ("Failure to vote on a
# constitutional amendment will have the same effect as voting no on the
# amendment"), the one Minnesota rule a voter is most likely not to know.

contest = "mn-2026-11-03-permanent-school-fund"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "sos-page"
title = "Increasing funding to school districts"
origin = "authorized by 2026 Laws of Minnesota Laws Chapter 114"
summary = "Shall the Minnesota Constitution be amended to increase the funding going to all school districts from the permanent school fund, which is a fund that supports school districts without raising individual income or property taxes, effective July 1, 2027?"

[[section]]
id = "what"
heading = "The constitutional amendment"

[[section.line]]
text = "The ballot asks whether to amend the constitution to increase the funding going to all school districts from the permanent school fund."
sources = ["sos-page", "session-law"]

[section.line.visual]
kind = "page"
source = "sos-page"
highlight = ["increase the funding going to all school districts from the permanent school fund"]

[[section]]
id = "today"
heading = "Today"

[[section.line]]
id = "today-rules"
text = "Today the constitution keeps the fund's principal inviolate forever, and sends its interest and dividends to districts."
sources = ["session-law", "ag-statement"]

[section.line.visual]
kind = "illustration"
name = "bank-vault"

[[section]]
id = "change"
heading = "What would change"

[[section.line]]
id = "amendment-rules"
text = "The amendment would have the fund pay districts yearly, preserving its purchasing power."
sources = ["ag-statement", "session-law", "sos-page"]

[section.line.visual]
kind = "illustration"
name = "amended-page"

[[section.line]]
text = "The fund could also pay administrative costs."
sources = ["ag-statement", "session-law", "sos-page"]

[[section.line]]
id = "payout-law"
text = "If the amendment passes, a separate law would pay 4.5 percent of the fund's three-year average value yearly."
sources = ["ag-statement", "session-law"]

[section.line.visual]
kind = "share"
title = "Fund's three-year average value"
source = "ag-statement"
unit = "%"
labels = ["Paid out each year, under the law"]
values = [4.5]

[[section]]
id = "fiscal"
heading = "What it would cost"

[[section.line]]
text = "The Secretary of State's constitutional amendments page does not include a cost estimate for the amendment."
sources = ["sos-page"]

[section.line.visual]
kind = "illustration"
name = "analyst-review"
stamp = "None reported"

[[section]]
id = "yes"
heading = "Why some vote yes"
side = "yes"
filed = false

[[section.line]]
text = "Minnesota publishes no official argument for the amendment."
sources = ["sos-page"]

[section.line.visual]
kind = "list"
source = "sos-page"
items = ["No official argument for was published"]

[[section]]
id = "no"
heading = "Why some vote no"
side = "no"
filed = false

[[section.line]]
text = "Minnesota publishes no official argument against the amendment."
sources = ["sos-page"]

[section.line.visual]
kind = "list"
source = "sos-page"
items = ["No official argument against was published"]

[[section]]
id = "vote"
heading = "What your vote means"

[[section.line]]
text = "A yes vote adopts the amendment and the payout law."
sources = ["sos-page", "ag-statement"]

[section.line.visual]
kind = "page"
source = "sos-page"

[[section.line]]
text = "A no vote keeps today's rules."
sources = ["sos-page", "ag-statement"]

[[section.line]]
id = "blank"
text = "Skipping the question has the same effect as voting no."
sources = ["sos-page"]

[section.line.visual]
kind = "illustration"
name = "ballot-one-question"

[[question]]
ask = "How much more money would school districts get?"
unanswered = true

[[question]]
ask = "What happens if I skip this question?"
lines = ["blank"]

[[question]]
ask = "What would the new law pay out each year?"
lines = ["payout-law"]
