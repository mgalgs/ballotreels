# Archived sources for Ohio State Issue 3, 2026-11-03 general election.
# Every id here may be cited by script.toml. `kind` must be one the
# standard allows (docs/STANDARD.md, section 1).
#
# The Ohio Ballot Board certifies an issue's ballot language and
# explanation, and the Secretary of State prints them with the arguments
# for and against and the full text in one report on the issue; each is
# also archived as filed. No fiscal statement exists: Ohio requires none
# for an amendment the General Assembly proposes by joint resolution.

[contest]
id = "oh-2026-11-03-issue-3"
election = "oh-2026-11-03"
division = "ocd-division/country:us/state:oh"
kind = "measure"
title = "State Issue 3: To Require Voters to Present Photo Identification in Order to Vote"

