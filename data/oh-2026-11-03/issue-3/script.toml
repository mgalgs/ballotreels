# Recipe E, 60 seconds, distilled: one claim per line. The chain: what it
# is about; where voter ID sits in Ohio's law today; what the amendment
# would require in person, which IDs count, the religious-objection
# alternative and voting by mail; that the report prints no cost
# estimate; one point per side; what a vote does.
#
# The card quotes the Ohio Ballot Board's certified ballot language: its
# title, the "This proposed amendment would" bullets as the summary, and
# its "YES"/"NO" lines. No fiscal statement exists for an amendment the
# General Assembly proposes, so the card has no fiscal quote and the
# fiscal section says only that the report prints no cost estimate, as
# Arizona's referrals do.
#
# Neutral lines keep to the ballot language's and explanation's terms;
# neither side's framing ("voter fraud", "voter suppression") is used
# outside its own section. That photo ID is already in state law is
# argued by both sides (supporters: no new burden; opponents: unneeded),
# so "today" says only that the constitution has no such section and
# that the explanation leaves the details to Ohio law. Each side gets
# its two most concrete points, in its own words, with equal words.

contest = "oh-2026-11-03-issue-3"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "ballot-language"
number = "3"
title = "TO REQUIRE VOTERS TO PRESENT PHOTO IDENTIFICATION IN ORDER TO VOTE"
origin = "Proposed by Joint Resolution of the General Assembly"
summary = "This proposed amendment would: • Require voters to present an approved form of government-issued photo identification in order to vote. • Allow state law to provide for an alternative method of verifying a voter’s identity for a voter who has a sincere religious objection to being photographed and, therefore, does not possess an approved form of government-issued photo identification. • Require that voters who do not vote in person provide an approved form of government-issued photo identification, unless the law authorizes those persons to vote by providing a signature and at least one other specified unique identifier. • Define approved forms of government-issued photo identification as an unexpired Ohio driver license or state identification card; a United States passport or passport card; or a United States military identification card, Ohio National Guard identification card, or United States Department of Veterans Affairs identification card."
yes = "A \"YES\" vote means approval of the amendment."
no = "A \"NO\" vote means disapproval of the amendment."

