# Recipe E, 60 seconds, distilled: one claim per line. The chain: what
# the question is about; how it got on the ballot; that it adds a new
# section to the constitution; what the section would prohibit, where,
# and which bodies it covers; that no cost estimate exists; the two
# sides; what a vote does.
#
# Wisconsin has no voter guide. The card quotes the Wisconsin Elections
# Commission's Type A Notice of Referendum: the question's title as its
# title, under the badge QUESTION 3, and the question as its summary, the
# words the ballot prints. The notice prints no "a yes vote means" lines,
# so the card has none, and the vote lines take their meanings from the
# question's words.
#
# What is prohibited is said only in the resolution's and the
# Legislative Reference Bureau's own terms, "discriminating against, or
# granting preferential treatment to", always together, and never in
# either side's labels. The bodies covered come from the section's own
# definition of "governmental entity". The section's exceptions (action
# needed to stay eligible for federal funds; bona fide qualifications
# based on sex) and its severability clause are left out for length.
#
# Fiscal: Wisconsin attaches no fiscal estimate to a joint resolution and
# the notice prints no cost; no dollar figure appears, so none needs a
# scale.
#
# Wisconsin publishes no official arguments for or against a referendum
# question, so both sides are filed = false and each says so once, in the
# same number of words.

contest = "wi-2026-11-03-question-3"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "notice"
number = "3"
title = "Governmental entity discrimination prohibited."
origin = "2025 Assembly Joint Resolution 102"
summary = "Shall section 27 of article I of the constitution be created to prohibit governmental entities in the state from discriminating against, or granting preferential treatment to, any individual or group on the basis of race, sex, color, ethnicity, or national origin in public employment, public education, public contracting, or public administration?"

