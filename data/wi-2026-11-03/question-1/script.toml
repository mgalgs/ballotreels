# Recipe E, 60 seconds, distilled: one claim per line. The chain: what
# the partial veto is; how the question got on the ballot; how the
# constitution limits the partial veto today; the limit the amendment
# would add, and that the old ones stay; that no cost estimate exists;
# the two sides; what a vote does.
#
# Wisconsin has no voter guide. The card quotes the Wisconsin Elections
# Commission's Type A Notice of Referendum: the question's title ("Partial
# veto.") as its title, under the badge QUESTION 1, and the question as
# its summary, the words the ballot prints. The notice prints no "a yes
# vote means" lines, so the card has none, and the vote lines take their
# meanings from the question's words.
#
# What changes is told in the Legislative Reference Bureau's terms. Its
# analysis also notes a 2020 state Supreme Court decision that further
# restricted the partial veto; the line is left out for length, and no
# governor and no past veto is named.
#
# Fiscal: Wisconsin attaches no fiscal estimate to a joint resolution and
# the notice prints no cost; no dollar figure appears, so none needs a
# scale.
#
# Wisconsin publishes no official arguments for or against a referendum
# question, so both sides are filed = false and each says so once, in the
# same number of words.

contest = "wi-2026-11-03-question-1"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "notice"
number = "1"
title = "Partial veto."
origin = "2025 Senate Joint Resolution 116"
summary = "Shall section 10 (1) (c) of article V of the constitution be amended to prohibit the governor, in exercising his or her partial veto authority, from creating or increasing or authorizing the creation or increase of any tax or fee?"

[[section]]
id = "what"
heading = "Question 1"

[[section.line]]
text = "Question 1 is about the partial veto, which lets the governor approve a spending bill in part."
sources = ["notice", "resolution", "lrb-analysis"]

[section.line.visual]
