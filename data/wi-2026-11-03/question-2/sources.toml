credit = "Wisconsin Legislature, 2025 Assembly Joint Resolution 10"
url = "https://docs.legis.wisconsin.gov/2025/related/enrolled/ajr10.pdf"
file = "sources/2025-ajr10-enrolled.pdf"
retrieved = "2026-10-27"

[[source]]
