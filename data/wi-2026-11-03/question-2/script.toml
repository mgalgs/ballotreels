# Recipe E, 60 seconds, distilled: one claim per line. The chain: what
# the question is about; how it got on the ballot; what the religious
# liberty section says today; the rule the amendment would add, and the
# emergencies it covers; that no cost estimate exists; the two sides;
# what a vote does.
#
# Wisconsin has no voter guide. The card quotes the Wisconsin Elections
# Commission's Type A Notice of Referendum: the question's title as its
# title, under the badge QUESTION 2, and the question as its summary, the
# words the ballot prints. The notice prints no "a yes vote means" lines,
# so the card has none, and the vote lines take their meanings from the
# question's words.
#
# What changes is told in the Legislative Reference Bureau's terms; "the
# state and local governments" says "the state or a political
# subdivision of the state" in plain words. Today's line quotes the
# section's opening words as the enrolled resolution prints them, and
# says nothing about how the section applies in an emergency today,
# which no source here states.
#
# Fiscal: Wisconsin attaches no fiscal estimate to a joint resolution and
# the notice prints no cost; no dollar figure appears, so none needs a
# scale.
#
# Wisconsin publishes no official arguments for or against a referendum
# question, so both sides are filed = false and each says so once, in the
# same number of words.

contest = "wi-2026-11-03-question-2"
template = "measure"
template_version = 2
standard_version = 2

[card]
source = "notice"
number = "2"
title = "Freedom to gather in places of worship during an emergency."
origin = "2025 Assembly Joint Resolution 10"
summary = "Shall section 18 of article I of the constitution, which deals with religious liberty, be amended to prohibit the state or a political subdivision of the state from ordering the closure of, or forbidding gatherings in, places of worship in response to a state of emergency, including a public health emergency?"

[[section]]
id = "what"
heading = "Question 2"

[[section.line]]
text = "Question 2 is about places of worship during a state of emergency."
sources = ["notice"]

[section.line.visual]
kind = "page"
source = "notice"
highlight = ["places of worship during an emergency"]

[[section]]
