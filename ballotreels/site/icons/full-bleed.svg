<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Square, no corner radius, mark inside the central 80%: the source of
       the apple-touch and manifest icons, whose platforms round or mask
       the corners themselves. -->
