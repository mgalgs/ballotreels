  <rect x="10.6" y="6.6" width="10.8" height="18.8" rx="2.4" fill="#fbf8ef"
        stroke="#2e2b27" stroke-width="1.9"/>
  <path d="M14 11.6 L19.6 16 L14 20.4 Z" fill="#e07b33" stroke="#e07b33"
        stroke-width="1.2" stroke-linejoin="round"/>
</svg>
