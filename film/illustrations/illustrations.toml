# The illustration library: pictures a script line can show when there is
# no data to chart (script kind "illustration", by name).
#
# Every entry is generated once with the style prompt below plus its
# subject, reviewed by a person, and checked in. Keep to the style's rules
# when adding one: objects and places only, no people, no text, no flags.

style = "Coloured pencil illustration on plain off-white paper. Confident graphite outlines with soft coloured-pencil shading and visible pencil strokes, warm and lively, in a limited palette of ochre, honey yellow, teal, sage green and warm brown. Hand-drawn, simple and clear, one centered subject with a wide empty margin. No red, no text, no letters, no numbers, no people, no faces, no flags, no logos."
model = "gemini-2.5-flash-image"

