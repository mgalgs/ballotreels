[project]
name = "ballotreels"
version = "0.1.0"
description = "Even-handed explainer videos for everything on your ballot."
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ballotreels", "ballotreels.adapters", "ballotreels.geo",
           "ballotreels.site"]

[tool.setuptools.package-data]
"ballotreels.site" = ["static/*"]
